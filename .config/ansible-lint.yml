---
exclude_paths:
  - .git/
  - .github/
  - docs/
  - .ansible-lint.yml
  - .readthedocs.yaml
  - .github/workflows/
  - .github/workflows/ansible-lint.yml
  - src/build_stream/app/playbook_paths.yaml

skip_list:
  - var-naming
  - unresolved-module
  - fqcn[canonical]
  - internal-error
  - role-name[path]
  - galaxy[no-changelog]

verbosity: 1
profile: production
