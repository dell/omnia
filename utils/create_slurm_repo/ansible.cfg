[defaults]
log_path = /omnia/utils/create_slurm_repo/create_repo.log
host_key_checking = false
forks = 5
timeout = 180
executable = /bin/bash

[persistent_connection]
command_timeout = 180
connect_timeout = 180

[ssh_connection]
retries = 3
ssh_args = -o ControlMaster=auto -o ControlPersist=60 -o ConnectTimeout=60
