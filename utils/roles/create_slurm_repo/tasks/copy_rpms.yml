---
- name: Remove existing destination directory if present
  ansible.builtin.file:
    path: "{{ dest_repo_path }}"
    state: absent

- name: Create destination directory
  ansible.builtin.file:
    path: "{{ dest_repo_path }}"
    state: directory
    owner: apache
    group: apache
    mode: "{{ repo_dir_mode }}"

- name: Copy RPMs from source to destination
  ansible.builtin.copy:
    src: "{{ source_rpm_path }}/"
    dest: "{{ dest_repo_path }}/"
    owner: apache
    group: apache
    mode: '0644'
    remote_src: false

- name: Install createrepo if not installed
  ansible.builtin.dnf:
    name: createrepo
    state: present

- name: Create repo metadata
  ansible.builtin.command: createrepo --update "{{ dest_repo_path }}"
  args:
    creates: "{{ dest_repo_path }}/repodata"

- name: Display success message
  ansible.builtin.debug:
    msg: "Slurm RPM repository successfully created and accessible at {{ repo_url }}"
