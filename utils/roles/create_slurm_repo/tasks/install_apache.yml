---
- name: Ensure Apache (httpd) is installed
  ansible.builtin.dnf:
    name: httpd
    state: present

- name: Enable and start Apache service
  ansible.builtin.service:
    name: httpd
    state: started
    enabled: true

- name: Allow HTTP service in the firewall
  ansible.posix.firewalld:
    service: http
    permanent: true
    state: enabled
    immediate: true

- name: Confirm Apache is listening on port 80
  ansible.builtin.wait_for:
    port: "{{ apache_config.port | int }}"
    state: started
    timeout: 10
  changed_when: false

- name: Ensure Apache is installed and running
  ansible.builtin.dnf:
    name: httpd
    state: present

- name: Ensure /var/www/html exists
  ansible.builtin.file:
    path: "{{ html_repo_path }}"
    state: directory
    owner: apache
    group: apache
    mode: "{{ repo_dir_mode }}"

- name: Restore SELinux context on /var/www/html (if enabled)
  ansible.builtin.command: restorecon -Rv {{ html_repo_path }}
  when: ansible_selinux is defined and ansible_selinux.status == "enabled"
  changed_when: false

- name: Display success message
  ansible.builtin.debug:
    msg: "Apache successfully installed and serving"
