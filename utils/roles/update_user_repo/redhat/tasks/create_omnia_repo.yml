---

- name: Find matching pulp distributions for {{ repo_final_name }}
  ansible.builtin.set_fact:
    matching_baseurls: >-
      {{ pulp_dist_result
           | selectattr('name', 'search', repo_final_name)
           | map(attribute='base_url')
           | list }}

- name: Fail if no baseurl found for {{ repo_final_name }}
  ansible.builtin.fail:
    msg: "{{ omnia_repo_baseurl_fail_msg }}"
  when: matching_baseurls | length == 0

- name: Configure omnia repository {{ repo_final_name }}
  ansible.builtin.template:
    src: "{{ omnia_repo_config_template_src }}"
    dest: "{{ repo_path }}/{{ repo_final_name }}.repo"
    mode: "{{ file_permission }}"
  vars:
    baseurls: "{{ matching_baseurls }}"
    repo_name: "{{ repo_final_name }}"
