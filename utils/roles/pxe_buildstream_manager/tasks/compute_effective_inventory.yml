---
- name: Ensure job-specific restart_state directory exists
  ansible.builtin.file:
    path: "{{ restart_state_dir }}/{{ job_id }}"
    state: directory
    mode: "0755"

- name: Read PXE mapping file for diffing
  ansible.builtin.read_csv:
    path: "{{ input_dir }}/pxe_mapping_file.csv"
  register: pxe_csv_data

- name: Build current inventory from CSV
  ansible.builtin.set_fact:
    current_inventory: "{{ pxe_csv_data.list }}"
    current_bmc_ips: "{{ pxe_csv_data.list | map(attribute='BMC_IP') | list }}"

- name: Check if restart_state.json exists for this job_id
  ansible.builtin.stat:
    path: "{{ restart_state_dir }}/{{ job_id }}/restart_state.json"
  register: state_file_stat

- name: Load restart state
  when: state_file_stat.stat.exists
  block:
    - name: Read restart state file for this job_id
      ansible.builtin.slurp:
        src: "{{ restart_state_dir }}/{{ job_id }}/restart_state.json"
      register: state_raw
    - name: Parse restart state
      ansible.builtin.set_fact:
        restart_state: "{{ state_raw.content | b64decode | from_json }}"
        previous_bmc_ips: "{{ (state_raw.content | b64decode | from_json).previous_inventory.nodes | map(attribute='bmc_ip') | list }}"
        booted_bmc_ips: "{{ (state_raw.content | b64decode | from_json).booted_nodes | default([]) | map(attribute='bmc_ip') | list }}"

- name: Default previous IPs to empty if first run for this job_id
  ansible.builtin.set_fact:
    previous_bmc_ips: []
    booted_bmc_ips: []
    restart_state: {}
  when: not state_file_stat.stat.exists

- name: Compute diff nodes (newly added BMC IPs)
  ansible.builtin.set_fact:
    diff_bmc_ips: "{{ current_bmc_ips | difference(booted_bmc_ips) }}"

- name: Check if failed_nodes.json was uploaded from GitLab for this job_id
  ansible.builtin.stat:
    path: "{{ restart_state_dir }}/{{ job_id }}/failed_nodes.json"
  register: failed_nodes_stat

- name: Load failed nodes from GitLab
  when: failed_nodes_stat.stat.exists
  block:
    - name: Read failed nodes file for this job_id
      ansible.builtin.slurp:
        src: "{{ restart_state_dir }}/{{ job_id }}/failed_nodes.json"
      register: failed_raw
    - name: Parse all failed nodes from file
      ansible.builtin.set_fact:
        all_failed_nodes: "{{ (failed_raw.content | b64decode | from_json).failed_nodes | default([]) }}"
    - name: Extract only nodes still with status 'failed' for retry
      ansible.builtin.set_fact:
        gitlab_failed_ips: "{{ all_failed_nodes | selectattr('status', 'equalto', 'failed') | map(attribute='bmc_ip') | list }}"
    - name: Extract nodes user marked as 'success' (manually booted)
      ansible.builtin.set_fact:
        manually_booted_nodes: "{{ all_failed_nodes | selectattr('status', 'equalto', 'success') | list }}"
        manually_booted_ips: "{{ all_failed_nodes | selectattr('status', 'equalto', 'success') | map(attribute='bmc_ip') | list }}"

- name: Default failed IPs and manually booted to empty
  ansible.builtin.set_fact:
    gitlab_failed_ips: []
    manually_booted_nodes: []
    manually_booted_ips: []
  when: not failed_nodes_stat.stat.exists

- name: Add manually booted nodes to booted list and update restart_state.json
  when: manually_booted_ips | length > 0
  block:
    - name: Log manually booted nodes detected
      ansible.builtin.debug:
        msg: "[BSM] Detected {{ manually_booted_ips | length }} manually booted nodes (status=success): {{ manually_booted_ips }}"

    - name: Merge manually booted IPs into booted_bmc_ips
      ansible.builtin.set_fact:
        booted_bmc_ips: "{{ (booted_bmc_ips + manually_booted_ips) | unique }}"

    - name: Build manually booted entries for restart_state.json
      ansible.builtin.set_fact:
        new_manual_booted_entries: >-
          {{ new_manual_booted_entries | default([]) + [{
            'bmc_ip': item.bmc_ip,
            'hostname': item.hostname | default(''),
            'booted_at': ansible_date_time.iso8601,
            'manually_booted': true
          }] }}
      loop: "{{ manually_booted_nodes }}"
      when: item.bmc_ip not in (existing_booted_ips | default([]))
      vars:
        existing_booted_ips: "{{ (restart_state | default({})).get('booted_nodes', []) | map(attribute='bmc_ip') | list }}"

    - name: Merge manual entries into restart_state and write
      ansible.builtin.copy:
        content: "{{ updated_state | to_nice_json }}"
        dest: "{{ restart_state_dir }}/{{ job_id }}/restart_state.json"
        mode: "0644"
      vars:
        existing_booted: "{{ (restart_state | default({})).get('booted_nodes', []) }}"
        updated_state:
          updated_at: "{{ ansible_date_time.iso8601 }}"
          previous_inventory: "{{ (restart_state | default({})).get('previous_inventory', {'source': 'pxe_mapping_file.csv', 'nodes': []}) }}"
          booted_nodes: "{{ existing_booted + (new_manual_booted_entries | default([])) }}"
      when: new_manual_booted_entries | default([]) | length > 0

- name: Compute effective BMC IPs (diff + failed retry - already booted, deduplicated, only nodes in current inventory)
  ansible.builtin.set_fact:
    effective_bmc_ips: "{{ ((diff_bmc_ips + gitlab_failed_ips) | unique | intersect(current_bmc_ips)) | difference(booted_bmc_ips) }}"

- name: Report effective inventory
  ansible.builtin.debug:
    msg: "{{ bsm_inventory_report_msg }}"

- name: Mark hosts for PXE boot based on effective inventory
  block:
    - name: Mark all bmc hosts to skip by default
      ansible.builtin.set_fact:
        bsm_skip_this_host: true
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: "{{ groups['bmc'] | default([]) }}"

    - name: Mark only effective hosts to NOT skip
      ansible.builtin.set_fact:
        bsm_skip_this_host: false
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: "{{ effective_bmc_ips }}"
      when: effective_bmc_ips | length > 0

- name: Store CSV node metadata for reporting
  ansible.builtin.set_fact:
    pxe_csv_node_map: "{{ dict(pxe_csv_data.list | map(attribute='BMC_IP') | zip(pxe_csv_data.list)) }}"

- name: Skip PXE boot when effective inventory is empty
  ansible.builtin.debug:
    msg: "{{ bsm_empty_inventory_msg }}"
  when: effective_bmc_ips | length == 0

- name: Set skip flag for empty inventory
  ansible.builtin.set_fact:
    bsm_skip_pxe: "{{ effective_bmc_ips | length == 0 }}"
