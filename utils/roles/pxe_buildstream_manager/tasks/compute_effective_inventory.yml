---
# SINGLE SOURCE OF TRUTH: GitLab failed_nodes.json
# This task normalizes state from GitLab JSON and rebuilds all internal state from scratch.
# No previous state is merged - GitLab JSON is the only truth.
- name: Ensure job-specific restart_state directory exists
  ansible.builtin.file:
    path: "{{ restart_state_dir }}/{{ job_id }}"
    state: directory
    mode: "0755"

- name: Read PXE mapping file for current inventory
  ansible.builtin.read_csv:
    path: "{{ input_dir }}/pxe_mapping_file.csv"
  register: pxe_csv_data

- name: Build current inventory from CSV
  ansible.builtin.set_fact:
    current_inventory: "{{ pxe_csv_data.list }}"
    current_bmc_ips: "{{ pxe_csv_data.list | map(attribute='BMC_IP') | list }}"

- name: Check if failed_nodes.json exists (uploaded from GitLab via upload API)
  ansible.builtin.stat:
    path: "{{ restart_state_dir }}/{{ job_id }}/failed_nodes.json"
  register: failed_nodes_stat

- name: Normalize state from GitLab failed_nodes.json (single source of truth)
  when: failed_nodes_stat.stat.exists
  block:
    - name: Read failed nodes file
      ansible.builtin.slurp:
        src: "{{ restart_state_dir }}/{{ job_id }}/failed_nodes.json"
      register: failed_raw

    - name: Parse failed nodes JSON
      ansible.builtin.set_fact:
        gitlab_nodes: "{{ (failed_raw.content | b64decode | from_json).failed_nodes | default([]) }}"

    - name: Normalize - Extract nodes with status='failed' (eligible for retry)
      ansible.builtin.set_fact:
        retry_nodes: "{{ gitlab_nodes | selectattr('status', 'equalto', 'failed') | list }}"
        retry_ips: "{{ gitlab_nodes | selectattr('status', 'equalto', 'failed') | map(attribute='bmc_ip') | list }}"

    - name: Normalize - Extract nodes with status='success' (manually booted)
      ansible.builtin.set_fact:
        manually_booted_nodes: "{{ gitlab_nodes | selectattr('status', 'equalto', 'success') | list }}"
        manually_booted_ips: "{{ gitlab_nodes | selectattr('status', 'equalto', 'success') | map(attribute='bmc_ip') | list }}"

    - name: Log normalization results
      ansible.builtin.debug:
        msg: "[BSM] Normalized from GitLab: {{ retry_ips | length }} retry nodes (status=failed), {{ manually_booted_ips | length }} booted nodes (status=success)"

- name: Default to empty lists if no failed_nodes.json (first run)
  when: not failed_nodes_stat.stat.exists
  ansible.builtin.set_fact:
    retry_nodes: []
    retry_ips: []
    manually_booted_nodes: []
    manually_booted_ips: []

- name: Load existing restart_state.json to get previously booted nodes (not from GitLab)
  ansible.builtin.stat:
    path: "{{ restart_state_dir }}/{{ job_id }}/restart_state.json"
  register: state_file_stat

- name: Get previously booted nodes from restart_state.json
  when: state_file_stat.stat.exists
  block:
    - name: Read restart state file
      ansible.builtin.slurp:
        src: "{{ restart_state_dir }}/{{ job_id }}/restart_state.json"
      register: state_raw
    - name: Extract previously booted IPs
      ansible.builtin.set_fact:
        previously_booted_ips: "{{ (state_raw.content | b64decode | from_json).booted_nodes | default([]) | map(attribute='bmc_ip') | list }}"

- name: Default previously booted IPs to empty if first run
  when: not state_file_stat.stat.exists
  ansible.builtin.set_fact:
    previously_booted_ips: []

- name: Merge manually booteds + previously booteds into total booted list
  ansible.builtin.set_fact:
    total_booted_ips: "{{ (manually_booted_ips + previously_booted_ips) | unique }}"

- name: Update restart_state.json with manually booted nodes from GitLab
  when: manually_booted_nodes | length > 0
  block:
    - name: Build new booted entries for GitLab manual booteds
      ansible.builtin.set_fact:
        new_booted_entries: >-
          {{ new_booted_entries | default([]) + [{
            'bmc_ip': item.bmc_ip,
            'hostname': item.hostname | default(''),
            'booted_at': ansible_date_time.iso8601,
            'manually_booted': true
          }] }}
      loop: "{{ manually_booted_nodes }}"
      when: item.bmc_ip not in previously_booted_ips

    - name: Read existing restart_state.json
      ansible.builtin.slurp:
        src: "{{ restart_state_dir }}/{{ job_id }}/restart_state.json"
      register: existing_state_raw
      when: state_file_stat.stat.exists

    - name: Merge new booteds into restart_state.json and write
      ansible.builtin.copy:
        content: "{{ updated_state | to_nice_json }}"
        dest: "{{ restart_state_dir }}/{{ job_id }}/restart_state.json"
        mode: "0644"
      vars:
        existing_state: "{{ existing_state_raw.content | b64decode | from_json if state_file_stat.stat.exists else {} }}"
        existing_booted: "{{ existing_state.get('booted_nodes', []) }}"
        updated_state:
          updated_at: "{{ ansible_date_time.iso8601 }}"
          previous_inventory: "{{ existing_state.get('previous_inventory', {'source': 'pxe_mapping_file.csv', 'nodes': []}) }}"
          booted_nodes: "{{ existing_booted + (new_booted_entries | default([])) }}"
      when: new_booted_entries | default([]) | length > 0

- name: Compute effective BMC IPs (retry nodes - total booted, only in current inventory)
  ansible.builtin.set_fact:
    effective_bmc_ips: "{{ (retry_ips | intersect(current_bmc_ips)) | difference(total_booted_ips) }}"

- name: Report effective inventory
  ansible.builtin.debug:
    msg: "{{ bsm_inventory_report_msg }}"

- name: Mark hosts for PXE boot based on effective inventory
  block:
    - name: Mark all bmc hosts to skip by default
      ansible.builtin.set_fact:
        bsm_skip_this_host: true
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: "{{ groups['bmc'] | default([]) }}"

    - name: Mark only effective hosts to NOT skip
      ansible.builtin.set_fact:
        bsm_skip_this_host: false
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: "{{ effective_bmc_ips }}"
      when: effective_bmc_ips | length > 0

- name: Store CSV node metadata for reporting
  ansible.builtin.set_fact:
    pxe_csv_node_map: "{{ dict(pxe_csv_data.list | map(attribute='BMC_IP') | zip(pxe_csv_data.list)) }}"

- name: Skip PXE boot when effective inventory is empty
  ansible.builtin.debug:
    msg: "{{ bsm_empty_inventory_msg }}"
  when: effective_bmc_ips | length == 0

- name: Set skip flag for empty inventory
  ansible.builtin.set_fact:
    bsm_skip_pxe: "{{ effective_bmc_ips | length == 0 }}"
