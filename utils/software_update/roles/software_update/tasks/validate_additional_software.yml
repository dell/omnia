---

- name: Include variable file additional_software.json
  ansible.builtin.include_vars: "{{ additional_software_file }}"

- name: Initialize softwares_list_status and package_list_status
  ansible.builtin.set_fact:
    softwares_list_status: false
    package_list_status: false

- name: Load additional_software.json as a variable
  ansible.builtin.set_fact:
    additional_software_obj: "{{ lookup('file', additional_software_file) | from_json }}"

- name: Set softwares_list to top-level keys from additional_software.json
  ansible.builtin.set_fact:
    softwares_list: "{{ additional_software_obj.keys() | list }}"

- name: Set softwares_list_status
  ansible.builtin.set_fact:
    softwares_list_status: true
  when:
    - softwares_list is defined
    - softwares_list | type_debug == 'list'
    - softwares_list | length > 0

- name: Set package_list to all packages and package_list items under cluster
  ansible.builtin.set_fact:
    package_list: >-
      {{
        softwares_list
        | map('extract', additional_software_obj)
        | map(attribute='cluster')
        | flatten
        | map(attribute='package')
        | select('defined')
        | list
        +
        (
          softwares_list
          | map('extract', additional_software_obj)
          | map(attribute='cluster')
          | flatten
          | map(attribute='package_list')
          | select('defined')
          | map('flatten')
          | flatten
          | list
        )
      }}

- name: Set package_list_status
  ansible.builtin.set_fact:
    package_list_status: true
  when:
    - package_list is defined
    - package_list | type_debug == 'list'
    - package_list | length > 0

- name: Validate softwares_list and package_list
  ansible.builtin.fail:
    msg: "{{ empty_input_fail_msg }}"
  when:
    - not softwares_list_status
    - not package_list_status

- name: Validate reboot_required in all cluster entries
  ansible.builtin.assert:
    that:
      - item.reboot_required is not defined or (item.reboot_required | lower == 'true' or item.reboot_required | lower == 'false')
    fail_msg: "{{ reboot_required_fail_msg }}"
  loop: >-
    {{
      softwares_list
      | map('extract', additional_software_obj)
      | map(attribute='cluster')
      | flatten
    }}
  loop_control:
    label: "{{ item }}"
