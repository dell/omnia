# ─────────────────────────────────────────────────────────────────────────
# Generic OS Installation via iDRAC Virtual Media
#
# This playbook is designed to be called by architecture-specific
# orchestrators (e.g., install_os_arm_node.yml). It accepts parameters
# for ISO path, Kickstart configuration, and target node details.
#
# Required variables (set by the calling playbook or extra vars):
#   - iso_source_path:      path to the pre-placed source ISO
#   - target_bmc_ip:        BMC/iDRAC IP of the target node
#   - bmc_username:         iDRAC username
#   - bmc_password:         iDRAC password
#   - target_node_ip:       admin IP of the target node (for verification)
#   - iso_nfs_share:        NFS share path mapping to /opt/omnia
#   - ks_root_password_hash: SHA-512 hash of the root password
#   - ks_ssh_public_key:    SSH public key to inject
#   - ks_hostname:          hostname for the installed node
#   - ks_static_ip:         static IP for the installed node
#
# Optional variables:
#   - iso_source_checksum:  SHA-256 checksum for source ISO verification
#   - iso_target_directory: output directory for repacked ISO (default: /opt/omnia/iso_output)
#   - kickstart_file:       user-provided kickstart file path
#   - kickstart_template:   Jinja2 template name (default: rhel10)
#   - ks_install_disk:      target install disk (default: auto-detect)
#   - force_reinstall:      proceed even if target is reachable (default: false)
#   - silent_install:       suppress all interactive prompts (default: false)
#   - rebuild_iso:          force ISO rebuild when it exists (default: false)
# ─────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────
# Play 0: Load encrypted credentials (if provided)
# ─────────────────────────────────────────────────────────────────────────
- name: Load encrypted BMC credentials
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Include encrypted credentials file
      ansible.builtin.include_vars:
        file: "{{ encrypted_bmc_credentials_file }}"
      when:
        - encrypted_bmc_credentials_file is defined
        - encrypted_bmc_credentials_file | length > 0
      no_log: true

# ─────────────────────────────────────────────────────────────────────────
# Play 1: Validate required parameters
# ─────────────────────────────────────────────────────────────────────────
- name: Validate required OS installation parameters
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Build list of missing mandatory parameters
      ansible.builtin.set_fact:
        missing_params: >-
          {{ missing_params | default([]) + [item.name] }}
      when: item.value | length == 0
      loop:
        - { name: "Source ISO path", value: "{{ iso_source_path | default('') }}" }
        - { name: "Target BMC IP", value: "{{ target_bmc_ip | default('') }}" }
        - { name: "BMC username", value: "{{ bmc_username | default('') }}" }
        - { name: "BMC password", value: "{{ bmc_password | default('') }}" }
        - { name: "Target node admin IP", value: "{{ target_node_ip | default('') }}" }
        - { name: "NFS share for /opt/omnia", value: "{{ iso_nfs_share | default('') }}" }
        - { name: "Root password hash", value: "{{ ks_root_password_hash | default('') }}" }
        - { name: "SSH public key", value: "{{ ks_ssh_public_key | default('') }}" }
        - { name: "Target hostname", value: "{{ ks_hostname | default('') }}" }
        - { name: "Target static IP", value: "{{ ks_static_ip | default('') }}" }

    - name: Fail if mandatory parameters are missing
      ansible.builtin.fail:
        msg: >-
          Missing mandatory parameters: {{ missing_params | join(', ') }}.
          Provide them via extra-vars (e.g., -e "iso_source_path=/path/to.iso")
          or call this playbook through the appropriate orchestrator.
      when: missing_params | default([]) | length > 0

    - name: Confirm OS installation on target node
      ansible.builtin.pause:
        prompt: |-
          ==============================================================
              WARNING: ALL DATA ON THE TARGET NODE WILL BE ERASED
              AN OPERATING SYSTEM INSTALLATION WILL BE PERFORMED
          ==============================================================

          Target Hostname : {{ ks_hostname | default('unknown') }}
          Target Admin IP : {{ target_node_ip | default('unknown') }}
          Target BMC IP   : {{ target_bmc_ip | default('unknown') }}
          Install Disk    : {{ ks_install_disk | default('auto-detect') }}
          Source ISO      : {{ iso_source_path | default('unknown') }}

          ==============================================================
          Press ENTER to continue, or Ctrl+C then 'A' to abort.
          ==============================================================
      when: not (silent_install | default(false) | bool)

# ─────────────────────────────────────────────────────────────────────────
# Play 2: Validate ISO source and required tooling
# ─────────────────────────────────────────────────────────────────────────
- name: Validate ISO source and required tooling
  hosts: localhost
  connection: local
  gather_facts: true
  roles:
    - role: fetch_iso

# ─────────────────────────────────────────────────────────────────────────
# Play 3: Create custom ISO with embedded Kickstart
# ─────────────────────────────────────────────────────────────────────────
- name: Create custom ISO with embedded Kickstart
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: iso_creation

# ─────────────────────────────────────────────────────────────────────────
# Play 4: Deliver ISO via iDRAC virtual media and boot target node
# ─────────────────────────────────────────────────────────────────────────
- name: Deliver ISO via iDRAC virtual media
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: iso_delivery
