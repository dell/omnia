# ─────────────────────────────────────────────────────────────────────────
# Generic OS Installation via iDRAC Virtual Media
#
# This playbook is designed to be called by architecture-specific
# orchestrators (e.g., install_os_arm_node.yml). It accepts parameters
# for ISO path, Kickstart configuration, and target node details.
#
# Credential Handling:
#   Option 1: Encrypted credentials file (recommended for automation)
#     - encrypted_credentials_file: path to ansible-vault encrypted YAML file
#       containing credentials (bmc_username, bmc_password, os_root_password)
#     - vault_password_file: path to vault password file for decryption
#     - Example: -e "encrypted_credentials_file=/opt/omnia/input/project_default/os_install_credentials.yml"
#                -e "vault_password_file=/opt/omnia/input/project_default/.os_install_credentials_key"
#     - Note: ARM orchestrator passes credentials as facts, no file decryption needed
#
#   Option 2: Direct extra-vars (less secure, visible in process list)
#     - bmc_username: iDRAC username
#     - bmc_password: iDRAC password
#     - os_root_password: root password for the installed OS
#
#   Option 3: Interactive prompts (when silent_install=false)
#     - If credentials not provided, playbook will prompt for them
#     - os_root_password will be hashed internally to ks_root_password_hash
#
# Required variables (set by the calling playbook or extra vars):
#   - iso_source_path:      path to the pre-placed source ISO
#   - target_bmc_ip:        BMC/iDRAC IP of the target node
#   - target_node_ip:       admin IP of the target node (for verification)
#   - iso_nfs_share:        NFS share path mapping to /opt/omnia
#   - os_root_password:   root password for installed OS (will be hashed internally)
#   - ks_ssh_public_key:    SSH public key to inject
#   - ks_hostname:          hostname for the installed node
#   - ks_static_ip:         static IP for the installed node
#
# Optional variables:
#   - iso_source_checksum:  SHA-256 checksum for source ISO verification
#   - iso_target_directory: output directory for repacked ISO (default: /opt/omnia/iso_output)
#   - kickstart_file:       user-provided kickstart file path
#   - kickstart_template:   Jinja2 template name (default: rhel10)
#   - ks_install_disk:      target install disk (default: auto-detect)
#   - force_reinstall:      proceed even if target is reachable (default: false)
#   - silent_install:       suppress all interactive prompts (default: false)
#   - rebuild_iso:          force ISO rebuild when it exists (default: false)
# ─────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────
# Play 0: Load or prompt for BMC credentials
# ─────────────────────────────────────────────────────────────────────────
- name: Load or prompt for BMC credentials
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Check if encrypted credentials file is provided
      ansible.builtin.stat:
        path: "{{ encrypted_credentials_file }}"
      register: creds_file_stat
      when:
        - encrypted_credentials_file is defined
        - encrypted_credentials_file | length > 0
        - bmc_username is not defined or bmc_password is not defined or os_root_password is not defined

    - name: Decrypt and include encrypted credentials file
      block:
        - name: Create temporary directory for decryption
          ansible.builtin.tempfile:
            state: directory
            prefix: "os_install_decrypt_"
          register: temp_decrypt_dir

        - name: Decrypt credentials file to temporary location
          ansible.builtin.command:
            cmd: >-
              ansible-vault decrypt
              {{ encrypted_credentials_file }}
              --output {{ temp_decrypt_dir.path }}/decrypted_creds.yml
              --vault-password-file {{ vault_password_file }}
          no_log: true
          changed_when: false

        - name: Include decrypted credentials
          ansible.builtin.include_vars:
            file: "{{ temp_decrypt_dir.path }}/decrypted_creds.yml"
          no_log: true

        - name: Remove temporary decrypted file
          ansible.builtin.file:
            path: "{{ temp_decrypt_dir.path }}"
            state: absent
          no_log: true
      when:
        - encrypted_credentials_file is defined
        - encrypted_credentials_file | length > 0
        - creds_file_stat.stat.exists | default(false)
        - vault_password_file is defined
        - vault_password_file | length > 0
        - bmc_username is not defined or bmc_password is not defined or os_root_password is not defined

    - name: Prompt for BMC username if not provided
      ansible.builtin.pause:
        prompt: "Enter BMC/iDRAC username"
      register: bmc_username_prompt
      when:
        - bmc_username is not defined or bmc_username | length == 0
        - not (silent_install | default(false) | bool)
      no_log: false

    - name: Set BMC username from prompt
      ansible.builtin.set_fact:
        bmc_username: "{{ bmc_username_prompt.user_input }}"
      when:
        - bmc_username_prompt is defined
        - bmc_username_prompt.user_input is defined
      no_log: true

    - name: Prompt for BMC password if not provided
      ansible.builtin.pause:
        prompt: "Enter BMC/iDRAC password"
        echo: false
      register: bmc_password_prompt
      when:
        - bmc_password is not defined or bmc_password | length == 0
        - not (silent_install | default(false) | bool)
      no_log: true

    - name: Set BMC password from prompt
      ansible.builtin.set_fact:
        bmc_password: "{{ bmc_password_prompt.user_input }}"
      when:
        - bmc_password_prompt is defined
        - bmc_password_prompt.user_input is defined
      no_log: true

    - name: Prompt for OS root password if not provided
      ansible.builtin.pause:
        prompt: "Enter root password for the installed OS"
        echo: false
      register: os_root_password_prompt
      when:
        - os_root_password is not defined or os_root_password | length == 0
        - not (silent_install | default(false) | bool)
      no_log: true

    - name: Set OS root password from prompt
      ansible.builtin.set_fact:
        os_root_password: "{{ os_root_password_prompt.user_input }}"
      when:
        - os_root_password_prompt is defined
        - os_root_password_prompt.user_input is defined
      no_log: true

    - name: Generate SHA-512 hash of OS root password
      ansible.builtin.set_fact:
        ks_root_password_hash: "{{ os_root_password | password_hash('sha512') }}"
      when:
        - os_root_password is defined
        - os_root_password | length > 0
      no_log: true

# ─────────────────────────────────────────────────────────────────────────
# Play 1: Validate required parameters
# ─────────────────────────────────────────────────────────────────────────
- name: Validate required OS installation parameters
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Build list of missing mandatory parameters
      ansible.builtin.set_fact:
        missing_params: >-
          {{ missing_params | default([]) + [item.name] }}
      when: item.value | length == 0
      loop:
        - { name: "Source ISO path", value: "{{ iso_source_path | default('') }}" }
        - { name: "Target BMC IP", value: "{{ target_bmc_ip | default('') }}" }
        - { name: "BMC username", value: "{{ bmc_username | default('') }}" }
        - { name: "BMC password", value: "{{ bmc_password | default('') }}" }
        - { name: "Target node admin IP", value: "{{ target_node_ip | default('') }}" }
        - { name: "NFS share for /opt/omnia", value: "{{ iso_nfs_share | default('') }}" }
        - { name: "OS root password", value: "{{ os_root_password | default('') }}" }
        - { name: "SSH public key", value: "{{ ks_ssh_public_key | default('') }}" }
        - { name: "Target hostname", value: "{{ ks_hostname | default('') }}" }
        - { name: "Target static IP", value: "{{ ks_static_ip | default('') }}" }

    - name: Fail if mandatory parameters are missing
      ansible.builtin.fail:
        msg: >-
          Missing mandatory parameters: {{ missing_params | join(', ') }}.
          Provide them via extra-vars (e.g., -e "iso_source_path=/path/to.iso")
          or call this playbook through the appropriate orchestrator.
      when: missing_params | default([]) | length > 0

    - name: Confirm OS installation on target node
      ansible.builtin.pause:
        prompt: |-
          ==============================================================
              WARNING: ALL DATA ON THE TARGET NODE WILL BE ERASED
              AN OPERATING SYSTEM INSTALLATION WILL BE PERFORMED
          ==============================================================

          Target Hostname : {{ ks_hostname | default('unknown') }}
          Target Admin IP : {{ target_node_ip | default('unknown') }}
          Target BMC IP   : {{ target_bmc_ip | default('unknown') }}
          Install Disk    : {{ ks_install_disk | default('auto-detect') }}
          Source ISO      : {{ iso_source_path | default('unknown') }}
          Kickstart       : {{ kickstart_file if (kickstart_file | default('')) | length > 0 else (kickstart_template | default('rhel10') + ' template') }}

          ==============================================================
          Press ENTER to continue, or Ctrl+C then 'A' to abort.
          ==============================================================
      when: not (silent_install | default(false) | bool)

# ─────────────────────────────────────────────────────────────────────────
# Play 2: Validate ISO source and required tooling
# ─────────────────────────────────────────────────────────────────────────
- name: Validate ISO source and required tooling
  hosts: localhost
  connection: local
  gather_facts: true
  roles:
    - role: fetch_iso

# ─────────────────────────────────────────────────────────────────────────
# Play 3: Create custom ISO with Kickstart
# ─────────────────────────────────────────────────────────────────────────
- name: Create custom ISO with Kickstart
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: iso_creation

# ─────────────────────────────────────────────────────────────────────────
# Play 4: Deliver ISO via iDRAC virtual media and boot target node
# ─────────────────────────────────────────────────────────────────────────
- name: Deliver ISO via iDRAC virtual media
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: iso_delivery
