---

# Build custom ISO with embedded kickstart file
# This creates a self-contained ISO with kickstart embedded

- name: Render GRUB2 configuration with embedded kickstart reference
  ansible.builtin.template:
    src: grub_embedded.cfg.j2
    dest: "{{ temp_grub_cfg }}"
    mode: "0644"

- name: Remove existing custom ISO if rebuilding
  ansible.builtin.file:
    path: "{{ repacked_iso_path }}"
    state: absent
  when: rebuild_iso | bool

- name: Build custom ISO using xorriso (embed grub.cfg and kickstart)
  ansible.builtin.command: >-
    xorriso -indev {{ iso_source_path }}
            -outdev {{ repacked_iso_path }}
            -map {{ temp_grub_cfg }} /EFI/BOOT/grub.cfg
            -map {{ iso_target_directory }}/{{ nfs_kickstart_filename }} /{{ nfs_kickstart_filename }}
            -boot_image any replay
  changed_when: true
  register: iso_build_result

- name: Remove temporary grub.cfg
  ansible.builtin.file:
    path: "{{ temp_grub_cfg }}"
    state: absent

- name: Implant MD5 checksum into custom ISO
  ansible.builtin.command: "implantisomd5 {{ repacked_iso_path }}"
  changed_when: true
  failed_when: false

- name: Compute SHA-256 checksum of custom ISO
  ansible.builtin.stat:
    path: "{{ repacked_iso_path }}"
    checksum_algorithm: sha256
  register: custom_iso_stat_final

- name: Generate install manifest
  ansible.builtin.copy:
    content: |
      ---
      # Install OS Manifest
      # Generated by utils/install_os (Embedded kickstart approach)
      source_iso: "{{ iso_source_path }}"
      source_iso_checksum: "{{ iso_source_checksum | default('not provided') }}"
      custom_iso: "{{ repacked_iso_path }}"
      custom_iso_checksum: "{{ custom_iso_stat_final.stat.checksum }}"
      custom_iso_size: "{{ custom_iso_stat_final.stat.size }}"
      kickstart_location: "embedded:{{ nfs_kickstart_filename }}"
      kickstart_template: "{{ kickstart_template | default('user-provided') }}"
      build_method: "xorriso_streaming_embedded_kickstart"
      timestamp: "{{ ansible_date_time.iso8601 | default(lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ')) }}"
    dest: "{{ manifest_path }}"
    mode: "0644"

- name: Log ISO build success
  ansible.builtin.debug:
    msg: >-
      Custom ISO built successfully using xorriso streaming (embedded kickstart).
      Output: {{ repacked_iso_path }}
      (SHA-256: {{ custom_iso_stat_final.stat.checksum }}).
      Kickstart: embedded in ISO as {{ nfs_kickstart_filename }}.
      Manifest: {{ manifest_path }}
