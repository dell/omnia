---

- name: Mount source ISO for extraction
  ansible.posix.mount:
    path: "{{ iso_mount_point }}"
    src: "{{ iso_source_path }}"
    fstype: iso9660
    opts: ro,loop
    state: mounted

- name: Copy ISO contents to extract directory
  ansible.builtin.command: >-
    rsync -a --delete {{ iso_mount_point }}/ {{ iso_extract_dir }}/
  changed_when: true

- name: Unmount source ISO
  ansible.posix.mount:
    path: "{{ iso_mount_point }}"
    state: unmounted

- name: Process Kickstart file
  block:
    - name: Use user-provided Kickstart file
      ansible.builtin.include_tasks: inject_user_kickstart.yml
      when: kickstart_file | length > 0

    - name: Render default Kickstart template
      ansible.builtin.include_tasks: render_kickstart.yml
      when: kickstart_file | length == 0

- name: Repack ISO with embedded Kickstart
  ansible.builtin.include_tasks: repack_iso.yml
