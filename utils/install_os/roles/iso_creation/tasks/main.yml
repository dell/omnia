---

# Step 1: Check if custom ISO already exists (skip rebuild if yes)
- name: Check if custom ISO already exists
  ansible.builtin.stat:
    path: "{{ repacked_iso_path }}"
  register: custom_iso_stat

- name: Log ISO rebuild decision
  ansible.builtin.debug:
    msg: >-
      {% if custom_iso_stat.stat.exists %}
      Custom ISO already exists at {{ repacked_iso_path }}. Skipping rebuild.
      {% else %}
      Custom ISO not found. Building new ISO with NFS kickstart reference.
      {% endif %}

# Step 2: Render kickstart file to iso_output directory
- name: Render kickstart file
  block:
    - name: Render Kickstart from template
      ansible.builtin.template:
        src: "{{ kickstart_template }}.ks.j2"
        dest: "{{ iso_target_directory }}/{{ nfs_kickstart_filename }}"
        mode: "0644"
      when: kickstart_file | length == 0

    - name: Copy user-provided Kickstart
      ansible.builtin.copy:
        src: "{{ kickstart_file }}"
        dest: "{{ iso_target_directory }}/{{ nfs_kickstart_filename }}"
        mode: "0644"
      when: kickstart_file | length > 0

    - name: Log kickstart creation
      ansible.builtin.debug:
        msg: "Kickstart file created at {{ iso_target_directory }}/{{ nfs_kickstart_filename }}"

# Step 3: Build custom ISO (only if it doesn't exist)
- name: Build custom ISO with NFS kickstart reference
  ansible.builtin.include_tasks: build_nfs_iso.yml
  when: not custom_iso_stat.stat.exists
