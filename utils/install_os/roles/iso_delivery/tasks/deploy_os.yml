---

- name: Set NFS share path for custom ISO
  ansible.builtin.set_fact:
    nfs_iso_server: "{{ iso_nfs_share.split(':')[0] }}"
    nfs_iso_base_dir: "{{ iso_nfs_share.split(':')[1] | dirname }}"
    nfs_iso_filename: "{{ iso_source_path | basename | regex_replace('\\.iso$', '') }}-nfs-ks.iso"

- name: Set full NFS share directory for iDRAC
  ansible.builtin.set_fact:
    nfs_iso_share_dir: "{{ nfs_iso_server }}:{{ nfs_iso_base_dir }}/omnia/iso_output"

- name: Log deployment parameters
  ansible.builtin.debug:
    msg: >-
      Deploying OS via iDRAC. BMC: {{ target_bmc_ip }},
      NFS Share: {{ nfs_iso_share_dir }},
      ISO: {{ nfs_iso_filename }},
      Exposure: {{ expose_duration }} minutes

- name: Deploy OS via iDRAC OS Deployment Service (BootToNetworkISO)
  dellemc.openmanage.idrac_os_deployment:
    idrac_ip: "{{ target_bmc_ip }}"
    idrac_user: "{{ bmc_username }}"
    idrac_password: "{{ bmc_password }}"
    validate_certs: false
    share_name: "{{ nfs_iso_share_dir }}"
    iso_image: "{{ nfs_iso_filename }}"
    expose_duration: "{{ expose_duration }}"
  register: os_deployment_result
  failed_when: false

- name: Fail if OS deployment failed
  ansible.builtin.fail:
    msg: "{{ os_deployment_fail_msg }} Error: {{ os_deployment_result.msg | default('Unknown error') }}"
  when: os_deployment_result is failed

- name: Log OS deployment success
  ansible.builtin.debug:
    msg: >-
      OS deployment initiated successfully via iDRAC OS Deployment Service.
      BMC: {{ target_bmc_ip }},
      NFS Share: {{ nfs_iso_share_dir }}/{{ nfs_iso_filename }},
      Exposure Duration: {{ expose_duration }} minutes,
      Job Status: {{ os_deployment_result.boot_status.JobStatus | default('Unknown') }},
      Message: {{ os_deployment_result.boot_status.Message | default('') }}
