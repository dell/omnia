---

# ── Step 1: Compute NFS ISO path ────────────────────────────────────────
- name: Set NFS share path for custom ISO
  ansible.builtin.set_fact:
    nfs_iso_server: "{{ iso_nfs_share.split(':')[0] }}"
    nfs_iso_base_dir: "{{ iso_nfs_share.split(':')[1] }}"
    nfs_iso_filename: "{{ iso_source_path | basename | regex_replace('\\.iso$', '') }}-nfs-ks.iso"

- name: Set NFS share and ISO paths for idrac_os_deployment
  ansible.builtin.set_fact:
    nfs_iso_output_dir: "{{ nfs_iso_base_dir }}/{{ iso_target_directory | regex_replace('^/opt/omnia/?', '') }}"
    nfs_share_path: "{{ nfs_iso_server }}:{{ nfs_iso_base_dir }}/{{ iso_target_directory | regex_replace('^/opt/omnia/?', '') }}"
    nfs_iso_image: "{{ nfs_iso_filename }}"

# ── Step 2: Boot to Network ISO ─────────────────────────────────────────
- name: Mounting ISO and booting it
  ansible.builtin.debug:
    msg: >-
      Mounting ISO & booting it via iDRAC. BMC: {{ target_bmc_ip }},
      NFS Share: {{ nfs_share_path }},
      ISO Image: {{ nfs_iso_image }},
      Target IP: {{ target_node_ip }},
      Exposure: {{ expose_duration }} minutes

- name: Boot to Network ISO using idrac_os_deployment
  dellemc.openmanage.idrac_os_deployment:
    idrac_ip: "{{ target_bmc_ip }}"
    idrac_user: "{{ bmc_username }}"
    idrac_password: "{{ bmc_password }}"
    validate_certs: false
    share_name: "{{ nfs_share_path }}"
    iso_image: "{{ nfs_iso_image }}"
    expose_duration: "{{ expose_duration }}"
  register: boot_status
  no_log: true

- name: Check idrac_os_deployment result
  block:
    - name: Evaluate boot success status
      ansible.builtin.set_fact:
        boot_success: >-
          {% if 'boot_status' in boot_status and boot_status.boot_status is mapping %}
          {{ boot_status.boot_status.Status | default('') == 'Success' or boot_status.boot_status.JobStatus | default('') == 'Success' }}
          {% else %}
          {{ not boot_status.failed | default(true) }}
          {% endif %}

    - name: Display boot operation result
      ansible.builtin.debug:
        msg: >-
          Boot operation result:
          - Changed: {{ boot_status.changed | default('N/A') }}
          - Failed: {{ boot_status.failed | default('N/A') }}
          - Success: {{ 'Success' if boot_success else 'Failed' }}
          - Available keys: {{ boot_status.keys() | list | join(', ') }}
          {% if 'msg' in boot_status %}
          - Message type: {{ boot_status.msg | type_debug }}
          - Message content: {{ boot_status.msg }}
          {% endif %}
          {% if 'boot_status' in boot_status %}
          - Boot status type: {{ boot_status.boot_status | type_debug }}
          - Boot status content: {{ boot_status.boot_status | to_nice_json }}
          {% endif %}

- name: Fail if boot operation failed
  ansible.builtin.fail:
    msg: "{{ boot_operation_fail_msg }}"
  vars:
    boot_status_details: >-
      {{ boot_status.boot_status.Status | default(boot_status.boot_status.Message | default('Unknown error')) }}
  when: not boot_success | default(false)

# ── Step 3: Wait for OS installation to complete ────────────────────────
- name: Wait for target node to become offline (reboot in progress)
  ansible.builtin.wait_for:
    host: "{{ target_node_ip }}"
    port: 22
    state: stopped
    timeout: 300
  when: target_node_ip is defined and target_node_ip | length > 0
  failed_when: false

- name: Get iDRAC current time for accurate timestamp filtering
  ansible.builtin.uri:
    url: "https://{{ target_bmc_ip }}/redfish/v1/Managers/iDRAC.Embedded.1"
    method: GET
    user: "{{ bmc_username }}"
    password: "{{ bmc_password }}"
    force_basic_auth: true
    validate_certs: false
    return_content: true
  register: idrac_time
  failed_when: false

- name: Extract iDRAC time
  ansible.builtin.set_fact:
    idrac_current_time: "{{ idrac_time.json.DateTime | default('') }}"

- name: Record installation start time
  ansible.builtin.set_fact:
    install_start_time_iso: "{{ idrac_current_time if idrac_current_time != '' else ansible_date_time.iso8601 }}"

- name: Poll iDRAC System Event Log for OS installation progress
  ansible.builtin.uri:
    url: "https://{{ target_bmc_ip }}/redfish/v1/Managers/iDRAC.Embedded.1/LogServices/Sel/Entries"
    method: GET
    user: "{{ bmc_username }}"
    password: "{{ bmc_password }}"
    force_basic_auth: true
    validate_certs: false
    return_content: true
  register: idrac_sel_logs
  until: >
    idrac_sel_logs.json.Members | default([])
    | selectattr('Created', 'defined')
    | selectattr('Created', 'ge', install_start_time_iso)
    | selectattr('Message', 'search', 'installing')
    | selectattr('Message', 'search', 'started')
    | list | length > 0
  retries: 20
  delay: 15
  failed_when: false
  no_log: true

- name: OS installation in progress
  ansible.builtin.debug:
    msg: >-
      Target node is offline. OS installation in progress via iDRAC virtual media.
      Monitoring iDRAC System Event Log for completion...

- name: Wait for OS installation to complete (monitor iDRAC SEL and SSH)
  block:
    - name: Poll iDRAC SEL for installation completion (with timestamp filtering)
      ansible.builtin.uri:
        url: "https://{{ target_bmc_ip }}/redfish/v1/Managers/iDRAC.Embedded.1/LogServices/Sel/Entries"
        method: GET
        user: "{{ bmc_username }}"
        password: "{{ bmc_password }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
      register: idrac_sel_completion
      until: >
        idrac_sel_completion.json.Members | default([])
        | selectattr('Created', 'defined')
        | selectattr('Created', 'ge', install_start_time_iso)
        | selectattr('Message', 'search', 'installing')
        | selectattr('Message', 'search', 'successfully completed')
        | list | length > 0
        or
        idrac_sel_completion.json.Members | default([])
        | selectattr('Created', 'defined')
        | selectattr('Created', 'ge', install_start_time_iso)
        | selectattr('Message', 'search', 'installing')
        | selectattr('Message', 'search', 'abruptly stopped|failed')
        | list | length > 0
      retries: 120
      delay: 30
      failed_when: false
      no_log: true

    - name: Check for installation errors in iDRAC SEL
      ansible.builtin.set_fact:
        install_error_detected: >-
          {{ idrac_sel_completion.json.Members | default([])
             | selectattr('Created', 'defined')
             | selectattr('Created', 'ge', install_start_time_iso)
             | selectattr('Message', 'search', 'installing')
             | selectattr('Message', 'search', 'abruptly stopped|failed|error')
             | list | length > 0 }}

    - name: Log warning if installation errors detected in iDRAC SEL
      ansible.builtin.debug:
        msg: "{{ sel_error_warning_msg }}"
      when: install_error_detected | bool

    - name: Wait for target node SSH to become available
      ansible.builtin.wait_for:
        host: "{{ target_node_ip }}"
        port: 22
        state: started
        delay: 30
        timeout: 600
      register: ssh_wait
      when: target_node_ip is defined and target_node_ip | length > 0

  rescue:
    - name: Fail if SSH wait failed
      ansible.builtin.fail:
        msg: "{{ ssh_wait_fail_msg }}"

# ── Step 4: Verify installed OS and passwordless SSH ────────────────────
- name: Verify passwordless SSH access with injected key
  ansible.builtin.command:
    cmd: >-
      ssh -o StrictHostKeyChecking=no
      -o ConnectTimeout=10
      -o BatchMode=yes
      -o PasswordAuthentication=no
      root@{{ target_node_ip }}
      'hostname'
  register: ssh_key_verify
  changed_when: false
  failed_when: false
  when: target_node_ip is defined and target_node_ip | length > 0
  delegate_to: localhost

- name: Fail if passwordless SSH is not working
  ansible.builtin.fail:
    msg: "{{ passwordless_ssh_fail_msg }}"
  when:
    - target_node_ip is defined and target_node_ip | length > 0
    - ssh_key_verify.rc != 0

- name: Verify installed OS details
  ansible.builtin.command:
    cmd: >-
      ssh -o StrictHostKeyChecking=no
      -o ConnectTimeout=10
      -o BatchMode=yes
      root@{{ target_node_ip }}
      'hostname && cat /etc/redhat-release && cat /root/.ks-complete 2>/dev/null || echo "Kickstart marker not found"'
  register: os_verify
  changed_when: false
  failed_when: false
  when: target_node_ip is defined and target_node_ip | length > 0
  delegate_to: localhost

- name: Log OS installation result
  ansible.builtin.debug:
    msg: "{{ os_install_success_msg }}"
  when:
    - os_verify is defined
    - os_verify.rc == 0

