---

# ── Step 1: Compute NFS ISO path ────────────────────────────────────────
- name: Set NFS share path for custom ISO
  ansible.builtin.set_fact:
    nfs_iso_server: "{{ iso_nfs_share.split(':')[0] }}"
    nfs_iso_base_dir: "{{ iso_nfs_share.split(':')[1] }}"
    nfs_iso_filename: "{{ iso_source_path | basename | regex_replace('\\.iso$', '') }}-nfs-ks.iso"

- name: Set full NFS ISO URI for iDRAC virtual media
  ansible.builtin.set_fact:
    nfs_iso_output_dir: "{{ nfs_iso_base_dir }}/{{ iso_target_directory | regex_replace('^/opt/omnia/?', '') }}"
    nfs_iso_uri: "{{ nfs_iso_server }}:{{ nfs_iso_base_dir }}/{{ iso_target_directory | regex_replace('^/opt/omnia/?', '') }}/{{ nfs_iso_filename }}"
    nfs_iso_share_dir: "{{ nfs_iso_server }}:{{ nfs_iso_base_dir }}/{{ iso_target_directory | regex_replace('^/opt/omnia/?', '') }}"

- name: Log deployment parameters
  ansible.builtin.debug:
    msg: >-
      Deploying OS via iDRAC. BMC: {{ target_bmc_ip }},
      NFS ISO: {{ nfs_iso_uri }},
      Target IP: {{ target_node_ip }},
      Exposure: {{ expose_duration }} minutes

# ── Step 2: Eject any existing virtual media ────────────────────────────
- name: Eject existing virtual media if mounted
  dellemc.openmanage.idrac_virtual_media:
    idrac_ip: "{{ target_bmc_ip }}"
    idrac_user: "{{ bmc_username }}"
    idrac_password: "{{ bmc_password }}"
    validate_certs: false
    virtual_media:
      - insert: false
  changed_when: false
  failed_when: false
  no_log: true

# ── Step 3: Insert ISO as virtual media ─────────────────────────────────
- name: Mount ISO via iDRAC virtual media
  dellemc.openmanage.idrac_virtual_media:
    idrac_ip: "{{ target_bmc_ip }}"
    idrac_user: "{{ bmc_username }}"
    idrac_password: "{{ bmc_password }}"
    validate_certs: false
    force: true
    virtual_media:
      - insert: true
        image: "{{ nfs_iso_uri }}"
  register: insert_result
  no_log: true

# ── Step 4: Set one-time boot from CD and reboot ────────────────────────
- name: Set boot override to CD (one-time)
  dellemc.openmanage.idrac_boot:
    idrac_ip: "{{ target_bmc_ip }}"
    idrac_user: "{{ bmc_username }}"
    idrac_password: "{{ bmc_password }}"
    validate_certs: false
    boot_source_override_enabled: "once"
    boot_source_override_target: "cd"
  register: boot_override_result
  no_log: true

- name: Reboot server to boot from ISO
  dellemc.openmanage.redfish_powerstate:
    baseuri: "{{ target_bmc_ip }}"
    username: "{{ bmc_username }}"
    password: "{{ bmc_password }}"
    validate_certs: false
    reset_type: "ForceRestart"
  register: reboot_result
  no_log: true

- name: OS deployment initiated
  ansible.builtin.debug:
    msg: >-
      OS deployment initiated. Server is rebooting from virtual CD.
      BMC: {{ target_bmc_ip }}, ISO: {{ nfs_iso_uri }}.
      Waiting for installation to complete...

# ── Step 5: Wait for OS installation to complete ────────────────────────
- name: Wait for target node to become offline (reboot in progress)
  ansible.builtin.wait_for:
    host: "{{ target_node_ip }}"
    port: 22
    state: stopped
    timeout: 300
  when: target_node_ip is defined and target_node_ip | length > 0
  failed_when: false

- name: OS installation in progress
  ansible.builtin.debug:
    msg: "Target node is offline. OS installation in progress via iDRAC virtual media."
  when: target_node_ip is defined and target_node_ip | length > 0

- name: Wait for OS installation to complete (target node SSH up)
  ansible.builtin.wait_for:
    host: "{{ target_node_ip }}"
    port: 22
    state: started
    delay: 120
    timeout: "{{ (expose_duration | int * 60) | int }}"
  register: install_wait
  when: target_node_ip is defined and target_node_ip | length > 0

- name: Fail if OS installation timed out
  ansible.builtin.fail:
    msg: >-
      OS installation timed out. Target node {{ target_node_ip }} did not
      become reachable via SSH within {{ expose_duration }} minutes.
      Check the iDRAC virtual console for installation status.
  when:
    - target_node_ip is defined and target_node_ip | length > 0
    - install_wait is failed

# ── Step 6: Verify installed OS ─────────────────────────────────────────
- name: Verify SSH access to installed OS
  ansible.builtin.shell: |
    ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 root@{{ target_node_ip }} \
      'hostname && cat /etc/redhat-release && cat /root/.ks-complete 2>/dev/null'
  register: os_verify
  changed_when: false
  failed_when: false
  when: target_node_ip is defined and target_node_ip | length > 0

- name: Log OS installation result
  ansible.builtin.debug:
    msg: >-
      {% if os_verify is defined and os_verify.rc == 0 %}
      OS installation completed successfully!
      {{ os_verify.stdout_lines | join(', ') }}
      {% else %}
      OS deployment initiated. Target node may still be installing.
      Monitor via iDRAC virtual console.
      {% endif %}

# ── Step 7: Cleanup — eject virtual media ───────────────────────────────
- name: Eject virtual media after installation
  dellemc.openmanage.idrac_virtual_media:
    idrac_ip: "{{ target_bmc_ip }}"
    idrac_user: "{{ bmc_username }}"
    idrac_password: "{{ bmc_password }}"
    validate_certs: false
    virtual_media:
      - insert: false
  changed_when: true
  failed_when: false
  no_log: true
