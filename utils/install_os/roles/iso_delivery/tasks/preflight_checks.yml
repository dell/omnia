---

- name: Validate ISO NFS share path is provided
  ansible.builtin.fail:
    msg: "{{ no_iso_nfs_share_msg }}"
  when: iso_nfs_share | length == 0

- name: Check if target node is already reachable via SSH
  when: target_node_ip is defined and target_node_ip | length > 0
  block:
    - name: Test SSH connectivity to target node
      ansible.builtin.wait_for:
        host: "{{ target_node_ip }}"
        port: 22
        timeout: 10
        state: started
      register: target_ssh_check
      failed_when: false

    - name: Abort if target is reachable and force_reinstall is false
      ansible.builtin.fail:
        msg: "{{ target_already_reachable_msg }}"
      when:
        - target_ssh_check is success
        - not (force_reinstall | bool)

    - name: Warn that target is reachable but force_reinstall is true
      ansible.builtin.debug:
        msg: >-
          WARNING: Target node at '{{ target_node_ip }}' is reachable but
          force_reinstall is true. Proceeding with OS reinstallation.
      when:
        - target_ssh_check is success
        - force_reinstall | bool

- name: Verify iDRAC reachability using curl (workaround for Python urllib timeout)
  ansible.builtin.shell: |
    curl -k -u "{{ bmc_username }}:{{ bmc_password }}" -s -o /dev/null -w '%{http_code}' "https://{{ target_bmc_ip }}/redfish/v1/"
  register: idrac_curl_check
  changed_when: false
  failed_when: false
  no_log: true

- name: Fail if iDRAC is not reachable
  ansible.builtin.fail:
    msg: "{{ idrac_unreachable_msg }}"
  when: idrac_curl_check.stdout | trim != '200'

- name: Log iDRAC reachability success
  ansible.builtin.debug:
    msg: "iDRAC at {{ target_bmc_ip }} is reachable (HTTP {{ idrac_curl_check.stdout | trim }})"

- name: Check iDRAC LC status using curl
  ansible.builtin.shell: |
    curl -k -u "{{ bmc_username }}:{{ bmc_password }}" -s -X POST \
      -H "Content-Type: application/json" -H "Accept: application/json" \
      -d '{}' \
      "https://{{ target_bmc_ip }}/redfish/v1/Managers/iDRAC.Embedded.1/Oem/Dell/DellLCService/Actions/DellLCService.GetRemoteServicesAPIStatus"
  register: lc_status_curl
  changed_when: false
  failed_when: false
  no_log: true

- name: Log iDRAC pre-flight check success
  ansible.builtin.debug:
    msg: >-
      iDRAC pre-flight checks passed.
      BMC: {{ target_bmc_ip }},
      LC Status: {{ (lc_status_curl.stdout | from_json).LCStatus | default('unknown') }}
