---

- name: Verify source ISO exists
  ansible.builtin.stat:
    path: "{{ iso_source_path }}"
    get_checksum: false
  register: iso_source_stat

- name: Fail if source ISO not found
  ansible.builtin.fail:
    msg: "{{ iso_not_found_msg }}"
  when: not iso_source_stat.stat.exists

- name: Verify source ISO checksum (if provided)
  ansible.builtin.stat:
    path: "{{ iso_source_path }}"
    checksum_algorithm: sha256
  register: iso_source_checksum_stat
  when: iso_source_checksum | length > 0

- name: Fail if source ISO checksum mismatch
  ansible.builtin.fail:
    msg: "{{ iso_checksum_mismatch_msg }}"
  when:
    - iso_source_checksum | length > 0
    - iso_source_checksum_stat.stat.checksum != iso_source_checksum

- name: Log checksum verification status
  ansible.builtin.debug:
    msg: >-
      {% if iso_source_checksum | length > 0 %}
      ISO checksum verified successfully. Expected: {{ iso_source_checksum }}
      {% else %}
      Skipping ISO checksum verification (no checksum provided).
      {% endif %}

- name: Check required ISO tooling
  block:
    - name: Check for required tools
      ansible.builtin.command: "command -v {{ item.name }}"
      loop: "{{ required_iso_tools }}"
      register: tool_check_results
      changed_when: false
      failed_when: false

    - name: Build list of missing tools
      ansible.builtin.set_fact:
        missing_tools: >-
          {{ tool_check_results.results
             | selectattr('rc', 'ne', 0)
             | map(attribute='item')
             | list }}

    - name: Install missing ISO tools
      ansible.builtin.package:
        name: "{{ missing_tools | map(attribute='package') | list }}"
        state: present
      when: missing_tools | length > 0
      become: true

    - name: Verify tools after installation
      ansible.builtin.command: "command -v {{ item.name }}"
      loop: "{{ required_iso_tools }}"
      register: tool_verify_results
      changed_when: false
      failed_when: tool_verify_results.rc != 0
      when: missing_tools | length > 0

- name: Ensure ISO target directory exists
  ansible.builtin.file:
    path: "{{ iso_target_directory }}"
    state: directory
    mode: "0755"


- name: Log ISO validation success
  ansible.builtin.debug:
    msg: >-
      ISO validation passed. Source: {{ iso_source_path }}
      ({{ iso_source_stat.stat.size | human_readable }}).
      Output directory: {{ iso_target_directory }}
