---

# Default values
iso_source_path: "{{ iso_source_path | default('/opt/omnia/rhel_10.0_aarch64.iso') }}"
iso_target_directory: "{{ iso_target_directory | default('/opt/omnia/iso_output') }}"

# Required ISO tooling
required_iso_tools:
  - name: xorrisofs
    package: xorriso
  - name: isomd5sum
    package: isomd5sum

# ISO mount point for extraction
iso_mount_point: "/mnt/iso_source"
iso_extract_dir: "{{ iso_target_directory }}/iso_extract"

# Error messages
iso_not_found_msg: >-
  Source ISO not found at '{{ iso_source_path }}'.
  Please place the RHEL 10.x AArch64 Server with GUI ISO at the specified path
  and re-run the playbook.
iso_checksum_mismatch_msg: >-
  Source ISO checksum mismatch. Expected: {{ iso_source_checksum }}.
  The ISO file may be corrupted or incomplete. Please re-download the ISO and retry.
tool_missing_msg: >-
  Required ISO tooling is missing: {{ missing_tools | join(', ') }}.
  Install the missing packages and re-run the playbook.
iso_mount_fail_msg: >-
  Failed to mount the source ISO at '{{ iso_source_path }}'.
  The ISO file may be corrupted. Please verify the ISO and retry.
