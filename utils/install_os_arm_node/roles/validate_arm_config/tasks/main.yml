---

- name: Validate required iso_config fields
  ansible.builtin.fail:
    msg: "{{ item.msg }}"
  when: item.value | length == 0
  loop:
    - { value: "{{ iso_config.target_bmc_ip }}", msg: "'target_bmc_ip' is required in iso_config.yml" }
    - { value: "{{ iso_config.hostname }}", msg: "'hostname' is required in iso_config.yml" }
    - { value: "{{ iso_config.target_node_ip }}", msg: "'target_node_ip' is required in iso_config.yml" }

- name: Verify OIM SSH public key exists
  ansible.builtin.stat:
    path: "{{ oim_ssh_key_path }}"
  register: oim_ssh_key_stat

- name: Fail if OIM SSH key not found
  ansible.builtin.fail:
    msg: "{{ oim_ssh_key_not_found_msg }}"
  when: not oim_ssh_key_stat.stat.exists

- name: Verify provision_password is available
  ansible.builtin.fail:
    msg: "{{ provision_password_missing_msg }}"
  when: provision_password is not defined or provision_password | length == 0

- name: Log ARM config validation success
  ansible.builtin.debug:
    msg: "ARM configuration validation passed. BMC: {{ iso_config.target_bmc_ip }}, Node IP: {{ iso_config.target_node_ip }}"
