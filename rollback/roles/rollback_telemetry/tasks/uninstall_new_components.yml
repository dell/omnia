---
# ============================================================================
# Uninstall NEW Omnia 2.2 components that have NO 2.1 equivalent
# ============================================================================
# Steps:
#   1. Uninstall NEW 2.2 Helm releases (PowerScale/CSM Observability)
#   2. Delete NEW-only Custom Resources (VictoriaLogs CRs)
#   3. Delete NEW-only K8s Services/Endpoints (VAST, UFM)
#   4. Delete NEW-only Secrets (VAST, UFM credentials)
#   5. Clean NEW-only leftover resources (OTEL collector, copied secrets, PVCs)
# ============================================================================

# ── Step 1: Uninstall NEW 2.2 Helm releases ──
- name: "Step 1 — Check Helm release status for {{ item.name }}"
  ansible.builtin.shell: |
    helm status "{{ item.name }}" -n "{{ item.namespace }}" >/dev/null 2>&1 \
      && echo "installed" || echo "not_installed"
  register: helm_status_check
  changed_when: false
  failed_when: false
  loop: "{{ new_helm_releases }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: "{{ kube_vip }}"
  connection: ssh

- name: "Step 1 — Uninstall NEW Helm release {{ item.item.name }}"
  ansible.builtin.command:
    cmd: helm uninstall "{{ item.item.name }}" -n "{{ item.item.namespace }}" --timeout 5m
  loop: "{{ helm_status_check.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: "'installed' in item.stdout"
  changed_when: true
  failed_when: false
  register: helm_uninstall_result
  delegate_to: "{{ kube_vip }}"
  connection: ssh

- name: "Step 1 — Display Helm uninstall results"
  ansible.builtin.debug:
    msg: >-
      {{ item.item.item.name }}:
      {{ 'uninstalled' if 'installed' in item.item.stdout else 'not installed (skipped)' }}
  loop: "{{ helm_uninstall_result.results | default([]) }}"
  loop_control:
    label: "{{ item.item.item.name | default('unknown') }}"
  when: helm_uninstall_result.results is defined

# ── Step 2: Delete NEW-only Custom Resources (VictoriaLogs) ──
- name: "Step 2 — Check if CRD exists for {{ item }}"
  ansible.builtin.shell: |
    kubectl get crd "{{ item }}s.operator.victoriametrics.com" >/dev/null 2>&1 \
      && echo "exists" || echo "not_exists"
  register: crd_check
  changed_when: false
  failed_when: false
  loop: "{{ new_custom_resources }}"
  delegate_to: "{{ kube_vip }}"
  connection: ssh

- name: "Step 2 — Delete all {{ item.item }} CRs in {{ telemetry_namespace }}"
  ansible.builtin.command:
    cmd: kubectl -n {{ telemetry_namespace }} delete {{ item.item }} --all --timeout=120s
  loop: "{{ crd_check.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: "'exists' in item.stdout"
  changed_when: true
  failed_when: false
  delegate_to: "{{ kube_vip }}"
  connection: ssh

# ── Step 3: Delete NEW-only K8s Services/Endpoints (VAST, UFM) ──
- name: "Step 3 — Delete NEW-only Service {{ item }}"
  ansible.builtin.command:
    cmd: kubectl -n {{ telemetry_namespace }} delete service {{ item }} --ignore-not-found=true
  loop: "{{ new_services }}"
  changed_when: true
  failed_when: false
  delegate_to: "{{ kube_vip }}"
  connection: ssh

- name: "Step 3 — Delete NEW-only Endpoints {{ item }}"
  ansible.builtin.command:
    cmd: kubectl -n {{ telemetry_namespace }} delete endpoints {{ item }} --ignore-not-found=true
  loop: "{{ new_services }}"
  changed_when: true
  failed_when: false
  delegate_to: "{{ kube_vip }}"
  connection: ssh

# ── Step 4: Delete NEW-only Secrets (VAST, UFM credentials) ──
- name: "Step 4 — Delete NEW-only Secret {{ item }}"
  ansible.builtin.command:
    cmd: kubectl -n {{ telemetry_namespace }} delete secret {{ item }} --ignore-not-found=true
  loop: "{{ new_secrets }}"
  changed_when: true
  failed_when: false
  delegate_to: "{{ kube_vip }}"
  connection: ssh

# ── Step 5: Clean NEW-only leftover resources ──
- name: "Step 5 — Delete PowerScale/CSM OTEL collector deployment"
  ansible.builtin.command:
    cmd: kubectl -n {{ telemetry_namespace }} delete deployment otel-collector --ignore-not-found=true --timeout=60s
  changed_when: true
  failed_when: false
  delegate_to: "{{ kube_vip }}"
  connection: ssh

- name: "Step 5 — Delete PowerScale/CSM OTEL collector service"
  ansible.builtin.command:
    cmd: kubectl -n {{ telemetry_namespace }} delete service otel-collector --ignore-not-found=true
  changed_when: true
  failed_when: false
  delegate_to: "{{ kube_vip }}"
  connection: ssh

- name: "Step 5 — Delete copied isilon-creds secret (source remains in isilon namespace)"
  ansible.builtin.command:
    cmd: kubectl -n {{ telemetry_namespace }} delete secret isilon-creds --ignore-not-found=true
  changed_when: true
  failed_when: false
  delegate_to: "{{ kube_vip }}"
  connection: ssh

- name: "Step 5 — Delete NEW-only PVC {{ item }}"
  ansible.builtin.command:
    cmd: kubectl -n {{ telemetry_namespace }} delete pvc {{ item }} --ignore-not-found=true --timeout=60s
  loop: "{{ new_leftover_pvcs }}"
  changed_when: true
  failed_when: false
  delegate_to: "{{ kube_vip }}"
  connection: ssh

- name: Display uninstall summary
  ansible.builtin.debug:
    msg: "{{ rollback_uninstall_summary }}"
