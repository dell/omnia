---
# ============================================================================
# Execute restored 2.1 telemetry.sh to redeploy the old telemetry stack
# ============================================================================
# The restored telemetry.sh (from backup) re-applies kustomize, which
# recreates all 2.1 K8s resources: Kafka (Strimzi), VictoriaMetrics
# StatefulSet, iDRAC telemetry, and LDMS.
# ============================================================================

- name: Verify restored telemetry.sh exists on control plane
  ansible.builtin.stat:
    path: "{{ control_plane_telemetry_script }}"
  register: restored_script_stat
  delegate_to: "{{ kube_vip }}"
  connection: ssh

- name: Fail if restored 2.1 telemetry.sh not found
  ansible.builtin.fail:
    msg: "{{ rollback_telemetry_sh_not_found_msg }}"
  when: not (restored_script_stat.stat.exists | default(false))

- name: Show telemetry pods before redeployment
  ansible.builtin.command:
    cmd: kubectl get pods -n {{ telemetry_namespace }}
  register: pods_before_redeploy
  changed_when: false
  failed_when: false
  delegate_to: "{{ kube_vip }}"
  connection: ssh

- name: Display pods before redeployment
  ansible.builtin.debug:
    msg: "{{ pods_before_redeploy.stdout_lines | default([]) }}"

- name: Execute restored 2.1 telemetry.sh
  ansible.builtin.command:
    cmd: bash {{ control_plane_telemetry_script }}
  register: telemetry_sh_result
  changed_when: true
  failed_when: false
  timeout: 1200
  delegate_to: "{{ kube_vip }}"
  connection: ssh

- name: Display telemetry.sh output
  ansible.builtin.debug:
    msg: "{{ telemetry_sh_result.stdout_lines | default([]) }}"

- name: Display telemetry.sh errors (if any)
  ansible.builtin.debug:
    msg: "{{ telemetry_sh_result.stderr_lines | default([]) }}"
  when: telemetry_sh_result.stderr_lines | default([]) | length > 0

- name: Fail if restored telemetry.sh returned a non-zero exit code
  ansible.builtin.fail:
    msg: "{{ rollback_telemetry_sh_failed_msg }}"
  when: telemetry_sh_result.rc | default(1) != 0

- name: Display 2.1 stack redeployment complete
  ansible.builtin.debug:
    msg: "{{ rollback_script_done_msg }}"
