---
# ============================================================================
# Verify the upgrade backup exists before making any cluster changes
# ============================================================================

- name: Check telemetry backup directory exists
  ansible.builtin.stat:
    path: "{{ telemetry_backup_dir }}"
  register: backup_dir_stat
  delegate_to: "{{ oim_host }}"
  connection: ssh

- name: Fail if telemetry backup directory missing
  ansible.builtin.fail:
    msg: "{{ rollback_backup_missing_msg }}"
  when: not (backup_dir_stat.stat.exists | default(false))

- name: Check restored telemetry.sh backup exists
  ansible.builtin.stat:
    path: "{{ telemetry_backup_script }}"
  register: backup_script_stat
  delegate_to: "{{ oim_host }}"
  connection: ssh

- name: Check backed-up telemetry deployments folder exists
  ansible.builtin.stat:
    path: "{{ telemetry_backup_folder }}/deployments/kustomization.yaml"
  register: backup_kustomization_stat
  delegate_to: "{{ oim_host }}"
  connection: ssh

- name: Fail if essential backup artifacts are missing
  ansible.builtin.fail:
    msg: "{{ rollback_backup_artifacts_missing_msg }}"
  when:
    - not (backup_script_stat.stat.exists | default(false))
    - not (backup_kustomization_stat.stat.exists | default(false))

- name: Check old VictoriaMetrics PVC backup exists (data-preserving reversal)
  ansible.builtin.stat:
    path: "{{ old_victoria_pvcs_backup }}"
  register: old_pvc_backup_stat
  delegate_to: "{{ oim_host }}"
  connection: ssh

- name: Set flag for whether VM PVC reversal backup is available
  ansible.builtin.set_fact:
    old_victoria_pvc_backup_available: "{{ old_pvc_backup_stat.stat.exists | default(false) }}"

- name: Display precheck summary
  ansible.builtin.debug:
    msg: "{{ rollback_precheck_summary }}"
