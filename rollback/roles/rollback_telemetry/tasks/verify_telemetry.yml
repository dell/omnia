---
# ============================================================================
# Verify the 2.1 telemetry stack is healthy after rollback
# ============================================================================

- name: Wait for all telemetry pods to reach Running/Completed
  ansible.builtin.shell: |
    set -o pipefail
    kubectl get pods -n {{ telemetry_namespace }} --no-headers 2>/dev/null \
      | awk '$3 != "Running" && $3 != "Completed" {count++} END {print count+0}'
  register: rb_pods_not_ready
  until: rb_pods_not_ready.stdout | int == 0
  retries: "{{ pod_wait_retries }}"
  delay: "{{ pod_wait_delay }}"
  changed_when: false
  failed_when: false
  delegate_to: "{{ kube_vip }}"
  connection: ssh

- name: Capture telemetry pod status report
  ansible.builtin.command:
    cmd: kubectl get pods -n {{ telemetry_namespace }} -o wide
  register: rb_pod_report
  changed_when: false
  failed_when: false
  delegate_to: "{{ kube_vip }}"
  connection: ssh

- name: Display telemetry pod status report
  ansible.builtin.debug:
    msg: "{{ rb_pod_report.stdout_lines | default([]) }}"

- name: Verify VictoriaMetrics 2.1 StatefulSet bound to preserved PVCs
  ansible.builtin.shell: |
    set -o pipefail
    kubectl -n {{ telemetry_namespace }} get pvc --no-headers 2>/dev/null \
      | awk '{print $1, $2}'
  register: rb_pvc_status
  changed_when: false
  failed_when: false
  delegate_to: "{{ kube_vip }}"
  connection: ssh

- name: Display PVC bind status (data preservation check)
  ansible.builtin.debug:
    msg: "{{ rb_pvc_status.stdout_lines | default([]) }}"

- name: Fail if telemetry pods are not ready after rollback
  ansible.builtin.fail:
    msg: "{{ rollback_verify_fail_msg }}"
  when: rb_pods_not_ready.stdout | int > 0

- name: Display telemetry rollback verification success
  ansible.builtin.debug:
    msg: "{{ rollback_verify_ok_msg }}"
