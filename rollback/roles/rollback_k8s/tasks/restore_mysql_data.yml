---
# ============================================================================
# Restore MySQL Data (Post-Rollback) — All Pods
# ============================================================================
# After etcd restore, the idrac-telemetry StatefulSet spec is reverted to the
# pre-upgrade MySQL version (e.g., 9.3.0). However, each pod's PVC still
# contains data written by the upgraded version (e.g., 9.7.2). MySQL refuses
# to downgrade between minor versions:
#   [ERROR] [MY-014061] Cannot downgrade from 90702 to 90300.
#
# The StatefulSet can have multiple replicas (one per parent service node),
# each with its own independent MySQL instance and PVC. This task handles
# ALL pods, not just pod-0.
#
# This task detects the version mismatch and fixes it:
#   1. Detects if mysqldb container is in CrashLoopBackOff
#   2. Confirms it is a downgrade error via container logs
#   3. Scales down the StatefulSet
#   4. Clears ALL PVC data (removes incompatible format files from every pod)
#   5. Scales up — MySQL initializes fresh at the old version on every pod
#   6. If per-pod mysqldump backups exist, restores schema+data to each pod
# ============================================================================

- name: Restore idrac-telemetry MySQL data (post-rollback)
  when:
    - kube_vip is defined
    - kube_vip | length > 0
  block:
    # ── Step 1: Check if idrac-telemetry StatefulSet exists ──
    - name: Check if idrac-telemetry StatefulSet exists
      ansible.builtin.command:
        cmd: kubectl get statefulset idrac-telemetry -n {{ telemetry_namespace }} --no-headers
      delegate_to: "{{ kube_vip }}"
      connection: ssh
      register: idrac_sts_check
      changed_when: false
      failed_when: false

    - name: Skip MySQL restore if idrac-telemetry not deployed
      ansible.builtin.debug:
        msg: "{{ msg_mysql_sts_not_found }}"
      when: idrac_sts_check.rc != 0

    # ── Step 2: Detect MySQL CrashLoopBackOff on ANY pod ──
    - name: Detect and fix MySQL version downgrade issue
      when: idrac_sts_check.rc == 0
      block:
        - name: Wait for pods to attempt startup (need multiple restart cycles for CrashLoopBackOff)
          ansible.builtin.pause:
            seconds: 90

        - name: Check all idrac-telemetry pods status
          ansible.builtin.shell:
            cmd: |
              set -o pipefail
              kubectl get pods -n {{ telemetry_namespace }} -l app=idrac-telemetry \
                --no-headers 2>/dev/null
          delegate_to: "{{ kube_vip }}"
          connection: ssh
          register: idrac_pod_raw_status
          changed_when: false
          failed_when: false

        - name: Check if any mysqldb container is crashing across all pods
          ansible.builtin.shell:
            cmd: |
              set -o pipefail
              COLUMNS="NAME:.metadata.name,WAITING:.status.containerStatuses[?(@.name==\"mysqldb\")].state.waiting.reason,"
              COLUMNS="${COLUMNS}LAST_EXIT:.status.containerStatuses[?(@.name==\"mysqldb\")].lastState.terminated.reason,"
              COLUMNS="${COLUMNS}RESTARTS:.status.containerStatuses[?(@.name==\"mysqldb\")].restartCount"
              kubectl get pods -n {{ telemetry_namespace }} -l app=idrac-telemetry \
                --no-headers \
                -o custom-columns="${COLUMNS}" \
                2>/dev/null
          delegate_to: "{{ kube_vip }}"
          connection: ssh
          register: mysqldb_waiting_reason
          changed_when: false
          failed_when: false

        - name: Check MySQL logs for downgrade error across all pods
          ansible.builtin.shell:
            cmd: |
              set -o pipefail
              for POD in $(kubectl get pods -n {{ telemetry_namespace }} -l app=idrac-telemetry \
                           --no-headers -o custom-columns=NAME:.metadata.name 2>/dev/null); do
                kubectl logs "$POD" -n {{ telemetry_namespace }} -c mysqldb --previous --tail=50 2>/dev/null
                kubectl logs "$POD" -n {{ telemetry_namespace }} -c mysqldb --tail=50 2>/dev/null
              done
          delegate_to: "{{ kube_vip }}"
          connection: ssh
          register: mysql_container_logs
          changed_when: false
          failed_when: false

        - name: Determine if MySQL downgrade issue exists
          ansible.builtin.set_fact:
            mysql_downgrade_detected: >-
              {{ ('CrashLoopBackOff' in (mysqldb_waiting_reason.stdout | default('')) or
                  'Error' in (mysqldb_waiting_reason.stdout | default('')) or
                  'OOMKilled' in (mysqldb_waiting_reason.stdout | default(''))) and
                 ('Cannot downgrade' in (mysql_container_logs.stdout | default('')) or
                  'Invalid MySQL server downgrade' in (mysql_container_logs.stdout | default(''))) }}

        - name: Display MySQL status
          ansible.builtin.debug:
            msg:
              - "{{ msg_mysql_pod_status }}"
              - "mysqldb waiting reasons: {{ mysqldb_waiting_reason.stdout | default('none') }}"
              - "MySQL downgrade detected: {{ mysql_downgrade_detected }}"

    # ── Step 3: Fix MySQL downgrade — wipe ALL PVCs and reinitialize ──
    - name: Fix MySQL version downgrade
      when:
        - idrac_sts_check.rc == 0
        - mysql_downgrade_detected | default(false) | bool
      block:
        - name: Display MySQL downgrade fix starting
          ansible.builtin.debug:
            msg: "{{ msg_mysql_downgrade_fix_start }}"

        # Capture original replica count before scaling down
        - name: Get original replica count from StatefulSet
          ansible.builtin.shell:
            cmd: >
              kubectl get statefulset idrac-telemetry -n {{ telemetry_namespace }}
              -o jsonpath='{.spec.replicas}'
          delegate_to: "{{ kube_vip }}"
          connection: ssh
          register: original_replica_count_raw
          changed_when: false

        - name: Set original replica count
          ansible.builtin.set_fact:
            idrac_telemetry_original_replicas: "{{ original_replica_count_raw.stdout | default('1') | int }}"

        - name: Build list of all pod indices
          ansible.builtin.set_fact:
            idrac_telemetry_pod_indices: "{{ range(0, idrac_telemetry_original_replicas | int) | list }}"

        - name: Display replica count
          ansible.builtin.debug:
            msg: "{{ msg_mysql_replica_count }}"

        # Scale down
        - name: Scale down idrac-telemetry StatefulSet
          ansible.builtin.command:
            cmd: kubectl scale statefulset idrac-telemetry -n {{ telemetry_namespace }} --replicas=0
          delegate_to: "{{ kube_vip }}"
          connection: ssh
          changed_when: true

        - name: Wait for all idrac-telemetry pods to terminate
          ansible.builtin.shell:
            cmd: |
              set -o pipefail
              # Wait for all pods to be deleted
              for i in {{ idrac_telemetry_pod_indices | join(' ') }}; do
                kubectl wait --for=delete pod/idrac-telemetry-${i} -n {{ telemetry_namespace }} --timeout=120s 2>/dev/null || true
              done
              # Double-check no pods left
              COUNT=$(kubectl get pods -n {{ telemetry_namespace }} -l app=idrac-telemetry --no-headers 2>/dev/null | wc -l)
              if [ "$COUNT" -gt 0 ]; then
                kubectl delete pod -n {{ telemetry_namespace }} -l app=idrac-telemetry --force --grace-period=0 2>/dev/null || true
                sleep 5
              fi
              echo "pods_cleared"
          delegate_to: "{{ kube_vip }}"
          connection: ssh
          changed_when: true
          register: pod_cleanup

        # Get the MySQL image from restored StatefulSet
        - name: Get MySQL image from restored StatefulSet
          ansible.builtin.shell:
            cmd: >
              kubectl get statefulset idrac-telemetry -n {{ telemetry_namespace }}
              -o jsonpath='{.spec.template.spec.containers[?(@.name=="mysqldb")].image}'
          delegate_to: "{{ kube_vip }}"
          connection: ssh
          register: restored_mysql_image
          changed_when: false

        # Wipe ALL PVCs using temporary cleanup pods (one per PVC)
        - name: Create PVC cleanup pod for each replica
          ansible.builtin.shell:
            cmd: |
              kubectl run mysql-pvc-cleanup-{{ item }} --image={{ restored_mysql_image.stdout }} \
                --restart=Never -n {{ telemetry_namespace }} \
                --overrides='{
                  "spec": {
                    "containers": [{
                      "name": "mysql-pvc-cleanup-{{ item }}",
                      "image": "{{ restored_mysql_image.stdout }}",
                      "command": ["/bin/sh", "-c", "rm -rf /var/lib/mysql/* && echo PVC_DATA_CLEARED"],
                      "volumeMounts": [{
                        "name": "mysqldb-pvc",
                        "mountPath": "/var/lib/mysql"
                      }]
                    }],
                    "volumes": [{
                      "name": "mysqldb-pvc",
                      "persistentVolumeClaim": {
                        "claimName": "mysqldb-pvc-idrac-telemetry-{{ item }}"
                      }
                    }],
                    "restartPolicy": "Never"
                  }
                }'
          delegate_to: "{{ kube_vip }}"
          connection: ssh
          changed_when: true
          loop: "{{ idrac_telemetry_pod_indices }}"

        - name: Wait for all PVC cleanup pods to complete
          ansible.builtin.shell:
            cmd: >
              kubectl wait --for=jsonpath='{.status.phase}'=Succeeded
              pod/mysql-pvc-cleanup-{{ item }} -n {{ telemetry_namespace }}
              --timeout=120s 2>/dev/null ||
              kubectl wait --for=jsonpath='{.status.phase}'=Failed
              pod/mysql-pvc-cleanup-{{ item }} -n {{ telemetry_namespace }}
              --timeout=120s 2>/dev/null
          delegate_to: "{{ kube_vip }}"
          connection: ssh
          changed_when: false
          retries: 3
          delay: 10
          register: cleanup_wait
          until: cleanup_wait.rc == 0
          failed_when: false
          loop: "{{ idrac_telemetry_pod_indices }}"

        - name: Verify PVC cleanup succeeded for each replica
          ansible.builtin.command:
            cmd: kubectl logs mysql-pvc-cleanup-{{ item }} -n {{ telemetry_namespace }}
          delegate_to: "{{ kube_vip }}"
          connection: ssh
          register: cleanup_logs_all
          changed_when: false
          loop: "{{ idrac_telemetry_pod_indices }}"

        - name: Delete PVC if cleanup failed due to NFS lock files
          ansible.builtin.command:
            cmd: kubectl delete pvc mysqldb-pvc-idrac-telemetry-{{ item.item }} -n {{ telemetry_namespace }} --wait=true --timeout=60s
          delegate_to: "{{ kube_vip }}"
          connection: ssh
          when: "'PVC_DATA_CLEARED' not in item.stdout"
          loop: "{{ cleanup_logs_all.results }}"
          loop_control:
            label: "pod-{{ item.item }}"
          changed_when: true

        - name: Delete all PVC cleanup pods
          ansible.builtin.command:
            cmd: kubectl delete pod mysql-pvc-cleanup-{{ item }} -n {{ telemetry_namespace }} --wait=false
          delegate_to: "{{ kube_vip }}"
          connection: ssh
          changed_when: true
          failed_when: false
          loop: "{{ idrac_telemetry_pod_indices }}"

        # Scale up — MySQL will initialize fresh at the old version on all pods
        - name: Scale up idrac-telemetry StatefulSet
          ansible.builtin.command:
            cmd: kubectl scale statefulset idrac-telemetry -n {{ telemetry_namespace }} --replicas={{ idrac_telemetry_original_replicas | default(1) }}
          delegate_to: "{{ kube_vip }}"
          connection: ssh
          changed_when: true

        - name: Wait for all idrac-telemetry pods to be ready
          ansible.builtin.shell:
            cmd: |
              kubectl wait --for=condition=Ready \
                pod/idrac-telemetry-{{ item }} -n {{ telemetry_namespace }} \
                --timeout=300s
          delegate_to: "{{ kube_vip }}"
          connection: ssh
          changed_when: false
          register: pod_ready_wait
          retries: 3
          delay: 30
          until: pod_ready_wait.rc == 0
          loop: "{{ idrac_telemetry_pod_indices }}"

        # Get MySQL root password for restore
        - name: Get MySQL root password from secret
          ansible.builtin.shell:
            cmd: |
              set -o pipefail
              kubectl get secret mysqldb-credentials -n {{ telemetry_namespace }} \
                -o jsonpath='{.data.mysqldb_root_password}' | base64 -d
          delegate_to: "{{ kube_vip }}"
          connection: ssh
          register: mysql_root_pw
          changed_when: false
          no_log: true

        # Wait for MySQL to accept connections on all pods
        - name: Wait for MySQL to accept connections on each pod
          ansible.builtin.shell:
            cmd: >
              kubectl exec idrac-telemetry-{{ item }} -n {{ telemetry_namespace }} -c mysqldb --
              mysqladmin ping -u root -p'{{ mysql_root_pw.stdout }}' 2>/dev/null
          delegate_to: "{{ kube_vip }}"
          connection: ssh
          register: mysql_ping
          until: mysql_ping.rc == 0
          retries: 30
          delay: 10
          changed_when: false
          no_log: true
          loop: "{{ idrac_telemetry_pod_indices }}"

        # Search for per-pod mysqldump backups (new format: *_pod<N>.sql.enc)
        - name: Search for per-pod encrypted MySQL backups in backup directory
          ansible.builtin.find:
            paths: "{{ k8s_backup_dir }}"
            patterns: "{{ mysql_backup_filename_prefix }}*.sql.enc"
            recurse: true
          delegate_to: "{{ kube_vip }}"
          connection: ssh
          register: mysql_perpod_enc_backups_in_backup
          failed_when: false
          when: k8s_backup_dir is defined

        - name: Search for per-pod encrypted MySQL backups in archive directory
          ansible.builtin.find:
            paths: "{{ k8s_client_mount_path }}/upgrade/archive"
            patterns: "{{ mysql_backup_filename_prefix }}*.sql.enc"
            recurse: true
          delegate_to: "{{ kube_vip }}"
          connection: ssh
          register: mysql_perpod_enc_backups_in_archive
          failed_when: false
          when: k8s_client_mount_path is defined

        # Also search for legacy single-file backup (backward compatibility)
        - name: Search for legacy encrypted MySQL backup in backup directory
          ansible.builtin.find:
            paths: "{{ k8s_backup_dir }}"
            patterns: "idrac_telemetry_mysql_backup.sql.enc"
            recurse: true
          delegate_to: "{{ kube_vip }}"
          connection: ssh
          register: mysql_legacy_enc_backup
          failed_when: false
          when: k8s_backup_dir is defined

        - name: Search for legacy encrypted MySQL backup in archive directory
          ansible.builtin.find:
            paths: "{{ k8s_client_mount_path }}/upgrade/archive"
            patterns: "idrac_telemetry_mysql_backup.sql.enc"
            recurse: true
          delegate_to: "{{ kube_vip }}"
          connection: ssh
          register: mysql_legacy_enc_archive
          failed_when: false
          when: k8s_client_mount_path is defined

        # Determine which backup format is available and set the backup directory
        - name: Determine backup format and directory
          ansible.builtin.set_fact:
            mysql_perpod_backup_dir: >-
              {% set perpod_backup = mysql_perpod_enc_backups_in_backup | default({'matched': 0}) -%}
              {% set perpod_archive = mysql_perpod_enc_backups_in_archive | default({'matched': 0}) -%}
              {% set legacy_backup = mysql_legacy_enc_backup | default({'matched': 0}) -%}
              {% set legacy_archive = mysql_legacy_enc_archive | default({'matched': 0}) -%}
              {% if (perpod_backup.matched | default(0)) > 0 -%}
                {{ (perpod_backup.files | sort(attribute='mtime', reverse=true) | first).path | dirname }}
              {%- elif (perpod_archive.matched | default(0)) > 0 -%}
                {{ (perpod_archive.files | sort(attribute='mtime', reverse=true) | first).path | dirname }}
              {%- elif (legacy_backup.matched | default(0)) > 0 -%}
                {{ (legacy_backup.files | sort(attribute='mtime', reverse=true) | first).path | dirname }}
              {%- elif (legacy_archive.matched | default(0)) > 0 -%}
                {{ (legacy_archive.files | sort(attribute='mtime', reverse=true) | first).path | dirname }}
              {%- else -%}
                none
              {%- endif %}
            mysql_backup_is_perpod: >-
              {{ ((mysql_perpod_enc_backups_in_backup | default({'matched': 0})).matched | default(0)) > 0 or
                 ((mysql_perpod_enc_backups_in_archive | default({'matched': 0})).matched | default(0)) > 0 }}
            mysql_backup_is_legacy: >-
              {{ ((mysql_perpod_enc_backups_in_backup | default({'matched': 0})).matched | default(0)) == 0 and
                 ((mysql_perpod_enc_backups_in_archive | default({'matched': 0})).matched | default(0)) == 0 and
                 (((mysql_legacy_enc_backup | default({'matched': 0})).matched | default(0)) > 0 or
                  ((mysql_legacy_enc_archive | default({'matched': 0})).matched | default(0)) > 0) }}

        - name: Display backup search results
          ansible.builtin.debug:
            msg:
              - "{{ msg_mysql_backup_search_results }}"
              - "Replica count: {{ idrac_telemetry_original_replicas }}"

        # ── Restore per-pod backups (new format) ──
        - name: Restore per-pod MySQL backups
          when:
            - mysql_perpod_backup_dir | trim != 'none'
            - mysql_backup_is_perpod | trim | bool
          block:
            - name: Display per-pod MySQL restore starting
              ansible.builtin.debug:
                msg: "{{ msg_mysql_perpod_restore_start }}"

            - name: Restore encrypted mysqldump to each pod
              ansible.builtin.shell:
                cmd: |
                  set -o pipefail
                  BACKUP_FILE="{{ mysql_perpod_backup_dir | trim }}/{{ mysql_backup_filename_prefix }}{{ item }}.sql.enc"
                  if [ ! -f "$BACKUP_FILE" ]; then
                    echo "NO_BACKUP_FOR_POD_{{ item }}"
                    exit 0
                  fi
                  openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 \
                    -in "$BACKUP_FILE" \
                    -pass pass:'{{ mysql_root_pw.stdout }}' \
                    | kubectl exec -i idrac-telemetry-{{ item }} -n {{ telemetry_namespace }} -c mysqldb -- \
                    mysql -u root -p'{{ mysql_root_pw.stdout }}' idrac_telemetrydb
              delegate_to: "{{ kube_vip }}"
              connection: ssh
              register: mysql_perpod_restore_results
              changed_when: true
              failed_when: false
              no_log: true
              loop: "{{ idrac_telemetry_pod_indices }}"

            - name: Report per-pod restore results
              ansible.builtin.debug:
                msg: >-
                  {{ msg_mysql_perpod_restore_result }}
                  {{ '— no backup file found, MySQL reinitialized fresh' if 'NO_BACKUP_FOR_POD' in (item.stdout | default('')) else '' }}
              loop: "{{ mysql_perpod_restore_results.results }}"
              loop_control:
                label: "pod-{{ item.item }}"

        # ── Restore legacy single-file backup (backward compatibility) ──
        - name: Restore legacy MySQL backup (pod-0 only)
          when:
            - mysql_perpod_backup_dir | trim != 'none'
            - mysql_backup_is_legacy | trim | bool
          block:
            - name: Display legacy MySQL restore starting
              ansible.builtin.debug:
                msg: "{{ msg_mysql_legacy_restore_start }}"

            - name: Restore legacy encrypted backup to pod-0
              ansible.builtin.shell:
                cmd: |
                  set -o pipefail
                  openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 \
                    -in {{ mysql_perpod_backup_dir | trim }}/idrac_telemetry_mysql_backup.sql.enc \
                    -pass pass:'{{ mysql_root_pw.stdout }}' \
                    | kubectl exec -i idrac-telemetry-0 -n {{ telemetry_namespace }} -c mysqldb -- \
                    mysql -u root -p'{{ mysql_root_pw.stdout }}' idrac_telemetrydb
              delegate_to: "{{ kube_vip }}"
              connection: ssh
              register: mysql_legacy_restore
              changed_when: true
              failed_when: false
              no_log: true

            - name: Report legacy restore result
              ansible.builtin.debug:
                msg: "{{ msg_mysql_legacy_restore_result }}"

        # ── No backup found ──
        - name: Log that no backup was found
          ansible.builtin.debug:
            msg: "{{ msg_mysql_no_backup_found }}"
          when: mysql_perpod_backup_dir | trim == 'none'

        # Verify MySQL is healthy on all pods
        - name: Verify MySQL tables after recovery on each pod
          ansible.builtin.shell:
            cmd: >
              kubectl exec idrac-telemetry-{{ item }} -n {{ telemetry_namespace }} -c mysqldb --
              mysql -u root -p'{{ mysql_root_pw.stdout }}' -e 'SHOW TABLES FROM idrac_telemetrydb;'
              2>/dev/null
          delegate_to: "{{ kube_vip }}"
          connection: ssh
          register: tables_after_restore_all
          changed_when: false
          no_log: true
          loop: "{{ idrac_telemetry_pod_indices }}"

        - name: Verify all containers are running on each pod
          ansible.builtin.shell:
            cmd: |
              set -o pipefail
              kubectl get pod idrac-telemetry-{{ item }} -n {{ telemetry_namespace }} --no-headers \
                -o custom-columns=READY:.status.containerStatuses[*].ready | tr ',' '\n' | grep -c 'true'
          delegate_to: "{{ kube_vip }}"
          connection: ssh
          register: ready_containers_all
          changed_when: false
          failed_when: false
          loop: "{{ idrac_telemetry_pod_indices }}"

        - name: Display MySQL recovery success
          ansible.builtin.debug:
            msg:
              - "============================================================"
              - "MySQL VERSION DOWNGRADE — RECOVERY COMPLETED"
              - "============================================================"
              - "MySQL image: {{ restored_mysql_image.stdout }}"
              - "Replicas: {{ idrac_telemetry_original_replicas | default(1) }}"
              - "Per-pod backup used: {{ mysql_backup_is_perpod | trim }}"
              - "Legacy backup used: {{ mysql_backup_is_legacy | trim }}"
              - "Pod recovery details:"
              - "{% for idx in idrac_telemetry_pod_indices %}\
                  pod-{{ idx }}: \
                  ready_containers={{ (ready_containers_all.results[idx].stdout | default('0')) | trim }}/5, \
                  tables={{ (tables_after_restore_all.results[idx].stdout_lines | default([])) | length }}\
                  {{ ', ' if not loop.last else '' }}\
                {% endfor %}"
              - "============================================================"

    # ── No downgrade detected — MySQL is healthy ──
    - name: MySQL version compatible — no restore needed
      ansible.builtin.debug:
        msg: "{{ msg_mysql_no_restore_needed }}"
      when:
        - idrac_sts_check.rc == 0
        - not (mysql_downgrade_detected | default(false) | bool)
