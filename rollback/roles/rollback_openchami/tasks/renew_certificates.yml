# ============================================================================
# renew_certificates.yml — Renew OpenCHAMI TLS Certificates After Rollback
# ============================================================================
# After restoring v2.1 containers, the TLS certificates may be expired.
# This task renews the certificates using openchami-certificate-update and
# restarts the affected services to pick up the new certificates.
#
# This is critical for cloud-init-server communication via ochami CLI.
# ============================================================================

- name: Renew OpenCHAMI certificates after rollback
  block:
    - name: Read network_spec.yml for domain_name
      ansible.builtin.include_vars:
        file: "{{ input_project_dir }}/network_spec.yml"

    - name: Get cluster FQDN from network_spec.yml
      ansible.builtin.set_fact:
        rollback_cluster_fqdn: "{{ rollback_cluster_name }}.{{ domain_name }}"

    - name: Renew OpenCHAMI certificates
      ansible.builtin.command: openchami-certificate-update update {{ rollback_cluster_fqdn }}
      become: true
      register: cert_renew_result
      changed_when: cert_renew_result.rc == 0
      retries: "{{ max_retries }}"
      delay: "{{ max_delay }}"
      until: cert_renew_result.rc == 0
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Restart openchami.target to pick up new certificates
      ansible.builtin.systemd:
        name: openchami.target
        state: restarted
        daemon_reload: true
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Restart MinIO service
      ansible.builtin.systemd:
        name: minio.service
        state: restarted
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Restart registry service
      ansible.builtin.systemd:
        name: registry.service
        state: restarted
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Wait for all services to stabilize after certificate renewal
      ansible.builtin.pause:
        seconds: "{{ wait_time }}"

    # ── Recover any services that failed from target restart race ──────
    - name: Recover any failed services after certificate renewal
      ansible.builtin.shell: |
        set -o pipefail
        RECOVERED=""
        if ! systemctl is-active --quiet openchami.target 2>/dev/null; then
          echo "Starting openchami.target (was inactive)"
          systemctl reset-failed 2>/dev/null || true
          systemctl start openchami.target 2>/dev/null || true
          RECOVERED="yes"
          sleep 15
        fi
        for svc in $(systemctl list-dependencies openchami.target --plain --no-pager 2>/dev/null); do
          state=$(systemctl is-active "$svc" 2>/dev/null || true)
          if [ "$state" = "failed" ]; then
            echo "Restarting failed service: $svc"
            systemctl reset-failed "$svc" 2>/dev/null || true
            systemctl restart "$svc" 2>/dev/null || true
            RECOVERED="yes"
          elif [ "$state" = "inactive" ]; then
            svc_type=$(systemctl show -p Type --value "$svc" 2>/dev/null || true)
            if [ "$svc_type" != "oneshot" ]; then
              echo "Restarting inactive service: $svc (type=$svc_type)"
              systemctl restart "$svc" 2>/dev/null || true
              RECOVERED="yes"
            fi
          fi
        done
        [ -z "$RECOVERED" ] && echo "ALL_SERVICES_OK" || true
      register: cert_recovery_result
      changed_when: false
      failed_when: false
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Wait for recovered services to stabilize after cert renewal
      ansible.builtin.pause:
        seconds: 15
      when: "'ALL_SERVICES_OK' not in cert_recovery_result.stdout | default('')"

    - name: Stop HAProxy to clear stale backend DNS cache
      ansible.builtin.systemd:
        name: haproxy.service
        state: stopped
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Start HAProxy with fresh backend DNS resolution
      ansible.builtin.systemd:
        name: haproxy.service
        state: started
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Wait for HAProxy to stabilize after restart
      ansible.builtin.pause:
        seconds: 10

    - name: Display certificate renewal status
      ansible.builtin.debug:
        msg: "OpenCHAMI certificates renewed for {{ rollback_cluster_fqdn }}. All services restarted."
