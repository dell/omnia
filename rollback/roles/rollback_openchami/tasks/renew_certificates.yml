# ============================================================================
# renew_certificates.yml — Renew OpenCHAMI TLS Certificates After Rollback
# ============================================================================
# After restoring v2.1 containers, the TLS certificates may be expired.
# This task renews the certificates using openchami-certificate-update and
# restarts the affected services to pick up the new certificates.
#
# This is critical for cloud-init-server communication via ochami CLI.
# ============================================================================

- name: Renew OpenCHAMI certificates after rollback
  block:
    - name: Read network_spec.yml for domain_name
      ansible.builtin.include_vars:
        file: "{{ input_project_dir }}/network_spec.yml"

    - name: Get cluster FQDN from network_spec.yml
      ansible.builtin.set_fact:
        rollback_cluster_fqdn: "{{ rollback_cluster_name }}.{{ domain_name }}"

    - name: Renew OpenCHAMI certificates
      ansible.builtin.command: openchami-certificate-update update {{ rollback_cluster_fqdn }}
      become: true
      register: cert_renew_result
      changed_when: cert_renew_result.rc == 0
      retries: "{{ max_retries }}"
      delay: "{{ max_delay }}"
      until: cert_renew_result.rc == 0
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Restart openchami.target to pick up new certificates
      ansible.builtin.systemd:
        name: openchami.target
        state: restarted
        daemon_reload: true
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Restart MinIO service
      ansible.builtin.systemd:
        name: minio.service
        state: restarted
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Restart registry service
      ansible.builtin.systemd:
        name: registry.service
        state: restarted
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Wait for all services to stabilize after certificate renewal
      ansible.builtin.pause:
        seconds: "{{ wait_time }}"

    - name: Reset any failed services after certificate renewal
      ansible.builtin.command: systemctl reset-failed
      changed_when: true
      failed_when: false
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    # ── Cert verification gate ──────────────────────────────────────────
    # Check BSS/cloud-init status. Only restart HAProxy if unreachable.
    # openchami.target restart above already restarted HAProxy and all
    # services. Do NOT unconditionally stop/start HAProxy — it causes
    # cascading failures (coresmd, cloud-init, BSS all lose connectivity).

    - name: Check ochami bss service status
      ansible.builtin.command: /usr/bin/ochami bss service status
      register: cert_bss_gate
      changed_when: false
      failed_when: false
      delegate_to: oim
      delegate_facts: true
      connection: ssh
      retries: "{{ ochami_recheck_retries }}"
      delay: "{{ ochami_recheck_delay }}"
      until: cert_bss_gate.rc == 0

    - name: Regenerate certificate if BSS unreachable
      when: cert_bss_gate.rc != 0
      block:
        - name: Restart acme-deploy service
          block:
            - name: Restart acme-deploy service
              ansible.builtin.systemd_service:
                name: acme-deploy
                state: restarted
              delegate_to: oim
              delegate_facts: true
              connection: ssh
          rescue:
            - name: Failed to restart acme-deploy service
              ansible.builtin.fail:
                msg: "{{ cert_restart_fail_msg }}"

        - name: Wait for cert wait time seconds before checking again {{ cert_wait_time }}
          ansible.builtin.wait_for:
            timeout: "{{ cert_wait_time }}"

        - name: Stop HAProxy to pick up renewed certificate
          ansible.builtin.systemd:
            name: haproxy.service
            state: stopped
          delegate_to: oim
          delegate_facts: true
          connection: ssh

        - name: Start HAProxy with renewed certificate
          ansible.builtin.systemd:
            name: haproxy.service
            state: started
          delegate_to: oim
          delegate_facts: true
          connection: ssh

        - name: Wait for HAProxy to stabilize
          ansible.builtin.pause:
            seconds: 10

        - name: Reset failed state for coresmd before start
          ansible.builtin.command: systemctl reset-failed coresmd.service
          changed_when: false
          failed_when: false
          delegate_to: oim
          delegate_facts: true
          connection: ssh

        - name: Start coresmd after HAProxy restart (v2.1)
          ansible.builtin.systemd:
            name: coresmd.service
            state: started
          failed_when: false
          delegate_to: oim
          delegate_facts: true
          connection: ssh

        - name: Wait for coresmd to stabilize
          ansible.builtin.pause:
            seconds: 10

        - name: Recheck ochami bss service status
          ansible.builtin.command: /usr/bin/ochami bss service status
          register: cert_bss_recheck
          changed_when: false
          failed_when: false
          delegate_to: oim
          delegate_facts: true
          connection: ssh

    - name: Check ochami cloud-init service status
      ansible.builtin.command: /usr/bin/ochami cloud-init service status
      register: cert_ci_gate
      changed_when: false
      failed_when: false
      delegate_to: oim
      delegate_facts: true
      connection: ssh
      retries: "{{ ochami_recheck_retries }}"
      delay: "{{ ochami_recheck_delay }}"
      until: cert_ci_gate.rc == 0

    # ── cloud-init recovery ────────────────────────────────────────────
    # cloud-init-server may return 404 if its routes are not registered.
    # Restarting the container forces re-initialization of endpoints.
    # Pattern mirrors provision/roles/configure_ochami/tasks/provision_mapping_nodes.yml.
    - name: Recover cloud-init-server if unreachable
      when: cert_ci_gate.rc != 0
      block:
        - name: Restart openchami to re-register endpoints
          ansible.builtin.systemd:
            name: openchami.target
            state: restarted
          failed_when: false
          delegate_to: oim
          delegate_facts: true
          connection: ssh

        - name: Wait for cloud-init-server to initialize
          ansible.builtin.pause:
            seconds: 15

        - name: Recheck ochami cloud-init service status after restart
          ansible.builtin.command: /usr/bin/ochami cloud-init service status
          register: cert_ci_recheck
          changed_when: false
          failed_when: false
          retries: "{{ ochami_recheck_retries }}"
          delay: "{{ ochami_recheck_delay }}"
          until: cert_ci_recheck.rc == 0
          delegate_to: oim
          delegate_facts: true
          connection: ssh

    - name: Set final gate status
      ansible.builtin.set_fact:
        cert_gate_ci_ok: "{{ (cert_ci_recheck.rc | default(cert_ci_gate.rc) | default(1)) == 0 }}"
        cert_gate_bss_ok: "{{ (cert_bss_recheck.rc | default(cert_bss_gate.rc) | default(1)) == 0 }}"

    - name: Display certificate renewal status
      ansible.builtin.debug:
        msg: >-
          OpenCHAMI certificates renewed for {{ rollback_cluster_fqdn }}.
          cloud-init: {{ 'OK' if cert_gate_ci_ok | bool else 'UNREACHABLE' }},
          BSS: {{ 'OK' if cert_gate_bss_ok | bool else 'UNREACHABLE' }}

    - name: Fail if cloud-init or BSS still unreachable after cert recovery
      ansible.builtin.fail:
        msg: "{{ cert_gate_failure_msg }}"
      when: not (cert_gate_ci_ok | bool) or not (cert_gate_bss_ok | bool)
