# ============================================================================
# start_v21_containers.yml — Start v2.1 Containers via openchami.target
# ============================================================================
# After restoring v2.1 quadlet files and openchami.target, start all
# OpenCHAMI services. The restored openchami.target references
# coresmd.service (single container) instead of the v2.2 split services.
#
# Mirrors the start sequence from upgrade_openchami_containers.yml step 9,
# but in reverse — starting the v2.1 service set.
#
# Idempotency:
#   - systemd start is idempotent (no error if already running)
#   - reset-failed + restart recovers any initially failed services
# ============================================================================

- name: Start v2.1 containers
  block:
    # ── Ensure v2.2 split services are fully stopped (port 69 conflict) ─
    # coresmd (v2.1) and coresmd-coredhcp (v2.2) both bind TFTP UDP :69.
    # If any v2.2 process still holds port 69, coresmd will fail with
    # "listen udp :69: bind: address already in use".
    - name: Stop coresmd-coredhcp to release TFTP port 69
      ansible.builtin.systemd:
        name: coresmd-coredhcp.service
        state: stopped
      failed_when: false
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Stop coresmd-coredns to release DNS port
      ansible.builtin.systemd:
        name: coresmd-coredns.service
        state: stopped
      failed_when: false
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Reset failed state for coresmd to allow fresh start
      ansible.builtin.command: systemctl reset-failed coresmd.service
      changed_when: false
      failed_when: false
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Wait for ports to be released
      ansible.builtin.pause:
        seconds: 5

    # ── Start all OpenCHAMI services ────────────────────────────────────
    - name: Start openchami.target with v2.1 containers
      ansible.builtin.systemd:
        name: openchami.target
        state: started
        enabled: true
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Start MinIO service
      ansible.builtin.systemd:
        name: minio.service
        state: started
        enabled: true
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Start registry service
      ansible.builtin.systemd:
        name: registry.service
        state: started
        enabled: true
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Wait for services to stabilize
      ansible.builtin.pause:
        seconds: "{{ wait_time }}"

    # ── Recover any failed services individually ────────────────────────
    # Instead of restarting openchami.target (which causes race conditions),
    # detect and restart only the specific services that failed.
    - name: Recover any failed services after v2.1 container start
      ansible.builtin.script: recover_failed_services.sh
      register: start_recovery_result
      changed_when: false
      failed_when: false
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Wait for recovered services to stabilize
      ansible.builtin.pause:
        seconds: 15
      when: "'ALL_SERVICES_OK' not in start_recovery_result.stdout | default('')"

    # NOTE: Do NOT unconditionally stop/start HAProxy here.
    # openchami.target start above already started HAProxy and all services
    # including coresmd. An extra stop/start kills HAProxy and cascades
    # failures to coresmd, cloud-init-server, and BSS.
    # The recovery script handles any stragglers.

    - name: Display v2.1 container start status
      ansible.builtin.debug:
        verbosity: 1
        msg: "v2.1 OpenCHAMI services started via openchami.target."
