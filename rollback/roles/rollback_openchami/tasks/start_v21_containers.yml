# ============================================================================
# start_v21_containers.yml — Start v2.1 Containers via openchami.target
# ============================================================================
# After restoring v2.1 quadlet files and openchami.target, start all
# OpenCHAMI services. The restored openchami.target references
# coresmd.service (single container) instead of the v2.2 split services.
#
# Mirrors the start sequence from upgrade_openchami_containers.yml step 9,
# but in reverse — starting the v2.1 service set.
#
# Idempotency:
#   - systemd start is idempotent (no error if already running)
#   - reset-failed + restart recovers any initially failed services
# ============================================================================

- name: Start v2.1 containers
  block:
    # ── Start all OpenCHAMI services ────────────────────────────────────
    - name: Start openchami.target with v2.1 containers
      ansible.builtin.systemd:
        name: openchami.target
        state: started
        enabled: true
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Start MinIO service
      ansible.builtin.systemd:
        name: minio.service
        state: started
        enabled: true
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Start registry service
      ansible.builtin.systemd:
        name: registry.service
        state: started
        enabled: true
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Wait for services to stabilize
      ansible.builtin.pause:
        seconds: "{{ wait_time }}"

    # ── Recover any failed services individually ────────────────────────
    # Instead of restarting openchami.target (which causes race conditions),
    # detect and restart only the specific services that failed.
    - name: Recover any failed services after v2.1 container start
      ansible.builtin.shell: |
        set -o pipefail
        RECOVERED=""
        if ! systemctl is-active --quiet openchami.target 2>/dev/null; then
          echo "Starting openchami.target (was inactive)"
          systemctl reset-failed 2>/dev/null || true
          systemctl start openchami.target 2>/dev/null || true
          RECOVERED="yes"
          sleep 15
        fi
        for svc in $(systemctl list-dependencies openchami.target --plain --no-pager 2>/dev/null); do
          state=$(systemctl is-active "$svc" 2>/dev/null || true)
          if [ "$state" = "failed" ]; then
            echo "Restarting failed service: $svc"
            systemctl reset-failed "$svc" 2>/dev/null || true
            systemctl restart "$svc" 2>/dev/null || true
            RECOVERED="yes"
          elif [ "$state" = "inactive" ]; then
            svc_type=$(systemctl show -p Type --value "$svc" 2>/dev/null || true)
            if [ "$svc_type" != "oneshot" ]; then
              echo "Restarting inactive service: $svc (type=$svc_type)"
              systemctl restart "$svc" 2>/dev/null || true
              RECOVERED="yes"
            fi
          fi
        done
        [ -z "$RECOVERED" ] && echo "ALL_SERVICES_OK" || true
      register: start_recovery_result
      changed_when: false
      failed_when: false
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Wait for recovered services to stabilize
      ansible.builtin.pause:
        seconds: 15
      when: "'ALL_SERVICES_OK' not in start_recovery_result.stdout | default('')"

    - name: Stop HAProxy to clear stale backend DNS cache
      ansible.builtin.systemd:
        name: haproxy.service
        state: stopped
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Start HAProxy with fresh backend DNS resolution
      ansible.builtin.systemd:
        name: haproxy.service
        state: started
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Wait for HAProxy to stabilize after restart
      ansible.builtin.pause:
        seconds: 10

    - name: Display v2.1 container start status
      ansible.builtin.debug:
        verbosity: 1
        msg: "v2.1 OpenCHAMI services started via openchami.target."
