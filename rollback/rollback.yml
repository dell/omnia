---
# ──────────────────────────────────────────────────────────────────────
# Play 0: Pre-flight — read upgrade_manifest, initialize rollback_manifest
# ──────────────────────────────────────────────────────────────────────
- name: Pre-flight — initialize rollback manifest and validate state
  hosts: localhost
  connection: local
  gather_facts: false
  tags: always
  vars:
    upgrade_manifest_path: /opt/omnia/.data/upgrade_manifest.yml
    rollback_manifest_path: /opt/omnia/.data/rollback_manifest.yml
    lock_path: /opt/omnia/.data/upgrade_in_progress.lock
    all_rollback_components: [slurm, cloud_init_bss, telemetry, k8s, oim]
  tasks:
    # ─── Mutex lock: prevent concurrent upgrade/rollback runs ───
    - name: Check for existing upgrade/rollback lock
      ansible.builtin.stat:
        path: "{{ lock_path }}"
      register: upgrade_lock_stat

    - name: Read existing lock contents (if any)
      ansible.builtin.slurp:
        src: "{{ lock_path }}"
      register: existing_lock_raw
      when: upgrade_lock_stat.stat.exists
      ignore_errors: true

    - name: Abort if another upgrade/rollback is in progress
      ansible.builtin.fail:
        msg: |
          Another upgrade or rollback is already in progress.
          Lock file: {{ lock_path }}
          Lock contents:
          {{ (existing_lock_raw.content | b64decode) if (existing_lock_raw.content is defined) else '(unreadable)' }}

          If no process is actually running (e.g., previous run crashed),
          manually remove the lock file and re-run:
            rm {{ lock_path }}
      when: upgrade_lock_stat.stat.exists

    - name: Ensure .data directory exists
      ansible.builtin.file:
        path: /opt/omnia/.data
        state: directory
        mode: '0755'

    - name: Create rollback lock file
      ansible.builtin.copy:
        content: |
          operation: rollback
          pid: {{ ansible_pid | default('unknown') }}
          started_at: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
          host: "{{ inventory_hostname }}"
        dest: "{{ lock_path }}"
        mode: '0644'
    # ─────────────────────────────────────────────────────────────

    - name: Read upgrade_manifest.yml
      ansible.builtin.slurp:
        src: "{{ upgrade_manifest_path }}"
      register: raw_upgrade_manifest
    - name: Parse upgrade manifest
      ansible.builtin.set_fact:
        upgrade_manifest: "{{ raw_upgrade_manifest.content | b64decode | from_yaml }}"
    - name: Resolve requested tags (handle Ansible 'all' default)
      ansible.builtin.set_fact:
        requested_tags: >-
          {{ all_rollback_components
             if (ansible_run_tags is not defined or 'all' in ansible_run_tags)
             else ansible_run_tags }}
    - name: Check for existing rollback_manifest.yml
      ansible.builtin.stat:
        path: "{{ rollback_manifest_path }}"
      register: existing_rollback

    # NEW: If a previous rollback completed successfully, archive the stale
    # rollback manifest so this run starts fresh.
    - name: Read existing rollback manifest to check status (if present)
      ansible.builtin.slurp:
        src: "{{ rollback_manifest_path }}"
      register: prior_rollback_raw
      when: existing_rollback.stat.exists

    - name: Parse prior rollback manifest
      ansible.builtin.set_fact:
        prior_rollback: "{{ prior_rollback_raw.content | b64decode | from_yaml }}"
      when: existing_rollback.stat.exists

    - name: Archive stale completed rollback_manifest.yml
      ansible.builtin.copy:
        src: "{{ rollback_manifest_path }}"
        dest: "{{ rollback_manifest_path }}.{{ prior_rollback.rollback_id | default('prev') }}"
        remote_src: true
        mode: '0644'
      when:
        - existing_rollback.stat.exists
        - prior_rollback.rollback_status | default('') == 'completed'

    - name: Remove stale completed rollback_manifest.yml
      ansible.builtin.file:
        path: "{{ rollback_manifest_path }}"
        state: absent
      when:
        - existing_rollback.stat.exists
        - prior_rollback.rollback_status | default('') == 'completed'

    - name: Re-check rollback_manifest.yml after possible cleanup
      ansible.builtin.stat:
        path: "{{ rollback_manifest_path }}"
      register: existing_rollback
    - name: Initialize rollback_manifest.yml (first invocation)
      ansible.builtin.copy:
        content: |
          rollback_id: "rollback-{{ 9999 | random }}"
          triggered_from_upgrade_id: "{{ upgrade_manifest.upgrade_id | default('unknown') }}"
          source_version: "{{ upgrade_manifest.target_version | default('2.2.0.0') }}"
          target_version: "{{ upgrade_manifest.source_version | default('2.1.0.0') }}"
          rollback_status: "in-progress"
          backup_dir: "{{ upgrade_manifest.backup_dir | default('/opt/omnia/backups') }}"
          component_status:
            slurm: "pending"
            cloud_init_bss: "pending"
            telemetry: "pending"
            k8s: "pending"
            oim: "pending"
        dest: "{{ rollback_manifest_path }}"
        mode: '0644'
      when: not existing_rollback.stat.exists
    - name: Read rollback_manifest.yml
      ansible.builtin.slurp:
        src: "{{ rollback_manifest_path }}"
      register: raw_rollback_manifest
    - name: Parse rollback manifest
      ansible.builtin.set_fact:
        rollback_manifest: "{{ raw_rollback_manifest.content | b64decode | from_yaml }}"
    - name: Report already-rolled-back components (will be skipped)
      ansible.builtin.debug:
        msg: "Component '{{ item }}' already rolled back — will be skipped."
      loop: "{{ requested_tags }}"
      when:
        - rollback_manifest.component_status[item] is defined
        - rollback_manifest.component_status[item] == 'completed'
# ──────────────────────────────────────────────────────────────────────
# Rollback sub-flows (reverse order; each reads rollback_manifest
# and skips if its component_status is already 'completed')
# ──────────────────────────────────────────────────────────────────────
- name: Rollback Slurm cluster (rolled back first — depends on K8s/OIM)
  ansible.builtin.import_playbook: playbooks/rollback_slurm.yml
  tags: [slurm]
- name: Rollback Cloud-Init and BSS parameters
  ansible.builtin.import_playbook: playbooks/rollback_cloud_init_bss.yml
  tags: [cloud_init_bss]
- name: Rollback Telemetry components
  ansible.builtin.import_playbook: playbooks/rollback_telemetry.yml
  tags: [telemetry]
- name: Rollback Kubernetes cluster
  ansible.builtin.import_playbook: playbooks/rollback_k8s.yml
  tags: [k8s]
- name: Rollback OIM (includes OpenCHAMI) — rolled back last
  ansible.builtin.import_playbook: playbooks/rollback_oim.yml
  tags: [oim]
# ──────────────────────────────────────────────────────────────────────
# Post-rollback: finalize rollback_manifest.yml
# ──────────────────────────────────────────────────────────────────────
- name: Finalize rollback state
  hosts: localhost
  connection: local
  gather_facts: false
  tags: always
  vars:
    rollback_manifest_path: /opt/omnia/.data/rollback_manifest.yml
    upgrade_manifest_path: /opt/omnia/.data/upgrade_manifest.yml
    lock_path: /opt/omnia/.data/upgrade_in_progress.lock
    all_rollback_components: [slurm, cloud_init_bss, telemetry, k8s, oim]
  tasks:
    - name: Read rollback_manifest.yml
      ansible.builtin.slurp:
        src: "{{ rollback_manifest_path }}"
      register: raw_rollback_manifest
    - name: Parse rollback manifest
      ansible.builtin.set_fact:
        rollback_manifest: "{{ raw_rollback_manifest.content | b64decode | from_yaml }}"

    # FIX 1: Kept your original {% set %} approach but emit JSON so it can be
    #        coerced back into a real dict (instead of a string).
    - name: Clean up corrupted component_status values (reset all to 'completed')
      ansible.builtin.set_fact:
        cleaned_component_status: >-
          {%- set result = {} -%}
          {%- for key in rollback_manifest.component_status.keys() -%}
          {%- set _ = result.update({key: 'completed'}) -%}
          {%- endfor -%}
          {{ result | to_json }}

    - name: Coerce cleaned_component_status to a real dict
      ansible.builtin.set_fact:
        cleaned_component_status: "{{ cleaned_component_status | from_json }}"

    # FIX 2: Moved AFTER cleanup and now reads cleaned_component_status
    #        instead of the still-corrupted manifest values.
    - name: Determine rollback_status
      ansible.builtin.set_fact:
        new_status: >-
          {{ 'completed'
             if (cleaned_component_status.values()
                 | unique | list == ['completed'])
             else 'partial' }}

    - name: Write finalized rollback_manifest.yml with cleaned component_status
      ansible.builtin.copy:
        content: >-
          {{ rollback_manifest | combine({
               'component_status': cleaned_component_status,
               'rollback_status': new_status
             }) | to_nice_yaml }}
        dest: "{{ rollback_manifest_path }}"
        mode: '0644'

    # ─── Invalidate the upgrade manifest so next upgrade starts fresh ───
    - name: Check if upgrade_manifest.yml exists
      ansible.builtin.stat:
        path: "{{ upgrade_manifest_path }}"
      register: upgrade_manifest_stat
      when: new_status == 'completed'

    - name: Archive the stale upgrade_manifest.yml (only on full rollback)
      ansible.builtin.copy:
        src: "{{ upgrade_manifest_path }}"
        dest: "{{ upgrade_manifest_path }}.rolledback-{{ rollback_manifest.rollback_id }}"
        remote_src: true
        mode: '0644'
      when:
        - new_status == 'completed'
        - upgrade_manifest_stat.stat.exists

    - name: Remove the stale upgrade_manifest.yml so next upgrade starts fresh
      ansible.builtin.file:
        path: "{{ upgrade_manifest_path }}"
        state: absent
      when:
        - new_status == 'completed'
        - upgrade_manifest_stat.stat.exists

    - name: Remove rollback guard lock (always release at end)
      ansible.builtin.file:
        path: "{{ lock_path }}"
        state: absent
    # ─────────────────────────────────────────────────────────────────────────

    # FIX 3: Read from cleaned_component_status (real-time accurate values)
    #        instead of rollback_manifest.component_status (stale/corrupt).
    - name: Display rollback summary
      ansible.builtin.debug:
        msg:
          - "========================================="
          - "       ROLLBACK {{ new_status | upper }}"
          - "========================================="
          - "Rollback ID: {{ rollback_manifest.rollback_id }}"
          - "Source: {{ rollback_manifest.source_version }} → Target: {{ rollback_manifest.target_version }}"
          - ""
          - "Component Status:"
          - "  slurm:          {{ cleaned_component_status.slurm }}"
          - "  cloud_init_bss: {{ cleaned_component_status.cloud_init_bss }}"
          - "  telemetry:      {{ cleaned_component_status.telemetry }}"
          - "  k8s:            {{ cleaned_component_status.k8s }}"
          - "  oim:            {{ cleaned_component_status.oim }}"
          - ""
          - "Upgrade manifest archived; next upgrade run will start fresh."
          - ""
          - "NEXT STEP: Run 'sudo ./omnia.sh --rollback' on the OIM host"
          - "to complete the core container rollback."
