---

- name: Rollback Telemetry components
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    rollback_manifest_path: /opt/omnia/.data/rollback_manifest.yml
    component_name: telemetry
  tasks:
    - name: Read rollback_manifest.yml
      ansible.builtin.slurp:
        src: "{{ rollback_manifest_path }}"
      register: raw_rollback_manifest

    - name: Parse rollback manifest
      ansible.builtin.set_fact:
        rollback_manifest: "{{ raw_rollback_manifest.content | b64decode | from_yaml }}"

    - name: Skip if telemetry already rolled back
      ansible.builtin.meta: end_play
      when:
        - rollback_manifest.component_status[component_name] | default('pending') == 'completed'

    - name: "Mark as skipped — BuildStream terminal gate active (C-24)"
      ansible.builtin.copy:
        content: >-
          {{ rollback_manifest | combine({
               'component_status': rollback_manifest.component_status | combine({
                 component_name: 'skipped'
               })
             }) | to_nice_yaml }}
        dest: "{{ rollback_manifest_path }}"
        mode: '0644'
      when:
        - hostvars['localhost']['build_stream_terminal'] | default(false) | bool

    - name: "Skip — BuildStream terminal gate active (C-24)"
      ansible.builtin.meta: end_play
      when:
        - hostvars['localhost']['build_stream_terminal'] | default(false) | bool

    - name: Set telemetry rollback status to in-progress
      ansible.builtin.copy:
        content: >-
          {{ rollback_manifest | combine({
               'component_status': rollback_manifest.component_status | combine({
                 component_name: 'in-progress'
               })
             }) | to_nice_yaml }}
        dest: "{{ rollback_manifest_path }}"
        mode: '0644'

    - name: "Display rollback status in-progress — {{ component_name }}"
      ansible.builtin.debug:
        msg: "[ROLLBACK] Component '{{ component_name }}' — status changed to: in-progress"

    # ── Telemetry rollback strategy ──────────────────────────────────
    # The K8s rollback (etcd snapshot restore) restores ALL Kubernetes objects
    # to their pre-upgrade (2.1) state, which includes all telemetry namespace
    # resources: Deployments, StatefulSets, Services, ConfigMaps, Secrets,
    # PVCs, Helm release secrets, and CRDs.
    #
    # 2.2-only components (vector-ldms, vector-ome, victoria-logs cluster,
    # victoria-metrics-operator CRDs, vlagent-vector, vmagent-vector) are
    # automatically removed because they did not exist in the etcd snapshot.
    #
    # Post-K8s-rollback telemetry pod verification is performed by
    # verify_telemetry_rollback.yml (Stage 8d) inside the rollback_k8s role.
    - name: "Telemetry rollback — handled by K8s rollback (etcd restore)"
      ansible.builtin.debug:
        msg:
          - "Telemetry rollback is handled by K8s rollback via etcd snapshot restore."
          - "The etcd snapshot contains the full 2.1 telemetry namespace state."
          - "2.2-only components will be removed automatically."
          - "Post-rollback telemetry pod verification runs in K8s rollback Stage 8d."

    - name: Mark telemetry rollback as completed
      ansible.builtin.copy:
        content: >-
          {{ rollback_manifest | combine({
               'component_status': rollback_manifest.component_status | combine({
                 component_name: 'completed'
               })
             }) | to_nice_yaml }}
        dest: "{{ rollback_manifest_path }}"
        mode: '0644'

    - name: "Display rollback status completed — {{ component_name }}"
      ansible.builtin.debug:
        msg: "[ROLLBACK] Component '{{ component_name }}' — status changed to: completed"
