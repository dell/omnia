---

- name: Rollback Telemetry components
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    rollback_manifest_path: /opt/omnia/.data/rollback_manifest.yml
    component_name: telemetry
  tasks:
    - name: Read rollback_manifest.yml
      ansible.builtin.slurp:
        src: "{{ rollback_manifest_path }}"
      register: raw_rollback_manifest

    - name: Parse rollback manifest
      ansible.builtin.set_fact:
        rollback_manifest: "{{ raw_rollback_manifest.content | b64decode | from_yaml }}"

    - name: Skip if telemetry already rolled back
      ansible.builtin.meta: end_play
      when:
        - rollback_manifest.component_status[component_name] | default('pending') == 'completed'

    - name: "Mark as skipped — BuildStream terminal gate active (C-24)"
      ansible.builtin.copy:
        content: >-
          {{ rollback_manifest | combine({
               'component_status': rollback_manifest.component_status | combine({
                 component_name: 'skipped'
               })
             }) | to_nice_yaml }}
        dest: "{{ rollback_manifest_path }}"
        mode: '0644'
      when:
        - hostvars['localhost']['build_stream_terminal'] | default(false) | bool

    - name: "Skip — BuildStream terminal gate active (C-24)"
      ansible.builtin.meta: end_play
      when:
        - hostvars['localhost']['build_stream_terminal'] | default(false) | bool

    - name: Set telemetry rollback status to in-progress
      ansible.builtin.copy:
        content: >-
          {{ rollback_manifest | combine({
               'component_status': rollback_manifest.component_status | combine({
                 component_name: 'in-progress'
               })
             }) | to_nice_yaml }}
        dest: "{{ rollback_manifest_path }}"
        mode: '0644'

    - name: "Display rollback status in-progress — {{ component_name }}"
      ansible.builtin.debug:
        msg: "[ROLLBACK] Component '{{ component_name }}' — status changed to: in-progress"

    # ── Telemetry rollback (Omnia 2.2 -> 2.1) per ESpec §4.8.5 ──
    # Script-based restore with ZERO data loss. The rollback_telemetry role:
    #   1. Resolves cluster coordinates (kube_vip, NFS path) from 2.1 inputs
    #   2. Pre-checks the upgrade backup (telemetry.sh + deployments + old PVCs)
    #   3. Reverses VictoriaMetrics operator -> 2.1 StatefulSet (data-preserving
    #      PVC rebind — the only granular step; restore alone cannot preserve it)
    #   4. Restores old 2.1 telemetry folder + telemetry.sh from backup
    #   5. Runs rollback_telemetry.sh: uninstalls NEW 2.2 components
    #      (PowerScale/CSM, VAST, UFM, VictoriaLogs) then re-runs the restored
    #      2.1 telemetry.sh (Kafka, VictoriaMetrics STS, iDRAC, LDMS)
    #   6. Verifies all telemetry pods Running and PVCs bound (data intact)
    - name: Execute telemetry rollback
      block:
        - name: Invoke rollback_telemetry role
          ansible.builtin.include_role:
            name: ../roles/rollback_telemetry

        - name: Mark telemetry rollback as completed
          ansible.builtin.copy:
            content: >-
              {{ rollback_manifest | combine({
                   'component_status': rollback_manifest.component_status | combine({
                     component_name: 'completed'
                   })
                 }) | to_nice_yaml }}
            dest: "{{ rollback_manifest_path }}"
            mode: '0644'

        - name: "Display rollback status completed — {{ component_name }}"
          ansible.builtin.debug:
            msg: "[ROLLBACK] Component '{{ component_name }}' — status changed to: completed"

      rescue:
        - name: Re-read rollback_manifest.yml after failure
          ansible.builtin.slurp:
            src: "{{ rollback_manifest_path }}"
          register: rescue_raw_rollback_manifest

        - name: Parse current manifest state
          ansible.builtin.set_fact:
            rescue_rollback_manifest: "{{ rescue_raw_rollback_manifest.content | b64decode | from_yaml }}"

        - name: Telemetry rollback failed — mark component as failed
          ansible.builtin.copy:
            content: >-
              {{ rescue_rollback_manifest | combine({
                   'component_status': rescue_rollback_manifest.component_status | combine({
                     component_name: 'failed'
                   })
                 }) | to_nice_yaml }}
            dest: "{{ rollback_manifest_path }}"
            mode: '0644'

        - name: Fail with telemetry rollback error
          ansible.builtin.fail:
            msg: >-
              Telemetry rollback failed. Status marked as 'failed' in manifest.
              Review the task output above. Pre-upgrade data on PVs is protected
              by the Retain reclaim policy set during the reversal.
