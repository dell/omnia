---
- name: Create oim group and provision group
  ansible.builtin.import_playbook: ../utils/create_container_group.yml
  vars:
    oim_group: true
  tags: always

- name: Slurm backup
  hosts: oim
  connection: ssh
  gather_facts: false
  vars:
    slurm_2_1_backup_dir: "/opt/omnia/backups/upgrade/version_2.1.0.0"
  roles:
    - role: upgrade_slurm
      tags: slurm
