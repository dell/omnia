# ===========================================================================
# Upgrade OpenCHAMI containers
#
# Mirrors the prepare_oim/roles/deploy_containers/openchami pattern:
#   - The openchami RPM is the single source of truth for quadlet files
#     (coresmd-coredns.container, coresmd-coredhcp.container, etc.)
#   - Ansible only deploys configuration files (Corefile, coredhcp.yaml)
#     using prepare_oim templates
#
# Flow:
#   1. Pull all target images
#   2. Download and install updated RPMs (brings new quadlet files)
#   3. Update image tags in all quadlet files
#   4. Load cluster config and deploy CoreDNS/CoreDHCP configs
#   5. Remove legacy coresmd quadlet and update openchami.target
#   6. Reload systemd daemon (apply all quadlet/target changes BEFORE restart)
#   7. Stop openchami.target, minio.service, and registry.service
#   8. Remove old containers (volumes preserved)
#   9. Start services and recover any failed services
#  10. Verify all critical containers are running
# ===========================================================================

- name: Upgrade OpenCHAMI containers
  block:
    # --- 1. Pull all target images ---
    - name: Pull new OpenCHAMI container images
      ansible.builtin.command: podman pull {{ item }}
      loop: "{{ openchami_target_images }}"
      register: pull_result
      retries: "{{ pull_image_retries }}"
      delay: "{{ pull_image_delay }}"
      until: pull_result.rc == 0
      changed_when: true
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    # --- 2. Download and install updated RPMs ---
    # The openchami RPM ships all quadlet files (coresmd-coredns.container,
    # coresmd-coredhcp.container, etc.) - no Ansible templates needed.
    - name: Create work directory for RPM downloads
      ansible.builtin.file:
        path: "{{ openchami_work_dir }}"
        state: directory
        mode: "{{ dir_permissions_755 }}"
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Download updated OpenCHAMI RPM
      ansible.builtin.command: curl -L -o {{ openchami_work_dir }}/{{ openchami_rpm_name }} {{ openchami_rpm_url }}
      register: download_openchami
      retries: "{{ max_retries }}"
      delay: "{{ max_delay }}"
      until: download_openchami.rc == 0
      changed_when: true
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Set permissions on downloaded OpenCHAMI RPM
      ansible.builtin.file:
        path: "{{ openchami_work_dir }}/{{ openchami_rpm_name }}"
        mode: "{{ dir_permissions_755 }}"
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Install updated OpenCHAMI RPM
      ansible.builtin.dnf:
        name: "{{ openchami_work_dir }}/{{ openchami_rpm_name }}"
        state: present
        disable_gpg_check: true
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Download updated ochami CLI RPM
      ansible.builtin.command: curl -L -o {{ openchami_work_dir }}/{{ ochami_client_rpm_name }} {{ ochami_client_rpm_url }}
      register: download_ochami
      retries: "{{ max_retries }}"
      delay: "{{ max_delay }}"
      until: download_ochami.rc == 0
      changed_when: true
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Set permissions on downloaded ochami CLI RPM
      ansible.builtin.file:
        path: "{{ openchami_work_dir }}/{{ ochami_client_rpm_name }}"
        mode: "{{ dir_permissions_755 }}"
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Install updated ochami CLI RPM
      ansible.builtin.dnf:
        name: "{{ openchami_work_dir }}/{{ ochami_client_rpm_name }}"
        state: present
        disable_gpg_check: true
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    # --- 3. Update image tags in all quadlet files (override RPM defaults) ---
    - name: Update image tags in systemd quadlet files
      ansible.builtin.lineinfile:
        path: "/etc/containers/systemd/{{ item.file }}"
        regexp: '^Image=.*'
        line: "Image={{ item.image }}"
        state: present
      loop: "{{ openchami_quadlet_updates }}"
      delegate_to: oim
      delegate_facts: true
      connection: ssh
      failed_when: false

    # --- 4. Load cluster config and deploy service configs ---
    # Follows prepare_oim pattern: only deploy configuration files,
    # reusing templates from prepare_oim/roles/deploy_containers/openchami/templates
    - name: Ensure OpenCHAMI config directory exists
      ansible.builtin.file:
        path: "{{ openchami_config_dir }}"
        state: directory
        owner: root
        group: root
        mode: "{{ dir_permissions_755 }}"
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Check if configs_vars.yaml exists
      ansible.builtin.stat:
        path: "{{ openchami_config_vars_path }}"
      register: config_vars_stat
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Load cluster-specific config variables
      ansible.builtin.slurp:
        src: "{{ openchami_config_vars_path }}"
      register: config_vars_raw
      when: config_vars_stat.stat.exists
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Parse cluster config variables
      ansible.builtin.set_fact:
        cluster_config: "{{ config_vars_raw.content | b64decode | from_yaml }}"
      when: config_vars_stat.stat.exists

    - name: Set cluster variables from config
      ansible.builtin.set_fact:
        cluster_name: "{{ cluster_config.cluster_name | default('openchami') }}"
        cluster_domain: "{{ cluster_config.cluster_domain | default('cluster.local') }}"
        cluster_boot_ip: "{{ cluster_config.cluster_boot_ip | default('') }}"
        cluster_boot_interface: "{{ cluster_config.cluster_boot_interface | default('') }}"
        cluster_shortname: "{{ cluster_config.cluster_shortname | default('node') }}"
        cluster_nidlength: "{{ cluster_config.cluster_nidlength | default('3') }}"
        ochami_base_url: "https://{{ cluster_config.cluster_name | default('openchami') }}.{{ cluster_config.cluster_domain | default('cluster.local') }}:8443"
        coredhcp_netmask: "{{ cluster_config.coredhcp_netmask | default('255.255.255.0') }}"
        coredhcp_lease_duration: "{{ cluster_config.coredhcp_lease_duration | default('24h') }}"
        coredhcp_dhcp_pool: "{{ cluster_config.coredhcp_dhcp_pool | default('') }}"
      when: config_vars_stat.stat.exists

    - name: Deploy updated CoreDNS Corefile
      ansible.builtin.template:
        src: "{{ prepare_oim_templates_path }}/coredns/Corefile.j2"
        dest: "{{ openchami_config_dir }}/Corefile"
        owner: root
        group: root
        mode: "{{ file_permissions_644 }}"
      when: config_vars_stat.stat.exists
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Deploy updated CoreDHCP config
      ansible.builtin.template:
        src: "{{ prepare_oim_templates_path }}/coredhcp/coredhcp.yaml.j2"
        dest: "{{ openchami_config_dir }}/coredhcp.yaml"
        owner: root
        group: root
        mode: "{{ file_permissions_644 }}"
      when:
        - config_vars_stat.stat.exists
        - cluster_boot_interface | default('') | length > 0
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    # --- 5. Remove legacy coresmd quadlet and update openchami.target ---
    # Done BEFORE daemon-reload so systemd picks up the target changes
    - name: Remove legacy coresmd quadlet file from omnia-2.1
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ openchami_legacy_quadlet_files }}"
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Update openchami.target to replace coresmd.service with split services
      ansible.builtin.replace:
        path: /etc/systemd/system/openchami.target
        regexp: 'coresmd\.service'
        replace: 'coresmd-coredhcp.service coresmd-coredns.service'
      delegate_to: oim
      delegate_facts: true
      connection: ssh
      failed_when: false

    # --- 6. Reload systemd daemon ---
    # MUST happen BEFORE stop/remove/start so systemd uses the NEW quadlet
    # definitions (updated image tags, new coresmd split containers, etc.).
    # Without this, systemd auto-restarts killed containers using stale
    # cached unit definitions with old image tags.
    - name: Reload systemd daemon to apply all quadlet and target changes
      ansible.builtin.systemd:
        daemon_reload: true
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    # --- 7. Stop services ---
    # registry.service and minio.service run under omnia.target (not
    # openchami.target), so they must be stopped explicitly.
    - name: Stop OpenCHAMI services
      ansible.builtin.systemd:
        name: openchami.target
        state: stopped
      delegate_to: oim
      delegate_facts: true
      connection: ssh
      failed_when: false

    - name: Stop MinIO service for image upgrade
      ansible.builtin.systemd:
        name: minio.service
        state: stopped
      delegate_to: oim
      delegate_facts: true
      connection: ssh
      failed_when: false

    - name: Stop registry service for image upgrade
      ansible.builtin.systemd:
        name: registry.service
        state: stopped
      delegate_to: oim
      delegate_facts: true
      connection: ssh
      failed_when: false

    - name: Wait for containers to stop
      ansible.builtin.pause:
        seconds: 10

    # --- 8. Remove old containers (preserve volumes) ---
    - name: Remove current OpenCHAMI containers (preserve volumes)
      ansible.builtin.command: podman rm -f {{ item.container }}
      loop: "{{ openchami_containers }}"
      register: remove_result
      changed_when: true
      failed_when: false
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Remove MinIO container for image upgrade
      ansible.builtin.command: podman rm -f minio-server
      changed_when: true
      failed_when: false
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Remove legacy coresmd container from omnia-2.1
      ansible.builtin.command: podman rm -f {{ item }}
      loop: "{{ openchami_legacy_containers }}"
      register: remove_legacy
      changed_when: true
      failed_when: false
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    # --- 9. Start services and recover any failed services ---
    - name: Start OpenCHAMI services with new images
      ansible.builtin.systemd:
        name: openchami.target
        state: started
        enabled: true
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Start MinIO service with new image
      ansible.builtin.systemd:
        name: minio.service
        state: started
        enabled: true
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Start registry service with new image
      ansible.builtin.systemd:
        name: registry.service
        state: started
        enabled: true
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Wait for services to stabilize
      ansible.builtin.pause:
        seconds: "{{ wait_time }}"

    # Recover any openchami services that failed initial startup
    # (e.g. coresmd-coredns may fail if haproxy wasn't ready yet)
    - name: Reset any failed openchami services
      ansible.builtin.command: systemctl reset-failed
      changed_when: true
      failed_when: false
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Restart openchami.target to recover failed services
      ansible.builtin.systemd:
        name: openchami.target
        state: restarted
        enabled: true
        daemon_reload: true
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Wait for restarted services to stabilize
      ansible.builtin.pause:
        seconds: "{{ wait_time }}"

    # --- 10. Verify all critical containers are running ---
    - name: Verify all post-upgrade critical containers are running
      ansible.builtin.command: podman ps --filter "name=^{{ item }}$" --format '{% raw %}{{.Names}}{% endraw %}'
      loop: "{{ openchami_post_upgrade_critical_containers }}"
      register: verify_running
      changed_when: false
      failed_when: verify_running.stdout | length == 0
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Verify MinIO container is running with updated image
      ansible.builtin.command: podman ps --filter "name=^minio-server$" --format '{% raw %}{{.Names}}{% endraw %}'
      register: verify_minio
      changed_when: false
      failed_when: verify_minio.stdout | length == 0
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Verify registry container is running with updated image
      ansible.builtin.command: podman ps --filter "name=^registry$" --format '{% raw %}{{.Names}}{% endraw %}'
      register: verify_registry
      changed_when: false
      failed_when: verify_registry.stdout | length == 0
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Display container upgrade success
      ansible.builtin.debug:
        msg: "{{ upgrade_messages.container_upgrade.success }}"

  rescue:
    - name: Container upgrade failed
      ansible.builtin.fail:
        msg: "{{ upgrade_messages.container_upgrade.failure }} {{ upgrade_messages.troubleshooting.container_upgrade_diagnosis }}"
