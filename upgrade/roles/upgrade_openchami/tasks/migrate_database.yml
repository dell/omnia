# ============================================================================
# migrate_database.yml — Post-Upgrade Database Migration & Integrity Check
# ============================================================================
# Runs AFTER containers have been restarted with new images.
# Validates database schema and verifies data integrity by comparing
# pre-upgrade baselines.
#
# The HMS database (hmsds) may require schema updates when SMD is upgraded.
# SMD applies its own migrations on startup — this task file verifies they
# completed successfully and validates the result.
#
# Flow:
#   1. Wait for PostgreSQL readiness
#   2. Verify core schema objects exist (components, etc. in public schema)
#   3. Inspect SMD logs for migration failures
#   4. Validate data integrity (node count, component count)
#   5. Report migration status
# ============================================================================

- name: Post-upgrade database migration and integrity check
  block:
    # ── Retrieve PostgreSQL credentials if not already set ─────────────
    - name: Retrieve PostgreSQL credentials
      ansible.builtin.include_tasks: retrieve_postgres_credentials.yml

    # ── Read manifest for backup directory ─────────────────────────────
    - name: Read upgrade_manifest.yml for backup_dir
      ansible.builtin.slurp:
        src: "{{ manifest_path }}"
      register: migration_raw_manifest

    - name: Parse manifest for backup_dir
      ansible.builtin.set_fact:
        migration_backup_dir: "{{ (migration_raw_manifest.content | b64decode | from_yaml).backup_dir | default(openchami_backup_dir_default) }}"

    # ── Verify postgres container is running before waiting ─────────────
    - name: Check postgres container status
      ansible.builtin.shell: |
        set -o pipefail
        podman inspect --format '{{ '{{' }}.State.Status{{ '}}' }}' postgres 2>/dev/null || echo "not_found"
      register: pg_container_check
      changed_when: false
      failed_when: false
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Attempt to start postgres service if container is not running
      when: pg_container_check.stdout | default('not_found') | trim != 'running'
      block:
        - name: Display postgres container status
          ansible.builtin.debug:
            msg: >-
              Postgres container status: {{ pg_container_check.stdout | default('not_found') | trim }}.
              Attempting to start postgres.service...

        - name: Start postgres service
          ansible.builtin.systemd:
            name: postgres.service
            state: started
            daemon_reload: true
          failed_when: false
          delegate_to: oim
          delegate_facts: true
          connection: ssh

        - name: Wait for postgres container to initialize
          ansible.builtin.pause:
            seconds: 15

    # ── Wait for PostgreSQL to be fully ready ──────────────────────────
    - name: Wait for PostgreSQL to accept connections
      ansible.builtin.shell: |
        set -o pipefail
        for i in $(seq 1 {{ db_migration_max_wait_attempts }}); do
          status=$(podman inspect --format '{{ '{{' }}.State.Status{{ '}}' }}' postgres 2>/dev/null || echo "not_found")
          if [ "$status" != "running" ]; then
            echo "attempt $i/{{ db_migration_max_wait_attempts }}: container status=$status"
            sleep {{ db_migration_wait_interval }}
            continue
          fi
          if podman exec postgres pg_isready -U {{ postgres_db_user }} -d {{ postgres_db_name }} 2>/dev/null; then
            echo "ready"
            exit 0
          fi
          sleep {{ db_migration_wait_interval }}
        done
        echo "timeout after {{ db_migration_max_wait_attempts }} attempts"
        echo "--- container status ---"
        podman inspect --format \
          'status={{ '{{' }}.State.Status{{ '}}' }} started={{ '{{' }}.State.StartedAt{{ '}}' }}' \
          postgres 2>&1 || echo "container not found"
        echo "--- postgres logs (last 30 lines) ---"
        podman logs postgres --tail 30 2>&1 || echo "no logs available"
        echo "--- systemctl status postgres.service ---"
        systemctl status postgres.service --no-pager 2>&1 | head -10 || true
        exit 1
      register: pg_ready_result
      changed_when: false
      failed_when: pg_ready_result.rc != 0
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    # ── Restore from pg_dump after PostgreSQL major version upgrade ──
    # If upgrade_openchami_containers.yml detected a PG version mismatch
    # (e.g. PG 11 → PG 17), the data volume was cleared and PG 17
    # initialized fresh. Restore the pre-upgrade pg_dump backup now.
    #
    # Path mapping: omnia_core sees /opt/omnia (bind mount), but the OIM
    # host uses ${oim_shared_path}/omnia. podman cp runs on OIM, so we
    # must resolve the OIM host-side path for the backup file.
    - name: Read oim_metadata.yml for shared path (pg_dump restore)
      ansible.builtin.slurp:
        src: "{{ oim_metadata_path }}"
      register: restore_oim_metadata_raw
      when: postgres_major_upgrade | default(false) | bool

    - name: Resolve OIM host-side backup path for pg_dump restore
      ansible.builtin.set_fact:
        oim_host_pgdump_path: >-
          {{ migration_backup_dir |
             regex_replace('^/opt/omnia',
               (restore_oim_metadata_raw.content | b64decode | from_yaml).oim_shared_path
               | regex_replace('/$', '') ~ '/omnia')
          }}/openchami/postgresql_backup/openchami.sql
      when: postgres_major_upgrade | default(false) | bool

    - name: Locate pg_dump backup for restore (on OIM host)
      ansible.builtin.stat:
        path: "{{ oim_host_pgdump_path }}"
      register: pgdump_backup_stat
      delegate_to: oim
      delegate_facts: true
      connection: ssh
      when: postgres_major_upgrade | default(false) | bool

    - name: Restore database from pg_dump backup (PG major version upgrade)
      when:
        - postgres_major_upgrade | default(false) | bool
        - pgdump_backup_stat.stat.exists | default(false)
      block:
        - name: Display pg_dump restore start
          ansible.builtin.debug:
            msg: >-
              Restoring database from pg_dump backup after PG major version upgrade
              (PG {{ pg_existing_version | default('?') }} → PG 17).
              OIM host backup: {{ oim_host_pgdump_path }}

        - name: Copy pg_dump backup to postgres container
          ansible.builtin.command: >-
            podman cp
            {{ oim_host_pgdump_path }}
            postgres:/tmp/openchami_restore.sql
          changed_when: true
          delegate_to: oim
          delegate_facts: true
          connection: ssh

        - name: Restore pg_dump into PostgreSQL 17
          ansible.builtin.shell: |
            set -o pipefail
            podman exec postgres psql -U {{ postgres_db_user }} -d {{ postgres_db_name }} \
              -f /tmp/openchami_restore.sql 2>&1 | tail -20
          register: pgdump_restore_result
          changed_when: true
          failed_when: false
          delegate_to: oim
          delegate_facts: true
          connection: ssh

        - name: Clean up restore file from container
          ansible.builtin.command: podman exec postgres rm -f /tmp/openchami_restore.sql
          changed_when: false
          failed_when: false
          delegate_to: oim
          delegate_facts: true
          connection: ssh

        - name: Display pg_dump restore result
          ansible.builtin.debug:
            msg: >-
              pg_dump restore completed.
              Output: {{ pgdump_restore_result.stdout | default('') | truncate(500) }}
              {{ 'Errors: ' + pgdump_restore_result.stderr | truncate(300)
                 if pgdump_restore_result.stderr | default('') | length > 0
                 else 'No errors reported.' }}

        - name: Wait for SMD to pick up restored schema
          ansible.builtin.pause:
            seconds: 15

    - name: Warn if pg_dump backup not found for major version upgrade
      ansible.builtin.debug:
        msg: >-
          WARNING: PostgreSQL major version upgrade detected but pg_dump backup
          not found at {{ oim_host_pgdump_path | default('unknown') }}.
          The database will be empty. Previously provisioned nodes may need to be re-provisioned.
      when:
        - postgres_major_upgrade | default(false) | bool
        - not (pgdump_backup_stat.stat.exists | default(false))

    # ── Verify core HMS schema objects ─────────────────────────────
    # SMD creates tables in the 'public' schema on first startup.
    # For prepare_oim-only setups, tables may exist but be empty.
    # For fresh upgrades, SMD may still be initializing its schema.
    - name: Verify HMS core schema tables exist
      ansible.builtin.shell: |
        set -o pipefail
        podman exec postgres psql -U {{ postgres_db_user }} -d {{ postgres_db_name }} -t -c "
          SELECT tablename FROM pg_tables
          WHERE schemaname NOT IN ('pg_catalog', 'information_schema')
          ORDER BY tablename;
        " 2>&1
      register: schema_tables
      changed_when: false
      failed_when: false
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Set schema status flags
      ansible.builtin.set_fact:
        smd_schema_initialized: "{{ 'components' in schema_tables.stdout | default('') }}"
        smd_schema_tables: "{{ schema_tables.stdout | default('') | trim }}"

    - name: Display schema check result
      ansible.builtin.debug:
        verbosity: 1
        msg: >-
          HMS schema check:
          {{ 'components table found — schema initialized' if smd_schema_initialized | bool
             else 'components table NOT found — SMD may still be initializing or this is a fresh install' }}.
          Tables found: {{ smd_schema_tables if smd_schema_tables | length > 0 else 'none' }}

    # ── Check for pending SMD schema migrations ────────────────────
    # SMD applies its own migrations on startup. Verify it completed
    # by checking the SMD container logs for migration success markers.
    - name: Check SMD startup logs for migration status
      ansible.builtin.shell: |
        set -o pipefail
        podman logs smd --since "5m" 2>&1 | tail -100
      register: smd_logs
      changed_when: false
      failed_when: false
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Detect SMD migration failures in logs
      ansible.builtin.debug:
        msg: >-
          WARNING: SMD logs may indicate a migration issue:
          {{ smd_logs.stdout | default('') | truncate(500) }}
          Check full logs: podman logs smd
      when:
        - smd_logs.stdout is defined
        - "'FATAL' in smd_logs.stdout or 'migration failed' in (smd_logs.stdout | lower)"

    # ── Validate data integrity ────────────────────────────────────
    # Query node count from the 'components' table in the public schema.
    # For prepare_oim-only scenarios, the table may be empty (0 rows) or
    # may not exist yet if SMD is still initializing.
    - name: Query post-migration node count
      ansible.builtin.shell: |
        set -o pipefail
        podman exec postgres psql -U {{ postgres_db_user }} -d {{ postgres_db_name }} -t -c \
          "SELECT COUNT(*) FROM components;" 2>/dev/null || echo "0"
      register: post_migration_node_count
      changed_when: false
      failed_when: false
      delegate_to: oim
      delegate_facts: true
      connection: ssh

    - name: Verify node count preserved across migration
      ansible.builtin.debug:
        verbosity: 2
        msg: >-
          Node count check —
          Pre-upgrade: {{ pre_upgrade_node_count | default('0') | trim }},
          Post-migration: {{ post_migration_node_count.stdout | default('0') | trim }}.
          {{ 'OK — count preserved or increased.'
             if (post_migration_node_count.stdout | default('0') | trim | int) >= (pre_upgrade_node_count | default('0') | trim | int)
             else 'WARNING: count decreased. Review SMD logs if nodes were expected.' }}

    - name: Warn if node count decreased after migration
      ansible.builtin.debug:
        verbosity: 2
        msg: >-
          WARNING: Node count decreased from {{ pre_upgrade_node_count | default('0') | trim }}
          to {{ post_migration_node_count.stdout | default('0') | trim }}.
          This may indicate data loss. If nodes were provisioned before upgrade,
          consider restoring from pg_dump backup.
      when:
        - pre_upgrade_node_count is defined
        - (pre_upgrade_node_count | default('0') | trim | int) > 0
        - (post_migration_node_count.stdout | default('0') | trim | int) < (pre_upgrade_node_count | default('0') | trim | int)

    # ── Report migration summary ───────────────────────────────────────
    - name: Display database migration summary
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════"
          - "  DATABASE MIGRATION COMPLETED"
          - "════════════════════════════════════════════"
          - "PostgreSQL: ready"
          - >-
            HMS schema: {{ 'initialized (components table found)' if smd_schema_initialized
            | default(false) | bool else 'tables not yet populated' }}
          - >-
            SMD startup: {{ 'no migration failures detected' if smd_logs.stdout is not defined
            or ('FATAL' not in smd_logs.stdout | default('') and 'migration failed' not in
            (smd_logs.stdout | default('') | lower)) else 'WARNING — check podman logs smd' }}
          - "SMD/BSS API: checked in post-upgrade health check"

  rescue:
    - name: Database migration failed
      ansible.builtin.fail:
        msg: >-
          Database migration or integrity check failed after container upgrade.
          Pre-upgrade backup is available at: {{ migration_backup_dir }}/openchami/postgresql_backup/openchami.sql
          To restore: podman exec -i postgres psql -U {{ postgres_db_user }} -d {{ postgres_db_name }} < openchami.sql
          {{ upgrade_messages.troubleshooting.container_upgrade_diagnosis }}
