---
# ============================================================================
# Install / upgrade VictoriaMetrics operator via Helm
# ============================================================================

- name: Check if VictoriaMetrics CRDs exist
  ansible.builtin.shell: |
    kubectl get crd | grep victoriametrics | wc -l
  register: vm_crd_count
  changed_when: false
  failed_when: false
  delegate_to: "{{ kube_vip }}"
  connection: ssh

- name: Remove finalizers from VictoriaMetrics CRDs (prevents hang on rerun after failed upgrade)
  ansible.builtin.shell: |
    set -o pipefail
    kubectl get crd | grep victoriametrics | awk '{print $1}' | while read crd; do
      kubectl patch crd "$crd" --type=json \
        -p='[{"op": "remove", "path": "/metadata/finalizers"}]' 2>/dev/null || true
    done
  register: crd_finalizer_remove
  changed_when: true
  failed_when: false
  timeout: 30
  when: vm_crd_count.stdout | int > 0
  delegate_to: "{{ kube_vip }}"
  connection: ssh

- name: Delete existing VictoriaMetrics CRDs
  ansible.builtin.shell: |
    set -o pipefail
    kubectl get crd | grep victoriametrics | awk '{print $1}' | \
      xargs -r kubectl delete crd --timeout=30s 2>/dev/null || true
  register: crd_delete_result
  changed_when: true
  failed_when: false
  timeout: 60
  when: vm_crd_count.stdout | int > 0
  delegate_to: "{{ kube_vip }}"
  connection: ssh

- name: Verify VictoriaMetrics CRDs are deleted
  ansible.builtin.shell: |
    kubectl get crd | grep victoriametrics | wc -l
  register: vm_crd_remaining
  changed_when: false
  failed_when: false
  delegate_to: "{{ kube_vip }}"
  connection: ssh

- name: Display CRD cleanup status
  ansible.builtin.debug:
    msg: "VictoriaMetrics CRDs remaining: {{ vm_crd_remaining.stdout | default('0') }}"

- name: Install VictoriaMetrics operator from tarball
  ansible.builtin.command:
    cmd: >
      helm upgrade --install {{ victoria_operator_release_name }}
      {{ telemetry_deploy_dir }}/{{ victoria_operator_pkg }}.tar.gz
      --namespace {{ telemetry_namespace }}
      --create-namespace
      --wait
  register: helm_install_result
  changed_when: true
  delegate_to: "{{ kube_vip }}"
  connection: ssh

- name: Wait for operator pods to be ready
  ansible.builtin.command:
    cmd: >
      kubectl wait --for=condition=ready --timeout=300s
      pod -l app.kubernetes.io/name=victoria-metrics-operator -n {{ telemetry_namespace }}
  changed_when: false
  delegate_to: "{{ kube_vip }}"
  connection: ssh
  register: operator_wait_result
  until: operator_wait_result.rc == 0
  retries: 10
  delay: 30

- name: Wait for VictoriaMetrics CRDs to be ready
  ansible.builtin.command:
    cmd: kubectl get crd {{ item }}
  loop:
    - vmclusters.operator.victoriametrics.com
    - vmagents.operator.victoriametrics.com
    - vmpodscrapes.operator.victoriametrics.com
    - vmsingles.operator.victoriametrics.com
  register: crd_check
  until: crd_check.rc == 0
  retries: 60
  delay: 2
  changed_when: false
  failed_when: false
  delegate_to: "{{ kube_vip }}"
  connection: ssh

- name: Display operator status
  ansible.builtin.debug:
    msg: "{{ victoria_operator_installed }}"
