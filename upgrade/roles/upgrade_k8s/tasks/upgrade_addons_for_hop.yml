---
# Upgrade addons (Calico, MetalLB, Helm) for a single hop
# This is called from the playbook after control planes are upgraded
#
# Required variables:
#   - current_hop: The hop dict with from_minor, to_version, artifacts_dir
#   - hop_idx: The 0-based index of this hop

# ── Starting addon upgrade ───────────────────────────────────────
- name: "hop {{ hop_idx + 1 }} [{{ current_hop.to_version }}] — Starting addon upgrade"
  ansible.builtin.debug:
    msg: |
      ═══════════════════════════════════════════════════════════════════════════
      All control planes have been upgraded to {{ current_hop.to_version }}.
      Proceeding with addon upgrades (Calico, MetalLB, Helm)...
      ═══════════════════════════════════════════════════════════════════════════
  when:
    - upgrade_status.addon_upgrade.status | default('pending') != 'completed'
    - upgrade_status.upgrade.status != 'completed'

# ── Upgrade addons ───────────────────────────────────────────────
- name: "hop {{ hop_idx + 1 }} [{{ current_hop.to_version }}] — Upgrade addons"
  ansible.builtin.include_tasks: upgrade_addons.yml
  when:
    - upgrade_status.addon_upgrade.status | default('pending') != 'completed'
    - upgrade_status.upgrade.status != 'completed'
