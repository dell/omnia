---

- name: Generate OChami access token for BSS rollback
  delegate_to: "{{ oim_host }}"
  ansible.builtin.command:
    cmd: bash -lc 'gen_access_token'
  register: bss_rollback_token
  changed_when: false
  retries: 3
  delay: 5
  until: bss_rollback_token.rc == 0 and bss_rollback_token.stdout not in ["", "null"]

- name: Set BSS rollback paths for {{ bss_group }}
  ansible.builtin.set_fact:
    bss_rollback_base: "http://{{ minio_ip }}:{{ minio_port }}/{{ minio_bucket }}/boot-images/k8s-{{ rollback_version }}/{{ bss_group }}"

- name: Rollback BSS boot parameters for {{ bss_group }}
  delegate_to: "{{ oim_host }}"
  ansible.builtin.command:
    cmd: >-
      ochami bss bootparams set
      --group {{ bss_group }}
      --kernel {{ bss_rollback_base }}/vmlinuz
      --initrd {{ bss_rollback_base }}/initrd.img
      --params "root=live:{{ bss_rollback_base }}/image.squashfs rd.live.image rd.live.ram"
  environment:
    OCHAMI_ACCESS_TOKEN: "{{ bss_rollback_token.stdout }}"
  register: bss_rollback_result

- name: Display BSS rollback result for {{ bss_group }}
  ansible.builtin.debug:
    msg: "BSS rollback for {{ bss_group }}: {{ 'OK' if bss_rollback_result.rc == 0 else 'FAILED' }}"
