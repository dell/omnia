---

- name: Generate upgrade repo file content
  ansible.builtin.set_fact:
    repo_content: |
      # Omnia K8s Upgrade Repository Configuration
      # Generated by upgrade playbook for K8s {{ k8s_target_version }}
      # This file configures access to Pulp repositories for upgrade packages

      [x86_64_rhel_{{ cluster_os_version }}_kubernetes-v{{ k8s_target_minor | replace('.', '-') }}]
      name=Kubernetes {{ k8s_target_version }} Repository
      baseurl={{ pulp_repo_base }}/x86_64_rhel_{{ cluster_os_version }}_kubernetes-v{{ k8s_target_minor | replace('.', '-') }}/
      enabled=1
      gpgcheck=0

      [x86_64_rhel_{{ cluster_os_version }}_cri-o-v{{ k8s_target_minor | replace('.', '-') }}]
      name=CRI-O {{ k8s_target_version }} Repository
      baseurl={{ pulp_repo_base }}/x86_64_rhel_{{ cluster_os_version }}_cri-o-v{{ k8s_target_minor | replace('.', '-') }}/
      enabled=1
      gpgcheck=0

- name: Deploy upgrade repo file to {{ current_node_name }}
  ansible.builtin.copy:
    content: "{{ repo_content }}"
    dest: "{{ repo_file_path }}"
    mode: "{{ file_perm_644 }}"
  delegate_to: "{{ current_node_ip }}"
