---
# Detect the upgrade hop chain from the current cluster version to the target.
# This version runs on localhost and uses pre-detected version info.
#
# Inputs:
#   k8s_from_version   — current cluster version (e.g. "1.34.1")
#   k8s_from_minor     — current cluster minor (e.g. "1.34")
#   upgrade_paths_file — path to upgrade_paths.yml (default: role path)
#
# Outputs (set_fact):
#   hop_chain         — list of dicts: [{from_minor, to_version, artifacts_dir}, ...]
#   is_multi_hop      — boolean, true if chain has > 1 hop

# ── Load upgrade paths ──────────────────────────────────────────────
- name: Load upgrade_paths.yml
  ansible.builtin.include_vars:
    file: "{{ upgrade_paths_file }}"
    name: _upgrade_paths_data

- name: Set upgrade_paths dict
  ansible.builtin.set_fact:
    _upgrade_paths: "{{ _upgrade_paths_data.upgrade_paths }}"

# ── Load upgrade status if available ─────────────────────────────────
- name: Check if upgrade status file exists on kube_vip
  ansible.builtin.stat:
    path: "{{ status_file }}"
  delegate_to: "{{ kube_vip }}"
  register: _status_check

- name: Copy upgrade status file from kube_vip to local temp file
  ansible.builtin.fetch:
    src: "{{ status_file }}"
    dest: "{{ upgrade_status_temp_yml }}"
    flat: true
  delegate_to: "{{ kube_vip }}"
  when: _status_check.stat.exists | default(false)

- name: Load upgrade status from temp file
  ansible.builtin.include_vars:
    file: "{{ upgrade_status_temp_yml }}"
    name: upgrade_status
  when: _status_check.stat.exists | default(false)

- name: Clean up temp file
  ansible.builtin.file:
    path: "{{ upgrade_status_temp_yml }}"
    state: absent
  when: _status_check.stat.exists | default(false)

- name: Set upgrade_status to empty dict if not available or parsing failed
  ansible.builtin.set_fact:
    upgrade_status: {}
  when: upgrade_status is not defined or upgrade_status is string or upgrade_status is not mapping

# ── Determine target minor version ─────────────────────────────────
- name: Set target minor from k8s_target_version
  ansible.builtin.set_fact:
    _target_minor: "{{ k8s_target_version | regex_replace('\\.[0-9]+$', '') }}"

# ── Build hop chain using Python script ─────────────────────────────
- name: Create temporary Python script for hop chain detection
  ansible.builtin.copy:
    content: |
      import json
      import sys
      
      paths = json.loads(sys.argv[1])
      current = sys.argv[2]
      target = sys.argv[3]
      chain = []
      seen = set()
      
      while current != target:
          if current in seen:
              print(json.dumps({"error": "Cycle detected at " + current}))
              sys.exit(0)
          seen.add(current)
          if current not in paths:
              print(json.dumps({"error": "No upgrade path from " + current}))
              sys.exit(0)
          entry = paths[current]
          chain.append({
              "from_minor": current,
              "to_version": entry["next_version"],
              "artifacts_dir": entry["artifacts_dir"]
          })
          current = ".".join(entry["next_version"].split(".")[:2])
      
      print(json.dumps(chain))
    dest: "{{ detect_hop_chain_script }}"
    mode: '0755'

- name: Check if current hop is already completed in hop_status
  ansible.builtin.set_fact:
    _hop_already_completed: "{{ ((upgrade_status.hop_status | default({}))[k8s_target_version] | default({})).status | default('') == 'completed' }}"
  when: 
    - upgrade_status is defined
    - upgrade_status is mapping
    - upgrade_status.hop_status is defined

- name: Set hop_already_completed to false if upgrade_status not loaded yet
  ansible.builtin.set_fact:
    _hop_already_completed: false
  when: upgrade_status is not defined or upgrade_status is not mapping or upgrade_status.hop_status is not defined

- name: Check if there are pending nodes in the current hop
  ansible.builtin.set_fact:
    _hop_has_pending_nodes: "{{ (upgrade_status.hop_status | default({}))[k8s_target_version] | default({}).nodes_pending | default([]) | length > 0 }}"
  when: 
    - upgrade_status is defined
    - upgrade_status is mapping
    - upgrade_status.hop_status is defined

- name: Set hop_has_pending_nodes to false if upgrade_status not loaded yet
  ansible.builtin.set_fact:
    _hop_has_pending_nodes: false
  when: upgrade_status is not defined or upgrade_status is not mapping or upgrade_status.hop_status is not defined

- name: Use original from_version if there are pending nodes
  ansible.builtin.set_fact:
    _hop_from_minor: "{{ (upgrade_status.upgrade.from_version | regex_replace('\\.[0-9]+$', '')) if (_hop_has_pending_nodes | default(false) | bool) else k8s_from_minor }}"
  when: 
    - upgrade_status is defined
    - upgrade_status is mapping
    - upgrade_status.upgrade is defined

- name: Set hop_from_minor to current version if no upgrade_status
  ansible.builtin.set_fact:
    _hop_from_minor: "{{ k8s_from_minor }}"
  when: upgrade_status is not defined or upgrade_status is not mapping or upgrade_status.upgrade is not defined

- name: Skip hop chain only if completed and no pending nodes
  ansible.builtin.set_fact:
    hop_chain: []
  when: 
    - _hop_already_completed | bool
    - not (_hop_has_pending_nodes | default(false) | bool)

- name: Build hop chain
  ansible.builtin.set_fact:
    hop_chain: "{{ lookup('pipe', 'python3 ' ~ detect_hop_chain_script ~ ' ' ~ (_upgrade_paths | to_json | quote) ~ ' ' ~ (_hop_from_minor | quote) ~ ' ' ~ (_target_minor | quote)) | from_json }}"
  when: not (_hop_already_completed | default(false)) or (_hop_has_pending_nodes | default(false) | bool)

- name: Clean up temporary Python script
  ansible.builtin.file:
    path: "{{ detect_hop_chain_script }}"
    state: absent

- name: Fail if hop chain has errors
  ansible.builtin.fail:
    msg: >-
      Cannot build upgrade hop chain: {{ hop_chain.error }}.
      Current: {{ k8s_from_minor }}, Target: {{ _target_minor }}.
      Check upgrade_paths.yml.
  when: hop_chain is mapping and hop_chain.error is defined

- name: Fail if hop chain is empty and versions differ
  ansible.builtin.fail:
    msg: >-
      Hop chain is empty but cluster ({{ k8s_from_minor }}) != target ({{ _target_minor }}).
      This should not happen — check upgrade_paths.yml.
  when:
    - hop_chain | length == 0
    - k8s_from_minor != _target_minor

- name: Set is_multi_hop flag
  ansible.builtin.set_fact:
    is_multi_hop: "{{ hop_chain | length > 1 }}"

# ── Validate all artifact directories exist ─────────────────────────
- name: Validate artifact directories exist for each hop
  ansible.builtin.stat:
    path: "{{ artifacts_base_path }}/{{ item.artifacts_dir }}"
  loop: "{{ hop_chain }}"
  loop_control:
    label: "{{ item.from_minor }} → {{ item.to_version }}"
  register: _artifact_dir_checks

- name: Fail if any artifact directory is missing
  ansible.builtin.fail:
    msg: >-
      Missing artifacts for hop {{ item.item.from_minor }} → {{ item.item.to_version }}:
      directory artifacts/{{ item.item.artifacts_dir }}/ not found.
      Required files: software_config.json, service_k8s.json, local_repo_config.yml
  loop: "{{ _artifact_dir_checks.results }}"
  loop_control:
    label: "{{ item.item.from_minor }} → {{ item.item.to_version }}"
  when: not item.stat.exists

- name: Display hop chain
  ansible.builtin.debug:
    msg: >-
      Upgrade hop chain ({{ hop_chain | length }} hop{{ 's' if hop_chain | length > 1 else '' }}):
      {% for hop in hop_chain %}
      {{ loop.index }}. {{ hop.from_minor }} → {{ hop.to_version }} (artifacts/{{ hop.artifacts_dir }}/)
      {% endfor %}
      {% if hop_chain | length == 0 %}
      Cluster already at target minor version {{ _target_minor }}.
      {% endif %}
