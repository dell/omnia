---
# Cache configuration files at the start of the playbook to avoid repeated I/O.
# This task file loads all config files once and stores them in hostvars for reuse.
# Since users cannot modify configs during an upgrade run, this is safe and improves performance.

- name: Cache storage_config.yml
  ansible.builtin.include_vars:
    file: "{{ storage_config_file }}"
    name: cached_storage_config
  run_once: true
  delegate_to: localhost

- name: Cache omnia_config.yml
  ansible.builtin.include_vars:
    file: "{{ omnia_config_file }}"
    name: cached_omnia_config
  run_once: true
  delegate_to: localhost

- name: Cache high_availability_config.yml
  ansible.builtin.include_vars:
    file: "{{ ha_config_file }}"
    name: cached_ha_config
  run_once: true
  delegate_to: localhost

- name: Set cached config flag
  ansible.builtin.set_fact:
    configs_cached: true
  run_once: true
  delegate_to: localhost
  delegate_facts: true
