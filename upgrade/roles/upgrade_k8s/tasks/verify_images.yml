---
# Verify all prep artifacts exist for a specific target version.
# Checks: Pulp repos (RPMs), container images, and squashfs in MinIO.
# If ANY verification fails → caller should ABORT (cluster untouched).
#
# Inputs:
#   _hop_target_version — full target version (e.g. "1.35.1")
#   _hop_target_minor   — minor version (e.g. "1.35")
#   admin_nic_ip        — Pulp/registry server address

- name: "verify_images [{{ _hop_target_version }}] — Check kubernetes Pulp repo"
  ansible.builtin.command:
    cmd: >-
      pulp rpm distribution show
      --name x86_64_rhel_{{ cluster_os_version }}_kubernetes-v{{ _hop_target_minor | replace('.', '-') }}
  changed_when: false

- name: "verify_images [{{ _hop_target_version }}] — Check cri-o Pulp repo"
  ansible.builtin.command:
    cmd: >-
      pulp rpm distribution show
      --name x86_64_rhel_{{ cluster_os_version }}_cri-o-v{{ _hop_target_minor | replace('.', '-') }}
  changed_when: false

- name: "verify_images [{{ _hop_target_version }}] — Check squashfs image in MinIO"
  ansible.builtin.command:
    cmd: >-
      mc stat minio/boot-images/k8s-{{ _hop_target_version }}/squashfs.img
  changed_when: false

- name: "verify_images [{{ _hop_target_version }}] — Check core container images in Pulp registry"
  ansible.builtin.command:
    cmd: >-
      curl -sf http://{{ admin_nic_ip }}:2225/v2/{{ item.split(':')[0] | regex_replace('^docker.io/', '') }}/manifests/{{ item.split(':')[1] }}
  loop:
    - "registry.k8s.io/kube-apiserver:v{{ _hop_target_version }}"
    - "registry.k8s.io/kube-controller-manager:v{{ _hop_target_version }}"
    - "registry.k8s.io/kube-scheduler:v{{ _hop_target_version }}"
    - "registry.k8s.io/kube-proxy:v{{ _hop_target_version }}"
  loop_control:
    label: "{{ item }}"
  changed_when: false

- name: "Verify images — All prep artifacts verified {{ _hop_target_version }}"
  ansible.builtin.debug:
    msg: >-
      All prep artifacts verified for v{{ _hop_target_version }}:
      Pulp repos (kubernetes, cri-o), squashfs image, core container images.
