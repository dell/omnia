---
# Initialize a single hop - prep work before node upgrades
# This is called from the playbook for each hop in the chain
#
# Required variables:
#   - current_hop: The hop dict with from_minor, to_version, artifacts_dir
#   - hop_idx: The 0-based index of this hop

# ── Load config artifacts for this hop ──────────────────────────────────
- name: "hop {{ hop_idx + 1 }} [{{ current_hop.to_version }}] — Load version vars from input_project_dir"
  ansible.builtin.include_tasks: load_version_vars.yml
  vars:
    software_config_file: "{{ input_project_dir }}/software_config.json"
    # service_k8s_config_file is set dynamically in load_version_vars.yml based on k8s_target_version

# ── Set upgrade paths (must be after load_version_vars) ──────────────
- name: "hop {{ hop_idx + 1 }} [{{ current_hop.to_version }}] — Set upgrade paths on client NFS mount"
  ansible.builtin.set_fact:
    upgrade_dir_client: "{{ k8s_client_mount_path }}/upgrade"
    status_file: "{{ k8s_client_mount_path }}/upgrade/upgrade_status.yml"
    lock_file: "{{ k8s_client_mount_path }}/upgrade/upgrade.lock"
    backup_dir: "{{ k8s_client_mount_path }}/upgrade/backup"
    etcd_snapshot_file: "{{ k8s_client_mount_path }}/upgrade/backup/etcd-snapshot.db"
    etcdctl_binary: "{{ k8s_client_mount_path }}/upgrade/backup/etcdctl"
    etcd_members_file: "{{ k8s_client_mount_path }}/upgrade/backup/etcd-members.json"
    k8s_config_backup_dir: "{{ k8s_client_mount_path }}/upgrade/backup/configs"

# ── Load status and build node inventory ─────────────────────────────
- name: "hop {{ hop_idx + 1 }} [{{ current_hop.to_version }}] — Load or create upgrade status"
  ansible.builtin.include_tasks: load_status.yml

# ── Check if this hop is already completed (re-run case) ────────────
- name: "hop {{ hop_idx + 1 }} [{{ current_hop.to_version }}] — Check if hop already completed"
  ansible.builtin.set_fact:
    hop_completed: >-
      {{ (upgrade_status.multi_hop.hops | default([]))
         | selectattr('to', 'equalto', current_hop.to_version)
         | selectattr('status', 'equalto', 'completed')
         | list | length > 0 }}

- name: "hop {{ hop_idx + 1 }} [{{ current_hop.to_version }}] — Skip completed hop"
  ansible.builtin.debug:
    msg: >-
      Hop {{ hop_idx + 1 }} ({{ current_hop.from_minor }} → {{ current_hop.to_version }})
      already completed — skipping.
  when: hop_completed | bool

# ── Execute this hop (only if not already completed) ─────────────────
- name: "hop {{ hop_idx + 1 }} [{{ current_hop.to_version }}] — Initialize hop"
  when: not (hop_completed | bool)
  block:
    # ── Set per-hop backup directory ─────────────────────────────────
    - name: "hop {{ hop_idx + 1 }} [{{ current_hop.to_version }}] — Set per-hop backup directory"
      ansible.builtin.set_fact:
        backup_dir: "{{ upgrade_dir_client }}/backup/{{ current_hop.from_minor }}"
        backup_dir_client: "{{ upgrade_dir_client }}/backup/{{ current_hop.from_minor }}"

    # ── Reset status for this hop ────────────────────────────────────
    # After a previous hop completes, the status file has
    # upgrade.status=completed, etcd_backup.status=completed, etc.
    # We must reset these so tasks in this hop are not skipped.
    # The reset is done when writing the status file below to ensure persistence.
    - name: "hop {{ hop_idx + 1 }} [{{ current_hop.to_version }}] — Write reset status file"
      ansible.builtin.include_tasks: update_node_step.yml
      vars:
        _reset_nodes: >-
          {%- set nodes_dict = {} -%}
          {%- for node in all_upgrade_nodes -%}
            {%- set _ = nodes_dict.update({node: {
              'status': 'pending',
              'version_before': k8s_from_version,
              'version_current': k8s_from_version,
              'steps': {}
            }}) -%}
          {%- endfor -%}
          {{ nodes_dict }}
        status_update:
          upgrade:
            from_version: "{{ k8s_from_version }}"
            target_version: "{{ current_hop.to_version }}"
            status: in_progress
            started_at: "{{ ansible_date_time.iso8601 }}"
            completed_at: None
          etcd_backup:
            status: pending
            path: None
            timestamp: None
            error: None
          k8s_config_backup:
            status: pending
            path: None
            timestamp: None
            error: None
          addon_upgrade:
            status: pending
            calico:
              status: pending
            metallb:
              status: pending
            helm:
              status: pending
          nodes: "{{ _reset_nodes }}"

    # ── Record hop in multi-hop tracking ─────────────────────────────
    - name: "hop {{ hop_idx + 1 }} [{{ current_hop.to_version }}] — Record hop in status"
      ansible.builtin.include_tasks: update_node_step.yml
      vars:
        status_update:
          multi_hop:
            current_hop: "{{ hop_idx }}"
            hops: >-
              {{ (upgrade_status.multi_hop.hops | default([]))
                 | rejectattr('to', 'equalto', current_hop.to_version)
                 | list
                 + [{
                   'from': k8s_from_version,
                   'to': current_hop.to_version,
                   'status': 'in_progress',
                   'started_at': ansible_date_time.iso8601
                 }] }}

    # ── Preflight ────────────────────────────────────────────────────
    - name: "hop {{ hop_idx + 1 }} [{{ current_hop.to_version }}] — Run preflight checks (Pulp)"
      ansible.builtin.include_tasks: preflight_checks_pulp.yml
      when: upgrade_status.upgrade.status != 'completed'

    # ── Validate backup was successful (Engineering Spec §4.7.3 Gate 6) ──
    - name: "hop {{ hop_idx + 1 }} [{{ current_hop.to_version }}] — Reload status after backup"
      ansible.builtin.include_tasks: load_status.yml

    - name: "hop {{ hop_idx + 1 }} [{{ current_hop.to_version }}] — Validate backup was successful"
      ansible.builtin.fail:
        msg: >-
          Backup failed. Upgrade cannot proceed.
          etcd_backup status: {{ upgrade_status.etcd_backup.status | default('unknown') }}
          k8s_config_backup status: {{ upgrade_status.k8s_config_backup.status | default('unknown') }}
          {{ upgrade_status.etcd_backup.error | default('') }}
          {{ upgrade_status.k8s_config_backup.error | default('') }}
      when:
        - upgrade_status.etcd_backup.status | default('pending') == 'failed'
          or upgrade_status.k8s_config_backup.status | default('pending') == 'failed'
