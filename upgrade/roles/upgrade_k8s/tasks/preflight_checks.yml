# ── Cluster health (kube_vip) ──────────────────────────────────────
- name: Verify all nodes are Ready
  ansible.builtin.command: /usr/bin/kubectl get nodes --no-headers
  register: node_list
  changed_when: false

- name: Verify no nodes in NotReady state
  ansible.builtin.fail:
    msg: "Some nodes are not Ready:\n{{ node_list.stdout }}"
  when: "'NotReady' in node_list.stdout"

- name: Verify all kube-system pods are Running (Engineering Spec §4.7.3 Gate 3)
  ansible.builtin.shell:
    cmd: >-
      /usr/bin/kubectl get pods -n kube-system --no-headers
      --field-selector status.phase!=Running,status.phase!=Succeeded
      2>/dev/null | head -20
  register: unhealthy_pods
  changed_when: false
  failed_when: false

- name: Fail if kube-system pods are not Running
  ansible.builtin.fail:
    msg: >-
      Preflight check failed: Some kube-system pods are not Running.
      {{ unhealthy_pods.stdout }}
  when: unhealthy_pods.stdout | length > 0

- name: Verify current cluster version matches expected
  ansible.builtin.fail:
    msg: "{{ msg_preflight_version_mismatch }}"
  when: k8s_from_version != (upgrade_status.upgrade.from_version | default(k8s_from_version))

# ── Hop chain validation (Engineering Spec §4.7.3 Gate 5, KC-09) ─────
- name: Extract minor versions for KC-09 constraint check
  ansible.builtin.set_fact:
    k8s_from_minor_int: "{{ (k8s_from_version | regex_replace('^v?(\\d+)\\.(\\d+)\\.\\d+$', '\\2')) | int }}"
    k8s_target_minor_int: "{{ (k8s_target_version | regex_replace('^(\\d+)\\.(\\d+)\\.\\d+$', '\\2')) | int }}"

- name: Validate KC-09 constraint (max 1 minor version gap)
  ansible.builtin.fail:
    msg: >-
      Version gap exceeds 1 minor version (KC-09 constraint violation).
      Current version: {{ k8s_from_version }} (minor {{ k8s_from_minor_int }})
      Target version: {{ k8s_target_version }} (minor {{ k8s_target_minor_int }})
      K8s version skew policy: max 1 minor version at a time.
      This upgrade path is not supported. Please upgrade to intermediate version first.
  when: (k8s_target_minor_int - k8s_from_minor_int) > 1

- name: Validate current version is in supported upgrade chain
  ansible.builtin.fail:
    msg: >-
      Current cluster version {{ k8s_from_version }} is not part of the supported upgrade chain.
      Supported versions: {{ components.service_k8s.supported_versions | join(', ') }}
      This upgrade path only supports hops in the chain.
      STOP: cluster version not part of hop chain.
  when: k8s_from_version not in components.service_k8s.supported_versions

# ── etcd health (kube_vip) ─────────────────────────────────────────
- name: Get first control plane plane pod name for etcd
  ansible.builtin.command: /usr/bin/kubectl get pods -n kube-system -l component=etcd -o jsonpath='{.items[0].metadata.name}'
  register: etcd_pod_name
  changed_when: false

- name: Verify etcd cluster health
  ansible.builtin.command:
    cmd: >-
      /usr/bin/kubectl exec -n kube-system {{ etcd_pod_name.stdout }} --
      /usr/bin/etcdctl --endpoints=https://127.0.0.1:2379
      --cacert=/etc/kubernetes/pki/etcd/ca.crt
      --cert=/etc/kubernetes/pki/etcd/server.crt
      --key=/etc/kubernetes/pki/etcd/server.key
      endpoint health --cluster
  register: etcd_health
  changed_when: false

- name: Abort if etcd is unhealthy
  ansible.builtin.fail:
    msg: "{{ msg_etcd_quorum_lost }}\n{{ etcd_health.stdout }}\n{{ etcd_health.stderr }}"
  when: "'is unhealthy' in etcd_health.stdout or etcd_health.rc != 0"

- name: Display preflight summary
  ansible.builtin.debug:
    msg: >-
      Preflight checks passed.
      Cluster: {{ k8s_from_version }} → {{ k8s_target_version }}
      Nodes: {{ all_upgrade_nodes | length }} ({{ groups_cp_first | length }} first CP,
      {{ groups_cp | length }} additional CP, {{ groups_worker | length }} workers)
      kube-system pods: Running
      etcd: healthy
      Hop chain: validated (KC-09 constraint satisfied)
