---
- name: Detect current Calico version
  delegate_to: "{{ kube_vip }}"
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      kubectl get pods -n kube-system -l k8s-app=calico-node
      -o jsonpath='{.items[0].spec.containers[0].image}' 2>/dev/null |
      grep -oP 'v\d+\.\d+\.\d+' || echo "unknown"
  args:
    executable: /bin/bash
  register: calico_current_version_raw
  changed_when: false
  failed_when: false

- name: Set calico_current_version fact
  ansible.builtin.set_fact:
    calico_current_version: >-
      {{ calico_current_version_raw.stdout | trim | regex_replace('^v', '')
      if calico_current_version_raw.stdout is defined and calico_current_version_raw.stdout != 'unknown'
      else 'unknown' }}

- name: Set calico_from_version fact (preserve existing if set)
  ansible.builtin.set_fact:
    calico_from_version: >-
      {{ upgrade_status.addon_upgrade.calico.from_version
         if (upgrade_status.addon_upgrade.calico.from_version | default('unknown')) not in ['unknown', '']
         else calico_current_version }}

- name: Detect current MetalLB version
  delegate_to: "{{ kube_vip }}"
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      kubectl get deployment -n metallb-system controller
      -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null |
      grep -oP 'v\d+\.\d+\.\d+' || echo "unknown"
  args:
    executable: /bin/bash
  register: metallb_current_version_raw
  changed_when: false
  failed_when: false

- name: Set metallb_current_version fact
  ansible.builtin.set_fact:
    metallb_current_version: >-
      {{ metallb_current_version_raw.stdout | trim | regex_replace('^v', '')
      if metallb_current_version_raw.stdout is defined and metallb_current_version_raw.stdout != 'unknown'
      else 'unknown' }}

- name: Set metallb_from_version fact (preserve existing if set)
  ansible.builtin.set_fact:
    metallb_from_version: >-
      {{ upgrade_status.addon_upgrade.metallb.from_version
         if (upgrade_status.addon_upgrade.metallb.from_version | default('unknown')) not in ['unknown', '']
         else metallb_current_version }}

- name: Detect current Helm version
  delegate_to: "{{ kube_vip }}"
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      helm version --short 2>/dev/null |
      grep -oP 'v\d+\.\d+\.\d+' || echo "unknown"
  args:
    executable: /bin/bash
  register: helm_current_version_raw
  changed_when: false
  failed_when: false

- name: Set helm_current_version fact
  ansible.builtin.set_fact:
    helm_current_version: >-
      {{ helm_current_version_raw.stdout | trim | regex_replace('^v', '')
      if helm_current_version_raw.stdout is defined and helm_current_version_raw.stdout != 'unknown'
      else 'unknown' }}

- name: Set helm_from_version fact (preserve existing if set)
  ansible.builtin.set_fact:
    helm_from_version: >-
      {{ upgrade_status.addon_upgrade.helm.from_version
         if (upgrade_status.addon_upgrade.helm.from_version | default('unknown')) not in ['unknown', '']
         else helm_current_version }}

- name: Determine Calico status
  ansible.builtin.set_fact:
    calico_status: >-
      {{
        'completed' if calico_current_version == calico_target_version
        else 'pending'
      }}

- name: Determine MetalLB status
  ansible.builtin.set_fact:
    metallb_status: >-
      {{
        'completed' if metallb_current_version == metallb_target_version
        else 'pending'
      }}

- name: Determine Helm status
  ansible.builtin.set_fact:
    helm_status: >-
      {{
        'completed' if helm_current_version == helm_target_version
        else 'pending'
      }}

# ── kube-vip version detection ────────────────────────────────────────
# kube-vip runs as a static pod on EACH control plane node. The version
# is read from the manifest file (source of truth) rather than crictl,
# because CRI-O stores images by digest and crictl does not return tags.
# We check all CP nodes: if any node is not at target, status = pending.
#
# IMPORTANT: this role runs under `hosts: localhost, connection: local`.
# A delegate_to target only connects over SSH if that host has
# `ansible_connection: ssh` set in the inventory. Raw IPs (and file-based
# inventory hosts without that var) inherit connection: local and run on
# the controller instead — which is why the manifest was "not found".
# We therefore register each CP node in the in-memory inventory with an
# explicit SSH connection, then delegate to those hostnames.
- name: Build list of control plane nodes for kube-vip detection
  ansible.builtin.set_fact:
    _kube_vip_detect_cp_nodes: >-
      {{ upgrade_status.nodes | dict2items
         | selectattr('value.role', 'in', ['control_plane_first', 'control_plane'])
         | list }}

- name: Register control plane nodes for SSH delegation (kube-vip detection)
  ansible.builtin.add_host:
    name: "{{ item.key }}"
    ansible_host: "{{ item.value.ip }}"
    ansible_connection: ssh
    ansible_user: root
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
    groups: _kube_vip_detect_targets
  loop: "{{ _kube_vip_detect_cp_nodes }}"
  loop_control:
    label: "{{ item.key }} ({{ item.value.ip }})"
  changed_when: false

- name: Build list of control plane hostnames for kube-vip detection
  ansible.builtin.set_fact:
    _kube_vip_detect_cp_hosts: "{{ _kube_vip_detect_cp_nodes | map(attribute='key') | list }}"

- name: Detect kube-vip version from manifest on each control plane
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      grep -oP 'image:\s+\S+:v\K\d+\.\d+\.\d+'
      /etc/kubernetes/manifests/kube-vip.yaml 2>/dev/null ||
      echo "unknown"
    executable: /bin/bash
  delegate_to: "{{ item }}"
  loop: "{{ _kube_vip_detect_cp_hosts }}"
  register: kube_vip_version_per_node
  changed_when: false
  failed_when: false

- name: Build per-node kube-vip version map
  ansible.builtin.set_fact:
    _kube_vip_node_versions: >-
      {{ _kube_vip_node_versions | default({}) | combine({
           item.item: item.stdout | default('unknown') | trim
         }) }}
  loop: "{{ kube_vip_version_per_node.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Display kube-vip version per control plane node
  ansible.builtin.debug:
    msg: "kube-vip versions: {{ _kube_vip_node_versions }}"

# Use the first non-target version as the "current" version for overall
# reporting. If all nodes match the target, report the target.
- name: Set kube_vip_current_version fact
  ansible.builtin.set_fact:
    kube_vip_current_version: >-
      {{ (_kube_vip_node_versions.values() | list
          | reject('equalto', kube_vip_target_version)
          | reject('equalto', 'unknown') | first | default(''))
         or
         (kube_vip_target_version
          if (_kube_vip_node_versions.values() | list
              | select('equalto', kube_vip_target_version) | list | length
              == _kube_vip_node_versions | length)
          else (_kube_vip_node_versions.values() | list
                | reject('equalto', 'unknown') | first | default('unknown'))) }}

- name: Set kube_vip_from_version fact (preserve existing if set)
  ansible.builtin.set_fact:
    kube_vip_from_version: >-
      {{ upgrade_status.addon_upgrade.kube_vip.from_version
         if (upgrade_status.addon_upgrade.kube_vip.from_version | default('unknown')) not in ['unknown', '']
         else kube_vip_current_version }}

# completed only when ALL control plane nodes are at the target version
- name: Determine kube-vip status
  ansible.builtin.set_fact:
    kube_vip_status: >-
      {{ 'completed'
         if (_kube_vip_node_versions.values() | list
             | select('equalto', kube_vip_target_version) | list | length
             == _kube_vip_node_versions | length)
         else 'pending' }}

- name: Load PowerScale target version from JSON
  ansible.builtin.set_fact:
    csi_powerscale_packages_json: "{{ lookup('file', input_project_dir + '/config/x86_64/rhel/' + cluster_os_version + '/csi_driver_powerscale.json') | from_json }}"  # noqa yaml[line-length]
  failed_when: false
  register: powerscale_json_load

- name: Extract PowerScale target version and directory name
  ansible.builtin.set_fact:
    csi_powerscale_dir: >-
      {{ csi_powerscale_packages_json['csi_driver_powerscale']['cluster']
         | selectattr('type', 'equalto', 'git')
         | selectattr('package', 'search', 'csi-powerscale')
         | map(attribute='package')
         | first
         if powerscale_json_load is succeeded
         else 'unknown' }}
    powerscale_target_version: >-
      {{ csi_powerscale_packages_json['csi_driver_powerscale']['cluster']
         | selectattr('type', 'equalto', 'git')
         | selectattr('package', 'search', 'csi-powerscale')
         | map(attribute='package')
         | first
         | regex_replace('^csi-powerscale-v?', '')
         if powerscale_json_load is succeeded
         else 'unknown' }}

- name: Detect current PowerScale CSI Driver version
  delegate_to: "{{ kube_vip }}"
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      kubectl get pods -n isilon -l app=isilon-controller
      -o jsonpath='{.items[0].spec.containers[?(@.name=="driver")].image}' 2>/dev/null |
      grep -oP 'v\d+\.\d+\.\d+' || echo "unknown"
  args:
    executable: /bin/bash
  register: powerscale_current_version_raw
  changed_when: false
  failed_when: false

- name: Debug PowerScale version detection
  ansible.builtin.debug:
    msg: "PowerScale raw output: '{{ powerscale_current_version_raw.stdout | default('NO_STDOUT') }}'"

- name: Set PowerScale version facts
  ansible.builtin.set_fact:
    powerscale_current_version: >-
      {{ powerscale_current_version_raw.stdout | trim | regex_replace('^v', '')
         if powerscale_current_version_raw.stdout is defined and powerscale_current_version_raw.stdout != 'unknown'
         else 'unknown' }}
    powerscale_from_version: >-
      {{ upgrade_status.addon_upgrade.powerscale.from_version
         if (upgrade_status.addon_upgrade.powerscale.from_version | default('unknown')) not in ['unknown', '']
         else (powerscale_current_version_raw.stdout | trim | regex_replace('^v', '')
             if powerscale_current_version_raw.stdout is defined and powerscale_current_version_raw.stdout != 'unknown'
             else 'unknown') }}

- name: Set PowerScale upgrade status
  ansible.builtin.set_fact:
    powerscale_status: >-
      {{ 'not_installed' if powerscale_current_version == 'unknown'
         else 'skipped' if powerscale_target_version == 'unknown'
         else 'completed' if powerscale_current_version == powerscale_target_version
         else 'pending' }}

- name: Update addon status with detected versions
  ansible.builtin.include_tasks: update_node_step.yml
  vars:
    status_update:
      addon_upgrade:
        kube_vip:
          status: "{{ kube_vip_status }}"
          current_version: "{{ kube_vip_current_version }}"
          from_version: "{{ kube_vip_from_version }}"
          target_version: "{{ kube_vip_target_version }}"
        calico:
          status: "{{ calico_status }}"
          current_version: "{{ calico_current_version }}"
          from_version: "{{ calico_from_version }}"
          target_version: "{{ calico_target_version }}"
        metallb:
          status: "{{ metallb_status }}"
          current_version: "{{ metallb_current_version }}"
          from_version: "{{ metallb_from_version }}"
          target_version: "{{ metallb_target_version }}"
        helm:
          status: "{{ helm_status }}"
          current_version: "{{ helm_current_version }}"
          from_version: "{{ helm_from_version }}"
          target_version: "{{ helm_target_version }}"
        powerscale:
          status: "{{ powerscale_status | default('pending') }}"
          current_version: "{{ powerscale_current_version | default('unknown') }}"
          from_version: "{{ powerscale_from_version | default('unknown') }}"
          target_version: "{{ powerscale_target_version | default('unknown') }}"

- name: Display detected addon versions
  ansible.builtin.debug:
    msg: "{{ addon_versions_banner }}"
  vars:
    addon_versions_banner:
      - "Detected addon versions:"
      - "  kube-vip: {{ kube_vip_current_version }} (target: {{ kube_vip_target_version }}) - {{ kube_vip_status }}"
      - "  Calico: {{ calico_current_version }} (target: {{ calico_target_version }}) - {{ calico_status }}"
      - "  MetalLB: {{ metallb_current_version }} (target: {{ metallb_target_version }}) - {{ metallb_status }}"
      - "  Helm: {{ helm_current_version }} (target: {{ helm_target_version }}) - {{ helm_status }}"
      - "  PowerScale: {{ powerscale_current_version }} (target: {{ powerscale_target_version }}) - {{ powerscale_status }}"
