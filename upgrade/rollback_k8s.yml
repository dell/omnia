# ══════════════════════════════════════════════════════════════════════════════
# Kubernetes Rollback Playbook
# ══════════════════════════════════════════════════════════════════════════════
# Rolls back a Kubernetes cluster to the pre-upgrade version using:
#   - etcd snapshot restore
#   - /etc/kubernetes/ config restore
#   - Package downgrade (kubeadm, kubelet, kubectl, cri-o)
#
# Usage:
#   ansible-playbook upgrade/rollback_k8s.yml
#   ansible-playbook upgrade/rollback_k8s.yml -e "input_project_dir=/custom/path"
#
# Prerequisites:
#   - A prior K8s upgrade must have completed (upgrade_status.yml exists)
#   - Upgrade backups must exist (etcd snapshot, K8s configs, etcd members)
#   - Target rollback version packages must be available in Pulp repos
# ══════════════════════════════════════════════════════════════════════════════

# ── Play 1: Pre-check configuration ──────────────────────────────────────────
- name: "Kubernetes Rollback - Pre-check configuration"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    input_project_dir: "/opt/omnia/input/project_default"

  tasks:
    - name: "Load software_config.json"
      ansible.builtin.slurp:
        path: "{{ input_project_dir }}/software_config.json"
      register: _sw_config_slurp

    - name: "Parse software_config.json"
      ansible.builtin.set_fact:
        _software_config: "{{ _sw_config_slurp.content | b64decode | from_json }}"

    - name: "Check if service_k8s is configured"
      ansible.builtin.set_fact:
        k8s_rollback_enabled: >-
          {{ _software_config.softwares
             | selectattr('name', 'equalto', 'service_k8s')
             | list | length > 0 }}

    - name: "Abort if service_k8s not configured"
      ansible.builtin.fail:
        msg: |
          ════════════════════════════════════════════════════════════════════════
          [ROLLBACK] ABORT — service_k8s not configured
          ════════════════════════════════════════════════════════════════════════
          service_k8s is not present in software_config.json.
          A K8s cluster must have been provisioned and upgraded before rollback.
          ════════════════════════════════════════════════════════════════════════
      when: not (k8s_rollback_enabled | bool)

    - name: "Set cluster OS variables"
      ansible.builtin.set_fact:
        cluster_os_type: "{{ _software_config.cluster_os_type }}"
        cluster_os_version: "{{ _software_config.cluster_os_version }}"

    - name: "Load HA config"
      ansible.builtin.include_vars:
        file: "{{ input_project_dir }}/high_availability_config.yml"
        name: ha_config_data

    - name: "Extract kube_vip"
      ansible.builtin.set_fact:
        kube_vip: "{{ ha_config_data.service_k8s_cluster_ha[0].virtual_ip_address }}"

# ── Play 2: Add kube_vip to inventory ────────────────────────────────────────
- name: "Kubernetes Rollback - Add kube_vip to inventory"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    input_project_dir: "/opt/omnia/input/project_default"

  tasks:
    - name: "Load HA config"
      ansible.builtin.include_vars:
        file: "{{ input_project_dir }}/high_availability_config.yml"
        name: ha_config_data

    - name: "Extract kube_vip"
      ansible.builtin.set_fact:
        kube_vip: "{{ ha_config_data.service_k8s_cluster_ha[0].virtual_ip_address }}"

    - name: "Add kube_vip to inventory"
      ansible.builtin.add_host:
        name: "{{ kube_vip }}"
        ansible_host: "{{ kube_vip }}"
        ansible_connection: ssh
        ansible_user: root
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        groups: kube_vip_group

# ── Play 3: Verify upgrade status exists ─────────────────────────────────────
- name: "Kubernetes Rollback - Verify upgrade status"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    input_project_dir: "/opt/omnia/input/project_default"
    nodes_yaml_path: "/opt/omnia/openchami/workdir/nodes/nodes.yaml"
    group_cp_first: "service_kube_control_plane_first_x86_64"

  tasks:
    - name: "Load omnia_config.yml"
      ansible.builtin.include_vars:
        file: "{{ input_project_dir }}/omnia_config.yml"
        name: omnia_config

    - name: "Load storage_config.yml"
      ansible.builtin.include_vars:
        file: "{{ input_project_dir }}/storage_config.yml"
        name: storage_config

    - name: Set k8s_nfs_storage_name
      ansible.builtin.set_fact:
        k8s_nfs_storage_name: "{{ omnia_config.service_k8s_cluster[0].nfs_storage_name }}"

    - name: Set k8s_client_mount_path
      ansible.builtin.set_fact:
        k8s_client_mount_path: >-
          {{ (storage_config.mounts
              | selectattr('name', 'equalto', k8s_nfs_storage_name)
              | first).mount_point }}

    - name: Read nodes.yaml to resolve first CP
      ansible.builtin.slurp:
        src: "{{ nodes_yaml_path }}"
      register: _play3_nodes_slurp

    - name: Resolve first CP IP for delegation
      ansible.builtin.set_fact:
        _play3_first_cp_ip: >-
          {{ (((_play3_nodes_slurp.content | b64decode | from_yaml).nodes
               | selectattr('group', 'equalto', group_cp_first)
               | first).interfaces | first).ip_addrs
             | selectattr('name', 'equalto', 'management')
             | map(attribute='ip_addr') | first }}

    - name: Add first CP to inventory
      ansible.builtin.add_host:
        name: "play3_first_cp"
        ansible_host: "{{ _play3_first_cp_ip }}"
        ansible_connection: ssh
        ansible_user: root
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

    - name: Check upgrade_status.yml exists
      ansible.builtin.stat:
        path: "{{ k8s_client_mount_path }}/upgrade/upgrade_status.yml"
      delegate_to: "play3_first_cp"
      register: _upgrade_status_stat

    - name: "Abort if no upgrade status found"
      ansible.builtin.fail:
        msg: |
          ════════════════════════════════════════════════════════════════════════
          [ROLLBACK] ABORT — No upgrade status found
          ════════════════════════════════════════════════════════════════════════
          upgrade_status.yml not found at:
            {{ k8s_client_mount_path }}/upgrade/upgrade_status.yml

          A completed K8s upgrade is required before rollback.
          ════════════════════════════════════════════════════════════════════════
      when: not _upgrade_status_stat.stat.exists

    - name: Set mount path fact for downstream plays
      ansible.builtin.set_fact:
        k8s_client_mount_path_kube_vip: "{{ k8s_client_mount_path }}"

# ── Play 4: Execute rollback ─────────────────────────────────────────────────
- name: "Kubernetes Rollback - Execute Rollback"
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    input_project_dir: "/opt/omnia/input/project_default"
    cluster_os_version: "{{ hostvars['localhost']['_software_config']['cluster_os_version'] }}"

  tasks:
    - name: Load omnia_config.yml
      ansible.builtin.include_vars:
        file: "{{ input_project_dir }}/omnia_config.yml"
        name: omnia_config

    - name: Set nfs_storage_name from omnia_config
      ansible.builtin.set_fact:
        nfs_storage_name: "{{ omnia_config.service_k8s_cluster[0].nfs_storage_name }}"

    - name: Cache storage_config.yml
      ansible.builtin.include_vars:
        file: "{{ input_project_dir }}/storage_config.yml"
        name: cached_storage_config

    - name: Cache high_availability_config.yml
      ansible.builtin.include_vars:
        file: "{{ input_project_dir }}/high_availability_config.yml"
        name: cached_ha_config

    - name: Call rollback_k8s role
      ansible.builtin.include_role:
        name: roles/rollback_k8s
