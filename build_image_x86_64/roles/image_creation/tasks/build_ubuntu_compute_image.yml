---

- name: Set compute image suffix when build stream inputs present
  ansible.builtin.set_fact:
    compute_image_suffix: "_{{ build_stream_job_id }}-{{ image_key | default('') }}"
  when:
    - enable_build_stream | bool
    - (build_stream_job_id | default('') | length) > 0
    - (image_key | default('') | length) > 0

- name: Ensure log directory exists
  ansible.builtin.file:
    path: "{{ openchami_log_dir }}"
    state: directory
    mode: "{{ dir_permissions_755 }}"

- name: Create x86_64 ubuntu compute image log files
  ansible.builtin.file:
    path: "{{ openchami_log_dir }}/{{ item.key }}{{ compute_image_suffix }}_compute_image.log"
    state: touch
    mode: "{{ dir_permissions_644 }}"
  loop: "{{ compute_images_dict | dict2items }}"
  loop_control:
    loop_var: item

- name: Render ubuntu compute image build configs
  ansible.builtin.template:
    src: "{{ role_path }}/templates/images/ubuntu-compute-config.yaml.j2"
    dest: "{{ openchami_work_dir }}/images/ubuntu-{{ item.key }}{{ compute_image_suffix }}-{{ ubuntu_tag }}.yaml"
    mode: "{{ dir_permissions_644 }}"
  vars:
    ubuntu_base_compute_image_name: "ubuntu-{{ item.key }}{{ omnia_suffix }}{{ compute_image_suffix }}"
    group_name: "{{ item.key }}"
    compute_packages: "{{ item.value.packages }}"
    functional_group: "{{ item.value.functional_group }}"
  loop: "{{ compute_images_dict | dict2items }}"
  loop_control:
    loop_var: item

- name: Deploy patched image-builder scripts for Ubuntu compute builds
  ansible.builtin.copy:
    src: "{{ role_path }}/files/image-builder/{{ item.src }}"
    dest: "{{ oim_shared_path }}/omnia/openchami/image-builder-{{ item.dest }}"
    mode: "{{ dir_permissions_755 }}"
  loop:
    - { src: 'installer.py', dest: 'installer.py' }
    - { src: 'layer.py', dest: 'layer.py' }
    - { src: 'publish.py', dest: 'publish.py' }

- name: Build x86_64 ubuntu compute osimages in parallel
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      podman run --rm --device /dev/fuse --network host \
        -e S3_ACCESS={{ s3_access }} -e S3_SECRET={{ s3_secret }} \
        {{ aws_checksum_env }} --user 0 --privileged \
        -v {{ pulp_cert_host_path }}:/usr/local/share/ca-certificates/pulp_webserver.crt:z \
        -v {{ openchami_work_dir }}/images/ubuntu-{{ item.key }}{{ compute_image_suffix }}-{{ ubuntu_tag }}.yaml:/home/builder/config.yaml:z \
        -v {{ oim_shared_path }}/omnia/openchami/image-builder-installer.py:/usr/local/bin/installer.py:z \
        -v {{ oim_shared_path }}/omnia/openchami/image-builder-layer.py:/usr/local/bin/layer.py:z \
        -v {{ oim_shared_path }}/omnia/openchami/image-builder-publish.py:/usr/local/bin/publish.py:z \
        {{ ochami_x86_64_image | join(' ') }} \
        {{ ochami_base_command | join(' ') }} \
        > '{{ openchami_log_dir }}/{{ item.key }}{{ compute_image_suffix }}_compute_image.log' 2>&1
  async: "{{ job_async }}"
  poll: 0
  loop: "{{ compute_images_dict | dict2items }}"
  loop_control:
    loop_var: item
  register: ubuntu_compute_image_build_job
  changed_when: true

- name: Wait for all ubuntu compute image builds to finish
  block:
    - name: Display ubuntu image build jobs status
      ansible.builtin.debug:
        msg: "Waiting for ubuntu image build: {{ item.item.key }} (Job ID: {{ item.ansible_job_id }})"
      loop: "{{ ubuntu_compute_image_build_job.results }}"
      loop_control:
        label: "{{ item.item.key }}"

    - name: Wait for all ubuntu compute image builds to complete
      ansible.builtin.async_status:
        jid: "{{ item.ansible_job_id }}"
      register: ubuntu_job_result
      until: ubuntu_job_result.finished
      no_log: true
      retries: "{{ job_retry }}"
      delay: "{{ job_delay }}"
      loop: "{{ ubuntu_compute_image_build_job.results }}"
      loop_control:
        label: "Building: {{ item.item.key }}"

    - name: Verify x86_64 ubuntu compute osimages in registry
      ansible.builtin.command:
        cmd: "/usr/local/bin/regctl repo ls {{ oim_node_name }}.{{ domain_name }}:5000"
      changed_when: false
      register: verify_ubuntu_compute_osimages

    - name: Verify x86_64 ubuntu compute osimages output
      ansible.builtin.debug:
        msg: "{{ verify_ubuntu_compute_osimages.stdout_lines }}"

  rescue:
    - name: Identify failed ubuntu image builds
      ansible.builtin.set_fact:
        failed_images: >
          {{ ubuntu_job_result.results
          | selectattr('failed', 'defined')
          | selectattr('failed', 'equalto', true)
          | map(attribute='item.item.key')
          | list }}
      when: ubuntu_job_result.results is defined

    - name: Build failure message list
      ansible.builtin.set_fact:
        failure_msg_list:
          - "x86_64 ubuntu compute image build job did not complete successfully."
          - "Check logs at {{ openchami_log_dir }} for respective functional group for more details."
          - ""
          - "Failed images:"

    - name: Add failed image names to message
      ansible.builtin.set_fact:
        failure_msg_list: "{{ failure_msg_list + ['  - ' + item] }}"
      loop: "{{ failed_images | default(['Unknown - check all logs']) }}"

    - name: Add log paths section to message
      ansible.builtin.set_fact:
        failure_msg_list: "{{ failure_msg_list + ['', 'Check logs at ' + openchami_log_dir + ' for details:'] }}"

    - name: Add log file paths to message
      ansible.builtin.set_fact:
        failure_msg_list: "{{ failure_msg_list + ['  - ' + openchami_log_dir + '/' + item + compute_image_suffix + '_compute_image.log'] }}"
      loop: "{{ failed_images | default([]) }}"

    - name: Display x86_64 ubuntu compute image build failure details
      ansible.builtin.debug:
        msg: "{{ failure_msg_list }}"

    - name: Failed to build the x86_64 ubuntu compute image
      ansible.builtin.fail:
        msg: "x86_64 ubuntu compute image build failed. See details above."

  always:
    - name: Set openchami SELinux context for Local flow
      ansible.builtin.command: chcon -R system_u:object_r:container_file_t:s0 "{{ hostvars['localhost']['oim_shared_path'] }}/omnia/openchami"
      changed_when: true
      delegate_to: oim
      connection: ssh
      failed_when: false
      when: hostvars['localhost']['omnia_share_option'] == 'Local'

    - name: Set openchami SELinux context for NFS internal flow
      ansible.builtin.command: chcon -R system_u:object_r:container_file_t:s0 "{{ hostvars['localhost']['nfs_server_share_path'] }}/omnia/openchami"
      changed_when: true
      delegate_to: oim
      connection: ssh
      failed_when: false
      when: (hostvars['localhost']['omnia_share_option'] == 'NFS' and hostvars['localhost']['nfs_type'] | default('') == 'internal')
