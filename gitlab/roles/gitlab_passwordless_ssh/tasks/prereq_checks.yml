---

- name: Install sshpass on localhost
  block:
    - name: Install sshpass package
      ansible.builtin.package:
        name: sshpass
        state: present
  rescue:
    - name: Fail with repo configuration guidance
      ansible.builtin.fail:
        msg: "{{ gitlab_sshpass_install_fail_msg }}"

- name: Load GitLab configuration inputs
  ansible.builtin.include_vars:
    file: "{{ hostvars['localhost']['input_project_dir'] }}/gitlab_config.yml"
  delegate_to: localhost
  run_once: true

- name: Set gitlab_host from provided configuration
  ansible.builtin.set_fact:
    gitlab_host: "{{ ansible_host | default(inventory_hostname) }}"

- name: Validate hosted-mode requirements
  ansible.builtin.assert:
    that:
      - gitlab_host is defined and gitlab_host != ''
    fail_msg: "Set a valid gitlab_host in input/gitlab_config.yml"
