---
# Common variables for GitLab roles
# These are defaults that can be overridden by input/gitlab_config.yml

# Container settings
gitlab_container_name: "gitlab"
gitlab_restart_policy: "always"

# Timeouts
gitlab_startup_wait_minutes: 5
gitlab_health_check_retries: 5
gitlab_health_check_delay: 60

# API settings
gitlab_api_version: "v4"
