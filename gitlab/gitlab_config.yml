---
# ============================================================================
# GitLab Hosted Mode Deployment Playbook
# ============================================================================
# Deploys GitLab CE container via Podman on the specified host.
# Reads configuration from: omnia/input/gitlab_config.yml
# ============================================================================

- name: Deploy GitLab CE Container (Hosted Mode)
  hosts: "{{ gitlab_host | default('localhost') }}"
  become: true
  vars_files:
    - ../input/gitlab_config.yml

  pre_tasks:
    - name: Validate deployment mode
      ansible.builtin.assert:
        that:
          - gitlab_deployment_mode == "hosted"
        fail_msg: "This playbook is for hosted mode only. Set gitlab_deployment_mode: hosted"

  tasks:
    # ========================================================================
    # STAGE 1: Prerequisites Validation
    # ========================================================================
    - name: "[Prerequisites] Check minimum memory"
      ansible.builtin.shell: free -g | awk '/^Mem:/{print $2}'
      register: total_memory
      changed_when: false

    - name: "[Prerequisites] Validate memory requirements"
      ansible.builtin.assert:
        that:
          - total_memory.stdout | int >= gitlab_min_memory_gb
        fail_msg: "Insufficient memory. Required: {{ gitlab_min_memory_gb }}GB, Available: {{ total_memory.stdout }}GB"

    - name: "[Prerequisites] Check available storage"
      ansible.builtin.shell: df -BG {{ gitlab_data_path | dirname }} | tail -1 | awk '{print $4}' | tr -d 'G'
      register: available_storage
      changed_when: false
      ignore_errors: true

    - name: "[Prerequisites] Check CPU cores"
      ansible.builtin.shell: nproc
      register: cpu_cores
      changed_when: false

    - name: "[Prerequisites] Validate CPU requirements"
      ansible.builtin.assert:
        that:
          - cpu_cores.stdout | int >= gitlab_min_cpu_cores
        fail_msg: "Insufficient CPU cores. Required: {{ gitlab_min_cpu_cores }}, Available: {{ cpu_cores.stdout }}"

    # ========================================================================
    # STAGE 2: Install Podman
    # ========================================================================
    - name: "[Podman] Install Podman"
      ansible.builtin.package:
        name: podman
        state: present

    # ========================================================================
    # STAGE 3: Create Storage Directories
    # ========================================================================
    - name: "[Storage] Create GitLab directories"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ gitlab_config_path }}"
        - "{{ gitlab_logs_path }}"
        - "{{ gitlab_data_path }}"

    # ========================================================================
    # STAGE 4: Configure Firewall
    # ========================================================================
    - name: "[Firewall] Open required ports"
      ansible.posix.firewalld:
        port: "{{ item }}"
        permanent: true
        state: enabled
      loop:
        - "{{ gitlab_http_port }}/tcp"
        - "{{ gitlab_https_port }}/tcp"
        - "{{ gitlab_ssh_port }}/tcp"
      ignore_errors: true

    - name: "[Firewall] Reload firewall"
      ansible.builtin.command: firewall-cmd --reload
      ignore_errors: true

    # ========================================================================
    # STAGE 5: Build GitLab Configuration
    # ========================================================================
    - name: "[Config] Set external URL"
      ansible.builtin.set_fact:
        gitlab_external_url_computed: "{{ 'https' if gitlab_use_https else 'http' }}://{{ gitlab_host }}"

    - name: "[Config] Build GITLAB_OMNIBUS_CONFIG"
      ansible.builtin.set_fact:
        gitlab_omnibus_config: >-
          external_url '{{ gitlab_external_url_computed }}';
          gitlab_rails['gitlab_shell_ssh_port']={{ gitlab_ssh_port }};
          letsencrypt['enable']=false;
          prometheus_monitoring['enable']={{ 'false' if gitlab_disable_prometheus else 'true' }};
          grafana['enable']={{ 'false' if gitlab_disable_grafana else 'true' }};
          puma['worker_processes']={{ gitlab_puma_workers }};
          sidekiq['max_concurrency']={{ gitlab_sidekiq_concurrency }}

    # ========================================================================
    # STAGE 6: Stop Existing Container (if any)
    # ========================================================================
    - name: "[Container] Stop existing GitLab container"
      ansible.builtin.command: podman stop gitlab
      ignore_errors: true

    - name: "[Container] Remove existing GitLab container"
      ansible.builtin.command: podman rm gitlab
      ignore_errors: true

    # ========================================================================
    # STAGE 7: Pull and Run GitLab Container
    # ========================================================================
    - name: "[Container] Pull GitLab image"
      ansible.builtin.command: podman pull {{ gitlab_container_image }}

    - name: "[Container] Run GitLab container"
      ansible.builtin.command: >
        podman run -d
        --name gitlab
        --hostname {{ gitlab_hostname }}
        --restart=always
        --ulimit nofile={{ gitlab_ulimit_nofile }}
        --ulimit nproc={{ gitlab_ulimit_nproc }}
        --shm-size {{ gitlab_shm_size }}
        -p {{ gitlab_http_port }}:80
        -p {{ gitlab_https_port }}:443
        -p {{ gitlab_ssh_port }}:22
        -e GITLAB_OMNIBUS_CONFIG="{{ gitlab_omnibus_config }}"
        -v {{ gitlab_config_path }}:/etc/gitlab:Z
        -v {{ gitlab_logs_path }}:/var/log/gitlab:Z
        -v {{ gitlab_data_path }}:/var/opt/gitlab:Z
        {{ gitlab_container_image }}

    # ========================================================================
    # STAGE 8: Wait for GitLab to Initialize
    # ========================================================================
    - name: "[Startup] Wait for GitLab to initialize (5 minutes)"
      ansible.builtin.pause:
        minutes: 5
        prompt: "Waiting for GitLab services to start..."

    - name: "[Startup] Check GitLab container status"
      ansible.builtin.command: podman exec gitlab gitlab-ctl status
      register: gitlab_status
      retries: 5
      delay: 60
      until: gitlab_status.rc == 0
      ignore_errors: true

    # ========================================================================
    # STAGE 9: Retrieve Credentials
    # ========================================================================
    - name: "[Credentials] Get initial root password"
      ansible.builtin.command: podman exec gitlab grep 'Password:' /etc/gitlab/initial_root_password
      register: root_password
      ignore_errors: true

    # ========================================================================
    # STAGE 10: Display Summary
    # ========================================================================
    - name: "[Summary] Display deployment information"
      ansible.builtin.debug:
        msg:
          - "============================================"
          - "   GitLab Hosted Mode Deployment Complete   "
          - "============================================"
          - ""
          - "Access URL: {{ gitlab_external_url_computed }}"
          - "SSH Port:   {{ gitlab_ssh_port }}"
          - "Username:   root"
          - "Password:   {{ root_password.stdout | default('Check /etc/gitlab/initial_root_password') }}"
          - ""
          - "Next Steps:"
          - "1. Login to GitLab UI"
          - "2. Create Personal Access Token (User Settings → Access Tokens → api scope)"
          - "3. Update omnia/input/gitlab_config.yml with:"
          - "   - gitlab_api_token: <your_token>"
          - "   - gitlab_external_url: {{ gitlab_external_url_computed }}"
          - "4. Run gitlab_integrate.yml to set up project and pipeline"
          - "============================================"
