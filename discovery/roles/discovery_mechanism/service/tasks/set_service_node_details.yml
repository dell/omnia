---

- name: Update DHCP server for admin_network in the networks table with management admin ip
  ansible.builtin.shell: >
    set -o pipefail && \
    {{ xcat_sbin_path }}/tabch netname="admin_network" networks.dhcpserver="{{ management_admin_nic_ip }}"
  register: tabch_output
  changed_when: tabch_output.rc == 0

- name: Load service_ha_config if file exists, else set empty dict
  ansible.builtin.set_fact:
    service_ha_config: "{{ (lookup('file', service_ha_config_path, errors='ignore') or '{}') | from_json }}"

- name: Get service_tag map
  get_service_tag_map:
    hierarchical_service_node_data: "{{ hierarchical_service_node_data }}"
    service_ha_config: "{{ service_ha_config }}"
  register: svc_tag_map_result

- name: Create mapping of service_tag to key in hierarchical_service_node_data
  ansible.builtin.set_fact:
    service_tag_map: "{{ svc_tag_map_result.service_tag_map }}"

- name: Configure child groups with xcatmaster and servicenode
  ansible.builtin.command: >
    {{ xcat_bin_path }}/chdef {{ item.node }}
    servicenode={{ service_tag_map[item.parent]['admin_ip'] }}
    xcatmaster={{ service_tag_map[item.parent]['admin_ip'] }}
    conserver={{ service_tag_map[item.parent]['admin_ip'] }}
    monserver={{ service_tag_map[item.parent]['admin_ip'] }}
  loop: "{{ hostvars['omnia_provision']['discovered_nodes'] }}"
  loop_control:
    loop_var: item
  when: item.parent == hostvars[inventory_hostname]['service_tag']
  changed_when: true

- name: Make hosts on service nodes
  block:
    - name: Run makehosts on all service nodes
      ansible.builtin.command: "{{ xcat_sbin_path }}/makehosts -n"
      changed_when: true
      register: makehosts_result
  rescue:
    - name: Log warning if makehosts fails
      ansible.builtin.debug:
        msg: "{{ hosts_entry_warning_msg }} {{ makehosts_result.stderr }}"
      when: makehosts_result.stderr is defined

- name: Task for creating DHCP configuration
  block:
    - name: Create DHCP configuration
      ansible.builtin.command: "{{ xcat_sbin_path }}/makedhcp -n"
      changed_when: true
      register: create_dhcp_config
  rescue:
    - name: DHCP configuration failed
      ansible.builtin.fail:
        msg: "{{ dhcp_config_fail_msg }} {{ create_dhcp_config.stderr }}"
      when: create_dhcp_config.stderr is defined

- name: Make DNS on service nodes
  block:
    - name: Run makedns -n
      ansible.builtin.command: "{{ xcat_sbin_path }}/makedns -n"
      changed_when: true
      register: dns_config
  rescue:
    - name: Log warning if DNS configuration fails
      ansible.builtin.debug:
        msg: "{{ dns_config_warning_msg }} {{ dns_config.stderr }}"
      when: dns_config.stderr is defined

- name: Make DHCP apply on service node group
  block:
    - name: Run makedhcp -a
      ansible.builtin.command: "{{ xcat_sbin_path }}/makedhcp -a"
      changed_when: true
      register: makedhcp_result
  rescue:
    - name: Log failure message if makedhcp -a fails
      ansible.builtin.fail:
        msg: "{{ dhcp_config_apply_fail_msg }} {{ makedhcp_result.stderr }}"
      when: makedhcp_result.stderr is defined

- name: Update DHCP server for admin_network in the networks table using shell
  ansible.builtin.shell: >
    set -o pipefail && \
    {{ xcat_sbin_path }}/tabch netname="admin_network" networks.dhcpserver="<xcatmaster>"
  register: tabch_output
  changed_when: tabch_output.rc == 0
