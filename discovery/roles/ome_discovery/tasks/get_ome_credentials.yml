---

- name: Ensure vault directory exists
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../.vault"
    state: directory
    mode: '0700'

- name: Check if OME credentials vault file exists
  ansible.builtin.stat:
    path: "{{ ome_vault_file }}"
  register: vault_file_stat

- name: Load existing OME credentials from vault
  when: vault_file_stat.stat.exists
  block:
    - name: Check if vault password file exists
      ansible.builtin.stat:
        path: "{{ vault_password_file }}"
      register: vault_password_stat

    - name: Fail if vault password file is missing
      ansible.builtin.fail:
        msg: "Vault password file not found at {{ vault_password_file }}. Delete {{ ome_vault_file }} and re-run to re-enter credentials."
      when: not vault_password_stat.stat.exists

    - name: Decrypt and read OME credentials from vault
      ansible.builtin.command:
        cmd: ansible-vault view {{ ome_vault_file }} --vault-password-file {{ vault_password_file }}
      register: vault_view_output
      changed_when: false
      no_log: true

    - name: Set credentials from vault
      ansible.builtin.set_fact:
        ome_ip: "{{ vault_view_output.stdout | regex_search('vault_ome_ip:\\s*\"?([^\"\\n]+)\"?', '\\1') | first }}"
        ome_username: "{{ vault_view_output.stdout | regex_search('vault_ome_username:\\s*\"?([^\"\\n]+)\"?', '\\1') | first }}"
        ome_password: "{{ vault_view_output.stdout | regex_search('vault_ome_password:\\s*\"?([^\"\\n]+)\"?', '\\1') | first }}"
      no_log: true

- name: Prompt for OME credentials if not in vault
  when: not vault_file_stat.stat.exists
  block:
    - name: Display credential prompt message
      ansible.builtin.debug:
        msg: "{{ ome_credentials_prompt_msg }}"

    - name: Prompt for OME IP address
      ansible.builtin.pause:
        prompt: "Enter OME IP address"
      register: ome_ip_input
      when: ome_ip is not defined or ome_ip == ''

    - name: Prompt for OME username
      ansible.builtin.pause:
        prompt: "Enter OME username"
      register: ome_username_input
      when: ome_username is not defined or ome_username == ''

    - name: Prompt for OME password
      ansible.builtin.pause:
        prompt: "Enter OME password"
        echo: false
      register: ome_password_input
      when: ome_password is not defined or ome_password == ''

    - name: Set OME credentials from prompts
      ansible.builtin.set_fact:
        ome_ip: "{{ ome_ip_input.user_input | default(ome_ip) }}"
        ome_username: "{{ ome_username_input.user_input | default(ome_username) }}"
        ome_password: "{{ ome_password_input.user_input | default(ome_password) }}"
      no_log: true

    - name: Generate vault password if not exists
      ansible.builtin.copy:
        content: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
        dest: "{{ vault_password_file }}"
        mode: '0600'
      when: not (lookup('file', vault_password_file, errors='ignore') | default(''))

    - name: Create OME credentials vault file
      ansible.builtin.copy:
        content: |
          ---
          vault_ome_ip: "{{ ome_ip }}"
          vault_ome_username: "{{ ome_username }}"
          vault_ome_password: "{{ ome_password }}"
        dest: "{{ ome_vault_file }}"
        mode: '0600'
      no_log: true

    - name: Encrypt the vault file
      ansible.builtin.command:
        cmd: ansible-vault encrypt {{ ome_vault_file }} --vault-password-file {{ vault_password_file }}
      changed_when: true
      no_log: true

- name: Validate OME credentials are set
  ansible.builtin.fail:
    msg: "OME credentials (ome_ip, ome_username, ome_password) must be provided"
  when: >
    ome_ip is not defined or ome_ip == '' or
    ome_username is not defined or ome_username == '' or
    ome_password is not defined or ome_password == ''
