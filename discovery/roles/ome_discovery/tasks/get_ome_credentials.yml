---

- name: Load OME credentials from unified credential file
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../../common/tasks/common/decrypt_include_encrypt.yml"
  vars:
    credential_file_path: "{{ omnia_config_credentials_file }}"
    vault_password_file: "{{ omnia_config_credentials_vault_key }}"

- name: Validate OME credentials are set
  ansible.builtin.fail:
    msg: "OME credentials (ome_ip, ome_username, ome_password) must be provided. Run prepare_oim or get_config_credentials first."
  when: >
    ome_ip is not defined or ome_ip == '' or
    ome_username is not defined or ome_username == '' or
    ome_password is not defined or ome_password == ''
