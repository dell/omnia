# -----------------------------Powervault-------------------------------------------
# powervault_config
# Mandatory when using PowerVault for persistent storage.
# Below parameters are mandatory when powervault_config is defined
    # ip: A list of PowerVault controller ipv4 addresses used for iSCSI target discovery and login.
    # iscsi_initiator: Specifies the InitiatorName used by the host when connecting to the iSCSI target. This IQN uniquely identifies the host to the storage array.
    # volume_id: This is the unique WWN/identifier for the specific volume that should be used for persistent storage. This value is used for multipath scanning to select the correct mapped device.

# Below are the optional parameters when powervault_config is defined
    # port: Defines the TCP port for the iSCSI target service. When port is not specified, default port used will be 3260

# Below is an example on how to configure powervault_config
# In this configuration, a single controller portal is provided.

#powervault_config:
#  ip:
#    - 172.1.2.3
#  port: 3260
#  iscsi_initiator: iqn.2025-01.com.dell:scontrol-node
#  volume_id: 00c0ff4343f1f1f1001c8c4e6901000000


# -----------------------------NFS------------------------------------------------

# This variable is used for mounting NFS share on slurm_control_node, slurm_node, login_node
# This takes a list of dicts with possible keys server_ip, server_share_path, client_share_path, client_mount_options
# In both the cases, the USER must manually update 'server_ip' and 'server_share_path' below with the correct values.
# If mount_option values are empty, NFS client will be mounted with these values "nosuid,rw,sync,hard,intr"
# Its mandatory to provide atleast one entry in nfs_client_params
# Example for single mount file system:
# nfs_client_params:
# nfs_name : str ,Name of the NFS storage resource. The default is "nfs_storage_default".
#     The user can assign any custom string to specify a different NFS storage resource.
# - { server_ip: 10.5.0.101, server_share_path: "/mnt/share", client_share_path: "/home", client_mount_options: "nosuid,rw,sync,hard"}
# Example for supporting multiple mount points:
# nfs_client_params:
# - { server_ip: 198.168.0.1,server_share_path: "/mnt/share1", client_share_path: "/home", client_mount_options: "nosuid,rw,sync,hard"}
# - { server_ip: 198.168.0.2, server_share_path: "/mnt/share2", client_share_path: "/mnt/mount2", client_mount_options: "nosuid,rw,sync,hard"}
# Example for multiple mount file system:
# nfs_client_params:
# - { server_ip: 198.168.0.1, server_share_path: "/mnt/share1", client_share_path: "/mnt/mount1", client_mount_options: "nosuid,rw,sync,hard"}
# - { server_ip: 198.168.0.2, server_share_path: "/mnt/share2", client_share_path: "/mnt/mount2", client_mount_options: "nosuid,rw,sync,hard"}
nfs_client_params:
  - server_ip: "172.16.107.168" # Provide the IP of the NFS server
    server_share_path: "/mnt/share/omnia" # Provide server share path of the NFS Server
    client_share_path: /share_omnia
    client_mount_options: "nosuid,rw,sync,hard,intr"
    nfs_name: nfs_slurm

  - server_ip: "172.16.107.121" # Provide the IP of the NFS server
    server_share_path: "/mnt/share/omnia_k8s" # Provide server share path of the NFS Server
    client_share_path: /share_omnia_k8s
    client_mount_options: "nosuid,rw,sync,hard,intr"
    nfs_name: nfs_k8s
    

# -----------------------------Cloud-Init Mounts------------------------------------------------
# mounts
# Configure mount points and swap files compatible with cloud-init mounts module
# This configuration will be used to generate cloud-init compatible mount configurations

# Each mount entry contains the following fields (matching /etc/fstab format):
#   - name: Unique identifier for this mount entry (e.g., "iscsi_slurm_persist", "nfs_slurm_home"). Required
#   - source: Device name (e.g., /dev/sdc, UUID=xxx, or network path like 192.168.1.100:/export/share). Required
#   - mount_point: Mount point path (e.g., /mnt, /opt/data). Required
#   - fs_type: Filesystem type (e.g., ext4, xfs, nfs, cifs, auto). Optional
#       - Supported: nfs, nfs4, cifs, tmpfs, cephfs, btrfs, ext2, ext3, ext4, xfs, none, etc.
#       - For network filesystems (nfs, cifs, etc.), source should be the server path (e.g., 192.168.1.100:/export/share)
#       - If specified, takes PRIORITY over mount_default_field
#   - mnt_opts: Mount options (e.g., defaults,noexec,nofail). Optional
#       - If specified, takes PRIORITY over mount_default_field
#   - dump_freq: Dump frequency (usually "0"). Optional
#       - If specified, takes PRIORITY over mount_default_field
#   - fsck_pass: Fsck pass number (usually "0" or "2"). Optional
#       - If specified, takes PRIORITY over mount_default_field
#   - mount_default_field: Name of the default profile to use (references mount_default_fields.name). Optional
#       - Used ONLY for fields not explicitly specified in the mount entry
#       - If not specified, system will auto-select based on fs_type or use global defaults
#   - roles: List of node roles to apply this mount to (e.g., ["slurm_control_node", "slurm_node"]). Required
#
# PRIORITY ORDER for field resolution:
#   1. Explicit value in mount entry (HIGHEST PRIORITY)
#   2. Value from mount_default_field profile (if specified)
#   3. Auto-selected profile based on fs_type
#   4. Global fallback profile
#   5. Hardcoded system defaults (LOWEST PRIORITY)

# mount_default_fields: Mapping of named default profiles (key = profile name)
# Each profile (value) contains:
#   - fs_type: Default filesystem type (e.g., "auto", "xfs", "nfs"). Required
#   - mnt_opts: Default mount options (e.g., "defaults,nofail,_netdev"). Required
#   - dump_freq: Default dump frequency (usually "0"). Required
#   - fsck_pass: Default fsck pass number (usually "0" or "2"). Required
# Note: Profiles are templates that can be referenced by any mount entry
# Note: Profile names must match pattern ^[a-zA-Z0-9_-]+$ (alphanumeric, underscore, hyphen)

# swap: Swap file configuration (list of swap configurations)
# Each swap entry contains the following fields:
#   - name: Unique identifier for this swap entry (e.g., "compute_swap", "slurm_swap"). Required
#   - filename: Path to the swap file to create (e.g., /swapfile). Required
#   - size: Size in bytes, 'auto', or human-readable format (e.g., "2G", "512M"). Required
#            Units: B, K, M, G, T (Note: 1K = 1024B)
#   - maxsize: Maximum size in bytes or human-readable format (used with size: auto). Optional
#   - roles: List of node roles to apply this swap to (e.g., ["slurm_node"]). Required

# Example configuration:
# mounts:
#   # Example 1: PowerVault iSCSI storage - Fully specified for Slurm persistent storage
#   - name: "powervault_slurm_persist"
#     source: "/dev/mapper/mpatha1"  # PowerVault multipath device partition
#     mount_point: "/mnt/slurm-persist"
#     fs_type: "xfs"
#     mnt_opts: "defaults,_netdev,noatime,x-systemd.requires=iscsi.service"
#     dump_freq: "0"
#     fsck_pass: "0"
#     roles: ["slurm_control_node"]
#     # All fields explicit - mount_default_field not needed
#
#   # Example 2: VAST NFS storage - Home directories using default profile
#   - name: "vast_home"
#     source: "192.168.1.100:/home"  # VAST NFS export
#     mount_point: "/home"
#     mount_default_field: "default"
#     # fs_type, mnt_opts, dump_freq, fsck_pass ALL from default profile
#     roles: ["slurm_control_node", "slurm_node", "login_node"]
#
#   # Example 3: VAST NFS storage - Shared applications with explicit fs_type
#   - name: "vast_apps"
#     source: "192.168.1.100:/apps"  # VAST NFS export
#     mount_point: "/opt/apps"
#     fs_type: "nfs4"  # ← EXPLICIT (takes priority over profile)
#     mount_default_field: "network_storage"
#     # mnt_opts, dump_freq, fsck_pass from network_storage profile
#     # fs_type from network_storage is IGNORED (explicit wins)
#     roles: ["slurm_control_node", "slurm_node"]
#
#   # Example 4: VAST NFS storage - Read-only data with custom mount options
#   - name: "vast_data_ro"
#     source: "192.168.1.100:/datasets"  # VAST NFS export
#     mount_point: "/data"
#     fs_type: "nfs4"  # ← EXPLICIT
#     mnt_opts: "defaults,nofail,_netdev,ro,noatime"  # ← EXPLICIT (read-only)
#     mount_default_field: "network_storage"
#     # dump_freq, fsck_pass from network_storage profile
#     # fs_type and mnt_opts from network_storage are IGNORED (explicit wins)
#     roles: ["slurm_node"]
#
#   # Example 5: PowerVault bind mount - MySQL data directory
#   - name: "powervault_mysql_bind"
#     source: "/mnt/slurm-persist/mysql"
#     mount_point: "/var/lib/mysql"
#     mount_default_field: "bind_mounts"
#     # fs_type, mnt_opts, dump_freq, fsck_pass ALL from bind_mounts profile
#     roles: ["slurm_control_node"]
#
#   # Example 6: VAST NFS storage - Scratch space with high-performance options
#   - name: "vast_scratch"
#     source: "192.168.1.100:/scratch"  # VAST NFS export
#     mount_point: "/scratch"
#     fs_type: "nfs4"
#     mnt_opts: "defaults,nofail,_netdev,noatime,nodiratime,rsize=1048576,wsize=1048576"
#     dump_freq: "0"
#     fsck_pass: "0"
#     roles: ["slurm_node"]

mounts: []
  # Example 1: VAST NFS storage - Home directories using default NFS profile
  # - name: "vast_home"
  #   source: "192.168.1.100:/home"
  #   mount_point: "/home"
  #   mount_default_field: "default"
  #   # fs_type (nfs), mnt_opts, dump_freq, fsck_pass will be filled from default profile
  #   roles: ["slurm_control_node", "slurm_node", "login_node"]
  #
  # Example 2: PowerVault iSCSI storage - Fully specified persistent storage
  # - name: "powervault_slurm_persist"
  #   source: "/dev/mapper/mpatha1" #TODO: how to derive this?
  #   mount_point: "/mnt/slurm-persist"
  #   fs_type: "xfs"
  #   mnt_opts: "defaults,_netdev,noatime,x-systemd.requires=iscsi.service"
  #   dump_freq: "0"
  #   fsck_pass: "0"
  #   roles: ["slurm_control_node"]
  #
  # Example 3: VAST NFS storage - High-performance scratch with custom options
  # - name: "vast_scratch"
  #   source: "192.168.1.100:/scratch"
  #   mount_point: "/scratch"
  #   fs_type: "nfs4"
  #   mnt_opts: "defaults,nofail,_netdev,noatime,nodiratime,rsize=1048576,wsize=1048576"
  #   dump_freq: "0"
  #   fsck_pass: "0"
  #   roles: ["slurm_node"]

# Named default profiles for mount configurations
mount_default_fields:
  # Default NFS mount configuration - standard NFS defaults
  default:
    fs_type: "nfs"
    mnt_opts: "defaults,nofail,_netdev,x-systemd.after=cloud-init-network.service"
    dump_freq: "0"
    fsck_pass: "0"

  # VAST NFS storage - Standard configuration for VAST Data NFS exports
  vast_nfs:
    fs_type: "nfs4"
    mnt_opts: "defaults,nofail,_netdev,noatime,x-systemd.after=cloud-init-network.service"
    dump_freq: "0"
    fsck_pass: "0"

  # VAST NFS storage - High-performance configuration with large buffers
  vast_nfs_performance:
    fs_type: "nfs4"
    mnt_opts: "defaults,nofail,_netdev,noatime,nodiratime,rsize=1048576,wsize=1048576"
    dump_freq: "0"
    fsck_pass: "0"

  # PowerVault iSCSI storage - Block device with XFS filesystem
  powervault_iscsi:
    fs_type: "xfs"
    mnt_opts: "defaults,_netdev,noatime,x-systemd.requires=iscsi.service"
    dump_freq: "0"
    fsck_pass: "0"

  # Network storage defaults (generic NFS, CIFS, etc.)
  network_storage:
    fs_type: "auto"
    mnt_opts: "defaults,nofail,_netdev,x-systemd.after=cloud-init-network.service"
    dump_freq: "0"
    fsck_pass: "0"

  # Local storage defaults (ext4, xfs, etc.)
  local_storage:
    fs_type: "auto"
    mnt_opts: "defaults,nofail,noatime"
    dump_freq: "0"
    fsck_pass: "2"

  # Bind mount defaults
  bind_mounts:
    fs_type: "none"
    mnt_opts: "bind"
    dump_freq: "0"
    fsck_pass: "0"

  # High-performance scratch storage
  scratch_storage:
    fs_type: "xfs"
    mnt_opts: "defaults,nofail,noatime,nodiratime,largeio,inode64"
    dump_freq: "0"
    fsck_pass: "2"

  # Global fallback defaults
  global:
    fs_type: "auto"
    mnt_opts: "defaults,nofail,x-systemd.after=cloud-init-network.service"
    dump_freq: "0"
    fsck_pass: "2"

# Example swap configuration:
