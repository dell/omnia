# ─────────────────────────────────────────────────────────────────────────
# ISO Configuration for Unattended OS Installation
#
# This file configures the utils/install_os_arm_node playbook.
# Copy this file to your input project directory
# (e.g., /opt/omnia/input/project_default/iso_config.yml)
# and customize as needed.
# ─────────────────────────────────────────────────────────────────────────

# Path to the pre-placed RHEL 10.x AArch64 Server with GUI full DVD ISO.
# The ISO must be accessible on the OIM node.
# Default: /opt/omnia/rhel_10.0_aarch64.iso
# iso_source_path: "/opt/omnia/rhel_10.0_aarch64.iso"

# SHA-256 checksum for source ISO verification (optional but recommended).
# iso_source_checksum: ""

# Output directory for the repacked ISO and manifest.
# Default: /opt/omnia/iso_output
# iso_target_directory: "/opt/omnia/iso_output"

# User-provided Kickstart file path (optional).
# When set, the playbook uses this Kickstart instead of the default template.
# kickstart_file: ""

# Kickstart Jinja2 template name (used when kickstart_file is not set).
# Available templates: admin_aarch64
# Default: admin_aarch64
# kickstart_template: "admin_aarch64"

# NFS share path where the repacked ISO will be accessible
# for iDRAC OS Deployment Service.
# Format: <nfs_server_ip>:<nfs_share_path>/<iso_filename>
# Example: 10.10.0.1:/opt/omnia/iso_output/custom-rhel-10.0-ks.iso
# The NFS share must be exported from the OIM node.
# iso_nfs_share: ""

# Optional: NFS share credentials (if the NFS server requires authentication)
# nfs_share_user: ""
# nfs_share_password: ""

# ISO exposure duration in minutes (how long iDRAC exposes the ISO as CD-ROM).
# Default: 1080 minutes (18 hours)
# expose_duration: 1080

# Force reinstallation even if the target node is already reachable via SSH.
# Default: false
# force_reinstall: false

# Network configuration for the installed node
# These override values derived from network_spec.yml and PXE mapping.
# netmask: "255.255.255.0"
# gateway: ""
# dns: ""
# network_device: ""
# timezone: "UTC"
