# This file configures DNS-based hostname resolution for the cluster.
# When enabled, compute nodes use the OIM's coresmd (CoreDNS with the
# OpenCHAMI SMD plugin) instead of /etc/hosts for name resolution.
#
# DNS records are generated automatically from OpenCHAMI SMD inventory.
# No per-node DNS entries are required.
#
# 'dns_enabled': Master toggle for DNS-based resolution.
#   - true:  Nodes use coresmd DNS; /etc/hosts peer entries are skipped.
#   - false: Traditional /etc/hosts-based resolution is used (default).
#
# 'dns_domain': Internal DNS domain for the cluster.
#   All node hostnames are registered under this domain
#   (e.g., nid0001.hpc.cluster). Must be a valid DNS domain name (RFC 1035).
#   Must NOT overlap with public TLDs or Kubernetes 'cluster.local'.

dns_config:
  dns_enabled: false
  dns_domain: "hpc.cluster"
