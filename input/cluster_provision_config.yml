# ***********************************************************************
# DO NOT REMOVE OR COMMENT OUT ANY LINES IN THIS FILE.
# SIMPLY APPEND THE REQUIRED VALUES AGAINST THE PARAMETER OF YOUR CHOICE.
# ***********************************************************************

# provision config details
provision_config:
  #### Mandatory
  # This depicts the path where user has kept the PXE mapping file.
  # The mapping file consists of the Service tag, Admin MAC,Hostname and its respective admin IP address, BMC IP and BMC MAC.
  # Ensure that admin IPs given in mapping file are within the admin_static_ranges.
  # A templates for mapping file exists in omnia/examples, namely, pxe_mapping_file.csv
  # Format of csv: SERVICE_TAG,ADMIN_MAC,HOSTNAME,ADMIN_IP,BMC_IP,BMC_MAC
  mapping_file_path: ""
  dhcp_range:
  os_details:
    x86_64:
      flavor:
      version:
    aarch64: 
      flavor:
      version:

  #### Mandatory
  # Timezone that needs to be set during OS provisioning.
  # Available timezones are provided in discovery/roles/discovery_validations/common/files/timezone.txt
  # Default: "GMT"
  # Few accepted values: EST,CET,MST,CST6CDT,PST8PDT
  timezone: "GMT"

  #### Mandatory
  # Language that needs to be set during OS provisioning.
  # Default language supported is "en-US"
  language: "en-US"

  dhcp_lease_time:
 

# Omnia Infrastructure Manager node details
oim_config:
  enable_ha: false
  nodes:
    - nic_name: "eno1"
      admin_ip: 
    #### Conditional Mandatory
    # bmc_ip: The iDRAC  IP address of the OIM server,
    #    Mandatory only if idrac_telemetry is set to true and telemetry data needs to be collected from the OIM server.
    #    Optional — can be omitted if iDRAC telemetry for the OIM server is not required.
      bmc_ip: # "10.5.2.254"

network_config:
  description: List of all networks needs for the deployment
  networks:
    - cidr: 10.5.0.0/16
      description: Admin network for manage management traffic of servers
      name: admin_network1
      type: admin_nw
      dns: []


