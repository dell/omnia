---

- name: Load dns_config.yml
  ansible.builtin.include_vars:
    file: "{{ hostvars['localhost']['input_project_dir'] }}/dns_config.yml"
  register: dns_config_loaded
  failed_when: false

- name: Set dns_enabled flag
  ansible.builtin.set_fact:
    dns_enabled: "{{ dns_config.dns_enabled | default(false) | bool }}"
  when: dns_config_loaded is not failed and dns_config is defined

- name: Set dns_enabled to false when dns_config is unavailable
  ansible.builtin.set_fact:
    dns_enabled: false
  when: dns_config_loaded is failed or dns_config is not defined

- name: Deploy CoreDNS for authoritative cluster DNS
  when: dns_enabled | bool
  block:
    - name: Set CoreDNS configuration facts
      ansible.builtin.set_fact:
        dns_domain: "{{ dns_config.dns_domain | default('hpc.cluster') }}"
        dns_ttl: "{{ dns_config.dns_ttl | default(300) }}"
        dns_reverse_enabled: "{{ dns_config.dns_reverse_enabled | default(true) }}"
        dns_cache_ttl: "{{ dns_config.dns_cache_ttl | default(60) }}"
        dns_fabric_suffixes: "{{ dns_config.dns_fabric_suffixes | default([]) }}"
        dns_soa_refresh: "{{ dns_config.dns_soa.refresh | default(3600) }}"
        dns_soa_retry: "{{ dns_config.dns_soa.retry | default(600) }}"
        dns_soa_expire: "{{ dns_config.dns_soa.expire | default(86400) }}"
        dns_upstream_servers: "{{ network_data.admin_network.dns | default([]) }}"

    - name: Build reverse zone list from admin network
      ansible.builtin.set_fact:
        coredns_reverse_zones: >-
          {{
            [network_data.admin_network.subnet | regex_replace('^(\d+)\.(\d+)\.(\d+)\.\d+$', '\3.\2.\1')]
            + (network_data.admin_network.additional_subnets | default([])
               | map(attribute='subnet')
               | map('regex_replace', '^(\d+)\.(\d+)\.(\d+)\.\d+$', '\3.\2.\1')
               | list)
          }}

    - name: Create CoreDNS directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "{{ dir_permissions_755 }}"
      with_items:
        - "{{ coredns_config_dir }}"
        - "{{ coredns_zone_dir }}"

    - name: Generate Corefile
      ansible.builtin.template:
        src: "{{ role_path }}/templates/Corefile.j2"
        dest: "{{ coredns_config_dir }}/Corefile"
        mode: "{{ file_permissions_644 }}"

    - name: Pull CoreDNS container image
      ansible.builtin.command: "podman pull {{ coredns_image }}"
      register: coredns_pull
      until: coredns_pull is not failed
      retries: "{{ pull_image_retries }}"
      delay: "{{ pull_image_delay }}"
      changed_when: true

    - name: Create CoreDNS systemd quadlet directory
      ansible.builtin.file:
        path: /etc/containers/systemd
        state: directory
        mode: "{{ dir_permissions_755 }}"

    - name: Deploy CoreDNS container quadlet
      ansible.builtin.template:
        src: "{{ role_path }}/templates/coredns.container.j2"
        dest: /etc/containers/systemd/coredns.container
        mode: "{{ file_permissions_644 }}"
      notify: reload_systemd

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true
      listen: reload_systemd

    - name: Enable and start CoreDNS service
      ansible.builtin.systemd:
        name: coredns
        state: started
        enabled: true

    - name: Verify CoreDNS is running
      ansible.builtin.command: podman ps --filter name=systemd-coredns --format {% raw %}"{{ .Status }}"{% endraw %}
      register: coredns_status
      changed_when: false
      failed_when: "'Up' not in coredns_status.stdout"
      retries: 3
      delay: 5

    - name: CoreDNS deployment status
      ansible.builtin.debug:
        msg: "CoreDNS deployed successfully. Domain: {{ dns_domain }}, Zone dir: {{ coredns_zone_dir }}"
