---

- name: Prepare Kubespray directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop: "{{ kubespray_directories }}"

- name: Check if Kubespray container(s) are already deployed
  block:
    - name: Check if {{ kubespray_image_name }}_{{ item }} is already running and port is occupied # noqa: name[template]
      containers.podman.podman_container_info:
        name: "{{ kubespray_image_name }}_{{ item }}"
      register: kubespray_container_info
      failed_when: false

    - name: Check if {{ kubespray_ssh_ports[item] }} is occupied # noqa: name[template]
      ansible.builtin.wait_for:
        host: localhost
        port: "{{ kubespray_ssh_ports[item] }}"
        state: stopped
        timeout: "{{ wait_time }}"
        msg: "{{ kubespray_port_occupied_msg | replace('{{ kubespray_ssh_port }}', '{{ kubespray_ssh_ports[item] }}') }}"
      register: kubespray_port_check
      failed_when: false
      when: kubespray_container_info.containers | length == 0
  loop: "{{ kubespray_versions }}"

- name: Deploy Kubespray container(s) and check deployment status
  block:
    - name: Deploy Kubespray container(s)
      block:
        - name: Pull the Kubespray image
          containers.podman.podman_image:
            name: "{{ kubespray_image_name }}:{{ item }}"
            state: present
          register: image_pull_result

        - name: Fail if the Kubespray image pull fails
          ansible.builtin.fail:
            msg: "{{ kubespray_image_pull_fail_msg | replace('{{ kubespray_image_tag }}', '{{ item }}')}}"
          when: image_pull_result.failed

        - name: Deploy the Kubespray container(s)
          containers.podman.podman_container:
            name: "{{ kubespray_image_name }}_{{ item }}"
            image: "{{ kubespray_image_name }}:{{ item }}"
            state: present
            restart_policy: "no"
            hostname: "{{ kubespray_image_name }}_{{ item }}"
            network_mode: host
            volumes: "{{ kubespray_volumes }}"
            cap_add:
              - AUDIT_WRITE

        - name: Start the Kubespray container
          containers.podman.podman_container:
            name: "{{ kubespray_image_name }}_{{ item }}"
            state: started

        - name: Check if Kubespray container is running after deployment
          containers.podman.podman_container_info:
            name: "{{ kubespray_image_name }}_{{ item }}"
          register: kubespray_container_status

        - name: Notify user of Kubespray container deployment status
          ansible.builtin.debug:
            msg: "The {{ kubespray_image_name }}_{{ item }} container has been successfully deployed."
          when:
            - kubespray_container_status.containers | length > 0
            - kubespray_container_status.containers[0].State.Status == 'running'
      loop: "{{ kubespray_versions }}"

  rescue:
    - name: Kubespray container deployment failed
      ansible.builtin.fail:
        msg: "{{ kubespray_container_failure_msg | replace('{{ kubespray_container_name }}', '{{ kubespray_image_name }}_{{ item }}')}}"
