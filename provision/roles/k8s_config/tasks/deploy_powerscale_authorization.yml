---
# CSM Authorization Proxy Server: File Validation and NFS Staging
# This task runs independently of powerscale_telemetry_support.
# Gated by: powerscale_authorization.enabled AND csi_driver_powerscale_support

- name: Validate CSI driver PowerScale is configured (required for authorization)
  ansible.builtin.assert:
    that:
      - hostvars['localhost']['csi_driver_powerscale_support'] | default(false) | bool
    fail_msg: "{{ ps_csi_driver_not_configured_msg }}"

- name: Display CSM Authorization status
  ansible.builtin.debug:
    msg: "{{ ps_authz_enabled_msg }}"
    verbosity: 2

- name: Set CSM Authorization configuration facts
  ansible.builtin.set_fact:
    ps_authz_values_file: >-
      {{ hostvars['localhost']['service_cluster_info'].powerscale_authorization.csm_authorization_values_file_path | default('') }}
    ps_authz_tenants: >-
      {{ hostvars['localhost']['service_cluster_info'].powerscale_authorization.tenants | default([]) }}
  no_log: true

- name: Validate CSM Authorization values file path is provided
  ansible.builtin.assert:
    that:
      - ps_authz_values_file | length > 0
    fail_msg: "{{ ps_authz_values_missing_msg }}"

- name: Verify CSM Authorization values file exists
  ansible.builtin.stat:
    path: "{{ ps_authz_values_file }}"
  register: authz_values_stat
  delegate_to: localhost

- name: Fail if CSM Authorization values file does not exist
  ansible.builtin.fail:
    msg: "{{ ps_authz_values_not_found_msg }}"
  when: not authz_values_stat.stat.exists

- name: Validate at least one tenant is defined
  ansible.builtin.assert:
    that:
      - ps_authz_tenants | length > 0
    fail_msg: "{{ ps_authz_no_tenants_msg }}"

- name: Check if PowerScale telemetry is enabled
  ansible.builtin.set_fact:
    ps_telemetry_enabled: false
  when: hostvars['localhost']['telemetry_config'] is not defined

- name: Determine PowerScale telemetry status
  ansible.builtin.set_fact:
    ps_telemetry_enabled: >-
      {{ hostvars['localhost']['telemetry_config'].telemetry_sources.powerscale.telemetry_enabled | default(false) | bool }}
  when: hostvars['localhost']['telemetry_config'] is defined

- name: Auto-generate OTLP address if PowerScale telemetry is enabled
  block:
    - name: Get PowerScale cluster name from telemetry config
      ansible.builtin.set_fact:
        ps_cluster_name: >-
          {{ hostvars['localhost']['telemetry_config'].telemetry_sources.powerscale.configurations[0].cluster_name | default('powerscale') }}

    - name: Construct OTLP collector address
      ansible.builtin.set_fact:
        otlp_collector_address: "otel-collector.{{ ps_cluster_name }}-observability.svc.cluster.local:4317"

    - name: Display auto-generated OTLP address
      ansible.builtin.debug:
        msg: "PowerScale telemetry enabled. Auto-configuring OTLP address: {{ otlp_collector_address }}"
        verbosity: 1

    - name: Inject OTLP address into CSM Authorization values file
      ansible.builtin.replace:
        path: "{{ ps_authz_values_file }}"
        regexp: 'openTelemetryCollectorAddress:\s*""'
        replace: 'openTelemetryCollectorAddress: "{{ otlp_collector_address }}"'
        backup: yes

    - name: Inject OTLP address (alternative format - with null)
      ansible.builtin.replace:
        path: "{{ ps_authz_values_file }}"
        regexp: 'openTelemetryCollectorAddress:\s*null'
        replace: 'openTelemetryCollectorAddress: "{{ otlp_collector_address }}"'
      when: ansible_check_mode is not defined

  when: ps_telemetry_enabled | default(false) | bool

- name: Display message when telemetry is not enabled
  ansible.builtin.debug:
    msg: "PowerScale telemetry is not enabled. OTLP address will remain empty in values.yaml."
    verbosity: 1
  when: not ps_telemetry_enabled | default(false) | bool

- name: Create CSM Authorization directory on NFS share
  ansible.builtin.file:
    path: "{{ csm_authz_nfs_dir }}"
    state: directory
    mode: '0755'

- name: Copy CSM Authorization values file to NFS share
  ansible.builtin.copy:
    src: "{{ ps_authz_values_file }}"
    dest: "{{ csm_authz_nfs_dir }}/csm-authorization-values.yaml"
    mode: '0600'

- name: Create empty root certificate placeholder (insecure mode)
  ansible.builtin.copy:
    content: ""
    dest: "{{ csm_authz_nfs_dir }}/rootCertificate.pem"
    mode: '0600'

- name: Generate JWT signing secret for authorization
  ansible.builtin.set_fact:
    ps_authz_jwt_secret: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=32') }}"
  no_log: true

- name: Stage JWT signing secret for cloud-init
  ansible.builtin.copy:
    content: |
      AUTHZ_JWT_SECRET='{{ ps_authz_jwt_secret }}'
    dest: "{{ csm_authz_nfs_dir }}/authz_jwt_secret.env"
    mode: '0600'
  no_log: true

- name: Display CSM Authorization staging status
  ansible.builtin.debug:
    msg: "{{ ps_authz_staged_msg }}"
    verbosity: 2
