---
# CSM Authorization Proxy Server: File Validation and NFS Staging
# This task runs independently of powerscale_telemetry_support.
# Gated by: powerscale_authorization.enabled AND csi_driver_powerscale_support

- name: Validate CSI driver PowerScale is configured (required for authorization)
  ansible.builtin.assert:
    that:
      - hostvars['localhost']['csi_driver_powerscale_support'] | default(false) | bool
    fail_msg: "{{ ps_csi_driver_not_configured_msg }}"

- name: Display CSM Authorization status
  ansible.builtin.debug:
    msg: "{{ ps_authz_enabled_msg }}"
    verbosity: 2

- name: Set CSM Authorization configuration facts
  ansible.builtin.set_fact:
    ps_authz_values_file: >-
      {{ hostvars['localhost']['service_cluster_info'].powerscale_authorization.csm_authorization_values_file_path | default('') }}
    ps_authz_admin_name: >-
      {{ hostvars['localhost']['service_cluster_info'].powerscale_authorization.admin_name | default('') }}
    ps_authz_admin_secret: >-
      {{ hostvars['localhost']['service_cluster_info'].powerscale_authorization.admin_secret | default('') }}
    ps_authz_access_token_exp: >-
      {{ hostvars['localhost']['service_cluster_info'].powerscale_authorization.access_token_expiration | default('30m') }}
    ps_authz_refresh_token_exp: >-
      {{ hostvars['localhost']['service_cluster_info'].powerscale_authorization.refresh_token_expiration | default('720h') }}
    ps_authz_tenants: >-
      {{ hostvars['localhost']['service_cluster_info'].powerscale_authorization.tenants | default([]) }}
  no_log: true

- name: Validate CSM Authorization values file path is provided
  ansible.builtin.assert:
    that:
      - ps_authz_values_file | length > 0
    fail_msg: "{{ ps_authz_values_missing_msg }}"

- name: Verify CSM Authorization values file exists
  ansible.builtin.stat:
    path: "{{ ps_authz_values_file }}"
  register: authz_values_stat
  delegate_to: localhost

- name: Fail if CSM Authorization values file does not exist
  ansible.builtin.fail:
    msg: "{{ ps_authz_values_not_found_msg }}"
  when: not authz_values_stat.stat.exists

- name: Validate admin_name is provided
  ansible.builtin.assert:
    that:
      - ps_authz_admin_name | length > 0
    fail_msg: "{{ ps_authz_admin_name_missing_msg }}"

- name: Validate admin_secret is provided
  ansible.builtin.assert:
    that:
      - ps_authz_admin_secret | length > 0
    fail_msg: "{{ ps_authz_admin_secret_missing_msg }}"
  no_log: true

- name: Validate at least one tenant is defined
  ansible.builtin.assert:
    that:
      - ps_authz_tenants | length > 0
    fail_msg: "{{ ps_authz_no_tenants_msg }}"

- name: Create CSM Authorization directory on NFS share
  ansible.builtin.file:
    path: "{{ csm_authz_nfs_dir }}"
    state: directory
    mode: '0755'

- name: Copy CSM Authorization values file to NFS share
  ansible.builtin.copy:
    src: "{{ ps_authz_values_file }}"
    dest: "{{ csm_authz_nfs_dir }}/csm-authorization-values.yaml"
    mode: '0600'

- name: Create empty root certificate placeholder (insecure mode)
  ansible.builtin.copy:
    content: ""
    dest: "{{ csm_authz_nfs_dir }}/rootCertificate.pem"
    mode: '0600'

- name: Stage admin credentials for cloud-init token generation
  ansible.builtin.copy:
    content: |
      AUTHZ_ADMIN_NAME='{{ ps_authz_admin_name }}'
      AUTHZ_ADMIN_SECRET='{{ ps_authz_admin_secret }}'
      AUTHZ_ACCESS_TOKEN_EXP='{{ ps_authz_access_token_exp }}'
      AUTHZ_REFRESH_TOKEN_EXP='{{ ps_authz_refresh_token_exp }}'
    dest: "{{ csm_authz_nfs_dir }}/admin_credentials.env"
    mode: '0600'
  no_log: true

- name: Display CSM Authorization staging status
  ansible.builtin.debug:
    msg: "{{ ps_authz_staged_msg }}"
    verbosity: 2
