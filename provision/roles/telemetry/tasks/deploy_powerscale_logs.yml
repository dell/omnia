---

# Configure PowerScale syslog collection via shared VLAgent
# Conditional: powerscale_log_enabled must be true
# Note: CSI driver is NOT required for log collection (independent pipeline)
#
# Configuration:
#   - Shared VLAgent (vlagent-config Secret) is updated with PowerScale external labels
#   - Shared VLAgent service already exposes syslog ports (514 TCP/UDP, 6514 TLS)
#   - PowerScale OneFS should be configured to forward syslog to VLAgent service NodePort

- name: Set PowerScale log configuration facts
  ansible.builtin.set_fact:
    ps_log_enabled: "{{ telemetry_config.powerscale_configurations.powerscale_log_enabled | default(false) | bool }}"

- name: Display PowerScale log collection status
  ansible.builtin.debug:
    msg: "{% if ps_log_enabled | bool %}{{ ps_log_enabled_msg }}{% else %}{{ ps_log_disabled_msg }}{% endif %}"
    verbosity: 2

- name: Configure shared VLAgent for PowerScale syslog collection
  when: ps_log_enabled | bool
  block:
    - name: Validate VictoriaLogs is in telemetry collection type
      ansible.builtin.assert:
        that:
          - "'victoria' in hostvars['localhost']['telemetry_collection_type'].split(',')"
        fail_msg: >-
          PowerScale log collection requires VictoriaLogs (victoria in telemetry_collection_type).
          Add 'victoria' to telemetry_collection_type in telemetry_config.yml.

    - name: Display PowerScale log configuration status
      ansible.builtin.debug:
        msg: "{{ ps_log_deployed_msg }}"
        verbosity: 2
