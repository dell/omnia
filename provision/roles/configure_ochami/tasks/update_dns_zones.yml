---
# This task regenerates CoreDNS zone files after node add/remove operations.
# Called after SMD inventory changes. CoreDNS auto-reloads via the 'reload' plugin.

- name: Check if CoreDNS DNS is enabled
  ansible.builtin.set_fact:
    dns_enabled: "{{ dns_config.dns_enabled | default(false) | bool }}"
  when: dns_config is defined

- name: Regenerate DNS zone files after inventory change
  when: dns_enabled | default(false) | bool
  block:
    - name: Re-read node hostname/IP mapping from SMD
      ansible.builtin.include_tasks: "{{ role_path }}/../../slurm_config/tasks/read_slurm_hostnames.yml"

    - name: Regenerate DNS zones
      ansible.builtin.include_tasks: generate_dns_zones.yml

    - name: DNS zone update completed
      ansible.builtin.debug:
        msg: "DNS zone files regenerated. CoreDNS will auto-reload within 10s."
