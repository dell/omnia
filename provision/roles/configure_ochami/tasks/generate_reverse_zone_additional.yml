---

- name: Build reverse zone name for additional subnet {{ additional_subnet.subnet }}
  ansible.builtin.set_fact:
    additional_reverse_zone: "{{ additional_subnet.subnet | regex_replace('^(\\d+)\\.(\\d+)\\.(\\d+)\\.\\d+$', '\\3.\\2.\\1') }}"

- name: Build reverse entries for additional subnet {{ additional_subnet.subnet }}
  ansible.builtin.set_fact:
    reverse_entries: >-
      [{% set subnet_prefix = additional_subnet.subnet | regex_replace('\.\d+$', '') %}{% for hostname in ip_name_map | sort %}{% if ip_name_map[hostname].startswith(subnet_prefix ~ '.') %}{"host_octet": "{{ ip_name_map[hostname].split('.')[-1] }}", "hostname": "{{ hostname }}"}{% if not loop.last %}, {% endif %}{% endif %}{% endfor %}]

- name: Generate reverse zone file for additional subnet {{ additional_subnet.subnet }}
  ansible.builtin.template:
    src: "{{ role_path }}/templates/dns/reverse_zone.j2"
    dest: "{{ coredns_zone_dir }}/db.{{ additional_reverse_zone }}.in-addr.arpa"
    mode: "0644"
  vars:
    reverse_zone_name: "{{ additional_reverse_zone }}"
