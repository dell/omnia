---
# Renders and sets the user-provided additional cloud-init group.
# This group is applied to ALL nodes (common group) and uses merge_how
# with no_replace so platform defaults always take precedence.

- name: Delete ci group configuration - {{ additional_cloud_init_group_name }}
  ansible.builtin.command: >-
    /usr/bin/ochami cloud-init group delete --no-confirm
    -f yaml -d @{{ ci_group_additional_dest }}
  changed_when: true
  failed_when: false
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

- name: Render ci group additional_cloud_init template
  ansible.builtin.template:
    src: "{{ ci_group_additional_template }}"
    dest: "{{ ci_group_additional_dest }}"
    mode: "{{ hostvars['localhost']['file_permissions_644'] }}"

- name: Set ci group configuration - {{ additional_cloud_init_group_name }}
  ansible.builtin.command: >-
    /usr/bin/ochami cloud-init group set
    -f yaml -d @{{ ci_group_additional_dest }}
  changed_when: true
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

- name: Verify ci group configuration - {{ additional_cloud_init_group_name }}
  ansible.builtin.command: >-
    /usr/bin/ochami cloud-init group get config {{ additional_cloud_init_group_name }}
  changed_when: false
  register: ci_group_additional_output
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

- name: Verify ci group additional output
  ansible.builtin.debug:
    msg: "{{ ci_group_additional_output.stdout_lines }}"
    verbosity: 2
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)
