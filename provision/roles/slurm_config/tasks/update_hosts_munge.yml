---
- name: Edit /etc/hosts file (skipped when CoreDNS is enabled)
  ignore_unreachable: true
  delegate_to: "{{ slurmhost_ip }}"
  when: not (dns_enabled | default(false) | bool)
  block:
    - name: Remove stale /etc/hosts entries for Omnia-managed nodes
      ansible.builtin.shell: |
        set -o pipefail
        # Remove old managed block markers and content (idempotent)
        sed -i '/^# BEGIN OMNIA MANAGED HOSTS$/,/^# END OMNIA MANAGED HOSTS$/d' /etc/hosts 2>/dev/null || true
        # Remove unmanaged entries matching Omnia node IPs or hostnames
        # (cleans up cloud-init leftovers, old lineinfile entries, and removed nodes)
        {% set all_ips = ip_name_map.values() | list %}
        {% set removed_names = nodes_in_normal_not_in_cmpt | default([]) %}
        {% set all_names = (ip_name_map.keys() | list) + removed_names %}
        {% if all_ips | length > 0 %}
        sed -i -E '/^({{ all_ips | map("regex_escape") | join("|") }})[[:space:]]/d' /etc/hosts 2>/dev/null || true
        {% endif %}
        {% if all_names | length > 0 %}
        sed -i -E '/[[:space:]]({{ all_names | join("|") }})$/d' /etc/hosts 2>/dev/null || true
        {% endif %}
      changed_when: true
      failed_when: false

    - name: Update /etc/hosts with Omnia managed hosts block
      ansible.builtin.blockinfile:
        path: "/etc/hosts"
        marker: "# {mark} OMNIA MANAGED HOSTS"
        block: |
          {% for entry in ip_name_map | dictsort %}
          {{ entry[1] }} {{ entry[0] }}
          {% endfor %}
        create: true
        mode: '0644'
  rescue:
    - name: Print error if editing /etc/hosts fails
      ansible.builtin.debug:
        msg: "Failed to edit /etc/hosts file on {{ slurmhost_ip }}"

- name: Get munge changes
  ansible.builtin.set_fact:
    munge_key_changed: "{{ munge_key_copy.results | default([]) | rekey_on_member('item') }}"
  when: munge_key_copy is defined

- name: Block when munge key changed
  ansible.builtin.debug:
    msg: "Munge key updates detected on NFS for {{ slurmhost_ip }}\n.
     Please restart munge service on {{ slurmhost_ip }} followed by the dependent slurm services on them\n."
  when:
    - munge_key_changed is defined
    - munge_key_changed[name_ip_map[slurmhost_ip]]['changed'] | default(false)
    - restart_slurm_services
  no_log: "{{ _no_log }}"
  ignore_unreachable: true
