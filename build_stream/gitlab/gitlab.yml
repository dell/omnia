---
# ============================================================================
# GitLab Automation Entry Point
# ============================================================================
# Uses gitlab_config.yaml to decide between hosted deployment or existing
# integration. Run:
#   ansible-playbook gitlab/gitlab.yml

- name: Load Omnia credential utility
  ansible.builtin.import_playbook: ../../utils/credential_utility/get_config_credentials.yml

- name: Prepare GitLab host credentials from provision secrets
  hosts: localhost
  gather_facts: false
  vars_files:
    - gitlab_config.yaml
  tasks:
    - name: Ensure provision password is available
      ansible.builtin.assert:
        that:
          - hostvars['localhost']['provision_password'] | default('') | length > 0
        fail_msg: "Provision password not found. Run credential utility to populate provision_password."
      when: gitlab_deployment_mode == 'hosted'

    - name: Register GitLab SSH credentials
      ansible.builtin.add_host:
        name: "{{ gitlab_host | default('gitlab_server') }}"
        ansible_host: "{{ gitlab_host | default('gitlab_server') }}"
        ansible_password: "{{ hostvars['localhost']['provision_password'] }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
      when: gitlab_deployment_mode == 'hosted'
      no_log: true

- name: Deploy GitLab CE on target host (hosted mode)
  hosts: "{{ gitlab_host | default('gitlab_server') }}"
  become: true
  gather_facts: true
  vars_files:
    - gitlab_config.yaml
  tasks:
    - name: Validate hosted-mode requirements
      ansible.builtin.assert:
        that:
          - gitlab_host is defined and gitlab_host != ''
        fail_msg: "Set gitlab_host in gitlab_config.yaml for hosted mode"
      when: gitlab_deployment_mode == 'hosted'

    - name: Bootstrap passwordless SSH
      ansible.builtin.include_role:
        name: gitlab_passwordless_ssh
      when: gitlab_deployment_mode == 'hosted'

    - name: Run hosted GitLab deployment
      ansible.builtin.include_role:
        name: hosted_gitlab
      when: gitlab_deployment_mode == 'hosted'

- name: Integrate with existing GitLab instance
  hosts: localhost
  gather_facts: false
  vars_files:
    - gitlab_config.yaml
  tasks:
    - name: Validate existing-mode requirements
      ansible.builtin.assert:
        that:
          - gitlab_external_url is defined and gitlab_external_url != ''
          - gitlab_api_token is defined and gitlab_api_token != ''
        fail_msg: "Set gitlab_external_url and gitlab_api_token for existing mode"
      when: gitlab_deployment_mode == 'existing'

    - name: Run external GitLab integration
      ansible.builtin.include_role:
        name: external_gitlab
      when: gitlab_deployment_mode == 'existing'
