---

- name: Generate cleanup check summary
  ansible.builtin.debug:
    msg:
      - "============================================"
      - "GitLab Cleanup Verification"
      - "============================================"
      - ""
      - "Run these commands to verify cleanup:"
      - ""
      - "Packages & Services:"
      - "  rpm -qa | grep gitlab"
      - "  systemctl status gitlab-runsvdir"
      - "  ls /etc/yum.repos.d/gitlab*"
      - ""
      - "Firewall Configuration:"
      - "  firewall-cmd --list-ports | grep -E '80|443'"
      - "  firewall-cmd --list-services | grep ssh"
      - ""
      - "TLS Certificates:"
      - "  ls /etc/gitlab/ssl"
      - ""
      - "Runner Containers:"
      - "  podman ps -a | grep gitlab-runner"
      - "  ls /etc/gitlab-runner"
      - ""
      - "Directories & Data:"
      - "  ls /etc/gitlab"
      - "  ls /var/opt/gitlab"
      - "  ls /var/log/gitlab"
      - ""
      - "============================================"

- name: Display testing methods
  ansible.builtin.debug:
    msg:
      - "============================================"
      - "Quick Verification Tests"
      - "============================================"
      - ""
      - "Copy and run these one-liner tests:"
      - ""
      - "No GitLab packages:"
      - "  rpm -qa | grep gitlab || echo 'Clean'"
      - ""
      - "No GitLab directories:"
      - "  ls /etc/gitlab /var/opt/gitlab 2>/dev/null || echo 'Clean'"
      - ""
      - "No GitLab processes:"
      - "  ps aux | grep gitlab | grep -v grep || echo 'Clean'"
      - ""
      - "No GitLab containers:"
      - "  podman ps -a | grep gitlab || echo 'Clean'"
      - ""
      - "No GitLab services:"
      - "  systemctl list-units | grep gitlab || echo 'Clean'"
      - ""
      - "Ready to reinstall:"
      - "  ansible-playbook gitlab.yml"
      - ""
      - "============================================"

- name: Display final cleanup summary
  ansible.builtin.debug:
    msg:
      - "============================================"
      - "GitLab Cleanup Complete"
      - "============================================"
      - ""
      - "Components cleaned:"
      - "  - Firewall Rules (HTTP/HTTPS/SSH ports)"
      - "  - GitLab Configuration & Services"
      - "  - Custom Directories & Paths"
      - "  - Projects & API Tokens"
      - "  - Pipeline Triggers & Webhooks"
      - "  - Runner Containers & Configs"
      - "  - TLS Certificates & CA Trust"
      - "  - GitLab Packages & Repositories"
      - "  - CI/CD Templates & Files"
      - "  - Password Files & Credentials"
      - ""
      - "System status:"
      - "  - All GitLab configurations removed"
      - "  - System ready for fresh installation"
      - "  - No leftover artifacts or conflicts"
      - ""
      - "Next steps:"
      - "  1. Run verification tests (see above)"
      - "  2. Reinstall: ansible-playbook gitlab.yml"
      - ""
      - "Important:"
      - "  - GitLab root password cleared from credential utility"
      - "  - Next installation will prompt for new password"
      - "  - Verify no other services need removed packages"
      - ""
      - "============================================"
