---

- name: Check if Podman is available
  ansible.builtin.command: which podman
  register: podman_check
  failed_when: false
  changed_when: false

- name: Stop and remove GitLab runner container
  ansible.builtin.command: "{{ item }}"
  loop:
    - "podman stop {{ gitlab_runner_container_name }}"
    - "podman rm {{ gitlab_runner_container_name }}"
  register: runner_container_removal
  when: podman_check.rc == 0
  failed_when: false
  ignore_errors: true

- name: Check if Docker is available
  ansible.builtin.command: which docker
  register: docker_check
  failed_when: false
  changed_when: false

- name: Remove GitLab runner registration container
  ansible.builtin.command: "{{ item }}"
  loop:
    - "docker stop {{ gitlab_runner_container_name }}"
    - "docker rm {{ gitlab_runner_container_name }}"
  register: runner_docker_removal
  when: docker_check.rc == 0
  failed_when: false
  ignore_errors: true

- name: Remove GitLab runner image (Podman)
  ansible.builtin.command: "podman rmi gitlab/gitlab-runner:latest"
  register: runner_image_removal
  when: podman_check.rc == 0
  failed_when: false
  ignore_errors: true

- name: Remove GitLab runner configuration directory
  ansible.builtin.file:
    path: "{{ gitlab_runner_config_path | default('/etc/gitlab-runner') }}"
    state: absent
  ignore_errors: true

- name: Remove GitLab runner registration token
  ansible.builtin.file:
    path: "{{ gitlab_runner_registration_token_path }}"
    state: absent
  ignore_errors: true

- name: Remove GitLab runner systemd service
  ansible.builtin.systemd:
    name: gitlab-runner
    state: stopped
    enabled: false
  ignore_errors: true

- name: Remove GitLab runner systemd service file
  ansible.builtin.file:
    path: "/etc/systemd/system/gitlab-runner.service"
    state: absent
  ignore_errors: true

- name: Remove runner from Docker (if Docker was used)
  community.docker.docker_container:
    name: "{{ gitlab_runner_container_name }}"
    state: absent
  when: docker_check.rc == 0
  ignore_errors: true

- name: Remove runner image from Docker
  community.docker.docker_image:
    name: "{{ gitlab_runner_image | default('gitlab/gitlab-runner:latest') }}"
    state: absent
  when: docker_check.rc == 0
  ignore_errors: true
