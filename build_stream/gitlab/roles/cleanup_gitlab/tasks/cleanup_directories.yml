---

- name: Remove GitLab custom directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/opt/gitlab"
    - "/var/lib/gitlab"
    - "/home/git"
    - "/srv/gitlab"
  when: gitlab_status_check.rc == 0
  failed_when: false

- name: Remove GitLab backup directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/var/opt/gitlab/backups"
    - "/opt/gitlab_backup"
  failed_when: false

- name: Remove GitLab temporary directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/tmp/gitlab"
    - "/var/tmp/gitlab"
  failed_when: false

- name: Remove GitLab socket directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/var/run/gitlab"
    - "/run/gitlab"
  failed_when: false

- name: Remove GitLab logrotate configuration
  ansible.builtin.file:
    path: "/etc/logrotate.d/gitlab"
    state: absent
  failed_when: false

- name: Remove GitLab cron jobs
  ansible.builtin.cron:
    name: "{{ item }}"
    state: absent
  loop:
    - gitlab-backup
    - gitlab-cleanup
  failed_when: false
