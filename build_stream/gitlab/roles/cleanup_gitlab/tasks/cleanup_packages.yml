---

- name: Remove GitLab packages
  ansible.builtin.package:
    name: "{{ item }}"
    state: absent
  loop:
    - gitlab-ce
    - gitlab-ci
    - gitlab-runner
    - git
  ignore_errors: true

- name: Remove GitLab prerequisite packages (fresh install will reinstall)
  ansible.builtin.package:
    name: "{{ item }}"
    state: absent
  loop: "{{ gitlab_hosted_prereq_packages }}"
  ignore_errors: true

- name: Note about package cleanup
  ansible.builtin.debug:
    msg: |
      Note: All GitLab-related packages removed including prerequisites.
      Fresh install will reinstall all needed packages automatically.
      This ensures a completely clean state.

- name: Clean package cache (safe operation)
  ansible.builtin.command: "{{ item }}"
  loop:
    - "dnf clean all"
    - "yum clean all"
    - "apt-get clean"
  ignore_errors: true

- name: Remove GitLab GPG keys
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/etc/pki/rpm-gpg/RPM-GPG-KEY-gitlab"
    - "/etc/apt/trusted.gpg.d/gitlab.gpg"
  ignore_errors: true
