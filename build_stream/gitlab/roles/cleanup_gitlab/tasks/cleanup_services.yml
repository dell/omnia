---

- name: Stop GitLab services
  ansible.builtin.command: "{{ gitlab_ctl_command }} stop"
  register: gitlab_stop_result
  when: gitlab_status_check.rc == 0
  retries: 3
  delay: 30
  until: gitlab_stop_result.rc == 0 or 'timeout' in gitlab_stop_result.stdout
  failed_when: false
  changed_when: false

- name: Force stop sidekiq if graceful stop timed out
  ansible.builtin.shell: |
    {{ gitlab_ctl_command }} stop sidekiq || true
    {{ gitlab_ctl_command }} kill sidekiq || true
    pkill -f sidekiq || true
  when:
    - gitlab_status_check.rc == 0
    - gitlab_stop_result is defined
    - gitlab_stop_result.rc != 0
    - gitlab_stop_result.stdout is defined
    - "'sidekiq' in gitlab_stop_result.stdout"
  failed_when: false
  changed_when: false

- name: Remove all GitLab packages
  ansible.builtin.package:
    name: "{{ item }}"
    state: absent
  loop:
    - gitlab-ce
    - gitlab-ee
    - gitlab-ci
    - gitlab-runner
  failed_when: false

- name: Remove GitLab repository
  ansible.builtin.file:
    path: "{{ gitlab_repo_file_path }}"
    state: absent
  failed_when: false

- name: Clean GitLab configuration directory (preserve structure)
  ansible.builtin.shell: |
    if [ -d "/etc/gitlab" ]; then
      find /etc/gitlab -type f -delete 2>/dev/null || true
      find /etc/gitlab -type d -empty -delete 2>/dev/null || true
    fi
  failed_when: false

- name: Clean GitLab data directory (preserve structure)
  ansible.builtin.shell: |
    if [ -d "/var/opt/gitlab" ]; then
      find /var/opt/gitlab -type f -delete 2>/dev/null || true
      find /var/opt/gitlab -type d -empty -delete 2>/dev/null || true
    fi
  failed_when: false

- name: Clean GitLab log directory (preserve structure)
  ansible.builtin.shell: |
    if [ -d "/var/log/gitlab" ]; then
      find /var/log/gitlab -type f -delete 2>/dev/null || true
      find /var/log/gitlab -type d -empty -delete 2>/dev/null || true
    fi
  failed_when: false

- name: Note about GitLab user preservation
  ansible.builtin.debug:
    msg:
      - "GitLab user 'git' preserved for system stability"
      - "This ensures smooth reinstallation"
      - "Only GitLab data/configurations removed"

- name: Remove GitLab systemd services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - gitlab-runsvdir
  failed_when: false

- name: Remove GitLab systemd service files
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  loop:
    - gitlab-runsvdir.service
  failed_when: false

- name: Force remove any remaining GitLab directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/etc/gitlab"
    - "/var/opt/gitlab"
    - "/var/log/gitlab"
    - "/opt/gitlab"
  failed_when: false

- name: Clean any remaining GitLab files (excluding system and user files)
  ansible.builtin.shell: "find /opt /etc /var /root /home -name '*gitlab*' -type f -delete 2>/dev/null || true"
  register: gitlab_file_cleanup
  changed_when: false

- name: Remove GitLab GPG keys
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/etc/pki/rpm-gpg/RPM-GPG-KEY-gitlab"
    - "/etc/pki/rpm-gpg/RPM-GPG-KEY-gitlab-ce"
    - "/etc/pki/rpm-gpg/RPM-GPG-KEY-gitlab-ee"
  failed_when: false
