---

- name: Remove GitLab CI/CD template files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/etc/gitlab/ci_templates"
    - "/opt/gitlab/ci_templates"
    - "{{ gitlab_ci_templates_path | default('/opt/gitlab/ci_templates') }}"
  failed_when: false

- name: Remove GitLab webhook configurations
  ansible.builtin.debug:
    msg: "Note: Webhooks and triggers are cleaned up when GitLab data is removed"
  when: gitlab_status_check.rc == 0

- name: Remove GitLab pipeline trigger files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/etc/gitlab/triggers"
    - "/opt/gitlab/triggers"
  failed_when: false

- name: Remove GitLab project configurations
  ansible.builtin.debug:
    msg: "Note: Projects and repositories are cleaned up when GitLab data is removed"
  when: gitlab_status_check.rc == 0

- name: Remove GitLab API tokens (if stored locally)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/root/.gitlab-tokens"
    - "/etc/gitlab/api-tokens"
    - "/opt/gitlab/tokens"
  failed_when: false

- name: Clean up GitLab CI/CD cache
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/var/opt/gitlab/gitlab-ci"
    - "/var/cache/gitlab"
  failed_when: false
