---
# tasks/create_project.yml

- name: Search for existing project
  ansible.builtin.uri:
    url: "{{ gitlab_external_url }}/api/{{ gitlab_api_version }}/projects?search={{ gitlab_project_name }}"
    method: GET
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    status_code: 200
    validate_certs: "{{ oim_api_verify_ssl | default(false) }}"
  register: project_search
  no_log: true

- name: Set project exists flag
  ansible.builtin.set_fact:
    project_exists: "{{ project_search.json | selectattr('name', 'equalto', gitlab_project_name) | list | length > 0 }}"
    existing_project: "{{ project_search.json | selectattr('name', 'equalto', gitlab_project_name) | list | first | default({}) }}"

- name: Create new project
  ansible.builtin.uri:
    url: "{{ gitlab_external_url }}/api/{{ gitlab_api_version }}/projects"
    method: POST
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    body_format: json
    body:
      name: "{{ gitlab_project_name }}"
      visibility: "{{ gitlab_project_visibility }}"
      initialize_with_readme: true
    status_code: [200, 201]
    validate_certs: "{{ oim_api_verify_ssl | default(false) }}"
  register: new_project
  no_log: true
  when: not project_exists

- name: Set project ID
  ansible.builtin.set_fact:
    gitlab_project_id: "{{ new_project.json.id if not project_exists else existing_project.id }}"

- name: Display project info
  ansible.builtin.debug:
    msg: "Project '{{ gitlab_project_name }}' ID: {{ gitlab_project_id }}"
