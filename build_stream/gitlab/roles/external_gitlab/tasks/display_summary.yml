---
# tasks/display_summary.yml

- name: Display integration information
  ansible.builtin.debug:
    msg:
      - "============================================"
      - "   GitLab Integration Complete!            "
      - "============================================"
      - ""
      - "GitLab URL:     {{ gitlab_external_url }}"
      - "Project Name:   {{ gitlab_project_name }}"
      - "Project ID:     {{ gitlab_project_id }}"
      - "Trigger Token:  {{ gitlab_trigger_token }}"
      - ""
      - "Webhook URL:"
      - "{{ gitlab_external_url }}/api/{{ gitlab_api_version }}/projects/{{ gitlab_project_id }}/trigger/pipeline"
      - ""
      - "Test Command:"
      - "curl -X POST -F 'token={{ gitlab_trigger_token }}' -F 'ref={{ gitlab_default_branch }}' -F 'variables[JOBID]=test123' '{{ gitlab_external_url }}/api/{{ gitlab_api_version }}/projects/{{ gitlab_project_id }}/trigger/pipeline'"
      - ""
      - "Next Steps:"
      - "1. Add {{ software_catalog_file }} to the repository"
      - "2. Configure OIM_TOKEN as CI/CD variable in GitLab"
      - "3. Commit changes to {{ software_catalog_file }} to trigger pipeline"
      - "============================================"
