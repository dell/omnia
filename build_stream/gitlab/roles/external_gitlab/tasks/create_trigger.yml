---
# tasks/create_trigger.yml

- name: Get existing triggers
  ansible.builtin.uri:
    url: "{{ gitlab_external_url }}/api/{{ gitlab_api_version }}/projects/{{ gitlab_project_id }}/triggers"
    method: GET
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    status_code: 200
    validate_certs: "{{ oim_api_verify_ssl | default(false) }}"
  register: existing_triggers
  no_log: true

- name: Check if trigger exists
  ansible.builtin.set_fact:
    trigger_exists: "{{ existing_triggers.json | selectattr('description', 'equalto', gitlab_trigger_description) | list | length > 0 }}"
    existing_trigger: "{{ existing_triggers.json | selectattr('description', 'equalto', gitlab_trigger_description) | list | first | default({}) }}"

- name: Create pipeline trigger
  ansible.builtin.uri:
    url: "{{ gitlab_external_url }}/api/{{ gitlab_api_version }}/projects/{{ gitlab_project_id }}/triggers"
    method: POST
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    body_format: json
    body:
      description: "{{ gitlab_trigger_description }}"
    status_code: [200, 201]
    validate_certs: "{{ oim_api_verify_ssl | default(false) }}"
  register: new_trigger
  no_log: true
  when: not trigger_exists

- name: Set trigger token
  ansible.builtin.set_fact:
    gitlab_trigger_token: "{{ new_trigger.json.token if not trigger_exists else existing_trigger.token }}"
