---
# tasks/validate_connectivity.yml

- name: Test GitLab API
  ansible.builtin.uri:
    url: "{{ gitlab_external_url }}/api/{{ gitlab_api_version }}/version"
    method: GET
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    status_code: 200
    validate_certs: "{{ oim_api_verify_ssl | default(false) }}"
  register: gitlab_version
  no_log: true

- name: Display GitLab version
  ansible.builtin.debug:
    msg: "Connected to GitLab version: {{ gitlab_version.json.version }}"
