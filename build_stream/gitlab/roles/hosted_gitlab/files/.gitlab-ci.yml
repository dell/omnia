# ============================================================================
# Omnia Catalog CI/CD Pipeline
# ============================================================================
# Triggered on catalog_rhel.json changes or via API trigger.
# ============================================================================

stages:
  - process

process_catalog:
  stage: process
  script:
    - echo "Pipeline running"
    - echo "Commit $CI_COMMIT_SHA"
    - cat catalog_rhel.json
  rules:
    - changes:
        - catalog_rhel.json
    - if: $CI_PIPELINE_SOURCE == "trigger"

