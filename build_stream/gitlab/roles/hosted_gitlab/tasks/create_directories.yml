---
# tasks/create_directories.yml

- name: Create GitLab directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ gitlab_ssl_dir }}"
    - "{{ gitlab_cert_dir }}"
    - "{{ gitlab_runner_config_path }}"
    - "{{ gitlab_runner_config_path }}/certs"
