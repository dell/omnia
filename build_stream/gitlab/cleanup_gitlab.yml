---

# GitLab Comprehensive Cleanup Playbook
# This playbook removes ALL GitLab configurations created by gitlab.yml
# Usage: ansible-playbook cleanup_gitlab.yml

- name: Set_fact for fetch omnia config credentials
  hosts: localhost
  connection: local
  tags: always
  tasks:
    - name: Set dynamic run tags including 'gitlab'
      when: not config_file_status | default(false) | bool
      ansible.builtin.set_fact:
        omnia_run_tags: "{{ (ansible_run_tags | default([]) + ['gitlab'] + ['provision']) | unique }}"
        cacheable: true

    - name: Set GitLab operation mode
      ansible.builtin.set_fact:
        gitlab_operation_mode: "cleanup"
        cacheable: true

- name: Include input project directory
  when: not project_dir_status | default(false) | bool
  ansible.builtin.import_playbook: ../../utils/include_input_dir.yml

- name: Import credential utility playbook
  ansible.builtin.import_playbook: ../../utils/credential_utility/get_config_credentials.yml
  when: not config_file_status | default(false) | bool

- name: Prepare GitLab host credentials for cleanup
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Load GitLab configuration inputs
      ansible.builtin.include_vars:
        file: "{{ hostvars['localhost']['input_project_dir'] }}/gitlab_config.yml"
      delegate_to: localhost
      run_once: true

    - name: Ensure provision password is available
      ansible.builtin.assert:
        that:
          - hostvars['localhost']['provision_password'] | default('') | length > 0
        fail_msg: "Provision password not found. Run credential utility to populate provision_password."

    - name: Validate GitLab inventory host is provided
      ansible.builtin.assert:
        that:
          - groups['gitlab_server'] is defined
          - groups['gitlab_server'] | length > 0
        fail_msg: "Set at least one target host under [gitlab_server] in build_stream/gitlab/inventory/hosts.ini"

    - name: Set GitLab inventory host
      ansible.builtin.set_fact:
        gitlab_inventory_host: "{{ groups['gitlab_server'][0] }}"

    - name: Register GitLab SSH credentials for cleanup
      ansible.builtin.add_host:
        name: "{{ gitlab_inventory_host }}"
        groups: gitlab_server
        ansible_host: "{{ hostvars[gitlab_inventory_host].ansible_host | default(gitlab_inventory_host) }}"
        ansible_password: "{{ hostvars['localhost']['provision_password'] }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
      no_log: true

- name: Comprehensive GitLab Cleanup
  hosts: gitlab_server
  become: true
  gather_facts: true
  vars:
    # GitLab Omnibus paths (from vars/main.yml)
    gitlab_rb_path: "/etc/gitlab/gitlab.rb"
    gitlab_ctl_command: "gitlab-ctl"
    gitlab_repo_file_path: "/etc/yum.repos.d/gitlab_gitlab-ce.repo"
    
    # Host prerequisites (from vars/main.yml)
    gitlab_hosted_prereq_packages:
      - curl
      - policycoreutils
      - policycoreutils-python-utils
      - openssl
      - firewalld
      - podman
      - podman-docker
    
    # Runner container (from vars/main.yml)
    gitlab_runner_container_name: "gitlab-runner"
    gitlab_runner_config_path: "/etc/gitlab-runner"
    gitlab_runner_registration_token_path: "/etc/gitlab/runner-registration-token"
    
    # GitLab ports (default values)
    gitlab_http_port: "80"
    gitlab_https_port: "443"
    gitlab_ssh_port: "22"
  roles:
    - cleanup_gitlab

  post_tasks:
    - name: Verify GitLab packages are removed
      ansible.builtin.command: rpm -qa | grep gitlab
      register: gitlab_packages_check
      failed_when: false
      changed_when: false

    - name: Verify GitLab directories are removed
      ansible.builtin.stat:
        path: "{{ item }}"
      register: gitlab_dirs_final_check
      loop:
        - "/etc/gitlab"
        - "/var/opt/gitlab"
        - "/var/log/gitlab"
      failed_when: false

    - name: Verify GitLab processes are stopped
      ansible.builtin.command: ps aux | grep gitlab | grep -v grep
      register: gitlab_processes_check
      failed_when: false
      changed_when: false

    - name: Set cleanup validation status
      ansible.builtin.set_fact:
        cleanup_validated: "{{ gitlab_packages_check.stdout == '' and (gitlab_dirs_final_check.results | selectattr('stat.exists') | list | length == 0) and gitlab_processes_check.stdout == '' }}"

    - name: Display cleanup completion notice
      ansible.builtin.debug:
        msg:
          - "============================================"
          - "GitLab Cleanup - COMPLETED"
          - "============================================"
          - ""
          - "All cleanup tasks have been executed"
          - ""
          - "Validation status:"
          - "  - GitLab packages: {{ 'Removed' if gitlab_packages_check.stdout == '' else 'Some remain' }}"
          - "  - GitLab directories: {{ 'Removed' if (gitlab_dirs_final_check.results | selectattr('stat.exists') | list | length == 0) else 'Some remain' }}"
          - "  - GitLab processes: {{ 'Stopped' if gitlab_processes_check.stdout == '' else 'Some running' }}"
          - ""
          - "System ready for fresh GitLab installation"
          - ""
          - "To reinstall: ansible-playbook gitlab.yml"
          - "============================================"
