# GitLab Comprehensive Cleanup Playbook
# This playbook removes ALL GitLab configurations created by gitlab.yml
# Usage: ansible-playbook cleanup_gitlab.yml

- name: Comprehensive GitLab Cleanup
  hosts: localhost
  become: true
  gather_facts: true
  roles:
    - cleanup_gitlab

  post_tasks:
    - name: Display cleanup completion notice
      ansible.builtin.debug:
        msg: |
          ============================================
          GitLab Comprehensive Cleanup - COMPLETED
          ============================================
          
          🎯 All cleanup tasks have been executed.
          📋 Detailed summary and checklist provided below.
          🧪 Use the test commands to verify cleanup success.
          🚀 System is ready for fresh GitLab installation.
          
          To reinstall: ansible-playbook gitlab.yml
          ============================================
