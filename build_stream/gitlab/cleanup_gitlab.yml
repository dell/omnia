# GitLab Comprehensive Cleanup Playbook
# This playbook removes ALL GitLab configurations created by gitlab.yml
# Usage: ansible-playbook cleanup_gitlab.yml -i inventory/hosts.ini

- name: Comprehensive GitLab Cleanup
  hosts: gitlab_server
  become: true
  gather_facts: true
  vars:
    # GitLab Omnibus paths (from vars/main.yml)
    gitlab_rb_path: "/etc/gitlab/gitlab.rb"
    gitlab_ctl_command: "gitlab-ctl"
    gitlab_repo_file_path: "/etc/yum.repos.d/gitlab_gitlab-ce.repo"
    
    # Host prerequisites (from vars/main.yml)
    gitlab_hosted_prereq_packages:
      - curl
      - policycoreutils
      - policycoreutils-python-utils
      - openssl
      - firewalld
      - podman
      - podman-docker
    
    # Runner container (from vars/main.yml)
    gitlab_runner_container_name: "gitlab-runner"
    gitlab_runner_config_path: "/etc/gitlab-runner"
    gitlab_runner_registration_token_path: "/etc/gitlab/runner-registration-token"
    
    # GitLab ports (default values)
    gitlab_http_port: "80"
    gitlab_https_port: "443"
    gitlab_ssh_port: "22"
  roles:
    - cleanup_gitlab

  post_tasks:
    - name: Display cleanup completion notice
      ansible.builtin.debug:
        msg: |
          ============================================
          GitLab Comprehensive Cleanup - COMPLETED
          ============================================
          
          🎯 All cleanup tasks have been executed.
          📋 Detailed summary and checklist provided below.
          🧪 Use the test commands to verify cleanup success.
          🚀 System is ready for fresh GitLab installation.
          
          To reinstall: ansible-playbook gitlab.yml
          ============================================
