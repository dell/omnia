[extend]
# Allow REDACTED values and test credential strings in test files (false positives)
[allowlist]
  description = "Allow REDACTED values and test credentials in test files"
  paths = [
    '''test/build_stream/library/functions/gitlab_func.py''',
    '''test/build_stream/library/functions/pipeline_func.py''',
    '''test/repo_manager/ut/test_dataset_contract.py''',
  ]
  regexes = [
    '''REDACTED\.get\("gitlab_ssh_password''',
    '''password: plaintext''',
  ]

# Only scan the current HEAD commit, not the entire PR history
[git]
  # Only scan the current commit, not the entire PR history
  # This prevents scanning pre-existing commits that may have false positives
  commit-from = "HEAD~1"
