---
# utils.yml - Top-level entry point for the utils domain.
# Provides common utilities for Omnia: log collection, OS installation, etc.
#
# Usage (run ONE tag at a time - no comma-separated tags):
#   cd src/utils
#   ansible-playbook playbooks/utils.yml --tags precheck        # Env precheck only
#   ansible-playbook playbooks/utils.yml --tags setup           # Setup only
#   ansible-playbook playbooks/utils.yml --tags collect         # Collect logs
#   ansible-playbook playbooks/utils.yml --tags install_os      # OS installation
#   ansible-playbook playbooks/utils.yml --tags backup_oim_logs # Backup OIM domain logs
#   ansible-playbook playbooks/utils.yml --tags slurm_config_backup   # Backup Slurm controller config
#   ansible-playbook playbooks/utils.yml --tags slurm_config_cleanup   # Delete active Slurm config
#   ansible-playbook playbooks/utils.yml --tags slurm_config_rollback # Rollback Slurm config from backup
#   ansible-playbook playbooks/utils.yml --tags cleanup         # Cleanup all utilities
#   ansible-playbook playbooks/utils.yml --tags cleanup_logs    # Cleanup log collection only
#   ansible-playbook playbooks/utils.yml --tags cleanup_install_os  # Cleanup OS installation only
#   ansible-playbook playbooks/utils.yml --tags cleanup_backup_oim_logs  # Cleanup OIM log backups only
#   ansible-playbook playbooks/utils.yml --tags cleanup_slurm_config_backups  # Cleanup Slurm config backups only
#   ansible-playbook playbooks/utils.yml --tags upgrade         # Upgrade flow (placeholder)
#   ansible-playbook playbooks/utils.yml --tags rollback        # Rollback flow (placeholder)
#
# Tags (mutually exclusive - pick ONE):
#   (none)            - Default: setup only
#   precheck          - Environment precheck (env vars, connectivity)
#   setup             - Setup and configuration
#   collect           - Log collection utility
#   install_os        - OS installation via iDRAC
#   backup_oim_logs   - Archive all domain log directories on the OIM
#   slurm_config_backup     - Backup the active Slurm controller configuration
#   slurm_config_cleanup     - Delete the active Slurm configuration from the NFS share
#   slurm_config_rollback   - Restore a Slurm configuration backup and reconfigure slurmctld
#   cleanup           - Cleanup all utilities, backups, and stored install-OS credentials
#   cleanup_logs      - Cleanup log collection artifacts only
#   cleanup_install_os - Cleanup OS installation artifacts only
#   cleanup_backup_oim_logs - Cleanup OIM log backup artifacts only
#   cleanup_slurm_config_backups - Cleanup Slurm config backup artifacts only
#   upgrade           - Upgrade flow (placeholder)
#   rollback          - Rollback flow (placeholder)
#
# NOTE: This utils domain does not support the following standard lifecycle tags
# as it is a utility domain rather than a full deployment domain:
#   - credentials     (not applicable - utilities handle credentials internally)
#   - prepare         (not applicable - utilities don't require infrastructure setup)
#   - execute         (not applicable - utilities run directly without orchestration)

# =========================================================================
# Step 0: Setup - load env vars (omnia.env), validate host
# =========================================================================
- name: Utils domain setup
  hosts: localhost
  connection: local
  gather_facts: true
  tags: always
  pre_tasks:
    - name: Record execution start time
      ansible.builtin.set_fact:
        utils_execution_start_time: "{{ ansible_date_time.iso8601 }}"
        cacheable: true
  roles:
    - utils_setup

# =========================================================================
# Step 1: Input validation (schema + logic) — tag-aware validation
# =========================================================================
- name: Validate utils configuration
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Run collect configuration validation
      ansible.builtin.include_role:
        name: validate_collect_config
      when:
        - "'collect' in ansible_run_tags"
        - "not (skip_validation | default(false) | bool)"

    - name: Run install_os configuration validation
      ansible.builtin.include_role:
        name: validate_install_os_config
      when:
        - "'install_os' in ansible_run_tags"
        - "not (skip_validation | default(false) | bool)"

    - name: Run backup_oim_logs configuration validation
      ansible.builtin.include_role:
        name: validate_backup_oim_logs_config
      when:
        - "'backup_oim_logs' in ansible_run_tags"
        - "not (skip_validation | default(false) | bool)"

    - name: Run slurm_config_util configuration validation
      ansible.builtin.include_role:
        name: validate_slurm_config_util_config
      when:
        - >-
          'slurm_config_backup' in ansible_run_tags or
          'slurm_config_cleanup' in ansible_run_tags or
          'slurm_config_rollback' in ansible_run_tags
        - "not (skip_validation | default(false) | bool)"
  tags:
    - always
    - validate

# =========================================================================
# FLOW: precheck - Environment validation (opt-in only)
# =========================================================================
- name: Precheck environment
  ansible.builtin.import_playbook: precheck/precheck_environment.yml
  tags:
    - never
    - precheck

# =========================================================================
# FLOW: collect - Log collection utility
# =========================================================================
- name: Collect logs
  ansible.builtin.import_playbook: collect.yml
  tags:
    - never
    - collect

# =========================================================================
# FLOW: install_os - OS installation via iDRAC
# =========================================================================
- name: OS installation via iDRAC
  ansible.builtin.import_playbook: install_os.yml
  tags:
    - never
    - install_os

# =========================================================================
# FLOW: backup_oim_logs - Archive all domain log directories on the OIM
# =========================================================================
- name: Backup OIM logs
  ansible.builtin.import_playbook: backup_oim_logs/backup_oim_logs.yml
  tags:
    - never
    - backup_oim_logs

# =========================================================================
# FLOW: slurm_config_backup / slurm_config_cleanup / slurm_config_rollback - Slurm config utilities
# =========================================================================
# slurm_config_util.yml already tags each of its 3 plays with `never` plus
# its own operation tag (slurm_config_backup / slurm_config_cleanup / slurm_config_rollback), so
# it is imported once here and selected via those tags directly.
- name: Slurm configuration utilities
  ansible.builtin.import_playbook: slurm_config_util/slurm_config_util.yml

# =========================================================================
# FLOW: cleanup - Cleanup utils artifacts (standalone cleanup playbooks)
# =========================================================================
- name: Cleanup log collection
  ansible.builtin.import_playbook: cleanup/cleanup_logs.yml
  tags:
    - never
    - cleanup
    - cleanup_logs

- name: Cleanup OS installation
  ansible.builtin.import_playbook: cleanup/cleanup_install_os.yml
  tags:
    - never
    - cleanup
    - cleanup_install_os

- name: Cleanup OIM log backups
  ansible.builtin.import_playbook: backup_oim_logs/cleanup_backup_oim_logs.yml
  tags:
    - never
    - cleanup
    - cleanup_backup_oim_logs

- name: Cleanup Slurm config backups
  ansible.builtin.import_playbook: slurm_config_util/cleanup_slurm_config_backups.yml
  tags:
    - never
    - cleanup
    - cleanup_slurm_config_backups

# =========================================================================
# FLOW: upgrade - Upgrade flow placeholder (opt-in only)
# =========================================================================
- name: Upgrade utils
  hosts: localhost
  connection: local
  gather_facts: false
  tags:
    - never
    - upgrade
  tasks:
    - name: Upgrade placeholder
      ansible.builtin.debug:
        msg: "Utils upgrade - not implemented yet"

# =========================================================================
# FLOW: rollback - Rollback flow placeholder (opt-in only)
# =========================================================================
- name: Rollback utils
  hosts: localhost
  connection: local
  gather_facts: false
  tags:
    - never
    - rollback
  tasks:
    - name: Rollback placeholder
      ansible.builtin.debug:
        msg: "Utils rollback - not implemented yet"

# =========================================================================
# Step 9: Write domain status file (runs after all flows)
# =========================================================================
- name: Write utils domain status
  hosts: localhost
  connection: local
  gather_facts: true
  tags: always
  post_tasks:
    - name: Record execution end time
      ansible.builtin.set_fact:
        utils_execution_end_time: "{{ ansible_date_time.iso8601 }}"
        cacheable: true

    - name: Write execution status
      ansible.builtin.include_role:
        name: utils_status_writer
      vars:
        utils_domain_status: "{{ 'success' if ansible_failed_result is not defined else 'failure' }}"
        utils_playbook_name: "utils.yml"
