# =========================================================================
# Standalone cleanup playbook for OS installation artifacts
# This playbook is ONLY invoked via utils.yml with cleanup tags
# =========================================================================

- name: Cleanup OS installation artifacts
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    install_os_iso_tmp_dir: /tmp/install_os
    install_os_nfs_mount: /run/omnia/mnt/install_os_nfs
  pre_tasks:
    - name: Record execution start time
      ansible.builtin.set_fact:
        utils_execution_start_time: "{{ ansible_date_time.iso8601 }}"
        cacheable: true
  tasks:
    - name: Set OMNIA_DATA_PATH fact
      ansible.builtin.set_fact:
        omnia_data_path: "{{ lookup('env', 'OMNIA_DATA_PATH') | default('/opt/omnia', true) }}"
        project_name: "{{ lookup('env', 'OMNIA_PROJECT_NAME') | default('project_default', true) }}"

    - name: Set input directory path
      ansible.builtin.set_fact:
        input_project_dir: "{{ omnia_data_path }}/utils/input/{{ project_name }}"

    - name: Remove temporary ISO directory
      ansible.builtin.file:
        path: "{{ install_os_iso_tmp_dir }}"
        state: absent

    - name: Check if temporary NFS mount exists
      ansible.builtin.command: mountpoint -q {{ install_os_nfs_mount | quote }}
      register: nfs_mount_check
      changed_when: false
      failed_when: false

    - name: Unmount temporary NFS mount
      ansible.builtin.command: umount {{ install_os_nfs_mount | quote }}
      when: nfs_mount_check.rc == 0
      register: nfs_umount
      changed_when: nfs_umount.rc == 0
      failed_when: false

    - name: Lazy-unmount temporary NFS mount if still busy
      ansible.builtin.command: umount -l {{ install_os_nfs_mount | quote }}
      when:
        - nfs_mount_check.rc == 0
        - nfs_umount.rc is defined
        - nfs_umount.rc != 0
      changed_when: true
      failed_when: false

    - name: Re-check temporary NFS mount after unmount
      ansible.builtin.command: mountpoint -q {{ install_os_nfs_mount | quote }}
      register: nfs_mount_recheck
      changed_when: false
      failed_when: false

    - name: Fail if temporary NFS mount is still mounted
      ansible.builtin.fail:
        msg: >-
          {{ install_os_nfs_mount }} is still mounted after unmount attempts.
          A process is likely holding it busy (check with: fuser -vm
          {{ install_os_nfs_mount }}). Close it and re-run cleanup.
      when: nfs_mount_recheck.rc == 0

    - name: Remove temporary NFS mount point
      ansible.builtin.file:
        path: "{{ install_os_nfs_mount }}"
        state: absent
      when: nfs_mount_recheck.rc != 0

    - name: Check if install_os credentials file exists
      ansible.builtin.stat:
        path: "{{ input_project_dir }}/install_os_credentials.yml"
      register: credentials_stat

    - name: Check if vault key file exists
      ansible.builtin.stat:
        path: "{{ input_project_dir }}/.install_os_credentials_key"
      register: vault_key_stat

    - name: Resolve credential cleanup mode
      ansible.builtin.set_fact:
        cleanup_credentials: >-
          {{ false
             if cleanup_credentials is defined and
                cleanup_credentials | string | trim | lower in ['false', 'no', '0']
             else true }}

    - name: Display credential cleanup mode
      ansible.builtin.debug:
        msg: "Credential cleanup: {{ 'Enabled - removing credential files' if (cleanup_credentials | bool) else 'Disabled - preserving credentials' }}"

    - name: Remove install_os credential file
      ansible.builtin.file:
        path: "{{ input_project_dir }}/install_os_credentials.yml"
        state: absent
      when:
        - cleanup_credentials | bool
        - credentials_stat.stat.exists

    - name: Remove install_os vault key file
      ansible.builtin.file:
        path: "{{ input_project_dir }}/.install_os_credentials_key"
        state: absent
      when:
        - cleanup_credentials | bool
        - vault_key_stat.stat.exists

    - name: Display OS installation cleanup summary
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "OS Installation Cleanup Complete"
          - "=========================================="
          - "Temporary NFS mount removed: {{ install_os_nfs_mount }}"
          - >-
            Credentials: {{ 'Preserved by cleanup_credentials=false'
            if not (cleanup_credentials | bool)
            else 'Removed'
            if (credentials_stat.stat.exists or vault_key_stat.stat.exists)
            else 'Not present' }}
          - "=========================================="

    - name: Remove utils status file
      ansible.builtin.file:
        path: "{{ omnia_data_path }}/utils/output/{{ project_name }}/utils_status.yml"
        state: absent

    - name: Remove install_os status file
      ansible.builtin.file:
        path: "{{ omnia_data_path }}/utils/output/{{ project_name }}/install_os_status.yml"
        state: absent
  post_tasks:
    - name: Record execution end time
      ansible.builtin.set_fact:
        utils_execution_end_time: "{{ ansible_date_time.iso8601 }}"
        cacheable: true
