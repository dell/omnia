---
# backup_oim_logs.yml - Archive all Omnia domain log directories on the OIM.
#
# Usage (run ONE tag at a time - no comma-separated tags):
#   cd src/utils
#   ansible-playbook playbooks/backup_oim_logs/backup_oim_logs.yml --tags setup
#   ansible-playbook playbooks/backup_oim_logs/backup_oim_logs.yml --tags bundle
#   ansible-playbook playbooks/backup_oim_logs/backup_oim_logs.yml            # both (full run)
#
# Optional overrides:
#   -e backup_path=<local path or "<server>:/<export>">
#   backup_oim_logs_config.yml (domains / backup_path) under utils input dir

- name: Stage globals for OIM log backup
  hosts: localhost
  gather_facts: true
  tags:
    - setup
  pre_tasks:
    - name: Record execution start time
      ansible.builtin.set_fact:
        utils_execution_start_time: "{{ ansible_date_time.iso8601 }}"
        cacheable: true
  roles:
    - role: oim_log_backup
      stage: setup

- name: Archive domain logs and publish summary
  hosts: localhost
  gather_facts: true
  tags:
    - bundle
  roles:
    - role: oim_log_backup
      stage: bundle
  post_tasks:
    - name: Record execution end time
      ansible.builtin.set_fact:
        utils_execution_end_time: "{{ ansible_date_time.iso8601 }}"
        cacheable: true

    - name: Write execution status
      ansible.builtin.include_role:
        name: utils_status_writer
      vars:
        utils_domain_status: "{{ 'success' if ansible_failed_result is not defined else 'failure' }}"
        utils_playbook_name: "backup_oim_logs.yml"
