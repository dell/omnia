# ─────────────────────────────────────────────────────────────────────────
# AArch64 Unattended OS Installation Orchestrator
#
# This playbook automates OS installation on the os_aarch64 builder
# node. It fetches AArch64-specific parameters and calls the generic
# install_os.yml playbook.
#
# Usage:
#   ansible-playbook utils/install_os_arm_node/install_os_arm_node.yml
#   ansible-playbook utils/install_os_arm_node/install_os_arm_node.yml -e "iso_config_path=/custom/path/iso_config.yml"
#
# Prerequisites:
#   1. Omnia Core deployed (omnia.sh --install) with NFS share
#   2. prepare_oim.yml completed
#   3. RHEL 10.x AArch64 Server with GUI ISO pre-placed
#   4. iso_config.yml configured (optional — defaults used otherwise)
# ─────────────────────────────────────────────────────────────────────────

# Parameters
# iso_config_path: Custom path to iso_config.yml (optional)
#   Default: {{ input_project_dir | default('/opt/omnia/input/project_default') }}/iso_config.yml

# ─────────────────────────────────────────────────────────────────────────
# Play 1: Pre-flight checks
# ─────────────────────────────────────────────────────────────────────────
- name: Check if upgrade is in progress
  ansible.builtin.import_playbook: ../../playbooks/utils/upgrade_checkup.yml
  tags: always

- name: Include input project directory
  when: not project_dir_status | default(false) | bool
  ansible.builtin.import_playbook: ../../playbooks/utils/include_input_dir.yml
  tags: always

- name: Validate iso_config.yml
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Determine iso_config path
      ansible.builtin.set_fact:
        iso_config_file: "{{ iso_config_path | default((input_project_dir | default(lookup('env', 'OMNIA_DATA_PATH') | default('/opt/omnia', true) + '/input/project_default')) + '/iso_config.yml') }}"

    - name: Check if iso_config.yml exists
      ansible.builtin.stat:
        path: "{{ iso_config_file }}"
      register: iso_config_stat

    - name: Fail if iso_config.yml not found
      ansible.builtin.fail:
        msg: >-
          iso_config.yml not found at '{{ iso_config_file }}'.
          Please create the configuration file or provide a valid path via iso_config_path parameter.
      when: not iso_config_stat.stat.exists

    - name: Load iso_config.yml
      ansible.builtin.include_vars:
        file: "{{ iso_config_file }}"
        name: iso_config
      register: include_iso_config

# ─────────────────────────────────────────────────────────────────────────
# Play 2: Fetch credentials
# ─────────────────────────────────────────────────────────────────────────
- name: Set run tags for credential fetch
  hosts: localhost
  connection: local
  tags: always
  tasks:
    - name: Set dynamic run tags including 'provision'
      when: not config_file_status | default(false) | bool
      ansible.builtin.set_fact:
        omnia_run_tags: "{{ (ansible_run_tags | default([]) | list + ['provision']) | unique }}"
        cacheable: true

- name: Invoke get_config_credentials.yml
  ansible.builtin.import_playbook: ../../playbooks/utils/credential_utility/get_config_credentials.yml

# ─────────────────────────────────────────────────────────────────────────
# Play 3: Validate ARM configuration and fetch parameters
# ─────────────────────────────────────────────────────────────────────────
- name: Validate ARM configuration and fetch parameters
  hosts: localhost
  connection: local
  gather_facts: true
  roles:
    - role: validate_arm_config
    - role: fetch_arm_params

# ─────────────────────────────────────────────────────────────────────────
# Play 4: Pass credentials as facts to install_os playbook
# ─────────────────────────────────────────────────────────────────────────
- name: Pass credentials to install_os playbook
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Pass credentials as cacheable facts to install_os playbook
      ansible.builtin.set_fact:
        bmc_username: "{{ bmc_username }}"
        bmc_password: "{{ bmc_password }}"
        os_root_password: "{{ provision_password }}"
        cacheable: true
      no_log: true

# ─────────────────────────────────────────────────────────────────────────
# Play 5: Call generic install_os playbook
# ─────────────────────────────────────────────────────────────────────────
- name: Execute generic OS installation
  ansible.builtin.import_playbook: install_os.yml
