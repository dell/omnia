# =========================================================================
# Standalone cleanup playbook for Slurm config backup artifacts.
# This playbook is ONLY invoked via utils.yml with the
# cleanup_slurm_config_backups tag. It removes every backup run directory
# under the resolved backup destination - there is no retention policy.
# =========================================================================

- name: Cleanup Slurm config backup artifacts
  hosts: localhost
  connection: local
  gather_facts: true
  pre_tasks:
    - name: Record execution start time
      ansible.builtin.set_fact:
        utils_execution_start_time: "{{ ansible_date_time.iso8601 }}"
        cacheable: true
  tasks:
    - name: Set OMNIA_DATA_PATH and OMNIA_PROJECT_NAME facts
      ansible.builtin.set_fact:
        omnia_data_path: "{{ lookup('env', 'OMNIA_DATA_PATH') | default('/opt/omnia', true) }}"
        project_name: "{{ lookup('env', 'OMNIA_PROJECT_NAME') | default('project_default', true) }}"

    - name: Check for optional slurm_config_util_config.yml
      ansible.builtin.stat:
        path: "{{ omnia_data_path }}/utils/input/{{ project_name }}/slurm_config_util_config.yml"
      register: _cleanup_config_stat

    - name: Load slurm_config_util_config.yml when present
      ansible.builtin.include_vars:
        file: "{{ omnia_data_path }}/utils/input/{{ project_name }}/slurm_config_util_config.yml"
        name: slurm_util_config
      when: _cleanup_config_stat.stat.exists

    - name: Resolve backup path (CLI extra-var > config file > OMNIA_BACKUP_PATH > default)
      ansible.builtin.set_fact:
        slurm_backup_path_resolved: >-
          {{
            (slurm_backup_path | default('', true))
            if (slurm_backup_path | default('', true) | length > 0)
            else (
              (slurm_util_config.slurm_backup_path | default('', true))
              if (_cleanup_config_stat.stat.exists and (slurm_util_config.slurm_backup_path | default('', true) | length > 0))
              else (
                (lookup('env', 'OMNIA_BACKUP_PATH') | default('', true))
                if (lookup('env', 'OMNIA_BACKUP_PATH') | default('', true) | length > 0)
                else (omnia_data_path + '/utils/output/' + project_name + '/slurm_config_util')
              )
            )
          }}

    - name: Detect raw NFS export syntax ("<server>:/<path>")
      ansible.builtin.set_fact:
        slurm_backup_is_nfs_export: "{{ slurm_backup_path_resolved is match('^[^/]+:/.+') }}"

    - name: Mount NFS export before cleanup
      when: slurm_backup_is_nfs_export
      block:
        - name: Ensure local NFS mountpoint exists
          ansible.builtin.file:
            path: /tmp/omnia_slurm_config_util_nfs
            state: directory
            mode: "0755"

        - name: Mount backup NFS export
          ansible.builtin.mount:
            src: "{{ slurm_backup_path_resolved.split(':', 1)[0] }}:{{ slurm_backup_path_resolved.split(':', 1)[1] }}"
            path: /tmp/omnia_slurm_config_util_nfs
            fstype: nfs
            state: mounted

    - name: Set backup workspace (local path, or mounted NFS mountpoint)
      ansible.builtin.set_fact:
        slurm_backup_workspace: "{{ '/tmp/omnia_slurm_config_util_nfs' if slurm_backup_is_nfs_export else slurm_backup_path_resolved }}"

    - name: Check if backup workspace exists
      ansible.builtin.stat:
        path: "{{ slurm_backup_workspace }}"
      register: _cleanup_workspace_stat

    - name: Find backup run directories
      ansible.builtin.find:
        paths: "{{ slurm_backup_workspace }}"
        file_type: directory
        depth: 1
      register: _cleanup_run_dirs
      when: _cleanup_workspace_stat.stat.exists

    - name: Remove backup run directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ _cleanup_run_dirs.files | default([]) }}"
      loop_control:
        label: "{{ item.path }}"
      when:
        - _cleanup_workspace_stat.stat.exists
        - _cleanup_run_dirs.files is defined

    - name: Display Slurm config backup cleanup summary
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "Slurm Config Backup Cleanup Complete"
          - "=========================================="
          - "Backup workspace: {{ slurm_backup_workspace }}"
          - "Run directories removed: {{ _cleanup_run_dirs.files | default([]) | length }}"
          - "=========================================="
  post_tasks:
    - name: Record execution end time
      ansible.builtin.set_fact:
        utils_execution_end_time: "{{ ansible_date_time.iso8601 }}"
        cacheable: true

    - name: Write execution status
      ansible.builtin.include_role:
        name: utils_status_writer
      vars:
        utils_domain_status: "{{ 'success' if ansible_failed_result is not defined else 'failure' }}"
        utils_playbook_name: "cleanup_slurm_config_backups.yml"
