# ─────────────────────────────────────────────────────────────────────────
# Standalone OS Installation via iDRAC Virtual Media
#
# This playbook installs an OS on a bare-metal target node using iDRAC
# virtual media. It is fully standalone — no dependency on external
# orchestrators or other Omnia modules.
#
# Execution modes (via Ansible tags):
#
#   --tags credentials   Collect and store BMC + OS root credentials only
#   --tags build_iso     Build custom ISO with kickstart (embedded or NFS)
#   --tags deploy        Deploy an existing custom ISO via iDRAC
#   --tags generate_ks   Generate kickstart file only
#   (no tags)            End-to-end: credentials → build → deploy → verify
#
# Configuration:
#   - input/install_os_config.yml      — ISO, kickstart, target node settings
#   - install_os_credentials.yml       — BMC + OS credentials (auto-created)
#
# NFS path handling:
#   - custom_iso_path in config is an NFS URI: "server:/path/filename.iso"
#   - The NFS directory must be mounted locally for build operations
#   - iDRAC accesses the ISO via the same NFS URI for virtual media
# ─────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────
# Play 1: Validate configuration
# ─────────────────────────────────────────────────────────────────────────
- name: Validate install_os configuration
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [install_os, build_iso, deploy, generate_ks]
  roles:
    - role: validate_install_os_config

# ─────────────────────────────────────────────────────────────────────────
# Play 2: Collect credentials
# ─────────────────────────────────────────────────────────────────────────
- name: Collect OS installation credentials
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [credentials, build_iso, deploy, generate_ks]
  roles:
    - role: collect_install_os_credentials

# ─────────────────────────────────────────────────────────────────────────
# Play 3: Validate ISO source and install required tooling
# ─────────────────────────────────────────────────────────────────────────
- name: Validate ISO source and required tooling
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [build_iso, generate_ks]
  roles:
    - role: fetch_iso

# ─────────────────────────────────────────────────────────────────────────
# Play 4: Create custom ISO with Kickstart
# ─────────────────────────────────────────────────────────────────────────
- name: Create custom ISO with Kickstart
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [build_iso]
  roles:
    - role: iso_creation

# ─────────────────────────────────────────────────────────────────────────
# Play 5: Generate kickstart file only (no ISO build)
# ─────────────────────────────────────────────────────────────────────────
- name: Generate kickstart file only
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [generate_ks]
  tasks:
    - name: Initialize NFS auto-mount flag
      ansible.builtin.set_fact:
        _nfs_auto_mounted: false
        cacheable: false

    - name: Check if NFS is already mounted
      ansible.builtin.shell: |
        set -o pipefail
        mount | grep '{{ _nfs_server }}:' | awk '{print $1 " " $3}'
      register: _ks_nfs_mounts
      changed_when: false
      failed_when: false

    - name: Auto-mount NFS if not already mounted
      when: _ks_nfs_mounts.stdout | default('') | trim | length == 0
      block:
        - name: Create temporary NFS mount point
          ansible.builtin.file:
            path: /tmp/install_os_nfs
            state: directory
            mode: "0755"

        - name: Mount NFS share
          ansible.builtin.mount:
            src: "{{ _nfs_server }}:{{ _nfs_dir | dirname }}"
            path: /tmp/install_os_nfs
            fstype: nfs
            state: mounted

        - name: Re-check NFS mounts after auto-mount
          ansible.builtin.shell: |
            set -o pipefail
            mount | grep '{{ _nfs_server }}:' | awk '{print $1 " " $3}'
          register: _ks_nfs_remount_check
          changed_when: false
        - name: Update _ks_nfs_mounts with remount check
          ansible.builtin.set_fact:
            _ks_nfs_mounts: "{{ _ks_nfs_remount_check }}"

        - name: Set flag for cleanup
          ansible.builtin.set_fact:
            _nfs_auto_mounted: true
            cacheable: false

    - name: Resolve local kickstart output path
      ansible.builtin.set_fact:
        _ks_local_dir: >-
          {% set mounts = _ks_nfs_mounts.stdout_lines | default([]) %}
          {% set target_nfs_dir = _nfs_dir %}
          {% for line in mounts %}
          {% set parts = line.split() %}
          {% set nfs_export = parts[0].split(':')[1] %}
          {% set local_mount = parts[1] %}
          {% if target_nfs_dir.startswith(nfs_export) %}
          {% set rel_path = target_nfs_dir[nfs_export | length :].lstrip('/') %}
          {% if rel_path | length > 0 %}
          {{ local_mount }}/{{ rel_path }}
          {% else %}
          {{ local_mount }}
          {% endif %}
          {% endif %}
          {% endfor %}

    - name: Fail if path resolution failed
      ansible.builtin.fail:
        msg: "Failed to resolve local path for kickstart output. NFS mount may have failed or path is incorrect."
      when: _ks_local_dir | trim | length == 0

    - name: Render Kickstart from template
      ansible.builtin.template:
        src: "{{ role_path | default(playbook_dir + '/../roles/iso_creation') }}/templates/{{ kickstart_template }}.ks.j2"
        dest: "{{ _ks_local_dir | trim }}/kickstart.ks"
        mode: "0644"
      when: kickstart_file | default('') | length == 0

    - name: Log kickstart generation
      ansible.builtin.debug:
        msg: "Kickstart file generated at {{ _ks_local_dir | trim }}/kickstart.ks"

    - name: Unmount auto-mounted NFS
      ansible.builtin.command:
        cmd: umount /tmp/install_os_nfs
      when: _nfs_auto_mounted | default(false) | bool
      changed_when: true
      failed_when: false

# ─────────────────────────────────────────────────────────────────────────
# Play 6: Deploy ISO via iDRAC virtual media
# ─────────────────────────────────────────────────────────────────────────
- name: Deliver ISO via iDRAC virtual media
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [deploy]
  roles:
    - role: iso_delivery

# ─────────────────────────────────────────────────────────────────────────
# Play 7: Write status file for omnia-cli
# ─────────────────────────────────────────────────────────────────────────
- name: Write install_os status file
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [build_iso, deploy]
  tasks:
    - name: Set status output directory
      ansible.builtin.set_fact:
        _status_dir: >-
          {{ lookup('env', 'OMNIA_DATA_PATH') | default('/opt/omnia', true) }}/utils/output/{{
             lookup('env', 'OMNIA_PROJECT_NAME') | default('project_default', true) }}

    - name: Ensure status output directory exists
      ansible.builtin.file:
        path: "{{ _status_dir }}"
        state: directory
        mode: "0755"

    - name: Write install_os_status.yml
      ansible.builtin.copy:
        content: |
          ---
          # install_os status file — generated by omnia.utils install_os
          utility: install_os
          status: "{{ 'success' if (_os_verify is defined and _os_verify.rc | default(1) == 0) else 'completed' }}"
          timestamp: "{{ ansible_date_time.iso8601 }}"
          target_bmc_ip: "{{ target_bmc_ip | default('') }}"
          target_admin_ip: "{{ target_admin_ip | default('') }}"
          target_hostname: "{{ target_hostname | default('') }}"
          custom_iso_path: "{{ custom_iso_path | default('') }}"
          architecture: "{{ os_arch | default('') }}"
          kickstart_delivery_method: "{{ kickstart_delivery_method | default('embedded') }}"
          ssh_verified: "{{ (_os_verify is defined and _os_verify.rc | default(1) == 0) | string | lower }}"
        dest: "{{ _status_dir }}/install_os_status.yml"
        mode: "0644"
      failed_when: false
