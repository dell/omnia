# =============================================================================
# backup_oim_logs_config.yml - Optional configuration for OIM log backup
# =============================================================================
# This whole file is optional. If it is absent, all domains below are backed
# up to the default path (OMNIA_DATA_PATH/utils/output/PROJECT_NAME/backup_oim_logs).

# Domains to include in the backup (omit or leave empty for all domains).
domains:
  - repo_manager
  - image_build_manager
  - orchestrator
  - discovery
  - telemetry
  - build_stream
  - utils

# Optional backup destination override. May be a local absolute path or a
# raw NFS export "<server>:/<path>" (e.g. 172.96.20.223:/mnt/backup_dir).
# Leave empty to use OMNIA_BACKUP_PATH (if set) or the default path.
backup_path: ""
