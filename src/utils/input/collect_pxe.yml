# =============================================================================
# collect_pxe.yml - Node Inventory for Log Collection
# =============================================================================
# Add admin IP addresses under each functional group.
#
# Functional groups must match Omnia inventory naming: <role>_<arch>, e.g.
#   - service_kube_control_plane_x86_64
#   - service_kube_node_x86_64
#   - slurm_control_node_x86_64
#   - slurm_node_x86_64
#   - slurm_node_aarch64
#   - login_node_x86_64
#   - login_compiler_node_x86_64
#   - login_compiler_node_aarch64
#
# Omnia's PXE-mapping file (pxe_mapping_file.csv, generated by orchestrator)
# may instead embed the OS name and version between the role and the
# architecture, e.g. slurm_node_rhel_10_0_aarch64 or
# service_kube_control_plane_rhel_10_1_x86_64. Both the bare form above and
# the OS/version-qualified form are accepted here — copy the
# FUNCTIONAL_GROUP_NAME value straight out of pxe_mapping_file.csv if that is
# your source of truth, or use the bare form if you are authoring this file
# by hand. "service_kube_control_plane_first" (the primary control-plane
# node) is also accepted wherever service_kube_control_plane is.
#
# Example:
#   service_kube_control_plane_x86_64:
#     - 192.168.1.10
#     - 192.168.1.11
#   slurm_node_rhel_10_0_aarch64:
#     - 192.168.1.42
# =============================================================================

# Kubernetes control plane nodes (x86_64)
service_kube_control_plane_x86_64:
  # - 192.168.1.10

# Kubernetes worker nodes (x86_64)
service_kube_node_x86_64:
  # - 192.168.1.20
  # - 192.168.1.21

# Slurm controller nodes (x86_64)
slurm_control_node_x86_64:
  # - 192.168.1.30

# Slurm compute nodes (x86_64)
slurm_node_x86_64:
  # - 192.168.1.40
  # - 192.168.1.41

# Slurm compute nodes (aarch64)
slurm_node_aarch64:
  # - 192.168.1.42

# Login nodes (x86_64)
login_node_x86_64:
  # - 192.168.1.50

# Login compiler nodes (x86_64)
login_compiler_node_x86_64:
  # - 192.168.1.55

# Login compiler nodes (aarch64)
login_compiler_node_aarch64:
  # - 192.168.1.60
