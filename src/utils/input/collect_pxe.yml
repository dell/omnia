# =============================================================================
# collect_pxe.yml - Node Inventory for Log Collection
# =============================================================================
# Add admin IP addresses under each functional group.
# Leave empty [] if no nodes for that group.
#
# Example:
#   k8s_masters:
#     - 192.168.1.10
#     - 192.168.1.11
# =============================================================================

# Kubernetes control plane nodes
k8s_masters: []
  # - 192.168.1.10

# Kubernetes worker nodes
k8s_workers: []
  # - 192.168.1.20
  # - 192.168.1.21

# Slurm controller nodes
slurm_controllers: []
  # - 192.168.1.30

# Slurm compute nodes
slurm_nodes: []
  # - 192.168.1.40
  # - 192.168.1.41

# Login nodes
login_nodes: []
  # - 192.168.1.50

# Login compiler nodes
login_compiler_nodes: []
  # - 192.168.1.60
