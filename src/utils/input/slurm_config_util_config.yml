# =============================================================================
# slurm_config_util_config.yml - Optional configuration for Slurm config utilities
# =============================================================================
# This whole file is optional. If it is absent, defaults derived from
# OMNIA_DATA_PATH / OMNIA_PROJECT_NAME are used for every value below.

# --- Input file overrides ---------------------------------------------------
# Path to omnia_config.yml (contains slurm_cluster / nfs_storage_name)
# Default: OMNIA_DATA_PATH/utils/input/OMNIA_PROJECT_NAME/omnia_config.yml
omnia_config_path: ""

# Path to storage_config.yml (contains NFS mount definitions)
# Default: OMNIA_DATA_PATH/utils/input/OMNIA_PROJECT_NAME/storage_config.yml
storage_config_path: ""

# Path to the PXE/node mapping file. This file identifies the Slurm controller(s)
# and provides node-to-IP mappings. Two formats are supported:
#   - YAML format (default): nodes_slurm.yaml (OpenChami-generated)
#       Example: OMNIA_DATA_PATH/openchami/workdir/nodes/nodes_slurm.yaml
#   - CSV format: pxe_mapping_file.csv (orchestrator-generated)
#       Example: OMNIA_DATA_PATH/orchestrator/input/<project>/pxe_mapping_file.csv
# Format is auto-detected from the file extension (.csv = CSV, otherwise YAML).
# Default: OMNIA_DATA_PATH/utils/input/OMNIA_PROJECT_NAME/nodes_slurm.yaml
pxe_mapping_path: ""

# --- NFS share directory names (under the Slurm NFS mount) ------------------
slurm_share_dir_name: "slurm"
slurm_backups_dir_name: "slurm_backups"

# Specific NFS storage name (from storage_config.yml mounts) to use.
# Leave empty to use slurm_cluster[0].nfs_storage_name from omnia_config.yml.
nfs_storage_name: ""

# --- Backup destination override --------------------------------------------
# May be a local absolute path or a raw NFS export "<server>:/<path>".
# Leave empty to use (in order): OMNIA_BACKUP_PATH env var, then the default
# path OMNIA_DATA_PATH/utils/output/OMNIA_PROJECT_NAME/slurm_config_util.
slurm_backup_path: ""

# Optional base name for backup directories (prepended to timestamp).
# Default: "slurm_config" creates "slurm_config_2026-09-14_20-05-08"
backup_base_name: "slurm_config"

# --- Behavioral settings -----------------------------------------------------
# Confirmation token required to proceed with slurm_cleanup
slurm_cleanup_confirm_token: "YES"

# Maximum number of backups shown (latest first) during rollback selection
rollback_backup_list_limit: 20
