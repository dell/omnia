---
# oci_image_ingest_config.yml - connection and mapping only. NO credentials.
# Registry credentials are collected into the Vault-encrypted
# oci_image_ingest_credentials.yml when the oci_image_ingest tag is used.
#
# Usage:
#   ansible-playbook playbooks/utils.yml --tags oci_image_ingest

# registries: Harbor connection details (one entry per registry).
#   registry_name      unique label referenced by image_mappings
#   registry_type      only "harbor" is supported in this increment
#   registry_protocol  http | https
#   registry_hostname  host name or IP of the registry
#   registry_port      optional; defaults to 443 (https) or 80 (http)
registries: []
# Example:
#  - registry_name: harbor-local
#    registry_type: harbor
#    registry_protocol: https
#    registry_hostname: harbor.example.com
#    registry_port: 443

# image_mappings: one OCI image per predefined functional group.
#   mapping_name      unique label
#   registry_name     must match a registries[].registry_name
#   namespace_name    Harbor project
#   image             <repository>:<tag>  or  <repository>@sha256:<digest>
#   functional_group  predefined group name ending in _x86_64 or _aarch64
#   kernel_version    optional; required only when the image holds more than
#                     one complete boot set
#   operation         only "repo_to_bucket" is supported in this increment
image_mappings: []
# Example:
#  - mapping_name: slurm_node
#    registry_name: harbor-local
#    namespace_name: hpc-images
#    image: rhel-slurm-node:10.2
#    functional_group: slurm_node_rhel_10_2_x86_64
#    operation: repo_to_bucket
