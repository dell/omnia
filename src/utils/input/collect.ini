# =============================================================================
# collect.ini — Node Inventory for Log Collection
# =============================================================================
# This file defines which nodes to collect logs from.
#
# Edit this file BEFORE running: omnia.sh --init
# After init, the file is copied to:
#   /opt/omnia/utils/input/<project>/collect.ini
#
# Format:
#   [section_name]
#   ip_address_1
#   ip_address_2
#
# Supported sections:
#   [slurm_control_node]  - Slurm controller nodes
#   [slurm_node]          - Slurm compute nodes
#   [k8s_control_node]    - Kubernetes control plane nodes
#   [k8s_worker_node]     - Kubernetes worker nodes
#   [login_node]          - Login nodes
#   [login_compiler_node] - Login compiler nodes
# =============================================================================

# Slurm control nodes (slurmctld, slurmdbd)
[slurm_control_node]
# Add Slurm controller IP addresses here
# Example:
# 172.16.1.50
# 172.16.1.51

# Slurm compute nodes (slurmd)
[slurm_node]
# Add Slurm compute node IP addresses here
# Example:
# 172.16.1.60
# 172.16.1.61
# 172.16.1.62

# Kubernetes control plane nodes
[k8s_control_node]
# Add K8s control plane IP addresses here
# Example:
# 172.16.2.50

# Kubernetes worker nodes
[k8s_worker_node]
# Add K8s worker node IP addresses here
# Example:
# 172.16.2.60
# 172.16.2.61

# Login nodes
[login_node]
# Add login node IP addresses here
# Example:
# 172.16.3.50

# Login compiler nodes
[login_compiler_node]
# Add login compiler node IP addresses here
# Example:
# 172.16.3.60
