---
# Provided by the Image Build Manager prepare tag (verified only, never installed here).
oci_ingest_prepare_tools:
  - name: regctl
    package: "Image Build Manager --tags prepare"
  - name: s3cmd
    package: "Image Build Manager --tags prepare"

# OS tools that must already be installed on the OIM. The utility never installs them.
oci_ingest_os_tools:
  - name: mksquashfs
    package: squashfs-tools
# - name: tar
#   package: tar

oci_ingest_base_workdir: "{{ omnia_data_path }}/utils/workdir/{{ project_name }}/oci-image-ingest"

prepare_hint: "run Image Build Manager with --tags prepare first"
tool_missing_msg: >-
  Precheck failed: {{ _oci_missing_prepare_tools | join(', ') }} not found on the OIM.
  These are provided by the Image Build Manager prepare tag; {{ prepare_hint }}.
os_tool_missing_msg: >-
  Precheck failed: {{ _oci_missing_os_tools | map(attribute='name') | join(', ') }} not found on the OIM.
  Install the {{ _oci_missing_os_tools | map(attribute='package') | unique | join(', ') }} package, then retry.
  This utility does not install OS packages.
s3cfg_missing_msg: >-
  Precheck failed: {{ oci_ingest_s3cfg_path }} not found; {{ prepare_hint }}.
lock_held_msg: >-
  Another oci_image_ingest run holds the project lock at '{{ oci_ingest_lock_dir }}'.
  Wait for it to finish, or remove the lock directory if the earlier run is confirmed dead.
foreign_status_msg: >-
  '{{ oci_ingest_status_path }}' was written by another producer
  (image_build_type '{{ _oci_existing_status.image_build_type | default('unknown') }}').
  It will not be modified; use a separate output path for OCI image ingest.
