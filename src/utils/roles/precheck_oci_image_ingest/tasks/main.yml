---
# precheck_oci_image_ingest - verify prerequisites, take the per-project lock, create the run workdir.
# Nothing here contacts the registry or S3.

- name: Check tools provided by the Image Build Manager prepare tag
  ansible.builtin.command: "command -v {{ item.name }}"
  loop: "{{ oci_ingest_prepare_tools }}"
  register: _oci_tool_check
  changed_when: false
  failed_when: false

- name: Build the list of missing prepare-provided tools
  ansible.builtin.set_fact:
    _oci_missing_prepare_tools: >-
      {{ _oci_tool_check.results | selectattr('rc', 'ne', 0) | map(attribute='item') | map(attribute='name') | list }}

- name: Fail when a prepare-provided tool is missing
  ansible.builtin.fail:
    msg: "{{ tool_missing_msg }}"
  when: _oci_missing_prepare_tools | length > 0

