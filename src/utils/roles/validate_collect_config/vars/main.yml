---
# Error messages
config_file_missing_msg: >-
  collect_pxe.yml not found at '{{ _collect_pxe_path }}'.
  Please create the configuration file in the input directory.

invalid_ip_format_msg: >-
  Invalid IP address format in collect_pxe.yml: '{{ invalid_ip }}'.
  IP addresses must be in valid IPv4 format (e.g., 192.168.1.10).

empty_group_msg: >-
  All functional groups in collect_pxe.yml are empty.
  At least one IP address must be provided under a functional group.

invalid_group_name_msg: >-
  Invalid group name '{{ invalid_group }}' in collect_pxe.yml.
  Valid group names are: service_kube_control_plane_x86_64, service_kube_node_x86_64,
  slurm_control_node_x86_64, slurm_node_x86_64, slurm_node_aarch64,
  login_node_x86_64, login_compiler_node_aarch64.

config_validated_msg: >-
  collect_pxe.yml validated successfully.
  Groups found: {{ validated_groups | join(', ') }}.
  Total IPs: {{ total_ip_count }}.
