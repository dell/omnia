---
# Validates collect_pxe.yml for log collection playbook
# Ensures valid group names and IP address formats

# Step 1: Resolve config file path
- name: Resolve collect_pxe config path
  ansible.builtin.set_fact:
    _collect_pxe_path: >-
      {{ input_project_dir
         | default(
             lookup('env', 'OMNIA_DATA_PATH')
             | default('/opt/omnia', true)
             + '/utils/input/'
             + lookup('env', 'OMNIA_PROJECT_NAME')
             | default('project_default', true)
           )
      }}/collect_pxe.yml

# Step 2: Check config file exists
- name: Check collect_pxe.yml exists
  ansible.builtin.stat:
    path: "{{ _collect_pxe_path }}"
  register: _config_file_stat

- name: Fail if config file not found
  ansible.builtin.fail:
    msg: "{{ config_file_missing_msg }}"
  when: not (_config_file_stat.stat.exists | default(false))

# Step 3: Load config
- name: Load collect_pxe.yml
  ansible.builtin.include_vars:
    file: "{{ _collect_pxe_path }}"
    name: collect_pxe_config
  when: _config_file_stat.stat.exists | default(false)

# Step 4: Define valid group names
- name: Set valid group names
  ansible.builtin.set_fact:
    _valid_group_names:
      - service_kube_control_plane_x86_64
      - service_kube_node_x86_64
      - slurm_control_node_x86_64
      - slurm_node_x86_64
      - slurm_node_aarch64
      - login_node_x86_64
      - login_compiler_node_aarch64

# Step 5: Validate group names
- name: Validate group names in config
  ansible.builtin.set_fact:
    _invalid_groups: >-
      {{ collect_pxe_config.keys()
         | difference(_valid_group_names)
         | list }}
  when: collect_pxe_config is defined

- name: Fail if invalid group names found
  ansible.builtin.fail:
    msg: "{{ invalid_group_name_msg }}"
  when:
    - collect_pxe_config is defined
    - _invalid_groups | length > 0

# Step 6: Validate IP address formats
- name: Validate IP address formats
  ansible.builtin.set_fact:
    _all_ips: >-
      {{ collect_pxe_config.values()
         | flatten
         | select('string')
         | list }}
    _invalid_ips: []
  when: collect_pxe_config is defined

- name: Check each IP address format
  ansible.builtin.set_fact:
    _invalid_ips: >-
      {{ _invalid_ips + [item] }}
  when:
    - collect_pxe_config is defined
    - item is string
    - item | length > 0
    - not (item is regex('^(?:[0-9]{1,3}\\.){3}[0-9]{1,3}$'))
  loop: "{{ _all_ips }}"
  loop_control:
    loop_var: item

- name: Fail if invalid IP addresses found
  ansible.builtin.fail:
    msg: "{{ invalid_ip_format_msg }}"
  when:
    - collect_pxe_config is defined
    - _invalid_ips | length > 0
  vars:
    invalid_ip: "{{ _invalid_ips[0] }}"

# Step 7: Check if at least one group has IPs
- name: Count total IPs in config
  ansible.builtin.set_fact:
    _total_ip_count: "{{ _all_ips | length }}"
  when: collect_pxe_config is defined

- name: Get non-empty groups
  ansible.builtin.set_fact:
    _non_empty_groups: >-
      {{ collect_pxe_config.keys()
         | list }}
  when: collect_pxe_config is defined

- name: Fail if all groups are empty
  ansible.builtin.fail:
    msg: "{{ empty_group_msg }}"
  when:
    - collect_pxe_config is defined
    - _total_ip_count == 0

# Step 8: Set validated facts for downstream roles
- name: Set validated collect facts
  when: collect_pxe_config is defined
  ansible.builtin.set_fact:
    validated_groups: >-
      {{ collect_pxe_config.keys()
         | intersect(_valid_group_names)
         | list }}
    total_ip_count: "{{ _total_ip_count }}"
    cacheable: true

# Step 9: Log validation success
- name: Log validated configuration summary
  ansible.builtin.debug:
    msg: "{{ config_validated_msg }}"
  when: collect_pxe_config is defined
