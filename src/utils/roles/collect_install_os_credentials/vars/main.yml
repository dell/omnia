---
# Self-contained credential definition for OS installation operations.

# Base path — uses input_project_dir if available, falls back to env-based path
install_os_credentials_dir: >-
  {{ input_project_dir
     | default(lookup('env', 'OMNIA_DATA_PATH') | default('/opt/omnia', true)
               + '/utils/input/'
               + lookup('env', 'OMNIA_PROJECT_NAME') | default('project_default', true)) }}

# Credential file definition
install_os_credential_file:
  credential_type: "OS Install"
  template: "{{ role_path }}/templates/install_os_credentials.j2"
  file_path: "{{ install_os_credentials_dir }}/install_os_credentials.yml"
  file_mode: "0600"
  vault_path: "{{ install_os_credentials_dir }}/.install_os_credentials_key"

# Credential prompt definitions
install_os_cred_config:
  mandatory:
    - username: bmc_username
      password: bmc_password
    - password: os_root_password

# Messages
install_os_mandatory_warning_msg: "WARNING: Credentials are required for OS installation and cannot be left empty."
install_os_password_fail_msg: "Failed. Password is required."
install_os_password_match_fail_msg: "Failed. Passwords do not match. Please try again."
install_os_credential_encrypt_fail_msg: "Failed to encrypt OS install credential file."
