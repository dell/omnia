---
# extract_boot_artifacts - flatten the exported image (OCI whiteouts, safe paths) and select
# the boot set. Runs as root so ownership and xattrs are preserved.

- name: Flatten the image layers into a root filesystem
  oci_flatten_image:
    image_tar: "{{ oci_ingest_pull.tar }}"
    rootfs_dir: "{{ oci_ingest_pull.workdir }}/rootfs"
    scratch_dir: "{{ oci_ingest_pull.workdir }}/scratch"
  register: _oci_flatten

- name: Remove the export archive to reclaim space
  ansible.builtin.file:
    path: "{{ oci_ingest_pull.tar }}"
    state: absent

- name: Select the boot set
  oci_select_boot_set:
    rootfs_dir: "{{ oci_ingest_pull.workdir }}/rootfs"
    kernel_version: "{{ oci_ingest_mapping.kernel_version | default('') }}"
  register: _oci_boot

- name: Log boot candidates considered
  ansible.builtin.debug:
    msg: >-
      Boot candidates {{ _oci_boot.candidates }}; complete {{ _oci_boot.complete }};
      selected {{ _oci_boot.kernel_version }} ({{ _oci_flatten.layers }} layers, {{ _oci_flatten.whiteouts }} whiteouts).

- name: Expose the boot set
  ansible.builtin.set_fact:
    oci_ingest_boot:
      kernel_version: "{{ _oci_boot.kernel_version }}"
      kernel_path: "{{ _oci_boot.kernel_path }}"
      initrd_path: "{{ _oci_boot.initrd_path }}"
      rootfs_dir: "{{ oci_ingest_pull.workdir }}/rootfs"
