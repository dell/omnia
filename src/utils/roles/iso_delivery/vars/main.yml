---

# iDRAC configuration (set by validate_install_os_config)
target_bmc_ip: ""
target_admin_ip: ""
bmc_username: "{{ hostvars['localhost']['bmc_username'] | default('') }}"
bmc_password: "{{ hostvars['localhost']['bmc_password'] | default('') }}"
force_reinstall: false

# SSH verification settings
ssh_verify_enabled: true
ssh_verify_retries: 60
ssh_verify_delay: 30

# Error messages
idrac_unreachable_msg: >-
  iDRAC at '{{ target_bmc_ip }}' is not reachable.
  Please verify network connectivity, the BMC IP address, and iDRAC status,
  then re-run the playbook.
target_already_reachable_msg: >-
  Target node at '{{ target_admin_ip }}' is already reachable via SSH.
  Set 'force_reinstall: true' in install_os_config.yml to proceed with OS reinstallation.
custom_iso_not_found_msg: >-
  Custom ISO not found at the resolved local path.
  For deploy mode, the custom ISO must exist (build it first with --tags build_iso).
sel_error_warning_msg: >-
  WARNING: Installation-related errors detected in iDRAC System Event Log.
  This may not indicate actual installation failure. SSH verification will determine final status.
ssh_wait_fail_msg: >-
  OS installation failed - target node {{ target_admin_ip }} did not become reachable via SSH.
  Check the iDRAC virtual console for installation status.
passwordless_ssh_fail_msg: >-
  Passwordless SSH access failed. The injected SSH public key may not be configured correctly.
  Verify that ks_ssh_public_key was properly injected into the kickstart file.
os_install_success_msg: >-
  OS installation completed successfully!
  Hostname: {{ _os_verify.stdout_lines[0] | default('unknown') }},
  OS: {{ _os_verify.stdout_lines[1] | default('unknown') }},
  Passwordless SSH: verified
