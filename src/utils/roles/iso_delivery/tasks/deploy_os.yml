---

# ── Step 1: Compute NFS ISO URI for iDRAC ───────────────────────────────
- name: Set NFS ISO URI for iDRAC virtual media
  ansible.builtin.set_fact:
    _nfs_iso_uri: "{{ _nfs_server }}:{{ _nfs_full_path }}"

- name: Log NFS ISO URI
  ansible.builtin.debug:
    msg: "iDRAC virtual media will mount ISO from NFS: {{ _nfs_iso_uri }}"

# ── Step 2: Eject existing virtual media ────────────────────────────────
- name: Eject existing virtual media if mounted
  dellemc.openmanage.idrac_virtual_media:
    idrac_ip: "{{ target_bmc_ip }}"
    idrac_user: "{{ bmc_username }}"
    idrac_password: "{{ bmc_password }}"
    validate_certs: false
    virtual_media:
      - insert: false
  changed_when: false
  failed_when: false
  no_log: true

# ── Step 3: Insert ISO as virtual media ─────────────────────────────────
- name: Mount ISO via iDRAC virtual media
  dellemc.openmanage.idrac_virtual_media:
    idrac_ip: "{{ target_bmc_ip }}"
    idrac_user: "{{ bmc_username }}"
    idrac_password: "{{ bmc_password }}"
    validate_certs: false
    force: true
    virtual_media:
      - insert: true
        image: "{{ _nfs_iso_uri }}"
  register: _insert_result
  no_log: true

- name: Set boot override to CD (one-time)
  dellemc.openmanage.idrac_boot:
    idrac_ip: "{{ target_bmc_ip }}"
    idrac_user: "{{ bmc_username }}"
    idrac_password: "{{ bmc_password }}"
    validate_certs: false
    boot_source_override_enabled: "once"
    boot_source_override_target: "cd"
    boot_source_override_mode: uefi
    resource_id: "System.Embedded.1"
    reset_type: "none"
  register: _boot_override_result
  no_log: true

- name: Reboot server to boot from ISO
  dellemc.openmanage.redfish_powerstate:
    baseuri: "{{ target_bmc_ip }}"
    username: "{{ bmc_username }}"
    password: "{{ bmc_password }}"
    validate_certs: false
    reset_type: "ForceRestart"
    resource_id: "System.Embedded.1"
  register: _reboot_result
  no_log: true

# ── Step 4: Wait for OS installation to complete ────────────────────────
- name: Wait for target node to become offline (reboot in progress)
  ansible.builtin.wait_for:
    host: "{{ target_admin_ip }}"
    port: 22
    state: stopped
    timeout: 300
  when: target_admin_ip | default('') | length > 0
  failed_when: false

- name: OS installation in progress
  ansible.builtin.debug:
    msg: >-
      Target node is offline. OS installation in progress via iDRAC virtual media.
      Waiting for SSH to become available on {{ target_admin_ip }}...

# ── Step 5: Wait for SSH to come up ─────────────────────────────────────
- name: Wait for target node SSH to become available
  ansible.builtin.wait_for:
    host: "{{ target_admin_ip }}"
    port: 22
    state: started
    delay: "{{ ssh_verify_delay | default(30) }}"
    timeout: "{{ (ssh_verify_retries | default(60) | int) * (ssh_verify_delay | default(30) | int) }}"
  register: _ssh_wait
  when:
    - target_admin_ip | default('') | length > 0
    - ssh_verify_enabled | default(true) | bool
  failed_when: false

- name: Fail if SSH wait timed out
  ansible.builtin.fail:
    msg: "{{ ssh_wait_fail_msg }}"
  when:
    - ssh_verify_enabled | default(true) | bool
    - _ssh_wait is defined
    - _ssh_wait is failed

# ── Step 6: Verify installed OS ─────────────────────────────────────────
# Both key-based and password-based SSH access are verified independently
# (irrespective of each other's outcome). The overall check succeeds if
# either method works; a warning is logged for whichever method failed.
# ssh_private_key_path is the private-key counterpart of ssh_public_key_path
# (the key injected into the kickstart via ks_ssh_public_key) — it is required
# so the key-based check uses that exact key rather than whatever key
# ~/.ssh/config or ssh-agent would pick by default.
- name: Verify passwordless SSH access with injected key
  ansible.builtin.command:
    cmd: >-
      ssh -o StrictHostKeyChecking=no
      -o ConnectTimeout=10
      -o BatchMode=yes
      -o PasswordAuthentication=no
      -o IdentityFile={{ ssh_private_key_path }}
      root@{{ target_admin_ip }}
      'hostname'
  register: _ssh_key_verify
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - target_admin_ip | default('') | length > 0
    - ssh_verify_enabled | default(true) | bool
  delegate_to: localhost

- name: Verify SSH access with root password
  ansible.builtin.command:
    cmd: >-
      sshpass -p '{{ hostvars['localhost']['os_root_password'] | default('') }}'
      ssh -o StrictHostKeyChecking=no
      -o ConnectTimeout=10
      -o PreferredAuthentications=password
      -o PubkeyAuthentication=no
      root@{{ target_admin_ip }}
      'hostname'
  register: _ssh_password_verify
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - target_admin_ip | default('') | length > 0
    - ssh_verify_enabled | default(true) | bool
    - hostvars['localhost']['os_root_password'] | default('') | length > 0
  delegate_to: localhost

- name: Warn if passwordless SSH key access failed
  ansible.builtin.debug:
    msg: "{{ passwordless_ssh_fail_msg }}"
  when:
    - ssh_verify_enabled | default(true) | bool
    - _ssh_key_verify is defined
    - _ssh_key_verify.rc | default(1) != 0

- name: Warn if root password SSH access failed
  ansible.builtin.debug:
    msg: "{{ ssh_password_fail_msg }}"
  when:
    - ssh_verify_enabled | default(true) | bool
    - _ssh_password_verify is defined
    - _ssh_password_verify.rc | default(1) != 0

- name: Fail if both SSH key and password authentication fail
  ansible.builtin.fail:
    msg: >-
      SSH access failed. Neither passwordless SSH (with {{ ssh_private_key_path }})
      nor password authentication succeeded. Verify the injected SSH key or root password.
  when:
    - ssh_verify_enabled | default(true) | bool
    - _ssh_key_verify is defined
    - _ssh_key_verify.rc | default(1) != 0
    - _ssh_password_verify.rc | default(1) != 0

- name: Verify installed OS details (prefer key auth, fall back to password auth)
  ansible.builtin.command:
    cmd: >-
      {% if _ssh_key_verify.rc | default(1) == 0 %}
      ssh -o StrictHostKeyChecking=no
      -o ConnectTimeout=10
      -o BatchMode=yes
      -o IdentityFile={{ ssh_private_key_path }}
      root@{{ target_admin_ip }}
      {% else %}
      sshpass -p '{{ hostvars['localhost']['os_root_password'] | default('') }}'
      ssh -o StrictHostKeyChecking=no
      -o ConnectTimeout=10
      -o PreferredAuthentications=password
      -o PubkeyAuthentication=no
      root@{{ target_admin_ip }}
      {% endif %}
      'hostname && cat /etc/redhat-release && cat /root/.ks-complete 2>/dev/null || echo "Kickstart marker not found"'
  register: _os_verify
  no_log: true
  changed_when: false
  failed_when: false
  when:
    - target_admin_ip | default('') | length > 0
    - ssh_verify_enabled | default(true) | bool
    - (_ssh_key_verify.rc | default(1) == 0) or (_ssh_password_verify.rc | default(1) == 0)
  delegate_to: localhost

- name: Log OS installation result
  ansible.builtin.debug:
    msg: "{{ os_install_success_msg }}"
  when:
    - _os_verify is defined
    - _os_verify.rc | default(1) == 0

# ── Step 7: Cleanup — eject virtual media ───────────────────────────────
- name: Eject virtual media after installation
  dellemc.openmanage.idrac_virtual_media:
    idrac_ip: "{{ target_bmc_ip }}"
    idrac_user: "{{ bmc_username }}"
    idrac_password: "{{ bmc_password }}"
    validate_certs: false
    virtual_media:
      - insert: false
  changed_when: true
  failed_when: false
  no_log: true
