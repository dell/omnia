---

# Kickstart filename used inside ISO and on NFS
nfs_kickstart_filename: "kickstart.ks"

# Temporary files for ISO modification
temp_grub_cfg: "/tmp/grub_{{ ansible_date_time.epoch }}.cfg"

# Kickstart configuration
kickstart_file: ""
kickstart_template: "rhel10"

# Kickstart delivery method (embedded or nfs)
kickstart_delivery_method: "embedded"

# Interactive behavior
rebuild_iso: false

# Manifest file (placed alongside the custom ISO)
manifest_filename: "install_os_manifest.yml"

# Kickstart template variables (set by validate_install_os_config role)
ks_root_password_hash: ""
ks_ssh_public_key: ""
ks_hostname: "node"
ks_static_ip: ""
ks_netmask: "255.255.255.0"
ks_gateway: ""
ks_dns: ""
ks_network_device: ""
ks_timezone: "UTC"
ks_install_disk: "sda"

# Error messages
kickstart_file_not_found_msg: >-
  User-provided Kickstart file not found at '{{ kickstart_file }}'.
  Please verify the file path and re-run the playbook.
kickstart_render_fail_msg: >-
  Failed to render Kickstart template '{{ kickstart_template }}'.
  Please verify that all required template variables are set.
iso_repack_fail_msg: >-
  Failed to repack the ISO. Check the log for details.
user_ks_missing_rootpw_msg: >-
  WARNING: User-provided Kickstart file does not contain a 'rootpw' directive.
  The installed system may not have a root password set.
user_ks_missing_sshkey_msg: >-
  WARNING: User-provided Kickstart file does not contain an 'sshkey' directive.
  OIM SSH key will not be injected into the installed system.
nfs_mount_not_found_msg: >-
  Cannot find local mount point for NFS server '{{ _nfs_server }}'.
  The NFS directory containing custom_iso_path must be mounted locally.
  Mount it with: mount -t nfs {{ _nfs_server }}:{{ _nfs_dir }} /mnt/install_os_nfs
