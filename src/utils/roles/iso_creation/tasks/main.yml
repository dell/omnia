---

# Step 1: Resolve NFS path to local mount point
- name: Initialize NFS auto-mount flag
  ansible.builtin.set_fact:
    _nfs_auto_mounted: false
    cacheable: false

- name: Check if NFS is already mounted
  ansible.builtin.shell: |
    set -o pipefail
    mount | grep '{{ _nfs_server }}:' | awk '{print $1 " " $3}'
  register: _nfs_mounts
  changed_when: false
  failed_when: false

- name: Auto-mount NFS if not already mounted
  when: _nfs_mounts.stdout | default('') | trim | length == 0
  block:
    - name: Create temporary NFS mount point
      ansible.builtin.file:
        path: /tmp/install_os_nfs
        state: directory
        mode: "0755"

    - name: Mount NFS share
      ansible.builtin.command:
        cmd: mount -t nfs {{ _nfs_server }}:{{ _nfs_dir | dirname }} /tmp/install_os_nfs
      changed_when: true

    - name: Re-check NFS mounts after auto-mount
      ansible.builtin.shell: |
        set -o pipefail
        mount | grep '{{ _nfs_server }}:' | awk '{print $1 " " $3}'
      register: _nfs_remount_check
      changed_when: false
    
    - name: Update _nfs_mounts with remount check
      ansible.builtin.set_fact:
        _nfs_mounts: "{{ _nfs_remount_check }}"

    - name: Set flag for cleanup
      ansible.builtin.set_fact:
        _nfs_auto_mounted: true
        cacheable: false

- name: Fail if NFS mount still not found
  ansible.builtin.fail:
    msg: "{{ nfs_mount_not_found_msg }}"
  when:
    - _nfs_mounts.stdout is defined
    - _nfs_mounts.stdout | trim | length == 0

- name: Resolve local path from NFS mount
  ansible.builtin.set_fact:
    _local_iso_dir: >-
      {% set mounts = _nfs_mounts.stdout_lines | default([]) %}
      {% set target_nfs_dir = _nfs_dir %}
      {% set result = '' %}
      {% for line in mounts %}
      {% set parts = line.split() %}
      {% set nfs_export = parts[0].split(':')[1] %}
      {% set local_mount = parts[1] %}
      {% if target_nfs_dir.startswith(nfs_export) %}
      {% set rel_path = target_nfs_dir[nfs_export | length :].lstrip('/') %}
      {% if rel_path | length > 0 %}
      {{ local_mount }}/{{ rel_path }}
      {% else %}
      {{ local_mount }}
      {% endif %}
      {% endif %}
      {% endfor %}
    cacheable: true

- name: Validate path resolution succeeded
  ansible.builtin.fail:
    msg: "Failed to resolve local NFS path. NFS server {{ _nfs_server }} may not be mounted or path {{ _nfs_dir }} doesn't match any mounted export."
  when: _local_iso_dir | trim | length == 0

- name: Clean up local ISO directory path
  ansible.builtin.set_fact:
    _local_iso_dir: "{{ _local_iso_dir | trim }}"
    _local_iso_path: "{{ _local_iso_dir | trim }}/{{ _nfs_iso_filename }}"
    _local_ks_path: "{{ _local_iso_dir | trim }}/{{ nfs_kickstart_filename }}"
    _local_manifest_path: "{{ _local_iso_dir | trim }}/{{ manifest_filename }}"
    cacheable: true

- name: Ensure output directory exists
  ansible.builtin.file:
    path: "{{ _local_iso_dir }}"
    state: directory
    mode: "0755"

# Step 2: Check if custom ISO already exists
- name: Check if custom ISO already exists
  ansible.builtin.stat:
    path: "{{ _local_iso_path }}"
  register: _custom_iso_stat

- name: Log ISO status
  ansible.builtin.debug:
    msg: >-
      {% if _custom_iso_stat.stat.exists and not (rebuild_iso | bool) %}
      Custom ISO already exists at {{ _local_iso_path }}. Skipping build (set rebuild_iso: true to force).
      {% elif _custom_iso_stat.stat.exists and rebuild_iso | bool %}
      Custom ISO exists but rebuild_iso is true — will rebuild.
      {% else %}
      Custom ISO does not exist — will build.
      {% endif %}

# Step 3: Render kickstart file
- name: Render kickstart file
  when: not _custom_iso_stat.stat.exists or rebuild_iso | bool
  block:
    - name: Render Kickstart from template
      ansible.builtin.template:
        src: "{{ kickstart_template }}.ks.j2"
        dest: "{{ _local_ks_path }}"
        mode: "0644"
      when: kickstart_file | default('') | length == 0

    - name: Process user-provided Kickstart
      ansible.builtin.include_tasks: inject_user_kickstart.yml
      vars:
        kickstart_output_path: "{{ _local_ks_path }}"
      when: kickstart_file | default('') | length > 0

    - name: Log kickstart creation
      ansible.builtin.debug:
        msg: "Kickstart file created at {{ _local_ks_path }}"

# Step 4: Build custom ISO
- name: Build custom ISO with embedded kickstart
  ansible.builtin.include_tasks: build_embedded_iso.yml
  when:
    - not _custom_iso_stat.stat.exists or rebuild_iso | bool
    - kickstart_delivery_method | default('embedded') == 'embedded'

- name: Build custom ISO with NFS kickstart reference
  ansible.builtin.include_tasks: build_nfs_iso.yml
  when:
    - not _custom_iso_stat.stat.exists or rebuild_iso | bool
    - kickstart_delivery_method | default('embedded') == 'nfs'

# Step 5: Cleanup auto-mounted NFS
- name: Unmount auto-mounted NFS
  ansible.builtin.command:
    cmd: umount /tmp/install_os_nfs
  when: _nfs_auto_mounted | default(false) | bool
  changed_when: true
  failed_when: false
