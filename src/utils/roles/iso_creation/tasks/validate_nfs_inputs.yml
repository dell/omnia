---
# Validate NFS inputs for security

- name: Validate NFS server input
  ansible.builtin.set_fact:
    _nfs_server_validation: "{{ _nfs_server | validate_nfs_input('server') }}"

- name: Fail if NFS server is invalid
  ansible.builtin.fail:
    msg: "NFS server validation failed: {{ _nfs_server_validation.message }}"
  when: not (_nfs_server_validation.valid | bool)

- name: Validate NFS directory path
  ansible.builtin.set_fact:
    _nfs_dir_validation: "{{ _nfs_dir | validate_nfs_input('path') }}"

- name: Fail if NFS directory is invalid
  ansible.builtin.fail:
    msg: "NFS directory validation failed: {{ _nfs_dir_validation.message }}"
  when: not (_nfs_dir_validation.valid | bool)

- name: Validate ISO filename
  ansible.builtin.assert:
    that:
      - _nfs_iso_filename is defined
      - _nfs_iso_filename | length > 0
      - _nfs_iso_filename is match('^[a-zA-Z0-9_\\-\\.]+\\.iso$')
      - "'..' not in _nfs_iso_filename"
      - "'/' not in _nfs_iso_filename"
      - "';' not in _nfs_iso_filename"
      - "'&' not in _nfs_iso_filename"
      - "'|' not in _nfs_iso_filename"
      - "'`' not in _nfs_iso_filename"
      - "'$' not in _nfs_iso_filename"
    fail_msg: "ISO filename validation failed: contains invalid characters or format"
    success_msg: "ISO filename is valid"
