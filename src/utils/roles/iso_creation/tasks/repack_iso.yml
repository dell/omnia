---

- name: Render GRUB2 configuration for AArch64 UEFI
  ansible.builtin.template:
    src: grub.cfg.j2
    dest: "{{ grub_cfg_path }}"
    mode: "0644"

- name: Repack ISO with xorrisofs
  ansible.builtin.command: >-
    xorrisofs
    -o {{ repacked_iso_path }}
    -R -J -joliet-long
    -V "{{ iso_volume_id }}"
    -e images/efiboot.img
    -no-emul-boot
    -isohybrid-gpt-basdat
    {{ iso_extract_dir }}
  changed_when: true
  register: iso_repack_result
  failed_when: iso_repack_result.rc != 0

- name: Implant MD5 checksum into repacked ISO
  ansible.builtin.command: "implantisomd5 {{ repacked_iso_path }}"
  changed_when: true
  failed_when: false

- name: Compute SHA-256 checksum of repacked ISO
  ansible.builtin.stat:
    path: "{{ repacked_iso_path }}"
    checksum_algorithm: sha256
  register: repacked_iso_stat

- name: Generate install manifest
  ansible.builtin.copy:
    content: |
      ---
      # Install OS Manifest
      # Generated by utils/install_os
      source_iso: "{{ iso_source_path }}"
      source_iso_checksum: "{{ iso_source_checksum | default('not provided') }}"
      repacked_iso: "{{ repacked_iso_path }}"
      repacked_iso_checksum: "{{ repacked_iso_stat.stat.checksum }}"
      repacked_iso_size: "{{ repacked_iso_stat.stat.size }}"
      kickstart_template: "{{ kickstart_template | default('user-provided') }}"
      kickstart_file: "{{ kickstart_file | default('') }}"
      timestamp: "{{ ansible_date_time.iso8601 | default(lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ')) }}"
    dest: "{{ manifest_path }}"
    mode: "0644"

- name: Clean up extracted ISO directory
  ansible.builtin.file:
    path: "{{ iso_extract_dir }}"
    state: absent

- name: Log ISO repack success
  ansible.builtin.debug:
    msg: >-
      ISO repacked successfully. Output: {{ repacked_iso_path }}
      (SHA-256: {{ repacked_iso_stat.stat.checksum }}).
      Manifest: {{ manifest_path }}
