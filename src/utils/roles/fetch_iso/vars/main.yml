---

# Default values (overridden by set_fact from validate_install_os_config)
iso_source_path: "{{ source_iso_path | default('') }}"
iso_source_checksum: "{{ source_iso_checksum | default('') }}"
iso_target_directory: "{{ _local_iso_dir | default('/tmp/install_os') }}"

# Required ISO tooling
required_iso_tools:
  - name: xorriso
    package: xorriso
  - name: implantisomd5
    package: isomd5sum

# Error messages
iso_not_found_msg: >-
  Source ISO not found at '{{ iso_source_path }}'.
  Please verify the path in install_os_config.yml and re-run the playbook.
iso_checksum_mismatch_msg: >-
  Source ISO checksum mismatch. Expected: {{ iso_source_checksum }}.
  The ISO file may be corrupted or incomplete. Please re-download the ISO and retry.
tool_missing_msg: >-
  Required ISO tooling is missing: {{ missing_tools | join(', ') }}.
  Install the missing packages and re-run the playbook.
