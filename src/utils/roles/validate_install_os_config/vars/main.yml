---

# Error messages
config_file_missing_msg: >-
  install_os_config.yml not found at '{{ _install_os_config_path }}'.
  Please create the configuration file in the input directory.
custom_iso_path_missing_msg: >-
  'custom_iso_path' is required but not set in install_os_config.yml.
  Provide the NFS path where the custom ISO will be stored/read.
  Format: "nfs_server:/export_path/filename.iso"
custom_iso_path_format_msg: >-
  'custom_iso_path' must be in NFS URI format: "server:/path/filename.iso".
  Got: '{{ install_os_config.custom_iso_path | default("") }}'
source_iso_missing_msg: >-
  'source_iso_path' is required for build_iso and generate_ks modes but is not set.
target_bmc_missing_msg: >-
  'target_bmc_ip' is required for deploy mode but is not set.
target_hostname_missing_msg: >-
  'target_hostname' is required for build operations but is not set.
target_admin_ip_missing_msg: >-
  'target_admin_ip' is required for deploy mode but is not set.
invalid_architecture_msg: >-
  'target_architecture' must be 'x86_64' or 'aarch64'. Got: '{{ _os_arch }}'
invalid_ks_delivery_msg: >-
  'kickstart_delivery_method' must be 'embedded' or 'nfs'. Got: '{{ install_os_config.kickstart_delivery_method | default("") }}'
ssh_key_not_found_msg: >-
  SSH public key not found at {{ ssh_public_key_path }}.
  Passwordless SSH verification requires this key for OS installation.
  Generate an SSH key with the following command:
  ssh-keygen -t rsa -b 4096 -N "" -f {{ ssh_public_key_path | regex_replace('\.pub$', '') }}
  Or specify a different path in install_os_config.yml: ssh_public_key_path
config_validated_msg: >-
  OS Install config validated.
  Mode: build={{ _mode_build_iso }}, deploy={{ _mode_deploy }}, generate_ks={{ _mode_generate_ks }}.
  Arch: {{ os_arch | default('N/A') }}.
  Source ISO: {{ source_iso_path | default('N/A') }}.
  Custom ISO: {{ custom_iso_path | default('N/A') }}.
  KS delivery: {{ kickstart_delivery_method | default('embedded') }}.
  Target BMC: {{ target_bmc_ip | default('N/A') }}.
  SSH key: {{ ssh_public_key_path | default('N/A') }} (validated).
