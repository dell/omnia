---
# Validates install_os_config.yml parameters based on the active execution mode.
# Execution mode is determined by ansible_run_tags:
#   build_iso     — requires source_iso_path, custom_iso_path
#   deploy        — requires custom_iso_path, target_bmc_ip, target_admin_ip
#   generate_ks   — requires source_iso_path (for arch detection)
#   (default)     — requires all of the above

# Step 1: Determine active execution mode from tags
- name: Determine execution mode from tags
  ansible.builtin.set_fact:
    _mode_build_iso: "{{ 'build_iso' in ansible_run_tags or ansible_run_tags | length == 0 or 'all' in ansible_run_tags }}"
    _mode_deploy: "{{ 'deploy' in ansible_run_tags or ansible_run_tags | length == 0 or 'all' in ansible_run_tags }}"
    _mode_generate_ks: "{{ 'generate_ks' in ansible_run_tags or ansible_run_tags | length == 0 or 'all' in ansible_run_tags }}"
    _mode_credentials_only: "{{ ansible_run_tags | length == 1 and 'credentials' in ansible_run_tags }}"
    cacheable: true

# Step 2: Resolve config file path
- name: Resolve install_os config path
  ansible.builtin.set_fact:
    _install_os_config_path: >-
      {{ input_project_dir
         | default(lookup('env', 'OMNIA_DATA_PATH') | default('/opt/omnia', true)
                   + '/utils/input/'
                   + lookup('env', 'OMNIA_PROJECT_NAME') | default('project_default', true))
      }}/install_os_config.yml

# Step 3: Check config file exists (skip for credentials-only mode)
- name: Check install_os_config.yml exists
  ansible.builtin.stat:
    path: "{{ _install_os_config_path }}"
  register: _config_file_stat
  when: not (_mode_credentials_only | bool)

- name: Fail if config file not found
  ansible.builtin.fail:
    msg: "{{ config_file_missing_msg }}"
  when:
    - not (_mode_credentials_only | bool)
    - not (_config_file_stat.stat.exists | default(false))

# Step 4: Load config
- name: Load install_os_config.yml
  ansible.builtin.include_vars:
    file: "{{ _install_os_config_path }}"
    name: install_os_config
  when:
    - not (_mode_credentials_only | bool)
    - _config_file_stat.stat.exists | default(false)

# Step 5: Set top-level facts from config for downstream roles
- name: Set install_os facts from config
  when: install_os_config is defined
  ansible.builtin.set_fact:
    source_iso_path: "{{ install_os_config.source_iso_path | default('') }}"
    source_iso_checksum: "{{ install_os_config.source_iso_checksum | default('') }}"
    custom_iso_path: "{{ install_os_config.custom_iso_path | default('') }}"
    kickstart_delivery_method: "{{ install_os_config.kickstart_delivery_method | default('embedded') }}"
    kickstart_file: "{{ install_os_config.kickstart_file | default('') }}"
    kickstart_template: "{{ install_os_config.kickstart_template | default('rhel10') }}"
    target_bmc_ip: "{{ install_os_config.target_bmc_ip | default('') }}"
    target_hostname: "{{ install_os_config.target_hostname | default('') }}"
    target_admin_ip: "{{ install_os_config.target_admin_ip | default('') }}"
    target_architecture: "{{ install_os_config.target_architecture | default('') }}"
    network_device: "{{ install_os_config.network_device | default('') }}"
    netmask: "{{ install_os_config.netmask | default('255.255.255.0') }}"
    gateway: "{{ install_os_config.gateway | default('') }}"
    dns_server: "{{ install_os_config.dns_server | default('') }}"
    install_disk: "{{ install_os_config.install_disk | default('sda') }}"
    timezone: "{{ install_os_config.timezone | default('UTC') }}"
    rebuild_iso: "{{ install_os_config.rebuild_iso | default(false) }}"
    force_reinstall: "{{ install_os_config.force_reinstall | default(false) }}"
    ssh_verify_enabled: "{{ install_os_config.ssh_verify_enabled | default(true) }}"
    ssh_verify_retries: "{{ install_os_config.ssh_verify_retries | default(60) }}"
    ssh_verify_delay: "{{ install_os_config.ssh_verify_delay | default(30) }}"
    ssh_public_key_path: "{{ install_os_config.ssh_public_key_path | default('/root/.ssh/id_rsa.pub') }}"
    cacheable: true

# Step 6: Validate kickstart_delivery_method
- name: Validate kickstart_delivery_method
  ansible.builtin.fail:
    msg: "{{ invalid_ks_delivery_msg }}"
  when:
    - install_os_config is defined
    - install_os_config.kickstart_delivery_method | default('embedded') not in ['embedded', 'nfs']

# Step 7: Validate custom_iso_path format (must be NFS URI)
- name: Validate custom_iso_path is provided
  ansible.builtin.fail:
    msg: "{{ custom_iso_path_missing_msg }}"
  when:
    - not (_mode_credentials_only | bool)
    - _mode_build_iso | bool or _mode_deploy | bool
    - custom_iso_path | default('') | length == 0

- name: Validate custom_iso_path format (NFS URI)
  ansible.builtin.fail:
    msg: "{{ custom_iso_path_format_msg }}"
  when:
    - custom_iso_path | default('') | length > 0
    - "':' not in custom_iso_path"

# Step 8: Parse custom_iso_path into NFS components
- name: Parse NFS components from custom_iso_path
  when: custom_iso_path | default('') | length > 0
  ansible.builtin.set_fact:
    _nfs_server: "{{ custom_iso_path.split(':')[0] }}"
    _nfs_full_path: "{{ custom_iso_path.split(':')[1] }}"
    _nfs_dir: "{{ custom_iso_path.split(':')[1] | dirname }}"
    _nfs_iso_filename: "{{ custom_iso_path.split(':')[1] | basename }}"
    cacheable: true

# Step 8a: Resolve local NFS mount path for deploy mode
- name: Get NFS mounts for deploy mode
  ansible.builtin.shell: "mount | grep -E ' type nfs[0-9]?' || true"
  register: _deploy_nfs_mounts
  changed_when: false
  when:
    - _mode_deploy | bool
    - custom_iso_path | default('') | length > 0

- name: Resolve local ISO path from NFS mounts for deploy mode
  when:
    - _mode_deploy | bool
    - custom_iso_path | default('') | length > 0
  ansible.builtin.shell: |
    mount | grep -E ' type nfs[0-9]?' | while read -r line; do
      nfs_export=$(echo "$line" | awk '{print $1}')
      local_mount=$(echo "$line" | awk '{print $3}')
      if [[ "$nfs_export" == "{{ _nfs_server }}:"* ]]; then
        remote_export="${nfs_export#{{ _nfs_server }}:}"
        if [[ "{{ _nfs_dir }}" == "$remote_export" ]]; then
          echo "$local_mount"
          exit 0
        elif [[ "{{ _nfs_dir }}" == "$remote_export"/* ]]; then
          rel_path="{{ _nfs_dir }}"
          rel_path="${rel_path#$remote_export/}"
          echo "$local_mount/$rel_path"
          exit 0
        fi
      fi
    done
  register: _local_iso_dir_result
  changed_when: false
  failed_when: false

- name: Set local ISO directory fact for deploy mode
  when:
    - _mode_deploy | bool
    - custom_iso_path | default('') | length > 0
    - _local_iso_dir_result.stdout | default('') | trim | length > 0
  ansible.builtin.set_fact:
    _local_iso_dir: "{{ _local_iso_dir_result.stdout | trim }}"
    cacheable: true

- name: Set local ISO path for deploy mode
  when:
    - _mode_deploy | bool
    - custom_iso_path | default('') | length > 0
    - _local_iso_dir | default('') | trim | length > 0
  ansible.builtin.set_fact:
    _local_iso_path: "{{ _local_iso_dir | trim }}/{{ _nfs_iso_filename }}"
    cacheable: true

# Step 9: Validate source_iso_path for build modes
- name: Validate source_iso_path for build modes
  ansible.builtin.fail:
    msg: "{{ source_iso_missing_msg }}"
  when:
    - _mode_build_iso | bool or _mode_generate_ks | bool
    - source_iso_path | default('') | length == 0

# Step 10: Auto-detect architecture from ISO filename
- name: Auto-detect architecture from ISO filename
  ansible.builtin.set_fact:
    _os_arch: >-
      {{ target_architecture
         if (target_architecture | default('') | length > 0)
         else (source_iso_path | default('') | basename | regex_search('(x86_64|aarch64)', ignorecase=True) | default('x86_64') | lower) }}
    cacheable: true

- name: Validate architecture
  ansible.builtin.fail:
    msg: "{{ invalid_architecture_msg }}"
  when:
    - not (_mode_credentials_only | bool)
    - _os_arch | default('') | length > 0
    - _os_arch not in ['x86_64', 'aarch64']

# Step 11: Validate deploy-mode required fields
- name: Validate target_bmc_ip for deploy mode
  ansible.builtin.fail:
    msg: "{{ target_bmc_missing_msg }}"
  when:
    - _mode_deploy | bool
    - target_bmc_ip | default('') | length == 0

- name: Validate target_admin_ip for deploy mode
  ansible.builtin.fail:
    msg: "{{ target_admin_ip_missing_msg }}"
  when:
    - _mode_deploy | bool
    - target_admin_ip | default('') | length == 0

# Step 12: Validate SSH public key availability
- name: Check if SSH public key exists
  ansible.builtin.stat:
    path: "{{ ssh_public_key_path }}"
  register: _ssh_key_stat
  when:
    - not (_mode_credentials_only | bool)
    - (_mode_build_iso | bool or _mode_generate_ks | bool or ansible_run_tags | length == 0)

- name: Fail if SSH public key not found
  ansible.builtin.fail:
    msg: >-
      SSH public key not found at {{ ssh_public_key_path }}.
      Passwordless SSH verification requires this key for OS installation.
      Generate an SSH key with the following command:
      ssh-keygen -t rsa -b 4096 -N "" -f {{ ssh_public_key_path | dirname }}/id_rsa
      Or specify a different path in install_os_config.yml: ssh_public_key_path
  when:
    - not (_mode_credentials_only | bool)
    - (_mode_build_iso | bool or _mode_generate_ks | bool or ansible_run_tags | length == 0)
    - not (_ssh_key_stat.stat.exists | default(false))

# Step 13: Set derived variables for downstream roles
- name: Set derived variables for downstream roles
  ansible.builtin.set_fact:
    os_arch: "{{ _os_arch }}"
    ks_hostname: "{{ target_hostname | default('node') }}"
    ks_static_ip: "{{ target_admin_ip | default('') }}"
    ks_netmask: "{{ netmask | default('255.255.255.0') }}"
    ks_gateway: "{{ gateway | default('') }}"
    ks_dns: "{{ dns_server | default('') }}"
    ks_network_device: "{{ network_device | default('') }}"
    ks_timezone: "{{ timezone | default('UTC') }}"
    ks_install_disk: "{{ install_disk | default('sda') }}"
    cacheable: true

- name: Log validated configuration summary
  ansible.builtin.debug:
    msg: >-
      OS Install config validated.
      Mode: build={{ _mode_build_iso }}, deploy={{ _mode_deploy }}, generate_ks={{ _mode_generate_ks }}.
      Arch: {{ os_arch | default('N/A') }}.
      Source ISO: {{ source_iso_path | default('N/A') }}.
      Custom ISO: {{ custom_iso_path | default('N/A') }}.
      KS delivery: {{ kickstart_delivery_method | default('embedded') }}.
      Target BMC: {{ target_bmc_ip | default('N/A') }}.
      SSH key: {{ ssh_public_key_path | default('N/A') }} (validated).
  when: not _mode_credentials_only
