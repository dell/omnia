---
# record.yml - append the published mapping to oci_ingest_results.
# Inputs: _oci_s3_prefix, _oci_rec_kernel_version, _oci_rec_artifacts, _oci_rec_published_at.

- name: Record the published mapping
  ansible.builtin.set_fact:
    oci_ingest_results: >-
      {{ oci_ingest_results + [{
           'functional_group': oci_ingest_mapping.functional_group,
           'arch': oci_ingest_pull.arch,
           'kernel': _oci_s3_prefix ~ '/vmlinuz-' ~ _oci_rec_kernel_version,
           'initrd': _oci_s3_prefix ~ '/initramfs-' ~ _oci_rec_kernel_version ~ '.img',
           'image': _oci_s3_prefix ~ '/rootfs.squashfs',
           'registry': oci_ingest_pull.registry,
           'repository': oci_ingest_pull.repository,
           'requested_reference': oci_ingest_pull.requested_reference,
           'digest': oci_ingest_pull.digest,
           'platform': oci_ingest_pull.platform,
           'kernel_version': _oci_rec_kernel_version,
           'published_at': _oci_rec_published_at,
           'artifacts': _oci_rec_artifacts }] }}
