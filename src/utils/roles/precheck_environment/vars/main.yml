# ============================================================================
# precheck_environment - Role Variables
# ============================================================================
# Hostname, domain, IP, and data path validation is handled by the
# validate_system_environment module (single source of truth).
# This file only defines precheck-specific vars and messages.

# System env file installed by omnia.sh --setup-venv
system_env_file: "/etc/omnia/omnia.env"
profile_drop_in: "/etc/profile.d/omnia-env.sh"

# Messages (only for checks NOT in the module)
precheck_omnia_env_not_installed_msg: >-
  omnia.env is not installed system-wide at {{ system_env_file }}.
  Run: ./omnia.sh --setup-venv
  This copies src/main/omnia.env to {{ system_env_file }}
  and creates {{ profile_drop_in }} for auto-loading.
