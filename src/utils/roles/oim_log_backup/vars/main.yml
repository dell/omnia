---
# OMNIA_DATA_PATH / OMNIA_PROJECT_NAME with fallback (same pattern as log_collector)
omnia_data_path: "{{ lookup('env', 'OMNIA_DATA_PATH') | default('/opt/omnia', true) }}"
project_name: "{{ lookup('env', 'OMNIA_PROJECT_NAME') | default('project_default', true) }}"

# Domain name for this role's own input/output paths
domain_name: "utils"

# Optional config file (domain selection + backup_path override)
backup_config_file: "{{ omnia_data_path }}/{{ domain_name }}/input/{{ project_name }}/backup_oim_logs_config.yml"

# Default backup workspace (used when no override is supplied)
backup_default_dir: "{{ omnia_data_path }}/{{ domain_name }}/output/{{ project_name }}/backup_oim_logs"

# Fixed local mountpoint used when a backup path resolves to an NFS export
backup_nfs_mountpoint: "/tmp/omnia_backup_oim_logs_nfs"  # nosec: B108 - fixed local mount, not a secret path

# All domains that ship a log/ directory under OMNIA_DATA_PATH
backup_all_domains:
  - repo_manager
  - image_build_manager
  - orchestrator
  - discovery
  - telemetry
  - build_stream
  - utils

# Exclusion patterns applied while building the archive (same defaults as log_collector)
backup_exclude_patterns:
  - "*.tmp"
  - "*.temp"
  - "*.bak"
