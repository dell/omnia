---

- name: Load role variables
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/main.yml"
  run_once: true

- name: Resolve backup path and prepare workspace
  ansible.builtin.include_tasks: setup.yml
  # "bundle" also runs setup itself so that --tags bundle works standalone
  # (path/NFS resolution has runtime side effects and cannot be a plain var).
  when: stage in ['setup', 'bundle']

- name: Archive domain logs and publish summary
  ansible.builtin.include_tasks: bundle.yml
  when: stage == 'bundle'
