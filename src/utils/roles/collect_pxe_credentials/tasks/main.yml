---
# collect_pxe_credentials — Self-contained credential flow for PXE boot.
# Handles: validate → create → prompt → encrypt
# Idempotent — skips if credentials are already loaded in this run.
#
# Naming Convention:
#   Role:     collect_pxe_credentials  (verb — what the role does: collects)
#   Data:     pxe_credentials.yml      (noun — the artifact)

- name: Skip credential flow if already loaded
  ansible.builtin.debug:
    msg: "PXE boot credentials already loaded — skipping."
  when: pxe_credentials_loaded | default(false) | bool

- name: PXE boot credential flow
  when: not (pxe_credentials_loaded | default(false) | bool)
  block:
    # Step 1: Validate existing credential file
    - name: Check if PXE credential file exists
      ansible.builtin.stat:
        path: "{{ pxe_credential_file.file_path }}"
      register: pxe_cred_file_stat

    - name: Check if vault key exists
      ansible.builtin.stat:
        path: "{{ pxe_credential_file.vault_path }}"
      register: pxe_vault_key_stat

    # Step 2: Create credential file from template if missing
    - name: Create credential file if missing
      when: not pxe_cred_file_stat.stat.exists
      block:
        - name: Ensure parent directory exists
          ansible.builtin.file:
            path: "{{ pxe_credential_file.file_path | dirname }}"
            state: directory
            mode: "0755"

        - name: Create credential file from template
          ansible.builtin.template:
            src: "{{ pxe_credential_file.template }}"
            dest: "{{ pxe_credential_file.file_path }}"
            mode: "{{ pxe_credential_file.file_mode }}"
          register: pxe_file_created

        - name: Create vault key file
          ansible.builtin.lineinfile:
            path: "{{ pxe_credential_file.vault_path }}"
            line: "{{ lookup('password', '/dev/null chars=ascii_letters length=32') }}"
            mode: "0600"
            owner: root
            create: true
          when: not pxe_vault_key_stat.stat.exists

        - name: Encrypt newly created credential file
          ansible.builtin.command: >-
            ansible-vault encrypt "{{ pxe_credential_file.file_path }}"
            --vault-password-file "{{ pxe_credential_file.vault_path }}"
          changed_when: false

    # Step 3: Create vault key if file exists but key is missing
    - name: Ensure vault key exists for existing credential file
      ansible.builtin.lineinfile:
        path: "{{ pxe_credential_file.vault_path }}"
        line: "{{ lookup('password', '/dev/null chars=ascii_letters length=32') }}"
        mode: "0600"
        owner: root
        create: true
      when:
        - pxe_cred_file_stat.stat.exists
        - not pxe_vault_key_stat.stat.exists

    # Step 4: Detect if credential file is vault-encrypted or plaintext
    - name: Check if credential file is vault-encrypted
      ansible.builtin.shell: |
        set -o pipefail
        head -n1 "{{ pxe_credential_file.file_path }}" | grep -q '^\$ANSIBLE_VAULT;'
      register: _is_vault_encrypted
      changed_when: false
      failed_when: false
      when:
        - pxe_cred_file_stat.stat.exists
        - pxe_vault_key_stat.stat.exists

    # Step 4a: File is vault-encrypted — decrypt, load, re-encrypt
    - name: Load vault-encrypted credentials
      when:
        - pxe_cred_file_stat.stat.exists
        - pxe_vault_key_stat.stat.exists
        - _is_vault_encrypted.rc | default(1) == 0
      block:
        - name: Decrypt credential file
          ansible.builtin.command: >-
            ansible-vault decrypt "{{ pxe_credential_file.file_path }}"
            --vault-password-file "{{ pxe_credential_file.vault_path }}"
          changed_when: false
          failed_when: false
          register: _cred_decrypt_result

        - name: Load credentials into namespaced variable
          ansible.builtin.include_vars:
            file: "{{ pxe_credential_file.file_path }}"
            name: pxe_loaded_creds
          no_log: true
          when: _cred_decrypt_result.rc | default(1) == 0

        - name: Re-encrypt credential file
          ansible.builtin.command: >-
            ansible-vault encrypt "{{ pxe_credential_file.file_path }}"
            --vault-password-file "{{ pxe_credential_file.vault_path }}"
          changed_when: false
          failed_when: false
          when: _cred_decrypt_result.rc | default(1) == 0

    # Step 4b: File is plaintext (left unencrypted from a prior failed run) — load and encrypt
    - name: Load plaintext credentials (recovery)
      when:
        - pxe_cred_file_stat.stat.exists
        - pxe_vault_key_stat.stat.exists
        - _is_vault_encrypted.rc | default(1) != 0
      block:
        - name: Load plaintext credentials into namespaced variable
          ansible.builtin.include_vars:
            file: "{{ pxe_credential_file.file_path }}"
            name: pxe_loaded_creds
          no_log: true

        - name: Encrypt plaintext credential file
          ansible.builtin.command: >-
            ansible-vault encrypt "{{ pxe_credential_file.file_path }}"
            --vault-password-file "{{ pxe_credential_file.vault_path }}"
          changed_when: false

        - name: Fix credential file permissions
          ansible.builtin.file:
            path: "{{ pxe_credential_file.file_path }}"
            mode: "{{ pxe_credential_file.file_mode }}"

    - name: Default pxe_loaded_creds if not loaded
      ansible.builtin.set_fact:
        pxe_loaded_creds: {}
      when: pxe_loaded_creds is not defined

    # Step 5: Prompt for mandatory credentials (only if value is empty)
    - name: Prompt for mandatory PXE boot credentials
      ansible.builtin.include_tasks: prompt_credential_field.yml
      loop: "{{ pxe_cred_config.mandatory }}"
      loop_control:
        loop_var: cred_field

    # Step 6: Expose credentials as facts for downstream roles
    - name: Reload final credentials
      when: pxe_credential_file.file_path is file
      block:
        - name: Check if final credential file is vault-encrypted
          ansible.builtin.shell: |
            set -o pipefail
            head -n1 "{{ pxe_credential_file.file_path }}" | grep -q '^\$ANSIBLE_VAULT;'
          register: _final_is_vault
          changed_when: false
          failed_when: false

        - name: Decrypt for final load
          ansible.builtin.command: >-
            ansible-vault decrypt "{{ pxe_credential_file.file_path }}"
            --vault-password-file "{{ pxe_credential_file.vault_path }}"
          changed_when: false
          failed_when: false
          register: _final_decrypt_result
          when: _final_is_vault.rc | default(1) == 0

        - name: Load final credentials
          ansible.builtin.include_vars:
            file: "{{ pxe_credential_file.file_path }}"
          no_log: true
          when: _final_decrypt_result.rc | default(0) == 0

        - name: Re-encrypt after final load
          ansible.builtin.command: >-
            ansible-vault encrypt "{{ pxe_credential_file.file_path }}"
            --vault-password-file "{{ pxe_credential_file.vault_path }}"
          changed_when: false
          failed_when: false

    # Step 7: Mark credentials as loaded to prevent re-prompting
    - name: Set credentials loaded guard
      ansible.builtin.set_fact:
        pxe_credentials_loaded: true
        cacheable: true
