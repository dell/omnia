---
# validate_registry_connection - Docker Registry V2 auth check, Harbor project check,
# then a session-scoped regctl config (0600, written directly because regctl login needs the
# username as an argument; removed by cleanup).

- name: Validate each registry used by the image mappings
  ansible.builtin.include_tasks: registry.yml
  loop: "{{ oci_ingest_config.registries }}"
  loop_control:
    loop_var: reg
    label: "{{ reg.registry_name }}"

- name: Write the session-scoped regctl config (0600, never on a command line)
  ansible.builtin.copy:
    content: "{{ {'hosts': oci_ingest_regctl_hosts} | to_nice_json }}"
    dest: "{{ oci_ingest_regctl_config }}"
    mode: "0600"
  no_log: true
