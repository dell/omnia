---
- name: Resolve registry addressing
  ansible.builtin.set_fact:
    _oci_base_url: "{{ reg.registry_protocol }}://{{ reg.registry_hostname }}:{{ reg.registry_port }}"
    _oci_host_ref: >-
      {{ reg.registry_hostname }}{{ '' if reg.registry_port == oci_ingest_default_ports[reg.registry_protocol] else ':' ~ reg.registry_port }}
    _oci_tls: "{{ oci_ingest_registry_tls }}"
    _oci_namespaces: >-
      {{ oci_ingest_config.image_mappings | selectattr('registry_name', 'equalto', reg.registry_name)
         | map(attribute='namespace_name') | unique | list }}

- name: Check registry endpoint and credentials (Docker Registry V2 API)
  ansible.builtin.uri:
    url: "{{ _oci_base_url }}/v2/"
    url_username: "{{ oci_ingest_credentials.registry_username }}"
    url_password: "{{ oci_ingest_credentials.registry_password }}"
    force_basic_auth: true
    validate_certs: "{{ _oci_tls == 'enabled' }}"
    timeout: "{{ oci_ingest_connect_timeout }}"
    status_code: [200, 401, 403]
  register: _oci_v2_check
  failed_when: false
  no_log: true

- name: Fail on TLS verification error
  ansible.builtin.fail:
    msg: "{{ tls_fail_msg }}"
  when: _oci_v2_check.status | default(-1) == -1 and (_oci_v2_check.msg | default('')) is search('(?i)certificate|ssl')

- name: Fail when the registry is unreachable
  ansible.builtin.fail:
    msg: "{{ connectivity_fail_msg }}"
  when: _oci_v2_check.status | default(-1) == -1

- name: Fail on authentication error
  ansible.builtin.fail:
    msg: "{{ auth_fail_msg }}"
  when: _oci_v2_check.status in [401, 403]

- name: Fail on unexpected status
  ansible.builtin.fail:
    msg: "{{ unexpected_fail_msg }}"
  when: _oci_v2_check.status != 200

- name: Check namespace (Harbor project) accessibility
  ansible.builtin.uri:
    url: "{{ _oci_base_url }}/api/v2.0/projects/{{ _oci_ns }}"
    url_username: "{{ oci_ingest_credentials.registry_username }}"
    url_password: "{{ oci_ingest_credentials.registry_password }}"
    force_basic_auth: true
    validate_certs: "{{ _oci_tls == 'enabled' }}"
    timeout: "{{ oci_ingest_connect_timeout }}"
    status_code: [200, 401, 403, 404]
  register: _oci_ns_check
  failed_when: _oci_ns_check.status != 200
  no_log: true
  loop: "{{ _oci_namespaces }}"
  loop_control:
    loop_var: _oci_ns
  ignore_errors: true

- name: Fail when a namespace is not accessible
  ansible.builtin.fail:
    msg: "{{ namespace_fail_msg }}"
  vars:
    _oci_bad_ns: "{{ _oci_ns_check.results | rejectattr('status', 'equalto', 200) | list }}"
    _oci_ns: "{{ _oci_bad_ns[0]._oci_ns }}"
    _oci_ns_status: "{{ _oci_bad_ns[0].status | default('n/a') }}"
  when: _oci_ns_check.results | rejectattr('status', 'equalto', 200) | list | length > 0

- name: Build the session regctl host entry
  ansible.builtin.set_fact:
    oci_ingest_regctl_hosts: >-
      {{ oci_ingest_regctl_hosts | default({}) | combine({
           (_oci_host_ref | trim): {
             'hostname': (_oci_host_ref | trim),
             'tls': _oci_tls,
             'user': oci_ingest_credentials.registry_username,
             'pass': oci_ingest_credentials.registry_password
           }}) }}
  no_log: true

- name: Log the validated registry
  oci_ingest_log:
    log_dir: "{{ oci_ingest_log_dir }}"
    message: >-
      registry validated: endpoint={{ _oci_host_ref | trim }} protocol={{ reg.registry_protocol }}
      namespaces={{ _oci_namespaces | join(',') }}

- name: Record the registry reference host
  ansible.builtin.set_fact:
    oci_ingest_registry_refs: "{{ oci_ingest_registry_refs | default({}) | combine({reg.registry_name: _oci_host_ref | trim}) }}"
