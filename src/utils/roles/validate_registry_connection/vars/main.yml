---
oci_ingest_default_ports:
  https: 443
  http: 80

connectivity_fail_msg: >-
  Registry connection failed (phase: connection): cannot reach {{ _oci_base_url }}
  within {{ oci_ingest_connect_timeout }} seconds. Check the hostname, port, protocol and network.
tls_fail_msg: >-
  Registry connection failed (phase: connection): TLS verification failed for {{ _oci_base_url }}.
  Trust the registry CA on the OIM, or set oci_ingest_registry_tls=insecure for a self-signed lab registry.
auth_fail_msg: >-
  Registry authentication failed (phase: connection) for registry '{{ reg.registry_name }}'.
  Check registry_username and registry_password in oci_image_ingest_credentials.yml.
namespace_fail_msg: >-
  Namespace '{{ _oci_ns }}' is inaccessible or does not exist on registry '{{ reg.registry_name }}'
  (phase: connection, HTTP {{ _oci_ns_status }}). No image will be pulled.
unexpected_fail_msg: >-
  Registry returned unexpected HTTP status {{ _oci_v2_check.status | default('n/a') }}
  (phase: connection) for registry '{{ reg.registry_name }}'.
