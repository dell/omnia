---
# oci_ingest_registry_tls: "enabled" uses the host CA trust. "insecure" skips certificate
# verification (self-signed lab registries only). http registries always use "disabled".
# The default is "insecure" for now because the Harbor CA is not trusted on the OIM; set it
# back to "enabled" once the CA is trusted (see feature notes).
oci_ingest_registry_tls: insecure
oci_ingest_connect_timeout: 30
