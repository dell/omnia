---

- name: Read PXE mapping file
  ansible.builtin.read_csv:
    path: "{{ pxe_mapping_file_path }}"
  register: pxe_mapping_data

- name: Find os_aarch64 node in PXE mapping
  ansible.builtin.set_fact:
    arm_node_entry: >-
      {{ pxe_mapping_data.list
         | selectattr('FUNCTIONAL_GROUP_NAME', 'search', 'os_aarch64')
         | list
         | first
         | default(
             pxe_mapping_data.list
             | selectattr('HOSTNAME', 'search', 'os_aarch64')
             | list
             | first
             | default(None)
           ) }}

- name: Fail if no os_aarch64 node found
  ansible.builtin.fail:
    msg: "{{ no_aarch64_node_msg }}"
  when: arm_node_entry is none or arm_node_entry | length == 0

- name: Read OIM SSH public key
  ansible.builtin.slurp:
    src: "{{ oim_ssh_key_path }}"
  register: oim_ssh_key_content

- name: Validate provision_password is set
  ansible.builtin.fail:
    msg: "{{ provision_password_not_set_msg }}"
  when: >
    provision_password is not defined or
    provision_password | length == 0

- name: Check if user provided nfs_share_path in iso_config.yml
  ansible.builtin.set_fact:
    user_nfs_share_path: "{{ iso_config.nfs_share_path | default('') }}"

- name: Validate user-provided nfs_share_path format
  ansible.builtin.fail:
    msg: "{{ invalid_nfs_share_path_msg }}"
  when:
    - user_nfs_share_path | length > 0
    - "':' not in user_nfs_share_path or user_nfs_share_path.split(':') | length != 2"

- name: Detect NFS mount backing OMNIA_DATA_PATH (fallback if not user-provided)
  ansible.builtin.set_fact:
    nfs_mount_result:
      stdout: >-
        {{ (
             ansible_mounts
             | selectattr(
               'mount', 'equalto',
               lookup('env', 'OMNIA_DATA_PATH') | default('/opt/omnia', true)
             )
             | list | first | default({})
           )['device'] | default('') }}
  changed_when: false
  when: user_nfs_share_path | length == 0

- name: Set install_os parameters for AArch64 node
  ansible.builtin.set_fact:
    # ISO parameters
    iso_source_path: "{{ iso_config.iso_source_path | default(default_iso_source_path) }}"
    iso_source_checksum: "{{ iso_config.iso_source_checksum | default('') }}"
    iso_target_directory: "{{ iso_config.iso_target_directory | default(default_iso_target_directory) }}"
    # Architecture
    os_arch: "{{ iso_config.os_arch | default('') }}"
    # Kickstart parameters
    kickstart_file: "{{ iso_config.kickstart_file | default('') }}"
    kickstart_template: "{{ iso_config.kickstart_template | default(default_kickstart_template) }}"
    ks_ssh_public_key: "{{ oim_ssh_key_content.content | b64decode | trim }}"
    ks_hostname: "{{ arm_node_entry.HOSTNAME | default('os-aarch64') }}"
    ks_static_ip: "{{ arm_node_entry.ADMIN_IP | default('') }}"
    ks_netmask: "{{ iso_config.netmask | default('255.255.255.0') }}"
    ks_gateway: "{{ iso_config.gateway | default('') }}"
    ks_dns: "{{ iso_config.dns | default('') }}"
    ks_network_device: "{{ iso_config.network_device | default(default_network_device) }}"
    ks_timezone: "{{ iso_config.timezone | default('UTC') }}"
    ks_install_disk: "{{ iso_config.install_disk | default('') }}"
    # iDRAC parameters
    target_bmc_ip: "{{ arm_node_entry.BMC_IP }}"
    target_node_ip: "{{ arm_node_entry.ADMIN_IP | default('') }}"
    force_reinstall: "{{ iso_config.force_reinstall | default(false) | bool }}"
    # NFS share path (server:/path) — user-provided or auto-detected from mount
    iso_nfs_share: "{{ user_nfs_share_path if user_nfs_share_path | length > 0 else nfs_mount_result.stdout | default('') }}"
    cacheable: true

- name: Fail if NFS share path not available
  ansible.builtin.fail:
    msg: "{{ nfs_share_not_available_msg }}"
  when: iso_nfs_share | length == 0

- name: Set remaining install_os parameters
  ansible.builtin.set_fact:
    # Exposure duration
    expose_duration: "{{ iso_config.expose_duration | default(1080) }}"
    # Interactive behavior
    silent_install: "{{ iso_config.silent_install | default(false) | bool }}"
    rebuild_iso: "{{ iso_config.rebuild_iso | default(false) | bool }}"
    cacheable: true

- name: Log fetched ARM parameters
  ansible.builtin.debug:
    msg: "{{ arm_params_fetched_msg }}"
