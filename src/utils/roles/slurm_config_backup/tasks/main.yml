---

- name: Resolve shared Slurm config facts
  ansible.builtin.include_role:
    name: slurm_config_common

- name: Set backup id
  ansible.builtin.set_fact:
    backup_timestamp: "{{ ansible_date_time.date | replace('-', '') }}-{{ ansible_date_time.time | replace(':', '') }}"

- name: Set backup name suffix
  ansible.builtin.set_fact:
    backup_name_suffix: >-
      {{ (backup_base_name_effective | length > 0) | ternary(backup_base_name_effective ~ '_' ~ backup_timestamp, backup_timestamp) }}

- name: Set backup run directory
  ansible.builtin.set_fact:
    backup_id: "{{ backup_name_suffix }}"
    backup_dir: "{{ slurm_backups_root_effective }}/{{ backup_name_suffix }}"

- name: Create backup config directories
  ansible.builtin.file:
    path: "{{ backup_dir }}/{{ slurm_controller_hostname }}/{{ item }}"
    state: directory
    mode: '0755'
  loop: "{{ slurm_config_directories_effective }}"

- name: Backup controller config directories
  ansible.builtin.command: >-
    cp -a "{{ slurm_config_path_effective }}/{{ slurm_controller_hostname }}/{{ item }}/."
    "{{ backup_dir }}/{{ slurm_controller_hostname }}/{{ item }}/"
  loop: "{{ slurm_config_directories_effective }}"
  changed_when: true
  failed_when: false

- name: Compute SHA256 checksums of backed-up files
  ansible.builtin.shell: >-
    set -o pipefail;
    find "{{ backup_dir }}/{{ slurm_controller_hostname }}" -type f -exec sha256sum {} \; | sort
  args:
    executable: /bin/bash
  register: backup_checksums
  changed_when: false
  failed_when: false

- name: Write backup metadata.json
  ansible.builtin.template:
    src: metadata.json.j2
    dest: "{{ backup_dir }}/metadata.json"
    mode: '0644'
  vars:
    backup_generated_at_utc: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
    backup_controller_hostname: "{{ slurm_controller_hostname }}"
    backup_source_path: "{{ slurm_config_path_effective }}/{{ slurm_controller_hostname }}"
    backup_location: "{{ backup_dir }}/{{ slurm_controller_hostname }}"
    backup_directories: "{{ slurm_config_directories_effective }}"
    backup_checksums_output: "{{ backup_checksums.stdout_lines | default([]) }}"

- name: Display backup location
  ansible.builtin.debug:
    msg: "Slurm config backup created at: {{ backup_dir }}/{{ slurm_controller_hostname }}"
