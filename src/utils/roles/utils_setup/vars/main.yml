# =============================================================================
# utils_setup — Role Variables (Error Messages)
# =============================================================================

# Environment validation error messages
env_omnia_data_path_missing_msg: >-
  OMNIA_DATA_PATH environment variable is not set.
  Run: omnia.sh --setup-venv

env_omnia_project_name_missing_msg: >-
  OMNIA_PROJECT_NAME environment variable is not set.
  Run: omnia.sh --setup-venv

env_system_hostname_missing_msg: >-
  SYSTEM_HOSTNAME environment variable is not set.
  Run: omnia.sh --setup-venv

# Directory validation error messages
input_dir_missing_msg: >-
  Input directory not found: {{ input_project_dir }}.
  Run: domain-init.sh or omnia.sh --init

output_dir_missing_msg: >-
  Output directory not found: {{ output_project_dir }}.
  Run: domain-init.sh or omnia.sh --init

# Disk space error messages
disk_space_insufficient_msg: >-
  Insufficient disk space at {{ omnia_data_path }}.
  Required: {{ min_disk_space_gb }} GB, Available: {{ available_space_gb }} GB
