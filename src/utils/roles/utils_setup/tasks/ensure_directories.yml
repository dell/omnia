---
# =============================================================================
# ensure_directories.yml — Ensure required directories exist
# =============================================================================

- name: Check input directory exists
  ansible.builtin.stat:
    path: "{{ input_project_dir }}"
  register: _input_dir_stat

- name: Warn if input directory missing
  ansible.builtin.debug:
    msg: |
      WARNING: Input directory not found: {{ input_project_dir }}
      Run: domain-init.sh or omnia.sh --init
  when: not _input_dir_stat.stat.exists

- name: Ensure output directory exists
  ansible.builtin.file:
    path: "{{ output_project_dir }}"
    state: directory
    mode: "0755"

- name: Ensure log directory exists
  ansible.builtin.file:
    path: "{{ log_dir }}"
    state: directory
    mode: "0755"

- name: Display directory status
  ansible.builtin.debug:
    msg: |
      Directory status:
        input_project_dir:  {{ 'exists' if _input_dir_stat.stat.exists else 'MISSING' }}
        output_project_dir: created/verified
        log_dir:            created/verified
    verbosity: 1
