---
# =============================================================================
# validate_environment.yml — Validate required environment variables
# =============================================================================

- name: Read OMNIA_DATA_PATH from environment
  ansible.builtin.set_fact:
    _env_omnia_data_path: "{{ lookup('env', 'OMNIA_DATA_PATH') }}"

- name: Validate OMNIA_DATA_PATH is set
  ansible.builtin.assert:
    that:
      - _env_omnia_data_path | length > 0
    fail_msg: "{{ env_omnia_data_path_missing_msg }}"
    quiet: true

- name: Read OMNIA_PROJECT_NAME from environment
  ansible.builtin.set_fact:
    _env_omnia_project_name: "{{ lookup('env', 'OMNIA_PROJECT_NAME') }}"

- name: Validate OMNIA_PROJECT_NAME is set
  ansible.builtin.assert:
    that:
      - _env_omnia_project_name | length > 0
    fail_msg: "{{ env_omnia_project_name_missing_msg }}"
    quiet: true

- name: Read SYSTEM_HOSTNAME from environment
  ansible.builtin.set_fact:
    _env_system_hostname: "{{ lookup('env', 'SYSTEM_HOSTNAME') }}"

- name: Validate SYSTEM_HOSTNAME is set
  ansible.builtin.assert:
    that:
      - _env_system_hostname | length > 0
    fail_msg: "{{ env_system_hostname_missing_msg }}"
    quiet: true

- name: Display environment validation results
  ansible.builtin.debug:
    msg: |
      Environment validation passed:
        OMNIA_DATA_PATH:    {{ _env_omnia_data_path }}
        OMNIA_PROJECT_NAME: {{ _env_omnia_project_name }}
        SYSTEM_HOSTNAME:    {{ _env_system_hostname }}
    verbosity: 1
