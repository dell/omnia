---
- name: Set utils domain ready fact
  ansible.builtin.set_fact:
    utils_domain_ready: true
    utils_setup_timestamp: "{{ ansible_date_time.iso8601 }}"
  changed_when: false

- name: Display setup completion message
  ansible.builtin.debug:
    msg: |
      Utils domain setup complete.
      - Ansible version: {{ ansible_version.full }}
      - Python version: {{ ansible_python_version }}
      - Available disk space: {{ available_disk_gb | default('unknown') }}GB
      - Setup timestamp: {{ utils_setup_timestamp }}
