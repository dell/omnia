---
# =============================================================================
# utils_setup — Main Entry Point
# =============================================================================
# This role runs first (tag: always) and handles:
#   1. Environment validation — check required env vars
#   2. Path derivation — derive input_project_dir, output_project_dir, log_dir
#   3. Directory creation — ensure output/log directories exist
#   4. Prerequisite checks — Ansible/Python versions
#   5. Guard facts — set utils_setup_done: true
# =============================================================================

- name: Load role variables
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/main.yml"

# Step 1: Validate environment variables
- name: Validate environment variables
  ansible.builtin.include_tasks: validate_environment.yml
  when: validate_environment | bool

# Step 2: Derive standard domain paths
- name: Derive domain paths
  ansible.builtin.include_tasks: derive_paths.yml

# Step 3: Ensure directories exist
- name: Ensure directories exist
  ansible.builtin.include_tasks: ensure_directories.yml

# Step 4: Validate prerequisites (Ansible/Python versions)
- name: Validate prerequisites
  ansible.builtin.include_tasks: validate_prerequisites.yml
  when: validate_prerequisites | bool

# Step 5: Validate disk space
- name: Validate disk space
  ansible.builtin.include_tasks: validate_disk_space.yml
  when: validate_disk_space | bool

# Step 6: Set guard facts
- name: Set guard facts
  ansible.builtin.include_tasks: set_guard_facts.yml
