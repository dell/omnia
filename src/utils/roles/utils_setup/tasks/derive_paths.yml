---
# =============================================================================
# derive_paths.yml — Derive standard domain paths from environment variables
# =============================================================================
# Following omnia-domain-repo-design.md Section 4:
#   input_project_dir  = {{ omnia_data_path }}/{{ domain_name }}/input/{{ project_name }}
#   output_project_dir = {{ omnia_data_path }}/{{ domain_name }}/output/{{ project_name }}
#   log_dir            = {{ omnia_data_path }}/{{ domain_name }}/log/{{ project_name }}
# =============================================================================

- name: Derive standard domain paths
  ansible.builtin.set_fact:
    # Base paths from environment
    omnia_data_path: "{{ lookup('env', 'OMNIA_DATA_PATH') | default('/opt/omnia', true) }}"
    project_name: "{{ lookup('env', 'OMNIA_PROJECT_NAME') | default('project_default', true) }}"
    host_name: "{{ lookup('env', 'SYSTEM_HOSTNAME') | default(ansible_hostname | default('localhost'), true) }}"
    cacheable: true

- name: Derive project-specific paths
  ansible.builtin.set_fact:
    # Shared path for domain
    shared_path: "{{ omnia_data_path }}/{{ domain_name }}"
    # Input directory (where user-edited config files live)
    input_project_dir: "{{ omnia_data_path }}/{{ domain_name }}/input/{{ project_name }}"
    # Output directory (where playbook writes results)
    output_project_dir: "{{ omnia_data_path }}/{{ domain_name }}/output/{{ project_name }}"
    # Log directory
    log_dir: "{{ omnia_data_path }}/{{ domain_name }}/log/{{ project_name }}"
    cacheable: true

- name: Display derived paths
  ansible.builtin.debug:
    msg: |
      Derived domain paths:
        omnia_data_path:    {{ omnia_data_path }}
        project_name:       {{ project_name }}
        domain_name:        {{ domain_name }}
        shared_path:        {{ shared_path }}
        input_project_dir:  {{ input_project_dir }}
        output_project_dir: {{ output_project_dir }}
        log_dir:            {{ log_dir }}
    verbosity: 1
