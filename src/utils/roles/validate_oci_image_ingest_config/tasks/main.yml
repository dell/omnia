---
# validate_oci_image_ingest_config - schema + semantic validation of the ingest input.
# Exposes oci_ingest_config (normalized registries and image_mappings) to later roles.

- name: Resolve oci_image_ingest_config.yml path
  ansible.builtin.set_fact:
    _oci_ingest_config_path: "{{ input_project_dir }}/{{ oci_ingest_config_filename }}"

- name: Check oci_image_ingest_config.yml exists
  ansible.builtin.stat:
    path: "{{ _oci_ingest_config_path }}"
  register: _oci_ingest_config_stat

- name: Fail if config file not found
  ansible.builtin.fail:
    msg: "{{ config_file_missing_msg }}"
  when: not _oci_ingest_config_stat.stat.exists

- name: Validate oci_image_ingest_config.yml
  validate_oci_image_ingest_config:
    config_path: "{{ _oci_ingest_config_path }}"
    schema_path: "{{ oci_ingest_schema_path }}"
  register: _oci_ingest_validation

- name: Expose validated configuration
  ansible.builtin.set_fact:
    oci_ingest_config: "{{ _oci_ingest_validation.config }}"
    cacheable: true
