---
- name: Initialize reboot status flags
  ansible.builtin.set_fact:
    reboot_failed: false
    reboot_status: ""

- name: Get LC status of iDRAC
  ansible.builtin.uri:
    url: "https://{{ inventory_hostname }}/redfish/v1/Managers/iDRAC.Embedded.1/Oem/Dell/DellLCService/Actions/DellLCService.GetRemoteServicesAPIStatus"
    user: "{{ hostvars['localhost']['bmc_username'] }}"
    password: "{{ hostvars['localhost']['bmc_password'] }}"
    method: POST
    force_basic_auth: true
    validate_certs: false
    return_content: true
    body_format: json
    body: {}
    timeout: 60
    headers:
      Accept: "application/json"
      Content-Type: "application/json"
      OData-Version: "4.0"
    status_code: [200, 201, 202]
  register: idrac_status
  until: idrac_status.status in [200, 201, 202]
  retries: 3
  delay: 5
  ignore_errors: true

- name: IDRAC ops when ready
  when:
    - idrac_status is success
    - idrac_status.json is defined
    - idrac_status.json.LCStatus | lower == "ready"
  module_defaults:
    dellemc.openmanage.redfish_powerstate:
      baseuri: "{{ inventory_hostname }}"
      username: "{{ hostvars['localhost']['bmc_username'] }}"
      password: "{{ hostvars['localhost']['bmc_password'] }}"
      validate_certs: false
      resource_id: "System.Embedded.1"
  block:
    - name: Set boot option from pxe
      dellemc.openmanage.idrac_boot:
        idrac_ip: "{{ inventory_hostname }}"
        idrac_user: "{{ hostvars['localhost']['bmc_username'] }}"
        idrac_password: "{{ hostvars['localhost']['bmc_password'] }}"
        validate_certs: false
        boot_source_override_mode: uefi
        boot_source_override_target: "{{ hostvars['localhost']['boot_source_override_target'] | default('pxe') }}"
        boot_source_override_enabled: "{{ hostvars['localhost']['boot_source_override_enabled'] | default('continuous') }}"
        reset_type: "none" # Dont Restart here as to Handle poweroff case
        resource_id: "System.Embedded.1"
      register: pxe_provisioning
      ignore_errors: true
      ignore_unreachable: true

    - name: Try ForceRestart
      dellemc.openmanage.redfish_powerstate:
        reset_type: "{{ 'ForceRestart' if (hostvars['localhost']['force_restart'] | default(true)) else 'GracefulRestart' }}"
      when: hostvars['localhost']['restart_host'] | default(true)
      register: restart_op
      failed_when: false

    - name: Try On if ForceRestart did not change
      dellemc.openmanage.redfish_powerstate:
        reset_type: "On"
      register: power_on_op
      failed_when: false
      when:
        - hostvars['localhost']['restart_host'] | default(true)
        - not (restart_op is changed)

- name: Check LC availibility
  ansible.builtin.set_fact:
    reboot_failed: true
    reboot_status: "{{ lc_check_fail_msg }}"
  when: idrac_status is failed or not (idrac_status.json.LCStatus | lower == "ready")

- name: Fail if PXE provisioning failed
  ansible.builtin.set_fact:
    reboot_failed: true
    reboot_status: "{{ pxe_provisioning_fail_msg }}"
  when:
    - not reboot_failed
    - pxe_provisioning is defined
    - pxe_provisioning is failed

- name: Fail if PXE provisioning target is unreachable
  ansible.builtin.set_fact:
    reboot_failed: true
    reboot_status: "{{ unreachable_idrac_msg }}"
  when:
    - not reboot_failed
    - pxe_provisioning is defined
    - pxe_provisioning is unreachable

- name: Fail if power operation failed
  ansible.builtin.set_fact:
    reboot_failed: true
    reboot_status: "Power operation failed on {{ inventory_hostname }}. Failed to restart server."
  when:
    - not reboot_failed
    - hostvars['localhost']['restart_host'] | default(true)
    - not (restart_op is defined and restart_op is changed)
    - not (power_on_op is defined and power_on_op is changed)

- name: Summarize PXE boot and power operation results
  ansible.builtin.set_fact:
    reboot_failed: false
    reboot_status: >-
      PXE Boot: {{ 'OK' if pxe_provisioning is success else ('UNREACHABLE' if pxe_provisioning is unreachable else 'FAILED') }} |
      Power: {{ 'Restart OK' if (restart_op is defined and restart_op is changed)
      else ('On OK' if (power_on_op is defined and power_on_op is changed)
      else ('Skipped (no restart)' if not (hostvars['localhost']['restart_host'] | default(true))
      else 'FAILED')) }}
  when: not reboot_failed
