---

- name: Resolve shared Slurm config facts
  ansible.builtin.include_role:
    name: slurm_config_common

- name: Prompt for pre-cleanup backup
  ansible.builtin.pause:
    prompt: "Before cleanup, take a config backup? (y/n)"
  register: pre_cleanup_backup
  when: pre_cleanup_backup_choice_input is not defined

- name: Set pre-cleanup backup choice
  ansible.builtin.set_fact:
    pre_cleanup_backup_choice: >-
      {{ (pre_cleanup_backup_choice_input | default(pre_cleanup_backup.user_input | default(''), true)) | trim | lower }}

- name: Fail if pre-cleanup backup choice is empty
  ansible.builtin.fail:
    msg: "No input provided for pre-cleanup backup prompt. Cleanup aborted."
  when: pre_cleanup_backup_choice | length == 0

- name: Validate pre-cleanup backup choice
  ansible.builtin.fail:
    msg: "Invalid input '{{ pre_cleanup_backup_choice }}'. Enter 'y' or 'n'."
  when: pre_cleanup_backup_choice not in ['y', 'yes', 'n', 'no']

- name: Run config backup before cleanup
  ansible.builtin.include_role:
    name: slurm_config_backup
  when: pre_cleanup_backup_choice in ['y', 'yes']

- name: Confirm cleanup
  ansible.builtin.pause:
    prompt: >-
      This will delete {{ slurm_config_path_effective }}. Type {{ slurm_cleanup_confirm_token_effective }} to continue
  register: cleanup_confirm
  when: cleanup_confirm_input is not defined

- name: Fail if cleanup not confirmed
  ansible.builtin.fail:
    msg: "Cleanup aborted"
  when: (cleanup_confirm_input | default(cleanup_confirm.user_input | default(''), true)) != slurm_cleanup_confirm_token_effective

- name: Delete slurm share directory
  ansible.builtin.file:
    path: "{{ slurm_config_path_effective }}"
    state: absent

- name: Display cleanup summary
  ansible.builtin.debug:
    msg: "Slurm config directory removed: {{ slurm_config_path_effective }}"
