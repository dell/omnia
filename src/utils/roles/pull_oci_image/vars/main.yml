---
oci_ingest_platforms:
  x86_64:
    platform: linux/amd64
    arch: amd64
  aarch64:
    platform: linux/arm64
    arch: arm64
oci_ingest_space_factor: 3

image_not_found_msg: >-
  Image '{{ _oci_ref }}' (namespace '{{ oci_ingest_mapping.namespace_name }}') was not found or is not
  accessible for platform {{ _oci_platform }} (phase: pull). Nothing was exported.
  regctl: {{ _oci_digest_result.stderr | default('') | trim | regex_replace('(?i)(pass|token)[^ ]*', '***') }}
arch_mismatch_msg: >-
  Architecture mismatch (phase: pull): functional group '{{ oci_ingest_mapping.functional_group }}' requires
  {{ _oci_arch }} but image '{{ _oci_ref }}' is {{ _oci_actual_arch | trim }}. Nothing was exported.
space_fail_msg: >-
  Insufficient free space (phase: pull) in {{ oci_ingest_workdir }}: required {{ _oci_required_bytes }} bytes
  ({{ oci_ingest_space_factor }}x the {{ _oci_layer_bytes }}-byte compressed layers), available
  {{ _oci_available_bytes }} bytes. No layer was pulled.
zstd_missing_msg: >-
  Image '{{ oci_ingest_pull.pinned }}' has zstd-compressed layers, but the zstd binary is not installed
  on the OIM (phase: pull). Install the zstd package, then retry. Nothing was exported.
