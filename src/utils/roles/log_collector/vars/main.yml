# =============================================================================
# log_collector — Role Variables
# =============================================================================
# Following omnia-domain-repo-design.md standard path structure.
# Paths are derived from environment variables by utils_setup role.
# =============================================================================

# -----------------------------------------------------------------------------
# Input File Names (relative to input_project_dir)
# -----------------------------------------------------------------------------
# Node inventory file (INI format with node groups)
collect_inventory_file: "collect.ini"

# Configuration file (YAML format)
collect_config_file: "collect_config.yml"

# -----------------------------------------------------------------------------
# Output Paths (relative to output_project_dir)
# -----------------------------------------------------------------------------
# Log collection output directory
collect_output_subdir: "collect"

# Bundle filename prefix (timestamp appended automatically)
bundle_prefix: "omnia_logs"

# Summary filename
summary_filename: "summary.txt"

# -----------------------------------------------------------------------------
# Default Log Paths (can be overridden in collect_config.yml)
# -----------------------------------------------------------------------------

# K8s control plane (master) log paths
k8s_master_log_dirs:
  - /var/log/containers/
  - /var/log/pods/
  - /var/log/calico/
  - /var/log/crio/
  - /var/log/chrony/
  - /var/log/private/
  - /var/log/rhsm/

k8s_master_log_files:
  - /var/log/cloud-init.log
  - /var/log/cloud-init-output.log
  - /var/log/dnf.log
  - /var/log/dnf.rpm.log
  - /var/log/dnf.librepo.log
  - /var/log/hawkey.log
  - /var/log/secure
  - /var/log/spooler

# K8s worker log paths
k8s_worker_log_dirs: []

k8s_worker_log_files:
  - /var/log/cloud-init.log
  - /var/log/cloud-init-output.log
  - /var/log/spooler
  - /var/log/messages
  - /var/log/cron
  - /var/log/secure
  - /var/log/maillog
  - /var/log/lastlog
  - /var/log/btmp

# Slurm controller log paths
slurm_ctl_log_dirs:
  - /var/log/slurm/
  - /var/log/rhsm/
  - /var/log/private/
  - /var/log/chrony/
  - /var/log/munge/
  - /var/log/insights-client/
  - /var/log/mariadb/

slurm_ctl_log_files:
  - /var/log/cloud-init.log
  - /var/log/cloud-init-output.log
  - /var/log/ldms-cloudinit.log

# Slurm node log paths
slurm_node_log_dirs:
  - /var/log/slurm/

slurm_node_log_files:
  - /var/log/cloud-init.log
  - /var/log/cloud-init-output.log

# Login node log paths
login_node_log_dirs:
  - /var/log/slurm/
  - /var/log/chrony/
  - /var/log/private/

login_node_log_files:
  - /var/log/cloud-init.log
  - /var/log/cloud-init-output.log
  - /var/log/secure
  - /var/log/messages

# Login compiler node log paths
login_compiler_log_dirs:
  - /var/log/slurm/
  - /var/log/chrony/
  - /var/log/private/

login_compiler_log_files:
  - /var/log/cloud-init.log
  - /var/log/cloud-init-output.log
  - /var/log/secure
  - /var/log/messages

# -----------------------------------------------------------------------------
# Curated Support Mode Exclusions
# -----------------------------------------------------------------------------
# Patterns to exclude when collection_mode == 'curated_support'
exclude_patterns:
  - "*.tmp"
  - "*.temp"
  - "*.bak"
  - "*.gz"
  - "*.bz2"
  - "*.1"
  - "*.2"
  - "*.3"
  - "*.4"
  - "*.5"

# -----------------------------------------------------------------------------
# Error Messages
# -----------------------------------------------------------------------------
collect_ini_missing_msg: >-
  Node inventory file not found: {{ input_project_dir }}/{{ collect_inventory_file }}.
  Create this file with node groups and IP addresses.
  Example:
    [slurm_control_node]
    172.16.1.50
    
    [slurm_node]
    172.16.1.60

collect_ini_empty_msg: >-
  Node inventory file is empty or has no valid sections.
  Add node groups with IP addresses to {{ input_project_dir }}/{{ collect_inventory_file }}.

collect_config_missing_msg: >-
  Configuration file not found: {{ input_project_dir }}/{{ collect_config_file }}.
  Run: domain-init.sh or omnia.sh --init
