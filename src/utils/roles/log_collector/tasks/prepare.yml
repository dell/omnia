---

- name: Check inventory file exists
  ansible.builtin.stat:
    path: "{{ collect_inventory_file }}"
  register: _inventory_stat

- name: Fail if inventory file missing
  ansible.builtin.fail:
    msg: >-
      Node inventory file not found: {{ collect_inventory_file }}.
      Create this file with node groups and IP addresses.
  when: not _inventory_stat.stat.exists

- name: Parse INI inventory file
  ansible.builtin.shell: |
    python3 << 'EOF'
    import configparser
    import json

    config = configparser.ConfigParser(allow_no_value=True)
    config.read('{{ collect_inventory_file }}')

    inventory = {}
    for section in config.sections():
        ips = [key.strip() for key in config[section].keys() if key.strip() and not key.strip().startswith('#')]
        inventory[section] = ips

    print(json.dumps(inventory))
    EOF
  register: _ini_parse_result
  changed_when: false

- name: Set parsed inventory
  ansible.builtin.set_fact:
    node_inventory: "{{ _ini_parse_result.stdout | from_json }}"

- name: Build k8s masters list
  ansible.builtin.set_fact:
    k8s_masters: "{{ node_inventory['k8s_control_node'] | default([]) }}"

- name: Build k8s workers list
  ansible.builtin.set_fact:
    k8s_workers: "{{ node_inventory['k8s_worker_node'] | default([]) }}"

- name: Build slurm controllers list
  ansible.builtin.set_fact:
    slurm_controllers: "{{ node_inventory['slurm_control_node'] | default([]) }}"

- name: Build slurm nodes list
  ansible.builtin.set_fact:
    slurm_nodes: "{{ node_inventory['slurm_node'] | default([]) }}"

- name: Build login nodes list
  ansible.builtin.set_fact:
    login_nodes: "{{ node_inventory['login_node'] | default([]) }}"

- name: Build login compiler nodes list
  ansible.builtin.set_fact:
    login_compiler_nodes: "{{ node_inventory['login_compiler_node'] | default([]) }}"

- name: Add dynamic hosts for k8s masters
  ansible.builtin.add_host:
    name: "k8s_master_{{ item | replace('.', '_') }}"
    ansible_host: "{{ item }}"
    groups: k8s_masters
  loop: "{{ k8s_masters }}"
  when: k8s_masters | length > 0

- name: Print all k8s_masters hostnames
  ansible.builtin.debug:
    msg: "K8s Masters Group - IP: {{ item }}"
  loop: "{{ k8s_masters }}"
  when: k8s_masters | length > 0

- name: Add dynamic hosts for k8s workers
  ansible.builtin.add_host:
    name: "k8s_worker_{{ item | replace('.', '_') }}"
    ansible_host: "{{ item }}"
    groups: k8s_workers
  loop: "{{ k8s_workers }}"
  when: k8s_workers | length > 0

- name: Add dynamic hosts for slurm controllers
  ansible.builtin.add_host:
    name: "slurm_ctl_{{ item | replace('.', '_') }}"
    ansible_host: "{{ item }}"
    groups: slurm_controllers
  loop: "{{ slurm_controllers }}"
  when: slurm_controllers | length > 0

- name: Print all slurm_controllers hostnames
  ansible.builtin.debug:
    msg: "Slurm Controllers Group - IP: {{ item }}"
  loop: "{{ slurm_controllers }}"
  when: slurm_controllers | length > 0

- name: Add dynamic hosts for slurm nodes
  ansible.builtin.add_host:
    name: "slurm_node_{{ item | replace('.', '_') }}"
    ansible_host: "{{ item }}"
    groups: slurm_nodes
  loop: "{{ slurm_nodes }}"
  when: slurm_nodes | length > 0

- name: Print all slurm_nodes hostnames
  ansible.builtin.debug:
    msg: "Slurm Nodes Group - IP: {{ item }}"
  loop: "{{ slurm_nodes }}"
  when: slurm_nodes | length > 0

- name: Add dynamic hosts for login nodes
  ansible.builtin.add_host:
    name: "login_{{ item | replace('.', '_') }}"
    ansible_host: "{{ item }}"
    groups: login_nodes
  loop: "{{ login_nodes }}"
  when: login_nodes | length > 0

- name: Print all login_nodes hostnames
  ansible.builtin.debug:
    msg: "Login Nodes Group - IP: {{ item }}"
  loop: "{{ login_nodes }}"
  when: login_nodes | length > 0

- name: Add dynamic hosts for login compiler nodes
  ansible.builtin.add_host:
    name: "login_compiler_{{ item | replace('.', '_') }}"
    ansible_host: "{{ item }}"
    groups: login_compiler_nodes
  loop: "{{ login_compiler_nodes }}"
  when: login_compiler_nodes | length > 0

- name: Print all login_compiler_nodes hostnames
  ansible.builtin.debug:
    msg: "Login Compiler Nodes Group - IP: {{ item }}"
  loop: "{{ login_compiler_nodes }}"
  when: login_compiler_nodes | length > 0

- name: Ensure log directories exist on OIM
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ log_root }}"
    - "{{ log_root }}/k8s"
    - "{{ log_root }}/slurm"
