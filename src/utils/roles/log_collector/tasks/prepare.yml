---
# =============================================================================
# prepare.yml - Parse node inventory and build dynamic host groups
# =============================================================================

- name: Check collect_pxe.yml exists
  ansible.builtin.stat:
    path: "{{ collect_pxe_file }}"
  register: _collect_pxe_stat

- name: Fail if collect_pxe.yml missing
  ansible.builtin.fail:
    msg: "{{ error_msg_inventory_file_missing }}"
  when: not _collect_pxe_stat.stat.exists

- name: Load node inventory from collect_pxe.yml
  ansible.builtin.include_vars:
    file: "{{ collect_pxe_file }}"
    name: collect_pxe_data

- name: Set node lists from YAML (functional groups with architecture, OS/version-agnostic)
  vars:
    _grouped: "{{ collect_pxe_data | default({}) | dict2items }}"
  ansible.builtin.set_fact:
    k8s_masters: "{{ _grouped | selectattr('key', 'match', k8s_masters_pattern) | map(attribute='value') | map('default', [], true) | flatten }}"
    k8s_workers: "{{ _grouped | selectattr('key', 'match', k8s_workers_pattern) | map(attribute='value') | map('default', [], true) | flatten }}"
    slurm_controllers: "{{ _grouped | selectattr('key', 'match', slurm_controllers_pattern) | map(attribute='value') | map('default', [], true) | flatten }}"
    slurm_nodes_x86: "{{ _grouped | selectattr('key', 'match', slurm_nodes_x86_pattern) | map(attribute='value') | map('default', [], true) | flatten }}"
    slurm_nodes_arm: "{{ _grouped | selectattr('key', 'match', slurm_nodes_arm_pattern) | map(attribute='value') | map('default', [], true) | flatten }}"
    login_nodes: "{{ _grouped | selectattr('key', 'match', login_nodes_pattern) | map(attribute='value') | map('default', [], true) | flatten }}"
    login_compiler_nodes_x86: >-
      {{ _grouped | selectattr('key', 'match', login_compiler_nodes_x86_pattern)
      | map(attribute='value') | map('default', [], true) | flatten }}
    login_compiler_nodes_arm: >-
      {{ _grouped | selectattr('key', 'match', login_compiler_nodes_arm_pattern)
      | map(attribute='value') | map('default', [], true) | flatten }}

- name: Combine slurm nodes from both architectures
  ansible.builtin.set_fact:
    slurm_nodes: "{{ (slurm_nodes_x86 | default([], true)) + (slurm_nodes_arm | default([], true)) }}"

- name: Combine login compiler nodes from both architectures
  ansible.builtin.set_fact:
    login_compiler_nodes: "{{ (login_compiler_nodes_x86 | default([], true)) + (login_compiler_nodes_arm | default([], true)) }}"

- name: Add dynamic hosts for k8s masters
  ansible.builtin.add_host:
    name: "k8s_master_{{ item | replace('.', '_') }}"
    ansible_host: "{{ item }}"
    groups: k8s_masters
  loop: "{{ k8s_masters }}"
  when: k8s_masters | length > 0

- name: Print all k8s_masters
  ansible.builtin.debug:
    msg: "K8s Masters Group - IP: {{ item }}"
  loop: "{{ k8s_masters }}"
  when: k8s_masters | length > 0

- name: Add dynamic hosts for k8s workers
  ansible.builtin.add_host:
    name: "k8s_worker_{{ item | replace('.', '_') }}"
    ansible_host: "{{ item }}"
    groups: k8s_workers
  loop: "{{ k8s_workers }}"
  when: k8s_workers | length > 0

- name: Print all k8s_workers
  ansible.builtin.debug:
    msg: "K8s Workers Group - IP: {{ item }}"
  loop: "{{ k8s_workers }}"
  when: k8s_workers | length > 0

- name: Add dynamic hosts for slurm controllers
  ansible.builtin.add_host:
    name: "slurm_ctl_{{ item | replace('.', '_') }}"
    ansible_host: "{{ item }}"
    groups: slurm_controllers
  loop: "{{ slurm_controllers }}"
  when: slurm_controllers | length > 0

- name: Print all slurm_controllers
  ansible.builtin.debug:
    msg: "Slurm Controllers Group - IP: {{ item }}"
  loop: "{{ slurm_controllers }}"
  when: slurm_controllers | length > 0

- name: Add dynamic hosts for slurm nodes
  ansible.builtin.add_host:
    name: "slurm_node_{{ item | replace('.', '_') }}"
    ansible_host: "{{ item }}"
    groups: slurm_nodes
  loop: "{{ slurm_nodes }}"
  when: slurm_nodes | length > 0

- name: Print all slurm_nodes
  ansible.builtin.debug:
    msg: "Slurm Nodes Group - IP: {{ item }}"
  loop: "{{ slurm_nodes }}"
  when: slurm_nodes | length > 0

- name: Add dynamic hosts for login nodes
  ansible.builtin.add_host:
    name: "login_{{ item | replace('.', '_') }}"
    ansible_host: "{{ item }}"
    groups: login_nodes
  loop: "{{ login_nodes }}"
  when: login_nodes | length > 0

- name: Print all login_nodes
  ansible.builtin.debug:
    msg: "Login Nodes Group - IP: {{ item }}"
  loop: "{{ login_nodes }}"
  when: login_nodes | length > 0

- name: Add dynamic hosts for login compiler nodes
  ansible.builtin.add_host:
    name: "login_compiler_{{ item | replace('.', '_') }}"
    ansible_host: "{{ item }}"
    groups: login_compiler_nodes
  loop: "{{ login_compiler_nodes }}"
  when: login_compiler_nodes | length > 0

- name: Print all login_compiler_nodes
  ansible.builtin.debug:
    msg: "Login Compiler Nodes Group - IP: {{ item }}"
  loop: "{{ login_compiler_nodes }}"
  when: login_compiler_nodes | length > 0

- name: Ensure log directories exist on OIM
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ log_root }}"
    - "{{ log_root }}/k8s"
    - "{{ log_root }}/slurm"
