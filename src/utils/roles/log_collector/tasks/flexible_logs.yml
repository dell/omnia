---

- name: Collect flexible functional group node logs
  when: stage == 'flexible_node'
  block:
    - name: Set target log directory for role prefix
      ansible.builtin.set_fact:
        _node_log_dest: "{{ hostvars['localhost'].log_root }}/{{ role_prefix }}/{{ inventory_hostname }}_{{ hostvars['localhost'].log_ts }}/"

    - name: Stat flexible node log directories
      ansible.builtin.stat:
        path: "{{ item }}"
      register: flexible_node_dir_stat
      with_items: "{{ hostvars['localhost'].flexible_node_log_dirs | default(flexible_node_log_dirs, true) }}"

    - name: Record missing flexible node log directories
      ansible.builtin.set_fact:
        missing_source_warnings_host: "{{ (missing_source_warnings_host | default([])) + [warning_payload] }}"
      vars:
        warning_payload:
          source: "{{ role_prefix }}"
          source_group: "{{ source_group }}"
          node_name: "{{ inventory_hostname }}"
          node_ip: "{{ ansible_host | default('unknown') }}"
          reason: missing_source
          message: >-
            {{
              'Expected log directory '
              + item.item
              + ' missing on node '
              + inventory_hostname
              + ' ('
              + (ansible_host | default('unknown'))
              + ') for '
              + source_group
              + '; continuing collection.'
            }}
          timestamp: "{{ '%Y-%m-%dT%H:%M:%S+05:30' | strftime((now().timestamp() | int) + 19800, utc=true) }}"
      loop: "{{ flexible_node_dir_stat.results }}"
      when: not (item.stat.isdir | default(false))

    - name: Find files under existing flexible node log directories
      ansible.builtin.find:
        paths: "{{ item.item }}"
        file_type: file
        recurse: true
      register: flexible_node_found_files
      when: item.stat.isdir | default(false)
      with_items: "{{ flexible_node_dir_stat.results }}"

    - name: Fetch files from flexible node log directories
      ansible.builtin.fetch:
        src: "{{ item }}"
        dest: "{{ _node_log_dest }}"
        flat: false
        validate_checksum: "{{ item | regex_search('(messages|secure|cron|maillog|spooler|btmp|lastlog)') | ternary(false, true) }}"
      loop: "{{ flexible_node_found_files.results | selectattr('files', 'defined') | map(attribute='files') | flatten | map(attribute='path') | list }}"
      when: flexible_node_found_files.results | selectattr('files', 'defined') | map(attribute='files') | flatten | length > 0

    - name: Stat flexible node log files
      ansible.builtin.stat:
        path: "{{ item }}"
      register: flexible_node_files
      with_items: "{{ hostvars['localhost'].flexible_node_log_files | default(flexible_node_log_files, true) }}"

    - name: Record missing flexible node log files
      ansible.builtin.set_fact:
        missing_source_warnings_host: "{{ (missing_source_warnings_host | default([])) + [warning_payload] }}"
      vars:
        warning_payload:
          source: "{{ role_prefix }}"
          source_group: "{{ source_group }}"
          node_name: "{{ inventory_hostname }}"
          node_ip: "{{ ansible_host | default('unknown') }}"
          reason: missing_source
          message: >-
            {{
              'Expected log file '
              + item.item
              + ' missing on node '
              + inventory_hostname
              + ' ('
              + (ansible_host | default('unknown'))
              + ') for '
              + source_group
              + '; continuing collection.'
            }}
          timestamp: "{{ '%Y-%m-%dT%H:%M:%S+05:30' | strftime((now().timestamp() | int) + 19800, utc=true) }}"
      loop: "{{ flexible_node_files.results }}"
      when: not (item.stat.isreg | default(false))

    - name: Fetch flexible node log files
      ansible.builtin.fetch:
        src: "{{ item.item }}"
        dest: "{{ _node_log_dest }}"
        flat: false
        validate_checksum: "{{ item.item | regex_search('(messages|secure|cron|maillog|spooler|btmp|lastlog)') | ternary(false, true) }}"
      when: item.stat.isreg | default(false)
      with_items: "{{ flexible_node_files.results }}"
