---

# Flexible functional-group (fg_) log collection (ER-ORCH-009).
# Each flexible node carries its group's resolved custom_log_paths as the host
# vars host_custom_log_dirs / host_custom_log_files (set at add_host time),
# falling back to the role defaults when a node declares none.

- name: Collect flexible functional-group logs
  when: stage == 'flexible'
  block:
    - name: Stat flexible custom log directories
      ansible.builtin.stat:
        path: "{{ item }}"
      register: flexible_dir_stat
      with_items: "{{ host_custom_log_dirs | default(flexible_log_dirs, true) }}"

    - name: Record missing flexible log directories
      ansible.builtin.set_fact:
        missing_source_warnings_host: "{{ (missing_source_warnings_host | default([])) + [warning_payload] }}"
      vars:
        warning_payload:
          source: flexible
          node_name: "{{ inventory_hostname }}"
          node_ip: "{{ ansible_host | default('unknown') }}"
          reason: missing_source
          message: >-
            {{
              'Expected log directory '
              + item.item
              + ' missing on node '
              + inventory_hostname
              + ' ('
              + (ansible_host | default('unknown'))
              + '); continuing collection.'
            }}
          timestamp: "{{ lookup('pipe', 'TZ=Asia/Kolkata date +%Y-%m-%dT%H:%M:%S+05:30') }}"
      loop: "{{ flexible_dir_stat.results }}"
      when: not (item.stat.isdir | default(false))

    - name: Find files under existing flexible log directories
      ansible.builtin.find:
        paths: "{{ item.item }}"
        file_type: file
        recurse: true
      register: flexible_found_files
      when: item.stat.isdir | default(false)
      with_items: "{{ flexible_dir_stat.results }}"

    - name: Fetch files from flexible log directories
      ansible.builtin.fetch:
        src: "{{ item }}"
        dest: "{{ hostvars['localhost'].log_root }}/flexible/{{ inventory_hostname }}_{{ hostvars['localhost'].log_ts }}/"
        flat: false
        validate_checksum: false
      loop: "{{ flexible_found_files.results | selectattr('files', 'defined') | map(attribute='files') | flatten | map(attribute='path') | list }}"
      when: flexible_found_files.results | selectattr('files', 'defined') | map(attribute='files') | flatten | length > 0

    - name: Stat flexible custom log files
      ansible.builtin.stat:
        path: "{{ item }}"
      register: flexible_files
      with_items: "{{ host_custom_log_files | default(flexible_log_files, true) }}"

    - name: Record missing flexible log files
      ansible.builtin.set_fact:
        missing_source_warnings_host: "{{ (missing_source_warnings_host | default([])) + [warning_payload] }}"
      vars:
        warning_payload:
          source: flexible
          node_name: "{{ inventory_hostname }}"
          node_ip: "{{ ansible_host | default('unknown') }}"
          reason: missing_source
          message: >-
            {{
              'Expected log file '
              + item.item
              + ' missing on node '
              + inventory_hostname
              + ' ('
              + (ansible_host | default('unknown'))
              + '); continuing collection.'
            }}
          timestamp: "{{ lookup('pipe', 'TZ=Asia/Kolkata date +%Y-%m-%dT%H:%M:%S+05:30') }}"
      loop: "{{ flexible_files.results }}"
      when: not (item.stat.isreg | default(false))

    - name: Fetch flexible log files
      ansible.builtin.fetch:
        src: "{{ item.item }}"
        dest: "{{ hostvars['localhost'].log_root }}/flexible/{{ inventory_hostname }}_{{ hostvars['localhost'].log_ts }}/"
        flat: false
        validate_checksum: false
      when: item.stat.isreg | default(false)
      with_items: "{{ flexible_files.results }}"
