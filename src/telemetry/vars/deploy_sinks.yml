# =============================================================================
# deploy_sinks playbook — variables
# =============================================================================

sink_deployment_summary_lines: |
  ======================================================
  Telemetry Sink Deployment Summary
  ======================================================
  Target Host (kube_vip): {{ kube_vip_host }}

  Kafka:            {{ kafka_status }}
  VictoriaMetrics:  {{ victoria_metrics_status }}
  VictoriaLogs:     {{ victoria_logs_status }}
  ======================================================

  Next steps:
  {% if kafka_status == 'DEPLOYED' or victoria_metrics_status == 'DEPLOYED' or victoria_logs_status == 'DEPLOYED' %}
  - Verify pods: kubectl get pods -n telemetry
  - Deploy telemetry sources: ansible-playbook playbooks/telemetry.yml --tags deploy
  {% endif %}
  {% if kafka_status == 'PENDING' or victoria_metrics_status == 'PENDING' or victoria_logs_status == 'PENDING' %}
  - Some sinks are still initializing. Check status:
    kubectl get pods -n telemetry -w
  {% endif %}
