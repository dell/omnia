---
# Standalone test: validates all 3 telemetry input files (L1 + L2)
- name: "TEST | Telemetry Input Validation (L1 schema + L2 logic)"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:

    - name: "Run L1 + L2 validation for telemetry input files"
      validate_input:
        omnia_base_dir: "{{ playbook_dir }}"
        project_name: "input"
        tag_names:
          - "telemetry"
        module_utils_path: "{{ playbook_dir }}/plugins/module_utils"
      register: validation_result
      ignore_errors: true

    - name: "Show full result"
      ansible.builtin.debug:
        var: validation_result

    - name: "REPORT — Passed files"
      ansible.builtin.debug:
        msg: "{{ validation_result.valid_files | default([]) }}"

    - name: "REPORT — Failed files"
      ansible.builtin.debug:
        msg: "{{ validation_result.invalid_files | default([]) }}"

    - name: "REPORT — Errors"
      ansible.builtin.debug:
        msg: "{{ validation_result.errors | default([]) }}"
