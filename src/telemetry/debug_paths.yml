---
- name: "Debug path resolution"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: "Show path variables"
      ansible.builtin.debug:
        msg:
          - "playbook_dir: {{ playbook_dir }}"
          - "playbook_dir | dirname: {{ playbook_dir | dirname }}"
          - "Expected module_utils path: {{ playbook_dir | dirname }}/plugins/module_utils"
          - "Expected schema path: {{ playbook_dir | dirname }}/plugins/module_utils/input_validation/schema"

    - name: "Check if schema file exists"
      ansible.builtin.stat:
        path: "{{ playbook_dir | dirname }}/plugins/module_utils/input_validation/schema/telemetry_config.json"
      register: schema_file

    - name: "Show schema file status"
      ansible.builtin.debug:
        msg:
          - "Schema file exists: {{ schema_file.stat.exists }}"
          - "Schema file path: {{ playbook_dir | dirname }}/plugins/module_utils/input_validation/schema/telemetry_config.json"
