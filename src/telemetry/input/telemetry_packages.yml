# =============================================================================
# Dell Omnia HPC Telemetry — Package Manifest
# =============================================================================
# Central package registry for ALL telemetry stack dependencies:
#   container images, Helm chart tarballs, git repositories, pip modules.
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │ DESIGN                                                                  │
# │                                                                         │
# │  install_mode ──┬── offline ──► repo_url + package catalog = full URLs  │
# │                 └── online  ──► upstream URLs from package catalog      │
# │                                                                         │
# │  Offline: all artifacts served from a single Pulp repository.           │
# │    Set repo_url once — every tarball, git repo, pip module URL is       │
# │    auto-derived as:                                                     │
# │      <repo_url>/<type>/<package_name>/<filename>                        │
# │                                                                         │
# │  Online: artifacts fetched from upstream registries / GitHub / PyPI.    │
# │    Each package entry includes its online_url for internet access.      │
# └─────────────────────────────────────────────────────────────────────────┘
#
# Usage:
#   Offline (air-gapped HPC cluster — DEFAULT):
#     install_mode: "offline"
#     repo_url: "https://192.168.13.111:2225/pulp/content/.../rhel/<os_version>"
#
#   Online (internet-connected):
#     install_mode: "online"
#     repo_url: ""   # not needed
# =============================================================================

# -----------------------------------------------------------------------------
# Installation Mode
# -----------------------------------------------------------------------------
# "offline" — All packages fetched from local Pulp mirror (default, air-gapped)
# "online"  — Packages fetched from upstream registries and URLs
install_mode: "offline"

# -----------------------------------------------------------------------------
# Offline Repository Base URL (Pulp)
# -----------------------------------------------------------------------------
# Single entry point for all offline packages. Set this ONCE and every
# Helm chart, git repo, and pip module URL is auto-derived.
#
# Format: https://<ip_or_hostname>:<port>/pulp/content/offline_repo/cluster/x86_64/rhel/<os_version>
#
# The hostname/IP can be an FQDN (e.g., oim.lab.example.com) or IP address.
# Default (when empty and install_mode is "offline"):
#   Auto-derived as https://<$SYSTEM_ADMIN_NIC_IPV4>:2225/pulp/content/offline_repo/cluster/x86_64/rhel/<os_version>
#   where <os_version> is detected from the orchestrator inventory group names (e.g., 10.0, 10.2)
# Leave empty when install_mode is "online" (not used).
repo_url: ""

# -----------------------------------------------------------------------------
# NFS Cluster Mount
# -----------------------------------------------------------------------------
# Local mount point on Kubernetes cluster nodes (already-mounted NFS share).
# Telemetry stages Helm charts and packages at: <k8s_cluster_mount>/telemetry/
# Default: /opt/omnia/k8s_mount (matches orchestrator k8s mount for service_kube group)
k8s_cluster_mount: "/opt/omnia/k8s_mount"

# -----------------------------------------------------------------------------
# NFS Slurm Mount
# -----------------------------------------------------------------------------
# Local mount point on Slurm cluster nodes (already-mounted NFS share).
# LDMS stores configuration and data at: <slurm_cluster_mount>/telemetry/ldms/
# Default: /share_omnia (matches orchestrator slurm mount for slurm/login groups)
slurm_cluster_mount: "/share_omnia"

# =============================================================================
# Container Images
# =============================================================================
# All container images referenced by telemetry K8s manifests.
# Images are grouped by subsystem for clarity.
#
# Digest Pinning (required):
#   Every image MUST be written as "<registry>/<repository>:<tag>@sha256:<digest>".
#   The tag is kept for readability; the container runtime pulls by digest, so a
#   moved or re-pushed tag cannot change what is deployed. Input validation rejects
#   images without an @sha256 digest.
#   The digest is the multi-arch manifest list / OCI index digest of the tag
#   (not a per-platform digest), so the same value works for every architecture
#   the image publishes. To look one up:
#     regctl image digest docker.io/victoriametrics/vmagent:v1.153.0
#     skopeo inspect --format '{{.Digest}}' docker://docker.io/victoriametrics/vmagent:v1.153.0
#   When you bump a tag, update its digest in the same change.
#
# Container Registry Override:
#   If your air-gapped cluster routes through a local registry mirror,
#   set container_registry to that host. All image references will be
#   prefixed with this host and the original digest is preserved
#   (e.g., "myregistry:5000/victoriametrics/vmagent:v1.153.0@sha256:4741...").
#   The mirror must hold the same manifest (Pulp container sync keeps upstream
#   digests). Leave empty to use the default registry in each image reference.
container_registry: ""

