# =============================================================================
# Dell Omnia HPC Telemetry — Package Manifest
# =============================================================================
# Central package registry for ALL telemetry stack dependencies:
#   container images, Helm chart tarballs, git repositories, pip modules.
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │ DESIGN                                                                  │
# │                                                                         │
# │  install_mode ──┬── offline ──► repo_url + package catalog = full URLs  │
# │                 └── online  ──► upstream URLs from package catalog      │
# │                                                                         │
# │  Offline: all artifacts served from a single Pulp repository.           │
# │    Set repo_url once — every tarball, git repo, pip module URL is       │
# │    auto-derived as:                                                     │
# │      <repo_url>/<type>/<package_name>/<filename>                        │
# │                                                                         │
# │  Online: artifacts fetched from upstream registries / GitHub / PyPI.    │
# │    Each package entry includes its online_url for internet access.      │
# └─────────────────────────────────────────────────────────────────────────┘
#
# Usage:
#   Offline (air-gapped HPC cluster — DEFAULT):
#     install_mode: "offline"
#     repo_url: "https://192.168.13.111:2225/pulp/content/.../rhel/10.0"
#
#   Online (internet-connected):
#     install_mode: "online"
#     repo_url: ""   # not needed
# =============================================================================

# -----------------------------------------------------------------------------
# Installation Mode
# -----------------------------------------------------------------------------
# "offline" — All packages fetched from local Pulp mirror (default, air-gapped)
# "online"  — Packages fetched from upstream registries and URLs
install_mode: "offline"

# -----------------------------------------------------------------------------
# Offline Repository Base URL (Pulp)
# -----------------------------------------------------------------------------
# Single entry point for all offline packages. Set this ONCE and every
# Helm chart, git repo, and pip module URL is auto-derived.
#
# Format: https://<ip_or_hostname>:<port>/pulp/content/opt/omnia/offline_repo/cluster/<arch>/<os>/<version>
#
# The hostname/IP can be an FQDN (e.g., oim.lab.example.com) or IP address.
# Leave empty when install_mode is "online".
repo_url: ""

# -----------------------------------------------------------------------------
# NFS Cluster Mount
# -----------------------------------------------------------------------------
# Local mount point on Kubernetes cluster nodes (already-mounted NFS share).
# Telemetry stages Helm charts and packages at: <cluster_mount>/telemetry/
cluster_mount: "/share_omnia_k8s"

# =============================================================================
# Container Images
# =============================================================================
# All container images referenced by telemetry K8s manifests.
# Images are grouped by subsystem for clarity.
#
# Container Registry Override:
#   If your air-gapped cluster routes through a local registry mirror,
#   set container_registry to that host. All image references will be
#   prefixed with this host (e.g., "myregistry:5000/victoriametrics/vmagent:v1.149.0").
#   Leave empty to use the default registry in each image reference.
container_registry: ""

images:
  # -- Sink: VictoriaMetrics --------------------------------------------------
  # Source: https://hub.docker.com/u/victoriametrics
  victoria_metrics:
    vmstorage: "docker.io/victoriametrics/vmstorage:v1.149.0-cluster"
    vmselect: "docker.io/victoriametrics/vmselect:v1.149.0-cluster"
    vminsert: "docker.io/victoriametrics/vminsert:v1.149.0-cluster"
    vmagent: "docker.io/victoriametrics/vmagent:v1.149.0"
    operator: "docker.io/victoriametrics/operator:v0.68.3"

  # -- Sink: VictoriaLogs -----------------------------------------------------
  # Source: https://hub.docker.com/u/victoriametrics
  victoria_logs:
    vlstorage: "docker.io/victoriametrics/victoria-logs:v1.50.0"
    vlselect: "docker.io/victoriametrics/victoria-logs:v1.50.0"
    vlinsert: "docker.io/victoriametrics/victoria-logs:v1.50.0"
    vlagent: "docker.io/victoriametrics/vlagent:v1.50.0"

  # -- Sink: Kafka (Strimzi) --------------------------------------------------
  # Source: https://quay.io/organization/strimzi
  kafka:
    broker: "quay.io/strimzi/kafka:1.1.0-kafka-4.3.0"
    bridge: "quay.io/strimzi/kafka-bridge:1.0.0"
    operator: "quay.io/strimzi/operator:1.1.0"

  # -- Source: iDRAC Telemetry ------------------------------------------------
  # Source: https://hub.docker.com/u/dellhpcomniaaisolution
  idrac:
    telemetry_receiver: "docker.io/dellhpcomniaaisolution/idrac_telemetry_receiver:1.3"
    kafka_pump: "docker.io/dellhpcomniaaisolution/kafkapump:1.3"
    victoria_pump: "docker.io/dellhpcomniaaisolution/victoriapump:1.3"
    activemq: "docker.io/apache/activemq:6.3.0"
    mysql: "docker.io/library/mysql:9.7.2"

  # -- Source: PowerScale (CSM Observability) ---------------------------------
  # Source: https://quay.io/organization/dell   https://github.com/dell/karavi-observability
  powerscale:
    csm_metrics: "quay.io/dell/container-storage-modules/csm-metrics-powerscale:v1.12.0"
    otel_collector: "ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector:0.150.1"
    csm_authorization_sidecar: "quay.io/dell/container-storage-modules/csm-authorization-sidecar:v2.5.0"
    cert_manager_controller: "quay.io/jetstack/cert-manager-controller:v1.10.0"
    cert_manager_cainjector: "quay.io/jetstack/cert-manager-cainjector:v1.10.0"
    cert_manager_webhook: "quay.io/jetstack/cert-manager-webhook:v1.10.0"
    nginx: "docker.io/nginxinc/nginx-unprivileged:1.29"
    python: "docker.io/library/python:3.12-slim"

  # -- Source: LDMS -----------------------------------------------------------
  # Source: https://hub.docker.com/r/dellhpcomniaaisolution/ubuntu-ldms
  ldms:
    sampler: "docker.io/dellhpcomniaaisolution/ubuntu-ldms:1.1"

  # -- Bridge: Vector (Kafka-to-Victoria pipelines) ---------------------------
  # Source: https://hub.docker.com/r/timberio/vector
  vector:
    vector: "docker.io/timberio/vector:0.54.0-debian"

  # -- Utility / Init Containers ----------------------------------------------
  support:
    busybox: "docker.io/library/busybox:1.36"
    kubectl: "docker.io/alpine/kubectl:1.35.1"
    curl: "docker.io/curlimages/curl:8.17.0"

# =============================================================================
# Helm Chart Tarballs
# =============================================================================
# Operator Helm charts required for sink infrastructure.
# Offline: auto-resolved as <repo_url>/tarball/<package>/<filename>
# Online:  downloaded from online_url
#
# Each entry has:
#   package    — Pulp directory name (matches repo_manager catalog)
#   filename   — archive file within that directory
#   online_url — upstream download URL for online mode
helm_charts:
  # Source: https://github.com/strimzi/strimzi-kafka-operator
  strimzi_kafka_operator:
    package: "strimzi-kafka-operator-helm-3-chart-1.1.0"
    filename: "strimzi-kafka-operator-helm-3-chart-1.1.0.tar.gz"
    online_url: "https://github.com/strimzi/strimzi-kafka-operator/releases/download/1.1.0/strimzi-kafka-operator-helm-3-chart-1.1.0.tgz"

  # Source: https://github.com/VictoriaMetrics/helm-charts
  victoria_metrics_operator:
    package: "victoria-metrics-operator-0.59.3"
    filename: "victoria-metrics-operator-0.59.3.tar.gz"
    online_url: "https://github.com/VictoriaMetrics/helm-charts/releases/download/victoria-metrics-operator-0.59.3/victoria-metrics-operator-0.59.3.tgz"

  # Source: https://charts.jetstack.io
  cert_manager:
    package: "cert-manager-v1.10.0"
    filename: "cert-manager-v1.10.0.tar.gz"
    online_url: "https://charts.jetstack.io/charts/cert-manager-v1.10.0.tgz"

# =============================================================================
# Git Repositories (archived as tarballs)
# =============================================================================
# Git repos used for PowerScale / CSM Observability deployment.
# Offline: auto-resolved as <repo_url>/git/<package>/<filename>
# Online:  cloned from online_url at the specified version tag
#
# Each entry has:
#   package    — Pulp directory name
#   filename   — archive file within that directory
#   online_url — upstream git clone URL
#   version    — tag or branch to checkout (online mode)
git_repos:
  # Source: https://github.com/dell/karavi-observability
  karavi_observability:
    package: "karavi-observability"
    filename: "karavi-observability.tar.gz"
    online_url: "https://github.com/dell/karavi-observability.git"
    version: "v1.15.0"

  # Source: https://github.com/dell/helm-charts
  helm_charts:
    package: "helm-charts"
    filename: "helm-charts.tar.gz"
    online_url: "https://github.com/dell/helm-charts.git"
    version: "container-storage-modules-1.10.0"

# =============================================================================
# Python Pip Modules
# =============================================================================
# Pip packages installed at runtime (CSI volume-exporter, PowerScale scripts).
# Offline: installed from <repo_url>/pip_module/<package>==<version>/
# Online:  installed from PyPI (https://pypi.org)
pip_modules:
  # Source: https://pypi.org/project/kubernetes/
  # Required for: CSI volume exporter, PowerScale telemetry
  kubernetes:
    version: "33.1.0"

  # Source: https://pypi.org/project/prometheus-client/
  # Required for: CSI volume exporter metrics export
  prometheus_client:
    version: "0.20.0"

  # Source: https://pypi.org/project/requests/
  # Required for: PowerScale API calls, HTTP requests
  requests:
    version: "2.32.3"

  # Source: https://pypi.org/project/urllib3/
  # Required for: HTTP connection pooling (dependency of requests)
  urllib3:
    version: "2.2.3"

  # Source: https://pypi.org/project/certifi/
  # Required for: SSL certificate verification
  certifi:
    version: "2024.8.30"

  # Source: https://pypi.org/project/charset-normalizer/
  # Required for: Character encoding detection (dependency of requests)
  charset_normalizer:
    version: "3.4.0"

  # Source: https://pypi.org/project/idna/
  # Required for: Internationalized domain names (dependency of requests)
  idna:
    version: "3.10"

  # Source: https://pypi.org/project/pyyaml/
  # Required for: YAML configuration parsing
  pyyaml:
    version: "6.0.2"

  # Source: https://pypi.org/project/python-dateutil/
  # Required for: Date/time parsing (dependency of kubernetes)
  python_dateutil:
    version: "2.9.0.post0"

  # Source: https://pypi.org/project/six/
  # Required for: Python 2/3 compatibility (dependency of python-dateutil)
  six:
    version: "1.17.0"

  # Source: https://pypi.org/project/oauthlib/
  # Required for: OAuth authentication (dependency of kubernetes)
  oauthlib:
    version: "3.2.2"

  # Source: https://pypi.org/project/requests-oauthlib/
  # Required for: OAuth for requests (dependency of kubernetes)
  requests_oauthlib:
    version: "2.0.0"

  # Source: https://pypi.org/project/websocket-client/
  # Required for: WebSocket connections (dependency of kubernetes)
  websocket_client:
    version: "1.8.0"

  # Source: https://pypi.org/project/google-auth/
  # Required for: Google authentication (dependency of kubernetes)
  google_auth:
    version: "2.36.0"

  # Source: https://pypi.org/project/cachetools/
  # Required for: Caching utilities (dependency of google-auth)
  cachetools:
    version: "5.5.0"

  # Source: https://pypi.org/project/pyasn1/
  # Required for: ASN.1 parsing (dependency of google-auth)
  pyasn1:
    version: "0.6.1"

  # Source: https://pypi.org/project/pyasn1-modules/
  # Required for: ASN.1 modules (dependency of google-auth)
  pyasn1_modules:
    version: "0.4.1"

  # Source: https://pypi.org/project/rsa/
  # Required for: RSA encryption (dependency of google-auth)
  rsa:
    version: "4.9"
