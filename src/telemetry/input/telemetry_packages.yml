# =============================================================================
# Helm Chart Tarballs
# =============================================================================
# Operator Helm charts required for sink infrastructure.
# Offline: auto-resolved as <repo_url>/tarball/<package>/<filename>
# Online:  downloaded from online_url
#
# Each entry has:
#   package    — Pulp directory name (matches repo_manager catalog)
#   filename   — archive file within that directory
#   online_url — upstream download URL for online mode
helm_charts:
  # Source: https://github.com/strimzi/strimzi-kafka-operator
  strimzi_kafka_operator:
    package: "strimzi-kafka-operator-helm-3-chart-1.2.0"
    filename: "strimzi-kafka-operator-helm-3-chart-1.2.0.tar.gz"
    online_url: "https://github.com/strimzi/strimzi-kafka-operator/releases/download/1.2.0/strimzi-kafka-operator-helm-3-chart-1.2.0.tgz"

  # Source: https://github.com/VictoriaMetrics/helm-charts
  victoria_metrics_operator:
    package: "victoria-metrics-operator-0.68.1"
    filename: "victoria-metrics-operator-0.68.1.tar.gz"
    online_url: "https://github.com/VictoriaMetrics/helm-charts/releases/download/victoria-metrics-operator-0.68.1/victoria-metrics-operator-0.68.1.tgz"

  # Source: https://charts.jetstack.io
  cert_manager:
    package: "cert-manager-v1.10.0"
    filename: "cert-manager-v1.10.0.tar.gz"
    online_url: "https://charts.jetstack.io/charts/cert-manager-v1.10.0.tgz"

# =============================================================================
# Git Repositories (archived as tarballs)
# =============================================================================
# Git repos used for PowerScale / CSM Observability deployment.
# Offline: auto-resolved as <repo_url>/git/<package>/<filename>
# Online:  cloned from online_url at the specified version tag
#
# Each entry has:
#   package    — Pulp directory name
#   filename   — archive file within that directory
#   online_url — upstream git clone URL
#   version    — tag or branch to checkout (online mode)
git_repos:
  # Source: https://github.com/dell/karavi-observability
  karavi_observability:
    package: "karavi-observability"
    filename: "karavi-observability.tar.gz"
    online_url: "https://github.com/dell/karavi-observability.git"
    version: "v1.16.0"

  # Source: https://github.com/dell/helm-charts
  helm_charts:
    package: "helm-charts"
    filename: "helm-charts.tar.gz"
    online_url: "https://github.com/dell/helm-charts.git"
    version: "container-storage-modules-1.11.0"

# =============================================================================
# Python Pip Modules
# =============================================================================
# Pip packages installed at runtime for telemetry components.
# Offline: installed from <repo_url>/pip_module/<package>==<version>/
# Online:  installed from PyPI (https://pypi.org)
#
# Structure:
#   pip_modules:
#     <component_name>:
#       <package_name>: <version>
#       <package_name>: <version>
#       ...
#
# Available components:
#   - idrac: iDRAC telemetry (MySQL operations via kubernetes module)
#   - powerscale: PowerScale / CSI volume exporter (K8s API + PowerScale API)
# =============================================================================
pip_modules:
  # iDRAC telemetry
  # Required for: MySQL operations via kubernetes module
  idrac:
    kubernetes: "37.0.1"
    pymysql: "1.2.3"
    cryptography: "50.0.2"

  # PowerScale / CSI volume exporter
  # Required for: K8s API interaction, PowerScale API calls, metrics export
  powerscale:
    # K8s API client
    kubernetes: "37.0.1"
    # K8s dependencies
    python_dateutil: "2.9.0.post0"
    six: "1.17.0"
    oauthlib: "3.2.2"
    requests_oauthlib: "2.0.0"
    websocket_client: "1.8.0"
    google_auth: "2.36.0"
    cachetools: "5.5.0"
    pyasn1: "0.6.1"
    pyasn1_modules: "0.4.1"
    rsa: "4.9"
    # PowerScale API
    requests: "2.32.3"
    urllib3: "2.2.3"
    certifi: "2024.8.30"
    charset_normalizer: "3.4.0"
    idna: "3.10"
    # Metrics export
    prometheus_client: "0.26.0"
    # YAML parsing
    pyyaml: "6.0.2"
