# ============================================================================
# TELEMETRY REGISTRY CONFIGURATION
# ============================================================================
# Container registry for telemetry images.
# If telemetry uses a different registry than the cluster-wide configuration,
# specify it here. Otherwise, leave empty to use cluster-wide registry.
#
# Fields:
#   host       : Registry IP and port in format "IP:port"
#   cert_path  : Path to SSL certificate file (.crt) - Required only if HTTPS
#   key_path   : Path to SSL private key file (.key) - Required only if HTTPS
#   username   : Registry username (if authentication required)

telemetry_registry:
  host: ""
  cert_path: ""
  key_path: ""
  username: "admin"
  images:
    # VictoriaMetrics and VictoriaLogs
    victoria:
      # VictoriaMetrics cluster components (use -cluster suffix)
      vmstorage: "victoriametrics/vmstorage:v1.149.0-cluster"
      vmselect: "victoriametrics/vmselect:v1.149.0-cluster"
      vminsert: "victoriametrics/vminsert:v1.149.0-cluster"
      # VMAgent (standalone version)
      vmagent: "victoriametrics/vmagent:v1.149.0"
      # VictoriaLogs components (cluster mode uses victoria-logs binary)
      vlstorage: "victoriametrics/victoria-logs:v1.50.0"
      vlselect: "victoriametrics/victoria-logs:v1.50.0"
      vlinsert: "victoriametrics/victoria-logs:v1.50.0"
      vlagent: "victoriametrics/vlagent:v1.50.0"
    # Support images for telemetry deployments
    support:
      busybox: "docker.io/library/busybox:1.36"
      kubectl: "docker.io/alpine/kubectl:1.35.1"
      curl: "docker.io/curlimages/curl:8.17.0"
    # Kafka/Strimzi images
    kafka:
      kafka: "strimzi/kafka:1.1.0-kafka-4.3.0"
      kafka_bridge: "strimzi/kafka-bridge:1.0.0"
      operator: "strimzi/operator:1.1.0"
    # VictoriaMetrics operator
    victoria_operator:
      operator: "victoriametrics/operator:v0.68.3"
    # iDRAC telemetry images
    idrac:
      telemetry_receiver: "docker.io/dellhpcomniaaisolution/idrac_telemetry_receiver:1.3"
      kafka_pump: "docker.io/dellhpcomniaaisolution/kafkapump:1.3"
      victoria_pump: "docker.io/dellhpcomniaaisolution/victoriapump:1.3"
    # PowerScale telemetry images
    powerscale:
      python: "docker.io/library/python:3.12-slim"

# ============================================================================
# TELEMETRY PACKAGES (Full Pulp / HTTP URLs)
# ============================================================================
# Full download URLs for telemetry Helm chart tarballs and pip modules.
# These URLs are used to download packages to the cluster_mount NFS share.
# Container images are pulled separately from telemetry_registry above.
#
# Provide complete URL including the .tar.gz filename.
#

telemetry_packages:
  # Helm chart tarballs (required for operator deployment)
  strimzi_kafka_operator: ""
  victoria_metrics_operator: ""

  # Cert-manager Helm chart (required for PowerScale TLS)
  cert_manager_tarball: ""

  # Karavi/PowerScale offline git repos
  karavi_observability_git: ""
  karavi_helm_charts_git: ""

  # --------------------------------------------------------------------------
  # Pulp offline base paths (same structure as local_repo_access.yml)
  # --------------------------------------------------------------------------
  # Used by templates for offline pip install, tarball downloads, and git clones.
  # Format: https://<pulp_ip>:<port>/pulp/content/opt/omnia/offline_repo/cluster/<arch>/<os>/<ver>/<type>
  offline_tarball_path: ""
  offline_pip_module_path: ""
  offline_git_path: ""

# ============================================================================
# TELEMETRY PACKAGES MOUNT CONFIGURATION
# ============================================================================
# Local mount point path where on kubernetes clsuter.
# This should be an already-mounted NFS share.
# A 'telemetry' subdirectory will be created here for package storage.
#
# Example: /opt/omnia/k8s_mount (existing NFS mount from storage_config.yml)
#
# Packages will be stored at: <cluster_mount>/telemetry/<package_name>
# For example: /opt/omnia/nfs/telemetry/strimzi-kafka-operator-1.0.1.tar.gz

cluster_mount: "/share_omnia_k8s"
