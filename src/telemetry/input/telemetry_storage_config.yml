# ==============================================================================
# TELEMETRY STORAGE CONFIGURATION
# ==============================================================================
# This file defines storage configuration for telemetry components.
# Storage sizes and resource limits for VictoriaMetrics, VictoriaLogs, Kafka,
# and iDRAC telemetry MySQL database.

# ------------------------------------------------------------------------------
# iDRAC Telemetry Storage Configuration
# ------------------------------------------------------------------------------
idrac_telemetry_storage:
  mysqldb:
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
  activemq:
    resources:
      requests:
        cpu: "100m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "1.5Gi"
  receiver:
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"
  kafka_pump:
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "200m"
        memory: "512Mi"
  victoria_pump:
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "200m"
        memory: "512Mi"

# ------------------------------------------------------------------------------
# Vector Storage Configuration
# ------------------------------------------------------------------------------
vector_storage:
  ldms:
    replicas: 2
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
