# =============================================================================
# deploy_powerscale — Orchestrator
# =============================================================================
# Consolidated role for enabling or disabling PowerScale telemetry.
# Auto-determines state from telemetry_config.yml:
#   telemetry_sources.powerscale.metrics_enabled OR
#   telemetry_sources.powerscale.logs_enabled
# =============================================================================

- name: Load telemetry configuration
  ansible.builtin.include_role:
    name: common
    tasks_from: load_telemetry_config
  when: telemetry_config is not defined

- name: Determine PowerScale telemetry state from config
  ansible.builtin.set_fact:
    powerscale_enabled: >-
      {{
        (telemetry_config.telemetry_sources.powerscale.metrics_enabled | default(false) | bool)
        or
        (telemetry_config.telemetry_sources.powerscale.logs_enabled | default(false) | bool)
      }}
  when: telemetry_config is defined

- name: Enable PowerScale telemetry
  ansible.builtin.include_tasks: enable.yml
  when: powerscale_enabled | default(false) | bool

- name: Disable PowerScale telemetry
  ansible.builtin.include_tasks: disable.yml
  when: not (powerscale_enabled | default(false) | bool)
