---

# =============================================================================
# Update telemetry_status.yml with PowerScale deployment result
# =============================================================================

- name: Set namespace for status checks
  ansible.builtin.set_fact:
    csm_observability_namespace: "{{ csm_namespace }}"

- name: Check if karavi-metrics-powerscale deployment exists
  ansible.builtin.command: >
    kubectl get deployment {{ karavi_observability.metrics_deployment }} -n {{ csm_observability_namespace }} -o jsonpath='{.spec.replicas}'
  register: karavi_replicas_check
  changed_when: false
  failed_when: false

- name: Check if karavi-metrics-powerscale pods are running
  ansible.builtin.command: >
    kubectl get pods -n {{ csm_observability_namespace }} -l app.kubernetes.io/name=karavi-observability -o jsonpath='{.items[*].status.phase}'
  register: karavi_pods_check
  changed_when: false
  failed_when: false

- name: Determine PowerScale metrics deployment status
  ansible.builtin.set_fact:
    _ps_metrics_status: >-
      {% set deployment_exists = karavi_replicas_check.rc == 0 %}
      {% set replicas = karavi_replicas_check.stdout | int if deployment_exists else 0 %}
      {% set pods_running = karavi_pods_check.rc == 0 and 'Running' in karavi_pods_check.stdout %}
      {% if powerscale_enabled | default(false) | bool %}
        {% if deployment_exists and replicas > 0 and pods_running %}deployed{% else %}failed{% endif %}
      {% else %}
        {% if deployment_exists and replicas == 0 %}disabled{% else %}skipped{% endif %}
      {% endif %}

- name: Set PowerScale deployment result on localhost
  ansible.builtin.add_host:
    name: localhost
    _deploy_result_powerscale_metrics: "{{ _ps_metrics_status | trim }}"

- name: Set PowerScale logs deployment result on localhost
  ansible.builtin.add_host:
    name: localhost
    _deploy_result_powerscale_logs: "disabled"
