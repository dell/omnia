---

# Deploys karavi-observability Helm chart (CSM Metrics PowerScale + OTEL Collector)
# This was previously done in cloud-init (telemetry.sh.j2); now runs directly via Ansible.

# --- Apply cert-manager CRDs before Helm install ---

- name: Check if cert-manager CRDs file exists
  ansible.builtin.stat:
    path: "{{ karavi_helm_chart_path }}/crds/cert-manager.crds.yaml"
  register: _cert_manager_crds

- name: Apply cert-manager CRDs
  ansible.builtin.command: >
    kubectl apply --validate=false -f {{ karavi_helm_chart_path }}/crds/cert-manager.crds.yaml
  when: _cert_manager_crds.stat.exists | default(false)
  changed_when: false
  failed_when: false

# --- Copy isilon-creds secret to telemetry namespace ---

- name: Check if isilon-creds exists in isilon namespace
  ansible.builtin.command: kubectl get secret isilon-creds -n isilon -o name
  register: _isilon_creds_check
  changed_when: false
  failed_when: false

- name: Copy isilon-creds secret to telemetry namespace  # noqa: risky-shell-pipe
  ansible.builtin.shell: |
    kubectl delete secret isilon-creds -n {{ csm_observability_namespace | quote }} --ignore-not-found=true 2>/dev/null
    kubectl get secret isilon-creds -n isilon -o json \
      | jq 'del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.annotations,.metadata.managedFields)' \
      | jq ".metadata.namespace = \"{{ csm_observability_namespace | quote }}\"" \
      | kubectl create -f -
  when: _isilon_creds_check.rc == 0
  changed_when: false
  failed_when: false

# --- Copy Karavi Authorization resources if enabled ---

- name: Copy Karavi Authorization resources (Mode B)  # noqa: risky-shell-pipe
  ansible.builtin.shell: |
    kubectl get configmap isilon-config-params -n isilon -o yaml \
      | sed "s/namespace: isilon/namespace: {{ csm_observability_namespace | quote }}/" \
      | kubectl apply -f - 2>/dev/null || true
    kubectl get secret proxy-server-root-certificate proxy-authz-tokens -n isilon -o yaml \
      | sed "s/namespace: isilon/namespace: {{ csm_observability_namespace | quote }}/" \
      | sed 's/name: proxy-server-root-certificate/name: isilon-proxy-server-root-certificate/' \
      | sed 's/name: proxy-authz-tokens/name: isilon-proxy-authz-tokens/' \
      | kubectl apply -f - 2>/dev/null || true
  when: karavi_enabled | bool
  changed_when: false
  failed_when: false

# --- Helm install/upgrade karavi-observability ---

- name: Check if karavi-observability Helm release exists  # noqa: risky-shell-pipe
  ansible.builtin.shell: >
    helm list -n {{ csm_observability_namespace | quote }} --filter karavi-observability -q 2>/dev/null | grep -q karavi-observability
  register: _karavi_helm_check
  changed_when: false
  failed_when: false

- name: Set Helm values file path on NFS
  ansible.builtin.set_fact:
    _helm_values_nfs: "{{ telemetry_deploy_dir }}/karavi-observability/csm_metrics_values.yaml"
    _cert_manager_resources_override: "{{ telemetry_deploy_dir }}/karavi-observability/cert-manager-resources.yaml"

- name: Remove cert-manager-readiness-check hook from Helm chart
  ansible.builtin.file:
    path: "{{ karavi_helm_chart_path }}/templates/cert-manager-readiness-check.yaml"
    state: absent
  # The hook runs a kubectl Job during helm install/upgrade that races against
  # cert-manager pod rollouts. On upgrade, the hook times out waiting for pods
  # that are still restarting, causing the entire helm upgrade to fail after 10m.
  # We replace it with an Ansible-managed readiness check after helm completes.
  # NOTE: This file will reappear if the Helm chart is updated. Ensure it is
  # removed again after chart updates.

- name: Remove cert-manager post-install hook from Helm chart
  ansible.builtin.file:
    path: "{{ karavi_helm_chart_path }}/templates/cert-manager.yaml"
    state: absent
  # The post-install hook attempts to call the cert-manager webhook on port 443,
  # but the webhook actually listens on port 10250. This causes "connection refused"
  # errors during helm install/upgrade. Since cert-manager is already deployed and
  # fully functional as part of the Helm chart, this hook is redundant and can be
  # safely removed without affecting functionality.
  # NOTE: This file will reappear if the Helm chart is updated. Ensure it is
  # removed again after chart updates.

- name: Verify cert-manager hooks were removed
  ansible.builtin.stat:
    path: "{{ item }}"
  register: _hook_check
  failed_when: _hook_check.stat.exists
  with_items:
    - "{{ karavi_helm_chart_path }}/templates/cert-manager-readiness-check.yaml"
    - "{{ karavi_helm_chart_path }}/templates/cert-manager.yaml"
  changed_when: false

- name: Write cert-manager resource limits override
  ansible.builtin.copy:
    dest: "{{ _cert_manager_resources_override }}"
    mode: "0644"
    content: |
      cert-manager:
        resources:
          requests:
            memory: "{{ telemetry_storage_config.cert_manager_storage.controller.resources.requests.memory }}"
            cpu: "{{ telemetry_storage_config.cert_manager_storage.controller.resources.requests.cpu }}"
          limits:
            memory: "{{ telemetry_storage_config.cert_manager_storage.controller.resources.limits.memory }}"
            cpu: "{{ telemetry_storage_config.cert_manager_storage.controller.resources.limits.cpu }}"
        webhook:
          resources:
            requests:
              memory: "{{ telemetry_storage_config.cert_manager_storage.webhook.resources.requests.memory }}"
              cpu: "{{ telemetry_storage_config.cert_manager_storage.webhook.resources.requests.cpu }}"
            limits:
              memory: "{{ telemetry_storage_config.cert_manager_storage.webhook.resources.limits.memory }}"
              cpu: "{{ telemetry_storage_config.cert_manager_storage.webhook.resources.limits.cpu }}"
        cainjector:
          resources:
            requests:
              memory: "{{ telemetry_storage_config.cert_manager_storage.cainjector.resources.requests.memory }}"
              cpu: "{{ telemetry_storage_config.cert_manager_storage.cainjector.resources.requests.cpu }}"
            limits:
              memory: "{{ telemetry_storage_config.cert_manager_storage.cainjector.resources.limits.memory }}"
              cpu: "{{ telemetry_storage_config.cert_manager_storage.cainjector.resources.limits.cpu }}"

- name: Upgrade existing karavi-observability release
  ansible.builtin.command: >
    helm upgrade karavi-observability {{ karavi_helm_chart_path }}
    -n {{ csm_observability_namespace }}
    -f {{ _helm_values_nfs }}
    -f {{ _cert_manager_resources_override }}
    --timeout 10m
  when: _karavi_helm_check.rc == 0
  register: _helm_upgrade
  changed_when: "'has been upgraded' in (_helm_upgrade.stdout | default(''))"

- name: Install karavi-observability Helm chart
  ansible.builtin.command: >
    helm install karavi-observability {{ karavi_helm_chart_path }}
    -n {{ csm_observability_namespace }}
    -f {{ _helm_values_nfs }}
    -f {{ _cert_manager_resources_override }}
    --timeout 10m
  when: _karavi_helm_check.rc != 0
  register: _helm_install
  changed_when: "'deployed' in (_helm_install.stdout | default(''))"

# --- Post-install: Set resource limits on pods deployed with resources: {} ---
# The Helm chart hardcodes resources: {} for otel-collector, nginx-proxy, and
# karavi-metrics-powerscale. Without limits these pods get BestEffort QoS and
# are OOMKilled first under node memory pressure, cascading into CrashLoopBackOff.

- name: Patch otel-collector deployment with resource limits
  ansible.builtin.command: >
    kubectl patch deployment otel-collector -n {{ csm_observability_namespace }}
    --type=json
    -p='[
      {
        "op":"replace",
        "path":"/spec/template/spec/containers/0/resources",
        "value":{
          "requests":{
            "memory":"{{ telemetry_storage_config.otel_collector_storage.nginx_proxy.resources.requests.memory }}",
            "cpu":"{{ telemetry_storage_config.otel_collector_storage.nginx_proxy.resources.requests.cpu }}"
          },
          "limits":{
            "memory":"{{ telemetry_storage_config.otel_collector_storage.nginx_proxy.resources.limits.memory }}",
            "cpu":"{{ telemetry_storage_config.otel_collector_storage.nginx_proxy.resources.limits.cpu }}"
          }
        }
      },
      {
        "op":"replace",
        "path":"/spec/template/spec/containers/1/resources",
        "value":{
          "requests":{
            "memory":"{{ telemetry_storage_config.otel_collector_storage.otel_collector.resources.requests.memory }}",
            "cpu":"{{ telemetry_storage_config.otel_collector_storage.otel_collector.resources.requests.cpu }}"
          },
          "limits":{
            "memory":"{{ telemetry_storage_config.otel_collector_storage.otel_collector.resources.limits.memory }}",
            "cpu":"{{ telemetry_storage_config.otel_collector_storage.otel_collector.resources.limits.cpu }}"
          }
        }
      }
    ]'
  changed_when: false
  failed_when: false

- name: Patch karavi-metrics-powerscale deployment with resource limits
  ansible.builtin.command: >
    kubectl patch deployment karavi-metrics-powerscale -n {{ csm_observability_namespace }}
    --type=json
    -p='[
      {
        "op":"replace",
        "path":"/spec/template/spec/containers/0/resources",
        "value":{
          "requests":{
            "memory":"{{ telemetry_storage_config.csm_metrics_powerscale_storage.requests.memory }}",
            "cpu":"{{ telemetry_storage_config.csm_metrics_powerscale_storage.requests.cpu }}"
          },
          "limits":{
            "memory":"{{ telemetry_storage_config.csm_metrics_powerscale_storage.limits.memory }}",
            "cpu":"{{ telemetry_storage_config.csm_metrics_powerscale_storage.limits.cpu }}"
          }
        }
      }
    ]'
  changed_when: false
  failed_when: false

# --- Post-install: Patch OTEL Collector ---

- name: Patch OTEL Collector service for Prometheus metrics port
  ansible.builtin.command: >
    kubectl patch svc otel-collector -n {{ csm_observability_namespace }}
    --patch '{"spec":{"ports":[{"name":"prometheus","port":8889,"targetPort":8889,"protocol":"TCP"}]}}'
  changed_when: false
  failed_when: false

- name: Add labels to OTEL Collector service for vmagent discovery
  ansible.builtin.command: >
    kubectl label svc otel-collector -n {{ csm_observability_namespace }}
    app.kubernetes.io/name=otel-collector app.kubernetes.io/component=collector --overwrite
  changed_when: false
  failed_when: false

# --- Create OTEL Collector PVC for persistent buffering ---

- name: Check if OTEL Collector PVC exists
  ansible.builtin.command: >
    kubectl get pvc otel-collector-data -n {{ csm_observability_namespace }} -o name
  register: _otel_pvc_check
  changed_when: false
  failed_when: false

- name: Create OTEL Collector PVC  # noqa: risky-shell-pipe
  ansible.builtin.shell: |
    cat <<EOF | kubectl apply -f -
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: otel-collector-data
      namespace: {{ csm_observability_namespace }}
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/instance: karavi-observability
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: {{ telemetry_config.powerscale_configurations.otel_collector_storage_size | default('5Gi') }}
    EOF
  when: _otel_pvc_check.rc != 0
  changed_when: true

- name: Patch OTEL Collector deployment with persistent volume
  ansible.builtin.command: >
    kubectl patch deployment otel-collector -n {{ csm_observability_namespace }}
    --type=json
    -p='[
      {
        "op":"add",
        "path":"/spec/template/spec/volumes/-",
        "value":{
          "name":"otel-collector-data",
          "persistentVolumeClaim":{
            "claimName":"otel-collector-data"
          }
        }
      },
      {
        "op":"add",
        "path":"/spec/template/spec/containers/0/volumeMounts/-",
        "value":{
          "name":"otel-collector-data",
          "mountPath":"/data"
        }
      }
    ]'
  changed_when: false
  failed_when: false

- name: Wait for cert-manager deployments to be available
  ansible.builtin.command: >
    kubectl wait --for=condition=Available
    deployment/karavi-observability-cert-manager
    deployment/karavi-observability-cert-manager-cainjector
    deployment/karavi-observability-cert-manager-webhook
    -n {{ csm_observability_namespace }} --timeout=300s
  changed_when: false
  failed_when: false

- name: Wait for cert-manager webhook caBundle to be populated
  ansible.builtin.shell:
    cmd: |
      for i in $(seq 1 30); do
        CA_BUNDLE=$(kubectl get mutatingwebhookconfiguration \
          karavi-observability-cert-manager-webhook \
          -o jsonpath='{.webhooks[0].clientConfig.caBundle}' 2>/dev/null)
        if [ -n "$CA_BUNDLE" ]; then
          echo "caBundle populated on attempt $i"
          exit 0
        fi
        sleep 5
      done
      echo "WARNING: caBundle not populated after 150s - continuing anyway"
      exit 0
    executable: /bin/bash
  changed_when: false
  failed_when: false

- name: Wait for OTEL Collector rollout
  ansible.builtin.command: >
    kubectl rollout status deployment/otel-collector -n {{ csm_observability_namespace }} --timeout=120s
  changed_when: false
  failed_when: false

- name: Display karavi-observability deployment status
  ansible.builtin.debug:
    msg: "PowerScale telemetry (CSM Observability + OTEL Collector) deployed successfully"
