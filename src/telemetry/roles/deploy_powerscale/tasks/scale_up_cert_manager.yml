# =============================================================================
# Scale up cert-manager if at 0 replicas (deployed by Helm chart)
# =============================================================================

- name: Check if karavi-observability-cert-manager deployment exists
  ansible.builtin.command: >
    kubectl get deployment karavi-observability-cert-manager -n {{ csm_observability_namespace }} -o jsonpath='{.spec.replicas}'
  register: cert_manager_replicas_check
  changed_when: false
  failed_when: false
  when: powerscale_enabled | bool

- name: Scale up karavi-observability-cert-manager if at 0 replicas
  ansible.builtin.command: >
    kubectl scale deployment karavi-observability-cert-manager -n {{ csm_observability_namespace }} --replicas=1
  register: cert_manager_scaleup_result
  changed_when: "'scaled' in cert_manager_scaleup_result.stdout or cert_manager_scaleup_result.rc == 0"
  when:
    - powerscale_enabled | bool
    - cert_manager_replicas_check.rc == 0
    - cert_manager_replicas_check.stdout == "0"

