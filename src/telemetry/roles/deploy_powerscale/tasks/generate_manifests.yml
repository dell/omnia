---

# Generate PowerScale telemetry manifests to NFS deployments/ (root level)

- name: Render CSI Volume Exporter manifest
  ansible.builtin.template:
    src: "csi-volume-exporter.yaml.j2"
    dest: "{{ telemetry_deployments_dir }}/csi-volume-exporter.yaml"
    mode: '0644'

- name: Apply CSI Volume Exporter manifest
  ansible.builtin.command: >
    kubectl apply -f {{ telemetry_deployments_dir }}/csi-volume-exporter.yaml
  changed_when: false

- name: Display PowerScale manifest generation complete
  ansible.builtin.debug:
    msg: "PowerScale telemetry manifests generated and applied"
    verbosity: 2
