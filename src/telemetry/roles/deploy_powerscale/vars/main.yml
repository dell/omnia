---

# =============================================================================
# PowerScale Telemetry Role Variables
# =============================================================================

# Deploy directory on NFS share
telemetry_deploy_dir: "{{ k8s_cluster_mount }}/telemetry"
telemetry_deployments_dir: "{{ telemetry_deploy_dir }}/deployments"

# Internal namespace constants (not user-configurable)
csm_namespace: "telemetry"

# Offline pip paths for air-gapped CSI volume exporter deployment
# Read from telemetry_packages_config (populated from telemetry_packages.yml)
# pip install falls back to online if the offline path is unreachable
offline_pip_module_path: "{{ telemetry_packages_config.offline_pip_module_path | default('') }}"
pulp_server_ip: "{{ telemetry_packages_config.offline_pip_module_path | default('') | urlsplit('hostname') | default('localhost') }}"

# Karavi Observability offline installer variables
karavi_observability_git: "karavi-observability.tar.gz"
karavi_helm_charts_git: "helm-charts.tar.gz"
karavi_helm_chart_path: "{{ telemetry_deploy_dir }}/karavi-observability/helm-charts/charts/karavi-observability"

# CSM Metrics PowerScale resource limits
csm_metrics_powerscale_resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

# File permissions
file_permissions_644: "0644"

# Validation messages
ps_helm_values_path_missing_msg: >-
  csm_observability_values_file_path is required in telemetry_config.yml when telemetry_sources.powerscale.metrics_enabled is true.
  Provide the path to your customized karavi-observability Helm values file.

ps_helm_values_file_not_found_msg: >-
  Helm values file not found at '{{ ps_helm_values_file | default('') }}'.
  Please create a values file following the Dell CSM Observability documentation
  and set the path in telemetry_config.yml (csm_observability_values_file_path).

ps_helm_values_parse_fail_msg: >-
  Failed to parse Helm values file at '{{ ps_helm_values_file | default('') }}'.
  Please verify the file contains valid YAML.

ps_cert_manager_disabled_msg: >-
  cert-manager must be enabled in the CSM Observability Helm values file.
  Set 'cert-manager.enabled: true' in {{ ps_helm_values_file | default('') }}.
  cert-manager is required for automatic TLS certificate management (otel-collector-tls secret).

ps_auth_mode_direct_msg: "PowerScale telemetry authentication mode: Direct Authentication (Mode A)"
ps_auth_mode_karavi_msg: "PowerScale telemetry authentication mode: Karavi Authorization (Mode B)"

ps_clusters_found_msg: "PowerScale clusters detected in CSM Observability configuration"

ps_telemetry_prepared_msg: >-
  PowerScale telemetry files prepared on NFS share.
  Proceeding with karavi-observability Helm deployment.

ps_health_monitor_not_running_msg: >-
  WARNING: external-health-monitor-controller container is not running in the isilon-controller pod.
  CSI volume exporter requires this container to be running to collect health metrics.
  Please deploy CSI driver with health monitor enabled in CSI driver values.yml.
  After deploying CSI driver with health monitor enabled, run telemetry.yml again.
  Skipping CSI volume exporter deployment.

ps_isilon_pod_not_found_msg: >-
  WARNING: Could not find isilon-controller pod to verify external-health-monitor-controller status.
  CSI volume exporter requires this container to be running to collect health metrics.
  Please deploy CSI driver with health monitor enabled in CSI driver values.yml.
  After deploying CSI driver with health monitor enabled, run telemetry.yml again.
  Skipping CSI volume exporter deployment.

# PowerScale privilege check messages
ps_privilege_check_success_msg: "PowerScale privilege check passed. User has all required privileges."
ps_privilege_check_skipped_msg: "PowerScale privilege check skipped (PowerScale not accessible or credentials not available)."
ps_metrics_privilege_warning_msg: "PowerScale user is missing required privileges for metrics collection."
ps_log_privilege_warning_msg: "PowerScale user is missing required privileges for log collection (syslog configuration)."

# CSI Volume Exporter Configuration
# ============================================================================
# Usage: csi-volume-exporter.yaml.j2
# Deployed when telemetry_sources.powerscale.metrics_enabled: true
# Exposes PowerScale PersistentVolume status as Prometheus metrics
csi_volume_exporter:
  app_name: "csi-volume-exporter"
  service_name: "csi-volume-exporter"
  service_account_name: "csi-volume-exporter"
  cluster_role_name: "csi-volume-exporter"
  cluster_role_binding_name: "csi-volume-exporter"
  image: "{{ telemetry_registry.images.powerscale.python | default('quay.io/prometheus/python-exporter:latest') }}"
  metrics_port: 9090
  scrape_interval: "30s"
  scrape_interval_seconds: 30
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"
