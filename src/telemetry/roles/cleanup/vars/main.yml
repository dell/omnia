---

# =============================================================================
# Cleanup role variables — all component resource definitions
# =============================================================================

# --- Shared cleanup settings ---
telemetry_namespace: "telemetry"
# Preserve persistent telemetry data unless the user explicitly requests deletion.
# Both -e delete_volume=true and -e Delete_volume=true are accepted.
_cleanup_delete_volume_enabled: >-
  {{
    (hostvars['localhost'] | default({}))['_cleanup_delete_volume']
    | default(Delete_volume | default(delete_volume | default(false)))
    | bool
  }}
cleanup_resource_grace_period: 0
cleanup_post_delete_pause: 5
cleanup_helm_timeout: "5m"
cleanup_custom_resource_retries: 60
cleanup_custom_resource_delay: 5
telemetry_deployments_dir: "{{ k8s_cluster_mount | default('/opt/omnia/k8s_mount') }}/telemetry/deployments"

# =============================================================================
# Kafka cleanup resources
# =============================================================================
cleanup_kafka_wait_timeout: "300s"

kafka_bridge_resources:
  - { type: "kafkabridge", name: "bridge" }
  - { type: "service", name: "bridge-bridge-service" }
  - { type: "service", name: "bridge-bridge-lb" }
  - { type: "deployment", name: "bridge-bridge" }

kafka_user_resources:
  - { type: "kafkauser", name: "kafkapump" }

kafka_cluster_resources:
  - { type: "kafka", name: "kafka" }

kafka_nodepool_resources:
  - { type: "kafkanodepool", name: "broker" }
  - { type: "kafkanodepool", name: "controller" }

kafka_secret_resources:
  - "kafka-cluster-ca-cert"
  - "kafka-cluster-ca"
  - "kafka-clients-ca"
  - "kafkapump"
  - "kafka-secrets"
  - "kafka-cluster-id"

kafka_configmap_resources:
  - "kafka-tls-test-script"

kafka_job_resources:
  - "kafka-tls-test"

kafka_strimzi_helm_secret: "sh.helm.release.v1.strimzi-cluster-operator.v1"
kafka_strimzi_helm_secret_label: "owner=helm,name=strimzi-cluster-operator"

kafka_service_resources:
  - "kafka-kafka-bootstrap"
  - "kafka-kafka-brokers"
  - "kafka-kafka-controllers"

kafka_topic_label: "strimzi.io/cluster=kafka"
kafka_pvc_label: "strimzi.io/cluster=kafka"
kafka_secret_label: "strimzi.io/cluster=kafka"
kafka_pod_labels:
  - "strimzi.io/cluster=kafka"
  - "app.kubernetes.io/name=kafka-bridge"
  - "app=kafka-tls-test"

# =============================================================================
# VictoriaMetrics cleanup resources
# =============================================================================
victoria_metrics:
  crd_resources:
    - { type: "vmcluster", name: "victoria-cluster" }
    - { type: "vmagent", name: "vmagent" }
    - { type: "vmservicescrape", name: "otel-collector-powerscale-scrape" }
    - { type: "vmservicescrape", name: "otel-collector-powerscale" }
    - { type: "vmservicescrape", name: "csi-volume-exporter" }
    - { type: "vmservicescrape", name: "ufm-infiniband-metrics" }
    - { type: "vmservicescrape", name: "vast-storage-metrics" }
  crd_all_resources:
    - "vmagent"
    - "vmpodscrape"
    - "vmservicescrape"
    - "vmsingle"
  cluster_resources:
    - { type: "deployment", name: "vmselect-victoria-cluster" }
    - { type: "deployment", name: "vminsert-victoria-cluster" }
    - { type: "statefulset", name: "vmstorage-victoria-cluster" }
    - { type: "service", name: "vmselect-victoria-cluster" }
    - { type: "service", name: "vminsert-victoria-cluster" }
    - { type: "service", name: "vmstorage-victoria-cluster" }
    - { type: "service", name: "vmagent-victoria-cluster" }
  single_resources:
    - { type: "statefulset", name: "victoria-metric" }
    - { type: "service", name: "victoria-loadbalancer" }
    - { type: "service", name: "victoria-metric" }
  agent_resources:
    - { type: "deployment", name: "vmagent" }
    - { type: "service", name: "vmagent" }
  shared_resources:
    - { type: "configmap", name: "vmagent-config" }
    - { type: "configmap", name: "vmagent-scrape-config" }
    - { type: "configmap", name: "victoria-metric-config" }
    - { type: "configmap", name: "victoria-tls-test-script" }
    - { type: "serviceaccount", name: "vmagent" }
    - { type: "role", name: "vmagent-sd" }
    - { type: "rolebinding", name: "vmagent-sd-binding" }
  tls_secret_resource:
    - { type: "secret", name: "victoria-tls-certs" }
  job_resources:
    - "victoria-tls-test"
  single_pvc:
    - "victoria-metrics-pvc-victoria-metric-0"
  pvc_labels:
    - "app=victoria-metric"
    - "app.kubernetes.io/instance=victoria-cluster"
  vmagent_vector_resources:
    - { type: "deployment", name: "vmagent-vector" }
    - { type: "service", name: "vmagent-vector" }
  pod_labels:
    - "app=victoria-metric"
    - "app.kubernetes.io/instance=victoria-cluster"
    - "app.kubernetes.io/name=vmagent"
    - "app=vmagent"
    - "app=victoria-tls-test"
    - "app=vmagent-vector"

victoria_operator_resources:
  - { type: "deployment", name: "victoria-metrics-operator" }
  - { type: "service", name: "victoria-metrics-operator" }
victoria_operator_helm_release: "victoria-metrics-operator"

# =============================================================================
# VictoriaLogs cleanup resources
# =============================================================================
victoria_logs:
  crd_resources:
    - { type: "vlcluster", name: "victoria-logs-cluster" }
    - { type: "vlagent", name: "vlagent" }
  generated_scrape_resources:
    - { type: "vmpodscrape", name: "vlagent-vlagent" }
    - { type: "vmservicescrape", name: "vlinsert-victoria-logs-cluster" }
    - { type: "vmservicescrape", name: "vlselect-victoria-logs-cluster" }
    - { type: "vmservicescrape", name: "vlstorage-victoria-logs-cluster" }
  crd_all_resources:
    - "vlagent"
  cluster_resources:
    - { type: "deployment", name: "vlinsert-victoria-logs-cluster" }
    - { type: "deployment", name: "vlselect-victoria-logs-cluster" }
    - { type: "statefulset", name: "vlstorage-victoria-logs-cluster" }
    - { type: "service", name: "vlinsert-victoria-logs-cluster" }
    - { type: "service", name: "vlselect-victoria-logs-cluster" }
    - { type: "service", name: "vlstorage-victoria-logs-cluster" }
  agent_resources:
    - { type: "statefulset", name: "vlagent-vlagent" }
    - { type: "service", name: "vlagent-vlagent" }
  shared_resources:
    - { type: "configmap", name: "vlagent-config" }
  pvc_labels:
    - "app.kubernetes.io/name=vlstorage"
    - "app.kubernetes.io/name=vlagent"
  named_pvc_prefixes:
    - "vlstorage-data-vlstorage-victoria-logs-cluster"
    - "vlagent-data-vlagent-vlagent"
    - "tmp-data-vlagent-vlagent"
  vlagent_vector_resources:
    - { type: "deployment", name: "vlagent-vector" }
    - { type: "service", name: "vlagent-vector" }
  pod_labels:
    - "app.kubernetes.io/component=vlinsert"
    - "app.kubernetes.io/component=vlselect"
    - "app.kubernetes.io/component=vlstorage"
    - "app.kubernetes.io/name=vlagent"
    - "app=vlagent-vector"

# =============================================================================
# LDMS cleanup resources
# =============================================================================
ldms_helm_releases:
  - "nersc-ldms-aggr"
  - "nersc-ldms-store"

ldms_statefulset_resources:
  - "nersc-ldms-aggr"
  - "nersc-ldms-store-slurm-cluster"
  - "nersc-ldms-store-slurm-cluster-0"
  - "nersc-ldms-aggr-0"

ldms_service_resources:
  - "nersc-ldms-aggr"
  - "nersc-ldms-store"
  - "nersc-ldms-store-slurm-cluster-0"
  - "nersc-ldms-aggr-0"

ldms_configmap_resources:
  - "nersc-ldms-store-slurm-cluster-0-config"
  - "nersc-ldms-aggr-0-config"

ldms_secret_resources:
  - { type: "secret", name: "nersc-ldms-ovis-auth" }
  - { type: "secret", name: "nersc-munge-key" }

ldms_configmap_label: "app=nersc-ldms"
ldms_pvc_label: "app=nersc-ldms"
ldms_pod_labels:
  - "app=nersc-ldms-aggr"
  - "app=nersc-ldms-store"
  - "app=nersc-ldms"

vector_ldms_resources:
  - { type: "deployment", name: "vector-ldms" }
  - { type: "service", name: "vector-ldms" }
  - { type: "configmap", name: "vector-ldms-config" }

vector_ldms_pod_label: "app=vector-ldms"

# LDMS sampler cleanup (all LDMS-enabled nodes)
ldms_sampler_service_name: "ldmsd"
ldms_sampler_service_file: "/etc/systemd/system/ldmsd.service"
ldms_sampler_config_dir: "/opt/ovis-ldms/etc/ldms"
ldms_sampler_share_dir: >-
  {{
    hostvars['localhost']['slurm_cluster_mount']
    | default(slurm_cluster_mount | default('/share_omnia'))
  }}/telemetry/ldms/samplers
ldms_sampler_firewall_port: >-
  {{
    hostvars['localhost']['telemetry_config'].ldms_configurations.sampler_port
    | default(10001)
  }}

# LDMS functional groups that have sampler installed
ldms_sampler_groups:
  - slurm_node
  - slurm_control_node
  - login_node
  - login_compiler_node

# =============================================================================
# OME cleanup resources
# =============================================================================
vector_ome_resources:
  - { type: "deployment", name: "vector-ome" }
  - { type: "service", name: "vector-ome" }
  - { type: "configmap", name: "vector-ome-config" }
  - { type: "kafkauser", name: "vector-ome-user" }

vector_ome_pod_label: "app=vector-ome"

# =============================================================================
# PowerScale cleanup resources
# =============================================================================
powerscale_helm_release: "karavi-observability"

powerscale_label_resources:
  - { type: "deployment", label: "app.kubernetes.io/name=karavi-metrics-powerscale" }
  - { type: "service", label: "app.kubernetes.io/name=karavi-metrics-powerscale" }
  - { type: "configmap", label: "app.kubernetes.io/name=karavi-metrics-powerscale" }
  - { type: "pod", label: "app.kubernetes.io/name=karavi-metrics-powerscale" }
  - { type: "deployment", label: "app.kubernetes.io/name=otel-collector" }
  - { type: "service", label: "app.kubernetes.io/name=otel-collector" }
  - { type: "configmap", label: "app.kubernetes.io/name=otel-collector" }
  - { type: "pod", label: "app.kubernetes.io/name=otel-collector" }

powerscale_named_resources:
  - { type: "vmservicescrape", name: "otel-collector-powerscale-scrape" }
  - { type: "vmservicescrape", name: "otel-collector-powerscale" }
  - { type: "configmap", name: "karavi-authorization-config" }
  - { type: "secret", name: "karavi-authorization-ca-cert" }
  - { type: "secret", name: "isilon-creds" }
  - { type: "configmap", name: "isilon-config-params" }
  - { type: "secret", name: "isilon-proxy-server-root-certificate" }
  - { type: "secret", name: "isilon-proxy-authz-tokens" }
  - { type: "pvc", name: "otel-collector-data" }
  - { type: "deployment", name: "csi-volume-exporter" }
  - { type: "service", name: "csi-volume-exporter" }
  - { type: "serviceaccount", name: "csi-volume-exporter" }

powerscale_cluster_resources:
  - { type: "clusterrole", name: "csi-volume-exporter" }
  - { type: "clusterrolebinding", name: "csi-volume-exporter" }

powerscale_pod_labels:
  - "app.kubernetes.io/name=karavi-metrics-powerscale"
  - "app.kubernetes.io/name=otel-collector"
  - "app.kubernetes.io/instance=karavi-observability,app.kubernetes.io/name=cert-manager"
  - "app=csi-volume-exporter"

# =============================================================================
# UFM cleanup resources
# =============================================================================
ufm_resources:
  - { type: "secret", name: "ufm-telemetry-credentials" }
  - { type: "endpoints", name: "ufm-external" }
  - { type: "service", name: "ufm-external" }
  - { type: "vmservicescrape", name: "ufm-infiniband-metrics" }

ufm_pod_label: "app=ufm-external"

# =============================================================================
# VAST cleanup resources
# =============================================================================
vast_resources:
  - { type: "secret", name: "vast-telemetry-credentials" }
  - { type: "endpoints", name: "vast-external" }
  - { type: "service", name: "vast-external" }
  - { type: "vmservicescrape", name: "vast-storage-metrics" }
vast_pod_label: "app=vast-external"
