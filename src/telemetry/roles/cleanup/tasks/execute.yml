---

- name: Run selected cleanup components
  when: not (hostvars['localhost']['_cleanup_abort'] | bool)
  block:
    - name: Run selected source cleanups
      ansible.builtin.include_tasks: cleanup_sources.yml

    - name: Verify source pods terminated before sink cleanup
      ansible.builtin.include_tasks: drain_sources.yml

    - name: Run selected sink cleanups
      ansible.builtin.include_tasks: cleanup_sinks.yml

  rescue:
    - name: Handle component cleanup failure
      ansible.builtin.include_tasks: record_failure.yml
