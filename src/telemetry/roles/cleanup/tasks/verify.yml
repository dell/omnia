---

- name: Run final cleanup verification
  when:
    - not (hostvars['localhost']['_cleanup_abort'] | bool)
    - hostvars['localhost']['_cleanup_active_component'] | length == 0
  block:
    - name: Mark cleanup verification as attempted
      ansible.builtin.set_fact:
        _cleanup_verification_attempted: true
      delegate_to: localhost
      delegate_facts: true

    - name: Final verification | Count remaining pods
      ansible.builtin.command: >
        kubectl get pods -n {{ telemetry_namespace }} --no-headers --ignore-not-found
      register: remaining_pods
      changed_when: false
      until: >-
        not (hostvars['localhost']['_cleanup_all'] | bool)
        or remaining_pods.stdout_lines | default([])
           | map('trim') | reject('equalto', '') | list | length == 0
      retries: 12
      delay: 5

    - name: Final verification | Count remaining PVCs
      ansible.builtin.command: >
        kubectl get pvc -n {{ telemetry_namespace }} --no-headers --ignore-not-found
      register: remaining_pvcs
      changed_when: false
      until: >-
        not (hostvars['localhost']['_cleanup_all'] | bool)
        or not (hostvars['localhost']['_cleanup_delete_volume'] | bool)
        or remaining_pvcs.stdout_lines | default([])
           | map('trim') | reject('equalto', '') | list | length == 0
      retries: 12
      delay: 5

    - name: Final verification | Count remaining services
      ansible.builtin.command: >
        kubectl get svc -n {{ telemetry_namespace }} --no-headers --ignore-not-found
      register: remaining_svcs
      changed_when: false
      until: >-
        not (hostvars['localhost']['_cleanup_all'] | bool)
        or remaining_svcs.stdout_lines | default([])
           | map('trim') | reject('equalto', '') | list | length == 0
      retries: 12
      delay: 5

    - name: Final verification | Count remaining workloads
      ansible.builtin.command: >
        kubectl get deployment,statefulset,daemonset,job
        -n {{ telemetry_namespace }} --no-headers --ignore-not-found
      register: remaining_workloads
      changed_when: false
      until: >-
        not (hostvars['localhost']['_cleanup_all'] | bool)
        or remaining_workloads.stdout_lines | default([])
           | map('trim') | reject('equalto', '') | list | length == 0
      retries: 12
      delay: 5

    - name: Final verification | Count remaining Helm releases
      ansible.builtin.command:
        argv:
          - helm
          - list
          - --namespace
          - "{{ telemetry_namespace }}"
          - --all
          - --short
      register: remaining_helm_releases
      changed_when: false
      until: >-
        remaining_helm_releases.stdout_lines | default([])
        | map('trim') | reject('equalto', '') | list | length == 0
      retries: 12
      delay: 5
      when: hostvars['localhost']['_cleanup_all'] | bool

    - name: Final verification | Confirm requested PVC deletion
      vars:
        _remaining_pvc_count: >-
          {{
            remaining_pvcs.stdout_lines | default([])
            | map('trim') | reject('equalto', '') | list | length
          }}
      ansible.builtin.assert:
        that:
          - _remaining_pvc_count | int == 0
        fail_msg: >-
          Full telemetry cleanup requested PVC deletion but left
          {{ _remaining_pvc_count }} PVC(s) in the telemetry namespace.
      when:
        - hostvars['localhost']['_cleanup_all'] | bool
        - hostvars['localhost']['_cleanup_delete_volume'] | bool

    - name: Final verification | Confirm full cleanup removed resources
      vars:
        _remaining_pod_count: >-
          {{
            remaining_pods.stdout_lines | default([])
            | map('trim') | reject('equalto', '') | list | length
          }}
        _remaining_service_count: >-
          {{
            remaining_svcs.stdout_lines | default([])
            | map('trim') | reject('equalto', '') | list | length
          }}
        _remaining_workload_count: >-
          {{
            remaining_workloads.stdout_lines | default([])
            | map('trim') | reject('equalto', '') | list | length
          }}
        _remaining_helm_release_count: >-
          {{
            remaining_helm_releases.stdout_lines | default([])
            | map('trim') | reject('equalto', '') | list | length
          }}
      ansible.builtin.assert:
        that:
          - _remaining_pod_count | int == 0
          - _remaining_service_count | int == 0
          - _remaining_workload_count | int == 0
          - _remaining_helm_release_count | int == 0
        fail_msg: >-
          Full telemetry cleanup left {{ _remaining_pod_count }} pod(s),
          {{ _remaining_service_count }} service(s),
          {{ _remaining_workload_count }} workload(s), and
          {{ _remaining_helm_release_count }} Helm release(s) in the telemetry namespace.
      when: hostvars['localhost']['_cleanup_all'] | bool

    - name: Mark cleanup verification as completed
      ansible.builtin.set_fact:
        _cleanup_verification_attempted: false
      delegate_to: localhost
      delegate_facts: true

  rescue:
    - name: Record cleanup verification failure
      vars:
        _cleanup_failure_message: >-
          {{
            ansible_failed_result.stderr
            | default(
                ansible_failed_result.stdout
                | default(
                    ansible_failed_result.msg | default('Cleanup verification failed'),
                    true
                  ),
                true
              )
          }}
      ansible.builtin.set_fact:
        _cleanup_abort: true
        _cleanup_verification_attempted: false
        _cleanup_volume_verification_failed: >-
          {{
            hostvars['localhost']['_cleanup_volume_verification_failed'] | default(false) | bool
            or (
              hostvars['localhost']['_cleanup_delete_volume'] | bool
              and (ansible_failed_task.name | default('')) in
                [
                  'Final verification | Count remaining PVCs',
                  'Final verification | Confirm requested PVC deletion'
                ]
            )
          }}
        _cleanup_failures: >-
          {{
            hostvars['localhost']['_cleanup_failures']
            + [{
                'component': 'verification',
                'task': ansible_failed_task.name | default('Final cleanup verification'),
                'host': inventory_hostname,
                'rc': ansible_failed_result.rc | default(''),
                'message': (_cleanup_failure_message | string)[:1000]
              }]
          }}
      delegate_to: localhost
      delegate_facts: true
