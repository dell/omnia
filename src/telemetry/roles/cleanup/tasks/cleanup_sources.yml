---

- name: Mark iDRAC cleanup as attempted
  ansible.builtin.set_fact:
    _cleanup_active_component: idrac
    _cleanup_component_results: >-
      {{
        hostvars['localhost']['_cleanup_component_results']
        | combine({'idrac': 'attempted'})
      }}
  delegate_to: localhost
  delegate_facts: true
  when: >-
    hostvars['localhost']['_cleanup_all'] | bool
    or hostvars['localhost']['_cleanup_idrac'] | bool

- name: Check if iDRAC resources exist
  ansible.builtin.command: >
    kubectl -n {{ telemetry_namespace }} get statefulset idrac-telemetry
    --ignore-not-found=true --output=name
  register: _idrac_check
  changed_when: false
  when: >-
    hostvars['localhost']['_cleanup_all'] | bool
    or hostvars['localhost']['_cleanup_idrac'] | bool
  failed_when: false

- name: Cleanup iDRAC telemetry
  ansible.builtin.include_tasks: idrac.yml
  when: >-
    (hostvars['localhost']['_cleanup_all'] | bool
    or hostvars['localhost']['_cleanup_idrac'] | bool)
    and _idrac_check.stdout | default('') | length > 0

- name: Mark iDRAC cleanup as cleaned
  ansible.builtin.set_fact:
    _cleanup_active_component: ""
    _cleanup_component_results: >-
      {{
        hostvars['localhost']['_cleanup_component_results']
        | combine({'idrac': 'cleaned'})
      }}
  delegate_to: localhost
  delegate_facts: true
  when: >-
    (hostvars['localhost']['_cleanup_all'] | bool
    or hostvars['localhost']['_cleanup_idrac'] | bool)
    and _idrac_check.stdout | default('') | length > 0

- name: Mark iDRAC cleanup as skipped
  ansible.builtin.set_fact:
    _cleanup_active_component: ""
    _cleanup_component_results: >-
      {{
        hostvars['localhost']['_cleanup_component_results']
        | combine({'idrac': 'skipped'})
      }}
  delegate_to: localhost
  delegate_facts: true
  when: >-
    (hostvars['localhost']['_cleanup_all'] | bool
    or hostvars['localhost']['_cleanup_idrac'] | bool)
    and _idrac_check.stdout | default('') | length == 0

- name: Mark iDRAC cleanup as skipped (not selected)
  ansible.builtin.set_fact:
    _cleanup_active_component: ""
    _cleanup_component_results: >-
      {{
        hostvars['localhost']['_cleanup_component_results']
        | combine({'idrac': 'skipped'})
      }}
  delegate_to: localhost
  delegate_facts: true
  when: >-
    not (hostvars['localhost']['_cleanup_all'] | bool)
    and not (hostvars['localhost']['_cleanup_idrac'] | bool)

- name: Cleanup iDRAC credentials
  ansible.builtin.include_tasks: cleanup_credentials.yml
  vars:
    _cleanup_credential_component: idrac
  when: >-
    (hostvars['localhost']['_cleanup_all'] | bool
    or hostvars['localhost']['_cleanup_idrac'] | bool)
    and _idrac_check.stdout | default('') | length > 0

