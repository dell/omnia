---

- name: "VAST | Delete resources"
  ansible.builtin.command: >
    kubectl -n {{ telemetry_namespace }} delete {{ item.type }} {{ item.name }}
    --ignore-not-found=true --wait=false
  loop: "{{ vast_resources }}"
  loop_control:
    label: "{{ item.type }}/{{ item.name }}"
  changed_when: false
  failed_when: false

- name: "VAST | Force delete pods"
  ansible.builtin.command: >
    kubectl -n {{ telemetry_namespace }} delete pod -l {{ vast_pod_label }}
    --grace-period={{ cleanup_resource_grace_period }} --force --ignore-not-found=true
  changed_when: false
  failed_when: false

- name: "VAST | Remove generated manifests"
  ansible.builtin.file:
    path: "{{ telemetry_deployments_dir | default('/opt/omnia/k8s_mount/telemetry/deployments') }}/{{ item }}"
    state: absent
  loop:
    - vast-telemetry-secret.yaml
    - vast-external-service.yaml
  failed_when: false

- name: "VAST | Cleanup complete"
  ansible.builtin.debug:
    msg: "VAST telemetry cleanup completed"

- name: "Vast | Register cleanup result"
  ansible.builtin.set_fact:
    _cleanup_result_vast: "cleaned"
  delegate_to: localhost
  delegate_facts: true
