---

- name: UFM | Discover Victoria API resources
  ansible.builtin.command: >
    kubectl api-resources --namespaced=true --api-group=operator.victoriametrics.com --output=name
  register: _ufm_victoria_api_resources
  changed_when: false

- name: "UFM | Delete resources"
  ansible.builtin.command: >
    kubectl -n {{ telemetry_namespace }} delete {{ item.type }} {{ item.name }}
    --ignore-not-found=true --wait=false
  loop: "{{ ufm_resources }}"
  loop_control:
    label: "{{ item.type }}/{{ item.name }}"
  changed_when: false
  when: >-
    item.type != 'vmservicescrape'
    or 'vmservicescrapes.operator.victoriametrics.com'
       in _ufm_victoria_api_resources.stdout_lines

- name: "UFM | Force delete pods"
  ansible.builtin.command: >
    kubectl -n {{ telemetry_namespace }} delete pod -l {{ ufm_pod_label }}
    --grace-period={{ cleanup_resource_grace_period }} --force --ignore-not-found=true
  changed_when: false

- name: "UFM | Remove generated manifests"
  ansible.builtin.file:
    path: "{{ telemetry_deployments_dir | default('/opt/omnia/k8s_mount/telemetry/deployments') }}/{{ item }}"
    state: absent
  loop:
    - ufm-telemetry-secret.yaml
    - ufm-external-service.yaml

- name: "UFM | Cleanup complete"
  ansible.builtin.debug:
    msg: "UFM telemetry cleanup completed"
