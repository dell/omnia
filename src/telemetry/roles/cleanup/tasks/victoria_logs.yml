---

- name: VictoriaLogs | Discover Victoria API resources
  ansible.builtin.command: >
    kubectl api-resources --namespaced=true --api-group=operator.victoriametrics.com --output=name
  register: _victoria_logs_api_resources
  changed_when: false

- name: VictoriaLogs | Delete CRD resources
  ansible.builtin.command: >
    kubectl -n {{ telemetry_namespace }} delete {{ item.type }} {{ item.name }}
    --ignore-not-found=true --wait=false
  loop: "{{ victoria_logs.crd_resources }}"
  loop_control:
    label: "{{ item.type }}/{{ item.name }}"
  changed_when: false
  when: >-
    (item.type ~ 's.operator.victoriametrics.com') in
    _victoria_logs_api_resources.stdout_lines

- name: VictoriaLogs | Wait for custom resources to terminate
  ansible.builtin.command: >
    kubectl -n {{ telemetry_namespace }} get {{ item.type }} {{ item.name }}
    --output=name --ignore-not-found=true
  loop: "{{ victoria_logs.crd_resources }}"
  loop_control:
    label: "{{ item.type }}/{{ item.name }}"
  register: _victoria_logs_cr_wait
  changed_when: false
  until: _victoria_logs_cr_wait.stdout | trim | length == 0
  retries: "{{ cleanup_custom_resource_retries }}"
  delay: "{{ cleanup_custom_resource_delay }}"
  when: >-
    (item.type ~ 's.operator.victoriametrics.com') in
    _victoria_logs_api_resources.stdout_lines

- name: VictoriaLogs | Delete generated scrape resources
  ansible.builtin.command: >
    kubectl -n {{ telemetry_namespace }} delete {{ item.type }} {{ item.name }}
    --ignore-not-found=true --wait=false
  loop: "{{ victoria_logs.generated_scrape_resources }}"
  loop_control:
    label: "{{ item.type }}/{{ item.name }}"
  changed_when: false
  when: >-
    (item.type ~ 's.operator.victoriametrics.com') in
    _victoria_logs_api_resources.stdout_lines

- name: VictoriaLogs | Wait for generated scrape resources to terminate
  ansible.builtin.command: >
    kubectl -n {{ telemetry_namespace }} get {{ item.type }} {{ item.name }}
    --output=name --ignore-not-found=true
  loop: "{{ victoria_logs.generated_scrape_resources }}"
  loop_control:
    label: "{{ item.type }}/{{ item.name }}"
  register: _victoria_logs_scrape_wait
  changed_when: false
  until: _victoria_logs_scrape_wait.stdout | trim | length == 0
  retries: "{{ cleanup_custom_resource_retries }}"
  delay: "{{ cleanup_custom_resource_delay }}"
  when: >-
    (item.type ~ 's.operator.victoriametrics.com') in
    _victoria_logs_api_resources.stdout_lines

- name: VictoriaLogs | Wait for operator to cascade deletions
  ansible.builtin.pause:
    seconds: "{{ cleanup_post_delete_pause }}"

- name: VictoriaLogs | Delete cluster components
  ansible.builtin.command: >
    kubectl -n {{ telemetry_namespace }} delete {{ item.type }} {{ item.name }}
    --ignore-not-found=true --wait=false
  loop: "{{ victoria_logs.cluster_resources + victoria_logs.agent_resources }}"
  loop_control:
    label: "{{ item.type }}/{{ item.name }}"
  changed_when: false

- name: VictoriaLogs | Delete shared resources
  ansible.builtin.command: >
    kubectl -n {{ telemetry_namespace }} delete {{ item.type }} {{ item.name }}
    --ignore-not-found=true --wait=false
  loop: "{{ victoria_logs.shared_resources }}"
  loop_control:
    label: "{{ item.type }}/{{ item.name }}"
  changed_when: false

- name: VictoriaLogs | Delete PVCs by label
  ansible.builtin.command: >
    kubectl -n {{ telemetry_namespace }} delete pvc -l {{ item }}
    --ignore-not-found=true --wait=false
  loop: "{{ victoria_logs.pvc_labels }}"
  changed_when: false
  when: _cleanup_delete_volume_enabled | bool

- name: VictoriaLogs | Delete named PVCs (vlstorage + vlagent 0-9)
  ansible.builtin.command: >
    kubectl -n {{ telemetry_namespace }} delete pvc {{ item.0 }}-{{ item.1 }}
    --ignore-not-found=true --wait=false
  loop: "{{ victoria_logs.named_pvc_prefixes | product(range(0, 10) | list) | list }}"
  loop_control:
    label: "{{ item.0 }}-{{ item.1 }}"
  changed_when: false
  when: _cleanup_delete_volume_enabled | bool

# --- vlagent-vector log write-buffer cleanup (VL-side adapter for vector-ome) ---
- name: VictoriaLogs | Delete vlagent-vector resources
  ansible.builtin.command: >
    kubectl -n {{ telemetry_namespace }} delete {{ item.type }} {{ item.name }}
    --ignore-not-found=true --wait=false
  loop: "{{ victoria_logs.vlagent_vector_resources }}"
  loop_control:
    label: "{{ item.type }}/{{ item.name }}"
  changed_when: false

- name: VictoriaLogs | Force delete pods
  ansible.builtin.command: >
    kubectl -n {{ telemetry_namespace }} delete pod -l {{ item }}
    --grace-period={{ cleanup_resource_grace_period }} --force --ignore-not-found=true
  loop: "{{ victoria_logs.pod_labels }}"
  changed_when: false
  when: _cleanup_delete_volume_enabled | bool

- name: VictoriaLogs | Wait for pods to terminate
  ansible.builtin.command: >
    kubectl -n {{ telemetry_namespace }} get pod -l {{ item }}
    --output=name --ignore-not-found=true
  loop: "{{ victoria_logs.pod_labels }}"
  register: _victoria_logs_pod_wait
  changed_when: false
  until: _victoria_logs_pod_wait.stdout | trim | length == 0
  retries: "{{ cleanup_custom_resource_retries }}"
  delay: "{{ cleanup_custom_resource_delay }}"

- name: VictoriaLogs | Wait for label-selected PVCs to terminate
  ansible.builtin.command: >
    kubectl -n {{ telemetry_namespace }} get pvc -l {{ item }}
    --output=name --ignore-not-found=true
  loop: "{{ victoria_logs.pvc_labels }}"
  register: _victoria_logs_pvc_label_wait
  changed_when: false
  until: _victoria_logs_pvc_label_wait.stdout | trim | length == 0
  retries: "{{ cleanup_custom_resource_retries }}"
  delay: "{{ cleanup_custom_resource_delay }}"
  when: _cleanup_delete_volume_enabled | bool

- name: VictoriaLogs | Wait for named PVCs to terminate
  ansible.builtin.command: >
    kubectl -n {{ telemetry_namespace }} get pvc {{ item.0 }}-{{ item.1 }}
    --output=name --ignore-not-found=true
  loop: "{{ victoria_logs.named_pvc_prefixes | product(range(0, 10) | list) | list }}"
  loop_control:
    label: "{{ item.0 }}-{{ item.1 }}"
  register: _victoria_logs_pvc_name_wait
  changed_when: false
  until: _victoria_logs_pvc_name_wait.stdout | trim | length == 0
  retries: "{{ cleanup_custom_resource_retries }}"
  delay: "{{ cleanup_custom_resource_delay }}"
  when: _cleanup_delete_volume_enabled | bool

# --- Victoria operator cleanup (shared between VM and VL) ---
# Only delete the operator if VictoriaMetrics is NOT running
- name: VictoriaLogs | Check if VictoriaMetrics workloads still exist
  ansible.builtin.command: >
    kubectl -n {{ telemetry_namespace }} get {{ item }}
    --output=name --ignore-not-found=true
  loop: "{{ ['vmcluster'] + victoria_metrics.crd_all_resources }}"
  register: _victoria_metrics_workload_checks
  changed_when: false
  when: (item ~ 's.operator.victoriametrics.com') in _victoria_logs_api_resources.stdout_lines

- name: VictoriaLogs | Record VictoriaMetrics workload state
  ansible.builtin.set_fact:
    _victoria_metrics_workloads_present: >-
      {{
        _victoria_metrics_workload_checks.results | default([])
        | selectattr('stdout', 'defined')
        | map(attribute='stdout')
        | map('trim')
        | reject('equalto', '') | list | length > 0
      }}

- name: VictoriaLogs | Delete shared TLS secret when VictoriaMetrics is absent
  ansible.builtin.command: >
    kubectl -n {{ telemetry_namespace }} delete {{ item.type }} {{ item.name }}
    --ignore-not-found=true --wait=false
  loop: "{{ victoria_metrics.tls_secret_resource }}"
  loop_control:
    label: "{{ item.type }}/{{ item.name }}"
  changed_when: false
  when: not (_victoria_metrics_workloads_present | bool)

- name: VictoriaLogs | Keep shared TLS secret while VictoriaMetrics is running
  ansible.builtin.debug:
    msg: "Keeping victoria-tls-certs secret (shared with VictoriaMetrics)"
  when: _victoria_metrics_workloads_present | bool

- name: VictoriaLogs | Discover operator Helm release
  ansible.builtin.command:
    argv:
      - helm
      - list
      - --namespace
      - "{{ telemetry_namespace }}"
      - --all
      - --filter
      - "^{{ victoria_operator_helm_release }}$"
      - --short
  register: _victoria_logs_operator_release
  changed_when: false
  when: not (_victoria_metrics_workloads_present | bool)

- name: VictoriaLogs | Uninstall operator Helm release
  ansible.builtin.command:
    argv:
      - helm
      - uninstall
      - "{{ victoria_operator_helm_release }}"
      - --namespace
      - "{{ telemetry_namespace }}"
      - --wait
      - --timeout
      - "{{ cleanup_helm_timeout }}"
  changed_when: true
  when:
    - not (_victoria_metrics_workloads_present | bool)
    - >-
      victoria_operator_helm_release in
      (_victoria_logs_operator_release.stdout_lines | default([]))

- name: VictoriaLogs | Delete operator (no VictoriaMetrics workloads found)
  ansible.builtin.command: >
    kubectl -n {{ telemetry_namespace }} delete {{ item.type }} {{ item.name }}
    --ignore-not-found=true --wait=false
  loop: "{{ victoria_operator_resources }}"
  loop_control:
    label: "{{ item.type }}/{{ item.name }}"
  changed_when: false
  when: not (_victoria_metrics_workloads_present | bool)

- name: VictoriaLogs | Operator kept (VictoriaMetrics still running)
  ansible.builtin.debug:
    msg: "Keeping victoria-metrics-operator (VictoriaMetrics workloads still exist)"
  when: _victoria_metrics_workloads_present | bool

- name: VictoriaLogs | Cleanup complete
  ansible.builtin.debug:
    msg: "VictoriaLogs cleanup completed (includes vlagent-vector write-buffer)"
