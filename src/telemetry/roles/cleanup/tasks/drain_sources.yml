---

- name: Mark source drain as attempted
  ansible.builtin.set_fact:
    _cleanup_active_component: source_drain
    _cleanup_component_results: >-
      {{
        hostvars['localhost']['_cleanup_component_results']
        | combine({'source_drain': 'attempted'})
      }}
  delegate_to: localhost
  delegate_facts: true
  when: hostvars['localhost']['_cleanup_all'] | bool

- name: Wait for source pods to terminate before sink cleanup
  ansible.builtin.command: >
    kubectl get pods -n telemetry --no-headers --ignore-not-found
    -l {{ item }}
  loop:
    - app=nersc-ldms
    - app=vector-ome
    - app=vector-ldms
    - app.kubernetes.io/name=karavi-metrics-powerscale
    - app.kubernetes.io/name=otel-collector
    - app=csi-volume-exporter
    - app=ufm-external
    - app=vast-external
    - app=skyway-telemetry
    - app=powervault-telemetry
  loop_control:
    label: "{{ item }}"
  register: _source_pod_drain
  changed_when: false
  until: _source_pod_drain.stdout | trim | length == 0
  retries: 12
  delay: 5
  when: hostvars['localhost']['_cleanup_all'] | bool

- name: Mark source drain as cleaned
  ansible.builtin.set_fact:
    _cleanup_active_component: ""
    _cleanup_component_results: >-
      {{
        hostvars['localhost']['_cleanup_component_results']
        | combine({'source_drain': 'cleaned'})
      }}
  delegate_to: localhost
  delegate_facts: true
  when: hostvars['localhost']['_cleanup_all'] | bool
