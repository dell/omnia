---

- name: Derive cleanup scope from run tags
  ansible.builtin.set_fact:
    _cleanup_all: "{{ 'cleanup' in ansible_run_tags }}"
    _cleanup_idrac: "{{ 'cleanup_idrac' in ansible_run_tags }}"
    _cleanup_ldms: "{{ 'cleanup_ldms' in ansible_run_tags }}"
    _cleanup_ome: "{{ 'cleanup_ome' in ansible_run_tags }}"
    _cleanup_powerscale: "{{ 'cleanup_powerscale' in ansible_run_tags }}"
    _cleanup_ufm: "{{ 'cleanup_ufm' in ansible_run_tags }}"
    _cleanup_vast: "{{ 'cleanup_vast' in ansible_run_tags }}"
    _cleanup_kafka: "{{ 'cleanup_kafka' in ansible_run_tags }}"
    _cleanup_victoria_metrics: "{{ 'cleanup_victoria_metrics' in ansible_run_tags }}"
    _cleanup_victoria_logs: "{{ 'cleanup_victoria_logs' in ansible_run_tags }}"
    cacheable: true

- name: Initialize cleanup state
  ansible.builtin.set_fact:
    _cleanup_abort: false
    _cleanup_active_component: ""
    _cleanup_component_results:
      idrac: skipped
      ldms: skipped
      ome: skipped
      powerscale: skipped
      ufm: skipped
      vast: skipped
      source_drain: skipped
      kafka: skipped
      victoria_metrics: skipped
      victoria_logs: skipped
    _cleanup_enabled:
      idrac_metrics: false
      ldms_metrics: false
      powerscale_metrics: false
      powerscale_logs: false
      ufm_metrics: false
      ufm_logs: false
      vast_metrics: false
      vast_logs: false
      ome_metrics: false
      ome_logs: false
      vector_ldms: false
      vector_ome: false
    _cleanup_failures: []
    _cleanup_unreachable_nodes:
      ldms: []
    _cleanup_verification_attempted: false
    _cleanup_volume_verification_failed: false
    _cleanup_kube_vip_unavailable: false
    _cleanup_delete_sinks_volume: >-
      {{ Delete_sinks_volume | default(delete_sinks_volume | default(false)) | bool }}
    _cleanup_preserve_credentials: >-
      {{ not (cleanup_credentials | default(true) | bool) }}
    _cleanup_preserve_logs: >-
      {{ not (cleanup_logs | default(true) | bool) }}

- name: Validate persistent volume cleanup option
  vars:
    _cleanup_boolean_values:
      - "true"
      - "false"
      - "yes"
      - "no"
      - "1"
      - "0"
  ansible.builtin.assert:
    that:
      - >-
        Delete_sinks_volume is not defined
        or (Delete_sinks_volume | string | lower) in _cleanup_boolean_values
      - >-
        delete_sinks_volume is not defined
        or (delete_sinks_volume | string | lower) in _cleanup_boolean_values
      - >-
        Delete_sinks_volume is not defined
        or delete_sinks_volume is not defined
        or (Delete_sinks_volume | bool) == (delete_sinks_volume | bool)
    fail_msg: >-
      Set only one matching boolean value for Delete_sinks_volume or delete_sinks_volume.
      Accepted values are true, false, yes, no, 1, and 0.

- name: Reject misspelled sink volume option
  ansible.builtin.assert:
    that:
      - Delete_sinks_volumes is not defined
      - delete_sinks_volumes is not defined
    fail_msg: "{{ cleanup_invalid_sink_volume_option_msg }}"

- name: Reject sink volume option for granular cleanup
  ansible.builtin.assert:
    that:
      - >-
        (_cleanup_all | bool)
        or (
          Delete_sinks_volume is not defined
          and delete_sinks_volume is not defined
        )
    fail_msg: "{{ cleanup_granular_sink_volume_option_fail_msg }}"

- name: Validate cleanup_credentials option
  ansible.builtin.assert:
    that:
      - >-
        cleanup_credentials is not defined
        or (cleanup_credentials | string | trim | lower) in ['true', 'false']
    fail_msg: "{{ cleanup_credentials_invalid_msg }}"

- name: Validate cleanup_logs option
  ansible.builtin.assert:
    that:
      - >-
        cleanup_logs is not defined
        or (cleanup_logs | string | trim | lower) in ['true', 'false']
    fail_msg: "{{ cleanup_logs_invalid_msg }}"

- name: Display warning for cleanup with volume when preservation flags are set
  ansible.builtin.pause:
    prompt: |
      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      [WARNING] Cleanup with volume (Delete_sinks_volume=true) is enabled.
      In cleanup with volume mode, credentials and logs are NOT preserved
      and WILL be deleted regardless of cleanup_credentials or cleanup_logs
      flags.

      If credentials or logs are required, take a backup before proceeding
      with this execution.

      Execution will continue in 30 seconds...
      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    seconds: 30
  when:
    - _cleanup_all | bool
    - _cleanup_delete_sinks_volume | bool
    - _cleanup_preserve_credentials | bool or _cleanup_preserve_logs | bool

- name: Prepare telemetry cleanup
  block:
    # Remove local credentials after local option validation but before a
    # configuration or remote prerequisite can fail. Component cleanup uses
    # deployed Kubernetes resources, not this stored credential file.
    # Honour cleanup_credentials=false to preserve credentials during
    # cleanup without volume. When Delete_sinks_volume=true the flag is
    # overridden and credentials are always removed.
    - name: Cleanup credentials for complete cleanup
      ansible.builtin.include_tasks: cleanup_credentials.yml
      when:
        - _cleanup_all | bool
        - >-
          not (_cleanup_preserve_credentials | bool)
          or (_cleanup_delete_sinks_volume | bool)

    - name: Load telemetry configuration
      ansible.builtin.include_role:
        name: common
        tasks_from: load_telemetry_config

    - name: Check if kube_vip is available for telemetry cleanup
      ansible.builtin.set_fact:
        _cleanup_kube_vip_unavailable: true
        _cleanup_abort: true
      when: >-
        kube_vip is not defined
        or kube_vip | default('') | trim | length == 0

    - name: Display warning when kube_vip is not available
      ansible.builtin.pause:
        prompt: |
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          [WARNING] kube_vip is not available.
          Telemetry cleanup will be skipped as telemetry is not installed
          or the cluster inventory has not been configured.
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        seconds: 10
      when: _cleanup_kube_vip_unavailable | default(false) | bool

    - name: Add kube_vip to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ kube_vip }}"
        groups: kube_vip_group
        ansible_user: root
      when: not (_cleanup_kube_vip_unavailable | default(false) | bool)

    - name: Map configured telemetry capabilities
      when: not (_cleanup_kube_vip_unavailable | default(false) | bool)
      ansible.builtin.set_fact:
        _cleanup_enabled:
          idrac_metrics: >-
            {{ telemetry_config.telemetry_sources.idrac.metrics_enabled | default(false) | bool }}
          ldms_metrics: >-
            {{ telemetry_config.telemetry_sources.ldms.metrics_enabled | default(false) | bool }}
          powerscale_metrics: >-
            {{ telemetry_config.telemetry_sources.powerscale.metrics_enabled | default(false) | bool }}
          powerscale_logs: >-
            {{ telemetry_config.telemetry_sources.powerscale.logs_enabled | default(false) | bool }}
          ufm_metrics: >-
            {{ telemetry_config.telemetry_sources.ufm.metrics_enabled | default(false) | bool }}
          ufm_logs: >-
            {{ telemetry_config.telemetry_sources.ufm.logs_enabled | default(false) | bool }}
          vast_metrics: >-
            {{ telemetry_config.telemetry_sources.vast.metrics_enabled | default(false) | bool }}
          vast_logs: >-
            {{ telemetry_config.telemetry_sources.vast.logs_enabled | default(false) | bool }}
          ome_metrics: >-
            {{ telemetry_config.telemetry_sources.ome.metrics_enabled | default(false) | bool }}
          ome_logs: >-
            {{ telemetry_config.telemetry_sources.ome.logs_enabled | default(false) | bool }}
          vector_ldms: >-
            {{ telemetry_config.telemetry_bridges.vector_ldms.metrics_enabled | default(false) | bool }}
          vector_ome: >-
            {{
              telemetry_config.telemetry_bridges.vector_ome.metrics_enabled | default(false) | bool
              or telemetry_config.telemetry_bridges.vector_ome.logs_enabled | default(false) | bool
            }}

  rescue:
    - name: Record cleanup prerequisite failure
      vars:
        _cleanup_failure_message: >-
          {{
            ansible_failed_result.stderr
            | default(ansible_failed_result.msg | default('Cleanup prerequisite failed'), true)
          }}
      ansible.builtin.set_fact:
        _cleanup_abort: true
        _cleanup_kube_vip_unavailable: >-
          {{ kube_vip is not defined or kube_vip | default('') | trim | length == 0 }}
        _cleanup_failures: >-
          {{
            _cleanup_failures
            + [{
                'component': 'prerequisites',
                'task': ansible_failed_task.name | default('Prepare telemetry cleanup'),
                'host': inventory_hostname,
                'rc': ansible_failed_result.rc | default(''),
                'message': (_cleanup_failure_message | string)[:1000]
              }]
          }}

    - name: Display warning when prerequisite failure is due to missing kube_vip
      ansible.builtin.pause:
        prompt: |
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          [WARNING] kube_vip is not available.
          Telemetry cleanup will be skipped as telemetry is not installed
          or the cluster inventory has not been configured.
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          Press Enter to continue or wait 10 seconds...
        seconds: 10
      when: _cleanup_kube_vip_unavailable | default(false) | bool
