---

- name: "SFM | Delete resources"
  ansible.builtin.command: >
    kubectl -n {{ telemetry_namespace }} delete {{ item.type }} {{ item.name }}
    --ignore-not-found=true --wait=false
  loop: "{{ sfm_resources }}"
  loop_control:
    label: "{{ item.type }}/{{ item.name }}"
  changed_when: false
  failed_when: false

- name: "SFM | Force delete pods"
  ansible.builtin.command: >
    kubectl -n {{ telemetry_namespace }} delete pod -l {{ sfm_pod_label }}
    --grace-period={{ cleanup_resource_grace_period }} --force --ignore-not-found=true
  changed_when: false
  failed_when: false

- name: "SFM | Cleanup complete"
  ansible.builtin.debug:
    msg: "SFM telemetry cleanup completed"
