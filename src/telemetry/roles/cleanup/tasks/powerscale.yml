---

- name: PowerScale | Discover Victoria API resources
  ansible.builtin.command: >
    kubectl api-resources --namespaced=true --api-group=operator.victoriametrics.com --output=name
  register: _powerscale_victoria_api_resources
  changed_when: false

- name: PowerScale | Check for Helm release
  ansible.builtin.command:
    argv:
      - helm
      - list
      - --namespace
      - "{{ telemetry_namespace }}"
      - --all
      - --filter
      - "^{{ powerscale_helm_release }}$"
      - --short
  register: _powerscale_helm_releases
  changed_when: false

- name: PowerScale | Uninstall Helm release
  ansible.builtin.command:
    argv:
      - helm
      - uninstall
      - "{{ powerscale_helm_release }}"
      - --namespace
      - "{{ telemetry_namespace }}"
      - --wait
      - --timeout
      - "{{ cleanup_helm_timeout }}"
  when: powerscale_helm_release in _powerscale_helm_releases.stdout_lines
  changed_when: true

- name: PowerScale | Wait for Helm resources to terminate
  ansible.builtin.pause:
    seconds: "{{ cleanup_post_delete_pause }}"
  when: powerscale_helm_release in _powerscale_helm_releases.stdout_lines

- name: PowerScale | Delete label-selected resources
  ansible.builtin.command: >
    kubectl -n {{ telemetry_namespace }} delete {{ item.type }} -l {{ item.label }}
    --ignore-not-found=true --wait=false
  loop: "{{ powerscale_label_resources }}"
  loop_control:
    label: "{{ item.type }} ({{ item.label }})"
  changed_when: false

- name: PowerScale | Delete named resources
  ansible.builtin.command: >
    kubectl -n {{ telemetry_namespace }} delete {{ item.type }} {{ item.name }}
    --ignore-not-found=true --wait=false
  loop: "{{ powerscale_named_resources }}"
  loop_control:
    label: "{{ item.type }}/{{ item.name }}"
  changed_when: false
  when:
    - item.type != 'pvc' or _cleanup_delete_volume_enabled | bool
    - >-
      item.type != 'vmservicescrape'
      or 'vmservicescrapes.operator.victoriametrics.com'
         in _powerscale_victoria_api_resources.stdout_lines

- name: PowerScale | Delete cert-manager resources
  ansible.builtin.command: >
    kubectl -n {{ telemetry_namespace }} delete {{ item }}
    -l "app.kubernetes.io/instance=karavi-observability,app.kubernetes.io/name=cert-manager"
    --ignore-not-found=true --wait=false
  loop:
    - deployment
    - pod
  changed_when: false

- name: PowerScale | Delete cluster-scoped resources
  ansible.builtin.command: >
    kubectl delete {{ item.type }} {{ item.name }}
    --ignore-not-found=true --wait=false
  loop: "{{ powerscale_cluster_resources }}"
  loop_control:
    label: "{{ item.type }}/{{ item.name }}"
  changed_when: false

- name: PowerScale | Remove generated manifest
  ansible.builtin.file:
    path: "{{ telemetry_deployments_dir | default('/opt/omnia/k8s_mount/telemetry/deployments') }}/csi-volume-exporter.yaml"
    state: absent

- name: PowerScale | Force delete pods
  ansible.builtin.command: >
    kubectl -n {{ telemetry_namespace }} delete pod -l {{ item }}
    --grace-period={{ cleanup_resource_grace_period }} --force --ignore-not-found=true
  loop: "{{ powerscale_pod_labels }}"
  changed_when: false
  when: _cleanup_delete_volume_enabled | bool

- name: PowerScale | Wait for pods to terminate
  ansible.builtin.command: >
    kubectl -n {{ telemetry_namespace }} get pod -l {{ item }}
    --output=name --ignore-not-found=true
  loop: "{{ powerscale_pod_labels }}"
  register: _powerscale_pod_wait
  changed_when: false
  until: _powerscale_pod_wait.stdout | trim | length == 0
  retries: "{{ cleanup_custom_resource_retries }}"
  delay: "{{ cleanup_custom_resource_delay }}"

- name: PowerScale | Wait for PVCs to terminate
  ansible.builtin.command: >
    kubectl -n {{ telemetry_namespace }} get pvc {{ item.name }}
    --output=name --ignore-not-found=true
  loop: "{{ powerscale_named_resources | selectattr('type', 'equalto', 'pvc') | list }}"
  loop_control:
    label: "pvc/{{ item.name }}"
  register: _powerscale_pvc_wait
  changed_when: false
  until: _powerscale_pvc_wait.stdout | trim | length == 0
  retries: "{{ cleanup_custom_resource_retries }}"
  delay: "{{ cleanup_custom_resource_delay }}"
  when: _cleanup_delete_volume_enabled | bool

- name: PowerScale | Cleanup complete
  ansible.builtin.debug:
    msg: "PowerScale telemetry cleanup completed"
