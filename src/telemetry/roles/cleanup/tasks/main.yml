# =============================================================================
# Cleanup role — entry point
# =============================================================================
# This role consolidates all telemetry cleanup tasks into a single role.
# Callers should use tasks_from to invoke specific component cleanup:
#
#   ansible.builtin.include_role:
#     name: cleanup
#     tasks_from: kafka           # Cleanup Kafka
#     tasks_from: victoria_metrics # Cleanup VictoriaMetrics
#     tasks_from: victoria_logs    # Cleanup VictoriaLogs
#     tasks_from: ldms             # Cleanup LDMS + Vector-LDMS
#     tasks_from: ome              # Cleanup OME + Vector-OME
#     tasks_from: powerscale       # Cleanup PowerScale
#     tasks_from: ufm              # Cleanup UFM
#     tasks_from: vast             # Cleanup VAST

#
# Calling main.yml directly is a no-op (this file).
# =============================================================================

- name: "Cleanup | No component specified"
  ansible.builtin.debug:
    msg: >-
      No cleanup component specified. Use tasks_from to select a component
      (e.g., tasks_from: kafka, tasks_from: victoria_metrics).
