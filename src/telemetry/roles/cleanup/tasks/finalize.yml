---

# ---------------------------------------------------------------------------
# Graceful skip when kube_vip is not available (telemetry not installed)
# ---------------------------------------------------------------------------
- name: Display graceful telemetry cleanup skip
  ansible.builtin.debug:
    msg:
      - "======================================================"
      - "Telemetry Cleanup — Skipped"
      - "======================================================"
      - "kube_vip is not available. Telemetry cleanup has been"
      - "skipped as telemetry is not installed or the cluster"
      - "inventory has not been configured."
      - "No telemetry status file was generated."
      - "Cleanup completed gracefully."
      - "======================================================"
  when: _cleanup_kube_vip_unavailable | default(false) | bool

# ---------------------------------------------------------------------------
# Normal finalize — runs only when kube_vip was available
# ---------------------------------------------------------------------------
- name: Finalize telemetry cleanup
  when: not (_cleanup_kube_vip_unavailable | default(false) | bool)
  block:
    - name: Normalize interrupted component cleanup
      vars:
        _interrupted_component: "{{ _cleanup_active_component | default('') }}"
      ansible.builtin.set_fact:
        _cleanup_abort: true
        _cleanup_active_component: ""
        _cleanup_component_results: >-
          {{
            _cleanup_component_results
            | combine({_interrupted_component: 'failed'})
          }}
        _cleanup_failures: >-
          {{
            _cleanup_failures
            + [{
                'component': _interrupted_component,
                'task': 'Component execution',
                'host': kube_vip | default('unknown'),
                'rc': '',
                'message': 'Cleanup execution was interrupted or the target host became unreachable'
              }]
          }}
      when:
        - _interrupted_component | length > 0
        - _cleanup_component_results[_interrupted_component] | default('') == 'attempted'

    - name: Normalize interrupted cleanup verification
      ansible.builtin.set_fact:
        _cleanup_abort: true
        _cleanup_verification_attempted: false
        _cleanup_volume_verification_failed: >-
          {{
            (_cleanup_volume_verification_failed | default(false) | bool)
            or (_cleanup_delete_sinks_volume | bool)
          }}
        _cleanup_failures: >-
          {{
            _cleanup_failures
            + [{
                'component': 'verification',
                'task': 'Final cleanup verification',
                'host': kube_vip | default('unknown'),
                'rc': '',
                'message': 'Cleanup verification was interrupted or the target host became unreachable'
              }]
          }}
      when: _cleanup_verification_attempted | default(false) | bool

    - name: Write telemetry_status.yml with cleanup status
      ansible.builtin.include_role:
        name: common
        tasks_from: write_cleanup_status

    - name: Display cleanup resource summary
      vars:
        kube_vip_host: "{{ kube_vip | default('unknown') }}"
        _kube_hostvars: >-
          {{ hostvars[kube_vip] | default({}) if kube_vip is defined else {} }}
        _pods_lines: >-
          {{
            (_kube_hostvars.remaining_pods | default({})).stdout_lines
            | default([]) | map('trim') | reject('equalto', '') | list
          }}
        _pvcs_lines: >-
          {{
            (_kube_hostvars.remaining_pvcs | default({})).stdout_lines
            | default([]) | map('trim') | reject('equalto', '') | list
          }}
        _svcs_lines: >-
          {{
            (_kube_hostvars.remaining_svcs | default({})).stdout_lines
            | default([]) | map('trim') | reject('equalto', '') | list
          }}
        _workload_lines: >-
          {{
            (_kube_hostvars.remaining_workloads | default({})).stdout_lines
            | default([]) | map('trim') | reject('equalto', '') | list
          }}
        _helm_release_lines: >-
          {{
            (_kube_hostvars.remaining_helm_releases | default({})).stdout_lines
            | default([]) | map('trim') | reject('equalto', '') | list
          }}
        _pod_count: "{{ _pods_lines | length }}"
        _pvc_count: "{{ _pvcs_lines | length }}"
        _svc_count: "{{ _svcs_lines | length }}"
        _workload_count: "{{ _workload_lines | length }}"
        _helm_release_count: "{{ _helm_release_lines | length }}"
        _helm_release_display: >-
          {{
            _helm_release_count
            if _cleanup_all | bool
            else 'not checked for granular cleanup'
          }}
        _pvc_status_display: >-
          {{ _cleanup_volume_status | default('preserved') }}
        _sink_volume_status_display: >-
          {% if not (_cleanup_all | default(false) | bool) %}
          SKIPPED - granular cleanup does not select shared sinks
          {% elif _cleanup_delete_sinks_volume | default(false) | bool %}
          deleted
          {% else %}
          preserved
          {% endif %}
        _credentials_status_display: >-
          {% if not (_cleanup_all | default(false) | bool) %}
          {% if _cleanup_preserve_credentials | default(false) | bool %}
          preserved (cleanup_credentials=false)
          {% else %}
          blanked for cleaned component
          {% endif %}
          {% elif _cleanup_preserve_credentials | default(false) | bool
                  and not (_cleanup_delete_sinks_volume | default(false) | bool) %}
          preserved (cleanup_credentials=false)
          {% else %}
          deleted
          {% endif %}
        _logs_status_display: >-
          {% if not (_cleanup_all | default(false) | bool) %}
          preserved (granular cleanup)
          {% elif _cleanup_preserve_logs | default(false) | bool
                  and not (_cleanup_delete_sinks_volume | default(false) | bool) %}
          preserved (cleanup_logs=false)
          {% elif _cleanup_delete_sinks_volume | default(false) | bool %}
          deleted
          {% else %}
          deleted
          {% endif %}
      ansible.builtin.debug:
        msg:
          - "======================================================"
          - "Telemetry Cleanup Resource Summary"
          - "======================================================"
          - "Target Host: {{ kube_vip_host }}"
          - ""
          - "Remaining pods:     {{ _pod_count }}"
          - "Namespace PVCs: {{ _pvc_count }}"
          - "Selected component volumes: {{ _pvc_status_display }}"
          - "Shared sink volumes: {{ _sink_volume_status_display | trim }}"
          - "Credentials: {{ _credentials_status_display | trim }}"
          - "Logs: {{ _logs_status_display | trim }}"
          - "Remaining services: {{ _svc_count }}"
          - "Remaining workloads: {{ _workload_count }}"
          - "Remaining Helm releases: {{ _helm_release_display }}"
          - "======================================================"
          - ""
          - "Deleting the telemetry namespace also deletes preserved PVC objects."
      when:
        - _cleanup_status != 'failed'
        - _kube_hostvars.remaining_pods is defined
        - _kube_hostvars.remaining_pvcs is defined
        - _kube_hostvars.remaining_svcs is defined

    - name: Explain shared sink volume preservation for granular cleanup
      ansible.builtin.debug:
        msg:
          - "Shared sink volume cleanup: SKIPPED"
          - >-
            Reason: {{ ansible_run_tags | reject('equalto', 'always') | join(', ') }}
            is a granular component cleanup and does not select the shared Kafka,
            VictoriaMetrics, or VictoriaLogs sinks. These sinks may still be used
            by other telemetry sources.
          - >-
            To remove all telemetry components and shared sink volumes, run:
            ./omnia.sh --run telemetry --tags cleanup -e Delete_sinks_volume=true
      when:
        - not (_cleanup_all | default(false) | bool)
        - _cleanup_status != 'failed'

    - name: Fail telemetry cleanup after status is written
      vars:
        _failed_components: >-
          {{ _cleanup_failures | map(attribute='component') | unique | list }}
      ansible.builtin.fail:
        msg: >-
          Telemetry cleanup failed in {{ _failed_components | join(', ') }}.
          Status was written to {{ _output_base }}/telemetry_status.yml.
      when: _cleanup_status == 'failed'

    # -----------------------------------------------------------------------
    # Remove telemetry log, input, and output directories after a successful
    # full cleanup. Log directory and stray artifacts honour cleanup_logs:
    #   - cleanup_logs=false preserves logs during cleanup without volume
    #   - Delete_sinks_volume=true overrides cleanup_logs and deletes all
    # Input and output directories are only removed during cleanup with
    # volume (Delete_sinks_volume=true).
    # If cleanup failed above, execution stops at the fail task and
    # directories are preserved so the user can inspect input values.
    # -----------------------------------------------------------------------
    - name: Set telemetry data path for directory cleanup
      ansible.builtin.set_fact:
        _cleanup_telemetry_data_path: >-
          {{ telemetry_data_path
             | default(omnia_data_path | default('/opt/omnia') + '/telemetry') }}

    # Log directory cleanup honours the cleanup_logs flag. When
    # cleanup_logs=false the log directory is preserved during cleanup
    # without volume. Delete_sinks_volume=true overrides the flag.
    - name: Remove telemetry log directory
      ansible.builtin.file:
        path: "{{ _cleanup_telemetry_data_path }}/log"
        state: absent
      when:
        - _cleanup_all | default(false) | bool
        - >-
          not (_cleanup_preserve_logs | default(false) | bool)
          or (_cleanup_delete_sinks_volume | default(false) | bool)

    - name: Remove telemetry input and output directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ _cleanup_telemetry_data_path }}/input"
        - "{{ _cleanup_telemetry_data_path }}/output"
      when:
        - _cleanup_all | default(false) | bool
        - _cleanup_delete_sinks_volume | default(false) | bool

    - name: Remove stray telemetry artifacts from data path
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ _cleanup_telemetry_data_path }}/idrac_telemetry_report.yml"
      when:
        - _cleanup_all | default(false) | bool
        - >-
          not (_cleanup_preserve_logs | default(false) | bool)
          or (_cleanup_delete_sinks_volume | default(false) | bool)
