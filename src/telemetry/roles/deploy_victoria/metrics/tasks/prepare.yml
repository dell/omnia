---

# =============================================================================
# deploy_victoria/metrics — Prepare: download operator package + generate manifests
# =============================================================================

- name: Load role variables
  ansible.builtin.include_vars: "{{ role_path }}/metrics/vars/main.yml"

- name: Prepare VictoriaMetrics operator package (common)
  ansible.builtin.include_tasks: ../../common/tasks/prepare_operator.yml

- name: Configure TLS certificate for victoria_metrics
  when:
    - victoria_cluster.tls_enabled | default(false) | bool
  block:
    - name: Create victoria_metrics certificate directory
      ansible.builtin.file:
        path: "{{ victoria_cert_dir }}"
        state: directory
        mode: "{{ dir_permissions_755 }}"

    - name: Deploy victoria_metrics certificate generation script
      ansible.builtin.template:
        src: "{{ role_path }}/metrics/templates/gen_victoria_certs.sh.j2"
        dest: "{{ telemetry_deployments_dir }}/gen_victoria_certs.sh"
        mode: "{{ file_permissions_755 }}"
        force: true

    - name: Generate victoria_metrics TLS certificates
      ansible.builtin.command:
        cmd: "{{ telemetry_deployments_dir }}/gen_victoria_certs.sh"
      changed_when: false

    - name: Read victoria_metrics server certificate
      ansible.builtin.slurp:
        src: "{{ victoria_cert_dir }}/server.crt"
      register: victoria_server_cert
      no_log: true

    - name: Read victoria_metrics server key
      ansible.builtin.slurp:
        src: "{{ victoria_cert_dir }}/server.key"
      register: victoria_server_key
      no_log: true

    - name: Read victoria_metrics CA certificate
      ansible.builtin.slurp:
        src: "{{ victoria_cert_dir }}/ca.crt"
      register: victoria_ca_cert
      no_log: true

    - name: Set certificate variables for template
      ansible.builtin.set_fact:
        victoria_server_cert_b64: "{{ victoria_server_cert.content }}"
        victoria_server_key_b64: "{{ victoria_server_key.content }}"
        victoria_ca_cert_b64: "{{ victoria_ca_cert.content }}"
      no_log: true

- name: Generate VictoriaMetrics TLS secret manifest
  ansible.builtin.template:
    src: "{{ role_path }}/metrics/templates/victoria-tls-secret.yaml.j2"
    dest: "{{ telemetry_deployments_dir }}/victoria-tls-secret.yaml"
    mode: "{{ victoria_file_mode }}"
    force: true
  when:
    - victoria_server_cert_b64 is defined
    - victoria_server_key_b64 is defined
    - victoria_ca_cert_b64 is defined

- name: Generate VictoriaMetrics RBAC manifest
  ansible.builtin.template:
    src: "{{ role_path }}/metrics/templates/victoria-vmagent-rbac.yaml.j2"
    dest: "{{ telemetry_deployments_dir }}/victoria-vmagent-rbac.yaml"
    mode: "{{ victoria_file_mode }}"
    force: true
  failed_when: false

- name: Generate VMCluster CR manifest
  ansible.builtin.template:
    src: "{{ role_path }}/metrics/templates/victoria-operator-vmcluster.yaml.j2"
    dest: "{{ telemetry_deployments_dir }}/victoria-operator-vmcluster.yaml"
    mode: "{{ victoria_file_mode }}"
    force: true

- name: Generate VMAgent CR manifest
  ansible.builtin.template:
    src: "{{ role_path }}/metrics/templates/victoria-operator-vmagent.yaml.j2"
    dest: "{{ telemetry_deployments_dir }}/victoria-operator-vmagent.yaml"
    mode: "{{ victoria_file_mode }}"
    force: true

- name: Check health monitor status for CSI volume exporter scrape
  ansible.builtin.command: >
    kubectl get pods -n isilon -l app=isilon-controller -o jsonpath='{.items[0].metadata.name}'
  register: isilon_pod
  changed_when: false
  failed_when: false
  when: telemetry_config.telemetry_sources.powerscale.metrics_enabled | default(false) | bool

- name: Check if external-health-monitor-controller container is running
  ansible.builtin.command: >
    kubectl get pod {{ isilon_pod.stdout }} -n isilon -o jsonpath='{.status.containerStatuses[?(@.name=="external-health-monitor-controller")].ready}'
  register: health_monitor_ready
  changed_when: false
  failed_when: false
  when:
    - isilon_pod.stdout | length > 0
    - telemetry_config.telemetry_sources.powerscale.metrics_enabled | default(false) | bool

- name: Set powerscale_volume_health_enabled fact
  ansible.builtin.set_fact:
    powerscale_volume_health_enabled: >-
      {{ (health_monitor_ready.stdout | default('false')) == 'true' }}
  when:
    - isilon_pod.stdout | length > 0
    - telemetry_config.telemetry_sources.powerscale.metrics_enabled | default(false) | bool

- name: Set powerscale_volume_health_enabled to false if pod not found
  ansible.builtin.set_fact:
    powerscale_volume_health_enabled: false
  when:
    - isilon_pod.stdout | length == 0
    - telemetry_config.telemetry_sources.powerscale.metrics_enabled | default(false) | bool

- name: Set powerscale_volume_health_enabled to false if PowerScale metrics not enabled
  ansible.builtin.set_fact:
    powerscale_volume_health_enabled: false
  when: not (telemetry_config.telemetry_sources.powerscale.metrics_enabled | default(false) | bool)

- name: Generate VMPodScrape CR manifest
  ansible.builtin.template:
    src: "{{ role_path }}/metrics/templates/victoria-operator-vmscrape.yaml.j2"
    dest: "{{ telemetry_deployments_dir }}/victoria-operator-vmscrape.yaml"
    mode: "{{ victoria_file_mode }}"
    force: true
  vars:
    csi_volume_exporter:
      app_name: "csi-volume-exporter"
      metrics_port: 9090
      scrape_interval: "30s"
