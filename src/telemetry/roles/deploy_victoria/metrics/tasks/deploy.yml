---

# =============================================================================
# deploy_victoria_metrics — Deploy: install operator + apply metrics manifests
# =============================================================================

- name: Ensure telemetry namespace exists
  ansible.builtin.command: >
    kubectl create namespace {{ telemetry_namespace }} --dry-run=client -o yaml
  register: ns_yaml
  changed_when: false

- name: Apply telemetry namespace
  ansible.builtin.command: kubectl apply -f -
  args:
    stdin: "{{ ns_yaml.stdout }}"
  register: ns_result
  changed_when: "'created' in ns_result.stdout | default('')"

- name: Check if VictoriaMetrics operator is installed (Helm release)
  ansible.builtin.command: >
    helm status victoria-metrics-operator -n {{ telemetry_namespace }}
  register: victoria_operator_status
  changed_when: false
  failed_when: false

# ---------------------------------------------------------------------------
# Parse operator and config_reloader images from telemetry_registry
# ---------------------------------------------------------------------------
# Offline mode with container_registry set:
#   When telemetry_registry.host is set (e.g., "myregistry:5000"), use that as the registry
#   and strip the original registry prefix (docker.io/, quay.io/) from the repository.
#
# Online mode (or offline without container_registry):
#   Use the original registry from the image URL in telemetry_packages.yml.
- name: Parse operator image components from telemetry_registry
  vars:
    _operator_image: "{{ telemetry_registry.images.victoria_operator.operator | default('docker.io/victoriametrics/operator:v0.68.3') }}"
    _config_reloader_image: >-
      {{ telemetry_registry.images.victoria_operator.config_reloader |
      default('docker.io/victoriametrics/operator:config-reloader-v0.68.3') }}
    _custom_registry: "{{ telemetry_registry.host | default('') }}"
  ansible.builtin.set_fact:
    _operator_image_tag: "{{ _operator_image.split(':')[-1] }}"
    _operator_image_without_tag: "{{ _operator_image | regex_replace(':[^:]+$', '') }}"
    _config_reloader_image_tag: "{{ _config_reloader_image.split(':')[-1] }}"
    _config_reloader_image_without_tag: "{{ _config_reloader_image | regex_replace(':[^:]+$', '') }}"
    _custom_registry: "{{ _custom_registry }}"
  when: victoria_operator_pkg is defined

- name: Set operator image registry and repository (with custom registry override)
  vars:
    _parts: "{{ _operator_image_without_tag.split('/') }}"
    _repo_without_registry: "{{ '/'.join(_parts[1:]) if (_parts | length) > 2 or '.' in _parts[0] else '/'.join(_parts) }}"
    _original_registry: "{{ _parts[0] if (_parts | length) > 2 or '.' in _parts[0] else 'docker.io' }}"
  ansible.builtin.set_fact:
    _operator_registry: "{{ _custom_registry if _custom_registry else _original_registry }}"
    _operator_repository: "{{ _repo_without_registry }}"
  when: victoria_operator_pkg is defined

- name: Set config_reloader image registry and repository (with custom registry override)
  vars:
    _parts: "{{ _config_reloader_image_without_tag.split('/') }}"
    _repo_without_registry: "{{ '/'.join(_parts[1:]) if (_parts | length) > 2 or '.' in _parts[0] else '/'.join(_parts) }}"
    _original_registry: "{{ _parts[0] if (_parts | length) > 2 or '.' in _parts[0] else 'docker.io' }}"
  ansible.builtin.set_fact:
    _config_reloader_registry: "{{ _custom_registry if _custom_registry else _original_registry }}"
    _config_reloader_repository: "{{ _repo_without_registry }}"
  when: victoria_operator_pkg is defined

- name: Build Helm image override arguments
  ansible.builtin.set_fact:
    _helm_image_args: >-
      --set image.registry={{ _operator_registry }}
      --set image.repository={{ _operator_repository }}
      --set image.tag={{ _operator_image_tag }}
      --set configReloader.image.registry={{ _config_reloader_registry }}
      --set configReloader.image.repository={{ _config_reloader_repository }}
      --set configReloader.image.tag={{ _config_reloader_image_tag }}
  when: victoria_operator_pkg is defined

- name: Install VictoriaMetrics operator
  ansible.builtin.command: >
    helm -n {{ telemetry_namespace }} install victoria-metrics-operator
    {{ victoria_operator_pkg }}
    {{ _helm_image_args }}
  when:
    - victoria_operator_status.rc != 0
    - victoria_operator_pkg is defined
  changed_when: true

- name: Upgrade VictoriaMetrics operator
  ansible.builtin.command: >
    helm -n {{ telemetry_namespace }} upgrade victoria-metrics-operator
    {{ victoria_operator_pkg }}
    {{ _helm_image_args }}
  when:
    - victoria_operator_status.rc == 0
    - victoria_operator_pkg is defined
  changed_when: true

- name: Skip operator install (already present, no tarball configured)
  ansible.builtin.debug:
    msg: "{{ victoria_operator_skip_msg }}"
  when:
    - victoria_operator_status.rc == 0
    - victoria_operator_pkg is not defined

- name: Fail if operator not installed and no tarball available
  ansible.builtin.fail:
    msg: "{{ victoria_operator_not_installed_msg }}"
  when:
    - victoria_operator_status.rc != 0
    - victoria_operator_pkg is not defined

- name: Wait for VictoriaMetrics operator deployment
  ansible.builtin.command: >
    kubectl wait --for=condition=available --timeout={{ victoria_operator_wait_timeout }}
    deployment -l app.kubernetes.io/name=victoria-metrics-operator -n {{ telemetry_namespace }}
  changed_when: false
  register: vm_operator_wait
  failed_when: false

- name: VictoriaMetrics operator not ready
  ansible.builtin.fail:
    msg: "{{ vm_operator_not_ready_msg }}"
  when: vm_operator_wait.rc != 0

- name: Wait for VictoriaMetrics CRDs
  ansible.builtin.command: kubectl get crd {{ item }}
  loop:
    - vmclusters.operator.victoriametrics.com
    - vmagents.operator.victoriametrics.com
    - vmpodscrapes.operator.victoriametrics.com
  register: vm_crd_check
  retries: "{{ victoria_crd_wait_retries }}"
  delay: "{{ victoria_crd_wait_delay }}"
  until: vm_crd_check.rc == 0
  changed_when: false

- name: Check which manifests exist on remote
  ansible.builtin.stat:
    path: "{{ telemetry_deployments_dir }}/{{ item }}"
  loop:
    - victoria-tls-secret.yaml
    - victoria-vmagent-rbac.yaml
    - victoria-operator-vmcluster.yaml
    - victoria-operator-vmagent.yaml
    - victoria-operator-vmscrape.yaml
  register: manifest_stats

- name: Build manifest existence map
  ansible.builtin.set_fact:
    _vm_manifests: "{{ dict(manifest_stats.results | map(attribute='item') | zip(manifest_stats.results | map(attribute='stat') | map(attribute='exists'))) }}"

- name: Apply VictoriaMetrics TLS secret
  ansible.builtin.command: >
    kubectl apply -f {{ telemetry_deployments_dir }}/victoria-tls-secret.yaml
  register: tls_apply
  changed_when: "'created' in tls_apply.stdout or 'configured' in tls_apply.stdout"
  when: _vm_manifests['victoria-tls-secret.yaml'] | default(false)
  failed_when: false

- name: Apply VictoriaMetrics RBAC
  ansible.builtin.command: >
    kubectl apply -f {{ telemetry_deployments_dir }}/victoria-vmagent-rbac.yaml
  register: rbac_apply
  changed_when: "'created' in rbac_apply.stdout or 'configured' in rbac_apply.stdout"
  when: _vm_manifests['victoria-vmagent-rbac.yaml'] | default(false)
  failed_when: false

- name: Apply VMCluster CR
  ansible.builtin.command: >
    kubectl apply -f {{ telemetry_deployments_dir }}/victoria-operator-vmcluster.yaml
  register: vmcluster_apply
  changed_when: "'created' in vmcluster_apply.stdout or 'configured' in vmcluster_apply.stdout"
  when: _vm_manifests['victoria-operator-vmcluster.yaml'] | default(false)

- name: Apply VMAgent CR
  ansible.builtin.command: >
    kubectl apply -f {{ telemetry_deployments_dir }}/victoria-operator-vmagent.yaml
  register: vmagent_apply
  changed_when: "'created' in vmagent_apply.stdout or 'configured' in vmagent_apply.stdout"
  when: _vm_manifests['victoria-operator-vmagent.yaml'] | default(false)

- name: Apply VMPodScrape CR
  ansible.builtin.command: >
    kubectl apply -f {{ telemetry_deployments_dir }}/victoria-operator-vmscrape.yaml
  register: vmscrape_apply
  changed_when: "'created' in vmscrape_apply.stdout or 'configured' in vmscrape_apply.stdout"
  when: _vm_manifests['victoria-operator-vmscrape.yaml'] | default(false)
  failed_when: false
