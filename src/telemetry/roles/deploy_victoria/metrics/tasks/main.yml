# =============================================================================
# deploy_victoria/metrics — VictoriaMetrics operator + metrics CRs
# =============================================================================
# Deploys VictoriaMetrics operator + VMCluster/VMAgent/VMScrape into telemetry namespace.
# Idempotent: skips if already deployed, upgrades if present.
#
# Consumed by: deploy_idrac_telemetry, deploy_powerscale, etc.
# Condition: victoria_metrics_support == true
#
# Flow: prepare (download package + generate manifests) → deploy (apply manifests)
# =============================================================================

- name: Prepare VictoriaMetrics packages and manifests
  ansible.builtin.include_tasks: ../../metrics/tasks/prepare.yml

- name: Check if VictoriaMetrics operator is deployed
  ansible.builtin.command: >
    helm status victoria-metrics-operator -n {{ telemetry_namespace }}
  register: victoria_operator_status
  changed_when: false
  failed_when: false

- name: Check if VMCluster is already deployed
  ansible.builtin.command: >
    kubectl get vmcluster -n {{ telemetry_namespace }} -o name
  register: vmcluster_existing
  changed_when: false
  failed_when: false

- name: Skip VictoriaMetrics deployment if already running
  ansible.builtin.debug:
    msg: "VictoriaMetrics already deployed in {{ telemetry_namespace }}: {{ vmcluster_existing.stdout | default('operator present') }}"
  when:
    - victoria_operator_status.rc == 0
    - vmcluster_existing.rc == 0
    - vmcluster_existing.stdout | length > 0

- name: Deploy VictoriaMetrics
  when: victoria_operator_status.rc != 0 or vmcluster_existing.stdout | default('') | length == 0
  block:
    - name: Run VictoriaMetrics deployment
      ansible.builtin.include_tasks: ../../metrics/tasks/deploy.yml

- name: Verify VMCluster is ready
  ansible.builtin.command: >
    kubectl get vmcluster -n {{ telemetry_namespace }}
    -o jsonpath='{.items[0].status.clusterStatus}'
  register: vmcluster_status
  changed_when: false
  failed_when: false
  retries: 30
  delay: 10
  until: "'operational' in vmcluster_status.stdout | default('')"

- name: Set victoria_metrics_deployed fact
  ansible.builtin.set_fact:
    victoria_metrics_deployed: "{{ vmcluster_status.rc | default(1) == 0 }}"
    cacheable: true

- name: Log VictoriaMetrics deployment result
  ansible.builtin.debug:
    msg: "VictoriaMetrics deployment: {{ 'READY' if victoria_metrics_deployed else 'PENDING (cluster may still be initializing)' }}"
