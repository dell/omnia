---

# File permissions for metrics deployment
file_permissions_755: "0755"
file_permissions_644: "0644"
dir_permissions_755: "0755"

# VMAgent configuration
vmagent:
  service_account_name: "victoria-metrics-agent"
  role_name: "victoria-metrics-agent"
  rolebinding_name: "victoria-metrics-agent"
  image: "{{ hostvars['localhost']['telemetry_registry'].images.victoria.vmagent | default('victoriametrics/vmagent:v1.153.0@sha256:474135388ae700b842007d3e186a8ae60ccf7de3dfd776fb6ed27cf8522d8331') }}"
  remote_write_url_cluster: "https://vminsert-victoria-cluster.{{ telemetry_namespace }}.svc:8480/insert/0/prometheus/"
  remote_write_url: "http://vminsert-single.{{ telemetry_namespace }}.svc:8428/insert/0/prometheus/"
  target_pod_label: "idrac-telemetry"
  kubernetes_sd_namespace: "{{ telemetry_namespace }}"
  metrics_container_name: "victoria-pump"
  global:
    scrape_interval: "30s"

# VictoriaCluster configuration
victoria_cluster:
  enabled: "{{ true if victoria_deployment_mode == 'cluster' else false }}"
  tls_enabled: true
  termination_grace_period: 120
  toleration_seconds: 300
  startup_probe:
    initial_delay: 30
    period: 10
    failure_threshold: 30
    timeout: 5
  readiness_probe:
    initial_delay: 10
    period: 10
    failure_threshold: 3
    timeout: 5
  vmstorage:
    replicas: "{{ hostvars['localhost']['telemetry_storage_config'].victoria_cluster_storage.vmstorage.replicas | default(2) }}"
    replication_factor: 1
    image: "{{ hostvars['localhost']['telemetry_registry'].images.victoria.vmstorage | default('victoriametrics/vmstorage:v1.153.0-cluster@sha256:83e67bde1b2aa23b8393b0165c427cbd413696c9398cbdd75a709422786747f4') }}"
    dedup_min_scrape_interval: ""
    resources: "{{ hostvars['localhost']['telemetry_storage_config'].victoria_cluster_storage.vmstorage.resources }}"
  vmselect:
    replicas: "{{ hostvars['localhost']['telemetry_storage_config'].victoria_cluster_storage.vmselect.replicas | default(2) }}"
    image: "{{ hostvars['localhost']['telemetry_registry'].images.victoria.vmselect | default('victoriametrics/vmselect:v1.153.0-cluster@sha256:3a593a1d02f765f366f50712c68d0e9418ab04f07a61517882bdb7ff620b0f38') }}"
    max_query_duration: "30s"
    max_concurrent_requests: "1000"
    cache_data_path: true
    resources: "{{ hostvars['localhost']['telemetry_storage_config'].victoria_cluster_storage.vmselect.resources }}"
  vminsert:
    replicas: "{{ hostvars['localhost']['telemetry_storage_config'].victoria_cluster_storage.vminsert.replicas | default(2) }}"
    image: "{{ hostvars['localhost']['telemetry_registry'].images.victoria.vminsert | default('victoriametrics/vminsert:v1.153.0-cluster@sha256:629d128af12ff951ad3bb2c3b2d45edb77fb561ce6b29ed644b8039e2bf218a7') }}"
    external_access: true
    resources: "{{ hostvars['localhost']['telemetry_storage_config'].victoria_cluster_storage.vminsert.resources }}"
  vmagent:
    replicas: "{{ hostvars['localhost']['telemetry_storage_config'].victoria_cluster_storage.vmagent.replicas | default(2) }}"
    resources: "{{ hostvars['localhost']['telemetry_storage_config'].victoria_cluster_storage.vmagent.resources }}"

# Rescue failure messages for VictoriaMetrics TLS secret tasks (no_log tasks, details suppressed)
victoria_tls_secret_apply_fail_msg: >-
  Failed to apply the VictoriaMetrics TLS secret.
  Likely causes: the Kubernetes cluster is unreachable, the victoria-tls-secret.yaml manifest is missing or malformed
  (certificate generation may have failed), the target namespace does not exist, or the user lacks RBAC to create secrets.
  Check: 'kubectl cluster-info', 'kubectl auth can-i create secrets -n <namespace>', and that 'victoria-tls-secret.yaml'
  exists in the telemetry deployments directory and is non-empty. Error details suppressed (no_log).

victoria_tls_secret_manifest_fail_msg: >-
  Failed to generate the VictoriaMetrics TLS secret manifest.
  Likely causes: the server certificate, server key, or CA certificate could not be read from the victoria cert directory
  (gen_victoria_certs.sh may have failed or not run), a template variable is undefined, or the deployments directory is not writable.
  Check: that 'server.crt', 'server.key', and 'ca.crt' exist and are non-empty in the victoria cert directory,
  that gen_victoria_certs.sh completed successfully, and the write permissions on the telemetry deployments directory.
  Error details suppressed (no_log).

# VictoriaLogs Cluster configuration
victoria_logs_cluster:
  tls_enabled: true
  vlstorage:
    replicas: "{{ hostvars['localhost']['telemetry_storage_config'].victoria_logs_cluster_storage.vlstorage.replicas | default(2) }}"
    image: "{{ hostvars['localhost']['telemetry_registry'].images.victoria.vlstorage | default('victoriametrics/victoria-logs:v1.53.0@sha256:251121fa882af99b95ba0c230a4a2f412ea602d2698c64a96c58dc9842bb755d') }}"
    termination_grace_period: 120
    toleration_seconds: 300
    startup_probe:
      initial_delay: 30
      period: 10
      failure_threshold: 30
      timeout: 5
    readiness_probe:
      initial_delay: 10
      period: 10
      failure_threshold: 3
      timeout: 5
    resources: "{{ hostvars['localhost']['telemetry_storage_config'].victoria_logs_cluster_storage.vlstorage.resources }}"
  vlselect:
    replicas: "{{ hostvars['localhost']['telemetry_storage_config'].victoria_logs_cluster_storage.vlselect.replicas | default(2) }}"
    image: "{{ hostvars['localhost']['telemetry_registry'].images.victoria.vlselect | default('victoriametrics/victoria-logs:v1.53.0@sha256:251121fa882af99b95ba0c230a4a2f412ea602d2698c64a96c58dc9842bb755d') }}"
    resources: "{{ hostvars['localhost']['telemetry_storage_config'].victoria_logs_cluster_storage.vlselect.resources }}"
  vlinsert:
    replicas: "{{ hostvars['localhost']['telemetry_storage_config'].victoria_logs_cluster_storage.vlinsert.replicas | default(2) }}"
    image: "{{ hostvars['localhost']['telemetry_registry'].images.victoria.vlinsert | default('victoriametrics/victoria-logs:v1.53.0@sha256:251121fa882af99b95ba0c230a4a2f412ea602d2698c64a96c58dc9842bb755d') }}"
    external_access: true
    resources: "{{ hostvars['localhost']['telemetry_storage_config'].victoria_logs_cluster_storage.vlinsert.resources }}"
  vlagent:
    replicas: "{{ hostvars['localhost']['telemetry_storage_config'].victoria_logs_cluster_storage.vlagent.replicas | default(2) }}"
    image: "{{ hostvars['localhost']['telemetry_registry'].images.victoria.vlagent | default('victoriametrics/vlagent:v1.53.0@sha256:a82f93ffecc153fb068606903e512368b070272739d823abe99fad0eff6e1849') }}"
    pvc_size: "5Gi"
    termination_grace_period: 120
    toleration_seconds: 300
    liveness_probe:
      initial_delay: 30
      period: 10
      failure_threshold: 3
      timeout: 5
    readiness_probe:
      initial_delay: 10
      period: 10
      failure_threshold: 3
      timeout: 5
    resources: "{{ hostvars['localhost']['telemetry_storage_config'].victoria_logs_cluster_storage.vlagent.resources }}"

# Error messages
vm_operator_not_ready_msg: >-
  VM operator not ready within {{ victoria_operator_wait_timeout }}.
  Check: kubectl -n {{ telemetry_namespace }} get pods
  -l app.kubernetes.io/name=victoria-metrics-operator
