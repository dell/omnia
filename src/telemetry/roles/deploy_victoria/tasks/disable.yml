# =============================================================================
# deploy_victoria — Disable VictoriaMetrics infrastructure
# =============================================================================
# Scales down VictoriaMetrics StatefulSet to 0 replicas when no telemetry
# sources require VictoriaMetrics.
#
# This stops VictoriaMetrics infrastructure but preserves PVCs for future
# re-enablement.
# =============================================================================

- name: Load telemetry configuration
  ansible.builtin.include_role:
    name: common
    tasks_from: load_telemetry_config

- name: Check if VictoriaMetrics StatefulSet exists
  ansible.builtin.command: >
    kubectl get statefulset {{ victoria_statefulset_name }} -n {{ telemetry_namespace }}
  register: victoria_sts_check
  changed_when: false
  failed_when: false

- name: Scale down VictoriaMetrics StatefulSet to 0
  ansible.builtin.command: >
    kubectl scale statefulset {{ victoria_statefulset_name }}
    -n {{ telemetry_namespace }} --replicas=0
  register: scale_down_victoria_result
  changed_when: "'scaled' in scale_down_victoria_result.stdout"
  when: victoria_sts_check.rc == 0

- name: Display VictoriaMetrics scale down result
  ansible.builtin.debug:
    msg: "{{ victoria_scale_down_msg }}"
  when: victoria_sts_check.rc == 0

- name: VictoriaMetrics StatefulSet not found - nothing to scale down
  ansible.builtin.debug:
    msg: "{{ victoria_not_found_msg }}"
  when: victoria_sts_check.rc != 0
