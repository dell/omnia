# =============================================================================
# deploy_victoria — Orchestrator
# =============================================================================
# Consolidated role for enabling or disabling VictoriaMetrics.
# Auto-determines state from telemetry_config.yml:
#   Victoria is enabled when any source has "victoria_metrics" or
#   "victoria_logs" in collection_targets.
#
# Enable: Deploys VictoriaMetrics metrics and logs stacks.
# Disable: Scales down VictoriaMetrics StatefulSet to 0 replicas.
# =============================================================================

- name: Load telemetry configuration
  ansible.builtin.include_role:
    name: common
    tasks_from: load_telemetry_config
  when: telemetry_config is not defined

- name: Determine VictoriaMetrics state from config
  ansible.builtin.set_fact:
    victoria_enabled: >-
      {{
        (hostvars['localhost']['victoria_metrics_support'] | default(false) | bool) or
        (hostvars['localhost']['victoria_logs_support'] | default(false) | bool)
      }}
  when: telemetry_config is defined

- name: Enable VictoriaMetrics
  ansible.builtin.include_tasks: enable.yml
  when: victoria_enabled | default(false) | bool

- name: Disable VictoriaMetrics
  ansible.builtin.include_tasks: disable.yml
  when: not (victoria_enabled | default(false) | bool)
