# =============================================================================
# deploy_victoria — Shared VictoriaMetrics deployment orchestrator
# =============================================================================
# Invoked by any telemetry enablement that has 'victoria_metrics' or
# 'victoria_logs' in collection_targets.
# Conditionally runs metrics/ and logs/ sub-roles.
#
# Variables expected from hostvars['localhost']:
#   - telemetry_config
#   - telemetry_packages_config
#   - cluster_mount
# =============================================================================

- name: Deploy VictoriaMetrics metrics stack
  ansible.builtin.include_tasks: "{{ role_path }}/metrics/tasks/main.yml"
  when: hostvars['localhost']['victoria_metrics_support'] | default(false) | bool

- name: Deploy VictoriaLogs logs stack
  ansible.builtin.include_tasks: "{{ role_path }}/logs/tasks/main.yml"
  when: hostvars['localhost']['victoria_logs_support'] | default(false) | bool
