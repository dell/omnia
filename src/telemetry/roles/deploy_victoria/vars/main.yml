---

# Shared VictoriaMetrics deployment role
# Invoked by any telemetry enablement that has 'victoria_metrics' in collection_targets

telemetry_namespace: "telemetry"

# Variables from localhost (set when role runs on kube_vip_group)
telemetry_config: "{{ hostvars['localhost']['telemetry_config'] }}"
telemetry_packages_config: "{{ hostvars['localhost']['telemetry_packages_config'] }}"
cluster_mount: "{{ hostvars['localhost']['cluster_mount'] }}"

# Deploy directory
telemetry_deploy_dir: "{{ cluster_mount }}/telemetry"
telemetry_deployments_dir: "{{ telemetry_deploy_dir }}/deployments"

# VictoriaMetrics Cluster Configuration
victoria_deployment_mode: "cluster"
victoria_cluster:
  enabled: "{{ true if victoria_deployment_mode == 'cluster' else false }}"
  tls_enabled: true

# Certificate directory
victoria_cert_dir: "{{ telemetry_deploy_dir }}/certs/victoria"

# Timeouts
victoria_deploy_timeout: "600s"
victoria_crd_wait_retries: 60
victoria_crd_wait_delay: 2

# Disable-specific variables
victoria_statefulset_name: "vmsingle"
victoria_scale_down_msg: "Scaling down VictoriaMetrics StatefulSet to 0 replicas"
victoria_not_found_msg: "VictoriaMetrics StatefulSet not found, nothing to scale down"
