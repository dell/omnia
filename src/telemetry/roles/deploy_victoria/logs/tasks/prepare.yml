# =============================================================================
# deploy_victoria/logs — Prepare: generate VictoriaLogs manifests
# =============================================================================
# Operator package download is handled by common/prepare_operator.yml

- name: Ensure operator package is prepared (common)
  ansible.builtin.include_tasks: ../../common/tasks/prepare_operator.yml

- name: Generate VLCluster CR manifest
  ansible.builtin.template:
    src: "{{ role_path }}/logs/templates/victorialogs-operator-vlcluster.yaml.j2"
    dest: "{{ telemetry_deployments_dir }}/victorialogs-operator-vlcluster.yaml"
    mode: "{{ victoria_file_mode }}"

- name: Generate VLAgent CR manifest
  ansible.builtin.template:
    src: "{{ role_path }}/logs/templates/victorialogs-operator-vlagent.yaml.j2"
    dest: "{{ telemetry_deployments_dir }}/victorialogs-operator-vlagent.yaml"
    mode: "{{ victoria_file_mode }}"
