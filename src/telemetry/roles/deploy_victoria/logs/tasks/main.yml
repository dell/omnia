# =============================================================================
# deploy_victoria/logs — VictoriaLogs CRs (VLCluster + VLAgent)
# =============================================================================
# Deploys VictoriaLogs CRs into telemetry namespace.
# Requires victoria-metrics-operator already installed (by deploy_victoria/metrics).
# Idempotent: skips if already deployed.
#
# Consumed by: deploy_powerscale (logs), deploy_ufm (logs), etc.
# Condition: victoria_logs_support == true
#
# Flow: prepare (generate manifests) → deploy (apply CRs)
# =============================================================================

- name: Prepare VictoriaLogs manifests
  ansible.builtin.include_tasks: ../../logs/tasks/prepare.yml

- name: Check if VLCluster is already deployed
  ansible.builtin.command: >
    kubectl get vlcluster -n {{ telemetry_namespace }} -o name
  register: vlcluster_existing
  changed_when: false
  failed_when: false

- name: Skip VictoriaLogs deployment if already running
  ansible.builtin.debug:
    msg: "VictoriaLogs already deployed in {{ telemetry_namespace }}: {{ vlcluster_existing.stdout }}"
  when: vlcluster_existing.rc == 0 and vlcluster_existing.stdout | length > 0

- name: Deploy VictoriaLogs
  when: vlcluster_existing.rc != 0 or vlcluster_existing.stdout | default('') | length == 0
  block:
    - name: Run VictoriaLogs deployment
      ansible.builtin.include_tasks: ../../logs/tasks/deploy.yml

- name: Verify VLCluster is ready
  ansible.builtin.command: >
    kubectl get vlcluster -n {{ telemetry_namespace }} -o name
  register: vlcluster_status
  changed_when: false
  failed_when: false
  retries: 30
  delay: 10
  until: vlcluster_status.rc == 0 and vlcluster_status.stdout | length > 0

- name: Set victoria_logs_deployed fact
  ansible.builtin.set_fact:
    victoria_logs_deployed: "{{ vlcluster_status.rc | default(1) == 0 }}"
    cacheable: true

- name: Log VictoriaLogs deployment result
  ansible.builtin.debug:
    msg: "VictoriaLogs deployment: {{ 'READY' if victoria_logs_deployed else 'PENDING (cluster may still be initializing)' }}"
