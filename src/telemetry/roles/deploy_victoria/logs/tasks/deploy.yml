---

# =============================================================================
# deploy_victoria_logs — Deploy: ensure operator + wait for CRDs + apply logs CRs
# =============================================================================
# Auto-installs victoria-metrics-operator if not already present.
# Can be deployed independently without deploy_victoria_metrics.

- name: Ensure telemetry namespace exists
  ansible.builtin.command: >
    kubectl create namespace {{ telemetry_namespace }} --dry-run=client -o yaml
  register: ns_yaml
  changed_when: false

- name: Apply telemetry namespace
  ansible.builtin.command: kubectl apply -f -
  args:
    stdin: "{{ ns_yaml.stdout }}"
  register: ns_result
  changed_when: "'created' in ns_result.stdout | default('')"

- name: Check if VictoriaMetrics operator is already installed
  ansible.builtin.command: >
    helm status victoria-metrics-operator -n {{ telemetry_namespace }}
  register: operator_check
  changed_when: false
  failed_when: false

- name: Install VictoriaMetrics operator (required for VictoriaLogs CRDs)
  when:
    - operator_check.rc != 0
    - victoria_operator_pkg is defined
  block:
    - name: Install VictoriaMetrics operator via Helm
      ansible.builtin.command: >
        helm -n {{ telemetry_namespace }} install victoria-metrics-operator
        {{ victoria_operator_pkg }}
      changed_when: true

    - name: Wait for VictoriaMetrics operator deployment
      ansible.builtin.command: >
        kubectl wait --for=condition=available --timeout={{ victoria_operator_wait_timeout }}
        deployment/victoria-metrics-operator -n {{ telemetry_namespace }}
      changed_when: false

    - name: Log operator auto-install
      ansible.builtin.debug:
        msg: "{{ victoria_operator_auto_install_msg }}"
  rescue:
    - name: VictoriaMetrics operator install failed for VictoriaLogs
      ansible.builtin.fail:
        msg: "{{ vl_operator_install_failed_msg }}"

- name: Fail if operator not installed and no tarball available
  ansible.builtin.fail:
    msg: "{{ victoria_operator_not_installed_msg }}"
  when:
    - operator_check.rc != 0
    - victoria_operator_pkg is not defined

- name: Skip operator install (already present)
  ansible.builtin.debug:
    msg: "{{ victoria_operator_skip_existing_msg }}"
  when:
    - operator_check.rc == 0

- name: Wait for VictoriaMetrics operator deployment (existing)
  ansible.builtin.command: >
    kubectl wait --for=condition=available --timeout={{ victoria_operator_wait_timeout }}
    deployment/victoria-metrics-operator -n {{ telemetry_namespace }}
  changed_when: false
  register: vl_operator_wait
  failed_when: false
  when: operator_check.rc == 0

- name: VictoriaMetrics operator not ready (VictoriaLogs)
  ansible.builtin.fail:
    msg: "{{ vl_operator_not_ready_msg }}"
  when: operator_check.rc == 0 and vl_operator_wait.rc | default(0) != 0

- name: Wait for VictoriaLogs CRDs
  ansible.builtin.command: kubectl get crd {{ item }}
  loop:
    - vlclusters.operator.victoriametrics.com
    - vlagents.operator.victoriametrics.com
  register: vl_crd_check
  retries: "{{ victoria_crd_wait_retries }}"
  delay: "{{ victoria_crd_wait_delay }}"
  until: vl_crd_check.rc == 0
  changed_when: false

- name: Check which VictoriaLogs manifests exist on remote
  ansible.builtin.stat:
    path: "{{ telemetry_deployments_dir }}/{{ item }}"
  loop:
    - victorialogs-operator-vlcluster.yaml
    - victorialogs-operator-vlagent.yaml
    - victorialogs-vlagent-config.yaml
  register: vl_manifest_stats

- name: Build VictoriaLogs manifest existence map
  ansible.builtin.set_fact:
    _vl_manifests: >-
      {{ dict(vl_manifest_stats.results | map(attribute='item') |
      zip(vl_manifest_stats.results | map(attribute='stat') |
      map(attribute='exists'))) }}

- name: Apply VLCluster CR
  ansible.builtin.command: >
    kubectl apply -f {{ telemetry_deployments_dir }}/victorialogs-operator-vlcluster.yaml
  register: vlcluster_apply
  changed_when: "'created' in vlcluster_apply.stdout or 'configured' in vlcluster_apply.stdout"
  when: _vl_manifests['victorialogs-operator-vlcluster.yaml'] | default(false)

- name: Apply VLAgent CR
  ansible.builtin.command: >
    kubectl apply -f {{ telemetry_deployments_dir }}/victorialogs-operator-vlagent.yaml
  register: vlagent_apply
  changed_when: "'created' in vlagent_apply.stdout or 'configured' in vlagent_apply.stdout"
  when: _vl_manifests['victorialogs-operator-vlagent.yaml'] | default(false)

- name: Apply VLAgent syslog config
  ansible.builtin.command: >
    kubectl apply -f {{ telemetry_deployments_dir }}/victorialogs-vlagent-config.yaml
  register: vlagent_config_apply
  changed_when: "'created' in vlagent_config_apply.stdout or 'configured' in vlagent_config_apply.stdout"
  when: _vl_manifests['victorialogs-vlagent-config.yaml'] | default(false)
