# Error messages
vl_operator_install_failed_msg: >-
  Failed to install VM operator for VictoriaLogs.
  Check: kubectl -n {{ telemetry_namespace }} logs deploy/victoria-metrics-operator

vl_operator_not_ready_msg: >-
  VM operator not ready within {{ victoria_operator_wait_timeout }}.
  Check: kubectl -n {{ telemetry_namespace }} get pods
  -l app.kubernetes.io/name=victoria-metrics-operator
