---

# =============================================================================
# deploy_victoria/common — Install Operator: Helm install/upgrade + wait for CRDs
# =============================================================================
# Separated from metrics/deploy.yml to support the kustomization flow:
#   1. install_operator (this file) — helm + CRD registration
#   2. generate manifests (metrics/prepare.yml, logs/prepare.yml) — render to NFS
#   3. kubectl apply -k deployments/ (in telemetry.yml) — single apply
#
# Shared by both victoria-metrics and victoria-logs deployments.
# =============================================================================

- name: Check if VictoriaMetrics operator is installed
  ansible.builtin.command: >
    helm status victoria-metrics-operator -n {{ telemetry_namespace }}
  register: victoria_operator_status
  changed_when: false
  failed_when: false

# ---------------------------------------------------------------------------
# Parse operator and config_reloader images from telemetry_registry
# ---------------------------------------------------------------------------
# Images in telemetry_packages.yml are specified as full URLs (e.g., docker.io/victoriametrics/operator:v0.68.3)
# We need to extract registry, repository, and tag for Helm --set flags
#
# Offline mode with container_registry set:
#   When telemetry_registry.host is set (e.g., "myregistry:5000"), use that as the registry
#   and strip the original registry prefix (docker.io/, quay.io/) from the repository.
#
# Online mode (or offline without container_registry):
#   Use the original registry from the image URL in telemetry_packages.yml.
- name: Parse operator image components from telemetry_registry
  vars:
    _operator_image: "{{ telemetry_registry.images.victoria_operator.operator | default('docker.io/victoriametrics/operator:v0.68.3') }}"
    _config_reloader_image: >-
      {{ telemetry_registry.images.victoria_operator.config_reloader |
      default('docker.io/victoriametrics/operator:config-reloader-v0.68.3') }}
    _custom_registry: "{{ telemetry_registry.host | default('') }}"
  ansible.builtin.set_fact:
    _operator_image_tag: "{{ _operator_image.split(':')[-1] }}"
    _operator_image_without_tag: "{{ _operator_image | regex_replace(':[^:]+$', '') }}"
    _config_reloader_image_tag: "{{ _config_reloader_image.split(':')[-1] }}"
    _config_reloader_image_without_tag: "{{ _config_reloader_image | regex_replace(':[^:]+$', '') }}"
    _custom_registry: "{{ _custom_registry }}"

- name: Set operator image registry and repository (with custom registry override)
  vars:
    _parts: "{{ _operator_image_without_tag.split('/') }}"
    _repo_without_registry: "{{ '/'.join(_parts[1:]) if (_parts | length) > 2 or '.' in _parts[0] else '/'.join(_parts) }}"
    _original_registry: "{{ _parts[0] if (_parts | length) > 2 or '.' in _parts[0] else 'docker.io' }}"
  ansible.builtin.set_fact:
    _operator_registry: "{{ _custom_registry if _custom_registry else _original_registry }}"
    _operator_repository: "{{ _repo_without_registry }}"

- name: Set config_reloader image registry and repository (with custom registry override)
  vars:
    _parts: "{{ _config_reloader_image_without_tag.split('/') }}"
    _repo_without_registry: "{{ '/'.join(_parts[1:]) if (_parts | length) > 2 or '.' in _parts[0] else '/'.join(_parts) }}"
    _original_registry: "{{ _parts[0] if (_parts | length) > 2 or '.' in _parts[0] else 'docker.io' }}"
  ansible.builtin.set_fact:
    _config_reloader_registry: "{{ _custom_registry if _custom_registry else _original_registry }}"
    _config_reloader_repository: "{{ _repo_without_registry }}"

- name: Build Helm image override arguments
  ansible.builtin.set_fact:
    _helm_image_args: >-
      --set image.registry={{ _operator_registry }}
      --set image.repository={{ _operator_repository }}
      --set image.tag={{ _operator_image_tag }}
      --set configReloader.image.registry={{ _config_reloader_registry }}
      --set configReloader.image.repository={{ _config_reloader_repository }}
      --set configReloader.image.tag={{ _config_reloader_image_tag }}

- name: Install VictoriaMetrics operator
  ansible.builtin.command: >
    helm -n {{ telemetry_namespace }} install victoria-metrics-operator
    {{ victoria_operator_pkg }}
    {{ _helm_image_args }}
  when: victoria_operator_status.rc != 0
  changed_when: true

- name: Upgrade VictoriaMetrics operator
  ansible.builtin.command: >
    helm -n {{ telemetry_namespace }} upgrade victoria-metrics-operator
    {{ victoria_operator_pkg }}
    {{ _helm_image_args }}
  when: victoria_operator_status.rc == 0
  changed_when: true

- name: Wait for VictoriaMetrics operator deployment to be available
  ansible.builtin.command: >
    kubectl wait --for=condition=available --timeout=300s
    deployment/victoria-metrics-operator -n {{ telemetry_namespace }}
  changed_when: false

- name: Wait for VictoriaMetrics CRDs to be registered
  ansible.builtin.command: kubectl get crd {{ item }}
  loop:
    - vmclusters.operator.victoriametrics.com
    - vmagents.operator.victoriametrics.com
    - vmpodscrapes.operator.victoriametrics.com
    - vlclusters.operator.victoriametrics.com
    - vlagents.operator.victoriametrics.com
  register: vm_crd_check
  retries: "{{ victoria_crd_wait_retries }}"
  delay: "{{ victoria_crd_wait_delay }}"
  until: vm_crd_check.rc == 0
  changed_when: false

- name: Log VictoriaMetrics operator ready
  ansible.builtin.debug:
    msg: "VictoriaMetrics operator installed and CRDs registered in namespace {{ telemetry_namespace }}"
