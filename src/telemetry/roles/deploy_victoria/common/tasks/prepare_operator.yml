---

# =============================================================================
# deploy_victoria/common — Prepare VictoriaMetrics operator package
# =============================================================================
# Shared by both metrics and logs deployments

- name: Create telemetry directories
  when: k8s_k8s_cluster_mount | default('') != ''
  block:
    - name: Create telemetry subdirectory
      ansible.builtin.file:
        path: "{{ k8s_k8s_cluster_mount }}/telemetry"
        state: directory
        mode: "{{ victoria_dir_mode }}"

    - name: Create deployments directory
      ansible.builtin.file:
        path: "{{ telemetry_deployments_dir }}"
        state: directory
        mode: "{{ victoria_dir_mode }}"

- name: Download VictoriaMetrics operator package
  when:
    - k8s_k8s_cluster_mount | default('') != ''
    - telemetry_packages_config.victoria_metrics_operator | default('') != ''
  run_once: true
  block:
    - name: Check if VictoriaMetrics operator tarball exists
      ansible.builtin.stat:
        path: "{{ k8s_cluster_mount }}/telemetry/{{ (telemetry_packages_config.victoria_metrics_operator | basename) }}"
      register: victoria_tarball_stat

    - name: Download VictoriaMetrics operator tarball
      ansible.builtin.get_url:
        url: "{{ telemetry_packages_config.victoria_metrics_operator }}"
        dest: "{{ k8s_cluster_mount }}/telemetry/{{ (telemetry_packages_config.victoria_metrics_operator | basename) }}"
        mode: "{{ victoria_file_mode }}"
        timeout: "{{ victoria_download_timeout }}"
        validate_certs: false
      when: not (victoria_tarball_stat.stat.exists | default(false))
      register: victoria_download

    - name: Verify VictoriaMetrics tarball was downloaded
      ansible.builtin.stat:
        path: "{{ k8s_cluster_mount }}/telemetry/{{ (telemetry_packages_config.victoria_metrics_operator | basename) }}"
      register: victoria_tarball_verify

    - name: Fail if VictoriaMetrics tarball not available
      ansible.builtin.fail:
        msg: "{{ victoria_tarball_not_found_msg }}"
      when: not (victoria_tarball_verify.stat.exists | default(false))

- name: Set victoria_operator_pkg path
  ansible.builtin.set_fact:
    victoria_operator_pkg: "{{ k8s_cluster_mount }}/telemetry/{{ (telemetry_packages_config.victoria_metrics_operator | basename) }}"
  when:
    - k8s_cluster_mount | default('') != ''
    - telemetry_packages_config.victoria_metrics_operator | default('') != ''
