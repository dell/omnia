# =============================================================================
# Deploy iDRAC telemetry — enable or disable based on telemetry_config.yml flag
# =============================================================================
# Enable  (idrac.metrics_enabled: true):
#   kubectl apply -k deployments/idrac/   ← fast kustomization apply
#
# Disable (idrac.metrics_enabled: false):
#   kubectl scale sts → 0 replicas        ← graceful scale-down
#
# Called by:
#   - enable_idrac_telemetry/tasks/main.yml  (standalone playbook)
#   - telemetry.yml Phase C                  (orchestrator, disable path only)
# Assumes: generate_manifests.yml has already rendered deployments/idrac/

# ── Enable path ──────────────────────────────────────────────────────────────
- name: Apply iDRAC telemetry via kustomization (enable)
  ansible.builtin.command: >
    kubectl apply -k {{ telemetry_deployments_dir }}/idrac/
  register: idrac_kustomize_result
  changed_when: >
    'created' in idrac_kustomize_result.stdout
    or 'configured' in idrac_kustomize_result.stdout
  when: telemetry_config.telemetry_sources.idrac.metrics_enabled | default(false) | bool

- name: Wait for iDRAC StatefulSet rollout (enable)
  ansible.builtin.command: >
    kubectl rollout status statefulset/{{ idrac_telemetry_k8s_name }}
    -n {{ telemetry_namespace }} --timeout={{ idrac_deploy_timeout }}
  register: rollout_result
  changed_when: false
  when: telemetry_config.telemetry_sources.idrac.metrics_enabled | default(false) | bool

- name: Log iDRAC enable result
  ansible.builtin.debug:
    msg: "iDRAC telemetry enabled: {{ rollout_result.stdout | default('completed') }}"
  when: telemetry_config.telemetry_sources.idrac.metrics_enabled | default(false) | bool

# ── Disable path ─────────────────────────────────────────────────────────────
- name: Check if iDRAC StatefulSet exists before scaling down
  ansible.builtin.command: >
    kubectl get statefulset {{ idrac_telemetry_k8s_name }} -n {{ telemetry_namespace }}
  register: idrac_sts_exists
  changed_when: false
  failed_when: false
  when: not (telemetry_config.telemetry_sources.idrac.metrics_enabled | default(false) | bool)

- name: Scale down iDRAC StatefulSet to 0 (disable)
  ansible.builtin.command: >
    kubectl scale statefulset/{{ idrac_telemetry_k8s_name }}
    --replicas=0 -n {{ telemetry_namespace }}
  register: scale_result
  changed_when: "'scaled' in scale_result.stdout"
  when:
    - not (telemetry_config.telemetry_sources.idrac.metrics_enabled | default(false) | bool)
    - idrac_sts_exists.rc == 0

- name: Log iDRAC disable result
  ansible.builtin.debug:
    msg: >
      iDRAC telemetry disabled (scaled to 0).
      Re-enable by setting idrac.metrics_enabled: true and re-running telemetry.yml.
  when:
    - not (telemetry_config.telemetry_sources.idrac.metrics_enabled | default(false) | bool)
    - idrac_sts_exists is defined
    - idrac_sts_exists.rc == 0
