---

# =============================================================================
# Validate iDRAC telemetry configuration before deployment
# =============================================================================

- name: Validate iDRAC telemetry is enabled
  ansible.builtin.assert:
    that:
      - telemetry_config.telemetry_sources.idrac.metrics_enabled | default(false) | bool
    fail_msg: >
      iDRAC telemetry is not enabled in telemetry_config.yml.
      Set telemetry_sources.idrac.metrics_enabled: true

- name: Validate iDRAC collection targets include kafka or victoria_metrics (or both)
  ansible.builtin.assert:
    that:
      - "'kafka' in (telemetry_config.telemetry_sources.idrac.collection_targets | default([]))"
        or "'victoria_metrics' in (telemetry_config.telemetry_sources.idrac.collection_targets | default([]))"
    fail_msg: >
      iDRAC collection_targets must include at least one of 'kafka' or 'victoria_metrics'.
      Current targets: {{ telemetry_config.telemetry_sources.idrac.collection_targets | default([]) }}

- name: Validate MySQL storage configuration
  ansible.builtin.assert:
    that:
      - telemetry_config.idrac_telemetry_configurations.mysqldb_storage | default('') | length > 0
    fail_msg: "idrac_telemetry_configurations.mysqldb_storage must be set (e.g., '1Gi')"

- name: Validate kubectl is available
  ansible.builtin.command: kubectl version --client
  register: kubectl_check
  changed_when: false
  failed_when: kubectl_check.rc != 0

- name: Verify telemetry namespace exists
  ansible.builtin.command: kubectl get namespace {{ telemetry_namespace }}
  register: ns_check
  changed_when: false
  failed_when: false

- name: Verify Kafka is deployed
  ansible.builtin.command: kubectl get kafka -n {{ telemetry_namespace }}
  register: kafka_check
  changed_when: false
  failed_when: false

- name: Warn if Kafka is not deployed
  ansible.builtin.debug:
    msg: "WARNING: Kafka not found in {{ telemetry_namespace }}. iDRAC kafkapump will not function until Kafka is deployed."
  when: kafka_check.rc != 0

- name: Verify VictoriaMetrics is deployed
  ansible.builtin.command: kubectl get vmcluster -n {{ telemetry_namespace }}
  register: victoria_check
  changed_when: false
  failed_when: false

- name: Warn if VictoriaMetrics is not deployed
  ansible.builtin.debug:
    msg: "WARNING: VictoriaMetrics not found in {{ telemetry_namespace }}. iDRAC victoriapump will not function until VictoriaMetrics is deployed."
  when: victoria_check.rc != 0

- name: Log validation passed
  ansible.builtin.debug:
    msg: "iDRAC telemetry configuration validation passed."
