# =============================================================================
# VAST Telemetry Role Variables
# =============================================================================

# Deploy directory on NFS share
telemetry_deploy_dir: "{{ k8s_client_share_path | default('/opt/omnia/nfs') }}/telemetry"
telemetry_deployments_dir: "{{ telemetry_deploy_dir }}/deployments"
telemetry_namespace: "telemetry"

# Kubernetes resource names
vast_credentials_secret_name: "vast-telemetry-credentials"

# VAST telemetry defaults
vast_endpoint_test_timeout: 10

# Validation messages
vast_endpoint_empty_msg: >-
  VAST telemetry is enabled but vast_endpoint is empty.
  Set vast_configuration.vast_endpoint in telemetry_config.yml.

vast_credentials_missing_msg: >-
  VAST auth_mode is 'basic' but vast_username or vast_password is not set.
  Provide VAST credentials in omnia_config_credentials.yml.

vast_ca_cert_not_found_msg: >-
  VAST tls_mode is 'ca_signed' but the CA certificate file was not found
  at the path specified in vast_ca_cert_path. Provide a valid PEM certificate file.

vast_port_range_msg: >-
  VAST metrics port must be between 1 and 65535.

vast_tls_mode_invalid_msg: >-
  VAST tls_mode must be 'self_signed' or 'ca_signed'.

vast_auth_mode_invalid_msg: >-
  VAST auth_mode must be 'basic' or 'none'.

vast_secret_created_msg: >-
  VAST credentials Kubernetes Secret created in namespace '{{ telemetry_namespace }}'.
