---

# Shared Kafka deployment role
# Invoked by any telemetry enablement that has 'kafka' in collection_targets

telemetry_namespace: "telemetry"

# Variables from localhost (set when role runs on kube_vip_group)
telemetry_config: "{{ hostvars['localhost']['telemetry_config'] }}"
telemetry_packages_config: "{{ hostvars['localhost']['telemetry_packages_config'] }}"
telemetry_storage_config: "{{ hostvars['localhost']['telemetry_storage_config'] }}"
telemetry_registry: "{{ hostvars['localhost']['telemetry_registry'] | default({}) }}"
k8s_cluster_mount: "{{ hostvars['localhost']['telemetry_packages_config']['k8s_cluster_mount'] | default('/opt/omnia/k8s_mount') }}"

# Deploy directory
telemetry_deploy_dir: "{{ k8s_cluster_mount }}/telemetry"
telemetry_deployments_dir: "{{ telemetry_deploy_dir }}/deployments"

# Kafka configuration from telemetry_config.yml (read from localhost)
kafka_log_retention_hours: "{{ hostvars['localhost']['telemetry_config'].telemetry_sinks.kafka.log_retention_hours }}"
kafka_log_segment_bytes: "{{ hostvars['localhost']['telemetry_config'].telemetry_sinks.kafka.log_segment_bytes }}"
kafka_log_retention_bytes: "{{ hostvars['localhost']['telemetry_config'].telemetry_sinks.kafka.log_retention_bytes }}"
kafka_topic_partitions: "{{ hostvars['localhost']['telemetry_config'].telemetry_sinks.kafka.topic_partitions }}"

# Kafka topic names (FIXED - cannot be changed)
kafka:
  cluster_id: "kafka-cluster-id"
  topics:
    idrac:
      name: "idrac"
      consumer_group: "idrac-consumer-group"
    ldms:
      name: "ldms"
      consumer_group: "ldms-consumer-group"

# Kafka storage configuration from telemetry_storage_config.yml (read from localhost)
kafka_storage: "{{ hostvars['localhost']['telemetry_storage_config'].kafka_storage }}"

# Timeouts
kafka_deploy_timeout: "300s"
kafka_operator_wait_timeout: "300s"
kafka_crd_wait_retries: 60
kafka_crd_wait_delay: 2
kafka_secret_wait_retries: 30
kafka_secret_wait_delay: 2
kafka_download_timeout: 300

# File modes
kafka_dir_mode: "0755"
kafka_file_mode: "0644"

# Error messages
kafka_strimzi_tarball_not_found_msg: >-
  Strimzi Kafka operator tarball not found at
  {{ k8s_cluster_mount }}/telemetry/{{ (telemetry_packages_config.telemetry_packages.strimzi_kafka_operator | basename) }}.
  Download from {{ telemetry_packages_config.telemetry_packages.strimzi_kafka_operator }} may have failed.

kafka_operator_install_failed_msg: >-
  Failed to install/upgrade Strimzi operator. Verify Helm chart tarball exists at {{ strimzi_kafka_pkg }}

kafka_operator_not_ready_msg: >-
  Strimzi operator did not become ready within {{ kafka_operator_wait_timeout }}.
  Check operator pod logs: kubectl -n {{ telemetry_namespace }} logs deploy/strimzi-cluster-operator

kafka_cluster_not_ready_msg: >-
  Kafka cluster not ready within {{ kafka_deploy_timeout }}.
  Pod status: {{ kafka_pod_status.stdout_lines | default(['unable to fetch']) | join(', ') }}
  Check for ImagePullBackOff: kubectl -n {{ telemetry_namespace }} describe pod -l strimzi.io/cluster=kafka
