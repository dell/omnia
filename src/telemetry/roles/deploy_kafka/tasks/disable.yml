---

# =============================================================================
# deploy_kafka — Disable Kafka infrastructure
# =============================================================================
# Scales down Kafka StatefulSet and Kafka Operator Deployment to 0 replicas
# when no telemetry sources require Kafka.
#
# This stops Kafka infrastructure but preserves PVCs for future re-enablement.
# =============================================================================

- name: Load telemetry configuration
  ansible.builtin.include_role:
    name: common
    tasks_from: load_telemetry_config

- name: Check if Kafka StatefulSet exists
  ansible.builtin.command: >
    kubectl get statefulset {{ kafka_statefulset_name }} -n {{ telemetry_namespace }}
  register: kafka_sts_check
  changed_when: false
  failed_when: false

- name: Scale down Kafka StatefulSet to 0
  ansible.builtin.command: >
    kubectl scale statefulset {{ kafka_statefulset_name }}
    -n {{ telemetry_namespace }} --replicas=0
  register: scale_down_kafka_result
  changed_when: "'scaled' in scale_down_kafka_result.stdout"
  when: kafka_sts_check.rc == 0

- name: Display Kafka scale down result
  ansible.builtin.debug:
    msg: "{{ kafka_scale_down_msg }}"
  when: kafka_sts_check.rc == 0

- name: Scale down Kafka Operator Deployment to 0
  ansible.builtin.command: >
    kubectl scale deployment {{ kafka_operator_deployment_name }}
    -n {{ telemetry_namespace }} --replicas=0
  register: scale_down_operator_result
  changed_when: "'scaled' in scale_down_operator_result.stdout"
  when: kafka_sts_check.rc == 0

- name: Display Kafka Operator scale down result
  ansible.builtin.debug:
    msg: "{{ kafka_operator_scale_down_msg }}"
  when: kafka_sts_check.rc == 0

- name: Kafka StatefulSet not found - nothing to scale down
  ansible.builtin.debug:
    msg: "{{ kafka_not_found_msg }}"
  when: kafka_sts_check.rc != 0
