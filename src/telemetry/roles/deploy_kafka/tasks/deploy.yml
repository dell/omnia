---

# =============================================================================
# deploy_kafka — Deploy: install operator + apply manifests
# =============================================================================

- name: Ensure telemetry namespace exists
  ansible.builtin.command: >
    kubectl create namespace {{ telemetry_namespace }} --dry-run=client -o yaml
  register: ns_yaml
  changed_when: false

- name: Apply telemetry namespace
  ansible.builtin.command: kubectl apply -f -
  args:
    stdin: "{{ ns_yaml.stdout }}"
  register: ns_result
  changed_when: "'created' in ns_result.stdout | default('')"

- name: Check if Strimzi operator is installed
  ansible.builtin.command: >
    helm status strimzi-cluster-operator -n {{ telemetry_namespace }}
  register: strimzi_status
  changed_when: false
  failed_when: false

- name: Install or upgrade Strimzi Kafka operator  # noqa: no-changed-when
  block:
    - name: Install Strimzi Kafka operator  # noqa: no-changed-when
      ansible.builtin.command: >
        helm -n {{ telemetry_namespace }} install strimzi-cluster-operator
        {{ strimzi_kafka_pkg }}
      when: strimzi_status.rc != 0
      changed_when: true

    - name: Upgrade Strimzi Kafka operator  # noqa: no-changed-when
      ansible.builtin.command: >
        helm -n {{ telemetry_namespace }} upgrade strimzi-cluster-operator
        {{ strimzi_kafka_pkg }}
      when: strimzi_status.rc == 0
      changed_when: true
  rescue:
    - name: Strimzi operator install/upgrade failed
      ansible.builtin.fail:
        msg: "{{ kafka_operator_install_failed_msg }}"

- name: Apply Strimzi CRDs from chart
  ansible.builtin.shell: |
    _TMP=$(mktemp -d)
    tar -xzf "{{ strimzi_kafka_pkg }}" -C "$_TMP"
    kubectl apply -f "$_TMP/strimzi-kafka-operator/crds/" --server-side --force-conflicts
    rm -rf "$_TMP"
  changed_when: false

- name: Wait for Strimzi operator deployment
  ansible.builtin.command: >
    kubectl wait --for=condition=available --timeout={{ kafka_operator_wait_timeout }}
    deployment/strimzi-cluster-operator -n {{ telemetry_namespace }}
  changed_when: false
  register: strimzi_wait
  failed_when: false

- name: Strimzi operator not ready
  ansible.builtin.fail:
    msg: "{{ kafka_operator_not_ready_msg }}"
  when: strimzi_wait.rc != 0

- name: Wait for Strimzi CRDs
  ansible.builtin.command: kubectl get crd {{ item }}
  loop:
    - kafkas.kafka.strimzi.io
    - kafkatopics.kafka.strimzi.io
    - kafkausers.kafka.strimzi.io
    - kafkanodepools.kafka.strimzi.io
  register: crd_check
  retries: "{{ kafka_crd_wait_retries }}"
  delay: "{{ kafka_crd_wait_delay }}"
  until: crd_check.rc == 0
  changed_when: false

- name: Apply Kafka cluster manifest
  ansible.builtin.command: >
    kubectl apply -f {{ telemetry_deployments_dir }}/kafka.kafka.yaml
  register: kafka_apply
  changed_when: "'created' in kafka_apply.stdout or 'configured' in kafka_apply.stdout"

# =============================================================================
# Sink infrastructure resources — always deployed (user, bridge)
# =============================================================================

- name: Wait for Kafka cluster to be ready
  ansible.builtin.command: >
    kubectl wait kafka/kafka -n {{ telemetry_namespace }}
    --for=condition=Ready --timeout={{ kafka_deploy_timeout }}
  changed_when: false
  register: kafka_wait
  failed_when: false

- name: Collect Kafka pod status on failure
  ansible.builtin.command: >
    kubectl -n {{ telemetry_namespace }} get pods -l strimzi.io/cluster=kafka
    -o wide --no-headers
  register: kafka_pod_status
  changed_when: false
  failed_when: false
  when: kafka_wait.rc != 0

- name: Kafka cluster not ready
  ansible.builtin.fail:
    msg: "{{ kafka_cluster_not_ready_msg }}"
  when: kafka_wait.rc != 0

- name: Apply Kafka user manifest
  ansible.builtin.command: >
    kubectl apply -f {{ telemetry_deployments_dir }}/kafka.kafkapump_user.yaml
  register: user_apply
  changed_when: "'created' in user_apply.stdout or 'configured' in user_apply.stdout"

- name: Wait for kafkapump secret to be created
  ansible.builtin.command: >
    kubectl get secret kafkapump -n {{ telemetry_namespace }}
  register: kafkapump_secret
  retries: "{{ kafka_secret_wait_retries }}"
  delay: "{{ kafka_secret_wait_delay }}"
  until: kafkapump_secret.rc == 0
  changed_when: false

- name: Apply Kafka bridge manifests
  ansible.builtin.command: >
    kubectl apply -f {{ telemetry_deployments_dir }}/{{ item }}
  loop:
    - kafka.kafka_bridge.yaml
    - kafka.kafka_bridge_lb.yaml
  register: bridge_apply
  changed_when: "'created' in (bridge_apply.stdout | default('')) or 'configured' in (bridge_apply.stdout | default(''))"

# =============================================================================
# Source-specific resources — only deployed when kafka_infra_only is false
# =============================================================================

- name: Apply source-specific Kafka topics
  when: not (kafka_infra_only | default(false) | bool)
  block:
    - name: Find generated Kafka topic manifests
      ansible.builtin.find:
        paths: "{{ telemetry_deployments_dir }}"
        patterns: "kafka.*.topic.yaml"
      register: topic_files

    - name: Apply Kafka topic manifests
      ansible.builtin.command: >
        kubectl apply -f {{ item.path }}
      loop: "{{ topic_files.files }}"
      register: topic_apply
      changed_when: "'created' in (topic_apply.stdout | default('')) or 'configured' in (topic_apply.stdout | default(''))"
