---

# =============================================================================
# deploy_kafka — Deploy: install operator + apply manifests
# =============================================================================

- name: Ensure telemetry namespace exists
  ansible.builtin.command: >
    kubectl create namespace {{ telemetry_namespace }} --dry-run=client -o yaml
  register: ns_yaml
  changed_when: false

- name: Apply telemetry namespace
  ansible.builtin.command: kubectl apply -f -
  args:
    stdin: "{{ ns_yaml.stdout }}"
  register: ns_result
  changed_when: "'created' in ns_result.stdout | default('')"

- name: Check if Strimzi operator is installed
  ansible.builtin.command: >
    helm status strimzi-cluster-operator -n {{ telemetry_namespace }}
  register: strimzi_status
  changed_when: false
  failed_when: false

- name: Install or upgrade Strimzi Kafka operator
  block:
    - name: Install Strimzi Kafka operator
      ansible.builtin.command: >
        helm -n {{ telemetry_namespace }} install strimzi-cluster-operator
        {{ strimzi_kafka_pkg }}
      when: strimzi_status.rc != 0
      changed_when: true

    - name: Upgrade Strimzi Kafka operator
      ansible.builtin.command: >
        helm -n {{ telemetry_namespace }} upgrade strimzi-cluster-operator
        {{ strimzi_kafka_pkg }}
      when: strimzi_status.rc == 0
      changed_when: true
  rescue:
    - name: Strimzi operator install/upgrade failed
      ansible.builtin.fail:
        msg: "{{ kafka_operator_install_failed_msg }}"

- name: Apply Strimzi CRDs from chart
  ansible.builtin.shell: |
    _TMP=$(mktemp -d)
    tar -xzf "{{ strimzi_kafka_pkg }}" -C "$_TMP"
    kubectl apply -f "$_TMP/strimzi-kafka-operator/crds/" --server-side --force-conflicts
    rm -rf "$_TMP"
  changed_when: false

- name: Wait for Strimzi operator deployment
  ansible.builtin.command: >
    kubectl wait --for=condition=available --timeout={{ kafka_operator_wait_timeout }}
    deployment/strimzi-cluster-operator -n {{ telemetry_namespace }}
  changed_when: false
  register: strimzi_wait
  failed_when: false

- name: Strimzi operator not ready
  ansible.builtin.fail:
    msg: "{{ kafka_operator_not_ready_msg }}"
  when: strimzi_wait.rc != 0

- name: Wait for Strimzi CRDs
  ansible.builtin.command: kubectl get crd {{ item }}
  loop:
    - kafkas.kafka.strimzi.io
    - kafkatopics.kafka.strimzi.io
    - kafkausers.kafka.strimzi.io
    - kafkanodepools.kafka.strimzi.io
  register: crd_check
  retries: "{{ kafka_crd_wait_retries }}"
  delay: "{{ kafka_crd_wait_delay }}"
  until: crd_check.rc == 0
  changed_when: false

- name: Apply Kafka cluster manifest
  ansible.builtin.command: >
    kubectl apply -f {{ telemetry_deployments_dir }}/kafka.kafka.yaml
  register: kafka_apply
  changed_when: "'created' in kafka_apply.stdout or 'configured' in kafka_apply.stdout"

- name: Restore Kafka cluster ID for retained volumes
  when: kafka_cluster_id_restore_required | default(false) | bool
  block:
    - name: Restore Kafka custom resource cluster ID
      ansible.builtin.command:
        argv:
          - kubectl
          - patch
          - kafka
          - kafka
          - --namespace
          - "{{ telemetry_namespace }}"
          - --subresource=status
          - --type=merge
          - --patch
          - '{"status":{"clusterId":"{{ kafka_preserved_cluster_id }}"}}'
      changed_when: true
      no_log: true

    - name: Restore Kafka node pool cluster IDs
      ansible.builtin.command:
        argv:
          - kubectl
          - patch
          - kafkanodepool
          - "{{ item }}"
          - --namespace
          - "{{ telemetry_namespace }}"
          - --subresource=status
          - --type=merge
          - --patch
          - '{"status":{"clusterId":"{{ kafka_preserved_cluster_id }}"}}'
      loop:
        - controller
        - broker
      changed_when: true
      no_log: true

- name: Read Kafka reconciliation pause annotation
  ansible.builtin.command: >
    kubectl get kafka kafka -n {{ telemetry_namespace }}
    --output=jsonpath='{.metadata.annotations.strimzi\.io/pause-reconciliation}'
  register: kafka_reconciliation_pause
  changed_when: false

- name: Resume Kafka reconciliation
  ansible.builtin.command: >
    kubectl annotate kafka kafka -n {{ telemetry_namespace }}
    strimzi.io/pause-reconciliation-
  register: kafka_reconciliation_resume
  changed_when: "'annotated' in kafka_reconciliation_resume.stdout"
  when: kafka_reconciliation_pause.stdout | trim == 'true'

# =============================================================================
# Sink infrastructure resources — always deployed (user, bridge)
# =============================================================================

- name: Wait for Kafka cluster to be ready
  ansible.builtin.command: >
    kubectl wait kafka/kafka -n {{ telemetry_namespace }}
    --for=condition=Ready --timeout={{ kafka_deploy_timeout }}
  changed_when: false
  register: kafka_wait
  failed_when: false

- name: Collect Kafka pod status on failure
  ansible.builtin.command: >
    kubectl -n {{ telemetry_namespace }} get pods -l strimzi.io/cluster=kafka
    -o wide --no-headers
  register: kafka_pod_status
  changed_when: false
  failed_when: false
  when: kafka_wait.rc != 0

- name: Kafka cluster not ready
  ansible.builtin.fail:
    msg: "{{ kafka_cluster_not_ready_msg }}"
  when: kafka_wait.rc != 0

- name: Read active Kafka cluster ID
  ansible.builtin.command: >
    kubectl get kafkanodepool controller -n {{ telemetry_namespace }}
    --output=jsonpath='{.status.clusterId}'
  register: kafka_active_cluster_id
  changed_when: false
  retries: "{{ kafka_secret_wait_retries }}"
  delay: "{{ kafka_secret_wait_delay }}"
  until: kafka_active_cluster_id.stdout | trim | length > 0
  no_log: true

- name: Build Kafka cluster ID preservation secret
  ansible.builtin.command:
    argv:
      - kubectl
      - create
      - secret
      - generic
      - "{{ kafka.cluster_id }}"
      - --namespace
      - "{{ telemetry_namespace }}"
      - "--from-literal=cluster-id={{ kafka_active_cluster_id.stdout | trim }}"
      - --dry-run=client
      - --output=yaml
  register: kafka_cluster_id_secret_manifest
  changed_when: false
  no_log: true

- name: Save Kafka cluster ID for retained-volume redeployment
  ansible.builtin.command: kubectl apply -f -
  args:
    stdin: "{{ kafka_cluster_id_secret_manifest.stdout }}"
  register: kafka_cluster_id_secret_apply
  changed_when: >-
    'created' in kafka_cluster_id_secret_apply.stdout or
    'configured' in kafka_cluster_id_secret_apply.stdout
  no_log: true

- name: Apply Kafka user manifest
  ansible.builtin.command: >
    kubectl apply -f {{ telemetry_deployments_dir }}/kafka.kafkapump_user.yaml
  register: user_apply
  changed_when: "'created' in user_apply.stdout or 'configured' in user_apply.stdout"

- name: Wait for kafkapump secret to be created
  ansible.builtin.command: >
    kubectl get secret kafkapump -n {{ telemetry_namespace }}
  register: kafkapump_secret
  retries: "{{ kafka_secret_wait_retries }}"
  delay: "{{ kafka_secret_wait_delay }}"
  until: kafkapump_secret.rc == 0
  changed_when: false

- name: Apply Kafka bridge manifests
  ansible.builtin.command: >
    kubectl apply -f {{ telemetry_deployments_dir }}/{{ item }}
  loop:
    - kafka.kafka_bridge.yaml
    - kafka.kafka_bridge_lb.yaml
  register: bridge_apply
  changed_when: "'created' in (bridge_apply.stdout | default('')) or 'configured' in (bridge_apply.stdout | default(''))"

# =============================================================================
# Source-specific resources — only deployed when kafka_infra_only is false
# =============================================================================

- name: Apply source-specific Kafka topics
  when:
    - not (kafka_infra_only | default(false) | bool)
    - telemetry_config.telemetry_sources.ldms.metrics_enabled | default(false) | bool
  block:
    - name: Apply LDMS Kafka topic manifest
      ansible.builtin.command: >
        kubectl apply -f {{ telemetry_deployments_dir }}/kafka.ldms.topic.yaml
      register: topic_apply
      changed_when: "'created' in (topic_apply.stdout | default('')) or 'configured' in (topic_apply.stdout | default(''))"

    - name: Wait for LDMS Kafka topic to be ready
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - --for=condition=Ready
          - "--filename={{ telemetry_deployments_dir }}/kafka.ldms.topic.yaml"
          - "--timeout={{ kafka_deploy_timeout }}"
      changed_when: false
