# =============================================================================
# deploy_kafka — Install Operator: Helm install/upgrade Strimzi + wait for CRDs
# =============================================================================
# Separated from deploy.yml to support the kustomization flow in telemetry.yml:
#   1. install_operator (this file) — helm + CRD registration
#   2. generate manifests (prepare.yml) — render Kafka YAML to NFS
#   3. kubectl apply -k deployments/ (in telemetry.yml) — single apply
#
# deploy.yml (existing) is still used when running deploy_kafka standalone.
# =============================================================================

- name: Ensure telemetry namespace exists
  ansible.builtin.command: >
    kubectl create namespace {{ telemetry_namespace }} --dry-run=client -o yaml
  register: ns_yaml
  changed_when: false

- name: Apply telemetry namespace
  ansible.builtin.command: kubectl apply -f -
  args:
    stdin: "{{ ns_yaml.stdout }}"
  register: ns_result
  changed_when: "'created' in ns_result.stdout | default('')"

- name: Check if Strimzi operator is installed
  ansible.builtin.command: >
    helm status strimzi-cluster-operator -n {{ telemetry_namespace }}
  register: strimzi_status
  changed_when: false
  failed_when: false

- name: Install Strimzi Kafka operator  # noqa: no-changed-when
  ansible.builtin.command: >
    helm -n {{ telemetry_namespace }} install strimzi-cluster-operator
    {{ strimzi_kafka_pkg }}
  when: strimzi_status.rc != 0
  changed_when: true

- name: Upgrade Strimzi Kafka operator
  ansible.builtin.command: >
    helm -n {{ telemetry_namespace }} upgrade strimzi-cluster-operator
    {{ strimzi_kafka_pkg }}
  when: strimzi_status.rc == 0
  changed_when: true

- name: Apply Strimzi CRDs from chart
  ansible.builtin.shell: |
    _TMP=$(mktemp -d)
    tar -xzf "{{ strimzi_kafka_pkg }}" -C "$_TMP"
    kubectl apply -f "$_TMP/strimzi-kafka-operator/crds/" --server-side --force-conflicts
    rm -rf "$_TMP"
  changed_when: false

- name: Wait for Strimzi operator deployment to be available
  ansible.builtin.command: >
    kubectl wait --for=condition=available --timeout=300s
    deployment/strimzi-cluster-operator -n {{ telemetry_namespace }}
  changed_when: false

- name: Wait for Strimzi CRDs to be registered
  ansible.builtin.command: kubectl get crd {{ item }}
  loop:
    - kafkas.kafka.strimzi.io
    - kafkatopics.kafka.strimzi.io
    - kafkausers.kafka.strimzi.io
    - kafkanodepools.kafka.strimzi.io
  register: crd_check
  retries: "{{ kafka_crd_wait_retries }}"
  delay: "{{ kafka_crd_wait_delay }}"
  until: crd_check.rc == 0
  changed_when: false

- name: Log Strimzi operator ready
  ansible.builtin.debug:
    msg: "Strimzi Kafka operator installed and CRDs registered in namespace {{ telemetry_namespace }}"
