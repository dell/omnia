# =============================================================================
# deploy_kafka — Shared Kafka deployment role
# =============================================================================
# Deploys Strimzi Kafka operator + Kafka cluster into telemetry namespace.
# Idempotent: skips if already deployed, upgrades if present.
#
# Consumed by: enable_idrac_telemetry, enable_ldms, enable_powerscale, etc.
# Condition: kafka_support == true (set by derive_sink_support_flags.yml)
#
# Flow: prepare (download package + generate manifests) → deploy (apply manifests)
# =============================================================================

- name: Prepare Kafka packages and manifests
  ansible.builtin.include_tasks: prepare.yml

- name: Check if Kafka is already deployed
  ansible.builtin.command: >
    kubectl get kafka -n {{ telemetry_namespace }} -o name
  register: kafka_existing
  changed_when: false
  failed_when: false

- name: Skip Kafka deployment if already running
  ansible.builtin.debug:
    msg: "Kafka already deployed in {{ telemetry_namespace }}: {{ kafka_existing.stdout }}"
  when: kafka_existing.rc == 0 and kafka_existing.stdout | length > 0

- name: Deploy Kafka
  when: kafka_existing.rc != 0 or kafka_existing.stdout | length == 0
  block:
    - name: Run Kafka deployment
      ansible.builtin.include_tasks: deploy.yml

- name: Verify Kafka cluster is ready
  ansible.builtin.command: >
    kubectl wait kafka/kafka -n {{ telemetry_namespace }}
    --for=condition=Ready --timeout={{ kafka_deploy_timeout }}
  register: kafka_ready
  changed_when: false
  failed_when: false

- name: Set kafka_deployed fact
  ansible.builtin.set_fact:
    kafka_deployed: "{{ kafka_ready.rc == 0 }}"
    cacheable: true

- name: Log Kafka deployment result
  ansible.builtin.debug:
    msg: "Kafka deployment: {{ 'READY' if kafka_deployed else 'PENDING (cluster may still be initializing)' }}"
