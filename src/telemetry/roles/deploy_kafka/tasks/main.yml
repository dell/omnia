---

# =============================================================================
# deploy_kafka — Shared Kafka deployment role
# =============================================================================
# Deploys Strimzi Kafka operator + Kafka cluster into telemetry namespace.
# Idempotent: skips if already deployed, upgrades if present.
#
# Consumed by: iDRAC, LDMS, OME, and other Kafka-backed telemetry components.
# Condition: kafka_support == true (set by derive_sink_support_flags.yml)
#
# Flow: prepare (download package + generate manifests) → deploy (apply manifests)
# =============================================================================

- name: Initialize preserved Kafka cluster ID
  ansible.builtin.set_fact:
    kafka_preserved_cluster_id: ""
    kafka_existing_node_pool_cluster_ids: []
    kafka_existing_node_pool_status_count: 0
    kafka_existing_node_pool_node_ids: []
    kafka_existing_node_pool_node_id_count: 0
    kafka_existing_pvcs: []
    kafka_cluster_id_restore_required: false
  no_log: true

- name: Build telemetry namespace manifest for Kafka discovery
  ansible.builtin.command: >
    kubectl create namespace {{ telemetry_namespace }}
    --dry-run=client --output=yaml
  register: kafka_discovery_namespace_manifest
  changed_when: false

- name: Ensure telemetry namespace exists for Kafka discovery
  ansible.builtin.command: kubectl apply -f -
  args:
    stdin: "{{ kafka_discovery_namespace_manifest.stdout }}"
  register: kafka_discovery_namespace_apply
  changed_when: "'created' in kafka_discovery_namespace_apply.stdout"

- name: Discover installed Strimzi API resources
  ansible.builtin.command: >
    kubectl api-resources --namespaced=true --api-group=kafka.strimzi.io
    --output=name
  register: kafka_strimzi_api_resources
  changed_when: false

- name: Check for preserved Kafka cluster ID
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - secret
      - "{{ kafka.cluster_id }}"
      - --namespace
      - "{{ telemetry_namespace }}"
      - --ignore-not-found
      - --output=jsonpath={.data.cluster-id}
  register: _kafka_cluster_id_secret
  changed_when: false
  no_log: true

- name: Decode preserved Kafka cluster ID
  ansible.builtin.set_fact:
    kafka_preserved_cluster_id: "{{ _kafka_cluster_id_secret.stdout | b64decode | trim }}"
  when:
    - _kafka_cluster_id_secret.rc == 0
    - _kafka_cluster_id_secret.stdout | trim | length > 0
  no_log: true

- name: Check whether Kafka is already ready
  ansible.builtin.command: >
    kubectl get kafka/kafka -n {{ telemetry_namespace }} --ignore-not-found
    --output=jsonpath='{range .status.conditions[?(@.type=="Ready")]}{.status}{end}'
  register: _kafka_existing_ready
  changed_when: false
  when: "'kafkas.kafka.strimzi.io' in kafka_strimzi_api_resources.stdout_lines"

- name: Read existing Kafka node pool cluster IDs
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - kafkanodepool
      - "{{ item }}"
      - --namespace
      - "{{ telemetry_namespace }}"
      - --ignore-not-found
      - --output=jsonpath={.status.clusterId}
  loop:
    - controller
    - broker
  register: _kafka_node_pool_cluster_ids
  changed_when: false
  failed_when: false
  when: >-
    'kafkanodepools.kafka.strimzi.io' in
    kafka_strimzi_api_resources.stdout_lines
  no_log: true

- name: Read existing Kafka node pool node IDs
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - kafkanodepool
      - "{{ item }}"
      - --namespace
      - "{{ telemetry_namespace }}"
      - --ignore-not-found
      - --output=jsonpath={.status.nodeIds}
  loop:
    - controller
    - broker
  register: _kafka_node_pool_node_ids
  changed_when: false
  failed_when: false
  when: >-
    'kafkanodepools.kafka.strimzi.io' in
    kafka_strimzi_api_resources.stdout_lines
  no_log: true

- name: Discover retained Kafka PVCs
  ansible.builtin.command: >
    kubectl get pvc -n {{ telemetry_namespace }} -l strimzi.io/cluster=kafka
    --output=name --ignore-not-found=true
  register: _kafka_pvc_discovery
  changed_when: false

- name: Resolve existing Kafka storage identity
  ansible.builtin.set_fact:
    kafka_existing_node_pool_cluster_ids: >-
      {{
        _kafka_node_pool_cluster_ids.results | default([])
        | selectattr('rc', 'defined')
        | selectattr('rc', 'equalto', 0)
        | map(attribute='stdout')
        | map('trim')
        | reject('equalto', '')
        | unique
        | list
      }}
    kafka_existing_node_pool_status_count: >-
      {{
        _kafka_node_pool_cluster_ids.results | default([])
        | selectattr('rc', 'defined')
        | selectattr('rc', 'equalto', 0)
        | map(attribute='stdout')
        | map('trim')
        | reject('equalto', '')
        | list
        | length
      }}
    kafka_existing_node_pool_node_ids: >-
      {{
        _kafka_node_pool_node_ids.results | default([])
        | selectattr('rc', 'defined')
        | selectattr('rc', 'equalto', 0)
        | map(attribute='stdout')
        | map('trim')
        | reject('equalto', '')
        | list
      }}
    kafka_existing_node_pool_node_id_count: >-
      {{
        _kafka_node_pool_node_ids.results | default([])
        | selectattr('rc', 'defined')
        | selectattr('rc', 'equalto', 0)
        | map(attribute='stdout')
        | map('trim')
        | reject('equalto', '')
        | list
        | length
      }}
    kafka_existing_pvcs: >-
      {{
        _kafka_pvc_discovery.stdout_lines | default([])
        | map('trim')
        | reject('equalto', '')
        | list
      }}
  no_log: true

- name: Validate saved Kafka cluster ID
  ansible.builtin.assert:
    that:
      - kafka_preserved_cluster_id is match('^[A-Za-z0-9_-]{22}$')
    fail_msg: >-
      The saved Kafka cluster ID is invalid. Refusing to use it with retained
      Kafka volumes.
  when: kafka_preserved_cluster_id | length > 0

- name: Validate retained Kafka storage identity
  ansible.builtin.assert:
    that:
      - >-
        kafka_existing_pvcs | length == 0 or
        kafka_existing_node_pool_node_id_count | int == 2
      - >-
        kafka_existing_pvcs | length == 0 or
        kafka_existing_node_pool_node_ids
        | reject('equalto', '[]') | list | length == 2
      - >-
        kafka_existing_pvcs | length == 0 or
        kafka_existing_node_pool_status_count | int == 2 or
        kafka_preserved_cluster_id | length > 0
      - kafka_existing_node_pool_cluster_ids | length <= 1
      - >-
        kafka_existing_node_pool_status_count | int == 0 or
        kafka_preserved_cluster_id | length == 0 or
        kafka_preserved_cluster_id in kafka_existing_node_pool_cluster_ids
    fail_msg: >-
      Retained Kafka PVCs do not have two preserved KafkaNodePools with original
      node IDs and one consistent cluster identity. Refusing to start Kafka to
      protect the preserved data.
  when: _kafka_existing_ready.stdout | default('') | trim != 'True'

- name: Validate existing Kafka node pool cluster ID
  ansible.builtin.assert:
    that:
      - >-
        (kafka_existing_node_pool_cluster_ids | first)
        is match('^[A-Za-z0-9_-]{22}$')
    fail_msg: >-
      The retained KafkaNodePool cluster ID is invalid. Refusing to start Kafka
      to protect the preserved data.
  when: kafka_existing_node_pool_cluster_ids | length > 0

- name: Determine whether Kafka cluster ID recovery is required
  ansible.builtin.set_fact:
    kafka_cluster_id_restore_required: >-
      {{
        _kafka_existing_ready.stdout | default('') | trim != 'True' and
        kafka_preserved_cluster_id | length > 0 and
        kafka_existing_node_pool_node_id_count | int == 2 and
        kafka_existing_node_pool_status_count | int != 2
      }}
  no_log: true

- name: Prepare Kafka packages and manifests
  ansible.builtin.include_tasks: prepare.yml

- name: Run Kafka deployment
  ansible.builtin.include_tasks: deploy.yml

- name: Verify Kafka cluster is ready
  ansible.builtin.command: >
    kubectl wait kafka/kafka -n {{ telemetry_namespace }}
    --for=condition=Ready --timeout={{ kafka_deploy_timeout }}
  register: kafka_ready
  changed_when: false
  failed_when: false

- name: Set kafka_deployed fact
  ansible.builtin.set_fact:
    kafka_deployed: "{{ kafka_ready.rc == 0 }}"
    cacheable: true

- name: Log Kafka deployment result
  ansible.builtin.debug:
    msg: "Kafka deployment: {{ 'READY' if kafka_deployed else 'PENDING (cluster may still be initializing)' }}"
