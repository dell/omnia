# =============================================================================
# external_kafka_disconnect — Disconnect external Kafka clients (e.g., OME)
#
# This role runs on kube_vip to:
#   1. Check current state of Kafka external services
#   2. Display manual disconnect instructions for OME
#
# NOTE: No cluster-side changes are made. LoadBalancer services and
# exported certificates are preserved. External systems must be manually
# disconnected on their side (OME UI).
# To reconnect, run external_kafka_connect.yml again.
# =============================================================================

- name: Validate kube_vip connectivity
  block:
    - name: Wait for kube_vip connection
      ansible.builtin.wait_for_connection:
        timeout: 30
  rescue:
    - name: Fail when kube_vip is not reachable
      ansible.builtin.fail:
        msg: "{{ kafka_disconnect_err_kube_vip_unreachable }}"

- name: Check kubectl availability
  ansible.builtin.command: kubectl version --client=true
  register: _kubectl_check
  changed_when: false
  failed_when: _kubectl_check.rc != 0

# =============================================================================
# Check current state of Kafka external services
# =============================================================================

- name: Check if Kafka external bootstrap service exists
  ansible.builtin.command: >-
    kubectl get svc {{ kafka_bootstrap_service_name }} -n {{ kafka_namespace }}
    -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
  register: _kafka_bootstrap_lb_check
  changed_when: false
  failed_when: false

- name: Check if Kafka HTTP Bridge service exists
  ansible.builtin.command: >-
    kubectl get svc {{ kafka_bridge_service_name }} -n {{ kafka_namespace }}
    -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
  register: _kafka_bridge_lb_check
  changed_when: false
  failed_when: false

- name: Set Kafka external service state
  ansible.builtin.set_fact:
    _kafka_bootstrap_ip: "{{ _kafka_bootstrap_lb_check.stdout | trim | default('N/A') }}"
    _kafka_bootstrap_available: "{{ _kafka_bootstrap_lb_check.rc == 0 and (_kafka_bootstrap_lb_check.stdout | trim | length > 0) }}"
    _kafka_bridge_ip: "{{ _kafka_bridge_lb_check.stdout | trim | default('N/A') }}"
    _kafka_bridge_available: "{{ _kafka_bridge_lb_check.rc == 0 and (_kafka_bridge_lb_check.stdout | trim | length > 0) }}"

# =============================================================================
# (No cleanup - exported certificates and connection details are preserved)
# =============================================================================

# NOTE: Exported certificates and connection details are NOT deleted.
# They are still valid for the running cluster and can be reused for reconnection.

# =============================================================================
# Display disconnect summary and OME instructions
# =============================================================================

- name: Display Kafka disconnect summary
  ansible.builtin.debug:
    msg: >-
      {{
        [
          '==============================================================',
          'Kafka External Disconnect Summary',
          '==============================================================',
          '',
          '[CLUSTER-SIDE ACTIONS]',
          '  No cluster-side changes made.',
          '  Exported certs/details: Preserved at ' ~ kafka_output_dir,
          '',
          '  NOTE: Kafka LoadBalancer services and certificates are still',
          '  available. External systems must be manually disconnected on',
          '  their side (see instructions below).',
          '',
          '[CURRENT EXTERNAL ENDPOINTS]',
          '  Kafka bootstrap (mTLS): ' ~
            (_kafka_bootstrap_ip if (_kafka_bootstrap_available | bool) else 'Not available'),
          '  Kafka HTTP Bridge:      ' ~
            (_kafka_bridge_ip if (_kafka_bridge_available | bool) else 'Not available'),
          '',
          '--------------------------------------------------------------',
          '[OME DISCONNECT — MANUAL STEPS REQUIRED]',
          '--------------------------------------------------------------',
          '  Step 1: Log in to the OME web UI',
          '  Step 2: Navigate to: ' ~ kafka_ome_ui_navigation,
          '  Step 3: Click: ' ~ kafka_ome_ui_disable_label,
          '  Step 4: Remove the Kafka Bootstrap Server entry',
          '  Step 5: Remove uploaded TLS certificates (ca.crt, user.pfx)',
          '',
          '--------------------------------------------------------------',
          '[TO RECONNECT]',
          '--------------------------------------------------------------',
          '  Run: ansible-playbook playbooks/telemetry.yml --tags external_kafka',
          '  Existing certificates at ' ~ kafka_output_dir ~ ' can be reused.',
          '',
          '=============================================================='
        ]
      }}
  delegate_to: localhost
  connection: local
  run_once: true
