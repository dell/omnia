---

# Kafka cluster details (must match external_kafka_connect)
kafka_namespace: "telemetry"
kafka_bootstrap_service_name: "kafka-kafka-external-bootstrap"
kafka_bridge_service_name: "bridge-bridge-lb"

# Output paths (must match external_kafka_connect)
kafka_output_dir: "{{ output_project_dir | default('/opt/omnia/telemetry/output/project_default') }}/external_kafka"

# Error messages
kafka_disconnect_err_kube_vip_unreachable: >-
  kube_vip host is not reachable over SSH: {{ ansible_host | default(inventory_hostname) }}.
  Ensure the Kubernetes control plane VIP is reachable from this host.

# OME disconnect instructions
kafka_ome_ui_navigation: "Configuration -> Remote Connectivity"
kafka_ome_ui_disable_label: "Disable Kafka Connectivity"
