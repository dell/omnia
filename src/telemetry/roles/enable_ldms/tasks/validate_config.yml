# =============================================================================
# Validate LDMS telemetry configuration
# =============================================================================

- name: Verify LDMS is enabled in telemetry configuration
  ansible.builtin.assert:
    that:
      - telemetry_config.telemetry_sources.ldms.metrics_enabled | default(false) | bool
    fail_msg: "LDMS metrics collection is not enabled in telemetry_config.yml. Set telemetry_sources.ldms.metrics_enabled: true."
    success_msg: "LDMS metrics collection is enabled."

- name: Verify collection_targets are configured for LDMS
  ansible.builtin.assert:
    that:
      - telemetry_config.telemetry_sources.ldms.collection_targets | default([]) | length > 0
    fail_msg: "LDMS collection_targets not configured. Set telemetry_sources.ldms.collection_targets (e.g., ['kafka'])."
    success_msg: "LDMS collection_targets: {{ telemetry_config.telemetry_sources.ldms.collection_targets }}"

- name: Verify kubectl is accessible
  ansible.builtin.command: kubectl cluster-info
  register: kubectl_check
  changed_when: false
  failed_when: false

- name: Fail if K8s cluster is not accessible
  ansible.builtin.fail:
    msg: "Cannot connect to Kubernetes cluster. Ensure kubectl is configured and the service K8s cluster is running."
  when: kubectl_check.rc != 0

- name: Verify Vector-LDMS bridge configuration
  ansible.builtin.debug:
    msg: >
      Vector-LDMS bridge: {{ 'ENABLED' if (telemetry_config.telemetry_bridges.vector_ldms.metrics_enabled | default(false) | bool) else 'DISABLED' }}.
      This bridge consumes LDMS data from Kafka and writes to VictoriaMetrics.
  when: telemetry_config.telemetry_bridges is defined

- name: Log LDMS validation complete
  ansible.builtin.debug:
    msg: "LDMS telemetry configuration validated successfully."
