---

# =============================================================================
# Update telemetry status for LDMS
# =============================================================================

- name: Ensure telemetry output directory exists
  ansible.builtin.file:
    path: "{{ telemetry_output_dir }}"
    state: directory
    mode: "0755"

- name: Check if telemetry status file exists
  ansible.builtin.stat:
    path: "{{ telemetry_status_file }}"
  register: status_file_check

- name: Load existing telemetry status
  ansible.builtin.include_vars:
    file: "{{ telemetry_status_file }}"
    name: existing_status
  when: status_file_check.stat.exists

- name: Set LDMS telemetry status
  ansible.builtin.set_fact:
    ldms_status:
      status: "deployed"
      timestamp: "{{ ansible_date_time.iso8601 }}"
      vector_ldms_bridge: "{{ 'deployed' if (telemetry_config.telemetry_bridges.vector_ldms.metrics_enabled | default(false) | bool and victoria_metrics_support | default(false) | bool) else 'disabled' }}"

- name: Update telemetry status file
  ansible.builtin.copy:
    content: |
      ---
      # Telemetry deployment status
      # Auto-generated by enable_ldms role
      telemetry_status:
        ldms: {{ ldms_status | to_nice_yaml | indent(4) }}
    dest: "{{ telemetry_status_file }}"
    mode: "0644"
  when: not status_file_check.stat.exists

- name: Update LDMS entry in existing status file
  ansible.builtin.lineinfile:
    path: "{{ telemetry_status_file }}"
    regexp: '^\s+ldms:'
    line: "    ldms:"
    state: present
  when: status_file_check.stat.exists

- name: Log LDMS status update
  ansible.builtin.debug:
    msg: "LDMS telemetry status updated: {{ ldms_status }}"
