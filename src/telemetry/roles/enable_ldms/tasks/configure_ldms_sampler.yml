# =============================================================================
# Configure LDMS sampler on compute nodes
# =============================================================================
# Renders sampler configuration files to NFS share for compute node consumption.
# Files: sampler.conf, ldmsauth.conf, ldmsd.sampler.env
# =============================================================================

- name: Create LDMS samplers directory in NFS share
  ansible.builtin.file:
    path: "{{ ldms_share_path }}/samplers"
    state: directory
    owner: root
    group: root
    mode: "{{ common_mode }}"

- name: Render LDMS sampler configuration
  ansible.builtin.template:
    src: "{{ role_path }}/templates/ldms/sampler.conf.j2"
    dest: "{{ ldms_share_path }}/samplers/sampler.conf"
    owner: root
    group: root
    mode: "{{ file_permissions_644 }}"

- name: Ensure ldms_sampler_password is available
  ansible.builtin.set_fact:
    ldms_sampler_password: "{{ hostvars['localhost']['ldms_sampler_password'] }}"
  when:
    - hostvars['localhost']['ldms_sampler_password'] is defined
  no_log: true

- name: Render LDMS authentication configuration
  ansible.builtin.template:
    src: "{{ role_path }}/templates/ldms/ldmsauth.conf.j2"
    dest: "{{ ldms_share_path }}/samplers/ldmsauth.conf"
    owner: root
    group: root
    mode: "{{ file_permissions_600 }}"

- name: Render LDMS sampler environment file
  ansible.builtin.template:
    src: "{{ role_path }}/templates/ldms/ldmsd.sampler.env.j2"
    dest: "{{ ldms_share_path }}/samplers/ldmsd.sampler.env"
    owner: root
    group: root
    mode: "{{ file_permissions_644 }}"

- name: Log LDMS sampler configuration complete
  ansible.builtin.debug:
    msg: "LDMS sampler configuration rendered to {{ ldms_share_path }}/samplers/"
