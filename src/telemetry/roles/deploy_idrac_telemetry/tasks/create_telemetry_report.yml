# =============================================================================
# Create Telemetry Report
# =============================================================================
# Generates a detailed telemetry collection report showing:
# - Total IPs with telemetry activated
# - IPs with telemetry not supported (firmware/connectivity issues)
# - Deleted nodes (removed from database)
# =============================================================================

- name: Create and update telemetry report from template
  ansible.builtin.template:
    src: "{{ telemetry_report_template }}"
    dest: "{{ telemetry_report_path }}"
    mode: "{{ filemode }}"
    force: true
  delegate_to: localhost

- name: Telemetry report overview
  ansible.builtin.debug:
    msg: "{{ telemetry_report.splitlines() }}"
  when:
    - telemetry_config.telemetry_sources.idrac.metrics_enabled | default(false) | bool
