# =============================================================================
# idrac_telemetry — Enable iDRAC telemetry
# =============================================================================
# Deploys iDRAC telemetry stack (receiver, kafkapump, victoriapump, mysqldb,
# activemq) with Kafka and VictoriaMetrics as collection targets.
#
# Re-enable aware: if the StatefulSet already exists at 0 replicas (previously
# disabled), scales it back up to the correct replica count derived from the
# BMC CSV parent count, preserving existing PVCs and data.
#
# Prerequisites:
#   - Service K8s cluster running with kubectl access
#   - telemetry_config.yml populated with iDRAC source enabled
#   - telemetry_credentials.yml with bmc_username/bmc_password, mysqldb creds
#   - deploy_kafka and deploy_victoria roles run before this role
# =============================================================================

- name: Load telemetry configuration
  ansible.builtin.include_role:
    name: common
    tasks_from: load_telemetry_config
  when: telemetry_config is not defined
  async: 60
  poll: 0

- name: Validate iDRAC telemetry configuration
  ansible.builtin.include_tasks: validate_config.yml
  when: telemetry_config is defined

- name: Derive sink support flags
  ansible.builtin.include_role:
    name: common
    tasks_from: derive_sink_support_flags
  when: kafka_support is not defined

# --- Compute dynamic replica count from BMC CSV ---
- name: Compute iDRAC replica count from BMC CSV parent count
  when:
    - hostvars['localhost']['telemetry_config'].idrac_telemetry_configurations.bmc_group_data_path is defined
    - hostvars['localhost']['telemetry_config'].idrac_telemetry_configurations.bmc_group_data_path | length > 0
  block:
    - name: Read BMC group data CSV for replica count
      ansible.builtin.set_fact:
        _bmc_csv_lines: "{{ lookup('file', hostvars['localhost']['telemetry_config'].idrac_telemetry_configurations.bmc_group_data_path).split('\n') }}"

    - name: Count unique parents in BMC CSV (determines replica count)
      ansible.builtin.set_fact:
        idrac_replica_count: >-
          {%- set parents = [] -%}
          {%- for line in _bmc_csv_lines[1:] if line.strip() -%}
            {%- set parts = line.split(',') -%}
            {%- if parts | length >= 3 and parts[2].strip() -%}
              {%- if parts[2].strip() not in parents -%}
                {%- set _ = parents.append(parts[2].strip()) -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {{ [parents | length, 1] | max }}

    - name: Display computed iDRAC replica count
      ansible.builtin.debug:
        msg: "iDRAC replica count from BMC CSV: {{ idrac_replica_count }}"

- name: Set default replica count when BMC CSV is not configured
  ansible.builtin.set_fact:
    idrac_replica_count: 1
  when: idrac_replica_count is not defined

# --- Detect re-enable scenario ---
- name: Check if iDRAC StatefulSet already exists (re-enable detection)
  ansible.builtin.command: >
    kubectl get statefulset {{ idrac_telemetry_k8s_name }} -n {{ telemetry_namespace }}
    -o jsonpath='{.spec.replicas}'
  register: idrac_sts_current_replicas
  changed_when: false
  failed_when: false

- name: Detect re-enable scenario (StatefulSet at 0 replicas)
  ansible.builtin.set_fact:
    idrac_is_reenable: "{{ idrac_sts_current_replicas.rc == 0 and idrac_sts_current_replicas.stdout == '0' }}"

- name: Display re-enable detection result
  ansible.builtin.debug:
    msg: >-
      {% if idrac_is_reenable | bool %}
      Re-enable detected: iDRAC StatefulSet exists at 0 replicas — will scale back up to {{ idrac_replica_count }} replicas
      {% else %}
      Fresh deploy or already running — proceeding with standard enable flow
      {% endif %}

- name: Install Python dependencies for iDRAC telemetry on kube_vip host
  ansible.builtin.include_role:
    name: common
    tasks_from: install_python_dependencies
  vars:
    component: idrac

- name: Generate iDRAC telemetry manifests
  ansible.builtin.include_tasks: generate_manifests.yml

- name: Deploy iDRAC telemetry
  ansible.builtin.include_tasks: deploy_idrac_telemetry.yml

- name: Verify iDRAC telemetry
  ansible.builtin.include_tasks: verify_idrac_telemetry.yml

- name: Initiate telemetry service cluster (sync BMC inventory with MySQL DB)
  ansible.builtin.include_tasks: initiate_telemetry_service_cluster.yml
  when:
    - hostvars['localhost']['telemetry_config'].idrac_telemetry_configurations.bmc_group_data_path is defined
    - hostvars['localhost']['telemetry_config'].idrac_telemetry_configurations.bmc_group_data_path | length > 0

- name: Generate telemetry collection report
  when:
    - hostvars['localhost']['telemetry_config'].idrac_telemetry_configurations.bmc_group_data_path is defined
    - hostvars['localhost']['telemetry_config'].idrac_telemetry_configurations.bmc_group_data_path | length > 0
  block:
    - name: Create telemetry collection report
      ansible.builtin.include_tasks: create_telemetry_report.yml

  rescue:
    - name: Display telemetry report generation warning
      ansible.builtin.debug:
        msg: >-
          iDRAC telemetry deployment completed, but telemetry report generation failed:
          {{ ansible_failed_result.msg | default('Unknown error') }}

## Status is now collected centrally in deploy.yml Phase 4.
