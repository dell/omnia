---

# =============================================================================
# Initiate Telemetry Service Cluster
# =============================================================================
# Synchronizes BMC inventory from bmc_group_data.csv with MySQL database
# in the iDRAC telemetry StatefulSet. Validates BMC reachability, filters
# by firmware version, and enables telemetry collection on supported iDRACs.
#
# Prerequisites:
#   - iDRAC telemetry StatefulSet deployed
#   - bmc_group_data_path configured in telemetry_config.yml
#   - MySQL database accessible in telemetry namespace
# =============================================================================

- name: Initialize variables
  ansible.builtin.set_fact:
    telemetry_idrac: []
    service_type: 3
    auth_type: 1
    idrac_ip_count: 0
    telemetry_idrac_count: 0
    failed_idrac_count: 0
    failed_idrac: []
    deleted_idrac_count: 0
    deleted_idrac_ips: []
    failed_delete_count: 0
    failed_delete_ips: []
    disabled_telemetry_count: 0
    disabled_telemetry_ips: []

- name: Load BMC inventory from bmc_group_data.csv
  ansible.builtin.set_fact:
    bmc_ips_dict: "{{ lookup('file', telemetry_config.idrac_telemetry_configurations.bmc_group_data_path) | from_yaml }}"
  when:
    - telemetry_config.idrac_telemetry_configurations.bmc_group_data_path is defined
    - telemetry_config.idrac_telemetry_configurations.bmc_group_data_path | length > 0

- name: Fetch iDRAC BMC IPs for each pod
  fetch_idrac_ips:
    service_cluster_metadata: "{{ service_cluster_metadata }}"
    parent_to_bmc_ip_details: "{{ bmc_ips_dict }}"
  register: idrac_podname_idracips

- name: Show iDRAC IPs for each pod
  ansible.builtin.debug:
    msg: "iDRAC IPs for pod '{{ item.key }}': {{ item.value | join(', ') }}"
    verbosity: 2
  loop: "{{ idrac_podname_idracips.idrac_podname_ips | dict2items }}"
  when:
    - idrac_podname_idracips.idrac_podname_ips is defined
    - idrac_podname_idracips.idrac_podname_ips | length > 0

- name: Read existing BMC IPs from MySQL database
  block:
    - name: Query MySQL database for existing iDRAC IPs
      read_idracips_from_mysqldb:
        telemetry_namespace: "{{ telemetry_namespace }}"
        idrac_podnames: "{{ idrac_podname_idracips.idrac_podname_ips.keys() | list }}"
        mysqldb_k8s_name: "{{ mysqldb_k8s_name }}"
        mysqldb_name: "{{ mysqldb_name }}"
        mysqldb_user: "{{ telemetry_credentials.mysqldb_user }}"
        mysqldb_password: "{{ telemetry_credentials.mysqldb_password }}"
        db_retries: "{{ db_retries }}"
        db_delay: "{{ db_delay }}"
      register: existing_mysqldb_idracips
  rescue:
    - name: Failed to connect to MySQL database
      ansible.builtin.fail:
        msg: "{{ mysqldb_connect_fail_msg }}"

- name: Set existing BMC IPs from MySQL database
  ansible.builtin.set_fact:
    db_idrac_ip_list: "{{ existing_mysqldb_idracips.mysqldb_idrac_ips }}"
    existing_pod_to_db_idrac_ips: "{{ existing_mysqldb_idracips.pod_to_db_idrac_ips }}"

- name: Flatten BMC IPs from inventory
  ansible.builtin.set_fact:
    bmc_ips: "{{ bmc_ips_dict.values() | flatten }}"

- name: Generate filtered iDRAC IP list (new IPs not in DB)
  ansible.builtin.set_fact:
    filtered_bmc_ip_list: "{{ bmc_ips | difference(db_idrac_ip_list) }}"

- name: Show filtered BMC IPs
  ansible.builtin.debug:
    msg: "Filtered BMC IPs (new): {{ filtered_bmc_ip_list }}"

- name: Remove deleted nodes from telemetry (nodes not in bmc_group_data.csv)
  ansible.builtin.include_tasks: remove_deleted_nodes.yml

- name: Convert filtered BMC IP list to dictionary format
  ansible.builtin.set_fact:
    filtered_bmc_ip_dict_list: "{{ filtered_bmc_ip_list | map('community.general.dict_kv', 'bmc_ip') | list }}"

- name: Validate BMC reachability and enable telemetry
  ansible.builtin.include_tasks: validate_bmcips_reachability.yml
  when: filtered_bmc_ip_list | length > 0

- name: Add iDRAC details to MySQL database
  when:
    - telemetry_idrac is defined
    - telemetry_idrac | length > 0
  block:
    - name: Insert valid iDRAC IPs into MySQL database
      insert_idracips_mysqldb:
        telemetry_namespace: "{{ telemetry_namespace }}"
        idrac_podnames_ips: "{{ idrac_podname_idracips.idrac_podname_ips }}"
        mysqldb_k8s_name: "{{ mysqldb_k8s_name }}"
        mysqldb_name: "{{ mysqldb_name }}"
        mysql_user: "{{ telemetry_credentials.mysqldb_user }}"
        mysqldb_password: "{{ telemetry_credentials.mysqldb_password }}"
        bmc_username: "{{ telemetry_credentials.bmc_username }}"
        bmc_password: "{{ telemetry_credentials.bmc_password }}"
        telemetry_idrac: "{{ telemetry_idrac }}"
        service_type: "{{ service_type }}"
        auth_type: "{{ auth_type }}"
        db_retries: "{{ db_retries }}"
        db_delay: "{{ db_delay }}"
      register: add_idrac_to_db
  rescue:
    - name: Failed to insert iDRAC IPs into MySQL database
      ansible.builtin.fail:
        msg: "{{ mysqldb_insert_fail_msg }}"

- name: Show iDRACs added to MySQL database
  ansible.builtin.debug:
    msg: "iDRACs added to MySQL database: {{ add_idrac_to_db.inserted_ips | default('No results returned') }}"
  when: add_idrac_to_db is defined

- name: Show iDRACs failed to add to MySQL database
  ansible.builtin.debug:
    msg: "iDRACs failed to add to MySQL database: {{ add_idrac_to_db.failed_ips | default('No failed IPs') }}"
  when: add_idrac_to_db is defined

- name: Trigger rolling restart of iDRAC telemetry StatefulSet
  when:
    - telemetry_idrac is defined
    - telemetry_idrac | length > 0
  block:
    - name: Restart iDRAC telemetry StatefulSet
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: "{{ idrac_telemetry_k8s_name }}"
            namespace: "{{ telemetry_namespace }}"
          spec:
            template:
              metadata:
                annotations:
                  kubectl.kubernetes.io/restartedAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
      register: restart_statefulset
  rescue:
    - name: StatefulSet restart failed
      ansible.builtin.fail:
        msg: "{{ idrac_telemetry_statefulset_restart_failure_msg }}"
