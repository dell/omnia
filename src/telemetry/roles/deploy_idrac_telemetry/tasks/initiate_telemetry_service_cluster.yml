---

# =============================================================================
# Initiate Telemetry Service Cluster
# =============================================================================
# Synchronizes BMC inventory from bmc_group_data.csv with MySQL database
# in the iDRAC telemetry StatefulSet. Validates BMC reachability, filters
# by firmware version, and enables telemetry collection on supported iDRACs.
#
# Prerequisites:
#   - iDRAC telemetry StatefulSet deployed
#   - bmc_group_data_path configured in telemetry_config.yml
#   - MySQL database accessible in telemetry namespace
# =============================================================================

- name: Initialize variables
  ansible.builtin.set_fact:
    telemetry_idrac: []
    service_type: 3
    auth_type: 1
    idrac_ip_count: 0
    telemetry_idrac_count: 0
    failed_idrac_count: 0
    failed_idrac: []
    deleted_idrac_count: 0
    deleted_idrac_ips: []
    failed_delete_count: 0
    failed_delete_ips: []
    disabled_telemetry_count: 0
    disabled_telemetry_ips: []

- name: Load BMC inventory from bmc_group_data.csv
  ansible.builtin.set_fact:
    bmc_group_data_lines: "{{ lookup('file', telemetry_config.idrac_telemetry_configurations.bmc_group_data_path).split('\n') }}"
  when:
    - telemetry_config.idrac_telemetry_configurations.bmc_group_data_path is defined
    - telemetry_config.idrac_telemetry_configurations.bmc_group_data_path | length > 0

- name: Parse BMC group data CSV and create parent-to-IP mapping
  ansible.builtin.set_fact:
    bmc_ips_dict: >-
      {%- set result = {'MGMT_node': []} -%}
      {%- for line in bmc_group_data_lines[1:] if line.strip() -%}
        {%- set parts = line.split(',') -%}
        {%- if parts | length >= 3 -%}
          {%- set bmc_ip = parts[0].strip() -%}
          {%- set parent = parts[2].strip() -%}
          {%- if parent -%}
            {%- set _ = result.update({parent: result.get(parent, []) + [bmc_ip]}) -%}
          {%- else -%}
            {%- set _ = result['MGMT_node'].append(bmc_ip) -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ result }}

- name: Create service_cluster_metadata for single-pod iDRAC telemetry deployment
  ansible.builtin.set_fact:
    service_cluster_metadata:
      MGMT_node:
        parent_status: true
        service_tag: MGMT_node
        role: service_kube_control_plane
        idrac_podname: idrac-telemetry-0
  when: service_cluster_metadata is not defined

- name: Fetch iDRAC BMC IPs for each pod
  fetch_idrac_ips:
    service_cluster_metadata: "{{ service_cluster_metadata }}"
    parent_to_bmc_ip_details: "{{ bmc_ips_dict }}"
  register: idrac_podname_idracips

- name: Show iDRAC IPs for each pod
  ansible.builtin.debug:
    msg: "iDRAC IPs for pod '{{ item.key }}': {{ item.value | join(', ') }}"
    verbosity: 2
  loop: "{{ idrac_podname_idracips.idrac_podname_ips | dict2items }}"
  when:
    - idrac_podname_idracips.idrac_podname_ips is defined
    - idrac_podname_idracips.idrac_podname_ips | length > 0

- name: Read existing BMC IPs from MySQL database
  block:
    - name: Query MySQL database for existing iDRAC IPs
      read_idracips_from_mysqldb:
        telemetry_namespace: "{{ telemetry_namespace }}"
        idrac_podnames: "{{ idrac_podname_idracips.idrac_podname_ips.keys() | list }}"
        mysqldb_k8s_name: "{{ mysqldb_k8s_name }}"
        mysqldb_name: "{{ mysqldb_name }}"
        mysqldb_user: "{{ telemetry_credentials.mysqldb_user }}"
        mysqldb_password: "{{ telemetry_credentials.mysqldb_password }}"
        db_retries: "{{ db_retries }}"
        db_delay: "{{ db_delay }}"
      register: existing_mysqldb_idracips
  rescue:
    - name: Failed to connect to MySQL database
      ansible.builtin.fail:
        msg: "{{ mysqldb_connect_fail_msg }}"

- name: Set existing BMC IPs from MySQL database
  ansible.builtin.set_fact:
    db_idrac_ip_list: "{{ existing_mysqldb_idracips.mysqldb_idrac_ips }}"
    existing_pod_to_db_idrac_ips: "{{ existing_mysqldb_idracips.pod_to_db_idrac_ips }}"

- name: Flatten BMC IPs from inventory
  ansible.builtin.set_fact:
    bmc_ips: "{{ bmc_ips_dict.values() | flatten }}"

- name: Generate filtered iDRAC IP list (new IPs not in DB)
  ansible.builtin.set_fact:
    filtered_bmc_ip_list: "{{ bmc_ips | difference(db_idrac_ip_list) }}"

- name: Show filtered BMC IPs
  ansible.builtin.debug:
    msg: "Filtered BMC IPs (new): {{ filtered_bmc_ip_list }}"

- name: Convert filtered BMC IP list to dictionary format
  ansible.builtin.set_fact:
    filtered_bmc_ip_dict_list: "{{ filtered_bmc_ip_list | map('community.general.dict_kv', 'bmc_ip') | list }}"

# Load cluster inventory to get worker node IPs for BMC validation
# cluster_inv is loaded in common.load_telemetry_config from telemetry_config.cluster_inventory
- name: Check if cluster inventory is available
  ansible.builtin.set_fact:
    cluster_inv_available: "{{ cluster_inv is defined }}"

- name: Get all worker node IPs for BMC validation (from cluster inventory)
  ansible.builtin.set_fact:
    worker_node_list: >-
      {{
        (cluster_inv.all.children.service_kube_node_x86_64.hosts | default({}))
        | dict2items
        | map(attribute='value')
        | map(attribute='ansible_host')
        | list
      }}
  when:
    - cluster_inv_available | bool

- name: Get all worker node IPs for BMC validation (fallback to nodes)
  ansible.builtin.set_fact:
    worker_node_list: >-
      {{ nodes
         | selectattr('group', 'match', '^service_kube_node')
         | map(attribute='interfaces')
         | map('first')
         | map(attribute='ip_addrs')
         | map('selectattr', 'name', 'equalto', 'management')
         | map('map', attribute='ip_addr')
         | map('first')
         | list }}
  when:
    - worker_node_list is not defined or worker_node_list | length == 0
    - nodes is defined
    - nodes | selectattr('group', 'match', '^service_kube_node') | list | length > 0

- name: Set first worker node for BMC validation
  ansible.builtin.set_fact:
    worker_node: "{{ worker_node_list[0] }}"
  when: worker_node_list | default([]) | length > 0

- name: Log worker node for BMC validation
  ansible.builtin.debug:
    msg: >-
      Worker node for BMC validation: {{ worker_node | default('none') }},
      All worker nodes: {{ worker_node_list | default([]) }}

- name: Remove deleted nodes from telemetry (nodes not in bmc_group_data.csv)
  ansible.builtin.include_tasks: remove_deleted_nodes.yml

- name: Test SSH connectivity to worker node
  ansible.builtin.command: >
    ssh -o ConnectTimeout=10 -o BatchMode=yes -o StrictHostKeyChecking=no
    {{ worker_node }} echo reachable
  register: worker_ssh_test
  failed_when: false
  changed_when: false
  when:
    - worker_node is defined
    - filtered_bmc_ip_list | length > 0

- name: Set worker node reachability flag
  ansible.builtin.set_fact:
    worker_node_reachable: "{{ worker_ssh_test.rc | default(1) == 0 }}"
  when: worker_node is defined

- name: Validate BMC reachability from worker node
  ansible.builtin.include_tasks: validate_bmcips_reachability.yml
  when:
    - worker_node is defined
    - worker_node_reachable | default(false) | bool
    - filtered_bmc_ip_list | length > 0

- name: Validate BMC reachability from control plane (worker node unreachable)
  when:
    - filtered_bmc_ip_list | length > 0
    - not (worker_node_reachable | default(false) | bool)
  block:
    - name: Log fallback to control plane for BMC validation
      ansible.builtin.debug:
        msg: >-
          Worker node {{ worker_node | default('undefined') }} is not SSH-reachable.
          Running BMC validation from control plane instead.

    - name: Validate BMC reachability from control plane
      update_bmc_group_entry:
        nodes: "{{ filtered_bmc_ip_dict_list }}"
        bmc_username: "{{ telemetry_credentials.bmc_username }}"
        bmc_password: "{{ telemetry_credentials.bmc_password }}"
        verify_bmc: true
      register: bmc_result
      ignore_errors: true

    - name: Show verified BMC entries
      when: bmc_result.verified_bmc | length > 0
      ansible.builtin.debug:
        msg: "BMC entries valid for IPs: {{ bmc_result.verified_bmc | join(', ') }}"

    - name: Show Unreachable BMC IPs
      when: bmc_result.unreachable_bmc | length > 0
      ansible.builtin.debug:
        msg: "Unreachable BMC IPs: {{ bmc_result.unreachable_bmc | join(', ') }}"

    - name: Set fact for BMC IPs validation result
      ansible.builtin.set_fact:
        idrac_redfish_disabled: "{{ bmc_result.redfish_disabled | default([]) }}"
        idrac_invalid_creds: "{{ bmc_result.invalid_creds | default([]) }}"
        idrac_unreachable: "{{ bmc_result.unreachable_bmc | default([]) }}"
        invalid_idrac_count: >-
          {{ (bmc_result.invalid_creds | default([]) + bmc_result.unreachable_bmc | default([]) + bmc_result.redfish_disabled | default([])) | length }}
        invalid_idrac_list: >-
          {{ bmc_result.invalid_creds | default([]) + bmc_result.unreachable_bmc | default([]) + bmc_result.redfish_disabled | default([]) }}

    - name: Filter iDRACs matching telemetry pre-requisites from control plane
      idrac_telemetry_filter:
        bmc_ip_list: "{{ bmc_result.verified_bmc }}"
        bmc_username: "{{ telemetry_credentials.bmc_username }}"
        bmc_password: "{{ telemetry_credentials.bmc_password }}"
        min_firmware_version_reqd: "{{ min_firmware_version_reqd }}"
      register: filter_idrac_output
      when:
        - bmc_result.verified_bmc is defined
        - bmc_result.verified_bmc | length > 0
      ignore_errors: true

    - name: Update the telemetry variables with filtered iDRACs
      ansible.builtin.set_fact:
        telemetry_idrac: "{{ filter_idrac_output.telemetry_idrac | default([]) }}"
        telemetry_idrac_count: "{{ filter_idrac_output.telemetry_idrac_count | default(0) }}"
        failed_idrac_count: "{{ filter_idrac_output.failed_idrac_count | default(0) }}"
        failed_idrac: "{{ filter_idrac_output.failed_idrac | default([]) }}"
      when:
        - filter_idrac_output is defined

    - name: Enable telemetry collection on iDRAC from control plane
      enable_telemetry_service:
        idrac_ips: "{{ telemetry_idrac }}"
        username: "{{ telemetry_credentials.bmc_username }}"
        password: "{{ telemetry_credentials.bmc_password }}"
      register: enable_telemetry_output
      when:
        - telemetry_idrac is defined
        - telemetry_idrac | length > 0
      ignore_errors: true

# If there are unreachable BMCs and a second worker node is available,
# retry those BMCs from the second worker node.
- name: Retry unreachable BMCs from second worker node
  when:
    - idrac_unreachable | default([]) | length > 0
    - worker_node_list | default([]) | length > 1
    - worker_node_reachable | default(false) | bool
  block:
    - name: Build retry BMC list from unreachable IPs
      ansible.builtin.set_fact:
        retry_bmc_ip_list: "{{ idrac_unreachable }}"
        retry_bmc_ip_dict_list: "{{ idrac_unreachable | map('community.general.dict_kv', 'bmc_ip') | list }}"
        retry_worker_node: "{{ worker_node_list[1] }}"

    - name: Retry unreachable BMCs from second worker node
      ansible.builtin.include_tasks: retry_unreachable_bmcs.yml

- name: Add iDRAC details to MySQL database
  when:
    - telemetry_idrac is defined
    - telemetry_idrac | length > 0
  block:
    - name: Insert valid iDRAC IPs into MySQL database
      insert_idracips_mysqldb:
        telemetry_namespace: "{{ telemetry_namespace }}"
        idrac_podnames_ips: "{{ idrac_podname_idracips.idrac_podname_ips }}"
        mysqldb_k8s_name: "{{ mysqldb_k8s_name }}"
        mysqldb_name: "{{ mysqldb_name }}"
        mysql_user: "{{ telemetry_credentials.mysqldb_user }}"
        mysqldb_password: "{{ telemetry_credentials.mysqldb_password }}"
        bmc_username: "{{ telemetry_credentials.bmc_username }}"
        bmc_password: "{{ telemetry_credentials.bmc_password }}"
        telemetry_idrac: "{{ telemetry_idrac }}"
        service_type: "{{ service_type }}"
        auth_type: "{{ auth_type }}"
        db_retries: "{{ db_retries }}"
        db_delay: "{{ db_delay }}"
      register: add_idrac_to_db
  rescue:
    - name: Failed to insert iDRAC IPs into MySQL database
      ansible.builtin.fail:
        msg: "{{ mysqldb_insert_fail_msg }}"

- name: Show iDRACs added to MySQL database
  ansible.builtin.debug:
    msg: "iDRACs added to MySQL database: {{ add_idrac_to_db.inserted_ips | default('No results returned') }}"
  when: add_idrac_to_db is defined

- name: Show iDRACs failed to add to MySQL database
  ansible.builtin.debug:
    msg: "iDRACs failed to add to MySQL database: {{ add_idrac_to_db.failed_ips | default('No failed IPs') }}"
  when: add_idrac_to_db is defined

- name: Trigger rolling restart of iDRAC telemetry StatefulSet
  when:
    - telemetry_idrac is defined
    - telemetry_idrac | length > 0
  block:
    - name: Restart iDRAC telemetry StatefulSet
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: "{{ idrac_telemetry_k8s_name }}"
            namespace: "{{ telemetry_namespace }}"
          spec:
            template:
              metadata:
                annotations:
                  kubectl.kubernetes.io/restartedAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
      register: restart_statefulset
  rescue:
    - name: StatefulSet restart failed
      ansible.builtin.fail:
        msg: "{{ idrac_telemetry_statefulset_restart_failure_msg }}"
