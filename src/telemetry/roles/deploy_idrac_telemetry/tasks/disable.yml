# =============================================================================
# idrac_telemetry — Disable iDRAC telemetry
# =============================================================================
# Scales down the iDRAC telemetry StatefulSet to 0 replicas when
# telemetry_sources.idrac.metrics_enabled is false.
#
# This stops iDRAC metrics collection but preserves the MySQL database
# PVCs for future re-enablement.
# =============================================================================

- name: Load telemetry configuration
  ansible.builtin.include_role:
    name: common
    tasks_from: load_telemetry_config

- name: Check if iDRAC telemetry StatefulSet exists
  ansible.builtin.command: >
    kubectl get statefulset {{ idrac_telemetry_k8s_name }} -n {{ telemetry_namespace }}
  register: idrac_sts_check
  changed_when: false
  failed_when: false

- name: Scale down iDRAC telemetry StatefulSet to 0 replicas
  ansible.builtin.command: >
    kubectl scale statefulset {{ idrac_telemetry_k8s_name }}
    -n {{ telemetry_namespace }} --replicas=0
  register: scale_down_result
  changed_when: "'scaled' in scale_down_result.stdout"
  when: idrac_sts_check.rc == 0

- name: Display scale down result
  ansible.builtin.debug:
    msg: "{{ idrac_telemetry_statefulset_scale_down_msg }}"
  when: idrac_sts_check.rc == 0

- name: StatefulSet not found - nothing to scale down
  ansible.builtin.debug:
    msg: "{{ idrac_telemetry_statefulset_not_found_msg }}"
  when: idrac_sts_check.rc != 0
