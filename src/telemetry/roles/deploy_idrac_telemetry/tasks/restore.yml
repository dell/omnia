---

# Restore only the existing StatefulSet. Kubernetes reuses its retained
# volumeClaimTemplates, Secrets, ConfigMaps, Services, and stable PVC names.

- name: Restore iDRAC telemetry StatefulSet replicas
  ansible.builtin.command: >
    kubectl scale statefulset {{ idrac_telemetry_k8s_name }}
    -n {{ telemetry_namespace }} --replicas={{ idrac_replica_count }}
  register: idrac_restore_scale
  changed_when: "'scaled' in idrac_restore_scale.stdout"
  failed_when: false

- name: Wait for restored iDRAC telemetry StatefulSet rollout
  ansible.builtin.command: >
    kubectl rollout status statefulset/{{ idrac_telemetry_k8s_name }}
    -n {{ telemetry_namespace }} --timeout={{ idrac_deploy_timeout }}
  register: idrac_restore_rollout
  changed_when: false
  failed_when: false
  when: idrac_restore_scale.rc == 0

- name: Record iDRAC restoration failure
  ansible.builtin.set_fact:
    idrac_reconcile_failed: true
    idrac_reconcile_error: >-
      {% if idrac_restore_scale.rc != 0 %}
      Failed to restore {{ idrac_telemetry_k8s_name }} to
      {{ idrac_replica_count }} replicas:
      {{ idrac_restore_scale.stderr | default('unknown kubectl error') }}
      {% else %}
      Timed out waiting for restored {{ idrac_telemetry_k8s_name }} pods:
      {{ idrac_restore_rollout.stderr | default('unknown kubectl error') }}
      {% endif %}
  when: >-
    idrac_restore_scale.rc != 0
    or idrac_restore_rollout.rc | default(0) != 0

- name: Display iDRAC restoration result
  ansible.builtin.debug:
    msg: >-
      {% if idrac_reconcile_failed | bool %}
      {{ idrac_reconcile_error }}
      {% else %}
      Restored {{ idrac_telemetry_k8s_name }} to
      {{ idrac_replica_count }} replicas using retained resources and data.
      {% endif %}
