---

# =============================================================================
# Verify iDRAC telemetry deployment and data collection
# =============================================================================
# Checks:
#   1. StatefulSet pods are Ready
#   2. All containers in the pod are running (mysqldb, activemq, receiver, kafkapump, victoriapump)
#   3. Kafka topic 'idrac' exists and is Ready
#   4. VictoriaMetrics has iDRAC metrics ingested

- name: Verify iDRAC StatefulSet is ready
  ansible.builtin.command: >
    kubectl get statefulset {{ idrac_telemetry_k8s_name }} -n {{ telemetry_namespace }}
    -o jsonpath='{.status.readyReplicas}'
  register: sts_ready
  changed_when: false
  retries: "{{ pod_ready_retries }}"
  delay: "{{ pod_ready_delay }}"
  until: >-
    (sts_ready.stdout | default('0') | int)
    >= (idrac_replica_count | default(1) | int)

- name: Get pod name for iDRAC telemetry
  ansible.builtin.command: >
    kubectl get pods -n {{ telemetry_namespace }}
    -l app={{ idrac_telemetry_k8s_name }}
    -o jsonpath='{.items[0].metadata.name}'
  register: idrac_pod_name
  changed_when: false

- name: Verify all containers are running in iDRAC pod
  ansible.builtin.command: >
    kubectl get pod {{ idrac_pod_name.stdout }} -n {{ telemetry_namespace }}
    -o jsonpath='{range .status.containerStatuses[*]}{.name}={.ready}{"\n"}{end}'
  register: container_status
  changed_when: false
  retries: "{{ pod_ready_retries }}"
  delay: "{{ pod_ready_delay }}"
  until: |
    {% set core_containers = ['idrac-telemetry-receiver', 'mysqldb', 'activemq'] %}
    {% set running_containers = container_status.stdout_lines | select('search', '=true') | map('regex_replace', '=true', '') | list %}
    {% set all_core_running = core_containers | length == (running_containers | intersect(core_containers) | length) %}
    {{ all_core_running }}

- name: Display container status
  ansible.builtin.debug:
    msg: "{{ container_status.stdout_lines }}"

- name: Verify Kafka 'idrac' topic is ready
  ansible.builtin.command: >
    kubectl wait kafkatopic/{{ kafka.topics.idrac.name }}
    -n {{ telemetry_namespace }}
    --for=condition=Ready
    --timeout={{ idrac_verify_timeout }}
  register: kafka_topic_ready
  changed_when: false
  when:
    - telemetry_config.telemetry_sources.idrac.collection_targets is defined
    - "'kafka' in (telemetry_config.telemetry_sources.idrac.collection_targets | default([]))"

- name: Verify VictoriaMetrics has iDRAC metrics (via victoriapump scrape target)
  ansible.builtin.command: >
    kubectl exec -n {{ telemetry_namespace }}
    {{ idrac_pod_name.stdout }} -c victoria-pump --
    wget -qO- http://localhost:2112/metrics 2>/dev/null
  register: victoria_metrics_check
  changed_when: false
  failed_when: false
  retries: 3
  delay: 15
  when:
    - telemetry_config.telemetry_sources.idrac.collection_targets is defined
    - "'victoria_metrics' in (telemetry_config.telemetry_sources.idrac.collection_targets | default([]))"

- name: Log VictoriaMetrics iDRAC scrape status
  ansible.builtin.debug:
    msg: >
      {% if victoria_metrics_check.rc == 0 %}
      VictoriaPump metrics endpoint is active. iDRAC metrics are being collected.
      {% else %}
      VictoriaPump metrics endpoint not yet available. Data may take a few minutes to flow.
      {% endif %}
  when:
    - telemetry_config.telemetry_sources.idrac.collection_targets is defined
    - "'victoria_metrics' in (telemetry_config.telemetry_sources.idrac.collection_targets | default([]))"

- name: Build iDRAC StatefulSet readiness summary
  ansible.builtin.set_fact:
    idrac_statefulset_summary: >-
      {{ idrac_telemetry_k8s_name }}
      ({{ sts_ready.stdout | default('0') }}/
      {{- idrac_replica_count | default(1) }} ready)

- name: Display verification summary
  ansible.builtin.debug:
    msg: |
      ====== iDRAC Telemetry Verification Summary ======
      StatefulSet:     {{ idrac_statefulset_summary }}
      Pod:             {{ idrac_pod_name.stdout }}
      Containers:
      {{ container_status.stdout | default('  (unknown)') }}
      {% if 'kafka' in (telemetry_config.telemetry_sources.idrac.collection_targets | default([])) %}
      Kafka topic:     {{ kafka.topics.idrac.name }} {{ 'READY' if kafka_topic_ready.rc | default(1) == 0 else 'NOT READY' }}
      {% else %}
      Kafka topic:     DISABLED (not in collection_targets)
      {% endif %}
      {% if 'victoria_metrics' in (telemetry_config.telemetry_sources.idrac.collection_targets | default([])) %}
      VictoriaPump:    {{ 'ACTIVE' if victoria_metrics_check.rc | default(1) == 0 else 'PENDING' }}
      {% else %}
      VictoriaPump:    DISABLED (not in collection_targets)
      {% endif %}
      ===================================================
