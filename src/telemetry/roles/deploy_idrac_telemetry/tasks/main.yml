# =============================================================================
# deploy_idrac_telemetry — Orchestrator
# =============================================================================
# Consolidated role for enabling or disabling iDRAC telemetry.
# Routes to appropriate task files based on telemetry_config.yml flags.
#
# Enable: Deploys iDRAC telemetry stack (receiver, kafkapump, victoriapump,
# mysqldb, activemq) with Kafka and VictoriaMetrics as collection targets.
#
# Disable: Scales down iDRAC telemetry StatefulSet to 0 replicas, preserving
# PVCs for future re-enablement.
# =============================================================================

- name: Load telemetry configuration
  ansible.builtin.include_role:
    name: common
    tasks_from: load_telemetry_config
  when: telemetry_config is not defined

- name: Determine iDRAC telemetry state from config
  ansible.builtin.set_fact:
    idrac_enabled: "{{ telemetry_config.telemetry_sources.idrac.metrics_enabled | default(false) | bool }}"
  when: telemetry_config is defined

- name: Enable iDRAC telemetry
  ansible.builtin.include_tasks: enable.yml
  when: idrac_enabled | default(false) | bool

- name: Disable iDRAC telemetry
  ansible.builtin.include_tasks: disable.yml
  when: not (idrac_enabled | default(false) | bool)
