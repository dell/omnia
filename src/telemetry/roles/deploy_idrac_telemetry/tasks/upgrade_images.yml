---

# This task file upgrades container images in the iDRAC telemetry StatefulSet
# It uses a rolling restart strategy to minimize downtime

- name: Patch iDRAC telemetry StatefulSet with new images
  kubernetes.core.k8s:
    state: patched
    api_version: apps/v1
    kind: StatefulSet
    name: "{{ idrac_telemetry_k8s_name }}"
    namespace: "{{ telemetry_namespace }}"
    definition:
      spec:
        template:
          spec:
            containers:
              - name: mysqldb
                image: "{{ mysql_image }}"
              - name: activemq
                image: "{{ activemq_image }}"
              - name: idrac-telemetry-receiver
                image: "{{ idrac_telemetry_receiver_image }}"
              - name: kafka-pump
                image: "{{ kafkapump_image }}"
              - name: victoria-pump
                image: "{{ victoriapump_image }}"
  register: patch_result

- name: Display patch result
  ansible.builtin.debug:
    msg: "StatefulSet patched successfully. Rolling restart will begin automatically."

- name: Wait for rolling restart to begin
  ansible.builtin.pause:
    seconds: 5

- name: Monitor pod restart progress
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ telemetry_namespace }}"
    label_selectors:
      - "app={{ idrac_telemetry_k8s_name }}"
  register: pod_status
  until:
    - pod_status.resources | length > 0
    - pod_status.resources | selectattr('status.containerStatuses', 'defined') | list | length > 0
    - pod_status.resources[0].status.containerStatuses | selectattr('name', 'equalto', 'activemq') | map(attribute='image') | first == activemq_image
  retries: 30
  delay: 10
  failed_when: false

- name: Verify all containers are running with new images
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ telemetry_namespace }}"
    label_selectors:
      - "app={{ idrac_telemetry_k8s_name }}"
  register: final_pod_status

- name: Display final pod status
  ansible.builtin.debug:
    msg:
      - "Pod: {{ item.metadata.name }}"
      - "ActiveMQ image: {{ item.status.containerStatuses | selectattr('name', 'equalto', 'activemq') | map(attribute='image') | first }}"
      - "MySQL image: {{ item.status.containerStatuses | selectattr('name', 'equalto', 'mysqldb') | map(attribute='image') | first }}"
      - "Status: {{ item.status.phase }}"
  loop: "{{ final_pod_status.resources }}"
  loop_control:
    label: "{{ item.metadata.name }}"
