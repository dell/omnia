---

# =============================================================================
# Generate iDRAC telemetry K8s manifests
# =============================================================================
# Uses local templates in this role.
# Renders: activemq-config.yaml, idrac_telemetry_statefulset.yaml

- name: Ensure telemetry credentials are available
  ansible.builtin.set_fact:
    telemetry_credentials: "{{ hostvars['localhost']['telemetry_credentials'] }}"
  when:
    - hostvars['localhost']['telemetry_credentials'] is defined
  no_log: true

- name: Create telemetry deployments directory
  ansible.builtin.file:
    path: "{{ telemetry_deployments_dir }}"
    state: directory
    mode: "0755"

- name: Debug manifest directory
  ansible.builtin.debug:
    msg: "Manifest directory: {{ telemetry_deployments_dir }}, Role path: {{ role_path }}"

- name: Debug telemetry registry
  ansible.builtin.debug:
    msg: "Telemetry registry: {{ telemetry_registry | default('NOT_DEFINED') }}"

- name: Render ActiveMQ ConfigMap
  ansible.builtin.template:
    src: "{{ role_path }}/templates/activemq-config.yaml.j2"
    dest: "{{ telemetry_deployments_dir }}/activemq-config.yaml"
    mode: "0644"
    force: yes

- name: Render iDRAC telemetry StatefulSet
  ansible.builtin.template:
    src: "{{ role_path }}/templates/idrac_telemetry_statefulset.yaml.j2"
    dest: "{{ telemetry_deployments_dir }}/idrac_telemetry_statefulset.yaml"
    mode: "0644"
    force: yes

# Namespace template task removed - namespace already exists and template path issue blocks manifest generation
# TODO: Fix namespace template path resolution and re-enable

- name: Render telemetry secrets
  ansible.builtin.template:
    src: "{{ role_path }}/templates/telemetry_secret_creation.yaml.j2"
    dest: "{{ telemetry_deployments_dir }}/telemetry_secret_creation.yaml"
    mode: "0644"
    force: yes

- name: Log manifest generation complete
  ansible.builtin.debug:
    msg: >
      iDRAC telemetry manifests generated at {{ telemetry_deployments_dir }}:
      activemq-config.yaml, idrac_telemetry_statefulset.yaml,
      telemetry_namespace_creation.yaml, telemetry_secret_creation.yaml
