---

# =============================================================================
# Update telemetry_status.yml with iDRAC deployment result
# =============================================================================

- name: Ensure output directory exists
  ansible.builtin.file:
    path: "{{ telemetry_output_dir }}"
    state: directory
    mode: "0755"

- name: Load existing telemetry status
  ansible.builtin.include_vars:
    file: "{{ telemetry_status_file }}"
    name: existing_status
  failed_when: false

- name: Calculate BMC server count
  ansible.builtin.set_fact:
    _bmc_count: "{{ (telemetry_config.idrac_telemetry_configurations.oim_bmc_ips | dict2items | selectattr('value', 'ne', '') | list | length) | default(0) }}"

- name: Update telemetry status with iDRAC result
  ansible.builtin.copy:
    dest: "{{ telemetry_status_file }}"
    content: |
      # Telemetry post-provision status
      # Auto-generated by telemetry.yml after each run. This placeholder is overwritten.
      ---
      generated_at: "{{ ansible_date_time.iso8601 }}"
      namespace: "{{ telemetry_namespace }}"

      telemetry_state:
        kafka:
          deployed: {{ existing_status.telemetry_state.kafka.deployed | default(false) }}
        victoria_metrics:
          deployed: {{ existing_status.telemetry_state.victoria_metrics.deployed | default(false) }}
        victoria_logs:
          deployed: {{ existing_status.telemetry_state.victoria_logs.deployed | default(false) }}
        idrac:
          deployed: true
          version: "{{ idrac_telemetry_receiver_image | default('') }}"
          bmc_servers_configured: {{ _bmc_count }}
        ldms:
          deployed: {{ existing_status.telemetry_state.ldms.deployed | default(false) }}
        powerscale:
          deployed: {{ existing_status.telemetry_state.powerscale.deployed | default(false) }}
        ufm:
          deployed: {{ existing_status.telemetry_state.ufm.deployed | default(false) }}
        vast:
          deployed: {{ existing_status.telemetry_state.vast.deployed | default(false) }}

      telemetry_results:
        overall_status: "{{ 'success' if (sts_ready.stdout | default('0') | int) >= 1 else 'failed' }}"
        components:
          kafka:
            status: "{{ existing_status.telemetry_results.components.kafka.status | default('not_deployed') }}"
          victoria_metrics:
            status: "{{ existing_status.telemetry_results.components.victoria_metrics.status | default('not_deployed') }}"
          victoria_logs:
            status: "{{ existing_status.telemetry_results.components.victoria_logs.status | default('not_deployed') }}"
          idrac:
            status: "{{ 'success' if (sts_ready.stdout | default('0') | int) >= 1 else 'failed' }}"
          ldms:
            status: "{{ existing_status.telemetry_results.components.ldms.status | default('not_deployed') }}"
          powerscale:
            status: "{{ existing_status.telemetry_results.components.powerscale.status | default('not_deployed') }}"
          ufm:
            status: "{{ existing_status.telemetry_results.components.ufm.status | default('not_deployed') }}"
          vast:
            status: "{{ existing_status.telemetry_results.components.vast.status | default('not_deployed') }}"
    mode: "0644"

- name: Log status update
  ansible.builtin.debug:
    msg: "Telemetry status updated at {{ telemetry_status_file }}"
