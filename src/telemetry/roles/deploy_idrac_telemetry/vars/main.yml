---

# Paths — derived from telemetry_setup role (Step 0, tags: always)
# input_project_dir, output_project_dir, and telemetry_data_path are set by telemetry_setup.
# telemetry_config_file and telemetry_storage_config_file are defined in common/vars/main.yml.
telemetry_output_dir: "{{ output_project_dir | default('/opt/omnia/telemetry/output/project_default') }}"
telemetry_status_file: "{{ telemetry_output_dir }}/telemetry_status.yml"

# Namespace
telemetry_namespace: "telemetry"

# iDRAC telemetry K8s identifiers
idrac_telemetry_k8s_name: "idrac-telemetry"
idrac_telemetry_service_name: "idrac-telemetry-service"

# Deploy directory on NFS share (where manifests are staged)
telemetry_deploy_dir: "{{ cluster_mount }}/telemetry"
telemetry_deployments_dir: "{{ telemetry_deploy_dir }}/deployments"

# Verification timeouts
idrac_deploy_timeout: "600s"
idrac_verify_timeout: "300s"
pod_ready_retries: 30
pod_ready_delay: 10

# iDRAC Telemetry MySQL storage
mysqldb_secrets_name: mysqldb-credentials
mysqldb_storage: "{{ telemetry_config.idrac_telemetry_configurations.mysqldb_storage | default('1Gi') }}"
mysqldb_pvc_name: mysqldb-storage-claim
mysqldb_k8s_name: mysqldb
mysqldb_name: "idrac_telemetrydb"
mysqldb_container_port1: 3306
mysqldb_container_port2: 33060

# telemetry_registry is already set by load_telemetry_config
# Note: When a private registry host is set, strip the 'docker.io/' prefix from image names
# since private registries store images without the docker.io prefix.
idrac_telemetry_receiver_image: "{% if telemetry_registry.host %}{{ telemetry_registry.host }}/{{ (telemetry_registry.images.idrac.telemetry_receiver | default('dellhpcomniaaisolution/idrac_telemetry_receiver:1.3')) | regex_replace('^docker\\.io/', '') }}{% else %}{{ telemetry_registry.images.idrac.telemetry_receiver | default('docker.io/dellhpcomniaaisolution/idrac_telemetry_receiver:1.3') }}{% endif %}"  # noqa: yaml[line-length]
kafkapump_image: "{% if telemetry_registry.host %}{{ telemetry_registry.host }}/{{ (telemetry_registry.images.idrac.kafka_pump | default('dellhpcomniaaisolution/kafkapump:1.3')) | regex_replace('^docker\\.io/', '') }}{% else %}{{ telemetry_registry.images.idrac.kafka_pump | default('docker.io/dellhpcomniaaisolution/kafkapump:1.3') }}{% endif %}"  # noqa: yaml[line-length]
victoriapump_image: "{% if telemetry_registry.host %}{{ telemetry_registry.host }}/{{ (telemetry_registry.images.idrac.victoria_pump | default('dellhpcomniaaisolution/victoriapump:1.3')) | regex_replace('^docker\\.io/', '') }}{% else %}{{ telemetry_registry.images.idrac.victoria_pump | default('docker.io/dellhpcomniaaisolution/victoriapump:1.3') }}{% endif %}"  # noqa: yaml[line-length]
activemq_image: "{% if telemetry_registry.host %}{{ telemetry_registry.host }}/{{ (telemetry_registry.images.idrac.activemq | default('apache/activemq:6.3.0')) | regex_replace('^docker\\.io/', '') }}{% else %}{{ telemetry_registry.images.idrac.activemq | default('docker.io/apache/activemq:6.3.0') }}{% endif %}"  # noqa: yaml[line-length]
mysql_image: "{% if telemetry_registry.host %}{{ telemetry_registry.host }}/{{ (telemetry_registry.images.idrac.mysql | default('library/mysql:9.7.2')) | regex_replace('^docker\\.io/', '') }}{% else %}{{ telemetry_registry.images.idrac.mysql | default('docker.io/library/mysql:9.7.2') }}{% endif %}"  # noqa: yaml[line-length]

# ActiveMQ ports
activemq_http_port_1: 8161
activemq_http_port_2: 61616
messagebus_http_port: 61613
configui_http_port: 8082

# Kafka topic names (FIXED - cannot be changed)
kafka:
  cluster_id: "kafka-cluster-id"
  topics:
    idrac:
      name: "idrac"
      consumer_group: "idrac-consumer-group"

# iDRAC Telemetry Container Resource Limits
idrac_telemetry_resources:
  mysqldb:
    requests:
      cpu: "{{ telemetry_storage_config.idrac_telemetry_storage.mysqldb.resources.requests.cpu | default('100m') }}"
      memory: "{{ telemetry_storage_config.idrac_telemetry_storage.mysqldb.resources.requests.memory | default('256Mi') }}"
    limits:
      cpu: "{{ telemetry_storage_config.idrac_telemetry_storage.mysqldb.resources.limits.cpu | default('500m') }}"
      memory: "{{ telemetry_storage_config.idrac_telemetry_storage.mysqldb.resources.limits.memory | default('512Mi') }}"
  activemq:
    requests:
      cpu: "{{ telemetry_storage_config.idrac_telemetry_storage.activemq.resources.requests.cpu | default('100m') }}"
      memory: "{{ telemetry_storage_config.idrac_telemetry_storage.activemq.resources.requests.memory | default('512Mi') }}"
    limits:
      cpu: "{{ telemetry_storage_config.idrac_telemetry_storage.activemq.resources.limits.cpu | default('500m') }}"
      memory: "{{ telemetry_storage_config.idrac_telemetry_storage.activemq.resources.limits.memory | default('1.5Gi') }}"
  receiver:
    requests:
      cpu: "{{ telemetry_storage_config.idrac_telemetry_storage.receiver.resources.requests.cpu | default('100m') }}"
      memory: "{{ telemetry_storage_config.idrac_telemetry_storage.receiver.resources.requests.memory | default('128Mi') }}"
    limits:
      cpu: "{{ telemetry_storage_config.idrac_telemetry_storage.receiver.resources.limits.cpu | default('500m') }}"
      memory: "{{ telemetry_storage_config.idrac_telemetry_storage.receiver.resources.limits.memory | default('256Mi') }}"
  kafka_pump:
    requests:
      cpu: "{{ telemetry_storage_config.idrac_telemetry_storage.kafka_pump.resources.requests.cpu | default('50m') }}"
      memory: "{{ telemetry_storage_config.idrac_telemetry_storage.kafka_pump.resources.requests.memory | default('128Mi') }}"
    limits:
      cpu: "{{ telemetry_storage_config.idrac_telemetry_storage.kafka_pump.resources.limits.cpu | default('200m') }}"
      memory: "{{ telemetry_storage_config.idrac_telemetry_storage.kafka_pump.resources.limits.memory | default('512Mi') }}"
  victoria_pump:
    requests:
      cpu: "{{ telemetry_storage_config.idrac_telemetry_storage.victoria_pump.resources.requests.cpu | default('50m') }}"
      memory: "{{ telemetry_storage_config.idrac_telemetry_storage.victoria_pump.resources.requests.memory | default('128Mi') }}"
    limits:
      cpu: "{{ telemetry_storage_config.idrac_telemetry_storage.victoria_pump.resources.limits.cpu | default('200m') }}"
      memory: "{{ telemetry_storage_config.idrac_telemetry_storage.victoria_pump.resources.limits.memory | default('512Mi') }}"

# MySQL database connection settings
db_retries: 10
db_delay: 10
filemode: "0644"
min_firmware_version_reqd: 1
waiting_time_30: 30

# BMC group data file path
bmc_group_data_filename: "{{ telemetry_data_path | default('/opt/omnia/telemetry') }}/bmc_group_data.csv"

# Telemetry report
telemetry_report_path: "{{ telemetry_data_path | default('/opt/omnia/telemetry') }}/idrac_telemetry_report.yml"
telemetry_report_template: "telemetry_report.j2"
telemetry_report: |
      ---- Telemetry Report Overview ----

      IP count with Telemetry not supported: {{ (failed_idrac_count | default(0)) | int + (invalid_idrac_count | default(0)) | int }}
      IP count with Telemetry activated in current execution: {{ (telemetry_idrac_count | default(0)) | int }}
      {% if deleted_idrac_count is defined %}
      IP count removed from telemetry (not in bmc_data.csv): {{ deleted_idrac_count | int }}
      {% endif %}

      {% if ((failed_idrac_count | default(0)) | int + (invalid_idrac_count | default(0)) | int) > 0 %}
      Potential reasons for telemetry not being initiated include Redfish connectivity problems, timeout issues,
      iDRAC datacenter license constraints, or firmware-related problems.
      {% endif %}
      {% if (idrac_redfish_disabled | default([])) | length > 0 %}
      IPs with Redfish disabled:
      {% for item in idrac_redfish_disabled %}
        - {{ item }}
      {% endfor %}
      {% endif %}
      {% if (idrac_invalid_creds | default([])) | length > 0 %}
      IPs with invalid credentials:
      {% for item in idrac_invalid_creds %}
        - {{ item }}
      {% endfor %}
      {% endif %}
      {% if (idrac_unreachable | default([])) | length > 0 %}
      IPs with unreachable BMC:
      {% for item in idrac_unreachable %}
        - {{ item }}
      {% endfor %}
      {% endif %}
      {% if (failed_idrac | default([])) | length > 0 %}
      Telemetry not supported because of iDRAC Datacenter license constraints or firmware issues.
      IPs List:
      {% for item in failed_idrac %}
        - {{ item }}
      {% endfor %}
      {% endif %}
      {% if deleted_idrac_ips is defined and deleted_idrac_ips | length > 0 %}
      IPs removed from telemetry database (not present in bmc_data.csv):
      {% for item in deleted_idrac_ips %}
        - {{ item }}
      {% endfor %}
      {% endif %}
      {% if disabled_telemetry_ips is defined and disabled_telemetry_ips | length > 0 %}
      IPs with telemetry disabled via Redfish:
      {% for item in disabled_telemetry_ips %}
        - {{ item }}
      {% endfor %}
      {% endif %}

# Error messages
mysqldb_insert_fail_msg: |
  Failed to add/get iDRAC credential details in the mysql database.
  This could be due to the tables in the mysqldb not being accessible at the moment. Please try running the playbook again after some time.
mysqldb_connect_fail_msg: |
  Failed to connect to MySQL database.
  This could be due to the tables in the mysqldb not being accessible at the moment. Please try running the playbook again after some time.
mysqldb_delete_fail_msg: |
  Failed to delete iDRAC IPs from the mysql database.
  This could be due to the tables in the mysqldb not being accessible at the moment. Please try running the playbook again after some time.
idrac_telemetry_enable_fail_msg: |
  Failed. Error enabling telemetry on iDRAC. Possible causes include timeout or Redfish connectivity issues.
  Please retry the playbook after some time.
filter_idrac_fail_msg: |
  Failed. Error filtering iDRACs. Possible causes include timeout or Redfish connectivity issues.
  Please retry the playbook after some time.
redfish_disabled_msg: |
  Redfish is disabled on the following BMC IPs: {{ bmc_result.redfish_disabled | join(', ') }}.
  Please enable Redfish on above BMC IPs and execute telemetry.yml.
invalid_creds_msg: |
  The following BMC IPs have invalid credentials: {{ bmc_result.invalid_creds | join(', ') }}.
  Kindly make sure correct `bmc_username` and `bmc_password` is present in telemetry_credentials.yml file.
  And all nodes BMC credentials should be same.
  Rectify the issue and re-execute telemetry.yml.
unreachable_service_node_bmc_msg: >
  The following BMC IPs are unreachable: {{ bmc_result.unreachable_bmc | join(', ') }}.
  Please provide BMC IPs which are reachable from service node,
  else remove unreachable BMC entries from the {{ bmc_group_data_filename }} file.
invalid_bmc_warning_msg: |
  [WARNING] Some BMC IPs are not valid. Kindly address the issues mentioned above and execute telemetry.yml.
  Telemetry feature wont be enabled for these BMC IPs from {{ bmc_group_data_filename }} file.
no_idracips_to_remove_msg: "No iDRAC IPs to remove. All DB entries are present in bmc_data.csv."
idrac_telemetry_statefulset_restart_failure_msg: |
  Failed to restart the {{ idrac_telemetry_k8s_name }} StatefulSet.
  Please check the logs using the command kubectl logs -n {{ telemetry_namespace }} {{ idrac_telemetry_k8s_name }}-<pod-index> and try again.

# Remove deleted nodes
redfish_timeout: 30

# Disable-specific messages
idrac_telemetry_statefulset_scale_down_msg: "Scaling down iDRAC telemetry StatefulSet to 0 replicas"
idrac_telemetry_statefulset_not_found_msg: "iDRAC telemetry StatefulSet not found, nothing to scale down"
