---

# This validation is intentionally local and side-effect free so standalone
# OME deployment fails before Kafka, Victoria, or OME resources are changed.
- name: Validate Vector-OME metrics source dependency
  ansible.builtin.fail:
    msg: >-
      Vector-OME metrics bridge is enabled but
      telemetry_sources.ome.metrics_enabled is false. Either enable
      telemetry_sources.ome.metrics_enabled or disable
      telemetry_bridges.vector_ome.metrics_enabled.
  when:
    - telemetry_config.telemetry_bridges.vector_ome.metrics_enabled | default(false) | bool
    - not (telemetry_config.telemetry_sources.ome.metrics_enabled | default(false) | bool)

- name: Validate Vector-OME logs source dependency
  ansible.builtin.fail:
    msg: >-
      Vector-OME logs bridge is enabled but
      telemetry_sources.ome.logs_enabled is false. Either enable
      telemetry_sources.ome.logs_enabled or disable
      telemetry_bridges.vector_ome.logs_enabled.
  when:
    - telemetry_config.telemetry_bridges.vector_ome.logs_enabled | default(false) | bool
    - not (telemetry_config.telemetry_sources.ome.logs_enabled | default(false) | bool)
