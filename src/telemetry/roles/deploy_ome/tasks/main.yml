# =============================================================================
# deploy_ome — Orchestrator
# =============================================================================
# Reconciles OME on every deploy, including the fully disabled state.
# =============================================================================

- name: Load telemetry configuration
  ansible.builtin.include_role:
    name: common
    tasks_from: load_telemetry_config
  when: telemetry_config is not defined

- name: Validate OME source-to-bridge dependencies
  ansible.builtin.include_tasks: validate_dependencies.yml

- name: Determine effective OME channel states from config
  ansible.builtin.set_fact:
    ome_metrics_enabled: >-
      {{
        (telemetry_config.telemetry_sources.ome.metrics_enabled | default(false) | bool)
        and
        (telemetry_config.telemetry_bridges.vector_ome.metrics_enabled | default(false) | bool)
      }}
    ome_logs_enabled: >-
      {{
        (telemetry_config.telemetry_sources.ome.logs_enabled | default(false) | bool)
        and
        (telemetry_config.telemetry_bridges.vector_ome.logs_enabled | default(false) | bool)
      }}
    ome_enabled: >-
      {{
        ((telemetry_config.telemetry_sources.ome.metrics_enabled | default(false) | bool)
         and
         (telemetry_config.telemetry_bridges.vector_ome.metrics_enabled | default(false) | bool))
        or
        ((telemetry_config.telemetry_sources.ome.logs_enabled | default(false) | bool)
         and
         (telemetry_config.telemetry_bridges.vector_ome.logs_enabled | default(false) | bool))
      }}

- name: Enable OME telemetry
  ansible.builtin.include_tasks: enable.yml
  when: ome_enabled | default(false) | bool

- name: Disable OME telemetry
  ansible.builtin.include_tasks: disable.yml
  when: not (ome_enabled | default(false) | bool)
