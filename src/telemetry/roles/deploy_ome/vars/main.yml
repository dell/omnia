# =============================================================================
# OME Telemetry Role Variables
# =============================================================================

# Deploy directory on NFS share
telemetry_deploy_dir: "{{ cluster_mount }}/telemetry"
telemetry_deployments_dir: "{{ telemetry_deploy_dir }}/deployments"
telemetry_namespace: "telemetry"

# Validation messages
ome_kafka_required_msg: >-
  OME telemetry bridge (Vector-OME) requires Kafka support.
  Ensure 'kafka' is listed in at least one component's collection_targets in telemetry_config.yml.

ome_victoria_metrics_required_msg: >-
  OME metrics bridge requires VictoriaMetrics support.
  Ensure 'victoria_metrics' is listed in at least one component's collection_targets in telemetry_config.yml.

ome_victoria_logs_required_msg: >-
  OME logs bridge requires VictoriaLogs support.
  Ensure 'victoria_logs' is listed in at least one component's collection_targets in telemetry_config.yml.

# Vector configuration for OME telemetry bridge
vector:
  image: "{{ hostvars['localhost']['telemetry_registry'].images.vector.vector | default('docker.io/timberio/vector:0.54.0-debian') }}"
  ome:
    app_name: "vector-ome"
    service_name: "vector-ome"
    container_name: "vector-ome"
    kafka_topics_pattern: "{{ telemetry_config.telemetry_bridges.vector_ome.ome_identifier | default('ome') }}.*"
    consumer_group: "vector-ome-group"
    kafka_user: "vector-ome-user"
    health_port: 8688
    metrics_port: 9598
    replicas: "{{ telemetry_storage_config.vector_storage.ome.replicas | default(2) }}"
    resources:
      requests:
        cpu: "{{ telemetry_storage_config.vector_storage.ome.resources.requests.cpu | default('100m') }}"
        memory: "{{ telemetry_storage_config.vector_storage.ome.resources.requests.memory | default('256Mi') }}"
      limits:
        cpu: "{{ telemetry_storage_config.vector_storage.ome.resources.limits.cpu | default('500m') }}"
        memory: "{{ telemetry_storage_config.vector_storage.ome.resources.limits.memory | default('512Mi') }}"
  # vmagent-vector: dedicated write-buffer for Vector → vminsert (metrics)
  vmagent_vector:
    service_name: "vmagent-vector"
    port: 8429
    replicas: 2
    image: "{{ (hostvars['localhost']['telemetry_registry'].images.victoria.vmagent | default('victoriametrics/vmagent:v1.149.0')) }}"
    remote_write_url: "http://vminsert-victoria-cluster.{{ telemetry_namespace }}.svc:8480/insert/0/prometheus/api/v1/write"
    tmp_data_path: "/tmp/vmagent-buffer"
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"
  # vlagent-vector: dedicated write-buffer for Vector → vlinsert (logs)
  vlagent_vector:
    service_name: "vlagent-vector"
    port: 9427
    replicas: 2
    image: "{{ (hostvars['localhost']['telemetry_registry'].images.victoria.vlagent | default('victoriametrics/vlagent:v1.50.0')) }}"
    remote_write_url: "http://vlinsert-victorialogs-cluster.{{ telemetry_namespace }}.svc:9481/insert/jsonline"
    tmp_data_path: "/tmp/vlagent-buffer"
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"

# Victoria cluster TLS setting (used by vmagent-vector template)
victoria_cluster:
  tls_enabled: false
