# =============================================================================
# validate_kube_vip.yml — Runs on: localhost
# =============================================================================
# Verifies kube_vip runtime network reachability (ping + SSH).
#
# NOTE: kube_vip presence, format, and IPv4 octet-range validation are
# performed by the input validation playbook (L1 schema + L2 logic in
# plugins/module_utils/input_validation/). This task only checks
# live network connectivity, which cannot be done during static validation.
#
# Steps:
#   1. ICMP ping check
#   2. SSH port (22) reachability check

- name: Check kube_vip is reachable via ICMP ping
  ansible.builtin.command:
    cmd: "ping -c {{ precheck_ping_count }} -W {{ precheck_ping_timeout }} {{ kube_vip }}"
  register: ping_result
  changed_when: false
  failed_when: false

- name: Fail if kube_vip is not reachable via ping
  ansible.builtin.fail:
    msg: >-
      [PRECHECK FAIL] kube_vip '{{ kube_vip }}' is not reachable via ICMP ping.
      Ensure the host is powered on and network connectivity exists from the Ansible controller.
      Ping output: {{ ping_result.stdout | default('no output') }}
  when: ping_result.rc != 0

- name: Check kube_vip SSH (port {{ precheck_ssh_port }}) is reachable
  ansible.builtin.wait_for:
    host: "{{ kube_vip }}"
    port: "{{ precheck_ssh_port }}"
    timeout: "{{ precheck_ssh_timeout }}"
    state: started
  register: ssh_check
  failed_when: false

- name: Fail if kube_vip SSH is not reachable
  ansible.builtin.fail:
    msg: >-
      [PRECHECK FAIL] kube_vip '{{ kube_vip }}' SSH port {{ precheck_ssh_port }} is not reachable.
      Ensure the SSH service is running and port {{ precheck_ssh_port }} is accessible from the Ansible controller.
  when: ssh_check.failed | default(false)

- name: Display kube_vip reachability — PASSED
  ansible.builtin.debug:
    msg:
      - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      - "[PRECHECK] kube_vip Reachability — PASSED"
      - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      - "  Host : {{ kube_vip }}"
      - "  Ping : ✓  Reachable ({{ precheck_ping_count }} packets)"
      - "  SSH  : ✓  Port {{ precheck_ssh_port }} open"
      - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
