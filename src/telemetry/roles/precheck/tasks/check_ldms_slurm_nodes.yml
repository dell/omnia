# =============================================================================
# LDMS Slurm Cluster Validation
# =============================================================================
# Validates that LDMS deployment prerequisites are met:
#   1. Slurm inventory groups exist (slurm_control_node, slurm_node)
#   2. At least 1 slurm_control_node and 1 slurm_node are defined
#   3. slurmd service is running on all slurm nodes
#   4. slurmctld service is running on slurm control nodes
#
# This check is only performed when telemetry_sources.ldms.metrics_enabled is true.
# =============================================================================

- name: Resolve cluster inventory file path
  ansible.builtin.set_fact:
    cluster_inventory_path: >-
      {%- set inv_path = hostvars['localhost']['telemetry_config'].cluster_inventory -%}
      {%- if inv_path.startswith('/') -%}
        {{ inv_path }}
      {%- else -%}
        {{ playbook_dir | dirname }}/input/{{ inv_path }}
      {%- endif -%}
  delegate_to: localhost
  run_once: true

- name: Check cluster inventory file exists
  ansible.builtin.stat:
    path: "{{ cluster_inventory_path }}"
  register: cluster_inv_stat
  delegate_to: localhost
  run_once: true

- name: Fail if cluster inventory file does not exist
  ansible.builtin.fail:
    msg: |
      {{ ldms_error_messages.file_not_found }}
  vars:
    cluster_inventory_configured: "{{ hostvars['localhost']['telemetry_config'].cluster_inventory }}"
    cluster_inventory_resolved: "{{ cluster_inventory_path }}"
  when: not cluster_inv_stat.stat.exists
  delegate_to: localhost
  run_once: true

- name: Parse cluster inventory file with Python YAML
  ansible.builtin.shell: |
    python3 -c "
    import yaml, json
    try:
        data = yaml.safe_load(open('{{ cluster_inventory_path }}'))
        print(json.dumps(data))
    except Exception as e:
        print(json.dumps({'_parse_error': str(e)}))
    "
  register: cluster_inv_parse
  delegate_to: localhost
  run_once: true
  changed_when: false

- name: Set cluster inventory data
  ansible.builtin.set_fact:
    cluster_inv: "{{ cluster_inv_parse.stdout | from_json }}"
  delegate_to: localhost
  run_once: true

- name: Fail if cluster inventory file is not valid YAML
  ansible.builtin.fail:
    msg: |
      {{ ldms_error_messages.invalid_yaml }}
  vars:
    cluster_inventory_resolved: "{{ cluster_inventory_path }}"
    parse_error: "{{ cluster_inv._parse_error | default('unknown') }}"
  when: cluster_inv._parse_error is defined
  delegate_to: localhost
  run_once: true

- name: Initialize empty Slurm host dictionaries
  ansible.builtin.set_fact:
    slurm_control_hosts: {}
    slurm_compute_hosts: {}
    slurm_login_hosts: {}
    slurm_login_compiler_hosts: {}
  delegate_to: localhost
  run_once: true

- name: Extract Slurm control node hosts from inventory
  ansible.builtin.set_fact:
    slurm_control_hosts: "{{ cluster_inv.all.children.slurm_control_node.hosts }}"
  delegate_to: localhost
  run_once: true
  when: cluster_inv.all.children.slurm_control_node is defined

- name: Extract Slurm compute node hosts from inventory
  ansible.builtin.set_fact:
    slurm_compute_hosts: "{{ cluster_inv.all.children.slurm_node.hosts }}"
  delegate_to: localhost
  run_once: true
  when: cluster_inv.all.children.slurm_node is defined

- name: Extract Slurm login node hosts from inventory (optional)
  ansible.builtin.set_fact:
    slurm_login_hosts: "{{ cluster_inv.all.children.slurm_login_node.hosts }}"
  delegate_to: localhost
  run_once: true
  when: cluster_inv.all.children.slurm_login_node is defined

- name: Extract Slurm login compiler node hosts from inventory (optional)
  ansible.builtin.set_fact:
    slurm_login_compiler_hosts: "{{ cluster_inv.all.children.slurm_login_compiler_node.hosts }}"
  delegate_to: localhost
  run_once: true
  when: cluster_inv.all.children.slurm_login_compiler_node is defined

- name: Fail if no Slurm control nodes found in inventory
  ansible.builtin.fail:
    msg: |
      {{ ldms_error_messages.no_control_nodes }}
  vars:
    control_node_count: "{{ slurm_control_hosts | length }}"
    cluster_inventory_configured: "{{ hostvars['localhost']['telemetry_config'].cluster_inventory }}"
  when: slurm_control_hosts | length == 0
  delegate_to: localhost
  run_once: true

- name: Fail if no Slurm compute nodes found in inventory
  ansible.builtin.fail:
    msg: |
      {{ ldms_error_messages.no_compute_nodes }}
  vars:
    compute_node_count: "{{ slurm_compute_hosts | length }}"
    cluster_inventory_configured: "{{ hostvars['localhost']['telemetry_config'].cluster_inventory }}"
  when: slurm_compute_hosts | length == 0
  delegate_to: localhost
  run_once: true

- name: Build list of all Slurm node IPs for service validation
  ansible.builtin.set_fact:
    all_slurm_node_ips: >-
      {{
        (slurm_control_hosts.values() | map(attribute='ansible_host') | list) +
        (slurm_compute_hosts.values() | map(attribute='ansible_host') | list) +
        (slurm_login_hosts.values() | map(attribute='ansible_host') | default([]) | list) +
        (slurm_login_compiler_hosts.values() | map(attribute='ansible_host') | default([]) | list)
      }}
  delegate_to: localhost
  run_once: true

- name: Display Slurm cluster inventory summary
  ansible.builtin.debug:
    msg: "{{ ldms_success_messages.inventory_summary }}"
  vars:
    control_count: "{{ slurm_control_hosts | length }}"
    compute_count: "{{ slurm_compute_hosts | length }}"
    login_count: "{{ slurm_login_hosts | length }}"
    login_compiler_count: "{{ slurm_login_compiler_hosts | length }}"
    total_count: "{{ all_slurm_node_ips | length }}"
  delegate_to: localhost
  run_once: true

# --- Service validation on Slurm control nodes ---
- name: Check slurmctld service status on Slurm control nodes
  ansible.builtin.systemd:
    name: slurmctld
  register: slurmctld_status
  delegate_to: "{{ item.value.ansible_host }}"
  loop: "{{ slurm_control_hosts | dict2items }}"
  loop_control:
    label: "{{ item.key }} ({{ item.value.ansible_host }})"
  failed_when: false
  run_once: true

- name: Fail if slurmctld is not running on any control node
  ansible.builtin.fail:
    msg: |
      {{ ldms_error_messages.slurmctld_not_running }}
  vars:
    node_name: "{{ item.item.key }}"
    node_ip: "{{ item.item.value.ansible_host }}"
    service_status: "{{ item.status.ActiveState | default('unknown') }}"
  loop: "{{ slurmctld_status.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  when:
    - item.status is defined
    - item.status.ActiveState != 'active'
  delegate_to: localhost
  run_once: true

# --- Service validation on Slurm compute nodes ---
- name: Check slurmd service status on Slurm compute nodes
  ansible.builtin.systemd:
    name: slurmd
  register: slurmd_status
  delegate_to: "{{ item.value.ansible_host }}"
  loop: "{{ slurm_compute_hosts | dict2items }}"
  loop_control:
    label: "{{ item.key }} ({{ item.value.ansible_host }})"
  failed_when: false
  run_once: true

- name: Collect failed slurmd nodes
  ansible.builtin.set_fact:
    failed_slurmd_nodes: >-
      {{
        slurmd_status.results |
        selectattr('status', 'defined') |
        selectattr('status.ActiveState', 'ne', 'active') |
        map(attribute='item') |
        list
      }}
  delegate_to: localhost
  run_once: true

- name: Fail if slurmd is not running on any compute node
  ansible.builtin.fail:
    msg: |
      {{ ldms_error_messages.slurmd_not_running }}
  vars:
    failed_count: "{{ failed_slurmd_nodes | length }}"
    total_count: "{{ slurm_compute_hosts | length }}"
    failed_nodes: "{{ failed_slurmd_nodes }}"
  when: failed_slurmd_nodes | length > 0
  delegate_to: localhost
  run_once: true

- name: LDMS Slurm validation passed
  ansible.builtin.debug:
    msg: "{{ ldms_success_messages.validation_passed }}"
  vars:
    control_count: "{{ slurm_control_hosts | length }}"
    compute_count: "{{ slurm_compute_hosts | length }}"
  delegate_to: localhost
  run_once: true
