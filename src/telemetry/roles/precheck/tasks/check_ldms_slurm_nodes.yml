---

# =============================================================================
# LDMS Slurm Cluster Validation
# =============================================================================
# Validates that LDMS deployment prerequisites are met:
#   1. Slurm inventory groups exist (slurm_control_node, slurm_node)
#   2. At least 1 slurm_control_node and 1 slurm_node are defined
#   3. slurmd service is running on all slurm nodes
#   4. slurmctld service is running on slurm control nodes
#
# Checks 1-2 are structural and remain fatal. Checks 3-4 (and SSH
# reachability) are per-node: a failing node is recorded with a reason in
# localhost.ldms_precheck_skipped_nodes, a warning is shown (with the same
# pause used for invalid iDRAC BMCs), and the run continues. The deploy phase
# excludes those nodes from LDMS sampler deployment, and the final telemetry
# status reports them, so other telemetry sources are never blocked by a
# single unhealthy Slurm node.
#
# This check is only performed when telemetry_sources.ldms.metrics_enabled is true.
# =============================================================================

- name: Resolve cluster inventory file path
  # HPC: run_once: true prevents loop fan-out
  ansible.builtin.set_fact:
    cluster_inventory_path: "{{ hostvars['localhost']['cluster_inventory_path'] | default('') }}"
  delegate_to: localhost
  run_once: true  # noqa

- name: Check cluster inventory file exists
  # HPC: run_once: true prevents loop fan-out
  ansible.builtin.stat:
    path: "{{ cluster_inventory_path }}"
  register: cluster_inv_stat
  delegate_to: localhost
  run_once: true  # noqa

- name: Fail if cluster inventory file does not exist
  # HPC: run_once: true prevents loop fan-out
  ansible.builtin.fail:
    msg: |
      {{ ldms_error_messages.file_not_found }}
  vars:
    cluster_inventory_configured: "{{ hostvars['localhost']['telemetry_config'].cluster_inventory }}"
    cluster_inventory_resolved: "{{ cluster_inventory_path }}"
  when: not cluster_inv_stat.stat.exists
  delegate_to: localhost
  run_once: true  # noqa

- name: Parse cluster inventory file with Python YAML
  # HPC: run_once: true prevents loop fan-out
  ansible.builtin.shell: |
    python3 -c "
    import yaml, json, os
    try:
        data = yaml.safe_load(open(os.environ['_CLUSTER_INV_PATH']))
        print(json.dumps(data))
    except Exception as e:
        print(json.dumps({'_parse_error': str(e)}))
    "
  environment:
    _CLUSTER_INV_PATH: "{{ cluster_inventory_path }}"
  register: cluster_inv_parse
  delegate_to: localhost
  run_once: true
  changed_when: false  # noqa

- name: Set cluster inventory data
  # HPC: run_once: true prevents loop fan-out
  ansible.builtin.set_fact:
    cluster_inv: "{{ cluster_inv_parse.stdout | from_json }}"
  delegate_to: localhost
  run_once: true  # noqa

- name: Fail if cluster inventory file is not valid YAML
  # HPC: run_once: true prevents loop fan-out
  ansible.builtin.fail:
    msg: |
      {{ ldms_error_messages.invalid_yaml }}
  vars:
    cluster_inventory_resolved: "{{ cluster_inventory_path }}"
    parse_error: "{{ cluster_inv._parse_error | default('unknown') }}"
  when: cluster_inv._parse_error is defined
  delegate_to: localhost
  run_once: true  # noqa

- name: Initialize empty Slurm host dictionaries
  # HPC: run_once: true prevents loop fan-out
  ansible.builtin.set_fact:
    slurm_control_hosts: {}
    slurm_compute_hosts: {}
    slurm_login_hosts: {}
    slurm_login_compiler_hosts: {}
  delegate_to: localhost
  run_once: true  # noqa

- name: Extract Slurm control node hosts from inventory
  # HPC: run_once: true prevents loop fan-out
  ansible.builtin.set_fact:
    slurm_control_hosts: >-
      {{ slurm_control_hosts | combine(item.value.hosts | default({})) }}
  loop: >-
    {{
      cluster_inv.all.children | default({}) | dict2items
      | selectattr('key', 'match', '^slurm_control_node(?:_|$)') | list
    }}
  loop_control:
    label: "{{ item.key }}"
  delegate_to: localhost
  run_once: true  # noqa

- name: Extract Slurm compute node hosts from inventory
  # HPC: run_once: true prevents loop fan-out
  ansible.builtin.set_fact:
    slurm_compute_hosts: >-
      {{ slurm_compute_hosts | combine(item.value.hosts | default({})) }}
  loop: >-
    {{
      cluster_inv.all.children | default({}) | dict2items
      | selectattr('key', 'match', '^slurm_node(?:_|$)') | list
    }}
  loop_control:
    label: "{{ item.key }}"
  delegate_to: localhost
  run_once: true  # noqa

- name: Extract Slurm login node hosts from inventory (optional)
  # HPC: run_once: true prevents loop fan-out
  ansible.builtin.set_fact:
    slurm_login_hosts: >-
      {{ slurm_login_hosts | combine(item.value.hosts | default({})) }}
  loop: >-
    {{
      cluster_inv.all.children | default({}) | dict2items
      | selectattr('key', 'match', '^(slurm_)?login_node(?:_|$)') | list
    }}
  loop_control:
    label: "{{ item.key }}"
  delegate_to: localhost
  run_once: true  # noqa

- name: Extract Slurm login compiler node hosts from inventory (optional)
  # HPC: run_once: true prevents loop fan-out
  ansible.builtin.set_fact:
    slurm_login_compiler_hosts: >-
      {{ slurm_login_compiler_hosts | combine(item.value.hosts | default({})) }}
  loop: >-
    {{
      cluster_inv.all.children | default({}) | dict2items
      | selectattr('key', 'match', '^(slurm_)?login_compiler_node(?:_|$)') | list
    }}
  loop_control:
    label: "{{ item.key }}"
  delegate_to: localhost
  run_once: true  # noqa

- name: Fail if no Slurm control nodes found in inventory
  # HPC: run_once: true prevents loop fan-out
  ansible.builtin.fail:
    msg: |
      {{ ldms_error_messages.no_control_nodes }}
  vars:
    control_node_count: "{{ slurm_control_hosts | length }}"
    cluster_inventory_configured: "{{ hostvars['localhost']['telemetry_config'].cluster_inventory }}"
  when: slurm_control_hosts | length == 0
  delegate_to: localhost
  run_once: true  # noqa

- name: Fail if no Slurm compute nodes found in inventory
  # HPC: run_once: true prevents loop fan-out
  ansible.builtin.fail:
    msg: |
      {{ ldms_error_messages.no_compute_nodes }}
  vars:
    compute_node_count: "{{ slurm_compute_hosts | length }}"
    cluster_inventory_configured: "{{ hostvars['localhost']['telemetry_config'].cluster_inventory }}"
  when: slurm_compute_hosts | length == 0
  delegate_to: localhost
  run_once: true  # noqa

- name: Build list of all Slurm node IPs for service validation
  # HPC: run_once: true prevents loop fan-out
  ansible.builtin.set_fact:
    all_slurm_node_ips: >-
      {{
        (slurm_control_hosts.values() | map(attribute='ansible_host') | list) +
        (slurm_compute_hosts.values() | map(attribute='ansible_host') | list) +
        (slurm_login_hosts.values() | map(attribute='ansible_host') | default([]) | list) +
        (slurm_login_compiler_hosts.values() | map(attribute='ansible_host') | default([]) | list)
      }}
    # Deduplicated {key: <inventory name>, value: {ansible_host: <ip>}} items,
    # so per-node findings can be reported by inventory name (the same name
    # the deploy phase uses for its dynamic LDMS host groups).
    all_slurm_node_items: >-
      {{
        slurm_control_hosts
        | combine(slurm_compute_hosts)
        | combine(slurm_login_hosts)
        | combine(slurm_login_compiler_hosts)
        | dict2items
      }}
  delegate_to: localhost
  run_once: true  # noqa

- name: Display Slurm cluster inventory summary
  # HPC: run_once: true prevents loop fan-out
  ansible.builtin.debug:
    msg: "{{ ldms_success_messages.inventory_summary }}"
  vars:
    control_count: "{{ slurm_control_hosts | length }}"
    compute_count: "{{ slurm_compute_hosts | length }}"
    login_count: "{{ slurm_login_hosts | length }}"
    login_compiler_count: "{{ slurm_login_compiler_hosts | length }}"
    total_count: "{{ all_slurm_node_ips | length }}"
  delegate_to: localhost
  run_once: true  # noqa

# --- Network reachability validation for all Slurm nodes ---
# An unreachable node is recorded as a per-node LDMS finding instead of
# failing the precheck: it only affects LDMS on that node.
- name: Check network reachability for all Slurm nodes
  # HPC: run_once: true prevents loop fan-out
  ansible.builtin.shell:
    cmd: "timeout 5 nc -zv {{ (item.value.ansible_host | default(item.key)) | quote }} 22 2>&1 || echo 'UNREACHABLE'"
  delegate_to: localhost
  loop: "{{ all_slurm_node_items }}"
  loop_control:
    label: "{{ item.key }} ({{ item.value.ansible_host | default(item.key) }})"
  register: node_reachability_check
  changed_when: false
  failed_when: false
  run_once: true

- name: Collect unreachable Slurm nodes
  # HPC: run_once: true prevents loop fan-out
  ansible.builtin.set_fact:
    unreachable_nodes: >-
      {{
        node_reachability_check.results |
        selectattr('stdout', 'search', 'UNREACHABLE') |
        map(attribute='item.key') |
        list
      }}
  delegate_to: localhost
  run_once: true  # noqa

- name: Record unreachable Slurm nodes as LDMS findings
  # HPC: run_once: true prevents loop fan-out
  ansible.builtin.set_fact:
    _ldms_ssh_issues: >-
      {%- set issues = [] -%}
      {%- for node in all_slurm_node_items if node.key in unreachable_nodes -%}
      {%- set _ = issues.append({
            'node': node.key,
            'ip': node.value.ansible_host | default(node.key),
            'reason': 'ssh_unreachable',
            'detail': 'SSH port 22 is not reachable from the Ansible controller'
          }) -%}
      {%- endfor -%}
      {{ issues }}
  delegate_to: localhost
  run_once: true  # noqa

- name: Display node reachability check — PASSED
  # HPC: run_once: true prevents loop fan-out
  ansible.builtin.debug:
    msg:
      - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      - "[PRECHECK] Slurm Node Reachability — PASSED"
      - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      - "  All {{ all_slurm_node_ips | length }} Slurm node(s) are reachable via SSH  ✓"
      - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
  when: unreachable_nodes | length == 0
  delegate_to: localhost
  run_once: true  # noqa

# --- Service validation on Slurm control nodes ---
# Only SSH-reachable nodes are checked. ignore_unreachable keeps a node whose
# SSH session fails (e.g. authentication) from removing the kube_vip host
# from the play; such nodes are classified as ssh_unreachable below.
- name: Check slurmctld service status on Slurm control nodes
  ansible.builtin.systemd:
    name: slurmctld
  register: slurmctld_status
  delegate_to: "{{ item.value.ansible_host | default(item.key) }}"
  loop: "{{ slurm_control_hosts | dict2items | rejectattr('key', 'in', unreachable_nodes) | list }}"
  loop_control:
    label: "{{ item.key }} ({{ item.value.ansible_host | default(item.key) }})"
  failed_when: false
  ignore_unreachable: true
  run_once: true

- name: Collect Slurm control nodes with slurmctld issues
  # HPC: run_once: true prevents loop fan-out
  ansible.builtin.set_fact:
    _ldms_slurmctld_issues: >-
      {%- set issues = [] -%}
      {%- for result in slurmctld_status.results | default([]) -%}
      {%- set state = (result.status | default({})).ActiveState | default('unknown') -%}
      {%- if result.unreachable | default(false) | bool -%}
      {%- set _ = issues.append({
            'node': result.item.key,
            'ip': result.item.value.ansible_host | default(result.item.key),
            'reason': 'ssh_unreachable',
            'detail': 'SSH session failed while checking slurmctld'
          }) -%}
      {%- elif state != 'active' -%}
      {%- set _ = issues.append({
            'node': result.item.key,
            'ip': result.item.value.ansible_host | default(result.item.key),
            'reason': 'slurmctld_inactive',
            'detail': 'slurmctld state: ' ~ state
          }) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ issues }}
  delegate_to: localhost
  run_once: true  # noqa

# --- Service validation on Slurm compute nodes ---
- name: Check slurmd service status on Slurm compute nodes
  ansible.builtin.systemd:
    name: slurmd
  register: slurmd_status
  delegate_to: "{{ item.value.ansible_host | default(item.key) }}"
  loop: "{{ slurm_compute_hosts | dict2items | rejectattr('key', 'in', unreachable_nodes) | list }}"
  loop_control:
    label: "{{ item.key }} ({{ item.value.ansible_host | default(item.key) }})"
  failed_when: false
  ignore_unreachable: true
  run_once: true

- name: Collect Slurm compute nodes with slurmd issues
  # HPC: run_once: true prevents loop fan-out
  ansible.builtin.set_fact:
    _ldms_slurmd_issues: >-
      {%- set issues = [] -%}
      {%- for result in slurmd_status.results | default([]) -%}
      {%- set state = (result.status | default({})).ActiveState | default('unknown') -%}
      {%- if result.unreachable | default(false) | bool -%}
      {%- set _ = issues.append({
            'node': result.item.key,
            'ip': result.item.value.ansible_host | default(result.item.key),
            'reason': 'ssh_unreachable',
            'detail': 'SSH session failed while checking slurmd'
          }) -%}
      {%- elif state != 'active' -%}
      {%- set _ = issues.append({
            'node': result.item.key,
            'ip': result.item.value.ansible_host | default(result.item.key),
            'reason': 'slurmd_inactive',
            'detail': 'slurmd state: ' ~ state
          }) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ issues }}
  delegate_to: localhost
  run_once: true  # noqa

# --- Publish per-node findings (consumed by deploy_ldms and the final status) ---
- name: Publish LDMS Slurm node findings to localhost
  # HPC: run_once: true prevents loop fan-out
  ansible.builtin.set_fact:
    ldms_precheck_skipped_nodes: >-
      {{ (_ldms_ssh_issues + _ldms_slurmctld_issues + _ldms_slurmd_issues) | unique | list }}
  delegate_to: localhost
  delegate_facts: true
  run_once: true  # noqa

- name: Warn about Slurm nodes that will be skipped for LDMS
  # HPC: run_once: true prevents loop fan-out
  ansible.builtin.debug:
    msg: "{{ ldms_warning_messages.precheck_nodes_skipped }}"
  vars:
    skipped_nodes: "{{ hostvars['localhost']['ldms_precheck_skipped_nodes'] }}"
    usable_control_nodes: >-
      {{
        slurm_control_hosts.keys() | list
        | difference(
            hostvars['localhost']['ldms_precheck_skipped_nodes']
            | selectattr('reason', 'equalto', 'ssh_unreachable')
            | map(attribute='node') | list
          )
      }}
  when: hostvars['localhost']['ldms_precheck_skipped_nodes'] | length > 0
  delegate_to: localhost
  run_once: true  # noqa

- name: Warning for user to fix Slurm node issues
  ansible.builtin.pause:
    seconds: "{{ ldms_warning_pause_seconds }}"
    prompt: "{{ ldms_warning_messages.pause_prompt }}"
  when: hostvars['localhost']['ldms_precheck_skipped_nodes'] | length > 0
  run_once: true  # noqa

- name: LDMS Slurm validation passed
  # HPC: run_once: true prevents loop fan-out
  ansible.builtin.debug:
    msg: "{{ ldms_success_messages.validation_passed }}"
  vars:
    control_count: "{{ slurm_control_hosts | length }}"
    compute_count: "{{ slurm_compute_hosts | length }}"
    login_count: "{{ slurm_login_hosts | length }}"
    login_compiler_count: "{{ slurm_login_compiler_hosts | length }}"
    total_count: "{{ all_slurm_node_ips | length }}"
  when: hostvars['localhost']['ldms_precheck_skipped_nodes'] | length == 0
  delegate_to: localhost
  run_once: true  # noqa
