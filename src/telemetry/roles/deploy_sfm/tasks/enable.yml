---

# Deploy SFM (Storage Fabric Manager) Telemetry
# Gated by: telemetry_sources.sfm.metrics_enabled
#
# DATA PIPELINE:
#   SFM Prometheus Exporter → vmagent(shared) → victoria_metrics
#
# What Omnia does:
#   - Validates SFM endpoint configuration
#   - Generates K8s manifests for SFM scrape configuration
#
# What Omnia does NOT do:
#   - Omnia does NOT deploy or configure SFM itself

- name: Set SFM configuration facts
  ansible.builtin.set_fact:
    _sfm_config: "{{ telemetry_config.telemetry_sources.sfm }}"

- name: Display SFM configuration
  ansible.builtin.debug:
    msg:
      - "SFM metrics enabled: {{ _sfm_config.metrics_enabled | default(false) }}"
      - "SFM collection targets: {{ _sfm_config.collection_targets | default([]) }}"
    verbosity: 2

# --- Generate SFM deployment manifests ---

- name: Generate SFM kustomization manifests
  ansible.builtin.include_tasks: generate_manifests.yml
  when: _sfm_config.metrics_enabled | default(false) | bool

- name: Display SFM telemetry integration summary
  ansible.builtin.debug:
    msg: "SFM telemetry manifests generated. Deployment will occur via kubectl apply -k."
    verbosity: 2
