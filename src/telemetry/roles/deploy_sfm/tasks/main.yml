# =============================================================================
# deploy_sfm — Orchestrator
# =============================================================================
# Auto-determines state from telemetry_config.yml:
#   telemetry_sources.sfm.metrics_enabled
# Note: SFM source not yet in telemetry_config.yml, defaults to false.
# =============================================================================

- name: Load telemetry configuration
  ansible.builtin.include_role:
    name: common
    tasks_from: load_telemetry_config
  when: telemetry_config is not defined

- name: Determine SFM telemetry state from config
  ansible.builtin.set_fact:
    sfm_enabled: "{{ telemetry_config.telemetry_sources.sfm.metrics_enabled | default(false) | bool }}"
  when: telemetry_config is defined

- name: Enable SFM telemetry
  ansible.builtin.include_tasks: enable.yml
  when: sfm_enabled | default(false) | bool

- name: Disable SFM telemetry
  ansible.builtin.include_tasks: disable.yml
  when: not (sfm_enabled | default(false) | bool)
