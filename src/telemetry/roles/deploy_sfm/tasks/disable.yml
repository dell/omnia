---

# =============================================================================
# deploy_sfm — Disable SFM telemetry
# =============================================================================

- name: Load telemetry configuration
  ansible.builtin.include_role:
    name: common
    tasks_from: load_telemetry_config

- name: Check if SFM resources exist
  ansible.builtin.command: >
    kubectl get deployment sfm-exporter -n {{ telemetry_namespace }}
  register: sfm_check
  changed_when: false
  failed_when: false

- name: Scale down SFM resources
  ansible.builtin.command: >
    kubectl scale deployment sfm-exporter
    -n {{ telemetry_namespace }} --replicas=0
  register: scale_down_result
  changed_when: "'scaled' in scale_down_result.stdout"
  when: sfm_check.rc == 0

- name: Display scale down result
  ansible.builtin.debug:
    msg: "Scaling down SFM telemetry to 0 replicas"
  when: sfm_check.rc == 0

- name: SFM resources not found
  ansible.builtin.debug:
    msg: "SFM telemetry resources not found, nothing to scale down"
  when: sfm_check.rc != 0
