# =============================================================================
# deploy_ufm — Restore previously disabled UFM telemetry
# =============================================================================
# Re-creates the UFM external Service and Endpoints that were removed during
# disable, reusing the retained credentials Secret. No new secrets or
# credentials are collected.
#
# NOTE: The VMServiceScrape (ufm-infiniband-metrics) is re-created by the
# deploy_victoria role (Phase 1 in deploy.yml), which re-renders the vmscrape
# template with ufm.metrics_enabled=true and applies it before this role runs.
# =============================================================================

- name: Generate UFM service manifests for restore
  ansible.builtin.include_tasks: generate_manifests.yml

- name: Display UFM restoration result
  ansible.builtin.debug:
    msg: >-
      Restored {{ ufm_external_service_name }} service using retained
      credentials secret {{ ufm_credentials_secret_name }}.
