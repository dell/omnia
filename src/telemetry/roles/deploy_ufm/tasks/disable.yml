# =============================================================================
# deploy_ufm — Disable UFM telemetry
# =============================================================================

- name: Load telemetry configuration
  ansible.builtin.include_role:
    name: common
    tasks_from: load_telemetry_config

- name: Check if UFM resources exist
  ansible.builtin.command: >
    kubectl get service ufm-telemetry-external -n {{ telemetry_namespace }}
  register: ufm_check
  changed_when: false
  failed_when: false

- name: Delete UFM external service
  ansible.builtin.command: >
    kubectl delete service ufm-telemetry-external -n {{ telemetry_namespace }}
  register: delete_result
  changed_when: "'deleted' in delete_result.stdout"
  when: ufm_check.rc == 0

- name: Display result
  ansible.builtin.debug:
    msg: "UFM telemetry resources removed"
  when: ufm_check.rc == 0

- name: UFM resources not found
  ansible.builtin.debug:
    msg: "UFM telemetry resources not found, nothing to remove"
  when: ufm_check.rc != 0
