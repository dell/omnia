---

# Kafka cluster details
kafka_namespace: "telemetry"
kafka_lb_service_name: "bridge-bridge-lb"
kafka_bootstrap_port: 8080
kafka_cluster_ca_secret: "kafka-cluster-ca-cert"
kafka_client_secret: "kafkapump"

# Output paths
kafka_output_dir: "{{ output_project_dir | default('/opt/omnia/telemetry/output/project_default') }}/external_kafka"
kafka_output_file: "{{ kafka_output_dir }}/external_kafka_connect_details.yml"

# Error messages
kafka_err_no_pods_found: >-
  No Kafka pods found in namespace '{{ kafka_namespace }}'.
  Ensure telemetry has been deployed with --tags deploy before running this utility.
kafka_err_pods_not_running: >-
  One or more Kafka pods are not in Running state in namespace '{{ kafka_namespace }}'.
  Check pod status with: kubectl get pods -n {{ kafka_namespace }} -l app.kubernetes.io/name=kafka
kafka_err_pods_not_ready: >-
  One or more Kafka pods are not Ready in namespace '{{ kafka_namespace }}'.
  Check pod readiness with: kubectl get pods -n {{ kafka_namespace }} -l app.kubernetes.io/name=kafka
kafka_err_external_ip_missing: >-
  Failed to fetch Kafka LoadBalancer external IP. Ensure service '{{ kafka_lb_service_name }}'
  exists in namespace '{{ kafka_namespace }}' and has an external IP assigned.
kafka_err_kube_vip_unreachable: >-
  kube_vip host is not reachable over SSH: {{ ansible_host | default(inventory_hostname) }}.
  Ensure the Kubernetes control plane VIP is reachable from this host.

# OME integration instructions
kafka_ome_ui_navigation: "Configuration -> Remote Connectivity"
kafka_ome_ui_enable_label: "Enable Kafka Connectivity"
kafka_ome_auth_mode_value: "SSL"
kafka_ome_server_cert_note: "Upload ca.crt as the server certificate in OME."
kafka_ome_client_cert_note: "Upload user.pfx as the client certificate in OME (mTLS)."
