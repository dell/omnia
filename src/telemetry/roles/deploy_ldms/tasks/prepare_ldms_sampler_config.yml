---

# Render the host-independent sampler files once on the selected Slurm control
# node. All LDMS-enabled Slurm nodes consume these files from the shared mount.

- name: Create LDMS samplers directory in shared storage
  ansible.builtin.file:
    path: "{{ ldms_sampler_share_path }}/samplers"
    state: directory
    owner: root
    group: root
    mode: "{{ common_mode }}"

- name: Render shared LDMS sampler configuration
  ansible.builtin.template:
    src: "{{ role_path }}/templates/ldms/sampler.conf.j2"
    dest: "{{ ldms_sampler_share_path }}/samplers/{{ ldms_sampler.config_file }}"
    owner: root
    group: root
    mode: "{{ file_permissions_644 }}"

- name: Get LDMS sampler password from credentials
  ansible.builtin.set_fact:
    ldms_sampler_password_from_creds: "{{ telemetry_credentials.ldms_sampler_password | default('') }}"
  when:
    - telemetry_credentials is defined
    - telemetry_credentials.ldms_sampler_password is defined
  no_log: true

- name: Use LDMS sampler password from credentials if available
  ansible.builtin.set_fact:
    ldms_sampler_password: "{{ ldms_sampler_password_from_creds | default('') }}"
  when: ldms_sampler_password_from_creds is defined
  no_log: true

- name: Generate random LDMS sampler password if not provided
  ansible.builtin.set_fact:
    ldms_sampler_password: "{{ lookup('community.general.random_string', length=16, upper=true, lower=true, numbers=true, special=false) }}"
  when: ldms_sampler_password is not defined or ldms_sampler_password | length == 0
  no_log: true

- name: Validate LDMS sampler password length
  ansible.builtin.assert:
    that:
      - ldms_sampler_password | length >= 8
      - ldms_sampler_password | length <= 512
    fail_msg: "LDMS sampler password must be between 8 and 512 characters. Current length: {{ ldms_sampler_password | length }}"
    success_msg: "LDMS sampler password validated (length: {{ ldms_sampler_password | length }} characters)"

- name: Render shared LDMS authentication configuration
  ansible.builtin.template:
    src: "{{ role_path }}/templates/ldms/ldmsauth.conf.j2"
    dest: "{{ ldms_sampler_share_path }}/samplers/{{ ldms_sampler.auth_file }}"
    owner: root
    group: root
    mode: "{{ file_permissions_600 }}"

- name: Render shared LDMS sampler environment file
  ansible.builtin.template:
    src: "{{ role_path }}/templates/ldms/ldmsd.sampler.env.j2"
    dest: "{{ ldms_sampler_share_path }}/samplers/{{ ldms_sampler.env_file }}"
    owner: root
    group: root
    mode: "{{ file_permissions_644 }}"

- name: Log shared LDMS sampler configuration preparation
  ansible.builtin.debug:
    msg: "LDMS sampler configuration rendered once at {{ ldms_sampler_share_path }}/samplers/"

- name: Record shared LDMS sampler configuration preparation
  ansible.builtin.set_fact:
    ldms_sampler_shared_config_prepared: true
