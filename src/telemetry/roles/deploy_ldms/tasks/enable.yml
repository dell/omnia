# =============================================================================
# deploy_ldms — Enable LDMS telemetry
# =============================================================================
# Full enable flow, running on kube_vip_group (single play):
#
#   1. Validate configuration
#   2. Prepare aggregator auth (munge key fetched from control node)
#   3. Prepare shared sampler config (rendered to NFS)
#   4. Deploy aggregator + store (Helm chart)
#   5. Deploy Vector-LDMS bridge
#   6. Verify deployment
#
# Re-enable after disable is handled transparently:
#   - deploy_ldms_aggregator_k8s.yml restores aggregator/store replicas
#     after helm upgrade (3-way merge does not restore replicas on its own)
#   - deploy_vector_ldms.yml restores Vector-LDMS replicas after kubectl apply
#
# Note: Sampler installation on compute nodes (configure_ldms_sampler.yml)
# runs as a separate play in the deploy_ldms playbook for parallel execution
# across the Slurm cluster.
#
# LDMS Architecture:
#   Compute nodes (LDMS sampler) → LDMS aggregator (K8s) → Kafka 'ldms' topic
#   → Vector-LDMS bridge → vmagent-vector → VictoriaMetrics
# =============================================================================

- name: Load telemetry configuration
  ansible.builtin.include_role:
    name: common
    tasks_from: load_telemetry_config
  when: telemetry_config is not defined

- name: Validate LDMS telemetry configuration
  ansible.builtin.include_tasks: validate_config.yml

- name: Derive sink support flags
  ansible.builtin.include_role:
    name: common
    tasks_from: derive_sink_support_flags

# ---- Aggregator authentication (delegate to Slurm control node) ----

- name: Prepare LDMS aggregator authentication
  ansible.builtin.include_tasks: configure_ldms_aggregator.yml

# ---- Shared sampler configuration (rendered to NFS from kube_vip) ----

- name: Prepare shared LDMS sampler configuration
  ansible.builtin.include_tasks: prepare_ldms_sampler_config.yml

# ---- K8s deployment: aggregator + store (Helm chart) ----

- name: Deploy LDMS aggregator and store
  ansible.builtin.include_tasks: deploy_ldms_aggregator_k8s.yml

# ---- K8s deployment: Vector-LDMS bridge ----

- name: Generate Vector-LDMS manifests
  ansible.builtin.include_tasks: generate_vector_ldms_manifests.yml
  when:
    - telemetry_config.telemetry_bridges.vector_ldms.metrics_enabled | default(false) | bool
    - victoria_metrics_support | default(false) | bool

- name: Deploy Vector-LDMS bridge
  ansible.builtin.include_tasks: deploy_vector_ldms.yml
  when:
    - telemetry_config.telemetry_bridges.vector_ldms.metrics_enabled | default(false) | bool
    - victoria_metrics_support | default(false) | bool

- name: Scale down Vector-LDMS when disabled
  ansible.builtin.command: >
    kubectl scale deployment {{ vector.ldms.app_name }}
    -n {{ telemetry_namespace }} --replicas=0
  register: scale_down_vector_result
  changed_when: "'scaled' in scale_down_vector_result.stdout"
  failed_when: false
  when:
    - not (telemetry_config.telemetry_bridges.vector_ldms.metrics_enabled | default(false) | bool)

# ---- Verification ----

- name: Verify LDMS telemetry
  ansible.builtin.include_tasks: verify_ldms.yml
  when: not (skip_ldms_verify | default(false) | bool)
