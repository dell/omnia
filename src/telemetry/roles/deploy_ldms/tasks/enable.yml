# =============================================================================
# deploy_ldms — Enable LDMS telemetry
# =============================================================================
# Configures LDMS sampler and aggregator on compute nodes, deploys the
# Vector-LDMS bridge (Kafka-to-VictoriaMetrics ingestion pipeline).
#
# LDMS Architecture:
#   Compute nodes (LDMS sampler) → LDMS aggregator (K8s) → Kafka 'ldms' topic
#   → Vector-LDMS bridge → vmagent-vector → VictoriaMetrics
#
# Prerequisites:
#   - Service K8s cluster running with kubectl access
#   - telemetry_config.yml with ldms source enabled
#   - Kafka and VictoriaMetrics deployed (via deploy_kafka, deploy_victoria)
#   - Slurm cluster configured with munge authentication
# =============================================================================

- name: Load telemetry configuration
  ansible.builtin.include_role:
    name: common
    tasks_from: load_telemetry_config

- name: Validate LDMS telemetry configuration
  ansible.builtin.include_tasks: validate_config.yml

- name: Derive sink support flags
  ansible.builtin.include_role:
    name: common
    tasks_from: derive_sink_support_flags

- name: Configure LDMS sampler
  ansible.builtin.include_tasks: configure_ldms_sampler.yml

- name: Configure LDMS aggregator
  ansible.builtin.include_tasks: configure_ldms_aggregator.yml

- name: Generate Vector-LDMS manifests
  ansible.builtin.include_tasks: generate_vector_ldms_manifests.yml
  when:
    - telemetry_config.telemetry_bridges.vector_ldms.metrics_enabled | default(false) | bool
    - victoria_metrics_support | default(false) | bool

- name: Deploy Vector-LDMS bridge
  ansible.builtin.include_tasks: deploy_vector_ldms.yml
  when:
    - telemetry_config.telemetry_bridges.vector_ldms.metrics_enabled | default(false) | bool
    - victoria_metrics_support | default(false) | bool

- name: Verify LDMS telemetry
  ansible.builtin.include_tasks: verify_ldms.yml

- name: Update telemetry status
  ansible.builtin.include_tasks: update_status.yml
