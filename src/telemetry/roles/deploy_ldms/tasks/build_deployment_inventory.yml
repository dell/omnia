---

# =============================================================================
# deploy_ldms — Build deployment inventory
# =============================================================================
# Loads the Slurm cluster inventory, checks node health via Slurm sinfo
# (scales to large clusters without SSH overhead), inspects munge keys on
# control nodes, and populates the dynamic host groups used by subsequent
# plays in the deploy_ldms playbook:
#
#   ldms_deploy_reachable          — all healthy LDMS-enabled nodes (idle/mix/alloc)
#   ldms_deploy_aggregator_control — the Slurm control node used for
#                                     munge-key / auth preparation
#
# Called from enable.yml (enable path only — disable.yml only scales
# existing K8s resources to zero and needs none of this).
#
# Performance note: Uses sinfo from control node instead of SSH to each
# compute node, reducing O(n) SSH connections to O(1) for reachability checks.
# This scales efficiently to clusters with 1000+ nodes.
# =============================================================================

# ---- Load Slurm inventory ----

- name: Set slurm inventory file from resolved cluster_inventory_path
  ansible.builtin.set_fact:
    slurm_inventory_file: "{{ hostvars['localhost']['cluster_inventory_path'] | default('') }}"
  when: slurm_inventory_file is not defined

- name: Check if slurm inventory file exists
  ansible.builtin.stat:
    path: "{{ slurm_inventory_file }}"
  register: slurm_inv_stat
  delegate_to: localhost
  when: slurm_inventory_file | default('') | length > 0

- name: Load slurm inventory for aggregator/sampler node delegation
  when:
    - slurm_inventory_file | default('') | length > 0
    - slurm_inv_stat.stat.exists | default(false)
  block:
    - name: Read slurm inventory
      ansible.builtin.include_vars:
        file: "{{ slurm_inventory_file }}"
        name: slurm_inv

    - name: Initialize LDMS Slurm inventory groups
      ansible.builtin.set_fact:
        _ldms_inventory_children: "{{ slurm_inv.all.children | default({}) }}"
        _ldms_slurm_control_hosts: {}
        _ldms_slurm_compute_hosts: {}
        _ldms_slurm_login_hosts: {}
        _ldms_slurm_login_compiler_hosts: {}

    - name: Collect Slurm control-node groups
      ansible.builtin.set_fact:
        _ldms_slurm_control_hosts: >-
          {{ _ldms_slurm_control_hosts | combine(item.value.hosts | default({})) }}
      loop: >-
        {{
          _ldms_inventory_children | dict2items
          | selectattr('key', 'match', '^slurm_control_node(?:_|$)') | list
        }}
      loop_control:
        label: "{{ item.key }}"

    - name: Collect Slurm compute-node groups
      ansible.builtin.set_fact:
        _ldms_slurm_compute_hosts: >-
          {{ _ldms_slurm_compute_hosts | combine(item.value.hosts | default({})) }}
      loop: >-
        {{
          _ldms_inventory_children | dict2items
          | selectattr('key', 'match', '^slurm_node(?:_|$)') | list
        }}
      loop_control:
        label: "{{ item.key }}"

    - name: Collect Slurm login-node groups
      ansible.builtin.set_fact:
        _ldms_slurm_login_hosts: >-
          {{ _ldms_slurm_login_hosts | combine(item.value.hosts | default({})) }}
      loop: >-
        {{
          _ldms_inventory_children | dict2items
          | selectattr('key', 'match', '^(slurm_)?login_node(?:_|$)') | list
        }}
      loop_control:
        label: "{{ item.key }}"

    - name: Collect Slurm login-compiler groups
      ansible.builtin.set_fact:
        _ldms_slurm_login_compiler_hosts: >-
          {{ _ldms_slurm_login_compiler_hosts | combine(item.value.hosts | default({})) }}
      loop: >-
        {{
          _ldms_inventory_children | dict2items
          | selectattr('key', 'match', '^(slurm_)?login_compiler_node(?:_|$)') | list
        }}
      loop_control:
        label: "{{ item.key }}"

    - name: Build normalized LDMS Slurm host inventory
      ansible.builtin.set_fact:
        _ldms_slurm_all_hosts: >-
          {{
            _ldms_slurm_control_hosts
            | combine(_ldms_slurm_compute_hosts)
            | combine(_ldms_slurm_login_hosts)
            | combine(_ldms_slurm_login_compiler_hosts)
          }}

    - name: Add LDMS Slurm nodes to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ item.key }}"
        groups: >-
          {{
            (['slurm_control_node'] if item.key in _ldms_slurm_control_hosts else [])
            + (['slurm_node'] if item.key in _ldms_slurm_compute_hosts else [])
            + (['login_node'] if item.key in _ldms_slurm_login_hosts else [])
            + (['login_compiler_node'] if item.key in _ldms_slurm_login_compiler_hosts else [])
          }}
        ansible_host: "{{ item.value.ansible_host | default(item.key) }}"
        ansible_user: "{{ item.value.ansible_user | default('root') }}"
        ansible_port: "{{ item.value.ansible_port | default(omit) }}"
        ansible_ssh_private_key_file: >-
          {{ item.value.ansible_ssh_private_key_file | default(omit) }}
      loop: "{{ (_ldms_slurm_all_hosts | default({})) | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

# ---- Check reachability using Slurm sinfo ----

- name: Build list of all LDMS deployment nodes
  ansible.builtin.set_fact:
    _ldms_deploy_candidate_hosts: >-
      {{
        (
          (groups['slurm_node'] | default([]))
          + (groups['slurm_control_node'] | default([]))
          + (groups['login_node'] | default([]))
          + (groups['login_compiler_node'] | default([]))
        ) | unique | sort
      }}

- name: Get Slurm node status from control node (sinfo)
  # Note: sinfo must be available on the control node's PATH.
  # If Slurm binaries are only available via login shell profile scripts,
  # ensure they are added to the system PATH or use a login shell wrapper.
  ansible.builtin.command: "{{ ldms_sinfo_command }}"
  delegate_to: "{{ (groups['slurm_control_node'] | default([])) | first }}"
  register: _ldms_sinfo_output
  changed_when: false
  failed_when: _ldms_sinfo_output.rc != 0

- name: Fail fast if sinfo output is empty
  ansible.builtin.assert:
    that:
      - (_ldms_sinfo_output.stdout | default('')) | length > 0
    fail_msg: >-
      sinfo returned empty output on
      {{ (groups['slurm_control_node'] | default([])) | first }}.
      sinfo stdout: "{{ _ldms_sinfo_output.stdout }}"
      sinfo stderr: "{{ _ldms_sinfo_output.stderr | default('no stderr') }}"

- name: Parse sinfo output to identify healthy nodes
  # sinfo -r already filters for responsive nodes only, so all returned nodes
  # are healthy. We just need to extract the node names from the output.
  ansible.builtin.set_fact:
    _ldms_sinfo_healthy_nodes: >-
      {{
        (
          _ldms_sinfo_output.stdout_lines
          | default([])
          | select('match', '^[a-zA-Z0-9._-]+$')
          | list
        )
      }}

- name: Classify LDMS deployment node reachability from sinfo
  ansible.builtin.set_fact:
    _ldms_deploy_reachable_hosts: >-
      {{
        _ldms_deploy_candidate_hosts
        | intersect(_ldms_sinfo_healthy_nodes | default([]))
        | unique | sort
      }}
    _ldms_deploy_unreachable_hosts: >-
      {{
        _ldms_deploy_candidate_hosts
        | difference(_ldms_sinfo_healthy_nodes | default([]))
        | unique | sort
      }}

# ---- Inspect munge keys on control nodes ----
# Note: sinfo -N only reports nodes known to Slurm as partition/compute
# members — a dedicated (compute-less) control node is typically absent
# from that list. So control-node reachability must NOT be pre-filtered
# through the sinfo-derived _ldms_deploy_reachable_hosts; instead, the
# munge-key stat task below (with ignore_unreachable: true) is itself the
# source of truth for control-node SSH reachability.

- name: Inspect munge keys on Slurm control nodes
  vars:
    ansible_ssh_timeout: 10
    ansible_ssh_retries: 0
  ansible.builtin.stat:
    path: "{{ munge_key_path | default('/etc/munge/munge.key') }}"
  delegate_to: "{{ item }}"
  loop: "{{ groups['slurm_control_node'] | default([]) }}"
  loop_control:
    label: "{{ item }}"
  register: _ldms_deploy_control_munge_checks
  changed_when: false
  failed_when: false
  ignore_unreachable: true

- name: Classify Slurm control nodes for aggregator preparation
  ansible.builtin.set_fact:
    _ldms_deploy_control_unreachable_hosts: >-
      {{
        (_ldms_deploy_control_munge_checks.results | default([]))
        | selectattr('unreachable', 'defined')
        | selectattr('unreachable')
        | map(attribute='item') | unique | sort
      }}
    _ldms_deploy_munge_control_hosts: >-
      {{
        (_ldms_deploy_control_munge_checks.results | default([]))
        | selectattr('stat', 'defined')
        | selectattr('stat.exists', 'defined')
        | selectattr('stat.exists')
        | map(attribute='item') | unique | sort
      }}
    _ldms_deploy_reachable_control_hosts: >-
      {{
        (groups['slurm_control_node'] | default([]))
        | difference(
            (_ldms_deploy_control_munge_checks.results | default([]))
            | selectattr('unreachable', 'defined')
            | selectattr('unreachable')
            | map(attribute='item') | list
          ) | unique | sort
      }}

- name: Exclude control nodes lost during aggregator preparation
  ansible.builtin.set_fact:
    _ldms_deploy_unreachable_hosts: >-
      {{
        (
          _ldms_deploy_unreachable_hosts
          + _ldms_deploy_control_unreachable_hosts
        ) | unique | sort
      }}
    _ldms_deploy_reachable_hosts: >-
      {{
        _ldms_deploy_reachable_hosts
        | difference(_ldms_deploy_control_unreachable_hosts) | sort
      }}
    _ldms_deploy_reachable_control_hosts: >-
      {{
        _ldms_deploy_reachable_control_hosts
        | difference(_ldms_deploy_control_unreachable_hosts) | sort
      }}

# ---- Populate dynamic host groups ----

- name: Add reachable nodes to the LDMS deployment group
  ansible.builtin.add_host:
    name: "{{ item }}"
    groups: ldms_deploy_reachable
  loop: "{{ _ldms_deploy_reachable_hosts | default([]) }}"
  loop_control:
    label: "{{ item }}"

- name: Select the LDMS aggregator control node
  ansible.builtin.set_fact:
    _ldms_deploy_aggregator_control_host: >-
      {{ (_ldms_deploy_munge_control_hosts | default([])) | first | default('') }}

- name: Add the selected LDMS aggregator control node
  ansible.builtin.add_host:
    name: "{{ item }}"
    groups: ldms_deploy_aggregator_control
  loop: >-
    {{
      [_ldms_deploy_aggregator_control_host]
      if (_ldms_deploy_aggregator_control_host | default('')) | length > 0
      else []
    }}
  loop_control:
    label: "{{ item }}"

# ---- Publish and validate ----

- name: Publish unreachable LDMS deployment nodes
  vars:
    _current_deploy_unreachable_nodes: >-
      {{
        hostvars['localhost']['_deploy_unreachable_nodes']
        | default({'ldms': []}, true)
      }}
  ansible.builtin.set_fact:
    _deploy_unreachable_nodes: >-
      {{
        _current_deploy_unreachable_nodes
        | combine({
            'ldms': (
              (_current_deploy_unreachable_nodes.ldms | default([]))
              + (_ldms_deploy_unreachable_hosts | default([]))
            ) | unique | sort
          })
      }}
  delegate_to: localhost
  delegate_facts: true

- name: Validate usable LDMS deployment connections (sinfo-based)
  ansible.builtin.assert:
    that:
      - item in _ldms_sinfo_healthy_nodes | default([])
    fail_msg: >-
      Node {{ item }} is not in healthy state according to Slurm sinfo.
      Current sinfo status: {{ _ldms_sinfo_output.stdout }}
  loop: "{{ _ldms_deploy_reachable_hosts | default([]) }}"
  loop_control:
    label: "{{ item }}"

- name: Validate usable Slurm control-node connections
  ansible.builtin.assert:
    that:
      - item.stat is defined
    fail_msg: >-
      Connected to {{ item.item }}, but Ansible could not inspect the munge
      key: {{ item.msg | default('No error message returned') }}
  loop: "{{ _ldms_deploy_control_munge_checks.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"

- name: Validate required LDMS deployment nodes
  ansible.builtin.assert:
    that:
      - (_ldms_deploy_candidate_hosts | default([])) | length > 0
      - (_ldms_deploy_reachable_control_hosts | default([])) | length > 0
      - (_ldms_deploy_munge_control_hosts | default([])) | length > 0
    fail_msg: >-
      LDMS deployment requires at least one reachable Slurm control node
      with a readable munge key. Unreachable nodes were recorded, but the
      aggregator cannot be configured safely without current
      authentication material.
