---

# =============================================================================
# deploy_ldms — Build deployment inventory
# =============================================================================
# Loads the Slurm cluster inventory, checks node health via Slurm sinfo
# (scales to large clusters without SSH overhead), inspects munge keys on
# control nodes, and populates the dynamic host groups used by subsequent
# plays in the deploy_ldms playbook:
#
#   ldms_deploy_reachable          — all reachable LDMS-enabled nodes: compute
#                                     nodes healthy in sinfo (idle/mix/alloc),
#                                     plus control and login/login-compiler
#                                     nodes, which sinfo does not list and are
#                                     checked directly (munge key / SSH)
#   ldms_deploy_aggregator_control — the Slurm control node used for
#                                     munge-key / auth preparation
#
# Per-node problems never fail the run. A node that failed precheck
# (localhost.ldms_precheck_skipped_nodes), is unreachable, or is not healthy
# in sinfo is left out of ldms_deploy_reachable and recorded, with a reason,
# in localhost._deploy_unreachable_nodes / _deploy_skipped_node_details for
# the final telemetry status. Only when no Slurm control node with a
# readable munge key exists is LDMS skipped for this run
# (_ldms_deploy_skip / localhost._ldms_deploy_skip_reason), because the
# aggregator cannot authenticate without it.
#
# Called from enable.yml (enable path only — disable.yml only scales
# existing K8s resources to zero and needs none of this).
#
# Performance note: Uses sinfo from control node instead of SSH to each
# compute node, reducing O(n) SSH connections to O(1) for reachability checks.
# This scales efficiently to clusters with 1000+ nodes.
# =============================================================================

# ---- Load Slurm inventory ----

- name: Set slurm inventory file from resolved cluster_inventory_path
  ansible.builtin.set_fact:
    slurm_inventory_file: "{{ hostvars['localhost']['cluster_inventory_path'] | default('') }}"
  when: slurm_inventory_file is not defined

- name: Check if slurm inventory file exists
  ansible.builtin.stat:
    path: "{{ slurm_inventory_file }}"
  register: slurm_inv_stat
  delegate_to: localhost
  when: slurm_inventory_file | default('') | length > 0

- name: Load slurm inventory for aggregator/sampler node delegation
  when:
    - slurm_inventory_file | default('') | length > 0
    - slurm_inv_stat.stat.exists | default(false)
  block:
    - name: Read slurm inventory
      ansible.builtin.include_vars:
        file: "{{ slurm_inventory_file }}"
        name: slurm_inv

    - name: Initialize LDMS Slurm inventory groups
      ansible.builtin.set_fact:
        _ldms_inventory_children: "{{ slurm_inv.all.children | default({}) }}"
        _ldms_slurm_control_hosts: {}
        _ldms_slurm_compute_hosts: {}
        _ldms_slurm_login_hosts: {}
        _ldms_slurm_login_compiler_hosts: {}

    - name: Collect Slurm control-node groups
      ansible.builtin.set_fact:
        _ldms_slurm_control_hosts: >-
          {{ _ldms_slurm_control_hosts | combine(item.value.hosts | default({})) }}
      loop: >-
        {{
          _ldms_inventory_children | dict2items
          | selectattr('key', 'match', '^slurm_control_node(?:_|$)') | list
        }}
      loop_control:
        label: "{{ item.key }}"

    - name: Collect Slurm compute-node groups
      ansible.builtin.set_fact:
        _ldms_slurm_compute_hosts: >-
          {{ _ldms_slurm_compute_hosts | combine(item.value.hosts | default({})) }}
      loop: >-
        {{
          _ldms_inventory_children | dict2items
          | selectattr('key', 'match', '^slurm_node(?:_|$)') | list
        }}
      loop_control:
        label: "{{ item.key }}"

    - name: Collect Slurm login-node groups
      ansible.builtin.set_fact:
        _ldms_slurm_login_hosts: >-
          {{ _ldms_slurm_login_hosts | combine(item.value.hosts | default({})) }}
      loop: >-
        {{
          _ldms_inventory_children | dict2items
          | selectattr('key', 'match', '^(slurm_)?login_node(?:_|$)') | list
        }}
      loop_control:
        label: "{{ item.key }}"

    - name: Collect Slurm login-compiler groups
      ansible.builtin.set_fact:
        _ldms_slurm_login_compiler_hosts: >-
          {{ _ldms_slurm_login_compiler_hosts | combine(item.value.hosts | default({})) }}
      loop: >-
        {{
          _ldms_inventory_children | dict2items
          | selectattr('key', 'match', '^(slurm_)?login_compiler_node(?:_|$)') | list
        }}
      loop_control:
        label: "{{ item.key }}"

    - name: Build normalized LDMS Slurm host inventory
      ansible.builtin.set_fact:
        _ldms_slurm_all_hosts: >-
          {{
            _ldms_slurm_control_hosts
            | combine(_ldms_slurm_compute_hosts)
            | combine(_ldms_slurm_login_hosts)
            | combine(_ldms_slurm_login_compiler_hosts)
          }}

    - name: Add LDMS Slurm nodes to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ item.key }}"
        groups: >-
          {{
            (['slurm_control_node'] if item.key in _ldms_slurm_control_hosts else [])
            + (['slurm_node'] if item.key in _ldms_slurm_compute_hosts else [])
            + (['login_node'] if item.key in _ldms_slurm_login_hosts else [])
            + (['login_compiler_node'] if item.key in _ldms_slurm_login_compiler_hosts else [])
          }}
        ansible_host: "{{ item.value.ansible_host | default(item.key) }}"
        ansible_user: "{{ item.value.ansible_user | default('root') }}"
        ansible_port: "{{ item.value.ansible_port | default(omit) }}"
        ansible_ssh_private_key_file: >-
          {{ item.value.ansible_ssh_private_key_file | default(omit) }}
      loop: "{{ (_ldms_slurm_all_hosts | default({})) | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

# ---- Import per-node findings from precheck ----
# Nodes flagged by precheck (SSH unreachable, slurmd/slurmctld inactive) are
# excluded even when sinfo still lists them as healthy: slurmctld only marks
# a node unresponsive after SlurmdTimeout, so sinfo alone can lag behind a
# freshly stopped slurmd.

- name: Import LDMS node findings from precheck
  ansible.builtin.set_fact:
    _ldms_precheck_skipped_nodes: "{{ hostvars['localhost']['ldms_precheck_skipped_nodes'] | default([]) }}"

- name: Derive precheck-excluded LDMS nodes
  ansible.builtin.set_fact:
    _ldms_precheck_skipped_hosts: >-
      {{ _ldms_precheck_skipped_nodes | map(attribute='node') | unique | sort }}
    _ldms_precheck_ssh_unreachable_hosts: >-
      {{
        _ldms_precheck_skipped_nodes
        | selectattr('reason', 'equalto', 'ssh_unreachable')
        | map(attribute='node') | unique | sort
      }}

# ---- Classify LDMS deployment candidates ----
# Control nodes are checked directly (munge key over SSH), login and
# login-compiler nodes over SSH (sinfo does not list them), and the remaining
# compute nodes through Slurm sinfo.

- name: Build list of all LDMS deployment nodes
  ansible.builtin.set_fact:
    _ldms_deploy_candidate_hosts: >-
      {{
        (
          (groups['slurm_node'] | default([]))
          + (groups['slurm_control_node'] | default([]))
          + (groups['login_node'] | default([]))
          + (groups['login_compiler_node'] | default([]))
        ) | unique | sort
      }}
    _ldms_control_candidates: "{{ (groups['slurm_control_node'] | default([])) | unique | sort }}"
    _ldms_login_candidates: >-
      {{
        (
          (groups['login_node'] | default([]))
          + (groups['login_compiler_node'] | default([]))
        )
        | unique
        | difference(groups['slurm_control_node'] | default([]))
        | sort
      }}
    _ldms_compute_candidates: >-
      {{
        (groups['slurm_node'] | default([]))
        | unique
        | difference(groups['slurm_control_node'] | default([]))
        | difference(groups['login_node'] | default([]))
        | difference(groups['login_compiler_node'] | default([]))
        | sort
      }}

# ---- Inspect munge keys on control nodes ----
# Note: sinfo -N only reports nodes known to Slurm as partition/compute
# members — a dedicated (compute-less) control node is typically absent
# from that list. So control-node reachability must NOT be pre-filtered
# through the sinfo-derived _ldms_deploy_reachable_hosts; instead, the
# munge-key stat task below (with ignore_unreachable: true) is itself the
# source of truth for control-node SSH reachability.

- name: Inspect munge keys on Slurm control nodes
  vars:
    ansible_ssh_timeout: 10
    ansible_ssh_retries: 0
  ansible.builtin.stat:
    path: "{{ munge_key_path | default('/etc/munge/munge.key') }}"
  delegate_to: "{{ item }}"
  loop: "{{ _ldms_control_candidates | difference(_ldms_precheck_ssh_unreachable_hosts) }}"
  loop_control:
    label: "{{ item }}"
  register: _ldms_deploy_control_munge_checks
  changed_when: false
  failed_when: false
  ignore_unreachable: true

- name: Classify Slurm control nodes for aggregator preparation
  ansible.builtin.set_fact:
    _ldms_deploy_control_unreachable_hosts: >-
      {{
        (
          (
            (_ldms_deploy_control_munge_checks.results | default([]))
            | selectattr('unreachable', 'defined')
            | selectattr('unreachable')
            | map(attribute='item') | list
          )
          + (_ldms_control_candidates | intersect(_ldms_precheck_ssh_unreachable_hosts))
        ) | unique | sort
      }}
    _ldms_deploy_munge_control_hosts: >-
      {{
        (_ldms_deploy_control_munge_checks.results | default([]))
        | selectattr('stat', 'defined')
        | selectattr('stat.exists', 'defined')
        | selectattr('stat.exists')
        | selectattr('stat.isreg', 'defined')
        | selectattr('stat.isreg')
        | map(attribute='item') | unique | sort
      }}

- name: Derive reachable Slurm control nodes
  ansible.builtin.set_fact:
    _ldms_deploy_reachable_control_hosts: >-
      {{ _ldms_control_candidates | difference(_ldms_deploy_control_unreachable_hosts) | sort }}

# A control node whose slurmctld is down can still provide the munge key, but
# one that passed precheck is preferred, since sinfo is run on this node too.
- name: Select the LDMS aggregator control node
  ansible.builtin.set_fact:
    _ldms_deploy_aggregator_control_host: >-
      {{
        (
          (_ldms_deploy_munge_control_hosts | difference(_ldms_precheck_skipped_hosts) | sort)
          + (_ldms_deploy_munge_control_hosts | intersect(_ldms_precheck_skipped_hosts) | sort)
        ) | first | default('')
      }}

- name: Decide whether LDMS can be deployed in this run
  ansible.builtin.set_fact:
    _ldms_deploy_skip: "{{ (_ldms_deploy_aggregator_control_host | length) == 0 }}"
    _ldms_deploy_skip_reason: >-
      {{
        '' if (_ldms_deploy_aggregator_control_host | length) > 0
        else (
          'No Slurm control node is defined in the cluster inventory'
          if (_ldms_control_candidates | length) == 0
          else 'No reachable Slurm control node has a readable munge key at '
               ~ (munge_key_path | default('/etc/munge/munge.key'))
        )
      }}

# ---- Check compute-node health using Slurm sinfo ----

- name: Get Slurm node status from control node (sinfo)
  # Note: sinfo must be available on the control node's PATH.
  # If Slurm binaries are only available via login shell profile scripts,
  # ensure they are added to the system PATH or use a login shell wrapper.
  # A failing sinfo (e.g. slurmctld down) is not fatal: compute nodes that
  # cannot be verified are skipped for the sampler and reported.
  ansible.builtin.command:
    argv: "{{ ldms_sinfo_command }}"
  delegate_to: "{{ _ldms_deploy_aggregator_control_host }}"
  register: _ldms_sinfo_output
  changed_when: false
  failed_when: false
  ignore_unreachable: true
  when:
    - not (_ldms_deploy_skip | bool)
    - _ldms_compute_candidates | length > 0

- name: Parse sinfo output to identify healthy nodes
  # sinfo -r already filters for responsive nodes only, so all returned nodes
  # are healthy. We just need to extract the node names from the output.
  ansible.builtin.set_fact:
    _ldms_sinfo_available: >-
      {{
        (_ldms_sinfo_output.rc | default(1)) == 0
        and not (_ldms_sinfo_output.unreachable | default(false) | bool)
      }}
    _ldms_sinfo_healthy_nodes: >-
      {{
        (
          _ldms_sinfo_output.stdout_lines
          | default([])
          | select('match', '^[a-zA-Z0-9._-]+$')
          | list
        )
        if (_ldms_sinfo_output.rc | default(1)) == 0
        else []
      }}
    _ldms_sinfo_error: >-
      {{
        (
          _ldms_sinfo_output.stderr
          | default(_ldms_sinfo_output.msg | default('no output'), true)
        ) | trim | truncate(200)
      }}

# ---- Check login-node reachability over SSH ----
# Login and login-compiler nodes are usually not Slurm partition members, so
# sinfo does not list them. Like control nodes, their reachability is checked
# directly over SSH instead of being filtered through sinfo.

- name: Check SSH reachability of login and login-compiler nodes
  vars:
    ansible_ssh_timeout: 10
    ansible_ssh_retries: 0
  ansible.builtin.ping:
  delegate_to: "{{ item }}"
  loop: "{{ _ldms_login_candidates | difference(_ldms_precheck_skipped_hosts) }}"
  loop_control:
    label: "{{ item }}"
  register: _ldms_deploy_login_ping_checks
  changed_when: false
  failed_when: false
  ignore_unreachable: true
  when: not (_ldms_deploy_skip | bool)

- name: Classify LDMS sampler nodes
  ansible.builtin.set_fact:
    _ldms_deploy_reachable_login_hosts: >-
      {{
        (_ldms_deploy_login_ping_checks.results | default([]))
        | selectattr('ping', 'defined')
        | selectattr('ping', 'equalto', 'pong')
        | map(attribute='item') | unique | sort
      }}
    _ldms_deploy_reachable_compute_hosts: >-
      {{
        _ldms_compute_candidates
        | intersect(_ldms_sinfo_healthy_nodes)
        | difference(_ldms_precheck_skipped_hosts)
        | sort
      }}
    _ldms_deploy_sampler_control_hosts: >-
      {{
        _ldms_deploy_reachable_control_hosts
        | difference(_ldms_precheck_skipped_hosts)
        | sort
      }}

- name: Build the LDMS sampler deployment set
  ansible.builtin.set_fact:
    _ldms_deploy_reachable_hosts: >-
      {{
        []
        if (_ldms_deploy_skip | bool)
        else (
          _ldms_deploy_reachable_compute_hosts
          | union(_ldms_deploy_reachable_login_hosts)
          | union(_ldms_deploy_sampler_control_hosts)
          | unique | sort
        )
      }}

# ---- Record skipped nodes with a reason ----
# Precheck findings are kept as-is; every other candidate that is not in the
# sampler deployment set is recorded with the reason found here.

- name: Record LDMS nodes skipped during deployment
  ansible.builtin.set_fact:
    _ldms_deploy_skipped_details: >-
      {%- set issues = [] -%}
      {%- for host in _ldms_deploy_candidate_hosts
            if host not in _ldms_precheck_skipped_hosts
            and host not in _ldms_deploy_reachable_hosts -%}
      {%- if host in _ldms_deploy_control_unreachable_hosts -%}
      {%- set reason = 'ssh_unreachable' -%}
      {%- set detail = 'SSH connection failed during LDMS deployment' -%}
      {%- elif _ldms_deploy_skip | bool and host in _ldms_control_candidates -%}
      {%- set reason = 'munge_key_unavailable' -%}
      {%- set detail = 'munge key not readable at ' ~ (munge_key_path | default('/etc/munge/munge.key')) -%}
      {%- elif _ldms_deploy_skip | bool -%}
      {%- set reason = 'ldms_skipped' -%}
      {%- set detail = _ldms_deploy_skip_reason -%}
      {%- elif host in _ldms_login_candidates -%}
      {%- set reason = 'ssh_unreachable' -%}
      {%- set detail = 'SSH connection failed during LDMS deployment' -%}
      {%- elif not (_ldms_sinfo_available | bool) -%}
      {%- set reason = 'sinfo_unavailable' -%}
      {%- set detail = 'sinfo failed on ' ~ _ldms_deploy_aggregator_control_host ~ ': ' ~ _ldms_sinfo_error -%}
      {%- else -%}
      {%- set reason = 'slurm_not_responsive' -%}
      {%- set detail = 'not responsive in idle/alloc/mixed state according to sinfo' -%}
      {%- endif -%}
      {%- set _ = issues.append({
            'node': host,
            'ip': hostvars[host].ansible_host | default(host),
            'reason': reason,
            'detail': detail
          }) -%}
      {%- endfor -%}
      {{ issues }}

- name: Combine precheck and deployment LDMS node findings
  ansible.builtin.set_fact:
    _ldms_deploy_all_skipped_details: >-
      {{ (_ldms_precheck_skipped_nodes + _ldms_deploy_skipped_details) | unique | list }}
    _ldms_deploy_unreachable_hosts: >-
      {{
        (
          (_ldms_precheck_skipped_hosts | intersect(_ldms_deploy_candidate_hosts))
          + (_ldms_deploy_skipped_details | map(attribute='node') | list)
        ) | unique | sort
      }}

# The aggregator config generator (nersc_ldms_make_ldms_config.py) produces
# no aggregator/store configuration for an empty host map, which would leave
# the aggregator pods without a valid configuration. When no sampler node is
# deployable in this run, the host map therefore lists every LDMS inventory
# node: producers are added as type=active and ldmsd keeps retrying them, so
# the aggregator runs cleanly and starts collecting as soon as a sampler is
# configured on a later run.
- name: Select the nodes rendered into the LDMS aggregator host map
  ansible.builtin.set_fact:
    _ldms_host_map_hosts: >-
      {{
        _ldms_deploy_reachable_hosts
        if (_ldms_deploy_reachable_hosts | length) > 0
        else _ldms_deploy_candidate_hosts
      }}
    _ldms_host_map_fallback: "{{ (_ldms_deploy_reachable_hosts | length) == 0 }}"

# ---- Populate dynamic host groups ----

- name: Add reachable nodes to the LDMS deployment group
  ansible.builtin.add_host:
    name: "{{ item }}"
    groups: ldms_deploy_reachable
  loop: "{{ _ldms_deploy_reachable_hosts | default([]) }}"
  loop_control:
    label: "{{ item }}"

- name: Add the selected LDMS aggregator control node
  ansible.builtin.add_host:
    name: "{{ item }}"
    groups: ldms_deploy_aggregator_control
  loop: >-
    {{
      [_ldms_deploy_aggregator_control_host]
      if (_ldms_deploy_aggregator_control_host | default('')) | length > 0
      else []
    }}
  loop_control:
    label: "{{ item }}"

# ---- Publish findings for the final telemetry status ----

- name: Publish unreachable LDMS deployment nodes
  vars:
    _current_deploy_unreachable_nodes: >-
      {{
        hostvars['localhost']['_deploy_unreachable_nodes']
        | default({'ldms': []}, true)
      }}
    _current_deploy_skipped_node_details: >-
      {{
        hostvars['localhost']['_deploy_skipped_node_details']
        | default({'ldms': []}, true)
      }}
  ansible.builtin.set_fact:
    _deploy_unreachable_nodes: >-
      {{
        _current_deploy_unreachable_nodes
        | combine({
            'ldms': (
              (_current_deploy_unreachable_nodes.ldms | default([]))
              + (_ldms_deploy_unreachable_hosts | default([]))
            ) | unique | sort
          })
      }}
    _deploy_skipped_node_details: >-
      {{
        _current_deploy_skipped_node_details
        | combine({
            'ldms': (
              (_current_deploy_skipped_node_details.ldms | default([]))
              + (_ldms_deploy_all_skipped_details | default([]))
            ) | unique | list
          })
      }}
    _ldms_deploy_skip_reason: "{{ _ldms_deploy_skip_reason }}"
  delegate_to: localhost
  delegate_facts: true

# ---- Warn (same pause as the iDRAC invalid-BMC warning) ----
# Precheck already warned and paused for its own findings, so the pause here
# only happens for new findings or when LDMS has to be skipped entirely.

- name: Warn that LDMS is skipped because no Slurm control node is usable
  ansible.builtin.debug:
    msg: "{{ ldms_deploy_skipped_msg }}"
  when: _ldms_deploy_skip | bool

- name: Warn about LDMS nodes skipped during deployment
  ansible.builtin.debug:
    msg: "{{ ldms_deploy_nodes_skipped_msg }}"
  when:
    - not (_ldms_deploy_skip | bool)
    - (_ldms_deploy_skipped_details | length > 0) or (_ldms_host_map_fallback | bool)

- name: Warning for user to fix LDMS Slurm node issues
  ansible.builtin.pause:
    seconds: "{{ ldms_warning_pause_seconds }}"
    prompt: "{{ ldms_warning_pause_prompt }}"
  when: >-
    (_ldms_deploy_skip | bool)
    or (_ldms_deploy_skipped_details | length > 0)
