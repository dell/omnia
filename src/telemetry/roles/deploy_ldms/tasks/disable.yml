# =============================================================================
# deploy_ldms — Disable LDMS telemetry
# =============================================================================
# Scales down LDMS telemetry resources when no telemetry sources
# require LDMS.
#
# This stops LDMS telemetry but preserves PVCs for future re-enablement.
# =============================================================================

- name: Load telemetry configuration
  ansible.builtin.include_role:
    name: common
    tasks_from: load_telemetry_config

- name: Check if LDMS resources exist
  ansible.builtin.command: >
    kubectl get statefulset nersc-ldms-agg -n {{ telemetry_namespace }}
  register: ldms_check
  changed_when: false
  failed_when: false

- name: Scale down LDMS resources
  ansible.builtin.command: >
    kubectl scale statefulset nersc-ldms-agg
    -n {{ telemetry_namespace }} --replicas=0
  register: scale_down_result
  changed_when: "'scaled' in scale_down_result.stdout"
  when: ldms_check.rc == 0

- name: Display scale down result
  ansible.builtin.debug:
    msg: "Scaling down LDMS telemetry to 0 replicas"
  when: ldms_check.rc == 0

- name: LDMS resources not found
  ansible.builtin.debug:
    msg: "LDMS telemetry resources not found, nothing to scale down"
  when: ldms_check.rc != 0
