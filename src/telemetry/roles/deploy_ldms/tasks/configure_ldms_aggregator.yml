# =============================================================================
# Configure LDMS aggregator (nersc-ldms-aggr Helm chart)
# =============================================================================
# Prepares the LDMS aggregator Helm chart files on NFS share, including
# machine config, host map, values.yaml, ldmsauth.conf, and munge key.
# The aggregator runs as a StatefulSet in the telemetry namespace.
#
# This task runs on the slurm_control_node to fetch the munge key.
# File operations on the kube_vip host and K8s deployment tasks are
# handled by deploy_ldms_aggregator_k8s.yml, called from a separate
# play targeting kube_vip_group.
# =============================================================================

- name: Check if munge key exists
  ansible.builtin.stat:
    path: "{{ munge_key_path }}"
  register: munge_key_check

- name: Fetch munge key from slurm control node
  ansible.builtin.fetch:
    src: "{{ munge_key_path }}"
    dest: "/tmp/munge.key"
    flat: true
  when: munge_key_check.stat.exists

- name: Warn if munge key not found
  ansible.builtin.debug:
    msg: "WARNING: Munge key not found at {{ munge_key_path }}. LDMS authentication may not work properly."
  when: not munge_key_check.stat.exists

- name: Ensure ldms_sampler_password is available for aggregator
  ansible.builtin.set_fact:
    ldms_sampler_password: "{{ telemetry_credentials.ldms_sampler_password | default('') }}"
  when:
    - telemetry_credentials is defined
    - telemetry_credentials.ldms_sampler_password is defined
  no_log: true

- name: Set munge key check result for kube_vip tasks
  ansible.builtin.set_fact:
    munge_key_check_result: "{{ munge_key_check.stat.exists | default(false) }}"

- name: Log LDMS aggregator configuration on control node complete
  ansible.builtin.debug:
    msg: "Munge key and credentials prepared on slurm control node"
