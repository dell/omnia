# =============================================================================
# Prepare LDMS aggregator authentication on a Slurm control node
# =============================================================================
# This task file only fetches current Munge authentication material from the
# selected control node. Chart rendering, secret reconciliation, and the Helm
# deployment run separately on kube_vip_group in deploy_ldms_aggregator_k8s.yml.
# =============================================================================

- name: Check if munge key exists
  ansible.builtin.stat:
    path: "{{ munge_key_path }}"
  register: munge_key_check

- name: Validate current munge key on selected control node
  ansible.builtin.assert:
    that:
      - munge_key_check.stat.exists | default(false)
      - munge_key_check.stat.isreg | default(false)
    fail_msg: >-
      The munge key disappeared from {{ munge_key_path }} on the selected
      Slurm control node. Refusing to reuse stale aggregator authentication.

- name: Fetch munge key from slurm control node
  ansible.builtin.fetch:
    src: "{{ munge_key_path }}"
    dest: "/tmp/munge.key"
    flat: true

- name: Get LDMS sampler password from credentials for aggregator
  ansible.builtin.set_fact:
    ldms_sampler_password_from_creds: "{{ telemetry_credentials.ldms_sampler_password | default('') }}"
  when:
    - telemetry_credentials is defined
    - telemetry_credentials.ldms_sampler_password is defined
  no_log: true

- name: Generate default LDMS sampler password if not provided (aggregator)
  ansible.builtin.set_fact:
    ldms_sampler_password: "{{ ldms_sampler_password_from_creds | default('') }}"
  when: ldms_sampler_password_from_creds is defined
  no_log: true

- name: Generate random LDMS sampler password if still empty (aggregator)
  ansible.builtin.set_fact:
    ldms_sampler_password: "{{ lookup('community.general.random_string', length=16, upper=true, lower=true, numbers=true, special=false) }}"
  when: ldms_sampler_password is not defined or ldms_sampler_password | length == 0
  no_log: true

- name: Validate LDMS sampler password length (aggregator)
  ansible.builtin.assert:
    that:
      - ldms_sampler_password | length >= 8
      - ldms_sampler_password | length <= 512
    fail_msg: "LDMS sampler password must be between 8 and 512 characters. Current length: {{ ldms_sampler_password | length }}"
    success_msg: "LDMS sampler password validated for aggregator (length: {{ ldms_sampler_password | length }} characters)"

- name: Set munge key check result for kube_vip tasks
  ansible.builtin.set_fact:
    munge_key_check_result: "{{ munge_key_check.stat.exists | default(false) }}"

- name: Log LDMS aggregator authentication preparation complete
  ansible.builtin.debug:
    msg: "Munge key and credentials prepared from selected Slurm control node"
