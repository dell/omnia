---

# =============================================================================
# Configure and deploy LDMS aggregator on kube_vip host
# =============================================================================
# Runs on kube_vip_group hosts which have helm/kubectl and kubeconfig access.
# Called from the deploy_ldms playbook as a separate play targeting kube_vip_group.
# Handles file operations, Helm chart preparation, and K8s deployment.
# =============================================================================

# ---- Prepare Helm chart files on kube_vip host ----

- name: Check if values.yaml already exists
  ansible.builtin.stat:
    path: "{{ ldms_aggregator_share_path }}/nersc-ldms-aggr/values.yaml"
  register: values_file_exists

- name: Copy LDMS aggregator Helm chart files
  ansible.builtin.copy:
    src: "{{ role_path }}/files/nersc-ldms-aggr"
    dest: "{{ ldms_aggregator_share_path }}"
    mode: "{{ common_mode }}"
  when: not values_file_exists.stat.exists

- name: Copy LDMS decompose.json
  ansible.builtin.copy:
    src: "{{ role_path }}/files/nersc-ldms-aggr/scripts/decomp.json"
    dest: "{{ ldms_aggregator_share_path }}/nersc-ldms-aggr/scripts/decomp.json"
    mode: "{{ file_permissions_644 }}"

- name: Generate LDMS machine config
  ansible.builtin.template:
    src: "{{ role_path }}/templates/ldms/ldms_machine_config.json.j2"
    dest: "{{ ldms_aggregator_share_path }}/nersc-ldms-aggr/ldms_machine_config.json"
    mode: "{{ file_permissions_644 }}"

- name: Generate LDMS host map
  ansible.builtin.template:
    src: "{{ role_path }}/templates/ldms/host_map.slurm-cluster.json.j2"
    dest: "{{ ldms_aggregator_share_path }}/nersc-ldms-aggr/host_map.slurm-cluster.json"
    mode: "{{ file_permissions_644 }}"

- name: Clean up previous build artifacts before make
  ansible.builtin.file:
    path: "{{ ldms_aggregator_share_path }}/nersc-ldms-aggr/{{ item }}"
    state: absent
  failed_when: false
  loop:
    - out_dir
    - manifest.yaml
    - values.yaml

- name: Run make command inside LDMS directory
  ansible.builtin.shell: make clean all && make
  changed_when: true
  args:
    chdir: "{{ ldms_aggregator_share_path }}/nersc-ldms-aggr"

- name: Render values.yaml
  ansible.builtin.template:
    src: "{{ role_path }}/templates/ldms/values.yaml.j2"
    dest: "{{ ldms_aggregator_share_path }}/nersc-ldms-aggr/values.yaml"
    mode: "{{ file_permissions_644 }}"

- name: Copy munge key to kube_vip host
  ansible.builtin.copy:
    src: "/tmp/munge.key"
    dest: "{{ ldms_aggregator_share_path }}/munge.key"
    mode: "{{ file_permissions_400 }}"
  delegate_to: localhost
  when: munge_key_check_result | default(false) | bool

- name: Render ldmsauth.conf to LDMS directory
  ansible.builtin.template:
    src: "{{ role_path }}/templates/ldms/ldmsauth.conf.j2"
    dest: "{{ ldms_aggregator_share_path }}/ldmsauth.conf"
    mode: "{{ file_permissions_600 }}"

- name: Log LDMS aggregator configuration complete
  ansible.builtin.debug:
    msg: "LDMS aggregator configuration rendered to {{ ldms_aggregator_share_path }}/nersc-ldms-aggr/"

# ---- Deploy LDMS aggregator Helm chart to Kubernetes ----

- name: Check if host map has nodes (non-empty)
  ansible.builtin.shell: >
    cat {{ ldms_aggregator_share_path }}/nersc-ldms-aggr/host_map.slurm-cluster.json | jq '. | length'
  register: host_map_count
  changed_when: false
  failed_when: false
  # noqa: risky-shell-pipe

- name: Skip Helm deploy if no nodes configured
  ansible.builtin.debug:
    msg: "No Slurm nodes configured in host map. Skipping LDMS aggregator Helm deployment."
  when: host_map_count.stdout | default('0') | int == 0

# ---- Create K8s secrets required by the Helm chart ----

- name: Check if nersc-munge-key secret exists
  ansible.builtin.command: >
    kubectl get secret nersc-munge-key -n {{ telemetry_namespace }}
  register: munge_secret_check
  changed_when: false
  failed_when: false
  when: host_map_count.stdout | default('0') | int > 0

- name: Create nersc-munge-key secret from munge key file
  ansible.builtin.command: >
    kubectl create secret generic nersc-munge-key
    --from-file=munge.key={{ ldms_aggregator_share_path }}/munge.key
    -n {{ telemetry_namespace }}
  changed_when: true
  when:
    - host_map_count.stdout | default('0') | int > 0
    - munge_secret_check.rc != 0
    - munge_key_check_result | default(false) | bool

- name: Check if nersc-ldms-ovis-auth secret exists
  ansible.builtin.command: >
    kubectl get secret nersc-ldms-ovis-auth -n {{ telemetry_namespace }}
  register: ovis_secret_check
  changed_when: false
  failed_when: false
  when: host_map_count.stdout | default('0') | int > 0

- name: Create nersc-ldms-ovis-auth secret from ldmsauth.conf
  ansible.builtin.command: >
    kubectl create secret generic nersc-ldms-ovis-auth
    --from-file=ldmsauth.conf={{ ldms_aggregator_share_path }}/ldmsauth.conf
    -n {{ telemetry_namespace }}
  changed_when: true
  when:
    - host_map_count.stdout | default('0') | int > 0
    - ovis_secret_check.rc != 0

# ---- Helm install / upgrade ----

- name: Check if nersc-ldms-aggr Helm release exists
  ansible.builtin.command: >
    helm status nersc-ldms-aggr -n {{ telemetry_namespace }}
  register: ldms_helm_status
  changed_when: false
  failed_when: false
  when: host_map_count.stdout | default('0') | int > 0

- name: Install nersc-ldms-aggr Helm chart (fresh install)
  ansible.builtin.command: >
    helm install nersc-ldms-aggr
    {{ ldms_aggregator_share_path }}/nersc-ldms-aggr/nersc-ldms-aggr
    --namespace {{ telemetry_namespace }}
    --values {{ ldms_aggregator_share_path }}/nersc-ldms-aggr/values.yaml
  register: ldms_helm_install
  changed_when: "'deployed' in ldms_helm_install.stdout | default('')"
  when:
    - host_map_count.stdout | default('0') | int > 0
    - ldms_helm_status.rc != 0

- name: Upgrade nersc-ldms-aggr Helm chart (existing release)
  ansible.builtin.command: >
    helm upgrade nersc-ldms-aggr
    {{ ldms_aggregator_share_path }}/nersc-ldms-aggr/nersc-ldms-aggr
    --namespace {{ telemetry_namespace }}
    --values {{ ldms_aggregator_share_path }}/nersc-ldms-aggr/values.yaml
  register: ldms_helm_upgrade
  changed_when: "'deployed' in ldms_helm_upgrade.stdout | default('')"
  when:
    - host_map_count.stdout | default('0') | int > 0
    - ldms_helm_status.rc == 0

- name: Wait for LDMS aggregator StatefulSet rollout
  ansible.builtin.command: >
    kubectl rollout status statefulset/{{ ldms_aggregator_name }}
    -n {{ telemetry_namespace }}
    --timeout={{ ldms_deploy_timeout }}
  register: ldms_agg_rollout
  changed_when: false
  when: host_map_count.stdout | default('0') | int > 0

- name: Wait for LDMS aggregator pods to be ready
  ansible.builtin.command: >
    kubectl wait --for=condition=Ready
    pod -l app={{ ldms_aggregator_name }}
    -n {{ telemetry_namespace }}
    --timeout={{ ldms_verify_timeout }}
  register: ldms_agg_pods_ready
  changed_when: false
  retries: "{{ pod_ready_retries }}"
  delay: "{{ pod_ready_delay }}"
  until: ldms_agg_pods_ready.rc == 0
  when: host_map_count.stdout | default('0') | int > 0

- name: Wait for LDMS store daemon pods to be ready
  ansible.builtin.command: >
    kubectl wait --for=condition=Ready
    pod -l app={{ ldms_store_name }}
    -n {{ telemetry_namespace }}
    --timeout={{ ldms_verify_timeout }}
  register: ldms_store_pods_ready
  changed_when: false
  retries: "{{ pod_ready_retries }}"
  delay: "{{ pod_ready_delay }}"
  until: ldms_store_pods_ready.rc == 0
  when: host_map_count.stdout | default('0') | int > 0

- name: Log LDMS aggregator deployment complete
  ansible.builtin.debug:
    msg: "LDMS aggregator Helm chart deployed successfully in namespace {{ telemetry_namespace }}"
  when: host_map_count.stdout | default('0') | int > 0
