# =============================================================================
# Configure LDMS sampler on LDMS-enabled Slurm nodes
# =============================================================================
# Shared sampler files are prepared once by prepare_ldms_sampler_config.yml.
# This task file installs them and configures ldmsd on each reachable node.
#
# Configuration is read from telemetry_config.yml:
#   - ldms_configurations.sampler_port: Port for sampler daemon
#   - ldms_configurations.sampler_plugins: List of sampler plugins to load
#
# Variables are defined in vars/main.yml:
#   - ldms_sampler.*: Installation paths and service configuration
#   - ldms_firewall_ports: Ports to open in firewall
#   - ldms_service_template: Systemd service unit template
#
# Files installed:
#   - sampler.conf: Plugin configuration (from sampler_plugins)
#   - ldmsauth.conf: Authentication credentials
#   - ldmsd.sampler.env: Environment variables for systemd service
# =============================================================================

# -----------------------------------------------------------------------------
# Phase 1: Deploy configuration to each reachable LDMS-enabled Slurm node
# -----------------------------------------------------------------------------

- name: Ensure LDMS configuration directory exists
  ansible.builtin.file:
    path: "{{ ldms_sampler.config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "{{ common_mode }}"
  register: ldms_sampler_config_directory_result

- name: Copy sampler configuration from NFS share
  ansible.builtin.copy:
    src: "{{ ldms_sampler_share_path }}/samplers/{{ ldms_sampler.config_file }}"
    dest: "{{ ldms_sampler.config_dir }}/{{ ldms_sampler.config_file }}"
    owner: root
    group: root
    mode: "{{ file_permissions_644 }}"
    remote_src: true
  register: sampler_config_changed

- name: Copy LDMS authentication configuration from NFS share
  ansible.builtin.copy:
    src: "{{ ldms_sampler_share_path }}/samplers/{{ ldms_sampler.auth_file }}"
    dest: "{{ ldms_sampler.config_dir }}/{{ ldms_sampler.auth_file }}"
    owner: root
    group: root
    mode: "{{ file_permissions_600 }}"
    remote_src: true
  register: auth_config_changed

- name: Copy LDMS sampler environment file from NFS share
  ansible.builtin.copy:
    src: "{{ ldms_sampler_share_path }}/samplers/{{ ldms_sampler.env_file }}"
    dest: "{{ ldms_sampler.config_dir }}/{{ ldms_sampler.env_file }}"
    owner: root
    group: root
    mode: "{{ file_permissions_644 }}"
    remote_src: true
  register: env_config_changed

- name: Set config changed flag
  ansible.builtin.set_fact:
    ldms_config_changed: >-
      {{
        (sampler_config_changed.changed | default(false) | bool)
        or (auth_config_changed.changed | default(false) | bool)
        or (env_config_changed.changed | default(false) | bool)
      }}

# -----------------------------------------------------------------------------
# Phase 2: Configure firewall for LDMS sampler port
# -----------------------------------------------------------------------------

- name: Check if firewalld is running
  ansible.builtin.systemd:
    name: firewalld
  register: firewalld_status
  changed_when: false
  failed_when: false
  check_mode: true

- name: Open LDMS sampler port in firewall
  ansible.posix.firewalld:
    port: "{{ item.port }}/{{ item.protocol }}"
    permanent: true
    state: enabled
    immediate: true
  loop: "{{ ldms_firewall_ports }}"
  when: >-
    (firewalld_status.status | default({})).ActiveState
    | default('inactive') == 'active'
  register: firewall_result

- name: Log firewall configuration
  ansible.builtin.debug:
    msg: "{{ ldms_sampler_firewall_msg }}"
  when: >-
    (firewalld_status.status | default({})).ActiveState
    | default('inactive') == 'active'

# -----------------------------------------------------------------------------
# Phase 3: Configure and start ldmsd systemd service
# -----------------------------------------------------------------------------

- name: Check if ldmsd systemd service file exists
  ansible.builtin.stat:
    path: "{{ ldms_sampler.service_file }}"
  register: ldmsd_service_stat

- name: Create ldmsd systemd service file
  ansible.builtin.copy:
    dest: "{{ ldms_sampler.service_file }}"
    owner: root
    group: root
    mode: "{{ file_permissions_644 }}"
    content: "{{ ldms_service_template }}"
  when: not ((ldmsd_service_stat.stat | default({})).exists | default(false) | bool)
  register: ldmsd_service_created

- name: Reload systemd daemon  # noqa: no-handler
  ansible.builtin.systemd:
    daemon_reload: true
  when: ldmsd_service_created is changed
  register: ldmsd_daemon_reload_result

- name: Restart ldmsd service if config changed
  ansible.builtin.systemd:
    name: "{{ ldms_sampler.service_name }}"
    state: restarted
    daemon_reload: true
  when: ldms_config_changed | default(false) | bool
  register: ldmsd_restart_result

- name: Enable and start ldmsd service
  ansible.builtin.systemd:
    name: "{{ ldms_sampler.service_name }}"
    state: started
    enabled: true
  register: ldmsd_start_result

- name: Wait for ldmsd service to be active
  ansible.builtin.systemd:
    name: "{{ ldms_sampler.service_name }}"
  register: ldmsd_status
  retries: 5
  delay: 3
  until: >-
    (ldmsd_status.status | default({})).ActiveState
    | default('inactive') == 'active'
  changed_when: false

- name: Verify ldmsd is listening on sampler port
  ansible.builtin.wait_for:
    port: "{{ telemetry_config.ldms_configurations.sampler_port }}"
    host: "0.0.0.0"
    timeout: 30
    state: started
  register: ldmsd_port_result

- name: Log LDMS sampler service started
  ansible.builtin.debug:
    msg: "{{ ldms_sampler_started_msg }}"

- name: Record sampler reachability during deployment
  vars:
    _ldms_sampler_direct_results:
      - "{{ ldms_sampler_config_directory_result | default({}) }}"
      - "{{ sampler_config_changed | default({}) }}"
      - "{{ auth_config_changed | default({}) }}"
      - "{{ env_config_changed | default({}) }}"
      - "{{ firewalld_status | default({}) }}"
      - "{{ ldmsd_service_stat | default({}) }}"
      - "{{ ldmsd_service_created | default({}) }}"
      - "{{ ldmsd_daemon_reload_result | default({}) }}"
      - "{{ ldmsd_restart_result | default({}) }}"
      - "{{ ldmsd_start_result | default({}) }}"
      - "{{ ldmsd_status | default({}) }}"
      - "{{ ldmsd_port_result | default({}) }}"
    _ldms_sampler_loop_results: >-
      {{ (firewall_result | default({})).results | default([]) }}
  ansible.builtin.set_fact:
    _ldms_sampler_unreachable_during_deploy: >-
      {{
        (
          _ldms_sampler_direct_results
          | selectattr('unreachable', 'defined')
          | selectattr('unreachable') | list | length > 0
        )
        or
        (
          _ldms_sampler_loop_results
          | selectattr('unreachable', 'defined')
          | selectattr('unreachable') | list | length > 0
        )
      }}
