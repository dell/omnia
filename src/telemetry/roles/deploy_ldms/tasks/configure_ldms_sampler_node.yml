# =============================================================================
# deploy_ldms — Bootstrap and configure the LDMS sampler on one reachable node
# =============================================================================
# This is the enable-only counterpart to enable.yml for Slurm nodes: enable.yml
# runs on kube_vip_group and cannot reach these hosts directly, so Play 2 of
# the deploy_ldms playbook runs this task file in parallel across the
# ldms_deploy_reachable group (populated by enable.yml's
# build_deployment_inventory step in Play 1). Bundling the bootstrap steps
# here keeps the playbook itself to a single include, with no logic
# duplicated between Play 1 and Play 2.
# =============================================================================

# A failure on one node is recorded (rescue) instead of failing that host, so
# the run does not end with errors for a node that is simply unhealthy. The
# outcome is collected by the "Record LDMS sampler results" play in
# playbooks/deploy/sources/deploy_ldms.yml and reported in the final status.
- name: Configure LDMS sampler and record the outcome
  block:
    - name: Propagate telemetry credentials from localhost
      ansible.builtin.include_role:
        name: common
        tasks_from: propagate_telemetry_credentials

    - name: Load telemetry configuration (only if not already loaded)
      ansible.builtin.include_role:
        name: common
        tasks_from: load_telemetry_config
      when: telemetry_config is not defined

    - name: Configure LDMS sampler on reachable node
      ansible.builtin.include_tasks: configure_ldms_sampler.yml

    - name: Record LDMS sampler configuration result
      ansible.builtin.set_fact:
        _ldms_sampler_result:
          status: "{{ 'unreachable' if (_ldms_sampler_unreachable_during_deploy | default(false) | bool) else 'configured' }}"
          detail: >-
            {{
              'SSH connection lost while configuring the LDMS sampler'
              if (_ldms_sampler_unreachable_during_deploy | default(false) | bool)
              else ''
            }}
  rescue:
    - name: Record LDMS sampler configuration failure
      ansible.builtin.set_fact:
        _ldms_sampler_result:
          status: "failed"
          detail: >-
            {{
              ((ansible_failed_task | default({})).name | default('LDMS sampler configuration'))
              ~ ': '
              ~ ((ansible_failed_result | default({})).msg | default('unknown error') | string | truncate(200))
            }}

    - name: Warn about LDMS sampler configuration failure
      ansible.builtin.debug:
        msg: >-
          [WARNING] LDMS sampler could not be configured on {{ inventory_hostname }}:
          {{ _ldms_sampler_result.detail }}. The node is skipped for LDMS in this run;
          fix it and re-run telemetry.yml.
