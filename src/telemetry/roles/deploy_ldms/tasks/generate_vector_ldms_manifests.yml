---

# =============================================================================
# Generate Vector-LDMS K8s manifests
# =============================================================================
# Renders: vector-ldms-configmap.yaml, vector-ldms-deployment.yaml,
#          vector-ldms-service.yaml
# =============================================================================

- name: Create Vector deployments directory
  ansible.builtin.file:
    path: "{{ telemetry_deployments_dir }}/vector"
    state: directory
    mode: "0755"

- name: Render Vector-LDMS ConfigMap
  ansible.builtin.template:
    src: "{{ role_path }}/templates/vector/vector-ldms-configmap.yaml.j2"
    dest: "{{ telemetry_deployments_dir }}/vector/vector-ldms-configmap.yaml"
    mode: "0644"

- name: Render Vector-LDMS Deployment
  ansible.builtin.template:
    src: "{{ role_path }}/templates/vector/vector-ldms-deployment.yaml.j2"
    dest: "{{ telemetry_deployments_dir }}/vector/vector-ldms-deployment.yaml"
    mode: "0644"

- name: Render Vector-LDMS Service
  ansible.builtin.template:
    src: "{{ role_path }}/templates/vector/vector-ldms-service.yaml.j2"
    dest: "{{ telemetry_deployments_dir }}/vector/vector-ldms-service.yaml"
    mode: "0644"

- name: Log Vector-LDMS manifest generation complete
  ansible.builtin.debug:
    msg: >
      Vector-LDMS manifests generated at {{ telemetry_deployments_dir }}/vector/:
      vector-ldms-configmap.yaml, vector-ldms-deployment.yaml, vector-ldms-service.yaml
