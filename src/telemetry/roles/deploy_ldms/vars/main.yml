---

# Paths — derived from telemetry_setup role (Step 0, tags: always)
# input_project_dir, output_project_dir, and telemetry_data_path are set by telemetry_setup.
# telemetry_config_file and telemetry_storage_config_file are defined in common/vars/main.yml.
telemetry_output_dir: "{{ output_project_dir | default('/opt/omnia/telemetry/output/project_default') }}"
telemetry_status_file: "{{ telemetry_output_dir }}/telemetry_status.yml"

# Namespace
telemetry_namespace: "telemetry"

# Deploy directory on NFS share (where manifests are staged)
telemetry_deploy_dir: "{{ k8s_cluster_mount }}/telemetry"
telemetry_deployments_dir: "{{ telemetry_deploy_dir }}/deployments"

# LDMS NFS share paths
# Sampler configuration (on slurm nodes): uses slurm_cluster_mount
ldms_sampler_share_path: "{{ slurm_cluster_mount }}/telemetry/ldms"

# Aggregator configuration (on k8s nodes): uses k8s_cluster_mount
ldms_aggregator_share_path: "{{ k8s_cluster_mount }}/telemetry/ldms"

# File permissions
file_permissions_644: "0644"
file_permissions_600: "0600"
file_permissions_400: "0400"
common_mode: "0755"

# LDMS K8s identifiers
ldms_aggregator_name: "nersc-ldms-aggr"
ldms_store_name: "nersc-ldms-store"

# Slurm config path (for munge key)
slurm_config_path: "/etc/slurm"
munge_key_path: "/etc/munge/munge.key"

# LDMS backup path for PXE change detection
backup_pxe_mapping_ldms_path: "{{ telemetry_data_path | default('/opt/omnia/telemetry') }}/backup_pxe_mapping_ldms.csv"

# Dynamic image configuration from telemetry_packages.yml
telemetry_images: "{{ hostvars['localhost']['telemetry_registry'].images | default({}) }}"

# Kafka topic names (FIXED - cannot be changed)
kafka:
  topics:
    ldms:
      name: "ldms"
      consumer_group: "ldms-consumer-group"

# Vector-LDMS configuration
# Note: When a private registry host is set, strip the 'docker.io/' prefix from image names
# since private registries store images without the docker.io prefix.
vector:
  image: |-
    {%- if telemetry_registry.host | default('') -%}
    {{ telemetry_registry.host }}/{{ (telemetry_images['timberio/vector'] |
    default('docker.io/timberio/vector:0.54.0-debian')) | regex_replace('^docker\\.io/', '') }}
    {%- else -%}
    {{ telemetry_images['timberio/vector'] | default('docker.io/timberio/vector:0.54.0-debian') }}
    {%- endif -%}
  ldms:
    app_name: "vector-ldms"
    service_name: "vector-ldms"
    container_name: "vector-ldms"
    kafka_topic: "ldms"
    consumer_group: "vector-ldms-group"
    kafka_user: "kafkapump"
    health_port: 8687
    metrics_port: 9599
    replicas: "{{ telemetry_storage_config.vector_storage.ldms.replicas | default(2) }}"
    resources:
      requests:
        cpu: "{{ telemetry_storage_config.vector_storage.ldms.resources.requests.cpu | default('100m') }}"
        memory: "{{ telemetry_storage_config.vector_storage.ldms.resources.requests.memory | default('256Mi') }}"
      limits:
        cpu: "{{ telemetry_storage_config.vector_storage.ldms.resources.limits.cpu | default('500m') }}"
        memory: "{{ telemetry_storage_config.vector_storage.ldms.resources.limits.memory | default('512Mi') }}"
  # vmagent-vector: dedicated write-buffer for Vector → vminsert (metrics)
  vmagent_vector:
    service_name: "vmagent-vector"
    port: 8429
    replicas: 2
    image: |-
      {%- if telemetry_registry.host | default('') -%}
      {{ telemetry_registry.host }}/{{ (telemetry_registry.images.victoria.vmagent |
      default('victoriametrics/vmagent:v1.149.0')) | regex_replace('^docker\\.io/', '') }}
      {%- else -%}
      {{ telemetry_registry.images.victoria.vmagent | default('victoriametrics/vmagent:v1.149.0') }}
      {%- endif -%}
    remote_write_url: >-
      {{
        ('https' if victoria_cluster.tls_enabled | default(false) | bool else 'http')
        ~ '://vminsert-victoria-cluster.'
        ~ telemetry_namespace
        ~ '.svc.cluster.local:8480/insert/0/prometheus/api/v1/write'
      }}
    tmp_data_path: "/tmp/vmagent-buffer"
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"

# Victoria cluster TLS setting (used by vmagent-vector template)
victoria_cluster:
  tls_enabled: false

# Verification timeouts
ldms_deploy_timeout: "600s"
ldms_verify_timeout: "300s"
pod_ready_retries: 30
pod_ready_delay: 10
ldms_store_restart_wait_seconds: 10

# =============================================================================
# LDMS Sampler Configuration (deployed to compute nodes)
# =============================================================================
# These settings configure the LDMS sampler daemon on Slurm compute nodes.
# Values are read from telemetry_config.yml ldms_configurations section.

# LDMS sampler paths
ldms_sampler:
  # Installation paths
  install_dir: "/opt/ovis-ldms"
  config_dir: "/opt/ovis-ldms/etc/ldms"
  bin_dir: "/opt/ovis-ldms/sbin"
  lib_dir: "/opt/ovis-ldms/lib/ovis-ldms"
  # Configuration files
  config_file: "sampler.conf"
  auth_file: "ldmsauth.conf"
  env_file: "ldmsd.sampler.env"
  # Systemd service
  service_name: "ldmsd"
  service_file: "/etc/systemd/system/ldmsd.service"
  # Service configuration
  transport: "sock"
  auth_plugin: "ovis"
  memory: "512K"
  log_level: "INFO"

# Firewall ports to open on compute nodes for LDMS sampler
# The sampler_port is read from telemetry_config.ldms_configurations.sampler_port
ldms_firewall_ports:
  - port: "{{ telemetry_config.ldms_configurations.sampler_port | default(10001) }}"
    protocol: "tcp"
    description: "LDMS sampler daemon"

# LDMS sampler service template
ldms_service_template: |
  [Unit]
  Description=LDMS Daemon (Sampler)
  After=network.target

  [Service]
  Type=simple
  EnvironmentFile={{ ldms_sampler.config_dir }}/{{ ldms_sampler.env_file }}
  Environment="HOSTNAME=%H"
  ExecStart={{ ldms_sampler.bin_dir }}/ldmsd -F \
    -x ${LDMSD_XPRT}:${LDMSD_PORT} \
    -a ${LDMSD_AUTH_PLUGIN} \
    -A conf=${LDMS_AUTH_FILE} \
    -c ${LDMSD_PLUGIN_CONFIG_FILE} \
    -v ${LDMSD_VERBOSE} \
    -m ${LDMSD_MEM}
  Restart=on-failure
  RestartSec=10

  [Install]
  WantedBy=multi-user.target

# Messages
pxe_first_run_msg: "First provision run detected. Saving PXE mapping backup. LDMS restart not required."
pxe_no_change_msg: "PXE mapping file has not changed since last run. Skipping LDMS restart."
pxe_changed_msg: "PXE mapping file has changed. LDMS restart will be triggered."
ldms_pod_ready_msg: "LDMS aggregator pod is ready."
ldms_pod_not_ready_msg: "WARNING: LDMS aggregator pod did not become ready within 120s."
ldms_store_pod_ready_msg: "LDMS store daemon pod restarted successfully and is ready."
ldms_store_pod_not_ready_msg: "LDMS store daemon pod restart failed or not ready within timeout."
ldms_sampler_started_msg: "LDMS sampler service started on {{ inventory_hostname }} listening on port {{ telemetry_config.ldms_configurations.sampler_port }}"
ldms_sampler_firewall_msg: "Firewall port {{ telemetry_config.ldms_configurations.sampler_port }}/tcp opened for LDMS sampler"
