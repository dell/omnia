# -----------------------------------------------------------------------------
# USAGE INFORMATION
# -----------------------------------------------------------------------------
telemetry_usage_info_msg:
  - "========== TELEMETRY =========="
  - "Available tags:"
  - "  precheck   - Validate telemetry prerequisites"
  - "  validate   - Validate telemetry input configuration"
  - "  deploy     - Deploy all enabled telemetry sources"
  - "  cleanup    - Remove all telemetry components"
  - "  upgrade    - Upgrade telemetry components"
  - "  rollback   - Rollback telemetry components"
  - ""
  - "Utility tags:"
  - "  external_kafka             - Fetch Kafka external connection details"
  - ""
  - "Source cleanup tags (sinks are only cleaned via --tags cleanup):"
  - "  cleanup_idrac              - iDRAC only"
  - "  cleanup_ldms               - LDMS only"
  - "  cleanup_ome                - OME only"
  - "  cleanup_powerscale         - PowerScale only"
  - "  cleanup_ufm                - UFM only"
  - "  cleanup_vast               - VAST only"
  - "  cleanup_sfm                - SFM only"
  - ""
  - "Examples:"
  - "  ansible-playbook playbooks/telemetry.yml --tags deploy"
  - "  ansible-playbook playbooks/telemetry.yml --tags precheck"
  - "  ansible-playbook playbooks/telemetry.yml --tags cleanup_powerscale"
  - "================================"
