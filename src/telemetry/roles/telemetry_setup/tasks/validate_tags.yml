---
# Step 0: Tag validation — reject unsupported tags
- name: Get provided tags (excluding 'always' and 'all')
  ansible.builtin.set_fact:
    provided_tags: "{{ ansible_run_tags | difference(['always', 'all']) }}"

- name: Identify invalid tags
  ansible.builtin.set_fact:
    invalid_tags: "{{ provided_tags | difference(supported_tags) }}"
  when: provided_tags | length > 0

- name: Fail if invalid tags are provided
  ansible.builtin.fail:
    msg: "{{ tag_validation_fail_msg }}"
  when:
    - provided_tags | length > 0
    - invalid_tags | default([]) | length > 0
