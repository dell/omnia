# =============================================================================
# LOAD TELEMETRY CONFIGURATION
# =============================================================================
# Loads and validates that all required telemetry input files exist.
# =============================================================================

- name: Check telemetry_config.yml exists
  ansible.builtin.stat:
    path: "{{ telemetry_config_file }}"
  register: telemetry_config_stat

- name: Fail if telemetry_config.yml is missing
  ansible.builtin.fail:
    msg: "{{ telemetry_config_missing_msg }}"
  when: not telemetry_config_stat.stat.exists

- name: Load telemetry configuration
  ansible.builtin.include_vars:
    file: "{{ telemetry_config_file }}"
    name: telemetry_config
