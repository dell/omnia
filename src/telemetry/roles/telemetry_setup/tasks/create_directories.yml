---
# =============================================================================
# CREATE DIRECTORIES
# =============================================================================
# Creates required runtime directories for telemetry operations.
# Paths are derived from omnia.env by load_config.yml (runs before this).
# =============================================================================

- name: Ensure base omnia data directory exists
  ansible.builtin.file:
    path: "{{ omnia_data_path }}"
    state: directory
    mode: '0755'
  become: true

- name: Ensure telemetry runtime directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ telemetry_data_path }}"
    - "{{ input_project_dir }}"
    - "{{ output_project_dir }}"
    - "{{ log_dir }}"
  become: true

- name: Ensure Ansible log directory exists with restricted permissions
  ansible.builtin.file:
    path: "{{ telemetry_log_dir }}"
    state: directory
    mode: "{{ telemetry_log_dir_mode }}"
  become: true

- name: Find existing Ansible log files
  ansible.builtin.find:
    paths: "{{ telemetry_log_dir }}"
    patterns: "*.log*"
    file_type: file
  register: _telemetry_log_files
  become: true

- name: Restrict permissions on existing Ansible log files
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "{{ telemetry_log_file_mode }}"
  loop: "{{ _telemetry_log_files.files }}"
  loop_control:
    label: "{{ item.path }}"
  become: true

- name: Check whether logrotate configuration directory exists
  ansible.builtin.stat:
    path: "{{ telemetry_logrotate_dir }}"
  register: _telemetry_logrotate_dir

- name: Configure log rotation for Ansible log files
  ansible.builtin.copy:
    dest: "{{ telemetry_logrotate_dir }}/omnia-telemetry"
    content: |
      {{ telemetry_log_dir }}/*.log {
          weekly
          rotate {{ telemetry_logrotate_count }}
          compress
          delaycompress
          missingok
          notifempty
          create {{ telemetry_log_file_mode }}
      }
    owner: root
    group: root
    mode: '0644'
  when: _telemetry_logrotate_dir.stat.isdir | default(false)
  become: true

- name: Validate runtime directories were created
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ omnia_data_path }}"
    - "{{ telemetry_data_path }}"
    - "{{ output_project_dir }}"
    - "{{ log_dir }}"
  register: _dir_checks

- name: Fail if any required directory is missing
  ansible.builtin.fail:
    msg: "Required directory does not exist: {{ item.item }}"
  when: not item.stat.exists
  loop: "{{ _dir_checks.results }}"
