---
# Self-contained credential definition for telemetry.
# This role can operate independently of the central credential_utility.

# Credential file definition (standalone — no dependency on credential_utility index)
telemetry_credential_file:
  credential_type: "Telemetry"
  template: "{{ role_path }}/templates/telemetry_credential.j2"
  file_path: "{{ input_project_dir }}/telemetry/input/telemetry_credentials.yml"
  file_mode: "0600"
  vault_path: "{{ input_project_dir }}/telemetry/input/.telemetry_credentials_key"

# Credential prompt definitions
telemetry_cred_config:
  mandatory:
    - username: mysqldb_user
    - password: mysqldb_password
    - password: mysqldb_root_password
  conditional_mandatory:
    - username: bmc_username
      condition: "{{ telemetry_config.telemetry_sources.idrac.metrics_enabled | default(false) | bool }}"
    - password: bmc_password
      condition: "{{ telemetry_config.telemetry_sources.idrac.metrics_enabled | default(false) | bool }}"

# Messages
telemetry_mandatory_warning_msg: "WARNING: The following are mandatory telemetry credentials and cannot be left empty."
telemetry_conditional_warning_msg: "WARNING: Conditional telemetry credentials will be prompted based on iDRAC telemetry configuration."
telemetry_password_fail_msg: "Failed. Password is required for mandatory telemetry credential."
telemetry_password_match_fail_msg: "Failed. Passwords do not match. Please try again."
telemetry_credential_encrypt_fail_msg: "Failed to encrypt telemetry credential file."
telemetry_cred_file_missing_msg: |
  Telemetry credential file not found at {{ telemetry_credential_file.file_path }}.
  It will be created from template.
