---
# Prompt for password with confirmation and retry on mismatch.
# Re-includes prompt_credential_field.yml on mismatch to re-prompt username + password.
# Max retries: 3

- name: Initialize retry counter
  ansible.builtin.set_fact:
    _password_retry_count: "{{ _password_retry_count | default(0) | int }}"

- name: Check max retries exceeded
  ansible.builtin.fail:
    msg: "Maximum password retry attempts (3) exceeded for {{ cred_field.get('password', cred_field.get('username')) }}."
  when: _password_retry_count | int >= 3

- name: Prompt for credential # noqa name[template]
  ansible.builtin.pause:
    prompt: "[Telemetry] Enter {{ cred_field.get('password', cred_field.get('username')) }}"
    echo: false
  no_log: true
  register: _password_input

- name: Validate password is not empty for mandatory credential
  ansible.builtin.fail:
    msg: "{{ telemetry_password_fail_msg }}"
  when: _password_input.user_input | length == 0

- name: Confirm credential # noqa name[template]
  ansible.builtin.pause:
    prompt: "[Telemetry] Confirm {{ cred_field.get('password', cred_field.get('username')) }}"
    echo: false
  no_log: true
  register: _password_confirm

- name: Handle password mismatch with retry
  when: _password_input.user_input != _password_confirm.user_input
  block:
    - name: Warn about password mismatch
      ansible.builtin.debug:
        msg: "{{ telemetry_password_match_fail_msg }} Re-prompting credentials (attempt {{ _password_retry_count | int + 1 }} of 3)."

    - name: Increment retry counter
      ansible.builtin.set_fact:
        _password_retry_count: "{{ _password_retry_count | int + 1 }}"
        _need_username: true
        _need_password: true

    - name: Re-prompt username on password mismatch
      when: cred_field.username is defined
      block:
        - name: Re-prompt for credential # noqa name[template]
          ansible.builtin.pause:
            prompt: "[Telemetry] Re-enter {{ cred_field.get('username', cred_field.get('password')) }}"
          no_log: true
          register: _username_input

        - name: Validate re-entered username is not empty
          ansible.builtin.fail:
            msg: "{{ telemetry_mandatory_warning_msg }} {{ cred_field.get('username') }} cannot be empty."
          when:
            - cred_field.condition is not defined
            - _username_input.user_input | length == 0

    - name: Retry password prompt
      ansible.builtin.include_tasks: prompt_password_with_retry.yml
