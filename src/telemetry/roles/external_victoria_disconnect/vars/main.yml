---

# Namespace for all Victoria components (must match external_victoria_connect)
victoria_namespace: "telemetry"

# VMCluster service names (must match external_victoria_connect)
vm_vminsert_service: "vminsert-victoria-cluster"
vm_vmselect_service: "vmselect-victoria-cluster"

# VLAgent service name (must match external_victoria_connect)
vl_vlagent_service: "vlagent"

# Output paths (must match external_victoria_connect)
victoria_output_dir: >-
  {{ output_project_dir | default('/opt/omnia/telemetry/output/project_default') }}/external_victoria

# Error messages
victoria_disconnect_err_kube_vip_unreachable: >-
  kube_vip host is not reachable over SSH: {{ ansible_host | default(inventory_hostname) }}.
  Ensure the Kubernetes control plane VIP is reachable from this host.

# SFM disconnect instructions
sfm_ui_navigation: "Observability -> Settings -> Prometheus Remote Write"
sfm_remote_write_disable_value: "OFF"
