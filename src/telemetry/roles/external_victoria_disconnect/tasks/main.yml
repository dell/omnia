---

# =============================================================================
# external_victoria_disconnect — Disconnect external Victoria clients
#
# This role runs on kube_vip to:
#   1. Check current state of Victoria external LoadBalancer services
#   2. Display manual disconnect instructions for SFM and PowerScale
#
# NOTE: No cluster-side changes are made. LoadBalancer services and
# exported certificates are preserved. External systems must be manually
# disconnected on their side (SFM UI, PowerScale CLI).
#
# To reconnect, run external_victoria_connect.yml again.
# =============================================================================

- name: Validate kube_vip connectivity
  block:
    - name: Wait for kube_vip connection
      ansible.builtin.wait_for_connection:
        timeout: 30
  rescue:
    - name: Fail when kube_vip is not reachable
      ansible.builtin.fail:
        msg: "{{ victoria_disconnect_err_kube_vip_unreachable }}"

- name: Check kubectl availability
  ansible.builtin.command: kubectl version --client=true
  register: _kubectl_check
  changed_when: false
  failed_when: _kubectl_check.rc != 0

# =============================================================================
# Check current state of Victoria external services
# =============================================================================

- name: Check if vminsert LoadBalancer service exists
  ansible.builtin.command: >-
    kubectl get svc {{ vm_vminsert_service }} -n {{ victoria_namespace }}
    -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
  register: _vminsert_lb_check
  changed_when: false
  failed_when: false

- name: Check if vmselect LoadBalancer service exists
  ansible.builtin.command: >-
    kubectl get svc {{ vm_vmselect_service }} -n {{ victoria_namespace }}
    -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
  register: _vmselect_lb_check
  changed_when: false
  failed_when: false

- name: Check if VLAgent service exists
  ansible.builtin.command: >-
    kubectl get svc {{ vl_vlagent_service }} -n {{ victoria_namespace }}
    -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
  register: _vlagent_lb_check
  changed_when: false
  failed_when: false

- name: Set Victoria service state
  ansible.builtin.set_fact:
    _vminsert_ip: "{{ _vminsert_lb_check.stdout | trim | default('N/A') }}"
    _vminsert_available: "{{ _vminsert_lb_check.rc == 0 and (_vminsert_lb_check.stdout | trim | length > 0) }}"
    _vmselect_ip: "{{ _vmselect_lb_check.stdout | trim | default('N/A') }}"
    _vmselect_available: "{{ _vmselect_lb_check.rc == 0 and (_vmselect_lb_check.stdout | trim | length > 0) }}"
    _vlagent_ip: "{{ _vlagent_lb_check.stdout | trim | default('N/A') }}"
    _vlagent_available: "{{ _vlagent_lb_check.rc == 0 and (_vlagent_lb_check.stdout | trim | length > 0) }}"

# =============================================================================
# (No cleanup - exported certificates and connection details are preserved)
# =============================================================================

# NOTE: Exported certificates and connection details are NOT deleted.
# They are still valid for the running cluster and can be reused for reconnection.

# =============================================================================
# Display disconnect summary and manual instructions
# =============================================================================

- name: Display Victoria disconnect summary
  ansible.builtin.debug:
    msg: >-
      {{
        [
          '==============================================================',
          'Victoria External Disconnect Summary',
          '==============================================================',
          '',
          '[CLUSTER-SIDE ACTIONS]',
          '  No cluster-side changes made.',
          '  Exported certs/details: Preserved at ' ~ victoria_output_dir,
          '',
          '  NOTE: Victoria LoadBalancer services and certificates are still',
          '  available. External systems must be manually disconnected on',
          '  their side (see instructions below).',
          '',
          '[CURRENT EXTERNAL ENDPOINTS]',
          '  vminsert (metrics write): ' ~
            (_vminsert_ip if (_vminsert_available | bool) else 'Not available'),
          '  vmselect (metrics query): ' ~
            (_vmselect_ip if (_vmselect_available | bool) else 'Not available'),
          '  VLAgent (syslog):         ' ~
            (_vlagent_ip if (_vlagent_available | bool) else 'Not available'),
          '',
          '--------------------------------------------------------------',
          '[SFM DISCONNECT — MANUAL STEPS REQUIRED]',
          '--------------------------------------------------------------',
          '  Step 1: SSH to the SFM host with admin credentials',
          '  Step 2: Navigate to: ' ~ sfm_ui_navigation,
          '  Step 3: Set Prometheus Remote Write to: ' ~ sfm_remote_write_disable_value,
          '  Step 4: Remove the remote write target URL',
          '  Step 5: (Optional) Remove /etc/hosts entries inside SFM Prometheus pod:',
          '          kubectl exec -it <sfm-prometheus-pod> -n sfm-1 -- /bin/sh',
          '          sed -i "/vminsert-victoria-cluster/d" /etc/hosts',
          '          sed -i "/vmselect-victoria-cluster/d" /etc/hosts',
          '',
          '--------------------------------------------------------------',
          '[POWERSCALE DISCONNECT — MANUAL STEPS REQUIRED]',
          '--------------------------------------------------------------',
          '  Step 1: SSH to the PowerScale cluster',
          '  Step 2: Disable syslog forwarding:',
          '          isi audit settings modify --syslog-forwarding-enabled=no',
          '  Step 3: Remove syslog servers:',
          '          isi audit settings global modify --config-syslog-enabled=no',
          '          isi audit settings global modify --protocol-syslog-enabled=no',
          '          isi audit settings global modify --system-syslog-enabled=no',
          '  Step 4: Verify: isi audit settings global view',
          '',
          '--------------------------------------------------------------',
          '[TO RECONNECT]',
          '--------------------------------------------------------------',
          '  Run: ansible-playbook playbooks/telemetry.yml --tags external_victoria',
          '  Existing certificates at ' ~ victoria_output_dir ~ ' can be reused.',
          '',
          '=============================================================='
        ]
      }}
  delegate_to: localhost
  connection: local
  run_once: true
