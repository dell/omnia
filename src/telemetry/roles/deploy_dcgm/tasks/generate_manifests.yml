---

# Generate DCGM telemetry Kustomize manifests to NFS deployments/dcgm/

- name: Create DCGM deployments directory
  ansible.builtin.file:
    path: "{{ telemetry_deployments_dir }}/dcgm"
    state: directory
    mode: '0755'

# TODO: Add DCGM manifest templates when available
# - dcgm-exporter-daemonset.yaml.j2
# - dcgm-exporter-service.yaml.j2
# - kustomization.yaml.j2

- name: Display DCGM manifest generation complete
  ansible.builtin.debug:
    msg: "DCGM telemetry manifests directory created at {{ telemetry_deployments_dir }}/dcgm/"
    verbosity: 2
