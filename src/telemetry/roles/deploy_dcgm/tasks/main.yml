# =============================================================================
# deploy_dcgm — Orchestrator
# =============================================================================
# Consolidated role for enabling or disabling DCGM telemetry.
# Auto-determines state from telemetry_config.yml:
#   telemetry_sources.dcgm.metrics_enabled
# =============================================================================

- name: Load telemetry configuration
  ansible.builtin.include_role:
    name: common
    tasks_from: load_telemetry_config
  when: telemetry_config is not defined

- name: Determine DCGM telemetry state from config
  ansible.builtin.set_fact:
    dcgm_enabled: "{{ telemetry_config.telemetry_sources.dcgm.metrics_enabled | default(false) | bool }}"
  when: telemetry_config is defined

- name: Enable DCGM telemetry
  ansible.builtin.include_tasks: enable.yml
  when: dcgm_enabled | default(false) | bool

- name: Disable DCGM telemetry
  ansible.builtin.include_tasks: disable.yml
  when: not (dcgm_enabled | default(false) | bool)
