# =============================================================================
# deploy_dcgm — Disable DCGM telemetry
# =============================================================================
# Scales down DCGM telemetry resources when no telemetry sources
# require DCGM.
#
# This stops DCGM telemetry but preserves PVCs for future re-enablement.
# =============================================================================

- name: Load telemetry configuration
  ansible.builtin.include_role:
    name: common
    tasks_from: load_telemetry_config

- name: Check if DCGM resources exist
  ansible.builtin.command: >
    kubectl get deployment dcgm-exporter -n {{ telemetry_namespace }}
  register: dcgm_check
  changed_when: false
  failed_when: false

- name: Scale down DCGM resources
  ansible.builtin.command: >
    kubectl scale deployment dcgm-exporter
    -n {{ telemetry_namespace }} --replicas=0
  register: scale_down_result
  changed_when: "'scaled' in scale_down_result.stdout"
  when: dcgm_check.rc == 0

- name: Display scale down result
  ansible.builtin.debug:
    msg: "Scaling down DCGM telemetry to 0 replicas"
  when: dcgm_check.rc == 0

- name: DCGM resources not found
  ansible.builtin.debug:
    msg: "DCGM telemetry resources not found, nothing to scale down"
  when: dcgm_check.rc != 0
