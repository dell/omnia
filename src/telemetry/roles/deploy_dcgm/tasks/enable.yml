# Deploy DCGM GPU Telemetry
# Gated by: telemetry_sources.dcgm.metrics_enabled
#
# DATA PIPELINE:
#   NVIDIA DCGM Exporter (DaemonSet on GPU nodes) → vmagent(shared) → victoria_metrics
#
# What Omnia does:
#   - Deploys DCGM Exporter DaemonSet on GPU compute nodes
#   - Configures VMAgent scrape config for DCGM metrics
#   - Generates K8s manifests for DCGM deployment
#
# What Omnia does NOT do:
#   - Omnia does NOT install NVIDIA GPU drivers
#   - Omnia does NOT install CUDA toolkit
#
# Prerequisites:
#   - GPU nodes with NVIDIA drivers installed
#   - Kubernetes cluster with GPU nodes labeled

- name: Set DCGM configuration facts
  ansible.builtin.set_fact:
    _dcgm_config: "{{ telemetry_config.telemetry_sources.dcgm }}"

- name: Display DCGM configuration
  ansible.builtin.debug:
    msg:
      - "DCGM metrics enabled: {{ _dcgm_config.metrics_enabled | default(false) }}"
      - "DCGM collection targets: {{ _dcgm_config.collection_targets | default([]) }}"
    verbosity: 2

# --- Generate DCGM deployment manifests ---

- name: Generate DCGM kustomization manifests
  ansible.builtin.include_tasks: generate_manifests.yml
  when: _dcgm_config.metrics_enabled | default(false) | bool

- name: Display DCGM telemetry integration summary
  ansible.builtin.debug:
    msg: "DCGM telemetry manifests generated. Deployment will occur via kubectl apply -k."
    verbosity: 2
