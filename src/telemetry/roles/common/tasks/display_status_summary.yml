---
# Display telemetry deployment status file location.
# Extracted from telemetry.yml summary play to avoid inline tasks in the entry point.

- name: Display telemetry status file location
  ansible.builtin.debug:
    msg:
      - "======================================================================"
      - "              TELEMETRY DEPLOYMENT STATUS"
      - "======================================================================"
      - ""
      - "Deployment status:"
      - "  {{ output_project_dir | default(omnia_data_path | default('/opt/omnia') + '/telemetry/output/' + (project_name | default('project_default'))) }}/telemetry_status.yml"
      - ""
      - "======================================================================"
