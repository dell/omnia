# =============================================================================
# Common task: Load telemetry configuration files
# =============================================================================
# Loads telemetry_config.yml, telemetry_storage_config.yml, telemetry_packages.yml, and cluster_inventory
# Sets kube_vip (from cluster_inventory specified in telemetry_config.yml), telemetry_registry, and k8s_cluster_mount variables
# Used by: telemetry.yml, deploy_idrac_telemetry, deploy_ldms, deploy_powerscale, and other source playbooks.
# Package downloads are handled by respective roles (deploy_kafka, deploy_victoria)

- name: Check if configs already loaded from localhost
  ansible.builtin.set_fact:
    configs_already_loaded: "{{ (hostvars['localhost']['telemetry_config'] is defined) and (inventory_hostname != 'localhost') }}"

- name: Load configs from localhost hostvars when already cached
  when: configs_already_loaded | bool
  block:
    - name: Use telemetry_config from localhost hostvars
      ansible.builtin.set_fact:
        telemetry_config: "{{ hostvars['localhost']['telemetry_config'] }}"
        telemetry_storage_config: "{{ hostvars['localhost']['telemetry_storage_config'] }}"
        telemetry_packages_config: "{{ hostvars['localhost']['telemetry_packages_config'] }}"
        telemetry_registry: "{{ hostvars['localhost']['telemetry_registry'] }}"
        k8s_cluster_mount: "{{ hostvars['localhost']['k8s_cluster_mount'] | default('/opt/omnia/k8s_mount') }}"
        slurm_cluster_mount: "{{ hostvars['localhost']['slurm_cluster_mount'] | default('/share_omnia') }}"
        kube_vip: "{{ hostvars['localhost']['kube_vip'] | default('') }}"
        cluster_inventory_path: "{{ hostvars['localhost']['cluster_inventory_path'] | default('') }}"

- name: Load configs from files when not cached
  when: not (configs_already_loaded | bool)
  block:
    - name: Get OMNIA_DATA_PATH and OMNIA_PROJECT_NAME from environment
      ansible.builtin.set_fact:
        omnia_data_path: "{{ lookup('env', 'OMNIA_DATA_PATH') | default('', true) }}"
        project_name: "{{ lookup('env', 'OMNIA_PROJECT_NAME') | default('project_default', true) }}"

    - name: Set input and output project directories from environment
      ansible.builtin.set_fact:
        input_project_dir: >-
          {% if omnia_data_path | length > 0 -%}
          {{ omnia_data_path | regex_replace('/$', '') }}/telemetry/input/{{ project_name }}{%- else -%}
          {{ input_project_dir | default('/opt/omnia/telemetry/input/' + project_name) }}{%- endif %}
        output_project_dir: >-
          {% if omnia_data_path | length > 0 -%}
          {{ omnia_data_path | regex_replace('/$', '') }}/telemetry/output/{{ project_name }}{%- else -%}
          {{ output_project_dir | default('/opt/omnia/telemetry/output/' + project_name) }}{%- endif %}
        telemetry_data_path: >-
          {% if omnia_data_path | length > 0 -%}
          {{ omnia_data_path | regex_replace('/$', '') }}/telemetry{%- else -%}
          {{ telemetry_data_path | default('/opt/omnia/telemetry') }}{%- endif %}

    - name: Load telemetry configuration
      ansible.builtin.include_vars:
        file: "{{ telemetry_config_file | default(input_project_dir + '/telemetry_config.yml') }}"
        name: telemetry_config

    - name: Set telemetry_config as cacheable fact
      ansible.builtin.set_fact:
        telemetry_config: "{{ telemetry_config }}"
        cacheable: true

    - name: Resolve cluster inventory path
      ansible.builtin.set_fact:
        _cluster_inv_path: >-
          {% if telemetry_config.cluster_inventory | default('') | length > 0 -%}
          {{ telemetry_config.cluster_inventory }}{%- else -%}
          {{ omnia_data_path | default('/opt/omnia', true) | regex_replace('/$', '') }}/orchestrator/output/{{
            project_name | default('project_default', true)
          }}/orchestrator_inventory.yml{%- endif %}
        cacheable: true

    - name: Notify - cluster_inventory using default path
      block:
        - name: Display warning in yellow
          ansible.builtin.debug:
            msg: "⚠️  cluster_inventory is empty in telemetry_config.yml"
          vars:
            ansible_debug_color: "yellow"

        - name: Display resolved path
          ansible.builtin.debug:
            msg: "Constructing default path: {{ _cluster_inv_path }}"

        - name: Pause for user confirmation
          ansible.builtin.pause:
            seconds: 10
            prompt: "Proceeding in 10 seconds... (Press Ctrl+C to cancel)"
      when: telemetry_config.cluster_inventory | default('') | length == 0

    - name: Expose resolved cluster inventory path for downstream consumers
      ansible.builtin.set_fact:
        cluster_inventory_path: "{{ _cluster_inv_path }}"
        cacheable: true

    - name: Check if cluster inventory file exists (from telemetry_config)
      ansible.builtin.stat:
        path: "{{ _cluster_inv_path }}"
      register: cluster_inv_file_stat
      when: _cluster_inv_path | length > 0

    - name: Load cluster inventory for kube_vip and slurm nodes
      ansible.builtin.include_vars:
        file: "{{ _cluster_inv_path }}"
        name: cluster_inv
      when:
        - _cluster_inv_path | length > 0
        - cluster_inv_file_stat is not skipped
        - cluster_inv_file_stat.stat.exists

    - name: Set kube_vip from cluster inventory (ansible_host or hostname key)
      ansible.builtin.set_fact:
        kube_vip: >-
          {%- set hosts = cluster_inv.all.children.kube_vip_group.hosts -%}
          {%- set first_entry = hosts | dict2items | first -%}
          {%- if first_entry.value.ansible_host is defined -%}
            {{ first_entry.value.ansible_host }}
          {%- else -%}
            {{ first_entry.key }}
          {%- endif -%}
        cacheable: true
      when:
        - cluster_inv is defined
        - cluster_inv.all.children.kube_vip_group.hosts is defined
        - cluster_inv.all.children.kube_vip_group.hosts | length > 0

    - name: Set kube_vip from telemetry_config (fallback)
      ansible.builtin.set_fact:
        kube_vip: "{{ telemetry_config.kube_vip }}"
        cacheable: true
      when:
        - kube_vip is not defined or kube_vip | length == 0
        - telemetry_config.kube_vip is defined

    - name: Load telemetry storage configuration
      ansible.builtin.include_vars:
        file: "{{ telemetry_storage_config_file | default(input_project_dir + '/telemetry_storage_config.yml') }}"
        name: telemetry_storage_config

    - name: Set telemetry_storage_config as cacheable fact
      ansible.builtin.set_fact:
        telemetry_storage_config: "{{ telemetry_storage_config }}"
        cacheable: true

    - name: Load telemetry packages manifest
      ansible.builtin.include_vars:
        file: "{{ input_project_dir + '/telemetry_packages.yml' }}"
        name: _pkg_raw
      register: packages_load_result
      failed_when: false

    - name: Set telemetry_packages as cacheable fact
      ansible.builtin.set_fact:
        telemetry_packages: "{{ _pkg_raw }}"
        cacheable: true
      when: _pkg_raw is defined

    - name: Set k8s_cluster_mount from telemetry_packages.yml
      ansible.builtin.set_fact:
        k8s_cluster_mount: "{{ _pkg_raw.k8s_cluster_mount | default('/opt/omnia/k8s_mount') }}"
      when: _pkg_raw is defined

    - name: Set slurm_cluster_mount from telemetry_packages.yml
      ansible.builtin.set_fact:
        slurm_cluster_mount: "{{ _pkg_raw.slurm_cluster_mount | default('/share_omnia') }}"
      when: _pkg_raw is defined

    # -----------------------------------------------------------------------
    # Resolve repo_url default for offline mode from SYSTEM_ADMIN_NIC_IPV4
    # -----------------------------------------------------------------------
    # When install_mode is offline and repo_url is empty, auto-derive:
    #   https://<SYSTEM_ADMIN_NIC_IPV4>:<pulp_port>/<pulp_base_path>/<pulp_cluster_arch>/<pulp_os_name>/<pulp_os_version>
    # Pulp configuration is customizable via variables in roles/common/vars/main.yml
    - name: Resolve repo_url default for offline mode
      ansible.builtin.set_fact:
        _resolved_repo_url: >-
          {% set mode = _pkg_raw.install_mode | default('offline') -%}
          {% set url = _pkg_raw.repo_url | default('') -%}
          {% if url | length > 0 -%}
          {{ url | regex_replace('/$', '') }}{%- elif mode == 'offline' -%}
          {% set nic_ip = lookup('env', 'SYSTEM_ADMIN_NIC_IPV4') | default(admin_nic_ip | default(''), true) -%}
          {% if nic_ip | length > 0 -%}
          https://{{ nic_ip }}:{{ pulp_port }}/{{ pulp_base_path }}/{{ pulp_cluster_arch }}/{{ pulp_os_name }}/{{ pulp_os_version }}{%- endif -%}
          {%- endif %}
      when: _pkg_raw is defined

    - name: Notify - repo_url using default path
      block:
        - name: Display warning in yellow
          ansible.builtin.debug:
            msg: "⚠️  repo_url is empty in telemetry_packages.yml"
          vars:
            ansible_debug_color: "yellow"

        - name: Display resolved path
          ansible.builtin.debug:
            msg: "Constructing default path from SYSTEM_ADMIN_NIC_IPV4: {{ _resolved_repo_url }}"

        - name: Pause for user confirmation
          ansible.builtin.pause:
            seconds: 10
            prompt: "Proceeding in 10 seconds... (Press Ctrl+C to cancel)"
      when:
        - _pkg_raw is defined
        - (_pkg_raw.repo_url | default('')) | length == 0
        - (_resolved_repo_url | default('')) | string | length > 0

    # -----------------------------------------------------------------------
    # Validate repo_url is set for offline mode
    # -----------------------------------------------------------------------
    # In offline mode, repo_url must be provided either explicitly or
    # auto-derived from SYSTEM_ADMIN_NIC_IPV4. Fail if neither is available.
    - name: Validate repo_url for offline mode
      ansible.builtin.fail:
        msg: |
          repo_url is required for offline mode but not provided.

          Current state:
          - install_mode: {{ _pkg_raw.install_mode | default('offline') }}
          - repo_url in telemetry_packages.yml: "{{ _pkg_raw.repo_url | default('') }}"
          - SYSTEM_ADMIN_NIC_IPV4 environment variable: {{ lookup('env', 'SYSTEM_ADMIN_NIC_IPV4') | default('NOT SET', true) }}
          - admin_nic_ip variable: {{ admin_nic_ip | default('NOT SET') }}

          Solution:
          1. Set SYSTEM_ADMIN_NIC_IPV4 environment variable to the Pulp server IP:
             export SYSTEM_ADMIN_NIC_IPV4=<pulp_server_ip>
             ansible-playbook telemetry.yml --tags execute

          2. OR explicitly set repo_url in telemetry_packages.yml:
             install_mode: "offline"
             repo_url: "https://<pulp_server_ip>:2225/pulp/content/offline_repo/cluster/x86_64/rhel/10.0"

          3. OR set admin_nic_ip in roles/common/vars/main.yml:
             admin_nic_ip: "<pulp_server_ip>"
      when:
        - _pkg_raw is defined
        - (_pkg_raw.install_mode | default('offline')) == 'offline'
        - (_resolved_repo_url | default('')) | length == 0

    # -----------------------------------------------------------------------
    # Resolve telemetry_packages URLs from repo_url + package catalog
    # -----------------------------------------------------------------------
    # The new telemetry_packages.yml provides repo_url (Pulp base) and a
    # structured catalog (helm_charts, git_repos, pip_modules).  We resolve
    # these into the flat URL variables that downstream roles expect.
    - name: Resolve package URLs from repo_url and catalog
      vars:
        _mode: "{{ _pkg_raw.install_mode | default('offline') }}"
        _base: "{{ _resolved_repo_url | default(_pkg_raw.repo_url | default('')) }}"
        _hc: "{{ _pkg_raw.helm_charts | default({}) }}"
        _gr: "{{ _pkg_raw.git_repos | default({}) }}"
      ansible.builtin.set_fact:
        telemetry_packages_config:
          install_mode: "{{ _mode }}"
          repo_url: "{{ _base }}"
          k8s_cluster_mount: "{{ _pkg_raw.k8s_cluster_mount | default('/opt/omnia/k8s_mount') }}"
          slurm_cluster_mount: "{{ _pkg_raw.slurm_cluster_mount | default('/share_omnia') }}"
          images: "{{ _pkg_raw.images | default({}) }}"
          container_registry: "{{ _pkg_raw.container_registry | default('') }}"
          helm_charts: "{{ _hc }}"
          git_repos: "{{ _gr }}"
          pip_modules: "{{ _pkg_raw.pip_modules | default({}) }}"
          telemetry_packages:
            strimzi_kafka_operator: >-
              {% if _mode == 'online' -%}
              {{ _hc.strimzi_kafka_operator.online_url | default('') }}{%- else -%}
              {{ _base }}/tarball/{{
              _hc.strimzi_kafka_operator.package | default('') }}/{{
              _hc.strimzi_kafka_operator.filename | default('') }}{%- endif %}
            victoria_metrics_operator: >-
              {% if _mode == 'online' -%}
              {{ _hc.victoria_metrics_operator.online_url | default('') }}{%- else -%}
              {{ _base }}/tarball/{{
              _hc.victoria_metrics_operator.package | default('') }}/{{
              _hc.victoria_metrics_operator.filename | default('') }}{%- endif %}
            cert_manager_tarball: >-
              {% if _mode == 'online' -%}
              {{ _hc.cert_manager.online_url | default('') }}{%- else -%}
              {{ _base }}/tarball/{{
              _hc.cert_manager.package | default('') }}/{{
              _hc.cert_manager.filename | default('') }}{%- endif %}
            karavi_observability_git: >-
              {% if _mode == 'online' -%}
              {{ _gr.karavi_observability.online_url | default('') }}{%- else -%}
              {{ _base }}/git/{{
              _gr.karavi_observability.package | default('') }}/{{
              _gr.karavi_observability.filename | default('') }}{%- endif %}
            karavi_helm_charts_git: >-
              {% if _mode == 'online' -%}
              {{ _gr.helm_charts.online_url | default('') }}{%- else -%}
              {{ _base }}/git/{{
              _gr.helm_charts.package | default('') }}/{{
              _gr.helm_charts.filename | default('') }}{%- endif %}
            offline_tarball_path: "{{ _base }}/tarball"
            offline_pip_module_path: "{{ _base }}/pip_module"
            offline_git_path: "{{ _base }}/git"
        cacheable: true

    # -----------------------------------------------------------------------
    # Build backward-compatible telemetry_registry from images catalog
    # -----------------------------------------------------------------------
    # Downstream roles reference telemetry_registry.images.victoria.*,
    # telemetry_registry.images.kafka.*, etc. Map the new flat catalog
    # to the expected nested structure.
    - name: Build telemetry_registry from package manifest
      vars:
        _images: "{{ _pkg_raw.images | default({}) }}"
        _reg: "{{ _pkg_raw.container_registry | default('') }}"
        # Merge VM + VL images into one dict (downstream expects all under .victoria)
        _all_victoria: "{{ (_images.victoria_metrics | default({})) | combine(_images.victoria_logs | default({})) }}"
      ansible.builtin.set_fact:
        telemetry_registry:
          host: "{{ _reg }}"
          images:
            victoria: "{{ _all_victoria }}"
            kafka: "{{ _images.kafka | default({}) }}"
            victoria_operator:
              operator: "{{ (_images.victoria_metrics | default({})).operator | default('') }}"
            idrac: "{{ _images.idrac | default({}) }}"
            powerscale: "{{ _images.powerscale | default({}) }}"
            ldms: "{{ _images.ldms | default({}) }}"
            vector: "{{ _images.vector | default({}) }}"
            support: "{{ _images.support | default({}) }}"
        slurm_cluster_mount: "{{ _pkg_raw.slurm_cluster_mount | default('/share_omnia') }}"
        cacheable: true
