# =============================================================================
# Common task: Load telemetry configuration files
# =============================================================================
# Loads telemetry_config.yml and telemetry_storage_config.yml
# Used by: enable_idrac_telemetry, enable_ldms, enable_powerscale, etc.

- name: Load telemetry configuration
  ansible.builtin.include_vars:
    file: "{{ telemetry_config_file }}"
    name: telemetry_config

- name: Load telemetry storage configuration
  ansible.builtin.include_vars:
    file: "{{ telemetry_storage_config_file }}"
    name: telemetry_storage_config
  failed_when: false
