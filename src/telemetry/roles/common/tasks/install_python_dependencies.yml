# =============================================================================
# Install Python Dependencies for Telemetry
# =============================================================================
# Generic task to install Python packages for telemetry components
# Supports both online and offline installation modes based on telemetry_packages.yml
#
# Usage:
#   - include_tasks: install_python_dependencies.yml
#     vars:
#       component: idrac
#
# Installation modes:
#   - online:  Install from PyPI (pip install <package>==<version>)
#   - offline: Install from Pulp repo (pip install --index-url <repo_url>/pip_module/ <package>==<version>)
#
# Parameters:
#   component: Component name to look up in telemetry_packages.yml (required)
#   telemetry_packages_file: Path to telemetry_packages.yml (default: from common vars)
# =============================================================================

- name: Validate component is provided
  ansible.builtin.assert:
    that:
      - component is defined
      - component | length > 0
    fail_msg: "component variable must be provided (e.g., idrac, powerscale)"

- name: Load telemetry_packages.yml to get install_mode, repo_url, and pip_modules
  ansible.builtin.include_vars:
    file: "{{ telemetry_packages_file | default(telemetry_packages_file_path) }}"
    name: telemetry_packages
  when: telemetry_packages is not defined

- name: Set installation mode variables
  ansible.builtin.set_fact:
    install_mode: "{{ telemetry_packages.install_mode | default('offline') }}"
    repo_url: "{{ telemetry_packages.repo_url | default('') }}"
    pip_modules: "{{ telemetry_packages.pip_modules | default({}) }}"

- name: Validate repo_url is set for offline mode
  ansible.builtin.assert:
    that:
      - repo_url | length > 0
    fail_msg: "repo_url must be set in telemetry_packages.yml when install_mode is 'offline'"
  when: install_mode == "offline"

- name: Build pip index URL from repo_url
  ansible.builtin.set_fact:
    pip_index_url: "{{ repo_url }}/pip_module/"
  when: install_mode == "offline"

- name: Get packages for component from telemetry_packages.yml
  ansible.builtin.set_fact:
    component_packages: "{{ pip_modules[component] | default({}) }}"

- name: Validate component exists in pip_modules
  ansible.builtin.assert:
    that:
      - component_packages | length > 0
    fail_msg: "Component '{{ component }}' not found in telemetry_packages.yml pip_modules section"

- name: Install Python packages for {{ component }}
  loop: "{{ component_packages | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  block:
    - name: Check if {{ item.key }} module is installed
      ansible.builtin.command: python3 -c "import {{ item.key }}"
      register: module_check
      failed_when: false
      changed_when: false
      delegate_to: "{{ inventory_hostname }}"

    - name: Install {{ item.key }} module
      when: module_check.rc != 0
      block:
        - name: Log Python dependency installation
          ansible.builtin.debug:
            msg: "Installing Python {{ item.key }} module for {{ component }} - Mode: {{ install_mode }}"

        - name: Install {{ item.key }} in online mode (from PyPI)
          when: install_mode == "online"
          block:
            - name: Install {{ item.key }} from PyPI
              ansible.builtin.command: >
                python3 -m pip install {{ item.key }}=={{ item.value }}
              register: pip_install_online
              delegate_to: "{{ inventory_hostname }}"

            - name: Fail if online installation failed
              ansible.builtin.fail:
                msg: "Failed to install {{ item.key }} module from PyPI. Check internet connectivity."
              when: pip_install_online.rc != 0

        - name: Install {{ item.key }} in offline mode (from Pulp repo)
          when: install_mode == "offline"
          block:
            - name: Install {{ item.key }} from Pulp repo
              ansible.builtin.command: >
                python3 -m pip install --index-url {{ pip_index_url }}
                {{ item.key }}=={{ item.value }}
              register: pip_install_offline
              delegate_to: "{{ inventory_hostname }}"

            - name: Fail if offline installation failed
              ansible.builtin.fail:
                msg: "Failed to install {{ item.key }}=={{ item.value }} from {{ pip_index_url }}. Check Pulp repo availability."
              when: pip_install_offline.rc != 0

    - name: Verify {{ item.key }} module is now available
      ansible.builtin.command: python3 -c "import {{ item.key }}; print({{ item.key }}.__version__)"
      register: module_verify
      changed_when: false
      delegate_to: "{{ inventory_hostname }}"

    - name: Log successful installation
      ansible.builtin.debug:
        msg: "Python {{ item.key }} module version {{ module_verify.stdout }} is available (installed via {{ install_mode }} mode)"
