# =============================================================================
# Install Python Dependencies for Telemetry
# =============================================================================
# Installs required Python packages for telemetry custom Ansible modules
# Respects install_mode from telemetry_packages.yml:
#   - offline: Install from local packages directory (repo_url based)
#   - online:  Install from PyPI via pip
#
# Required for:
#   - idrac_telemetry: kubernetes, pyyaml
#   - Custom modules that interact with K8s API
# =============================================================================

- name: Load telemetry packages config for install_mode
  ansible.builtin.include_role:
    name: common
    tasks_from: load_telemetry_config
  when: telemetry_packages_config is not defined

- name: Set install mode from telemetry_packages_config
  ansible.builtin.set_fact:
    _install_mode: "{{ telemetry_packages_config.install_mode | default('offline') }}"
    _repo_url: "{{ telemetry_packages_config.repo_url | default('') }}"
    _pip_modules: "{{ telemetry_packages_config.pip_modules | default({}) }}"

- name: Log install mode
  ansible.builtin.debug:
    msg: "Python dependency install mode: {{ _install_mode }}"
    verbosity: 1

- name: Check if Python kubernetes module is installed
  ansible.builtin.command: python3 -c "import kubernetes"
  register: kubernetes_check
  failed_when: false
  changed_when: false
  delegate_to: "{{ inventory_hostname }}"

- name: Install Python kubernetes module
  when: kubernetes_check.rc != 0
  block:
    - name: Log Python dependency installation
      ansible.builtin.debug:
        msg: "Installing Python kubernetes module (required for iDRAC telemetry MySQL operations) - mode: {{ _install_mode }}"

    # =========================================================================
    # OFFLINE MODE: Install from local packages directory
    # =========================================================================
    - name: Install kubernetes from offline packages (offline mode)
      when: _install_mode == 'offline'
      block:
        - name: Resolve offline pip module URL
          ansible.builtin.set_fact:
            _offline_pip_url: >-
              {{ _repo_url }}/pip_module/kubernetes=={{
              _pip_modules.kubernetes.version | default('33.1.0') }}/

        - name: Log offline pip URL
          ansible.builtin.debug:
            msg: "Offline pip URL: {{ _offline_pip_url }}"

        - name: Check if offline Python packages are accessible via URL
          ansible.builtin.uri:
            url: "{{ _offline_pip_url }}"
            method: HEAD
            validate_certs: false
            status_code: [200, 301, 302]
          register: offline_url_check
          failed_when: false
          delegate_to: "{{ inventory_hostname }}"
          when: _repo_url | length > 0

        - name: Install kubernetes from offline URL
          ansible.builtin.command: >
            python3 -m pip install --no-index
            --trusted-host {{ _repo_url | urlsplit('hostname') }}
            --find-links={{ _offline_pip_url }}
            kubernetes=={{ _pip_modules.kubernetes.version | default('33.1.0') }}
          register: pip_install_offline_url
          failed_when: false
          changed_when: pip_install_offline_url.rc == 0
          delegate_to: "{{ inventory_hostname }}"
          when:
            - _repo_url | length > 0
            - offline_url_check is not skipped
            - offline_url_check.status | default(0) in [200, 301, 302]

        - name: Check if local offline Python packages directory exists
          ansible.builtin.stat:
            path: "{{ offline_python_packages_dir }}"
          register: offline_dir_stat
          delegate_to: "{{ inventory_hostname }}"
          when: pip_install_offline_url is skipped or pip_install_offline_url.rc | default(1) != 0

        - name: Install kubernetes from local offline packages directory
          ansible.builtin.command: >
            python3 -m pip install --no-index
            --find-links={{ offline_python_packages_dir }}
            kubernetes
          when:
            - pip_install_offline_url is skipped or pip_install_offline_url.rc | default(1) != 0
            - offline_dir_stat.stat.exists | default(false)
          register: pip_install_offline_local
          failed_when: false
          changed_when: pip_install_offline_local.rc == 0
          delegate_to: "{{ inventory_hostname }}"

        - name: Set offline install result
          ansible.builtin.set_fact:
            _offline_install_success: >-
              {{ (pip_install_offline_url.rc | default(1) == 0) or
                 (pip_install_offline_local.rc | default(1) == 0) }}

        - name: Fail if offline installation failed
          ansible.builtin.fail:
            msg: |
              Failed to install Python kubernetes module in OFFLINE mode.

              Attempted:
              1. Offline URL: {{ _offline_pip_url }}
                 Status: {{ 'accessible' if (offline_url_check.status | default(0) in [200, 301, 302]) else 'not accessible' }}
                 Install result: {{ pip_install_offline_url.rc | default('skipped') }}

              2. Local directory: {{ offline_python_packages_dir }}
                 Exists: {{ offline_dir_stat.stat.exists | default(false) }}
                 Install result: {{ pip_install_offline_local.rc | default('skipped') }}

              To fix:
              1. Verify repo_url in telemetry_packages.yml is correct and accessible
              2. Ensure packages are available at: {{ _offline_pip_url }}
              3. Or download packages locally: pip3 download kubernetes -d {{ offline_python_packages_dir }}/
          when: not (_offline_install_success | bool)

    # =========================================================================
    # ONLINE MODE: Install from PyPI
    # =========================================================================
    - name: Install kubernetes from pip (online mode)
      ansible.builtin.command: >
        python3 -m pip install kubernetes=={{ _pip_modules.kubernetes.version | default('33.1.0') }}
      register: pip_install_online
      failed_when: false
      changed_when: pip_install_online.rc == 0
      delegate_to: "{{ inventory_hostname }}"
      when: _install_mode == 'online'

    - name: Fail if online installation failed
      ansible.builtin.fail:
        msg: |
          Failed to install Python kubernetes module in ONLINE mode.

          Error: {{ pip_install_online.stderr | default('Unknown error') }}

          To fix:
          1. Ensure internet connectivity on the target host
          2. Verify pip is working: python3 -m pip --version
          3. Or switch to offline mode in telemetry_packages.yml
      when:
        - _install_mode == 'online'
        - pip_install_online.rc | default(1) != 0

- name: Verify Python kubernetes module is now available
  ansible.builtin.command: python3 -c "import kubernetes; print(kubernetes.__version__)"
  register: kubernetes_verify
  changed_when: false
  delegate_to: "{{ inventory_hostname }}"

- name: Log successful installation
  ansible.builtin.debug:
    msg: "Python kubernetes module version {{ kubernetes_verify.stdout }} is available"
