# =============================================================================
# Install Python Dependencies for Telemetry
# =============================================================================
# Generic task to install Python packages for telemetry components
# Supports both online and offline installation modes based on telemetry_packages.yml
#
# Usage:
#   - include_tasks: install_python_dependencies.yml
#     vars:
#       component: idrac
#
# Installation modes:
#   - online:  Install from PyPI (pip install <package>==<version>)
#   - offline: Install from Pulp repo (pip install --index-url <repo_url>/pip_module/ <package>==<version>)
#
# Parameters:
#   component: Component name to look up in telemetry_packages.yml (required)
# =============================================================================

- name: Validate component is provided
  ansible.builtin.assert:
    that:
      - component is defined
      - component | length > 0
    fail_msg: "component variable must be provided (e.g., idrac, powerscale)"

- name: Use telemetry_packages fact loaded by load_telemetry_config
  ansible.builtin.set_fact:
    _telemetry_packages_raw: "{{ telemetry_packages }}"
  when:
    - telemetry_packages is defined

- name: Use telemetry_packages from localhost if not defined locally
  ansible.builtin.set_fact:
    _telemetry_packages_raw: "{{ hostvars['localhost']['telemetry_packages'] }}"
  when:
    - _telemetry_packages_raw is not defined
    - hostvars['localhost']['telemetry_packages'] is defined

- name: Fail if telemetry_packages is not available
  ansible.builtin.fail:
    msg: "telemetry_packages is not defined. Ensure load_telemetry_config task has been run before install_python_dependencies."
  when: _telemetry_packages_raw is not defined

- name: Set installation mode variables from loaded telemetry_packages
  ansible.builtin.set_fact:
    install_mode: "{{ _telemetry_packages_raw.install_mode | default('offline') }}"
    repo_url: "{{ _telemetry_packages_raw.repo_url | default('') }}"
    pip_modules: "{{ _telemetry_packages_raw.pip_modules | default({}) }}"

- name: Validate repo_url is set for offline mode
  ansible.builtin.assert:
    that:
      - repo_url | length > 0
    fail_msg: "repo_url must be set in telemetry_packages.yml when install_mode is 'offline'"
  when: install_mode == "offline"

- name: Build pip index URL from repo_url
  ansible.builtin.set_fact:
    pip_index_url: "{{ repo_url }}/pip_module/"
  when: install_mode == "offline"

- name: Get packages for component from telemetry_packages.yml
  ansible.builtin.set_fact:
    component_packages: "{{ pip_modules[component] | default({}) }}"

- name: Validate component exists in pip_modules
  ansible.builtin.assert:
    that:
      - component_packages | length > 0
    fail_msg: "Component '{{ component }}' not found in telemetry_packages.yml pip_modules section"

- name: Install Python packages for component
  loop: "{{ component_packages | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  ansible.builtin.include_tasks: install_single_python_package.yml
  vars:
    package_name: "{{ item.key }}"
    package_version: "{{ item.value }}"
    component_name: "{{ component }}"
