# =============================================================================
# Common task: Propagate telemetry credentials from localhost
# =============================================================================
# telemetry_credentials is collected once on localhost (collect_telemetry_credentials
# role) and is not a cacheable fact, so every other host that needs it (kube_vip,
# Slurm control/compute nodes, etc.) must copy it from hostvars['localhost']
# into its own local variable. This is independent of load_telemetry_config
# (which may be skipped once telemetry_config is already cached on a host), so
# it is kept as its own step and must be included on every play/host that
# needs telemetry_credentials, for both enable and disable flows.
# Used by: deploy_ldms (Play 1 and Play 2), and other source playbooks.
# =============================================================================

- name: Set telemetry credentials from localhost
  ansible.builtin.set_fact:
    telemetry_credentials: "{{ hostvars['localhost']['telemetry_credentials'] }}"
  no_log: true
  when: hostvars['localhost']['telemetry_credentials'] is defined
