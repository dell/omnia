# =============================================================================
# Generate root kustomization.yaml for the telemetry deployments directory
# =============================================================================
# Renders common/templates/kustomization.yaml.j2 → NFS deployments/kustomization.yaml
# Conditionally includes only the components enabled in telemetry_config.yml.
#
# Called by: telemetry.yml (Play 2, after all component manifests are generated)
# Required vars (set by derive_sink_support_flags.yml + load_telemetry_config.yml):
#   - telemetry_config
#   - kafka_support
#   - victoria_metrics_support
#   - victoria_logs_support
# =============================================================================

- name: Ensure deployments directory exists
  ansible.builtin.file:
    path: "{{ telemetry_deployments_dir }}"
    state: directory
    mode: "0755"

- name: Render root kustomization.yaml
  ansible.builtin.template:
    src: "{{ role_path }}/templates/kustomization.yaml.j2"
    dest: "{{ telemetry_deployments_dir }}/kustomization.yaml"
    mode: "0644"
  vars:
    kafka_support: "{{ hostvars['localhost']['kafka_support'] | default(false) | bool }}"
    victoria_metrics_support: "{{ hostvars['localhost']['victoria_metrics_support'] | default(false) | bool }}"
    victoria_logs_support: "{{ hostvars['localhost']['victoria_logs_support'] | default(false) | bool }}"
    victoria_cluster: "{{ hostvars['localhost']['victoria_cluster'] | default({}) }}"
    victoria_deployment_mode: "{{ hostvars['localhost']['victoria_deployment_mode'] | default('cluster') }}"
    powerscale_volume_health_enabled: "{{ hostvars['localhost']['powerscale_volume_health_enabled'] | default(false) | bool }}"
    ldms_support: "{{ hostvars['localhost']['ldms_support'] | default(false) | bool }}"
    telemetry_config: "{{ hostvars['localhost']['telemetry_config'] }}"

- name: Display generated kustomization
  ansible.builtin.debug:
    msg: >
      Root kustomization.yaml generated at {{ telemetry_deployments_dir }}/kustomization.yaml.
      Full-stack deploy: kubectl apply -k {{ telemetry_deployments_dir }}/
      iDRAC-only deploy: kubectl apply -k {{ telemetry_deployments_dir }}/idrac/
