# =============================================================================
# Common variables shared across all telemetry playbooks and roles
# =============================================================================

# Namespace
telemetry_namespace: "telemetry"

# Deploy directory on NFS share (where manifests are staged)
telemetry_deploy_dir: "{{ k8s_client_share_path | default('/opt/omnia/nfs') }}/telemetry"
telemetry_deployments_dir: "{{ telemetry_deploy_dir }}/deployments"

# Input files (project directory based)
telemetry_config_file: "{{ input_project_dir | default('/opt/omnia/input/project_default') }}/telemetry/telemetry_config.yml"
telemetry_storage_config_file: "{{ input_project_dir | default('/opt/omnia/input/project_default') }}/telemetry/telemetry_storage_config.yml"

# Verification timeouts (shared defaults)
deploy_timeout: "600s"
verify_timeout: "300s"
