---

# =============================================================================
# deploy_vast — Disable VAST telemetry
# =============================================================================

- name: Load telemetry configuration
  ansible.builtin.include_role:
    name: common
    tasks_from: load_telemetry_config

- name: Check if VAST resources exist
  ansible.builtin.command: >
    kubectl get deployment vector-vast -n {{ telemetry_namespace }}
  register: vast_check
  changed_when: false
  failed_when: false

- name: Scale down VAST resources
  ansible.builtin.command: >
    kubectl scale deployment vector-vast
    -n {{ telemetry_namespace }} --replicas=0
  register: scale_down_result
  changed_when: "'scaled' in scale_down_result.stdout"
  when: vast_check.rc == 0

- name: Display scale down result
  ansible.builtin.debug:
    msg: "Scaling down VAST telemetry to 0 replicas"
  when: vast_check.rc == 0

- name: VAST resources not found
  ansible.builtin.debug:
    msg: "VAST telemetry resources not found, nothing to scale down"
  when: vast_check.rc != 0
