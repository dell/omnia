---

# Generate VAST telemetry Kustomize manifests to NFS deployments/vast/
# VAST telemetry resources:
# - vast-telemetry-secret.yaml (K8s Secret with VAST credentials + optional CA cert)
# - vast-external-service.yaml (ExternalName/Endpoints service for VAST endpoint)

- name: Render VAST telemetry manifests
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ telemetry_deployments_dir }}/{{ item.dest }}"
    mode: '0644'
  loop:
    - src: "vast-telemetry-secret.yaml.j2"
      dest: "vast-telemetry-secret.yaml"
    - src: "vast-external-service.yaml.j2"
      dest: "vast-external-service.yaml"

- name: Apply VAST telemetry manifests
  ansible.builtin.command: >
    kubectl apply -f {{ telemetry_deployments_dir }}/{{ item }}
  loop:
    - vast-telemetry-secret.yaml
    - vast-external-service.yaml
  changed_when: false

- name: Display VAST manifest generation complete
  ansible.builtin.debug:
    msg: "VAST telemetry manifests generated and applied"
    verbosity: 2
