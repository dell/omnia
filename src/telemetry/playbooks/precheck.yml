# =============================================================================
# Telemetry Precheck Playbook
# =============================================================================
# Validates all environment prerequisites before telemetry deployment.
#
# Usage (standalone):
#   ansible-playbook playbooks/precheck.yml
#
# Usage (via orchestrator with tag):
#   ansible-playbook telemetry.yml --tags precheck
#
# Checks performed:
#   [localhost]
#     1. kube_vip is defined and set in cluster_inventory (specified in telemetry_config.yml)
#     2. kube_vip is a valid IPv4 address format
#     3. kube_vip is reachable via ICMP ping
#     4. kube_vip SSH (port 22) is reachable
#   [kube_vip]
#     5. kubectl is available and K8s API server is accessible
#     6. All control plane nodes are in Ready state (fail if any are not Ready)
#     7. Worker node minimum readiness threshold met:
#          1 worker  → 1 Ready required
#          2 workers → 2 Ready required
#          3+ workers → at least 2 Ready required
#     8. All pods (outside telemetry namespace) are Running or Succeeded
#     9. [Conditional] isilon namespace exists and all its pods are Running
#          — only when powerscale.metrics_enabled or powerscale.logs_enabled = true
#    10. [Conditional] LDMS Slurm cluster validation:
#          - At least 1 slurm_control_node and 1 slurm_node in cluster inventory
#          - slurmctld running on all slurm_control_node hosts
#          - slurmd running on all slurm_node hosts
#          — only when ldms.metrics_enabled = true
# =============================================================================

# ---------------------------------------------------------------------------
# Play 1 — localhost: Load config, validate kube_vip, add to inventory
# ---------------------------------------------------------------------------
- name: "Telemetry Precheck | Load config and validate kube_vip"
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Load telemetry configuration
      ansible.builtin.include_role:
        name: common
        tasks_from: load_telemetry_config

    - name: Derive sink support flags
      ansible.builtin.include_role:
        name: common
        tasks_from: derive_sink_support_flags

    - name: Validate kube_vip input and reachability
      ansible.builtin.include_role:
        name: precheck
        tasks_from: validate_kube_vip

    - name: Add kube_vip to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ kube_vip }}"
        groups: kube_vip_group
        ansible_user: root

# ---------------------------------------------------------------------------
# Play 2 — kube_vip: K8s cluster health checks
# ---------------------------------------------------------------------------
- name: "Telemetry Precheck | Validate K8s cluster health on kube_vip"
  hosts: kube_vip_group
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Check K8s control plane nodes are all Ready
      ansible.builtin.include_role:
        name: precheck
        tasks_from: check_control_plane

    - name: Check worker nodes meet minimum readiness threshold
      ansible.builtin.include_role:
        name: precheck
        tasks_from: check_worker_nodes

    - name: Check all pod health (excluding telemetry namespace)
      ansible.builtin.include_role:
        name: precheck
        tasks_from: check_pods_health

    - name: Check PowerScale (isilon) namespace pods are Running
      ansible.builtin.include_role:
        name: precheck
        tasks_from: check_powerscale_namespace
      when: >-
        (hostvars['localhost']['telemetry_config'].telemetry_sources.powerscale.metrics_enabled | default(false) | bool) or
        (hostvars['localhost']['telemetry_config'].telemetry_sources.powerscale.logs_enabled | default(false) | bool)

    - name: Check LDMS Slurm cluster nodes and services
      ansible.builtin.include_role:
        name: precheck
        tasks_from: check_ldms_slurm_nodes
      when: >-
        (hostvars['localhost']['telemetry_config'].telemetry_sources.ldms.metrics_enabled | default(false) | bool)

    - name: Precheck complete — cluster is ready for telemetry deployment
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════════════════════"
          - "  Telemetry Precheck — ALL CHECKS PASSED"
          - "════════════════════════════════════════════════════════════"
          - "  kube_vip         : {{ hostvars['localhost']['kube_vip'] }}"
          - "  Control plane    : ✓  All nodes Ready"
          - "  Worker nodes     : ✓  Minimum threshold met"
          - "  Pod health       : ✓  All pods Running/Succeeded"
          - "  Cluster is ready for telemetry deployment."
          - "════════════════════════════════════════════════════════════"
