---
# get_telemetry_credentials.yml — Standalone credential flow for telemetry.
# Can be used independently of the central credential_utility.
#
# Naming Convention:
#   Playbook: get_telemetry_credentials.yml   (verb — user action: "get credentials")
#   Role:     collect_telemetry_credentials    (verb — what the role does: collect/prompt/encrypt)
#   Data:     telemetry_credentials.yml  (noun — the output artifact)
#
# Usage:
#   cd src/telemetry
#   ansible-playbook credentials/get_telemetry_credentials.yml
#
# Or with custom data path:
#   OMNIA_DATA_PATH=/opt/omnia OMNIA_PROJECT_NAME=prod ansible-playbook credentials/get_telemetry_credentials.yml
#
# This playbook:
#   1. Sets the runtime data path and project name from environment variables
#   2. Loads telemetry_config.yml from runtime location:
#      {OMNIA_DATA_PATH}/telemetry/input/{OMNIA_PROJECT_NAME}/telemetry_config.yml
#   3. Validates, creates, and prompts for telemetry credentials
#   4. Credentials are stored encrypted at:
#      {OMNIA_DATA_PATH}/telemetry/input/{OMNIA_PROJECT_NAME}/telemetry_credentials.yml

- name: Telemetry credential management
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Set Omnia data path and project name
      ansible.builtin.set_fact:
        omnia_data_path: "{{ lookup('env', 'OMNIA_DATA_PATH') | default('/opt/omnia') }}"
        omnia_project_name: "{{ lookup('env', 'OMNIA_PROJECT_NAME') | default('project_default') }}"

    - name: Set input project directory
      ansible.builtin.set_fact:
        input_project_dir: "{{ omnia_data_path }}/telemetry/input/{{ omnia_project_name }}"

    - name: Load telemetry_config.yml for conditional credentials
      ansible.builtin.include_vars:
        file: "{{ input_project_dir }}/telemetry_config.yml"
      failed_when: false

    - name: Run collect_telemetry_credentials role
      ansible.builtin.include_role:
        name: collect_telemetry_credentials
