# Enable iDRAC Telemetry
# Usage: Called from telemetry.yml or standalone with kube_vip
#   ansible-playbook telemetry.yml -e kube_vip=<VIP_IP> --tags deploy_idrac_telemetry
#
# Deploys shared infrastructure (Kafka, VictoriaMetrics) if not present,
# then deploys iDRAC telemetry components (receiver, kafkapump, victoriapump).
# All K8s tasks execute on the kube_vip host.

- name: Deploy iDRAC Telemetry
  hosts: kube_vip_group
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - ../../../roles/common/vars/main.yml
  pre_tasks:
    - name: Load telemetry config (only if not already loaded)
      ansible.builtin.include_role:
        name: common
        tasks_from: load_telemetry_config
      when: telemetry_config is not defined

    - name: Derive sink support flags (only if not already derived)
      ansible.builtin.include_role:
        name: common
        tasks_from: derive_sink_support_flags
      when: kafka_support is not defined

    - name: Add kube_vip to inventory (only if not already added)
      ansible.builtin.add_host:
        name: "{{ kube_vip }}"
        groups: kube_vip_group
        ansible_user: root
      when: kube_vip_group is not defined

    - name: Check if cluster inventory is available from load_telemetry_config
      ansible.builtin.set_fact:
        cluster_inv_available: "{{ hostvars['localhost']['cluster_inv'] is defined }}"

    - name: Load cluster inventory for worker node delegation
      when: cluster_inv_available | bool
      block:
        - name: Add K8s worker nodes to in-memory inventory
          ansible.builtin.add_host:
            name: "{{ item.value.ansible_host | default(item.key) }}"
            groups: service_kube_node
            ansible_user: root
          loop: "{{ hostvars['localhost']['cluster_inv'].all.children.service_kube_node_x86_64.hosts | default({}) | dict2items }}"
          loop_control:
            label: "{{ item.key }}"
          when: hostvars['localhost']['cluster_inv'].all.children.service_kube_node_x86_64.hosts is defined
  tasks:
    - name: Set telemetry credentials from localhost
      ansible.builtin.set_fact:
        telemetry_credentials: "{{ hostvars['localhost']['telemetry_credentials'] }}"
      no_log: true
      when: hostvars['localhost']['telemetry_credentials'] is defined

    - name: Check if Kafka is needed for iDRAC telemetry
      ansible.builtin.set_fact:
        kafka_needed: "{{ 'kafka' in (telemetry_config.telemetry_sources.idrac.collection_targets | default([])) }}"
      when: telemetry_config is defined

    - name: Deploy Kafka if needed and not already deployed
      ansible.builtin.include_role:
        name: deploy_kafka
      when:
        - kafka_needed | default(false) | bool
        - hostvars['localhost']['kafka_support'] | default(false) | bool

    - name: Check if VictoriaMetrics is needed for iDRAC telemetry
      ansible.builtin.set_fact:
        victoria_metrics_needed: "{{ 'victoria_metrics' in (telemetry_config.telemetry_sources.idrac.collection_targets | default([])) }}"
      when: telemetry_config is defined

    - name: Set victoria_cluster variables
      ansible.builtin.set_fact:
        victoria_deployment_mode: "cluster"
      when:
        - victoria_metrics_needed | default(false) | bool
        - hostvars['localhost']['victoria_metrics_support'] | default(false) | bool

    - name: Deploy VictoriaMetrics if needed and not already deployed
      ansible.builtin.include_role:
        name: deploy_victoria
      when:
        - victoria_metrics_needed | default(false) | bool
        - hostvars['localhost']['victoria_metrics_support'] | default(false) | bool

    - name: Include deploy_idrac_telemetry role
      ansible.builtin.include_role:
        name: deploy_idrac_telemetry
