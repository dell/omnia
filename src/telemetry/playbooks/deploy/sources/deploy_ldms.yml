# Enable LDMS Telemetry
# Usage: Called from telemetry.yml or standalone with kube_vip
#   ansible-playbook telemetry.yml -e kube_vip=<VIP_IP> --tags deploy_ldms
#
# Deploys shared infrastructure (Kafka, VictoriaMetrics) if not present,
# then configures LDMS sampler/aggregator and deploys the Vector-LDMS bridge
# (Kafka-to-VictoriaMetrics ingestion pipeline).
# All K8s tasks execute on the kube_vip host.

- name: Deploy LDMS Telemetry
  hosts: kube_vip_group
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - ../../../roles/common/vars/main.yml
  pre_tasks:
    - name: Load telemetry config (only if not already loaded)
      ansible.builtin.include_role:
        name: common
        tasks_from: load_telemetry_config
      when: telemetry_config is not defined

    - name: Derive sink support flags (only if not already derived)
      ansible.builtin.include_role:
        name: common
        tasks_from: derive_sink_support_flags
      when: kafka_support is not defined

    - name: Add kube_vip to inventory (only if not already added)
      ansible.builtin.add_host:
        name: "{{ kube_vip }}"
        groups: kube_vip_group
        ansible_user: root
      when: kube_vip_group is not defined

    - name: Set slurm inventory file from cluster_inventory in telemetry_config
      ansible.builtin.set_fact:
        slurm_inventory_file: "{{ hostvars['localhost']['telemetry_config'].cluster_inventory | default('') }}"
      when: slurm_inventory_file is not defined

    - name: Check if slurm inventory file exists
      ansible.builtin.stat:
        path: "{{ slurm_inventory_file }}"
      register: slurm_inv_stat
      delegate_to: localhost
      when: slurm_inventory_file | default('') | length > 0
      # Note: Not in a loop - single delegation to localhost for file existence check

    - name: Load slurm inventory for aggregator/sampler node delegation
      when:
        - slurm_inventory_file | default('') | length > 0
        - slurm_inv_stat.stat.exists | default(false)
      block:
        - name: Read slurm inventory
          ansible.builtin.include_vars:
            file: "{{ slurm_inventory_file }}"
            name: slurm_inv

        - name: Add Slurm control nodes to in-memory inventory (x86_64)
          ansible.builtin.add_host:
            name: "{{ item.value.ansible_host | default(item.key) }}"
            groups: slurm_control_node
            ansible_user: root
          loop: "{{ slurm_inv.all.children.slurm_control_node_x86_64.hosts | default({}) | dict2items }}"
          loop_control:
            label: "{{ item.key }}"
          when: slurm_inv.all.children.slurm_control_node_x86_64.hosts is defined

        - name: Add Slurm control nodes to in-memory inventory (non-arch-specific)
          ansible.builtin.add_host:
            name: "{{ item.value.ansible_host | default(item.key) }}"
            groups: slurm_control_node
            ansible_user: root
          loop: "{{ slurm_inv.all.children.slurm_control_node.hosts | default({}) | dict2items }}"
          loop_control:
            label: "{{ item.key }}"
          when:
            - slurm_inv.all.children.slurm_control_node is defined
            - slurm_inv.all.children.slurm_control_node.hosts is defined
            - slurm_inv.all.children.slurm_control_node_x86_64 is not defined

        - name: Add Slurm compute nodes to in-memory inventory (x86_64)
          ansible.builtin.add_host:
            name: "{{ item.value.ansible_host | default(item.key) }}"
            groups: slurm_node
            ansible_user: root
          loop: "{{ slurm_inv.all.children.slurm_node_x86_64.hosts | default({}) | dict2items }}"
          loop_control:
            label: "{{ item.key }}"
          when: slurm_inv.all.children.slurm_node_x86_64.hosts is defined

        - name: Add Slurm compute nodes to in-memory inventory (non-arch-specific)
          ansible.builtin.add_host:
            name: "{{ item.value.ansible_host | default(item.key) }}"
            groups: slurm_node
            ansible_user: root
          loop: "{{ slurm_inv.all.children.slurm_node.hosts | default({}) | dict2items }}"
          loop_control:
            label: "{{ item.key }}"
          when:
            - slurm_inv.all.children.slurm_node is defined
            - slurm_inv.all.children.slurm_node.hosts is defined
            - slurm_inv.all.children.slurm_node_x86_64 is not defined

        - name: Add aarch64 Slurm compute nodes to in-memory inventory
          ansible.builtin.add_host:
            name: "{{ item.value.ansible_host | default(item.key) }}"
            groups: slurm_node
            ansible_user: root
          loop: "{{ slurm_inv.all.children.slurm_node_aarch64.hosts | default({}) | dict2items }}"
          loop_control:
            label: "{{ item.key }}"
          when: slurm_inv.all.children.slurm_node_aarch64.hosts is defined
  tasks:
    - name: Check if Kafka is needed for LDMS telemetry
      ansible.builtin.set_fact:
        kafka_needed: "{{ 'kafka' in (telemetry_config.telemetry_sources.ldms.collection_targets | default([])) }}"
      when: telemetry_config is defined

    - name: Deploy Kafka if needed and not already deployed
      ansible.builtin.include_role:
        name: deploy_kafka
      when:
        - kafka_needed | default(false) | bool
        - hostvars['localhost']['kafka_support'] | default(false) | bool

    - name: Check if VictoriaMetrics is needed for LDMS telemetry
      ansible.builtin.set_fact:
        victoria_metrics_needed: "{{ 'victoria_metrics' in (telemetry_config.telemetry_sources.ldms.collection_targets | default([])) }}"
      when: telemetry_config is defined

    - name: Set victoria_deployment_mode
      ansible.builtin.set_fact:
        victoria_deployment_mode: "cluster"
      when:
        - victoria_metrics_needed | default(false) | bool
        - hostvars['localhost']['victoria_metrics_support'] | default(false) | bool

    - name: Deploy VictoriaMetrics if needed and not already deployed
      ansible.builtin.include_role:
        name: deploy_victoria
      when:
        - victoria_metrics_needed | default(false) | bool
        - hostvars['localhost']['victoria_metrics_support'] | default(false) | bool

    - name: Include deploy_ldms role (K8s deployment only)
      ansible.builtin.include_role:
        name: deploy_ldms
      vars:
        skip_sampler_config: true
        skip_aggregator_config: true

- name: Configure LDMS Aggregator on Slurm Control Node
  hosts: slurm_control_node
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - name: Set telemetry credentials from localhost
      ansible.builtin.set_fact:
        telemetry_credentials: "{{ hostvars['localhost']['telemetry_credentials'] }}"
      no_log: true
      when: hostvars['localhost']['telemetry_credentials'] is defined

    - name: Set required variables from localhost
      ansible.builtin.set_fact:
        telemetry_config: "{{ hostvars['localhost']['telemetry_config'] }}"
        k8s_cluster_mount: "{{ hostvars['localhost']['k8s_cluster_mount'] }}"
        slurm_inv: "{{ hostvars[groups['kube_vip_group'][0]]['slurm_inv'] | default({}) }}"
        cluster_inv: "{{ hostvars['localhost']['cluster_inv'] | default({}) }}"
      when: hostvars['localhost']['telemetry_config'] is defined

    - name: Configure LDMS aggregator on control node
      ansible.builtin.include_role:
        name: deploy_ldms
        tasks_from: configure_ldms_aggregator
      vars:
        slurm_inv: "{{ hostvars[groups['kube_vip_group'][0]]['slurm_inv'] | default({}) }}"

- name: Deploy LDMS Aggregator on Kube VIP Host
  hosts: kube_vip_group
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - name: Set telemetry credentials from localhost
      ansible.builtin.set_fact:
        telemetry_credentials: "{{ hostvars['localhost']['telemetry_credentials'] }}"
      no_log: true
      when: hostvars['localhost']['telemetry_credentials'] is defined

    - name: Set required variables from localhost
      ansible.builtin.set_fact:
        telemetry_config: "{{ hostvars['localhost']['telemetry_config'] }}"
        k8s_cluster_mount: "{{ hostvars['localhost']['k8s_cluster_mount'] }}"
        slurm_inv: "{{ hostvars[groups['kube_vip_group'][0]]['slurm_inv'] | default({}) }}"
        cluster_inv: "{{ hostvars['localhost']['cluster_inv'] | default({}) }}"
      when: hostvars['localhost']['telemetry_config'] is defined

    - name: Set munge key check result from slurm control node
      ansible.builtin.set_fact:
        munge_key_check_result: "{{ hostvars[groups['slurm_control_node'][0]]['munge_key_check_result'] | default(false) }}"
      when:
        - groups['slurm_control_node'] is defined
        - groups['slurm_control_node'] | length > 0
        - hostvars[groups['slurm_control_node'][0]]['munge_key_check_result'] is defined

    - name: Set ldms_sampler_password from slurm control node
      ansible.builtin.set_fact:
        ldms_sampler_password: "{{ hostvars[groups['slurm_control_node'][0]]['ldms_sampler_password'] | default('') }}"
      no_log: true
      when:
        - groups['slurm_control_node'] is defined
        - groups['slurm_control_node'] | length > 0
        - hostvars[groups['slurm_control_node'][0]]['ldms_sampler_password'] is defined

    - name: Set ldms_sampler_password from telemetry_credentials as fallback
      ansible.builtin.set_fact:
        ldms_sampler_password: "{{ telemetry_credentials.ldms_sampler_password | default('') }}"
      no_log: true
      when:
        - telemetry_credentials is defined
        - telemetry_credentials.ldms_sampler_password is defined
        - ldms_sampler_password is not defined or ldms_sampler_password == ''

    - name: Deploy LDMS aggregator on kube_vip host
      ansible.builtin.include_role:
        name: deploy_ldms
        tasks_from: deploy_ldms_aggregator_k8s

- name: Configure LDMS Sampler on Slurm Compute Nodes
  hosts: slurm_node
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - name: Set telemetry credentials from localhost
      ansible.builtin.set_fact:
        telemetry_credentials: "{{ hostvars['localhost']['telemetry_credentials'] }}"
      no_log: true
      when: hostvars['localhost']['telemetry_credentials'] is defined

    - name: Set required variables from localhost
      ansible.builtin.set_fact:
        telemetry_config: "{{ hostvars['localhost']['telemetry_config'] }}"
        k8s_cluster_mount: "{{ hostvars['localhost']['k8s_cluster_mount'] }}"
      when: hostvars['localhost']['telemetry_config'] is defined

    - name: Configure LDMS sampler on compute nodes
      ansible.builtin.include_role:
        name: deploy_ldms
        tasks_from: configure_ldms_sampler
