# =============================================================================
# Deploy LDMS Telemetry
# =============================================================================
# Usage: Called from telemetry.yml or standalone with kube_vip
#   ansible-playbook telemetry.yml -e kube_vip=<VIP_IP> --tags deploy_ldms
#
# Play structure:
#   Play 1 (kube_vip): Deploy Kafka (enable only), then include the
#           deploy_ldms role, which routes internally to enable.yml or
#           disable.yml based on telemetry_sources.ldms.metrics_enabled.
#           enable.yml owns the entire enable flow: Slurm inventory +
#           reachability, aggregator auth (delegate_to Slurm control node),
#           sampler config prep (NFS), Helm deploy, Vector bridge, and
#           verification. disable.yml only scales existing K8s resources
#           to zero, so it needs none of the above.
#   Play 2 (compute nodes): Configure LDMS sampler in parallel (enable only).
#
# VictoriaMetrics/VictoriaLogs are not deployed here: LDMS never lists them
# as a direct collection target, so they are deployed centrally in the
# sinks phase (see playbooks/deploy/deploy.yml Phase 1) before this runs.
# =============================================================================

# =============================================================================
# Play 1: Deploy LDMS Telemetry (all K8s + auth work)
# =============================================================================
- name: Deploy LDMS Telemetry
  hosts: kube_vip_group
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - ../../../vars/telemetry_common.yml
  pre_tasks:
    - name: Load telemetry config (only if not already loaded)
      ansible.builtin.include_role:
        name: common
        tasks_from: load_telemetry_config
      when: telemetry_config is not defined

    - name: Check if LDMS is enabled
      ansible.builtin.set_fact:
        ldms_metrics_enabled: "{{ telemetry_config.telemetry_sources.ldms.metrics_enabled | default(false) | bool }}"

    - name: Derive sink support flags (only if not already derived)
      ansible.builtin.include_role:
        name: common
        tasks_from: derive_sink_support_flags
      when: kafka_support is not defined

    - name: Add kube_vip to inventory (only if not already added)
      ansible.builtin.add_host:
        name: "{{ kube_vip }}"
        groups: kube_vip_group
        ansible_user: root
      when: kube_vip_group is not defined

  tasks:
    - name: Set telemetry credentials from localhost
      ansible.builtin.set_fact:
        telemetry_credentials: "{{ hostvars['localhost']['telemetry_credentials'] }}"
      no_log: true
      when: hostvars['localhost']['telemetry_credentials'] is defined

    - name: Deploy Kafka (handles both cluster deployment and topic management)
      ansible.builtin.include_role:
        name: deploy_kafka
      when:
        - ldms_metrics_enabled | bool
        - kafka_support | default(false) | bool
        - not (hostvars['localhost']['kafka_deployed'] | default(false) | bool)

    - name: Include deploy_ldms role (routes internally to enable or disable)
      ansible.builtin.include_role:
        name: deploy_ldms

# =============================================================================
# Play 2: Configure LDMS Sampler on Reachable Slurm Nodes (enable only)
# Runs sampler config in parallel across compute nodes. The ldms_deploy_reachable
# group is populated by enable.yml's build_deployment_inventory step in Play 1,
# so this play has no hosts (and is skipped) whenever LDMS is disabled.
# =============================================================================
- name: Configure LDMS Sampler on Reachable Slurm Nodes
  hosts: ldms_deploy_reachable
  gather_facts: false
  any_errors_fatal: false
  max_fail_percentage: 100
  ignore_unreachable: true
  tasks:
    - name: Configure LDMS sampler
      when: hostvars[groups['kube_vip_group'][0]]['ldms_metrics_enabled'] | default(false) | bool
      block:
        - name: Set telemetry credentials from localhost
          ansible.builtin.set_fact:
            telemetry_credentials: "{{ hostvars['localhost']['telemetry_credentials'] }}"
          no_log: true
          when: hostvars['localhost']['telemetry_credentials'] is defined

        - name: Load telemetry configuration (only if not already loaded)
          ansible.builtin.include_role:
            name: common
            tasks_from: load_telemetry_config
          when: telemetry_config is not defined

        - name: Configure LDMS sampler on reachable nodes
          ansible.builtin.include_role:
            name: deploy_ldms
            tasks_from: configure_ldms_sampler
