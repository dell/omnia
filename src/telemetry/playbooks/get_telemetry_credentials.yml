---
# get_telemetry_credentials.yml — Standalone credential flow for telemetry.
# Can be used independently of the central credential_utility.
#
# Naming Convention:
#   Playbook: get_telemetry_credentials.yml   (verb — user action: "get credentials")
#   Role:     collect_telemetry_credentials    (verb — what the role does: collect/prompt/encrypt)
#   Data:     telemetry_credentials.yml  (noun — the output artifact)
#
# Usage:
#   cd src/telemetry
#   ansible-playbook playbooks/get_telemetry_credentials.yml
#
# This playbook:
#   1. Loads the input project directory
#   2. Loads telemetry_config.yml (for iDRAC telemetry configuration)
#   3. Validates, creates, and prompts for telemetry credentials
#   4. Credentials are stored encrypted at:
#      {input_project_dir}/telemetry/input/telemetry_credentials.yml

- name: Telemetry credential management
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Load input project directory
      ansible.builtin.set_fact:
        input_project_dir: "{{ lookup('env', 'OMNIA_INPUT_PROJECT_DIR') | default(lookup('env', 'PWD')) }}"

    - name: Load telemetry_config.yml for iDRAC configuration
      ansible.builtin.include_vars:
        file: "{{ input_project_dir }}/telemetry/input/telemetry_config.yml"
      failed_when: false

    - name: Run collect_telemetry_credentials role
      ansible.builtin.include_role:
        name: collect_telemetry_credentials
