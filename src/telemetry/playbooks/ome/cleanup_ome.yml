# =============================================================================
# OME Telemetry Cleanup
# =============================================================================
# Removes Vector-OME bridge resources (deployment, service, configmap,
# KafkaUser). Note: vlagent-vector (VL write-buffer) is cleaned with
# VictoriaLogs cleanup.
#
# Standalone usage:
#   ansible-playbook playbooks/ome/cleanup_ome.yml
#
# Via main cleanup (tag-based):
#   ansible-playbook playbooks/cleanup.yml --tags cleanup_ome
# =============================================================================

- name: "Cleanup OME Telemetry"
  hosts: kube_vip_group
  gather_facts: false
  vars_files:
    - ../vars/cleanup.yml
  tasks:
    - name: "OME | Delete Vector-OME bridge resources"
      ansible.builtin.command: >
        kubectl -n {{ telemetry_namespace }} delete {{ item.type }} {{ item.name }}
        --ignore-not-found=true --wait=false
      loop: "{{ vector_ome_resources }}"
      loop_control:
        label: "{{ item.type }}/{{ item.name }}"
      changed_when: false
      failed_when: false

    - name: "OME | Force delete Vector-OME pods"
      ansible.builtin.command: >
        kubectl -n {{ telemetry_namespace }} delete pod -l {{ vector_ome_pod_label }}
        --grace-period={{ cleanup_resource_grace_period }} --force --ignore-not-found=true
      changed_when: false
      failed_when: false

    - name: "OME | Cleanup complete"
      ansible.builtin.debug:
        msg: "OME telemetry cleanup completed (includes Vector-OME bridge)"
