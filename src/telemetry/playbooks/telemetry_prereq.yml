---
# Telemetry Prerequisites: Load config, derive flags, resolve kube_vip
# This playbook is imported by telemetry.yml and skipped when chained (facts persist)

- name: "Telemetry bootstrap: load config and resolve kube_vip target"
  hosts: localhost
  connection: local
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - name: Load telemetry configuration
      ansible.builtin.include_role:
        name: common
        tasks_from: load_telemetry_config
      when: telemetry_config is not defined

    - name: Derive sink support flags
      ansible.builtin.include_role:
        name: common
        tasks_from: derive_sink_support_flags
      when: kafka_support is not defined

    - name: Collect telemetry credentials
      ansible.builtin.include_role:
        name: collect_telemetry_credentials
      when: telemetry_credentials is not defined

    - name: Set bmc_group_data_path from idrac_telemetry_configurations (for iDRAC)
      ansible.builtin.set_fact:
        bmc_group_data_path: "{{ telemetry_config.idrac_telemetry_configurations.bmc_group_data_path }}"
      when:
        - telemetry_config is defined
        - telemetry_config.idrac_telemetry_configurations.bmc_group_data_path is defined

    - name: Validate kube_vip is set
      ansible.builtin.assert:
        that:
          - kube_vip is defined
          - kube_vip | length > 0
        fail_msg: >
          kube_vip is required. Ensure you have copied kube_inventory.yml from
          orchestrator/output/kube_inventory.yml to telemetry/input/kube_inventory.yml.
          Run orchestrator.yml first to generate the inventory files.

    - name: Add kube_vip to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ kube_vip }}"
        groups: kube_vip_group
        ansible_user: root
