---
# external_victoria_connect.yml — Fetch Victoria external connection details
#
# Extracts VictoriaMetrics and VictoriaLogs LoadBalancer endpoints, TLS
# certificates, VLAgent syslog target, and SFM/PowerScale integration
# instructions from the deployed telemetry cluster.
#
# Usage:
#   ansible-playbook playbooks/telemetry.yml --tags external_victoria
#
# Output:
#   {{ output_project_dir }}/external_victoria/
#     ├── ca.crt                                  — Victoria TLS CA certificate (if TLS enabled)
#     └── external_victoria_connect_details.yml   — Connection details YAML

# Step 1: Load config, resolve kube_vip, add to inventory
- name: "External Victoria | Bootstrap: load config and resolve kube_vip"
  ansible.builtin.import_playbook: ../deploy/telemetry_prereq.yml

# Step 2: Fetch Victoria connection details from kube_vip
- name: "External Victoria | Fetch connection details from K8s cluster"
  hosts: kube_vip_group
  connection: ssh
  gather_facts: false
  roles:
    - external_victoria_connect
