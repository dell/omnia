---
# external_kafka_connect.yml — Fetch Kafka external connection details
#
# Extracts the native Kafka mTLS endpoint, HTTP Bridge endpoint, TLS
# certificates, and connection details from the deployed telemetry Kafka
# cluster for external client integration (e.g., Dell OME).
#
# Usage:
#   ansible-playbook playbooks/telemetry.yml --tags external_kafka
#
# Output:
#   {{ output_project_dir }}/external_kafka/
#     ├── ca.crt                              — Kafka cluster CA certificate
#     ├── user.crt                            — Client certificate
#     ├── user.key                            — Client private key
#     └── external_kafka_connect_details.yml  — Connection details YAML

# Step 1: Load config, resolve kube_vip, add to inventory
- name: "External Kafka | Bootstrap: load config and resolve kube_vip"
  ansible.builtin.import_playbook: ../deploy/telemetry_prereq.yml

# Step 2: Fetch Kafka connection details from kube_vip
- name: "External Kafka | Fetch connection details from K8s cluster"
  hosts: kube_vip_group
  connection: ssh
  gather_facts: false
  roles:
    - external_kafka_connect
