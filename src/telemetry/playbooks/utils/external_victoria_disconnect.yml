# external_victoria_disconnect.yml — Disconnect external Victoria clients
#
# Displays manual disconnect instructions for each external system
# (SFM, PowerScale).
#
# NOTE: No cluster-side changes are made. Victoria LoadBalancer services and
# exported certificates are preserved. External systems must be manually
# disconnected on their side.
# To reconnect later, run external_victoria_connect.yml again.
#
# Usage:
#   ansible-playbook playbooks/telemetry.yml --tags external_victoria_disconnect

# Step 1: Load config, resolve kube_vip, add to inventory
- name: "External Victoria Disconnect | Bootstrap: load config and resolve kube_vip"
  ansible.builtin.import_playbook: ../deploy/telemetry_prereq.yml

# Step 2: Clean up and display disconnect instructions
- name: "External Victoria Disconnect | Clean up and display disconnect instructions"
  hosts: kube_vip_group
  connection: ssh
  gather_facts: false
  roles:
    - external_victoria_disconnect
