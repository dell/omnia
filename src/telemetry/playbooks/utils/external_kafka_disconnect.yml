# external_kafka_disconnect.yml — Disconnect external Kafka clients (e.g., OME)
#
# Displays manual disconnect instructions for the external system (OME).
#
# NOTE: No cluster-side changes are made. Kafka LoadBalancer services and
# exported certificates are preserved. External systems must be manually
# disconnected on their side (OME UI).
# To reconnect later, run external_kafka_connect.yml again.
#
# Usage:
#   ansible-playbook playbooks/telemetry.yml --tags external_kafka_disconnect

# Step 1: Load config, resolve kube_vip, add to inventory
- name: "External Kafka Disconnect | Bootstrap: load config and resolve kube_vip"
  ansible.builtin.import_playbook: ../deploy/telemetry_prereq.yml

# Step 2: Remove Kafka external access and display disconnect instructions
- name: "External Kafka Disconnect | Remove external access from K8s cluster"
  hosts: kube_vip_group
  connection: ssh
  gather_facts: false
  roles:
    - external_kafka_disconnect
