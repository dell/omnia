# =============================================================================
# Telemetry Cleanup Playbook — Main Orchestrator
# =============================================================================
# Completely removes telemetry components and all associated K8s resources.
# Uses Ansible tags to control which components to clean up.
# Each component's cleanup logic lives in its own playbook file.
#
# Usage:
#   # Cleanup ALL telemetry components
#   ansible-playbook playbooks/cleanup.yml
#   ansible-playbook telemetry.yml --tags cleanup
#
#   # Cleanup specific sinks
#   ansible-playbook playbooks/cleanup.yml --tags cleanup_kafka
#   ansible-playbook playbooks/cleanup.yml --tags cleanup_victoria_metrics
#   ansible-playbook playbooks/cleanup.yml --tags cleanup_victoria_logs
#
#   # Cleanup specific sources
#   ansible-playbook playbooks/cleanup.yml --tags cleanup_idrac
#   ansible-playbook playbooks/cleanup.yml --tags cleanup_ldms
#   ansible-playbook playbooks/cleanup.yml --tags cleanup_ome
#   ansible-playbook playbooks/cleanup.yml --tags cleanup_powerscale
#
#   # Cleanup multiple components
#   ansible-playbook playbooks/cleanup.yml --tags cleanup_kafka,cleanup_idrac
#   ansible-playbook telemetry.yml --tags cleanup_kafka,cleanup_victoria_metrics
#
#   # Cleanup via orchestrator (all components)
#   ansible-playbook telemetry.yml --tags cleanup
#
#   # Cleanup via orchestrator (single component)
#   ansible-playbook telemetry.yml --tags cleanup_kafka
#
# Available tags:
#   Sinks:   cleanup_kafka, cleanup_victoria_metrics, cleanup_victoria_logs
#   Sources: cleanup_idrac, cleanup_ldms, cleanup_ome, cleanup_powerscale,
#            cleanup_dcgm, cleanup_ufm, cleanup_vast, cleanup_sfm,
#            cleanup_skyway, cleanup_powervault
#
# Resource ownership:
#   LDMS cleanup includes Vector-LDMS bridge resources
#   OME cleanup includes Vector-OME bridge resources
#   VictoriaMetrics cleanup includes vmagent-vector (VM write-buffer)
#   VictoriaLogs cleanup includes vlagent-vector (VL write-buffer)
# =============================================================================

# ---------------------------------------------------------------------------
# Play 1: Prerequisites — Load config, resolve kube_vip (cleanup only)
# ---------------------------------------------------------------------------
- name: "Telemetry Cleanup | Prerequisites"
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tags: [cleanup, cleanup_idrac, cleanup_ldms, cleanup_ome, cleanup_powerscale, cleanup_dcgm, cleanup_ufm, cleanup_vast, cleanup_sfm, cleanup_skyway, cleanup_powervault, cleanup_kafka, cleanup_victoria_metrics, cleanup_victoria_logs]  # noqa: yaml[line-length]
  tasks:
    - name: Load telemetry configuration
      ansible.builtin.include_role:
        name: common
        tasks_from: load_telemetry_config

    - name: Validate kube_vip is set
      ansible.builtin.assert:
        that:
          - kube_vip is defined
          - kube_vip | length > 0
        fail_msg: >
          kube_vip is required. Add 'kube_vip: <VIP_IP>' to telemetry_config.yml.

    - name: Add kube_vip to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ kube_vip }}"
        groups: kube_vip_group
        ansible_user: root

# ---------------------------------------------------------------------------
# Play 2: Source cleanups
# ---------------------------------------------------------------------------
- name: "Cleanup iDRAC Telemetry"
  import_playbook: idrac/cleanup_idrac.yml
  tags: [cleanup_idrac]

- name: "Cleanup LDMS Telemetry (includes Vector-LDMS bridge)"
  import_playbook: ldms/cleanup_ldms.yml
  tags: [cleanup_ldms]

- name: "Cleanup OME Telemetry (includes Vector-OME bridge)"
  import_playbook: ome/cleanup_ome.yml
  tags: [cleanup_ome]

- name: "Cleanup PowerScale Telemetry"
  import_playbook: powerscale/cleanup_powerscale.yml
  tags: [cleanup_powerscale]

- name: "Cleanup DCGM Telemetry"
  import_playbook: dcgm/cleanup_dcgm.yml
  tags: [cleanup_dcgm]

- name: "Cleanup UFM Telemetry"
  import_playbook: ufm/cleanup_ufm.yml
  tags: [cleanup_ufm]

- name: "Cleanup VAST Telemetry"
  import_playbook: vast/cleanup_vast.yml
  tags: [cleanup_vast]

- name: "Cleanup SFM Telemetry"
  import_playbook: sfm/cleanup_sfm.yml
  tags: [cleanup_sfm]

- name: "Cleanup Skyway Telemetry"
  import_playbook: skyway/cleanup_skyway.yml
  tags: [cleanup_skyway]

- name: "Cleanup PowerVault Telemetry"
  import_playbook: powervault/cleanup_powervault.yml
  tags: [cleanup_powervault]

# ---------------------------------------------------------------------------
# Play 3: Sink cleanups — Kafka, VictoriaMetrics, VictoriaLogs
# ---------------------------------------------------------------------------
- name: "Cleanup Kafka"
  import_playbook: cleanup_kafka.yml
  tags: [cleanup_kafka]

- name: "Cleanup VictoriaMetrics"
  import_playbook: cleanup_victoria_metrics.yml
  tags: [cleanup_victoria_metrics]

- name: "Cleanup VictoriaLogs"
  import_playbook: cleanup_victoria_logs.yml
  tags: [cleanup_victoria_logs]

# ---------------------------------------------------------------------------
# Play 4: Final verification and summary (cleanup only)
# ---------------------------------------------------------------------------
- name: "Telemetry Cleanup | Verification"
  hosts: kube_vip_group
  gather_facts: false
  tags: [cleanup, cleanup_idrac, cleanup_ldms, cleanup_ome, cleanup_powerscale, cleanup_dcgm, cleanup_ufm, cleanup_vast, cleanup_sfm, cleanup_skyway, cleanup_powervault, cleanup_kafka, cleanup_victoria_metrics, cleanup_victoria_logs]  # noqa: yaml[line-length]
  vars:
    telemetry_namespace: "telemetry"
  tasks:
    - name: "Final verification | Check remaining pods"
      ansible.builtin.command: >
        kubectl get pods -n {{ telemetry_namespace }}
      register: remaining_pods
      changed_when: false
      failed_when: false

    - name: "Final verification | Check remaining PVCs"
      ansible.builtin.command: >
        kubectl get pvc -n {{ telemetry_namespace }}
      register: remaining_pvcs
      changed_when: false
      failed_when: false

    - name: "Final verification | Check remaining services"
      ansible.builtin.command: >
        kubectl get svc -n {{ telemetry_namespace }}
      register: remaining_svcs
      changed_when: false
      failed_when: false

- name: "Telemetry Cleanup | Summary"
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [cleanup, cleanup_idrac, cleanup_ldms, cleanup_ome, cleanup_powerscale, cleanup_dcgm, cleanup_ufm, cleanup_vast, cleanup_sfm, cleanup_skyway, cleanup_powervault, cleanup_kafka, cleanup_victoria_metrics, cleanup_victoria_logs]  # noqa: yaml[line-length]
  tasks:
    - name: Display cleanup summary
      vars:
        kube_vip_host: "{{ kube_vip }}"
        remaining_pods_output: "{{ hostvars[kube_vip_host]['remaining_pods']['stdout'] | default('No resources found') }}"
        remaining_pvcs_output: "{{ hostvars[kube_vip_host]['remaining_pvcs']['stdout'] | default('No resources found') }}"
        remaining_svcs_output: "{{ hostvars[kube_vip_host]['remaining_svcs']['stdout'] | default('No resources found') }}"
      ansible.builtin.debug:
        msg:
          - "======================================================"
          - "Telemetry Cleanup Complete"
          - "======================================================"
          - "Target Host: {{ kube_vip_host }}"
          - ""
          - "Remaining pods:"
          - "{{ remaining_pods_output }}"
          - ""
          - "Remaining PVCs:"
          - "{{ remaining_pvcs_output }}"
          - ""
          - "Remaining services:"
          - "{{ remaining_svcs_output }}"
          - "======================================================"
          - ""
          - "To delete the entire namespace:"
          - "  kubectl delete namespace telemetry"
