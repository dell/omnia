# =============================================================================
# VictoriaMetrics Cleanup (REMOVED)
# =============================================================================
# This standalone playbook has been removed. Use the unified cleanup_sinks flow
# which includes dependency checking:
#
#   ansible-playbook telemetry.yml --tags cleanup_sinks -e sinks=victoria_metrics
#   ansible-playbook telemetry.yml --tags cleanup_sinks -e victoria_metrics
#
# The cleanup_sinks flow checks for running dependent sources before removing
# any sink. If a dependent source is running, cleanup is blocked and no
# resources are modified.
# =============================================================================

- name: "Cleanup VictoriaMetrics (removed — use cleanup_sinks)"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: "Reject deprecated cleanup_victoria_metrics playbook"
      ansible.builtin.fail:
        msg: >-
          This standalone VictoriaMetrics cleanup playbook has been removed.
          Use the unified cleanup_sinks flow with dependency checking:
            ansible-playbook telemetry.yml --tags cleanup_sinks -e sinks=victoria_metrics
            ansible-playbook telemetry.yml --tags cleanup_sinks -e victoria_metrics
