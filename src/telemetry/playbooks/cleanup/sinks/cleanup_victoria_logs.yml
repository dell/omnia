# =============================================================================
# VictoriaLogs Cleanup
# =============================================================================
# Removes VLCluster, VLAgent CRDs, cluster components, vlagent-vector
# (VL write-buffer), shared resources, PVCs, and conditionally the
# victoria-metrics-operator (only if VictoriaMetrics is not running).
# Keeps victoria-tls-certs secret (shared with VictoriaMetrics).
#
# Standalone usage:
#   ansible-playbook cleanup/sinks/cleanup_victoria_logs.yml
#
# Via main cleanup (tag-based):
#   ansible-playbook cleanup/cleanup.yml --tags cleanup_victoria_logs
# =============================================================================

- name: "Cleanup VictoriaLogs"
  hosts: kube_vip_group
  gather_facts: false
  vars_files:
    - ../../../vars/cleanup.yml
  tasks:
    - name: "VictoriaLogs | Delete CRD resources"
      ansible.builtin.command: >
        kubectl -n {{ telemetry_namespace }} delete {{ item.type }} {{ item.name }}
        --ignore-not-found=true
      loop: "{{ victoria_logs.crd_resources }}"
      loop_control:
        label: "{{ item.type }}/{{ item.name }}"
      changed_when: false
      failed_when: false

    - name: "VictoriaLogs | Delete all CRD instances"
      ansible.builtin.command: >
        kubectl -n {{ telemetry_namespace }} delete {{ item }} --all --ignore-not-found=true
      loop: "{{ victoria_logs.crd_all_resources }}"
      changed_when: false
      failed_when: false

    - name: "VictoriaLogs | Wait for operator to cascade deletions"
      ansible.builtin.pause:
        seconds: "{{ cleanup_post_delete_pause }}"

    - name: "VictoriaLogs | Delete cluster components"
      ansible.builtin.command: >
        kubectl -n {{ telemetry_namespace }} delete {{ item.type }} {{ item.name }}
        --ignore-not-found=true --wait=false
      loop: "{{ victoria_logs.cluster_resources + victoria_logs.agent_resources }}"
      loop_control:
        label: "{{ item.type }}/{{ item.name }}"
      changed_when: false
      failed_when: false

    - name: "VictoriaLogs | Delete shared resources"
      ansible.builtin.command: >
        kubectl -n {{ telemetry_namespace }} delete {{ item.type }} {{ item.name }}
        --ignore-not-found=true --wait=false
      loop: "{{ victoria_logs.shared_resources }}"
      loop_control:
        label: "{{ item.type }}/{{ item.name }}"
      changed_when: false
      failed_when: false

    - name: "VictoriaLogs | Note: victoria-tls-certs kept (shared with VictoriaMetrics)"
      ansible.builtin.debug:
        msg: "Keeping victoria-tls-certs secret (shared with VictoriaMetrics)"

    - name: "VictoriaLogs | Delete PVCs by label"
      ansible.builtin.command: >
        kubectl -n {{ telemetry_namespace }} delete pvc -l {{ item }}
        --ignore-not-found=true --wait=false
      loop: "{{ victoria_logs.pvc_labels }}"
      changed_when: false
      failed_when: false

    - name: "VictoriaLogs | Delete named PVCs (vlstorage + vlagent 0-9)"
      ansible.builtin.command: >
        kubectl -n {{ telemetry_namespace }} delete pvc {{ item.0 }}-{{ item.1 }}
        --ignore-not-found=true --wait=false
      loop: "{{ victoria_logs.named_pvc_prefixes | product(range(0, 10) | list) | list }}"
      loop_control:
        label: "{{ item.0 }}-{{ item.1 }}"
      changed_when: false
      failed_when: false

    # --- vlagent-vector log write-buffer cleanup (VL-side adapter for vector-ome) ---
    - name: "VictoriaLogs | Delete vlagent-vector resources"
      ansible.builtin.command: >
        kubectl -n {{ telemetry_namespace }} delete {{ item.type }} {{ item.name }}
        --ignore-not-found=true --wait=false
      loop: "{{ victoria_logs.vlagent_vector_resources }}"
      loop_control:
        label: "{{ item.type }}/{{ item.name }}"
      changed_when: false
      failed_when: false

    - name: "VictoriaLogs | Force delete pods"
      ansible.builtin.command: >
        kubectl -n {{ telemetry_namespace }} delete pod -l {{ item }}
        --grace-period={{ cleanup_resource_grace_period }} --force --ignore-not-found=true
      loop: "{{ victoria_logs.pod_labels }}"
      changed_when: false
      failed_when: false

    # --- Victoria operator cleanup (shared between VM and VL) ---
    # Only delete the operator if VictoriaMetrics is NOT running
    - name: "VictoriaLogs | Check if VictoriaMetrics workloads still exist"
      ansible.builtin.command: >
        kubectl -n {{ telemetry_namespace }} get vmcluster --no-headers --ignore-not-found=true
      register: vm_workloads
      changed_when: false
      failed_when: false

    - name: "VictoriaLogs | Delete operator (no VictoriaMetrics workloads found)"
      ansible.builtin.command: >
        kubectl -n {{ telemetry_namespace }} delete {{ item.type }} {{ item.name }}
        --ignore-not-found=true --wait=false
      loop: "{{ victoria_operator_resources }}"
      loop_control:
        label: "{{ item.type }}/{{ item.name }}"
      changed_when: false
      failed_when: false
      when: vm_workloads.stdout is defined and vm_workloads.stdout | trim | length == 0

    - name: "VictoriaLogs | Operator kept (VictoriaMetrics still running)"
      ansible.builtin.debug:
        msg: "Keeping victoria-metrics-operator (VictoriaMetrics workloads still exist)"
      when: vm_workloads.stdout is defined and vm_workloads.stdout | trim | length > 0

    - name: "VictoriaLogs | Cleanup complete"
      ansible.builtin.debug:
        msg: "VictoriaLogs cleanup completed (includes vlagent-vector write-buffer)"
