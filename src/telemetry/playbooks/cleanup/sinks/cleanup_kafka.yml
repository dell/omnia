# =============================================================================
# Kafka Cleanup
# =============================================================================
# Removes Kafka bridge, users, cluster, node pools, PVCs, secrets, services,
# and Strimzi operator.
#
# Standalone usage:
#   ansible-playbook cleanup/sinks/cleanup_kafka.yml
#
# Via main cleanup (tag-based):
#   ansible-playbook cleanup/cleanup.yml --tags cleanup_kafka
# =============================================================================

- name: "Cleanup Kafka"
  hosts: kube_vip_group
  gather_facts: false
  vars_files:
    - ../vars/cleanup.yml
  tasks:
    - name: "Kafka | Delete bridge resources"
      ansible.builtin.command: >
        kubectl -n {{ telemetry_namespace }} delete {{ item.type }} {{ item.name }}
        --ignore-not-found=true --wait=false
      loop: "{{ kafka_bridge_resources }}"
      loop_control:
        label: "{{ item.type }}/{{ item.name }}"
      changed_when: false
      failed_when: false

    - name: "Kafka | Delete user resources"
      ansible.builtin.command: >
        kubectl -n {{ telemetry_namespace }} delete {{ item.type }} {{ item.name }}
        --ignore-not-found=true --wait=false
      loop: "{{ kafka_user_resources }}"
      loop_control:
        label: "{{ item.type }}/{{ item.name }}"
      changed_when: false
      failed_when: false

    - name: "Kafka | Delete Kafka cluster"
      ansible.builtin.command: >
        kubectl -n {{ telemetry_namespace }} delete {{ item.type }} {{ item.name }}
        --ignore-not-found=true --wait=false
      loop: "{{ kafka_cluster_resources }}"
      loop_control:
        label: "{{ item.type }}/{{ item.name }}"
      changed_when: false
      failed_when: false

    - name: "Kafka | Wait for Kafka cluster to terminate"
      ansible.builtin.command: >
        kubectl -n {{ telemetry_namespace }} wait --for=delete kafka/kafka
        --timeout={{ cleanup_kafka_wait_timeout }}
      changed_when: false
      failed_when: false

    - name: "Kafka | Delete node pools"
      ansible.builtin.command: >
        kubectl -n {{ telemetry_namespace }} delete {{ item.type }} {{ item.name }}
        --ignore-not-found=true --wait=false
      loop: "{{ kafka_nodepool_resources }}"
      loop_control:
        label: "{{ item.type }}/{{ item.name }}"
      changed_when: false
      failed_when: false

    - name: "Kafka | Delete PVCs"
      ansible.builtin.command: >
        kubectl -n {{ telemetry_namespace }} delete pvc -l {{ kafka_pvc_label }}
        --ignore-not-found=true --wait=false
      changed_when: false
      failed_when: false

    - name: "Kafka | Delete labeled secrets"
      ansible.builtin.command: >
        kubectl -n {{ telemetry_namespace }} delete secret -l {{ kafka_secret_label }}
        --ignore-not-found=true --wait=false
      changed_when: false
      failed_when: false

    - name: "Kafka | Delete named secrets"
      ansible.builtin.command: >
        kubectl -n {{ telemetry_namespace }} delete secret {{ item }}
        --ignore-not-found=true --wait=false
      loop: "{{ kafka_secret_resources }}"
      changed_when: false
      failed_when: false

    - name: "Kafka | Delete services"
      ansible.builtin.command: >
        kubectl -n {{ telemetry_namespace }} delete service {{ item }}
        --ignore-not-found=true --wait=false
      loop: "{{ kafka_service_resources }}"
      changed_when: false
      failed_when: false

    - name: "Kafka | Delete ConfigMaps by label"
      ansible.builtin.command: >
        kubectl -n {{ telemetry_namespace }} delete configmap -l app=kafka
        --ignore-not-found=true --wait=false
      changed_when: false
      failed_when: false

    - name: "Kafka | Delete named ConfigMaps"
      ansible.builtin.command: >
        kubectl -n {{ telemetry_namespace }} delete configmap {{ item }}
        --ignore-not-found=true --wait=false
      loop: "{{ kafka_configmap_resources }}"
      changed_when: false
      failed_when: false

    - name: "Kafka | Delete TLS test jobs"
      ansible.builtin.command: >
        kubectl -n {{ telemetry_namespace }} delete job {{ item }}
        --ignore-not-found=true --wait=false
      loop: "{{ kafka_job_resources }}"
      changed_when: false
      failed_when: false

    - name: "Kafka | Force delete pods"
      ansible.builtin.command: >
        kubectl -n {{ telemetry_namespace }} delete pod -l {{ item }}
        --grace-period={{ cleanup_resource_grace_period }} --force --ignore-not-found=true
      loop: "{{ kafka_pod_labels }}"
      changed_when: false
      failed_when: false

    - name: "Kafka | Uninstall Strimzi Helm release"
      ansible.builtin.shell: |
        if helm status strimzi-cluster-operator -n {{ telemetry_namespace }} >/dev/null 2>&1; then
          helm uninstall strimzi-cluster-operator -n {{ telemetry_namespace }} --wait --timeout {{ cleanup_helm_timeout }} 2>/dev/null || true
        fi
      changed_when: false
      failed_when: false

    - name: "Kafka | Delete Strimzi operator deployment"
      ansible.builtin.command: >
        kubectl -n {{ telemetry_namespace }} delete deployment strimzi-cluster-operator
        --ignore-not-found=true --wait=false
      changed_when: false
      failed_when: false

    - name: "Kafka | Delete Strimzi Helm release secret"
      ansible.builtin.command: >
        kubectl -n {{ telemetry_namespace }} delete secret {{ kafka_strimzi_helm_secret }}
        --ignore-not-found=true --wait=false
      changed_when: false
      failed_when: false

    - name: "Kafka | Cleanup complete"
      ansible.builtin.debug:
        msg: "Kafka cleanup completed (cluster + bridge + operator)"
