# =============================================================================
# Telemetry Cleanup Playbook
# =============================================================================
# Removes telemetry components and all associated K8s resources.
#
# Usage:
#   # Cleanup ALL telemetry components (sources + sinks)
#   ansible-playbook telemetry.yml --tags cleanup
#
#   # Cleanup specific sources only
#   ansible-playbook telemetry.yml --tags cleanup_powerscale
#   ansible-playbook telemetry.yml --tags cleanup_ome
#   ansible-playbook telemetry.yml --tags cleanup_idrac
#   ansible-playbook telemetry.yml --tags cleanup_ldms
#
#   # Cleanup multiple sources
#   ansible-playbook telemetry.yml --tags cleanup_ome,cleanup_powerscale
#
# Design: Sinks (Kafka, VictoriaMetrics, VictoriaLogs) are shared
# infrastructure that multiple sources depend on. They are ONLY cleaned
# when --tags cleanup (all) is used, never individually.
#
# Resource ownership:
#   OME cleanup includes Vector-OME bridge resources
#   LDMS cleanup includes Vector-LDMS bridge resources
#   cleanup (all) includes sinks + vmagent-vector + vlagent-vector
# =============================================================================

# ---------------------------------------------------------------------------
# Play 1: Prerequisites — Load config, resolve kube_vip
# ---------------------------------------------------------------------------
- name: "Telemetry Cleanup | Prerequisites"
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Load telemetry configuration
      ansible.builtin.include_role:
        name: common
        tasks_from: load_telemetry_config

    - name: Validate kube_vip is set
      ansible.builtin.assert:
        that:
          - kube_vip is defined
          - kube_vip | length > 0
        fail_msg: >
          kube_vip is required. Add 'kube_vip: <VIP_IP>' to telemetry_config.yml.

    - name: Add kube_vip to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ kube_vip }}"
        groups: kube_vip_group
        ansible_user: root

    - name: Derive cleanup scope from run tags
      ansible.builtin.set_fact:
        _cleanup_all: "{{ 'cleanup' in ansible_run_tags }}"
        _cleanup_idrac: "{{ 'cleanup_idrac' in ansible_run_tags }}"
        _cleanup_ldms: "{{ 'cleanup_ldms' in ansible_run_tags }}"
        _cleanup_ome: "{{ 'cleanup_ome' in ansible_run_tags }}"
        _cleanup_powerscale: "{{ 'cleanup_powerscale' in ansible_run_tags }}"
        _cleanup_ufm: "{{ 'cleanup_ufm' in ansible_run_tags }}"
        _cleanup_vast: "{{ 'cleanup_vast' in ansible_run_tags }}"
        _cleanup_dcgm: "{{ 'cleanup_dcgm' in ansible_run_tags }}"
        _cleanup_sfm: "{{ 'cleanup_sfm' in ansible_run_tags }}"
        cacheable: true

# ---------------------------------------------------------------------------
# Play 2: Component cleanups (conditional on run tags)
# ---------------------------------------------------------------------------
- name: "Telemetry Cleanup | Remove selected components"
  hosts: kube_vip_group
  gather_facts: false
  tasks:
    # -- Source cleanups --
    - name: "Cleanup iDRAC telemetry"
      ansible.builtin.include_role:
        name: cleanup
        tasks_from: idrac
      when: hostvars['localhost']['_cleanup_all'] | bool or hostvars['localhost']['_cleanup_idrac'] | bool

    - name: "Cleanup LDMS telemetry (includes Vector-LDMS bridge)"
      ansible.builtin.include_role:
        name: cleanup
        tasks_from: ldms
      when: hostvars['localhost']['_cleanup_all'] | bool or hostvars['localhost']['_cleanup_ldms'] | bool

    - name: "Cleanup OME telemetry (includes Vector-OME bridge)"
      ansible.builtin.include_role:
        name: cleanup
        tasks_from: ome
      when: hostvars['localhost']['_cleanup_all'] | bool or hostvars['localhost']['_cleanup_ome'] | bool

    - name: "Cleanup PowerScale telemetry"
      ansible.builtin.include_role:
        name: cleanup
        tasks_from: powerscale
      when: hostvars['localhost']['_cleanup_all'] | bool or hostvars['localhost']['_cleanup_powerscale'] | bool

    - name: "Cleanup UFM telemetry"
      ansible.builtin.include_role:
        name: cleanup
        tasks_from: ufm
      when: hostvars['localhost']['_cleanup_all'] | bool or hostvars['localhost']['_cleanup_ufm'] | bool

    - name: "Cleanup VAST telemetry"
      ansible.builtin.include_role:
        name: cleanup
        tasks_from: vast
      when: hostvars['localhost']['_cleanup_all'] | bool or hostvars['localhost']['_cleanup_vast'] | bool

    - name: "Cleanup DCGM telemetry"
      ansible.builtin.include_role:
        name: cleanup
        tasks_from: dcgm
      when: hostvars['localhost']['_cleanup_all'] | bool or hostvars['localhost']['_cleanup_dcgm'] | bool

    - name: "Cleanup SFM telemetry"
      ansible.builtin.include_role:
        name: cleanup
        tasks_from: sfm
      when: hostvars['localhost']['_cleanup_all'] | bool or hostvars['localhost']['_cleanup_sfm'] | bool

    # -- Pre-sink guard: verify source pods have terminated --
    - name: "Check for remaining source pods before sink cleanup"
      vars:
        telemetry_namespace: "telemetry"
        _source_apps: >-
          idrac-telemetry,nersc-ldms,vector-ome,vector-ldms,
          karavi-metrics-powerscale,otel-collector,
          csi-volume-exporter,dcgm-exporter,sfm-telemetry,
          ufm-external,vast-external,skyway-telemetry,
          powervault-telemetry
      ansible.builtin.command: >
        kubectl get pods -n {{ telemetry_namespace }}
        --no-headers --ignore-not-found
        -l 'app in ({{ _source_apps | replace("\n", "") | trim }})'
      register: _remaining_source_pods
      changed_when: false
      failed_when: false
      when: hostvars['localhost']['_cleanup_all'] | bool

    - name: "Warn if source pods are still terminating"
      ansible.builtin.debug:
        msg: >-
          WARNING: {{ _remaining_source_pods.stdout_lines | length }} source pod(s) still
          terminating. Waiting for them to drain before cleaning sinks.
      when:
        - hostvars['localhost']['_cleanup_all'] | bool
        - _remaining_source_pods.stdout_lines | default([]) | length > 0

    - name: "Wait for source pods to terminate before sink cleanup"
      vars:
        telemetry_namespace: "telemetry"
      ansible.builtin.command: >
        kubectl wait --for=delete pods
        -l 'app in (idrac-telemetry,nersc-ldms,vector-ome,vector-ldms,karavi-metrics-powerscale,otel-collector,csi-volume-exporter)'
        -n {{ telemetry_namespace }} --timeout=60s
      changed_when: false
      failed_when: false
      when:
        - hostvars['localhost']['_cleanup_all'] | bool
        - _remaining_source_pods.stdout_lines | default([]) | length > 0

    # -- Sink cleanups (only on full cleanup — sinks are shared infrastructure) --
    - name: "Cleanup Kafka (full cleanup only)"
      ansible.builtin.include_role:
        name: cleanup
        tasks_from: kafka
      when: hostvars['localhost']['_cleanup_all'] | bool

    - name: "Cleanup VictoriaMetrics (full cleanup only)"
      ansible.builtin.include_role:
        name: cleanup
        tasks_from: victoria_metrics
      when: hostvars['localhost']['_cleanup_all'] | bool

    - name: "Cleanup VictoriaLogs (full cleanup only)"
      ansible.builtin.include_role:
        name: cleanup
        tasks_from: victoria_logs
      when: hostvars['localhost']['_cleanup_all'] | bool

# ---------------------------------------------------------------------------
# Play 3: Final verification and summary
# ---------------------------------------------------------------------------
- name: "Telemetry Cleanup | Verification"
  hosts: kube_vip_group
  gather_facts: false
  vars:
    telemetry_namespace: "telemetry"
  tasks:
    - name: "Final verification | Count remaining pods"
      ansible.builtin.command: >
        kubectl get pods -n {{ telemetry_namespace }} --no-headers --ignore-not-found
      register: remaining_pods
      changed_when: false
      failed_when: false

    - name: "Final verification | Count remaining PVCs"
      ansible.builtin.command: >
        kubectl get pvc -n {{ telemetry_namespace }} --no-headers --ignore-not-found
      register: remaining_pvcs
      changed_when: false
      failed_when: false

    - name: "Final verification | Count remaining services"
      ansible.builtin.command: >
        kubectl get svc -n {{ telemetry_namespace }} --no-headers --ignore-not-found
      register: remaining_svcs
      changed_when: false
      failed_when: false

- name: "Telemetry Cleanup | Summary"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Display cleanup summary
      vars:
        kube_vip_host: "{{ kube_vip }}"
        _pods_lines: "{{ hostvars[kube_vip_host]['remaining_pods']['stdout_lines'] | default([]) | select('match', '\\S') | list }}"
        _pvcs_lines: "{{ hostvars[kube_vip_host]['remaining_pvcs']['stdout_lines'] | default([]) | select('match', '\\S') | list }}"
        _svcs_lines: "{{ hostvars[kube_vip_host]['remaining_svcs']['stdout_lines'] | default([]) | select('match', '\\S') | list }}"
        _pod_count: "{{ _pods_lines | length }}"
        _pvc_count: "{{ _pvcs_lines | length }}"
        _svc_count: "{{ _svcs_lines | length }}"
      ansible.builtin.debug:
        msg:
          - "======================================================"
          - "Telemetry Cleanup Complete"
          - "======================================================"
          - "Target Host: {{ kube_vip_host }}"
          - ""
          - "Remaining pods:     {{ _pod_count }}"
          - "Remaining PVCs:     {{ _pvc_count }}"
          - "Remaining services: {{ _svc_count }}"
          - "======================================================"
          - ""
          - "To delete the entire namespace:"
          - "  kubectl delete namespace telemetry"
