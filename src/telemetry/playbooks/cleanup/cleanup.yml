# =============================================================================
# Telemetry Cleanup Playbook
# =============================================================================
# Removes telemetry workloads and configuration while preserving PVCs by default.
#
# Usage:
#   # Cleanup ALL telemetry components (sources + sinks)
#   ansible-playbook telemetry.yml --tags cleanup
#   # Delete PVCs as well (PVCs are preserved by default)
#   ansible-playbook telemetry.yml --tags cleanup -e Delete_volume=true
#
#   # Cleanup specific sources only
#   ansible-playbook telemetry.yml --tags cleanup_powerscale
#   ansible-playbook telemetry.yml --tags cleanup_ome
#   ansible-playbook telemetry.yml --tags cleanup_ldms
#
#   # Cleanup multiple sources
#   ansible-playbook telemetry.yml --tags cleanup_ome,cleanup_powerscale
#
#   # Cleanup multiple components
#   ansible-playbook cleanup/cleanup.yml --tags cleanup_kafka,cleanup_ldms
#   ansible-playbook telemetry.yml --tags cleanup_kafka,cleanup_victoria_metrics
#
#   # Cleanup via orchestrator (all components)
#   ansible-playbook telemetry.yml --tags cleanup
#
#   # Cleanup via orchestrator (single component)
#   ansible-playbook telemetry.yml --tags cleanup_kafka
#
# Available tags:
#   Sinks:   cleanup_kafka, cleanup_victoria_metrics, cleanup_victoria_logs
#   Sources: cleanup_ldms, cleanup_ome, cleanup_powerscale,
#            cleanup_ufm, cleanup_vast
# Design: Sinks (Kafka, VictoriaMetrics, VictoriaLogs) are shared
# infrastructure that multiple sources depend on. They are ONLY cleaned
# when --tags cleanup (all) is used, never individually.
#
# Resource ownership:
#   OME cleanup includes Vector-OME bridge resources
#   LDMS cleanup includes Vector-LDMS bridge resources
#   cleanup (all) includes sinks + vmagent-vector + vlagent-vector
# =============================================================================

# ---------------------------------------------------------------------------
# Play 1: Prerequisites — Load config, resolve kube_vip
# ---------------------------------------------------------------------------
- name: "Telemetry Cleanup | Prerequisites"
  hosts: localhost
  connection: local
  gather_facts: false
  tags:
    - cleanup
    - cleanup_ldms
    - cleanup_ome
    - cleanup_powerscale
    - cleanup_ufm
    - cleanup_vast
    - cleanup_kafka
    - cleanup_victoria_metrics
    - cleanup_victoria_logs
  tasks:
    - name: Initialize telemetry cleanup
      ansible.builtin.include_role:
        name: cleanup
        tasks_from: initialize

# ---------------------------------------------------------------------------
# Play 2: Component cleanups (conditional on run tags)
# ---------------------------------------------------------------------------
- name: "Telemetry Cleanup | Remove selected components"
  hosts: kube_vip_group
  gather_facts: false
  tags:
    - cleanup
    - cleanup_ldms
    - cleanup_ome
    - cleanup_powerscale
    - cleanup_ufm
    - cleanup_vast
    - cleanup_kafka
    - cleanup_victoria_metrics
    - cleanup_victoria_logs
  tasks:
    - name: Execute selected telemetry cleanup
      ansible.builtin.include_role:
        name: cleanup
        tasks_from: execute

# ---------------------------------------------------------------------------
# Play 3: Final verification and summary
# ---------------------------------------------------------------------------
- name: "Telemetry Cleanup | Verification"
  hosts: kube_vip_group
  gather_facts: false
  tags:
    - cleanup
    - cleanup_ldms
    - cleanup_ome
    - cleanup_powerscale
    - cleanup_ufm
    - cleanup_vast
    - cleanup_kafka
    - cleanup_victoria_metrics
    - cleanup_victoria_logs
  vars:
    telemetry_namespace: "telemetry"
  tasks:
    - name: Verify telemetry cleanup
      ansible.builtin.include_role:
        name: cleanup
        tasks_from: verify

- name: "Telemetry Cleanup | Summary"
  hosts: localhost
  connection: local
  gather_facts: false
  tags:
    - cleanup
    - cleanup_ldms
    - cleanup_ome
    - cleanup_powerscale
    - cleanup_ufm
    - cleanup_vast
    - cleanup_kafka
    - cleanup_victoria_metrics
    - cleanup_victoria_logs
  tasks:
    - name: Finalize telemetry cleanup
      ansible.builtin.include_role:
        name: cleanup
        tasks_from: finalize
