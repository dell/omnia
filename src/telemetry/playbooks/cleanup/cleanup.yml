# =============================================================================
# Telemetry Cleanup Playbook
# =============================================================================
# Removes telemetry workloads and configuration while preserving PVCs by default.
#
# Usage:
#   # Cleanup ALL telemetry components (sources + sinks)
#   ansible-playbook telemetry.yml --tags cleanup
#   # Delete PVCs as well (PVCs are preserved by default)
#   ansible-playbook telemetry.yml --tags cleanup -e Delete_volume=true
#
#   # Cleanup specific sources only
#   ansible-playbook telemetry.yml --tags cleanup_powerscale
#   ansible-playbook telemetry.yml --tags cleanup_ome
#   ansible-playbook telemetry.yml --tags cleanup_idrac
#   ansible-playbook telemetry.yml --tags cleanup_ldms
#
#   # Cleanup multiple sources
#   ansible-playbook telemetry.yml --tags cleanup_ome,cleanup_powerscale
#
#   # Cleanup multiple components
#   ansible-playbook cleanup/cleanup.yml --tags cleanup_kafka,cleanup_idrac
#   ansible-playbook telemetry.yml --tags cleanup_kafka,cleanup_victoria_metrics
#
#   # Cleanup via orchestrator (all components)
#   ansible-playbook telemetry.yml --tags cleanup
#
#   # Cleanup via orchestrator (single component)
#   ansible-playbook telemetry.yml --tags cleanup_kafka
#
# Available tags:
#   Sinks:   cleanup_kafka, cleanup_victoria_metrics, cleanup_victoria_logs
#   Sources: cleanup_idrac, cleanup_ldms, cleanup_ome, cleanup_powerscale,
#            cleanup_ufm, cleanup_vast
# Design: Sinks (Kafka, VictoriaMetrics, VictoriaLogs) are shared
# infrastructure that multiple sources depend on. They are ONLY cleaned
# when --tags cleanup (all) is used, never individually.
#
# Resource ownership:
#   OME cleanup includes Vector-OME bridge resources
#   LDMS cleanup includes Vector-LDMS bridge resources
#   cleanup (all) includes sinks + vmagent-vector + vlagent-vector
# =============================================================================

# ---------------------------------------------------------------------------
# Play 1: Prerequisites — Load config, resolve kube_vip
# ---------------------------------------------------------------------------
- name: "Telemetry Cleanup | Prerequisites"
  hosts: localhost
  connection: local
  gather_facts: false
  tags:
    - cleanup
    - cleanup_idrac
    - cleanup_ldms
    - cleanup_ome
    - cleanup_powerscale
    - cleanup_ufm
    - cleanup_vast
    - cleanup_kafka
    - cleanup_victoria_metrics
    - cleanup_victoria_logs
  tasks:
    - name: Derive cleanup scope from run tags
      ansible.builtin.set_fact:
        _cleanup_all: "{{ 'cleanup' in ansible_run_tags }}"
        _cleanup_idrac: "{{ 'cleanup_idrac' in ansible_run_tags }}"
        _cleanup_ldms: "{{ 'cleanup_ldms' in ansible_run_tags }}"
        _cleanup_ome: "{{ 'cleanup_ome' in ansible_run_tags }}"
        _cleanup_powerscale: "{{ 'cleanup_powerscale' in ansible_run_tags }}"
        _cleanup_ufm: "{{ 'cleanup_ufm' in ansible_run_tags }}"
        _cleanup_vast: "{{ 'cleanup_vast' in ansible_run_tags }}"
        _cleanup_kafka: "{{ 'cleanup_kafka' in ansible_run_tags }}"
        _cleanup_victoria_metrics: "{{ 'cleanup_victoria_metrics' in ansible_run_tags }}"
        _cleanup_victoria_logs: "{{ 'cleanup_victoria_logs' in ansible_run_tags }}"
        cacheable: true

    - name: Initialize cleanup state
      ansible.builtin.set_fact:
        _cleanup_abort: false
        _cleanup_active_component: ""
        _cleanup_component_results:
          idrac: skipped
          ldms: skipped
          ome: skipped
          powerscale: skipped
          ufm: skipped
          vast: skipped
          source_drain: skipped
          kafka: skipped
          victoria_metrics: skipped
          victoria_logs: skipped
        _cleanup_enabled:
          idrac_metrics: false
          ldms_metrics: false
          powerscale_metrics: false
          powerscale_logs: false
          ufm_metrics: false
          ufm_logs: false
          vast_metrics: false
          vast_logs: false
          ome_metrics: false
          ome_logs: false
          vector_ldms: false
          vector_ome: false
        _cleanup_failures: []
        _cleanup_unreachable_nodes:
          ldms: []
        _cleanup_verification_attempted: false
        _cleanup_volume_verification_failed: false
        _cleanup_delete_volume: >-
          {{ Delete_volume | default(delete_volume | default(false)) | bool }}

    - name: Prepare telemetry cleanup
      block:
        - name: Validate persistent volume cleanup option
          vars:
            _cleanup_boolean_values:
              - "true"
              - "false"
              - "yes"
              - "no"
              - "1"
              - "0"
          ansible.builtin.assert:
            that:
              - >-
                Delete_volume is not defined
                or (Delete_volume | string | lower) in _cleanup_boolean_values
              - >-
                delete_volume is not defined
                or (delete_volume | string | lower) in _cleanup_boolean_values
              - >-
                Delete_volume is not defined
                or delete_volume is not defined
                or (Delete_volume | bool) == (delete_volume | bool)
            fail_msg: >-
              Set only one matching boolean value for Delete_volume or delete_volume.
              Accepted values are true, false, yes, no, 1, and 0.

        - name: Load telemetry configuration
          ansible.builtin.include_role:
            name: common
            tasks_from: load_telemetry_config

        - name: Validate kube_vip is set
          ansible.builtin.assert:
            that:
              - kube_vip is defined
              - kube_vip | length > 0
            fail_msg: >
              kube_vip is required. Add 'kube_vip: <VIP_IP>' to telemetry_config.yml.

        - name: Add kube_vip to in-memory inventory
          ansible.builtin.add_host:
            name: "{{ kube_vip }}"
            groups: kube_vip_group
            ansible_user: root

        - name: Map configured telemetry capabilities
          ansible.builtin.set_fact:
            _cleanup_enabled:
              idrac_metrics: >-
                {{ telemetry_config.telemetry_sources.idrac.metrics_enabled | default(false) | bool }}
              ldms_metrics: >-
                {{ telemetry_config.telemetry_sources.ldms.metrics_enabled | default(false) | bool }}
              powerscale_metrics: >-
                {{ telemetry_config.telemetry_sources.powerscale.metrics_enabled | default(false) | bool }}
              powerscale_logs: >-
                {{ telemetry_config.telemetry_sources.powerscale.logs_enabled | default(false) | bool }}
              ufm_metrics: >-
                {{ telemetry_config.telemetry_sources.ufm.metrics_enabled | default(false) | bool }}
              ufm_logs: >-
                {{ telemetry_config.telemetry_sources.ufm.logs_enabled | default(false) | bool }}
              vast_metrics: >-
                {{ telemetry_config.telemetry_sources.vast.metrics_enabled | default(false) | bool }}
              vast_logs: >-
                {{ telemetry_config.telemetry_sources.vast.logs_enabled | default(false) | bool }}
              ome_metrics: >-
                {{ telemetry_config.telemetry_sources.ome.metrics_enabled | default(false) | bool }}
              ome_logs: >-
                {{ telemetry_config.telemetry_sources.ome.logs_enabled | default(false) | bool }}
              vector_ldms: >-
                {{ telemetry_config.telemetry_bridges.vector_ldms.metrics_enabled | default(false) | bool }}
              vector_ome: >-
                {{
                  telemetry_config.telemetry_bridges.vector_ome.metrics_enabled | default(false) | bool
                  or telemetry_config.telemetry_bridges.vector_ome.logs_enabled | default(false) | bool
                }}

      rescue:
        - name: Record cleanup prerequisite failure
          vars:
            _cleanup_failure_message: >-
              {{
                ansible_failed_result.stderr
                | default(ansible_failed_result.msg | default('Cleanup prerequisite failed'), true)
              }}
          ansible.builtin.set_fact:
            _cleanup_abort: true
            _cleanup_failures: >-
              {{
                _cleanup_failures
                + [{
                    'component': 'prerequisites',
                    'task': ansible_failed_task.name | default('Prepare telemetry cleanup'),
                    'host': inventory_hostname,
                    'rc': ansible_failed_result.rc | default(''),
                    'message': (_cleanup_failure_message | string)[:1000]
                  }]
              }}

# ---------------------------------------------------------------------------
# Play 2: Component cleanups (conditional on run tags)
# ---------------------------------------------------------------------------
- name: "Telemetry Cleanup | Remove selected components"
  hosts: kube_vip_group
  gather_facts: false
  tags:
    - cleanup
    - cleanup_idrac
    - cleanup_ldms
    - cleanup_ome
    - cleanup_powerscale
    - cleanup_ufm
    - cleanup_vast
    - cleanup_kafka
    - cleanup_victoria_metrics
    - cleanup_victoria_logs
  tasks:
    - name: Run selected cleanup components
      when: not (hostvars['localhost']['_cleanup_abort'] | bool)
      block:
        # -- Source cleanups --
        - name: Mark iDRAC cleanup as attempted
          ansible.builtin.set_fact:
            _cleanup_active_component: idrac
            _cleanup_component_results: >-
              {{
                hostvars['localhost']['_cleanup_component_results']
                | combine({'idrac': 'attempted'})
              }}
          delegate_to: localhost
          delegate_facts: true
          when: >-
            hostvars['localhost']['_cleanup_all'] | bool
            or hostvars['localhost']['_cleanup_idrac'] | bool

        - name: Cleanup iDRAC telemetry
          ansible.builtin.include_role:
            name: cleanup
            tasks_from: idrac
          when: >-
            hostvars['localhost']['_cleanup_all'] | bool
            or hostvars['localhost']['_cleanup_idrac'] | bool

        - name: Mark iDRAC cleanup as cleaned
          ansible.builtin.set_fact:
            _cleanup_active_component: ""
            _cleanup_component_results: >-
              {{
                hostvars['localhost']['_cleanup_component_results']
                | combine({'idrac': 'cleaned'})
              }}
          delegate_to: localhost
          delegate_facts: true
          when: >-
            hostvars['localhost']['_cleanup_all'] | bool
            or hostvars['localhost']['_cleanup_idrac'] | bool

        - name: Mark LDMS cleanup as attempted
          ansible.builtin.set_fact:
            _cleanup_active_component: ldms
            _cleanup_component_results: >-
              {{
                hostvars['localhost']['_cleanup_component_results']
                | combine({'ldms': 'attempted'})
              }}
          delegate_to: localhost
          delegate_facts: true
          when: >-
            hostvars['localhost']['_cleanup_all'] | bool
            or hostvars['localhost']['_cleanup_ldms'] | bool

        - name: Cleanup LDMS telemetry (includes Vector-LDMS bridge)
          ansible.builtin.include_role:
            name: cleanup
            tasks_from: ldms
          when: >-
            hostvars['localhost']['_cleanup_all'] | bool
            or hostvars['localhost']['_cleanup_ldms'] | bool

        - name: Mark LDMS cleanup as cleaned
          ansible.builtin.set_fact:
            _cleanup_active_component: ""
            _cleanup_component_results: >-
              {{
                hostvars['localhost']['_cleanup_component_results']
                | combine({'ldms': 'cleaned'})
              }}
          delegate_to: localhost
          delegate_facts: true
          when: >-
            hostvars['localhost']['_cleanup_all'] | bool
            or hostvars['localhost']['_cleanup_ldms'] | bool

        - name: Mark OME cleanup as attempted
          ansible.builtin.set_fact:
            _cleanup_active_component: ome
            _cleanup_component_results: >-
              {{
                hostvars['localhost']['_cleanup_component_results']
                | combine({'ome': 'attempted'})
              }}
          delegate_to: localhost
          delegate_facts: true
          when: >-
            hostvars['localhost']['_cleanup_all'] | bool
            or hostvars['localhost']['_cleanup_ome'] | bool

        - name: Cleanup OME telemetry (includes Vector-OME bridge)
          ansible.builtin.include_role:
            name: cleanup
            tasks_from: ome
          when: >-
            hostvars['localhost']['_cleanup_all'] | bool
            or hostvars['localhost']['_cleanup_ome'] | bool

        - name: Mark OME cleanup as cleaned
          ansible.builtin.set_fact:
            _cleanup_active_component: ""
            _cleanup_component_results: >-
              {{
                hostvars['localhost']['_cleanup_component_results']
                | combine({'ome': 'cleaned'})
              }}
          delegate_to: localhost
          delegate_facts: true
          when: >-
            hostvars['localhost']['_cleanup_all'] | bool
            or hostvars['localhost']['_cleanup_ome'] | bool

        - name: Mark PowerScale cleanup as attempted
          ansible.builtin.set_fact:
            _cleanup_active_component: powerscale
            _cleanup_component_results: >-
              {{
                hostvars['localhost']['_cleanup_component_results']
                | combine({'powerscale': 'attempted'})
              }}
          delegate_to: localhost
          delegate_facts: true
          when: >-
            hostvars['localhost']['_cleanup_all'] | bool
            or hostvars['localhost']['_cleanup_powerscale'] | bool

        - name: Cleanup PowerScale telemetry
          ansible.builtin.include_role:
            name: cleanup
            tasks_from: powerscale
          when: >-
            hostvars['localhost']['_cleanup_all'] | bool
            or hostvars['localhost']['_cleanup_powerscale'] | bool

        - name: Mark PowerScale cleanup as cleaned
          ansible.builtin.set_fact:
            _cleanup_active_component: ""
            _cleanup_component_results: >-
              {{
                hostvars['localhost']['_cleanup_component_results']
                | combine({'powerscale': 'cleaned'})
              }}
          delegate_to: localhost
          delegate_facts: true
          when: >-
            hostvars['localhost']['_cleanup_all'] | bool
            or hostvars['localhost']['_cleanup_powerscale'] | bool

        - name: Mark UFM cleanup as attempted
          ansible.builtin.set_fact:
            _cleanup_active_component: ufm
            _cleanup_component_results: >-
              {{
                hostvars['localhost']['_cleanup_component_results']
                | combine({'ufm': 'attempted'})
              }}
          delegate_to: localhost
          delegate_facts: true
          when: >-
            hostvars['localhost']['_cleanup_all'] | bool
            or hostvars['localhost']['_cleanup_ufm'] | bool

        - name: Cleanup UFM telemetry
          ansible.builtin.include_role:
            name: cleanup
            tasks_from: ufm
          when: >-
            hostvars['localhost']['_cleanup_all'] | bool
            or hostvars['localhost']['_cleanup_ufm'] | bool

        - name: Mark UFM cleanup as cleaned
          ansible.builtin.set_fact:
            _cleanup_active_component: ""
            _cleanup_component_results: >-
              {{
                hostvars['localhost']['_cleanup_component_results']
                | combine({'ufm': 'cleaned'})
              }}
          delegate_to: localhost
          delegate_facts: true
          when: >-
            hostvars['localhost']['_cleanup_all'] | bool
            or hostvars['localhost']['_cleanup_ufm'] | bool

        - name: Mark VAST cleanup as attempted
          ansible.builtin.set_fact:
            _cleanup_active_component: vast
            _cleanup_component_results: >-
              {{
                hostvars['localhost']['_cleanup_component_results']
                | combine({'vast': 'attempted'})
              }}
          delegate_to: localhost
          delegate_facts: true
          when: >-
            hostvars['localhost']['_cleanup_all'] | bool
            or hostvars['localhost']['_cleanup_vast'] | bool

        - name: Cleanup VAST telemetry
          ansible.builtin.include_role:
            name: cleanup
            tasks_from: vast
          when: >-
            hostvars['localhost']['_cleanup_all'] | bool
            or hostvars['localhost']['_cleanup_vast'] | bool

        - name: Mark VAST cleanup as cleaned
          ansible.builtin.set_fact:
            _cleanup_active_component: ""
            _cleanup_component_results: >-
              {{
                hostvars['localhost']['_cleanup_component_results']
                | combine({'vast': 'cleaned'})
              }}
          delegate_to: localhost
          delegate_facts: true
          when: >-
            hostvars['localhost']['_cleanup_all'] | bool
            or hostvars['localhost']['_cleanup_vast'] | bool

        # -- Pre-sink guard: verify source pods have terminated --
        - name: Mark source drain as attempted
          ansible.builtin.set_fact:
            _cleanup_active_component: source_drain
            _cleanup_component_results: >-
              {{
                hostvars['localhost']['_cleanup_component_results']
                | combine({'source_drain': 'attempted'})
              }}
          delegate_to: localhost
          delegate_facts: true
          when: hostvars['localhost']['_cleanup_all'] | bool

        - name: Wait for source pods to terminate before sink cleanup
          ansible.builtin.command: >
            kubectl get pods -n telemetry --no-headers --ignore-not-found
            -l {{ item }}
          loop:
            - app=idrac-telemetry
            - app=nersc-ldms
            - app=vector-ome
            - app=vector-ldms
            - app.kubernetes.io/name=karavi-metrics-powerscale
            - app.kubernetes.io/name=otel-collector
            - app=csi-volume-exporter
            - app=ufm-external
            - app=vast-external
            - app=skyway-telemetry
            - app=powervault-telemetry
          loop_control:
            label: "{{ item }}"
          register: _source_pod_drain
          changed_when: false
          until: _source_pod_drain.stdout | trim | length == 0
          retries: 12
          delay: 5
          when: hostvars['localhost']['_cleanup_all'] | bool

        - name: Mark source drain as cleaned
          ansible.builtin.set_fact:
            _cleanup_active_component: ""
            _cleanup_component_results: >-
              {{
                hostvars['localhost']['_cleanup_component_results']
                | combine({'source_drain': 'cleaned'})
              }}
          delegate_to: localhost
          delegate_facts: true
          when: hostvars['localhost']['_cleanup_all'] | bool

        # -- Sink cleanups (only on full cleanup — sinks are shared infrastructure) --
        - name: Mark Kafka cleanup as attempted
          ansible.builtin.set_fact:
            _cleanup_active_component: kafka
            _cleanup_component_results: >-
              {{
                hostvars['localhost']['_cleanup_component_results']
                | combine({'kafka': 'attempted'})
              }}
          delegate_to: localhost
          delegate_facts: true
          when: hostvars['localhost']['_cleanup_all'] | bool

        - name: Cleanup Kafka (full cleanup only)
          ansible.builtin.include_role:
            name: cleanup
            tasks_from: kafka
          when: hostvars['localhost']['_cleanup_all'] | bool

        - name: Mark Kafka cleanup as cleaned
          ansible.builtin.set_fact:
            _cleanup_active_component: ""
            _cleanup_component_results: >-
              {{
                hostvars['localhost']['_cleanup_component_results']
                | combine({'kafka': 'cleaned'})
              }}
          delegate_to: localhost
          delegate_facts: true
          when: hostvars['localhost']['_cleanup_all'] | bool

        - name: Mark VictoriaMetrics cleanup as attempted
          ansible.builtin.set_fact:
            _cleanup_active_component: victoria_metrics
            _cleanup_component_results: >-
              {{
                hostvars['localhost']['_cleanup_component_results']
                | combine({'victoria_metrics': 'attempted'})
              }}
          delegate_to: localhost
          delegate_facts: true
          when: hostvars['localhost']['_cleanup_all'] | bool

        - name: Cleanup VictoriaMetrics (full cleanup only)
          ansible.builtin.include_role:
            name: cleanup
            tasks_from: victoria_metrics
          vars:
            _cleanup_defer_victoria_operator: true
          when: hostvars['localhost']['_cleanup_all'] | bool

        - name: Mark VictoriaMetrics cleanup as cleaned
          ansible.builtin.set_fact:
            _cleanup_active_component: ""
            _cleanup_component_results: >-
              {{
                hostvars['localhost']['_cleanup_component_results']
                | combine({'victoria_metrics': 'cleaned'})
              }}
          delegate_to: localhost
          delegate_facts: true
          when: hostvars['localhost']['_cleanup_all'] | bool

        - name: Mark VictoriaLogs cleanup as attempted
          ansible.builtin.set_fact:
            _cleanup_active_component: victoria_logs
            _cleanup_component_results: >-
              {{
                hostvars['localhost']['_cleanup_component_results']
                | combine({'victoria_logs': 'attempted'})
              }}
          delegate_to: localhost
          delegate_facts: true
          when: hostvars['localhost']['_cleanup_all'] | bool

        - name: Cleanup VictoriaLogs (full cleanup only)
          ansible.builtin.include_role:
            name: cleanup
            tasks_from: victoria_logs
          when: hostvars['localhost']['_cleanup_all'] | bool

        - name: Mark VictoriaLogs cleanup as cleaned
          ansible.builtin.set_fact:
            _cleanup_active_component: ""
            _cleanup_component_results: >-
              {{
                hostvars['localhost']['_cleanup_component_results']
                | combine({'victoria_logs': 'cleaned'})
              }}
          delegate_to: localhost
          delegate_facts: true
          when: hostvars['localhost']['_cleanup_all'] | bool

      rescue:
        - name: Record component cleanup failure
          vars:
            _failed_component: >-
              {{
                hostvars['localhost']['_cleanup_active_component']
                | default('cleanup', true)
              }}
            _failed_children: >-
              {{
                (
                  ansible_failed_result.results | default([])
                  | selectattr('failed', 'defined')
                  | selectattr('failed', 'equalto', true)
                  | list
                )
                + (
                  ansible_failed_result.results | default([])
                  | selectattr('unreachable', 'defined')
                  | selectattr('unreachable', 'equalto', true)
                  | list
                )
              }}
            _failed_result: >-
              {{ (_failed_children | first) | default(ansible_failed_result, true) }}
            _failed_item: >-
              {%- set cleanup_item = _failed_result.item | default('') -%}
              {%- if cleanup_item is mapping and cleanup_item.item is defined -%}
              {%- set cleanup_item = cleanup_item.item -%}
              {%- endif -%}
              {%- if cleanup_item is mapping and cleanup_item.item is defined -%}
              {%- set cleanup_item = cleanup_item.item -%}
              {%- endif -%}
              {%- if cleanup_item is mapping and cleanup_item.item is defined -%}
              {%- set cleanup_item = cleanup_item.item -%}
              {%- endif -%}
              {%- if cleanup_item is mapping and cleanup_item.item is defined -%}
              {%- set cleanup_item = cleanup_item.item -%}
              {%- endif -%}
              {%- if cleanup_item is mapping and cleanup_item.type is defined
                    and cleanup_item.name is defined -%}
              {{ cleanup_item.type }}/{{ cleanup_item.name }}
              {%- elif cleanup_item is mapping and cleanup_item.type is defined
                    and cleanup_item.label is defined -%}
              {{ cleanup_item.type }} ({{ cleanup_item.label }})
              {%- elif cleanup_item is mapping and cleanup_item.item is defined -%}
              {{ cleanup_item.item }}
              {%- else -%}
              {{ cleanup_item }}
              {%- endif -%}
            _cleanup_failure_message: >-
              {{
                _failed_result.stderr
                | default(
                    _failed_result.stdout
                    | default(_failed_result.msg | default('Cleanup task failed'), true),
                    true
                  )
              }}
          ansible.builtin.set_fact:
            _cleanup_abort: true
            _cleanup_active_component: ""
            _cleanup_component_results: >-
              {{
                hostvars['localhost']['_cleanup_component_results']
                | combine({_failed_component: 'failed'})
              }}
            _cleanup_failures: >-
              {{
                hostvars['localhost']['_cleanup_failures']
                + [{
                    'component': _failed_component,
                    'task': ansible_failed_task.name | default('Unknown cleanup task'),
                    'host': inventory_hostname,
                    'item': (_failed_item | string)[:500],
                    'rc': _failed_result.rc | default(''),
                    'message': (_cleanup_failure_message | string)[:1000]
                  }]
              }}
          delegate_to: localhost
          delegate_facts: true

# ---------------------------------------------------------------------------
# Play 3: Final verification and summary
# ---------------------------------------------------------------------------
- name: "Telemetry Cleanup | Verification"
  hosts: kube_vip_group
  gather_facts: false
  tags:
    - cleanup
    - cleanup_idrac
    - cleanup_ldms
    - cleanup_ome
    - cleanup_powerscale
    - cleanup_ufm
    - cleanup_vast
    - cleanup_kafka
    - cleanup_victoria_metrics
    - cleanup_victoria_logs
  vars:
    telemetry_namespace: "telemetry"
  tasks:
    - name: Run final cleanup verification
      when:
        - not (hostvars['localhost']['_cleanup_abort'] | bool)
        - hostvars['localhost']['_cleanup_active_component'] | length == 0
      block:
        - name: Mark cleanup verification as attempted
          ansible.builtin.set_fact:
            _cleanup_verification_attempted: true
          delegate_to: localhost
          delegate_facts: true

        - name: Final verification | Count remaining pods
          ansible.builtin.command: >
            kubectl get pods -n {{ telemetry_namespace }} --no-headers --ignore-not-found
          register: remaining_pods
          changed_when: false
          until: >-
            not (hostvars['localhost']['_cleanup_all'] | bool)
            or remaining_pods.stdout_lines | default([])
               | map('trim') | reject('equalto', '') | list | length == 0
          retries: 12
          delay: 5

        - name: Final verification | Count remaining PVCs
          ansible.builtin.command: >
            kubectl get pvc -n {{ telemetry_namespace }} --no-headers --ignore-not-found
          register: remaining_pvcs
          changed_when: false
          until: >-
            not (hostvars['localhost']['_cleanup_all'] | bool)
            or not (hostvars['localhost']['_cleanup_delete_volume'] | bool)
            or remaining_pvcs.stdout_lines | default([])
               | map('trim') | reject('equalto', '') | list | length == 0
          retries: 12
          delay: 5

        - name: Final verification | Count remaining services
          ansible.builtin.command: >
            kubectl get svc -n {{ telemetry_namespace }} --no-headers --ignore-not-found
          register: remaining_svcs
          changed_when: false
          until: >-
            not (hostvars['localhost']['_cleanup_all'] | bool)
            or remaining_svcs.stdout_lines | default([])
               | map('trim') | reject('equalto', '') | list | length == 0
          retries: 12
          delay: 5

        - name: Final verification | Count remaining workloads
          ansible.builtin.command: >
            kubectl get deployment,statefulset,daemonset,job
            -n {{ telemetry_namespace }} --no-headers --ignore-not-found
          register: remaining_workloads
          changed_when: false
          until: >-
            not (hostvars['localhost']['_cleanup_all'] | bool)
            or remaining_workloads.stdout_lines | default([])
               | map('trim') | reject('equalto', '') | list | length == 0
          retries: 12
          delay: 5

        - name: Final verification | Count remaining Helm releases
          ansible.builtin.command:
            argv:
              - helm
              - list
              - --namespace
              - "{{ telemetry_namespace }}"
              - --all
              - --short
          register: remaining_helm_releases
          changed_when: false
          until: >-
            remaining_helm_releases.stdout_lines | default([])
            | map('trim') | reject('equalto', '') | list | length == 0
          retries: 12
          delay: 5
          when: hostvars['localhost']['_cleanup_all'] | bool

        - name: Final verification | Confirm requested PVC deletion
          vars:
            _remaining_pvc_count: >-
              {{
                remaining_pvcs.stdout_lines | default([])
                | map('trim') | reject('equalto', '') | list | length
              }}
          ansible.builtin.assert:
            that:
              - _remaining_pvc_count | int == 0
            fail_msg: >-
              Full telemetry cleanup requested PVC deletion but left
              {{ _remaining_pvc_count }} PVC(s) in the telemetry namespace.
          when:
            - hostvars['localhost']['_cleanup_all'] | bool
            - hostvars['localhost']['_cleanup_delete_volume'] | bool

        - name: Final verification | Confirm full cleanup removed resources
          vars:
            _remaining_pod_count: >-
              {{
                remaining_pods.stdout_lines | default([])
                | map('trim') | reject('equalto', '') | list | length
              }}
            _remaining_service_count: >-
              {{
                remaining_svcs.stdout_lines | default([])
                | map('trim') | reject('equalto', '') | list | length
              }}
            _remaining_workload_count: >-
              {{
                remaining_workloads.stdout_lines | default([])
                | map('trim') | reject('equalto', '') | list | length
              }}
            _remaining_helm_release_count: >-
              {{
                remaining_helm_releases.stdout_lines | default([])
                | map('trim') | reject('equalto', '') | list | length
              }}
          ansible.builtin.assert:
            that:
              - _remaining_pod_count | int == 0
              - _remaining_service_count | int == 0
              - _remaining_workload_count | int == 0
              - _remaining_helm_release_count | int == 0
            fail_msg: >-
              Full telemetry cleanup left {{ _remaining_pod_count }} pod(s),
              {{ _remaining_service_count }} service(s),
              {{ _remaining_workload_count }} workload(s), and
              {{ _remaining_helm_release_count }} Helm release(s) in the telemetry namespace.
          when: hostvars['localhost']['_cleanup_all'] | bool

        - name: Mark cleanup verification as completed
          ansible.builtin.set_fact:
            _cleanup_verification_attempted: false
          delegate_to: localhost
          delegate_facts: true

      rescue:
        - name: Record cleanup verification failure
          vars:
            _cleanup_failure_message: >-
              {{
                ansible_failed_result.stderr
                | default(
                    ansible_failed_result.stdout
                    | default(
                        ansible_failed_result.msg | default('Cleanup verification failed'),
                        true
                      ),
                    true
                  )
              }}
          ansible.builtin.set_fact:
            _cleanup_abort: true
            _cleanup_verification_attempted: false
            _cleanup_volume_verification_failed: >-
              {{
                hostvars['localhost']['_cleanup_volume_verification_failed'] | default(false) | bool
                or (
                  hostvars['localhost']['_cleanup_delete_volume'] | bool
                  and (ansible_failed_task.name | default('')) in
                    [
                      'Final verification | Count remaining PVCs',
                      'Final verification | Confirm requested PVC deletion'
                    ]
                )
              }}
            _cleanup_failures: >-
              {{
                hostvars['localhost']['_cleanup_failures']
                + [{
                    'component': 'verification',
                    'task': ansible_failed_task.name | default('Final cleanup verification'),
                    'host': inventory_hostname,
                    'rc': ansible_failed_result.rc | default(''),
                    'message': (_cleanup_failure_message | string)[:1000]
                  }]
              }}
          delegate_to: localhost
          delegate_facts: true

- name: "Telemetry Cleanup | Summary"
  hosts: localhost
  connection: local
  gather_facts: false
  tags:
    - cleanup
    - cleanup_idrac
    - cleanup_ldms
    - cleanup_ome
    - cleanup_powerscale
    - cleanup_ufm
    - cleanup_vast
    - cleanup_kafka
    - cleanup_victoria_metrics
    - cleanup_victoria_logs
  tasks:
    - name: Normalize interrupted component cleanup
      vars:
        _interrupted_component: "{{ _cleanup_active_component | default('') }}"
      ansible.builtin.set_fact:
        _cleanup_abort: true
        _cleanup_active_component: ""
        _cleanup_component_results: >-
          {{
            _cleanup_component_results
            | combine({_interrupted_component: 'failed'})
          }}
        _cleanup_failures: >-
          {{
            _cleanup_failures
            + [{
                'component': _interrupted_component,
                'task': 'Component execution',
                'host': kube_vip | default('unknown'),
                'rc': '',
                'message': 'Cleanup execution was interrupted or the target host became unreachable'
              }]
          }}
      when:
        - _interrupted_component | length > 0
        - _cleanup_component_results[_interrupted_component] | default('') == 'attempted'

    - name: Normalize interrupted cleanup verification
      ansible.builtin.set_fact:
        _cleanup_abort: true
        _cleanup_verification_attempted: false
        _cleanup_volume_verification_failed: >-
          {{
            (_cleanup_volume_verification_failed | default(false) | bool)
            or (_cleanup_delete_volume | bool)
          }}
        _cleanup_failures: >-
          {{
            _cleanup_failures
            + [{
                'component': 'verification',
                'task': 'Final cleanup verification',
                'host': kube_vip | default('unknown'),
                'rc': '',
                'message': 'Cleanup verification was interrupted or the target host became unreachable'
              }]
          }}
      when: _cleanup_verification_attempted | default(false) | bool

    - name: Write telemetry_status.yml with cleanup status
      ansible.builtin.include_role:
        name: common
        tasks_from: write_cleanup_status

    - name: Display cleanup resource summary
      vars:
        kube_vip_host: "{{ kube_vip | default('unknown') }}"
        _kube_hostvars: >-
          {{ hostvars[kube_vip] | default({}) if kube_vip is defined else {} }}
        _pods_lines: >-
          {{
            (_kube_hostvars.remaining_pods | default({})).stdout_lines
            | default([]) | map('trim') | reject('equalto', '') | list
          }}
        _pvcs_lines: >-
          {{
            (_kube_hostvars.remaining_pvcs | default({})).stdout_lines
            | default([]) | map('trim') | reject('equalto', '') | list
          }}
        _svcs_lines: >-
          {{
            (_kube_hostvars.remaining_svcs | default({})).stdout_lines
            | default([]) | map('trim') | reject('equalto', '') | list
          }}
        _workload_lines: >-
          {{
            (_kube_hostvars.remaining_workloads | default({})).stdout_lines
            | default([]) | map('trim') | reject('equalto', '') | list
          }}
        _helm_release_lines: >-
          {{
            (_kube_hostvars.remaining_helm_releases | default({})).stdout_lines
            | default([]) | map('trim') | reject('equalto', '') | list
          }}
        _pod_count: "{{ _pods_lines | length }}"
        _pvc_count: "{{ _pvcs_lines | length }}"
        _svc_count: "{{ _svcs_lines | length }}"
        _workload_count: "{{ _workload_lines | length }}"
        _helm_release_count: "{{ _helm_release_lines | length }}"
        _helm_release_display: >-
          {{
            _helm_release_count
            if _cleanup_all | bool
            else 'not checked for granular cleanup'
          }}
        _pvc_status_display: >-
          {{ _cleanup_volume_status | default('preserved') }}
      ansible.builtin.debug:
        msg:
          - "======================================================"
          - "Telemetry Cleanup Resource Summary"
          - "======================================================"
          - "Target Host: {{ kube_vip_host }}"
          - ""
          - "Remaining pods:     {{ _pod_count }}"
          - >-
            Namespace PVCs: {{ _pvc_count }}
            (selected component volume cleanup: {{ _pvc_status_display }})
          - "Remaining services: {{ _svc_count }}"
          - "Remaining workloads: {{ _workload_count }}"
          - "Remaining Helm releases: {{ _helm_release_display }}"
          - "======================================================"
          - ""
          - "Deleting the telemetry namespace also deletes preserved PVC objects."
      when:
        - _cleanup_status != 'failed'
        - _kube_hostvars.remaining_pods is defined
        - _kube_hostvars.remaining_pvcs is defined
        - _kube_hostvars.remaining_svcs is defined

    - name: Fail telemetry cleanup after status is written
      vars:
        _failed_components: >-
          {{ _cleanup_failures | map(attribute='component') | unique | list }}
      ansible.builtin.fail:
        msg: >-
          Telemetry cleanup failed in {{ _failed_components | join(', ') }}.
          Status was written to {{ _output_base }}/telemetry_status.yml.
      when: _cleanup_status == 'failed'
