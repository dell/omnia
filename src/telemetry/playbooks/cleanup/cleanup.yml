# =============================================================================
# Telemetry Cleanup Playbook
# =============================================================================
# Removes telemetry components and all associated K8s resources.
#
# Usage:
#   # Cleanup ALL telemetry components
#   ansible-playbook telemetry.yml --tags cleanup
#
#   # Cleanup specific components
#   ansible-playbook telemetry.yml --tags cleanup_powerscale
#   ansible-playbook telemetry.yml --tags cleanup_ome
#   ansible-playbook telemetry.yml --tags cleanup_kafka
#   ansible-playbook telemetry.yml --tags cleanup_victoria_metrics
#   ansible-playbook telemetry.yml --tags cleanup_victoria_logs
#   ansible-playbook telemetry.yml --tags cleanup_idrac
#   ansible-playbook telemetry.yml --tags cleanup_ldms
#
#   # Cleanup multiple components
#   ansible-playbook telemetry.yml --tags cleanup_kafka,cleanup_powerscale
#
# Resource ownership:
#   OME cleanup includes Vector-OME bridge resources
#   LDMS cleanup includes Vector-LDMS bridge resources
#   VictoriaMetrics cleanup includes vmagent-vector (VM write-buffer)
#   VictoriaLogs cleanup includes vlagent-vector (VL write-buffer)
# =============================================================================

# ---------------------------------------------------------------------------
# Play 1: Prerequisites — Load config, resolve kube_vip
# ---------------------------------------------------------------------------
- name: "Telemetry Cleanup | Prerequisites"
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Load telemetry configuration
      ansible.builtin.include_role:
        name: common
        tasks_from: load_telemetry_config

    - name: Validate kube_vip is set
      ansible.builtin.assert:
        that:
          - kube_vip is defined
          - kube_vip | length > 0
        fail_msg: >
          kube_vip is required. Add 'kube_vip: <VIP_IP>' to telemetry_config.yml.

    - name: Add kube_vip to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ kube_vip }}"
        groups: kube_vip_group
        ansible_user: root

    - name: Derive cleanup scope from run tags
      ansible.builtin.set_fact:
        _cleanup_all: "{{ 'cleanup' in ansible_run_tags }}"
        _cleanup_idrac: "{{ 'cleanup_idrac' in ansible_run_tags }}"
        _cleanup_ldms: "{{ 'cleanup_ldms' in ansible_run_tags }}"
        _cleanup_ome: "{{ 'cleanup_ome' in ansible_run_tags }}"
        _cleanup_powerscale: "{{ 'cleanup_powerscale' in ansible_run_tags }}"
        _cleanup_kafka: "{{ 'cleanup_kafka' in ansible_run_tags }}"
        _cleanup_victoria_metrics: "{{ 'cleanup_victoria_metrics' in ansible_run_tags }}"
        _cleanup_victoria_logs: "{{ 'cleanup_victoria_logs' in ansible_run_tags }}"
        cacheable: true

# ---------------------------------------------------------------------------
# Play 2: Component cleanups (conditional on run tags)
# ---------------------------------------------------------------------------
- name: "Telemetry Cleanup | Remove selected components"
  hosts: kube_vip_group
  gather_facts: false
  vars_files:
    - ../../vars/cleanup.yml
  tasks:
    # -- Source cleanups --
    - name: "Cleanup iDRAC telemetry"
      ansible.builtin.include_tasks: sources/cleanup_idrac_tasks.yml
      when: hostvars['localhost']['_cleanup_all'] | bool or hostvars['localhost']['_cleanup_idrac'] | bool

    - name: "Cleanup LDMS telemetry (includes Vector-LDMS bridge)"
      ansible.builtin.include_tasks: sources/cleanup_ldms_tasks.yml
      when: hostvars['localhost']['_cleanup_all'] | bool or hostvars['localhost']['_cleanup_ldms'] | bool

    - name: "Cleanup OME telemetry (includes Vector-OME bridge)"
      ansible.builtin.include_tasks: sources/cleanup_ome_tasks.yml
      when: hostvars['localhost']['_cleanup_all'] | bool or hostvars['localhost']['_cleanup_ome'] | bool

    - name: "Cleanup PowerScale telemetry"
      ansible.builtin.include_tasks: sources/cleanup_powerscale_tasks.yml
      when: hostvars['localhost']['_cleanup_all'] | bool or hostvars['localhost']['_cleanup_powerscale'] | bool

    # -- Sink cleanups --
    - name: "Cleanup Kafka"
      ansible.builtin.include_tasks: sinks/cleanup_kafka_tasks.yml
      when: hostvars['localhost']['_cleanup_all'] | bool or hostvars['localhost']['_cleanup_kafka'] | bool

    - name: "Cleanup VictoriaMetrics"
      ansible.builtin.include_tasks: sinks/cleanup_victoria_metrics_tasks.yml
      when: hostvars['localhost']['_cleanup_all'] | bool or hostvars['localhost']['_cleanup_victoria_metrics'] | bool

    - name: "Cleanup VictoriaLogs"
      ansible.builtin.include_tasks: sinks/cleanup_victoria_logs_tasks.yml
      when: hostvars['localhost']['_cleanup_all'] | bool or hostvars['localhost']['_cleanup_victoria_logs'] | bool

# ---------------------------------------------------------------------------
# Play 3: Final verification and summary
# ---------------------------------------------------------------------------
- name: "Telemetry Cleanup | Verification"
  hosts: kube_vip_group
  gather_facts: false
  vars:
    telemetry_namespace: "telemetry"
  tasks:
    - name: "Final verification | Check remaining pods"
      ansible.builtin.command: >
        kubectl get pods -n {{ telemetry_namespace }}
      register: remaining_pods
      changed_when: false
      failed_when: false

    - name: "Final verification | Check remaining PVCs"
      ansible.builtin.command: >
        kubectl get pvc -n {{ telemetry_namespace }}
      register: remaining_pvcs
      changed_when: false
      failed_when: false

    - name: "Final verification | Check remaining services"
      ansible.builtin.command: >
        kubectl get svc -n {{ telemetry_namespace }}
      register: remaining_svcs
      changed_when: false
      failed_when: false

- name: "Telemetry Cleanup | Summary"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Display cleanup summary
      vars:
        kube_vip_host: "{{ kube_vip }}"
        remaining_pods_output: "{{ hostvars[kube_vip_host]['remaining_pods']['stdout'] | default('No resources found') }}"
        remaining_pvcs_output: "{{ hostvars[kube_vip_host]['remaining_pvcs']['stdout'] | default('No resources found') }}"
        remaining_svcs_output: "{{ hostvars[kube_vip_host]['remaining_svcs']['stdout'] | default('No resources found') }}"
      ansible.builtin.debug:
        msg:
          - "======================================================"
          - "Telemetry Cleanup Complete"
          - "======================================================"
          - "Target Host: {{ kube_vip_host }}"
          - ""
          - "Remaining pods:"
          - "{{ remaining_pods_output }}"
          - ""
          - "Remaining PVCs:"
          - "{{ remaining_pvcs_output }}"
          - ""
          - "Remaining services:"
          - "{{ remaining_svcs_output }}"
          - "======================================================"
          - ""
          - "To delete the entire namespace:"
          - "  kubectl delete namespace telemetry"
