# =============================================================================
# Telemetry Cleanup Playbook
# =============================================================================
# Removes telemetry workloads and configuration while preserving PVCs by default.
#
# Usage:
#   # Cleanup ALL telemetry components (sources + sinks)
#   ansible-playbook telemetry.yml --tags cleanup
#   # Delete sink PVCs as well (PVCs are preserved by default)
#   ansible-playbook telemetry.yml --tags cleanup -e Delete_sinks_volume=true
#
#   # Preserve credentials for redeployment
#   ansible-playbook telemetry.yml --tags cleanup -e cleanup_credentials=false
#   # Preserve both credentials and logs
#   ansible-playbook telemetry.yml --tags cleanup -e cleanup_credentials=false -e cleanup_logs=false
#
#   # Cleanup specific sources only
#   ansible-playbook telemetry.yml --tags cleanup_powerscale
#   ansible-playbook telemetry.yml --tags cleanup_ome
#   ansible-playbook telemetry.yml --tags cleanup_idrac
#   ansible-playbook telemetry.yml --tags cleanup_ldms
#
#   # Granular cleanup preserving credentials
#   ansible-playbook telemetry.yml --tags cleanup_idrac -e cleanup_credentials=false
#
#   # Cleanup multiple sources
#   ansible-playbook telemetry.yml --tags cleanup_ome,cleanup_powerscale
#
#   # Selective sink cleanup (with dependency checking)
#   ansible-playbook telemetry.yml --tags cleanup_sinks -e sinks=kafka
#   ansible-playbook telemetry.yml --tags cleanup_sinks -e sinks=kafka,victoria_metrics
#   ansible-playbook telemetry.yml --tags cleanup_sinks -e sinks=victoria_logs
#   ansible-playbook telemetry.yml --tags cleanup_sinks  # default: all sinks
#   # Short-form: individual -e flags (equivalent to -e sinks=...)
#   ansible-playbook telemetry.yml --tags cleanup_sinks -e kafka
#   ansible-playbook telemetry.yml --tags cleanup_sinks -e kafka -e victoria_logs
#   # Delete sink volumes during selective cleanup
#   ansible-playbook telemetry.yml --tags cleanup_sinks -e sinks=kafka -e Delete_sinks_volume=true
#
#   # Cleanup via orchestrator (all components)
#   ansible-playbook telemetry.yml --tags cleanup
#
# Available tags:
#   Sinks:   cleanup_sinks (with -e sinks=kafka,victoria_metrics,victoria_logs
#            or short-form -e kafka -e victoria_metrics -e victoria_logs)
#   Sources: cleanup_idrac, cleanup_ldms, cleanup_ome, cleanup_powerscale,
#            cleanup_ufm, cleanup_vast
# Design: Sinks (Kafka, VictoriaMetrics, VictoriaLogs) are shared
# infrastructure. Selective sink cleanup (cleanup_sinks) checks for running
# dependent sources before removing any sink. If ANY requested sink is blocked
# by a running source, the entire selective cleanup is aborted and NO sinks
# are cleaned. Full cleanup (cleanup) drains sources first and then removes
# all sinks unconditionally.
#
# Resource ownership:
#   OME cleanup includes Vector-OME bridge resources
#   LDMS cleanup includes Vector-LDMS bridge resources
#   cleanup (all) includes sinks + vmagent-vector + vlagent-vector
# =============================================================================

# ---------------------------------------------------------------------------
# Play 1: Prerequisites — Load config, resolve kube_vip
# ---------------------------------------------------------------------------
- name: "Telemetry Cleanup | Prerequisites"
  hosts: localhost
  connection: local
  gather_facts: false
  tags:
    - cleanup
    - cleanup_sinks
    - cleanup_idrac
    - cleanup_ldms
    - cleanup_ome
    - cleanup_powerscale
    - cleanup_ufm
    - cleanup_vast
  tasks:
    - name: Initialize telemetry cleanup
      ansible.builtin.include_role:
        name: cleanup
        tasks_from: initialize

# ---------------------------------------------------------------------------
# Play 2: Component cleanups (conditional on run tags)
# ---------------------------------------------------------------------------
- name: "Telemetry Cleanup | Remove selected components"
  hosts: kube_vip_group
  gather_facts: false
  tags:
    - cleanup
    - cleanup_sinks
    - cleanup_idrac
    - cleanup_ldms
    - cleanup_ome
    - cleanup_powerscale
    - cleanup_ufm
    - cleanup_vast
  tasks:
    - name: Execute selected telemetry cleanup
      ansible.builtin.include_role:
        name: cleanup
        tasks_from: execute

# ---------------------------------------------------------------------------
# Play 3: Final verification and summary
# ---------------------------------------------------------------------------
- name: "Telemetry Cleanup | Verification"
  hosts: kube_vip_group
  gather_facts: false
  tags:
    - cleanup
    - cleanup_sinks
    - cleanup_idrac
    - cleanup_ldms
    - cleanup_ome
    - cleanup_powerscale
    - cleanup_ufm
    - cleanup_vast
  vars:
    telemetry_namespace: "telemetry"
  tasks:
    - name: Verify telemetry cleanup
      ansible.builtin.include_role:
        name: cleanup
        tasks_from: verify

- name: "Telemetry Cleanup | Summary"
  hosts: localhost
  connection: local
  gather_facts: false
  tags:
    - cleanup
    - cleanup_sinks
    - cleanup_idrac
    - cleanup_ldms
    - cleanup_ome
    - cleanup_powerscale
    - cleanup_ufm
    - cleanup_vast
  tasks:
    - name: Finalize telemetry cleanup
      ansible.builtin.include_role:
        name: cleanup
        tasks_from: finalize
