# =============================================================================
# DCGM Telemetry Cleanup
# =============================================================================
# Removes DCGM Exporter DaemonSet/Deployment, services, configmaps, and pods.
#
# Standalone usage:
#   ansible-playbook cleanup/sources/cleanup_dcgm.yml
#
# Via main cleanup (tag-based):
#   ansible-playbook cleanup/cleanup.yml --tags cleanup_dcgm
# =============================================================================

- name: "Cleanup DCGM Telemetry"
  hosts: kube_vip_group
  gather_facts: false
  vars_files:
    - ../../../vars/cleanup.yml
  tasks:
    - name: "DCGM | Delete resources"
      ansible.builtin.command: >
        kubectl -n {{ telemetry_namespace }} delete {{ item.type }} {{ item.name }}
        --ignore-not-found=true --wait=false
      loop: "{{ dcgm_resources }}"
      loop_control:
        label: "{{ item.type }}/{{ item.name }}"
      changed_when: false
      failed_when: false

    - name: "DCGM | Force delete pods"
      ansible.builtin.command: >
        kubectl -n {{ telemetry_namespace }} delete pod -l {{ dcgm_pod_label }}
        --grace-period={{ cleanup_resource_grace_period }} --force --ignore-not-found=true
      changed_when: false
      failed_when: false

    - name: "DCGM | Cleanup complete"
      ansible.builtin.debug:
        msg: "DCGM telemetry cleanup completed"
