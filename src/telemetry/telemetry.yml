# =============================================================================
# Telemetry Stack Deployment Entry Point
# =============================================================================
# Usage:
#   ansible-playbook telemetry.yml   --tags <tag_name>
#                 # <tag_name> can be precheck, validation, cleanup, deploy, upgrade, roolback
#                 # precheck environment for telemetry - precheck
#                 # input validation of telemetry configuration - validation
#                 # cleanup telemetry - cleanup
#                 # Deploy all enabled/disabled telemetry based on tag - deploy
#                 # upgrade telemetry - upgrade
#                 # rollback telemetry - rollback
#
# Configuration is read from telemetry/input/telemetry_config.yml:
#   - kube_vip: K8s control plane VIP (required)
#   - bmc_group_data_path: Path to BMC inventory CSV for iDRAC telemetry
#   - telemetry_sources.<source>.metrics_enabled: true/false per source
#
# Only sources with metrics_enabled: true are deployed.
# All K8s tasks (kubectl, helm) execute on the kube_vip host via SSH.
# =============================================================================

# ---------------------------------------------------------------------------
# Precheck — import before deploy plays so --tags precheck works
# ---------------------------------------------------------------------------
- ansible.builtin.import_playbook: playbooks/precheck.yml
  tags: [precheck]

# ---------------------------------------------------------------------------
# Validation — L1 + L2 input validation for all 3 telemetry input files
# ---------------------------------------------------------------------------
- ansible.builtin.import_playbook: playbooks/validation.yml
  tags: [validation]

# Play 1: Bootstrap — load telemetry config, derive flags, resolve kube_vip
- name: "Telemetry bootstrap: load config and resolve kube_vip target"
  hosts: localhost
  connection: ssh
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - name: Load telemetry configuration
      ansible.builtin.include_role:
        name: common
        tasks_from: load_telemetry_config

    - name: Derive sink support flags
      ansible.builtin.include_role:
        name: common
        tasks_from: derive_sink_support_flags

    - name: Collect telemetry credentials
      ansible.builtin.include_role:
        name: collect_telemetry_credentials

    - name: Set bmc_group_data_path from idrac_telemetry_configurations (for iDRAC)
      ansible.builtin.set_fact:
        bmc_group_data_path: "{{ telemetry_config.idrac_telemetry_configurations.bmc_group_data_path }}"
      when: telemetry_config.idrac_telemetry_configurations.bmc_group_data_path is defined

    - name: Validate kube_vip is set
      ansible.builtin.assert:
        that:
          - kube_vip is defined
          - kube_vip | length > 0
        fail_msg: >
          kube_vip is required. Add 'kube_vip: <VIP_IP>' to telemetry_config.yml.

    - name: Add kube_vip to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ kube_vip }}"
        groups: kube_vip_group
        ansible_user: root

    - name: Display kube_vip target
      ansible.builtin.debug:
        msg: "Telemetry tasks will execute on kube_vip: {{ kube_vip }}"

# Play 2: Deploy telemetry components on kube_vip (conditionally based on config)
- name: "Deploy telemetry components"
  hosts: kube_vip_group
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - name: Set telemetry credentials from localhost
      ansible.builtin.set_fact:
        telemetry_credentials: "{{ hostvars['localhost']['telemetry_credentials'] }}"
      no_log: true
      when: hostvars['localhost']['telemetry_credentials'] is defined

    - name: Deploy Kafka (shared infrastructure)
      ansible.builtin.include_role:
        name: deploy_kafka
      when: hostvars['localhost']['kafka_support'] | default(false) | bool

    - name: Deploy VictoriaMetrics (shared metrics infrastructure)
      ansible.builtin.include_role:
        name: deploy_victoria
        tasks_from: metrics/tasks/main
      when: hostvars['localhost']['victoria_metrics_support'] | default(false) | bool

    - name: Deploy VictoriaLogs (shared logs infrastructure)
      ansible.builtin.include_role:
        name: deploy_victoria
        tasks_from: logs/tasks/main
      when: hostvars['localhost']['victoria_logs_support'] | default(false) | bool

    - name: Enable or Disable iDRAC Telemetry
      block:
        - name: Enable iDRAC Telemetry
          ansible.builtin.include_role:
            name: enable_idrac_telemetry
          when: hostvars['localhost']['telemetry_config'].telemetry_sources.idrac.metrics_enabled | default(false) | bool

        - name: Disable iDRAC Telemetry (scale down to 0)
          ansible.builtin.include_role:
            name: disable_idrac_telemetry
          when: not (hostvars['localhost']['telemetry_config'].telemetry_sources.idrac.metrics_enabled | default(false) | bool)

    - name: Enable LDMS Telemetry
      ansible.builtin.include_role:
        name: enable_ldms
      when: hostvars['localhost']['telemetry_config'].telemetry_sources.ldms.metrics_enabled | default(false) | bool

    - name: Scale down Kafka if no sources need it
      when: not (hostvars['localhost']['kafka_support'] | default(false) | bool)
      ansible.builtin.include_role:
        name: disable_kafka

    - name: Scale down VictoriaMetrics if no sources need it
      when: not (hostvars['localhost']['victoria_metrics_support'] | default(false) | bool)
      ansible.builtin.include_role:
        name: disable_victoria
