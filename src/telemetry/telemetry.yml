# =============================================================================
# Telemetry Stack Deployment Entry Point
# =============================================================================
# Usage:
#   ansible-playbook telemetry.yml --tags <tag_name>
#
# Tags (standard domain tags):
#   precheck   - Precheck environment for telemetry
#   validate   - Input validation of telemetry configuration (alias: validation)
#   cleanup    - Cleanup telemetry
#   execute    - Deploy all enabled telemetry (alias: deploy)
#   upgrade    - Upgrade telemetry
#   rollback   - Rollback telemetry
#
#   Cleanup examples:
#     ansible-playbook telemetry.yml --tags cleanup                    # all components
#     ansible-playbook telemetry.yml --tags cleanup_kafka              # kafka only
#     ansible-playbook telemetry.yml --tags cleanup_victoria_metrics   # VM only (includes vmagent-vector)
#     ansible-playbook telemetry.yml --tags cleanup_victoria_logs      # VL only (includes vlagent-vector)
#     ansible-playbook telemetry.yml --tags cleanup_ldms               # LDMS only (includes vector-ldms)
#     ansible-playbook telemetry.yml --tags cleanup_ome                # OME only (includes vector-ome)
#     ansible-playbook telemetry.yml --tags cleanup_dcgm               # DCGM only
#     ansible-playbook telemetry.yml --tags cleanup_ufm                # UFM only
#     ansible-playbook telemetry.yml --tags cleanup_vast               # VAST only
#     ansible-playbook telemetry.yml --tags cleanup_sfm                # SFM only
#     ansible-playbook telemetry.yml --tags cleanup_skyway             # Skyway only
#     ansible-playbook telemetry.yml --tags cleanup_powervault         # PowerVault only
#     ansible-playbook telemetry.yml --tags cleanup_kafka,cleanup_victoria_metrics  # kafka + VM
#
# Configuration is read from telemetry/input/telemetry_config.yml:
#   - kube_vip: K8s control plane VIP (required)
#   - bmc_group_data_path: Path to BMC inventory CSV for iDRAC telemetry
#   - telemetry_sources.<source>.metrics_enabled: true/false per source
#
# Only sources with metrics_enabled: true are deployed.
# All K8s tasks (kubectl, helm) execute on the kube_vip host via SSH.
# =============================================================================

# ---------------------------------------------------------------------------
# Validation — L1 + L2 input validation for all 3 telemetry input files
# ---------------------------------------------------------------------------
- name: "Validation | Validate telemetry input files"
  ansible.builtin.import_playbook: playbooks/validation.yml
  tags: [validate, validation]

# ---------------------------------------------------------------------------
# Precheck — import before deploy plays so --tags precheck works
# ---------------------------------------------------------------------------
- name: "Precheck | Validate telemetry prerequisites"
  ansible.builtin.import_playbook: playbooks/precheck.yml
  tags: [precheck]

# Deploy / Execute: Deploy all telemetry sources
- name: "Execute | Deploy all telemetry sources"
  ansible.builtin.import_playbook: playbooks/deploy.yml
  tags: [execute, deploy]

# ---------------------------------------------------------------------------
# Cleanup — tag-based cleanup of telemetry components
# ---------------------------------------------------------------------------
# Tagged with 'never' to prevent running by default (only when explicitly
# called with --tags cleanup or component-specific tags like --tags cleanup_kafka).
# Each component import in cleanup.yml has its own tag (cleanup_kafka,
# cleanup_victoria_metrics, etc.) so --tags cleanup runs all cleanups while
# --tags cleanup_kafka runs only Kafka cleanup.
- name: "Cleanup | Remove telemetry components"
  ansible.builtin.import_playbook: playbooks/cleanup.yml
  tags: [cleanup, never]

# Upgrade: Upgrade telemetry components
# Tagged with 'never' to prevent running by default (only when explicitly
# called with --tags upgrade or component-specific upgrade tags).
- name: "Upgrade | Upgrade telemetry components"
  ansible.builtin.import_playbook: playbooks/upgrade.yml
  tags: [upgrade, never]

# Rollback: Rollback telemetry components
# Tagged with 'never' to prevent running by default (only when explicitly
# called with --tags rollback or component-specific rollback tags).
- name: "Rollback | Rollback telemetry components"
  ansible.builtin.import_playbook: playbooks/rollback.yml
  tags: [rollback, never]

# ---------------------------------------------------------------------------
# Summary — Display telemetry status file location
# ---------------------------------------------------------------------------
- name: "Summary | Display telemetry deployment status location"
  hosts: localhost
  gather_facts: false
  vars_files:
    - roles/common/vars/main.yml
  tags: [deploy, upgrade, rollback]
  tasks:
    - name: Display telemetry status file location
      ansible.builtin.debug:
        msg:
          - "╔══════════════════════════════════════════════════════════════════════════╗"
          - "║              TELEMETRY DEPLOYMENT STATUS                                 ║"
          - "╚══════════════════════════════════════════════════════════════════════════╝"
          - ""
          - "Deployment status has been saved to:"
          - "  {{ playbook_dir }}/output/telemetry_status.yml"
          - ""
          - "View the file to see detailed deployment state and results for all components."
          - ""
          - "╚══════════════════════════════════════════════════════════════════════════╝"
