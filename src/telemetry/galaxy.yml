---
namespace: omnia
name: telemetry
version: 2.3.0
readme: README.md
authors:
  - Dell Technologies <omnia-support@dell.com>
description: >-
  Dell Omnia Telemetry — deploys and manages a telemetry stack for HPC and AI
  clusters. Supports VictoriaMetrics, VictoriaLogs, Kafka (Strimzi), LDMS,
  iDRAC, UFM, OME, PowerScale, and VAST
  telemetry sources with tag-based deployment and cleanup.
license:
  - Apache-2.0
tags:
  - infrastructure
  - hpc
  - telemetry
  - monitoring
  - victoriametrics
  - kafka
  - ldms
  - dell
  - omnia
dependencies:
  community.general: ">=5.0.0"
  containers.podman: ">=1.10.0"
repository: https://github.com/dell/omnia
documentation: https://github.com/dell/omnia/tree/main/docs
homepage: https://github.com/dell/omnia
issues: https://github.com/dell/omnia/issues
build_ignore:
  - "*.tar.gz"
  - "*.cfg"
  - .gitignore
  - Makefile
  - __pycache__
  - "**/__pycache__"
  - ansible_collections
  - ansible_collections/*
  - containers
  - containers/*
  - input
  - input/*
