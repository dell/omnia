# ***********************************************************************
# DO NOT REMOVE OR COMMENT OUT ANY LINES IN THIS FILE.
# SIMPLY APPEND THE REQUIRED VALUES AGAINST THE PARAMETER OF YOUR CHOICE.
# ***********************************************************************

#### Mandatory
# This depicts the path where user has kept the PXE mapping file.
# The mapping file consists of the Service tag, Admin MAC,Hostname and its respective admin IP address and/or BMC IP.
# Ensure that admin IPs given in mapping file are within the network defined in the network_spec.yml
# A templates for mapping file exists in omnia/examples, namely, pxe_mapping_file.csv
# Format of csv: FUNCTIONAL_GROUP_NAME,GROUP_NAME,SERVICE_TAG,HOSTNAME,ADMIN_MAC,ADMIN_IP,BMC_MAC,BMC_IP
pxe_mapping_file_path: "/opt/omnia/orchestrator/input/project_default/pxe_mapping_file.csv"

#### Mandatory
# Language that needs to be set during OS provisioning.
# Only language supported is "en_US.UTF-8"
language: "en_US.UTF-8"

#### Mandatory
# Default lease time needs to be used by DHCP
# Unit: seconds
# Min: 21600
# Default: 86400
# Max: 31536000
default_lease_time: "86400"

#### Optional
# Enable DNS-based hostname resolution for compute nodes.
# When true, nodes use coresmd (CoreDNS + OpenCHAMI SMD plugin) instead of /etc/hosts.
# DNS records are generated automatically from SMD inventory.
# The cluster domain is read from OIM metadata (domain_name).
# Default: false
dns_enabled: false

#### Optional
# Pin a specific kernel version for boot image selection.
# The specified version applies to both x86_64 and aarch64 architectures.
# Leave empty ("") to auto-select the latest available image from S3.
# Example: kernel_version_override: "6.12.0-55.76.1.el10_0"
kernel_version_override: ""

#### Optional
# Path to additional cloud-init configuration file for stateless node provisioning.
# The file supports both common (all nodes) and per-functional-group cloud-init sections.
# An example file is provided at omnia/examples/additional_cloud_init.yml
# Leave empty ("") to disable additional cloud-init.
# Default: "" (disabled)
additional_cloud_init_config_file: ""

#### Optional
# Additional kernel command-line parameters appended to the boot-service
# boot configuration for all functional groups.
# These are passed to the kernel during PXE/HTTP boot of stateless nodes.
# Use this to set driver options, debugging flags, or site-specific tunables.
# Example: boot_kernel_params: "crashkernel=auto audit=1 numa=off"
# Default: "" (no additional parameters)
boot_kernel_params: ""

#### Optional
# Path to the catalog JSON file produced by repo_manager.
# Contains functionallayer, groups, and package definitions used to derive
# feature flags (k8s, slurm, openldap, etc.) and OS metadata.
# Default: "/opt/omnia/catalog/catalog_rhel.json" (from CATALOG_FILE_PATH env)
catalog_file_path: ""

#### Optional
# Enable PXE boot support via iDRAC (default: true)
# Set to true for physical (bare-metal) servers with Dell iDRAC.
# Set to false for virtual machines or environments without iDRAC/BMC.
# When false, the setpxe flow (--tags setpxe) is skipped with a message.
# Default: true
enable_pxe_boot: true

image_build_manager_output_path: "/opt/omnia/image_build_manager/output/project_default/build_status.yml"

#### Optional
# Path to repo_status.yml produced by repo_manager.
# Contains RPM repo URLs, Pulp certificate paths, and offline content paths
# consumed by k8s_config, slurm_config, and cloud-init templates.
# Default: "/opt/omnia/repo_manager/output/project_default/repo_status.yml"
repo_manager_output_path: "/opt/omnia/repo_manager/output/project_default/repo_status.yml"

#### Optional
# Enable NVIDIA DCGM (Data Center GPU Manager) installation on GPU nodes.
# DCGM is part of the CUDA toolkit and provides GPU monitoring and management capabilities.
# When enabled, DCGM will be installed on Slurm compute nodes with NVIDIA GPUs.
# Default: true
dcgm_enabled: true
