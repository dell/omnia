# -----------------------------------------------------------------------------
# Functional Group Configuration
# -----------------------------------------------------------------------------
# Per-functional-group boot and cloud-init customization.
#
# This file is optional. When it is absent, or when a group has no entry, Omnia
# applies its built-in defaults, which are equivalent to standard Slurm-node
# behavior.
#
# Resolution order for every value:
#
#     groups.<exact-functional-group-name>   (most specific)
#         -> common
#             -> Omnia default
#
# An empty value ("" or []) means "inherit from the next level down". It does
# NOT mean "set to empty". There is no way to clear an inherited value in this
# release.
#
# Group keys MUST be exact PXE functional-group names as they appear in
# pxe_mapping_file.csv. Prefixes and patterns are not supported.
#
# LEGACY INPUTS
# -------------
# orchestrator_config.yml `additional_cloud_init_config_file` cannot be combined
# with cloud_init.config_file or post_config values here, and the deprecated
# orchestrator_config.yml `boot_kernel_params` cannot be combined with
# boot_kernel_params values here. A legacy value is used only while the
# corresponding values in this file are empty. The shipped all-empty template
# is inactive and does not create a conflict.
#
# Catalog authority: the catalog/build status remains authoritative for group
# identity, platform, and software. A group `image_override` replaces the
# kernel, initrd, and rootfs together; precheck requires all three objects to
# exist and be accessible at the image-storage endpoint before provisioning.
# -----------------------------------------------------------------------------

# Defaults applied to every functional group unless a group overrides them.
common:
  # Kernel parameters appended to the boot configuration. Platform-managed
  # parameters (root, ip, ip6, rd.live.image, rd.live.ram, rd.neednet, console,
  # ds, selinux, apparmor, ...) and quotes/backslashes/control characters are
  # rejected. Example: "crashkernel=auto audit=1"
  boot_kernel_params: ""

  cloud_init:
    # Absolute path to a file in this project's input directory
    # ($ORCHESTRATOR_DATA_PATH/input/<project>/) containing a YAML mapping with
    # only write_files and/or runcmd. It is published as literal content (no
    # Jinja evaluation on the OIM) in addition to the Omnia-generated
    # cloud-init. Empty string adds nothing.
    config_file: ""

  # Ordered write_files/runcmd mappings appended after cloud_init.config_file.
  # Same mapping shape as additional_cloud_init.yml common/group sections.
  post_config: []

# Per-functional-group overrides, keyed by exact PXE functional-group name.
# image_override is group-only: leave it {} to use Image Build Manager output,
# or set all of kernel, initrd, and rootfs as object keys relative to the
# image-storage endpoint (no scheme, leading "/", or "..").
#
# Example:
#
# groups:
#   research_ctl_rhel_10_0_x86_64:
#     boot_kernel_params: "crashkernel=auto audit=1 numa=off"
#     cloud_init:
#       config_file: "<ORCHESTRATOR_DATA_PATH>/input/<project>/research-ctl-cloud-init-x86_64.yml"
#     post_config: []
#     image_override:
#       kernel: "boot-images/research-ctl/vmlinuz-x86_64"
#       initrd: "boot-images/research-ctl/initramfs-x86_64.img"
#       rootfs: "boot-images/research-ctl/rootfs-x86_64.squashfs"
#
#   research_node_rhel_10_0_aarch64:
#     boot_kernel_params: ""          # inherits common
#     cloud_init:
#       config_file: ""               # inherits common, then Omnia default
#     post_config: []
#     image_override: {}
groups: {}
