---
# Reference input for standalone Orchestrator testing.
# Repo Manager is the canonical producer. Prefer its generated output:
#   <REPO_MANAGER_DATA_PATH>/output/<project>/repo_status.yml
# Edit all example URLs and certificate paths before using this file.

overall_status: "success"
cluster_os_type: "rhel"
repo_config: "partial"

repo_manager:
  port: 2225
  certificates:
    server_crt: "/opt/omnia/repo_manager/pulp_config/settings/certs/pulp_webserver.crt"
    server_key: "/opt/omnia/repo_manager/pulp_config/settings/certs/pulp_webserver.key"
    certs_dir: "/opt/omnia/repo_manager/pulp_config/settings/certs"

repositories:
  "10.0":
    x86_64:
      baseos:
        url: "https://192.0.2.10:2225/pulp/content/example/rpms/baseos/"
        priority: 100
      appstream:
        url: "https://192.0.2.10:2225/pulp/content/example/rpms/appstream/"
        priority: 100
    aarch64:
      baseos:
        url: "https://192.0.2.10:2225/pulp/content/example/aarch64/rpms/baseos/"
        priority: 100
      appstream:
        url: "https://192.0.2.10:2225/pulp/content/example/aarch64/rpms/appstream/"
        priority: 100

file_repos:
  x86_64:
    git:
      example_git: "https://192.0.2.10:2225/pulp/content/example/git/example/"
    tarball:
      example_tarball: "https://192.0.2.10:2225/pulp/content/example/tarball/example/"
    manifest:
      example_manifest: "https://192.0.2.10:2225/pulp/content/example/manifest/example/"
    pip_module:
      example_module: "https://192.0.2.10:2225/pypi/example/pip_module/example/"
    shell:
      example_script: "https://192.0.2.10:2225/pulp/content/example/shell/example/"
    iso:
      example_iso: "https://192.0.2.10:2225/pulp/content/example/iso/example/"
    ansible_galaxy_collection:
      example_collection: "https://192.0.2.10:2225/pulp/content/example/ansible_galaxy_collection/example/"
  aarch64: {}

tarball_base_url: "https://192.0.2.10:2225/pulp/content/example/tarball/example/"
manifest_base_url: "https://192.0.2.10:2225/pulp/content/example/manifest/example/"
pip_base_url: "https://192.0.2.10:2225/pypi/example/pip_module/example/"
git_base_url: "https://192.0.2.10:2225/pulp/content/example/git/example/"

offline_tarball_path: "https://192.0.2.10:2225/pulp/content/example/tarball/example/"
offline_manifest_path: "https://192.0.2.10:2225/pulp/content/example/manifest/example/"
offline_pip_module_path: "https://192.0.2.10:2225/pypi/example/pip_module/example/"
offline_git_path: "https://192.0.2.10:2225/pulp/content/example/git/example/"
offline_shell_path: "https://192.0.2.10:2225/pulp/content/example/shell/example/"
offline_iso_path: "https://192.0.2.10:2225/pulp/content/example/iso/example/"
offline_ansible_galaxy_collection_path: "https://192.0.2.10:2225/pulp/content/example/ansible_galaxy_collection/example/"
