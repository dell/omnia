---

# Step 1: Validate credential files
- name: Include credential validation
  ansible.builtin.include_tasks: validate_credentials.yml

# Step 2: Create credential files if missing
- name: Include credential creation
  ansible.builtin.include_tasks: create_credentials.yml

# Step 3: Update credentials (prompt, encrypt)
- name: Include credential update
  ansible.builtin.include_tasks: update_credentials_main.yml
