---
# Prompt for a single orchestrator credential field.
# Called from main.yml for mandatory and conditionally mandatory credentials.
# A conditionally mandatory username/password pair may be skipped by pressing
# Enter when required=false. Supplying a username makes its password required.

# Determine if a prompt is needed. Missing values and stored values that no
# longer satisfy the current rules both use the normal confirmed update flow.
- name: Reset prompt flags
  ansible.builtin.set_fact:
    _need_username: false
    _need_password: false
    _stored_username_invalid: false
    _stored_password_invalid: false
    _credential_required: "{{ cred_field.required | default(true) | bool }}"

- name: Check if username prompt is needed
  ansible.builtin.set_fact:
    _need_username: true
  when:
    - cred_field.username is defined
    - orchestrator_loaded_creds[cred_field.username] | default('') | string | length == 0

- name: Check if password prompt is needed
  ansible.builtin.set_fact:
    _need_password: true
  when:
    - cred_field.password is defined
    - orchestrator_loaded_creds[cred_field.password] | default('') | string | length == 0

- name: Validate stored username against credential rules
  validate_credentials:
    credential_field: "{{ cred_field.username }}"
    credential_input: "{{ orchestrator_loaded_creds[cred_field.username] }}"
    module_utils_path: "{{ module_utils_path }}"
    fail_on_invalid: false
  register: _stored_username_validation
  no_log: true
  when:
    - cred_field.username is defined
    - not (_need_username | bool)

- name: Prompt again when the stored username is invalid
  ansible.builtin.set_fact:
    _need_username: true
    _stored_username_invalid: true
  when:
    - cred_field.username is defined
    - not (_need_username | bool)
    - not (_stored_username_validation.valid | default(false) | bool)

- name: Validate stored password against credential rules
  validate_credentials:
    credential_field: "{{ cred_field.password }}"
    credential_input: "{{ orchestrator_loaded_creds[cred_field.password] }}"
    module_utils_path: "{{ module_utils_path }}"
    fail_on_invalid: false
  register: _stored_password_validation
  no_log: true
  when:
    - cred_field.password is defined
    - not (_need_password | bool)

- name: Prompt again when the stored password is invalid
  ansible.builtin.set_fact:
    _need_password: true
    _stored_password_invalid: true
  when:
    - cred_field.password is defined
    - not (_need_password | bool)
    - not (_stored_password_validation.valid | default(false) | bool)

- name: Report stored credentials that require replacement
  ansible.builtin.debug:
    msg: >-
      Stored credentials for
      {{ cred_field.username | default(cred_field.password) }} do not meet the
      current validation rules and must be entered again.
  when: >-
    (_stored_username_invalid | bool) or
    (_stored_password_invalid | bool)

- name: Skip prompt for stored credentials
  ansible.builtin.debug:
    msg: "Credentials already stored for {{ cred_field.username | default(cred_field.password) }} — skipping prompt."
  when: not (_need_username | bool) and not (_need_password | bool)

# Prompt username if needed
- name: Prompt for username
  when:
    - cred_field.username is defined
    - _need_username | default(false) | bool
  block:
    - name: Fetch validation rule for username
      fetch_credential_rule:
        credential_field: "{{ cred_field.username }}"
        module_utils_path: "{{ module_utils_path }}"
      register: _username_credential_rule

    - name: "Prompt for [{{ cred_field.username | default(cred_field.password) }}]" # noqa name[template]
      ansible.builtin.pause:
        prompt: >-
          [Orchestrator] Enter
          {{ cred_field.username | default(cred_field.password) }}.
          {{ _username_credential_rule.msg }}
      no_log: true
      register: _username_input

    - name: Validate username is not empty for mandatory credential
      ansible.builtin.fail:
        msg: "{{ mandatory_warning_msg }} {{ cred_field.username }} cannot be empty."
      when:
        - _credential_required | bool
        - _username_input.user_input | length == 0

    - name: Validate username against credential rules
      validate_credentials:
        credential_field: "{{ cred_field.username }}"
        credential_input: "{{ _username_input.user_input }}"
        module_utils_path: "{{ module_utils_path }}"
      no_log: true
      when: _username_input.user_input | length > 0

# Prompt password if needed
- name: Prompt for password
  when:
    - cred_field.password is defined
    - _need_password | default(false) | bool
    - >-
      _credential_required | bool or
      (_username_input.user_input |
       default(orchestrator_loaded_creds[cred_field.username] | default('')) |
       string | length > 0)
  block:
    - name: Fetch validation rule for password
      fetch_credential_rule:
        credential_field: "{{ cred_field.password }}"
        module_utils_path: "{{ module_utils_path }}"
      register: _password_credential_rule

    - name: "Prompt for [{{ cred_field.password }}]" # noqa name[template]
      ansible.builtin.pause:
        prompt: >-
          [Orchestrator] Enter {{ cred_field.password }}.
          {{ _password_credential_rule.msg }}
        echo: false
      no_log: true
      register: _password_input

    - name: Validate password is not empty for mandatory credential
      ansible.builtin.fail:
        msg: "{{ password_fail_msg }}"
      when: _password_input.user_input | length == 0

    - name: Validate password against credential rules
      validate_credentials:
        credential_field: "{{ cred_field.password }}"
        credential_input: "{{ _password_input.user_input }}"
        module_utils_path: "{{ module_utils_path }}"
      no_log: true
      when: _password_input.user_input | length > 0

    - name: "Confirm [{{ cred_field.password }}]" # noqa name[template]
      ansible.builtin.pause:
        prompt: "[Orchestrator] Confirm {{ cred_field.password }}"
        echo: false
      no_log: true
      register: _password_confirm

    - name: Ensure passwords match
      ansible.builtin.fail:
        msg: "{{ password_match_fail_msg }}"
      when: _password_input.user_input != _password_confirm.user_input

# Update credential file
- name: Update credential file with new values
  when: >-
    (_username_input.user_input | default('') | length > 0) or
    (_password_input.user_input | default('') | length > 0)
  block:
    - name: Check if credential file is vault-encrypted before update
      ansible.builtin.shell: |
        set -o pipefail
        head -n1 "{{ credential_files[0].file_path }}" | grep -q '^\$ANSIBLE_VAULT;'
      register: _update_is_vault
      changed_when: false
      failed_when: false

    - name: Decrypt for update
      ansible.builtin.command: >-
        ansible-vault decrypt "{{ credential_files[0].file_path }}"
        --vault-password-file "{{ credential_files[0].vault_path }}"
      changed_when: false
      failed_when: false
      register: _update_decrypt_result
      when: _update_is_vault.rc | default(1) == 0

    - name: Fail if decrypt failed before credential update
      ansible.builtin.fail:
        msg: "{{ credential_encrypt_fail_msg }} Decrypt returned rc={{ _update_decrypt_result.rc | default('N/A') }}"
      when:
        - _update_is_vault.rc | default(1) == 0
        - _update_decrypt_result.rc | default(0) != 0

    - name: Update username in credential file
      ansible.builtin.lineinfile:
        path: "{{ credential_files[0].file_path }}"
        regexp: "^{{ cred_field.username }}:"
        line: >-
          {{ cred_field.username }}: {{ _username_input.user_input | to_json }}
      no_log: true
      when:
        - cred_field.username is defined
        - _need_username | default(false) | bool
        - _username_input.user_input | default('') | length > 0
        - _update_decrypt_result.rc | default(0) == 0

    - name: Update password in credential file
      ansible.builtin.lineinfile:
        path: "{{ credential_files[0].file_path }}"
        regexp: "^{{ cred_field.password }}:"
        line: >-
          {{ cred_field.password }}: {{ _password_input.user_input | to_json }}
      no_log: true
      when:
        - cred_field.password is defined
        - _need_password | default(false) | bool
        - _password_input.user_input | default('') | length > 0
        - _update_decrypt_result.rc | default(0) == 0

    - name: Reload credentials after update
      ansible.builtin.include_vars:
        file: "{{ credential_files[0].file_path }}"
        name: orchestrator_loaded_creds
      no_log: true

    - name: Re-encrypt after update
      ansible.builtin.command: >-
        ansible-vault encrypt "{{ credential_files[0].file_path }}"
        --vault-password-file "{{ credential_files[0].vault_path }}"
      changed_when: false

  rescue:
    - name: Encrypt credential file on failure
      ansible.builtin.shell: |
        set -o pipefail
        if [ -f "{{ credential_files[0].file_path }}" ]; then
          if ! head -n1 "{{ credential_files[0].file_path }}" | grep -q '\$ANSIBLE_VAULT;'; then
            ansible-vault encrypt "{{ credential_files[0].file_path }}" \
              --vault-password-file "{{ credential_files[0].vault_path }}"
          fi
        fi
      changed_when: false

    - name: Fail with cleanup message
      ansible.builtin.fail:
        msg: "{{ credential_encrypt_fail_msg }}"
