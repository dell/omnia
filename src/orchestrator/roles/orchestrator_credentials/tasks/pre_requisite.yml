---
# pre_requisite.yml — Verify catalog-derived feature flags are available for
# credential prompting. Feature flags are set by orchestrator_setup from the
# catalog file. No software_config.json loading is needed.

- name: Verify catalog-derived feature flags are available
  ansible.builtin.assert:
    that:
      - service_k8s_support is defined
      - openldap_support is defined
      - csi_driver_powerscale_support is defined
    fail_msg: >-
      Feature flags not available. Ensure orchestrator_setup has loaded the
      catalog file before running credential collection.
    quiet: true
