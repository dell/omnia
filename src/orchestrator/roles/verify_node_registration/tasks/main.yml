---
# This role runs once for each host in the dynamic node_registration_targets
# group. Ansible connects to those nodes in parallel and the node-local module
# returns structured boot and cloud-init state without shell-output parsing.

- name: "[Node-Registration] Validate per-node verification context"
  ansible.builtin.assert:
    that:
      - hostvars['localhost']['pxe_start_epoch'] is defined
      - hostvars['localhost']['pxe_start_epoch'] | string | length > 0
      - bmc_ip is defined
      - bmc_ip | string | length > 0
    fail_msg: "{{ verify_node_registration_fail_msg }}"

- name: "[Node-Registration] Poll fresh boot and cloud-init state"
  node_boot_status:
    pxe_start_epoch: "{{ hostvars['localhost']['pxe_start_epoch'] }}"
  register: verify_node_registration_poll_result
  until:
    - not (verify_node_registration_poll_result.unreachable | default(false) | bool)
    - verify_node_registration_poll_result.terminal | default(false) | bool
  retries: "{{ hostvars['localhost']['node_registration_retries'] }}"
  delay: "{{ hostvars['localhost']['node_registration_delay'] }}"
  changed_when: false
  failed_when: false
  ignore_errors: true
  ignore_unreachable: true

- name: "[Node-Registration] Record structured node result"
  ansible.builtin.set_fact:
    verify_node_registration_result:
      admin_ip: "{{ inventory_hostname }}"
      bmc_ip: "{{ bmc_ip }}"
      xname: "{{ xname | default('') }}"
      hostname: "{{ hostname_node | default('') }}"
      service_tag: "{{ service_tag | default('') }}"
      status: "{{ 'success' if _node_state == 'success' else 'failed' }}"
      state: "{{ _node_state }}"
      detail: "{{ _node_detail }}"
      terminal: "{{ verify_node_registration_poll_result.terminal | default(false) | bool }}"
      attempts: "{{ verify_node_registration_poll_result.attempts | default(1) }}"
      verification_method: ssh_cloud_init
      cloud_init: "{{ verify_node_registration_poll_result.cloud_init | default({}) }}"
  vars:
    _node_state: >-
      {{ verify_node_registration_poll_result.state
         | default('unreachable'
                   if verify_node_registration_poll_result.unreachable | default(false) | bool
                   else 'verification_result_missing') }}
    _node_detail: >-
      {{ verify_node_registration_poll_result.detail
         | default('Passwordless root SSH failed on ' ~ inventory_hostname ~ ': ' ~
                   (verify_node_registration_poll_result.msg | default('no SSH error was returned'))
                   if verify_node_registration_poll_result.unreachable | default(false) | bool
                   else 'Node-registration verification did not return a result') }}

- name: "[Node-Registration] Display node result"
  ansible.builtin.debug:
    msg: >-
      {{ verify_node_registration_status_ok
         if verify_node_registration_result.status == 'success'
         else verify_node_registration_status_failed }}
      {{ inventory_hostname }} — {{ verify_node_registration_result.detail }}
