---
# Node-registration verification messages and patterns
# Timing configuration is loaded from input/pxe_config.yml by the playbook

# Status messages
verify_node_registration_status_ok: "OK Node boot verified:"
verify_node_registration_status_failed: "FAILED Node boot verification:"

# Error messages
verify_node_registration_fail_msg: |
  FATAL: Required facts missing for node-registration verification.
  pxe_start_epoch = {{ hostvars['localhost']['pxe_start_epoch'] | default('UNDEFINED') }}
  admin_ip = {{ inventory_hostname | default('UNDEFINED') }}
  bmc_ip = {{ bmc_ip | default('UNDEFINED') }}
  Ensure facts are set correctly.
