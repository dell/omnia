---

- name: Ensure firewalld is running
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true

# -------------------------------------------------------------------
# Host-facing ports — only services that external clients need
# -------------------------------------------------------------------
- name: Open TCP ports for external access
  ansible.posix.firewalld:
    port: "{{ item }}/tcp"
    permanent: true
    state: enabled
  loop: "{{ tcp_ports }}"

- name: Open UDP ports for PXE/DHCP/TFTP
  ansible.posix.firewalld:
    port: "{{ item }}/udp"
    permanent: true
    state: enabled
  loop: "{{ udp_ports }}"

- name: Open DNS ports for CoreDNS
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    state: enabled
  loop:
    - 53/tcp
    - 53/udp

# -------------------------------------------------------------------
# Podman container bridge isolation (CWE-284 / CWE-923 remediation)
#
# Previously, podman interfaces were added to the firewalld "trusted"
# zone which bypasses ALL filtering.  We now create a dedicated
# "podman" zone that only permits the specific flows containers need
# for outbound connectivity and inter-container communication.
# -------------------------------------------------------------------
- name: Create dedicated podman firewalld zone
  ansible.builtin.command: firewall-cmd --permanent --new-zone=podman
  register: podman_zone_create
  changed_when: "'ALREADY_ENABLED' not in podman_zone_create.stderr"
  failed_when:
    - podman_zone_create.rc != 0
    - "'NAME_CONFLICT' not in podman_zone_create.stderr"

- name: Remove podman interfaces from trusted zone (remediate CWE-284)
  ansible.posix.firewalld:
    interface: "{{ item }}"
    zone: trusted
    permanent: true
    state: disabled
  loop: "{{ podman_interfaces }}"

- name: Assign podman interfaces to dedicated podman zone
  ansible.posix.firewalld:
    interface: "{{ item }}"
    zone: podman
    permanent: true
    state: enabled
  loop: "{{ podman_interfaces }}"

- name: Allow required TCP ports in podman zone
  ansible.posix.firewalld:
    port: "{{ item }}/tcp"
    zone: podman
    permanent: true
    state: enabled
  loop: "{{ podman_zone_tcp_ports }}"

- name: Allow required UDP ports in podman zone
  ansible.posix.firewalld:
    port: "{{ item }}/udp"
    zone: podman
    permanent: true
    state: enabled
  loop: "{{ podman_zone_udp_ports }}"

- name: Enable masquerading in podman zone for container outbound traffic
  ansible.posix.firewalld:
    zone: podman
    masquerade: true
    permanent: true
    state: enabled

- name: Reload firewalld to apply changes
  ansible.builtin.command: firewall-cmd --reload
  changed_when: true
