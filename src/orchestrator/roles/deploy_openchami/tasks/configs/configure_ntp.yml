---
# configure_ntp.yml — Configure the OIM as an NTP server for cluster nodes.
#
# The OIM acts as the NTP server (cluster_boot_ip) for all cluster nodes.
# chrony denies incoming NTP queries by default; without explicit allow
# directives the cluster nodes fail to synchronise time, which breaks Slurm
# job scheduling, LDAP/Kerberos authentication, and TLS certificate validation.
#
# This task file:
#   1. Assembles allow directives for the primary admin subnet and every
#      additional subnet defined in network_spec.yml.
#   2. Writes /etc/chrony.conf on the OIM with those directives appended to
#      the existing (or distro-default) configuration so that any upstream NTP
#      servers configured by the administrator are preserved.
#   3. Restarts chronyd to apply the changes.
#
# UDP 123 (NTP) is opened by firewall.yml via the udp_ports list in vars/main.yml.

- name: Build primary admin network CIDR for chrony allow
  ansible.builtin.set_fact:
    _ntp_primary_cidr: "{{ network_data.admin_network.subnet }}/{{ network_data.admin_network.netmask_bits }}"

- name: Build additional subnet CIDRs for chrony allow
  ansible.builtin.set_fact:
    _ntp_additional_cidrs: >-
      {{ network_data.admin_network.additional_subnets | default([])
         | map(attribute='subnet') | zip(
             network_data.admin_network.additional_subnets | default([])
             | map(attribute='netmask_bits') | map('string')
           )
         | map('join', '/')
         | list }}

- name: Assemble full list of subnets to allow NTP access from
  ansible.builtin.set_fact:
    _ntp_allow_cidrs: "{{ ([_ntp_primary_cidr] + _ntp_additional_cidrs) | unique | list }}"

- name: Configure chrony on OIM to serve time to cluster nodes
  ansible.builtin.blockinfile:
    path: "{{ chrony_conf_path }}"
    create: true
    mode: "0644"
    marker: "# {mark} OMNIA MANAGED NTP ALLOW BLOCK"
    block: |
      {% for cidr in _ntp_allow_cidrs %}
      allow {{ cidr }}
      {% endfor %}
  notify: Restart chronyd
