---
# metadata-service and boot-service get a TokenSmith refresh token that expires
# 24 h after they start, and the OpenCHAMI RPM does not renew it. Restarting
# them issues a new one, so a timer restarts them well inside that lifetime.

- name: Install OpenCHAMI service token renewal units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ openchami_systemd_unit_dir }}/{{ item }}"
    mode: "{{ file_permissions_644 }}"
  loop:
    - "{{ openchami_token_renewal_service }}"
    - "{{ openchami_token_renewal_timer }}"
  notify: Renew OpenCHAMI service tokens

- name: Enable OpenCHAMI service token renewal timer
  ansible.builtin.systemd_service:
    name: "{{ openchami_token_renewal_timer }}"
    enabled: true
    state: started
    daemon_reload: true
