---

# Ensure the read-only account that LDAP clients bind with exists and accepts
# the password stored in the credential vault. All operations use StartTLS
# with certificate verification; passwords are passed only through private
# files that are removed afterwards.

- name: Ensure the read-only LDAP bind account
  vars:
    admin_dn: "cn={{ openldap_db_username }},{{ ldap_search_base }}"
    bind_account_dn: "cn={{ openldap_bind_username }},{{ bind_account_ou }},{{ ldap_search_base }}"
    _bind_ldap_env:
      - podman
      - exec
      - -e
      - "LDAPTLS_CACERT=/etc/openldap/certs/{{ ldap_tls_ca_file if ldap_tls_ca_file | length > 0 else tls_cert_file }}"
      - -e
      - LDAPTLS_REQCERT=demand
      - "{{ omnia_auth_container_name }}"
    _bind_ldap_conn: [-x, -ZZ, -H, "ldap://{{ ldap_server_ip }}"]
  block:
    - name: Wait for OpenLDAP to answer
      ansible.builtin.command:
        argv: [podman, exec, "{{ omnia_auth_container_name }}", ldapwhoami, -x, -H, "ldap://127.0.0.1:389"]
      register: _bind_slapd_ready
      retries: "{{ healthcheck_retries }}"
      delay: "{{ healthcheck_delay }}"
      until: _bind_slapd_ready.rc == 0
      changed_when: false

    - name: Create private temp directory for bind account secrets
      ansible.builtin.tempfile:
        state: directory
        path: "{{ slapd_reconcile_tmp_dir }}"
        prefix: ".omnia_bind_"
      register: _bind_tmp
      changed_when: false

    - name: Write admin and bind account password files
      ansible.builtin.copy:
        content: "{{ item.secret }}"
        dest: "{{ _bind_tmp.path }}/{{ item.name }}"
        owner: root
        group: root
        mode: "0600"
      loop:
        - { name: admin.pw, secret: "{{ openldap_db_password }}" }
        - { name: bind.pw, secret: "{{ openldap_bind_password }}" }
      loop_control:
        label: "{{ item.name }}"
      changed_when: false
      no_log: true

    - name: Copy password files into the container
      ansible.builtin.command:
        argv: [podman, cp, "{{ _bind_tmp.path }}/.", "{{ omnia_auth_container_name }}:{{ bind_secret_container_dir }}"]
      changed_when: false

    - name: Check whether the bind account accepts the stored password
      ansible.builtin.command:
        argv: >-
          {{ _bind_ldap_env + ['ldapwhoami'] + _bind_ldap_conn
             + ['-D', bind_account_dn, '-y', bind_secret_container_dir ~ '/bind.pw'] }}
      register: _bind_check
      changed_when: false
      failed_when: _bind_check.rc not in [0, 49]

    - name: Create or reset the bind account
      when: _bind_check.rc != 0
      block:
        - name: Create the service account container and bind account entry
          ansible.builtin.command:
            argv: >-
              {{ ['podman', 'exec', '-i'] + _bind_ldap_env[2:] + ['ldapadd', '-c'] + _bind_ldap_conn
                 + ['-D', admin_dn, '-y', bind_secret_container_dir ~ '/admin.pw'] }}
            stdin: "{{ lookup('ansible.builtin.template', 'bind_account.ldif.j2') }}"
          register: _bind_add
          changed_when: _bind_add.rc == 0
          failed_when: _bind_add.rc not in [0, 68]

        - name: Set the bind account password
          ansible.builtin.command:
            argv: >-
              {{ _bind_ldap_env + ['ldappasswd'] + _bind_ldap_conn
                 + ['-D', admin_dn, '-y', bind_secret_container_dir ~ '/admin.pw',
                    '-T', bind_secret_container_dir ~ '/bind.pw', bind_account_dn] }}
          changed_when: true

        - name: Verify the bind account accepts the stored password
          ansible.builtin.command:
            argv: >-
              {{ _bind_ldap_env + ['ldapwhoami'] + _bind_ldap_conn
                 + ['-D', bind_account_dn, '-y', bind_secret_container_dir ~ '/bind.pw'] }}
          changed_when: false

  rescue:
    - name: Report bind account failure
      ansible.builtin.fail:
        msg: "{{ bind_account_failed_msg }}"

  always:
    - name: Remove password files from the container
      ansible.builtin.command:
        argv: [podman, exec, "{{ omnia_auth_container_name }}", rm, -rf, "{{ bind_secret_container_dir }}"]
      changed_when: false
      failed_when: false

    - name: Remove the private temp directory
      ansible.builtin.file:
        path: "{{ _bind_tmp.path }}"
        state: absent
      when: _bind_tmp.path is defined
      changed_when: false
