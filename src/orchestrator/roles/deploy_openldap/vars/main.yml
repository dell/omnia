---

# Container image
omnia_auth_image: "docker.io/dellhpcomniaaisolution/omnia_auth"
omnia_auth_tag: "1.2"
omnia_auth_container_name: "omnia_auth"

# Numeric ids of the unprivileged ldap user inside the omnia_auth image
# (Containerfile ARG LDAP_UID/LDAP_GID). The container is rootful, so these ids
# are shared with the OIM; the group gets read access to slapd.conf and the TLS key.
auth_ldap_uid: 55
auth_ldap_gid: 55
auth_ldap_group: "ldap"

# Optional TLS trust inputs for the omnia_auth entrypoint (default: unset).
# ldap_tls_ca_file: file name of a CA certificate placed in auth/tls_certs; required
# when ldapserver.crt is issued by a separate CA instead of being self-signed.
# ldap_tls_cert_sha256: SHA-256 fingerprint the mounted certificate must match.
ldap_tls_ca_file: ""
ldap_tls_cert_sha256: ""

# A deployed slapd.conf that proxies to another directory (database meta or ldap)
# is kept as is. Pass -e openldap_force_reconcile=true to replace it with the
# local configuration rendered by this role.
openldap_force_reconcile: false

# Directory paths
auth_base_dir: "{{ hostvars['localhost']['omnia_data_path'] }}/auth"
auth_config_dir: "{{ auth_base_dir }}/config"
auth_certs_dir: "{{ auth_base_dir }}/tls_certs"
auth_data_dir: "{{ auth_base_dir }}/data"
auth_init_dir: "{{ auth_base_dir }}/init"

# Quadlet directory for systemd container units
quadlet_dir: "/etc/containers/systemd"

# OpenLDAP ports
ldap_port: 389
ldaps_port: 636

# TLS certificate settings
tls_cert_days: 3650
tls_key_bits: 4096
tls_cert_file: "ldapserver.crt"
tls_key_file: "ldapserver.key"
tls_cert_min_validity_seconds: 86400

# Image pull settings
pull_retries: 3
pull_delay: 10

# Service readiness
healthcheck_retries: 10
healthcheck_delay: 5

# slapd.conf reconciliation for a running container
slapd_reconcile_tmp_dir: "/dev/shm"
slapd_candidate_container_path: "/dev/shm/slapd.conf.candidate"

# Read-only account that LDAP clients (sssd) bind with:
# cn=<openldap_bind_username>,<bind_account_ou>,<search base>.
# provision_common and the openldap role build the same DN.
bind_account_ou: "ou=ServiceAccounts"
# tmpfs inside the container, so the password files never reach its disk layer
bind_secret_container_dir: "/dev/shm/.omnia_bind"

# Error messages
deploy_openldap_fail_msg: "Failed to deploy OpenLDAP container. Check the logs for details."
credentials_missing_msg: >-
  OpenLDAP credentials (openldap_db_username, openldap_db_password,
  openldap_bind_username, openldap_bind_password) are required, and the bind
  password must differ from the admin password. Run orchestrator.yml to be
  prompted for credentials.
bind_account_external_proxy_msg: >-
  slapd.conf proxies to another LDAP directory, so the read-only bind account
  (cn=<openldap_bind_username>,ou=ServiceAccounts,<base>) was not created here.
  Create it in that directory, or LDAP clients cannot look up users.
bind_account_failed_msg: >-
  The read-only LDAP bind account could not be created or updated in omnia_auth.
  Check that omnia_auth is running and that the admin credentials in
  orchestrator_credentials.yml match the directory.
tls_cert_invalid_msg: >-
  The OpenLDAP TLS certificate under auth/tls_certs is unusable: it must parse, stay valid for at least
  24 hours, list the LDAP server IP in subjectAltName, and match ldapserver.key. Fix or replace the certificate and key, then rerun.
slapd_conf_update_failed_msg: >-
  Updated slapd.conf could not be applied to the running omnia_auth container.
  The previous slapd.conf was kept or restored. Check slaptest output and journalctl -u omnia_auth.
slapd_conf_external_proxy_msg: >-
  The deployed slapd.conf proxies to another LDAP directory, so it was kept and
  not replaced by the local configuration. Its ownership is still set to root:ldap 0640.
  To replace it with the local configuration, rerun with -e openldap_force_reconcile=true.
ldap_tls_ca_missing_msg: >-
  ldap_tls_ca_file is set but the CA certificate was not found in auth/tls_certs.
  Place the CA certificate there (file name must match ldap_tls_ca_file), or unset
  ldap_tls_ca_file when ldapserver.crt is self-signed, then rerun.
