---

# Container image
omnia_auth_image: "docker.io/dellhpcomniaaisolution/omnia_auth"
omnia_auth_tag: "1.2"
omnia_auth_container_name: "omnia_auth"

# Directory paths
auth_base_dir: "{{ hostvars['localhost']['omnia_data_path'] }}/auth"
auth_config_dir: "{{ auth_base_dir }}/config"
auth_certs_dir: "{{ auth_base_dir }}/tls_certs"
auth_data_dir: "{{ auth_base_dir }}/data"
auth_init_dir: "{{ auth_base_dir }}/init"

# Quadlet directory for systemd container units
quadlet_dir: "/etc/containers/systemd"

# OpenLDAP ports
ldap_port: 389
ldaps_port: 636

# TLS certificate settings
tls_cert_days: 3650
tls_key_bits: 4096
tls_cert_file: "ldapserver.crt"
tls_key_file: "ldapserver.key"

# Image pull settings
pull_retries: 3
pull_delay: 10

# Service readiness
healthcheck_retries: 10
healthcheck_delay: 5

# Error messages
deploy_openldap_fail_msg: "Failed to deploy OpenLDAP container. Check the logs for details."
credentials_missing_msg: "OpenLDAP credentials (openldap_db_username, openldap_db_password) are required. Run orchestrator.yml to be prompted for credentials."
