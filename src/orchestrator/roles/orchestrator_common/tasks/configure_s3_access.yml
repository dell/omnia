---
# Configure S3 access on the OIM for boot image storage.
#
# Reads S3 configuration from image_build_manager's build_status.yml output.
# The build_status.yml provides:
#   - s3_configurations.endpoint_url  (S3 endpoint used by image_build_manager)
#   - s3_configurations.bucket        (S3 bucket containing boot images)
#
# This task bridges build_status.yml into facts used by:
#   1. s3_configurations  (dict with endpoint_url + bucket)
#      → used by boot-service template (boot-svc.yaml.j2) to construct PXE boot HTTP URLs
#
# Tag-aware dependency checking:
# - prepare/deploy tags: Don't require build_status.yml (not needed for OpenCHAMI deployment)
# - execute/provision/pxeboot tags: Require build_status.yml (needed for boot service templates)
# - Default flow (no tags): Require build_status.yml (complete flow needs it)

- name: Load S3 configuration messages
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/s3_config_messages.yml"

- name: Load orchestrator config for build_status path
  ansible.builtin.include_vars:
    file: "{{ hostvars['localhost']['input_project_dir'] }}/orchestrator_config.yml"
    name: _orch_config
  failed_when: false

- name: Set image_build_manager output path
  ansible.builtin.set_fact:
    _build_status_path: >-
      {{ _orch_config.image_build_manager_output_path
         | default(hostvars['localhost']['image_build_manager_output_path'], true) }}

- name: Determine if build_status.yml is required based on tags
  ansible.builtin.set_fact:
    _build_status_required: >-
      {{
        ('execute' in (hostvars['localhost']['omnia_run_tags'] | default([]))) or
        ('provision' in (hostvars['localhost']['omnia_run_tags'] | default([]))) or
        ('pxeboot' in (hostvars['localhost']['omnia_run_tags'] | default([]))) or
        (hostvars['localhost']['omnia_run_tags'] | default([]) | length == 0)
      }}

- name: Verify build_status.yml exists
  ansible.builtin.stat:
    path: "{{ _build_status_path }}"
  register: _build_status_stat
  delegate_to: localhost

- name: Fail if build_status.yml is required but missing
  ansible.builtin.fail:
    msg: "{{ build_status_missing_required_msg }}"
  when:
    - _build_status_required | bool
    - not _build_status_stat.stat.exists

- name: Skip S3 configuration for prepare/deploy tags when build_status.yml is missing
  ansible.builtin.debug:
    msg: "{{ build_status_missing_optional_msg }}"
  when:
    - not _build_status_required | bool
    - not _build_status_stat.stat.exists

- name: Set default s3_configurations when not required
  ansible.builtin.set_fact:
    s3_configurations: {}
    build_status: {}
  when:
    - not _build_status_required | bool
    - not _build_status_stat.stat.exists

- name: Load build_status.yml from image_build_manager output
  ansible.builtin.include_vars:
    file: "{{ _build_status_path }}"
    name: _build_status
  delegate_to: localhost
  when: _build_status_stat.stat.exists

- name: Validate build_status overall_status
  ansible.builtin.fail:
    msg: "{{ build_status_invalid_msg }}"
  when:
    - _build_status_stat.stat.exists
    - (_build_status.overall_status | default('')) != 'success'

# -------------------------------------------------------------------
# Bridge: set s3_configurations fact from build_status.yml
# -------------------------------------------------------------------
- name: Set s3_configurations from build_status
  ansible.builtin.set_fact:
    s3_configurations:
      endpoint_url: "{{ _build_status.s3_configurations.endpoint_url }}"
      bucket: "{{ _build_status.s3_configurations.bucket | default('boot-images') }}"
    build_status: "{{ _build_status }}"
  when: _build_status_stat.stat.exists

- name: Display S3 configuration from build_status
  ansible.builtin.debug:
    msg: "S3 endpoint: {{ s3_configurations.endpoint_url }}, bucket: {{ s3_configurations.bucket }}"
  when: _build_status_stat.stat.exists
