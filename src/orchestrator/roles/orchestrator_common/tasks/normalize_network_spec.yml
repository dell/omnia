---

- name: Validate Networks list structure
  ansible.builtin.assert:
    that:
      - Networks is defined
      - Networks is sequence
      - Networks is not mapping
      - Networks is not string
      - Networks | length > 0
    fail_msg: "network_spec.yml must define Networks as a non-empty list."
    quiet: true

- name: Validate each Networks entry is a mapping
  ansible.builtin.assert:
    that:
      - item is mapping
    fail_msg: "Every Networks entry must be a mapping."
    quiet: true
  loop: "{{ Networks }}"
  loop_control:
    label: "{{ item.keys() | list | join(', ') if item is mapping else item }}"

- name: Initialize normalized network data
  ansible.builtin.set_fact:
    network_data: {}

- name: Merge network entries into normalized network data
  ansible.builtin.set_fact:
    network_data: "{{ network_data | combine(item) }}"
  loop: "{{ Networks }}"
  loop_control:
    label: "{{ item.keys() | list | join(', ') }}"
