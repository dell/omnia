---

- name: Generate a fresh OpenCHAMI token for the service-status check
  ansible.builtin.include_tasks: refresh_openchami_token.yml
  vars:
    openchami_token_api_validation: false

- name: Check ochami smd status
  ansible.builtin.command: ochami smd service status
  register: smd_status_result
  changed_when: false
  failed_when: false
  environment: "{{ ochami_env }}"
  when: openchami_access_token | default('') | length > 0

- name: Regenerate certificate
  when:
    - openchami_access_token | default('') | length > 0
    - smd_status_result.rc != 0
  block:
    - name: Restart acme-deploy service
      block:
        - name: Restart acme-deploy service
          ansible.builtin.systemd_service:
            name: acme-deploy
            state: restarted
          failed_when: false
      rescue:
        - name: Failed to restart acme-deploy service
          ansible.builtin.fail:
            msg: "{{ cert_restart_fail_msg }}"

    - name: Wait before checking OpenCHAMI status again
      ansible.builtin.wait_for:
        timeout: "{{ cert_wait_time }}"

    - name: Check ochami smd status
      ansible.builtin.command: ochami smd service status
      register: smd_status_recheck
      changed_when: false
      failed_when: false
      environment: "{{ ochami_env }}"

    - name: Display smd status
      ansible.builtin.debug:
        msg: "{{ smd_status_recheck.stdout }}"
        verbosity: 2

- name: Require OpenCHAMI SMD service status
  ansible.builtin.assert:
    that:
      - >-
        (smd_status_recheck.rc | default(smd_status_result.rc) | int) == 0
    fail_msg: >-
      OpenCHAMI authentication succeeded, but the SMD service status check
      failed after certificate recovery. Check the SMD, HAProxy, local CA,
      acme-deploy, and Tokensmith services before retrying.
  when:
    - openchami_access_token | default('') | length > 0
    - openchami_token_required | default(true) | bool

- name: Refresh and validate OpenCHAMI authentication after service recovery
  ansible.builtin.include_tasks: refresh_openchami_token.yml
  when:
    - openchami_access_token | default('') | length > 0
