---
- name: Read PXE mapping for functional-group normalization
  block:
    - name: Read PXE mapping content
      ansible.builtin.slurp:
        path: "{{ normalized_pxe_mapping_path }}"
      register: _pxe_mapping_normalization_raw
      no_log: true
  rescue:
    - name: Report PXE mapping read failure
      ansible.builtin.fail:
        msg: "{{ mapping_file_read_fail_msg }}"

- name: Promote the first Kubernetes control-plane node to the primary group
  block:
    - name: Build normalized PXE mapping content
      ansible.builtin.set_fact:
        _normalized_pxe_mapping_content: >-
          {{
            (_pxe_mapping_normalization_raw.content | b64decode)
            | regex_replace(
                '(service_kube_control_plane_)((?!first_)\w+)',
                'service_kube_control_plane_first_\2',
                count=1
              )
          }}
      no_log: true
  rescue:
    - name: Report PXE mapping processing failure
      ansible.builtin.fail:
        msg: "{{ mapping_file_process_fail_msg }}"

- name: Write normalized PXE mapping
  block:
    - name: Save normalized PXE mapping content
      ansible.builtin.copy:
        content: "{{ _normalized_pxe_mapping_content }}"
        dest: "{{ normalized_pxe_mapping_path }}"
        mode: "0644"
      no_log: true
  rescue:
    - name: Report PXE mapping write failure
      ansible.builtin.fail:
        msg: "{{ mapping_file_write_fail_msg }}"
