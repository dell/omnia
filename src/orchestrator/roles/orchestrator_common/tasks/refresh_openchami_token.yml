---

- name: Include OpenCHAMI authentication variables
  ansible.builtin.include_vars: "{{ role_path }}/vars/openchami_vars.yml"

- name: Validate configured OpenCHAMI endpoint facts
  ansible.builtin.assert:
    that:
      - hostvars['localhost']['oim_node_name'] | default('') | length > 0
      - hostvars['localhost']['domain_name'] | default('') | length > 0
    fail_msg: >-
      OpenCHAMI endpoint facts are unavailable. Run the Orchestrator setup
      play before requesting an OpenCHAMI access token.

- name: Resolve the configured OpenCHAMI API endpoint
  ansible.builtin.set_fact:
    _openchami_token_validation_url: >-
      https://{{ hostvars['localhost']['oim_node_name'] }}.{{
        hostvars['localhost']['domain_name'] | regex_replace(
          '^' + hostvars['localhost']['oim_node_name'] + '\\.',
          ''
        )
      }}:8443/hsm/v2/State/Components

- name: Reset OpenCHAMI authentication state before token refresh
  ansible.builtin.set_fact:
    ochami_env: {}
    openchami_access_token: ""
    _openchami_token_generated: false
  no_log: true

- name: Generate a fresh OpenCHAMI access token
  block:
    - name: Request an access token from Tokensmith
      ansible.builtin.command: sudo bash -lc 'gen_access_token'
      register: _openchami_token_result
      changed_when: false
      failed_when: false
      retries: "{{ openchami_auth_retries }}"
      delay: "{{ openchami_auth_delay }}"
      until:
        - _openchami_token_result.rc == 0
        - _openchami_token_result.stdout | default('') | trim | length > 0
        - _openchami_token_result.stdout | trim != 'null'
      no_log: true

    - name: Record whether Tokensmith returned a usable access token
      ansible.builtin.set_fact:
        _openchami_token_generated: >-
          {{
            _openchami_token_result.rc == 0
            and _openchami_token_result.stdout | default('') | trim | length > 0
            and _openchami_token_result.stdout | trim != 'null'
          }}
      no_log: true

    - name: Require a usable OpenCHAMI access token
      ansible.builtin.fail:
        msg: >-
          Tokensmith did not return a usable OpenCHAMI access token after all
          retry attempts.
      when:
        - openchami_token_required | default(true) | bool
        - not (_openchami_token_generated | bool)

    - name: Store the fresh token for CLI and API operations
      ansible.builtin.set_fact:
        ochami_env: >-
          {{ {cluster_env_key: _openchami_token_result.stdout | trim} }}
        openchami_access_token: "{{ _openchami_token_result.stdout | trim }}"
      no_log: true
      when: _openchami_token_generated | bool

    - name: Validate the fresh token against the protected SMD API
      ansible.builtin.uri:
        url: "{{ _openchami_token_validation_url }}"
        method: GET
        headers:
          Authorization: "Bearer {{ openchami_access_token }}"
        status_code: 200
        validate_certs: false
      register: _openchami_token_validation
      changed_when: false
      failed_when: false
      retries: "{{ openchami_auth_retries }}"
      delay: "{{ openchami_auth_delay }}"
      until: _openchami_token_validation.status | default(0) == 200
      no_log: true
      when:
        - _openchami_token_generated | bool
        - openchami_token_api_validation | default(true) | bool

    - name: Require successful validation of the fresh OpenCHAMI token
      ansible.builtin.fail:
        msg: >-
          The fresh OpenCHAMI access token could not be validated against SMD
          after all retry attempts.
      when:
        - _openchami_token_generated | bool
        - openchami_token_api_validation | default(true) | bool
        - openchami_token_required | default(true) | bool
        - _openchami_token_validation.status | default(0) != 200
  rescue:
    - name: Reset unusable OpenCHAMI authentication state
      ansible.builtin.set_fact:
        ochami_env: {}
        openchami_access_token: ""
        _openchami_token_generated: false
      no_log: true

    - name: Fail when required OpenCHAMI authentication is unavailable
      ansible.builtin.fail:
        msg: >-
          A fresh OpenCHAMI access token could not be generated or validated
          against SMD. Check the tokensmith and SMD services, the Tokensmith
          signing key, and the SMD JWKS configuration before retrying.
      when: openchami_token_required | default(true) | bool
