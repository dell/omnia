# orchestrator_common is a task-library role.
# It is NOT meant to be included as a role directly.
# Instead, individual task files are included via:
#
#   ansible.builtin.include_role:
#     name: omnia.orchestrator.orchestrator_common
#     tasks_from: <task_file>.yml
#
# Available task files:
#   - configure_s3_access.yml      — Load build_status.yml, set s3_configurations
#   - openchami_auth.yml           — Generate OpenCHAMI access token
#   - decrypt_include_encrypt.yml  — Decrypt/include/re-encrypt credential files
#   - check_kube_vip_reachability.yml — Check kube_vip SSH reachability

- name: Orchestrator_common is a task library — use tasks_from to include specific tasks
  ansible.builtin.debug:
    msg: "Use 'include_role: name=omnia.orchestrator.orchestrator_common tasks_from=<file>.yml' to include specific tasks"
