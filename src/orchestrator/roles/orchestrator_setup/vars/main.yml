---
# Paths derived after tasks/main.yml resolves the environment configuration.
default_build_status_path: >-
  {{ image_build_manager_data_path }}/output/{{ project_name }}/build_status.yml
default_repo_manager_data_path: >-
  {{ lookup('env', 'REPO_MANAGER_DATA_PATH')
     | default(omnia_data_path + '/repo_manager', true) }}
default_repo_status_path: >-
  {{ default_repo_manager_data_path }}/output/{{ project_name }}/repo_status.yml
default_pxe_mapping_file_path: >-
  {{ orchestrator_data_path }}/input/{{ project_name }}/pxe_mapping_file.csv
default_catalog_file_path: "{{ lookup('env', 'CATALOG_FILE_PATH') | default(omnia_data_path + '/catalog/catalog_rhel.json', true) }}"

# --- Tag validation ---
# Tags accepted by orchestrator.yml. Component-level cleanup tags (slurm,
# k8s, openchami, openldap, storage_mounts, artifacts) are intentionally
# absent: they are only valid when running
# playbooks/cleanup/cleanup_orchestrator.yml directly.
supported_tags:
  - precheck
  - validate
  - credentials
  - prepare
  - deploy
  - provision
  - execute
  - validate-deployment
  - pxeboot
  - verify_node_registration
  - manage-functional-group
  - configure-functional-groups
  - cleanup
  - cleanup_credentials

skip_credential_tags:
  - precheck
  - cleanup
  - cleanup_credentials
  - validate-deployment
  - validate
  - verify_node_registration

# Flows that consume repositories, offline content, or the Pulp certificate.
# Cleanup and input-only/credential-only flows must remain runnable without
# an existing repo_status.yml.
# Note: prepare and deploy tags only deploy containers (OpenCHAMI/OpenLDAP),
# they don't configure nodes, so repo_status.yml is not needed until provision.
# Note: the flexible-group tags (manage-functional-group,
# configure-functional-groups) are intentionally absent (ER-ORCH-009 FR-4.1,
# FR-4.3). Repository, registry, and package configuration for flexible groups
# is the user's responsibility via cloud_init.config_file or pre-baked
# images, so these flows must proceed without a repo_status.yml.
repo_status_required_tags:
  - all
  - precheck
  - provision
  - execute
  - pxeboot

# Flows that consume catalog-derived OS metadata or feature flags. The
# catalog_file_path input is optional, but its resolved file must exist for
# these flows. Input-only validation and operational cleanup flows do
# not consume the catalog contract.
catalog_required_tags:
  - all
  - precheck
  - credentials
  - prepare
  - deploy
  - provision
  - execute
  - validate-deployment
  - manage-functional-group
  - configure-functional-groups

# Flows that produce or consume persistent Orchestrator runtime output. The
# setup role remains available to every playbook for read-only context
# resolution, but only these lifecycle flows may initialize the output tree
# and refresh orchestrator_state.yml.
# manage-functional-group mutates OpenCHAMI/BSS/metadata state and so may
# initialize the output tree; configure-functional-groups only republishes BSS
# and cloud-init metadata for existing groups and so is intentionally absent
# (ER-ORCH-009 HLD §2.4).
state_initialization_tags:
  - prepare
  - deploy
  - provision
  - execute
  - pxeboot
  - verify_node_registration
  - manage-functional-group

# Lifecycle flows that validate local project inputs before setup dereferences
# them. Credential-only and operational recovery flows remain lightweight.
input_validation_tags:
  - precheck
  - validate
  - prepare
  - deploy
  - provision
  - execute
  - validate-deployment
  - pxeboot
  - manage-functional-group
  - configure-functional-groups

invalid_tag_combinations:
  - [precheck, cleanup]
  - [validate, cleanup]
  - [validate-deployment, cleanup]
  - [credentials, cleanup]
  - [prepare, cleanup]
  - [deploy, cleanup]
  - [provision, cleanup]
  - [execute, cleanup]
  - [pxeboot, cleanup]
  - [verify_node_registration, cleanup]
  - [manage-functional-group, cleanup]
  - [configure-functional-groups, cleanup]
  - [precheck, cleanup_credentials]
  - [validate, cleanup_credentials]
  - [validate-deployment, cleanup_credentials]
  - [credentials, cleanup_credentials]
  - [prepare, cleanup_credentials]
  - [deploy, cleanup_credentials]
  - [provision, cleanup_credentials]
  - [execute, cleanup_credentials]
  - [pxeboot, cleanup_credentials]
  - [verify_node_registration, cleanup_credentials]
  - [manage-functional-group, cleanup_credentials]
  - [configure-functional-groups, cleanup_credentials]
  - [pxeboot, verify_node_registration]
  - [execute, verify_node_registration]
  - [provision, verify_node_registration]

# OIM host group
oim_host_port: "22"
oim_host_group: "oim"

# Error messages
repo_status_missing_fail_msg: >-
  Required Repo Manager output was not found at '{{ repo_manager_output_path }}'.
  Run repo_manager first or set repo_manager_output_path in orchestrator_config.yml.
repo_status_invalid_fail_msg: >-
  Invalid Repo Manager output at '{{ repo_manager_output_path }}'. The file must
  report overall_status: success and contain cluster_os_type, repositories, and
  repo_manager.certificates.server_crt.
repo_status_content_contract_fail_msg: >-
  Invalid Repo Manager content contract at '{{ repo_manager_output_path }}'.
  The file must contain a base_urls mapping for the service Kubernetes OS
  version '{{ service_k8s_os_version | default('unknown') }}' and architecture
  '{{ service_k8s_architecture | default('unknown') }}'. Rerun Repo Manager
  with the active catalog before rerunning Orchestrator.
repo_certificate_missing_fail_msg: >-
  Repo Manager certificate was not found at '{{ pulp_cert_path }}'. Regenerate
  repo_status.yml and the Pulp certificate by running repo_manager.
service_k8s_deployment_selection_fail_msg: >-
  Multiple service_k8s_cluster entries have deployment set to true. Exactly
  one deployed cluster may define enable_powerscale_csi.
powerscale_csi_enablement_type_fail_msg: >-
  enable_powerscale_csi for the service_k8s_cluster entry with deployment set
  to true must be a native YAML boolean (true or false).
catalog_missing_fail_msg: >-
  Required catalog was not found at '{{ catalog_file_path }}'. Run omnia.sh
  --init to install the default catalog, set CATALOG_FILE_PATH, or configure
  catalog_file_path in orchestrator_config.yml.
catalog_invalid_fail_msg: >-
  Invalid catalog at '{{ catalog_file_path }}'. The catalog must contain
  catalog.groups, catalog.functionallayer, catalog.packages, and a baseos
  group with non-empty os and os_version values.
# Centralized failure messages
unsupported_tag_fail_msg: >-
  Unsupported tag '{{ item }}' specified.
  Supported tags: {{ supported_tags | join(', ') }}
conflicting_tags_fail_msg: >-
  Conflicting tags specified: {{ item | join(' + ') }}.
  These tags cannot be used together.
input_templates_fail_msg: >-
  Orchestrator project input directory '{{ input_project_dir }}' is
  missing, and source templates were not found at
  '{{ _domain_root_dir }}/input'.
orchestrator_config_missing_fail_msg: >-
  Required Orchestrator configuration was not found at
  '{{ input_project_dir }}/orchestrator_config.yml'. Run domain-init.sh or
  restore the project input before this flow.
catalog_kubernetes_version_fail_msg: >-
  The catalog enables Kubernetes but does not contain a versioned
  kubeadm package. Add a kubeadm package such as kubeadm_1_35_1.
service_k8s_catalog_context_fail_msg: >-
  The catalog's service Kubernetes functional layers must reference exactly
  one complete baseos group and the supported x86_64 architecture. Correct
  the service_kube_* layers before rerunning Orchestrator.
