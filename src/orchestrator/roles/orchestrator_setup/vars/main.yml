---

# Paths — resolved from environment variables at runtime (see tasks/main.yml)
# These defaults are overridden by set_fact in the setup tasks.
omnia_metadata_file_path: "{{ omnia_data_path | default('/opt/omnia') }}/.data/oim_metadata.yml"
upgrade_lock_file: "{{ omnia_data_path | default('/opt/omnia') }}/.data/upgrade_in_progress.lock"
default_build_status_path: >-
  {{ omnia_data_path | default('/opt/omnia') }}/image_build_manager/output/{{ project_name | default('project_default') }}/build_status.yml
default_repo_status_path: "{{ omnia_data_path | default('/opt/omnia') }}/repo_manager/output/{{ project_name | default('project_default') }}/repo_status.yml"
default_pxe_mapping_file_path: >-
  {{ omnia_data_path | default('/opt/omnia') }}/orchestrator/input/{{ project_name | default('project_default') }}/pxe_mapping_file.csv
default_catalog_file_path: "{{ lookup('env', 'CATALOG_FILE_PATH') | default(omnia_data_path | default('/opt/omnia') + '/catalog/catalog_rhel.json', true) }}"

# --- Tag validation ---
supported_tags:
  - precheck
  - prepare
  - deploy
  - provision
  - pxeboot
  - cleanup
  - validate
  - upgrade
  - rollback

skip_credential_tags:
  - precheck
  - cleanup
  - validate

invalid_tag_combinations:
  - [precheck, cleanup]
  - [prepare, cleanup]
  - [deploy, cleanup]
  - [provision, cleanup]
  - [pxeboot, cleanup]
  - [precheck, upgrade]
  - [prepare, upgrade]
  - [deploy, upgrade]
  - [provision, upgrade]
  - [cleanup, upgrade]
  - [upgrade, rollback]

# OIM host group
oim_host_port: "22"
oim_host_group: "oim"

# Error messages
upgrade_in_progress_msg: >-
  Upgrade is not completed fully.
  Please run upgrade.yml to complete upgrade before running any other playbook using the below command:
  "ansible-playbook /omnia/src/playbooks/upgrade/upgrade.yml"
  If you don't require input files to be migrated, reconfigure the default input files, remove the lock file using the following command
  "rm {{ upgrade_lock_file }}" and then proceed.
