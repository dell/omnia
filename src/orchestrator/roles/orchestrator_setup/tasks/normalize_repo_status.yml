---
- name: Validate version-qualified Repo Manager content contract
  ansible.builtin.assert:
    that:
      - base_urls is defined
      - base_urls is mapping
    fail_msg: "{{ repo_status_content_contract_fail_msg }}"
    quiet: true

- name: Validate Repo Manager content for service Kubernetes
  ansible.builtin.assert:
    that:
      - (service_k8s_os_version | string) in base_urls
      - base_urls.get(service_k8s_os_version | string, none) is mapping
      - >-
        base_urls[service_k8s_os_version | string]
        .get(service_k8s_architecture, none) is mapping
    fail_msg: "{{ repo_status_content_contract_fail_msg }}"
    quiet: true

- name: Select Repo Manager content maps for service Kubernetes
  ansible.builtin.set_fact:
    service_k8s_repo_base_urls: >-
      {{ base_urls[service_k8s_os_version | string]
         .get(service_k8s_architecture, {}) }}
    service_k8s_repo_file_repos: >-
      {{ file_repos.get(service_k8s_os_version | string, {})
         .get(service_k8s_architecture, {})
         if file_repos is defined
            and file_repos is mapping
            and file_repos.get(service_k8s_os_version | string, {}) is mapping
         else {} }}
    cacheable: true
