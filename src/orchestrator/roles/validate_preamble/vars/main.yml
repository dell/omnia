---
# Actionable error messages surfaced (no_log tasks). Printed with no_log: false.
validate_preamble_read_csv_rescue_msg: |
  The PXE mapping CSV could not be read during validate.
  What to fix: make sure the PXE mapping file exists, is valid CSV, and has an ADMIN_MAC column.
  Then re-run the validate stage.

validate_preamble_promote_csv_rescue_msg: |
  PXE mapping data could not be loaded during validate.
  What to fix: correct the PXE mapping CSV (see the read error above, if any).
  Then re-run the validate stage.
