---
# Variables for validate_openchami role
# Derive OpenCHAMI base URL from stable localhost facts (oim_node_name, domain_name)
# rather than cluster_name which may be overwritten by slurm_config/k8s_config roles.
openchami_base_url: >-
  https://{{ hostvars['localhost']['oim_node_name'] }}.{{
    hostvars['localhost']['domain_name'] | regex_replace(
      '^' + hostvars['localhost']['oim_node_name'] + '\\.',
      ''
    )
  }}:8443
# Centralized failure messages
haproxy_volume_fail_msg: >-
  HAProxy certificate volume 'haproxy-certs' is missing. Re-run
  OpenCHAMI preparation before provisioning.
haproxy_certificate_fail_msg: >-
  HAProxy certificate volume 'haproxy-certs' does not contain a PEM
  certificate. Re-run OpenCHAMI preparation before provisioning.
openchami_readiness_fail_msg: >-
  OpenCHAMI is not ready for provisioning. Check that all services are
  running and accessible through the CA-verified gateway.
  API checks: {{ 'passed' if openchami_api_checks is defined and
  openchami_api_checks is success else 'failed' }},
  Tokensmith: {{ tokensmith_health.status.ActiveState | default('N/A') }},
  ACME: {{ acme_health.status.ActiveState | default('N/A') }}.
