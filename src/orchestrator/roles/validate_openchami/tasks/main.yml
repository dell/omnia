---
# validate_openchami — Verify OpenCHAMI readiness for provisioning.
# Called after deploy_openchami and before any provision_*.yml playbook.
# All checks must pass before provisioning is allowed to proceed.

- name: Validate OpenCHAMI services are ready
  block:
    - name: Verify openchami.target is active
      ansible.builtin.systemd:
        name: openchami.target
      register: openchami_target_status
      failed_when: openchami_target_status.status.ActiveState != "active"

    - name: Verify OpenCHAMI APIs with JWT and CA trust
      openchami_reconcile:
        action: check_apis
        cluster_uri: "{{ openchami_base_url }}"
        access_token: "{{ openchami_access_token }}"
        ca_cert: "{{ hostvars['localhost']['openchami_ca_cert_path'] }}"
      register: openchami_api_checks
      retries: 3
      delay: 5
      until: openchami_api_checks is success
      no_log: true

    - name: Verify tokensmith is reachable
      ansible.builtin.systemd:
        name: tokensmith.service
      register: tokensmith_health
      changed_when: false
      failed_when: tokensmith_health.status.ActiveState != "active"
      retries: 3
      delay: 5
      until: tokensmith_health.status.ActiveState == "active"

    - name: Verify ACME certificate service is active
      ansible.builtin.systemd:
        name: acme-deploy.service
      register: acme_health
      changed_when: false
      failed_when: acme_health.status.ActiveState != "active"

    - name: Inspect HAProxy certificate volume
      containers.podman.podman_volume_info:
        name: haproxy-certs
      register: haproxy_cert_volume

    - name: Assert HAProxy certificate volume is available
      ansible.builtin.assert:
        that:
          - haproxy_cert_volume.volumes | default([]) | length > 0
        fail_msg: "{{ haproxy_volume_fail_msg }}"
    - name: Verify HAProxy TLS certificates are present
      ansible.builtin.find:
        paths: "{{ haproxy_cert_volume.volumes[0].Mountpoint }}"
        patterns: "*.pem"
      register: haproxy_certs

    - name: Assert HAProxy TLS certificate is available
      ansible.builtin.assert:
        that:
          - haproxy_certs.matched | default(0) | int > 0
        fail_msg: "{{ haproxy_certificate_fail_msg }}"
        success_msg: >-
          HAProxy TLS certificate verified in the haproxy-certs volume.

    - name: Set openchami_ready fact
      ansible.builtin.set_fact:
        openchami_ready: true

  rescue:
    - name: Set openchami_ready to false on failure
      ansible.builtin.set_fact:
        openchami_ready: false

    - name: Fail with OpenCHAMI readiness error
      ansible.builtin.fail:
        msg: "{{ openchami_readiness_fail_msg }}"
