---
# validate_openchami — Verify OpenCHAMI readiness for provisioning.
# Called after deploy_openchami and before any provision_*.yml playbook.
# All checks must pass before provisioning is allowed to proceed.

- name: Validate OpenCHAMI services are ready
  block:
    - name: Verify openchami.target is active
      ansible.builtin.systemd:
        name: openchami.target
      register: openchami_target_status
      failed_when: openchami_target_status.status.ActiveState != "active"

    - name: Verify SMD API is reachable
      ansible.builtin.uri:
        url: "{{ openchami_base_url }}/smd/v2/service/ready"
        method: GET
        status_code: 200
        validate_certs: "{{ openchami_validate_certs | default(true) }}"
        headers:
          Authorization: "Bearer {{ openchami_access_token }}"
      register: smd_health
      retries: 3
      delay: 5
      until: smd_health.status == 200

    - name: Verify BSS API is reachable
      ansible.builtin.uri:
        url: "{{ openchami_base_url }}/bss/boot/v1/service/status"
        method: GET
        status_code: 200
        validate_certs: "{{ openchami_validate_certs | default(true) }}"
        headers:
          Authorization: "Bearer {{ openchami_access_token }}"
      register: bss_health
      retries: 3
      delay: 5
      until: bss_health.status == 200

    - name: Verify cloud-init-server is reachable
      ansible.builtin.uri:
        url: "{{ openchami_base_url }}/cloud-init/"
        method: GET
        status_code: 200
        validate_certs: "{{ openchami_validate_certs | default(true) }}"
      register: cloudinit_health
      retries: 3
      delay: 5
      until: cloudinit_health.status == 200

    - name: Set openchami_ready fact
      ansible.builtin.set_fact:
        openchami_ready: true

  rescue:
    - name: Set openchami_ready to false on failure
      ansible.builtin.set_fact:
        openchami_ready: false

    - name: Fail with OpenCHAMI readiness error
      ansible.builtin.fail:
        msg: >-
          OpenCHAMI is not ready for provisioning. Check that all services are
          running and accessible. SMD: {{ smd_health.status | default('N/A') }},
          BSS: {{ bss_health.status | default('N/A') }},
          Cloud-Init: {{ cloudinit_health.status | default('N/A') }}.
