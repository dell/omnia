---
- name: Initialize OIM mount selection
  ansible.builtin.set_fact:
    filter_slurm_nfs: []
    filter_service_k8s_nfs: []
    storage_to_be_mounted: []

- name: Initialize support flags
  ansible.builtin.set_fact:
    slurm_support: "{{ hostvars['localhost']['slurm_support'] | default(false) }}"
    service_k8s_support: "{{ hostvars['localhost']['service_k8s_support'] | default(false) }}"

- name: Set Slurm storage names
  ansible.builtin.set_fact:
    filter_slurm_nfs: "{{ omnia_config.slurm_cluster | map(attribute='nfs_storage_name') | list }}"
  when: "'slurm_cluster' in omnia_config"

- name: Set Kubernetes NFS names
  ansible.builtin.set_fact:
    filter_service_k8s_nfs: "{{ omnia_config.service_k8s_cluster | map(attribute='nfs_storage_name') | list }}"
  when: "'service_k8s_cluster' in omnia_config"

- name: Select Slurm NFS storage for the OIM
  ansible.builtin.set_fact:
    storage_to_be_mounted: >-
      {{ storage_to_be_mounted
         + (effective_mounts | selectattr('name', 'in', filter_slurm_nfs) | list) }}
  when: ('slurm' in omnia_run_tags) and (slurm_support)

- name: Select Kubernetes NFS storage for the OIM
  ansible.builtin.set_fact:
    storage_to_be_mounted: >-
      {{ storage_to_be_mounted
         + (effective_mounts | selectattr('name', 'in', filter_service_k8s_nfs) | list) }}
  when: ('service_k8s' in omnia_run_tags) and (service_k8s_support)

- name: Add storage explicitly configured for OIM mounting
  ansible.builtin.set_fact:
    storage_to_be_mounted: >-
      {{ (storage_to_be_mounted
          + (effective_mounts
             | selectattr('mount_on_oim', 'defined')
             | selectattr('mount_on_oim', 'equalto', true)
             | list))
         | unique(attribute='name')
         | list }}

- name: Install NFS client with bolt-on support
  ansible.builtin.include_tasks: mount_on_oim.yml
  loop: "{{ storage_to_be_mounted }}"
  loop_control:
    label: "{{ item.name | default(item.mount_point | default('unnamed mount')) }}"
