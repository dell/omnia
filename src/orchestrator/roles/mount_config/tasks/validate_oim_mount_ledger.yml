---
# Reject stale storage-name ownership before ansible.posix.mount can alter the
# live mount or fstab. The post-mount writer repeats this validation before its
# atomic update so ownership cannot silently move between attachments.

- name: Canonicalize proposed OIM mount point before mutation
  ansible.builtin.command:
    argv:
      - realpath
      - -m
      - --
      - "{{ mount_point }}"
  register: oim_mount_preflight_canonical_path
  check_mode: false
  changed_when: false

- name: Check existing OIM mount ownership ledger before mutation
  ansible.builtin.stat:
    path: "{{ oim_mount_ledger_path }}"
  register: oim_mount_preflight_ledger_stat

- name: Read existing OIM mount ownership ledger before mutation
  ansible.builtin.slurp:
    src: "{{ oim_mount_ledger_path }}"
  register: oim_mount_preflight_ledger_raw
  when: oim_mount_preflight_ledger_stat.stat.exists | default(false) | bool

- name: Parse existing OIM mount ownership ledger before mutation
  ansible.builtin.set_fact:
    oim_mount_preflight_ledger: >-
      {{ (oim_mount_preflight_ledger_raw.content | b64decode | from_yaml)
         if oim_mount_preflight_ledger_stat.stat.exists | default(false) | bool
         else {'schema_version': '1.0', 'mounts': []} }}

- name: Validate existing OIM mount ownership ledger before mutation
  ansible.builtin.assert:
    that:
      - oim_mount_preflight_ledger is mapping
      - oim_mount_preflight_ledger.mounts | default([]) is sequence
      - oim_mount_preflight_ledger.mounts | default([]) is not string
    fail_msg: >-
      Refusing to mount storage because the OIM ownership ledger is malformed:
      {{ oim_mount_ledger_path }}.

- name: Reject stale storage-name or mount-target ownership before mutation
  vars:
    oim_mount_preflight_identity_conflicts: >-
      {% set conflicts = [] -%}
      {% for ledger_mount in oim_mount_preflight_ledger.mounts | default([]) -%}
        {% set same_name = ledger_mount.storage_name | default('')
           == item.name | default('') -%}
        {% set same_target = ledger_mount.mount_point | default('')
           == oim_mount_preflight_canonical_path.stdout -%}
        {% set exact_identity = same_name and same_target
           and ledger_mount.source | default('') == source -%}
        {% if (same_name or same_target) and not exact_identity -%}
          {% set _ = conflicts.append(ledger_mount) -%}
        {% endif -%}
      {% endfor -%}
      {{ conflicts }}
  ansible.builtin.assert:
    that:
      - oim_mount_preflight_identity_conflicts | length == 0
    fail_msg: >-
      Refusing to mount storage '{{ item.name | default('') }}' because its
      storage name or target collides with a different ownership-ledger
      identity. Clean or reconcile the previous attachment first; no mount or
      fstab state was changed. Conflicts:
      {{ oim_mount_preflight_identity_conflicts }}

- name: Read existing live attachment at the proposed target
  ansible.builtin.command:
    argv:
      - findmnt
      - --json
      - --list
      - --output
      - SOURCE,TARGET,FSTYPE
      - --mountpoint
      - "{{ oim_mount_preflight_canonical_path.stdout }}"
  register: oim_mount_preflight_live_query
  check_mode: false
  changed_when: false
  failed_when: oim_mount_preflight_live_query.rc not in [0, 1]

- name: Read existing fstab attachment at the proposed target
  ansible.builtin.command:
    argv:
      - findmnt
      - --fstab
      - --json
      - --list
      - --output
      - SOURCE,TARGET,FSTYPE
      - --mountpoint
      - "{{ oim_mount_preflight_canonical_path.stdout }}"
  register: oim_mount_preflight_fstab_query
  check_mode: false
  changed_when: false
  failed_when: oim_mount_preflight_fstab_query.rc not in [0, 1]

- name: Classify existing attachment identity before mutation
  ansible.builtin.set_fact:
    oim_mount_preflight_live_records: >-
      {{ ((oim_mount_preflight_live_query.stdout
           | default('{"filesystems": []}', true) | from_json).filesystems)
         | default([]) }}
    oim_mount_preflight_fstab_records: >-
      {{ ((oim_mount_preflight_fstab_query.stdout
           | default('{"filesystems": []}', true) | from_json).filesystems)
         | default([]) }}

- name: Resolve exact pre-existing attachment identity
  vars:
    oim_mount_preflight_live_types: >-
      {{ oim_mount_preflight_live_records
         | map(attribute='fstype') | unique | list }}
    oim_mount_preflight_fstab_types: >-
      {{ oim_mount_preflight_fstab_records
         | map(attribute='fstype') | unique | list }}
    oim_mount_preflight_type_matches_live: >-
      {{ fs_type | default('auto') in ['', 'auto']
         or (fs_type in ['nfs', 'nfs4']
             and oim_mount_preflight_live_types
                 | difference(['nfs', 'nfs4']) | length == 0)
         or oim_mount_preflight_live_types == [fs_type] }}
    oim_mount_preflight_type_matches_fstab: >-
      {{ fs_type | default('auto') in ['', 'auto']
         or (fs_type in ['nfs', 'nfs4']
             and oim_mount_preflight_fstab_types
                 | difference(['nfs', 'nfs4']) | length == 0)
         or oim_mount_preflight_fstab_types == [fs_type] }}
  ansible.builtin.set_fact:
    oim_mount_preflight_live_exact: >-
      {{ oim_mount_preflight_live_records | length == 1
         and oim_mount_preflight_live_records[0].source == source
         and oim_mount_preflight_live_records[0].target
             == oim_mount_preflight_canonical_path.stdout
         and oim_mount_preflight_type_matches_live | bool }}
    oim_mount_preflight_fstab_exact: >-
      {{ oim_mount_preflight_fstab_records | length > 0
         and (oim_mount_preflight_fstab_records | map(attribute='source')
              | unique | list) == [source]
         and (oim_mount_preflight_fstab_records | map(attribute='target')
              | unique | list)
             == [oim_mount_preflight_canonical_path.stdout]
         and oim_mount_preflight_type_matches_fstab | bool }}

- name: Reject foreign live or fstab attachment before mutation
  ansible.builtin.assert:
    that:
      - >-
        oim_mount_preflight_live_records | length == 0
        or oim_mount_preflight_live_exact | bool
      - >-
        oim_mount_preflight_fstab_records | length == 0
        or oim_mount_preflight_fstab_exact | bool
    fail_msg: >-
      Refusing to mount storage '{{ item.name | default('') }}' because target
      '{{ oim_mount_preflight_canonical_path.stdout }}' already has a foreign
      or conflicting live/fstab attachment. No mount or fstab state was
      changed.
