---
## Mount an entry on the OIM node.
- name: Resolve mount_params profile if specified
  ansible.builtin.set_fact:
    resolved_mount_profile: "{{ mount_params[item.mount_params] | default({}) }}"
  when: item.mount_params is defined and item.mount_params in mount_params

- name: Initialize client mount path (new schema)
  ansible.builtin.set_fact:
    mount_point: "{{ item.mount_point }}"
    source: "{{ item.source }}"
    fs_type: "{{ item.fs_type | default(resolved_mount_profile.fs_type | default('auto')) }}"
    mnt_opts: "{{ item.mnt_opts | default(resolved_mount_profile.mnt_opts | default('defaults')) }}"
    dump_freq: "{{ item.dump_freq | default(resolved_mount_profile.dump_freq | default('0')) }}"
    fsck_pass: "{{ item.fsck_pass | default(resolved_mount_profile.fsck_pass | default('0')) }}"

- name: Validate OIM mount ownership identity before mutation
  ansible.builtin.include_tasks: validate_oim_mount_ledger.yml

- name: Create the directory for mounting on OIM
  ansible.builtin.file:
    path: "{{ mount_point }}"
    state: directory
    mode: "{{ mounted_dir_perm }}"
  register: dir_check
  ignore_errors: true

- name: Fallback to tcp nfs if rdma
  ansible.builtin.set_fact:
    mnt_opts: "{{ default_client_mount_options }}"
  when: "'rdma' in mnt_opts"

- name: Mount NFS share on OIM with fstab entry
  block:
    - name: Add/ensure fstab entry via mount module
      ansible.posix.mount:
        src: "{{ source }}"
        path: "{{ mount_point }}"
        opts: "{{ mnt_opts }}"
        state: mounted
        fstype: "{{ fs_type }}"

  rescue:
    - name: Remove from fstab on failure
      ansible.posix.mount:
        path: "{{ mount_point }}"
        state: absent_from_fstab
      when: not (oim_mount_preflight_fstab_exact | default(false) | bool)

    - name: Preserve pre-existing exact fstab entry after mount failure
      ansible.builtin.debug:
        msg: >-
          Mount failed, but the pre-existing exact fstab entry for
          {{ source }} -> {{ mount_point }} was preserved.
      when: oim_mount_preflight_fstab_exact | default(false) | bool

    - name: Fail if OIM mount failed
      ansible.builtin.fail:
        msg: "{{ oim_nfs_fail_msg }}"

- name: Record verified OIM mount ownership
  ansible.builtin.include_tasks: record_oim_mount.yml
  when: not ansible_check_mode

- name: Report deferred OIM mount ownership recording in check mode
  ansible.builtin.debug:
    msg: >-
      Check mode: the mount ownership ledger was not updated for
      {{ source }} -> {{ mount_point }} because the mount was only simulated.
  when: ansible_check_mode
