---
- name: Validate lifecycle status result
  ansible.builtin.assert:
    that:
      - orchestrator_lifecycle_status_result | type_debug == 'dict'
      - orchestrator_lifecycle_status_result.orchestrator_status | default({}) | type_debug == 'dict'
      - orchestrator_lifecycle_status_result.failed_nodes_report | default({}) | type_debug == 'dict'
    fail_msg: "{{ orchestrator_lifecycle_invalid_result_msg }}"
    quiet: true

- name: Write failed-node lifecycle report
  ansible.builtin.copy:
    content: >-
      {{ orchestrator_lifecycle_status_result.failed_nodes_report | to_nice_json }}
    dest: "{{ orchestrator_lifecycle_failed_nodes_file }}"
    mode: "{{ orchestrator_lifecycle_artifact_mode }}"

- name: Write aggregate Orchestrator lifecycle status
  ansible.builtin.copy:
    content: >-
      {{ orchestrator_lifecycle_status_result.orchestrator_status | to_nice_yaml }}
    dest: "{{ orchestrator_lifecycle_status_file }}"
    mode: "{{ orchestrator_lifecycle_artifact_mode }}"
