---
external_boot_verification_status_file: "{{ orchestrator_output_dir }}/orchestrator_status.yml"
external_boot_verification_missing_status_msg: >-
  Cannot verify externally booted nodes because orchestrator_status.yml does
  not exist. Run the provision phase before booting the nodes.
external_boot_verification_invalid_status_msg: >-
  orchestrator_status.yml is malformed or belongs to a different PXE mapping.
  Run the provision phase before external boot verification.
external_boot_verification_invalid_node_msg: >-
  Pending node status must contain a permanent XNAME and ADMIN_IP.
external_boot_verification_no_nodes_msg: No nodes require external boot verification.
external_boot_verification_blocked_nodes_msg: >-
  External boot verification cannot start because provisioning is incomplete
  for XNAME(s). Run provisioning successfully before boot verification:
external_boot_verification_failed_msg: >-
  External boot verification failed for XNAME(s):
