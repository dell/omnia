---
# include_software_config.yml — Load cluster metadata from catalog and network_spec.
#
# Feature flags (service_k8s_support, slurm_support, openldap_support, etc.)
# and OS metadata (cluster_os_type, cluster_os_version) are derived from the
# catalog in orchestrator_setup. This task file loads network_spec data and
# sets any remaining facts that downstream roles expect.

- name: Verify catalog-derived facts are available
  ansible.builtin.assert:
    that:
      - cluster_os_type is defined
      - cluster_os_version is defined
    fail_msg: >-
      Catalog-derived facts are not available. Ensure orchestrator_setup has
      run successfully and loaded the catalog file.
    quiet: true

- name: Parse network_spec data
  ansible.builtin.set_fact:
    network_data: "{{ network_data | default({}) | combine({item.key: item.value}) }}"
  with_dict: "{{ Networks }}"

- name: Set admin network nic and ip
  ansible.builtin.set_fact:
    admin_nic_ip: "{{ network_data.admin_network.primary_oim_admin_ip }}"
    admin_nic: "{{ network_data.admin_network.oim_nic_name }}"
    admin_netmask_bits: "{{ network_data.admin_network.netmask_bits }}"
    ib_network_subnet: "{{ network_data.ib_network.subnet }}"
    ib_network_dns: "{{ network_data.ib_network.dns | default([]) }}"
    dns: "{{ network_data.admin_network.dns }}"

- name: Set dns_enabled default when not defined
  ansible.builtin.set_fact:
    dns_enabled: false
  when: dns_enabled is not defined

- name: Extract k8s version from catalog
  ansible.builtin.set_fact:
    service_k8s_version: >-
      {% set fl_name = catalog_data.catalog.functionallayer
         | selectattr('name', 'match', '.*kube.*|.*k8s.*')
         | map(attribute='name')
         | first
         | default('') -%}
      {% set fl_ver = fl_name | regex_search('[0-9]+\\.[0-9]+\\.[0-9]+')
         | default('', true) -%}
      {% set pkg_ver = (catalog_data.catalog.packages.kubeadm.name
         | default('')
         | regex_search('[0-9]+\\.[0-9]+\\.[0-9]+')
         | default('', true))
         if (catalog_data.catalog.packages is defined and
             catalog_data.catalog.packages.kubeadm is defined)
         else '' -%}
      {% set ns = namespace(key_ver='') -%}
      {% if not fl_ver and not pkg_ver and catalog_data.catalog.packages is defined -%}
        {% for key in catalog_data.catalog.packages.keys() -%}
          {% if not ns.key_ver and key is match('kubeadm.*|kubectl.*|kubelet.*') -%}
            {% set ns.key_ver = catalog_data.catalog.packages[key].name
               | default(key)
               | regex_search('[0-9]+\\.[0-9]+\\.[0-9]+')
               | default('', true) -%}
          {% endif -%}
        {% endfor -%}
      {% endif -%}
      {{ fl_ver if fl_ver else (pkg_ver if pkg_ver else ns.key_ver) }}
  when:
    - service_k8s_support | default(false) | bool
    - catalog_data is defined
