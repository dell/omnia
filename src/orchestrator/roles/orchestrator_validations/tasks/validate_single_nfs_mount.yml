---
# validate_single_nfs_mount.yml — Validate a single NFS mount entry.
#
# Expects loop_var: nfs_mount (a single mount dict from storage_config.yml)
#
# Checks:
#   1. source field is non-empty
#   2. If source is a local device (/dev/*, UUID=*, LABEL=*) or CIFS (//*), skip NFS checks
#   3. source contains ':' separator (ip:/path format)
#   4. Extracted NFS server IP is non-empty
#   5. NFS server is reachable (ping)

- name: "Validate source is not empty for mount ({{ nfs_mount.name }})"
  ansible.builtin.fail:
    msg: >-
      {{ nfs_source_empty_msg }} Mount name: '{{ nfs_mount.name }}'.
      Please set a valid source in storage_config.yml.
  when: nfs_mount.source is not defined or nfs_mount.source | trim | length == 0

- name: "Check if source is a local device or CIFS ({{ nfs_mount.name }})"
  ansible.builtin.set_fact:
    _nfs_source_is_local: >-
      {{ nfs_mount.source | trim is match('^(/dev/|UUID=|LABEL=|//)') }}

- name: "Skip NFS validation for local/CIFS source ({{ nfs_mount.name }})"
  ansible.builtin.debug:
    msg: >-
      Mount '{{ nfs_mount.name }}' has local/CIFS source '{{ nfs_mount.source }}'.
      Skipping NFS reachability check.
  when: _nfs_source_is_local | bool

- name: Validate NFS source format and reachability
  when: not (_nfs_source_is_local | bool)
  block:
    - name: "Validate NFS source contains ':' separator ({{ nfs_mount.name }})"
      ansible.builtin.fail:
        msg: >-
          {{ nfs_source_format_msg }} Mount name: '{{ nfs_mount.name }}'.
          Source: '{{ nfs_mount.source }}'.
          Expected format: server_ip:/export/path (e.g., 192.168.1.100:/share/data).
      when: "':' not in nfs_mount.source"

    - name: "Extract NFS server IP from source ({{ nfs_mount.name }})"
      ansible.builtin.set_fact:
        _nfs_server_ip: "{{ nfs_mount.source | regex_replace(':.*$', '') | trim }}"

    - name: "Validate NFS server IP is not empty ({{ nfs_mount.name }})"
      ansible.builtin.fail:
        msg: >-
          {{ nfs_ip_empty_msg }} Mount name: '{{ nfs_mount.name }}'.
          Source: '{{ nfs_mount.source }}'.
          The server IP/hostname portion before ':' is empty.
      when: _nfs_server_ip | length == 0

    - name: "Check NFS server reachability for mount ({{ _nfs_server_ip }})"
      ansible.builtin.command:
        cmd: "ping -c 2 -W 3 {{ _nfs_server_ip }}"
      register: _nfs_ping_result
      changed_when: false
      failed_when: false

    - name: "Fail if NFS server is unreachable ({{ nfs_mount.name }})"
      ansible.builtin.fail:
        msg: >-
          {{ nfs_unreachable_msg }}
          Mount name: '{{ nfs_mount.name }}'.
          NFS server: '{{ _nfs_server_ip }}'.
          Source: '{{ nfs_mount.source }}'.
          Ping output: {{ _nfs_ping_result.stderr | default(_nfs_ping_result.stdout | default('no output')) }}.
          Ensure the NFS server is powered on, network-accessible from OIM, and firewall rules allow traffic.
      when: _nfs_ping_result.rc != 0
