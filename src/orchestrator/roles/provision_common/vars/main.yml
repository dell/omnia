---

# Paths (mirror configure_ochami/vars/main.yml until configure_ochami is deleted)
openchami_share_path: /opt/omnia/openchami
openchami_work_dir: "{{ hostvars['localhost']['oim_shared_path'] }}/omnia/openchami/workdir"
nodes_dir: "{{ openchami_work_dir }}/nodes"
boot_svc_dir: "{{ openchami_work_dir }}/boot"
metadata_svc_dir: "{{ openchami_work_dir }}/metadata-service"
telemetry_share_path: "{{ hostvars['localhost']['oim_shared_path'] }}/omnia/telemetry"
openchami_config_vars_path: "{{ openchami_share_path }}/configs_vars.yaml"

# Templates — point to configure_ochami templates until they are migrated
ochami_template_dir: "{{ role_path }}/../configure_ochami/templates"
openchami_nodes_template: "{{ ochami_template_dir }}/nodes/nodes.yaml.j2"
openchami_groups_template: "{{ ochami_template_dir }}/nodes/groups.yaml.j2"
openchami_hostname_template: "{{ ochami_template_dir }}/nodes/hostname.yaml.j2"
boot_svc_template: "{{ ochami_template_dir }}/boot_svc/boot-svc.yaml.j2"
ms_defaults_template: "{{ ochami_template_dir }}/metadata_svc/ms-defaults.yaml.j2"
ms_group_common_template: "{{ ochami_template_dir }}/metadata_svc/ms-group-common.yaml.j2"

# Generated file paths
openchami_nodes_vars_path: "{{ nodes_dir }}/nodes.yaml"
openchami_hostname_vars_path: "{{ nodes_dir }}/hostname.yaml"
ms_defaults_dest: "{{ metadata_svc_dir }}/ms-defaults.yaml"
ms_group_common_dest: "{{ metadata_svc_dir }}/ms-group-common.yaml"

# SSH keys
ssh_key_path: /root/.ssh/oim_rsa.pub
ssh_private_key_path: /root/.ssh/oim_rsa

# Service retry settings
service_retries: 16
service_retry_interval: 15

# Common metadata-service groups
common_metadata_svc_groups:
  - ssh
  - chrony
  - phone_home

# Common group template
openchami_groups_common_template: "{{ ochami_template_dir }}/nodes/groups_common.yaml.j2"

# DNS vars (forwarded from localhost)
admin_nic_ip: "{{ hostvars['localhost']['admin_nic_ip'] }}"
domain_name: "{{ hostvars['localhost']['domain_name'] }}"

# SSH Host patterns (forwarded from OIM)
k8s_cluster_hostnames: "{{ hostvars['localhost']['k8s_cluster_hostnames'] | default([]) }}"
slurm_cluster_hostnames: "{{ hostvars['localhost']['slurm_cluster_hostnames'] | default([]) }}"
k8s_cluster_ip_patterns: "{{ hostvars['localhost']['k8s_cluster_ip_patterns'] | default([]) }}"
slurm_cluster_ip_patterns: "{{ hostvars['localhost']['slurm_cluster_ip_patterns'] | default([]) }}"
slurm_control_ssh_patterns: "{{ hostvars['oim']['slurm_ssh_patterns'] | default('*') }}"
k8s_control_ssh_patterns: "{{ hostvars['oim']['k8s_ssh_patterns'] | default('*') }}"
all_group_names_present: "{{ hostvars['oim']['all_group_names_present'] | default(false) }}"

# Slurm node presence flags
login_compiler_node_present: "{{ hostvars['oim']['login_compiler_node_present'] | default(false) }}"
slurm_node_present: "{{ hostvars['oim']['slurm_node_present'] | default(false) }}"

# DCGM
dcgm_support: "{{ hostvars['localhost'].get('telemetry_sources', {}).get('dcgm', {}).get('metrics_enabled', true) | bool }}"
dcgm_service_name: "nvidia-dcgm"

# Slurm defaults
home_dir: /var/lib/slurm
user: slurm
munge_user: munge
munge_group: munge
mysql_user: mysql
mysql_group: mysql

# LDAP
tls_cert_path: "/etc/openldap/certs/ldapserver.crt"
ldap_conf_dest: "/etc/openldap/ldap.conf"
sasl_nocanon_regxp: "SASL_NOCANON\ton"
sasl_nacanon_replace1: "SASL_NOCANON\ton\nBASE\t{{ hostvars['localhost']['ldap_search_base'] }}"
sasl_nacanon_replace2: "SASL_NOCANON\ton\nURI\tldap://{{ hostvars['localhost']['ldap_server_ip'] }}"
sasl_nacanon_replace3: "SASL_NOCANON\ton\nTLS_CACERT\t{{ tls_cert_path }}"
sasl_nacanon_replace4: "SASL_NOCANON\ton\nURI\tldap://{{ hostvars['localhost']['ldap_server_ip'] }}:636"

# Boot-service params
boot_svc_params_metadata_svc: 'cloud-init=enabled ds=nocloud-net;s=http://{{ cluster_boot_ip }}:8081/metadata-service/'
boot_svc_params_opts: 'ip=dhcp rd.live.image rd.live.ram rd.neednet=1 rd.driver.blacklist=ccp,edac_core,power_meter,ahci,megaraid_sas modprobe.blacklist=ccp,edac_core,power_meter,ahci,megaraid_sas libata.force=1:disable,2:disable,3:disable,4:disable rd.luks=0 rd.md=0 rd.dm=0 console=tty0 console=ttyS0,115200 selinux=0 apparmor=0 ip6=off cloud-init=enabled' # noqa: yaml[line-length]

# Error messages
metadata_svc_failed_msg: |
  metadata-service is not running after {{ service_retries }} retries.
  Next steps:
  1. Check service status: systemctl status metadata-service
  2. Check if openchami.target dependencies are satisfied: systemctl list-dependencies openchami.target
  3. Restart service: systemctl restart metadata-service
  4. Rerun the provisioning playbook

openchami_target_failed_msg: |
  openchami.target is not up after {{ service_retries }} retries.
  Next steps:
  1. Check target status: systemctl status openchami.target
  2. View logs: journalctl -u openchami.target -n 50
  3. Restart target: systemctl restart openchami.target
  4. Rerun the provisioning playbook

ochami_discovery_failed_msg: |
  Failed to discover ochami nodes after retries.
  Next steps:
  1. Verify nodes.yaml is valid: cat {{ openchami_nodes_vars_path }}
  2. Check SMD connectivity: /usr/bin/ochami smd service status
  3. Restart openchami.target: systemctl restart openchami.target
  4. Rerun the provisioning playbook

ms_group_load_fail_msg: |
  Template loading failed. Ensure the template exists in the specified path
  and is compatible with the defined functional groups.

# File/dir permissions
file_permissions_644: "{{ hostvars['localhost']['file_permissions_644'] }}"
file_permissions_600: "{{ hostvars['localhost']['file_permissions_600'] }}"
dir_permissions_755: "{{ hostvars['localhost']['dir_permissions_755'] }}"

# slurm_config defaults file path (needed by metadata-service group templates)
default_file_path: "{{ role_path }}/../slurm_config/defaults/main.yml"

# Additional metadata-service
additional_metadata_svc_common_group_name: additional_metadata_svc
additional_metadata_svc_fg_group_prefix: "additional_metadata_svc_"
additional_metadata_svc_fg_groups_template: "{{ ochami_template_dir }}/nodes/groups_additional_fg.yaml.j2"
ms_group_additional_template: "{{ ochami_template_dir }}/metadata_svc/ms-group-additional_metadata_svc.yaml.j2"

# Input project directory
input_project_dir: "{{ hostvars['localhost']['omnia_project_input_dir'] }}"
local_repo_config_path: "{{ hostvars['localhost']['omnia_project_input_dir'] }}/local_repo_config.yml"
