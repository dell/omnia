---

- name: Resolve configured additional metadata-service file
  ansible.builtin.set_fact:
    _smd_additional_metadata_file: >-
      {{ hostvars['localhost']['additional_cloud_init_config_file']
         | default('') | trim }}

- name: Load configured additional metadata-service data
  ansible.builtin.include_vars:
    file: "{{ _smd_additional_metadata_file }}"
    name: _smd_loaded_additional_metadata_config
  when: _smd_additional_metadata_file | length > 0
  no_log: true

- name: Normalize configured additional metadata-service data
  ansible.builtin.set_fact:
    _smd_additional_metadata_config: >-
      {{ _smd_loaded_additional_metadata_config
         if (_smd_additional_metadata_file | length > 0)
         else {} }}
  no_log: true

- name: Validate additional metadata-service data for SMD safety checks
  ansible.builtin.assert:
    that:
      - _smd_additional_metadata_config | type_debug == 'dict'
      - >-
        _smd_additional_metadata_config.common | default({})
        | type_debug == 'dict'
      - >-
        _smd_additional_metadata_config.groups | default({})
        | type_debug == 'dict'
    fail_msg: >-
      Refusing SMD group reconciliation because the configured additional
      cloud-init file does not contain dictionary-valued common and groups
      sections: {{ _smd_additional_metadata_file }}.

- name: Resolve allowed auxiliary SMD groups
  ansible.builtin.set_fact:
    _smd_allowed_auxiliary_groups: >-
      {{ (common_metadata_svc_groups | default(['ssh', 'chrony']))
         + ['phone_home']
         + ([additional_metadata_svc_common_group_name]
            if (_smd_additional_metadata_config.common | default({})
                | length > 0)
            else [])
         + (_smd_additional_metadata_config.groups | default({})
            | dict2items | map(attribute='key')
            | map('regex_replace', '^', additional_metadata_svc_fg_group_prefix)
            | list) }}
    _smd_managed_auxiliary_groups:
      - "{{ additional_metadata_svc_common_group_name }}"
