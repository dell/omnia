---
# Resolve one group's cloud-init content from cloud_init.config_file.
# Referenced files have already passed pre-mutation semantic validation.
# Ordered customization is expressed as runcmd inside the single
# cloud_init.config_file (ER-ORCH-009 finalized spec).

- name: Resolve settings for {{ functional_group_cloud_init_name }}
  ansible.builtin.set_fact:
    _functional_group_cloud_init_settings: >-
      {{ hostvars['localhost']['functional_group_config'] | default({})
         | functional_group_settings(
             functional_group_cloud_init_name
           ) }}
    _functional_group_cloud_init_provenance: >-
      {{ hostvars['localhost']['functional_group_config'] | default({})
         | functional_group_provenance(
             functional_group_cloud_init_name
           ) }}
  no_log: true

- name: Load cloud-init content for {{ functional_group_cloud_init_name }}
  ansible.builtin.set_fact:
    _functional_group_cloud_init_merged: >-
      {{ (lookup(
            'ansible.builtin.file',
            _functional_group_cloud_init_settings.cloud_init_config_file
          ) | from_yaml | default({}, true))
         if (_functional_group_cloud_init_settings.cloud_init_config_file
             | default('') | trim | length > 0)
         else {} }}
  no_log: true

- name: Record effective cloud-init for {{ functional_group_cloud_init_name }}
  ansible.builtin.set_fact:
    _functional_group_cloud_init_data: >-
      {{ _functional_group_cloud_init_data
         | combine({functional_group_cloud_init_name:
                    _functional_group_cloud_init_merged}) }}
  when: _functional_group_cloud_init_merged | length > 0
  no_log: true

- name: Report cloud-init provenance for {{ functional_group_cloud_init_name }}
  ansible.builtin.debug:
    msg: >-
      {{ functional_group_cloud_init_name }}: cloud_init_config_file resolved
      from '{{ _functional_group_cloud_init_provenance.cloud_init_config_file }}'.
    verbosity: 1
