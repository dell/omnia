---
# ADMIN_IP/ADMIN_MAC select candidates. A historical candidate must also match
# the XNAME stored after the last successful provision. Python produces an
# immutable plan; Ansible keeps every authenticated mutation and readback
# visible and ordered.

- name: Resolve desired and previously managed SMD identities
  ansible.builtin.set_fact:
    _smd_reconcile_desired_nodes: >-
      {{ hostvars['localhost']['read_mapping_file']['dict']
         | dict2items | map(attribute='value') | list }}
    _smd_reconcile_managed_nodes: >-
      {{ hostvars['localhost']['smd_managed_identity_nodes'] | default([]) }}
    _smd_reconcile_base_url: >-
      {{ 'https://' ~ hostvars['localhost']['oim_node_name']
         ~ '.' ~ hostvars['localhost']['domain_name'] ~ ':8443' }}

- name: Query live SMD Ethernet interfaces for reconciliation
  ansible.builtin.uri:
    url: "{{ _smd_reconcile_base_url }}/hsm/v2/Inventory/EthernetInterfaces"
    method: GET
    status_code: 200
    validate_certs: false
    headers:
      Authorization: "Bearer {{ openchami_access_token }}"
  register: _smd_reconcile_interfaces
  retries: 5
  delay: 2
  until: _smd_reconcile_interfaces.status | default(0) == 200
  no_log: true

- name: Build SMD identity reconciliation plan
  analyze_smd_identity:
    desired_nodes: "{{ _smd_reconcile_desired_nodes }}"
    managed_nodes: "{{ _smd_reconcile_managed_nodes }}"
    interfaces: "{{ _smd_reconcile_interfaces.json | default([]) }}"
    require_present: false
  register: _smd_reconcile_plan

- name: Reject unsafe SMD identity reconciliation before mutation
  ansible.builtin.assert:
    that:
      - _smd_reconcile_plan.input_errors | length == 0
      - _smd_reconcile_plan.ownership_errors | length == 0
      - _smd_reconcile_plan.stale_interfaces_missing_id | length == 0
    fail_msg: >-
      Refusing SMD reconciliation. Input errors={{
      _smd_reconcile_plan.input_errors }}; ownership errors={{
      _smd_reconcile_plan.ownership_errors }}; selected interfaces without
      deletion IDs={{ _smd_reconcile_plan.stale_interfaces_missing_id }}.

- name: Resolve retired SMD node identities
  ansible.builtin.set_fact:
    _smd_reconcile_retired_xnames: >-
      {{ _smd_reconcile_plan.retired_xnames | default([]) }}
    _smd_reconcile_interface_ids: >-
      {{ _smd_reconcile_plan.stale_interface_ids | default([]) }}

- name: Report guarded SMD identity plan
  ansible.builtin.debug:
    msg:
      stale_interface_ids: "{{ _smd_reconcile_plan.stale_interface_ids }}"
      stale_macs: "{{ _smd_reconcile_plan.stale_macs }}"
      retired_xnames: "{{ _smd_reconcile_retired_xnames }}"
  when: >-
    (_smd_reconcile_plan.stale_interfaces | length > 0)
    or (_smd_reconcile_retired_xnames | length > 0)

- name: Reconcile dependencies for retired SMD identities
  when: _smd_reconcile_retired_xnames | length > 0
  block:
    - name: Query SMD groups for retirement planning
      ansible.builtin.uri:
        url: "{{ _smd_reconcile_base_url }}/hsm/v2/groups"
        method: GET
        status_code: 200
        validate_certs: false
        headers:
          Authorization: "Bearer {{ openchami_access_token }}"
      register: _smd_reconcile_groups
      retries: 5
      delay: 2
      until: _smd_reconcile_groups.status | default(0) == 200
      no_log: true

    - name: Query metadata identities for retirement planning
      ansible.builtin.uri:
        url: "{{ _smd_reconcile_base_url }}/metadata-service/instanceinfos"
        method: GET
        status_code: 200
        validate_certs: false
        headers:
          Authorization: "Bearer {{ openchami_access_token }}"
      register: _smd_reconcile_instanceinfos
      retries: 5
      delay: 2
      until: _smd_reconcile_instanceinfos.status | default(0) == 200
      no_log: true

    - name: Query SMD Redfish endpoints for retirement planning
      ansible.builtin.uri:
        url: >-
          {{ _smd_reconcile_base_url }}/hsm/v2/Inventory/RedfishEndpoints
        method: GET
        status_code: [200, 404]
        validate_certs: false
        headers:
          Authorization: "Bearer {{ openchami_access_token }}"
      register: _smd_reconcile_redfish_query
      retries: 5
      delay: 2
      until: _smd_reconcile_redfish_query.status | default(0) in [200, 404]
      no_log: true

    - name: Query SMD component and state dependencies for retirement planning
      ansible.builtin.uri:
        url: "{{ _smd_reconcile_base_url }}{{ item.path }}"
        method: GET
        status_code: 200
        validate_certs: false
        headers:
          Authorization: "Bearer {{ openchami_access_token }}"
      loop:
        - name: component_endpoints
          path: /hsm/v2/Inventory/ComponentEndpoints
        - name: state_components
          path: /hsm/v2/State/Components
      loop_control:
        label: "{{ item.name }}"
      register: _smd_reconcile_dependency_queries
      retries: 5
      delay: 2
      until: _smd_reconcile_dependency_queries.status | default(0) == 200
      no_log: true

    - name: Build immutable SMD dependency retirement plan
      plan_smd_retirement:
        retired_xnames: "{{ _smd_reconcile_retired_xnames }}"
        groups: "{{ _smd_reconcile_groups.json | default({}) }}"
        instanceinfos: >-
          {{ _smd_reconcile_instanceinfos.json | default({}) }}
        redfish_endpoints: >-
          {{ _smd_reconcile_redfish_query.json
             if (_smd_reconcile_redfish_query.status == 200)
             else {'RedfishEndpoints': []} }}
        component_endpoints: >-
          {{ _smd_reconcile_dependency_queries.results[0].json
             | default({}) }}
        ethernet_interfaces: >-
          {{ _smd_reconcile_interfaces.json | default([]) }}
        state_components: >-
          {{ _smd_reconcile_dependency_queries.results[1].json
             | default({}) }}
      register: _smd_retirement_plan

    - name: Reject unsafe SMD dependency retirement before mutation
      ansible.builtin.assert:
        that:
          - _smd_retirement_plan.errors | length == 0
        fail_msg: >-
          Refusing to retire SMD identity dependencies:
          {{ _smd_retirement_plan.errors }}

    - name: Report SMD dependency retirement plan
      ansible.builtin.debug:
        msg:
          group_memberships: "{{ _smd_retirement_plan.group_memberships }}"
          metadata_xnames: >-
            {{ _smd_retirement_plan.metadata_identities
               | map(attribute='xname') | list }}
          component_endpoint_ids: >-
            {{ _smd_retirement_plan.component_endpoint_ids }}
          redfish_endpoint_ids: >-
            {{ _smd_retirement_plan.redfish_endpoint_ids }}
          state_component_ids: >-
            {{ _smd_retirement_plan.state_component_ids }}
          ethernet_interface_ids: >-
            {{ _smd_retirement_plan.ethernet_interface_ids }}

    - name: Include all interfaces owned by fully retired components
      ansible.builtin.set_fact:
        _smd_reconcile_interface_ids: >-
          {{ (_smd_reconcile_interface_ids
              + _smd_retirement_plan.ethernet_interface_ids)
             | unique | list }}

    - name: Remove retired identities from SMD groups
      ansible.builtin.uri:
        url: >-
          {{ _smd_reconcile_base_url }}/hsm/v2/groups/{{ item.group
          }}/members/{{ item.xname }}
        method: DELETE
        status_code: [200, 204, 404]
        validate_certs: false
        headers:
          Authorization: "Bearer {{ openchami_access_token }}"
      loop: "{{ _smd_retirement_plan.group_memberships }}"
      loop_control:
        label: "{{ item.group }} -> {{ item.xname }}"
      register: _smd_reconcile_group_delete
      changed_when: >-
        (_smd_reconcile_group_delete.status | default(404)) != 404
      no_log: true

    - name: Verify retired SMD group memberships are absent
      ansible.builtin.uri:
        url: >-
          {{ _smd_reconcile_base_url }}/hsm/v2/groups/{{ item.group }}
        method: GET
        status_code: [200, 404]
        validate_certs: false
        headers:
          Authorization: "Bearer {{ openchami_access_token }}"
      loop: "{{ _smd_retirement_plan.group_memberships }}"
      loop_control:
        label: "{{ item.group }} -> {{ item.xname }}"
      register: _smd_reconcile_groups_verify
      retries: 5
      delay: 2
      until: >-
        (_smd_reconcile_groups_verify.status | default(0) == 404)
        or
        (item.xname not in
         (((_smd_reconcile_groups_verify.json | default({}))
           .get('members', {})).get('ids', [])))
      no_log: true

    - name: Delete metadata identities for retired XNAMEs
      ansible.builtin.uri:
        url: >-
          {{ _smd_reconcile_base_url ~ '/metadata-service/instanceinfos/'
             ~ item.uid }}
        method: DELETE
        status_code: [200, 204, 404]
        validate_certs: false
        headers:
          Authorization: "Bearer {{ openchami_access_token }}"
      loop: "{{ _smd_retirement_plan.metadata_identities }}"
      loop_control:
        label: "{{ item.xname }}"
      no_log: true

    - name: Verify retired metadata identities are absent
      ansible.builtin.uri:
        url: >-
          {{ _smd_reconcile_base_url
             }}/metadata-service/instanceinfos/{{ item.uid }}
        method: GET
        status_code: [200, 404]
        validate_certs: false
        headers:
          Authorization: "Bearer {{ openchami_access_token }}"
      loop: "{{ _smd_retirement_plan.metadata_identities }}"
      loop_control:
        label: "{{ item.xname }}"
      register: _smd_reconcile_instanceinfos_verify
      retries: 5
      delay: 2
      until: _smd_reconcile_instanceinfos_verify.status | default(0) == 404
      no_log: true

    - name: Delete retired SMD component endpoints
      ansible.builtin.uri:
        url: >-
          {{ _smd_reconcile_base_url
             }}/hsm/v2/Inventory/ComponentEndpoints/{{ item }}
        method: DELETE
        status_code: [200, 204, 404]
        validate_certs: false
        headers:
          Authorization: "Bearer {{ openchami_access_token }}"
      loop: "{{ _smd_retirement_plan.component_endpoint_ids }}"
      loop_control:
        label: "{{ item }}"
      register: _smd_reconcile_compep_delete
      changed_when: _smd_reconcile_compep_delete.status | default(404) != 404
      no_log: true

    - name: Delete retired SMD Redfish endpoints
      ansible.builtin.uri:
        url: >-
          {{ _smd_reconcile_base_url
             }}/hsm/v2/Inventory/RedfishEndpoints/{{ item }}
        method: DELETE
        status_code: [200, 204, 404]
        validate_certs: false
        headers:
          Authorization: "Bearer {{ openchami_access_token }}"
      loop: "{{ _smd_retirement_plan.redfish_endpoint_ids }}"
      loop_control:
        label: "{{ item }}"
      register: _smd_reconcile_rfe_delete
      changed_when: _smd_reconcile_rfe_delete.status | default(404) != 404
      no_log: true

    - name: Delete retired SMD State Components
      ansible.builtin.uri:
        url: >-
          {{ _smd_reconcile_base_url
             }}/hsm/v2/State/Components/{{ item }}
        method: DELETE
        status_code: [200, 204, 404]
        validate_certs: false
        headers:
          Authorization: "Bearer {{ openchami_access_token }}"
      loop: "{{ _smd_retirement_plan.state_component_ids }}"
      loop_control:
        label: "{{ item }}"
      register: _smd_reconcile_component_delete
      changed_when: >-
        _smd_reconcile_component_delete.status | default(404) != 404
      no_log: true

    - name: Verify retired SMD component endpoints are absent
      ansible.builtin.uri:
        url: >-
          {{ _smd_reconcile_base_url
             }}/hsm/v2/Inventory/ComponentEndpoints/{{ item }}
        method: GET
        status_code: [200, 404]
        validate_certs: false
        headers:
          Authorization: "Bearer {{ openchami_access_token }}"
      loop: "{{ _smd_retirement_plan.component_endpoint_ids }}"
      loop_control:
        label: "{{ item }}"
      register: _smd_reconcile_compep_verify
      retries: 5
      delay: 2
      until: _smd_reconcile_compep_verify.status | default(0) == 404
      no_log: true

    - name: Verify retired SMD Redfish endpoints are absent
      ansible.builtin.uri:
        url: >-
          {{ _smd_reconcile_base_url
             }}/hsm/v2/Inventory/RedfishEndpoints/{{ item }}
        method: GET
        status_code: [200, 404]
        validate_certs: false
        headers:
          Authorization: "Bearer {{ openchami_access_token }}"
      loop: "{{ _smd_retirement_plan.redfish_endpoint_ids }}"
      loop_control:
        label: "{{ item }}"
      register: _smd_reconcile_rfe_verify
      retries: 5
      delay: 2
      until: _smd_reconcile_rfe_verify.status | default(0) == 404
      no_log: true

    - name: Verify retired SMD State Components are absent
      ansible.builtin.uri:
        url: >-
          {{ _smd_reconcile_base_url
             }}/hsm/v2/State/Components/{{ item }}
        method: GET
        status_code: [200, 404]
        validate_certs: false
        headers:
          Authorization: "Bearer {{ openchami_access_token }}"
      loop: "{{ _smd_retirement_plan.state_component_ids }}"
      loop_control:
        label: "{{ item }}"
      register: _smd_reconcile_component_verify
      retries: 5
      delay: 2
      until: _smd_reconcile_component_verify.status | default(0) == 404
      no_log: true

- name: Delete conflicting SMD Ethernet interfaces by interface ID
  ansible.builtin.uri:
    url: >-
      {{ _smd_reconcile_base_url
         }}/hsm/v2/Inventory/EthernetInterfaces/{{ item }}
    method: DELETE
    status_code: [200, 204, 404]
    validate_certs: false
    headers:
      Authorization: "Bearer {{ openchami_access_token }}"
  loop: "{{ _smd_reconcile_interface_ids }}"
  loop_control:
    label: "{{ item }}"
  register: _smd_reconcile_interface_delete
  changed_when: >-
    _smd_reconcile_interface_delete.status | default(404) != 404
  no_log: true

- name: Verify conflicting SMD Ethernet interfaces are absent
  ansible.builtin.uri:
    url: >-
      {{ _smd_reconcile_base_url
         }}/hsm/v2/Inventory/EthernetInterfaces/{{ item }}
    method: GET
    status_code: [200, 404]
    validate_certs: false
    headers:
      Authorization: "Bearer {{ openchami_access_token }}"
  loop: "{{ _smd_reconcile_interface_ids }}"
  loop_control:
    label: "{{ item }}"
  register: _smd_reconcile_interfaces_verify
  retries: 5
  delay: 2
  until: _smd_reconcile_interfaces_verify.status | default(0) == 404
  no_log: true

- name: Verify no SMD identity collision remains after reconciliation
  ansible.builtin.include_tasks: check_smd_identity_collisions.yml
