---
# This pre-provision check intentionally allows desired interfaces to be absent
# on a fresh deployment. It rejects only existing SMD records selected by an
# ADMIN_IP or ADMIN_MAC in the complete desired PXE mapping. XNAME is used only
# to verify the selected interface owner.

- name: Resolve desired OpenCHAMI identity state
  ansible.builtin.set_fact:
    _smd_collision_desired_nodes: >-
      {{ hostvars['localhost']['read_mapping_file']['dict']
         | dict2items | map(attribute='value') | list }}
    _smd_collision_base_url: >-
      {{ 'https://' ~ hostvars['localhost']['oim_node_name']
         ~ '.' ~ hostvars['localhost']['domain_name'] ~ ':8443' }}

- name: Query live SMD Ethernet interfaces before provisioning
  ansible.builtin.uri:
    url: "{{ _smd_collision_base_url }}/hsm/v2/Inventory/EthernetInterfaces"
    method: GET
    status_code: 200
    validate_certs: false
    headers:
      Authorization: "Bearer {{ openchami_access_token }}"
  register: _smd_collision_interfaces
  retries: 5
  delay: 2
  until: _smd_collision_interfaces.status | default(0) == 200
  no_log: true

- name: Analyze pre-provision SMD identity collisions
  analyze_smd_identity:
    desired_nodes: "{{ _smd_collision_desired_nodes }}"
    interfaces: "{{ _smd_collision_interfaces.json | default([]) }}"
    require_present: false
  register: _smd_collision_analysis

- name: Stop provisioning when live SMD identities conflict with the mapping
  ansible.builtin.assert:
    that:
      - _smd_collision_analysis.errors | length == 0
      - _smd_collision_analysis.stale_interfaces | length == 0
    fail_msg: >-
      Existing OpenCHAMI SMD records conflict with the desired PXE mapping.
      No records were changed. Resolve the reported stale identities before
      provisioning. Errors: {{ _smd_collision_analysis.errors }}.
      Conflicting interfaces: {{ _smd_collision_analysis.stale_interfaces }}
    success_msg: >-
      Pre-provision SMD identity check passed; no existing records conflict
      with the desired PXE mapping.
