---

- name: Build additional metadata SMD group membership
  ansible.builtin.set_fact:
    _additional_smd_group_label: >-
      {{ additional_metadata_svc_fg_group_prefix }}{{ additional_group_fg_name }}
    _additional_smd_group_members: >-
      {% set result = [] -%}
      {% set target = additional_group_fg_name
                      | regex_replace('^service_kube_control_plane_first_',
                                      'service_kube_control_plane_') -%}
      {% for entry in hostvars['localhost']['read_mapping_file']['dict']
                          | dict2items -%}
      {% set candidate = entry.value.FUNCTIONAL_GROUP_NAME
                         | regex_replace('^service_kube_control_plane_first_',
                                         'service_kube_control_plane_') -%}
      {% if candidate == target -%}
      {% set _ = result.append(entry.value.XNAME) -%}
      {% endif -%}
      {% endfor -%}
      {{ result | sort }}

- name: Reconcile additional metadata SMD group
  openchami_reconcile:
    action: reconcile_groups
    cluster_uri: "{{ openchami_api_uri }}"
    access_token: >-
      {{ ochami_env[cluster_env_key] }}
    ca_cert: "{{ hostvars['localhost']['openchami_ca_cert_path'] }}"
    smd_groups:
      - label: "{{ _additional_smd_group_label }}"
        members:
          ids: "{{ _additional_smd_group_members }}"
  register: _additional_smd_group_reconcile
  no_log: true
