---
# Delete scoped Boot Service and group data before category publication.
# Extracted from configure_ochami/tasks/delete_smd_config.yml.
#
# SMD identity retirement is deliberately not performed here. The provision
# preamble reconciles the complete mapping once, proves current/historical
# ownership through ADMIN_IP and ADMIN_MAC, removes dependencies, and deletes
# EthernetInterfaces by their SMD IDs. The static discovery command later uses
# --overwrite to update identities that remain current.
#
# IMPORTANT: All remaining deletions are SCOPED to the target category only.
# Using --all would wipe registrations from other categories that have
# already been provisioned (e.g. Kubernetes provision followed by Slurm
# provision would delete the K8s nodes from SMD, causing K8s nodes to
# receive random DHCP IPs from the bootloop pool instead of their
# static ADMIN_IPs during PXE boot).
#
# Inputs (set by register_nodes.yml before this file is included):
#   _category_nodes  — list of node dicts for the target category
#   target_fg_names  — list of FG names for the target category

- name: Check OpenCHAMI configuration for shared provisioning reset
  ansible.builtin.stat:
    path: "{{ openchami_config_vars_path }}"
  register: _provision_reset_openchami_config

- name: Require OpenCHAMI configuration for shared provisioning reset
  ansible.builtin.assert:
    that:
      - _provision_reset_openchami_config.stat.exists
      - _provision_reset_openchami_config.stat.isreg
    fail_msg: >-
      OpenCHAMI configuration file not found: {{ openchami_config_vars_path }}.
      Run the deploy stage before provisioning.

- name: Resolve OpenCHAMI API identity for shared provisioning reset
  ansible.builtin.set_fact:
    _provision_reset_cluster_name: >-
      {{ (lookup('file', openchami_config_vars_path) | from_yaml).cluster_name }}
    _provision_reset_cluster_domain: >-
      {{ (lookup('file', openchami_config_vars_path) | from_yaml).cluster_domain }}

- name: Validate OpenCHAMI API identity for shared provisioning reset
  ansible.builtin.assert:
    that:
      - _provision_reset_cluster_name | length > 0
      - _provision_reset_cluster_domain | length > 0
    fail_msg: >-
      OpenCHAMI cluster_name and cluster_domain must be present in
      {{ openchami_config_vars_path }}.

# ── Build scoped deletion targets ──────────────────────────────────────

- name: Build target xnames and MACs for scoped deletion
  ansible.builtin.set_fact:
    _target_node_xnames: "{{ _category_nodes | map(attribute='XNAME') | list }}"
    _target_all_macs: >-
      {{ (_category_nodes | map(attribute='ADMIN_MAC') | list
          + _category_nodes | map(attribute='BMC_MAC') | list)
         | map('lower') | map('regex_replace', '-', ':') | unique | list }}

# ── Boot-service configurations (scoped to target FGs) ────────────────
# Boot-service deletion is also performed (properly scoped) in
# provision_common/tasks/main.yml. We scope here to target FG names
# for defense in depth.

- name: Fetch existing boot configurations
  ansible.builtin.uri:
    url: >-
      https://{{ _provision_reset_cluster_name }}.{{ _provision_reset_cluster_domain
      }}:8443/boot-service/bootconfigurations
    method: GET
    headers:
      Authorization: "Bearer {{ ochami_env[(oim_node_name | upper) + '_ACCESS_TOKEN'] }}"
    status_code: [200]
    validate_certs: false
    return_content: true
  register: existing_boot_configs
  failed_when: false

- name: Delete boot configurations for target functional groups only
  ansible.builtin.uri:
    url: >-
      https://{{ _provision_reset_cluster_name }}.{{ _provision_reset_cluster_domain
      }}:8443/boot-service/bootconfigurations/{{ item.metadata.uid }}
    method: DELETE
    headers:
      Authorization: "Bearer {{ ochami_env[(oim_node_name | upper) + '_ACCESS_TOKEN'] }}"
    status_code: [200, 204, 404]
    validate_certs: false
  loop: >-
    {{ existing_boot_configs.json | default([])
       | selectattr('metadata.name', 'in', target_fg_names)
       | list }}
  loop_control:
    label: "{{ item.metadata.name | default(item.metadata.uid) }}"
  when: existing_boot_configs.json | default([]) | length > 0

# ── Stale boot-service configurations (MAC overlap from other categories) ──
# When a node moves between categories (e.g. kubernetes → slurm), boot
# configs from the previous category may still reference its MAC.
# Boot-service returns whichever config matches first, so the node may
# boot the wrong image. Delete any non-target boot config that contains
# a MAC belonging to the current category's nodes.

- name: Find stale boot configs from other categories referencing current MACs
  ansible.builtin.set_fact:
    _stale_boot_configs: >-
      {% set stale = [] -%}
      {% set target_macs = _target_all_macs -%}
      {% for cfg in (existing_boot_configs.json | default([])) -%}
        {% if cfg.metadata.name not in target_fg_names -%}
          {% set cfg_macs = cfg.spec.macs | default([]) | map('lower') | list -%}
          {% for mac in target_macs -%}
            {% if mac in cfg_macs and cfg not in stale -%}
              {% set _ = stale.append(cfg) -%}
            {% endif -%}
          {% endfor -%}
        {% endif -%}
      {% endfor -%}
      {{ stale }}
  when: existing_boot_configs.json | default([]) | length > 0

- name: Delete stale boot configs from other categories
  ansible.builtin.uri:
    url: >-
      https://{{ _provision_reset_cluster_name }}.{{ _provision_reset_cluster_domain
      }}:8443/boot-service/bootconfigurations/{{ item.metadata.uid }}
    method: DELETE
    headers:
      Authorization: "Bearer {{ ochami_env[(oim_node_name | upper) + '_ACCESS_TOKEN'] }}"
    status_code: [200, 204, 404]
    validate_certs: false
  loop: "{{ _stale_boot_configs | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }} (stale — contains MAC from current category)"
  failed_when: false
  when: _stale_boot_configs | default([]) | length > 0

# ── Stale Omnia-owned SMD group memberships ───────────────────────────
# When a node moves between categories, preserve operator-owned groups and
# remove only memberships in functional groups recorded in the current or
# last successfully managed Omnia mapping.

- name: Resolve Omnia-managed and protected SMD groups
  ansible.builtin.set_fact:
    _omnia_managed_smd_groups: >-
      {{ ((hostvars['localhost']['read_mapping_file']['dict']
            | dict2items | map(attribute='value.FUNCTIONAL_GROUP_NAME') | list)
          + (hostvars['localhost']['smd_managed_identity_nodes'] | default([])
             | map(attribute='FUNCTIONAL_GROUP_NAME') | list))
         | select | unique | list }}
    _protected_smd_groups: >-
      {{ (target_fg_names + ['ssh', 'chrony', 'phone_home'])
         | unique | list }}

- name: Query live SMD groups for stale membership planning
  ansible.builtin.uri:
    url: >-
      https://{{ _provision_reset_cluster_name }}.{{
      _provision_reset_cluster_domain }}:8443/hsm/v2/groups
    method: GET
    headers:
      Authorization: >-
        Bearer {{ ochami_env[(oim_node_name | upper) + '_ACCESS_TOKEN'] }}
    status_code: 200
    validate_certs: false
    return_content: true
  register: _smd_groups_for_membership_plan
  retries: 5
  delay: 2
  until: _smd_groups_for_membership_plan.status | default(0) == 200
  no_log: true
  when: _target_node_xnames | length > 0

- name: Plan stale Omnia-owned SMD memberships
  plan_smd_group_membership:
    groups: "{{ _smd_groups_for_membership_plan.json }}"
    target_xnames: "{{ _target_node_xnames }}"
    managed_groups: "{{ _omnia_managed_smd_groups }}"
    protected_groups: "{{ _protected_smd_groups }}"
  register: _stale_smd_membership_plan
  when: _target_node_xnames | length > 0

- name: Reject unsafe SMD membership cleanup before mutation
  ansible.builtin.assert:
    that:
      - _stale_smd_membership_plan.errors | length == 0
    fail_msg: >-
      Refusing stale SMD membership cleanup:
      {{ _stale_smd_membership_plan.errors }}
  when: _target_node_xnames | length > 0

- name: Remove stale Omnia-owned SMD group memberships
  ansible.builtin.uri:
    url: >-
      https://{{ _provision_reset_cluster_name }}.{{
      _provision_reset_cluster_domain }}:8443/hsm/v2/groups/{{
      item.group }}/members/{{ item.xname }}
    method: DELETE
    headers:
      Authorization: >-
        Bearer {{ ochami_env[(oim_node_name | upper) + '_ACCESS_TOKEN'] }}
    status_code: [200, 204, 404]
    validate_certs: false
  loop: "{{ _stale_smd_membership_plan.removals | default([]) }}"
  loop_control:
    label: "{{ item.group }} -> {{ item.xname }}"
  register: _stale_smd_membership_delete
  changed_when: (_stale_smd_membership_delete.status | default(404)) != 404
  no_log: true

- name: Verify stale Omnia-owned SMD memberships are absent
  ansible.builtin.uri:
    url: >-
      https://{{ _provision_reset_cluster_name }}.{{
      _provision_reset_cluster_domain }}:8443/hsm/v2/groups/{{ item.group }}
    method: GET
    headers:
      Authorization: >-
        Bearer {{ ochami_env[(oim_node_name | upper) + '_ACCESS_TOKEN'] }}
    status_code: [200, 404]
    validate_certs: false
  loop: "{{ _stale_smd_membership_plan.removals | default([]) }}"
  loop_control:
    label: "{{ item.group }} -> {{ item.xname }}"
  register: _stale_smd_membership_verify
  retries: 5
  delay: 2
  until: >-
    (_stale_smd_membership_verify.status | default(0) == 404)
    or
    (item.xname not in
     (((_stale_smd_membership_verify.json | default({}))
       .get('members', {})).get('ids', [])))
  no_log: true

# ── Metadata-service groups (scoped to target FGs) ────────────────────
# Per-FG group deletion is also handled in configure_metadata_svc.yml
# (delete-before-set). We scope here to target FGs for defense in depth.

- name: Fetch existing metadata-service groups
  block:
    - name: Fetch existing metadata-service groups
      ansible.builtin.uri:
        url: >-
          https://{{ _provision_reset_cluster_name }}.{{ _provision_reset_cluster_domain
          }}:8443/metadata-service/groups
        method: GET
        headers:
          Authorization: "Bearer {{ ochami_env[(oim_node_name | upper) + '_ACCESS_TOKEN'] }}"
        status_code: [200]
        validate_certs: false
        return_content: true
      register: existing_groups
      no_log: true
  rescue:
    - name: Fail with metadata-service API error
      ansible.builtin.fail:
        msg: "{{ metadata_service_api_fail_msg }}"

- name: Delete metadata-service groups for target functional groups only
  ansible.builtin.uri:
    url: >-
      https://{{ _provision_reset_cluster_name }}.{{ _provision_reset_cluster_domain
      }}:8443/metadata-service/groups/{{ item.metadata.uid }}
    method: DELETE
    headers:
      Authorization: "Bearer {{ ochami_env[(oim_node_name | upper) + '_ACCESS_TOKEN'] }}"
    status_code: [200, 204, 404]
    validate_certs: false
  loop: >-
    {{ existing_groups.json | default([])
       | selectattr('metadata.name', 'in', target_fg_names)
       | list }}
  loop_control:
    label: "{{ item.metadata.name | default(item.metadata.uid) }}"
  when: existing_groups.json | default([]) | length > 0

# ── Metadata-service clusterdefaults ──────────────────────────────────
# Clusterdefaults is a global singleton shared across all categories.
# Only delete on the first category run to avoid clearing settings that
# subsequent categories depend on. The POST in main.yml uses status_code
# [200, 201, 409] so a 409 (already exists) is acceptable.

- name: Delete and re-create clusterdefaults (first category only)
  when: _smd_cleanup_done is not defined or not (_smd_cleanup_done | bool)
  block:
    - name: Fetch existing metadata-service clusterdefaults
      ansible.builtin.uri:
        url: >-
          https://{{ _provision_reset_cluster_name }}.{{ _provision_reset_cluster_domain
          }}:8443/metadata-service/clusterdefaultss
        method: GET
        headers:
          Authorization: "Bearer {{ ochami_env[(oim_node_name | upper) + '_ACCESS_TOKEN'] }}"
        status_code: [200]
        validate_certs: false
        return_content: true
      register: existing_clusterdefaults
      failed_when: false

    - name: Delete existing metadata-service clusterdefaults
      ansible.builtin.uri:
        url: >-
          https://{{ _provision_reset_cluster_name }}.{{ _provision_reset_cluster_domain
          }}:8443/metadata-service/clusterdefaultss/{{ item.metadata.uid }}
        method: DELETE
        headers:
          Authorization: "Bearer {{ ochami_env[(oim_node_name | upper) + '_ACCESS_TOKEN'] }}"
        status_code: [200, 204, 404]
        validate_certs: false
      loop: "{{ existing_clusterdefaults.json | default([]) }}"
      loop_control:
        label: "{{ item.metadata.name | default(item.metadata.uid) }}"
      when: existing_clusterdefaults.json | default([]) | length > 0

    - name: Mark clusterdefaults cleanup as done for this run
      ansible.builtin.set_fact:
        _smd_cleanup_done: true
