---
# Delete stale shared OpenCHAMI provisioning data before re-registration.
#
# IMPORTANT: All deletions are SCOPED to the target category only.
# Using --all would wipe registrations from other categories that have
# already been provisioned (e.g. Kubernetes provision followed by Slurm
# provision would delete the K8s nodes from SMD, causing K8s nodes to
# receive random DHCP IPs from the bootloop pool instead of their
# static ADMIN_IPs during PXE boot).
#
# Inputs (set by register_nodes.yml before this file is included):
#   _category_nodes  — list of node dicts for the target category
#   target_fg_names  — list of FG names for the target category

# ── Build scoped deletion targets ──────────────────────────────────────

- name: Build target xnames and MACs for scoped deletion
  ansible.builtin.set_fact:
    _target_node_xnames: "{{ _category_nodes | map(attribute='XNAME') | list }}"
    _target_bmc_xnames: "{{ _category_nodes | map(attribute='XNAME') | map('regex_replace', 'n0$', '') | unique | list }}"
    _target_all_macs: >-
      {{ (_category_nodes | map(attribute='ADMIN_MAC') | list
          + _category_nodes | map(attribute='BMC_MAC') | list)
         | map('lower') | unique | list }}

- name: Build combined xname list (nodes + BMCs)
  ansible.builtin.set_fact:
    _target_all_xnames: "{{ _target_node_xnames + _target_bmc_xnames }}"

# ── SMD discovery artifacts (scoped to target identities) ─────────────

- name: Reconcile target category SMD discovery artifacts
  openchami_reconcile:
    action: cleanup_smd
    cluster_uri: "{{ openchami_api_uri }}"
    access_token: >-
      {{ ochami_env[cluster_env_key] }}
    ca_cert: "{{ hostvars['localhost']['openchami_ca_cert_path'] }}"
    component_endpoint_xnames: "{{ _target_all_xnames }}"
    redfish_endpoint_xnames: "{{ _target_bmc_xnames }}"
    interface_macs: "{{ _target_all_macs }}"
  register: _smd_cleanup_result
  no_log: true
  when: >-
    _target_all_xnames | length > 0
    or _target_bmc_xnames | length > 0
    or _target_all_macs | length > 0

# ── Stale SMD group memberships (xname overlap from other categories) ──
# Same problem as boot configs: when a node moves between categories, its
# xname remains in SMD groups from the previous category. Metadata-service
# merges cloud-init data from ALL groups, so the node receives configs
# intended for the previous category (e.g. "wait for Kubernetes API" on
# a slurm node). Remove target xnames from non-target, non-common SMD groups.
# Common groups (ssh, chrony, phone_home) are shared across all categories
# and must NOT be modified here.

- name: Remove stale SMD group memberships through the API
  openchami_reconcile:
    action: remove_group_memberships
    cluster_uri: "{{ openchami_api_uri }}"
    access_token: >-
      {{ ochami_env[cluster_env_key] }}
    ca_cert: "{{ hostvars['localhost']['openchami_ca_cert_path'] }}"
    target_xnames: "{{ _target_node_xnames }}"
    protected_group_labels: >-
      {{ (target_fg_names + ['ssh', 'chrony', 'phone_home']) | unique | list }}
  register: _stale_smd_membership_cleanup
  no_log: true
  when: _target_node_xnames | length > 0

# Metadata Service resources are intentionally not deleted here. InstanceInfo,
# Group, and ClusterDefaults resources are reconciled in place by
# openchami_reconcile so their UIDs remain stable and nodes never observe a
# delete/create availability window.
