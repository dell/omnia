---
# Delete stale SMD endpoints before re-registration.
# Extracted from configure_ochami/tasks/delete_smd_config.yml.

- name: Delete all ochami component endpoints
  ansible.builtin.command: /usr/bin/ochami smd compep delete --no-confirm --all
  changed_when: true
  failed_when: false

- name: Delete all ochami redfish endpoints
  ansible.builtin.command: /usr/bin/ochami smd rfe delete --no-confirm --all
  changed_when: true
  failed_when: false

- name: Delete all ochami interfaces
  ansible.builtin.command: /usr/bin/ochami smd iface delete --no-confirm --all
  changed_when: true
  failed_when: false

- name: Fetch existing boot configurations
  ansible.builtin.uri:
    url: "https://{{ cluster_name }}.{{ cluster_domain }}:8443/boot-service/bootconfigurations"
    method: GET
    headers:
      Authorization: "Bearer {{ ochami_env[(oim_node_name | upper) + '_ACCESS_TOKEN'] }}"
    status_code: [200]
    validate_certs: false
    return_content: true
  register: existing_boot_configs
  failed_when: false

- name: Delete existing boot configurations
  ansible.builtin.uri:
    url: "https://{{ cluster_name }}.{{ cluster_domain }}:8443/boot-service/bootconfigurations/{{ item.metadata.uid }}"
    method: DELETE
    headers:
      Authorization: "Bearer {{ ochami_env[(oim_node_name | upper) + '_ACCESS_TOKEN'] }}"
    status_code: [200, 204, 404]
    validate_certs: false
  loop: "{{ existing_boot_configs.json | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name | default(item.metadata.uid) }}"
  when: existing_boot_configs.json | default([]) | length > 0

