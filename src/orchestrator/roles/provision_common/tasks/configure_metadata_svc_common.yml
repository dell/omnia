---
# Configure the common metadata-service group.
# Extracted from configure_ochami/tasks/configure_metadata_svc_common.yml.

- name: Render metadata-service group common template
  ansible.builtin.template:
    src: "{{ ms_group_common_template }}"
    dest: "{{ ms_group_common_dest }}"
    mode: "{{ file_permissions_644 }}"

- name: Load rendered common group YAML
  ansible.builtin.slurp:
    src: "{{ ms_group_common_dest }}"
  register: ms_group_common_raw
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

- name: Parse common group entries
  ansible.builtin.set_fact:
    ms_group_common_entries: "{{ ms_group_common_raw.content | b64decode | from_yaml }}"
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

- name: Build metadata-service group body for each common entry
  ansible.builtin.set_fact:
    _ms_group_bodies: >-
      {{ _ms_group_bodies | default([]) + [{
        'metadata': {'name': entry.name},
        'spec': ({'description': entry.description | default(''),
                   'template': entry.file.content | default('')}
                  | combine(
                    {'metaData': dict(
                       entry['meta-data'].keys() | list
                       | zip(entry['meta-data'].values() | map('to_json') | list)
                     )}
                    if entry['meta-data'] is defined and entry['meta-data'] | length > 0
                    else {}
                  ))
      }] }}
  loop: "{{ ms_group_common_entries | default([]) }}"
  loop_control:
    loop_var: entry
    label: "{{ entry.name }}"
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

- name: Fetch existing metadata-service groups for delete-before-set - common
  ansible.builtin.uri:
    url: "https://{{ cluster_name }}.{{ cluster_domain }}:8443/metadata-service/groups"
    method: GET
    headers:
      Authorization: "Bearer {{ ochami_env[(oim_node_name | upper) + '_ACCESS_TOKEN'] }}"
    status_code: [200]
    validate_certs: false
    return_content: true
  register: _existing_common_groups
  failed_when: false
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

- name: Delete existing metadata-service common group entries
  ansible.builtin.uri:
    url: "https://{{ cluster_name }}.{{ cluster_domain }}:8443/metadata-service/groups/{{ item.metadata.uid }}"
    method: DELETE
    headers:
      Authorization: "Bearer {{ ochami_env[(oim_node_name | upper) + '_ACCESS_TOKEN'] }}"
    status_code: [200, 204, 404]
    validate_certs: false
  loop: >-
    {{ _existing_common_groups.json | default([])
       | selectattr('metadata.name', 'in', _ms_group_bodies | default([]) | map(attribute='metadata.name') | list)
       | list }}
  loop_control:
    label: "{{ item.metadata.name | default(item.metadata.uid) }}"
  when:
    - not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)
    - _existing_common_groups.json | default([]) | length > 0

- name: Set metadata-service group configuration - common (via metadata-service API)
  ansible.builtin.uri:
    url: "https://{{ cluster_name }}.{{ cluster_domain }}:8443/metadata-service/groups"
    method: POST
    headers:
      Authorization: "Bearer {{ ochami_env[(oim_node_name | upper) + '_ACCESS_TOKEN'] }}"
      Content-Type: "application/json"
    body_format: json
    body: "{{ item }}"
    status_code: [200, 201]
    validate_certs: false
  loop: "{{ _ms_group_bodies | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)
