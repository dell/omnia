---
# Configure the common metadata-service group.
# Extracted from configure_ochami/tasks/configure_metadata_svc_common.yml.

- name: Render metadata-service group common template
  ansible.builtin.template:
    src: "{{ ms_group_common_template }}"
    dest: "{{ ms_group_common_dest }}"
    mode: "0600"

- name: Load rendered common group YAML
  ansible.builtin.slurp:
    src: "{{ ms_group_common_dest }}"
  register: ms_group_common_raw
  no_log: true
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

- name: Parse common group entries
  ansible.builtin.set_fact:
    ms_group_common_entries: "{{ ms_group_common_raw.content | b64decode | from_yaml }}"
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

- name: Initialize metadata-service common group bodies
  ansible.builtin.set_fact:
    _ms_group_bodies: []
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

- name: Build metadata-service group body for each common entry
  ansible.builtin.set_fact:
    _ms_group_bodies: >-
      {{ _ms_group_bodies | default([]) + [{
        'metadata': {'name': entry.name},
        'spec': ({'description': entry.description | default(''),
                   'template': entry.file.content | default('')}
                  | combine(
                    {'metaData': dict(
                       entry['meta-data'].keys() | list
                       | zip(entry['meta-data'].values() | map('to_json') | list)
                     )}
                    if entry['meta-data'] is defined and entry['meta-data'] | length > 0
                    else {}
                  ))
      }] }}
  loop: "{{ ms_group_common_entries | default([]) }}"
  loop_control:
    loop_var: entry
    label: "{{ entry.name }}"
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)
  no_log: true

- name: Reconcile metadata-service common groups
  openchami_reconcile:
    action: reconcile_metadata_groups
    cluster_uri: "{{ openchami_api_uri }}"
    access_token: "{{ ochami_env[cluster_env_key] }}"
    ca_cert: "{{ hostvars['localhost']['openchami_ca_cert_path'] }}"
    project_name: "{{ hostvars['localhost']['project_name'] }}"
    metadata_groups: "{{ _ms_group_bodies | default([]) }}"
  register: _metadata_common_reconcile
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)
  no_log: true

- name: Track desired common metadata-service groups
  ansible.builtin.set_fact:
    omnia_metadata_desired_group_names: >-
      {{ ((omnia_metadata_desired_group_names | default([]))
          + (_ms_group_bodies | default([]) | map(attribute='metadata.name') | list))
         | unique | list }}
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

- name: Mark global metadata change for common group content
  ansible.builtin.set_fact:
    omnia_metadata_global_changed: true
  when:
    - not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)
    - >-
      ((_metadata_common_reconcile.created | default([]))
       + (_metadata_common_reconcile.updated | default([]))) | length > 0
