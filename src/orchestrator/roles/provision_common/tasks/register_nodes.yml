---
# Add nodes from the target category to SMD.
# Extracted from configure_ochami/tasks/orchestration_mapping_nodes.yml.
# Global stale-data cleanup is performed once by provision_preamble.yml. This
# file must remain additive so later categories cannot remove earlier ones.

- name: Check if openchami configs_vars.yaml exists
  ansible.builtin.stat:
    path: "{{ openchami_config_vars_path }}"
  register: _openchami_config_stat

- name: Fail with clear message if configs_vars.yaml is missing
  ansible.builtin.fail:
    msg: >-
      OpenCHAMI configuration file not found: {{ openchami_config_vars_path }}.
      This file is generated during the deploy stage. Run the orchestrator
      deploy stage first: ansible-playbook orchestrator.yml --tags deploy
  when: not _openchami_config_stat.stat.exists

- name: Include openchami vars
  ansible.builtin.include_vars: "{{ openchami_config_vars_path }}"

# Preserve the OpenCHAMI API identity at set_fact level so unrelated role
# variables cannot shadow the shared service endpoint.
- name: Pin openchami cluster_name at set_fact level
  ansible.builtin.set_fact:
    cluster_name: "{{ lookup('file', openchami_config_vars_path) | from_yaml | json_query('cluster_name') }}"
    cluster_domain: "{{ lookup('file', openchami_config_vars_path) | from_yaml | json_query('cluster_domain') }}"

- name: Ensure read_mapping_file is available
  ansible.builtin.set_fact:
    read_mapping_file: "{{ hostvars['localhost']['read_mapping_file'] }}"
  when: hostvars['localhost']['read_mapping_file'] is defined

- name: Re-read mapping file if not available
  community.general.read_csv:
    path: "{{ hostvars['localhost']['pxe_mapping_file_path'] }}"
    key: ADMIN_MAC
  register: _mapping_file_result
  when: hostvars['localhost']['read_mapping_file'] is not defined

- name: Set read_mapping_file from re-read result
  ansible.builtin.set_fact:
    read_mapping_file: "{{ _mapping_file_result }}"
  when: hostvars['localhost']['read_mapping_file'] is not defined

- name: Create ochami nodes directory
  ansible.builtin.file:
    path: "{{ nodes_dir }}"
    state: directory
    mode: "{{ dir_permissions_755 }}"

- name: Create orchestrator output directory on OIM
  ansible.builtin.file:
    path: "{{ hostvars['localhost']['orchestrator_output_dir'] }}"
    state: directory
    mode: "{{ dir_permissions_755 }}"

- name: Create orchestrator output directory on localhost
  ansible.builtin.file:
    path: "{{ hostvars['localhost']['orchestrator_output_dir'] }}"
    state: directory
    mode: "{{ dir_permissions_755 }}"
  delegate_to: localhost

- name: Build target FG name list
  ansible.builtin.set_fact:
    target_fg_names: "{{ target_functional_groups | map(attribute='name') | list }}"

- name: Refresh access token before OpenCHAMI reconciliation
  ansible.builtin.command: sudo bash -lc 'gen_access_token'
  register: refreshed_token_result
  changed_when: false
  retries: 3
  delay: 5
  until: >-
    refreshed_token_result.rc == 0
    and refreshed_token_result.stdout not in ["", "null"]
  no_log: true

- name: Update OpenCHAMI authentication with refreshed token
  ansible.builtin.set_fact:
    ochami_env: >-
      {{ {cluster_env_key:
          refreshed_token_result.stdout} }}
  no_log: true

- name: Verify OpenCHAMI APIs with JWT and CA trust
  openchami_reconcile:
    action: check_apis
    cluster_uri: "{{ openchami_api_uri }}"
    access_token: >-
      {{ ochami_env[cluster_env_key] }}
    ca_cert: "{{ hostvars['localhost']['openchami_ca_cert_path'] }}"
  no_log: true

- name: Compute filtered nodes for {{ target_category }}
  ansible.builtin.set_fact:
    _category_nodes: >-
      {{ hostvars['localhost']['read_mapping_file']['dict'] | dict2items
         | selectattr('value.FUNCTIONAL_GROUP_NAME', 'in', target_fg_names)
         | map(attribute='value')
         | sort(attribute='SERVICE_TAG')
         | list }}

- name: Resolve persistent OpenCHAMI identities for {{ target_category }}
  openchami_reconcile:
    action: resolve_identities
    cluster_uri: "{{ openchami_api_uri }}"
    access_token: >-
      {{ ochami_env[cluster_env_key] }}
    ca_cert: "{{ hostvars['localhost']['openchami_ca_cert_path'] }}"
    nodes: "{{ _category_nodes }}"
  register: _resolved_openchami_identities
  no_log: true

- name: Use internally resolved XNAMEs for {{ target_category }}
  ansible.builtin.set_fact:
    _category_nodes: "{{ _resolved_openchami_identities.nodes }}"

- name: Index internally resolved nodes by ADMIN_MAC
  ansible.builtin.set_fact:
    _resolved_category_nodes_by_mac: >-
      {% set resolved = {} -%}
      {% for node in _category_nodes -%}
      {% set _ = resolved.update({node.ADMIN_MAC: node}) -%}
      {% endfor -%}
      {{ resolved }}

# SMD-group and later provisioning tasks read the mapping from localhost.
# Publish the resolved XNAMEs there so all downstream tasks consume only the
# permanent Service Tag identity resolved from SMD Hardware Inventory.
- name: Publish internally resolved XNAMEs to the provisioning mapping
  ansible.builtin.set_fact:
    read_mapping_file: >-
      {{ hostvars['localhost']['read_mapping_file']
         | combine({
             'dict': hostvars['localhost']['read_mapping_file']['dict']
                     | combine(_resolved_category_nodes_by_mac)
           }) }}
  delegate_to: localhost
  delegate_facts: true

- name: Reset stale OpenCHAMI data for {{ target_category }}
  ansible.builtin.include_tasks: delete_smd_endpoints.yml
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

- name: Generate per-category nodes YAML ({{ target_category }})
  ansible.builtin.template:
    src: "{{ openchami_nodes_template }}"
    dest: "{{ nodes_dir }}/nodes_{{ target_category }}.yaml"
    mode: "{{ file_permissions_644 }}"
  vars:
    mapping_nodes: "{{ _category_nodes }}"
  delegate_to: localhost

- name: Restart metadata-service to refresh node instance data
  ansible.builtin.systemd:
    name: metadata-service
    state: restarted
    daemon_reload: true

- name: Verify metadata-service is running
  ansible.builtin.systemd:
    name: metadata-service
    state: started
  register: metadata_svc_server_status
  retries: "{{ service_retries }}"
  delay: "{{ service_retry_interval }}"
  until: metadata_svc_server_status is success

- name: Restart HAProxy to pick up new metadata-service container IP
  ansible.builtin.systemd:
    name: haproxy
    state: restarted

- name: Verify HAProxy is running
  ansible.builtin.systemd:
    name: haproxy
    state: started
  register: haproxy_status
  retries: 5
  delay: 3
  until: haproxy_status is success

- name: Wait for metadata-service readiness
  ansible.builtin.uri:
    url: "https://{{ cluster_name }}.{{ cluster_domain }}:8443/metadata-service/health"
    method: GET
    status_code: 200
    ca_path: "{{ hostvars['localhost']['openchami_ca_cert_path'] }}"
    validate_certs: true
  register: metadata_svc_health_status
  retries: "{{ service_retries }}"
  delay: "{{ service_retry_interval }}"
  until: metadata_svc_health_status.status == 200

- name: Verify metadata-service readiness fallback
  block:
    - name: Final metadata-service readiness check
      ansible.builtin.uri:
        url: "https://{{ cluster_name }}.{{ cluster_domain }}:8443/metadata-service/health"
        method: GET
        status_code: 200
        ca_path: "{{ hostvars['localhost']['openchami_ca_cert_path'] }}"
        validate_certs: true
      register: metadata_svc_final_check
  rescue:
    - name: Restart openchami.target to recover container networking
      ansible.builtin.systemd:
        name: openchami.target
        state: restarted
        daemon_reload: true

    - name: Wait for openchami.target to be ready after restart
      ansible.builtin.systemd:
        name: openchami.target
        state: started
      register: openchami_target_recovery
      retries: "{{ service_retries }}"
      delay: "{{ service_retry_interval }}"
      until: openchami_target_recovery is success

    - name: Retry metadata-service readiness check
      ansible.builtin.uri:
        url: "https://{{ cluster_name }}.{{ cluster_domain }}:8443/metadata-service/health"
        method: GET
        status_code: 200
        ca_path: "{{ hostvars['localhost']['openchami_ca_cert_path'] }}"
        validate_certs: true
      register: metadata_svc_health_status
      retries: "{{ service_retries }}"
      delay: "{{ service_retry_interval }}"
      until: metadata_svc_health_status.status == 200
      failed_when: false

    - name: Fail if metadata-service is still not reachable
      ansible.builtin.fail:
        msg: "{{ metadata_svc_failed_msg }}"
      when: metadata_svc_health_status.status | default(0) != 200

- name: Verify openchami.target is up
  ansible.builtin.systemd:
    name: openchami.target
    state: started
  register: openchami_target_status
  retries: "{{ service_retries }}"
  delay: "{{ service_retry_interval }}"
  until: openchami_target_status is success

- name: Fail if openchami.target is not up
  ansible.builtin.fail:
    msg: "{{ openchami_target_failed_msg }}"
  when:
    - openchami_target_status is defined
    - openchami_target_status is not success

- name: Remove obsolete node-registration SMD group through the API
  openchami_reconcile:
    action: delete_groups
    cluster_uri: "{{ openchami_api_uri }}"
    access_token: >-
      {{ ochami_env[cluster_env_key] }}
    ca_cert: "{{ hostvars['localhost']['openchami_ca_cert_path'] }}"
    group_labels:
      - node_registration
  no_log: true
  when:
    - not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)
    - refreshed_token_result.rc == 0

- name: Discover nodes in SMD (upsert with --overwrite)
  block:
    - name: Register nodes in SMD for target category
      openchami_reconcile:
        action: discover_static
        cluster_uri: "{{ openchami_api_uri }}"
        access_token: >-
          {{ ochami_env[cluster_env_key] }}
        ca_cert: "{{ hostvars['localhost']['openchami_ca_cert_path'] }}"
        nodes_file: "{{ nodes_dir }}/nodes_{{ target_category }}.yaml"
        token_env_key: "{{ cluster_env_key }}"
        expected_xnames: "{{ _category_nodes | map(attribute='XNAME') | list }}"
      register: openchami_orchestration
      no_log: true
  rescue:
    - name: Verify SMD service is running
      ansible.builtin.service:
        name: smd
        state: started
      register: smd_service_status
      retries: "{{ service_retries }}"
      delay: "{{ service_retry_interval }}"
      until: smd_service_status is success

    - name: Fail if SMD service is not running
      ansible.builtin.fail:
        msg: "smd service is not running"
      when:
        - smd_service_status is defined
        - smd_service_status is not success

    - name: Wait for SMD API to be ready
      openchami_reconcile:
        action: check_apis
        cluster_uri: "{{ openchami_api_uri }}"
        access_token: >-
          {{ ochami_env[cluster_env_key] }}
        ca_cert: "{{ hostvars['localhost']['openchami_ca_cert_path'] }}"
      register: smd_api_ready
      retries: "{{ service_retries }}"
      delay: "{{ service_retry_interval }}"
      until: smd_api_ready is success
      no_log: true

    - name: Refresh access token before retry
      ansible.builtin.command: sudo bash -lc 'gen_access_token'
      register: retry_token_result
      changed_when: false
      failed_when: false
      retries: 3
      delay: 5
      until: retry_token_result.rc == 0 and retry_token_result.stdout not in ["", "null"]

    - name: Update ochami_env with refreshed token for retry
      ansible.builtin.set_fact:
        ochami_env: "{{ {cluster_env_key: retry_token_result.stdout} }}"
      when: retry_token_result.rc == 0

    - name: Retry SMD node discovery
      openchami_reconcile:
        action: discover_static
        cluster_uri: "{{ openchami_api_uri }}"
        access_token: >-
          {{ ochami_env[cluster_env_key] }}
        ca_cert: "{{ hostvars['localhost']['openchami_ca_cert_path'] }}"
        nodes_file: "{{ nodes_dir }}/nodes_{{ target_category }}.yaml"
        token_env_key: "{{ cluster_env_key }}"
        expected_xnames: "{{ _category_nodes | map(attribute='XNAME') | list }}"
      register: openchami_orchestration
      retries: 2
      delay: "{{ service_retry_interval }}"
      until: openchami_orchestration is success
      no_log: true

- name: Wait until target nodes are registered in SMD
  openchami_reconcile:
    action: verify_components
    cluster_uri: "{{ openchami_api_uri }}"
    access_token: >-
      {{ ochami_env[cluster_env_key] }}
    ca_cert: "{{ hostvars['localhost']['openchami_ca_cert_path'] }}"
    expected_xnames: "{{ _category_nodes | map(attribute='XNAME') | list }}"
  register: openchami_smd_status
  retries: "{{ service_retries }}"
  delay: "{{ service_retry_interval }}"
  until: openchami_smd_status is success
  no_log: true

- name: Display SMD status
  ansible.builtin.debug:
    msg: "{{ openchami_smd_status.verification.expected }}"
    verbosity: 2

- name: Generate per-category hostname YAML
  ansible.builtin.template:
    src: "{{ openchami_hostname_template }}"
    dest: "{{ nodes_dir }}/hostname_{{ target_category }}.yaml"
    mode: "{{ file_permissions_644 }}"
  vars:
    mapping_nodes: "{{ _category_nodes }}"

- name: Load hostname YAML for metadata-service
  ansible.builtin.slurp:
    src: "{{ nodes_dir }}/hostname_{{ target_category }}.yaml"
  register: hostname_yaml_raw

- name: Parse hostname entries
  ansible.builtin.set_fact:
    hostname_entries: "{{ hostname_yaml_raw.content | b64decode | from_yaml }}"

- name: Build desired per-node Metadata Service identities
  ansible.builtin.set_fact:
    _desired_instance_infos: >-
      {% set result = [] -%}
      {% for item in hostname_entries -%}
      {% set _ = result.append({
           'instance_id': item.id,
           'hostname': item['local-hostname']
         }) -%}
      {% endfor -%}
      {{ result }}

- name: Reconcile hostnames in Metadata Service
  openchami_reconcile:
    action: reconcile_instanceinfos
    cluster_uri: "{{ openchami_api_uri }}"
    access_token: >-
      {{ ochami_env[cluster_env_key] }}
    ca_cert: "{{ hostvars['localhost']['openchami_ca_cert_path'] }}"
    instance_infos: "{{ _desired_instance_infos }}"
  register: _metadata_instanceinfo_reconcile
  no_log: true

- name: Create metadata-service groups dict for target FGs
  ansible.builtin.set_fact:
    metadata_svc_groups_dict: "{{ metadata_svc_groups_dict | default({}) | combine({item: {}}) }}"
  with_items: "{{ target_fg_names }}"

- name: Create SMD groups for each target functional group
  ansible.builtin.include_tasks: create_smd_group.yml
  loop: "{{ target_fg_names }}"
  loop_control:
    loop_var: fg_name

- name: Accumulate registered functional group names across categories
  ansible.builtin.set_fact:
    registered_fg_names: >-
      {{ ((registered_fg_names | default([])) + target_fg_names) | unique | list }}

- name: Create common SMD groups (ssh and chrony)
  ansible.builtin.include_tasks: create_smd_group_common.yml
  loop: "{{ common_metadata_svc_groups }}"
  loop_control:
    loop_var: common_group_item
  vars:
    common_group_name: "{{ common_group_item }}"
