---
# Register nodes in SMD for the target category.
# Extracted from configure_ochami/tasks/orchestration_mapping_nodes.yml.
# Uses per-category nodes YAML and upsert semantics (no --overwrite).

- name: Include openchami vars
  ansible.builtin.include_vars: "{{ openchami_config_vars_path }}"

- name: Create ochami nodes directory
  ansible.builtin.file:
    path: "{{ nodes_dir }}"
    state: directory
    mode: "{{ dir_permissions_755 }}"

- name: Create telemetry directory
  ansible.builtin.file:
    path: "{{ telemetry_share_path }}"
    state: directory
    mode: "{{ dir_permissions_755 }}"

- name: Create orchestrator output directory on OIM
  ansible.builtin.file:
    path: "{{ hostvars['localhost']['orchestrator_output_dir'] }}"
    state: directory
    mode: "{{ dir_permissions_755 }}"

- name: Create orchestrator output directory on localhost
  ansible.builtin.file:
    path: "{{ hostvars['localhost']['orchestrator_output_dir'] }}"
    state: directory
    mode: "{{ dir_permissions_755 }}"
  delegate_to: localhost

- name: Build target FG name list
  ansible.builtin.set_fact:
    target_fg_names: "{{ target_functional_groups | map(attribute='name') | list }}"

- name: Generate per-category nodes YAML ({{ target_category }})
  ansible.builtin.template:
    src: "{{ openchami_nodes_template }}"
    dest: "{{ nodes_dir }}/nodes_{{ target_category }}.yaml"
    mode: "{{ file_permissions_644 }}"
  vars:
    nodes: >-
      {{ hostvars['localhost']['read_mapping_file']['dict'] | dict2items
         | selectattr('value.FUNCTIONAL_GROUP_NAME', 'in', target_fg_names)
         | list }}

- name: Delete stale SMD endpoints (for clean re-registration)
  ansible.builtin.include_tasks: delete_smd_endpoints.yml
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

- name: Restart cloud-init-server to refresh node instance data
  ansible.builtin.systemd:
    name: cloud-init-server
    state: restarted
    daemon_reload: true

- name: Verify cloud-init-server is running
  ansible.builtin.systemd:
    name: cloud-init-server
    state: started
  register: cloud_init_server_status
  retries: "{{ service_retries }}"
  delay: "{{ service_retry_interval }}"
  until: cloud_init_server_status is success

- name: Verify cloud-init-server is reachable
  block:
    - name: Wait for cloud-init-server readiness
      ansible.builtin.command: /usr/bin/ochami cloud-init service status
      register: cloud_init_status
      retries: "{{ service_retries }}"
      delay: "{{ service_retry_interval }}"
      until: cloud_init_status.rc == 0
      changed_when: false
  rescue:
    - name: Restart openchami.target to recover container networking
      ansible.builtin.systemd:
        name: openchami.target
        state: restarted
        daemon_reload: true

    - name: Wait for openchami.target to be ready after restart
      ansible.builtin.systemd:
        name: openchami.target
        state: started
      register: openchami_target_recovery
      retries: "{{ service_retries }}"
      delay: "{{ service_retry_interval }}"
      until: openchami_target_recovery is success

    - name: Retry cloud-init-server readiness check
      ansible.builtin.command: /usr/bin/ochami cloud-init service status
      register: cloud_init_status
      retries: "{{ service_retries }}"
      delay: "{{ service_retry_interval }}"
      until: cloud_init_status.rc == 0
      failed_when: false
      changed_when: false

    - name: Fail if cloud-init-server is still not reachable
      ansible.builtin.fail:
        msg: "{{ cloud_init_failed_msg }}"
      when: cloud_init_status.rc != 0

- name: Verify openchami.target is up
  ansible.builtin.systemd:
    name: openchami.target
    state: started
  register: openchami_target_status
  retries: "{{ service_retries }}"
  delay: "{{ service_retry_interval }}"
  until: openchami_target_status is success

- name: Fail if openchami.target is not up
  ansible.builtin.fail:
    msg: "{{ openchami_target_failed_msg }}"
  when:
    - openchami_target_status is defined
    - openchami_target_status is not success

- name: Discover nodes in SMD (upsert, no --overwrite)
  block:
    - name: Register nodes in SMD for target category
      ansible.builtin.command: >
        /usr/bin/ochami discover static -f yaml
        -d @"{{ nodes_dir }}/nodes_{{ target_category }}.yaml"
      register: openchami_orchestration
      changed_when: openchami_orchestration.rc == 0
      failed_when: openchami_orchestration.rc != 0
  rescue:
    - name: Verify SMD service is running
      ansible.builtin.service:
        name: smd
        state: started
      register: smd_service_status
      retries: "{{ service_retries }}"
      delay: "{{ service_retry_interval }}"
      until: smd_service_status is success

    - name: Fail if SMD service is not running
      ansible.builtin.fail:
        msg: "smd service is not running"
      when:
        - smd_service_status is defined
        - smd_service_status is not success

    - name: Wait for SMD API to be ready
      ansible.builtin.command: /usr/bin/ochami smd service status
      register: smd_api_ready
      retries: "{{ service_retries }}"
      delay: "{{ service_retry_interval }}"
      until: smd_api_ready.rc == 0
      changed_when: false

    - name: Retry SMD node discovery
      ansible.builtin.command: >
        /usr/bin/ochami discover static -f yaml
        -d @"{{ nodes_dir }}/nodes_{{ target_category }}.yaml"
      register: openchami_orchestration
      changed_when: openchami_orchestration.rc == 0
      failed_when: openchami_orchestration.rc != 0
      retries: 2
      delay: "{{ service_retry_interval }}"
      until: openchami_orchestration.rc == 0

    - name: Fail if SMD discovery still unsuccessful
      ansible.builtin.fail:
        msg: "{{ ochami_discovery_failed_msg }}"
      when: openchami_orchestration.rc != 0

- name: Verify nodes registered in SMD
  ansible.builtin.shell: |
    set -o pipefail && \
    /usr/bin/ochami smd component get | jq '.Components[] | select(.Type == "Node")'
  changed_when: true
  register: openchami_smd_status

- name: Display SMD status
  ansible.builtin.debug:
    msg: "{{ openchami_smd_status.stdout_lines }}"
    verbosity: 2

- name: Generate per-category hostname YAML
  ansible.builtin.template:
    src: "{{ openchami_hostname_template }}"
    dest: "{{ nodes_dir }}/hostname_{{ target_category }}.yaml"
    mode: "{{ file_permissions_644 }}"
  vars:
    nodes: >-
      {{ hostvars['localhost']['read_mapping_file']['dict'] | dict2items
         | selectattr('value.FUNCTIONAL_GROUP_NAME', 'in', target_fg_names)
         | list }}

- name: Configure hostnames in cloud-init
  ansible.builtin.command: >
    /usr/bin/ochami cloud-init node set -f yaml
    -d @"{{ nodes_dir }}/hostname_{{ target_category }}.yaml"
  changed_when: true

- name: Create cloud-init groups dict for target FGs
  ansible.builtin.set_fact:
    cloud_init_groups_dict: "{{ cloud_init_groups_dict | default({}) | combine({item: {}}) }}"
  with_items: "{{ target_fg_names }}"

- name: Create SMD groups for each target functional group
  ansible.builtin.include_tasks: create_smd_group.yml
  loop: "{{ target_fg_names }}"
  loop_control:
    loop_var: fg_name

- name: Create common SMD groups (ssh, chrony, phone_home)
  ansible.builtin.include_tasks: create_smd_group_common.yml
  loop: "{{ common_cloud_init_groups }}"
  loop_control:
    loop_var: common_group_name
