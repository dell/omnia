---
# Required input: smd_identity_desired_nodes. ADMIN_IP is mandatory in each
# row; ADMIN_MAC and XNAME are checked when present. Callers may provide an
# already-fetched smd_identity_interfaces list to avoid a duplicate API call.

- name: Validate SMD identity-check inputs
  ansible.builtin.assert:
    that:
      - smd_identity_desired_nodes is defined
      - smd_identity_desired_nodes | length > 0
      - openchami_access_token | default('') | length > 0
    fail_msg: >-
      Live SMD identity validation requires desired PXE nodes and an
      authenticated OpenCHAMI connection.

- name: Query live SMD Ethernet interfaces for identity validation
  ansible.builtin.uri:
    url: >-
      {{ smd_identity_base_url
         | default('https://' + hostvars['localhost']['oim_node_name'] + '.'
                   + hostvars['localhost']['domain_name'] + ':8443')
      }}/hsm/v2/Inventory/EthernetInterfaces
    method: GET
    status_code: 200
    validate_certs: "{{ smd_identity_validate_certs | default(false) }}"
    headers:
      Authorization: "Bearer {{ openchami_access_token }}"
  register: _smd_identity_interfaces_response
  retries: 5
  delay: 2
  until: _smd_identity_interfaces_response.status | default(0) == 200
  no_log: true
  when: smd_identity_interfaces is not defined

- name: Analyze live SMD identity ownership
  analyze_smd_identity:
    desired_nodes: "{{ smd_identity_desired_nodes }}"
    interfaces: >-
      {{ smd_identity_interfaces
         if smd_identity_interfaces is defined
         else (_smd_identity_interfaces_response.json | default([])) }}
    require_present: true
  register: smd_identity_validation

- name: Fail when live SMD identities do not match the PXE mapping
  ansible.builtin.assert:
    that:
      - smd_identity_validation.errors | length == 0
      - smd_identity_validation.stale_interfaces | length == 0
    fail_msg: >-
      Refusing PXE boot because live OpenCHAMI SMD identity state does not
      match the PXE mapping. Errors: {{ smd_identity_validation.errors }}.
      Conflicting interfaces: {{ smd_identity_validation.stale_interfaces }}
    success_msg: >-
      Live SMD identity validation passed: every desired ADMIN_IP has exactly
      one expected interface owner.
