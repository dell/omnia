---
# Read-only PXE gate. Provisioning owns reconciliation; a standalone PXE run
# must fail before reboot instead of silently mutating stale service state.

- name: Validate Boot Service PXE-gate inputs
  ansible.builtin.assert:
    that:
      - boot_service_identity_desired_nodes is defined
      - boot_service_identity_desired_nodes | length > 0
      - openchami_access_token | default('') | length > 0
    fail_msg: >-
      Boot Service identity validation requires mapped nodes and an
      authenticated OpenCHAMI connection.

- name: Resolve Boot Service PXE-gate endpoint
  ansible.builtin.set_fact:
    provision_common_boot_validation_base_url: >-
      {{ boot_service_identity_base_url
         | default('https://' + hostvars['localhost']['oim_node_name'] + '.'
                   + hostvars['localhost']['domain_name'] + ':8443') }}

- name: Query live Boot Service node identities
  ansible.builtin.uri:
    url: "{{ provision_common_boot_validation_base_url }}/boot-service/nodes"
    method: GET
    status_code: 200
    validate_certs: >-
      {{ boot_service_identity_validate_certs | default(false) }}
    headers:
      Authorization: "Bearer {{ openchami_access_token }}"
  register: provision_common_boot_validation_nodes_response
  retries: 5
  delay: 3
  until: >-
    provision_common_boot_validation_nodes_response.status | default(0) == 200
  no_log: true

- name: Require the expected Boot Service node response shape
  ansible.builtin.assert:
    that:
      - >-
        (provision_common_boot_validation_nodes_response.json
         | default([]) | type_debug) == 'list'
    fail_msg: >-
      Refusing PXE boot because Boot Service /nodes did not return a list of
      node resources.

- name: Query live SMD interfaces for Boot Service identity validation
  ansible.builtin.uri:
    url: >-
      {{ provision_common_boot_validation_base_url
         }}/hsm/v2/Inventory/EthernetInterfaces
    method: GET
    status_code: 200
    validate_certs: >-
      {{ boot_service_identity_validate_certs | default(false) }}
    headers:
      Authorization: "Bearer {{ openchami_access_token }}"
  register: provision_common_boot_validation_interfaces_response
  retries: 5
  delay: 3
  until: >-
    provision_common_boot_validation_interfaces_response.status
    | default(0) == 200
  no_log: true

- name: Analyze live Boot Service node identities
  analyze_boot_service_identity:
    desired_nodes: "{{ boot_service_identity_desired_nodes }}"
    boot_nodes: >-
      {{ provision_common_boot_validation_nodes_response.json | default([]) }}
    interfaces: >-
      {{ provision_common_boot_validation_interfaces_response.json
         | default([]) }}
    require_present: true
  register: provision_common_boot_validation_plan

- name: Require every Boot Service bootMac to match the PXE mapping
  ansible.builtin.assert:
    that:
      - provision_common_boot_validation_plan.errors | length == 0
      - provision_common_boot_validation_plan.patch_plan | length == 0
      - provision_common_boot_validation_plan.foreign_mac_owners | length == 0
    fail_msg: >-
      Refusing PXE boot because Boot Service node identities do not match the
      current mapping. Errors={{
      provision_common_boot_validation_plan.errors }};
      mismatches={{ provision_common_boot_validation_plan.patch_plan }};
      mapped MACs owned by non-mapped XNAMEs={{
      provision_common_boot_validation_plan.foreign_mac_owners }}.
      Run the provision
      stage to reconcile the targeted bootMac records before retrying PXE.
    success_msg: >-
      Boot Service identity validation passed: every mapped XNAME resolves to
      exactly one node with the expected bootMac.

- name: Resolve each mapped MAC through the Boot Service bootscript endpoint
  ansible.builtin.uri:
    url: >-
      {{ provision_common_boot_validation_base_url
         }}/boot-service/bootscript?mac={{
         item.ADMIN_MAC | trim | lower | urlencode }}
    method: GET
    status_code: 200
    return_content: true
    validate_certs: >-
      {{ boot_service_identity_validate_certs | default(false) }}
    headers:
      Authorization: "Bearer {{ openchami_access_token }}"
  loop: "{{ boot_service_identity_desired_nodes }}"
  loop_control:
    label: "{{ item.XNAME | default(item.ADMIN_MAC) }}"
  register: provision_common_boot_validation_scripts
  no_log: true

- name: Require a complete bootscript for the expected XNAME and MAC
  ansible.builtin.assert:
    that:
      - "'Node resolution failed' not in (item.content | default(''))"
      - >-
        ('# Node: ' + item.item.XNAME | trim)
        in (item.content | default(''))
      - >-
        ('BOOTIF=01-' + (item.item.ADMIN_MAC | trim | lower
                         | replace(':', '-') | replace('.', '-')))
        in (item.content | default(''))
    fail_msg: >-
      Refusing PXE boot for {{ item.item.XNAME }}: Boot Service did not
      generate a complete bootscript for ADMIN_MAC {{ item.item.ADMIN_MAC }}.
  loop: >-
    {{ provision_common_boot_validation_scripts.results | default([]) }}
  loop_control:
    label: "{{ item.item.XNAME | default(item.item.ADMIN_MAC) }}"
  no_log: true
