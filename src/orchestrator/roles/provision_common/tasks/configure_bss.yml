---
# Configure BSS boot params for a single functional group.
# Extracted from configure_ochami/tasks/configure_bss_group.yml.
# Called in a loop with fg_name set by the caller.
# Uses delete-then-set for idempotency.

- name: Set functional_group_name for template compatibility
  ansible.builtin.set_fact:
    functional_group_name: "{{ fg_name }}"

- name: Set kernel and initrd from validated images - {{ fg_name }}
  ansible.builtin.set_fact:
    kernel: "{{ validated_images[fg_name].kernel }}"
    initrd: "{{ validated_images[fg_name].initrd }}"

- name: Create boot directory
  ansible.builtin.file:
    path: "{{ bss_dir }}"
    state: directory
    mode: "{{ dir_permissions_755 }}"

- name: Generate BSS template - {{ fg_name }}
  ansible.builtin.template:
    src: "{{ bss_template }}"
    dest: "{{ bss_dir }}/bss-{{ fg_name }}.yaml"
    mode: "{{ file_permissions_644 }}"

- name: Delete boot configuration - {{ fg_name }}
  ansible.builtin.command: >
    /usr/bin/ochami bss boot params delete --no-confirm -f yaml
    -d @{{ bss_dir }}/bss-{{ fg_name }}.yaml
  changed_when: true
  failed_when: false
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

- name: Set boot configuration - {{ fg_name }}
  ansible.builtin.command: >
    /usr/bin/ochami bss boot params set -f yaml
    -d @{{ bss_dir }}/bss-{{ fg_name }}.yaml
  changed_when: true
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)
