---
# Configure boot-service boot params for a single functional group.
# Called in a loop with fg_name set by the caller.
# Reconciles through the shared JWT- and CA-verified OpenCHAMI client.

- name: Set functional_group_name for template compatibility
  ansible.builtin.set_fact:
    functional_group_name: "{{ fg_name }}"

# Validate s3_configurations FIRST - boot service templates require S3 endpoint URL
# This check must happen before loading nodes files to provide clear error messaging
- name: Validate s3_configurations is available for boot service template
  ansible.builtin.assert:
    that:
      - s3_configurations is defined
      - s3_configurations.endpoint_url is defined
    fail_msg: "{{ s3_config_not_available_msg }}"

- name: Load nodes YAML for boot-service template - {{ fg_name }}
  ansible.builtin.slurp:
    src: "{{ nodes_dir }}/nodes_{{ target_category }}.yaml"
  register: boot_svc_nodes_raw

- name: Set boot_svc_nodes fact for boot-service template - {{ fg_name }}
  ansible.builtin.set_fact:
    boot_svc_nodes: "{{ (boot_svc_nodes_raw.content | b64decode | from_yaml).nodes }}"

- name: Set kernel, initrd and image from validated images - {{ fg_name }}
  ansible.builtin.set_fact:
    kernel: "{{ validated_images[fg_name].kernel }}"
    initrd: "{{ validated_images[fg_name].initrd }}"
    image: "{{ validated_images[fg_name].image | default('') }}"

- name: Create boot directory
  ansible.builtin.file:
    path: "{{ boot_svc_dir }}"
    state: directory
    mode: "{{ dir_permissions_755 }}"

- name: Generate boot-service template - {{ fg_name }}
  ansible.builtin.template:
    src: "{{ boot_svc_template }}"
    dest: "{{ boot_svc_dir }}/boot-svc-{{ fg_name }}.yaml"
    mode: "{{ file_permissions_644 }}"

- name: Load rendered boot-service config - {{ fg_name }}
  ansible.builtin.slurp:
    src: "{{ boot_svc_dir }}/boot-svc-{{ fg_name }}.yaml"
  register: boot_svc_config_raw

- name: Parse boot-service config YAML - {{ fg_name }}
  ansible.builtin.set_fact:
    boot_svc_config: "{{ boot_svc_config_raw.content | b64decode | from_yaml }}"

- name: Reconcile Boot Service configuration - {{ fg_name }}
  openchami_reconcile:
    action: reconcile_boot_configurations
    cluster_uri: "{{ openchami_api_uri }}"
    access_token: "{{ ochami_env[cluster_env_key] }}"
    ca_cert: "{{ hostvars['localhost']['openchami_ca_cert_path'] }}"
    boot_configurations:
      - "{{ boot_svc_config }}"
  register: _boot_configuration_reconcile
  no_log: true
