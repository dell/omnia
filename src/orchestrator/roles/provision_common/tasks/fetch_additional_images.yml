---

- name: Collect container images from catalog
  additional_images_collector:
    catalog_file_path: "{{ hostvars['localhost']['catalog_file_path'] }}"
  delegate_to: localhost
  run_once: true
  register: additional_images_output

- name: Set additional_images_dict fact
  ansible.builtin.set_fact:
    additional_images_dict: "{{ additional_images_output.additional_images_dict | default({}) }}"

- name: Debug additional_images_dict
  ansible.builtin.debug:
    var: additional_images_dict
    verbosity: 2

- name: Initialize user_registry list
  ansible.builtin.set_fact:
    user_registry: []

- name: Build user_registry from repo_status.yml registries
  ansible.builtin.set_fact:
    user_registry: "{{ user_registry + [{'host': item.value.host}] }}"
  loop: "{{ hostvars['localhost']['registries'] | default({}) | dict2items }}"
  when:
    - item.value.host is defined
    - item.value.host | length > 0
