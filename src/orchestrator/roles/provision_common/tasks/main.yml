---
# provision_common — Generic FG-driven provisioning pipeline.
#
# Inputs (set by the calling playbook):
#   target_functional_groups: list of FG dicts (filtered by caller)
#   target_category: string (kubernetes|slurm|os|custom)
#
# This role is called by each provision_*.yml playbook with a filtered
# subset of functional groups. It performs all generic provisioning steps
# without any hardcoded FG name checks.

- name: Include role variables for error messages
  ansible.builtin.include_vars: "{{ role_path }}/vars/main.yml"

- name: Skip if no functional groups for this category
  ansible.builtin.debug:
    msg: "No functional groups found for category '{{ target_category }}'. Skipping."
  when: target_functional_groups | length == 0

- name: Provision nodes for category '{{ target_category }}'
  environment: "{{ hostvars['oim']['ochami_env'] }}"
  when: target_functional_groups | length > 0
  block:
    - name: Set SELinux context for orchestrator directories
      ansible.builtin.include_tasks: set_selinux_context.yml

    - name: Register nodes in SMD and create groups
      ansible.builtin.include_tasks: register_nodes.yml

    - name: Fetch additional images
      ansible.builtin.include_tasks: "{{ role_path }}/../configure_ochami/tasks/fetch_additional_images.yml"

    - name: Validate additional metadata-service configuration
      ansible.builtin.include_tasks: "{{ role_path }}/../configure_ochami/tasks/validate_additional_metadata_svc.yml"

    - name: Create SMD group for additional_metadata_svc common
      ansible.builtin.include_tasks: "{{ role_path }}/../configure_ochami/tasks/create_groups_common.yml"
      loop:
        - "{{ additional_metadata_svc_common_group_name }}"
      when: additional_metadata_svc_common_enabled | default(false) | bool

    - name: Create SMD groups for per-FG additional metadata-service
      ansible.builtin.include_tasks: "{{ role_path }}/../configure_ochami/tasks/create_groups_additional_fg.yml"
      with_items: "{{ additional_metadata_svc_fg_names | default([]) }}"
      when: additional_metadata_svc_groups_enabled | default(false) | bool

    - name: Fetch existing boot configurations for cleanup
      ansible.builtin.uri:
        url: "https://{{ cluster_name }}.{{ cluster_domain }}:8443/boot-service/bootconfigurations"
        method: GET
        headers:
          Authorization: "Bearer {{ ochami_env[(oim_node_name | upper) + '_ACCESS_TOKEN'] }}"
        status_code: [200]
        validate_certs: false
        return_content: true
      register: existing_boot_configs_cleanup
      when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

    - name: Delete boot configurations matching target functional groups
      ansible.builtin.uri:
        url: "https://{{ cluster_name }}.{{ cluster_domain }}:8443/boot-service/bootconfigurations/{{ item.metadata.uid }}"
        method: DELETE
        headers:
          Authorization: "Bearer {{ ochami_env[(oim_node_name | upper) + '_ACCESS_TOKEN'] }}"
        status_code: [200, 404]
        validate_certs: false
      loop: >-
        {{ existing_boot_configs_cleanup.json | default([])
           | selectattr('metadata.name', 'in', target_fg_names) | list }}
      loop_control:
        label: "{{ item.metadata.name }}"
      failed_when: false
      when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

    - name: Configure boot-service boot params for each functional group
      ansible.builtin.include_tasks: configure_boot_svc.yml
      loop: "{{ target_functional_groups | map(attribute='name') | list }}"
      loop_control:
        loop_var: fg_name

    - name: Verify boot configurations set
      ansible.builtin.uri:
        url: "https://{{ cluster_name }}.{{ cluster_domain }}:8443/boot-service/bootconfigurations"
        method: GET
        headers:
          Authorization: "Bearer {{ ochami_env[(oim_node_name | upper) + '_ACCESS_TOKEN'] }}"
        status_code: [200]
        validate_certs: false
        return_content: true
      register: boot_configs_output
      when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

    - name: Display boot configurations
      ansible.builtin.debug:
        msg: "{{ boot_configs_output.json | default([]) | map(attribute='metadata.name') | list }}"
      when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

    - name: Create metadata-service directory
      ansible.builtin.file:
        path: "{{ metadata_svc_dir }}"
        state: directory
        mode: "{{ dir_permissions_755 }}"

    - name: Read SSH public key
      ansible.builtin.command: cat {{ ssh_key_path }}
      changed_when: false
      register: read_ssh_key
      no_log: true

    - name: Read SSH private key
      ansible.builtin.command: cat {{ ssh_private_key_path }}
      changed_when: false
      register: read_ssh_private_key
      no_log: true

    - name: Hash the provision password
      ansible.builtin.command: openssl passwd -6 "{{ hostvars['localhost']['provision_password'] }}"
      changed_when: false
      register: hashed_password_output
      no_log: true

    - name: Render metadata-service defaults template
      ansible.builtin.template:
        src: "{{ ms_defaults_template }}"
        dest: "{{ ms_defaults_dest }}"
        mode: "{{ file_permissions_644 }}"

    - name: Load rendered metadata-service defaults
      ansible.builtin.slurp:
        src: "{{ ms_defaults_dest }}"
      register: ms_defaults_raw
      when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

    - name: Parse metadata-service defaults YAML
      ansible.builtin.set_fact:
        ms_defaults_data: "{{ ms_defaults_raw.content | b64decode | from_yaml }}"
      when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

    - name: Set metadata-service defaults via metadata-service API
      ansible.builtin.uri:
        url: "https://{{ cluster_name }}.{{ cluster_domain }}:8443/metadata-service/clusterdefaultss"
        method: POST
        headers:
          Authorization: "Bearer {{ ochami_env[(oim_node_name | upper) + '_ACCESS_TOKEN'] }}"
          Content-Type: "application/json"
        body_format: json
        body:
          metadata:
            name: "{{ cluster_name }}-defaults"
          spec:
            description: "Cluster defaults for {{ cluster_name }}"
            base_url: "{{ ms_defaults_data['base_url'] | default('') }}"
            cluster_name: "{{ ms_defaults_data['cluster_name'] | default(cluster_name) }}"
            short_name: "{{ ms_defaults_data['short_name'] | default(cluster_shortname) }}"
            nid_length: "{{ ms_defaults_data['nid_length'] | default(cluster_nidlength) | int }}"
            public_keys: "{{ ms_defaults_data['public_keys'] | default([]) }}"
            cloud_provider: "OpenCHAMI"
        status_code: [200, 201, 409]
        validate_certs: false
      when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

    - name: Configure metadata-service common group
      ansible.builtin.include_tasks: configure_metadata_svc_common.yml

    - name: Configure metadata-service for each functional group
      ansible.builtin.include_tasks: configure_metadata_svc.yml
      loop: "{{ target_functional_groups | map(attribute='name') | list }}"
      loop_control:
        loop_var: fg_name

    - name: Load hostname YAML for re-apply
      ansible.builtin.slurp:
        src: "{{ nodes_dir }}/hostname_{{ target_category }}.yaml"
      register: reapply_hostname_raw
      when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

    - name: Parse hostname entries for re-apply
      ansible.builtin.set_fact:
        reapply_hostname_entries: "{{ reapply_hostname_raw.content | b64decode | from_yaml }}"
      when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

    - name: Re-apply per-node hostname data into metadata-service
      ansible.builtin.uri:
        url: "https://{{ cluster_name }}.{{ cluster_domain }}:8443/metadata-service/instanceinfos"
        method: POST
        headers:
          Authorization: "Bearer {{ ochami_env[(oim_node_name | upper) + '_ACCESS_TOKEN'] }}"
          Content-Type: "application/json"
        body_format: json
        body:
          metadata:
            name: "{{ item.id }}"
          spec:
            instance_id: "{{ item.id }}"
            hostname: "{{ item['local-hostname'] }}"
            local_hostname: "{{ item['local-hostname'] }}"
        status_code: [200, 201, 409]
        validate_certs: false
      loop: "{{ reapply_hostname_entries | default([]) }}"
      loop_control:
        label: "{{ item.id }}"
      when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

    - name: Configure additional metadata-service
      ansible.builtin.include_tasks: "{{ role_path }}/../configure_ochami/tasks/configure_metadata_svc_additional.yml"
      when: additional_metadata_svc_enabled | default(false) | bool

    - name: Final SELinux context for generated files
      ansible.builtin.include_tasks: set_selinux_context.yml

    - name: Configure DNS
      ansible.builtin.include_tasks: configure_dns.yml
      when: dns_enabled | default(false) | bool

    - name: Provisioning complete for '{{ target_category }}'
      ansible.builtin.debug:
        msg: >-
          Successfully provisioned {{ target_functional_groups | length }} functional groups
          in category '{{ target_category }}':
          {{ target_functional_groups | map(attribute='name') | list | join(', ') }}
