---
# provision_common — Generic FG-driven provisioning pipeline.
#
# Inputs (set by the calling playbook):
#   target_functional_groups: list of FG dicts (filtered by caller)
#   target_category: string (kubernetes|slurm|os|custom)
#
# This role is called by each provision_*.yml playbook with a filtered
# subset of functional groups. It performs all generic provisioning steps
# without any hardcoded FG name checks.

- name: Skip if no functional groups for this category
  ansible.builtin.debug:
    msg: "No functional groups found for category '{{ target_category }}'. Skipping."
  when: target_functional_groups | length == 0

- name: Provision nodes for category '{{ target_category }}'
  environment: "{{ hostvars['oim']['ochami_env'] }}"
  when: target_functional_groups | length > 0
  block:
    - name: Register nodes before publishing provisioning configuration
      ansible.builtin.include_tasks: registration.yml
      when: not (provision_common_registration_complete | default(false) | bool)

    - name: Fetch additional images
      ansible.builtin.include_tasks: fetch_additional_images.yml

    - name: Validate additional metadata-service configuration
      ansible.builtin.include_tasks: validate_additional_metadata_svc.yml

    - name: Scope additional metadata-service groups to the registered category
      ansible.builtin.set_fact:
        additional_metadata_svc_effective_fg_names: >-
          {{ additional_metadata_svc_fg_names | default([])
             | intersect(
                 ((target_fg_names | default([]))
                  + (target_fg_names | default([])
                     | map('regex_replace',
                           '^service_kube_control_plane_first_',
                           'service_kube_control_plane_')
                     | list))
                 | unique | list
               ) }}

    - name: Create SMD group for additional_metadata_svc common
      ansible.builtin.include_tasks: create_smd_group_common.yml
      vars:
        common_group_name: "{{ additional_metadata_svc_common_group_name }}"
      when: additional_metadata_svc_common_enabled | default(false) | bool

    # The input may configure groups owned by later provisioning categories.
    # Publish only groups whose category has completed SMD registration.
    - name: Create SMD groups for per-FG additional metadata-service
      ansible.builtin.include_tasks: create_smd_group_additional.yml
      loop: "{{ additional_metadata_svc_effective_fg_names }}"
      loop_control:
        loop_var: additional_group_fg_name
      when: additional_metadata_svc_groups_enabled | default(false) | bool

    # When a node moves between categories (e.g. from kubernetes to slurm),
    # stale boot configs from the previous category still reference its MAC.
    # Boot-service returns whichever config it matches first, so the node
    # may boot the wrong image. Delete any non-target boot config that
    # contains a MAC belonging to the current category's nodes.
    - name: Build MAC list for current category nodes
      ansible.builtin.set_fact:
        _category_mac_list: >-
          {{ _category_nodes | map(attribute='ADMIN_MAC') | map('lower') | list }}

    - name: Prune stale Boot Service configurations for current node MACs
      openchami_reconcile:
        action: prune_boot_configurations
        cluster_uri: "{{ openchami_api_uri }}"
        access_token: "{{ ochami_env[cluster_env_key] }}"
        ca_cert: "{{ hostvars['localhost']['openchami_ca_cert_path'] }}"
        boot_configuration_names: "{{ target_fg_names }}"
        boot_configuration_macs: "{{ _category_mac_list }}"
      register: _stale_boot_config_prune
      no_log: true

    - name: Configure boot-service boot params for each functional group
      ansible.builtin.include_tasks: configure_boot_svc.yml
      loop: "{{ target_functional_groups | map(attribute='name') | list }}"
      loop_control:
        loop_var: fg_name

    - name: Read Boot Service configurations through the verified API client
      openchami_reconcile:
        action: list_boot_configurations
        cluster_uri: "{{ openchami_api_uri }}"
        access_token: "{{ ochami_env[cluster_env_key] }}"
        ca_cert: "{{ hostvars['localhost']['openchami_ca_cert_path'] }}"
      register: boot_configs_output
      no_log: true

    - name: Display boot configurations
      ansible.builtin.debug:
        msg: >-
          {{ boot_configs_output.boot_configurations | default([])
             | map(attribute='metadata.name') | list }}

    - name: Create metadata-service directory
      ansible.builtin.file:
        path: "{{ metadata_svc_dir }}"
        state: directory
        mode: "0700"

    - name: Read SSH public key
      ansible.builtin.command: cat {{ ssh_key_path }}
      changed_when: false
      register: read_ssh_key
      no_log: true

    - name: Read SSH private key
      ansible.builtin.command: cat {{ ssh_private_key_path }}
      changed_when: false
      register: read_ssh_private_key
      no_log: true

    - name: Derive stable project-specific password salt
      ansible.builtin.set_fact:
        metadata_password_salt: >-
          {{ ((hostvars['localhost']['project_name'] ~ ':'
               ~ cluster_name ~ ':' ~ cluster_domain) | hash('sha256'))[:16] }}
      no_log: true

    - name: Hash the provision password
      ansible.builtin.command:
        argv:
          - openssl
          - passwd
          - "-6"
          - "-salt"
          - "{{ metadata_password_salt }}"
          - "-stdin"
        stdin: "{{ hostvars['localhost']['provision_password'] }}"
        stdin_add_newline: true
      changed_when: false
      register: hashed_password_output
      no_log: true

    - name: Render metadata-service defaults template
      ansible.builtin.template:
        src: "{{ ms_defaults_template }}"
        dest: "{{ ms_defaults_dest }}"
        mode: "0600"

    - name: Load rendered metadata-service defaults
      ansible.builtin.slurp:
        src: "{{ ms_defaults_dest }}"
      register: ms_defaults_raw
      no_log: true

    - name: Parse metadata-service defaults YAML
      ansible.builtin.set_fact:
        ms_defaults_data: "{{ ms_defaults_raw.content | b64decode | from_yaml }}"
      no_log: true

    - name: Reconcile metadata-service cluster defaults
      openchami_reconcile:
        action: reconcile_cluster_defaults
        cluster_uri: "{{ openchami_api_uri }}"
        access_token: "{{ ochami_env[cluster_env_key] }}"
        ca_cert: "{{ hostvars['localhost']['openchami_ca_cert_path'] }}"
        project_name: "{{ hostvars['localhost']['project_name'] }}"
        cluster_defaults:
          metadata:
            name: "{{ cluster_name }}-defaults"
          spec:
            description: "Cluster defaults for {{ cluster_name }}"
            base_url: "{{ ms_defaults_data['base_url'] | default('') }}"
            cluster_name: "{{ ms_defaults_data['cluster_name'] | default(cluster_name) }}"
            short_name: "{{ ms_defaults_data['short_name'] | default(cluster_shortname) }}"
            nid_length: "{{ ms_defaults_data['nid_length'] | default(cluster_nidlength) | int }}"
            public_keys: "{{ ms_defaults_data['public_keys'] | default([]) }}"
            cloud_provider: "OpenCHAMI"
      register: _metadata_cluster_defaults_reconcile
      no_log: true

    - name: Mark global metadata change for cluster defaults
      ansible.builtin.set_fact:
        omnia_metadata_global_changed: true
      when:
        - >-
          ((_metadata_cluster_defaults_reconcile.created | default([]))
           + (_metadata_cluster_defaults_reconcile.updated | default([]))) | length > 0

    - name: Resolve IANA timezone for metadata-service templates
      ansible.builtin.command: timedatectl show -p Timezone --value
      register: _oim_tz_iana
      changed_when: false
      failed_when: false

    - name: Set OIM timezone fact for metadata-service templates
      ansible.builtin.set_fact:
        oim_timezone: "{{ _oim_tz_iana.stdout | default('UTC') }}"

    - name: Configure metadata-service common group
      ansible.builtin.include_tasks: configure_metadata_svc_common.yml

    - name: Configure metadata-service for each functional group
      ansible.builtin.include_tasks: configure_metadata_svc.yml
      loop: "{{ target_functional_groups | map(attribute='name') | list }}"
      loop_control:
        loop_var: fg_name

    - name: Configure additional metadata-service
      ansible.builtin.include_tasks: configure_metadata_svc_additional.yml
      when: additional_metadata_svc_enabled | default(false) | bool

    - name: Final SELinux context for generated files
      ansible.builtin.include_tasks: set_selinux_context.yml

    - name: Configure DNS
      ansible.builtin.include_tasks: configure_dns.yml
      when: dns_enabled | default(false) | bool

    - name: Provisioning complete for '{{ target_category }}'
      ansible.builtin.debug:
        msg: >-
          Successfully provisioned {{ target_functional_groups | length }} functional groups
          in category '{{ target_category }}':
          {{ target_functional_groups | map(attribute='name') | list | join(', ') }}
