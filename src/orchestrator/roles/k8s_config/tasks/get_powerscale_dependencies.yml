---

- name: Resolve PowerScale CSI artifacts from Repo Manager status
  when: hostvars['localhost'].get('enable_powerscale_csi', false) | bool
  block:
    - name: Validate Repo Manager file repository data
      ansible.builtin.assert:
        that:
          - hostvars['localhost']['file_repos'] is defined
          - hostvars['localhost']['file_repos'] is mapping
        fail_msg: "{{ powerscale_repo_status_structure_fail_msg }}"
        quiet: true

    - name: Read x86_64 file repositories
      ansible.builtin.set_fact:
        powerscale_x86_64_file_repos: >-
          {{ hostvars['localhost']['file_repos'].get('x86_64', none) }}

    - name: Validate x86_64 file repository data
      ansible.builtin.assert:
        that:
          - powerscale_x86_64_file_repos is mapping
        fail_msg: "{{ powerscale_repo_status_structure_fail_msg }}"
        quiet: true

    - name: Read x86_64 Git repositories
      ansible.builtin.set_fact:
        powerscale_git_repos: >-
          {{ powerscale_x86_64_file_repos.get('git', none) }}

    - name: Validate x86_64 Git repository data
      ansible.builtin.assert:
        that:
          - powerscale_git_repos is mapping
        fail_msg: "{{ powerscale_repo_status_structure_fail_msg }}"
        quiet: true

    - name: Select required PowerScale Git artifacts
      ansible.builtin.set_fact:
        csi_powerscale_package_matches: >-
          {{ powerscale_git_repos | dict2items
             | selectattr('key', 'match', '^csi-powerscale-v') | list }}
        helm_charts_package_matches: >-
          {{ powerscale_git_repos | dict2items
             | selectattr('key', 'match', '^helm-charts-[0-9]') | list }}
        external_snapshotter_package_matches: >-
          {{ powerscale_git_repos | dict2items
             | selectattr('key', 'match', '^external-snapshotter-v') | list }}

    - name: Validate required PowerScale Git artifact matches
      ansible.builtin.assert:
        that:
          - csi_powerscale_package_matches | length == 1
          - helm_charts_package_matches | length == 1
          - external_snapshotter_package_matches | length == 1
        fail_msg: "{{ powerscale_repo_status_artifacts_fail_msg }}"
        quiet: true

    - name: Read published PowerScale Git repository URLs
      ansible.builtin.set_fact:
        csi_powerscale_repo_url: >-
          {{ (csi_powerscale_package_matches | first).value }}
        helm_charts_repo_url: >-
          {{ (helm_charts_package_matches | first).value }}
        external_snapshotter_repo_url: >-
          {{ (external_snapshotter_package_matches | first).value }}

    - name: Validate published PowerScale Git repository URLs
      ansible.builtin.assert:
        that:
          - csi_powerscale_repo_url is string
          - csi_powerscale_repo_url is match('^https?://')
          - helm_charts_repo_url is string
          - helm_charts_repo_url is match('^https?://')
          - external_snapshotter_repo_url is string
          - external_snapshotter_repo_url is match('^https?://')
        fail_msg: "{{ powerscale_repo_status_url_fail_msg }}"
        quiet: true

    - name: Derive PowerScale package directories from published URLs
      ansible.builtin.set_fact:
        csi_powerscale_dir: >-
          {{ csi_powerscale_repo_url | urlsplit('path')
             | regex_replace('/+$', '') | basename }}
        helm_charts_dir: >-
          {{ helm_charts_repo_url | urlsplit('path')
             | regex_replace('/+$', '') | basename }}
        external_snapshotter_dir: >-
          {{ external_snapshotter_repo_url | urlsplit('path')
             | regex_replace('/+$', '') | basename }}

    - name: Validate PowerScale package directories
      ansible.builtin.assert:
        that:
          - csi_powerscale_dir is match('^csi-powerscale-v')
          - helm_charts_dir is match('^helm-charts-[0-9]')
          - external_snapshotter_dir is match('^external-snapshotter-v')
        fail_msg: "{{ powerscale_repo_status_url_fail_msg }}"
        quiet: true

    - name: Set PowerScale Git archive basenames
      ansible.builtin.set_fact:
        csi_powerscale_archive: "{{ csi_powerscale_dir }}.tar.gz"
        helm_charts_archive: "{{ helm_charts_dir }}.tar.gz"
        external_snapshotter_archive: "{{ external_snapshotter_dir }}.tar.gz"

    - name: Display extracted PowerScale versioned directory names
      ansible.builtin.debug:
        msg:
          - "csi_powerscale_dir: {{ csi_powerscale_dir }}"
          - "helm_charts_dir: {{ helm_charts_dir }}"
          - "external_snapshotter_dir: {{ external_snapshotter_dir }}"

- name: Stage PowerScale CSI dependencies from Repo Manager
  when: hostvars['localhost'].get('enable_powerscale_csi', false) | bool
  block:
    - name: Base64 encode username and password
      ansible.builtin.set_fact:
        csi_username_b64: "{{ hostvars['localhost']['csi_username'] | b64encode }}"
        csi_password_b64: "{{ hostvars['localhost']['csi_password'] | b64encode }}"
      no_log: true

    - name: Check if csi_powerscale_secret_vault exists
      ansible.builtin.stat:
        path: "{{ input_project_dir }}/{{ csi_powerscale_secret_vaultname }}"
      register: vault_key_result
      delegate_to: localhost

    - name: Create ansible vault key if it does not exist
      ansible.builtin.set_fact:
        vault_key: "{{ lookup('password', '/dev/null chars=ascii_letters') }}"
      when: not vault_key_result.stat.exists
      delegate_to: localhost

    - name: Save vault key
      ansible.builtin.lineinfile:
        path: "{{ input_project_dir }}/{{ csi_powerscale_secret_vaultname }}"
        line: "{{ vault_key }}"
        mode: "{{ vault_key_permission }}"
        owner: root
        create: true
      when: not vault_key_result.stat.exists
      delegate_to: localhost

    - name: Check if secret file is encrypted
      ansible.builtin.command: cat "{{ csi_powerscale_driver_secret_file_path }}"
      changed_when: false
      register: config_content
      delegate_to: localhost

    - name: Encrypt secret file
      ansible.builtin.command: >-
        ansible-vault encrypt {{ csi_powerscale_driver_secret_file_path }}
        --vault-password-file {{ input_project_dir }}/{{ csi_powerscale_secret_vaultname }}
      when: "'$ANSIBLE_VAULT;' not in config_content.stdout"
      changed_when: false
      delegate_to: localhost

    - name: Check if secret file is encrypted
      ansible.builtin.command: cat "{{ csi_powerscale_driver_secret_file_path }}"
      changed_when: false
      register: config_content
      delegate_to: localhost

    - name: Decrpyt secret file
      ansible.builtin.command: >-
        ansible-vault decrypt {{ csi_powerscale_driver_secret_file_path }}
        --vault-password-file {{ input_project_dir }}/{{ csi_powerscale_secret_vaultname }}
      when: "'$ANSIBLE_VAULT;' in config_content.stdout"
      delegate_to: localhost
      changed_when: false

    - name: Update username in secret.yaml with encoded value
      ansible.builtin.replace:
        path: "{{ csi_powerscale_driver_secret_file_path }}"
        regexp: '^(\s*)username:\s*(?!#).*'
        replace: '\1username: {{ csi_username_b64 }}'
      no_log: true
      delegate_to: localhost

    - name: Update password in secret.yaml with encoded value
      ansible.builtin.replace:
        path: "{{ csi_powerscale_driver_secret_file_path }}"
        regexp: '^(\s*)password:\s*(?!#).*'
        replace: '\1password: {{ csi_password_b64 }}'
      no_log: true
      delegate_to: localhost

    - name: Load PowerScale CSI secret file
      ansible.builtin.include_vars:
        file: "{{ csi_powerscale_driver_secret_file_path }}"
        name: clusters
      no_log: true
      when:
        - csi_powerscale_driver_secret_file_path is defined
      delegate_to: localhost

    - name: Load values.yaml file
      ansible.builtin.include_vars:
        file: "{{ csi_powerscale_driver_values_file_path }}"
        name: csi_powerscale_values_file
      delegate_to: localhost

    - name: Get csi-powerscale git tar
      ansible.builtin.get_url:
        url: >-
          {{ csi_powerscale_repo_url | regex_replace('/+$', '') }}/{{
          csi_powerscale_archive }}
        dest: "{{ k8s_client_mount_path }}/{{ csi_powerscale_archive }}"
        mode: "{{ permission_644 }}"

    - name: Extract csi-powerscale tar file
      ansible.builtin.unarchive:
        src: "{{ k8s_client_mount_path }}/{{ csi_powerscale_archive }}"
        dest: "{{ k8s_client_mount_path }}/"
        remote_src: true

    - name: Get dell/helm-charts git tar
      ansible.builtin.get_url:
        url: >-
          {{ helm_charts_repo_url | regex_replace('/+$', '') }}/{{
          helm_charts_archive }}
        dest: "{{ k8s_client_mount_path }}/{{ csi_powerscale_dir }}/{{ helm_charts_git }}"
        mode: "{{ permission_644 }}"

    - name: Get external-snapshotter git tar
      ansible.builtin.get_url:
        url: >-
          {{ external_snapshotter_repo_url | regex_replace('/+$', '') }}/{{
          external_snapshotter_archive }}
        dest: "{{ k8s_client_mount_path }}/{{ csi_powerscale_dir }}/{{ external_snapshotter_git }}"
        mode: "{{ permission_644 }}"

    - name: Transfer storage class template to nfs share (inside versioned directory)
      ansible.builtin.template:
        src: ps_storage_class.j2
        dest: "{{ k8s_client_mount_path }}/{{ csi_powerscale_dir }}/ps_storage_class.yml"
        owner: "{{ owner_value }}"
        group: "{{ group_value }}"
        mode: "{{ permission_644 }}"

    - name: Copy PowerScale CSI secret file to target path (inside versioned directory)
      ansible.builtin.copy:
        src: "{{ csi_powerscale_driver_secret_file_path }}"
        dest: "{{ k8s_client_mount_path }}/{{ csi_powerscale_dir }}/secret.yaml"
        mode: "0600"
      when:
        - csi_powerscale_driver_secret_file_path is defined
      no_log: true

    - name: Copy PowerScale CSI values file to target path (inside versioned directory)
      ansible.builtin.copy:
        src: "{{ csi_powerscale_driver_values_file_path }}"
        dest: "{{ k8s_client_mount_path }}/{{ csi_powerscale_dir }}/values.yaml"
        mode: "0644"
      when:
        - csi_powerscale_driver_values_file_path is defined

    - name: Copy empty certificate yaml file (inside versioned directory)
      ansible.builtin.copy:
        dest: "{{ k8s_client_mount_path }}/{{ csi_powerscale_dir }}/empty_isilon-certs.yaml"
        src: "{{ empty_certificate_template_path }}"
        mode: "{{ permission_644 }}"

    - name: Extract dell/helm-charts tar file under versioned csi-powerscale directory
      ansible.builtin.unarchive:
        src: "{{ k8s_client_mount_path }}/{{ csi_powerscale_dir }}/{{ helm_charts_git }}"
        dest: "{{ k8s_client_mount_path }}/{{ csi_powerscale_dir }}"
        remote_src: true

    - name: Ensure helm-charts directory exists
      ansible.builtin.file:
        path: "{{ k8s_client_mount_path }}/{{ csi_powerscale_dir }}/helm-charts"
        state: directory
        mode: '0755'

    - name: Move extracted helm charts content to helm-charts directory
      ansible.builtin.shell: >
        mv -n
        "{{ k8s_client_mount_path }}/{{ csi_powerscale_dir }}/{{ helm_charts_dir }}"/*
        "{{ k8s_client_mount_path }}/{{ csi_powerscale_dir }}/helm-charts/"
      args:
        executable: /bin/bash
      failed_when: false
      changed_when: false

    - name: Remove extracted helm charts directory
      ansible.builtin.file:
        path: "{{ k8s_client_mount_path }}/{{ csi_powerscale_dir }}/{{ helm_charts_dir }}"
        state: absent

    - name: Extract external snapshotter tar file under versioned csi-powerscale directory
      ansible.builtin.unarchive:
        src: "{{ k8s_client_mount_path }}/{{ csi_powerscale_dir }}/{{ external_snapshotter_git }}"
        dest: "{{ k8s_client_mount_path }}/{{ csi_powerscale_dir }}"
        remote_src: true

    - name: Ensure external-snapshotter directory exists
      ansible.builtin.file:
        path: "{{ k8s_client_mount_path }}/{{ csi_powerscale_dir }}/external-snapshotter"
        state: directory
        mode: '0755'

    - name: Move extracted external-snapshotter content to external-snapshotter directory
      ansible.builtin.shell: >
        mv -n
        "{{ k8s_client_mount_path }}/{{ csi_powerscale_dir }}/{{ external_snapshotter_dir }}"/*
        "{{ k8s_client_mount_path }}/{{ csi_powerscale_dir }}/external-snapshotter/"
      args:
        executable: /bin/bash
      failed_when: false
      changed_when: false

    - name: Remove extracted external-snapshotter directory
      ansible.builtin.file:
        path: "{{ k8s_client_mount_path }}/{{ csi_powerscale_dir }}/{{ external_snapshotter_dir }}"
        state: absent

  rescue:
    - name: Handle dependency failure
      ansible.builtin.fail:
        msg: "{{ fail_msg_download }}"
