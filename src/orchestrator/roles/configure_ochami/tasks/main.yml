---

- name: Refresh SMD access token before ochami operations
  ansible.builtin.include_role:
    name: omnia.orchestrator.orchestrator_common
    tasks_from: openchami_auth.yml
  vars:
    oim_node_name: "{{ hostvars['localhost']['oim_node_name'] }}"

- name: Configure the ochami
  environment: "{{ hostvars['oim']['ochami_env'] }}"
  block:
    - name: Create groups
      ansible.builtin.include_tasks: create_groups.yml
      with_items: "{{ hostvars['localhost']['functional_groups'] | map(attribute='name') | list }}"

    - name: Fecth image of additional_packages.json file
      ansible.builtin.include_tasks: fetch_additional_images.yml

    - name: Create groups common
      ansible.builtin.include_tasks: create_groups_common.yml
      loop: "{{ common_metadata_svc_groups }}"

    - name: Validate additional metadata-service configuration
      ansible.builtin.include_tasks: validate_additional_metadata_svc.yml

    - name: Create SMD group for additional_metadata_svc common
      ansible.builtin.include_tasks: create_groups_common.yml
      loop:
        - "{{ additional_metadata_svc_common_group_name }}"
      when: additional_metadata_svc_common_enabled | default(false) | bool

    - name: Create SMD groups for per-FG additional metadata-service
      ansible.builtin.include_tasks: create_groups_additional_fg.yml
      with_items: "{{ additional_metadata_svc_fg_names | default([]) }}"
      when: additional_metadata_svc_groups_enabled | default(false) | bool

    - name: Configure boot-service and metadata-service
      ansible.builtin.include_tasks: configure_boot_svc_metadata_svc.yml

    - name: Orchestration completion
      ansible.builtin.include_tasks: orchestration_completion.yml
