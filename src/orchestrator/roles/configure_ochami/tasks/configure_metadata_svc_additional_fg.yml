---
# Renders and sets a single per-functional-group additional metadata-service group.
# Variables expected:
#   _ms_fg_name - the functional group name (e.g. slurm_node_x86_64)

- name: Set per-FG metadata-service group variables
  ansible.builtin.set_fact:
    _ms_fg_group_name: "{{ additional_metadata_svc_fg_group_prefix }}{{ _ms_fg_name }}"
    _ms_fg_data: "{{ additional_metadata_svc_groups_data[_ms_fg_name] }}"
    _ms_fg_dest: "{{ metadata_svc_dir }}/ms-group-{{ additional_metadata_svc_fg_group_prefix }}{{ _ms_fg_name }}.yaml"

- name: Render metadata-service group template - {{ _ms_fg_group_name }}
  ansible.builtin.template:
    src: "{{ ms_group_additional_template }}"
    dest: "{{ _ms_fg_dest }}"
    mode: "{{ hostvars['localhost']['file_permissions_644'] }}"
  vars:
    ms_additional_group_name: "{{ _ms_fg_group_name }}"
    ms_additional_data: "{{ _ms_fg_data }}"

- name: Load rendered per-FG additional group YAML
  ansible.builtin.slurp:
    src: "{{ _ms_fg_dest }}"
  register: ms_fg_additional_raw
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

- name: Parse per-FG additional group entries
  ansible.builtin.set_fact:
    ms_fg_additional_entries: "{{ ms_fg_additional_raw.content | b64decode | from_yaml }}"
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

- name: Build metadata-service group body for additional FG entries - {{ _ms_fg_group_name }}
  ansible.builtin.set_fact:
    _ms_fg_additional_bodies: >-
      {{ _ms_fg_additional_bodies | default([]) + [{
        'metadata': {'name': entry.name},
        'spec': ({'description': entry.description | default(''),
                   'template': entry.file.content | default('')}
                  | combine(
                    {'metaData': dict(
                       entry['meta-data'].keys() | list
                       | zip(entry['meta-data'].values() | map('to_json') | list)
                     )}
                    if entry['meta-data'] is defined and entry['meta-data'] | length > 0
                    else {}
                  ))
      }] }}
  loop: "{{ ms_fg_additional_entries | default([]) }}"
  loop_control:
    loop_var: entry
    label: "{{ entry.name }}"
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

- name: Set metadata-service group configuration for per-FG group (via metadata-service API)  # noqa: name[template]
  ansible.builtin.uri:
    url: "https://{{ cluster_name }}.{{ cluster_domain }}:8443/metadata-service/groups"
    method: POST
    headers:
      Authorization: "Bearer {{ ochami_env[(oim_node_name | upper) + '_ACCESS_TOKEN'] }}"
      Content-Type: "application/json"
    body_format: json
    body: "{{ item }}"
    status_code: [200, 201, 409]
    validate_certs: false
  loop: "{{ _ms_fg_additional_bodies | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)
