---
# Renders and sets a single per-functional-group additional metadata-service group.
# Variables expected:
#   _ms_fg_name - the functional group name (e.g. slurm_node_x86_64)

- name: Set per-FG metadata-service group variables
  ansible.builtin.set_fact:
    _ms_fg_group_name: "{{ additional_metadata_svc_fg_group_prefix }}{{ _ms_fg_name }}"
    _ms_fg_data: "{{ additional_metadata_svc_groups_data[_ms_fg_name] }}"
    _ms_fg_dest: "{{ metadata_svc_dir }}/ms-group-{{ additional_metadata_svc_fg_group_prefix }}{{ _ms_fg_name }}.yaml"

- name: Render metadata-service group template - {{ _ms_fg_group_name }}
  ansible.builtin.template:
    src: "{{ ms_group_additional_template }}"
    dest: "{{ _ms_fg_dest }}"
    mode: "0600"
  vars:
    ms_additional_group_name: "{{ _ms_fg_group_name }}"
    ms_additional_data: "{{ _ms_fg_data }}"

- name: Load rendered per-FG additional group YAML
  ansible.builtin.slurp:
    src: "{{ _ms_fg_dest }}"
  register: ms_fg_additional_raw
  no_log: true
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

- name: Parse per-FG additional group entries
  ansible.builtin.set_fact:
    ms_fg_additional_entries: "{{ ms_fg_additional_raw.content | b64decode | from_yaml }}"
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

- name: Initialize additional metadata-service bodies for {{ _ms_fg_group_name }}
  ansible.builtin.set_fact:
    _ms_fg_additional_bodies: []
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

- name: Build metadata-service group body for additional FG entries - {{ _ms_fg_group_name }}
  ansible.builtin.set_fact:
    _ms_fg_additional_bodies: >-
      {{ _ms_fg_additional_bodies | default([]) + [{
        'metadata': {'name': entry.name},
        'spec': ({'description': entry.description | default(''),
                   'template': entry.file.content | default('')}
                  | combine(
                    {'metaData': dict(
                       entry['meta-data'].keys() | list
                       | zip(entry['meta-data'].values() | map('to_json') | list)
                     )}
                    if entry['meta-data'] is defined and entry['meta-data'] | length > 0
                    else {}
                  ))
      }] }}
  loop: "{{ ms_fg_additional_entries | default([]) }}"
  loop_control:
    loop_var: entry
    label: "{{ entry.name }}"
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)
  no_log: true

- name: Reconcile additional metadata-service group for {{ _ms_fg_name }}
  openchami_reconcile:
    action: reconcile_metadata_groups
    cluster_uri: "{{ openchami_api_uri }}"
    access_token: "{{ ochami_env[cluster_env_key] }}"
    ca_cert: "{{ hostvars['localhost']['openchami_ca_cert_path'] }}"
    project_name: "{{ hostvars['localhost']['project_name'] }}"
    metadata_groups: "{{ _ms_fg_additional_bodies | default([]) }}"
  register: _metadata_additional_fg_reconcile
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)
  no_log: true

- name: Track desired additional metadata-service group for {{ _ms_fg_name }}
  ansible.builtin.set_fact:
    omnia_metadata_desired_group_names: >-
      {{ ((omnia_metadata_desired_group_names | default([]))
          + (_ms_fg_additional_bodies | default([]) | map(attribute='metadata.name') | list))
         | unique | list }}
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

- name: Track nodes affected by additional metadata changes for {{ _ms_fg_name }}
  ansible.builtin.set_fact:
    omnia_metadata_changed_xnames: >-
      {{ ((omnia_metadata_changed_xnames | default([]))
          + (_category_nodes
             | selectattr('FUNCTIONAL_GROUP_NAME', 'equalto', _ms_fg_name)
             | map(attribute='XNAME') | list))
         | unique | list }}
  when:
    - not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)
    - >-
      ((_metadata_additional_fg_reconcile.created | default([]))
       + (_metadata_additional_fg_reconcile.updated | default([]))) | length > 0
