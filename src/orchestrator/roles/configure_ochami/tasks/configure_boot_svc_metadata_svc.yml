---

- name: Include openchami vars
  ansible.builtin.include_vars: "{{ openchami_config_vars_path }}"

- name: Refresh dns_enabled from orchestrator_config.yml
  ansible.builtin.include_vars:
    file: "{{ hostvars['localhost']['input_project_dir'] }}/orchestrator_config.yml"
    name: _orchestrator_config_refresh

- name: Override dns_enabled with current orchestrator_config value
  ansible.builtin.set_fact:
    dns_enabled: "{{ _orchestrator_config_refresh.dns_enabled | default(false) | bool }}"

- name: Include nodes vars
  ansible.builtin.slurp:
    src: "{{ openchami_nodes_vars_path }}"
  register: nodes_vars

- name: Decode and parse nodes_vars YAML
  ansible.builtin.set_fact:
    node_parsed_yaml: "{{ nodes_vars.content | b64decode | from_yaml }}"

- name: Set nodes
  ansible.builtin.set_fact:
    nodes: "{{ node_parsed_yaml.nodes }}"

- name: Create boot and metadata-service directory
  ansible.builtin.file:
    path: "{{ boot_svc_dir }}"
    state: directory
    mode: "{{ hostvars['localhost']['dir_permissions_755'] }}"

- name: Fetch existing boot configurations for cleanup
  ansible.builtin.uri:
    url: "https://{{ cluster_name }}.{{ cluster_domain }}:8443/boot-service/bootconfigurations"
    method: GET
    headers:
      Authorization: "Bearer {{ ochami_env[(oim_node_name | upper) + '_ACCESS_TOKEN'] }}"
    status_code: [200]
    validate_certs: false
    return_content: true
  register: existing_boot_configs_cleanup
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

- name: Delete existing boot configurations
  ansible.builtin.uri:
    url: "https://{{ cluster_name }}.{{ cluster_domain }}:8443/boot-service/bootconfigurations/{{ item.metadata.uid }}"
    method: DELETE
    headers:
      Authorization: "Bearer {{ ochami_env[(oim_node_name | upper) + '_ACCESS_TOKEN'] }}"
    status_code: [200, 404]
    validate_certs: false
  loop: "{{ existing_boot_configs_cleanup.json | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  failed_when: false
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

- name: Include configure boot-service
  ansible.builtin.include_tasks: configure_boot_svc_group.yml
  with_items: "{{ hostvars['localhost']['functional_groups'] | map(attribute='name') | list }}"

- name: Verify boot configurations set
  ansible.builtin.uri:
    url: "https://{{ cluster_name }}.{{ cluster_domain }}:8443/boot-service/bootconfigurations"
    method: GET
    headers:
      Authorization: "Bearer {{ ochami_env[(oim_node_name | upper) + '_ACCESS_TOKEN'] }}"
    status_code: [200]
    validate_certs: false
    return_content: true
  register: boot_configs_output
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

- name: Verify boot configurations output
  ansible.builtin.debug:
    msg: "{{ boot_configs_output.json | default([]) | map(attribute='metadata.name') | list }}"
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

- name: Create metadata-service directory
  ansible.builtin.file:
    path: "{{ metadata_svc_dir }}"
    state: directory
    mode: "{{ hostvars['localhost']['dir_permissions_755'] }}"

- name: Read the ssh key
  ansible.builtin.command: cat {{ ssh_key_path }}
  changed_when: false
  register: read_ssh_key
  no_log: true

- name: Read the ssh private key
  ansible.builtin.command: cat {{ ssh_private_key_path }}
  changed_when: false
  register: read_ssh_private_key
  no_log: true

- name: Hash the password
  ansible.builtin.command: openssl passwd -6 "{{ hostvars['localhost']['provision_password'] }}"
  changed_when: false
  register: hashed_password_output
  no_log: true

- name: Load metadata-service defaults template
  ansible.builtin.template:
    src: "{{ ms_defaults_template }}"
    dest: "{{ ms_defaults_dest }}"
    mode: "{{ hostvars['localhost']['file_permissions_644'] }}"

- name: Load rendered metadata-service defaults
  ansible.builtin.slurp:
    src: "{{ ms_defaults_dest }}"
  register: ms_defaults_raw
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

- name: Parse ci defaults YAML
  ansible.builtin.set_fact:
    ms_defaults_data: "{{ ms_defaults_raw.content | b64decode | from_yaml }}"
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

- name: Set metadata-service defaults via metadata-service API
  ansible.builtin.uri:
    url: "https://{{ cluster_name }}.{{ cluster_domain }}:8443/metadata-service/clusterdefaultss"
    method: POST
    headers:
      Authorization: "Bearer {{ ochami_env[(oim_node_name | upper) + '_ACCESS_TOKEN'] }}"
      Content-Type: "application/json"
    body_format: json
    body:
      metadata:
        name: "{{ cluster_name }}-defaults"
      spec:
        description: "Cluster defaults for {{ cluster_name }}"
        base_url: "{{ ms_defaults_data['base_url'] | default('') }}"
        cluster_name: "{{ ms_defaults_data['cluster_name'] | default(cluster_name) }}"
        short_name: "{{ ms_defaults_data['short_name'] | default(cluster_shortname) }}"
        nid_length: "{{ ms_defaults_data['nid_length'] | default(cluster_nidlength) | int }}"
        public_keys: "{{ ms_defaults_data['public_keys'] | default([]) }}"
        cloud_provider: "OpenCHAMI"
    status_code: [200, 201, 409]
    validate_certs: false
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

- name: Configure metadata-service group
  ansible.builtin.include_tasks: configure_metadata_svc_common.yml

- name: Include configure metadata-service
  ansible.builtin.include_tasks: configure_metadata_svc_group.yml
  with_items: "{{ hostvars['localhost']['functional_groups'] | map(attribute='name') | list }}"

# Re-apply per-node hostname data after all defaults and group configs are set.
# The metadata-service stores data in-memory and the ordering matters:
# defaults/groups must be loaded before per-node instance overrides.
# This matches the reload order used in upgrade (reload_metadata_svc_data.yml).
- name: Check hostname.yaml exists
  ansible.builtin.stat:
    path: "{{ openchami_hostname_vars_path }}"
  register: hostname_yaml_stat

- name: Load hostname YAML for re-apply
  ansible.builtin.slurp:
    src: "{{ openchami_hostname_vars_path }}"
  register: reapply_hostname_raw
  when:
    - hostname_yaml_stat.stat.exists | default(false)
    - not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

- name: Parse hostname entries for re-apply
  ansible.builtin.set_fact:
    reapply_hostname_entries: "{{ reapply_hostname_raw.content | b64decode | from_yaml }}"
  when:
    - hostname_yaml_stat.stat.exists | default(false)
    - not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

- name: Re-apply per-node hostname data into metadata-service
  ansible.builtin.uri:
    url: "https://{{ cluster_name }}.{{ cluster_domain }}:8443/metadata-service/instanceinfos"
    method: POST
    headers:
      Authorization: "Bearer {{ ochami_env[(oim_node_name | upper) + '_ACCESS_TOKEN'] }}"
      Content-Type: "application/json"
    body_format: json
    body:
      metadata:
        name: "{{ item.id }}"
      spec:
        instance_id: "{{ item.id }}"
        hostname: "{{ item['local-hostname'] }}"
        local_hostname: "{{ item['local-hostname'] }}"
    status_code: [200, 201, 409]
    validate_certs: false
  loop: "{{ reapply_hostname_entries | default([]) }}"
  loop_control:
    label: "{{ item.id }}"
  when:
    - hostname_yaml_stat.stat.exists | default(false)
    - not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

- name: Configure additional metadata-service group
  ansible.builtin.include_tasks: configure_metadata_svc_additional.yml
  when: additional_metadata_svc_enabled | default(false) | bool

- name: Set openchami SELinux context
  ansible.builtin.command: chcon -R system_u:object_r:container_file_t:s0 "{{ hostvars['localhost']['oim_shared_path'] }}/omnia/openchami"
  changed_when: true
  failed_when: false
