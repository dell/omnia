---

- name: Include vars from default
  ansible.builtin.include_vars: "{{ default_file_path }}"

- name: Set the functional_group_name
  ansible.builtin.set_fact:
    functional_group_name: "{{ item }}"

- name: Load metadata-service group template
  block:
    - name: Load metadata-service group template - {{ functional_group_name }}
      ansible.builtin.template:
        src: "metadata_svc/ms-group-{{ functional_group_name }}.yaml.j2"
        dest: "{{ metadata_svc_dir }}/ms-group-{{ functional_group_name }}.yaml"
        mode: "{{ hostvars['localhost']['file_permissions_644'] }}"
  rescue:
    - name: Failed to load metadata-service group template
      ansible.builtin.fail:
        msg: "{{ ms_group_load_fail_msg }}"

- name: Load rendered FG group YAML - {{ functional_group_name }}
  ansible.builtin.slurp:
    src: "{{ metadata_svc_dir }}/ms-group-{{ functional_group_name }}.yaml"
  register: ms_fg_group_raw
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

- name: Parse FG group entries - {{ functional_group_name }}
  ansible.builtin.set_fact:
    ms_fg_group_entries: "{{ ms_fg_group_raw.content | b64decode | from_yaml }}"
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

- name: Build metadata-service group body for FG entries - {{ functional_group_name }}
  ansible.builtin.set_fact:
    _ms_fg_bodies: >-
      {{ _ms_fg_bodies | default([]) + [{
        'metadata': {'name': entry.name},
        'spec': ({'description': entry.description | default(''),
                   'template': entry.file.content | default('')}
                  | combine(
                    {'metaData': dict(
                       entry['meta-data'].keys() | list
                       | zip(entry['meta-data'].values() | map('to_json') | list)
                     )}
                    if entry['meta-data'] is defined and entry['meta-data'] | length > 0
                    else {}
                  ))
      }] }}
  loop: "{{ ms_fg_group_entries | default([]) }}"
  loop_control:
    loop_var: entry
    label: "{{ entry.name }}"
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

- name: Set metadata-service group configuration for functional group (via metadata-service API)  # noqa: name[template]
  ansible.builtin.uri:
    url: "https://{{ cluster_name }}.{{ cluster_domain }}:8443/metadata-service/groups"
    method: POST
    headers:
      Authorization: "Bearer {{ ochami_env[(oim_node_name | upper) + '_ACCESS_TOKEN'] }}"
      Content-Type: "application/json"
    body_format: json
    body: "{{ item }}"
    status_code: [200, 201, 409]
    validate_certs: false
  loop: "{{ _ms_fg_bodies | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)
