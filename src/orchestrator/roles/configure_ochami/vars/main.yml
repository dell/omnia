---

# Usage: orchestration_mapping_nodes.yml
openchami_nodes_template: "{{ role_path }}/templates/nodes/nodes.yaml.j2"
bmc_group_data_template: "{{ role_path }}/templates/nodes/bmc_group_data.csv.j2"
openchami_share_path: "{{ hostvars['localhost']['omnia_data_path'] }}/openchami"
bmc_group_data_file: "{{ hostvars['localhost']['orchestrator_output_dir'] }}/bmc_group_data.csv"
orchestrator_inventory_template: "{{ role_path }}/templates/nodes/orchestrator_inventory.yaml.j2"
orchestrator_inventory_file: "{{ hostvars['localhost']['orchestrator_output_dir'] }}/orchestrator_inventory.yaml"
openchami_work_dir: "{{ openchami_share_path }}/workdir"
nodes_dir: "{{ openchami_work_dir }}/nodes"
openchami_config_vars_path: "{{ openchami_share_path }}/configs_vars.yaml"
openchami_groups_template: "{{ role_path }}/templates/nodes/groups.yaml.j2"
openchami_nodes_vars_path: "{{ nodes_dir }}/nodes.yaml"
orchestration_fail_msg: "Failed to orchestrate nodes. Please verify the inputs provided in mapping file."
openchami_hostname_template: "{{ role_path }}/templates/nodes/hostname.yaml.j2"
openchami_hostname_vars_path: "{{ nodes_dir }}/hostname.yaml"

# Usage: create_groups.yml
openchami_groups_common_template: "{{ role_path }}/templates/nodes/groups_common.yaml.j2"
common_metadata_svc_groups:
  - ssh
  - chrony
  - node_registration

# Usage: configure_boot_svc_group.yml, configure_boot_svc_metadata_svc.yml
boot_svc_template: boot_svc/boot-svc.yaml.j2
boot_svc_dir: "{{ openchami_work_dir }}/boot"
boot_svc_params_metadata_svc: 'cloud-init=enabled ds=nocloud-net;s=http://{{ cluster_boot_ip }}:8081/metadata-service/'
boot_svc_params_opts: 'ip=dhcp rd.live.image rd.live.ram rd.neednet=1 rd.driver.blacklist=ccp,edac_core,power_meter,ahci,megaraid_sas modprobe.blacklist=ccp,edac_core,power_meter,ahci,megaraid_sas libata.force=1:disable,2:disable,3:disable,4:disable rd.luks=0 rd.md=0 rd.dm=0 console=tty0 console=ttyS0,115200 selinux=0 apparmor=0 ip6=off cloud-init=enabled' # noqa: yaml[line-length]
image_missing_fail_msg: "Failed to set kernel or initrd. Create the image using build_image.yml and try again."

# Usage: configure_metadata_svc_group.yml, configure_bss_metadata_svc.yml
ssh_key_path: "{{ ansible_user_dir | default('/root') }}/.ssh/oim_rsa.pub"
ms_defaults_template: metadata_svc/ms-defaults.yaml.j2
metadata_svc_dir: "{{ openchami_work_dir }}/metadata-service"
ms_defaults_dest: '{{ metadata_svc_dir }}/ms-defaults.yaml'
ms_group_load_fail_msg: |
  "Template loading failed. Ensure the template exists in the specified path and is compatible with the defined functional groups."
default_file_path: "{{ role_path }}/../slurm_config/defaults/main.yml"
ssh_private_key_path: "{{ ansible_user_dir | default('/root') }}/.ssh/oim_rsa"

# Usage: configure_metadata_svc_common.yml
ms_group_common_template: metadata_svc/ms-group-common.yaml.j2
ms_group_common_dest: "{{ metadata_svc_dir }}/ms-group-common.yaml"

# Usage: configure_metadata_svc_additional.yml
ms_group_additional_template: metadata_svc/ms-group-additional_metadata_svc.yaml.j2
additional_metadata_svc_common_group_name: additional_metadata_svc
additional_metadata_svc_fg_group_prefix: "additional_metadata_svc_"
additional_metadata_svc_fg_groups_template: "{{ role_path }}/templates/nodes/groups_additional_fg.yaml.j2"

# Usage: orchestration_completion.yml
orchestration_completion_msg: |
  The orchestrator.yml playbook has completed successfully.
  Next, you can either manually PXE boot the nodes or use the utils/set_pxe_boot.yml playbook
  by specifying a bmc group in your inventory to initiate the PXE boot process.
  Once the nodes have booted, the orchestrator provisioning is complete.

# Usage: ci-group-login_node_x86_64.yaml.j2
tls_cert_path: "/etc/openldap/certs/ldapserver.crt"
ldap_conf_dest: "/etc/openldap/ldap.conf"
sasl_nocanon_regxp: "SASL_NOCANON\ton"
sasl_nacanon_replace1: "SASL_NOCANON\ton\nBASE\t{{ hostvars['localhost']['ldap_search_base'] }}"
sasl_nacanon_replace2: "SASL_NOCANON\ton\nURI\tldap://{{ hostvars['localhost']['ldap_server_ip'] }}"
sasl_nacanon_replace3: "SASL_NOCANON\ton\nTLS_CACERT\t{{ tls_cert_path }}"
sasl_nacanon_replace4: "SASL_NOCANON\ton\nURI\tldap://{{ hostvars['localhost']['ldap_server_ip'] }}:636"
file_mode: "0644"
ldap_starttls_port: 389
ldap_ssl_port: 636

# Usage: ci-group-slurm_control_node_x86_64.yaml.j2
home_dir: /var/lib/slurm
user: slurm
munge_user: munge
munge_group: munge
mysql_user: mysql
mysql_group: mysql
file_mode_400: "0400"
file_mode_755: "0755"
file_mode_600: "0600"
ip_timeout: 10
ip_wait_loop: 60

# DNS-related variables (set on localhost by orchestrator_validations, needed by metadata-service templates)
admin_nic_ip: "{{ hostvars['localhost']['admin_nic_ip'] }}"
domain_name: "{{ hostvars['localhost']['domain_name'] }}"

# Hostname lists for stack-specific SSH configs (populated by passwordless_ssh role)
k8s_cluster_hostnames: "{{ hostvars['localhost']['k8s_cluster_hostnames'] | default([]) }}"
slurm_cluster_hostnames: "{{ hostvars['localhost']['slurm_cluster_hostnames'] | default([]) }}"

# IP wildcard lists for stack-specific SSH configs
k8s_cluster_ip_patterns: "{{ hostvars['localhost']['k8s_cluster_ip_patterns'] | default([]) }}"
slurm_cluster_ip_patterns: "{{ hostvars['localhost']['slurm_cluster_ip_patterns'] | default([]) }}"

# SSH Host patterns precomputed on OIM by passwordless_ssh/read_nodes_yaml.yml
slurm_control_ssh_patterns: "{{ hostvars['oim']['slurm_ssh_patterns'] | default('*') }}"
k8s_control_ssh_patterns: "{{ hostvars['oim']['k8s_ssh_patterns'] | default('*') }}"

# Passwordless SSH mode flag derived from nodes.yaml (set on OIM by passwordless_ssh role)
all_group_names_present: "{{ hostvars['oim']['all_group_names_present'] | default(false) }}"

# Login/compiler node presence flag (set by slurm_config role)
login_compiler_node_present: "{{ hostvars['oim']['login_compiler_node_present'] | default(false) }}"
slurm_node_present: "{{ hostvars['oim']['slurm_node_present'] | default(false) }}"
# Usage: ci-group-slurm_node_x86_64.yaml.j2, ci-group-slurm_node_aarch64.yaml.j2
dcgm_support: "{{ hostvars['localhost'].get('dcgm_support', true) | bool }}"
csi_driver_powerscale_support: "{{ hostvars['localhost'].get('csi_driver_powerscale_support', false) | string | lower }}"
# NVIDIA DCGM (Data Center GPU Manager) configuration
dcgm_service_name: "nvidia-dcgm"
dcgm_health_check_retries: 3

# Usage: fetch_additional_images.yml
local_repo_config_path: "{{ hostvars['localhost']['omnia_project_input_dir'] }}/local_repo_config.yml"

# Usage: orchestration_mapping_nodes.yml
orchestrator_input_dir: "{{ playbook_dir | regex_replace('/playbooks.*$', '') }}/input"
service_retries: 16 # 4 minutes
service_retry_interval: 15 # seconds
metadata_svc_failed_msg: |
  metadata-service is not running after {{ service_retries }} retries.
  Next steps:
  1. Check service status: systemctl status metadata-service
  2. Check if openchami.target dependencies are satisfied: systemctl list-dependencies openchami.target
  3. If certificate expired issues occur, restart acme-deploy service: systemctl restart acme-deploy
  4. Wait for openchami.target and all its dependencies to be active
  5. Restart service: systemctl restart metadata-service
  6. Rerun orchestrator.yml: cd orchestrator/playbooks && ansible-playbook orchestrator.yml

openchami_target_failed_msg: |
  openchami.target is not up after {{ service_retries }} retries.
  Next steps:
  1. Check target status: systemctl status openchami.target
  2. View logs: journalctl -u openchami.target -n 50
  3. Check individual services: systemctl status smd boot-service metadata-service
  4. Restart target: systemctl restart openchami.target
  5. Rerun orchestrator.yml: cd orchestrator/playbooks && ansible-playbook orchestrator.yml

ochami_discovery_failed_msg: |
  Failed to discover ochami nodes after retries.
  Next steps:
  1. Verify nodes.yaml is valid: cat {{ openchami_nodes_vars_path }}
  2. Check SMD connectivity
  3. View SMD logs
  4. Check ochami CLI: /usr/bin/ochami smd service status
  5. Restart openchami.target: systemctl restart openchami.target
  6. Rerun orchestrator.yml: cd orchestrator/playbooks && ansible-playbook orchestrator.yml
