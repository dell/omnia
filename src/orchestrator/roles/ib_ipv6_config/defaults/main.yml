---
# IPoIB IPv6 configuration defaults

# Path to the allocation export JSON file
ib_ipv6_allocation_file: "{{ hostvars['localhost']['input_dir'] }}/ib_ipv6_allocation.json"

# Approved IPv6 prefixes (from network_spec.yml)
ib_ipv6_approved_prefixes: "{{ hostvars['localhost']['network_spec_data']['ib_ipv6_approved_prefixes'] | default([]) }}"

# IPoIB addressing mode override (auto-detected if not set)
# Valid: dual-stack, ipv6-only, ipv4-only
ib_ipv6_mode: ""

# Output directory for rendered artifacts
ib_ipv6_output_dir: "{{ hostvars['localhost']['orchestrator_output_dir'] }}/ib_ipv6"

# Previous config hashes file (for idempotent reapplication)
ib_ipv6_hashes_file: "{{ ib_ipv6_output_dir }}/config_hashes.json"

# Peer address map for reachability verification (interface_id → peer_address)
ib_ipv6_peer_addresses: {}

# Log directory
ib_ipv6_log_dir: "{{ hostvars['localhost']['omnia_data_path'] | default('/opt/omnia') }}/log/core/playbooks"

# OpenSM non-regression check (set to true to capture before/after snapshots)
ib_ipv6_opensm_check: false

# Hosts block management
ib_ipv6_manage_hosts: true

# Verification after configuration
ib_ipv6_verify: true
