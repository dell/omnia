---
# Publish IPoIB IPv6 SMD interface registrations to OpenCHAMI SMD.
# Uses delete-then-set for idempotency (same pattern as provision_common).

- name: Load SMD payload for each updated node
  ansible.builtin.slurp:
    src: "{{ _ib_ipv6_render.smd_payloads[item] }}"
  register: _ib_ipv6_smd_raw
  loop: "{{ _ib_ipv6_render.nodes_needing_update }}"
  delegate_to: localhost

- name: Register IPoIB IPv6 interfaces in SMD
  ansible.builtin.uri:
    url: >-
      https://{{ cluster_name }}.{{ cluster_domain
      }}:8443/hsm/v2/Inventory/EthernetInterfaces
    method: POST
    headers:
      Authorization: "Bearer {{ ochami_env[cluster_env_key] }}"
      Content-Type: "application/json"
    body_format: json
    body: "{{ item.content | b64decode | from_json }}"
    status_code: [200, 201, 409]
    validate_certs: false
  loop: "{{ _ib_ipv6_smd_raw.results }}"
  loop_control:
    label: "{{ item.item }}"
  no_log: true
  when:
    - not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

- name: Display SMD registration status
  ansible.builtin.debug:
    msg: >-
      [IB-IPv6] SMD registration complete for
      {{ _ib_ipv6_render.nodes_needing_update | length }} node(s)
