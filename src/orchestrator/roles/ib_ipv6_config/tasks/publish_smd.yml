---
# Publish IPoIB IPv6 SMD interface registrations to OpenCHAMI SMD.
# Uses delete-then-set for idempotency (same pattern as provision_common).

- name: Load SMD payload for each updated node
  ansible.builtin.slurp:
    src: "{{ _ib_ipv6_render.smd_payloads[item] }}"
  register: _ib_ipv6_smd_raw
  loop: "{{ _ib_ipv6_render.nodes_needing_update }}"
  delegate_to: localhost

- name: Register IPoIB IPv6 interfaces in SMD
  ansible.builtin.uri:
    url: >-
      https://{{ cluster_name }}.{{ cluster_domain
      }}:8443/hsm/v2/Inventory/EthernetInterfaces
    method: POST
    headers:
      Authorization: "Bearer {{ ochami_env[cluster_env_key] }}"
      Content-Type: "application/json"
    body_format: json
    body: "{{ item.content | b64decode | from_json }}"
    status_code: [200, 201, 409]
    validate_certs: false
  loop: "{{ _ib_ipv6_smd_raw.results }}"
  loop_control:
    label: "{{ item.item }}"
  no_log: true
  register: _ib_ipv6_smd_results
  when:
    - not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)
  ignore_errors: true

- name: Detect SMD publication failures
  ansible.builtin.set_fact:
    _ib_ipv6_smd_failed_nodes: >-
      {{ _ib_ipv6_smd_results.results
         | default([])
         | selectattr('failed', 'defined')
         | selectattr('failed', 'equalto', true)
         | map(attribute='item')
         | map(attribute='item')
         | list }}

- name: Set SMD publication status
  ansible.builtin.set_fact:
    _ib_ipv6_smd_success: "{{ (_ib_ipv6_smd_failed_nodes | length) == 0 }}"

- name: Report RECOVERY_REQUIRED for SMD publication failures
  ansible.builtin.debug:
    msg: >-
      [IB-IPv6] RECOVERY_REQUIRED — SMD publication failed for node(s):
      {{ _ib_ipv6_smd_failed_nodes | join(', ') }}.
      failure_stage=SMD_PUBLICATION, retryable=true,
      recommended_action=rerun provisioning for affected nodes.
  when: not (_ib_ipv6_smd_success | bool)

- name: Display SMD registration status
  ansible.builtin.debug:
    msg: >-
      [IB-IPv6] SMD registration complete for
      {{ _ib_ipv6_render.nodes_needing_update | length }} node(s)
  when: _ib_ipv6_smd_success | bool
