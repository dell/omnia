---
# ib_ipv6_config — IPoIB IPv6 configuration pipeline
#
# Pipeline: validate → render → publish → verify
#
# This role runs on the OIM node (delegating to targets for verification).
# It validates the allocation, renders NM/SMD artifacts,
# publishes them via SMD/BSS/cloud-init, and verifies post-configuration state.

- name: Display IPoIB IPv6 configuration start
  ansible.builtin.debug:
    msg: "{{ ib_ipv6_validation_start_msg }}"

# -----------------------------------------------------------------------
# Phase 1: Validate IPoIB allocations from PXE mapping file (Story 1)
# -----------------------------------------------------------------------
# The PXE mapping file (pxe_mapping_file.csv) is the sole ingestion
# interface for IPoIB allocations per ER-ORCH-005 / BR-34869 v6.1.
# Mandatory IB columns: SERVICE_TAG/HOSTNAME, IB_NIC_NAME, IB_IP (or
# IB_IPV4/IB_IPV6 in canonical format).

- name: Check PXE mapping file exists
  ansible.builtin.stat:
    path: "{{ ib_ipv6_pxe_mapping_file }}"
  register: _ib_ipv6_pxe_stat
  delegate_to: localhost

- name: Fail if PXE mapping file is missing
  ansible.builtin.fail:
    msg: "{{ ib_ipv6_pxe_missing_msg }} Path: {{ ib_ipv6_pxe_mapping_file }}"
  when: not _ib_ipv6_pxe_stat.stat.exists

- name: Validate IPoIB IPv6 allocations from PXE mapping
  validate_ib_ipv6_allocation:
    pxe_mapping_file: "{{ ib_ipv6_pxe_mapping_file }}"
    approved_prefixes: "{{ ib_ipv6_approved_prefixes }}"
    log_dir: "{{ ib_ipv6_log_dir }}"
  register: _ib_ipv6_validation
  delegate_to: localhost

- name: Display allocation validation log
  ansible.builtin.debug:
    msg: "Validation log: {{ _ib_ipv6_validation.log_file }}"

- name: Fail if allocation validation failed
  ansible.builtin.fail:
    msg: >-
      {{ ib_ipv6_validation_fail_msg }}
      Errors: {{ _ib_ipv6_validation.errors }}
  when: _ib_ipv6_validation.validation_failed

- name: Display allocation validation summary
  ansible.builtin.debug:
    msg: >-
      {{ ib_ipv6_validation_pass_msg }}:
      {{ _ib_ipv6_validation.total_allocations }} IB rows,
      {{ _ib_ipv6_validation.active_allocations }} active,
      mode={{ _ib_ipv6_validation.ib_mode }}

- name: Extract ib_addr_mode from network_spec
  ansible.builtin.set_fact:
    _ib_addr_mode: >-
      {{ (_ib_ipv6_network_data | default({'ib_network': {}})).ib_network.ib_addr_mode
         | default(_ib_ipv6_validation.ib_mode) }}

# -----------------------------------------------------------------------
# Phase 2: Render NM/SMD artifacts (Story 2)
# -----------------------------------------------------------------------

- name: Load previous config hashes (if available)
  block:
    - name: Check if previous hashes file exists
      ansible.builtin.stat:
        path: "{{ ib_ipv6_hashes_file }}"
      register: _ib_ipv6_hashes_stat
      delegate_to: localhost

    - name: Load previous hashes
      ansible.builtin.slurp:
        src: "{{ ib_ipv6_hashes_file }}"
      register: _ib_ipv6_hashes_raw
      delegate_to: localhost
      when: _ib_ipv6_hashes_stat.stat.exists

    - name: Parse previous hashes
      ansible.builtin.set_fact:
        _ib_ipv6_previous_hashes: >-
          {{ (_ib_ipv6_hashes_raw.content | b64decode | from_json)
             if _ib_ipv6_hashes_stat.stat.exists
             else {} }}
  rescue:
    - name: Default to empty hashes on parse failure
      ansible.builtin.set_fact:
        _ib_ipv6_previous_hashes: {}

- name: "{{ ib_ipv6_render_start_msg }}"
  render_ib_ipv6_config:
    normalized_nodes: "{{ _ib_ipv6_validation.normalized_nodes }}"
    output_dir: "{{ ib_ipv6_output_dir }}"
    previous_hashes: "{{ _ib_ipv6_previous_hashes }}"
    log_dir: "{{ ib_ipv6_log_dir }}"
    ib_addr_mode: "{{ _ib_addr_mode }}"
  register: _ib_ipv6_render
  delegate_to: localhost

- name: Display render summary
  ansible.builtin.debug:
    msg: >-
      {{ ib_ipv6_render_pass_msg }}:
      {{ _ib_ipv6_render.nodes_needing_update | length }} nodes to update,
      {{ _ib_ipv6_render.nodes_skipped | length }} unchanged (skipped)

- name: Report render errors
  ansible.builtin.debug:
    msg: "Render error: {{ item }}"
  loop: "{{ _ib_ipv6_render.errors }}"
  when: _ib_ipv6_render.errors | length > 0

# -----------------------------------------------------------------------
# Phase 3: Publish to SMD and BSS (Story 2)
# -----------------------------------------------------------------------

- name: "{{ ib_ipv6_publish_start_msg }}"
  ansible.builtin.include_tasks: publish_smd.yml
  when: _ib_ipv6_render.nodes_needing_update | length > 0

- name: Gate BSS on SMD success (FR-4 RECOVERY_REQUIRED)
  ansible.builtin.debug:
    msg: "{{ ib_ipv6_smd_recovery_msg }}"
  when:
    - _ib_ipv6_render.nodes_needing_update | length > 0
    - not (_ib_ipv6_smd_success | default(true) | bool)

- name: Publish cloud-init user-data to BSS
  ansible.builtin.include_tasks: publish_bss.yml
  when:
    - _ib_ipv6_render.nodes_needing_update | length > 0
    - _ib_ipv6_smd_success | default(true) | bool

- name: Set publication recovery state
  ansible.builtin.set_fact:
    _ib_ipv6_publication_state: >-
      {{ 'RECOVERY_REQUIRED'
         if (not (_ib_ipv6_smd_success | default(true) | bool)
             or not (_ib_ipv6_bss_success | default(true) | bool))
         else 'PUBLISHED' }}

- name: Report RECOVERY_REQUIRED publication state
  ansible.builtin.debug:
    msg: >-
      {{ ib_ipv6_publication_state_msg }} {{ _ib_ipv6_publication_state }}.
      {% if _ib_ipv6_publication_state == 'RECOVERY_REQUIRED' %}
      {{ ib_ipv6_publication_rerun_msg }}
      {% endif %}
  when: _ib_ipv6_publication_state == 'RECOVERY_REQUIRED'

# -----------------------------------------------------------------------
# Phase 4: Verify post-configuration state (Story 3)
# -----------------------------------------------------------------------

- name: "{{ ib_ipv6_verify_start_msg }}"
  ansible.builtin.include_tasks: verify.yml
  when: ib_ipv6_verify | bool

- name: Record IPoIB IPv6 configuration complete
  ansible.builtin.set_fact:
    _ib_ipv6_configured: true
    _ib_addr_mode: "{{ _ib_addr_mode }}"
    _ib_ipv6_config_hashes: "{{ _ib_ipv6_render.config_hashes }}"
    _ib_ipv6_publication_state: "{{ _ib_ipv6_publication_state | default('PUBLISHED') }}"
