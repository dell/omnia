---
# ib_ipv6_config — IPoIB IPv6 configuration pipeline
#
# Pipeline: validate → render → publish → verify
#
# This role runs on the OIM node (delegating to targets for verification).
# It validates the allocation export, renders NM/SMD/hosts artifacts,
# publishes them via SMD/BSS/cloud-init, and verifies post-configuration state.

- name: Display IPoIB IPv6 configuration start
  ansible.builtin.debug:
    msg: "{{ ib_ipv6_validation_start_msg }}"

# -----------------------------------------------------------------------
# Phase 1: Validate allocation export (Story 1)
# -----------------------------------------------------------------------

- name: Check allocation file exists
  ansible.builtin.stat:
    path: "{{ ib_ipv6_allocation_file }}"
  register: _ib_ipv6_alloc_stat
  delegate_to: localhost

- name: Fail if allocation file is missing
  ansible.builtin.fail:
    msg: "{{ ib_ipv6_allocation_missing_msg }}"
  when: not _ib_ipv6_alloc_stat.stat.exists

- name: Validate IPoIB IPv6 allocation export
  validate_ib_ipv6_allocation:
    allocation_file: "{{ ib_ipv6_allocation_file }}"
    approved_prefixes: "{{ ib_ipv6_approved_prefixes }}"
    log_dir: "{{ ib_ipv6_log_dir }}"
    schema_file: "{{ hostvars['localhost']['_domain_root_dir'] }}/plugins/module_utils/orchestrator_validation/schema/ib_ipv6_allocation.json"
  register: _ib_ipv6_validation
  delegate_to: localhost

- name: Display allocation validation log
  ansible.builtin.debug:
    msg: "Validation log: {{ _ib_ipv6_validation.log_file }}"

- name: Fail if allocation validation failed
  ansible.builtin.fail:
    msg: >-
      {{ ib_ipv6_validation_fail_msg }}
      Errors: {{ _ib_ipv6_validation.errors }}
  when: _ib_ipv6_validation.validation_failed

- name: Display allocation validation summary
  ansible.builtin.debug:
    msg: >-
      {{ ib_ipv6_validation_pass_msg }}:
      {{ _ib_ipv6_validation.total_allocations }} total,
      {{ _ib_ipv6_validation.active_allocations }} active,
      mode={{ _ib_ipv6_validation.ib_mode }},
      snapshot={{ _ib_ipv6_validation.snapshot_id }}

# -----------------------------------------------------------------------
# Phase 1b: Discover actual IB interface names on compute nodes
# -----------------------------------------------------------------------
# The allocation JSON may use generic names (e.g., "ib0") but the actual
# kernel interface names use predictable naming (e.g., "ibp181s0") based
# on PCI topology. Discover the real names and patch normalized_nodes.

- name: Build hostname list from normalized nodes
  ansible.builtin.set_fact:
    _ib_discover_hosts: >-
      {{ _ib_ipv6_validation.normalized_nodes | dict2items
         | map(attribute='value') | map('dict2items')
         | flatten | map(attribute='value') | flatten
         | selectattr('hostname', 'defined')
         | map(attribute='hostname') | unique | list }}

- name: Discover IB interface names on compute nodes
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
        "{{ item }}" "ls /sys/class/net/" | grep '^ib'
    executable: /bin/bash
  loop: "{{ _ib_discover_hosts }}"
  register: _ib_discover_results
  changed_when: false
  failed_when: false

- name: Build hostname-to-interface mapping
  ansible.builtin.set_fact:
    _ib_discovered_interfaces: >-
      {{ _ib_discovered_interfaces | default({})
         | combine({item.item:
             (item.stdout_lines | default([]))}) }}
  loop: "{{ _ib_discover_results.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc == 0

- name: Display discovered IB interfaces
  ansible.builtin.debug:
    msg: >-
      [IB-IPv6] Discovered IB interfaces:
      {% for host, ifaces in (_ib_discovered_interfaces | default({})).items() %}
      {{ host }}={{ ifaces | join(',') }}
      {% endfor %}

- name: Write node and interface data for patching
  ansible.builtin.copy:
    content: |
      {{ {'nodes': _ib_ipv6_validation.normalized_nodes,
          'iface_map': _ib_discovered_interfaces}
         | to_json }}
    dest: "{{ ib_ipv6_output_dir }}/.patch_input.json"
    mode: "0600"
  delegate_to: localhost

- name: Patch normalized_nodes with discovered interface names
  ansible.builtin.shell: |
    python3 -c "
    import json
    with open('{{ ib_ipv6_output_dir }}/.patch_input.json') as f:
        data = json.load(f)
    nodes, iface_map = data['nodes'], data['iface_map']
    result = {}
    for nid, nifaces in nodes.items():
        first_rec = next(iter(next(iter(nifaces.values()))))
        hostname = first_rec.get('hostname', '')
        discovered = iface_map.get(hostname, [])
        if discovered:
            new_ifaces = {}
            for idx, old_key in enumerate(nifaces):
                new_key = discovered[idx] if idx < len(discovered) else old_key
                updated = [dict(r, interface_id=new_key) for r in nifaces[old_key]]
                new_ifaces[new_key] = updated
            result[nid] = new_ifaces
        else:
            result[nid] = nifaces
    print(json.dumps(result))
    "
  register: _ib_patched_nodes_raw
  delegate_to: localhost
  changed_when: false

- name: Apply patched normalized_nodes
  ansible.builtin.set_fact:
    _ib_ipv6_validation: >-
      {{ _ib_ipv6_validation | combine({
           'normalized_nodes':
             (_ib_patched_nodes_raw.stdout | from_json)
         }) }}

# -----------------------------------------------------------------------
# Phase 2: Render NM/SMD/hosts artifacts (Story 2)
# -----------------------------------------------------------------------

- name: Load previous config hashes (if available)
  block:
    - name: Check if previous hashes file exists
      ansible.builtin.stat:
        path: "{{ ib_ipv6_hashes_file }}"
      register: _ib_ipv6_hashes_stat
      delegate_to: localhost

    - name: Load previous hashes
      ansible.builtin.slurp:
        src: "{{ ib_ipv6_hashes_file }}"
      register: _ib_ipv6_hashes_raw
      delegate_to: localhost
      when: _ib_ipv6_hashes_stat.stat.exists

    - name: Parse previous hashes
      ansible.builtin.set_fact:
        _ib_ipv6_previous_hashes: >-
          {{ (_ib_ipv6_hashes_raw.content | b64decode | from_json)
             if _ib_ipv6_hashes_stat.stat.exists
             else {} }}
  rescue:
    - name: Default to empty hashes on parse failure
      ansible.builtin.set_fact:
        _ib_ipv6_previous_hashes: {}

- name: "{{ ib_ipv6_render_start_msg }}"
  render_ib_ipv6_config:
    normalized_nodes: "{{ _ib_ipv6_validation.normalized_nodes }}"
    output_dir: "{{ ib_ipv6_output_dir }}"
    previous_hashes: "{{ _ib_ipv6_previous_hashes }}"
    log_dir: "{{ ib_ipv6_log_dir }}"
  register: _ib_ipv6_render
  delegate_to: localhost

- name: Display render summary
  ansible.builtin.debug:
    msg: >-
      {{ ib_ipv6_render_pass_msg }}:
      {{ _ib_ipv6_render.nodes_needing_update | length }} nodes to update,
      {{ _ib_ipv6_render.nodes_skipped | length }} unchanged (skipped)

- name: Report render errors
  ansible.builtin.debug:
    msg: "Render error: {{ item }}"
  loop: "{{ _ib_ipv6_render.errors }}"
  when: _ib_ipv6_render.errors | length > 0

# -----------------------------------------------------------------------
# Phase 3: Publish to SMD, BSS, and /etc/hosts (Story 2)
# -----------------------------------------------------------------------

- name: "{{ ib_ipv6_publish_start_msg }}"
  ansible.builtin.include_tasks: publish_smd.yml
  when: _ib_ipv6_render.nodes_needing_update | length > 0

- name: Publish cloud-init user-data to BSS
  ansible.builtin.include_tasks: publish_bss.yml
  when: _ib_ipv6_render.nodes_needing_update | length > 0

- name: Skip /etc/hosts update (NodeAddr in slurm.conf is sufficient)
  ansible.builtin.debug:
    msg: >-
      [IB-IPv6] Skipping /etc/hosts IPoIB block — Slurm uses NodeAddr
      from slurm.conf for IB communication. Set ib_ipv6_manage_hosts=true
      to re-enable.
  when: not (ib_ipv6_manage_hosts | bool)

# -----------------------------------------------------------------------
# Phase 4: Verify post-configuration state (Story 3)
# -----------------------------------------------------------------------

- name: "{{ ib_ipv6_verify_start_msg }}"
  ansible.builtin.include_tasks: verify.yml
  when: ib_ipv6_verify | bool

- name: Record IPoIB IPv6 configuration complete
  ansible.builtin.set_fact:
    _ib_ipv6_configured: true
    _ib_addr_mode: "{{ _ib_ipv6_validation.ib_mode }}"
    _ib_ipv6_config_hashes: "{{ _ib_ipv6_render.config_hashes }}"
