---
# Publish IPoIB IPv6 cloud-init scripts to BSS user-data.
# Each node gets a configure-ipoib-<node_id>.sh script delivered
# via cloud-init write_files + runcmd at first boot.

- name: Build cloud-init group payload for IPoIB IPv6
  ansible.builtin.set_fact:
    _ib_ipv6_ci_group:
      name: "ipoib-ipv6"
      additional-userdata:
        write_files: >-
          {{ _ib_ipv6_render.node_results
             | dict2items
             | selectattr('key', 'in', _ib_ipv6_render.nodes_needing_update)
             | map(attribute='value')
             | map(attribute='cloud_init')
             | map(attribute='write_files')
             | flatten
             | list }}
        runcmd: >-
          {{ _ib_ipv6_render.node_results
             | dict2items
             | selectattr('key', 'in', _ib_ipv6_render.nodes_needing_update)
             | map(attribute='value')
             | map(attribute='cloud_init')
             | map(attribute='runcmd')
             | flatten
             | list }}

- name: Write cloud-init group YAML for BSS
  ansible.builtin.copy:
    content: "{{ _ib_ipv6_ci_group | to_nice_yaml }}"
    dest: "{{ ib_ipv6_output_dir }}/ci-group-ipoib-ipv6.yaml"
    mode: "0644"
  delegate_to: localhost

- name: Delete existing BSS cloud-init group for IPoIB IPv6
  ansible.builtin.command: >
    /usr/bin/ochami cloud-init group delete --no-confirm -f yaml
    -d @{{ ib_ipv6_output_dir }}/ci-group-ipoib-ipv6.yaml
  changed_when: true
  failed_when: false
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)

- name: Set BSS cloud-init group for IPoIB IPv6
  ansible.builtin.command: >
    /usr/bin/ochami cloud-init group set -f yaml
    -d @{{ ib_ipv6_output_dir }}/ci-group-ipoib-ipv6.yaml
  changed_when: true
  register: _ib_ipv6_bss_set_result
  when: not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)
  ignore_errors: true

- name: Set BSS publication status
  ansible.builtin.set_fact:
    _ib_ipv6_bss_success: >-
      {{ (_ib_ipv6_bss_set_result is not defined)
         or (not (_ib_ipv6_bss_set_result.failed | default(false))) }}

- name: Report RECOVERY_REQUIRED for BSS publication failure
  ansible.builtin.debug:
    msg: >-
      [IB-IPv6] RECOVERY_REQUIRED — BSS publication failed.
      failure_stage=BSS_PUBLICATION, retryable=true,
      recommended_action=rerun provisioning for affected nodes.
      SMD state is already published; idempotent rerun will retry BSS only.
  when: not (_ib_ipv6_bss_success | bool)

- name: Display BSS publication status
  ansible.builtin.debug:
    msg: >-
      [IB-IPv6] BSS cloud-init published for
      {{ _ib_ipv6_render.nodes_needing_update | length }} node(s)
  when: _ib_ipv6_bss_success | bool
