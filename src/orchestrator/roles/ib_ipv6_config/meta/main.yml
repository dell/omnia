---
galaxy_info:
  role_name: ib_ipv6_config
  author: Dell Omnia Team
  description: >
    Configure IPoIB IPv6 addressing on compute nodes.
    Validates allocation export, renders NM profiles via nmcli,
    publishes to SMD/BSS/hosts, and verifies post-configuration state.
  license: Apache-2.0
  min_ansible_version: "2.15"
  platforms:
    - name: EL
      versions:
        - "10"

dependencies:
  - orchestrator_common
