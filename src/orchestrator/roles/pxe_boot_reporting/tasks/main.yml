---
- name: Ensure output directory exists
  ansible.builtin.file:
    path: "{{ orchestrator_output_dir }}"
    state: directory
    mode: "{{ pxe_boot_reporting_directory_mode }}"

- name: Check for provisioning phase report
  ansible.builtin.stat:
    path: "{{ pxe_boot_reporting_provisioning_file }}"
  register: pxeboot_provisioning_report_stat

- name: Load provisioning phase report
  ansible.builtin.slurp:
    src: "{{ pxe_boot_reporting_provisioning_file }}"
  register: pxeboot_provisioning_report_raw
  when: pxeboot_provisioning_report_stat.stat.exists

- name: Decode provisioning phase report data
  ansible.builtin.set_fact:
    pxeboot_provisioning_report_candidate: >-
      {{ (pxeboot_provisioning_report_raw.content | b64decode | from_yaml)
         if pxeboot_provisioning_report_stat.stat.exists else {} }}

- name: Retain provisioning report for the active inventory
  ansible.builtin.set_fact:
    pxeboot_provisioning_report: >-
      {{ pxeboot_provisioning_report_candidate
         if pxeboot_provisioning_report_candidate | type_debug == 'dict'
         and pxeboot_provisioning_report_candidate.inventory_source | default('')
             == pxeboot_inventory_source
         else {} }}

- name: Check for the existing aggregate Orchestrator status
  ansible.builtin.stat:
    path: "{{ pxe_boot_reporting_status_file }}"
  register: pxeboot_orchestrator_status_stat

- name: Load the existing aggregate Orchestrator status
  ansible.builtin.slurp:
    src: "{{ pxe_boot_reporting_status_file }}"
  register: pxeboot_orchestrator_status_raw
  when: pxeboot_orchestrator_status_stat.stat.exists

- name: Decode existing aggregate Orchestrator status
  ansible.builtin.set_fact:
    pxeboot_previous_status: >-
      {{ (pxeboot_orchestrator_status_raw.content | b64decode | from_yaml)
         if pxeboot_orchestrator_status_stat.stat.exists else {} }}

- name: Collect structured node-registration results
  ansible.builtin.set_fact:
    node_registration_results_by_bmc: >-
      {{ node_registration_results_by_bmc
         | combine({hostvars[item]['bmc_ip']:
                    hostvars[item]['verify_node_registration_result']}) }}
  loop: "{{ groups['node_registration_targets'] | default([]) }}"
  when:
    - enable_node_registration | default(true) | bool
    - hostvars[item]['verify_node_registration_result'] is defined

- name: Record missing node-registration results as failures
  ansible.builtin.set_fact:
    node_registration_results_by_bmc: >-
      {{ node_registration_results_by_bmc | combine({item: missing_result}) }}
  vars:
    missing_result:
      admin_ip: "{{ hostvars[item].admin_ip }}"
      bmc_ip: "{{ item }}"
      xname: "{{ hostvars[item].xname | default('') }}"
      hostname: "{{ hostvars[item].hostname_node | default('') }}"
      service_tag: "{{ hostvars[item].service_tag | default('') }}"
      status: failed
      state: verification_result_missing
      detail: Node-registration verification did not return a result
      terminal: true
      attempts: 0
      verification_method: ssh_cloud_init
      cloud_init: {}
  loop: "{{ groups['bmc'] }}"
  loop_control:
    label: "{{ item }}"
  when:
    - enable_node_registration | default(true) | bool
    - item not in pxe_boot_failed_bmc_ips
    - item not in node_registration_results_by_bmc

- name: Collect node-registration failures
  ansible.builtin.set_fact:
    node_registration_failed_bmc_ips: >-
      {{ node_registration_failed_bmc_ips + [item.key] }}
  loop: "{{ node_registration_results_by_bmc | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: item.value.status != 'success'

- name: Build failed nodes list with details
  ansible.builtin.set_fact:
    failed_nodes_list: "{{ failed_nodes_list | default([]) + [node_detail] }}"
  loop: >-
    {{ (pxe_boot_failed_bmc_ips | default([]))
       + (node_registration_failed_bmc_ips | default([])) }}
  vars:
    node_detail:
      bmc_ip: "{{ item }}"
      admin_ip: "{{ hostvars[item].admin_ip | default('N/A') }}"
      xname: "{{ hostvars[item].xname | default('') }}"
      hostname: "{{ hostvars[item].hostname_node | default('N/A') }}"
      service_tag: "{{ hostvars[item].service_tag | default('N/A') }}"
      failure_stage: >-
        {{ 'pxe_boot'
           if item in (pxe_boot_failed_bmc_ips | default([]))
           else 'node_registration' }}
      status: failed
      verification_method: >-
        {{ 'not_started'
           if item in (pxe_boot_failed_bmc_ips | default([]))
           else node_registration_results_by_bmc[item].get(
             'verification_method', 'ssh_cloud_init') }}
      error: >-
        {{ hostvars[item].reboot_state | default('pxe_request_failed')
           if item in (pxe_boot_failed_bmc_ips | default([]))
           else 'Node verification failed' }}
      verification_state: >-
        {{ hostvars[item].reboot_state | default('pxe_request_failed')
           if item in (pxe_boot_failed_bmc_ips | default([]))
           else node_registration_results_by_bmc[item].state }}
      cloud_init: >-
        {{ {} if item in (pxe_boot_failed_bmc_ips | default([]))
           else node_registration_results_by_bmc[item].get('cloud_init', {}) }}

- name: Report total failures
  ansible.builtin.debug:
    msg: >-
      PXE Boot Summary:
      - Total nodes: {{ groups['bmc'] | length }}
      - PXE boot failed: {{ pxe_boot_failed_bmc_ips | default([]) | length }}
      - Node-registration failed:
      {{ node_registration_failed_bmc_ips | default([]) | length }}
      - Completed without failure:
      {{ groups['bmc'] | length
         - (pxe_boot_failed_bmc_ips | default([]) | length)
         - (node_registration_failed_bmc_ips | default([]) | length) }}
      - Verification:
      {{ 'enabled' if enable_node_registration | bool else 'disabled' }}
      - Unverified:
      {{ 0 if enable_node_registration | bool
         else groups['bmc'] | length - (pxe_boot_failed_bmc_ips | length) }}
      - Output: {{ pxe_boot_reporting_failed_nodes_file }}

- name: Build per-node status list
  ansible.builtin.set_fact:
    all_nodes_status: "{{ all_nodes_status | default([]) + [node_entry] }}"
  loop: "{{ groups['bmc'] }}"
  vars:
    _admin_ip: "{{ hostvars[item].admin_ip | default('N/A') }}"
    _xname: "{{ hostvars[item].xname | default('') }}"
    _hostname: "{{ hostvars[item].hostname_node | default('N/A') }}"
    _registration_result: "{{ node_registration_results_by_bmc.get(item, {}) }}"
    _pxe_status: >-
      {{ 'failed'
         if item in (pxe_boot_failed_bmc_ips | default([]))
         or item in (node_registration_failed_bmc_ips | default([]))
         else ('success' if enable_node_registration | bool else 'unverified') }}
    _pxe_state: >-
      {{ hostvars[item].reboot_state | default('pxe_request_failed')
         if item in (pxe_boot_failed_bmc_ips | default([]))
         else (_registration_result.get('state', 'verification_result_missing')
               if item in (node_registration_failed_bmc_ips | default([]))
               else ('success'
                     if enable_node_registration | bool else 'unverified')) }}
    _metadata_applied: >-
      {{ (_pxe_status == 'success')
         and (enable_node_registration | bool)
         and (_registration_result.get('status', '') == 'success') }}
    _provisioning_status: >-
      {{ 'unknown'
         if pxeboot_provisioning_report | default({}) | length == 0
         or _xname | length == 0
         else ('failed'
               if _xname in (pxeboot_provisioning_report.missing_nodes | default([]))
               else 'success') }}
    node_entry:
      bmc_ip: "{{ item }}"
      admin_ip: "{{ _admin_ip }}"
      xname: "{{ _xname }}"
      hostname: "{{ _hostname }}"
      status: >-
        {{ 'success' if _metadata_applied | bool
           else ('failed' if _pxe_status == 'failed' else 'pending') }}
      reprovision_required: "{{ not (_metadata_applied | bool) }}"
      provisioning_status: "{{ _provisioning_status }}"
      pxeboot:
        status: "{{ _pxe_status }}"
        state: "{{ _pxe_state }}"
        trigger_method: orchestrator
        verification_method: >-
          {{ 'not_started'
             if item in (pxe_boot_failed_bmc_ips | default([]))
             else ('ssh_cloud_init'
                   if enable_node_registration | bool else 'not_run') }}

- name: Reconcile PXE lifecycle status
  orchestrator_status_reconcile:
    previous_status: "{{ pxeboot_previous_status }}"
    current_nodes: "{{ all_nodes_status | default([]) }}"
    failed_nodes: "{{ failed_nodes_list | default([]) }}"
    inventory_source: "{{ pxeboot_inventory_source }}"
    timestamp: "{{ ansible_date_time.iso8601 }}"
    run_id: "{{ ansible_date_time.epoch }}"
    verification_enabled: "{{ enable_node_registration | bool }}"
    custom_inventory: "{{ pxeboot_using_custom_inventory | default(false) | bool }}"
    preserve_unselected: >-
      {{ not (pxeboot_buildstream_active | default(false) | bool)
         and not (pxeboot_using_custom_inventory | default(false) | bool)
         and pxeboot_scope_effective | default('pending') == 'pending' }}
    unverified_count: >-
      {{ 0 if enable_node_registration | bool
         else groups['bmc'] | length - (pxe_boot_failed_bmc_ips | length) }}
    provisioning_report: "{{ pxeboot_provisioning_report }}"
  register: pxeboot_lifecycle_status

- name: Write PXE lifecycle reports
  ansible.builtin.include_role:
    name: orchestrator_lifecycle_status
  vars:
    orchestrator_lifecycle_status_result: "{{ pxeboot_lifecycle_status }}"

- name: Run BuildStream post-processing
  when:
    - enable_build_stream | default(false) | bool
    - job_id is defined
    - job_id | string | length > 0
  block:
    - name: Write BuildStream node results
      ansible.builtin.include_role:
        name: pxe_buildstream_manager
        tasks_from: write_node_results.yml

    - name: Update BuildStream restart state
      ansible.builtin.include_role:
        name: pxe_buildstream_manager
        tasks_from: update_restart_state.yml

    - name: Register BuildStream GitLab host
      ansible.builtin.include_role:
        name: pxe_buildstream_manager
        tasks_from: gitlab_host.yml

    - name: Upload failed-node report to GitLab
      ansible.builtin.include_role:
        name: pxe_buildstream_manager
        tasks_from: upload_to_gitlab.yml
  rescue:
    - name: Report non-fatal BuildStream post-processing failure
      ansible.builtin.debug:
        msg: >-
          {{ pxe_boot_reporting_buildstream_failure_msg }}
          {{ ansible_failed_result | default('unknown') }}

- name: Fail if any nodes failed PXE boot or node-registration
  ansible.builtin.fail:
    msg: >-
      {{ pxe_boot_reporting_node_failure_msg }}
      PXE boot failures:
      {{ pxe_boot_failed_bmc_ips | default([]) | join(', ') or 'none' }}
      Node-registration failures:
      {{ node_registration_failed_bmc_ips | default([]) | join(', ') or 'none' }}
  when: >-
    (pxe_boot_failed_bmc_ips | default([]) | length > 0)
    or (node_registration_failed_bmc_ips | default([]) | length > 0)
