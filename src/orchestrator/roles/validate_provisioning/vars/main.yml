---
# Variables for validate_provisioning role
# Derive OpenCHAMI base URL from stable localhost facts (oim_node_name, domain_name)
# rather than cluster_name which may be overwritten by slurm_config/k8s_config roles.
openchami_base_url: "https://{{ hostvars['localhost']['oim_node_name'] }}.{{ hostvars['localhost']['domain_name'] }}:8443"
openchami_validate_certs: true
# Centralized failure messages
bss_boot_parameters_fail_msg: >-
  Provisioning is incomplete: {{ fg_missing_bss | length }} functional
  group(s) have no Boot Service configuration: {{ fg_missing_bss }}
smd_admin_interfaces_fail_msg: >-
  Provisioning is incomplete: {{ missing_smd_interfaces | length }}
  administrative MAC address(es) are missing from SMD EthernetInterfaces:
  {{ missing_smd_interfaces }}. CoreDHCP cannot assign their configured
  node IP addresses.
