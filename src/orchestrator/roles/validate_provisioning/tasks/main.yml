---
# validate_provisioning — Post-provisioning validation.
# Called after all provision_*.yml playbooks have completed.
# Verifies SMD state, boot-service params, metadata-service data, and generates reports.

- name: Load functional groups configuration
  ansible.builtin.include_vars:
    file: "{{ hostvars['localhost']['functional_groups_config_path'] }}"
    name: fg_config

- name: Load classification rules
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../../vars/functional_group_classification.yml"
    name: classification

- name: Query SMD for all registered components
  ansible.builtin.uri:
    url: "{{ openchami_base_url }}/hsm/v2/State/Components"
    method: GET
    status_code: 200
    validate_certs: "{{ openchami_validate_certs | default(true) }}"
    headers:
      Authorization: "Bearer {{ openchami_access_token }}"
  register: smd_components

# Build expected nodes from the PXE mapping file's XNAME column (not group
# names).  The previous code used fg_config 'group' attribute which contains
# GROUP_NAMEs (grp1, grp2) — comparing those against SMD xnames always
# produced mismatches.
- name: Build expected node list from mapping file xnames
  ansible.builtin.set_fact:
    expected_nodes: >-
      {{ hostvars['localhost']['read_mapping_file']['dict'] | dict2items
         | map(attribute='value.XNAME') | unique | list }}

- name: Build registered node list from SMD
  ansible.builtin.set_fact:
    registered_xnames: >-
      {{ smd_components.json.Components
         | selectattr('Type', 'defined')
         | selectattr('Type', 'equalto', 'Node')
         | map(attribute='ID') | list }}

- name: Identify nodes not registered in SMD
  ansible.builtin.set_fact:
    missing_nodes: "{{ expected_nodes | difference(registered_xnames) }}"

- name: Report missing nodes
  ansible.builtin.debug:
    msg: "WARNING: {{ missing_nodes | length }} expected nodes not found in SMD: {{ missing_nodes }}"
  when: missing_nodes | length > 0

- name: Fail if critical nodes are missing
  ansible.builtin.fail:
    msg: "{{ missing_nodes | length }} nodes are not registered in SMD. Provisioning incomplete."
  when:
    - missing_nodes | length > 0
    - strict_validation | default(false) | bool

# --- BSS boot parameter verification ---
- name: Query boot-service for all boot configurations
  ansible.builtin.uri:
    url: "{{ openchami_base_url }}/boot-service/bootconfigurations"
    method: GET
    status_code: 200
    validate_certs: "{{ openchami_validate_certs | default(true) }}"
    headers:
      Authorization: "Bearer {{ openchami_access_token }}"
  register: bss_boot_configs

- name: Build list of functional group names with boot configurations
  ansible.builtin.set_fact:
    bss_configured_groups: "{{ bss_boot_configs.json | map(attribute='metadata') | map(attribute='name') | list }}"

- name: Build expected functional group names
  ansible.builtin.set_fact:
    expected_fg_names: "{{ fg_config.functional_groups | map(attribute='name') | list }}"

- name: Identify functional groups without boot configurations
  ansible.builtin.set_fact:
    fg_missing_bss: "{{ expected_fg_names | difference(bss_configured_groups) }}"

- name: Report functional groups missing BSS boot parameters
  ansible.builtin.debug:
    msg: "WARNING: {{ fg_missing_bss | length }} functional groups have no BSS boot configuration: {{ fg_missing_bss }}"
  when: fg_missing_bss | length > 0

- name: Fail when functional groups are missing BSS boot parameters
  ansible.builtin.fail:
    msg: >-
      Provisioning is incomplete: {{ fg_missing_bss | length }} functional
      group(s) have no Boot Service configuration: {{ fg_missing_bss }}
  when: fg_missing_bss | length > 0

# --- Metadata-service (cloud-init) data verification ---
- name: Query metadata-service for all group configurations
  ansible.builtin.uri:
    url: "{{ openchami_base_url }}/metadata-service/groups"
    method: GET
    status_code: 200
    validate_certs: "{{ openchami_validate_certs | default(true) }}"
    headers:
      Authorization: "Bearer {{ openchami_access_token }}"
  register: ms_groups

- name: Build list of metadata-service configured group names
  ansible.builtin.set_fact:
    ms_configured_groups: "{{ ms_groups.json | map(attribute='metadata') | map(attribute='name') | list }}"

- name: Identify functional groups without metadata-service data
  ansible.builtin.set_fact:
    fg_missing_metadata: "{{ expected_fg_names | difference(ms_configured_groups) }}"

- name: Report functional groups missing metadata-service data
  ansible.builtin.debug:
    msg: "WARNING: {{ fg_missing_metadata | length }} functional groups have no metadata-service configuration: {{ fg_missing_metadata }}"
  when: fg_missing_metadata | length > 0

# --- Node hostname assignment verification ---
- name: Query SMD for Ethernet interfaces (hostname assignments)
  ansible.builtin.uri:
    url: "{{ openchami_base_url }}/hsm/v2/Inventory/EthernetInterfaces"
    method: GET
    status_code: 200
    validate_certs: "{{ openchami_validate_certs | default(true) }}"
    headers:
      Authorization: "Bearer {{ openchami_access_token }}"
  register: smd_ethernet

- name: Build expected and registered administrative MAC address lists
  ansible.builtin.set_fact:
    expected_admin_macs: >-
      {{ hostvars['localhost']['read_mapping_file']['dict'] | dict2items
         | map(attribute='value.ADMIN_MAC') | map('lower') | unique | list }}
    registered_interface_macs: >-
      {{ smd_ethernet.json | default([])
         | selectattr('MACAddress', 'defined')
         | map(attribute='MACAddress') | map('lower') | unique | list }}

- name: Identify administrative interfaces missing from SMD
  ansible.builtin.set_fact:
    missing_smd_interfaces: "{{ expected_admin_macs | difference(registered_interface_macs) }}"

- name: Fail when expected administrative interfaces are missing from SMD
  ansible.builtin.fail:
    msg: >-
      Provisioning is incomplete: {{ missing_smd_interfaces | length }}
      administrative MAC address(es) are missing from SMD EthernetInterfaces:
      {{ missing_smd_interfaces }}. CoreDHCP cannot assign their configured
      node IP addresses.
  when: missing_smd_interfaces | length > 0

- name: Build list of nodes with hostname assignments
  ansible.builtin.set_fact:
    nodes_with_hostnames: >-
      {{ (smd_ethernet.json | default([])) |
         selectattr('Description', 'defined') |
         selectattr('Description', 'ne', '') |
         map(attribute='ComponentID') | unique | list }}
  when: smd_ethernet.status | default(0) == 200

- name: Identify registered nodes without hostname assignments
  ansible.builtin.set_fact:
    nodes_missing_hostnames: "{{ registered_xnames | difference(nodes_with_hostnames | default([])) }}"
  when: smd_ethernet.status | default(0) == 200

- name: Report nodes without hostname assignments
  ansible.builtin.debug:
    msg: "WARNING: {{ nodes_missing_hostnames | length }} registered nodes have no hostname assignment: {{ nodes_missing_hostnames }}"
  when:
    - nodes_missing_hostnames is defined
    - nodes_missing_hostnames | length > 0

# --- Provisioning summary ---
- name: Generate provisioning summary
  ansible.builtin.set_fact:
    provisioning_summary:
      schema_version: "1.0"
      phase: provisioning
      run_id: "{{ ansible_date_time.epoch }}"
      overall_status: "{{ 'success' if missing_nodes | length == 0 else 'failed' }}"
      total_expected_nodes: "{{ expected_nodes | length }}"
      total_registered_nodes: "{{ registered_xnames | length }}"
      success_count: "{{ (expected_nodes | length) - (missing_nodes | length) }}"
      failure_count: "{{ missing_nodes | length }}"
      missing_nodes: "{{ missing_nodes }}"
      functional_groups_count: "{{ fg_config.functional_groups | length }}"
      fg_with_boot_config: "{{ bss_configured_groups | intersect(expected_fg_names) | length }}"
      fg_missing_boot_config: "{{ fg_missing_bss }}"
      fg_with_metadata: "{{ ms_configured_groups | intersect(expected_fg_names) | length }}"
      fg_missing_metadata: "{{ fg_missing_metadata }}"
      expected_admin_interfaces: "{{ expected_admin_macs | length }}"
      registered_admin_interfaces: "{{ expected_admin_macs | intersect(registered_interface_macs) | length }}"
      missing_admin_interfaces: "{{ missing_smd_interfaces }}"
      nodes_missing_hostnames: "{{ nodes_missing_hostnames | default([]) }}"
      inventory_source: "{{ hostvars['localhost']['pxe_mapping_file_path'] }}"
      timestamp: "{{ ansible_date_time.iso8601 }}"

- name: Display provisioning summary
  ansible.builtin.debug:
    var: provisioning_summary

# Write provisioning report only when called from provision flow (not standalone validate)
- name: Write provisioning report
  ansible.builtin.copy:
    content: "{{ provisioning_summary | to_nice_yaml }}"
    dest: "{{ orchestrator_output_dir }}/provisioning_report.yml"
    mode: "0644"
  when: ansible_run_tags | default([]) | intersect(['execute', 'provision']) | length > 0 or ansible_run_tags | length == 0

- name: Initialize per-node provisioning status
  ansible.builtin.set_fact:
    provisioning_nodes_status: []

# Initialize the canonical status contract from SMD registration. A subsequent
# PXE run retains this phase and adds its own phase-specific result.
- name: Compute per-node provisioning status from SMD
  ansible.builtin.set_fact:
    provisioning_nodes_status: >-
      {{ provisioning_nodes_status | default([]) +
         [{'xname': item,
           'admin_ip': _mapping_entry.ADMIN_IP | default(''),
           'bmc_ip': _mapping_entry.BMC_IP | default(''),
           'hostname': _mapping_entry.HOSTNAME | default(''),
           'service_tag': _mapping_entry.SERVICE_TAG | default(''),
           'status': _node_status,
           'failure_reason': _failure_reason,
           'failure_stage': ('provisioning' if _node_status == 'failed' else ''),
           'verification_state': 'not_requested',
           'verification_method': 'not_started',
           'detail': _failure_reason,
           'cloud_init': {},
           'provisioning': {
             'status': _node_status,
             'failure_reason': _failure_reason
           },
           'pxeboot': {
             'status': 'not_run',
             'failure_stage': '',
             'verification_state': 'not_requested',
             'verification_method': 'not_started',
             'detail': '',
             'cloud_init': {}
           }}] }}
  loop: "{{ expected_nodes }}"
  vars:
    _mapping_entry: >-
      {{ hostvars['localhost']['read_mapping_file']['dict'] | dict2items
         | selectattr('value.XNAME', 'equalto', item)
         | map(attribute='value') | first | default({}) }}
    _node_status: "{{ 'success' if item in registered_xnames else 'failed' }}"
    _failure_reason: "{{ '' if _node_status == 'success' else 'not registered in SMD' }}"

# Write orchestrator_status.yml only when called from provision flow (not standalone validate)
- name: Write orchestrator_status.yml (provisioning path)
  ansible.builtin.copy:
    content: "{{ orchestrator_status | to_nice_yaml }}"
    dest: "{{ orchestrator_output_dir }}/orchestrator_status.yml"
    mode: "0644"
  vars:
    orchestrator_status:
      schema_version: "1.0"
      run_id: "{{ ansible_date_time.epoch }}"
      overall_status: "{{ 'success' if missing_nodes | length == 0 else 'failed' }}"
      last_completed_phase: provisioning
      timestamp: "{{ ansible_date_time.iso8601 }}"
      total_nodes: "{{ expected_nodes | length }}"
      success_count: "{{ registered_xnames | intersect(expected_nodes) | length }}"
      failure_count: "{{ missing_nodes | length }}"
      verification_enabled: false
      unverified_count: 0
      custom_inventory: false
      inventory_source: "{{ hostvars['localhost']['pxe_mapping_file_path'] }}"
      nodes: "{{ provisioning_nodes_status | default([]) }}"
      phases:
        provisioning:
          status: "{{ 'success' if missing_nodes | length == 0 else 'failed' }}"
          total_nodes: "{{ expected_nodes | length }}"
          success_count: "{{ registered_xnames | intersect(expected_nodes) | length }}"
          failure_count: "{{ missing_nodes | length }}"
          timestamp: "{{ ansible_date_time.iso8601 }}"
          report: provisioning_report.yml
        pxeboot:
          status: not_run
          total_nodes: 0
          success_count: 0
          failure_count: 0
          unverified_count: 0
          timestamp: ""
          report: pxeboot_status.yml
      artifacts:
        provisioning_report: provisioning_report.yml
        pxeboot_status: pxeboot_status.yml
        failed_nodes: failed_nodes.json
  when: ansible_run_tags | default([]) | intersect(['execute', 'provision']) | length > 0 or ansible_run_tags | length == 0
