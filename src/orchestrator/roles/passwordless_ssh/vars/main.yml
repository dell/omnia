---
# vars/main.yml

# K8s functional group patterns (derived dynamically from functional_groups)
k8s_fg_pattern: '^service_kube_'
k8s_functional_groups: >-
  {{ hostvars['localhost']['functional_groups'] | default([])
     | map(attribute='name')
     | select('match', '^service_kube_')
     | list }}

# Slurm / login functional group patterns (derived dynamically from functional_groups)
slurm_fg_pattern: '^slurm_|^login_'
slurm_functional_groups: >-
  {{ hostvars['localhost']['functional_groups'] | default([])
     | map(attribute='name')
     | select('match', '^slurm_|^login_')
     | list }}

# Nodes.yaml group completeness: all FGs from the mapping must exist in nodes.yaml
# Derived dynamically from functional_groups rather than hardcoded lists.
omnia_required_groups_from_nodes_yaml: >-
  {{ hostvars['localhost']['functional_groups'] | default([])
     | map(attribute='name')
     | list }}

oim_ssh_config_path: "{{ ansible_user_dir | default('/root') }}/.ssh/config"
# Centralized failure messages
pxe_mapping_path_fail_msg: "pxe_mapping_file_path is not defined. Check orchestrator_config.yml."
pxe_mapping_invalid_host_value_fail_msg: >-
  PXE mapping has a HOSTNAME or ADMIN_IP that is not a
  valid hostname or IPv4 address. Values are written to the OIM SSH config and /etc/hosts,
  so they must not contain whitespace, newlines or shell metacharacters.

# Allowlists for CSV-derived values written to the OIM SSH config and /etc/hosts.
# \Z (not $) so a trailing newline is not accepted.
passwordless_ssh_hostname_regex: '^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?\Z'
passwordless_ssh_ipv4_regex: '^([0-9]{1,3}\.){3}[0-9]{1,3}\Z'

# Actionable error messages surfaced by rescue blocks protecting no_log tasks.
# Printed with no_log: false so operators get context instead of a generic
# "skipped due to no_log" message.
passwordless_ssh_read_csv_rescue_msg: |
  Failed to read the PXE mapping file in role 'passwordless_ssh'
  (tasks/build_host_lists.yml: "Read PXE mapping file").
  Context:
    - Mapping file (pxe_mapping_file_path): {{ pxe_mapping_file_path | default('<unset>') }}
  Likely causes:
    - The mapping file is missing, unreadable, or lacks a unique ADMIN_MAC column.
    - The CSV is malformed (inconsistent columns or bad header).
  Next steps:
    1. Confirm the file exists and is readable: ls -l "{{ pxe_mapping_file_path | default('<unset>') }}"
    2. Inspect the header and rows: head "{{ pxe_mapping_file_path | default('<unset>') }}"
    3. Ensure the CSV contains an ADMIN_MAC column with unique values.
    4. Re-run the passwordless_ssh stage once the mapping file is corrected.

passwordless_ssh_invalid_rows_rescue_msg: |
  Failed while scanning the PXE mapping for invalid HOSTNAME/ADMIN_IP values in
  role 'passwordless_ssh' (tasks/build_host_lists.yml: "Find PXE mapping rows
  with an invalid HOSTNAME or ADMIN_IP").
  Likely causes:
    - pxe_mapping_dict was not populated (the preceding CSV read failed).
    - A row is missing expected HOSTNAME/ADMIN_IP keys.
  Next steps:
    1. Confirm the PXE mapping CSV read succeeded earlier in this run.
    2. Verify every data row has HOSTNAME and ADMIN_IP columns.
    3. Re-run the passwordless_ssh stage once the mapping file is corrected.
