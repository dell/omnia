---
# generate_inventories — Query SMD and generate inventory files in one pass.
# Called from validate_provisioning.yml after all provision_*.yml playbooks.
# SMD is the single source of truth — query once, generate everything.
#
# Outputs:
#   - orchestrator_inventory.yml (all nodes)
#   - bmc_group_data.yml (all nodes)

- name: Load functional groups configuration
  ansible.builtin.include_vars:
    file: "{{ hostvars['localhost']['functional_groups_config_path'] }}"

- name: Load classification rules
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../../vars/functional_group_classification.yml"

# Inventory templates and output paths (from configure_ochami/vars/main.yml)
- name: Set inventory variables
  ansible.builtin.set_fact:
    ochami_template_dir: "{{ role_path }}/../configure_ochami/templates"
    orchestrator_output_dir: "{{ hostvars['localhost']['orchestrator_output_dir'] }}"
    file_permissions_644: "{{ hostvars['localhost']['file_permissions_644'] }}"
    dir_permissions_755: "{{ hostvars['localhost']['dir_permissions_755'] }}"

- name: Ensure orchestrator output directory exists on OIM
  ansible.builtin.file:
    path: "{{ orchestrator_output_dir }}"
    state: directory
    mode: "{{ dir_permissions_755 }}"

- name: Ensure playbook output directory exists on localhost
  ansible.builtin.file:
    path: "{{ playbook_dir }}/output"
    state: directory
    mode: "{{ dir_permissions_755 }}"
  delegate_to: localhost

- name: Prepare mapping nodes for inventory generation
  ansible.builtin.set_fact:
    mapping_nodes: "{{ hostvars['localhost']['read_mapping_file']['dict'] | dict2items }}"
    mapping_group_data: "{{ (lookup('file', hostvars['localhost']['functional_groups_config_path']) | from_yaml).groups }}"

# K8s deployment validation - kube_vip is only added when ALL conditions are met:
# 1. K8s functional groups (service_kube_*) are defined in PXE mapping file
# 2. high_availability_config.yml exists with valid kube_vip configuration
- name: Check if high_availability_config.yml exists
  ansible.builtin.stat:
    path: "{{ hostvars['localhost']['input_project_dir'] }}/high_availability_config.yml"
  register: ha_config_stat
  delegate_to: localhost

- name: Check if Service K8s functional groups exist in mapping
  ansible.builtin.set_fact:
    k8s_groups_in_mapping: >-
      {{
        (mapping_nodes | map(attribute='value.FUNCTIONAL_GROUP_NAME') | list)
        | select('match', '^service_kube_')
        | list
        | length > 0
      }}

- name: Load high_availability_config.yml to get kube_vip
  ansible.builtin.include_vars:
    file: "{{ hostvars['localhost']['input_project_dir'] }}/high_availability_config.yml"
    name: ha_config
  delegate_to: localhost
  when:
    - ha_config_stat.stat.exists | default(false)
    - k8s_groups_in_mapping | default(false)

- name: Set kube_vip fact
  ansible.builtin.set_fact:
    kube_vip: "{{ ha_config.service_k8s_cluster_ha[0].virtual_ip_address | default('') }}"
  when:
    - ha_config_stat.stat.exists | default(false)
    - k8s_groups_in_mapping | default(false)

- name: Generate BMC group data file
  ansible.builtin.template:
    src: "{{ ochami_template_dir }}/nodes/bmc_group_data.csv.j2"
    dest: "{{ orchestrator_output_dir }}/bmc_group_data.csv"
    mode: "{{ file_permissions_644 }}"
  vars:
    mapping_nodes_var: "{{ mapping_nodes }}"
    group_data: "{{ mapping_group_data }}"

- name: Copy BMC group data to localhost
  ansible.builtin.fetch:
    src: "{{ orchestrator_output_dir }}/bmc_group_data.csv"
    dest: "{{ orchestrator_output_dir }}/bmc_group_data.csv"
    flat: true

- name: Generate orchestrator inventory file
  ansible.builtin.template:
    src: "{{ ochami_template_dir }}/nodes/orchestrator_inventory.yaml.j2"
    dest: "{{ orchestrator_output_dir }}/orchestrator_inventory.yaml"
    mode: "{{ file_permissions_644 }}"
  vars:
    mapping_nodes_var: "{{ mapping_nodes }}"
    kube_vip: "{{ kube_vip | default('') }}"

- name: Copy orchestrator inventory to localhost
  ansible.builtin.fetch:
    src: "{{ orchestrator_output_dir }}/orchestrator_inventory.yaml"
    dest: "{{ orchestrator_output_dir }}/orchestrator_inventory.yaml"
    flat: true

- name: Inventory generation complete
  ansible.builtin.debug:
    msg: >-
      Generated inventories: orchestrator_inventory.yaml, bmc_group_data.csv
