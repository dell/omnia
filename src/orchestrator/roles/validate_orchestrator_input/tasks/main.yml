---
# validate_orchestrator_input — Orchestrator L1 schema and L2 logic validation.
#
# Validates:
#   - orchestrator_config.yml       (required)
#   - omnia_config.yml              (required; workload-aware L1/L2 checks)
#   - network_spec.yml              (required; cross-validated with mapping)
#   - resolved PXE mapping CSV      (structure and cross-file relationships)
#   - additional cloud-init YAML    (when configured)
#   - storage_config.yml            (when selected workloads reference storage)
#
# Uses the domain-specific validate_orchestrator_config module (lean, no
# dependency on the central input_validation framework).

- name: Display validation start
  ansible.builtin.debug:
    msg: "{{ orchestrator_validation_start_msg }}"

# Pre-check: ensure orchestrator_config.yml exists
- name: Check orchestrator_config.yml exists
  ansible.builtin.stat:
    path: "{{ input_dir }}/orchestrator_config.yml"
  register: validate_orchestrator_input_config_stat

- name: Fail if orchestrator_config.yml is missing
  ansible.builtin.fail:
    msg: "{{ orchestrator_config_missing_msg }}"
  when: not validate_orchestrator_input_config_stat.stat.exists

# Run the validate_orchestrator_config module (L1 + L2)
- name: Run orchestrator configuration validation
  validate_orchestrator_config:
    input_project_dir: "{{ input_dir }}"
    schema_dir: "{{ orchestrator_schema_dir }}"
    log_dir: "{{ hostvars['localhost']['omnia_data_path'] }}/log/core/playbooks"
  register: validate_orchestrator_input_result

# Validate hardware defaults for Slurm configuration
- name: Validate hardware defaults (global defaults)
  ansible.builtin.fail:
    msg: >-
      Hardware default validation failed (global defaults):
      {% if default_real_memory is defined and (default_real_memory | int) < 8192 %}
      - default_real_memory {{ default_real_memory }} is below minimum 8192 MB (8GB)
      {% elif default_real_memory is defined and (default_real_memory | int) > 8000000000 %}
      - default_real_memory {{ default_real_memory }} exceeds maximum 8000000000 MB (8TB)
      {% endif %}
      {% if default_corespersocket is defined and (default_corespersocket | int) < 1 %}
      - default_corespersocket {{ default_corespersocket }} is below minimum 1
      {% elif default_corespersocket is defined and (default_corespersocket | int) > 160 %}
      - default_corespersocket {{ default_corespersocket }} exceeds maximum 160
      {% endif %}
      {% if default_threadspercore is defined and (default_threadspercore | int) < 1 %}
      - default_threadspercore {{ default_threadspercore }} is below minimum 1
      {% elif default_threadspercore is defined and (default_threadspercore | int) > 2 %}
      - default_threadspercore {{ default_threadspercore }} exceeds maximum 2
      {% endif %}
      {% if default_sockets is defined and (default_sockets | int) < 1 %}
      - default_sockets {{ default_sockets }} is below minimum 1
      {% elif default_sockets is defined and (default_sockets | int) > 16 %}
      - default_sockets {{ default_sockets }} exceeds maximum 16
      {% endif %}
  when:
    - default_real_memory is defined or default_corespersocket is defined or default_threadspercore is defined or default_sockets is defined
    - (default_real_memory is defined and ((default_real_memory | int) < 8192 or (default_real_memory | int) > 8000000000)) or
      (default_corespersocket is defined and ((default_corespersocket | int) < 1 or (default_corespersocket | int) > 160)) or
      (default_threadspercore is defined and ((default_threadspercore | int) < 1 or (default_threadspercore | int) > 2)) or
      (default_sockets is defined and ((default_sockets | int) < 1 or (default_sockets | int) > 16))

# Report results
- name: Display validation log path
  ansible.builtin.debug:
    msg: "Validation log: {{ validate_orchestrator_input_result.log_file }}"

- name: Display valid files
  ansible.builtin.debug:
    msg: "Valid: {{ validate_orchestrator_input_result.valid_files }}"
  when: validate_orchestrator_input_result.valid_files | length > 0

- name: Display validation errors
  ansible.builtin.debug:
    msg: "{{ item }}"
  loop: "{{ validate_orchestrator_input_result.errors }}"
  when: validate_orchestrator_input_result.validation_failed

- name: Fail on validation errors
  ansible.builtin.fail:
    msg: >-
      {{ orchestrator_validation_fail_msg }} Errors:
      {{ validate_orchestrator_input_result.errors }}
  when: validate_orchestrator_input_result.validation_failed

- name: Validation passed
  ansible.builtin.debug:
    msg: "{{ orchestrator_validation_pass_msg }}"
  when: not validate_orchestrator_input_result.validation_failed

- name: Record successful input validation
  ansible.builtin.set_fact:
    _orchestrator_input_validated: true
  when: not validate_orchestrator_input_result.validation_failed
