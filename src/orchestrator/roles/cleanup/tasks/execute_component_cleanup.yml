---
# A component failure is rescued so remaining selected components still run.
# The canonical engine raises the aggregate failure after every component has
# been attempted.
- name: Clean {{ component_name }}
  block:
    - name: Execute cleanup for {{ component_name }}
      ansible.builtin.include_tasks: >-
        {{ role_path }}/components/{{ component_name }}/tasks/cleanup.yml

    - name: Record successful cleanup for {{ component_name }}
      ansible.builtin.set_fact:
        cleanup_results: >-
          {{ cleanup_results | combine({
               component_name: {'status': 'success', 'error': ''}
             }) }}
  rescue:
    - name: Record failed cleanup for {{ component_name }}
      vars:
        cleanup_error_message: >-
          {{ (ansible_failed_result | default({})).msg
             | default('Component cleanup task failed', true) }}
      ansible.builtin.set_fact:
        cleanup_results: >-
          {{ cleanup_results | combine({
               component_name: {
                 'status': 'failed',
                 'error': cleanup_error_message
               }
             }) }}
        cleanup_failures: >-
          {{ cleanup_failures + [{
               'component': component_name,
               'error': cleanup_error_message
             }] }}
