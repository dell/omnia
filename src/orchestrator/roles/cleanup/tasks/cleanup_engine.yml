---
# Canonical cleanup engine. Each component is attempted even if an earlier
# component fails. Failures are aggregated and raised after the final summary.
- name: Validate canonical cleanup inputs
  ansible.builtin.assert:
    that:
      - cleanup_components is defined
      - cleanup_execution_order is defined
      - cleanup_execution_order | length > 0
    fail_msg: "Invalid cleanup configuration or empty execution order"

- name: Initialize cleanup results
  ansible.builtin.set_fact:
    cleanup_results: {}
    cleanup_failures: []

- name: Execute cleanup for each component
  ansible.builtin.include_tasks: execute_component_cleanup.yml
  loop: "{{ cleanup_execution_order }}"
  loop_control:
    loop_var: component_name

- name: Display cleanup summary
  ansible.builtin.debug:
    msg: |-
      Cleanup Summary:
      ================
      Status: {{ 'SUCCESS' if cleanup_failures | length == 0 else 'PARTIAL' }}
      Components selected: {{ cleanup_execution_order | length }}
      Components passed: {{ cleanup_execution_order | length - cleanup_failures | length }}
      Components failed: {{ cleanup_failures | length }}
      {% for result_item in cleanup_results | dict2items %}
      - {{ result_item.key }}: {{ result_item.value.status | upper }}
      {% if result_item.value.error | default('') | length > 0 %}
        Error: {{ result_item.value.error }}
      {% endif %}
      {% endfor %}

- name: Fail when cleanup is incomplete
  ansible.builtin.fail:
    msg: |-
      Orchestrator cleanup completed with {{ cleanup_failures | length }} failed component(s):
      {% for failure in cleanup_failures %}
      - {{ failure.component }}: {{ failure.error }}
      {% endfor %}
  when: cleanup_failures | length > 0
