---
# Canonical cleanup engine. Each component is attempted even if an earlier
# component fails. Failures are aggregated and raised after the final summary.
- name: Validate canonical cleanup inputs
  ansible.builtin.assert:
    that:
      - cleanup_components is defined
      - cleanup_execution_order is defined
      - cleanup_execution_order | length > 0
    fail_msg: "{{ cleanup_config_fail_msg }}"

- name: Initialize cleanup results
  ansible.builtin.set_fact:
    cleanup_results: {}
    cleanup_failures: []

- name: Execute cleanup for each component
  ansible.builtin.include_tasks: execute_component_cleanup.yml
  loop: "{{ cleanup_execution_order }}"
  loop_control:
    loop_var: component_name

- name: Display cleanup summary
  ansible.builtin.debug:
    msg:
      status: >-
        {{ 'SUCCESS' if cleanup_failures | length == 0 else 'PARTIAL' }}
      components:
        selected: "{{ cleanup_execution_order | length }}"
        passed: >-
          {{ cleanup_execution_order | length - cleanup_failures | length }}
        failed: "{{ cleanup_failures | length }}"
      results: "{{ cleanup_results }}"

- name: Fail when cleanup is incomplete
  ansible.builtin.fail:
    msg: "{{ cleanup_incomplete_fail_msg }}"
  when: cleanup_failures | length > 0

- name: Display K8s manual cleanup warning if K8s was selected
  ansible.builtin.debug:
    msg:
      - "================================================================================"
      - "IMPORTANT: K8s NFS share data was NOT automatically cleaned up"
      - "================================================================================"
      - "Automated cleanup of K8s NFS share data is disabled to prevent failures when"
      - "the cluster is running (files locked by active pods/containers)."
      - ""
      - "To manually clean up the K8s NFS share:"
      - "1. Stop the Kubernetes cluster (or ensure all pods are terminated)"
      - "2. Manually delete the data from the NFS share path configured in storage_config.yml"
      - "3. The storage mount has been unmounted and fstab entries removed by this cleanup"
      - ""
      - "Reference: src/orchestrator/playbooks/cleanup/README.md"
      - "================================================================================"
  when:
    - cleanup_execution_order is defined
    - '"k8s" in cleanup_execution_order'

- name: Display manual cleanup warning for Slurm NFS share
  ansible.builtin.debug:
    msg:
      - "================================================================================"
      - "IMPORTANT: Slurm NFS share data was NOT automatically cleaned up"
      - "================================================================================"
      - "Automated cleanup of Slurm NFS share data is disabled to prevent failures when"
      - "Slurm daemons are running (files locked by active processes/jobs)."
      - ""
      - "To manually clean up the Slurm NFS share:"
      - "1. Stop the Slurm daemons (slurmctld, slurmd) and ensure all jobs are terminated"
      - "2. Manually delete the data from the NFS share path configured in storage_config.yml"
      - "3. The storage mount has been unmounted and fstab entries removed by this cleanup"
      - ""
      - "Reference: src/orchestrator/playbooks/cleanup/README.md"
      - "================================================================================"
  when:
    - cleanup_execution_order is defined
    - '"slurm" in cleanup_execution_order'
