---
# Cleanup Role Variables
# These variables are used throughout the cleanup framework

# Configuration paths
cleanup_config_path: "{{ role_path }}/config/default_cleanup.yml"
cleanup_schema_path: "{{ role_path }}/config/cleanup_schema.json"

# Component paths
components_base_path: "{{ role_path }}/components"
component_tasks_path: "{{ components_base_path }}/{{ component_name }}/tasks"
component_vars_path: "{{ components_base_path }}/{{ component_name }}/vars"

# State management
state_file_path: "/var/lib/omnia/cleanup/cleanup_state.json"
component_state_path: "/var/lib/omnia/cleanup/{{ component_name }}.state"

# Logging
log_file_path: "{{ hostvars['localhost']['omnia_data_path'] }}/orchestrator/log/cleanup/cleanup.log"
component_log_path: "{{ hostvars['localhost']['omnia_data_path'] }}/orchestrator/log/cleanup/{{ component_name }}.log"

# Backup
backup_path: "/var/lib/omnia/cleanup/backups"
component_backup_path: "{{ backup_path }}/{{ component_name }}"

# Project paths
input_project_dir: "{{ hostvars['localhost']['input_project_dir'] }}"
omnia_config_path: "{{ input_project_dir }}/omnia_config.yml"
storage_config_path: "{{ input_project_dir }}/storage_config.yml"

# Storage paths
omnia_shared_path: "{{ hostvars['localhost']['omnia_data_path'] }}"
orchestrator_output_dir: "{{ hostvars['localhost']['orchestrator_output_dir'] }}"

# OpenCHAMI paths
openchami_config_dir: "/etc/openchami"
openchami_share_dir: "{{ omnia_shared_path }}/openchami"
openchami_log_dir: "{{ omnia_shared_path }}/orchestrator/log/openchami"
openchami_work_dir: "{{ openchami_share_dir }}/workdir"
ochami_dir: "/etc/ochami"

# OpenLDAP paths
auth_container_name: "omnia_auth"
auth_base_dir: "{{ omnia_shared_path }}/auth"
auth_quadlet_file: "/etc/containers/systemd/omnia_auth.container"

# Slurm paths
slurm_config_dir: "/etc/slurm"
slurm_log_dir: "/var/log/slurm"

# K8s paths
k8s_config_dir: "/etc/kubernetes"
k8s_manifest_dir: "{{ omnia_shared_path }}/k8s/manifests"

# Orchestrator artifacts
functional_groups_config: "{{ omnia_shared_path }}/.data/functional_groups_config.yml"
orchestrator_state_file: "{{ orchestrator_output_dir }}/orchestrator_state.yml"
upgrade_lock_file: "{{ omnia_shared_path }}/.data/upgrade_in_progress.lock"
