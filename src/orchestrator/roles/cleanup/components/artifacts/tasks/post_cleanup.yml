---
# Artifacts Post-Cleanup Task
# Verifies cleanup success and updates component state

- name: Set role path
  ansible.builtin.set_fact:
    role_path: "{{ playbook_dir | dirname | dirname }}/roles/cleanup"

- name: Load Artifacts component configuration
  ansible.builtin.include_vars:
    file: "{{ role_path }}/components/artifacts/vars/component_spec.yml"

- name: Display Artifacts post-cleanup validation
  ansible.builtin.debug:
    msg: "Starting Artifacts post-cleanup validation"

- name: Verify artifact paths are removed
  ansible.builtin.stat:
    path: "{{ item }}"
  register: artifact_paths_check
  failed_when: false
  loop: "{{ artifacts_config.cleanup_paths }}"
  when: item not in artifacts_config.preserve_paths

- name: Check path verification results
  ansible.builtin.set_fact:
    paths_removed: "{{ artifact_paths_check.results | selectattr('stat.exists', 'equalto', false) | list | length == artifact_paths_check.results | length }}"
  when: artifact_paths_check.results is defined

- name: Display post-cleanup verification results
  ansible.builtin.debug:
    msg: |
      Artifacts Post-Cleanup Verification Results:
      ============================================
      Paths Removed: {{ paths_removed | default(true) | bool }}

      Overall Status: {{ 'SUCCESS' if (paths_removed | default(true)) else 'PARTIAL' }}"

- name: Update component state
  ansible.builtin.set_fact:
    component_verification:
      paths_removed: "{{ paths_removed | default(true) }}"
      overall_status: "{{ 'success' if (paths_removed | default(true)) else 'partial' }}"

- name: Generate cleanup report
  ansible.builtin.debug:
    msg: "Artifacts cleanup verification completed with status: {{ component_verification.overall_status }}"
