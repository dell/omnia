---
# Artifacts Pre-Cleanup Task
# Validates prerequisites and creates cleanup checkpoint

- name: Set role path
  ansible.builtin.set_fact:
    role_path: "{{ playbook_dir | dirname | dirname }}/roles/cleanup"

- name: Load Artifacts component configuration
  ansible.builtin.include_vars:
    file: "{{ role_path }}/components/artifacts/vars/component_spec.yml"

- name: Display Artifacts pre-cleanup information
  ansible.builtin.debug:
    msg: |
      Artifacts Pre-Cleanup Validation
      ================================
      Component: {{ component_spec.name }}
      Version: {{ component_spec.version }}
      Criticality: {{ component_metadata.criticality }}
      Estimated Duration: {{ component_metadata.estimated_duration }}
      User Impact: {{ component_metadata.user_impact }}

- name: Check artifact paths exist
  ansible.builtin.stat:
    path: "{{ item }}"
  register: artifact_paths_stat
  failed_when: false
  loop: "{{ artifacts_config.cleanup_paths }}"

- name: Display artifact path information
  ansible.builtin.debug:
    msg: "Artifact paths found: {{ artifact_paths_stat.results | selectattr('stat.exists') | list | length }}/{{ artifact_paths_stat.results | length }}"

- name: Create cleanup checkpoint
  ansible.builtin.copy:
    content: |
      checkpoint_time: {{ ansible_date_time.iso8601 }}
      component: artifacts
      paths_found: {{ artifact_paths_stat.results | selectattr('stat.exists') | list | length }}
    dest: "{{ component_state_path }}"
    mode: '0600'
  when: not global_settings.dry_run | default(false) | bool

- name: Log pre-cleanup state
  ansible.builtin.debug:
    msg: "Artifacts pre-cleanup checkpoint created at {{ component_state_path }}"