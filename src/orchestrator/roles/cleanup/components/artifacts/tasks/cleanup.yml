---
# Meaningful Artifacts Cleanup
# Cleans what orchestrator deployed, not what it needs as input

- name: Set role path
  tags: artifacts
  ansible.builtin.set_fact:
    role_path: "{{ playbook_dir | dirname | dirname }}/roles/cleanup"

- name: Load Artifacts component configuration
  tags: artifacts
  ansible.builtin.include_vars:
    file: "{{ role_path }}/components/artifacts/vars/component_spec.yml"

- name: Display Artifacts cleanup start
  tags: artifacts
  ansible.builtin.debug:
    msg: "Starting meaningful Artifacts cleanup (cleaning what orchestrator deployed)"

- name: Clean orchestrator deployment outputs
  tags: artifacts
  ansible.builtin.file:
    path: "/opt/omnia/output/project_default/orchestrator"
    state: absent
  failed_when: false

- name: Clean cleanup framework logs
  tags: artifacts
  ansible.builtin.file:
    path: "/opt/omnia/log/cleanup"
    state: absent
  failed_when: false

- name: Clean cleanup framework state
  tags: artifacts
  ansible.builtin.file:
    path: "/var/lib/omnia/cleanup"
    state: absent
  failed_when: false

- name: Display Artifacts cleanup completion
  tags: artifacts
  ansible.builtin.debug:
    msg: |
      Artifacts cleanup operations completed:
      - Orchestrator deployment outputs: cleaned
      - Cleanup framework logs: cleaned
      - Cleanup framework state: cleaned
      - Functional groups config: preserved (input to orchestrator, not output)
      - Upgrade lock: preserved (coordination file, not deployment output)
