---
# Meaningful Artifacts Component Configuration

# Artifacts-specific configuration
artifacts_config:
  description: "Cleans what orchestrator deployed, not what it needs as input"
  deployment_outputs:
    - "/opt/omnia/output/project_default/orchestrator"
  cleanup_framework_artifacts:
    - "/opt/omnia/log/cleanup"
    - "/var/lib/omnia/cleanup"
  preserve_inputs:
    - "/opt/omnia/.data/functional_groups_config.yml"
    - "/opt/omnia/.data/upgrade_in_progress.lock"