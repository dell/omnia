---
# Credentials Cleanup
# Opt-in only - requires explicit --tags credentials

- name: Set role path
  ansible.builtin.set_fact:
    role_path: "{{ playbook_dir | dirname | dirname }}/roles/cleanup"
  tags: cleanup_credentials

- name: Load Credentials component configuration
  ansible.builtin.include_vars:
    file: "{{ role_path }}/components/credentials/vars/component_spec.yml"
  tags: cleanup_credentials

- name: Display Credentials cleanup start
  ansible.builtin.debug:
    msg: "Starting Credentials cleanup operations (opt-in - requires --tags cleanup_credentials)"
  tags: cleanup_credentials

- name: Remove credential files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  failed_when: false
  loop: "{{ credentials_config.credential_files }}"
  tags: cleanup_credentials

- name: Display Credentials cleanup completion
  ansible.builtin.debug:
    msg: "Credentials cleanup operations completed - credential files removed"
  tags: cleanup_credentials
