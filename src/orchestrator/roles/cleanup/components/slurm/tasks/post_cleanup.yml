---
# Slurm Post-Cleanup Task
# Verifies cleanup success and updates component state

- name: Set role path
  ansible.builtin.set_fact:
    role_path: "{{ playbook_dir | dirname | dirname }}/roles/cleanup"

- name: Load Slurm component configuration
  ansible.builtin.include_vars:
    file: "{{ role_path }}/components/slurm/vars/component_spec.yml"

- name: Display Slurm post-cleanup validation
  ansible.builtin.debug:
    msg: "Starting Slurm post-cleanup validation"

- name: Verify Slurm services are stopped
  ansible.builtin.systemd:
    name: "{{ item }}"
  register: service_check
  failed_when: false
  loop: "{{ slurm_config.services }}"

- name: Check service verification results
  ansible.builtin.set_fact:
    services_stopped: "{{ service_check.results | selectattr('status.ActiveState', 'equalto', 'inactive') | list | length == service_check.results | length }}"

- name: Verify Slurm configuration is removed
  ansible.builtin.stat:
    path: "{{ slurm_config.config_dir }}"
  register: config_check
  failed_when: false

- name: Check config verification results
  ansible.builtin.set_fact:
    config_removed: "{{ not config_check.stat.exists }}"

- name: Verify NFS directories are cleaned
  ansible.builtin.stat:
    path: "{{ item }}"
  register: nfs_dir_check
  failed_when: false
  loop: "{{ all_cleanup_paths | default([]) }}"
  when: all_cleanup_paths is defined

- name: Check NFS directory verification results
  ansible.builtin.set_fact:
    nfs_cleaned: "{{ nfs_dir_check.results | selectattr('stat.exists', 'equalto', false) | list | length == nfs_dir_check.results | length }}"
  when: nfs_dir_check.results is defined

- name: Verify NFS mounts are unmounted
  ansible.builtin.shell: |
    set -o pipefail
    mount | grep "{{ item.mount_point }}"
  register: mount_check
  failed_when: false
  changed_when: false
  loop: "{{ unique_storage_mounts | default([]) }}"
  when: unique_storage_mounts is defined

- name: Check mount verification results
  ansible.builtin.set_fact:
    mounts_unmounted: "{{ mount_check.results | selectattr('rc', 'equalto', 1) | list | length == mount_check.results | length }}"
  when: mount_check.results is defined

- name: Display post-cleanup verification results
  ansible.builtin.debug:
    msg: |
      Slurm Post-Cleanup Verification Results:
      ==========================================
      Services Stopped: {{ services_stopped | bool }}
      Config Removed: {{ config_removed | bool }}
      NFS Cleaned: {{ nfs_cleaned | default(true) | bool }}
      Mounts Unmounted: {{ mounts_unmounted | default(true) | bool }}
      
      Overall Status: {{ 'SUCCESS' if (services_stopped and config_removed) else 'PARTIAL' }}

- name: Update component state
  ansible.builtin.set_fact:
    component_verification:
      services_stopped: "{{ services_stopped }}"
      config_removed: "{{ config_removed }}"
      nfs_cleaned: "{{ nfs_cleaned | default(true) }}"
      mounts_unmounted: "{{ mounts_unmounted | default(true) }}"
      overall_status: "{{ 'success' if (services_stopped and config_removed) else 'partial' }}"

- name: Generate cleanup report
  ansible.builtin.debug:
    msg: "Slurm cleanup verification completed with status: {{ component_verification.overall_status }}"