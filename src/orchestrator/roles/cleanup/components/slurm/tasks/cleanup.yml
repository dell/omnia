---
# Slurm Cleanup for OIM Node
# Focuses on cleaning up Slurm-related NFS data only

- name: Load Slurm component configuration
  ansible.builtin.include_vars:
    file: "{{ role_path }}/components/slurm/vars/component_spec.yml"
  tags: slurm

- name: Display Slurm cleanup start
  ansible.builtin.debug:
    msg: "Starting Slurm cleanup operations (OIM node - NFS data only)"
  tags: slurm

- name: Load Omnia configuration for Slurm storage reference
  ansible.builtin.include_vars:
    file: "{{ hostvars['localhost']['omnia_project_input_dir'] }}/omnia_config.yml"
    name: cleanup_slurm_omnia_config
  tags: slurm

- name: Load storage configuration for Slurm cleanup
  ansible.builtin.include_vars:
    file: "{{ hostvars['localhost']['omnia_project_input_dir'] }}/storage_config.yml"
    name: cleanup_slurm_storage_config
  tags: slurm

- name: Resolve Slurm storage name from Omnia configuration
  ansible.builtin.set_fact:
    cleanup_slurm_storage_name: >-
      {{ (cleanup_slurm_omnia_config.slurm_cluster | default([])
          | first | default({})).nfs_storage_name | default('') }}
  tags: slurm

- name: Select configured Slurm storage entry
  ansible.builtin.set_fact:
    cleanup_slurm_storage_matches: >-
      {{ cleanup_slurm_storage_config.mounts | default([])
         | selectattr('name', 'equalto', cleanup_slurm_storage_name) | list }}
  tags: slurm

- name: Validate Slurm cleanup storage contract
  ansible.builtin.assert:
    that:
      - cleanup_slurm_storage_name | length > 0
      - cleanup_slurm_storage_matches | length == 1
      - cleanup_slurm_storage_matches[0].mount_point | default('') | length > 0
      - cleanup_slurm_storage_matches[0].mount_point is match('^/')
      - cleanup_slurm_storage_matches[0].source | default('') | length > 0
    fail_msg: >-
      Slurm cleanup cannot safely resolve slurm_cluster[0].nfs_storage_name
      '{{ cleanup_slurm_storage_name }}' to exactly one complete mount entry in
      storage_config.yml.
  tags: slurm

- name: Set Slurm cleanup storage paths
  ansible.builtin.set_fact:
    cleanup_slurm_mount_point: "{{ cleanup_slurm_storage_matches[0].mount_point }}"
    cleanup_slurm_nfs_source: "{{ cleanup_slurm_storage_matches[0].source }}"
  tags: slurm

# Shared data is removed wherever the shared filesystem is reachable locally,
# without ever needing SSH access to the NFS server:
#   - via the mount point, when the share is mounted (writes travel over NFS,
#     so this works for an external NFS server)
#   - directly in the export path, when this OIM is itself the NFS server
#     (also covers re-runs, after an earlier cleanup already unmounted it)
- name: Check for local NFS exports
  ansible.builtin.stat:
    path: /etc/exports
  register: cleanup_slurm_exports_file
  tags: slurm

- name: Read local NFS exports
  ansible.builtin.slurp:
    src: /etc/exports
  register: cleanup_slurm_exports_raw
  when: cleanup_slurm_exports_file.stat.exists
  tags: slurm

- name: Determine how the Slurm shared filesystem is reachable
  ansible.builtin.set_fact:
    cleanup_slurm_share_mounted: >-
      {{ (cleanup_slurm_nfs_source ~ ' ' ~ cleanup_slurm_mount_point)
         in (lookup('file', '/proc/mounts').splitlines()
         | map('regex_replace', '^(\S+)\s+(\S+)\s+.*$', '\1 \2')
         | list) }}
    cleanup_slurm_nfs_server: >-
      {{ cleanup_slurm_nfs_source.split(':')[0]
         if ':' in cleanup_slurm_nfs_source else '' }}
    cleanup_slurm_export_path: >-
      {{ cleanup_slurm_nfs_source.split(':')[1]
         if ':' in cleanup_slurm_nfs_source else '' }}
  tags: slurm

- name: Read local OIM addresses for Slurm export detection
  ansible.builtin.command:
    cmd: hostname --all-ip-addresses
  register: cleanup_slurm_local_addresses
  changed_when: false
  tags: slurm

- name: Determine whether this OIM exports the Slurm share
  ansible.builtin.set_fact:
    cleanup_slurm_export_is_local: >-
      {{ cleanup_slurm_nfs_server in
         ((['localhost', '127.0.0.1', '::1',
            inventory_hostname | default(''), ansible_host | default(''),
            host_name | default(''), oim_node_name | default(''),
            ansible_hostname | default(''), ansible_fqdn | default('')]
           + (cleanup_slurm_local_addresses.stdout | default('')).split())
          | reject('equalto', '') | unique | list)
      and cleanup_slurm_export_path | length > 0
      and cleanup_slurm_export_path in ((cleanup_slurm_exports_raw.content | default('') | b64decode).splitlines()
      | reject('match', '^\s*(#|$)') | map('regex_replace', '^\s*(\S+).*$', '\1') | list) }}
  tags: slurm

- name: Select where Slurm shared data will be removed from
  ansible.builtin.set_fact:
    cleanup_slurm_clean_base: >-
      {{ cleanup_slurm_mount_point if cleanup_slurm_share_mounted | bool
      else cleanup_slurm_export_path if cleanup_slurm_export_is_local | bool
      else '' }}
  tags: slurm

- name: Report how Slurm shared data will be reached
  ansible.builtin.debug:
    msg: >-
      Removing Slurm shared data from '{{ cleanup_slurm_clean_base }}'
      ({{ 'via mount point' if cleanup_slurm_share_mounted | bool else 'local NFS export on this OIM' }}).
  when:
    - cleanup_slurm_approved | default(true) | bool
    - slurm_config.cleanup_nfs_server | default(false) | bool
    - cleanup_slurm_clean_base | length > 0
  tags: slurm

- name: Warn that Slurm shared data is not reachable
  ansible.builtin.debug:
    msg: >-
      Slurm data on the NFS server was NOT removed: '{{ cleanup_slurm_mount_point }}' is not
      mounted and this host does not export '{{ cleanup_slurm_export_path }}'. Mount the share
      and re-run, or remove the data on the NFS server directly.
  when:
    - cleanup_slurm_approved | default(true) | bool
    - slurm_config.cleanup_nfs_server | default(false) | bool
    - cleanup_slurm_clean_base | length == 0
  tags: slurm

- name: Fail when requested Slurm shared data cleanup is incomplete
  ansible.builtin.fail:
    msg: >-
      Slurm shared data cleanup was requested, but neither the mount point
      '{{ cleanup_slurm_mount_point }}' nor local export '{{ cleanup_slurm_export_path }}'
      is available. Mount the share and rerun cleanup, or remove its data
      directly on the NFS server.
  when:
    - cleanup_slurm_approved | default(true) | bool
    - slurm_config.cleanup_nfs_server | default(false) | bool
    - cleanup_slurm_clean_base | length == 0
  tags: slurm

# Stop Slurm services on the control node before removing shared data.
# If the controller is reachable and slurmctld is running, the subsequent
# provision will try to reconfigure it against a now-empty NFS share and
# fail.  Stopping the service here ensures a clean re-provision.
- name: Resolve Slurm nodes YAML path
  ansible.builtin.set_fact:
    cleanup_slurm_nodes_yaml: >-
      {{ omnia_shared_path }}/openchami/workdir/nodes/nodes_slurm.yaml
  tags: slurm

- name: Check if Slurm nodes YAML exists
  ansible.builtin.stat:
    path: "{{ cleanup_slurm_nodes_yaml }}"
  register: cleanup_slurm_nodes_file
  tags: slurm

- name: Stop slurmctld on reachable control nodes
  when:
    - cleanup_slurm_approved | default(true) | bool
    - cleanup_slurm_nodes_file.stat.exists
  tags: slurm
  block:
    - name: Read Slurm nodes YAML
      ansible.builtin.slurp:
        src: "{{ cleanup_slurm_nodes_yaml }}"
      register: cleanup_slurm_nodes_raw

    - name: Parse Slurm nodes YAML
      ansible.builtin.set_fact:
        cleanup_slurm_node_data: "{{ cleanup_slurm_nodes_raw.content | b64decode | from_yaml }}"

    - name: Build group-to-nodes mapping
      ansible.builtin.set_fact:
        cleanup_slurm_grouped: >-
          {{ cleanup_slurm_node_data.nodes
             | items2dict(key_name='name', value_name='group') | dict2items
             | groupby('value') }}

    - name: Identify Slurm control node names
      ansible.builtin.set_fact:
        cleanup_slurm_ctld_names: >-
          {{ cleanup_slurm_grouped
             | selectattr('0', 'match', '^slurm_control_node_')
             | map(attribute='1') | list | flatten
             | map(attribute='key') | list }}

    - name: Build hostname-to-IP mapping
      ansible.builtin.set_fact:
        cleanup_slurm_ip_map: >-
          {{ dict(cleanup_slurm_node_data.nodes
             | map(attribute='name')
             | zip(cleanup_slurm_node_data.nodes
                   | map(attribute='interfaces')
                   | map('first')
                   | map(attribute='ip_addrs')
                   | map('first')
                   | map(attribute='ip_addr'))) }}

    - name: Resolve Slurm control node IPs
      ansible.builtin.set_fact:
        cleanup_slurm_ctld_ips: >-
          {{ cleanup_slurm_ctld_names
             | map('extract', cleanup_slurm_ip_map)
             | select('string') | list }}

    - name: Check SSH reachability of Slurm control nodes
      ansible.builtin.wait_for:
        host: "{{ ctld_ip }}"
        port: 22
        timeout: 10
        state: started
      delegate_to: localhost
      loop: "{{ cleanup_slurm_ctld_ips }}"
      loop_control:
        loop_var: ctld_ip
      register: cleanup_slurm_ctld_ssh
      ignore_errors: true

    - name: Stop slurmctld and slurmdbd on reachable control nodes
      ansible.builtin.shell: >-
        systemctl stop slurmctld slurmdbd 2>/dev/null || true
      delegate_to: "{{ item.ctld_ip }}"
      loop: "{{ cleanup_slurm_ctld_ssh.results }}"
      when: item is success
      ignore_errors: true
      changed_when: true

- name: Remove Slurm data from the shared filesystem (before unmounting)
  ansible.builtin.file:
    path: "{{ cleanup_slurm_clean_base }}/{{ item }}"
    state: absent
  loop: "{{ slurm_config.cleanup_directories | difference(slurm_config.preserve_directories) }}"
  when:
    - cleanup_slurm_approved | default(true) | bool
    - slurm_config.cleanup_nfs_server | default(false) | bool
    - cleanup_slurm_clean_base | length > 0
  tags: slurm

# storage_mounts is a declared dependency of this component, so it always runs
# here. trigger_component tells it to unmount only the Slurm-related mounts.
- name: Unmount Slurm-related storage mounts
  ansible.builtin.include_tasks: "{{ role_path }}/components/storage_mounts/tasks/cleanup.yml"
  vars:
    trigger_component: "slurm"
  tags: slurm

# Removes the now-empty local mount point stubs. Has no effect on NFS server
# data, which was already handled above while the share was still mounted.
- name: Remove local Slurm mount point directories (after unmounting)
  ansible.builtin.file:
    path: "{{ cleanup_slurm_mount_point }}/{{ item }}"
    state: absent
  loop: "{{ slurm_config.cleanup_directories | difference(slurm_config.preserve_directories) }}"
  when: cleanup_slurm_approved | default(true) | bool
  tags: slurm

- name: Display Slurm cleanup completion
  ansible.builtin.debug:
    msg: >-
      Slurm cleanup operations completed (shared data
      {{ 'deleted' if cleanup_slurm_approved | default(true) | bool else 'preserved' }};
      storage unmounted and fstab entries removed)
  tags: slurm
