---
# Slurm Cleanup for OIM Node
# Focuses on cleaning up Slurm-related NFS data only

- name: Set role path
  ansible.builtin.set_fact:
    role_path: "{{ playbook_dir | dirname | dirname }}/roles/cleanup"
  tags: slurm

- name: Load Slurm component configuration
  ansible.builtin.include_vars:
    file: "{{ role_path }}/components/slurm/vars/component_spec.yml"
  tags: slurm

- name: Display Slurm cleanup start
  ansible.builtin.debug:
    msg: "Starting Slurm cleanup operations (OIM node - NFS data only)"
  tags: slurm

- name: Load storage configuration to get Slurm mount point
  ansible.builtin.include_vars:
    file: "{{ hostvars['localhost']['omnia_project_input_dir'] }}/storage_config.yml"
  failed_when: false
  tags: slurm

- name: Get Slurm mount point from storage config
  ansible.builtin.set_fact:
    slurm_mount_point: "{{ (mounts | selectattr('name', 'equalto', 'nfs_slurm') | first).mount_point | default('/share_omnia', true) }}"
  when: mounts is defined
  tags: slurm

- name: Set default Slurm mount point if not found in config
  ansible.builtin.set_fact:
    slurm_mount_point: "/share_omnia"
  when: slurm_mount_point is not defined
  tags: slurm

# Shared data is removed wherever the shared filesystem is reachable locally,
# without ever needing SSH access to the NFS server:
#   - via the mount point, when the share is mounted (writes travel over NFS,
#     so this works for an external NFS server)
#   - directly in the export path, when this OIM is itself the NFS server
#     (also covers re-runs, after an earlier cleanup already unmounted it)
- name: Read local NFS exports (absent when this OIM is not an NFS server)
  ansible.builtin.slurp:
    src: /etc/exports
  register: slurm_exports_raw
  failed_when: false
  tags: slurm

- name: Resolve the Slurm NFS source from storage config
  ansible.builtin.set_fact:
    slurm_nfs_source: >-
      {{ mounts | default([]) | selectattr('name', 'equalto', 'nfs_slurm')
      | map(attribute='source') | list | first | default('', true) }}
  tags: slurm

- name: Determine how the Slurm shared filesystem is reachable
  ansible.builtin.set_fact:
    slurm_share_mounted: >-
      {{ slurm_mount_point in (lookup('file', '/proc/mounts').splitlines()
      | map('regex_replace', '^\S+\s+(\S+)\s+.*$', '\1') | list) }}
    slurm_export_path: "{{ slurm_nfs_source.split(':')[1] if ':' in slurm_nfs_source else '' }}"
  tags: slurm

- name: Determine whether this OIM exports the Slurm share
  ansible.builtin.set_fact:
    slurm_export_is_local: >-
      {{ slurm_export_path | length > 0
      and slurm_export_path in ((slurm_exports_raw.content | default('') | b64decode).splitlines()
      | reject('match', '^\s*(#|$)') | map('regex_replace', '^\s*(\S+).*$', '\1') | list) }}
  tags: slurm

- name: Select where Slurm shared data will be removed from
  ansible.builtin.set_fact:
    slurm_clean_base: >-
      {{ slurm_mount_point if slurm_share_mounted | bool
      else slurm_export_path if slurm_export_is_local | bool
      else '' }}
  tags: slurm

- name: Report how Slurm shared data will be reached
  ansible.builtin.debug:
    msg: >-
      Removing Slurm shared data from '{{ slurm_clean_base }}'
      ({{ 'via mount point' if slurm_share_mounted | bool else 'local NFS export on this OIM' }}).
  when:
    - slurm_config.cleanup_nfs_server | default(false) | bool
    - slurm_clean_base | length > 0
  tags: slurm

- name: Warn that Slurm shared data is not reachable
  ansible.builtin.debug:
    msg: >-
      Slurm data on the NFS server was NOT removed: '{{ slurm_mount_point }}' is not
      mounted and this host does not export '{{ slurm_export_path }}'. Mount the share
      and re-run, or remove the data on the NFS server directly.
  when:
    - slurm_config.cleanup_nfs_server | default(false) | bool
    - slurm_clean_base | length == 0
  tags: slurm

- name: Remove Slurm data from the shared filesystem (before unmounting)
  ansible.builtin.file:
    path: "{{ slurm_clean_base }}/{{ item }}"
    state: absent
  loop: "{{ slurm_config.cleanup_directories | difference(slurm_config.preserve_directories) }}"
  when:
    - slurm_config.cleanup_nfs_server | default(false) | bool
    - slurm_clean_base | length > 0
  tags: slurm

# storage_mounts is a declared dependency of this component, so it always runs
# here. trigger_component tells it to unmount only the Slurm-related mounts.
- name: Unmount Slurm-related storage mounts
  ansible.builtin.include_tasks: "{{ role_path }}/components/storage_mounts/tasks/cleanup.yml"
  vars:
    trigger_component: "slurm"
  tags: slurm

# Removes the now-empty local mount point stubs. Has no effect on NFS server
# data, which was already handled above while the share was still mounted.
- name: Remove local Slurm mount point directories (after unmounting)
  ansible.builtin.file:
    path: "{{ slurm_mount_point }}/{{ item }}"
    state: absent
  loop: "{{ slurm_config.cleanup_directories | difference(slurm_config.preserve_directories) }}"
  failed_when: false
  tags: slurm

- name: Display Slurm cleanup completion
  ansible.builtin.debug:
    msg: "Slurm cleanup operations completed (OIM node - NFS data cleaned)"
  tags: slurm
