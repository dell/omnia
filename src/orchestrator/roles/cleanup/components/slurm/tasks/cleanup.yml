---
# Slurm Cleanup for OIM Node
# Focuses on cleaning up Slurm-related NFS data only

- name: Set role path
  ansible.builtin.set_fact:
    role_path: "{{ playbook_dir | dirname | dirname }}/roles/cleanup"
  tags: slurm

- name: Load Slurm component configuration
  ansible.builtin.include_vars:
    file: "{{ role_path }}/components/slurm/vars/component_spec.yml"
  tags: slurm

- name: Display Slurm cleanup start
  ansible.builtin.debug:
    msg: "Starting Slurm cleanup operations (OIM node - NFS data only)"
  tags: slurm

- name: Load storage configuration to get Slurm mount point
  ansible.builtin.include_vars:
    file: "{{ hostvars['localhost']['omnia_project_input_dir'] }}/storage_config.yml"
  failed_when: false
  tags: slurm

- name: Get Slurm mount point from storage config
  ansible.builtin.set_fact:
    slurm_mount_point: "{{ (mounts | selectattr('name', 'equalto', 'nfs_slurm') | first).mount_point | default('/share_omnia', true) }}"
  when: mounts is defined
  tags: slurm

- name: Set default Slurm mount point if not found in config
  ansible.builtin.set_fact:
    slurm_mount_point: "/share_omnia"
  when: slurm_mount_point is not defined
  tags: slurm

- name: Cleanup NFS server data (optional - requires cleanup_nfs_server set to true)
  when:
    - slurm_config.cleanup_nfs_server | default(false) | bool
    - mounts is defined
  block:
    - name: Get NFS server IP and export path from storage config
      ansible.builtin.set_fact:
        nfs_server_ip: "{{ (mounts | selectattr('name', 'equalto', 'nfs_slurm') | first).source.split(':')[0] | default('') }}"
        nfs_export_path: "{{ (mounts | selectattr('name', 'equalto', 'nfs_slurm') | first).source.split(':')[1] | default('') }}"

    - name: Debug NFS server info
      ansible.builtin.debug:
        msg: "NFS Server: {{ nfs_server_ip }}, Export: {{ nfs_export_path }}"

    - name: Cleanup NFS server data (before unmounting)
      ansible.builtin.shell: |
        set -o pipefail
        for dir in {{ slurm_config.cleanup_directories | difference(slurm_config.preserve_directories) | join(' ') }}; do
          rm -rf {{ nfs_export_path }}/$dir
        done
      delegate_to: "{{ nfs_server_ip }}"
      become: true
      failed_when: false
      when:
        - nfs_server_ip is defined
        - nfs_server_ip | length > 0
        - nfs_export_path is defined
        - nfs_export_path | length > 0

    - name: Display NFS server cleanup completion
      ansible.builtin.debug:
        msg: "NFS server data cleaned on {{ nfs_server_ip }}:{{ nfs_export_path }}"
  tags: slurm

- name: Auto-cleanup Slurm-related mounts when triggered by Slurm
  ansible.builtin.include_tasks: "{{ role_path }}/components/storage_mounts/tasks/cleanup.yml"
  when: trigger_component is defined and trigger_component == 'slurm'
  vars:
    trigger_component: "slurm"
  tags: slurm

- name: Clean Slurm NFS mount points (after unmounting)
  ansible.builtin.file:
    path: "{{ slurm_mount_point }}/{{ item }}"
    state: absent
  failed_when: false
  loop: "{{ slurm_config.cleanup_directories | difference(slurm_config.preserve_directories) }}"
  tags: slurm

- name: Display Slurm cleanup completion
  ansible.builtin.debug:
    msg: "Slurm cleanup operations completed (OIM node - NFS data cleaned)"
  tags: slurm
