---
# OpenLDAP Cleanup Task
# Performs the actual OpenLDAP cleanup operations

- name: Load OpenLDAP component configuration
  ansible.builtin.include_vars:
    file: "{{ role_path }}/components/openldap/vars/component_spec.yml"
  tags: openldap

- name: Display OpenLDAP cleanup start
  ansible.builtin.debug:
    msg: "Starting OpenLDAP cleanup operations"
  tags: openldap

- name: Gather service state for OpenLDAP cleanup
  ansible.builtin.service_facts:
  tags: openldap

- name: Stop OpenLDAP service
  tags: openldap
  block:
    - name: Stop OpenLDAP service
      ansible.builtin.systemd:
        name: "{{ openldap_config.service_name | default('openldap') }}"
        state: stopped
        enabled: false
      when:
        - "'stop_service' in openldap_config.cleanup_operations"
        - >-
          (openldap_config.service_name | default('openldap')) + '.service'
          in ansible_facts.services
      tags: openldap

- name: Check whether Podman is available for OpenLDAP cleanup
  ansible.builtin.command: podman --version
  register: cleanup_openldap_podman_check
  check_mode: false
  changed_when: false
  failed_when: false
  tags: openldap

- name: Check whether the OpenLDAP container exists
  ansible.builtin.command: >-
    podman container exists
    {{ openldap_config.container_name | default('omnia_auth') }}
  register: cleanup_openldap_container_check
  check_mode: false
  changed_when: false
  failed_when: cleanup_openldap_container_check.rc not in [0, 1]
  when:
    - "'remove_container' in openldap_config.cleanup_operations"
    - cleanup_openldap_podman_check.rc == 0
  tags: openldap

- name: Remove OpenLDAP container
  tags: openldap
  block:
    - name: Remove OpenLDAP container
      ansible.builtin.command: podman rm -f -i {{ openldap_config.container_name | default('omnia_auth') }}
      register: cleanup_openldap_container_removal
      changed_when: true
      when:
        - "'remove_container' in openldap_config.cleanup_operations"
        - cleanup_openldap_podman_check.rc == 0
        - cleanup_openldap_container_check.rc == 0
      tags: openldap

- name: Remove OpenLDAP Quadlet unit
  tags: openldap
  block:
    - name: Remove OpenLDAP Quadlet unit
      ansible.builtin.file:
        path: "{{ openldap_config.quadlet_file | default('/etc/containers/systemd/omnia_auth.container') }}"
        state: absent
      when: "'remove_quadlet' in openldap_config.cleanup_operations"
      tags: openldap

- name: Reload systemd after Quadlet removal
  tags: openldap
  block:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
      when: "'reload_systemd' in openldap_config.cleanup_operations"
      tags: openldap

- name: Remove OpenLDAP data and configuration
  tags: openldap
  block:
    - name: Remove OpenLDAP data directory
      ansible.builtin.file:
        path: "{{ openldap_config.base_dir }}"
        state: absent
      when: "'remove_data' in openldap_config.cleanup_operations"
      tags: openldap

- name: Display OpenLDAP cleanup completion
  ansible.builtin.debug:
    msg: |
      OpenLDAP cleanup operations completed:
      - Service stopped: {{ 'stop_service' in openldap_config.cleanup_operations }}
      - Container removed: {{ 'remove_container' in openldap_config.cleanup_operations }}
      - Quadlet removed: {{ 'remove_quadlet' in openldap_config.cleanup_operations }}
      - Systemd reloaded: {{ 'reload_systemd' in openldap_config.cleanup_operations }}
      - Data removed: {{ 'remove_data' in openldap_config.cleanup_operations }}
  tags: openldap
