---
# Storage Mounts Pre-Cleanup Task
# Validates prerequisites and creates cleanup checkpoint

- name: Set role path
  ansible.builtin.set_fact:
    role_path: "{{ playbook_dir | dirname | dirname }}/roles/cleanup"

- name: Load Storage Mounts component configuration
  ansible.builtin.include_vars:
    file: "{{ role_path }}/components/storage_mounts/vars/component_spec.yml"

- name: Display Storage Mounts pre-cleanup information
  ansible.builtin.debug:
    msg: |
      Storage Mounts Pre-Cleanup Validation
      =====================================
      Component: {{ component_spec.name }}
      Version: {{ component_spec.version }}
      Criticality: {{ component_metadata.criticality }}
      Estimated Duration: {{ component_metadata.estimated_duration }}
      User Impact: {{ component_metadata.user_impact }}

- name: Read storage configuration
  ansible.builtin.include_vars:
    file: "{{ input_project_dir }}/storage_config.yml"
  register: storage_config_loaded
  failed_when: false

- name: Check if storage mounts exist
  ansible.builtin.shell: |
    set -o pipefail
    mount | grep -E "nfs|nfs4" | wc -l
  register: nfs_mounts_count
  failed_when: false
  changed_when: false

- name: Display NFS mount information
  ansible.builtin.debug:
    msg: "NFS mounts found: {{ nfs_mounts_count.stdout | default('0') }}"

- name: Create cleanup checkpoint
  ansible.builtin.copy:
    content: |
      checkpoint_time: {{ ansible_date_time.iso8601 }}
      component: storage_mounts
      nfs_mounts_count: {{ nfs_mounts_count.stdout | default('0') }}
    dest: "{{ component_state_path }}"
    mode: '0600'
  when: not global_settings.dry_run | default(false) | bool

- name: Log pre-cleanup state
  ansible.builtin.debug:
    msg: "Storage Mounts pre-cleanup checkpoint created at {{ component_state_path }}"
