---
# Storage Mounts Post-Cleanup Task
# Verifies cleanup success and updates component state

- name: Set role path
  ansible.builtin.set_fact:
    role_path: "{{ playbook_dir | dirname | dirname }}/roles/cleanup"

- name: Load Storage Mounts component configuration
  ansible.builtin.include_vars:
    file: "{{ role_path }}/components/storage_mounts/vars/component_spec.yml"

- name: Display Storage Mounts post-cleanup validation
  ansible.builtin.debug:
    msg: "Starting Storage Mounts post-cleanup validation"

- name: Verify NFS mounts are unmounted
  ansible.builtin.shell: |
    set -o pipefail
    mount | grep -E "nfs|nfs4" | wc -l
  register: remaining_nfs_mounts
  failed_when: false
  changed_when: false

- name: Check mount verification results
  ansible.builtin.set_fact:
    mounts_unmounted: "{{ remaining_nfs_mounts.stdout | int == 0 }}"

- name: Display post-cleanup verification results
  ansible.builtin.debug:
    msg: |
      Storage Mounts Post-Cleanup Verification Results:
      =================================================
      NFS Mounts Unmounted: {{ mounts_unmounted | bool }}
      Remaining NFS Mounts: {{ remaining_nfs_mounts.stdout | default('0') }}
      
      Overall Status: {{ 'SUCCESS' if mounts_unmounted else 'PARTIAL' }}"

- name: Update component state
  ansible.builtin.set_fact:
    component_verification:
      mounts_unmounted: "{{ mounts_unmounted }}"
      remaining_mounts: "{{ remaining_nfs_mounts.stdout | default('0') }}"
      overall_status: "{{ 'success' if mounts_unmounted else 'partial' }}"

- name: Generate cleanup report
  ansible.builtin.debug:
    msg: "Storage Mounts cleanup verification completed with status: {{ component_verification.overall_status }}"