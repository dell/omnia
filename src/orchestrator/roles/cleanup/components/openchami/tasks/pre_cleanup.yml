---
# Simple OpenCHAMI Pre-Cleanup

- name: Set role path
  ansible.builtin.set_fact:
    role_path: "{{ playbook_dir | dirname | dirname }}/roles/cleanup"

- name: Load OpenCHAMI component configuration
  ansible.builtin.include_vars:
    file: "{{ role_path }}/components/openchami/vars/component_spec.yml"

- name: Set OpenCHAMI config directory
  ansible.builtin.set_fact:
    openchami_config_dir: "{{ openchami_config.config_dir | default('/etc/openchami') }}"

- name: Check if OpenCHAMI is deployed
  ansible.builtin.stat:
    path: "{{ openchami_config_dir }}"
  register: openchami_deployed
  failed_when: false

- name: Check OpenCHAMI service status (even if config is missing)
  ansible.builtin.systemd:
    name: "{{ item }}"
  register: openchami_services
  failed_when: false
  loop: "{{ openchami_config.services }}"

- name: Display OpenCHAMI service status
  ansible.builtin.debug:
    msg: "Service {{ item.item }} status: {{ item.status.ActiveState }}"
  loop: "{{ openchami_services.results }}"