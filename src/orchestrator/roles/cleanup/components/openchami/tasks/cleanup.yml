---
# Simple OpenCHAMI Cleanup

- name: Set role path
  ansible.builtin.set_fact:
    role_path: "{{ playbook_dir | dirname | dirname }}/roles/cleanup"
  tags: openchami

- name: Load OpenCHAMI component configuration
  ansible.builtin.include_vars:
    file: "{{ role_path }}/components/openchami/vars/component_spec.yml"
  tags: openchami

- name: Display OpenCHAMI cleanup start
  ansible.builtin.debug:
    msg: "Starting OpenCHAMI cleanup operations"
  tags: openchami

- name: Stop OpenCHAMI services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
  failed_when: false
  loop: "{{ openchami_config.services }}"
  tags: openchami

- name: Disable OpenCHAMI services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
  failed_when: false
  loop: "{{ openchami_config.services }}"
  tags: openchami

- name: Wait for services to stop
  ansible.builtin.pause:
    seconds: 5
  tags: openchami

- name: Remove OpenCHAMI containers
  ansible.builtin.command:
    cmd: podman rm -f {{ item }}
  failed_when: false
  loop: "{{ openchami_config.containers }}"
  tags: openchami

- name: Remove OpenCHAMI pods
  ansible.builtin.command:
    cmd: podman pod rm -f {{ item }}
  failed_when: false
  loop: "{{ openchami_config.pods }}"
  tags: openchami

- name: Remove OpenCHAMI config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  failed_when: false
  loop: "{{ openchami_config.config_dirs }}"
  tags: openchami

- name: Remove OpenCHAMI workdir
  ansible.builtin.file:
    path: "{{ openchami_config.work_dir | default('/opt/omnia/openchami/workdir') }}"
    state: absent
  failed_when: false
  tags: openchami

- name: Remove OpenCHAMI log directory
  ansible.builtin.file:
    path: "{{ openchami_config.log_dir | default('/opt/omnia/log/openchami') }}"
    state: absent
  failed_when: false
  tags: openchami

- name: Unlock resolv.conf
  ansible.builtin.file:
    path: /etc/resolv.conf
    attributes: "-i chattr"
  failed_when: false
  tags: openchami

- name: Restore NetworkManager-managed resolv.conf
  ansible.builtin.command:
    cmd: nmcli dev reload && nmcli con up "System eth0"
  failed_when: false
  tags: openchami

- name: Remove generated inventories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  failed_when: false
  loop: "{{ openchami_config.inventory_dirs | default(['/opt/omnia/openchami/inventory']) }}"
  tags: openchami

- name: Display OpenCHAMI cleanup completion
  ansible.builtin.debug:
    msg: "OpenCHAMI cleanup operations completed"
  tags: openchami