---
# Simple OpenCHAMI Post-Cleanup

- name: Set role path
  ansible.builtin.set_fact:
    role_path: "{{ playbook_dir | dirname | dirname }}/roles/cleanup"

- name: Load OpenCHAMI component configuration
  ansible.builtin.include_vars:
    file: "{{ role_path }}/components/openchami/vars/component_spec.yml"

- name: Display OpenCHAMI post-cleanup validation
  ansible.builtin.debug:
    msg: "Starting OpenCHAMI post-cleanup validation"

- name: Verify OpenCHAMI services are stopped
  ansible.builtin.systemd:
    name: "{{ item }}"
  register: service_check
  failed_when: false
  loop: "{{ openchami_config.services }}"

- name: Verify OpenCHAMI directories are removed
  ansible.builtin.stat:
    path: "{{ item }}"
  register: dir_check
  failed_when: false
  loop: "{{ openchami_config.config_dirs + [openchami_config.work_dir, openchami_config.log_dir] }}"

- name: Display post-cleanup verification results
  ansible.builtin.debug:
    msg: "OpenCHAMI post-cleanup validation completed"
