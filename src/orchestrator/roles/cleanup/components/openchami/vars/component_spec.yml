---
# Simple OpenCHAMI Component Configuration

# OpenCHAMI-specific configuration
openchami_config:
  config_dir: "/etc/openchami"
  services:
    - "openchami.target"
  container_label: "io.openchami"
  containers:
    - "openchami"
  pods:
    - "openchami-pod"
  config_dirs:
    - "/etc/openchami"
    - "/etc/ochami"
  workdir: "/opt/omnia/openchami/workdir"
  log_dir: "/opt/omnia/log/openchami"
  inventory_dirs:
    - "/opt/omnia/openchami/inventory"
  output_dir: "/opt/omnia/output/project_default/orchestrator"