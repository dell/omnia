---
# Base Component Specification
# All cleanup components must follow this interface specification

component_spec:
  name: "base_component"
  version: "1.0.0"
  description: "Base interface for all cleanup components"

  # Component interface - all components must implement these tasks
  interface:
    pre_cleanup: "tasks/pre_cleanup.yml"
    cleanup: "tasks/cleanup.yml"
    post_cleanup: "tasks/post_cleanup.yml"
    rollback: "tasks/rollback.yml"

  # Validation interface - optional but recommended
  validation:
    pre_cleanup: "validation/pre_cleanup.yml"
    post_cleanup: "validation/post_cleanup.yml"
    health_check: "validation/health_check.yml"

  # State management
  state_management:
    supports_state: true
    state_file: "/var/lib/omnia/cleanup/{{ component_name }}.state"
    checkpoint_before_cleanup: true
    supports_rollback: true

  # Error handling
  error_handling:
    continue_on_error: false
    retry_on_failure: false
    max_retries: 3
    retry_delay: 5

  # Logging
  logging:
    log_file: "{{ omnia_data_path }}/orchestrator/log/cleanup/{{ component_name }}.log"
    log_level: "INFO"
    log_format: "detailed"

# Component metadata (to be overridden by specific components)
component_metadata:
  category: "base"
  criticality: "low"
  estimated_duration: "1m"
  user_impact: "none"
  system_impact: "none"
