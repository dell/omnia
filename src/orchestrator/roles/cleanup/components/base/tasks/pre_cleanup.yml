---
# Base Pre-Cleanup Task
# This is the interface that all components must implement
# Specific components should override this with their pre-cleanup logic

- name: Base pre-cleanup validation
  ansible.builtin.debug:
    msg: "Base pre-cleanup validation for {{ component_name }}"

- name: Check component prerequisites
  ansible.builtin.debug:
    msg: "Checking prerequisites for {{ component_name }}"

- name: Create cleanup checkpoint
  ansible.builtin.debug:
    msg: "Creating cleanup checkpoint for {{ component_name }}"

- name: Log pre-cleanup state
  ansible.builtin.debug:
    msg: "Logging pre-cleanup state for {{ component_name }}"
