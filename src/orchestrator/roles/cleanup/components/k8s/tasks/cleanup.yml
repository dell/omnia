---
# K8s Cleanup for OIM Node
# Focuses on cleaning up K8s-related NFS data only

- name: Load K8s component configuration
  ansible.builtin.include_vars:
    file: "{{ role_path }}/components/k8s/vars/component_spec.yml"
  tags: k8s

- name: Display K8s cleanup start
  ansible.builtin.debug:
    msg: "Starting K8s cleanup operations (OIM node - cleaning K8s NFS data)"
  tags: k8s

- name: Load Omnia configuration for K8s storage reference
  ansible.builtin.include_vars:
    file: "{{ hostvars['localhost']['omnia_project_input_dir'] }}/omnia_config.yml"
    name: cleanup_k8s_omnia_config
  tags: k8s

- name: Load storage configuration for K8s cleanup
  ansible.builtin.include_vars:
    file: "{{ hostvars['localhost']['omnia_project_input_dir'] }}/storage_config.yml"
    name: cleanup_k8s_storage_config
  tags: k8s

- name: Resolve K8s storage name from Omnia configuration
  ansible.builtin.set_fact:
    cleanup_k8s_storage_name: >-
      {{ (cleanup_k8s_omnia_config.service_k8s_cluster | default([])
          | first | default({})).nfs_storage_name | default('') }}
  tags: k8s

- name: Select configured K8s storage entry
  ansible.builtin.set_fact:
    cleanup_k8s_storage_matches: >-
      {{ cleanup_k8s_storage_config.mounts | default([])
         | selectattr('name', 'equalto', cleanup_k8s_storage_name) | list }}
  tags: k8s

- name: Validate K8s cleanup storage contract
  ansible.builtin.assert:
    that:
      - cleanup_k8s_storage_name | length > 0
      - cleanup_k8s_storage_matches | length == 1
      - cleanup_k8s_storage_matches[0].mount_point | default('') | length > 0
      - cleanup_k8s_storage_matches[0].mount_point is match('^/')
      - cleanup_k8s_storage_matches[0].source | default('') | length > 0
    fail_msg: >-
      K8s cleanup cannot safely resolve service_k8s_cluster[0].nfs_storage_name
      '{{ cleanup_k8s_storage_name }}' to exactly one complete mount entry in
      storage_config.yml.
  tags: k8s

- name: Set K8s cleanup storage paths
  ansible.builtin.set_fact:
    cleanup_k8s_mount_point: "{{ cleanup_k8s_storage_matches[0].mount_point }}"
    cleanup_k8s_nfs_source: "{{ cleanup_k8s_storage_matches[0].source }}"
  tags: k8s

# Shared data is removed wherever the shared filesystem is reachable locally,
# without ever needing SSH access to the NFS server:
#   - via the mount point, when the share is mounted (writes travel over NFS,
#     so this works for an external NFS server)
#   - directly in the export path, when this OIM is itself the NFS server
#     (also covers re-runs, after an earlier cleanup already unmounted it)
- name: Check for local NFS exports
  ansible.builtin.stat:
    path: /etc/exports
  register: cleanup_k8s_exports_file
  tags: k8s

- name: Read local NFS exports
  ansible.builtin.slurp:
    src: /etc/exports
  register: cleanup_k8s_exports_raw
  when: cleanup_k8s_exports_file.stat.exists
  tags: k8s

- name: Determine how the K8s shared filesystem is reachable
  ansible.builtin.set_fact:
    cleanup_k8s_share_mounted: >-
      {{ cleanup_k8s_mount_point in (lookup('file', '/proc/mounts').splitlines()
      | map('regex_replace', '^\S+\s+(\S+)\s+.*$', '\1') | list) }}
    cleanup_k8s_export_path: >-
      {{ cleanup_k8s_nfs_source.split(':')[1]
         if ':' in cleanup_k8s_nfs_source else '' }}
  tags: k8s

- name: Determine whether this OIM exports the K8s share
  ansible.builtin.set_fact:
    cleanup_k8s_export_is_local: >-
      {{ cleanup_k8s_export_path | length > 0
      and cleanup_k8s_export_path in ((cleanup_k8s_exports_raw.content | default('') | b64decode).splitlines()
      | reject('match', '^\s*(#|$)') | map('regex_replace', '^\s*(\S+).*$', '\1') | list) }}
  tags: k8s

- name: Select where K8s shared data will be removed from
  ansible.builtin.set_fact:
    cleanup_k8s_clean_base: >-
      {{ cleanup_k8s_mount_point if cleanup_k8s_share_mounted | bool
      else cleanup_k8s_export_path if cleanup_k8s_export_is_local | bool
      else '' }}
  tags: k8s

- name: Report how K8s shared data will be reached
  ansible.builtin.debug:
    msg: >-
      Removing K8s shared data from '{{ cleanup_k8s_clean_base }}'
      ({{ 'via mount point' if cleanup_k8s_share_mounted | bool else 'local NFS export on this OIM' }}).
  when:
    - k8s_config.cleanup_nfs_server | default(false) | bool
    - cleanup_k8s_clean_base | length > 0
  tags: k8s

- name: Warn that K8s shared data is not reachable
  ansible.builtin.debug:
    msg: >-
      K8s data on the NFS server was NOT removed: '{{ cleanup_k8s_mount_point }}' is not
      mounted and this host does not export '{{ cleanup_k8s_export_path }}'. Mount the share
      and re-run, or remove the data on the NFS server directly.
  when:
    - k8s_config.cleanup_nfs_server | default(false) | bool
    - cleanup_k8s_clean_base | length == 0
  tags: k8s

- name: Fail when requested K8s shared data cleanup is incomplete
  ansible.builtin.fail:
    msg: >-
      Kubernetes shared data cleanup was requested, but neither the mount
      point '{{ cleanup_k8s_mount_point }}' nor local export '{{ cleanup_k8s_export_path }}'
      is available. Mount the share and rerun cleanup, or remove its data
      directly on the NFS server.
  when:
    - k8s_config.cleanup_nfs_server | default(false) | bool
    - cleanup_k8s_clean_base | length == 0
  tags: k8s

- name: Remove K8s data from the shared filesystem (before unmounting)
  ansible.builtin.file:
    path: "{{ cleanup_k8s_clean_base }}/{{ item }}"
    state: absent
  loop: "{{ k8s_config.cleanup_directories }}"
  when:
    - k8s_config.cleanup_nfs_server | default(false) | bool
    - cleanup_k8s_clean_base | length > 0
  tags: k8s

# storage_mounts is a declared dependency of this component, so it always runs
# here. trigger_component tells it to unmount only the K8s-related mounts.
- name: Unmount K8s-related storage mounts
  ansible.builtin.include_tasks: "{{ role_path }}/components/storage_mounts/tasks/cleanup.yml"
  vars:
    trigger_component: "k8s"
  tags: k8s

# Removes the now-empty local mount point stubs. Has no effect on NFS server
# data, which was already handled above while the share was still mounted.
- name: Remove local K8s mount point directories (after unmounting)
  ansible.builtin.file:
    path: "{{ cleanup_k8s_mount_point }}/{{ item }}"
    state: absent
  loop: "{{ k8s_config.cleanup_directories }}"
  when: k8s_config.nfs_cleanup | default(false) | bool
  tags: k8s

- name: Display K8s cleanup completion
  ansible.builtin.debug:
    msg: "K8s cleanup operations completed (OIM node - NFS data cleaned)"
  tags: k8s
