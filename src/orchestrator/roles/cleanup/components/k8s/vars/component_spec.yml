---
# Simple K8s Component Configuration for OIM Node

# K8s-specific configuration
k8s_config:
  # NFS cleanup configuration
  nfs_cleanup: true
  unmount_mounts: true
  cleanup_nfs_server: true
  cleanup_node_ips: false

  # Never allow a configuration error to turn cleanup into a system-root wipe.
  protected_cleanup_paths:
    - "/"
    - "/bin"
    - "/boot"
    - "/dev"
    - "/etc"
    - "/home"
    - "/lib"
    - "/lib64"
    - "/opt"
    - "/proc"
    - "/root"
    - "/run"
    - "/sbin"
    - "/srv"
    - "/sys"
    - "/tmp"
    - "/usr"
    - "/var"

  # Dependencies - components that must run before this
  dependencies:
    - "storage_mounts"
