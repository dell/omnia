---
- name: Resolve metadata topology role inputs
  ansible.builtin.set_fact:
    _slurm_metadata_nodes_yaml: "{{ slurm_metadata_nodes_yaml }}"
    _slurm_metadata_target_category: "{{ slurm_metadata_target_category }}"

- name: Resolve node topology for metadata rendering
  ansible.builtin.include_role:
    name: orchestrator_node_topology
  vars:
    nodes_yaml: "{{ _slurm_metadata_nodes_yaml }}"
    target_category: "{{ _slurm_metadata_target_category }}"

- name: Publish default Slurm metadata configuration
  ansible.builtin.set_fact:
    apply_config: "{{ apply_config | default(__default_config) }}"
    slurm_conf_dict: "{{ slurm_conf_dict | default(__default_config.slurm) }}"
