# Orchestrator Domain Entrypoint
# ==============================
# Thin wrapper that imports focused sub-playbooks.
# Each sub-playbook can also be run independently.
#
# Workflow:
#   1. prepare_orchestrator    — setup, validate, credentials, FG gen, persist state
#   2. deploy_openchami        — S3 access + OpenCHAMI container deployment
#   3. validate_openchami      — gate: verify OpenCHAMI readiness
#   4. provision_preamble      — SSH keys + auth (runs once)
#   5. provision_kubernetes    — K8s FGs + bolt-ons
#   6. provision_slurm         — Slurm+Login FGs + bolt-ons
#   7. provision_os            — OS-only FGs (minimal)
#   8. provision_custom        — User-defined FGs (catch-all)
#   9. validate_provisioning   — inventory generation + post-provision checks
#
# Inputs:  /opt/omnia/input/project_default/orchestrator/
# Outputs: /opt/omnia/output/project_default/orchestrator/
#
# Usage:
#   ansible-playbook orchestrator.yml

- name: Prepare orchestrator
  ansible.builtin.import_playbook: playbooks/prepare_orchestrator.yml

- name: Deploy OpenCHAMI
  ansible.builtin.import_playbook: playbooks/deploy_openchami.yml

- name: Validate OpenCHAMI readiness
  ansible.builtin.import_playbook: playbooks/validate_openchami.yml

- name: Provision preamble (SSH + auth)
  ansible.builtin.import_playbook: playbooks/provision_preamble.yml

- name: Provision Kubernetes cluster
  ansible.builtin.import_playbook: playbooks/provision_kubernetes.yml

- name: Provision Slurm cluster
  ansible.builtin.import_playbook: playbooks/provision_slurm.yml

- name: Provision OS-only nodes
  ansible.builtin.import_playbook: playbooks/provision_os.yml

- name: Provision custom nodes
  ansible.builtin.import_playbook: playbooks/provision_custom.yml

- name: Validate provisioning
  ansible.builtin.import_playbook: playbooks/validate_provisioning.yml
