---
# Unit test for DCGM support flag derivation
# This test verifies that dcgm_support is correctly derived from orchestrator_config.dcgm_enabled
# Usage: ansible-playbook tests/test_dcgm_support.yml

- name: Test DCGM support flag derivation
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Test case 1 - dcgm_enabled true
      ansible.builtin.set_fact:
        _orch_config:
          dcgm_enabled: true

    - name: Verify dcgm_support when dcgm_enabled is true
      ansible.builtin.assert:
        that:
          - "{{ _orch_config.dcgm_enabled | default(true) | bool == true }}"
        fail_msg: "dcgm_support should be true when dcgm_enabled is true"
        success_msg: "Test case 1 passed: dcgm_support correctly set to true"

    - name: Test case 2 - dcgm_enabled false
      ansible.builtin.set_fact:
        _orch_config:
          dcgm_enabled: false

    - name: Verify dcgm_support when dcgm_enabled is false
      ansible.builtin.assert:
        that:
          - "{{ _orch_config.dcgm_enabled | default(true) | bool == false }}"
        fail_msg: "dcgm_support should be false when dcgm_enabled is false"
        success_msg: "Test case 2 passed: dcgm_support correctly set to false"

    - name: Test case 3 - dcgm_enabled not set (default to true)
      ansible.builtin.set_fact:
        _orch_config: {}

    - name: Verify dcgm_support defaults to true when not set
      ansible.builtin.assert:
        that:
          - "{{ _orch_config.dcgm_enabled | default(true) | bool == true }}"
        fail_msg: "dcgm_support should default to true when dcgm_enabled is not set"
        success_msg: "Test case 3 passed: dcgm_support correctly defaults to true"

    - name: Test case 4 - orchestrator_config missing (default to true)
      ansible.builtin.set_fact:
        orchestrator_config: {}

    - name: Verify dcgm_support defaults to true when orchestrator_config is missing
      ansible.builtin.assert:
        that:
          - "{{ orchestrator_config.dcgm_enabled | default(true) | bool == true }}"
        fail_msg: "dcgm_support should default to true when orchestrator_config is missing"
        success_msg: "Test case 4 passed: dcgm_support correctly defaults to true"

    - name: All DCGM support tests passed
      ansible.builtin.debug:
        msg: "All DCGM support flag derivation tests passed successfully"
