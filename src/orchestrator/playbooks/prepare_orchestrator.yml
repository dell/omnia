---

# Prepare Orchestrator — Deploy OpenCHAMI, configure S3 access
# Can be run standalone or imported by orchestrator.yml

- name: Prepare orchestrator environment
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: omnia.orchestrator.orchestrator_setup
      vars:
        openchami_vars_support: true
        omnia_metadata_support: true
  tags: always

- name: Configure S3 access from build_status.yml
  hosts: oim
  connection: ssh
  gather_facts: false
  tasks:
    - name: Include S3 access configuration
      ansible.builtin.include_role:
        name: omnia.orchestrator.orchestrator_common
        tasks_from: configure_s3_access.yml
  tags: always

- name: Deploy OpenCHAMI
  hosts: oim
  connection: ssh
  gather_facts: true
  roles:
    - omnia.orchestrator.deploy_openchami
  tags: always
