# Prepare Orchestrator — Full pre-flight: setup, validate, credentials, FG gen
# Can be run standalone or imported by orchestrator.yml
#
# Steps:
#   1. Setup orchestrator environment (upgrade guard, dirs, vars, OIM group)
#   2. Validate orchestrator input (L1 schema + L2 logic)
#   3. Credential management (prompt, encrypt, vault)
#   4. Generate functional groups from pxe_mapping_file.csv
#   5. Validate orchestrator parameters (mapping, software config, telemetry)
#   6. Validate OIM timezone
#   7. Validate boot images in S3 for each functional group
#   8. Persist support flags to orchestrator_state.yml

# Step 1: Setup — upgrade guard, project dirs, OIM group
- name: Setup orchestrator environment
  hosts: localhost
  connection: local
  gather_facts: false
  tags: always
  roles:
    - role: omnia.orchestrator.orchestrator_setup
      vars:
        openchami_vars_support: true
        omnia_metadata_support: true
        oim_group: true

# Step 2: Validate orchestrator input (L1 schema + L2 logic)
- name: Validate orchestrator input configuration
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: omnia.orchestrator.validate_orchestrator_input
      when: not config_file_status | default(false) | bool

# Step 3: Credential management (prompt, encrypt, vault)
- name: Create and update credential config files
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: omnia.orchestrator.orchestrator_credentials
      when:
        - not config_file_status | default(false) | bool
        - (omnia_run_tags | default([]) | intersect(skip_credential_tags | default([])) | length == 0)
          or (omnia_run_tags | default([]) | length == 0)

# Step 4: Generate functional groups from pxe_mapping_file.csv
- name: Generate functional groups configuration
  hosts: localhost
  connection: local
  gather_facts: false
  tags: always
  roles:
    - omnia.orchestrator.orchestrator_functional_groups

# Step 5: Validate orchestrator parameters (mapping, software config, telemetry)
- name: Validate orchestrator parameters
  hosts: localhost
  connection: local
  roles:
    - omnia.orchestrator.orchestrator_validations

# Step 6: Validate OIM timezone
- name: Validate OIM timezone
  hosts: oim
  connection: ssh
  tasks:
    - name: Validate OIM timezone has not changed
      ansible.builtin.include_role:
        name: omnia.orchestrator.orchestrator_validations
        tasks_from: validate_oim_timezone.yml

# Step 7: Validate boot images in S3 for each functional group
- name: Validate boot images
  hosts: oim
  connection: ssh
  tasks:
    - name: Image validation
      ansible.builtin.include_role:
        name: omnia.orchestrator.orchestrator_validations
        tasks_from: validate_image.yml
      with_items: "{{ hostvars['localhost']['functional_groups'] | map(attribute='name') | list }}"

# Step 8: Persist support flags for standalone playbook usage
- name: Persist orchestrator state
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Write orchestrator_state.yml
      ansible.builtin.copy:
        content: |
          ---
          # Auto-generated by prepare_orchestrator.yml
          # Support flags derived from software_config.json
          service_k8s_support: {{ service_k8s_support | default(false) }}
          openldap_support: {{ openldap_support | default(false) }}
          dns_enabled: {{ dns_enabled | default(false) }}
          cluster_os_type: "{{ cluster_os_type | default('') }}"
          cluster_os_version: "{{ cluster_os_version | default('') }}"
          admin_nic_ip: "{{ admin_nic_ip | default('') }}"
          domain_name: "{{ domain_name | default('') }}"
        dest: "{{ orchestrator_output_dir | default('/opt/omnia/.data') }}/orchestrator_state.yml"
        mode: "0644"
