---

# Cleanup Orchestrator — Remove OpenCHAMI services, artifacts, and credentials
# Can be run standalone or imported by orchestrator.yml

- name: Setup orchestrator environment
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: omnia.orchestrator.orchestrator_setup
      vars:
        openchami_vars_support: true
        omnia_metadata_support: true
  tags: always

- name: Cleanup OpenCHAMI deployments
  hosts: oim
  connection: ssh
  gather_facts: true
  tasks:
    - name: Stop and remove OpenCHAMI services
      ansible.builtin.debug:
        msg: "OpenCHAMI cleanup placeholder — implement via deploy_openchami cleanup tasks"
      # TODO: Import deploy_openchami cleanup tasks when available

    - name: Remove generated functional groups
      ansible.builtin.file:
        path: /opt/omnia/.data/functional_groups_config.yml
        state: absent

    - name: Remove orchestrator output directory
      ansible.builtin.file:
        path: "{{ hostvars['localhost']['orchestrator_output_dir'] }}"
        state: absent
  tags: always

- name: Cleanup credentials (opt-in)
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Remove credential files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ input_project_dir }}/omnia_config_credentials.yml"
        - "{{ input_project_dir }}/.omnia_config_credentials_key"
  tags:
    - credentials
    - never
