---
# ─────────────────────────────────────────────────────────────────────────
# PXE Boot Utility — Set PXE boot on Dell iDRAC nodes and restart
# Can be run standalone or imported by orchestrator.yml
#
# Usage:
#   # Collect credentials only (exits after saving):
#   ansible-playbook setpxe/set_pxe_boot.yml --tags credentials
#
#   # Full PXE boot with phone-home verification:
#   ansible-playbook setpxe/set_pxe_boot.yml -i inventory.ini
#
#   # Skip credential prompting (use pre-provisioned credentials):
#   ansible-playbook setpxe/set_pxe_boot.yml -i inventory.ini --skip-tags credentials
#
#   # Disable phone-home verification:
#   ansible-playbook setpxe/set_pxe_boot.yml -i inventory.ini -e enable_phone_home=false
#
# Inventory format (INI with host vars):
#   [bmc]
#   172.16.0.73 admin_ip=172.16.1.50 hostname=node01
#   172.16.0.74 admin_ip=172.16.1.51 hostname=node02
# ─────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────
# Play 1: Collect PXE boot credentials
# ─────────────────────────────────────────────────────────────────────────
- name: Collect PXE boot credentials
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [credentials]
  roles:
    - role: collect_pxe_credentials

# ─────────────────────────────────────────────────────────────────────────
# Play 2: Load PXE configuration
# ─────────────────────────────────────────────────────────────────────────
- name: Load PXE configuration
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [pxe_boot]
  tasks:
    - name: Resolve input directory path
      ansible.builtin.set_fact:
        input_config_dir: >-
          {{ input_project_dir
             | default(lookup('env', 'OMNIA_DATA_PATH') | default('/opt/omnia', true)
                       + '/orchestrator/input/'
                       + lookup('env', 'OMNIA_PROJECT_NAME') | default('project_default', true)) }}
        cacheable: true

    - name: Load PXE configuration from input directory
      ansible.builtin.include_vars:
        file: "{{ input_config_dir }}/set_pxe_boot_config.yml"
      register: pxe_config_loaded
      failed_when: false

    - name: Set config variables as cacheable facts for cross-play access
      ansible.builtin.set_fact:
        enable_phone_home: "{{ enable_phone_home | default(true) }}"
        phone_home_pause_minutes: "{{ phone_home_pause_minutes | default(3) }}"
        phone_home_retries: "{{ phone_home_retries | default(120) }}"
        phone_home_delay: "{{ phone_home_delay | default(15) }}"
        phone_home_log_pattern: "{{ phone_home_log_pattern | default('Phone home request from') }}"
        restart_host: "{{ restart_host | default(true) }}"
        force_restart: "{{ force_restart | default(true) }}"
        boot_source_override_enabled: "{{ boot_source_override_enabled | default('continuous') }}"
        boot_source_override_target: "{{ boot_source_override_target | default('pxe') }}"
        cacheable: true

    - name: Warn if set_pxe_boot_config.yml not found (using defaults)
      ansible.builtin.debug:
        msg: >-
          WARNING: set_pxe_boot_config.yml not found at {{ input_config_dir }}/set_pxe_boot_config.yml.
          Using default configuration. To customize phone-home timing and PXE boot settings,
          create set_pxe_boot_config.yml in the input directory.
      when: pxe_config_loaded is failed

# ─────────────────────────────────────────────────────────────────────────
# Play 3: Validate BMC inventory and prepare for phone-home
# ─────────────────────────────────────────────────────────────────────────
- name: Validate BMC inventory and prepare for phone-home
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [pxe_boot]
  tasks:
    - name: Validate BMC group has hosts
      ansible.builtin.fail:
        msg: "Failed. 'bmc' group has no hosts. Provide an inventory file with a [bmc] group: ansible-playbook set_pxe_boot.yml -i <inventory>"
      when: ('bmc' not in groups) or (groups['bmc'] | length | int == 0)

    - name: Capture PXE boot start epoch for phone-home verification
      ansible.builtin.set_fact:
        pxe_start_epoch: "{{ ansible_date_time.epoch }}"
        cacheable: true
      when: enable_phone_home | default(true) | bool

    - name: Build list of target node admin IPs for phone-home verification
      ansible.builtin.set_fact:
        target_node_admin_ips: "{{ groups['bmc'] | map('extract', hostvars, 'admin_ip') | select('defined') | list }}"
        cacheable: true
      when: enable_phone_home | default(true) | bool

    - name: Validate admin_ip is set for all BMC hosts (required for phone-home)
      ansible.builtin.fail:
        msg: >-
          Phone-home verification is enabled but some BMC hosts are missing 'admin_ip'.
          Please add admin_ip to all hosts in your inventory or disable phone-home with -e enable_phone_home=false
      when:
        - enable_phone_home | default(true) | bool
        - target_node_admin_ips | length != groups['bmc'] | length

# ─────────────────────────────────────────────────────────────────────────
# Play 4: Reboot hosts via PXE
# ─────────────────────────────────────────────────────────────────────────
- name: Reboot hosts via PXE
  hosts: bmc
  connection: local
  strategy: host_pinned
  gather_facts: false
  tags: [pxe_boot]
  roles:
    - role: idrac_pxe_boot

# ─────────────────────────────────────────────────────────────────────────
# Play 5: Report PXE boot results
# ─────────────────────────────────────────────────────────────────────────
- name: Report PXE boot results
  hosts: bmc
  connection: local
  gather_facts: false
  tags: [pxe_boot]
  tasks:
    - name: Report iDRAC reboot failure
      ansible.builtin.debug:
        msg: "[FAILED] {{ inventory_hostname }}: {{ reboot_status }}"
      when: reboot_failed

    - name: Show passed iDRACs
      ansible.builtin.debug:
        msg: "[OK] {{ inventory_hostname }}: {{ reboot_status }}"
      when: not reboot_failed

    - name: Collect failed BMC IPs for phone-home exclusion
      ansible.builtin.set_fact:
        pxe_boot_failed_bmc_ips: "{{ pxe_boot_failed_bmc_ips | default([]) + [inventory_hostname] }}"
      delegate_to: localhost
      delegate_facts: true
      when: reboot_failed

    - name: Fail if reboot failed (when phone-home disabled)
      ansible.builtin.fail:
        msg: "{{ reboot_status }}"
      when:
        - reboot_failed
        - not (enable_phone_home | default(true) | bool)

# ─────────────────────────────────────────────────────────────────────────
# Play 6: Filter phone-home target list (exclude failed PXE boots)
# ─────────────────────────────────────────────────────────────────────────
- name: Filter phone-home target list
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [pxe_boot]
  tasks:
    - name: Filter phone-home verification block
      when: enable_phone_home | default(true) | bool
      block:
        - name: Build admin IP to BMC IP mapping
          ansible.builtin.set_fact:
            admin_to_bmc_map: "{{ admin_to_bmc_map | default({}) | combine({hostvars[item]['admin_ip']: item}) }}"
          loop: "{{ groups['bmc'] }}"
          when: hostvars[item]['admin_ip'] is defined

        - name: Filter out failed PXE boots from phone-home target list
          ansible.builtin.set_fact:
            target_node_admin_ips: "{{ target_node_admin_ips | default([]) | difference(failed_admin_ips | default([])) }}"
            cacheable: true
          vars:
            failed_admin_ips: "{{ pxe_boot_failed_bmc_ips | default([]) | map('extract', hostvars, 'admin_ip') | select('defined') | list }}"

        - name: Report phone-home target list
          ansible.builtin.debug:
            msg: >-
              Phone-home verification will wait for {{ target_node_admin_ips | length }} nodes
              ({{ pxe_boot_failed_bmc_ips | default([]) | length }} excluded due to PXE boot failure)

        - name: Skip phone-home when no nodes to verify
          ansible.builtin.debug:
            msg: "[Phone-Home] Skipping — no nodes to verify (all PXE boots failed)"
          when: target_node_admin_ips | default([]) | length == 0

# ─────────────────────────────────────────────────────────────────────────
# Play 7: Phone-home verification (runs on OIM server)
# ─────────────────────────────────────────────────────────────────────────
- name: Verify cloud-init phone-home
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [pxe_boot]
  tasks:
    - name: Phone-home verification block
      when:
        - enable_phone_home | default(true) | bool
        - target_node_admin_ips | default([]) | length > 0
      block:
        - name: Run phone-home verification
          ansible.builtin.include_role:
            name: verify_phone_home

# ─────────────────────────────────────────────────────────────────────────
# Play 8: Final reporting (includes phone-home failures)
# ─────────────────────────────────────────────────────────────────────────
- name: Final PXE boot and phone-home report
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [pxe_boot]
  tasks:
    - name: Ensure output directory exists
      vars:
        output_dir: >-
          {{ lookup('env', 'OMNIA_DATA_PATH') | default('/opt/omnia', true) }}/orchestrator/output/{{
             lookup('env', 'OMNIA_PROJECT_NAME') | default('project_default', true)
          }}
      ansible.builtin.file:
        path: "{{ output_dir }}"
        state: directory
        mode: "0755"

    - name: Build reverse map of admin IP to BMC IP for reporting
      ansible.builtin.set_fact:
        admin_to_bmc_map: "{{ admin_to_bmc_map | default({}) | combine({hostvars[item]['admin_ip']: item}) }}"
      loop: "{{ groups['bmc'] }}"
      when: hostvars[item]['admin_ip'] is defined

    - name: Map phone-home failed admin IPs back to BMC IPs
      ansible.builtin.set_fact:
        phone_home_failed_bmc_ips: "{{ phone_home_failed_bmc_ips | default([]) + [admin_to_bmc_map[item]] }}"
      loop: "{{ phone_home_failed_ips | default([]) }}"
      when:
        - enable_phone_home | default(true) | bool
        - item in admin_to_bmc_map

    - name: Build failed nodes list with details
      ansible.builtin.set_fact:
        failed_nodes_list: "{{ failed_nodes_list | default([]) + [node_detail] }}"
      loop: "{{ (pxe_boot_failed_bmc_ips | default([])) + (phone_home_failed_bmc_ips | default([])) }}"
      vars:
        node_detail:
          bmc_ip: "{{ item }}"
          admin_ip: "{{ hostvars[item].admin_ip | default('N/A') }}"
          hostname: "{{ hostvars[item].hostname | default('N/A') }}"
          service_tag: "{{ hostvars[item].service_tag | default('N/A') }}"
          failure_stage: "{{ 'pxe_boot' if item in (pxe_boot_failed_bmc_ips | default([])) else 'phone_home' }}"
          status: "failed"
          error: "{{ hostvars[item].reboot_status | default('Phone-home timeout') }}"

    - name: Write failed_nodes.json output file
      ansible.builtin.copy:
        content: "{{ failed_nodes_report | to_nice_json }}"
        dest: "{{ output_dir }}/failed_nodes.json"
        mode: "0644"
      vars:
        omnia_data_path: >-
          {{ lookup('env', 'OMNIA_DATA_PATH') | default('/opt/omnia', true) }}
        project_name: >-
          {{ lookup('env', 'OMNIA_PROJECT_NAME') | default('project_default', true) }}
        output_dir: "{{ omnia_data_path }}/orchestrator/output/{{ project_name }}"
        failed_nodes_report:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          total_nodes: "{{ groups['bmc'] | length }}"
          failure_count: "{{ (failed_nodes_list | default([])) | length }}"
          success_count: "{{ groups['bmc'] | length - ((failed_nodes_list | default([])) | length) }}"
          failed_nodes: "{{ failed_nodes_list | default([]) }}"

    - name: Report total failures
      ansible.builtin.debug:
        msg: >-
          PXE Boot Summary:
          - Total nodes: {{ groups['bmc'] | length }}
          - PXE boot failed: {{ pxe_boot_failed_bmc_ips | default([]) | length }}
          - Phone-home failed: {{ phone_home_failed_bmc_ips | default([]) | length }}
          - Success: {{
              groups['bmc'] | length
              - (pxe_boot_failed_bmc_ips | default([]) | length)
              - (phone_home_failed_bmc_ips | default([]) | length)
            }}
          - Output file: {{ output_dir }}/failed_nodes.json

    - name: Fail if any nodes failed PXE boot or phone-home
      ansible.builtin.fail:
        msg: >-
          Node failures detected.
          PXE boot failures: {{ pxe_boot_failed_bmc_ips | default([]) | join(', ') or 'none' }}
          Phone-home failures: {{ phone_home_failed_bmc_ips | default([]) | join(', ') or 'none' }}
      when: (pxe_boot_failed_bmc_ips | default([]) | length > 0) or (phone_home_failed_bmc_ips | default([]) | length > 0)
