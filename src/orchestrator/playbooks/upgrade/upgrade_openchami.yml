# Upgrade OpenCHAMI --- In-place upgrade from 0.1.7-1 to 0.2.0
# Can be run standalone or imported by orchestrator.yml
#
# Logic:
#   1. Detect currently installed OpenCHAMI version (RPM query)
#   2. If current version is 0.1.7-1 (pre-fabrica):
#      a. Create upgrade lock file
#      b. Backup configuration and SMD state
#      c. Run legacy-to-fabrica migration (remove legacy services)
#      d. Pull new images, install new RPM, restart services
#      e. Verify service health
#      f. Remove upgrade lock
#   3. If already on 0.2.0: log informational message and exit
#
# Idempotent and re-runnable.

# Version detection
- name: Detect OpenCHAMI version for upgrade
  hosts: oim
  connection: ssh
  gather_facts: true
  tasks:
    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: rpm

    - name: Set current OpenCHAMI version fact
      ansible.builtin.set_fact:
        openchami_current_version: >-
          {{ (ansible_facts.packages['openchami'][0].version ~ '-' ~ ansible_facts.packages['openchami'][0].release)
             if 'openchami' in (ansible_facts.packages | default({}))
             else 'unknown' }}
        openchami_target_version: "0.2.0-1"
        openchami_previous_version: "0.1.7-1"
        cacheable: true

    - name: Display current version
      ansible.builtin.debug:
        msg: "OpenCHAMI current version: {{ openchami_current_version }}"

    - name: Already on target version
      ansible.builtin.debug:
        msg: >-
          OpenCHAMI is already at version {{ openchami_target_version }}.
          No upgrade needed.
      when: openchami_current_version == openchami_target_version

# Create upgrade lock
- name: Create upgrade lock file
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Skip if already at target version
      ansible.builtin.meta: end_play
      when: hostvars[groups['oim'][0]]['openchami_current_version'] == hostvars[groups['oim'][0]]['openchami_target_version']

    - name: Create upgrade lock
      ansible.builtin.copy:
        content: |
          upgrade_started: "{{ lookup('pipe', 'date -Iseconds') }}"
          source_version: "{{ hostvars[groups['oim'][0]]['openchami_current_version'] }}"
          target_version: "{{ hostvars[groups['oim'][0]]['openchami_target_version'] }}"
          component: openchami
        dest: "{{ hostvars['localhost']['omnia_data_path'] }}/.data/upgrade_in_progress.lock"
        mode: '0644'

# Backup before upgrade
- name: Backup OpenCHAMI configuration and SMD state
  hosts: oim
  connection: ssh
  gather_facts: true
  vars:
    upgrade_backup_dir: >-
      {{ hostvars['localhost']['omnia_data_path'] }}/openchami/backups/pre_upgrade_{{ ansible_date_time.iso8601_basic_short }}
    openchami_config_dir: /etc/openchami/configs
    openchami_work_dir: "{{ hostvars['localhost']['omnia_data_path'] }}/openchami/workdir"
  tasks:
    - name: Skip if already at target version
      ansible.builtin.meta: end_play
      when: openchami_current_version == openchami_target_version

    - name: Authenticate to OpenCHAMI
      ansible.builtin.include_role:
        name: orchestrator_common
        tasks_from: openchami_auth.yml

    - name: Create backup directory structure
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - "{{ upgrade_backup_dir }}"
        - "{{ upgrade_backup_dir }}/configs"
        - "{{ upgrade_backup_dir }}/smd"
        - "{{ upgrade_backup_dir }}/workdir"

    - name: Backup OpenCHAMI config directory
      ansible.builtin.copy:
        src: "{{ openchami_config_dir }}/"
        dest: "{{ upgrade_backup_dir }}/configs/"
        remote_src: true
        mode: preserve
      failed_when: false

    - name: Backup SMD component endpoints
      ansible.builtin.shell: |
        set -o pipefail
        ochami smd component get --all 2>/dev/null | tee "{{ upgrade_backup_dir }}/smd/components.json"
      environment: "{{ ochami_env | default({}) }}"
      register: smd_backup_result
      changed_when: false
      failed_when: false

    - name: Backup SMD groups
      ansible.builtin.shell: |
        set -o pipefail
        ochami smd group get --all 2>/dev/null | tee "{{ upgrade_backup_dir }}/smd/groups.json"
      environment: "{{ ochami_env | default({}) }}"
      changed_when: false
      failed_when: false

    - name: Backup boot configurations
      ansible.builtin.shell: |
        set -o pipefail
        ochami boot config list -F json 2>/dev/null | tee "{{ upgrade_backup_dir }}/smd/boot_configs.json"
      environment: "{{ ochami_env | default({}) }}"
      changed_when: false
      failed_when: false

    - name: Backup workdir (nodes YAML, inventories)
      ansible.builtin.copy:
        src: "{{ openchami_work_dir }}/"
        dest: "{{ upgrade_backup_dir }}/workdir/"
        remote_src: true
        mode: preserve
      failed_when: false

    - name: Record backup metadata
      ansible.builtin.copy:
        content: |
          backup_timestamp: "{{ ansible_date_time.iso8601 }}"
          source_version: "{{ openchami_current_version }}"
          target_version: "{{ openchami_target_version }}"
          backup_path: "{{ upgrade_backup_dir }}"
          smd_backup_rc: {{ smd_backup_result.rc | default(-1) }}
        dest: "{{ upgrade_backup_dir }}/backup_metadata.yml"
        mode: '0644'

# Legacy migration (0.1.7-1 pre-fabrica to fabrica)
- name: Upgrade from legacy (pre-fabrica) OpenCHAMI if required
  hosts: oim
  connection: ssh
  gather_facts: false
  tasks:
    - name: Skip if already at target version
      ansible.builtin.meta: end_play
      when: openchami_current_version == openchami_target_version

    - name: Check for legacy (pre-fabrica) installation
      ansible.builtin.stat:
        path: /etc/containers/systemd/bss.container
      register: legacy_bss_container

    # Legacy migration: remove old services before installing new RPM
    - name: Run legacy-to-fabrica migration
      when: legacy_bss_container.stat.exists
      block:
        - name: Set legacy (pre-fabrica) service lists
          ansible.builtin.set_fact:
            openchami_legacy_containers:
              - bss
              - bss-init
              - opaal
              - opaal-idp
              - cloud-init-server
              - hydra
            openchami_legacy_container_files:
              - /etc/containers/systemd/bss.container
              - /etc/containers/systemd/bss-init.container
              - /etc/containers/systemd/opaal.container
              - /etc/containers/systemd/opaal-idp.container
              - /etc/containers/systemd/cloud-init-server.container
              - /etc/containers/systemd/hydra.container
            openchami_legacy_secrets:
              - hydra_postgres_password
              - hydra_dsn
              - hydra_system_secret
              - bss_postgres_password
            openchami_legacy_images:
              - "ghcr.io/openchami/opaal"
              - "ghcr.io/openchami/bss"
              - "ghcr.io/openchami/metadata-service"
              - "docker.io/oryd/hydra"
              - "cgr.dev/chainguard/curl"

        - name: Stop openchami target
          ansible.builtin.systemd_service:
            name: openchami.target
            state: stopped
          failed_when: false

        - name: Stop legacy containers
          ansible.builtin.command: "podman stop {{ item }}"
          loop: "{{ openchami_legacy_containers }}"
          changed_when: false
          failed_when: false

        - name: Remove legacy containers
          ansible.builtin.command: "podman rm -f {{ item }}"
          loop: "{{ openchami_legacy_containers }}"
          changed_when: false
          failed_when: false

        - name: Remove legacy container files
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop: "{{ openchami_legacy_container_files }}"

        - name: Remove legacy podman secrets
          ansible.builtin.command: "podman secret rm {{ item }}"
          loop: "{{ openchami_legacy_secrets }}"
          changed_when: false
          failed_when: false

        - name: Remove legacy container images
          ansible.builtin.command: "podman rmi {{ item }}"
          loop: "{{ openchami_legacy_images }}"
          changed_when: false
          failed_when: false

        - name: Reload systemd after legacy cleanup
          ansible.builtin.systemd_service:
            daemon_reload: true

# Pull new images and restart
- name: Pull new OpenCHAMI images and restart services
  hosts: oim
  connection: ssh
  gather_facts: false
  tasks:
    - name: Skip if already at target version
      ansible.builtin.meta: end_play
      when: openchami_current_version == openchami_target_version

    - name: Include deploy_openchami vars for image list
      ansible.builtin.include_vars:
        file: "{{ playbook_dir | regex_replace('/playbooks.*$', '') }}/roles/deploy_openchami/vars/main.yml"
      failed_when: false

    - name: Pull updated OpenCHAMI container images
      ansible.builtin.command: "podman pull {{ item }}"
      loop: "{{ openchami_images | default([]) }}"
      register: pull_results
      retries: 3
      delay: 10
      until: pull_results.rc == 0
      changed_when: pull_results.rc == 0

    - name: Restart OpenCHAMI services (rolling)
      ansible.builtin.systemd:
        name: openchami.target
        state: restarted
        daemon_reload: true

    - name: Wait for services to stabilize
      ansible.builtin.pause:
        seconds: 30
        prompt: "Waiting for OpenCHAMI services to stabilize after upgrade..."

# Post-upgrade verification
- name: Verify OpenCHAMI health post-upgrade
  hosts: oim
  connection: ssh
  gather_facts: false
  tasks:
    - name: Skip if already at target version (no upgrade performed)
      ansible.builtin.meta: end_play
      when: openchami_current_version == openchami_target_version

    - name: Authenticate to OpenCHAMI
      ansible.builtin.include_role:
        name: orchestrator_common
        tasks_from: openchami_auth.yml

    - name: Verify openchami.target is active
      ansible.builtin.systemd:
        name: openchami.target
      register: openchami_target_post
      failed_when: openchami_target_post.status.ActiveState != "active"

    - name: Verify SMD API health
      ansible.builtin.command: ochami smd service status
      environment: "{{ ochami_env | default({}) }}"
      register: smd_post_status
      retries: 5
      delay: 10
      until: smd_post_status.rc == 0
      changed_when: false

    - name: Verify boot-service health
      ansible.builtin.systemd:
        name: boot-service.service
      register: boot_service_post_status
      retries: 5
      delay: 10
      until: boot_service_post_status.status.ActiveState == "active"
      changed_when: false

    - name: Post-upgrade health summary
      ansible.builtin.debug:
        msg: >-
          OpenCHAMI upgrade health check passed.
          openchami.target={{ openchami_target_post.status.ActiveState }},
          SMD={{ 'OK' if smd_post_status.rc == 0 else 'FAIL' }},
          Boot-Service={{ 'OK' if boot_service_post_status.status.ActiveState == 'active' else 'FAIL' }}.

# Finalize
- name: Finalize OpenCHAMI upgrade
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Remove upgrade lock file
      ansible.builtin.file:
        path: "{{ hostvars['localhost']['omnia_data_path'] }}/.data/upgrade_in_progress.lock"
        state: absent

    - name: OpenCHAMI upgrade completed
      ansible.builtin.debug:
        msg: >-
          OpenCHAMI upgrade completed successfully. Lock file removed.
          Re-run provisioning playbooks if node configuration needs refreshing.
