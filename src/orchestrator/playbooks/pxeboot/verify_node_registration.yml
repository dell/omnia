---
# Verify nodes booted outside Orchestrator, such as VMs or physical nodes
# manually rebooted after an automated boot-trigger failure.

- name: Select externally booted nodes for verification
  hosts: localhost
  connection: local
  gather_facts: true
  tags:
    - never
    - verify_node_registration
  roles:
    - role: external_boot_verification

- name: Verify externally booted nodes over SSH
  hosts: external_node_registration_targets
  connection: ssh
  gather_facts: false
  strategy: free
  tags:
    - never
    - verify_node_registration
  pre_tasks:
    - name: Skip when no nodes require external verification
      ansible.builtin.meta: end_play
      when: hostvars['localhost']['external_verification_skip'] | default(false) | bool
  roles:
    - role: verify_node_registration

- name: Record externally booted node verification
  hosts: localhost
  connection: local
  gather_facts: true
  tags:
    - never
    - verify_node_registration
  pre_tasks:
    - name: Skip reporting when no nodes required verification
      ansible.builtin.meta: end_play
      when: external_verification_skip | default(false) | bool
  tasks:
    - name: Reconcile external boot verification results
      ansible.builtin.include_role:
        name: external_boot_verification
        tasks_from: report.yml
