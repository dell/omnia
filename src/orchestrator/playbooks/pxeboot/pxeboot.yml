---
# ─────────────────────────────────────────────────────────────────────────
# PXE Boot Utility — Set PXE boot on Dell iDRAC nodes and restart
# Can be run standalone or imported by orchestrator.yml
#
# Usage (standalone):
#   cd src/orchestrator/playbooks
#   ansible-playbook pxeboot/pxeboot.yml
#
#   # Disable node-registration verification:
#   ansible-playbook pxeboot/pxeboot.yml -e enable_node_registration=false
#
#   # Use a custom inventory (e.g. for retry with partial failures):
#   ansible-playbook pxeboot/pxeboot.yml -e pxeboot_inventory=/path/to/inventory.csv
#
# Usage (via orchestrator.yml):
#   ansible-playbook orchestrator.yml --tags pxeboot
#
#   # Retry only failed nodes from a previous run:
#   ansible-playbook orchestrator.yml --tags pxeboot -e pxeboot_inventory=/path/to/failed_inventory.csv
#
# Input:
#   - pxe_mapping_file.csv (BMC_IP, ADMIN_IP, HOSTNAME columns)
#     OR pxeboot_inventory extra var pointing to a custom CSV
#   - set_pxe_boot_config.yml (node-registration timing, boot options)
#   - Orchestrator credentials (bmc_username, bmc_password)
# ─────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────
# Play 1: Setup + Load config + Check flag
# ─────────────────────────────────────────────────────────────────────────
- name: Setup PXE boot environment
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [pxeboot]
  tasks:
    - name: Run orchestrator_setup if not already initialized
      ansible.builtin.include_role:
        name: orchestrator_setup
      vars:
        openchami_vars_support: false
      when: input_project_dir is not defined

    - name: Check if PXE boot is enabled
      ansible.builtin.debug:
        msg: >-
          PXE boot is disabled (enable_pxe_boot: false in orchestrator_config.yml).
          This is expected for virtual machine environments without iDRAC/BMC.
          To enable, set enable_pxe_boot: true in orchestrator_config.yml.
          Skipping all PXE boot plays.
      when: not (enable_pxe_boot | default(true) | bool)

    - name: Set PXE boot skip flag
      ansible.builtin.set_fact:
        pxe_boot_skip: "{{ not (enable_pxe_boot | default(true) | bool) }}"
        cacheable: true

    - name: Check for optional PXE boot configuration
      ansible.builtin.stat:
        path: "{{ input_project_dir }}/set_pxe_boot_config.yml"
      register: _pxe_config_stat
      when: not (pxe_boot_skip | bool)

    - name: Load PXE boot configuration when present
      ansible.builtin.include_vars:
        file: "{{ input_project_dir }}/set_pxe_boot_config.yml"
      when:
        - not (pxe_boot_skip | bool)
        - _pxe_config_stat.stat.exists

    - name: Report use of PXE boot defaults
      ansible.builtin.debug:
        msg: >-
          Optional set_pxe_boot_config.yml was not found; using documented
          PXE boot and node-registration defaults.
      when:
        - not (pxe_boot_skip | bool)
        - not _pxe_config_stat.stat.exists

    - name: Set PXE config defaults
      when: not (pxe_boot_skip | bool)
      ansible.builtin.set_fact:
        enable_node_registration: "{{ enable_node_registration | default(enable_phone_home | default(true)) }}"
        node_registration_pause_minutes: "{{ node_registration_pause_minutes | default(phone_home_pause_minutes | default(3)) }}"
        node_registration_retries: "{{ node_registration_retries | default(phone_home_retries | default(120)) }}"
        node_registration_delay: "{{ node_registration_delay | default(phone_home_delay | default(15)) }}"
        restart_host: "{{ restart_host | default(true) }}"
        force_restart: "{{ force_restart | default(true) }}"
        boot_source_override_enabled: "{{ boot_source_override_enabled | default('continuous') }}"
        boot_source_override_target: "{{ boot_source_override_target | default('pxe') }}"
        cacheable: true

    - name: Validate PXE boot configuration
      ansible.builtin.assert:
        that:
          - enable_node_registration is boolean or (enable_node_registration is string and enable_node_registration | lower in ['true', 'false'])
          - (node_registration_pause_minutes | string) is match('^[0-9]+$')
          - (node_registration_retries | string) is match('^[1-9][0-9]*$')
          - (node_registration_delay | string) is match('^[1-9][0-9]*$')
          - restart_host is boolean or (restart_host is string and restart_host | lower in ['true', 'false'])
          - force_restart is boolean or (force_restart is string and force_restart | lower in ['true', 'false'])
          - boot_source_override_enabled in ['once', 'continuous', 'disabled']
          - boot_source_override_target in ['pxe', 'uefi_http', 'hdd', 'cd', 'floppy', 'sd_card', 'utilities', 'bios_setup', 'none']
        fail_msg: >-
          Invalid set_pxe_boot_config.yml. Use booleans for enable/restart
          options, non-negative numeric pause, positive integer retries and
          delay, and one of the documented boot override values.
        success_msg: "PXE boot configuration is valid."
      when: not (pxe_boot_skip | bool)

    - name: Normalize PXE boot configuration types
      ansible.builtin.set_fact:
        enable_node_registration: "{{ enable_node_registration | bool }}"
        node_registration_pause_minutes: "{{ node_registration_pause_minutes | int }}"
        node_registration_retries: "{{ node_registration_retries | int }}"
        node_registration_delay: "{{ node_registration_delay | int }}"
        restart_host: "{{ restart_host | bool }}"
        force_restart: "{{ force_restart | bool }}"
      when: not (pxe_boot_skip | bool)

    - name: Warn when persistent PXE boot override is enabled
      ansible.builtin.debug:
        msg: >-
          WARNING: boot_source_override_enabled is continuous. Nodes will
          continue selecting PXE on later restarts until the iDRAC boot
          override is changed. Use once for a single PXE boot.
      when:
        - not (pxe_boot_skip | bool)
        - boot_source_override_enabled == 'continuous'

    - name: Emit deprecation warning for legacy phone_home_* variables
      ansible.builtin.debug:
        msg: >-
          DEPRECATION WARNING: The 'phone_home_*' variable names are deprecated and will be removed
          in a future release. Please use 'node_registration_*' instead.
          Example: enable_phone_home → enable_node_registration, phone_home_pause_minutes → node_registration_pause_minutes
      when:
        - not (pxe_boot_skip | bool)
        - (enable_phone_home is defined or phone_home_pause_minutes is defined or
           phone_home_retries is defined or phone_home_delay is defined)

# ─────────────────────────────────────────────────────────────────────────
# Play 1.5: BuildStream — Compute effective inventory for retry support
#
# When BuildStream is enabled (bsm_enabled) and a job_id is provided,
# this play reads restart_state.json and failed_nodes.json to determine
# which nodes have already been successfully booted.  It generates a
# filtered CSV containing only the nodes that still need PXE boot and
# sets the pxeboot_inventory fact so Play 3 uses the filtered inventory.
#
# On first run (no restart_state), all nodes are included.
# On retry, nodes marked status=success in failed_nodes.json (manually
# booted by the user in GitLab) are excluded.
# ─────────────────────────────────────────────────────────────────────────
- name: BuildStream effective inventory computation
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [pxeboot]
  pre_tasks:
    - name: Skip if PXE boot disabled
      ansible.builtin.meta: end_play
      when: hostvars['localhost']['pxe_boot_skip'] | default(false) | bool

    - name: Skip if BuildStream is not enabled
      ansible.builtin.meta: end_play
      when: not (enable_build_stream | default(false) | bool)

    - name: Skip if job_id is not provided
      ansible.builtin.meta: end_play
      when: job_id is not defined or (job_id | string | length == 0)
  tasks:
    - name: Compute effective inventory for BuildStream retry
      ansible.builtin.include_role:
        name: pxe_buildstream_manager
        tasks_from: generate_effective_csv.yml

# ─────────────────────────────────────────────────────────────────────────
# Play 2: Load credentials from orchestrator credential store
# ─────────────────────────────────────────────────────────────────────────
- name: Load orchestrator credentials
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [pxeboot]
  pre_tasks:
    - name: Skip if PXE boot disabled
      ansible.builtin.meta: end_play
      when: hostvars['localhost']['pxe_boot_skip'] | default(false) | bool
  tasks:
    - name: Load and validate BMC credentials
      block:
        - name: Load BMC credentials from orchestrator credential file
          ansible.builtin.include_role:
            name: orchestrator_common
            tasks_from: decrypt_include_encrypt.yml
          vars:
            credential_file_path: "{{ input_project_dir }}/omnia_config_credentials.yml"
            vault_password_file: "{{ input_project_dir }}/.omnia_config_credentials_key"

        - name: Validate BMC credentials are available
          ansible.builtin.fail:
            msg: >-
              BMC credentials not found. Run orchestrator credentials first:
              ansible-playbook orchestrator.yml --tags prepare
              Or run standalone with credentials already provisioned.
          when: (bmc_username | default('') | length == 0) or (bmc_password | default('') | length == 0)

# ─────────────────────────────────────────────────────────────────────────
# Play 3: Build BMC inventory from pxe_mapping_file.csv (or custom inventory)
#
# Supports -e pxeboot_inventory=/path/to/custom.csv for retry/resume
# with a subset of nodes (e.g. only failed nodes from a previous run).
# The CSV must expose the same named columns as pxe_mapping_file.csv. Column
# order is not significant.
# ─────────────────────────────────────────────────────────────────────────
- name: Build BMC inventory from PXE mapping file
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [pxeboot]
  pre_tasks:
    - name: Skip if PXE boot disabled
      ansible.builtin.meta: end_play
      when: hostvars['localhost']['pxe_boot_skip'] | default(false) | bool
  tasks:
    - name: Build BMC inventory
      block:
        - name: Resolve inventory source path
          ansible.builtin.set_fact:
            pxeboot_inventory_source: >-
              {{ pxeboot_inventory
                 | default(pxe_mapping_file_path, true) }}
            pxeboot_using_custom_inventory: >-
              {{ pxeboot_inventory | default('', true) | length > 0 }}
            cacheable: true

        - name: Initialize per-run PXE status facts
          ansible.builtin.set_fact:
            pxe_boot_failed_bmc_ips: []
            node_registration_failed_bmc_ips: []
            node_registration_results_by_bmc: {}
            failed_nodes_list: []
            all_nodes_status: []
            target_node_admin_ips: []

        - name: Log custom inventory usage
          ansible.builtin.debug:
            msg: >-
              Using custom PXE boot inventory:
              {{ pxeboot_inventory_source }}
          when: pxeboot_using_custom_inventory | bool

        - name: Verify inventory CSV exists
          ansible.builtin.stat:
            path: "{{ pxeboot_inventory_source }}"
          register: _mapping_file_stat

        - name: Fail if inventory CSV is missing
          ansible.builtin.fail:
            msg: >-
              PXE inventory file not found at
              {{ pxeboot_inventory_source }}
          when: not _mapping_file_stat.stat.exists

        - name: Read inventory CSV by column name
          community.general.read_csv:
            path: "{{ pxeboot_inventory_source }}"
          register: _pxeboot_csv

        - name: Validate inventory contains node records
          ansible.builtin.assert:
            that:
              - _pxeboot_csv.list | default([]) | length > 0
            fail_msg: >-
              PXE inventory {{ pxeboot_inventory_source }} does not contain
              any node records.

        - name: Validate required inventory columns
          ansible.builtin.assert:
            that:
              - item in (_pxeboot_csv.list[0].keys() | list)
            fail_msg: >-
              PXE inventory {{ pxeboot_inventory_source }} is missing the
              required column {{ item }}.
          loop:
            - BMC_IP
            - ADMIN_IP
            - HOSTNAME
            - SERVICE_TAG

        - name: Validate PXE inventory node addresses
          ansible.builtin.assert:
            that:
              - item.BMC_IP | default('') | trim | length > 0
              - item.ADMIN_IP | default('') | trim | length > 0
              - "'/' not in (item.BMC_IP | trim)"
              - "'/' not in (item.ADMIN_IP | trim)"
              - (item.BMC_IP | trim | ansible.utils.ipv4('address')) is not false
              - (item.ADMIN_IP | trim | ansible.utils.ipv4('address')) is not false
            fail_msg: >-
              Invalid PXE inventory row for {{ item.HOSTNAME | default('unknown host') }}.
              BMC_IP and ADMIN_IP must contain valid IP addresses.
          loop: "{{ _pxeboot_csv.list }}"
          loop_control:
            label: "{{ item.HOSTNAME | default('unknown host') }}"

        - name: Validate PXE inventory addresses are unique
          ansible.builtin.assert:
            that:
              - (_pxeboot_csv.list | map(attribute='BMC_IP') | map('trim') | list | unique | length) == (_pxeboot_csv.list | length)
              - (_pxeboot_csv.list | map(attribute='ADMIN_IP') | map('trim') | list | unique | length) == (_pxeboot_csv.list | length)
            fail_msg: >-
              PXE inventory {{ pxeboot_inventory_source }} contains duplicate
              BMC_IP or ADMIN_IP values. Every node must have unique addresses.

        - name: Build BMC host group from named CSV fields
          ansible.builtin.add_host:
            hostname: "{{ item.BMC_IP | trim }}"
            groups: bmc
            admin_ip: "{{ item.ADMIN_IP | trim }}"
            xname: "{{ item.XNAME | default('') | trim }}"
            hostname_node: "{{ item.HOSTNAME | default('') | trim }}"
            service_tag: "{{ item.SERVICE_TAG | default('') | trim }}"
          loop: "{{ _pxeboot_csv.list }}"
          loop_control:
            label: "{{ item.BMC_IP | trim }}"

        - name: Build parallel node-registration host group
          ansible.builtin.add_host:
            hostname: "{{ item.ADMIN_IP | trim }}"
            groups: node_registration_targets
            bmc_ip: "{{ item.BMC_IP | trim }}"
            xname: "{{ item.XNAME | default('') | trim }}"
            hostname_node: "{{ item.HOSTNAME | default('') | trim }}"
            service_tag: "{{ item.SERVICE_TAG | default('') | trim }}"
          loop: "{{ _pxeboot_csv.list }}"
          loop_control:
            label: "{{ item.ADMIN_IP | trim }}"

        - name: Validate BMC group has hosts
          ansible.builtin.fail:
            msg: >-
              No BMC hosts found in {{ pxeboot_inventory_source }}.
              Ensure the BMC_IP column is populated.
          when: ('bmc' not in groups) or (groups['bmc'] | length | int == 0)

        - name: Capture PXE boot start epoch
          ansible.builtin.set_fact:
            pxe_start_epoch: "{{ ansible_date_time.epoch }}"
            cacheable: true
          when: enable_node_registration | default(true) | bool

        - name: Build target admin IPs for node-registration verification
          ansible.builtin.set_fact:
            target_node_admin_ips: "{{ _pxeboot_csv.list | map(attribute='ADMIN_IP') | map('trim') | list }}"
            cacheable: true
          when: enable_node_registration | default(true) | bool

# ─────────────────────────────────────────────────────────────────────────
# Play 4: Reboot hosts via PXE
# ─────────────────────────────────────────────────────────────────────────
- name: Reboot hosts via PXE
  hosts: bmc
  connection: local
  strategy: host_pinned
  gather_facts: false
  tags: [pxeboot]
  pre_tasks:
    - name: Skip if PXE boot disabled
      ansible.builtin.meta: end_play
      when: hostvars['localhost']['pxe_boot_skip'] | default(false) | bool
  roles:
    - role: idrac_pxe_boot

# ─────────────────────────────────────────────────────────────────────────
# Play 5: Report PXE boot results
# ─────────────────────────────────────────────────────────────────────────
- name: Report PXE boot results
  hosts: bmc
  connection: local
  gather_facts: false
  tags: [pxeboot]
  pre_tasks:
    - name: Skip if PXE boot disabled
      ansible.builtin.meta: end_play
      when: hostvars['localhost']['pxe_boot_skip'] | default(false) | bool
  tasks:
    - name: Report iDRAC reboot failure
      ansible.builtin.debug:
        msg: "[FAILED] {{ inventory_hostname }}: {{ reboot_status }}"
      when: reboot_failed

    - name: Show passed iDRACs
      ansible.builtin.debug:
        msg: "[OK] {{ inventory_hostname }}: {{ reboot_status }}"
      when: not reboot_failed

    - name: Fail if reboot failed (when node-registration disabled)
      ansible.builtin.fail:
        msg: "{{ reboot_status }}"
      when:
        - reboot_failed
        - not (hostvars['localhost']['enable_node_registration'] | default(true) | bool)

# ─────────────────────────────────────────────────────────────────────────
# Play 6: Filter node-registration target list (exclude failed PXE boots)
# Build the failed list on localhost by iterating over BMC hosts and
# checking their reboot_failed flag. This avoids the race condition
# that occurs when multiple hosts delegate set_fact to localhost
# simultaneously (only the last write wins).
# ─────────────────────────────────────────────────────────────────────────
- name: Filter node-registration target list
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [pxeboot]
  pre_tasks:
    - name: Skip if PXE boot disabled
      ansible.builtin.meta: end_play
      when: hostvars['localhost']['pxe_boot_skip'] | default(false) | bool
  tasks:
    - name: Collect all PXE-boot-failed BMC IPs from hostvars
      ansible.builtin.set_fact:
        pxe_boot_failed_bmc_ips: "{{ pxe_boot_failed_bmc_ips + [item] }}"
      loop: "{{ groups['bmc'] }}"
      when:
        - hostvars[item]['reboot_failed'] is defined
        - hostvars[item]['reboot_failed'] | bool

    - name: Filter node-registration verification block
      when: enable_node_registration | default(true) | bool
      block:
        - name: Filter out failed PXE boots from node-registration target list
          ansible.builtin.set_fact:
            target_node_admin_ips: "{{ target_node_admin_ips | default([]) | difference(failed_admin_ips | default([])) }}"
            cacheable: true
          vars:
            failed_admin_ips: "{{ pxe_boot_failed_bmc_ips | default([]) | map('extract', hostvars, 'admin_ip') | select('defined') | list }}"

        - name: Report node-registration target list
          ansible.builtin.debug:
            msg: >-
              Node-registration verification will wait for {{ target_node_admin_ips | length }} nodes
              ({{ pxe_boot_failed_bmc_ips | default([]) | length }} excluded due to PXE boot failure)

        - name: Skip node-registration when no nodes to verify
          ansible.builtin.debug:
            msg: "[Node-Registration] Skipping — no nodes to verify (all PXE boots failed)"
          when: target_node_admin_ips | default([]) | length == 0

        - name: Wait for nodes to begin cloud-init
          ansible.builtin.pause:
            minutes: "{{ node_registration_pause_minutes }}"
            prompt: >-
              Waiting {{ node_registration_pause_minutes }} minutes for nodes
              to boot and begin cloud-init before parallel verification...
          when:
            - target_node_admin_ips | default([]) | length > 0
            - node_registration_pause_minutes | int > 0

# ─────────────────────────────────────────────────────────────────────────
# Play 7: Parallel node-registration verification
# ─────────────────────────────────────────────────────────────────────────
- name: Verify cloud-init node-registration
  hosts: node_registration_targets
  connection: local
  gather_facts: false
  tags: [pxeboot]
  pre_tasks:
    - name: Skip node when registration verification is disabled or PXE boot failed
      ansible.builtin.meta: end_host
      when:
        - >-
          not (hostvars['localhost']['enable_node_registration'] | default(true) | bool)
          or bmc_ip in (hostvars['localhost']['pxe_boot_failed_bmc_ips'] | default([]))
  roles:
    - role: verify_node_registration

# ─────────────────────────────────────────────────────────────────────────
# Play 8: Final reporting
# ─────────────────────────────────────────────────────────────────────────
- name: Final PXE boot and node-registration report
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [pxeboot]
  pre_tasks:
    - name: Skip if PXE boot disabled
      ansible.builtin.meta: end_play
      when: hostvars['localhost']['pxe_boot_skip'] | default(false) | bool
  tasks:
    - name: Final report block
      block:
        - name: Ensure output directory exists
          ansible.builtin.file:
            path: "{{ orchestrator_output_dir }}"
            state: directory
            mode: "0755"

        - name: Check for provisioning phase report
          ansible.builtin.stat:
            path: "{{ orchestrator_output_dir }}/provisioning_report.yml"
          register: pxeboot_provisioning_report_stat

        - name: Load provisioning phase report
          ansible.builtin.slurp:
            src: "{{ orchestrator_output_dir }}/provisioning_report.yml"
          register: pxeboot_provisioning_report_raw
          when: pxeboot_provisioning_report_stat.stat.exists

        - name: Decode provisioning phase report data
          ansible.builtin.set_fact:
            pxeboot_provisioning_report_candidate: >-
              {{ (pxeboot_provisioning_report_raw.content | b64decode | from_yaml)
                 if pxeboot_provisioning_report_stat.stat.exists else {} }}

        - name: Retain provisioning report for the active inventory
          ansible.builtin.set_fact:
            pxeboot_provisioning_report: >-
              {{ pxeboot_provisioning_report_candidate
                 if pxeboot_provisioning_report_candidate | type_debug == 'dict'
                 and pxeboot_provisioning_report_candidate.inventory_source | default('')
                     == pxeboot_inventory_source
                 else {} }}

        - name: Collect structured node-registration results
          ansible.builtin.set_fact:
            node_registration_results_by_bmc: >-
              {{ node_registration_results_by_bmc
                 | combine({hostvars[item]['bmc_ip']: hostvars[item]['verify_node_registration_result']}) }}
          loop: "{{ groups['node_registration_targets'] | default([]) }}"
          when:
            - enable_node_registration | default(true) | bool
            - hostvars[item]['verify_node_registration_result'] is defined

        - name: Record missing node-registration results as failures
          ansible.builtin.set_fact:
            node_registration_results_by_bmc: >-
              {{ node_registration_results_by_bmc
                 | combine({item: missing_result}) }}
          vars:
            missing_result:
              admin_ip: "{{ hostvars[item].admin_ip }}"
              bmc_ip: "{{ item }}"
              xname: "{{ hostvars[item].xname | default('') }}"
              hostname: "{{ hostvars[item].hostname_node | default('') }}"
              service_tag: "{{ hostvars[item].service_tag | default('') }}"
              status: failed
              state: verification_result_missing
              detail: Node-registration verification did not return a result
              terminal: true
              attempts: 0
              verification_method: ssh_cloud_init
              cloud_init: {}
          loop: "{{ groups['bmc'] }}"
          loop_control:
            label: "{{ item }}"
          when:
            - enable_node_registration | default(true) | bool
            - item not in pxe_boot_failed_bmc_ips
            - item not in node_registration_results_by_bmc

        - name: Collect node-registration failures
          ansible.builtin.set_fact:
            node_registration_failed_bmc_ips: "{{ node_registration_failed_bmc_ips + [item.key] }}"
          loop: "{{ node_registration_results_by_bmc | dict2items }}"
          loop_control:
            label: "{{ item.key }}"
          when: item.value.status != 'success'

        - name: Build failed nodes list with details
          ansible.builtin.set_fact:
            failed_nodes_list: "{{ failed_nodes_list | default([]) + [node_detail] }}"
          loop: "{{ (pxe_boot_failed_bmc_ips | default([])) + (node_registration_failed_bmc_ips | default([])) }}"
          vars:
            node_detail:
              bmc_ip: "{{ item }}"
              admin_ip: "{{ hostvars[item].admin_ip | default('N/A') }}"
              xname: "{{ hostvars[item].xname | default('') }}"
              hostname: "{{ hostvars[item].hostname_node | default('N/A') }}"
              service_tag: "{{ hostvars[item].service_tag | default('N/A') }}"
              failure_stage: "{{ 'pxe_boot' if item in (pxe_boot_failed_bmc_ips | default([])) else 'node_registration' }}"
              status: "failed"
              verification_method: >-
                {{ 'not_started' if item in (pxe_boot_failed_bmc_ips | default([]))
                   else node_registration_results_by_bmc[item].get('verification_method', 'ssh_cloud_init') }}
              error: >-
                {{ hostvars[item].reboot_status
                   if item in (pxe_boot_failed_bmc_ips | default([]))
                   else node_registration_results_by_bmc[item].detail }}
              verification_state: >-
                {{ 'not_started'
                   if item in (pxe_boot_failed_bmc_ips | default([]))
                   else node_registration_results_by_bmc[item].state }}
              cloud_init: >-
                {{ {} if item in (pxe_boot_failed_bmc_ips | default([]))
                   else node_registration_results_by_bmc[item].get('cloud_init', {}) }}

        - name: Write failed_nodes.json output file
          ansible.builtin.copy:
            content: "{{ failed_nodes_report | to_nice_json }}"
            dest: "{{ orchestrator_output_dir }}/failed_nodes.json"
            mode: "0644"
          vars:
            failed_nodes_report:
              schema_version: "1.0"
              phase: pxeboot
              run_id: "{{ ansible_date_time.epoch }}"
              timestamp: "{{ ansible_date_time.iso8601 }}"
              total_nodes: "{{ groups['bmc'] | length }}"
              failure_count: "{{ (failed_nodes_list | default([])) | length }}"
              success_count: "{{ groups['bmc'] | length - ((failed_nodes_list | default([])) | length) }}"
              verification_enabled: "{{ enable_node_registration | bool }}"
              unverified_count: >-
                {{ 0 if enable_node_registration | bool
                   else groups['bmc'] | length - (pxe_boot_failed_bmc_ips | length) }}
              inventory_source: "{{ pxeboot_inventory_source }}"
              failed_nodes: "{{ failed_nodes_list | default([]) }}"

        - name: Report total failures
          ansible.builtin.debug:
            msg: >-
              PXE Boot Summary:
              - Total nodes: {{ groups['bmc'] | length }}
              - PXE boot failed: {{ pxe_boot_failed_bmc_ips | default([]) | length }}
              - Node-registration failed: {{ node_registration_failed_bmc_ips | default([]) | length }}
              - Completed without failure: {{
                  groups['bmc'] | length
                  - (pxe_boot_failed_bmc_ips | default([]) | length)
                  - (node_registration_failed_bmc_ips | default([]) | length)
                }}
              - Verification: {{ 'enabled' if enable_node_registration | bool else 'disabled' }}
              - Unverified: {{
                  0 if enable_node_registration | bool
                  else groups['bmc'] | length - (pxe_boot_failed_bmc_ips | length)
                }}
              - Output: {{ orchestrator_output_dir }}/failed_nodes.json

        - name: Build per-node status list
          ansible.builtin.set_fact:
            all_nodes_status: "{{ all_nodes_status | default([]) + [node_entry] }}"
          loop: "{{ groups['bmc'] }}"
          vars:
            _admin_ip: "{{ hostvars[item].admin_ip | default('N/A') }}"
            _xname: "{{ hostvars[item].xname | default('') }}"
            _hostname: "{{ hostvars[item].hostname_node | default('N/A') }}"
            _svc_tag: "{{ hostvars[item].service_tag | default('N/A') }}"
            _registration_result: "{{ node_registration_results_by_bmc.get(item, {}) }}"
            _pxe_status: >-
              {{ 'failed'
                 if item in (pxe_boot_failed_bmc_ips | default([]))
                 or item in (node_registration_failed_bmc_ips | default([]))
                 else ('success' if enable_node_registration | bool
                       else 'pxe_initiated_unverified') }}
            _failure_stage: >-
              {{ 'pxe_boot'
                 if item in (pxe_boot_failed_bmc_ips | default([]))
                 else ('node_registration'
                       if item in (node_registration_failed_bmc_ips | default([]))
                       else '') }}
            _verification_state: >-
              {{ 'not_started'
                 if item in (pxe_boot_failed_bmc_ips | default([]))
                 else (_registration_result.get('state', 'not_requested')
                       if enable_node_registration | bool else 'disabled') }}
            _detail: >-
              {{ hostvars[item].reboot_status
                 if item in (pxe_boot_failed_bmc_ips | default([]))
                 else (_registration_result.get('detail', '')
                       if enable_node_registration | bool
                       else 'PXE boot was initiated; operating-system boot and cloud-init were not verified') }}
            node_entry:
              bmc_ip: "{{ item }}"
              admin_ip: "{{ _admin_ip }}"
              xname: "{{ _xname }}"
              hostname: "{{ _hostname }}"
              service_tag: "{{ _svc_tag }}"
              status: "{{ _pxe_status }}"
              failure_reason: >-
                {{ 'not registered in SMD'
                   if pxeboot_provisioning_report | default({}) | length > 0
                   and _xname | length > 0
                   and _xname in (pxeboot_provisioning_report.missing_nodes | default([]))
                   else '' }}
              failure_stage: "{{ _failure_stage }}"
              verification_state: "{{ _verification_state }}"
              verification_method: >-
                {{ 'not_started'
                   if item in (pxe_boot_failed_bmc_ips | default([]))
                   else (_registration_result.get('verification_method', 'ssh_cloud_init')
                         if enable_node_registration | bool else 'disabled') }}
              detail: "{{ _detail }}"
              cloud_init: "{{ _registration_result.get('cloud_init', {}) }}"
              provisioning:
                status: >-
                  {{ 'unknown'
                     if pxeboot_provisioning_report | default({}) | length == 0
                     or _xname | length == 0
                     else ('failed'
                           if _xname in (pxeboot_provisioning_report.missing_nodes | default([]))
                           else 'success') }}
                failure_reason: >-
                  {{ 'not registered in SMD'
                     if pxeboot_provisioning_report | default({}) | length > 0
                     and _xname | length > 0
                     and _xname in (pxeboot_provisioning_report.missing_nodes | default([]))
                     else '' }}
              pxeboot:
                status: "{{ _pxe_status }}"
                failure_stage: "{{ _failure_stage }}"
                verification_state: "{{ _verification_state }}"
                verification_method: >-
                  {{ 'not_started'
                     if item in (pxe_boot_failed_bmc_ips | default([]))
                     else (_registration_result.get('verification_method', 'ssh_cloud_init')
                           if enable_node_registration | bool else 'disabled') }}
                detail: "{{ _detail }}"
                cloud_init: "{{ _registration_result.get('cloud_init', {}) }}"

        - name: Compute overall status
          ansible.builtin.set_fact:
            orchestrator_overall_status: >-
              {{ 'failed' if (failed_nodes_list | default([]) | length > 0) else 'success' }}

        - name: Build PXE phase status report
          ansible.builtin.set_fact:
            pxeboot_status_report:
              schema_version: "1.0"
              phase: pxeboot
              run_id: "{{ ansible_date_time.epoch }}"
              overall_status: "{{ orchestrator_overall_status }}"
              timestamp: "{{ ansible_date_time.iso8601 }}"
              total_nodes: "{{ groups['bmc'] | length }}"
              success_count: "{{ groups['bmc'] | length | int - (failed_nodes_list | default([]) | length | int) }}"
              failure_count: "{{ (failed_nodes_list | default([])) | length }}"
              verification_enabled: "{{ enable_node_registration | bool }}"
              unverified_count: >-
                {{ 0 if enable_node_registration | bool
                   else groups['bmc'] | length - (pxe_boot_failed_bmc_ips | length) }}
              custom_inventory: "{{ pxeboot_using_custom_inventory | default(false) | bool }}"
              inventory_source: "{{ pxeboot_inventory_source }}"
              nodes: "{{ all_nodes_status | default([]) }}"

        - name: Write pxeboot_status.yml
          ansible.builtin.copy:
            content: "{{ pxeboot_status_report | to_nice_yaml }}"
            dest: "{{ orchestrator_output_dir }}/pxeboot_status.yml"
            mode: "0644"

        - name: Build aggregate orchestrator status report
          ansible.builtin.set_fact:
            orchestrator_status_report:
              schema_version: "1.0"
              run_id: "{{ ansible_date_time.epoch }}"
              overall_status: >-
                {{ 'failed'
                   if orchestrator_overall_status == 'failed'
                   or pxeboot_provisioning_report.missing_nodes | default([]) | length > 0
                   else 'success' }}
              last_completed_phase: pxeboot
              timestamp: "{{ ansible_date_time.iso8601 }}"
              total_nodes: "{{ groups['bmc'] | length }}"
              success_count: "{{ groups['bmc'] | length | int - (failed_nodes_list | default([]) | length | int) }}"
              failure_count: "{{ (failed_nodes_list | default([])) | length }}"
              verification_enabled: "{{ enable_node_registration | bool }}"
              unverified_count: >-
                {{ 0 if enable_node_registration | bool
                   else groups['bmc'] | length - (pxe_boot_failed_bmc_ips | length) }}
              custom_inventory: "{{ pxeboot_using_custom_inventory | default(false) | bool }}"
              nodes: "{{ all_nodes_status | default([]) }}"
              inventory_source: "{{ pxeboot_inventory_source }}"
              phases:
                provisioning:
                  status: >-
                    {{ 'not_run'
                       if pxeboot_provisioning_report | default({}) | length == 0
                       else ('failed'
                             if pxeboot_provisioning_report.missing_nodes | default([]) | length > 0
                             else 'success') }}
                  total_nodes: >-
                    {{ pxeboot_provisioning_report.total_expected_nodes | default(0) }}
                  success_count: >-
                    {{ (pxeboot_provisioning_report.total_expected_nodes | default(0) | int)
                       - (pxeboot_provisioning_report.missing_nodes | default([]) | length) }}
                  failure_count: >-
                    {{ pxeboot_provisioning_report.missing_nodes | default([]) | length }}
                  timestamp: "{{ pxeboot_provisioning_report.timestamp | default('') }}"
                  report: provisioning_report.yml
                pxeboot:
                  status: "{{ orchestrator_overall_status }}"
                  total_nodes: "{{ groups['bmc'] | length }}"
                  success_count: "{{ groups['bmc'] | length | int - (failed_nodes_list | default([]) | length | int) }}"
                  failure_count: "{{ (failed_nodes_list | default([])) | length }}"
                  unverified_count: >-
                    {{ 0 if enable_node_registration | bool
                       else groups['bmc'] | length - (pxe_boot_failed_bmc_ips | length) }}
                  timestamp: "{{ ansible_date_time.iso8601 }}"
                  report: pxeboot_status.yml
              artifacts:
                provisioning_report: provisioning_report.yml
                pxeboot_status: pxeboot_status.yml
                failed_nodes: failed_nodes.json

        - name: Write aggregate orchestrator_status.yml
          ansible.builtin.copy:
            content: "{{ orchestrator_status_report | to_nice_yaml }}"
            dest: "{{ orchestrator_output_dir }}/orchestrator_status.yml"
            mode: "0644"

        # ── BuildStream post-processing (runs before fail to persist results) ──
        - name: BuildStream post-processing
          when:
            - enable_build_stream | default(false) | bool
            - job_id is defined
            - job_id | string | length > 0
          block:
            - name: Run BSM write_node_results
              ansible.builtin.include_role:
                name: pxe_buildstream_manager
                tasks_from: write_node_results.yml

            - name: Run BSM update_restart_state
              ansible.builtin.include_role:
                name: pxe_buildstream_manager
                tasks_from: update_restart_state.yml

            - name: Run BSM register GitLab host
              ansible.builtin.include_role:
                name: pxe_buildstream_manager
                tasks_from: gitlab_host.yml

            - name: Run BSM upload failed_nodes.json to GitLab
              ansible.builtin.include_role:
                name: pxe_buildstream_manager
                tasks_from: upload_to_gitlab.yml
          rescue:
            - name: Log BSM post-processing failure (non-fatal)
              ansible.builtin.debug:
                msg: >-
                  [BSM] Post-processing failed but PXE boot results are preserved.
                  Error: {{ ansible_failed_result | default('unknown') }}

        - name: Fail if any nodes failed PXE boot or node-registration
          ansible.builtin.fail:
            msg: >-
              Node failures detected.
              PXE boot failures: {{ pxe_boot_failed_bmc_ips | default([]) | join(', ') or 'none' }}
              Node-registration failures: {{ node_registration_failed_bmc_ips | default([]) | join(', ') or 'none' }}
          when: (pxe_boot_failed_bmc_ips | default([]) | length > 0) or (node_registration_failed_bmc_ips | default([]) | length > 0)
