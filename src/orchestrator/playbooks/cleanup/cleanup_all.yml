---
# Simple Cleanup All Components
# Direct execution without complex tag filtering

- name: Cleanup All Components
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    skip_approval: "{{ lookup('env', 'SKIP_APPROVAL') | default('false', true) | bool }}"
    dry_run: "{{ lookup('env', 'DRY_RUN') | default('false', true) | bool }}"

  tasks:
    - name: Display cleanup information
      ansible.builtin.debug:
        msg: |
          ============================================================
          Full Cleanup All Components
          ============================================================
          Skip Approval: {{ skip_approval }}
          Dry Run: {{ dry_run }}
          ============================================================

    - name: Set role path
      ansible.builtin.set_fact:
        role_path: "{{ playbook_dir | dirname | dirname }}/roles/cleanup"

    - name: Cleanup OpenCHAMI
      ansible.builtin.include_tasks: "{{ role_path }}/components/openchami/tasks/cleanup.yml"

    - name: Cleanup OpenLDAP
      ansible.builtin.include_tasks: "{{ role_path }}/components/openldap/tasks/cleanup.yml"

    - name: Cleanup Storage Mounts (must be before Slurm/K8s to unmount NFS first)
      ansible.builtin.include_tasks: "{{ role_path }}/components/storage_mounts/tasks/cleanup.yml"

    - name: Cleanup Slurm (after unmounting NFS)
      ansible.builtin.include_tasks: "{{ role_path }}/components/slurm/tasks/cleanup.yml"

    - name: Cleanup K8s (after unmounting NFS)
      ansible.builtin.include_tasks: "{{ role_path }}/components/k8s/tasks/cleanup.yml"

    - name: Cleanup Artifacts
      ansible.builtin.include_tasks: "{{ role_path }}/components/artifacts/tasks/cleanup.yml"

    - name: Display cleanup completion
      ansible.builtin.debug:
        msg: |
          ============================================================
          Full Cleanup Completed
          ============================================================
          Status: completed
          Components: 6
          ============================================================
