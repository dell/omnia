# Cleanup OpenCHAMI --- Remove OpenCHAMI services, containers, and artifacts
# Can be run standalone or imported by orchestrator.yml
#
# Responsibilities:
#   1. Stop and disable OpenCHAMI services (openchami.target)
#   2. Remove OpenCHAMI containers and pods
#   3. Remove OpenCHAMI configuration directories
#   4. Remove OpenCHAMI workdir (nodes, inventories, boot, metadata-service)
#   5. Remove OpenCHAMI logs
#   6. Remove generated inventories
#   7. Revert DNS/resolv.conf changes
#   8. Remove orchestrator artifacts (FG config, state, output dir)
#   9. Remove upgrade lock file
#  10. Remove credentials (opt-in, tag-gated)
#
# Safe and idempotent. Ignores already-removed resources gracefully.

- name: Cleanup OpenCHAMI services and data
  hosts: oim
  connection: ssh
  gather_facts: true
  vars:
    openchami_config_dir: /etc/openchami
    openchami_share_dir: /opt/omnia/openchami
    openchami_log_dir: /opt/omnia/log/openchami
    openchami_work_dir: "{{ hostvars['localhost']['oim_shared_path'] | default('/opt/omnia') }}/omnia/openchami/workdir"
    ochami_dir: /etc/ochami
  tasks:
    - name: Stop OpenCHAMI services
      ansible.builtin.systemd:
        name: openchami.target
        state: stopped
      failed_when: false

    - name: Disable OpenCHAMI target
      ansible.builtin.systemd:
        name: openchami.target
        enabled: false
      failed_when: false

    - name: Wait for services to stop
      ansible.builtin.pause:
        seconds: 5

    - name: Remove OpenCHAMI containers
      ansible.builtin.shell: |
        set -o pipefail
        podman ps -a --filter "label=io.openchami" --format "{{ '{{' }}.ID{{ '}}' }}" | xargs -r podman rm -f
      changed_when: true
      failed_when: false

    - name: Remove OpenCHAMI pods
      ansible.builtin.shell: |
        set -o pipefail
        podman pod ls --filter "label=io.openchami" --format "{{ '{{' }}.ID{{ '}}' }}" | xargs -r podman pod rm -f
      changed_when: true
      failed_when: false

    - name: Remove OpenCHAMI configuration directory
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ openchami_config_dir }}"
        - "{{ ochami_dir }}"
      failed_when: false

    - name: Remove OpenCHAMI workdir (nodes, inventories, boot, metadata-service)
      ansible.builtin.file:
        path: "{{ openchami_work_dir }}"
        state: absent
      failed_when: false

    - name: Remove OpenCHAMI logs
      ansible.builtin.file:
        path: "{{ openchami_log_dir }}"
        state: absent
      failed_when: false

    - name: Remove generated inventories
      ansible.builtin.file:
        path: "{{ hostvars['localhost']['orchestrator_output_dir'] | default('/opt/omnia/output/project_default/orchestrator') }}/inventories"
        state: absent
      failed_when: false

    - name: Revert resolv.conf DNS changes (unlock and restore)
      block:
        - name: Unlock resolv.conf
          ansible.builtin.command: chattr -i /etc/resolv.conf
          changed_when: true
          failed_when: false

        - name: Restore NetworkManager-managed resolv.conf
          ansible.builtin.command: nmcli general reload dns-rc
          changed_when: true
          failed_when: false

- name: Cleanup orchestrator artifacts
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Remove generated functional groups config
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/omnia/.data/functional_groups_config.yml
        - "{{ orchestrator_output_dir | default('/opt/omnia/output/project_default/orchestrator') }}/orchestrator_state.yml"

    - name: Remove orchestrator output directory
      ansible.builtin.file:
        path: "{{ orchestrator_output_dir | default('/opt/omnia/output/project_default/orchestrator') }}"
        state: absent

    - name: Remove upgrade lock file if present
      ansible.builtin.file:
        path: "/opt/omnia/.data/upgrade_in_progress.lock"
        state: absent

    - name: OpenCHAMI cleanup completed
      ansible.builtin.debug:
        msg: >-
          OpenCHAMI cleanup completed. Services stopped, containers removed,
          configuration and workdir cleaned. Credentials were NOT removed
          (use --tags credentials to include credential cleanup).

- name: Cleanup credentials (opt-in)
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Remove credential files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ input_project_dir }}/omnia_config_credentials.yml"
        - "{{ input_project_dir }}/.omnia_config_credentials_key"

    - name: Credentials cleanup completed
      ansible.builtin.debug:
        msg: "Credential files removed from {{ input_project_dir }}."
  tags:
    - never
