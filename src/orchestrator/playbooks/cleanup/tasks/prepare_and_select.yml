---
# Shared cleanup logic used by both orchestrator cleanup entry points:
#   - cleanup_full.yml         (imported by orchestrator.yml; cleanup / cleanup_credentials)
#   - cleanup_orchestrator.yml (standalone; component-level tags)
#
# Deliberately carries NO tags of its own. Tags are supplied by the
# including task in each entry point, which is what keeps component-level
# tags (slurm, k8s, ...) reachable standalone but not via orchestrator.yml.

- name: Resolve configuration from environment
  ansible.builtin.set_fact:
    omnia_data_path: "{{ lookup('env', 'OMNIA_DATA_PATH') | default('/opt/omnia', true) }}"
    project_name: "{{ lookup('env', 'OMNIA_PROJECT_NAME') | default('project_default', true) }}"
    cacheable: true

- name: Resolve Orchestrator data path
  ansible.builtin.set_fact:
    orchestrator_data_path: >-
      {{ lookup('env', 'ORCHESTRATOR_DATA_PATH')
         | default(omnia_data_path + '/orchestrator', true) }}
    cacheable: true

- name: Set input_project_dir and output_project_dir
  ansible.builtin.set_fact:
    input_project_dir: >-
      {{ orchestrator_data_path }}/input/{{ project_name }}
    output_project_dir: >-
      {{ orchestrator_data_path }}/output/{{ project_name }}
    omnia_project_input_dir: >-
      {{ orchestrator_data_path }}/input/{{ project_name }}
    orchestrator_output_dir: >-
      {{ orchestrator_data_path }}/output/{{ project_name }}
    cacheable: true

- name: Display cleanup information
  ansible.builtin.debug:
    msg: |
      ============================================================
      Orchestrator Cleanup
      ============================================================
      Tags: {{ ansible_run_tags | join(', ') if ansible_run_tags else 'None' }}
      Skip Approval: {{ skip_approval }}
      Dry Run: {{ dry_run }}
      ============================================================

- name: Load cleanup configuration
  ansible.builtin.include_vars:
    file: "{{ playbook_dir | dirname | dirname }}/roles/cleanup/config/default_cleanup.yml"

# 'cleanup' means "every enabled component". Component names are matched
# literally, so 'cleanup' is translated to the sentinel 'all' here.
- name: Set effective tags
  ansible.builtin.set_fact:
    effective_tags: >-
      {{ cleanup_requested_components
         if cleanup_requested_components | default([]) | length > 0
         else ['all']
         if ('cleanup' in ansible_run_tags and
             'cleanup_credentials' not in ansible_run_tags)
         else ansible_run_tags }}

- name: Filter components based on tags
  ansible.builtin.set_fact:
    target_components: "{{ cleanup_components | dict2items | selectattr('key', 'in', effective_tags) | items2dict }}"
  when:
    - effective_tags | length > 0
    - effective_tags[0] != 'all'
    - cleanup_components is defined

- name: Use all components when 'all' tag
  ansible.builtin.set_fact:
    target_components: "{{ cleanup_components }}"
  when:
    - effective_tags | length == 0 or effective_tags[0] == 'all'
    - cleanup_components is defined

- name: Add credentials component when cleanup_credentials tag is used
  ansible.builtin.set_fact:
    target_components: >-
      {{ target_components | combine({'credentials': cleanup_components.credentials
      | combine({'enabled': true}, recursive=false)}, recursive=false) }}
  when:
    - ansible_run_tags is defined
    - ansible_run_tags | select('equalto', 'cleanup_credentials') | list | length > 0
    - target_components is defined
    - target_components.keys() | list | select('equalto', 'credentials') | list | length == 0

- name: Add all components when both cleanup and cleanup_credentials are present
  ansible.builtin.set_fact:
    target_components: >-
      {{ cleanup_components | combine({'credentials': cleanup_components.credentials
      | combine({'enabled': true}, recursive=false)}, recursive=false) }}
  when:
    - ansible_run_tags is defined
    - ansible_run_tags | select('equalto', 'cleanup') | list | length > 0
    - ansible_run_tags | select('equalto', 'cleanup_credentials') | list | length > 0

- name: Validate cleanup configuration
  ansible.builtin.assert:
    that:
      - target_components is defined
    fail_msg: "Invalid cleanup configuration: target_components not found"

- name: Fail if no components selected
  ansible.builtin.fail:
    msg: "No components selected for cleanup"
  when: target_components.keys() | list | length == 0

- name: Display selected components
  ansible.builtin.debug:
    msg: "Components to cleanup: {{ target_components.keys() | list | join(', ') }}"

# With 'all', honour each component's enabled flag (this is what keeps
# credentials out of a plain --tags cleanup run). With explicit component
# tags the user asked for them by name, so run them regardless.
- name: Filter enabled components
  ansible.builtin.set_fact:
    enabled_components: "{{ target_components | dict2items | selectattr('value.enabled', 'equalto', true) | items2dict }}"
  when: effective_tags | length == 0 or effective_tags[0] == 'all'

- name: Use all selected components when specific tags
  ansible.builtin.set_fact:
    enabled_components: "{{ target_components }}"
  when: effective_tags | length > 0 and effective_tags[0] != 'all'

- name: Check Omnia configuration for full cleanup selection
  ansible.builtin.stat:
    path: "{{ omnia_project_input_dir }}/omnia_config.yml"
  register: cleanup_selection_omnia_config_file
  when: effective_tags | length == 0 or effective_tags[0] == 'all'

- name: Check storage configuration for full cleanup selection
  ansible.builtin.stat:
    path: "{{ omnia_project_input_dir }}/storage_config.yml"
  register: cleanup_selection_storage_config_file
  when: effective_tags | length == 0 or effective_tags[0] == 'all'

- name: Load Omnia configuration for full cleanup selection
  ansible.builtin.include_vars:
    file: "{{ omnia_project_input_dir }}/omnia_config.yml"
    name: cleanup_selection_omnia_config
  when:
    - effective_tags | length == 0 or effective_tags[0] == 'all'
    - cleanup_selection_omnia_config_file.stat.exists

- name: Load storage configuration for full cleanup selection
  ansible.builtin.include_vars:
    file: "{{ omnia_project_input_dir }}/storage_config.yml"
    name: cleanup_selection_storage_config
  when:
    - effective_tags | length == 0 or effective_tags[0] == 'all'
    - cleanup_selection_storage_config_file.stat.exists

- name: Resolve shared-storage references for full cleanup selection
  ansible.builtin.set_fact:
    cleanup_selection_mounts: >-
      {{ (cleanup_selection_storage_config | default({})).mounts
         | default([], true) }}
    cleanup_slurm_storage_name: >-
      {{ ((cleanup_selection_omnia_config | default({})).slurm_cluster
          | default([], true) | first | default({})).nfs_storage_name
          | default('', true) }}
    cleanup_k8s_storage_name: >-
      {{ ((cleanup_selection_omnia_config | default({})).service_k8s_cluster
          | default([], true) | first | default({})).nfs_storage_name
          | default('', true) }}
  when: effective_tags | length == 0 or effective_tags[0] == 'all'

- name: Match configured shared-storage entries
  ansible.builtin.set_fact:
    cleanup_slurm_storage_matches: >-
      {{ cleanup_selection_mounts
         | selectattr('name', 'equalto', cleanup_slurm_storage_name)
         | list }}
    cleanup_k8s_storage_matches: >-
      {{ cleanup_selection_mounts
         | selectattr('name', 'equalto', cleanup_k8s_storage_name)
         | list }}
  when: effective_tags | length == 0 or effective_tags[0] == 'all'

- name: Resolve configured shared-storage endpoints
  ansible.builtin.set_fact:
    cleanup_slurm_configured: >-
      {{ cleanup_slurm_storage_name | length > 0 and
         cleanup_slurm_storage_matches | length == 1 }}
    cleanup_k8s_configured: >-
      {{ ((cleanup_selection_omnia_config | default({})).service_k8s_cluster
          | default([], true) | length) > 0 and
         cleanup_k8s_storage_name | length > 0 and
         cleanup_k8s_storage_matches | length == 1 }}
    cleanup_slurm_storage_source: >-
      {{ (cleanup_slurm_storage_matches | first | default({})).source
         | default('', true) }}
    cleanup_slurm_mount_point: >-
      {{ (cleanup_slurm_storage_matches | first | default({})).mount_point
         | default('', true) }}
    cleanup_k8s_storage_source: >-
      {{ (cleanup_k8s_storage_matches | first | default({})).source
         | default('', true) }}
    cleanup_k8s_mount_point: >-
      {{ (cleanup_k8s_storage_matches | first | default({})).mount_point
         | default('', true) }}
  when: effective_tags | length == 0 or effective_tags[0] == 'all'

- name: Resolve shared-storage server and export paths
  ansible.builtin.set_fact:
    cleanup_slurm_storage_server: >-
      {{ cleanup_slurm_storage_source.split(':')[0]
         if ':' in cleanup_slurm_storage_source else '' }}
    cleanup_slurm_export_path: >-
      {{ cleanup_slurm_storage_source.split(':')[1]
         if ':' in cleanup_slurm_storage_source else '' }}
    cleanup_k8s_storage_server: >-
      {{ cleanup_k8s_storage_source.split(':')[0]
         if ':' in cleanup_k8s_storage_source else '' }}
    cleanup_k8s_export_path: >-
      {{ cleanup_k8s_storage_source.split(':')[1]
         if ':' in cleanup_k8s_storage_source else '' }}
  when: effective_tags | length == 0 or effective_tags[0] == 'all'

- name: Read local OIM addresses for shared-storage detection
  ansible.builtin.command:
    cmd: hostname --all-ip-addresses
  register: cleanup_selection_local_addresses
  changed_when: false
  when: effective_tags | length == 0 or effective_tags[0] == 'all'

- name: Collect shared-storage deployment evidence
  ansible.builtin.set_fact:
    cleanup_active_mount_pairs: >-
      {{ lookup('file', '/proc/mounts').splitlines()
         | map('regex_replace', '^(\S+)\s+(\S+)\s+.*$', '\1 \2')
         | list }}
    cleanup_fstab_pairs: >-
      {{ lookup('file', '/etc/fstab', errors='ignore').splitlines()
         | reject('match', '^\s*(#|$)')
         | map('regex_replace', '^(\S+)\s+(\S+)\s+.*$', '\1 \2')
         | list }}
    cleanup_local_export_paths: >-
      {{ lookup('file', '/etc/exports', errors='ignore').splitlines()
         | reject('match', '^\s*(#|$)')
         | map('regex_replace', '^\s*(\S+).*$', '\1')
         | list }}
    cleanup_local_nfs_hosts: >-
      {{ (['localhost', '127.0.0.1', '::1',
           inventory_hostname | default(''), ansible_host | default(''),
           host_name | default(''), oim_node_name | default(''),
           ansible_hostname | default(''), ansible_fqdn | default('')]
          + (cleanup_selection_local_addresses.stdout | default('')).split())
         | reject('equalto', '') | unique | list }}
  when: effective_tags | length == 0 or effective_tags[0] == 'all'

- name: Detect deployed shared-storage components
  ansible.builtin.set_fact:
    cleanup_slurm_deployed: >-
      {{ cleanup_slurm_configured | bool and
         ((cleanup_slurm_storage_source ~ ' ' ~ cleanup_slurm_mount_point)
          in cleanup_active_mount_pairs or
          (cleanup_slurm_storage_source ~ ' ' ~ cleanup_slurm_mount_point)
          in cleanup_fstab_pairs or
          (cleanup_slurm_storage_server in cleanup_local_nfs_hosts and
           cleanup_slurm_export_path in cleanup_local_export_paths)) }}
    cleanup_k8s_deployed: >-
      {{ cleanup_k8s_configured | bool and
         ((cleanup_k8s_storage_source ~ ' ' ~ cleanup_k8s_mount_point)
          in cleanup_active_mount_pairs or
          (cleanup_k8s_storage_source ~ ' ' ~ cleanup_k8s_mount_point)
          in cleanup_fstab_pairs or
          (cleanup_k8s_storage_server in cleanup_local_nfs_hosts and
           cleanup_k8s_export_path in cleanup_local_export_paths)) }}
  when: effective_tags | length == 0 or effective_tags[0] == 'all'

- name: Exclude undeployed Slurm from full cleanup
  ansible.builtin.set_fact:
    enabled_components: >-
      {{ enabled_components | dict2items
         | rejectattr('key', 'equalto', 'slurm') | items2dict }}
  when:
    - effective_tags | length == 0 or effective_tags[0] == 'all'
    - enabled_components.slurm is defined
    - not cleanup_slurm_deployed | bool

- name: Exclude undeployed Kubernetes from full cleanup
  ansible.builtin.set_fact:
    enabled_components: >-
      {{ enabled_components | dict2items
         | rejectattr('key', 'equalto', 'k8s') | items2dict }}
  when:
    - effective_tags | length == 0 or effective_tags[0] == 'all'
    - enabled_components.k8s is defined
    - not cleanup_k8s_deployed | bool

- name: Validate shared-data cleanup selection values
  ansible.builtin.assert:
    that:
      - >-
        cleanup_slurm is not defined or
        (cleanup_slurm | string | trim | lower) in ['true', 'false']
      - >-
        cleanup_k8s is not defined or
        (cleanup_k8s | string | trim | lower) in ['true', 'false']
    fail_msg: >-
      cleanup_slurm and cleanup_k8s accept only true or false. Omit a value
      to receive an interactive confirmation prompt.
  when: >-
    effective_tags | length == 0 or
    effective_tags[0] == 'all' or
    'slurm' in enabled_components or
    'k8s' in enabled_components

# Shared-data decisions are independent in full and component cleanup.
# Explicit true or false values are non-interactive; omitted values require
# confirmation.
- name: Confirm Slurm shared-data cleanup
  ansible.builtin.pause:
    prompt: |
      Permanently delete all Slurm shared data except configured preserved directories,
      then unmount its storage and remove its fstab entries?
      Type 'yes' to delete Slurm data. Any other answer preserves the data;
      the storage is still unmounted and removed from fstab.
  register: cleanup_slurm_confirmation
  when:
    - enabled_components.slurm is defined
    - cleanup_slurm is not defined
    - not skip_approval | bool
    - not dry_run | bool

- name: Confirm Kubernetes shared-data cleanup
  ansible.builtin.pause:
    prompt: |
      Permanently delete all Kubernetes shared data, then unmount its storage
      and remove its fstab entries?
      Type 'yes' to delete Kubernetes data. Any other answer preserves the
      data; the storage is still unmounted and removed from fstab.
  register: cleanup_k8s_confirmation
  when:
    - enabled_components.k8s is defined
    - cleanup_k8s is not defined
    - not skip_approval | bool
    - not dry_run | bool

- name: Resolve shared-data cleanup decisions
  ansible.builtin.set_fact:
    cleanup_slurm_approved: >-
      {{ enabled_components.slurm is defined and
         ((cleanup_slurm | bool) if cleanup_slurm is defined
          else true if (skip_approval | bool or dry_run | bool)
          else (cleanup_slurm_confirmation.user_input | default('')
                | trim | lower) == 'yes') }}
    cleanup_k8s_approved: >-
      {{ enabled_components.k8s is defined and
         ((cleanup_k8s | bool) if cleanup_k8s is defined
          else true if (skip_approval | bool or dry_run | bool)
          else (cleanup_k8s_confirmation.user_input | default('')
                | trim | lower) == 'yes') }}
  when:
    - enabled_components.slurm is defined or enabled_components.k8s is defined

# storage_mounts is not a separate full-cleanup pass. Slurm and Kubernetes
# always invoke scoped mount cleanup themselves, whether data deletion was
# approved or declined.
- name: Remove redundant global storage-mount cleanup from full cleanup
  ansible.builtin.set_fact:
    enabled_components: >-
      {{ (enabled_components | dict2items
          | rejectattr('key', 'equalto', 'storage_mounts')
          | items2dict) }}
  when: effective_tags | length == 0 or effective_tags[0] == 'all'

- name: Display shared-data cleanup decisions
  ansible.builtin.debug:
    msg:
      - "Shared-data cleanup decisions:"
      - >-
        Slurm: {{ 'not configured; skipped'
        if cleanup_slurm_configured is defined and
           not cleanup_slurm_configured | bool
        else 'configured but not deployed on the OIM; skipped'
        if cleanup_slurm_deployed is defined and
           not cleanup_slurm_deployed | bool
        else 'not selected; skipped'
        if enabled_components.slurm is not defined
        else 'delete data, unmount, and remove fstab entries'
        if cleanup_slurm_approved | bool
        else 'preserve data, then unmount and remove fstab entries' }}
      - >-
        Kubernetes: {{ 'not configured; skipped'
        if cleanup_k8s_configured is defined and
           not cleanup_k8s_configured | bool
        else 'configured but not deployed on the OIM; skipped'
        if cleanup_k8s_deployed is defined and
           not cleanup_k8s_deployed | bool
        else 'not selected; skipped'
        if enabled_components.k8s is not defined
        else 'delete data, unmount, and remove fstab entries'
        if cleanup_k8s_approved | bool
        else 'preserve data, then unmount and remove fstab entries' }}
      - >-
        Credentials: {{ 'remove encrypted credential file and vault key'
        if enabled_components.credentials is defined
        else 'preserve credential file and vault key' }}
  when:
    - >-
      effective_tags | length == 0 or
      effective_tags[0] == 'all' or
      enabled_components.slurm is defined or
      enabled_components.k8s is defined

- name: Set execution order (priority descending)
  ansible.builtin.set_fact:
    execution_order: >-
      {{ enabled_components
         | dict2items
         | sort(attribute='value.priority', reverse=true)
         | map(attribute='key')
         | list }}

- name: Display cleanup plan
  ansible.builtin.debug:
    msg: |
      Cleanup Plan:
      =============
      Components: {{ execution_order | join(' -> ') }}
      Total: {{ execution_order | length }}

# Explicit component cleanup retains its existing all-or-nothing confirmation.
# Full cleanup instead uses the independent Slurm and Kubernetes decisions
# above, allowing either data set to be preserved without aborting the rest.
- name: Confirm explicitly selected component cleanup
  ansible.builtin.pause:
    prompt: |
      About to permanently delete data for: {{ execution_order | join(', ') }}
      This includes data on shared NFS storage, which cannot be recovered.
      Type 'yes' to proceed (anything else aborts)
  register: cleanup_confirmation
  when:
    - effective_tags | length > 0
    - effective_tags[0] != 'all'
    - not skip_approval | bool
    - not dry_run | bool

- name: Abort when explicitly selected component cleanup is not confirmed
  ansible.builtin.fail:
    msg: >-
      Cleanup aborted: confirmation not given. Re-run and type 'yes' at the
      prompt, or set SKIP_APPROVAL=true for non-interactive use.
  when:
    - effective_tags | length > 0
    - effective_tags[0] != 'all'
    - not skip_approval | bool
    - not dry_run | bool
    - cleanup_confirmation.user_input | default('') | trim | lower != 'yes'

# Slurm and K8s remove shared data before including their scoped mount cleanup.
# A directly selected storage_mounts component cleans all configured mounts.
- name: Execute cleanup through the canonical cleanup role
  ansible.builtin.include_role:
    name: cleanup
    apply:
      check_mode: "{{ dry_run | bool }}"
  vars:
    cleanup_components: "{{ target_components }}"
    cleanup_execution_order: "{{ execution_order }}"
