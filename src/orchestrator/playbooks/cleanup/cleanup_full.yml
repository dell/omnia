---
# Full orchestrator cleanup — the entry point imported by orchestrator.yml.
#
# USAGE (via orchestrator.yml):
#   ansible-playbook playbooks/orchestrator.yml --tags cleanup
#       Cleans every enabled component. Credentials are preserved.
#   ansible-playbook playbooks/orchestrator.yml --tags cleanup_credentials
#       Cleans orchestrator credential files only.
#   ansible-playbook playbooks/orchestrator.yml --tags cleanup,cleanup_credentials
#       Cleans every enabled component AND credential files.
#
# This playbook intentionally exposes ONLY the 'cleanup' and
# 'cleanup_credentials' tags. Component-level cleanup (slurm, k8s,
# openchami, ...) is available from cleanup_orchestrator.yml, which is run
# directly. Keeping the tag sets separate is what stops component tags from
# being reachable through orchestrator.yml.

- name: Orchestrator Cleanup
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    skip_approval: "{{ lookup('env', 'SKIP_APPROVAL') | default('false', true) | bool }}"
    dry_run: "{{ lookup('env', 'DRY_RUN') | default('false', true) | bool }}"

  tasks:
    # 'apply' is required: tags on include_tasks are not inherited by the
    # included tasks, so without it a tagged run includes the file but skips
    # everything in it.
    - name: Run orchestrator cleanup
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/tasks/prepare_and_select.yml"
        apply:
          tags:
            - cleanup
            - cleanup_credentials
      tags:
        - cleanup
        - cleanup_credentials
