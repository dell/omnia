# Provision Custom — Register user-defined FGs, configure BSS/metadata-service
# Can be run standalone (after provision_preamble.yml) or imported by orchestrator.yml
#
# This playbook catches all functional groups that do not match any known
# category pattern (kubernetes, slurm, login, os). Users can extend this
# playbook by adding bolt-on roles as needed.
#
# Prerequisites: provision_preamble.yml must have run first.

- name: Provision custom/user-defined nodes
  hosts: oim
  connection: ssh
  gather_facts: false
  vars:
    target_category: custom
  pre_tasks:
    - name: Load orchestrator state
      ansible.builtin.include_vars:
        file: "{{ hostvars['localhost']['orchestrator_output_dir'] | default('/opt/omnia/.data') }}/orchestrator_state.yml"

    - name: Load functional groups configuration
      ansible.builtin.include_vars:
        file: "{{ hostvars['localhost']['functional_groups_config_path'] }}"

    - name: Load classification rules
      ansible.builtin.include_vars:
        file: "{{ playbook_dir | regex_replace('/playbooks.*$', '') }}/vars/functional_group_classification.yml"

    - name: Filter functional groups for custom category (catch-all)
      ansible.builtin.set_fact:
        target_functional_groups: >-
          {{ functional_groups
             | rejectattr('name', 'match', '^service_kube_')
             | rejectattr('name', 'match', '^slurm_')
             | rejectattr('name', 'match', '^login_')
             | rejectattr('name', 'match', '^os_')
             | list }}

    - name: Skip message when no custom FGs found
      ansible.builtin.debug:
        msg: "No functional groups match custom category. Skipping."
      when: target_functional_groups | length == 0

  roles:
    - role: omnia.orchestrator.provision_common
      when: target_functional_groups | length > 0
