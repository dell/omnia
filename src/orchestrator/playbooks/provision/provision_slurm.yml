# Provision Slurm — Register Slurm+Login FGs, configure BSS/metadata-service, run bolt-ons
# Can be run standalone (after provision_preamble.yml) or imported by orchestrator.yml
#
# Login node ownership: Login nodes (^login_node_, ^login_compiler_node_) are
# provisioned as part of the Slurm cluster. This matches the current Omnia
# behavior where login nodes appear in the Slurm inventory and share Slurm's
# NFS mounts.
#
# Prerequisites: provision_preamble.yml must have run first.

- name: Provision Slurm cluster
  hosts: oim
  connection: ssh
  gather_facts: false
  vars:
    target_category: slurm
  pre_tasks:
    - name: Load orchestrator state
      ansible.builtin.include_vars:
        file: "{{ hostvars['localhost']['orchestrator_output_dir'] | default('/opt/omnia/.data') }}/orchestrator_state.yml"

    - name: Load functional groups configuration
      ansible.builtin.include_vars:
        file: "{{ hostvars['localhost']['functional_groups_config_path'] }}"

    - name: Load classification rules
      ansible.builtin.include_vars:
        file: "{{ playbook_dir | regex_replace('/playbooks.*$', '') }}/vars/functional_group_classification.yml"

    - name: Filter functional groups for slurm category (includes login nodes)
      ansible.builtin.set_fact:
        target_functional_groups: >-
          {{ functional_groups
             | selectattr('name', 'match', '^slurm_|^login_')
             | list }}

    - name: Skip message when no slurm FGs found
      ansible.builtin.debug:
        msg: "No functional groups match slurm category. Skipping."
      when: target_functional_groups | length == 0

  roles:
    - role: provision_common
      when: target_functional_groups | length > 0

  tasks:
    - name: Run slurm bolt-on services
      when:
        - target_functional_groups | length > 0
        - not (hostvars['localhost']['upgrade_mode'] | default(false) | bool)
      block:
        - name: Load bolt-on configuration
          ansible.builtin.set_fact:
            category_bolt_ons: >-
              {{ (omnia_config | default({})).get('orchestrator', {}).get('bolt_ons', {}).get('slurm',
                 default_bolt_ons.slurm) }}

        - name: Configure mounts
          ansible.builtin.include_role:
            name: mount_config
          vars:
            mount_config_mode: "oim-mount"
          when: "'mount_config' in category_bolt_ons"

        - name: Configure Slurm
          ansible.builtin.include_role:
            name: slurm_config
          when: "'slurm_config' in category_bolt_ons"

        - name: Configure OpenLDAP
          ansible.builtin.include_role:
            name: openldap
          when:
            - "'openldap' in category_bolt_ons"
            - openldap_support | default(false) | bool
