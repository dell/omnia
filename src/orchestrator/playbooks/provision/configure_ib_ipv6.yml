---
# Configure IPoIB IPv6 — Validate allocations, render NM/SMD/hosts, publish, verify
#
# Pipeline (ER-ORCH-005):
#   1. Validate allocation export (L1 schema + L2 semantic)
#   2. Render nmcli profiles, cloud-init scripts, SMD payloads, /etc/hosts block
#   3. Publish to SMD, BSS (cloud-init), and /etc/hosts
#   4. Verify post-configuration state (address, routes, peers, OpenSM)
#
# Prerequisites:
#   - provision_preamble.yml must have run (orchestrator_setup, functional groups)
#   - network_spec.yml must define ib_ipv6_mode and ib_ipv6_allocation_file
#   - Allocation export JSON must exist at the configured path
#
# Usage:
#   ansible-playbook configure_ib_ipv6.yml
#   # Or as part of the full orchestrator pipeline:
#   ansible-playbook orchestrator.yml --tags ib_ipv6

- name: Setup orchestrator environment
  hosts: localhost
  connection: local
  gather_facts: false
  tags: always
  roles:
    - role: orchestrator_setup
      vars:
        openchami_vars_support: true
        oim_group: true
        orchestrator_initialize_state: false

- name: Authenticate with OpenCHAMI
  hosts: oim
  connection: ssh
  gather_facts: false
  tags: always
  tasks:
    - name: OpenCHAMI cluster authentication
      ansible.builtin.include_role:
        name: orchestrator_common
        tasks_from: openchami_auth.yml
      vars:
        oim_node_name: "{{ hostvars['localhost']['oim_node_name'] }}"

- name: Configure IPoIB IPv6 addressing
  hosts: oim
  connection: ssh
  gather_facts: false
  tags:
    - ib_ipv6
    - provision
  pre_tasks:
    - name: Load orchestrator state
      ansible.builtin.include_vars:
        file: "{{ hostvars['localhost']['orchestrator_output_dir'] }}/orchestrator_state.yml"
      failed_when: false

    - name: Load network spec data
      ansible.builtin.include_vars:
        file: "{{ hostvars['localhost']['input_dir'] }}/network_spec.yml"
        name: network_spec_data
      delegate_to: localhost

    - name: Check if IPoIB IPv6 is enabled
      ansible.builtin.set_fact:
        _ib_ipv6_enabled: >-
          {{ network_spec_data.ib_ipv6_mode | default('') in ['ipv6-only', 'dual-stack'] }}

    - name: Skip IPoIB IPv6 when not enabled
      ansible.builtin.debug:
        msg: >-
          [IB-IPv6] Skipping — ib_ipv6_mode is
          '{{ network_spec_data.ib_ipv6_mode | default("not set") }}'
      when: not _ib_ipv6_enabled

  roles:
    - role: ib_ipv6_config
      when: _ib_ipv6_enabled
