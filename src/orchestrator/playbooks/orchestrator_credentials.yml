---

# Orchestrator Credentials — Create, prompt, and encrypt credential files
# Can be run standalone or imported by orchestrator.yml

- name: Setup orchestrator environment
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: orchestrator_setup
      vars:
        openchami_vars_support: true
        omnia_metadata_support: true
  tags: always

- name: Create and update credential config files
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - orchestrator_credentials
  tags: always
