# manage_functional_group.yml — Bounded flexible-group lifecycle (ER-ORCH-009).
# =============================================================================
# Add one flexible (fg_) functional group's OpenCHAMI group, Boot Service, and
# Metadata Service state. This flow:
#   - operates only on groups carrying the mandatory ``fg_`` prefix;
#   - composes the shared ``provision_common`` publish pipeline, scoped to the
#     target group(s);
#   - never runs category provisioning playbooks or category bolt-on roles,
#     and never consumes omnia_config.yml / storage_config.yml;
#   - does not require repo_status.yml (FR-4.1, FR-4.3);
#   - uses an upsert replace-node model: it does not check prior PXE identity
#     or workload-scheduler state (FR-4.1). The operator MUST remove nodes from
#     their existing scheduler before adding them to a flexible group.
#
# Remove (FR-4.2) is delivered by the ER-ORCH-009-lifecycle-mutation-safety
# story, which owns the member-safe, ownership-scoped, common-group-preserving
# deletion reconciliation (openchami_reconcile delete_groups /
# prune_boot_configurations / prune_metadata_groups) in the
# orchestrator_functional_groups role. Invoking fg_operation=remove here fails
# fast rather than running a partial deletion.
#
# Usage (imported by orchestrator.yml under --tags manage-functional-group):
#   ansible-playbook playbooks/orchestrator.yml --tags manage-functional-group \
#     -e fg_operation=add -e fg_target_group=fg_webserver_rhel_10_2_x86_64
#
# Variables:
#   fg_operation    add (default). remove is not yet available here.
#   fg_target_group optional exact fg_ name; when unset, every fg_ group in the
#                   active mapping is targeted.
#
# Prerequisites: provision_preamble.yml runs first (imported for this tag in
# orchestrator.yml).

- name: Manage flexible (fg_) functional group lifecycle
  hosts: oim
  connection: ssh
  gather_facts: false
  vars:
    target_category: flexible
    fg_operation: add
  pre_tasks:
    - name: Load orchestrator state
      ansible.builtin.include_vars:
        file: "{{ hostvars['localhost']['orchestrator_output_dir'] }}/orchestrator_state.yml"

    - name: Load functional groups configuration
      ansible.builtin.include_vars:
        file: "{{ hostvars['localhost']['functional_groups_config_path'] }}"

    - name: Load classification rules
      ansible.builtin.include_vars:
        file: "{{ playbook_dir | regex_replace('/playbooks.*$', '') }}/vars/functional_group_classification.yml"

    - name: Validate requested lifecycle operation
      ansible.builtin.assert:
        that:
          - fg_operation in ['add', 'remove']
        fail_msg: >-
          Unsupported fg_operation '{{ fg_operation }}'. Supported operations
          are 'add' and 'remove'.

    - name: Fail fast for the not-yet-available remove operation
      ansible.builtin.fail:
        msg: >-
          fg_operation=remove is delivered by the ER-ORCH-009
          lifecycle-mutation-safety story and is not available in this flow yet.
          Member-safe, ownership-scoped deletion is intentionally not run here to
          avoid partial removal. Use fg_operation=add for now.
      when: fg_operation == 'remove'

    - name: Select flexible functional groups
      ansible.builtin.set_fact:
        target_functional_groups: >-
          {{ functional_groups
             | selectattr('name', 'match', '^fg_')
             | selectattr('name', 'equalto', fg_target_group)
             | list
             if fg_target_group is defined and fg_target_group | length > 0
             else functional_groups
                  | selectattr('name', 'match', '^fg_')
                  | list }}

    - name: Fail when a requested target is not a mapped flexible group
      ansible.builtin.fail:
        msg: >-
          Requested flexible group '{{ fg_target_group }}' is not an fg_-prefixed
          functional group in the active PXE mapping.
      when:
        - fg_target_group is defined
        - fg_target_group | length > 0
        - target_functional_groups | length == 0

    - name: Report resolved flexible targets
      ansible.builtin.debug:
        msg: >-
          fg_operation={{ fg_operation }};
          targets={{ target_functional_groups | map(attribute='name') | list }}

  roles:
    # Add: publish OpenCHAMI group, Boot Service, and Metadata Service state
    # through the shared generic pipeline (no bolt-ons for the flexible
    # category). The replace-node model is inherent to register_nodes'
    # upsert-style discover_static reconciliation.
    - role: provision_common
      when:
        - fg_operation == 'add'
        - target_functional_groups | length > 0
