# manage_functional_group.yml — Flexible functional group routing & configuration.
# =============================================================================
# Entry point for flexible (fg_) functional-group configuration and publication:
#   - operates only on groups carrying the mandatory ``fg_`` prefix;
#   - composes the shared ``provision_common`` publish pipeline, scoped to the
#     target group(s);
#   - never runs category provisioning playbooks or category bolt-on roles,
#     and never consumes omnia_config.yml / storage_config.yml;
#   - does not require repo_status.yml (FR-4.1, FR-4.3);
#   - uses an upsert replace-node model for add (FR-4.1).
#
# Usage (imported by orchestrator.yml under --tags manage-functional-group):
#   ansible-playbook playbooks/orchestrator.yml --tags manage-functional-group \
#     -e fg_operation=add -e fg_target_group=fg_webserver_rhel_10_2_x86_64

- name: Manage flexible (fg_) functional group lifecycle
  hosts: oim
  connection: ssh
  gather_facts: false
  vars:
    target_category: flexible
    fg_operation: add
    configure_scope: both
    fg_publish_boot: "{{ configure_scope in ['both', 'boot'] }}"
    fg_publish_cloud_init: "{{ configure_scope in ['both', 'cloud_init'] }}"
    provision_common_registration_complete: "{{ fg_operation == 'configure' }}"
  pre_tasks:
    - name: Load orchestrator state
      ansible.builtin.include_vars:
        file: "{{ hostvars['localhost']['orchestrator_output_dir'] }}/orchestrator_state.yml"

    - name: Load functional groups configuration
      ansible.builtin.include_vars:
        file: "{{ hostvars['localhost']['functional_groups_config_path'] }}"

    - name: Load classification rules
      ansible.builtin.include_vars:
        file: "{{ playbook_dir | regex_replace('/playbooks.*$', '') }}/vars/functional_group_classification.yml"

    - name: Slurp functional_group_config.yml (ER-ORCH-009)
      ansible.builtin.slurp:
        src: >-
          {{ hostvars['localhost']['input_project_dir']
             | default(hostvars['localhost']['orchestrator_input_dir'] | default(''))
          }}/functional_group_config.yml
      when: fg_operation in ['add', 'configure']
      failed_when: false
      register: _fg_config_raw

    - name: Set functional_group_config fact safely
      ansible.builtin.set_fact:
        functional_group_config: "{{ (_fg_config_raw.content | b64decode | from_yaml) | default({}, true) }}"
      when:
        - fg_operation in ['add', 'configure']
        - _fg_config_raw is defined
        - _fg_config_raw.content is defined

    - name: Validate requested lifecycle operation
      ansible.builtin.assert:
        that:
          - fg_operation in ['add', 'remove', 'configure']
        fail_msg: >-
          Unsupported fg_operation '{{ fg_operation }}'. Supported operations
          are 'add', 'remove', and 'configure'.

    - name: Validate requested configuration scope
      ansible.builtin.assert:
        that:
          - configure_scope in ['both', 'boot', 'cloud_init']
        fail_msg: >-
          Unsupported configure_scope '{{ configure_scope }}'. Supported scopes
          are 'both', 'boot', and 'cloud_init'.
      when: fg_operation == 'configure'

    - name: Select flexible functional groups
      ansible.builtin.set_fact:
        target_functional_groups: >-
          {{ functional_groups
             | selectattr('name', 'match', '^fg_')
             | selectattr('name', 'equalto', fg_target_group)
             | list
             if fg_target_group is defined and fg_target_group | length > 0
             else functional_groups
                  | selectattr('name', 'match', '^fg_')
                  | list }}

    - name: Fail when a requested target is not a mapped flexible group
      ansible.builtin.fail:
        msg: >-
          Requested flexible group '{{ fg_target_group }}' is not an fg_-prefixed
          functional group in the active PXE mapping.
      when:
        - fg_target_group is defined
        - fg_target_group | length > 0
        - target_functional_groups | length == 0

    - name: Report resolved flexible targets
      ansible.builtin.debug:
        msg: >-
          fg_operation={{ fg_operation }};
          {{ 'configure_scope=' + configure_scope + '; '
             if fg_operation == 'configure' else '' }}targets={{ target_functional_groups | map(attribute='name') | list }}

    - name: Resolve functional group configuration for each target
      ansible.builtin.set_fact:
        resolved_fg_config: >-
          {{ resolved_fg_config | default({}) | combine({
               item.name: (item.name | resolve_functional_group_config(functional_group_config | default({})))
             }) }}
      loop: "{{ target_functional_groups }}"
      loop_control:
        loop_var: item
      when:
        - functional_group_config is defined
        - fg_operation in ['add', 'configure']

    - name: Report resolved configuration
      ansible.builtin.debug:
        msg: "Resolved config for {{ item.key }}: {{ item.value }}"
      loop: "{{ resolved_fg_config | default({}) | dict2items }}"
      when:
        - resolved_fg_config is defined

  roles:
    - role: provision_common
      when:
        - fg_operation in ['add', 'configure']
        - target_functional_groups | length > 0
