# manage_functional_group.yml — Bounded flexible-group lifecycle (ER-ORCH-009).
# =============================================================================
# Single entry point for all flexible (fg_) functional-group operations:
# add, remove, and configure. This flow (HLD v13):
#   - operates only on groups carrying the mandatory ``fg_`` prefix;
#   - composes the shared ``provision_common`` publish pipeline, scoped to the
#     target group(s);
#   - never runs category provisioning playbooks or category bolt-on roles,
#     and never consumes omnia_config.yml / storage_config.yml;
#   - does not require repo_status.yml (FR-4.1, FR-4.3);
#   - uses an upsert replace-node model for add: it does not check prior PXE
#     identity or workload-scheduler state (FR-4.1). The operator MUST remove
#     nodes from their existing scheduler before adding them to a flexible group.
#
# Operations (FR-4.1, FR-4.2, FR-4.3):
#   add       — Create or reconcile OpenCHAMI group, BSS, and metadata state.
#   remove    — Remove owned records after verifying no mapped nodes remain.
#               (Delivered by ER-ORCH-009-lifecycle-mutation-safety story.)
#   configure — Publish BSS and/or metadata configuration only, without group
#               creation, node registration, bolt-on roles, or scheduler effects.
#
# Usage (imported by orchestrator.yml under --tags manage-functional-group):
#   # Add a group:
#   ansible-playbook playbooks/orchestrator.yml --tags manage-functional-group \
#     -e fg_operation=add -e fg_target_group=fg_webserver_rhel_10_2_x86_64
#   # Configure boot parameters only:
#   ansible-playbook playbooks/orchestrator.yml --tags manage-functional-group \
#     -e fg_operation=configure -e configure_scope=boot \
#     -e fg_target_group=fg_webserver_rhel_10_2_x86_64
#
# Variables:
#   fg_operation     add (default) | remove | configure
#   configure_scope  both (default) | boot | cloud_init  (only for configure)
#   fg_target_group  optional exact fg_ name; when unset, every fg_ group in the
#                    active mapping is targeted.
#
# Prerequisites: provision_preamble.yml runs first (imported for this tag in
# orchestrator.yml).

- name: Manage flexible (fg_) functional group lifecycle
  hosts: oim
  connection: ssh
  gather_facts: false
  vars:
    target_category: flexible
    fg_operation: add
    configure_scope: both
    fg_force_recovery: false
    # Scope gates consumed by provision_common for configure operations;
    # default to publishing both when a caller does not restrict the scope.
    fg_publish_boot: "{{ configure_scope in ['both', 'boot'] }}"
    fg_publish_cloud_init: "{{ configure_scope in ['both', 'cloud_init'] }}"
    # Configure operations skip node registration (publish-only mode).
    provision_common_registration_complete: "{{ fg_operation == 'configure' }}"
    planned_lifecycle_stages: >-
      {{ ['metadata', 'bss', 'smd_group'] if fg_operation == 'remove'
         else (['bss'] if configure_scope == 'boot'
               else (['metadata'] if configure_scope == 'cloud_init'
                     else ['smd_group', 'bss', 'metadata'])) }}
  pre_tasks:
    - name: Set run_id for flexible functional group lifecycle
      ansible.builtin.set_fact:
        fg_run_id: "{{ now(utc=true, fmt='%s') | default(lookup('pipe', 'date +%s')) }}"

    - name: Load orchestrator state
      ansible.builtin.include_vars:
        file: "{{ hostvars['localhost']['orchestrator_output_dir'] }}/orchestrator_state.yml"

    - name: Load functional groups configuration
      ansible.builtin.include_vars:
        file: "{{ hostvars['localhost']['functional_groups_config_path'] }}"

    - name: Load classification rules
      ansible.builtin.include_vars:
        file: "{{ playbook_dir | regex_replace('/playbooks.*$', '') }}/vars/functional_group_classification.yml"

    - name: Slurp functional_group_config.yml (ER-ORCH-009)
      ansible.builtin.slurp:
        src: >-
          {{ hostvars['localhost']['input_project_dir']
             | default(hostvars['localhost']['orchestrator_input_dir'] | default(''))
          }}/functional_group_config.yml
      when:
        - fg_operation in ['add', 'configure']
      failed_when: false
      register: _fg_config_raw

    - name: Set functional_group_config fact safely
      ansible.builtin.set_fact:
        functional_group_config: "{{ (_fg_config_raw.content | b64decode | from_yaml) | default({}, true) }}"
      when:
        - fg_operation in ['add', 'configure']
        - _fg_config_raw is defined
        - _fg_config_raw.content is defined

    - name: Load PXE mapping if not already available
      when:
        - read_mapping_file is not defined
        - hostvars['localhost']['read_mapping_file'] is not defined
      block:
        - name: Read PXE mapping CSV
          community.general.read_csv:
            path: "{{ hostvars['localhost']['pxe_mapping_file_path'] }}"
            key: ADMIN_MAC
          register: _local_read_mapping_file
        - name: Set read_mapping_file fact
          ansible.builtin.set_fact:
            read_mapping_file: "{{ _local_read_mapping_file }}"
      rescue:
        - name: Report failure to read PXE mapping
          ansible.builtin.debug:
            msg: "No PXE mapping loaded from {{ hostvars['localhost']['pxe_mapping_file_path'] | default('') }}"

    - name: Validate requested lifecycle operation
      ansible.builtin.assert:
        that:
          - fg_operation in ['add', 'remove', 'configure']
        fail_msg: >-
          Unsupported fg_operation '{{ fg_operation }}'. Supported operations
          are 'add', 'remove', and 'configure'.

    - name: Validate requested configuration scope
      ansible.builtin.assert:
        that:
          - configure_scope in ['both', 'boot', 'cloud_init']
        fail_msg: >-
          Unsupported configure_scope '{{ configure_scope }}'. Supported scopes
          are 'both', 'boot', and 'cloud_init'.
      when: fg_operation == 'configure'

    - name: Select flexible functional groups for add/configure
      ansible.builtin.set_fact:
        target_functional_groups: >-
          {{ functional_groups
             | selectattr('name', 'match', '^fg_')
             | selectattr('name', 'equalto', fg_target_group)
             | list
             if fg_target_group is defined and fg_target_group | length > 0
             else functional_groups
                  | selectattr('name', 'match', '^fg_')
                  | list }}
      when: fg_operation in ['add', 'configure']

    - name: Fail when a requested target is not a mapped flexible group
      ansible.builtin.fail:
        msg: >-
          Requested flexible group '{{ fg_target_group }}' is not an fg_-prefixed
          functional group in the active PXE mapping.
      when:
        - fg_operation in ['add', 'configure']
        - fg_target_group is defined
        - fg_target_group | length > 0
        - target_functional_groups | length == 0

    - name: Validate remove operation target specification
      ansible.builtin.assert:
        that:
          - fg_target_group is defined
          - fg_target_group | length > 0
          - fg_target_group is match('^fg_')
        fail_msg: >-
          Remove requires an exact target group name starting with 'fg_'
          (e.g., -e fg_target_group=fg_app_rhel_10_2_x86_64).
      when: fg_operation == 'remove'

    - name: Select target flexible group for remove
      ansible.builtin.set_fact:
        target_functional_groups:
          - name: "{{ fg_target_group }}"
      when: fg_operation == 'remove'

    - name: Validate exact target for configure operation (FR-4.3)
      ansible.builtin.assert:
        that:
          - target_functional_groups | length == 1
        fail_msg: >-
          Configure operation requires exactly one target group (fg_target_group).
          Found {{ target_functional_groups | length }}.
      when: fg_operation == 'configure'

    - name: Count mapped nodes for target group from reviewed PXE mapping (AC-006)
      ansible.builtin.set_fact:
        target_group_nodes: >-
          {{ ((read_mapping_file.dict | default(hostvars['localhost']['read_mapping_file']['dict'] | default({}))).values() | list)
             | selectattr('FUNCTIONAL_GROUP_NAME', 'defined')
             | selectattr('FUNCTIONAL_GROUP_NAME', 'equalto', target_functional_groups[0].name)
             | list }}
      when: fg_operation == 'remove'

    - name: Fail if target group has mapped nodes (AC-006)
      ansible.builtin.fail:
        msg: >-
          Cannot remove flexible group '{{ target_functional_groups[0].name }}' because
          {{ target_group_nodes | length }} node(s) are still mapped. Remove all mapped
          nodes first, then retry removal.
      when:
        - fg_operation == 'remove'
        - target_group_nodes | length > 0

    - name: Acquire project mutation lock (FR-5.1)
      functional_group_lifecycle:
        action: acquire_lock
        project_name: "{{ hostvars['localhost']['project_name'] | default('default') }}"
        operation: "{{ fg_operation }}"
        target_group: "{{ fg_target_group | default(target_functional_groups[0].name if target_functional_groups | length > 0 else '') }}"
        state_dir: "{{ hostvars['localhost']['orchestrator_output_dir'] }}"
        run_id: "{{ fg_run_id }}"
        force_recovery: "{{ fg_force_recovery | default(false) | bool }}"
      register: _lifecycle_lock
      when: target_functional_groups | length > 0

    - name: Report resolved flexible targets
      ansible.builtin.debug:
        msg: >-
          fg_operation={{ fg_operation }};
          {{ 'configure_scope=' + configure_scope + '; '
             if fg_operation == 'configure' else '' }}targets={{ target_functional_groups | map(attribute='name') | list }}

    - name: Resolve functional group configuration for each target
      ansible.builtin.set_fact:
        resolved_fg_config: >-
          {{ resolved_fg_config | default({}) | combine({
               item.name: (item.name | resolve_functional_group_config(functional_group_config | default({})))
             }) }}
      loop: "{{ target_functional_groups }}"
      loop_control:
        loop_var: item
      when:
        - functional_group_config is defined
        - fg_operation in ['add', 'configure']

    - name: Report resolved configuration
      ansible.builtin.debug:
        msg: "Resolved config for {{ item.key }}: {{ item.value }}"
      loop: "{{ resolved_fg_config | default({}) | dict2items }}"
      when:
        - resolved_fg_config is defined

  roles:
    # Retained for static analysis and role-dependency interface validation.
    # Actual execution runs inside the protected lifecycle block below.
    - role: provision_common
      when:
        - false
        - fg_operation in ['add', 'configure']
        - target_functional_groups | length > 0

  tasks:
    - name: Flexible functional group lifecycle mutation sequence
      when: target_functional_groups | length > 0
      block:
        - name: Start transition journal (FR-5.1)
          functional_group_lifecycle:
            action: start_journal
            project_name: "{{ hostvars['localhost']['project_name'] | default('default') }}"
            operation: "{{ fg_operation }}"
            target_group: >-
              {{ fg_target_group
                 | default(target_functional_groups[0].name if target_functional_groups | length > 0 else '') }}
            state_dir: "{{ hostvars['localhost']['orchestrator_output_dir'] }}"
            run_id: "{{ fg_run_id }}"
            planned_stages: "{{ planned_lifecycle_stages }}"
            force_recovery: "{{ fg_force_recovery | default(false) | bool }}"
          register: _lifecycle_journal

        # ── MUTATION SEQUENCE: ADD / CONFIGURE ──
        - name: Track current stage for add/configure
          ansible.builtin.set_fact:
            _current_stage: "{{ 'bss' if configure_scope == 'boot' else ('metadata' if configure_scope == 'cloud_init' else 'smd_group') }}"
          when: fg_operation in ['add', 'configure']

        - name: Execute provision_common for add/configure
          ansible.builtin.include_role:
            name: provision_common
          when: fg_operation in ['add', 'configure']

        - name: Record SMD group stage completion for add
          functional_group_lifecycle:
            action: record_stage
            state_dir: "{{ hostvars['localhost']['orchestrator_output_dir'] }}"
            stage: smd_group
            stage_status: verified
          when: fg_operation == 'add'

        - name: Record BSS stage completion
          functional_group_lifecycle:
            action: record_stage
            state_dir: "{{ hostvars['localhost']['orchestrator_output_dir'] }}"
            stage: bss
            stage_status: verified
          when:
            - fg_operation in ['add', 'configure']
            - fg_publish_boot | bool

        - name: Record Metadata stage completion
          functional_group_lifecycle:
            action: record_stage
            state_dir: "{{ hostvars['localhost']['orchestrator_output_dir'] }}"
            stage: metadata
            stage_status: verified
          when:
            - fg_operation in ['add', 'configure']
            - fg_publish_cloud_init | bool

        # ── MUTATION SEQUENCE: REMOVE ──
        - name: Track current stage for remove
          ansible.builtin.set_fact:
            _current_stage: metadata
          when: fg_operation == 'remove'

        - name: Inspect ownership of metadata group before removal
          openchami_reconcile:
            action: inspect_metadata_group_ownership
            cluster_uri: "{{ openchami_api_uri }}"
            access_token: "{{ ochami_env[cluster_env_key] }}"
            ca_cert: "{{ hostvars['localhost']['openchami_ca_cert_path'] }}"
            metadata_group_name: "{{ target_functional_groups[0].name }}"
            project_name: "{{ hostvars['localhost']['project_name'] | default('default') }}"
          register: _ownership_inspection
          when: fg_operation == 'remove'

        - name: Plan removal with ownership and emptiness verification (FR-4.2)
          functional_group_lifecycle:
            action: plan_remove
            target_group: "{{ target_functional_groups[0].name }}"
            mapped_nodes: "{{ target_group_nodes | default([]) }}"
            all_functional_groups: "{{ functional_groups }}"
            ownership_evidence: "{{ _ownership_inspection.ownership | default({}) }}"
          register: _remove_plan
          when: fg_operation == 'remove'

        - name: Delete metadata for removed group
          openchami_reconcile:
            action: delete_metadata_groups
            cluster_uri: "{{ openchami_api_uri }}"
            access_token: "{{ ochami_env[cluster_env_key] }}"
            ca_cert: "{{ hostvars['localhost']['openchami_ca_cert_path'] }}"
            metadata_group_names: "{{ target_functional_groups | map(attribute='name') | list }}"
            project_name: "{{ hostvars['localhost']['project_name'] | default('default') }}"
          register: _metadata_delete
          when: fg_operation == 'remove'

        - name: Record metadata stage completion for remove
          functional_group_lifecycle:
            action: record_stage
            state_dir: "{{ hostvars['localhost']['orchestrator_output_dir'] }}"
            stage: metadata
            stage_status: verified
          when: fg_operation == 'remove'

        - name: Track current stage as bss
          ansible.builtin.set_fact:
            _current_stage: bss
          when: fg_operation == 'remove'

        - name: Delete boot configurations for removed group
          openchami_reconcile:
            action: delete_boot_configurations
            cluster_uri: "{{ openchami_api_uri }}"
            access_token: "{{ ochami_env[cluster_env_key] }}"
            ca_cert: "{{ hostvars['localhost']['openchami_ca_cert_path'] }}"
            boot_configuration_names: "{{ target_functional_groups | map(attribute='name') | list }}"
          register: _boot_delete
          when: fg_operation == 'remove'

        - name: Record bss stage completion for remove
          functional_group_lifecycle:
            action: record_stage
            state_dir: "{{ hostvars['localhost']['orchestrator_output_dir'] }}"
            stage: bss
            stage_status: verified
          when: fg_operation == 'remove'

        - name: Track current stage as smd_group
          ansible.builtin.set_fact:
            _current_stage: smd_group
          when: fg_operation == 'remove'

        - name: Delete SMD group for removed group
          openchami_reconcile:
            action: delete_groups
            cluster_uri: "{{ openchami_api_uri }}"
            access_token: "{{ ochami_env[cluster_env_key] }}"
            ca_cert: "{{ hostvars['localhost']['openchami_ca_cert_path'] }}"
            group_labels: "{{ target_functional_groups | map(attribute='name') | list }}"
          register: _group_delete
          when: fg_operation == 'remove'

        - name: Record smd_group stage completion for remove
          functional_group_lifecycle:
            action: record_stage
            state_dir: "{{ hostvars['localhost']['orchestrator_output_dir'] }}"
            stage: smd_group
            stage_status: verified
          when: fg_operation == 'remove'

        - name: Recalculate and reconcile shared SMD groups (ssh and chrony) from remaining groups
          openchami_reconcile:
            action: reconcile_groups
            cluster_uri: "{{ openchami_api_uri }}"
            access_token: "{{ ochami_env[cluster_env_key] }}"
            ca_cert: "{{ hostvars['localhost']['openchami_ca_cert_path'] }}"
            smd_groups:
              - label: "ssh"
                members:
                  ids: >-
                    {{ ((read_mapping_file.dict | default(hostvars['localhost']['read_mapping_file']['dict'] | default({}))).values() | list)
                       | selectattr('FUNCTIONAL_GROUP_NAME', 'defined')
                       | selectattr('FUNCTIONAL_GROUP_NAME', 'ne', target_functional_groups[0].name)
                       | map(attribute='XNAME') | sort | unique | list }}
              - label: "chrony"
                members:
                  ids: >-
                    {{ ((read_mapping_file.dict | default(hostvars['localhost']['read_mapping_file']['dict'] | default({}))).values() | list)
                       | selectattr('FUNCTIONAL_GROUP_NAME', 'defined')
                       | selectattr('FUNCTIONAL_GROUP_NAME', 'ne', target_functional_groups[0].name)
                       | map(attribute='XNAME') | sort | unique | list }}
          when: fg_operation == 'remove'

        # ── STATUS RECONCILIATION: TRUTHFUL REGISTERED RESULTS (B3) ──
        - name: Compute actual stage results for status reconciliation
          ansible.builtin.set_fact:
            _computed_stage_results: >-
              {{ [
                   {'stage': 'metadata', 'status': 'success' if (_metadata_delete.changed | default(false)) else 'noop'},
                   {'stage': 'bss', 'status': 'success' if (_boot_delete.changed | default(false)) else 'noop'},
                   {'stage': 'smd_group', 'status': 'success' if (_group_delete.changed | default(false)) else 'noop'}
                 ]
                 if fg_operation == 'remove'
                 else (
                   [{'stage': 'bss', 'status': 'success' if (_boot_configuration_reconcile.changed | default(true)) else 'noop'}]
                   if configure_scope == 'boot'
                   else (
                     [{'stage': 'metadata', 'status': 'success' if (_metadata_fg_reconcile.changed | default(true)) else 'noop'}]
                     if configure_scope == 'cloud_init'
                     else [
                       {'stage': 'smd_group', 'status': 'success' if (_functional_group_reconcile.changed | default(true)) else 'noop'},
                       {'stage': 'bss', 'status': 'success' if (_boot_configuration_reconcile.changed | default(true)) else 'noop'},
                       {'stage': 'metadata', 'status': 'success' if (_metadata_fg_reconcile.changed | default(true)) else 'noop'}
                     ]
                   )
                 ) }}

        - name: Reconcile flexible functional group lifecycle status (FR-5.2)
          orchestrator_status_reconcile:
            mode: functional_group
            project_name: "{{ hostvars['localhost']['project_name'] | default('default') }}"
            run_id: "{{ fg_run_id }}"
            operation: "{{ fg_operation }}"
            target_group: >-
              {{ target_functional_groups[0].name
                 if target_functional_groups | length == 1 else 'multiple' }}
            planned_stages: "{{ planned_lifecycle_stages }}"
            stage_results: "{{ _computed_stage_results }}"
          register: _fg_status_report

        - name: Finish transition journal (FR-5.1)
          functional_group_lifecycle:
            action: finish_journal
            state_dir: "{{ hostvars['localhost']['orchestrator_output_dir'] }}"
            terminal_result: succeeded

      rescue:
        - name: Record stage failure in transition journal (FR-5.1)
          functional_group_lifecycle:
            action: record_stage
            state_dir: "{{ hostvars['localhost']['orchestrator_output_dir'] }}"
            stage: "{{ _current_stage | default('smd_group') }}"
            stage_status: failed
          when:
            - _lifecycle_journal is defined
            - _lifecycle_journal.changed | default(false)

        - name: Mark transition journal as failed (FR-5.1)
          functional_group_lifecycle:
            action: finish_journal
            state_dir: "{{ hostvars['localhost']['orchestrator_output_dir'] }}"
            terminal_result: failed
            error_message: "{{ ansible_failed_result.msg | default('Lifecycle mutation failed') }}"
          when:
            - _lifecycle_journal is defined
            - _lifecycle_journal.changed | default(false)

        - name: Reconcile status on failure (FR-5.2)
          orchestrator_status_reconcile:
            mode: functional_group
            project_name: "{{ hostvars['localhost']['project_name'] | default('default') }}"
            run_id: "{{ fg_run_id }}"
            operation: "{{ fg_operation }}"
            target_group: >-
              {{ fg_target_group
                 | default(target_functional_groups[0].name if target_functional_groups | length > 0 else '') }}
            planned_stages: "{{ planned_lifecycle_stages }}"
            stage_results:
              - stage: "{{ _current_stage | default('smd_group') }}"
                status: failed
                diagnostic_category: "{{ _current_stage | default('smd_group') }}_failed"
          failed_when: false

        - name: Fail lifecycle operation
          ansible.builtin.fail:
            msg: >-
              Flexible functional group lifecycle operation '{{ fg_operation }}' failed:
              {{ ansible_failed_result.msg | default('Unknown error') }}

      always:
        - name: Release project mutation lock (FR-5.1)
          functional_group_lifecycle:
            action: release_lock
            state_dir: "{{ hostvars['localhost']['orchestrator_output_dir'] }}"
            run_id: "{{ fg_run_id }}"
          ignore_errors: true
