# Upgrade Orchestrator — In-place upgrade of OpenCHAMI services
# Can be run standalone: ansible-playbook playbooks/upgrade_orchestrator.yml
#
# Workflow per §6.7:
#   1. Backup current OpenCHAMI configuration
#   2. Backup SMD state
#   3. Pull new OpenCHAMI images
#   4. Rolling restart of services
#   5. Verify service health post-upgrade
#   6. Update metadata with new version

- name: Setup orchestrator environment for upgrade
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: omnia.orchestrator.orchestrator_setup
      vars:
        openchami_vars_support: true
        omnia_metadata_support: true
        upgrade_mode: true
        oim_group: true
  tags: always

- name: Create upgrade lock file
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Create upgrade lock
      ansible.builtin.copy:
        content: |
          upgrade_started: "{{ ansible_date_time.iso8601 | default(lookup('pipe', 'date -Iseconds')) }}"
          source_version: "{{ openchami_version | default('unknown') }}"
        dest: "/opt/omnia/.data/upgrade_in_progress.lock"
        mode: '0644'
  tags: always

- name: Backup OpenCHAMI configuration and SMD state
  hosts: oim
  connection: ssh
  gather_facts: true
  vars:
    upgrade_backup_dir: "/opt/omnia/openchami/backups/pre_upgrade_{{ ansible_date_time.iso8601_basic_short }}"
    openchami_config_dir: /etc/openchami/configs
    openchami_work_dir: "{{ hostvars['localhost']['oim_shared_path'] | default('/opt/omnia') }}/omnia/openchami/workdir"
  tasks:
    - name: Authenticate to OpenCHAMI
      ansible.builtin.include_role:
        name: omnia.orchestrator.orchestrator_common
        tasks_from: openchami_auth.yml

    - name: Create backup directory structure
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - "{{ upgrade_backup_dir }}"
        - "{{ upgrade_backup_dir }}/configs"
        - "{{ upgrade_backup_dir }}/smd"
        - "{{ upgrade_backup_dir }}/workdir"

    - name: Backup OpenCHAMI config directory
      ansible.builtin.copy:
        src: "{{ openchami_config_dir }}/"
        dest: "{{ upgrade_backup_dir }}/configs/"
        remote_src: true
        mode: preserve
      ignore_errors: true

    - name: Backup SMD component endpoints
      ansible.builtin.shell: |
        set -o pipefail
        ochami smd component get --all 2>/dev/null | tee "{{ upgrade_backup_dir }}/smd/components.json"
      environment: "{{ ochami_env | default({}) }}"
      register: smd_backup_result
      changed_when: false
      failed_when: false

    - name: Backup SMD groups
      ansible.builtin.shell: |
        set -o pipefail
        ochami smd group get --all 2>/dev/null | tee "{{ upgrade_backup_dir }}/smd/groups.json"
      environment: "{{ ochami_env | default({}) }}"
      changed_when: false
      failed_when: false

    - name: Backup BSS boot parameters
      ansible.builtin.shell: |
        set -o pipefail
        ochami bss boot params get --all 2>/dev/null | tee "{{ upgrade_backup_dir }}/smd/bss_params.json"
      environment: "{{ ochami_env | default({}) }}"
      changed_when: false
      failed_when: false

    - name: Backup workdir (nodes YAML, inventories)
      ansible.builtin.copy:
        src: "{{ openchami_work_dir }}/"
        dest: "{{ upgrade_backup_dir }}/workdir/"
        remote_src: true
        mode: preserve
      ignore_errors: true

    - name: Record backup metadata
      ansible.builtin.copy:
        content: |
          backup_timestamp: "{{ ansible_date_time.iso8601 }}"
          source_version: "{{ openchami_version | default('unknown') }}"
          backup_path: "{{ upgrade_backup_dir }}"
          smd_backup_rc: {{ smd_backup_result.rc | default(-1) }}
        dest: "{{ upgrade_backup_dir }}/backup_metadata.yml"
        mode: '0644'
  tags: always

- name: Pull new OpenCHAMI images and restart services
  hosts: oim
  connection: ssh
  gather_facts: false
  tasks:
    - name: Include deploy_openchami vars for image list
      ansible.builtin.include_vars:
        file: "{{ role_path | default(playbook_dir + '/../roles/deploy_openchami') }}/vars/main.yml"
      ignore_errors: true

    - name: Pull updated OpenCHAMI container images
      ansible.builtin.command: "podman pull {{ item }}"
      loop: "{{ openchami_images | default([]) }}"
      register: pull_results
      retries: 3
      delay: 10
      until: pull_results.rc == 0
      changed_when: pull_results.rc == 0

    - name: Restart OpenCHAMI services (rolling)
      ansible.builtin.systemd:
        name: openchami.target
        state: restarted
        daemon_reload: true

    - name: Wait for services to stabilize
      ansible.builtin.pause:
        seconds: 30
        prompt: "Waiting for OpenCHAMI services to stabilize after restart..."
  tags: always

- name: Verify service health post-upgrade
  hosts: oim
  connection: ssh
  gather_facts: false
  tasks:
    - name: Authenticate to OpenCHAMI
      ansible.builtin.include_role:
        name: omnia.orchestrator.orchestrator_common
        tasks_from: openchami_auth.yml

    - name: Verify openchami.target is active
      ansible.builtin.systemd:
        name: openchami.target
      register: openchami_target_post
      failed_when: openchami_target_post.status.ActiveState != "active"

    - name: Verify SMD API health
      ansible.builtin.command: ochami smd service status
      environment: "{{ ochami_env | default({}) }}"
      register: smd_post_status
      retries: 5
      delay: 10
      until: smd_post_status.rc == 0
      changed_when: false

    - name: Verify BSS API health
      ansible.builtin.command: ochami bss service status
      environment: "{{ ochami_env | default({}) }}"
      register: bss_post_status
      retries: 5
      delay: 10
      until: bss_post_status.rc == 0
      changed_when: false

    - name: Post-upgrade health summary
      ansible.builtin.debug:
        msg: >-
          Upgrade health check passed.
          openchami.target={{ openchami_target_post.status.ActiveState }},
          SMD={{ 'OK' if smd_post_status.rc == 0 else 'FAIL' }},
          BSS={{ 'OK' if bss_post_status.rc == 0 else 'FAIL' }}.
  tags: always

- name: Finalize upgrade
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Remove upgrade lock file
      ansible.builtin.file:
        path: "/opt/omnia/.data/upgrade_in_progress.lock"
        state: absent

    - name: Upgrade completed
      ansible.builtin.debug:
        msg: >-
          OpenCHAMI upgrade completed successfully. Lock file removed.
          Re-run provisioning playbooks if node configuration needs refreshing.
  tags: always
