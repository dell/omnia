# Upgrade Orchestrator — Upgrade OpenCHAMI and orchestrator components
# Can be run standalone or imported by orchestrator.yml

- name: Setup orchestrator environment for upgrade
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: orchestrator_setup
      vars:
        openchami_vars_support: true
        omnia_metadata_support: true
        upgrade_mode: true
  tags: always

- name: Upgrade OpenCHAMI components
  hosts: oim
  connection: ssh
  gather_facts: true
