# Prepare OpenCHAMI --- Credential management and functional group generation
# Can be run standalone or imported by orchestrator.yml
#
# This playbook performs preparation steps required before deployment.
# No deployment or installation actions are performed here.
#
# Steps:
#   1. Credential management (prompt, encrypt, vault)
#   2. Generate functional groups from pxe_mapping_file.csv
#
# Prerequisites: orchestrator_setup must have run (handled by always-tagged
#   play in orchestrator.yml, or automatically when run standalone).

# Step 1: Credential management (prompt, encrypt, vault)
- name: Create and update credential config files
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Run credential management
      ansible.builtin.include_role:
        name: collect_orchestrator_credentials
      when:
        - not config_file_status | default(false) | bool
        - (omnia_run_tags | default([]) | intersect(skip_credential_tags | default([])) | length == 0)
          or (omnia_run_tags | default([]) | length == 0)
