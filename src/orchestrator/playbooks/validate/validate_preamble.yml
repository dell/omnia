---

# Validate Preamble — Load standalone prerequisites for validation
# =================================================================
# The role is split by execution host so the preamble logic has one source.
# This playbook preserves the required setup -> localhost -> OIM order.

- name: Setup orchestrator environment
  hosts: localhost
  connection: local
  gather_facts: false
  tags: always
  roles:
    - role: orchestrator_setup
      vars:
        openchami_vars_support: true
        omnia_metadata_support: true
        oim_group: true

- name: Populate standalone prerequisites on localhost
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: validate_preamble

- name: Load cluster configuration and authenticate
  hosts: oim
  connection: ssh
  gather_facts: false
  roles:
    - role: validate_preamble
      tasks_from: oim.yml
