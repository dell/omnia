# Validate Provisioning — Generate inventories + post-provisioning checks
# Can be run standalone or imported by orchestrator.yml
#
# This playbook runs AFTER all provision_*.yml playbooks.
# It queries SMD for all registered nodes and generates all inventories
# in a single pass (no append, no deduplication).
#
# Prerequisites: At least one provision_*.yml playbook must have run.

- name: Setup orchestrator environment
  hosts: localhost
  connection: local
  gather_facts: false
  tags: always
  roles:
    - role: orchestrator_setup
      vars:
        openchami_vars_support: true
        oim_group: true
        orchestrator_initialize_state: false

- name: Authenticate with OpenCHAMI
  hosts: oim
  connection: ssh
  tasks:
    - name: OpenCHAMI cluster authentication
      ansible.builtin.include_role:
        name: orchestrator_common
        tasks_from: openchami_auth.yml
      vars:
        oim_node_name: "{{ hostvars['localhost']['oim_node_name'] }}"

- name: Generate inventories and validate provisioning
  hosts: oim
  connection: ssh
  pre_tasks:
    - name: Resolve validation identities from SMD Hardware Inventory
      openchami_reconcile:
        action: resolve_identities
        cluster_uri: >-
          https://{{ hostvars['localhost']['oim_node_name'] }}.{{
          hostvars['localhost']['domain_name'] }}:8443
        access_token: "{{ openchami_access_token }}"
        ca_cert: "{{ hostvars['localhost']['openchami_ca_cert_path'] }}"
        nodes: >-
          {{ hostvars['localhost']['read_mapping_file']['dict']
             | dict2items | map(attribute='value') | list }}
      check_mode: true
      register: _validation_identity_result
      no_log: true

    - name: Require provisioned SMD Service Tag identities
      ansible.builtin.assert:
        that:
          - _validation_identity_result.planned_inventory_xnames | length == 0
        fail_msg: >-
          SMD Hardware Inventory is missing Service Tag identities for:
          {{ _validation_identity_result.planned_inventory_xnames | join(', ') }}.
          Run the provision phase to bootstrap the identity records.

    - name: Index validation nodes by admin MAC
      ansible.builtin.set_fact:
        _validation_nodes_by_mac: >-
          {% set resolved = {} -%}
          {% for node in _validation_identity_result.nodes -%}
          {% set _ = resolved.update({node.ADMIN_MAC: node}) -%}
          {% endfor -%}
          {{ resolved }}

    - name: Publish SMD-resolved identities for validation
      ansible.builtin.set_fact:
        read_mapping_file: >-
          {{ hostvars['localhost']['read_mapping_file']
             | combine({
                 'dict': hostvars['localhost']['read_mapping_file']['dict']
                         | combine(_validation_nodes_by_mac)
               }) }}
      delegate_to: localhost
      delegate_facts: true
  roles:
    - generate_inventories
    - validate_provisioning

- name: Read nodes.yaml and derive Omnia node facts
  hosts: oim
  connection: ssh
  tasks:
    - name: Read nodes.yaml and derive Omnia node facts
      ansible.builtin.include_role:
        name: passwordless_ssh
        tasks_from: read_nodes_yaml.yml
