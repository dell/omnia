# Validate OpenCHAMI — Verify orchestrator input + OpenCHAMI readiness
# Can be run standalone or imported by orchestrator.yml
#
# Prerequisites: deploy phase must have run first.
# GATE: Provisioning is blocked until all checks pass.
#
# Includes:
#   - Orchestrator input validation (L1 schema + L2 logic)
#   - OpenCHAMI authentication
#   - OpenCHAMI service readiness checks

- name: Setup orchestrator environment
  hosts: localhost
  connection: local
  gather_facts: false
  tags: always
  roles:
    - role: orchestrator_setup
      vars:
        openchami_vars_support: true
        omnia_metadata_support: true
        oim_group: true

- name: Validate orchestrator input configuration
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: validate_orchestrator_input
      when: not config_file_status | default(false) | bool

- name: Authenticate with OpenCHAMI
  hosts: oim
  connection: ssh
  tasks:
    - name: OpenCHAMI authentication
      ansible.builtin.include_role:
        name: orchestrator_common
        tasks_from: openchami_auth.yml
      vars:
        oim_node_name: "{{ hostvars['localhost']['oim_node_name'] }}"

- name: Validate OpenCHAMI readiness
  hosts: oim
  connection: ssh
  roles:
    - validate_openchami
