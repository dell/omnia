---
# Validate IPoIB IPv6 Release — Physical evidence collection and performance benchmarks
#
# ER-ORCH-005 Story 4: Physical Release Evidence
#
# This playbook runs on the physical IB testbed to:
#   1. Run performance benchmarks (allocation latency, artifact throughput, throughput parity)
#   2. Collect hardware/software matrix evidence from each target node
#   3. Compile the release evidence package
#
# Prerequisites:
#   - Physical testbed with ConnectX HCA, IB switch, RHEL 10.x
#   - Stories 1-3 fully implemented and deployed
#   - ib_ipv6_allocation.json populated with real allocations
#
# Usage:
#   ansible-playbook validate_ib_ipv6_release.yml \
#     -e allocation_file=/path/to/ib_ipv6_allocation.json \
#     -e build_id=omnia-2.3.0-rc1

- name: Setup orchestrator environment
  hosts: localhost
  connection: local
  gather_facts: false
  tags: always
  roles:
    - role: orchestrator_setup
      vars:
        openchami_vars_support: true
        oim_group: true
        orchestrator_initialize_state: false

- name: Run IPoIB IPv6 performance benchmarks
  hosts: oim
  connection: ssh
  gather_facts: false
  tags:
    - ib_ipv6_benchmark
    - ib_ipv6_release
  vars:
    evidence_dir: "{{ hostvars['localhost']['orchestrator_output_dir'] }}/ib_ipv6/evidence"
    allocation_file: "{{ hostvars['localhost']['input_dir'] }}/ib_ipv6_allocation.json"
    build_id: "{{ lookup('env', 'OMNIA_BUILD_ID') | default('dev', true) }}"

  tasks:
    - name: Create evidence directory
      ansible.builtin.file:
        path: "{{ evidence_dir }}/benchmarks"
        state: directory
        mode: "0755"
      delegate_to: localhost

    # TC-NFT-001: Allocation validation latency
    - name: "[TC-NFT-001] Allocation validation latency benchmark"
      benchmark_ib_ipv6:
        benchmark: allocation_latency
        allocation_file: "{{ allocation_file }}"
        iterations: 3
        output_dir: "{{ evidence_dir }}/benchmarks"
      register: _bench_alloc_latency
      delegate_to: localhost

    - name: Display allocation latency result
      ansible.builtin.debug:
        msg: >-
          TC-NFT-001 {{ 'PASS' if _bench_alloc_latency.passed else 'FAIL' }}:
          {{ _bench_alloc_latency.result }}

    # TC-NFT-002: Artifact generation throughput
    - name: "[TC-NFT-002] Artifact generation throughput benchmark"
      benchmark_ib_ipv6:
        benchmark: artifact_throughput
        allocation_file: "{{ allocation_file }}"
        iterations: 3
        output_dir: "{{ evidence_dir }}/benchmarks"
      register: _bench_artifact_throughput
      delegate_to: localhost

    - name: Display artifact throughput result
      ansible.builtin.debug:
        msg: >-
          TC-NFT-002 {{ 'PASS' if _bench_artifact_throughput.passed else 'FAIL' }}:
          {{ _bench_artifact_throughput.result }}

    # TC-NFT-003: IPv6/IPv4 throughput parity
    - name: "[TC-NFT-003] IPv6/IPv4 throughput parity benchmark"
      benchmark_ib_ipv6:
        benchmark: throughput_parity
        interface: "{{ ib_ipv6_interface | default('ib0') }}"
        peer_address_v4: "{{ ib_ipv6_peer_v4 | default('') }}"
        peer_address_v6: "{{ ib_ipv6_peer_v6 | default('') }}"
        iterations: 5
        output_dir: "{{ evidence_dir }}/benchmarks"
      register: _bench_throughput_parity

    - name: Display throughput parity result
      ansible.builtin.debug:
        msg: >-
          TC-NFT-003 {{ 'PASS' if _bench_throughput_parity.passed else 'FAIL' }}:
          {{ _bench_throughput_parity.result }}

    # Compile benchmark summary
    - name: Build benchmark summary
      ansible.builtin.set_fact:
        _ib_ipv6_bench_summary:
          TC-NFT-001: "{{ 'PASS' if _bench_alloc_latency.passed else 'FAIL' }}"
          TC-NFT-002: "{{ 'PASS' if _bench_artifact_throughput.passed else 'FAIL' }}"
          TC-NFT-003: "{{ 'PASS' if _bench_throughput_parity.passed else 'FAIL' }}"
          all_passed: >-
            {{ _bench_alloc_latency.passed and
               _bench_artifact_throughput.passed and
               _bench_throughput_parity.passed }}

- name: Collect physical release evidence
  hosts: ib_nodes
  connection: ssh
  gather_facts: true
  tags:
    - ib_ipv6_evidence
    - ib_ipv6_release
  vars:
    evidence_dir: "{{ hostvars['localhost']['orchestrator_output_dir'] }}/ib_ipv6/evidence"
    build_id: "{{ lookup('env', 'OMNIA_BUILD_ID') | default('dev', true) }}"

  tasks:
    - name: Collect IPoIB IPv6 evidence from target node
      collect_ib_ipv6_evidence:
        node_id: "{{ inventory_hostname }}"
        build_id: "{{ build_id }}"
        interfaces: "{{ ib_ipv6_interfaces | default(['ib0']) }}"
        output_dir: "{{ evidence_dir }}"
        test_results: "{{ hostvars[groups['oim'][0]]['_ib_ipv6_bench_summary'] | default({}) }}"
      register: _ib_ipv6_evidence

    - name: Display evidence summary
      ansible.builtin.debug:
        msg: >-
          Evidence collected for {{ inventory_hostname }}
          ({{ _ib_ipv6_evidence.matrix_dimensions.architecture }},
          HCA={{ _ib_ipv6_evidence.matrix_dimensions.hca_model }})

- name: Compile release evidence report
  hosts: localhost
  connection: local
  gather_facts: false
  tags:
    - ib_ipv6_report
    - ib_ipv6_release
  vars:
    evidence_dir: "{{ orchestrator_output_dir }}/ib_ipv6/evidence"

  tasks:
    - name: Find all evidence files
      ansible.builtin.find:
        paths: "{{ evidence_dir }}"
        patterns: "evidence-*.json"
      register: _evidence_files

    - name: Compile release report
      ansible.builtin.template:
        src: "{{ role_path }}/../../roles/ib_ipv6_config/templates/release_report.j2"
        dest: "{{ evidence_dir }}/release-report.md"
        mode: "0644"
      when: _evidence_files.files | length > 0

    - name: Display release gate status
      ansible.builtin.debug:
        msg: >-
          [IB-IPv6] Release evidence package:
          {{ _evidence_files.files | length }} node(s) tested.
          Evidence at {{ evidence_dir }}
