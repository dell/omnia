---
# =============================================================================
# CLEANUP PULP - VARIABLES FILE
# =============================================================================
# All variables for cleanup_pulp playbook are defined here.
# Import this file at the start of cleanup playbooks.
#
# NOTE: pulp_container_name, pulp_image, pulp_protocol_https, max_retries
#       are defined in vars/default.yml to avoid duplication.
# =============================================================================

# Directories/files to remove during Pulp cleanup (runs on OIM)
# NOTE: We clean both current paths (omnia_base_dir) and stale paths (oim_shared_path/omnia)
pulp_cleanup_directory:
  # Clean up current Pulp data (omnia_base_dir structure - /opt/omnia/pulp/)
  - "{{ omnia_base_dir }}/pulp/pulp_ha/cli.toml"
  - "{{ omnia_base_dir }}/pulp/settings"
  - "{{ omnia_base_dir }}/pulp/nginx"
  - "{{ omnia_base_dir }}/log/pulp"
  # Clean up STALE Pulp data (old oim_shared_path structure - /opt/omnia/omnia/pulp/)
  - "{{ oim_shared_path }}/omnia/pulp/pulp_ha/cli.toml"
  - "{{ oim_shared_path }}/omnia/pulp/settings"
  - "{{ oim_shared_path }}/omnia/pulp/nginx"
  - "{{ oim_shared_path }}/omnia/log/pulp"
  # Clean up other Pulp-related directories
  - "{{ omnia_base_dir }}/rhel_repo_certs"
  - "{{ omnia_base_dir }}/offline_repo"

# Pulp CLI config files to remove
pulp_cli_config_files:
  - "{{ omnia_base_dir }}/pulp/pulp_ha/cli.toml"
  - "/root/.config/pulp/cli.toml"
  - "/root/.config/pulp"

# Credential files to remove (optional - controlled by cleanup_credentials flag)
credential_files_to_cleanup:
  - "{{ input_project_dir }}/repo_manager_config_credentials.yml"
  - "{{ input_project_dir }}/.repo_manager_config_credentials_key"

# Track file created by Pulp HTTPS config
track_file_path: "{{ pulp_crt_track_file }}"

# Omnia target file that may reference pulp.service
omnia_target: "/etc/systemd/system/omnia.target"

# =============================================================================
# CLEANUP CONFIGURATION
# =============================================================================
# Cleanup flags for different components
# Usage:
#   Interactive:    ansible-playbook cleanup_pulp.yml  (prompts for credential deletion)
#   Preserve logs:  ansible-playbook cleanup_pulp.yml -e "cleanup_logs=false"
#   Force delete:   ansible-playbook cleanup_pulp.yml -e "cleanup_credentials=true"
#   Force preserve: ansible-playbook cleanup_pulp.yml -e "cleanup_credentials=false"
# =============================================================================

cleanup_logs: true
# cleanup_credentials is intentionally NOT set here to enable interactive prompting
# Set it via CLI to override: -e "cleanup_credentials=true" or -e "cleanup_credentials=false"

# Cleanup instructions message
cleanup_pulp_note: |
  [Post-Cleanup Actions Required]
  1. Pulp container and related data have been removed.
  2. Pulp CLI configuration files have been removed.
  3. Credential files have been removed (if cleanup_credentials=true).
  4. To redeploy Pulp, run: ansible-playbook playbooks/deploy/deploy_pulp.yml
  5. The offline_repo directory has been removed. You must re-sync repositories if needed.
  6. The log directory has been cleaned for fresh deployment.
  7. To preserve logs, run with: -e "cleanup_logs=false"
  8. To preserve credentials, run with: -e "cleanup_credentials=false"
