# =============================================================================
# CREDENTIAL CONFIGURATION - CENTRALIZED
# =============================================================================
# This file contains all credential-related configuration for repo_manager.
# Import this file in playbooks that need credential management.
# =============================================================================

# -----------------------------------------------------------------------------
# CREDENTIAL FILE DEFINITIONS
# -----------------------------------------------------------------------------
# Each credential file entry defines:
#   - credential_type: Human-readable name
#   - file_path: Path to the credential file
#   - vault_path: Path to the Ansible Vault password file
#   - template: Jinja2 template for creating new credential files
#   - file_mode: File permissions
#   - condition: Whether this credential is required

credential_files:
  - credential_type: "Repo Manager"
    file_path: "{{ input_project_dir }}/repo_manager_config_credentials.yml"
    vault_path: "{{ input_project_dir }}/.repo_manager_config_credentials_key"
    template: "repo_manager_credential.j2"
    file_mode: "0600"
    condition: true

# -----------------------------------------------------------------------------
# CREDENTIAL REQUIREMENTS BY SERVICE/TAG
# -----------------------------------------------------------------------------
# Defines which credentials are required for each service/tag.
# Types:
#   - mandatory: Must be provided, cannot be empty
#   - optional: Can be skipped by pressing Enter
#   - conditional_mandatory: Required when specific features are enabled

repo_manager_credentials:
  local_repo:
    mandatory:
      - {username: pulp_username, password: pulp_password}
    optional:
      - {username: docker_username, password: docker_password}
