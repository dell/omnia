---
# =============================================================================
# DEFAULT VARIABLES FOR REPO_MANAGER
# =============================================================================
# All paths are relative to repo_manager_base_dir so the src/ directory can be
# copied anywhere. This file is included by all playbooks.
#
# NOTE: All playbooks run on localhost (OIM). There is no SSH to remote hosts.
# =============================================================================

# -----------------------------------------------------------------------------
# CATALOG PLATFORM CONFIGURATION
# -----------------------------------------------------------------------------
# Functional-layer names remain the runtime source of the OS minor version and
# selected architecture(s). These values define supported platform vocabulary
# and deterministic processing order; they are not runtime version fallbacks.
platform_config:
  default_os_type: "rhel"
  version_order: "ascending"
  architecture_order:
    - "x86_64"
    - "aarch64"

# Platform capabilities are declarative. A disabled profile is rejected before
# credentials, package-manager cache changes, or Pulp content operations.
platform_profiles:
  rhel:
    enabled: true
    package_manager: "dnf"
    package_backend: "pulp_rpm"
    repository_access: "rhsm"
    subscription_repositories:
      - "baseos"
      - "appstream"
      - "codeready-builder"
    target_python_by_os_major:
      "10": "3.12"
  sles:
    enabled: false
    implementation_status: "placeholder"
    package_manager: "zypper"
    package_backend: "pulp_rpm"
    repository_access: "suseconnect"
  ubuntu:
    enabled: false
    implementation_status: "placeholder"
    package_manager: "apt"
    package_backend: "pulp_deb"
    repository_access: "explicit"

# -----------------------------------------------------------------------------
# BASE DIRECTORY CONFIGURATION
# -----------------------------------------------------------------------------
# Base directory is the repo_manager source directory (parent of playbooks/)
# Works regardless of whether playbooks run from playbooks/ or any subdirectory
repo_manager_base_dir: >-
  {{ playbook_dir | regex_replace('/playbooks(?:/.*)?$', '') }}

# Project default identifier
project_default: "project_default"
repo_manager_metadata_support: false

# -----------------------------------------------------------------------------
# OMNIA BASE DIRECTORY CONFIGURATION
# -----------------------------------------------------------------------------
# Runtime-generated files (Pulp config, RHEL entitlement certificates) live
# outside the repo_manager source tree.
# Reads from OMNIA_DATA_PATH environment variable (default: /opt/omnia)
omnia_data_path: >-
  {{ (lookup('env', 'OMNIA_DATA_PATH')
      | default(lookup('env', 'OMNIA_BASE_DIR'), true)
      | default('/opt/omnia', true))
     | ansible.builtin.normpath }}

# Optional Repo Manager-specific override. When unset, runtime data follows
# <OMNIA_DATA_PATH>/repo_manager, matching the Image Build Manager pattern.
repo_manager_runtime_dir: >-
  {{ (lookup('env', 'REPO_MANAGER_DATA_PATH')
      | default(omnia_data_path + '/repo_manager', true))
     | ansible.builtin.normpath }}

# Backward-compatible alias used by existing roles and module environments.
omnia_base_dir: "{{ omnia_data_path }}"

# Project name from environment variable (default: project_default)
# Reads from OMNIA_PROJECT_NAME environment variable
omnia_project_name: "{{ lookup('env', 'OMNIA_PROJECT_NAME') | default(project_default, true) }}"

# -----------------------------------------------------------------------------
# DATA DIRECTORIES (organized under repo_manager domain)
# -----------------------------------------------------------------------------
repo_manager_data_dir: "{{ repo_manager_runtime_dir }}/.data"
repo_manager_log_dir: "{{ repo_manager_runtime_dir }}/log"
repo_manager_offline_repo_dir: "{{ repo_manager_runtime_dir }}/offline_repo"

# -----------------------------------------------------------------------------
# CONSTRUCTED PATHS
# -----------------------------------------------------------------------------
# Input path: <OMNIA_DATA_PATH>/repo_manager/input/<OMNIA_PROJECT_NAME>/
# Example: /opt/omnia/repo_manager/input/project_default/
input_project_dir: >-
  {{ (lookup('env', 'REPO_MANAGER_INPUT_PROJECT_DIR')
      | default(repo_manager_runtime_dir + '/input/' +
                (project_name | default(omnia_project_name, true)), true))
     | ansible.builtin.normpath }}
# Output path: <OMNIA_DATA_PATH>/repo_manager/output/<OMNIA_PROJECT_NAME>/
output_project_dir: "{{ repo_manager_runtime_dir }}/output/{{ project_name | default(omnia_project_name, true) }}"
output_dir: "{{ output_project_dir }}"
log_dir: "{{ repo_manager_log_dir }}"
repo_store_path: "{{ repo_manager_runtime_dir }}"
omnia_metadata_file: "{{ repo_manager_runtime_dir }}/.data/oim_metadata.yml"

# -----------------------------------------------------------------------------
# ENDPOINT CONFIGURATION
# -----------------------------------------------------------------------------
repo_manager_endpoint_config: "{{ input_project_dir }}/repo_manager_endpoint_config.yml"
repo_manager_config_file: "{{ input_project_dir }}/repo_manager_config.yml"
repo_manager_credentials_file: >-
  {{ input_project_dir }}/repo_manager_config_credentials.yml
repo_manager_credentials_key_file: >-
  {{ input_project_dir }}/.repo_manager_config_credentials_key
endpoint_config_file_not_found_msg: "repo_manager_endpoint_config.yml file not found in input folder."
endpoint_config_syntax_fail_msg: "Failed. Syntax errors present in repo_manager_endpoint_config.yml."

# -----------------------------------------------------------------------------
# PULP SERVER CONFIGURATION
# -----------------------------------------------------------------------------
# Pulp runtime base directory. This follows REPO_MANAGER_DATA_PATH or
# <OMNIA_DATA_PATH>/repo_manager and is not hardcoded to /opt/omnia.
pulp_config_dir: "{{ repo_manager_runtime_dir }}/pulp_config"

# Pulp publication paths. The content route is owned by the Pulp image and
# must not be changed independently. The distribution root is relative because
# Pulp CLI --base-path values must never contain the /pulp/content route.
# Keeping these defaults preserves all existing repository URLs.
pulp_content_paths:
  content_route: "/pulp/content"
  distribution_root: "offline_repo/cluster"

# Absolute staging root derived from the relative Pulp distribution namespace.
# Users must not set this value directly.
pulp_distribution_root_dir: >-
  {{ repo_manager_runtime_dir }}/{{ pulp_content_paths.distribution_root }}

# The default section preserves the existing Pulp directory layout. Add only
# required custom paths under user_provided.
#
# User-provided paths must be absolute, must already exist, and must be writable
# directories. Repo Manager uses them exactly as provided. It does not create
# or format filesystems, manage NFS mounts, attach block volumes, configure LVM,
# or copy existing Pulp data. Storage must be prepared and mounted before the
# prepare tag is run.
#
# Full Pulp cleanup removes Pulp data from the resolved directories. Therefore,
# always use dedicated subdirectories below storage mount points, never the
# mount roots themselves.
#
# Recommended storage placement:
#   database_path:       dedicated persistent SSD or block volume (highest)
#   container_work_path: local SSD or persistent block volume
#   content_path:        high-capacity persistent NFS or dedicated block volume
#   settings_path:       persistent NFS, local disk, or block storage
#   cli_config_path:     persistent storage with restricted access
#   service_log_path:    local disk
#
# Example administrator-created storage:
#   NFS mount:       /mnt/omnia-pulp-nfs
#   SSD/block mount: /mnt/omnia-pulp-ssd
#
# Example user_provided values:
#   settings_path:       "/mnt/omnia-pulp-nfs/settings"
#   database_path:       "/mnt/omnia-pulp-ssd/postgresql"
#   content_path:        "/mnt/omnia-pulp-nfs/content"
#   container_work_path: "/mnt/omnia-pulp-ssd/container-work"
#   service_log_path:    "/var/log/omnia/pulp"
#   cli_config_path:     "/mnt/omnia-pulp-nfs/cli-config"
#
# When only one SSD/block volume is available, move database_path first and
# container_work_path second. Keep content_path on high-capacity NFS unless the
# block volume has sufficient dedicated capacity.
pulp_storage_paths:
  # Internal defaults. Do not modify.
  default:
    settings_path: "{{ pulp_config_dir }}/settings"
    database_path: "{{ pulp_config_dir }}/settings/pgsql"
    content_path: "{{ pulp_config_dir }}/settings/pulp_storage"
    container_work_path: "{{ pulp_config_dir }}/settings/containers"
    service_log_path: "{{ repo_manager_log_dir }}/pulp"
    cli_config_path: "{{ pulp_config_dir }}/pulp_ha"

  # Optional absolute paths. Keep this dictionary empty to preserve all
  # existing paths and behavior. Specify only the paths that must be replaced.
  user_provided: {}

# Internal merge. Users must not modify this variable. A user-provided entry
# replaces only the matching default entry.
pulp_resolved_storage_paths: >-
  {{ pulp_storage_paths.default | combine(pulp_storage_paths.user_provided) }}

pulp_deployment_defaults:
  container_name: "pulp"
  image: "docker.io/pulp/pulp:3.114.2"

  # REQUIRED CONTAINER PATHS - DO NOT MODIFY.
  # The Pulp image and services expect these exact destinations. Customize only
  # the host paths under pulp_storage_paths.user_provided.
  container_mounts:
    settings_path: "/etc/pulp"
    database_path: "/var/lib/pgsql"
    content_path: "/var/lib/pulp"
    container_work_path: "/var/lib/containers"
    service_log_path: "/var/log/pulp"
    cli_config_path: "/root/.config/pulp"

  workers:
    task: 10
    api: 10
    content: 10

  timeouts:
    gunicorn_seconds: 120
    api_max_requests: 1000
    api_max_requests_jitter: 50

  https:
    container_port: 443
    certificate_validity_days: 3650
    certificate_renewal_threshold_seconds: 2592000

# Internal compatibility aliases. Users must modify only
# pulp_storage_paths.user_provided. These aliases retain all existing code paths.
pulp_settings_dir: "{{ pulp_resolved_storage_paths.settings_path }}"
pulp_database_dir: "{{ pulp_resolved_storage_paths.database_path }}"
pulp_content_dir: "{{ pulp_resolved_storage_paths.content_path }}"
pulp_container_work_dir: >-
  {{ pulp_resolved_storage_paths.container_work_path }}
pulp_logs_dir: "{{ pulp_resolved_storage_paths.service_log_path }}"
pulp_cli_config_dir: "{{ pulp_resolved_storage_paths.cli_config_path }}"
pulp_system_cli_config_file: >-
  {{ pulp_deployment_defaults.container_mounts.settings_path }}/cli.toml
pulp_root_cli_config_dir: "/root/.config/pulp"
pulp_root_cli_config_file: "{{ pulp_root_cli_config_dir }}/cli.toml"
pulp_repo_file_path: "/etc/yum.repos.d/pulp.repo"
# Cleanup invalidates these consumers before removing the Pulp endpoint. Keep
# the list in shared defaults because full cleanup and configuration cleanup
# use the same contract.
pulp_consumer_state_files:
  - "{{ pulp_repo_file_path }}"
  - "{{ output_project_dir }}/repo_status.yml"
pulp_quadlet_dir: "/etc/containers/systemd"
pulp_quadlet_file: "{{ pulp_quadlet_dir }}/{{ pulp_container_name }}.container"
pulp_firewalld_service_file: "/etc/firewalld/services/omnia-pulp.xml"
omnia_systemd_target_file: "/etc/systemd/system/omnia.target"
pulp_certs_dir: "{{ pulp_settings_dir }}/certs"
pulp_server_crt: "{{ pulp_certs_dir }}/pulp_webserver.crt"
pulp_server_key: "{{ pulp_certs_dir }}/pulp_webserver.key"
pulp_server_csr: "{{ pulp_certs_dir }}/pulp_webserver.csr"
pulp_secret_key_file: "{{ pulp_settings_dir }}/.pulp_secret_key"
pulp_ca_trust_file: "/etc/pki/ca-trust/source/anchors/omnia-pulp.crt"
pulp_cli_executable: "/usr/local/bin/pulp"
pulp_cli_backend: "/usr/local/libexec/omnia-pulp-cli"
# A non-empty OMNIA_VENV_PATH selects venv mode. Unset or empty selects the
# system runtime. VIRTUAL_ENV is intentionally not used as an implicit input.
pulp_system_python_executable: "/usr/bin/python3"
pulp_venv_path: "{{ lookup('env', 'OMNIA_VENV_PATH') | trim }}"
pulp_cli_runtime_mode: >-
  {{ 'venv' if pulp_venv_path | length > 0 else 'system' }}
pulp_venv_cli_executable: >-
  {{ (pulp_venv_path | ansible.builtin.normpath) + '/bin/pulp'
     if pulp_venv_path | length > 0 else '' }}
pulp_venv_python_executable: >-
  {{ (pulp_venv_path | ansible.builtin.normpath) + '/bin/python'
     if pulp_venv_path | length > 0 else '' }}
pulp_cli_runtime_python_executable: >-
  {{ pulp_venv_python_executable
     if pulp_cli_runtime_mode == 'venv'
     else pulp_system_python_executable }}
# Repo Manager versions before the HTTPS deployment rewrite used this name.
# Remove it during deployment/cleanup so a rotated self-signed certificate
# cannot leave two trust anchors with the same subject but different keys.
pulp_legacy_ca_trust_files:
  - "/etc/pki/ca-trust/source/anchors/pulp_webserver.crt"
pulp_container_name: "{{ pulp_deployment_defaults.container_name }}"
pulp_image: "{{ pulp_deployment_defaults.image }}"

# -----------------------------------------------------------------------------
# RHEL SUBSCRIPTION CERTIFICATES
# -----------------------------------------------------------------------------
rhel_repo_certs_dir: "{{ repo_manager_runtime_dir }}/rhel_repo_certs"

# -----------------------------------------------------------------------------
# FILE PERMISSIONS
# -----------------------------------------------------------------------------
dir_permissions_755: "0755"
file_permissions_644: "0644"

# -----------------------------------------------------------------------------
# RETRY CONFIGURATION
# -----------------------------------------------------------------------------
max_retries: 10

# -----------------------------------------------------------------------------
# PARALLEL EXECUTION CONFIGURATION
# -----------------------------------------------------------------------------
parallel_config:
  # Worker processes for catalog package downloads (1-5).
  # Default is 3. Reduce to 1 for maximum stability on constrained Pulp hosts.
  default_nthreads: 2
  default_timeout_seconds: 60
  task_poll_interval_seconds: 10

# Keep DNF command concurrency independent from the general artifact worker
# pool. This protects the shared per-architecture DNF metadata cache even when
# parallel_config.default_nthreads is increased for images and other artifacts.
dnf_config:
  max_concurrent_commands: 1  # ENV: REPO_MANAGER_DNF_MAX_CONCURRENT_COMMANDS

# -----------------------------------------------------------------------------
# DOWNLOAD CONFIGURATION
# -----------------------------------------------------------------------------
download_config:
  tarball_timeout_minutes: 45
  file_timeout_minutes: 1
  iso_timeout_minutes: 45

# -----------------------------------------------------------------------------
# CONTAINER SYNC POLICY
# -----------------------------------------------------------------------------
# Default sync policy for container images.
# For airgap: always use "immediate" to ensure full download
# Options: immediate | on_demand | streamed
container_sync_policy: "immediate"

# -----------------------------------------------------------------------------
# PULP CONFIGURATION
# -----------------------------------------------------------------------------
# pulp_config.concurrency is DEPRECATED and not used in default code path
# The actual parallelism is controlled by rpm_repo_config.thread_pool_size
# pulp_config:
#   concurrency: 4

# -----------------------------------------------------------------------------
# RPM REPOSITORY PROCESSING CONFIGURATION
# -----------------------------------------------------------------------------
rpm_repo_config:
  # Number of RPM repositories to process in parallel in every Pulp stage (1-10).
  # Default is 3. Reduce to 1 for slow or heavily shared NFS-backed storage.
  thread_pool_size: 3      # ENV: REPO_MANAGER_THREAD_POOL_SIZE

  # Continue processing other repositories to collect complete diagnostics.
  # Any repository-stage failure still fails the module before artifact tasks.
  continue_on_failure: true  # ENV: REPO_MANAGER_CONTINUE_ON_FAILURE

  # Progress-based stuck detection timeout in seconds
  # If download/parsing progress doesn't change for this long, sync is considered stuck
  sync_stuck_timeout: 600  # ENV: REPO_MANAGER_SYNC_STUCK_TIMEOUT (10 minutes)

  # How often to check Pulp task progress in seconds
  progress_check_interval: 30  # ENV: REPO_MANAGER_PROGRESS_CHECK_INTERVAL

  # A single CLI API request must outlive the Pulp Gunicorn request timeout.
  cli_query_timeout: 150  # ENV: REPO_MANAGER_PULP_QUERY_TIMEOUT

  # Retry read-only Pulp CLI queries when the API is temporarily restarting or
  # overloaded. Mutating commands are reconciled by correlation ID instead.
  cli_query_retries: 3  # ENV: REPO_MANAGER_PULP_QUERY_RETRIES
  cli_query_retry_delay: 5  # ENV: REPO_MANAGER_PULP_QUERY_RETRY_DELAY

  # Stop monitoring safely when task state cannot be observed for this long.
  # No cancellation or rollback is attempted while task state is unknown.
  api_unavailable_timeout: 600  # ENV: REPO_MANAGER_PULP_API_UNAVAILABLE_TIMEOUT

  # Roll back only repository versions created by a timed-out sync. The Pulp
  # repository and its last known-good publication/distribution are retained.
  cleanup_on_timeout: true  # ENV: REPO_MANAGER_CLEANUP_ON_TIMEOUT

# -----------------------------------------------------------------------------
# OIM SHARED PATH CONFIGURATION (for NFS scenarios)
# -----------------------------------------------------------------------------
oim_shared_path: "{{ (oim_shared_path_from_metadata | default({})).get('oim_shared_path', omnia_base_dir) }}"
nfs_server_share_path: "{{ (oim_shared_path_from_metadata | default({})).get('nfs_server_share_path', '') }}"
omnia_share_option: "{{ (oim_shared_path_from_metadata | default({})).get('omnia_share_option', 'Local') }}"
nfs_type: "{{ (oim_shared_path_from_metadata | default({})).get('nfs_type', '') }}"

# =============================================================================
# FAILURE AND ASSERTION MESSAGES
# =============================================================================
cleanup_pulp_validate_pulp_cleanup_targets_are_not_broad_system_paths_msg: "Unsafe Pulp cleanup target refused: {{ item }}"

cleanup_pulp_validate_pulp_distribution_root_msg: >-
  Unsafe Pulp distribution_root refused. Configure a relative path
  containing no empty, current-directory, or parent-directory segments.

cleanup_pulp_validate_consumer_state_targets_msg: >-
  Unsafe Pulp consumer-state cleanup target refused: {{ item }}

cleanup_pulp_fail_when_consumer_state_remains_msg: >-
  Pulp consumer state remains after cleanup invalidation: {{ item.item }}


cleanup_pulp_fail_when_pulp_runtime_objects_remain_msg: "Pulp container still exists; refusing to delete Pulp data directories"

cleanup_repos_fail_if_pulp_cli_is_not_available_msg: |
  Pulp CLI not found at {{ pulp_cli_executable }}.
  Please ensure pulp-cli is installed and the virtual environment is activated:
    source <venv_path>/bin/activate
    pip install pulp-cli
  Then run the playbook again to create the symlink automatically.

cleanup_repos_validate_cleanup_catalog_context_msg: >-
  Cleanup requires a valid CATALOG_FILE_PATH so repository state is
  updated under the correct OS version and architecture.


cleanup_repos_validate_input_at_least_one_cleanup_type_must_be_specified_msg: |
  No cleanup items specified. Please provide at least one of:
    cleanup_repos: ['repo1', 'repo2']
    cleanup_containers: ['container1', 'container2']
    cleanup_files: ['file1', 'file2']
    cleanup_pulp_config: true


cleanup_repos_fail_when_pulp_endpoint_is_unavailable_for_artifact_cleanup_msg: >-
  Pulp endpoint is not available. Cleanup was not started.
  {{ cleanup_pulp_endpoint.stderr | default('No endpoint details returned.') }}

cleanup_repos_validate_pulp_configuration_cleanup_paths_msg: "Unsafe Pulp config cleanup target refused: {{ item }}"

cleanup_repos_fail_when_pulp_container_remains_after_config_cleanup_msg: "Pulp container still exists; refusing to remove its configuration"

deploy_pulp_require_pulp_credentials_msg: "Pulp administrator credentials are required for deployment."

download_fail_if_pulp_cli_is_not_available_msg: |
  Pulp CLI not found at {{ pulp_cli_executable }}.
  Please ensure pulp-cli is installed and the virtual environment is activated:
    source <venv_path>/bin/activate
    pip install pulp-cli
  Then run the playbook again to create the symlink automatically.

download_pulp_validation_failed_aborting_operations_msg: |
  PULP VALIDATION FAILED
  =====================
  Pulp container or endpoint is not available.
  Please ensure Pulp is properly deployed and running before proceeding.

  Troubleshooting steps:
  1. Check if Pulp container is running: podman ps | grep pulp
  2. Check Pulp container logs: podman logs pulp
  3. Restart Pulp if needed: podman restart pulp
  4. Verify network connectivity to Pulp endpoint
  5. Check Pulp status: pulp status


generate_repo_status_fail_if_pulp_cli_is_not_available_msg: |
  Pulp CLI not found at {{ pulp_cli_executable }}.
  Please ensure pulp-cli is installed and the virtual environment is activated:
    source <venv_path>/bin/activate
    pip install pulp-cli
  Then run the playbook again to create the symlink automatically.

generate_repo_status_fail_when_catalog_required_rpm_repositories_are_unavailable_msg: >-
  repo_status.yml describes an incomplete Pulp state. Missing RPM
  repositories by context:
  {{ incomplete_status_contexts | to_nice_json }}.
  Run repo_manager.yml with --tags "download,status" to restore them.

validate_config_fail_if_repo_manager_config_yml_is_missing_msg: |
  repo_manager_config.yml not found.
  File: {{ repo_manager_config_file }}
  Please create the configuration file.
