---
# =============================================================================
# DEFAULT VARIABLES FOR REPO_MANAGER
# =============================================================================
# All paths are relative to repo_manager_base_dir so the src/ directory can be
# copied anywhere. This file is included by all playbooks.
#
# NOTE: All playbooks run on localhost (OIM). There is no SSH to remote hosts.
# =============================================================================

# -----------------------------------------------------------------------------
# BASE DIRECTORY CONFIGURATION
# -----------------------------------------------------------------------------
# Base directory is the repo_manager source directory (parent of playbooks/)
# Works regardless of whether playbooks run from playbooks/ or any subdirectory
repo_manager_base_dir: "{{ playbook_dir | dirname | dirname }}"

# Project default identifier
project_default: "project_default"
repo_manager_metadata_support: false

# -----------------------------------------------------------------------------
# OMNIA BASE DIRECTORY CONFIGURATION
# -----------------------------------------------------------------------------
# Runtime-generated files (Pulp config, RHEL entitlement certificates) live
# outside the repo_manager source tree.
# Reads from OMNIA_DATA_PATH environment variable (default: /opt/omnia)
omnia_data_path: >-
  {{ (lookup('env', 'OMNIA_DATA_PATH')
      | default(lookup('env', 'OMNIA_BASE_DIR'), true)
      | default('/opt/omnia', true))
     | ansible.builtin.normpath }}

# Optional Repo Manager-specific override. When unset, runtime data follows
# <OMNIA_DATA_PATH>/repo_manager, matching the Image Build Manager pattern.
repo_manager_runtime_dir: >-
  {{ (lookup('env', 'REPO_MANAGER_DATA_PATH')
      | default(omnia_data_path + '/repo_manager', true))
     | ansible.builtin.normpath }}

# Backward-compatible alias used by existing roles and module environments.
omnia_base_dir: "{{ omnia_data_path }}"

# Project name from environment variable (default: project_default)
# Reads from OMNIA_PROJECT_NAME environment variable
omnia_project_name: "{{ lookup('env', 'OMNIA_PROJECT_NAME') | default(project_default, true) }}"

# -----------------------------------------------------------------------------
# DATA DIRECTORIES (organized under repo_manager domain)
# -----------------------------------------------------------------------------
repo_manager_data_dir: "{{ repo_manager_runtime_dir }}/.data"
repo_manager_log_dir: "{{ repo_manager_runtime_dir }}/log"
repo_manager_offline_repo_dir: "{{ repo_manager_runtime_dir }}/offline_repo"

# -----------------------------------------------------------------------------
# CONSTRUCTED PATHS
# -----------------------------------------------------------------------------
# Input path: <OMNIA_DATA_PATH>/repo_manager/input/<OMNIA_PROJECT_NAME>/
# Example: /opt/omnia/repo_manager/input/project_default/
input_project_dir: >-
  {{ (lookup('env', 'REPO_MANAGER_INPUT_PROJECT_DIR')
      | default(repo_manager_runtime_dir + '/input/' +
                (project_name | default(omnia_project_name, true)), true))
     | ansible.builtin.normpath }}
# Output path: <OMNIA_DATA_PATH>/repo_manager/output/<OMNIA_PROJECT_NAME>/
output_project_dir: "{{ repo_manager_runtime_dir }}/output/{{ project_name | default(omnia_project_name, true) }}"
output_dir: "{{ output_project_dir }}"
log_dir: "{{ repo_manager_log_dir }}"
repo_store_path: "{{ repo_manager_runtime_dir }}"
omnia_metadata_file: "{{ repo_manager_runtime_dir }}/.data/oim_metadata.yml"

# -----------------------------------------------------------------------------
# ENDPOINT CONFIGURATION
# -----------------------------------------------------------------------------
repo_manager_endpoint_config: "{{ input_project_dir }}/repo_manager_endpoint_config.yml"
endpoint_config_file_not_found_msg: "repo_manager_endpoint_config.yml file not found in input folder."
endpoint_config_syntax_fail_msg: "Failed. Syntax errors present in repo_manager_endpoint_config.yml."

# -----------------------------------------------------------------------------
# PULP SERVER CONFIGURATION
# -----------------------------------------------------------------------------
# Pulp directories organized under repo_manager domain
pulp_config_dir: "{{ repo_manager_runtime_dir }}/pulp_config"
pulp_certs_dir: "{{ pulp_config_dir }}/settings/certs"
pulp_server_crt: "{{ pulp_certs_dir }}/pulp_webserver.crt"
pulp_server_key: "{{ pulp_certs_dir }}/pulp_webserver.key"
pulp_server_csr: "{{ pulp_certs_dir }}/pulp_webserver.csr"
pulp_secret_key_file: "{{ pulp_config_dir }}/settings/.pulp_secret_key"
pulp_ca_trust_file: "/etc/pki/ca-trust/source/anchors/omnia-pulp.crt"
pulp_cli_executable: "/usr/local/bin/pulp"
pulp_cli_backend: "/usr/local/libexec/omnia-pulp-cli"
# Repo Manager versions before the HTTPS deployment rewrite used this name.
# Remove it during deployment/cleanup so a rotated self-signed certificate
# cannot leave two trust anchors with the same subject but different keys.
pulp_legacy_ca_trust_files:
  - "/etc/pki/ca-trust/source/anchors/pulp_webserver.crt"
pulp_logs_dir: "{{ repo_manager_runtime_dir }}/log/pulp"
pulp_container_name: "pulp"
pulp_image: "docker.io/pulp/pulp:3.114.2"

# -----------------------------------------------------------------------------
# RHEL SUBSCRIPTION CERTIFICATES
# -----------------------------------------------------------------------------
rhel_repo_certs_dir: "{{ repo_manager_runtime_dir }}/rhel_repo_certs"
rhel_redhat_repo_file: "{{ rhel_repo_certs_dir }}/redhat.repo"
rhel_uep_cert_file: "{{ rhel_repo_certs_dir }}/redhat-uep.pem"

# -----------------------------------------------------------------------------
# FILE PERMISSIONS
# -----------------------------------------------------------------------------
dir_permissions_755: "0755"
file_permissions_644: "0644"
file_permissions_600: "0600"

# -----------------------------------------------------------------------------
# RETRY CONFIGURATION
# -----------------------------------------------------------------------------
max_retries: 10

# -----------------------------------------------------------------------------
# PARALLEL EXECUTION CONFIGURATION
# -----------------------------------------------------------------------------
parallel_config:
  # Worker processes for catalog package downloads (1-5).
  # Keep at 1 for maximum stability; increase only after validating the Pulp host.
  default_nthreads: 1
  default_timeout_seconds: 60
  task_poll_interval_seconds: 10

# Keep DNF command concurrency independent from the general artifact worker
# pool. This protects the shared per-architecture DNF metadata cache even when
# parallel_config.default_nthreads is increased for images and other artifacts.
dnf_config:
  max_concurrent_commands: 1  # ENV: REPO_MANAGER_DNF_MAX_CONCURRENT_COMMANDS

# -----------------------------------------------------------------------------
# DOWNLOAD CONFIGURATION
# -----------------------------------------------------------------------------
download_config:
  tarball_timeout_minutes: 45
  file_timeout_minutes: 1
  iso_timeout_minutes: 45

# -----------------------------------------------------------------------------
# CONTAINER SYNC POLICY
# -----------------------------------------------------------------------------
# Default sync policy for container images.
# For airgap: always use "immediate" to ensure full download
# Options: immediate | on_demand | streamed
container_sync_policy: "immediate"

# -----------------------------------------------------------------------------
# PULP CONFIGURATION
# -----------------------------------------------------------------------------
# pulp_config.concurrency is DEPRECATED and not used in default code path
# The actual parallelism is controlled by rpm_repo_config.thread_pool_size
# pulp_config:
#   concurrency: 4

# -----------------------------------------------------------------------------
# RPM REPOSITORY PROCESSING CONFIGURATION
# -----------------------------------------------------------------------------
rpm_repo_config:
  # Number of RPM repositories to process in parallel in every Pulp stage (1-10).
  # Keep at 1 for NFS-backed Pulp storage; increase gradually after validation.
  thread_pool_size: 1      # ENV: REPO_MANAGER_THREAD_POOL_SIZE

  # Maximum time for any single Pulp command in seconds
  pulp_timeout: 86400      # ENV: REPO_MANAGER_PULP_TIMEOUT (24 hours)

  # Continue processing other repos if one fails
  continue_on_failure: true # ENV: REPO_MANAGER_CONTINUE_ON_FAILURE

  # File lock wait time in seconds
  file_lock_timeout: 60    # ENV: REPO_MANAGER_FILE_LOCK_TIMEOUT

  # Progress-based stuck detection timeout in seconds
  # If download/parsing progress doesn't change for this long, sync is considered stuck
  sync_stuck_timeout: 600  # ENV: REPO_MANAGER_SYNC_STUCK_TIMEOUT (10 minutes)

  # How often to check Pulp task progress in seconds
  progress_check_interval: 30  # ENV: REPO_MANAGER_PROGRESS_CHECK_INTERVAL

  # Cleanup behavior after stuck sync timeout
  cleanup_on_timeout: true  # ENV: REPO_MANAGER_CLEANUP_ON_TIMEOUT (clean up partial repo state after timeout)
  cleanup_orphans_only: false  # ENV: REPO_MANAGER_CLEANUP_ORPHANS_ONLY (if true, only clean orphans, don't delete repo)

# -----------------------------------------------------------------------------
# CLEANUP CONFIGURATION
# -----------------------------------------------------------------------------
cleanup_config:
  delete_remote: true
  delete_distribution: true
  cleanup_orphans: true
  list_only: false
  force: false

# -----------------------------------------------------------------------------
# OIM SHARED PATH CONFIGURATION (for NFS scenarios)
# -----------------------------------------------------------------------------
oim_shared_path: "{{ (oim_shared_path_from_metadata | default({})).get('oim_shared_path', omnia_base_dir) }}"
nfs_server_share_path: "{{ (oim_shared_path_from_metadata | default({})).get('nfs_server_share_path', '') }}"
omnia_share_option: "{{ (oim_shared_path_from_metadata | default({})).get('omnia_share_option', 'Local') }}"
nfs_type: "{{ (oim_shared_path_from_metadata | default({})).get('nfs_type', '') }}"
nfs_server_ip: "{{ (oim_shared_path_from_metadata | default({})).get('nfs_server_ip', '') }}"
