# =============================================================================
# CLEANUP PULP - VALIDATION PLAYBOOK
# =============================================================================
# This playbook performs pre-cleanup validation:
#   1. Include input project directory
#   2. Create OIM host group
#   3. Validate Pulp container exists
#
# Usage:
#   ansible-playbook cleanup_pulp_validate.yml
#   (Or imported by cleanup_pulp.yml)
# =============================================================================

- name: Include input project directory
  when: not project_dir_status | default(false) | bool
  ansible.builtin.import_playbook: ../prepare/include_input_dir.yml
  tags: always

- name: Create oim group
  when: not oim_group_status | default(false) | bool
  ansible.builtin.import_playbook: ../prepare/create_container_group.yml
  vars:
    oim_group: true
  tags: always

# Step 1: Validate the host and Pulp state before cleanup.
- name: Validate Pulp cleanup prerequisites
  hosts: oim
  connection: ssh
  gather_facts: false
  tags: always
  vars_files:
    - "{{ playbook_dir | dirname | dirname }}/vars/default.yml"
    - "{{ playbook_dir | dirname | dirname }}/vars/cleanup_pulp_vars.yml"
  tasks:
    - name: Define project input path
      ansible.builtin.set_fact:
        project_input_path: "{{ input_project_dir }}"

    - name: Check if Pulp container exists
      containers.podman.podman_container_info:
        name: "{{ pulp_container_name }}"
      register: pulp_container_check
      failed_when: false

    - name: Check if Pulp quadlet file exists
      ansible.builtin.stat:
        path: "{{ pulp_quadlet_file }}"
      register: pulp_quadlet_check

    - name: Set validation facts
      ansible.builtin.set_fact:
        pulp_container_exists: "{{ pulp_container_check.containers | default([]) | length > 0 }}"
        pulp_quadlet_exists: "{{ pulp_quadlet_check.stat.exists | default(false) }}"
        cleanup_validation_passed: true

    - name: Display validation status
      ansible.builtin.debug:
        msg:
          - "========== CLEANUP VALIDATION =========="
          - "Pulp container exists: {{ pulp_container_exists }}"
          - "Pulp quadlet exists: {{ pulp_quadlet_exists }}"
          - "Validation passed: {{ cleanup_validation_passed }}"
          - "========================================="
