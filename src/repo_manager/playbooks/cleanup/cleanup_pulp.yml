# =============================================================================
# CLEANUP PULP PLAYBOOK
# =============================================================================
# This playbook removes the Pulp container and all related data including:
#   - Pulp container and image
#   - Pulp data directories (settings, nginx, etc.)
#   - Pulp CLI configuration files
#   - Log files (optional)
#   - Credential files (interactive prompt - user decides)
# All tasks run on localhost (OIM).
#
# Usage:
#   Interactive mode (will prompt for credential deletion):
#     ansible-playbook playbooks/cleanup/cleanup_pulp.yml -e 'project_name=project_default'
#   
#   Force delete credentials (no prompt):
#     ansible-playbook playbooks/cleanup/cleanup_pulp.yml -e 'project_name=project_default' -e 'cleanup_credentials=true'
#   
#   Preserve credentials (no prompt):
#     ansible-playbook playbooks/cleanup/cleanup_pulp.yml -e 'project_name=project_default' -e 'cleanup_credentials=false'
#   
#   Preserve logs:
#     ansible-playbook playbooks/cleanup/cleanup_pulp.yml -e 'project_name=project_default' -e 'cleanup_logs=false'
#   
#   Preserve both logs and credentials:
#     ansible-playbook playbooks/cleanup/cleanup_pulp.yml -e 'project_name=project_default' -e 'cleanup_logs=false' -e 'cleanup_credentials=false'
# =============================================================================

- name: Cleanup Pulp container and data
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - "{{ playbook_dir | dirname | dirname }}/vars/default.yml"
    - "{{ playbook_dir | dirname | dirname }}/vars/cleanup_pulp_vars.yml"
    - "{{ playbook_dir | dirname | dirname }}/vars/credential_vars.yml"
  tags: pulp
  tasks:
    # -------------------------------------------------------------------------
    # PHASE 1: VALIDATION
    # -------------------------------------------------------------------------
    - name: Check if Pulp container exists
      containers.podman.podman_container_info:
        name: "{{ pulp_container_name }}"
      register: pulp_container_check
      failed_when: false

    - name: Check if Pulp quadlet file exists
      ansible.builtin.stat:
        path: "/etc/containers/systemd/{{ pulp_container_name }}.container"
      register: pulp_quadlet_check

    - name: Set validation facts
      ansible.builtin.set_fact:
        pulp_container_exists: "{{ pulp_container_check.containers | default([]) | length > 0 }}"
        pulp_quadlet_exists: "{{ pulp_quadlet_check.stat.exists | default(false) }}"

    - name: Display validation status
      ansible.builtin.debug:
        msg:
          - "========== CLEANUP VALIDATION =========="
          - "Pulp container exists: {{ pulp_container_exists }}"
          - "Pulp quadlet exists: {{ pulp_quadlet_exists }}"
          - "========================================="

    # -------------------------------------------------------------------------
    # PHASE 2: FETCH CREDENTIALS (OPTIONAL - NOT REQUIRED FOR CLEANUP)
    # -------------------------------------------------------------------------
    # Note: Credentials are not required for cleanup operations
    # Cleanup only removes containers, files, and directories
    - name: Set default credentials (not required for cleanup)
      ansible.builtin.set_fact:
        pulp_username: "{{ pulp_username | default('admin') }}"
        pulp_password: "{{ pulp_password | default('') }}"

    - name: Display credential status
      ansible.builtin.debug:
        msg:
          - "Note: Credentials not required for cleanup operations"
          - "Cleanup will remove Pulp container and data directories"

    # -------------------------------------------------------------------------
    # PHASE 3: CLEANUP PULP
    # -------------------------------------------------------------------------
    - name: Display cleanup info
      ansible.builtin.debug:
        msg:
          - "========== PULP CLEANUP =========="
          - "Container: {{ pulp_container_name }}"
          - "Image: {{ pulp_image }}"
          - "=================================="

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true
      failed_when: false

    - name: Populate service facts
      ansible.builtin.service_facts:

    - name: Stop pulp service
      ansible.builtin.systemd_service:
        name: "{{ pulp_container_name }}.service"
        state: stopped
      when:
        - "('pulp.service' in ansible_facts['services'])"
        - ansible_facts['services']['pulp.service'].state == 'running'
      failed_when: false

    - name: Remove Pulp systemd unit files
      ansible.builtin.file:
        path: "/etc/containers/systemd/{{ pulp_container_name }}.container"
        state: absent
      when: pulp_quadlet_exists
      register: pulp_unit_removed

    - name: Reload systemd daemon after unit removal
      ansible.builtin.systemd:
        daemon_reload: true
      when: pulp_quadlet_exists
      failed_when: false

    - name: Stop the Pulp container
      ansible.builtin.command:
        cmd: "podman stop {{ pulp_container_name }}"
      when: pulp_container_exists
      failed_when: false
      changed_when: true

    - name: Remove Pulp container
      ansible.builtin.command:
        cmd: "podman rm -f {{ pulp_container_name }}"
      failed_when: false
      changed_when: true

    - name: Remove Pulp container image
      ansible.builtin.command:
        cmd: "podman rmi -f {{ pulp_image }}"
      changed_when: true
      failed_when: false

    - name: Remove Pulp directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
        force: true
      register: directory_deletion
      until: directory_deletion is not failed
      retries: "{{ max_retries }}"
      with_items: "{{ pulp_cleanup_directory }}"

    - name: Remove track file when Pulp is configured for HTTPS
      ansible.builtin.file:
        path: "{{ track_file_path }}"
        state: absent
      when: pulp_protocol_https | bool

    - name: Check if omnia target file exists
      ansible.builtin.stat:
        path: "{{ omnia_target }}"
      register: omnia_target_stat

    - name: Remove pulp.service from omnia target
      ansible.builtin.replace:
        path: "{{ omnia_target }}"
        regexp: '(\b) pulp\.service(\b)'
        replace: ''
      when:
        - omnia_target_stat.stat.exists
        - omnia_target_stat.stat.isreg

    # -------------------------------------------------------------------------
    # PHASE 4: CLEANUP LOGS
    # -------------------------------------------------------------------------
    - name: Display log cleanup mode
      ansible.builtin.debug:
        msg: "Log cleanup: {{ 'Enabled - removing entire log directory' if (cleanup_logs | default(true) | bool) else 'Disabled - preserving logs' }}"

    - name: Remove entire log directory
      ansible.builtin.file:
        path: "{{ repo_manager_log_dir }}"
        state: absent
      when: cleanup_logs | default(true) | bool

    - name: Recreate empty log directory
      ansible.builtin.file:
        path: "{{ repo_manager_log_dir }}"
        state: directory
        mode: "0755"
      when: cleanup_logs | default(true) | bool

    - name: Remove legacy log directory
      ansible.builtin.file:
        path: "{{ repo_manager_base_dir }}/log"
        state: absent
      when: cleanup_logs | default(true) | bool

    # -------------------------------------------------------------------------
    # PHASE 5: CLEANUP PULP CLI CONFIG FILES
    # -------------------------------------------------------------------------
    - name: Display Pulp CLI config cleanup mode
      ansible.builtin.debug:
        msg: "Pulp CLI config cleanup: Removing all CLI configuration files"

    - name: Remove Pulp CLI config files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ pulp_cli_config_files }}"
      failed_when: false

    - name: Verify Pulp CLI config directory is removed
      ansible.builtin.stat:
        path: /root/.config/pulp
      register: pulp_cli_config_check

    - name: Display Pulp CLI config cleanup status
      ansible.builtin.debug:
        msg: "Pulp CLI config removed: {{ not pulp_cli_config_check.stat.exists }}"

    # -------------------------------------------------------------------------
    # PHASE 6: CLEANUP PULP CLI SYMLINK AND YUM REPO FILE
    # -------------------------------------------------------------------------
    - name: Remove pulp CLI symlink from /usr/local/bin/pulp
      ansible.builtin.file:
        path: /usr/local/bin/pulp
        state: absent
      failed_when: false

    - name: Verify pulp CLI symlink is removed
      ansible.builtin.stat:
        path: /usr/local/bin/pulp
      register: pulp_symlink_check

    - name: Display pulp CLI symlink cleanup status
      ansible.builtin.debug:
        msg: "Pulp CLI symlink removed: {{ not pulp_symlink_check.stat.exists }}"

    - name: Remove Pulp yum repo file
      ansible.builtin.file:
        path: /etc/yum.repos.d/pulp.repo
        state: absent
      failed_when: false

    - name: Verify pulp.repo is removed
      ansible.builtin.stat:
        path: /etc/yum.repos.d/pulp.repo
      register: pulp_repo_check

    - name: Display pulp.repo cleanup status
      ansible.builtin.debug:
        msg: "Pulp yum repo file removed: {{ not pulp_repo_check.stat.exists }}"

    # -------------------------------------------------------------------------
    # PHASE 7: CLEANUP CREDENTIAL FILES
    # -------------------------------------------------------------------------
    - name: Check if credential files exist
      ansible.builtin.stat:
        path: "{{ input_project_dir }}/repo_manager_config_credentials.yml"
      register: credential_file_exists

    - name: Prompt user to delete credentials
      ansible.builtin.pause:
        prompt: |
          
          ========================================
          CREDENTIAL CLEANUP CONFIRMATION
          ========================================
          Credential file found at:
            {{ input_project_dir }}/repo_manager_config_credentials.yml
          
          Do you want to delete the credential files? (yes/no)
          
          - yes: Credentials will be deleted and you'll be prompted during next deployment
          - no:  Credentials will be preserved and reused in next deployment
          
          Enter your choice
      register: delete_credentials_prompt
      when:
        - credential_file_exists.stat.exists
        - cleanup_credentials is not defined or cleanup_credentials == ''

    - name: Set credential cleanup decision based on user input
      ansible.builtin.set_fact:
        cleanup_credentials: "{{ delete_credentials_prompt.user_input | lower in ['yes', 'y'] }}"
      when:
        - delete_credentials_prompt is defined
        - delete_credentials_prompt.user_input is defined
        - not delete_credentials_prompt.skipped | default(false)

    - name: Set default cleanup_credentials if not set
      ansible.builtin.set_fact:
        cleanup_credentials: "{{ cleanup_credentials | default(true) }}"

    - name: Display credential cleanup mode
      ansible.builtin.debug:
        msg: "Credential cleanup: {{ 'Enabled - removing credential files' if (cleanup_credentials | bool) else 'Disabled - preserving credentials' }}"

    - name: Remove credential files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ credential_files_to_cleanup }}"
      when: cleanup_credentials | bool
      failed_when: false

    - name: Verify credential files are removed
      ansible.builtin.stat:
        path: "{{ input_project_dir }}/repo_manager_config_credentials.yml"
      register: credential_file_check
      when: cleanup_credentials | bool

    - name: Display credential cleanup status
      ansible.builtin.debug:
        msg: "Credential files removed: {{ not credential_file_check.stat.exists }}"
      when: cleanup_credentials | bool

    - name: Display credential preservation message
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "Credentials preserved for next deployment"
          - "Location: {{ input_project_dir }}/repo_manager_config_credentials.yml"
          - "Next deployment will skip credential prompt"
          - "=========================================="
      when:
        - not cleanup_credentials | bool
        - credential_file_exists.stat.exists

    # -------------------------------------------------------------------------
    # PHASE 8: POST-CLEANUP NOTES
    # -------------------------------------------------------------------------
    - name: Display Pulp post-cleanup notes
      ansible.builtin.debug:
        msg: "{{ cleanup_pulp_note }}"
