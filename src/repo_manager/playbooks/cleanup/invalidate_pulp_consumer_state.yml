---

- name: Validate Pulp consumer-state cleanup targets
  ansible.builtin.assert:
    that:
      - item is string
      - item is match('^/')
      - item | length > 5
      - (item | basename) in ['pulp.repo', 'repo_status.yml']
      - item not in ['/', '/etc', '/opt', '/root', '/usr', '/var']
    fail_msg: "{{ cleanup_pulp_validate_consumer_state_targets_msg }}"
    quiet: true
  loop: "{{ pulp_consumer_state_files }}"

- name: Remove stale Pulp consumer state
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ pulp_consumer_state_files }}"
  register: pulp_consumer_state_removed

- name: Inspect Pulp consumer state after invalidation
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop: "{{ pulp_consumer_state_files }}"
  register: pulp_consumer_state_check

- name: Require Pulp consumer state to be absent
  ansible.builtin.assert:
    that:
      - not item.stat.exists
    fail_msg: "{{ cleanup_pulp_fail_when_consumer_state_remains_msg }}"
    quiet: true
  loop: "{{ pulp_consumer_state_check.results }}"
  loop_control:
    label: "{{ item.item }}"
