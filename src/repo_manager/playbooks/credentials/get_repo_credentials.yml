---
# Step 1: Collect and persist Repo Manager credentials securely.
- name: Get repository manager credentials
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ playbook_dir | dirname | dirname }}/vars/default.yml"
  tasks:
    - name: Collect and encrypt repository manager credentials
      ansible.builtin.include_role:
        name: ../../roles/collect_repo_credentials
