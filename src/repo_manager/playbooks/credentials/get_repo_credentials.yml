---
# =============================================================================
# GET REPO MANAGER CREDENTIALS
# =============================================================================
# Simplified standalone playbook for collecting repo manager credentials.
# Handles: file check → load → prompt → save → encrypt
# Idempotent — skips prompts if credentials file exists and is valid.
#
# Usage:
#   ansible-playbook playbooks/credentials/get_repo_credentials.yml
# =============================================================================

- name: Get repository manager credentials
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ playbook_dir | dirname | dirname }}/vars/default.yml"
  vars:
    credential_file: "{{ input_project_dir }}/repo_manager_config_credentials.yml"
    vault_key_file: "{{ input_project_dir }}/.repo_manager_config_credentials_key"

  tasks:
    # ═══ STEP 1: Check if credential file exists ═══
    - name: Check if credential file exists
      ansible.builtin.stat:
        path: "{{ credential_file }}"
      register: _cred_file_stat

    # ═══ STEP 2: Load existing credentials if file exists ═══
    - name: Load existing credentials
      when: _cred_file_stat.stat.exists | default(false)
      block:
        - name: Check if file is vault-encrypted
          ansible.builtin.command:
            cmd: "head -1 {{ credential_file }}"
          register: _file_head
          changed_when: false

        - name: Set encryption flag
          ansible.builtin.set_fact:
            _is_encrypted: "{{ _file_head.stdout is search('\\$ANSIBLE_VAULT') }}"

        - name: Load plaintext credentials
          ansible.builtin.include_vars:
            file: "{{ credential_file }}"
          when: not (_is_encrypted | bool)

        - name: Decrypt credential file temporarily
          ansible.builtin.command:
            cmd: "ansible-vault decrypt {{ credential_file }} --vault-password-file {{ vault_key_file }}"
          changed_when: false
          when:
            - _is_encrypted | bool
            - vault_key_file is file
          no_log: true

        - name: Load decrypted credentials
          ansible.builtin.include_vars:
            file: "{{ credential_file }}"
          when:
            - _is_encrypted | bool
            - vault_key_file is file

        - name: Re-encrypt credential file
          ansible.builtin.command:
            cmd: "ansible-vault encrypt {{ credential_file }} --vault-password-file {{ vault_key_file }}"
          changed_when: false
          when:
            - _is_encrypted | bool
            - vault_key_file is file
          no_log: true

      rescue:
        - name: Warn if credentials file cannot be read
          ansible.builtin.debug:
            msg: >-
              WARNING: Could not read existing credentials file.
              Will prompt for all credentials.

    # ═══ STEP 3: Check what we already have ═══
    - name: Check if credentials are already loaded
      ansible.builtin.set_fact:
        _have_pulp_password: >-
          {{ pulp_password is defined
             and pulp_password | string | trim | length > 0
             and pulp_password != 'CHANGE_THIS_PASSWORD' }}
        _have_docker_username: >-
          {{ docker_username is defined
             and docker_username | string | trim | length > 0 }}
        _have_docker_password: >-
          {{ docker_password is defined
             and docker_password | string | trim | length > 0 }}

    - name: Debug current credential state
      ansible.builtin.debug:
        msg:
          - "Pulp password loaded from file: {{ _have_pulp_password }}"
          - "Docker username loaded from file: {{ _have_docker_username }}"
          - "Docker password loaded from file: {{ _have_docker_password }}"

    # ═══ STEP 4: Skip prompts if all credentials loaded from file ═══
    - name: Skip prompts if credentials already loaded from file
      when:
        - _have_pulp_password | bool
        - _cred_file_stat.stat.exists | default(false)
      block:
        - name: Credentials already available
          ansible.builtin.debug:
            msg: "All required credentials loaded from {{ credential_file }}. Skipping prompts."

    # ═══ STEP 5: Prompt for credentials if not loaded or need to save to file ═══
    - name: Prompt for credentials
      when:
        - not (_have_pulp_password | bool) or not (_cred_file_stat.stat.exists | default(false))
      block:

        # --- PULP PASSWORD (mandatory) ---
        - name: Prompt for pulp_password
          when: not (_have_pulp_password | bool)
          block:
            - name: Enter pulp_password
              ansible.builtin.pause:
                prompt: "Enter pulp_password"
                echo: false
              register: _pulp_pass_input

            - name: Confirm pulp_password
              ansible.builtin.pause:
                prompt: "Confirm pulp_password"
                echo: false
              register: _pulp_pass_confirm

            - name: Validate pulp passwords match
              ansible.builtin.fail:
                msg: "Passwords do not match for pulp_password. Please run again."
              when: _pulp_pass_input.user_input != _pulp_pass_confirm.user_input

            - name: Validate pulp password not empty
              ansible.builtin.fail:
                msg: "pulp_password cannot be empty. Please run again."
              when: _pulp_pass_input.user_input | trim | length == 0

            - name: Set pulp_password
              ansible.builtin.set_fact:
                pulp_password: "{{ _pulp_pass_input.user_input | trim }}"

        # --- DOCKER USERNAME (optional) ---
        - name: Prompt for docker_username
          when: not (_have_docker_username | bool)
          block:
            - name: Enter docker_username
              ansible.builtin.pause:
                prompt: "Enter docker_username (press Enter to skip)"
              register: _docker_user_input

            - name: Set docker_username
              ansible.builtin.set_fact:
                docker_username: "{{ _docker_user_input.user_input | trim }}"

        # --- DOCKER PASSWORD (only if username provided) ---
        - name: Prompt for docker_password
          when:
            - docker_username | default('') | trim | length > 0
            - not (_have_docker_password | bool)
          block:
            - name: Enter docker_password
              ansible.builtin.pause:
                prompt: "Enter docker_password"
                echo: false
              register: _docker_pass_input

            - name: Confirm docker_password
              ansible.builtin.pause:
                prompt: "Confirm docker_password"
                echo: false
              register: _docker_pass_confirm

            - name: Validate docker passwords match
              ansible.builtin.fail:
                msg: "Passwords do not match for docker_password. Please run again."
              when: _docker_pass_input.user_input != _docker_pass_confirm.user_input

            - name: Set docker_password
              ansible.builtin.set_fact:
                docker_password: "{{ _docker_pass_input.user_input | trim }}"

        # --- SET EMPTY PASSWORD IF NO USERNAME ---
        - name: Set empty docker_password if username not provided
          ansible.builtin.set_fact:
            docker_password: ""
          when:
            - docker_username | default('') | trim | length == 0
            - not (_have_docker_password | bool)

        # --- FINAL VALIDATION ---
        - name: Final Docker credential state
          ansible.builtin.set_fact:
            _final_docker_username: "{{ docker_username | default('') | trim }}"
            _final_docker_password: "{{ docker_password | default('') | trim }}"

        - name: Display final Docker credential status
          ansible.builtin.debug:
            msg:
              - "Docker username provided: {{ (_final_docker_username | length > 0) | ternary('YES', 'NO (skipped)') }}"
              - "Docker password provided: {{ (_final_docker_password | length > 0) | ternary('YES', 'NO') }}"

        - name: Validate password exists when username is provided
          ansible.builtin.fail:
            msg: "Docker username is set but password is empty. Please run again."
          when:
            - _final_docker_username | length > 0
            - _final_docker_password | length == 0

        # --- SAVE TO FILE ---
        - name: Ensure credential directory exists
          ansible.builtin.file:
            path: "{{ credential_file | dirname }}"
            state: directory
            mode: '0755'

        - name: Write credentials to temporary file
          ansible.builtin.copy:
            content: |
              ---
              pulp_username: "admin"
              pulp_password: "{{ pulp_password }}"
              docker_username: "{{ docker_username | default('') }}"
              docker_password: "{{ docker_password | default('') }}"
              registry_credentials: {}
            dest: "{{ credential_file }}.tmp"
            mode: '0600'
          no_log: true

        - name: Move temporary file into place
          ansible.builtin.command:
            cmd: "mv {{ credential_file }}.tmp {{ credential_file }}"
          changed_when: true

        - name: Credentials saved
          ansible.builtin.debug:
            msg: "Credentials saved to {{ credential_file }}"

    # ═══ STEP 6: Encrypt if vault key exists ═══
    - name: Check if vault key exists
      ansible.builtin.stat:
        path: "{{ vault_key_file }}"
      register: _vault_key_stat

    - name: Create vault key if it doesn't exist
      when: not _vault_key_stat.stat.exists | default(false)
      ansible.builtin.lineinfile:
        path: "{{ vault_key_file }}"
        line: "{{ lookup('password', '/dev/null chars=ascii_letters length=32') }}"
        mode: "0600"
        owner: root
        create: true

    - name: Check if credential file is already encrypted
      ansible.builtin.command:
        cmd: "head -1 {{ credential_file }}"
      register: _check_encrypted
      changed_when: false
      when: credential_file is file

    - name: Set encryption check flag
      ansible.builtin.set_fact:
        _file_is_encrypted: "{{ _check_encrypted.stdout is search('\\$ANSIBLE_VAULT') }}"
      when: credential_file is file

    - name: Encrypt credential file
      ansible.builtin.command:
        cmd: "ansible-vault encrypt {{ credential_file }} --vault-password-file {{ vault_key_file }}"
      changed_when: true
      no_log: true
      when:
        - credential_file is file
        - not (_file_is_encrypted | default(false) | bool)
        - _vault_key_stat.stat.exists | default(false)

    # ═══ STEP 7: Final validation ═══
    - name: Validate pulp_password is set
      ansible.builtin.fail:
        msg: "pulp_password is required but not set. Run the playbook again."
      when: >-
        pulp_password is not defined
        or pulp_password | string | trim | length == 0
        or pulp_password == 'CHANGE_THIS_PASSWORD'

    - name: Display credential summary
      ansible.builtin.debug:
        msg:
          - "Credentials ready:"
          - "  pulp_password = SET"
          - "  docker_username = {{ 'SET' if (docker_username | default('') | trim | length > 0) else 'NOT SET' }}"
          - "  docker_password = {{ 'SET' if (docker_password | default('') | trim | length > 0) else 'NOT SET' }}"

    - name: Display credential collection complete
      ansible.builtin.debug:
        msg:
          - "========== CREDENTIAL COLLECTION COMPLETE =========="
          - "Credentials saved to: {{ credential_file }}"
          - "===================================================="
