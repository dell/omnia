# =============================================================================
# GET REPO MANAGER CREDENTIALS
# =============================================================================
# Standalone playbook for collecting repo manager credentials.
# Follows the image_build_manager pattern for consistency.
#
# Usage:
#   ansible-playbook playbooks/credentials/get_repo_credentials.yml
# =============================================================================

- name: Collect repo manager credentials
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - "{{ playbook_dir | dirname | dirname }}/vars/default.yml"
  tasks:
    - name: Display credential collection start
      ansible.builtin.debug:
        msg:
          - "========== REPO MANAGER CREDENTIAL COLLECTION =========="
          - "Project: {{ project_name | default(project_default) }}"
          - "=========================================================="

    - name: Collect repo manager credentials
      ansible.builtin.include_role:
        name: ../../roles/collect_repo_credentials

    - name: Display credential collection complete
      ansible.builtin.debug:
        msg:
          - "========== CREDENTIAL COLLECTION COMPLETE =========="
          - "Credentials saved to: {{ repo_manager_credential_file.file_path }}"
          - "===================================================="
