---
- name: Publish validation context
  ansible.builtin.set_fact:
    catalog_context: "{{ validation_execution_context }}"
    cluster_os_type: "{{ validation_execution_context.os_type }}"
    cluster_os_version: "{{ validation_execution_context.os_version }}"
    selected_architectures: "{{ validation_execution_context.architectures }}"
    sub_final_repo_urls: {}

- name: Decrypt user certificates if encrypted
  cert_vault_handler:
    mode: decrypt
    log_dir: "{{ repo_manager_log_dir }}/{{ cluster_os_type }}/{{ cluster_os_version }}"
    key_path: "{{ input_project_dir }}"
    cluster_os_version: "{{ cluster_os_version }}"
    architectures: "{{ selected_architectures }}"
  environment:
    REPO_MANAGER_BASE_DIR: "{{ repo_manager_base_dir }}"
    REPO_MANAGER_INPUT_PROJECT_DIR: "{{ input_project_dir }}"
    OMNIA_BASE_DIR: "{{ omnia_base_dir }}"
    OMNIA_DATA_PATH: "{{ omnia_data_path }}"
    REPO_MANAGER_DATA_PATH: "{{ repo_manager_runtime_dir }}"
  no_log: true

- name: Resolve repository URLs for validation context
  ansible.builtin.include_role:
    name: ../../roles/repository_access
    tasks_from: resolve_context_repository_urls.yml
  when: run_subscription_check | default(false) | bool
