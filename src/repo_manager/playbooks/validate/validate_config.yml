# =============================================================================
# VALIDATE CONFIG PLAYBOOK
# =============================================================================
# This playbook validates repo_manager input configuration files.
# All tasks run on localhost (OIM).
#
# Usage:
#   ansible-playbook playbooks/validate/validate_config.yml -e 'project_name=project_default'
# =============================================================================

- name: Validate repo_manager configuration
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - "{{ playbook_dir | dirname | dirname }}/vars/default.yml"
  tags:
    - precheck
    - local_repo
    - repo_manager
  tasks:
    # -------------------------------------------------------------------------
    # PHASE 1: PRE-FLIGHT SETUP
    # -------------------------------------------------------------------------
    - name: Ensure repo_manager log directory exists
      ansible.builtin.file:
        path: "{{ repo_manager_log_dir }}"
        state: directory
        mode: "0755"

    - name: Validate required environment variables using setup role
      ansible.builtin.include_role:
        name: ../../roles/repo_manager_setup
        tasks_from: load_config.yml

    - name: Enable subscription check when validate_config.yml is run directly
      ansible.builtin.set_fact:
        run_subscription_check: true
      when: run_subscription_check is not defined and omnia_run_tags is not defined

    - name: Include metadata vars
      ansible.builtin.include_vars:
        file: "{{ omnia_metadata_file }}"
        name: oim_shared_path_from_metadata
      when: repo_manager_metadata_support | default(false) | bool
      failed_when: false

    # -------------------------------------------------------------------------
    # PHASE 2: LOAD AND VALIDATE REPO MANAGER CONFIG (CATALOG-BASED)
    # -------------------------------------------------------------------------
    - name: Validate repo_manager_config.yml exists
      ansible.builtin.stat:
        path: "{{ repo_manager_config_file }}"
      register: repo_config_file

    - name: Fail if repo_manager_config.yml is missing
      ansible.builtin.fail:
        msg: |
          repo_manager_config.yml not found.
          File: {{ repo_manager_config_file }}
          Please create the configuration file.
      when: not repo_config_file.stat.exists

    - name: Load repo_manager_config.yml
      ansible.builtin.include_vars:
        file: "{{ repo_manager_config_file }}"
        name: repo_manager_config_data

    - name: Resolve cluster OS details from catalog functional layers
      resolve_catalog_context:
        catalog_path: "{{ lookup('env', 'CATALOG_FILE_PATH') }}"
      environment:
        REPO_MANAGER_BASE_DIR: "{{ repo_manager_base_dir }}"
        REPO_MANAGER_CONFIG_PATH: "{{ repo_manager_base_dir }}/vars/default.yml"
      register: validation_catalog_context

    - name: Set cluster OS details from resolved catalog context
      ansible.builtin.set_fact:
        catalog_context: "{{ validation_catalog_context.catalog_context }}"
        cluster_os_type: "{{ validation_catalog_context.catalog_context.os_type }}"
        catalog_execution_contexts: >-
          {{ validation_catalog_context.catalog_context.execution_contexts }}
        cluster_os_version: >-
          {{ validation_catalog_context.catalog_context.execution_contexts[0].os_version }}
        selected_architectures: >-
          {{ validation_catalog_context.catalog_context.execution_contexts[0].architectures }}

    # -------------------------------------------------------------------------
    # PHASE 3: RHEL SUBSCRIPTION CHECK
    # -------------------------------------------------------------------------
    - name: Prepare host repository access once
      ansible.builtin.include_role:
        name: ../../roles/repository_access
        tasks_from: prepare_host_repository_access.yml
      when:
        - run_subscription_check | default(false) | bool
        - not (repository_access_host_prepared | default(false) | bool)

    - name: Validate repository access for catalog contexts
      ansible.builtin.include_tasks: validate_catalog_context.yml
      loop: "{{ catalog_execution_contexts }}"
      loop_control:
        loop_var: validation_execution_context
        label: "{{ validation_execution_context.context_id }}"
      when: run_subscription_check | default(false) | bool

    # -------------------------------------------------------------------------
    # PHASE 4: INPUT VALIDATION
    # -------------------------------------------------------------------------
    - name: Validate repo_manager input configuration
      ansible.builtin.include_role:
        name: ../../roles/validate_input
