# =============================================================================
# VALIDATE CONFIG PLAYBOOK
# =============================================================================
# This playbook validates repo_manager input configuration files.
# All tasks run on localhost (OIM).
#
# Usage:
#   ansible-playbook playbooks/validate/validate_config.yml -e 'project_name=project_default'
# =============================================================================

- name: Validate repo_manager configuration
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - "{{ playbook_dir | dirname | dirname }}/vars/default.yml"
  tags:
    - local_repo
    - repo_manager
  tasks:
    # -------------------------------------------------------------------------
    # PHASE 1: PRE-FLIGHT SETUP
    # -------------------------------------------------------------------------
    - name: Ensure repo_manager log directory exists
      ansible.builtin.file:
        path: "{{ repo_manager_log_dir }}"
        state: directory
        mode: "0755"

    - name: Enable subscription check when validate_config.yml is run directly
      ansible.builtin.set_fact:
        run_subscription_check: true
      when: run_subscription_check is not defined and omnia_run_tags is not defined

    - name: Include metadata vars
      ansible.builtin.include_vars:
        file: "{{ omnia_metadata_file }}"
        name: oim_shared_path_from_metadata
      when: repo_manager_metadata_support | default(false) | bool
      failed_when: false

    # -------------------------------------------------------------------------
    # PHASE 2: LOAD AND VALIDATE SOFTWARE CONFIG
    # -------------------------------------------------------------------------
    - name: Validate JSON before loading
      ansible.builtin.command: "jq . {{ input_project_dir }}/software_config.json"
      register: json_check
      changed_when: false
      failed_when: false

    - name: Fail if JSON is invalid
      ansible.builtin.fail:
        msg: |
          JSON validation failed for software_config.json.
          File: {{ input_project_dir }}/software_config.json
          {{ json_check.stderr | default('Unknown jq error') }}
          Please fix the JSON syntax
      when: json_check.rc != 0

    - name: Load software_config JSON
      ansible.builtin.set_fact:
        software_config: "{{ lookup('file', input_project_dir + '/software_config.json') | from_json }}"

    - name: Set cluster OS version
      ansible.builtin.set_fact:
        cluster_os_version: "{{ software_config.cluster_os_version }}"
        cluster_os_type: "{{ software_config.cluster_os_type }}"

    # -------------------------------------------------------------------------
    # PHASE 3: RHEL SUBSCRIPTION CHECK
    # -------------------------------------------------------------------------
    - name: Check RHEL subscription enabled or not
      ansible.builtin.include_role:
        name: ../../roles/validate_subscription
        tasks_from: check_rhel_subscription.yml
      when: run_subscription_check | default(false) | bool

    - name: Configure RHEL OS URLs for codeready-builder baseos appstream repositories
      ansible.builtin.include_role:
        name: ../../roles/validate_subscription
        tasks_from: configure_rhel_os_urls.yml
      when: run_subscription_check | default(false) | bool

    # -------------------------------------------------------------------------
    # PHASE 4: INPUT VALIDATION
    # -------------------------------------------------------------------------
    - name: Validate repo_manager input configuration
      ansible.builtin.include_role:
        name: ../../roles/validate_input
