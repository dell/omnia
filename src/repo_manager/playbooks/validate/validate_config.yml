# =============================================================================
# VALIDATE CONFIG PLAYBOOK
# =============================================================================
# This playbook validates repo_manager input configuration files.
# All tasks run on localhost (OIM).
#
# Usage:
#   ansible-playbook playbooks/validate/validate_config.yml -e 'project_name=project_default'
# =============================================================================

# Step 1: Validate Repo Manager configuration and catalog inputs.
- name: Validate repo_manager configuration
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - "{{ playbook_dir | dirname | dirname }}/vars/default.yml"
  tags:
    - precheck
    - local_repo
    - repo_manager
  tasks:
    # -------------------------------------------------------------------------
    # PHASE 1: PRE-FLIGHT SETUP
    # -------------------------------------------------------------------------
    - name: Ensure repo_manager log directory exists
      ansible.builtin.file:
        path: "{{ repo_manager_log_dir }}"
        state: directory
        mode: "0700"

    - name: Load Repo Manager runtime configuration when required
      ansible.builtin.include_role:
        name: ../../roles/repo_manager_setup
        tasks_from: load_config.yml
      when: not (repo_manager_config_loaded | default(false) | bool)

    - name: Enable subscription check when validate_config.yml is run directly
      ansible.builtin.set_fact:
        run_subscription_check: true
      when: run_subscription_check is not defined and omnia_run_tags is not defined

    - name: Load validated metadata vars
      ansible.builtin.include_role:
        name: ../../roles/repo_manager_setup
        tasks_from: load_oim_metadata.yml
      when: repo_manager_metadata_support | default(false) | bool

    # -------------------------------------------------------------------------
    # PHASE 2: LOAD AND VALIDATE REPO MANAGER CONFIG (CATALOG-BASED)
    # -------------------------------------------------------------------------
    - name: Load validated repo_manager_config.yml
      ansible.builtin.include_role:
        name: ../../roles/repo_manager_setup
        tasks_from: load_repo_manager_config.yml

    - name: Resolve cluster OS details from catalog functional layers
      ansible.builtin.include_role:
        name: ../../roles/repo_manager_setup
        tasks_from: resolve_catalog_context.yml

    # -------------------------------------------------------------------------
    # PHASE 3: RHEL SUBSCRIPTION CHECK
    # -------------------------------------------------------------------------
    - name: Prepare host repository access once
      ansible.builtin.include_role:
        name: ../../roles/repository_access
        tasks_from: prepare_host_repository_access.yml
      when:
        - run_subscription_check | default(false) | bool
        - not (repository_access_host_prepared | default(false) | bool)

    # Validate mappings and explicit URLs with the shared subscription result
    # before any configured repository URL is contacted.
    - name: Validate repo_manager input configuration
      ansible.builtin.include_role:
        name: ../../roles/validate_input

    - name: Validate repository access for catalog contexts
      ansible.builtin.include_tasks: validate_catalog_context.yml
      loop: "{{ catalog_execution_contexts }}"
      loop_control:
        loop_var: validation_execution_context
        label: "{{ validation_execution_context.context_id }}"
      when: run_subscription_check | default(false) | bool
