---
- name: Deploy Pulp HTTPS container
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - "{{ playbook_dir | dirname | dirname }}/vars/default.yml"
    - "{{ playbook_dir | dirname | dirname }}/vars/credential_vars.yml"
  environment:
    PULP_CA_BUNDLE: "{{ pulp_server_crt }}"
  tags: pulp
  tasks:
    - name: Display deployment start
      ansible.builtin.debug:
        msg:
          - "========== PULP HTTPS DEPLOYMENT =========="
          - "Project: {{ project_name | default(project_default) }}"
          - "==========================================="

    - name: Select endpoint validation contract
      ansible.builtin.set_fact:
        omnia_run_tags: [endpoint]

    - name: Validate Pulp endpoint input
      ansible.builtin.include_role:
        name: ../../roles/validate_input

    - name: Read Pulp endpoint configuration
      ansible.builtin.include_role:
        name: ../../roles/pulp_validation
        tasks_from: read_endpoint_config.yml

    - name: Collect encrypted Repo Manager credentials
      ansible.builtin.include_role:
        name: ../../roles/collect_repo_credentials

    - name: Require Pulp credentials
      ansible.builtin.assert:
        that:
          - pulp_username | default('') | length > 0
          - pulp_password | default('') | length > 0
        fail_msg: "Pulp administrator credentials are required for deployment."
      no_log: true

    - name: Run Pulp deployment preflight checks
      ansible.builtin.include_role:
        name: ../../roles/deploy_pulp
        tasks_from: preflight_checks.yml

    - name: Configure SELinux, firewall, and registry access
      ansible.builtin.include_role:
        name: ../../roles/common

    - name: Deploy or update Pulp over HTTPS
      ansible.builtin.include_role:
        name: ../../roles/deploy_pulp

    - name: Configure secure Pulp CLI access
      ansible.builtin.include_role:
        name: ../../roles/deploy_pulp
        tasks_from: configure_cli_https.yml

    - name: Verify Pulp deployment
      ansible.builtin.include_role:
        name: ../../roles/deploy_pulp
        tasks_from: verify_status.yml

    - name: Display deployment summary
      ansible.builtin.debug:
        msg:
          - "========== DEPLOYMENT COMPLETE =========="
          - "Pulp endpoint: https://{{ pulp_server_ip }}:{{ pulp_server_port }}"
          - "Systemd service: {{ pulp_container_name }}.service (enabled)"
          - "========================================="
