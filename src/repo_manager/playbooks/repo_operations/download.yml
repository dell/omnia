# =============================================================================
# REPO MANAGER DOWNLOAD PLAYBOOK
# =============================================================================
# This playbook manages local repository operations for Omnia.
# All tasks run on localhost (OIM).
#
# NOTE: Input validation is NOT included in this playbook.
#       Run validation separately before repo_manager:
#       ansible-playbook playbooks/validate/validate_config.yml --tags local_repo
#
# Workflow:
#   1. Pre-flight Setup: Load project config, fetch credentials
#   2. Pre-flight Checks: Verify Pulp container and endpoint status
#   3. Configuration: Read endpoint config, set SELinux context
#   4. Validation: Runtime validation of software config and metadata
#   5. Execution: Download packages, sync repositories
#   6. Completion: Update metadata, display status
#
# Usage:
#   ansible-playbook playbooks/repo_operations/download.yml -e 'project_name=project_default'
# =============================================================================

# Step 1: Prepare, validate, and download the selected repository content.
- name: Download and sync repositories
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - "{{ playbook_dir | dirname | dirname }}/vars/default.yml"
    - "{{ playbook_dir | dirname | dirname }}/vars/pulp_cli_commands.yml"
  environment:
    PULP_CA_BUNDLE: "{{ pulp_server_crt }}"
  tasks:
    - name: Load Repo Manager runtime configuration when required
      ansible.builtin.include_role:
        name: ../../roles/repo_manager_setup
      when: not (repo_manager_setup_done | default(false) | bool)

    # -------------------------------------------------------------------------
    # PHASE 0: SETUP PULP CLI
    # -------------------------------------------------------------------------
    - name: Check if configured Pulp CLI exists
      ansible.builtin.stat:
        path: "{{ pulp_cli_executable }}"
      register: pulp_system_cli_check

    - name: Find pulp CLI path from current environment
      ansible.builtin.command: which pulp
      register: pulp_which_result
      changed_when: false
      failed_when: false
      when: not pulp_system_cli_check.stat.exists

    - name: Create symlink for the configured Pulp CLI
      when:
        - not pulp_system_cli_check.stat.exists
        - pulp_which_result.rc | default(1) == 0
        - pulp_which_result.stdout | default('') | length > 0
      ansible.builtin.file:
        src: "{{ pulp_which_result.stdout }}"
        dest: "{{ pulp_cli_executable }}"
        state: link

    - name: Verify configured Pulp CLI is accessible
      ansible.builtin.command:
        argv: "{{ [pulp_cli_executable] + pulp_cli_commands.common.version }}"
      register: pulp_cli_version
      changed_when: false
      failed_when: false

    - name: Fail if pulp CLI is not available
      ansible.builtin.fail:
        msg: "{{ download_fail_if_pulp_cli_is_not_available_msg }}"
      when: pulp_cli_version.rc != 0

    # -------------------------------------------------------------------------
    # PHASE 1: PRE-FLIGHT SETUP
    # -------------------------------------------------------------------------
    - name: Set start time
      ansible.builtin.set_fact:
        playbook_start_time: "{{ lookup('pipe', 'date +%s') }}"

    - name: Ensure repo_manager log directory exists
      ansible.builtin.file:
        path: "{{ repo_manager_log_dir }}"
        state: directory
        mode: "0700"

    - name: Set dynamic run tags including 'local_repo'
      ansible.builtin.set_fact:
        omnia_run_tags: "{{ (ansible_run_tags | default([]) | list + ['local_repo']) | unique }}"
        run_subscription_check: true
        cacheable: true

    - name: Include metadata vars
      ansible.builtin.include_vars:
        file: "{{ omnia_metadata_file }}"
        name: oim_shared_path_from_metadata
      when: repo_manager_metadata_support | default(false) | bool
      failed_when: false

    - name: Load repo_manager_config.yml
      ansible.builtin.include_vars:
        file: "{{ repo_manager_config_file }}"
        name: repo_manager_config
      no_log: true

    - name: Resolve cluster OS details from catalog functional layers
      ansible.builtin.include_role:
        name: ../../roles/repo_manager_setup
        tasks_from: resolve_catalog_context.yml

    - name: Set repository policy from configuration
      ansible.builtin.set_fact:
        repo_config: "{{ repo_manager_config.repo_config | default('partial') }}"

    # -------------------------------------------------------------------------
    # PHASE 2: CREDENTIALS
    # -------------------------------------------------------------------------
    - name: Load and reconcile credentials
      ansible.builtin.include_role:
        name: ../../roles/collect_repo_credentials

    - name: Invalidate status from an earlier download invocation
      ansible.builtin.file:
        path: "{{ output_dir }}/repo_status.yml"
        state: absent

    - name: Initialize terminal download status
      ansible.builtin.set_fact:
        final_status: failed
        catalog_execution_results: []

    # -------------------------------------------------------------------------
    # PHASE 3: PULP VALIDATION
    # -------------------------------------------------------------------------
    - name: Pulp Validation Block
      block:
        - name: Read endpoint config vars
          ansible.builtin.include_role:
            name: ../../roles/pulp_validation
            tasks_from: read_endpoint_config.yml

        - name: Display pre-flight check info
          ansible.builtin.debug:
            msg:
              - "========== PRE-FLIGHT CHECKS =========="
              - "Verifying Pulp container and endpoint..."
              - "========================================"

        - name: Verify Pulp is healthy before operations
          ansible.builtin.include_role:
            name: deploy_pulp
            tasks_from: pulp_health_check.yml

        - name: Validate Pulp Container and Endpoint
          ansible.builtin.include_role:
            name: ../../roles/pulp_validation

        - name: Set validation success flag
          ansible.builtin.set_fact:
            pulp_validation_passed: true
            cacheable: true

        - name: Pre-flight checks passed
          ansible.builtin.debug:
            msg: "Pre-flight checks passed. Pulp is ready for repository operations."

      rescue:
        - name: Set validation failure flag
          ansible.builtin.set_fact:
            pulp_validation_passed: false
            final_status: failed
            cacheable: true

        - name: Record Pulp validation failure
          ansible.builtin.debug:
            msg: "{{ download_pulp_validation_failed_aborting_operations_msg }}"

    - name: Fail when Pulp endpoint configuration could not be resolved
      ansible.builtin.fail:
        msg: "{{ download_pulp_validation_failed_aborting_operations_msg }}"
      when: pulp_server_ip is undefined or pulp_server_port is undefined

    # -------------------------------------------------------------------------
    # PHASE 4: SELINUX CONFIGURATION
    # -------------------------------------------------------------------------
    - name: Set SELinux context for Local flow
      ansible.builtin.command: >-
        chcon -R system_u:object_r:container_file_t:s0
        "{{ repo_manager_runtime_dir }}/"
      changed_when: true
      failed_when: false
      when:
        - pulp_validation_passed | default(false)
        - omnia_share_option == 'Local'
        - repo_manager_runtime_dir | length > 0

    - name: Set SELinux context for NFS internal flow
      ansible.builtin.command: >-
        chcon -R system_u:object_r:container_file_t:s0
        "{{ nfs_server_share_path }}/repo_manager/"
      changed_when: true
      failed_when: false
      when:
        - pulp_validation_passed | default(false)
        - omnia_share_option == 'NFS'
        - nfs_type == 'internal'
        - nfs_server_share_path | length > 0

    # -------------------------------------------------------------------------
    # PHASE 5: VALIDATION AND SEQUENTIAL CONTEXT EXECUTION
    # -------------------------------------------------------------------------
    - name: Display execution info
      ansible.builtin.debug:
        msg:
          - "========== REPOSITORY OPERATIONS =========="
          - "Starting local repository setup..."
          - "============================================"
      when: pulp_validation_passed | default(false)

    - name: Execute catalog OS-version contexts
      when: pulp_validation_passed | default(false)
      block:
        - name: Run sequential catalog execution
          ansible.builtin.include_role:
            name: ../../roles/repo_manager_execution
      rescue:
        - name: Record unexpected execution failure
          ansible.builtin.set_fact:
            final_status: failed

    # -------------------------------------------------------------------------
    # PHASE 6: COMPLETION
    # -------------------------------------------------------------------------
    - name: Ensure output directory exists
      ansible.builtin.file:
        path: "{{ output_dir }}"
        state: directory
        mode: "0755"
        recurse: true

    - name: Generate repo_status.yml with final status
      generate_local_repo_access:
        pulp_cli_executable: "{{ pulp_cli_executable }}"
        pulp_server_ip: "{{ pulp_server_ip }}"
        pulp_server_port: "{{ pulp_server_port | int }}"
        cluster_os_type: "{{ catalog_execution_contexts[0].os_type }}"
        cluster_os_version: "{{ catalog_execution_contexts[0].os_version }}"
        architectures: "{{ catalog_execution_contexts[0].architectures }}"
        repo_config: "{{ repo_config | default('partial') }}"
        output_path: "{{ output_dir }}/repo_status.yml"
        local_repo_config_path: "{{ repo_manager_config_file }}"
        overall_status: "{{ 'success' if final_status | default('') | lower == 'success' else 'failed' }}"
        execution_contexts: "{{ catalog_execution_contexts }}"
        execution_results: "{{ catalog_execution_results | default([]) }}"
      environment:
        REPO_MANAGER_BASE_DIR: "{{ repo_manager_base_dir }}"
        REPO_MANAGER_INPUT_PROJECT_DIR: "{{ input_project_dir }}"
        OMNIA_BASE_DIR: "{{ omnia_base_dir }}"
        OMNIA_DATA_PATH: "{{ omnia_data_path }}"
        REPO_MANAGER_DATA_PATH: "{{ repo_manager_runtime_dir }}"
      register: terminal_repo_status

    - name: Display final status
      ansible.builtin.debug:
        msg:
          - "========== REPO MANAGER COMPLETE =========="
          - "Status: {{ final_status | default('unknown') }}"
          - "============================================"
    - name: Fail after publishing unsuccessful terminal status
      ansible.builtin.fail:
        msg: >-
          Repo Manager download failed. A fail-closed repo_status.yml was
          written; review the version-specific standard and task logs.
      when:
        - >-
          final_status | default('failed') | lower != 'success' or
          not (terminal_repo_status.repository_ready | default(false) | bool)
