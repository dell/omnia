# =============================================================================
# GENERATE LOCAL REPO ACCESS PLAYBOOK
# =============================================================================
# This playbook generates repo_status.yml with comprehensive repository URLs.
# All tasks run on localhost (OIM).
#
# The generated file contains:
#   - Pulp server configuration
#   - Base URLs for content types (tarball, manifest, pip, git)
#   - Certificate paths
#   - RPM repository URLs by architecture
#   - File repository URLs (tarballs, manifests, git)
#   - User-defined repositories
#   - Legacy offline paths for backward compatibility
#
# Usage:
#   ansible-playbook playbooks/repo_operations/generate_repo_status.yml -e 'project_name=project_default'
# =============================================================================

- name: Generate repo_status.yml
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ playbook_dir | dirname | dirname }}/vars/default.yml"
  environment:
    PULP_CA_BUNDLE: "{{ pulp_server_crt }}"
  tasks:
    # -------------------------------------------------------------------------
    # PHASE 0: SETUP PULP CLI
    # -------------------------------------------------------------------------
    - name: Check if pulp CLI exists at /usr/local/bin/pulp
      ansible.builtin.stat:
        path: /usr/local/bin/pulp
      register: pulp_system_cli_check

    - name: Find pulp CLI path from current environment
      ansible.builtin.command: which pulp
      register: pulp_which_result
      changed_when: false
      failed_when: false
      when: not pulp_system_cli_check.stat.exists

    - name: Create symlink for pulp CLI at /usr/local/bin/pulp
      when:
        - not pulp_system_cli_check.stat.exists
        - pulp_which_result.rc | default(1) == 0
        - pulp_which_result.stdout | default('') | length > 0
      ansible.builtin.file:
        src: "{{ pulp_which_result.stdout }}"
        dest: /usr/local/bin/pulp
        state: link

    - name: Verify pulp CLI is accessible at /usr/local/bin/pulp
      ansible.builtin.command: /usr/local/bin/pulp --version
      register: pulp_cli_version
      changed_when: false
      failed_when: false

    - name: Fail if pulp CLI is not available
      ansible.builtin.fail:
        msg: |
          Pulp CLI not found at /usr/local/bin/pulp.
          Please ensure pulp-cli is installed and the virtual environment is activated:
            source <venv_path>/bin/activate
            pip install pulp-cli
          Then run the playbook again to create the symlink automatically.
      when: pulp_cli_version.rc != 0

    # -------------------------------------------------------------------------
    # PHASE 1: GET PULP STATUS
    # -------------------------------------------------------------------------
    - name: Read endpoint configuration
      ansible.builtin.include_role:
        name: ../../roles/pulp_validation
        tasks_from: read_endpoint_config.yml

    - name: Verify Pulp is healthy before status generation
      ansible.builtin.include_tasks: ../../roles/deploy_pulp/tasks/pulp_health_check.yml

    - name: Run pulp status command
      ansible.builtin.command: /usr/local/bin/pulp status
      register: pulp_status_output
      changed_when: false

    - name: Parse pulp status
      ansible.builtin.set_fact:
        pulp_status: "{{ pulp_status_output.stdout | from_json }}"

    - name: Set pulp connection facts
      ansible.builtin.set_fact:
        pulp_content_origin: "{{ pulp_status.content_settings.content_origin }}"
        pulp_protocol: "{{ pulp_status.content_settings.content_origin | urlsplit('scheme') | lower }}"
        pulp_server_ip: "{{ pulp_status.content_settings.content_origin | urlsplit('hostname') }}"
        pulp_server_port: "{{ pulp_status.content_settings.content_origin | urlsplit('port') }}"

    - name: Load repo_manager_config.yml
      ansible.builtin.include_vars:
        file: "{{ repo_manager_config_file }}"
        name: repo_manager_config_data

    - name: Set omnia base path
      ansible.builtin.set_fact:
        omnia_base: "{{ omnia_data_path }}"

    - name: Resolve cluster OS details from catalog functional layers
      resolve_catalog_context:
        catalog_path: "{{ lookup('env', 'CATALOG_FILE_PATH') }}"
      environment:
        REPO_MANAGER_BASE_DIR: "{{ repo_manager_base_dir }}"
        REPO_MANAGER_CONFIG_PATH: "{{ repo_manager_base_dir }}/vars/default.yml"
      register: status_catalog_context

    - name: Set cluster OS facts from resolved catalog context
      ansible.builtin.set_fact:
        catalog_context: "{{ status_catalog_context.catalog_context }}"
        cluster_os_type: "{{ status_catalog_context.catalog_context.os_type }}"
        catalog_execution_contexts: >-
          {{ status_catalog_context.catalog_context.execution_contexts }}
        cluster_os_version: >-
          {{ status_catalog_context.catalog_context.execution_contexts[0].os_version }}
        selected_architectures: >-
          {{ status_catalog_context.catalog_context.execution_contexts[0].architectures }}
        repo_config: "{{ repo_manager_config_data.repo_config | default('partial') }}"

    - name: Display Pulp connection info
      ansible.builtin.debug:
        msg:
          - "========== PULP SERVER INFO =========="
          - "Protocol: {{ pulp_protocol }}"
          - "IP: {{ pulp_server_ip }}"
          - "Port: {{ pulp_server_port }}"
          - >-
            Cluster contexts:
            {{ catalog_execution_contexts |
               map(attribute='context_id') | join(', ') }}
          - "Repo Config: {{ repo_config }}"
          - "======================================"

    # -------------------------------------------------------------------------
    # PHASE 2: GENERATE LOCAL REPO ACCESS FILE
    # -------------------------------------------------------------------------
    - name: Ensure output directory exists
      ansible.builtin.file:
        path: "{{ output_dir }}"
        state: directory
        mode: "0755"
        recurse: true

    - name: Initialize status-generation results
      ansible.builtin.set_fact:
        status_generation_results: []

    - name: Generate status for catalog contexts sequentially
      ansible.builtin.include_tasks: generate_catalog_context_status.yml
      loop: "{{ catalog_execution_contexts }}"
      loop_control:
        loop_var: status_execution_context
        label: "{{ status_execution_context.context_id }}"

    - name: Fail when catalog-required RPM repositories are unavailable
      ansible.builtin.fail:
        msg: >-
          repo_status.yml describes an incomplete Pulp state. Missing RPM
          repositories by context:
          {{ incomplete_status_contexts | to_nice_json }}.
          Run repo_manager.yml with --tags "download,status" to restore them.
      vars:
        incomplete_status_contexts: >-
          {{ status_generation_results |
             selectattr('repository_ready', 'equalto', false) | list }}
      when: incomplete_status_contexts | length > 0

    - name: Display generation result
      ansible.builtin.debug:
        msg:
          - "========== GENERATION COMPLETE =========="
          - "Output file: {{ output_dir }}/repo_status.yml"
          - "Contexts: {{ status_generation_results }}"
          - "=========================================="
