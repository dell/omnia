# =============================================================================
# GENERATE LOCAL REPO ACCESS PLAYBOOK
# =============================================================================
# This playbook generates repo_status.yml with comprehensive repository URLs.
# All tasks run on localhost (OIM).
#
# The generated file contains:
#   - Pulp server configuration
#   - Base URLs for content types (tarball, manifest, pip, git)
#   - Certificate paths
#   - RPM repository URLs by architecture
#   - File repository URLs (tarballs, manifests, git)
#   - User-defined repositories
#   - Legacy offline paths for backward compatibility
#
# Usage:
#   ansible-playbook playbooks/repo_operations/generate_repo_status.yml
#     -e 'project_name=project_default'
# =============================================================================

# Step 1: Inspect Pulp and generate the Repo Manager status document.
- name: Generate repo_status.yml
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ playbook_dir | dirname | dirname }}/vars/default.yml"
    - "{{ playbook_dir | dirname | dirname }}/vars/pulp_cli_commands.yml"
  environment:
    PULP_CA_BUNDLE: "{{ pulp_server_crt }}"
  tasks:
    - name: Load Repo Manager runtime configuration when required
      ansible.builtin.include_role:
        name: ../../roles/repo_manager_setup
      when: not (repo_manager_setup_done | default(false) | bool)

    # -------------------------------------------------------------------------
    # PHASE 0: SETUP PULP CLI
    # -------------------------------------------------------------------------
    - name: Check if configured Pulp CLI exists
      ansible.builtin.stat:
        path: "{{ pulp_cli_executable }}"
      register: pulp_system_cli_check

    - name: Find pulp CLI path from current environment
      ansible.builtin.command: which pulp
      register: pulp_which_result
      changed_when: false
      failed_when: false
      when: not pulp_system_cli_check.stat.exists

    - name: Create symlink for the configured Pulp CLI
      when:
        - not pulp_system_cli_check.stat.exists
        - pulp_which_result.rc | default(1) == 0
        - pulp_which_result.stdout | default('') | length > 0
      ansible.builtin.file:
        src: "{{ pulp_which_result.stdout }}"
        dest: "{{ pulp_cli_executable }}"
        state: link

    - name: Verify configured Pulp CLI is accessible
      ansible.builtin.command:
        argv: "{{ [pulp_cli_executable] + pulp_cli_commands.common.version }}"
      register: pulp_cli_version
      changed_when: false
      failed_when: false

    - name: Fail if pulp CLI is not available
      ansible.builtin.fail:
        msg: "{{ generate_repo_status_fail_if_pulp_cli_is_not_available_msg }}"
      when: pulp_cli_version.rc != 0

    # -------------------------------------------------------------------------
    # PHASE 1: GET PULP STATUS
    # -------------------------------------------------------------------------
    - name: Read endpoint configuration
      ansible.builtin.include_role:
        name: ../../roles/pulp_validation
        tasks_from: read_endpoint_config.yml

    - name: Verify Pulp is healthy before status generation
      ansible.builtin.include_role:
        name: deploy_pulp
        tasks_from: pulp_health_check.yml

    - name: Run pulp status command
      ansible.builtin.command:
        argv: "{{ [pulp_cli_executable] + pulp_cli_commands.common.status }}"
      changed_when: false

    - name: Load repo_manager_config.yml
      ansible.builtin.include_vars:
        file: "{{ repo_manager_config_file }}"
        name: repo_manager_config_data
      no_log: true

    - name: Set omnia base path
      ansible.builtin.set_fact:
        omnia_base: "{{ omnia_data_path }}"

    - name: Resolve cluster OS details from catalog functional layers
      ansible.builtin.include_role:
        name: ../../roles/repo_manager_setup
        tasks_from: resolve_catalog_context.yml

    - name: Set repository policy from configuration
      ansible.builtin.set_fact:
        repo_config: >-
          {{ repo_manager_config_data.repo_config | default('partial') }}

    - name: Display Pulp connection info
      ansible.builtin.debug:
        msg:
          - "========== PULP SERVER INFO =========="
          - "Protocol: {{ pulp_protocol }}"
          - "IP: {{ pulp_server_ip }}"
          - "Port: {{ pulp_server_port }}"
          - >-
            Cluster contexts:
            {{ catalog_execution_contexts |
               map(attribute='context_id') | join(', ') }}
          - "Repo Config: {{ repo_config }}"
          - "======================================"

    # -------------------------------------------------------------------------
    # PHASE 2: GENERATE LOCAL REPO ACCESS FILE
    # -------------------------------------------------------------------------
    - name: Ensure output directory exists
      ansible.builtin.file:
        path: "{{ output_dir }}"
        state: directory
        mode: "0755"
        recurse: true

    - name: Generate terminal status for all catalog contexts
      generate_local_repo_access:
        pulp_cli_executable: "{{ pulp_cli_executable }}"
        pulp_server_ip: "{{ pulp_server_ip }}"
        pulp_server_port: "{{ pulp_server_port | int }}"
        cluster_os_type: "{{ catalog_execution_contexts[0].os_type }}"
        cluster_os_version: "{{ catalog_execution_contexts[0].os_version }}"
        architectures: "{{ catalog_execution_contexts[0].architectures }}"
        execution_contexts: "{{ catalog_execution_contexts }}"
        repo_config: "{{ repo_config }}"
        output_path: "{{ output_dir }}/repo_status.yml"
        local_repo_config_path: "{{ repo_manager_config_file }}"
      register: status_generation_result

    - name: Fail when catalog-required RPM repositories are unavailable
      ansible.builtin.fail:
        # yamllint disable-line rule:line-length
        msg: "{{ generate_repo_status_fail_when_catalog_required_rpm_repositories_are_unavailable_msg }}"
      when: not (status_generation_result.repository_ready | default(false) | bool)

    - name: Display generation result
      ansible.builtin.debug:
        msg:
          - "========== GENERATION COMPLETE =========="
          - "Output file: {{ output_dir }}/repo_status.yml"
          - "Status: {{ status_generation_result.published_status }}"
          - "=========================================="
