# =============================================================================
# GENERATE LOCAL REPO ACCESS PLAYBOOK
# =============================================================================
# This playbook generates repo_status.yml with comprehensive repository URLs.
# All tasks run on localhost (OIM).
#
# The generated file contains:
#   - Pulp server configuration
#   - Base URLs for content types (tarball, manifest, pip, git)
#   - Certificate paths
#   - RPM repository URLs by architecture
#   - File repository URLs (tarballs, manifests, git)
#   - User-defined repositories
#   - Legacy offline paths for backward compatibility
#
# Usage:
#   ansible-playbook playbooks/repo_operations/generate_repo_status.yml -e 'project_name=project_default'
# =============================================================================

- name: Generate repo_status.yml
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ playbook_dir | dirname | dirname }}/vars/default.yml"
  tasks:
    # -------------------------------------------------------------------------
    # PHASE 0: SETUP PULP CLI
    # -------------------------------------------------------------------------
    - name: Check if pulp CLI exists at /usr/local/bin/pulp
      ansible.builtin.stat:
        path: /usr/local/bin/pulp
      register: pulp_system_cli_check

    - name: Find pulp CLI path from current environment
      ansible.builtin.command: which pulp
      register: pulp_which_result
      changed_when: false
      failed_when: false
      when: not pulp_system_cli_check.stat.exists

    - name: Create symlink for pulp CLI at /usr/local/bin/pulp
      ansible.builtin.file:
        src: "{{ pulp_which_result.stdout }}"
        dest: /usr/local/bin/pulp
        state: link
      when:
        - not pulp_system_cli_check.stat.exists
        - pulp_which_result.rc | default(1) == 0
        - pulp_which_result.stdout | default('') | length > 0

    - name: Verify pulp CLI is accessible at /usr/local/bin/pulp
      ansible.builtin.command: /usr/local/bin/pulp --version
      register: pulp_cli_version
      changed_when: false
      failed_when: false

    - name: Fail if pulp CLI is not available
      ansible.builtin.fail:
        msg: |
          Pulp CLI not found at /usr/local/bin/pulp.
          Please ensure pulp-cli is installed and the virtual environment is activated:
            source <venv_path>/bin/activate
            pip install pulp-cli
          Then run the playbook again to create the symlink automatically.
      when: pulp_cli_version.rc != 0

    # -------------------------------------------------------------------------
    # PHASE 1: GET PULP STATUS
    # -------------------------------------------------------------------------
    - name: Read endpoint configuration
      ansible.builtin.include_role:
        name: ../../roles/pulp_validation
        tasks_from: read_endpoint_config.yml

    - name: Run pulp status command
      ansible.builtin.command: /usr/local/bin/pulp status
      register: pulp_status_output
      changed_when: false

    - name: Parse pulp status
      ansible.builtin.set_fact:
        pulp_status: "{{ pulp_status_output.stdout | from_json }}"

    - name: Set pulp connection facts
      ansible.builtin.set_fact:
        pulp_content_origin: "{{ pulp_status.content_settings.content_origin }}"
        pulp_protocol: "{{ pulp_status.content_settings.content_origin | urlsplit('scheme') | lower }}"
        pulp_server_ip: "{{ pulp_status.content_settings.content_origin | urlsplit('hostname') }}"
        pulp_server_port: "{{ pulp_status.content_settings.content_origin | urlsplit('port') }}"

    - name: Load software_config.json
      ansible.builtin.include_vars:
        file: "{{ input_project_dir }}/software_config.json"
        name: software_config

    - name: Set cluster OS facts
      ansible.builtin.set_fact:
        cluster_os_type: "{{ software_config.cluster_os_type }}"
        cluster_os_version: "{{ software_config.cluster_os_version }}"
        repo_config: "{{ software_config.repo_config | default('partial') }}"

    - name: Display Pulp connection info
      ansible.builtin.debug:
        msg:
          - "========== PULP SERVER INFO =========="
          - "Protocol: {{ pulp_protocol }}"
          - "IP: {{ pulp_server_ip }}"
          - "Port: {{ pulp_server_port }}"
          - "Cluster OS: {{ cluster_os_type }} {{ cluster_os_version }}"
          - "Repo Config: {{ repo_config }}"
          - "======================================"

    # -------------------------------------------------------------------------
    # PHASE 2: GENERATE LOCAL REPO ACCESS FILE
    # -------------------------------------------------------------------------
    - name: Ensure output directory exists
      ansible.builtin.file:
        path: "{{ output_dir }}"
        state: directory
        mode: "0755"
        recurse: true

    - name: Generate repo_status.yml
      generate_local_repo_access:
        pulp_server_ip: "{{ pulp_server_ip }}"
        pulp_server_port: "{{ pulp_server_port | int }}"
        pulp_protocol: "{{ pulp_protocol }}"
        cluster_os_type: "{{ cluster_os_type }}"
        cluster_os_version: "{{ cluster_os_version }}"
        repo_config: "{{ repo_config }}"
        output_path: "{{ output_dir }}/repo_status.yml"
        certs_dir: "{{ pulp_certs_dir }}"
        local_repo_config_path: "{{ input_project_dir }}/repo_manager_config.yml"
      register: generate_result

    - name: Display generation result
      ansible.builtin.debug:
        msg:
          - "========== GENERATION COMPLETE =========="
          - "Output file: {{ generate_result.output_file }}"
          - "RPM repositories: {{ generate_result.rpm_repos_count }}"
          - "File repositories: {{ generate_result.file_repos_count }}"
          - "{{ generate_result.msg }}"
          - "=========================================="
