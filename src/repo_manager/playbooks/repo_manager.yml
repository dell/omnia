# =============================================================================
# REPO MANAGER TOP-LEVEL PLAYBOOK
# =============================================================================
# This playbook orchestrates repo_manager operations with tag support.
# All tasks run on localhost (OIM).
#
# Usage:
#   # Deploy Pulp server
#   ansible-playbook repo_manager.yml --tags deploy
#
#   # Validate inputs
#   ansible-playbook repo_manager.yml --tags validate
#
#   # Download and sync packages/repositories
#   ansible-playbook repo_manager.yml --tags download
#
#   # Generate repo_status.yml
#   ansible-playbook repo_manager.yml --tags status
#
#   # Cleanup Pulp server
#   ansible-playbook repo_manager.yml --tags cleanup_pulp
#
#   # Cleanup specific repositories
#   ansible-playbook repo_manager.yml --tags cleanup_repos -e "cleanup_repos=x86_64_rhel_10.0_epel"
#
#   # Full workflow: validate -> deploy -> download -> status
#   ansible-playbook repo_manager.yml --tags "validate,deploy,download,status"
#
#   # Run all operations (except cleanup)
#   ansible-playbook repo_manager.yml --skip-tags cleanup
# =============================================================================

- name: Repo Manager Orchestrator - Setup
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ playbook_dir | dirname }}/vars/default.yml"
  tasks:
    - name: Ensure repo_manager log directory exists
      ansible.builtin.file:
        path: "{{ repo_manager_log_dir }}"
        state: directory
        mode: "0755"
      tags: always

    - name: Display usage information
      ansible.builtin.debug:
        msg:
          - "========== REPO MANAGER =========="
          - "Available tags:"
          - "  deploy    - Deploy Pulp server"
          - "  validate  - Validate input configurations"
          - "  download  - Download and sync packages/repositories"
          - "  status    - Generate repo_status.yml"
          - "  cleanup_pulp - Cleanup Pulp server and data"
          - "  cleanup_repos - Cleanup specific repositories"
          - ""
          - "Examples:"
          - "  ansible-playbook repo_manager.yml --tags deploy"
          - "  ansible-playbook repo_manager.yml --tags validate,deploy,download,status"
          - "  ansible-playbook repo_manager.yml --tags cleanup_pulp"
          - "=================================="
      tags: always

# -------------------------------------------------------------------------
# DEPLOY PULP
# -------------------------------------------------------------------------
- name: Deploy Pulp server
  import_playbook: "{{ playbook_dir }}/deploy/deploy_pulp.yml"
  tags:
    - deploy

# -------------------------------------------------------------------------
# VALIDATE INPUTS
# -------------------------------------------------------------------------
- name: Validate input configurations
  import_playbook: "{{ playbook_dir }}/validate/validate_config.yml"
  tags:
    - validate

# -------------------------------------------------------------------------
# DOWNLOAD PACKAGES
# -------------------------------------------------------------------------
- name: Download and sync packages/repositories
  import_playbook: "{{ playbook_dir }}/repo_operations/download.yml"
  tags:
    - download

# -------------------------------------------------------------------------
# GENERATE STATUS
# -------------------------------------------------------------------------
- name: Generate repo_status.yml
  import_playbook: "{{ playbook_dir }}/repo_operations/generate_repo_status.yml"
  tags:
    - status

# -------------------------------------------------------------------------
# CLEANUP PULP
# -------------------------------------------------------------------------
- name: Cleanup Pulp server and data
  import_playbook: "{{ playbook_dir }}/cleanup/cleanup_pulp.yml"
  tags:
    - cleanup_pulp
    - cleanup

# -------------------------------------------------------------------------
# CLEANUP REPOS
# -------------------------------------------------------------------------
- name: Cleanup specific repositories
  import_playbook: "{{ playbook_dir }}/cleanup/cleanup_repos.yml"
  tags:
    - cleanup_repos
    - cleanup
