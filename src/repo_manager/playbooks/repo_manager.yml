# =============================================================================
# REPO MANAGER TOP-LEVEL PLAYBOOK
# =============================================================================
# This playbook orchestrates repo_manager operations with tag support.
# All tasks run on localhost (OIM).
#
# Environment Variables:
#   SYSTEM_ADMIN_NIC_IPV4 - Required: Admin network interface IP
#   CATALOG_FILE_PATH     - Required: Path to catalog JSON file
#   OMNIA_DATA_PATH       - Optional: Data path (default: /opt/omnia)
#
# Usage:
#   # Prepare credentials and deploy Pulp server
#   ansible-playbook repo_manager.yml --tags prepare
#   ansible-playbook repo_manager.yml --tags prepare -e pulp_password='your_password'
#
#   # Precheck inputs
#   ansible-playbook repo_manager.yml --tags precheck
#
#   # Download and sync packages/repositories
#   ansible-playbook repo_manager.yml --tags download
#
#   # Generate repo_status.yml
#   ansible-playbook repo_manager.yml --tags status
#
#   # Cleanup Pulp server (full cleanup - removes container, data, logs)
#   ansible-playbook repo_manager.yml --tags cleanup_pulp
#   ansible-playbook repo_manager.yml --tags cleanup_pulp -e cleanup_logs=false
#   ansible-playbook repo_manager.yml --tags cleanup_pulp -e cleanup_credentials=false
#
#   # Cleanup specific repositories (selective cleanup)
#   ansible-playbook repo_manager.yml --tags cleanup_repos -e "cleanup_repos=x86_64_rhel_10.0_epel"
#   ansible-playbook repo_manager.yml --tags cleanup_repos -e "cleanup_repos=x86_64_rhel_10.0_epel,aarch64_rhel_10.0_epel"
#   ansible-playbook repo_manager.yml --tags cleanup_repos -e "cleanup_containers=docker.io/library/nginx"
#   ansible-playbook repo_manager.yml --tags cleanup_repos -e "cleanup_files=git,chart-0.48.0"
#   ansible-playbook repo_manager.yml --tags cleanup_repos -e "cleanup_repos=all" -e force=true
#
#   # Full workflow: precheck -> prepare -> download -> status
#   ansible-playbook repo_manager.yml --tags "precheck,prepare,download,status"
#
#   # Run all operations (except cleanup)
#   ansible-playbook repo_manager.yml --skip-tags cleanup
#
#   # Upgrade repo_manager (placeholder)
#   ansible-playbook repo_manager.yml --tags upgrade
#
#   # Rollback repo_manager (placeholder)
#   ansible-playbook repo_manager.yml --tags rollback
#
#   # Catalog operations
#   ansible-playbook repo_manager.yml --tags catalog_generate -e "input_file=input/packages.txt"
#   ansible-playbook repo_manager.yml --tags catalog_add -e "input_file=input/additions.txt"
#   ansible-playbook repo_manager.yml --tags catalog_delete -e "input_file=input/removals.txt"
#   ansible-playbook repo_manager.yml --tags catalog_validate
# =============================================================================

# -------------------------------------------------------------------------
# DISPLAY USAGE
# -------------------------------------------------------------------------
- name: Display Repo Manager Usage
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Repo Manager Orchestrator - Usage
      ansible.builtin.debug:
        msg: "Run with --tags to specify operation (prepare, precheck, download, status, cleanup_pulp, cleanup_repos)"
  tags: always

# -------------------------------------------------------------------------
# PRECHECK
# -------------------------------------------------------------------------
- name: Repo Manager Orchestrator - Precheck
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ playbook_dir | dirname }}/vars/default.yml"
  roles:
    - role: precheck_environment
  tags:
    - precheck
    - always

# -------------------------------------------------------------------------
# SETUP
# -------------------------------------------------------------------------
- name: Repo Manager Orchestrator - Setup
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ playbook_dir | dirname }}/vars/default.yml"
  roles:
    - role: repo_manager_setup
  tags: always

# -------------------------------------------------------------------------
# PREPARE CREDENTIALS AND DEPLOY PULP
# -------------------------------------------------------------------------
- name: Prepare credentials and deploy Pulp server
  ansible.builtin.import_playbook: "{{ playbook_dir }}/deploy/deploy_pulp.yml"
  tags:
    - prepare
    - deploy

# -------------------------------------------------------------------------
# PRECHECK INPUTS
# -------------------------------------------------------------------------
- name: Precheck input configurations
  ansible.builtin.import_playbook: "{{ playbook_dir }}/validate/validate_config.yml"
  tags:
    - precheck

# -------------------------------------------------------------------------
# DOWNLOAD PACKAGES
# -------------------------------------------------------------------------
- name: Download and sync packages/repositories
  ansible.builtin.import_playbook: "{{ playbook_dir }}/repo_operations/download.yml"
  tags:
    - execute
    - download

# -------------------------------------------------------------------------
# GENERATE STATUS
# -------------------------------------------------------------------------
- name: Generate repo_status.yml
  ansible.builtin.import_playbook: "{{ playbook_dir }}/repo_operations/generate_repo_status.yml"
  tags:
    - status

# -------------------------------------------------------------------------
# CLEANUP PULP
# -------------------------------------------------------------------------
- name: Cleanup Pulp server and data
  ansible.builtin.import_playbook: "{{ playbook_dir }}/cleanup/cleanup_pulp.yml"
  tags:
    - never
    - cleanup
    - cleanup_pulp

# -------------------------------------------------------------------------
# CLEANUP REPOS
# -------------------------------------------------------------------------
- name: Cleanup specific repositories
  ansible.builtin.import_playbook: "{{ playbook_dir }}/cleanup/cleanup_repos.yml"
  tags:
    - never
    - cleanup_repos

# -------------------------------------------------------------------------
# UPGRADE (Placeholder)
# -------------------------------------------------------------------------
- name: Upgrade Repo Manager
  ansible.builtin.import_playbook: "{{ playbook_dir }}/upgrade_repo_manager.yml"
  tags:
    - never
    - upgrade

# -------------------------------------------------------------------------
# ROLLBACK (Placeholder)
# -------------------------------------------------------------------------
- name: Rollback Repo Manager
  ansible.builtin.import_playbook: "{{ playbook_dir }}/rollback_repo_manager.yml"
  tags:
    - never
    - rollback

# -------------------------------------------------------------------------
# CATALOG OPERATIONS
# -------------------------------------------------------------------------
- name: Catalog Operations
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ playbook_dir | dirname }}/vars/default.yml"
  roles:
    - role: catalog
  tags:
    - never
    - catalog_generate
    - catalog_add
    - catalog_delete
    - catalog_validate
