---
# The usage examples intentionally remain on one line so users can copy each
# command without losing continuation arguments to YAML comment prefixes.
# yamllint disable rule:line-length
# =============================================================================
# REPO MANAGER TOP-LEVEL PLAYBOOK
# =============================================================================
# This playbook orchestrates repo_manager operations with tag support.
# All tasks run on localhost (OIM).
#
# Environment Variables:
#   SYSTEM_ADMIN_NIC_IPV4 - Required: Admin network interface IP
#   CATALOG_FILE_PATH     - Required: Path to catalog JSON file
#   OMNIA_DATA_PATH       - Optional: Data path (default: /opt/omnia)
#
# Usage:
#   Every example below is a single shell command. When copying directly from
#   this YAML source file, omit the leading "#   " comment prefix.
#
#   # Prepare credentials and deploy the Pulp server.
#   # If pulp_password is omitted, Repo Manager collects or reuses credentials.
#   ansible-playbook repo_manager.yml --tags prepare
#   ansible-playbook repo_manager.yml --tags prepare -e "pulp_password=CHANGEME"
#
#   # Collect or update credentials without deploying Pulp.
#   ansible-playbook repo_manager.yml --tags credentials
#
#   # Validate the environment, catalog and Repo Manager input files.
#   ansible-playbook repo_manager.yml --tags precheck
#
#   # Download and synchronize catalog packages and repositories to Pulp.
#   # If the catalog contains multiple OS minor versions, Repo Manager processes
#   # them in numeric order. Every artifact for one version finishes before the
#   # next version starts; a failed version prevents later versions from running.
#   ansible-playbook repo_manager.yml --tags download
#
#   # Refresh RPM repositories that are already synchronized. Repo Manager asks
#   # Pulp to check the selected upstream remotes for new or changed packages.
#   # If repository content changes, the publication and distribution are
#   # updated automatically while the existing distribution URL is preserved.
#   ansible-playbook repo_manager.yml --tags download -e "resync_repos=all"
#
#   # Refresh one or more RPM repositories. Use the complete, case-sensitive
#   # Pulp name: <arch>_<os>_<version>_<repo>.
#   ansible-playbook repo_manager.yml --tags download -e "resync_repos=x86_64_rhel_10.0_ldms"
#   ansible-playbook repo_manager.yml --tags download -e "resync_repos=x86_64_rhel_10.0_baseos,x86_64_rhel_10.0_appstream"
#   # resync_repos applies to RPM repositories; it does not force container,
#   # File or Python content to resynchronize.
#
#   # Generate repo_status.yml from the current synchronized content.
#   ansible-playbook repo_manager.yml --tags status
#
#   # Remove the complete Pulp deployment, including its container, image,
#   # runtime data and CLI configuration. Credential deletion is interactive
#   # unless cleanup_credentials is explicitly set.
#   ansible-playbook repo_manager.yml --tags cleanup_pulp
#   ansible-playbook repo_manager.yml --tags cleanup_pulp -e "cleanup_credentials=true"
#   ansible-playbook repo_manager.yml --tags cleanup_pulp -e "cleanup_logs=false"
#   ansible-playbook repo_manager.yml --tags cleanup_pulp -e "cleanup_logs=false" -e "cleanup_credentials=false"
#
#   # Selective artifact cleanup prompts for confirmation. Add -e "force=true"
#   # only when the requested destructive scope has already been reviewed.
#
#   # Selectively remove one or more RPM repositories.
#   # Use the complete Pulp repository name: <arch>_<os>_<version>_<repo>.
#   ansible-playbook repo_manager.yml --tags cleanup_repos -e "cleanup_repos=x86_64_rhel_10.0_epel"
#   ansible-playbook repo_manager.yml --tags cleanup_repos -e "cleanup_repos=x86_64_rhel_10.0_epel,aarch64_rhel_10.0_epel"
#
#   # Remove only one container tag. Other tags in the same image repository
#   # remain available. In this example, config-reloader-v0.68.3 is preserved.
#   ansible-playbook repo_manager.yml --tags cleanup_repos -e "cleanup_containers=docker.io/victoriametrics/operator:v0.68.3"
#
#   # Remove multiple exact tags from the same image repository.
#   ansible-playbook repo_manager.yml --tags cleanup_repos -e "cleanup_containers=docker.io/victoriametrics/operator:v0.68.3,docker.io/victoriametrics/operator:config-reloader-v0.68.3"
#
#   # An untagged image removes the complete container repository, including
#   # all its tags, distribution and remote.
#   ansible-playbook repo_manager.yml --tags cleanup_repos -e "cleanup_containers=docker.io/library/nginx"
#
#   # Remove selected File/Python artifacts by their exact catalog names.
#   ansible-playbook repo_manager.yml --tags cleanup_repos -e "cleanup_files=helm-charts-2.17.0,helm-v3.20.1-amd64"
#
#   # Remove all artifacts of one type. force=true skips the confirmation prompt.
#   ansible-playbook repo_manager.yml --tags cleanup_repos -e "cleanup_repos=all" -e "force=true"
#   ansible-playbook repo_manager.yml --tags cleanup_repos -e "cleanup_containers=all" -e "force=true"
#   ansible-playbook repo_manager.yml --tags cleanup_repos -e "cleanup_files=all" -e "force=true"
#
#   # Remove all RPM, container, File and Python repositories from Pulp.
#   # This does not remove the Pulp deployment itself.
#   ansible-playbook repo_manager.yml --tags cleanup_repos -e "cleanup_repos=all" -e "cleanup_containers=all" -e "cleanup_files=all" -e "force=true"
#
#   # Run the standard workflow. Plays execute in their order in this file:
#   # environment precheck -> prepare -> input precheck -> download -> status.
#   ansible-playbook repo_manager.yml --tags "prepare,precheck,download,status"
#
#   # Run all standard operations. Cleanup, catalog, upgrade and rollback plays
#   # use the never tag and are not selected by this command.
#   ansible-playbook repo_manager.yml --skip-tags cleanup
#
#   # Upgrade Repo Manager (placeholder).
#   ansible-playbook repo_manager.yml --tags upgrade
#
#   # Roll back Repo Manager (placeholder).
#   ansible-playbook repo_manager.yml --tags rollback
#
#   # Cleanup logs and results (OMNIA_DATA_PATH defaults to /opt/omnia):
#   # Top-level playbook log:
#   #   /var/log/omnia/repo_manager/repo_manager.log
#   # Selective cleanup detail log:
#   #   <OMNIA_DATA_PATH>/repo_manager/log/<os>/<version>/cleanup/standard.log
#   #   Multi-version/shared cleanup: <OMNIA_DATA_PATH>/repo_manager/log/<os>/cleanup/standard.log
#   # Selective cleanup result table:
#   #   <OMNIA_DATA_PATH>/repo_manager/log/<os>/<version>/cleanup/cleanup_status.csv
#   #   Multi-version/shared cleanup: <OMNIA_DATA_PATH>/repo_manager/log/<os>/cleanup/cleanup_status.csv
#   # Direct cleanup playbook log (when run from playbooks/cleanup/):
#   #   /var/log/omnia/repo_manager/cleanup.log
#   # Full Pulp cleanup removes <OMNIA_DATA_PATH>/repo_manager/log by default.
#   # Use -e "cleanup_logs=false" to preserve existing Repo Manager runtime logs.
#
#   # Catalog operations
#   ansible-playbook repo_manager.yml --tags catalog_generate -e "input_file=input/packages.txt"
#   ansible-playbook repo_manager.yml --tags catalog_add -e "input_file=input/additions.txt"
#   ansible-playbook repo_manager.yml --tags catalog_delete -e "input_file=input/removals.txt"
#   ansible-playbook repo_manager.yml --tags catalog_validate
# =============================================================================
# yamllint enable rule:line-length

# -------------------------------------------------------------------------
# DISPLAY USAGE
# -------------------------------------------------------------------------
- name: Display Repo Manager Usage
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Repo Manager Orchestrator - Usage
      ansible.builtin.debug:
        msg: >-
          Run with --tags to specify operation (credentials, prepare, precheck,
          download, status, cleanup_pulp, cleanup_repos)
  tags: always

# -------------------------------------------------------------------------
# PRECHECK
# -------------------------------------------------------------------------
- name: Repo Manager Orchestrator - Precheck
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ playbook_dir | dirname }}/vars/default.yml"
  roles:
    - role: precheck_environment
      when: >-
        not ('credentials' in (ansible_run_tags | default([])) and
             ((ansible_run_tags | default([]) |
               difference(['credentials'])) | length == 0))
  tags:
    - precheck
    - always

# -------------------------------------------------------------------------
# SETUP
# -------------------------------------------------------------------------
- name: Repo Manager Orchestrator - Setup
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ playbook_dir | dirname }}/vars/default.yml"
  roles:
    - role: repo_manager_setup
      when: >-
        not ('credentials' in (ansible_run_tags | default([])) and
             ((ansible_run_tags | default([]) |
               difference(['credentials'])) | length == 0))
  tags: always

# -------------------------------------------------------------------------
# COLLECT CREDENTIALS ONLY
# -------------------------------------------------------------------------
- name: Collect Repo Manager credentials
  ansible.builtin.import_playbook: >-
    {{ playbook_dir }}/credentials/get_repo_credentials.yml
  tags:
    - never
    - credentials

# -------------------------------------------------------------------------
# PREPARE CREDENTIALS AND DEPLOY PULP
# -------------------------------------------------------------------------
- name: Prepare credentials and deploy Pulp server
  ansible.builtin.import_playbook: "{{ playbook_dir }}/deploy/deploy_pulp.yml"
  tags:
    - prepare
    - deploy

# -------------------------------------------------------------------------
# PRECHECK INPUTS
# -------------------------------------------------------------------------
- name: Precheck input configurations
  ansible.builtin.import_playbook: >-
    {{ playbook_dir }}/validate/validate_config.yml
  tags:
    - precheck

# -------------------------------------------------------------------------
# DOWNLOAD PACKAGES
# -------------------------------------------------------------------------
- name: Download and sync packages/repositories
  ansible.builtin.import_playbook: >-
    {{ playbook_dir }}/repo_operations/download.yml
  tags:
    - execute
    - download

# -------------------------------------------------------------------------
# GENERATE STATUS
# -------------------------------------------------------------------------
- name: Generate repo_status.yml
  ansible.builtin.import_playbook: >-
    {{ playbook_dir }}/repo_operations/generate_repo_status.yml
  tags:
    - status

# -------------------------------------------------------------------------
# CLEANUP PULP
# -------------------------------------------------------------------------
- name: Cleanup Pulp server and data
  ansible.builtin.import_playbook: "{{ playbook_dir }}/cleanup/cleanup_pulp.yml"
  tags:
    - never
    - cleanup
    - cleanup_pulp

# -------------------------------------------------------------------------
# CLEANUP REPOS
# -------------------------------------------------------------------------
- name: Cleanup specific repositories
  ansible.builtin.import_playbook: >-
    {{ playbook_dir }}/cleanup/cleanup_repos.yml
  tags:
    - never
    - cleanup_repos

# -------------------------------------------------------------------------
# UPGRADE (Placeholder)
# -------------------------------------------------------------------------
- name: Upgrade Repo Manager
  ansible.builtin.import_playbook: "{{ playbook_dir }}/upgrade_repo_manager.yml"
  tags:
    - never
    - upgrade

# -------------------------------------------------------------------------
# ROLLBACK (Placeholder)
# -------------------------------------------------------------------------
- name: Rollback Repo Manager
  ansible.builtin.import_playbook: >-
    {{ playbook_dir }}/rollback_repo_manager.yml
  tags:
    - never
    - rollback

# -------------------------------------------------------------------------
# CATALOG OPERATIONS
# -------------------------------------------------------------------------
- name: Catalog Operations
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ playbook_dir | dirname }}/vars/default.yml"
  roles:
    - role: catalog
  tags:
    - never
    - catalog_generate
    - catalog_add
    - catalog_delete
    - catalog_validate
