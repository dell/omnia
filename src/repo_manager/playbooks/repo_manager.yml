# =============================================================================
# REPO MANAGER TOP-LEVEL PLAYBOOK
# =============================================================================
# This playbook orchestrates all repo_manager operations using tags.
#
# Usage:
#   # Deploy Pulp server
#   ansible-playbook playbooks/repo_manager.yml --tags deploy
#
#   # Validate inputs
#   ansible-playbook playbooks/repo_manager.yml --tags validate
#
#   # Download and sync packages/repositories
#   ansible-playbook playbooks/repo_manager.yml --tags download
#
#   # Generate repo_status.yml
#   ansible-playbook playbooks/repo_manager.yml --tags generate
#
#   # Cleanup Pulp server
#   ansible-playbook playbooks/repo_manager.yml --tags cleanup
#
#   # Cleanup specific repositories, containers, or files
#   ansible-playbook playbooks/repo_manager.yml --tags cleanup_repos -e "cleanup_repos=x86_64_rhel_10.0_epel"
#
#   # Full workflow (deploy, validate, download, generate)
#   ansible-playbook playbooks/repo_manager.yml
# =============================================================================

- name: Deploy Pulp server
  ansible.builtin.import_playbook: deploy/deploy_pulp.yml
  tags: deploy

- name: Validate inputs
  ansible.builtin.import_playbook: validate/validate_config.yml
  tags: validate

- name: Download and sync packages
  ansible.builtin.import_playbook: repo_operations/download.yml
  tags: download

- name: Generate repo_status.yml
  ansible.builtin.import_playbook: repo_operations/generate_repo_status.yml
  tags: generate

- name: Cleanup Pulp
  ansible.builtin.import_playbook: cleanup/cleanup_pulp.yml
  tags: cleanup

- name: Cleanup specific repositories
  ansible.builtin.import_playbook: cleanup/cleanup_repos.yml
  tags: cleanup_repos
