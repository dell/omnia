# =============================================================================
# PULP DEPLOYMENT PLAYBOOK
# =============================================================================
# This playbook deploys and configures the Pulp repository server container.
#
# NOTE: Input validation is NOT included in this playbook.
#       Run validation separately before deployment:
#       ansible-playbook playbooks/validate_config.yml --tags local_repo
#
# Workflow:
#   1. Pre-flight: Load project config, create OIM group
#   2. Credentials: Fetch required credentials (pulp_password)
#   3. Network: Configure network and SSH known hosts
#   4. Pre-checks: Verify existing container status
#   5. Deployment: Pull image and deploy Pulp container (HTTP/HTTPS)
#   6. Configuration: Configure Pulp CLI and certificates
#   7. Verification: Verify Pulp is running and healthy
#
# Usage:
#   # Full deployment
#   ansible-playbook playbooks/deploy_pulp.yml -e 'project_name=project_default'
#
#   # With validation first (recommended)
#   ansible-playbook playbooks/validate_config.yml --tags local_repo -e 'project_name=project_default'
#   ansible-playbook playbooks/deploy_pulp.yml -e 'project_name=project_default'
#
# =============================================================================

# -----------------------------------------------------------------------------
# PHASE 1: PRE-FLIGHT SETUP
# -----------------------------------------------------------------------------

- name: "Phase 1.1: Include input project directory"
  when: not project_dir_status | default(false) | bool
  ansible.builtin.import_playbook: include_input_dir.yml
  tags: always

- name: "Phase 1.2: Create OIM host group"
  when: not oim_group_status | default(false) | bool
  ansible.builtin.import_playbook: create_container_group.yml
  vars:
    oim_group: true
  tags: always

# -----------------------------------------------------------------------------
# PHASE 2: CREDENTIALS
# -----------------------------------------------------------------------------

- name: "Phase 2: Fetch configuration credentials"
  ansible.builtin.import_playbook: get_config_credentials.yml
  tags:
    - pulp
    - credentials

# -----------------------------------------------------------------------------
# PHASE 3: NETWORK CONFIGURATION
# -----------------------------------------------------------------------------

- name: "Phase 3: Configure network and known hosts"
  hosts: localhost
  connection: local
  gather_facts: false
  tags: always
  vars_files:
    - "{{ playbook_dir | dirname }}/vars/default.yml"
  tasks:
    - name: Read endpoint configuration
      ansible.builtin.include_role:
        name: ../roles/pulp_validation
        tasks_from: read_endpoint_config.yml

    - name: Add OIM to SSH known hosts
      ansible.builtin.include_role:
        name: ../roles/common
        tasks_from: add_known_hosts.yml

# -----------------------------------------------------------------------------
# PHASE 4: PRE-DEPLOYMENT CHECKS
# -----------------------------------------------------------------------------

- name: "Phase 4: Pre-deployment container checks"
  hosts: oim
  connection: ssh
  gather_facts: false
  tags: pulp
  vars_files:
    - "{{ playbook_dir | dirname }}/vars/default.yml"
  tasks:
    - name: Run pre-flight checks
      ansible.builtin.include_role:
        name: ../roles/deploy_pulp
        tasks_from: preflight_checks.yml

# -----------------------------------------------------------------------------
# PHASE 5: PULP CONTAINER DEPLOYMENT
# -----------------------------------------------------------------------------

- name: "Phase 5: Deploy Pulp container on OIM host"
  hosts: oim
  connection: ssh
  gather_facts: false
  tags: pulp
  vars_files:
    - "{{ playbook_dir | dirname }}/vars/default.yml"
  pre_tasks:
    - name: Display deployment info
      ansible.builtin.debug:
        msg:
          - "========== PULP DEPLOYMENT =========="
          - "Target host: {{ inventory_hostname }}"
          - "Protocol: {{ 'HTTPS' if pulp_protocol_https else 'HTTP' }}"
          - "Image: {{ pulp_image }}"
          - "======================================"
  roles:
    - role: ../roles/common
    - role: ../roles/deploy_pulp

# -----------------------------------------------------------------------------
# PHASE 6: PULP CLI CONFIGURATION
# -----------------------------------------------------------------------------

- name: "Phase 6: Configure Pulp CLI"
  hosts: localhost
  connection: local
  gather_facts: true
  tags: pulp
  vars_files:
    - "{{ playbook_dir | dirname }}/vars/default.yml"
  tasks:
    - name: Configure Pulp CLI for HTTP
      ansible.builtin.include_role:
        name: ../roles/deploy_pulp
        tasks_from: configure_cli_http.yml
      when: not hostvars['oim']['pulp_protocol_https']

    - name: Configure Pulp CLI for HTTPS
      ansible.builtin.include_role:
        name: ../roles/deploy_pulp
        tasks_from: configure_cli_https.yml
      when: hostvars['oim']['pulp_protocol_https']

# -----------------------------------------------------------------------------
# PHASE 7: VERIFICATION
# -----------------------------------------------------------------------------

- name: "Phase 7: Verify Pulp deployment"
  hosts: oim
  connection: ssh
  gather_facts: false
  tags: pulp
  vars_files:
    - "{{ playbook_dir | dirname }}/vars/default.yml"
  tasks:
    - name: Verify Pulp container status
      ansible.builtin.include_role:
        name: ../roles/deploy_pulp
        tasks_from: verify_status.yml

    - name: Display deployment summary
      ansible.builtin.debug:
        msg:
          - "========== DEPLOYMENT COMPLETE =========="
          - "Pulp container is running successfully"
          - "Protocol: {{ 'HTTPS' if pulp_protocol_https else 'HTTP' }}"
          - "Port: {{ '2225' }}"
          - "=========================================="
