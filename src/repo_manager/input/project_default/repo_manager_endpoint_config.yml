# ***********************************************************************
# REPO MANAGER ENDPOINT CONFIGURATION
# ***********************************************************************
# This file configures the Pulp repository server endpoint used by repo_manager.
# ***********************************************************************

# =============================================================================
# PULP SERVER ENDPOINT
# =============================================================================

# Pulp server IP address (also used for OIM SSH connection)
pulp_server_ip: "xx.xx.xx.xx"

# Pulp server port
pulp_server_port: 2225

# Pulp protocol: "https"
pulp_protocol: "https"

# Enable HTTPS
pulp_https_enabled: true

# =============================================================================
# SSL CERTIFICATES
# =============================================================================

ssl_certificates:
  server_crt: "/opt/omnia/pulp/settings/certs/pulp_webserver.crt"
  server_key: "/opt/omnia/pulp/settings/certs/pulp_webserver.key"
  certs_dir: "/opt/omnia/pulp/settings/certs"
