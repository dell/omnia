# ***********************************************************************
# DO NOT REMOVE OR COMMENT OUT ANY LINES IN THIS FILE.
# SIMPLY APPEND THE REQUIRED VALUES AGAINST THE PARAMETER OF YOUR CHOICE.
# ***********************************************************************
# NOTE: This config uses the catalog-based approach (Omnia 2.2+).
#       Package resolution is driven by the catalog.
#       Registry and repository configurations are defined below and
#       linked to catalog package sources via registry and reponame fields.
#
# ================================
# REPOSITORY FIELD REFERENCE TABLE
# ================================
# The following table shows all possible fields for repository entries:
#
# +----------------+-----------+----------------------------------------------------------+
# | Field          | Required  | Description / Allowed Values                            |
# +----------------+-----------+----------------------------------------------------------+
# | url            | No        | Repository URL (leave empty for RHEL subscription repos)  |
# | gpgkey         | No        | GPG key URL for package verification                     |
# | policy         | No        | Sync policy: always | partial (default: from repo_config) |
# | caching        | No        | Local caching: true | false (default: true)               |
# | sslcacert      | No        | Path to SSL CA certificate                               |
# | sslclientkey   | No        | Path to SSL client key (mTLS)                            |
# | sslclientcert  | No        | Path to SSL client certificate (mTLS)                    |
# +----------------+-----------+----------------------------------------------------------+
# Note: For RHEL subscription repos (baseos, appstream, crb), SSL certs are
#       auto-populated from the subscription; do not set them here.
#
# ================================
# VARIABLE DETAILS
# ================================
#
# 1. repo_config
# --------------------------
#    Global repository sync policy.
#    Allowed values:
#      always  : Sync all packages from all repositories (full mirror)
#      partial : Sync only packages declared in the catalog (selective sync)
#    This can be overridden per-repository using the 'policy' field.
#
# 2. caching_policy
# --------------------------
#    Global caching policy that controls Pulp download behavior.
#    Allowed values:
#      true    : Use on_demand policy (metadata only, download on request)
#      false   : Use immediate policy when repo_config=always (download all)
#    This can be overridden per-repository using the 'caching' field.
#    Default: true (on_demand for backward compatibility)
#    Catalog entries with packagetype "rpm_repo" require retained Pulp content.
#    Their mapped repository must not resolve to the streamed policy; keep
#    caching enabled globally or override that repository with caching: true.
#
# 3. registries
# --------------------------
#    Container registry configurations.
#    Format: registry_name → { base_url, port, auth, tls }
#
#    LINK TO CATALOG:
#      Each catalog package source with a "registry" field is resolved by looking
#      up that name here. If the registry is not found, image syncing will fail.
#
#    Fields per registry entry:
#      base_url : Full base URL of the registry (required)
#      port     : HTTPS/HTTP port (required)
#      auth     : Authentication block
#        type        : none | basic
#        credentials : Credential lookup block
#          vault_path: Key under registry_credentials in the encrypted credential file
#      tls      : TLS settings
#        ca_path         : Path to CA certificate (leave empty for public CAs)
#        client_cert_path: Path to client certificate (mTLS)
#        client_key_path : Path to client key (mTLS)
#        insecure        : true to skip TLS verification (not recommended)
#
# 3. repositories
# --------------------------
#    RPM repository configurations.
#    Format: version → architecture → repo_name → { url, gpgkey, sslcacert, sslclientkey, sslclientcert }
#
#    LINK TO CATALOG:
#      Each catalog package source with a "reponame" field is resolved by looking
#      up that name here (for the matching version and architecture). If the repo
#      is not found, RPM syncing will fail.
#
#    Optional per-entry fields:
#      policy      : Sync policy – allowed values: always, partial (default: from repo_config)
#      caching     : Local caching – allowed values: true, false (default: true)
#      sslcacert   : Path to SSL CA certificate
#      sslclientkey: Path to SSL client key
#      sslclientcert: Path to SSL client certificate
#    Note: For RHEL subscription repos (baseos, appstream, crb), SSL certs are
#          auto-populated from the subscription; do not set them here.

# ================================
# VARIABLES
# ================================

# ------------------------------------------------------------
# 1. REPO CONFIG (global sync policy)
# ------------------------------------------------------------
repo_config: "partial"  # Options: always | partial
caching_policy: true    # Options: true (on_demand) | false (immediate)
# Note: Per-repo 'caching' field overrides global caching_policy when set

# ------------------------------------------------------------
# 2. REGISTRIES
#    Container registry configurations.
#    Format: registry_name → { base_url, port, auth, tls }
#
#    LINK TO CATALOG:
#      Each catalog package source with a "registry" field (e.g. "registry": "docker.io")
#      is resolved by looking up that name here. If the registry is not found,
#      image syncing will fail.
#
#    Add custom/on-prem registries here. Known public registries (docker.io, ghcr.io,
#    quay.io, registry.k8s.io, and others listed by Repo Manager) are handled
#    directly and do not require an entry unless custom auth/TLS is needed.
# ------------------------------------------------------------
# Example:
#   registries:
#     my-reg.example.com:
#       base_url: "https://my-reg.example.com"
#       port: 443
#       auth:
#         type: basic
#         credentials:
#           vault_path: "registries/my-reg.example.com"
#       tls:
#         ca_path: ""
#         client_cert_path: ""
#         client_key_path: ""
#         insecure: false
registries:

# ------------------------------------------------------------
# 4. REPOSITORIES
#    RPM repository configurations.
#    Format: version → architecture → repo_name → { url, gpgkey, sslcacert, sslclientkey, sslclientcert }
#
#    LINK TO CATALOG:
#      Each catalog package source with a "reponame" field is resolved by looking
#      up that name here (for the matching version and architecture). If the repo
#      is not found, RPM syncing will fail.
# ------------------------------------------------------------
# REPO CATEGORIES:
#   - RHEL SUBSCRIPTION REPOS (baseos, appstream, codeready-builder):
#       These are provided by RHEL subscription. If subscription is enabled on nodes,
#       leave these empty – they will be auto-configured from the subscription.
#       If subscription is NOT registered, you MUST fill in the URLs for these repos.
#   - USER-REQUIRED REPOS (slurm_custom):
#       You MUST fill in the URLs here for your custom Slurm repository.
#       Failure to do so will cause sync errors.
#   - OMNIA-REQUIRED REPOS (docker-ce, doca, cuda, nvidia-hpc-sdk):
#       These are required for Omnia features (container runtime, DOCA drivers,
#       CUDA, NVIDIA HPC SDK). The URLs below are defaults; update them if you
#       use custom mirrors. Incorrect changes may cause Omnia failure.
#   - ADDITIONAL REPOS (optional):
#       For extra repositories not covered above (e.g. grafana, custom tools).
#       Packages from these repos must be declared in the catalog.
# ------------------------------------------------------------
repositories:
  "10.0":
    x86_64:
      # RHEL SUBSCRIPTION REPOS (optional if subscription enabled, mandatory otherwise)
      # Example format: { url: "", gpgkey: "", policy: "partial", caching: true, sslcacert: "", sslclientkey: "", sslclientcert: "" }
      baseos: {}
      appstream: {}
      codeready-builder: {}
      epel:
        url: "https://dl.fedoraproject.org/pub/epel/10/Everything/x86_64/"
        gpgkey: "https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-10"
        sslcacert: ""
        sslclientkey: ""
        sslclientcert: ""
        policy: "partial"
        caching: true
        priority: 99
      kubernetes-v1-35:
        url: "https://pkgs.k8s.io/core:/stable:/v1.35/rpm/"
        gpgkey: "https://pkgs.k8s.io/core:/stable:/v1.35/rpm/repodata/repomd.xml.key"
        sslcacert: ""
        sslclientkey: ""
        sslclientcert: ""
      cri-o-v1-35:
        url: "https://ftp.gwdg.de/pub/opensuse/repositories/isv:/cri-o:/stable:/v1.35/rpm/"
        gpgkey: "https://ftp.gwdg.de/pub/opensuse/repositories/isv:/cri-o:/stable:/v1.35/rpm/repodata/repomd.xml.key"
        sslcacert: ""
        sslclientkey: ""
        sslclientcert: ""
      doca:
        url: "https://linux.mellanox.com/public/repo/doca/3.2.1/rhel10/x86_64/"
        gpgkey: "https://linux.mellanox.com/public/repo/doca/3.2.1/rhel10/x86_64/repodata/repomd.xml.key"
        sslcacert: ""
        sslclientkey: ""
        sslclientcert: ""
      docker-ce:
        url: "https://download.docker.com/linux/centos/10/x86_64/stable/"
        gpgkey: "https://download.docker.com/linux/centos/gpg"
        sslcacert: ""
        sslclientkey: ""
        sslclientcert: ""
      cuda:
        url: "https://developer.download.nvidia.com/compute/cuda/repos/rhel10/x86_64/"
        gpgkey: "https://developer.download.nvidia.com/compute/cuda/repos/rhel10/x86_64/repodata/repomd.xml.key"
        sslcacert: ""
        sslclientkey: ""
        sslclientcert: ""
        policy: "partial"
        caching: true
      nvidia-hpc-sdk:
        url: "https://developer.download.nvidia.com/hpc-sdk/rhel/x86_64"
        gpgkey: "https://developer.download.nvidia.com/hpc-sdk/rhel/RPM-GPG-KEY-NVIDIA-HPC-SDK"
        sslcacert: ""
        sslclientkey: ""
        sslclientcert: ""
        policy: "partial"
        caching: true
      # ADDITIONAL REPOS (optional – for third-party packages, declare in the catalog)
      # Example format:
      #   additional_repos:
      #     grafana:
      #       url: "https://rpm.grafana.com/"
      #       gpgkey: "https://rpm.grafana.com/gpg.key"
      #       policy: "partial"
      #       caching: true
      #       priority: 99
      #       sslcacert: ""
      #       sslclientkey: ""
      #       sslclientcert: ""
      additional_repos: {}
      user_repos: {}
    aarch64:
      # RHEL SUBSCRIPTION REPOS (optional if subscription enabled, mandatory otherwise)
      # Example format: { url: "", gpgkey: "", policy: "partial", caching: true, sslcacert: "", sslclientkey: "", sslclientcert: "" }
      baseos: {}
      appstream: {}
      codeready-builder: {}
      # USER-REQUIRED REPOS (MUST fill in URLs for your custom repositories)
      # OMNIA-REQUIRED REPOS (edit with caution – required for Omnia features)
      epel:
        url: "https://dl.fedoraproject.org/pub/epel/10/Everything/aarch64/"
        gpgkey: "https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-10"
        sslcacert: ""
        sslclientkey: ""
        sslclientcert: ""
      doca:
        url: "https://linux.mellanox.com/public/repo/doca/3.2.1/rhel10/arm64-sbsa/"
        gpgkey: "https://linux.mellanox.com/public/repo/doca/3.2.1/rhel10/arm64-sbsa/repodata/repomd.xml.key"
        sslcacert: ""
        sslclientkey: ""
        sslclientcert: ""
      docker-ce:
        url: "https://download.docker.com/linux/centos/10/aarch64/stable/"
        gpgkey: "https://download.docker.com/linux/centos/gpg"
        sslcacert: ""
        sslclientkey: ""
        sslclientcert: ""
      cuda:
        url: "https://developer.download.nvidia.com/compute/cuda/repos/rhel10/sbsa/"
        gpgkey: "https://developer.download.nvidia.com/compute/cuda/repos/rhel10/sbsa/repodata/repomd.xml.key"
        sslcacert: ""
        sslclientkey: ""
        sslclientcert: ""
      nvidia-hpc-sdk:
        url: "https://developer.download.nvidia.com/hpc-sdk/rhel/aarch64"
        gpgkey: "https://developer.download.nvidia.com/hpc-sdk/rhel/RPM-GPG-KEY-NVIDIA-HPC-SDK"
        sslcacert: ""
        sslclientkey: ""
        sslclientcert: ""
      # ADDITIONAL REPOS (optional – for third-party packages, declare in the catalog)
      # Example format:
      #   additional_repos:
      #     grafana:
      #       url: "https://rpm.grafana.com/"
      #       gpgkey: "https://rpm.grafana.com/gpg.key"
      #       policy: "partial"
      #       caching: true
      #       sslcacert: ""
      #       sslclientkey: ""
      #       sslclientcert: ""
      additional_repos: {}
      user_repos: {}
