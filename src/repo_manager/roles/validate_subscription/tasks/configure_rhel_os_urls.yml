---

- name: Set subscription flag and project input path
  ansible.builtin.set_fact:
    subscription_status_flag: "{{ subscription_status | default(false) }}"
    project_input_path: "{{ input_project_dir }}"
    arch: "x86_64"

- name: Load local_repo_config.yml
  ansible.builtin.include_vars:
    file: "{{ local_repo_config_path }}"
    name: local_config

- name: Get catalog path from environment variable
  ansible.builtin.set_fact:
    catalog_file_path: "{{ lookup('env', 'CATALOG_FILE_PATH') }}"

- name: Load catalog JSON to extract architectures from functionallayer names
  ansible.builtin.set_fact:
    catalog_json: "{{ lookup('file', catalog_file_path) | from_json }}"
  when: catalog_file_path | length > 0

- name: Extract architectures from functionallayer names (e.g., service_kube_control_plane_rhel_10_0_x86_64)
  ansible.builtin.set_fact:
    archs: >-
      {%- set arch_list = [] -%}
      {%- if catalog_json is defined and catalog_json.catalog is defined and catalog_json.catalog.functionallayer is defined -%}
        {%- for fl in catalog_json.catalog.functionallayer -%}
          {%- set fl_name = fl.name | default('') -%}
          {%- if fl_name.endswith('_x86_64') and 'x86_64' not in arch_list -%}
            {%- set _ = arch_list.append('x86_64') -%}
          {%- elif fl_name.endswith('_aarch64') and 'aarch64' not in arch_list -%}
            {%- set _ = arch_list.append('aarch64') -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endif -%}
      {%- if arch_list | length == 0 -%}
        {%- set _ = arch_list.append('x86_64') -%}
      {%- endif -%}
      {{ arch_list }}
  when: catalog_json is defined

- name: Set default architectures if catalog not loaded
  ansible.builtin.set_fact:
    archs: "{{ ['x86_64'] }}"
  when: catalog_json is not defined

- name: Debug extracted architectures
  ansible.builtin.debug:
    msg: "Extracted architectures from catalog FunctionalLayer: {{ archs }}"

# 2️ Process repo configs for each architecture
- name: Process repo configs for each arch
  when: subscription_status_flag
  block:
    - name: Ensure rhel_repo_certs directory exists
      ansible.builtin.file:
        path: "{{ omnia_rhel_cert_dir }}"
        state: directory
        mode: "{{ dir_permissions_755 | default('0755') }}"

    - name: Copy entitlement certs from container secret mount
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ omnia_rhel_cert_dir }}/"
        mode: "{{ file_permissions_644 | default('0644') }}"
        remote_src: true
      loop: "{{ query('fileglob', '/run/secrets/etc-pki-entitlement/*.pem') | default([]) }}"
      when: "'/run/secrets/etc-pki-entitlement' is directory"

    - name: Copy Red Hat UEP cert from container secret mount
      ansible.builtin.copy:
        src: "/run/secrets/rhsm/ca/redhat-uep.pem"
        dest: "{{ omnia_rhel_cert_dir }}/redhat-uep.pem"
        mode: "{{ file_permissions_644 | default('0644') }}"
        remote_src: true
      when: "'/run/secrets/rhsm/ca/redhat-uep.pem' is file"

    - name: Set variables for repo build
      ansible.builtin.set_fact:
        subscription_status_flag: "{{ subscription_status }}"
        repo_base_urls: "{{ repo_baseurls }}"
        sslcacert: "{{ omnia_rhel_cert_dir }}/redhat-uep.pem"
        sslclientkey: "{{ lookup('pipe', 'ls {{ omnia_rhel_cert_dir }}/*-key.pem | head -n1') }}"
        sslclientcert: "{{ lookup('pipe', 'ls {{ omnia_rhel_cert_dir }}/*.pem | grep -v -- -key.pem | head -n1') }}"
        sub_rhel_x86_64_urls: []
        sub_rhel_aarch64_urls: []
        sub_policy_default: "{{ sw_config.repo_config | default('on_demand') }}"
        sub_caching_default: true
        sub_x86_64_override_config: "{{ local_config['repositories'][cluster_os_version]['x86_64'] | default({}) }}"
        sub_aarch64_override_config: "{{ local_config['repositories'][cluster_os_version]['aarch64'] | default({}) }}"

    - name: Append repo entries to x86_64 list
      ansible.builtin.set_fact:
        sub_rhel_x86_64_urls: "{{ sub_rhel_x86_64_urls + [repo_entry] }}"
      vars:
        repo_entry: >-
          {{
            {
              'url' : repo_url,
              'gpgkey' : '',
              'sslcacert' : sslcacert,
              'sslclientkey' : sslclientkey,
              'sslclientcert': sslclientcert,
              'policy': sub_policy_default,
              'caching': sub_caching_default,
              'name': (
                'appstream' if 'appstream' in repo_url else
                'baseos' if 'baseos' in repo_url else
                'codeready-builder' if 'codeready-builder' in repo_url else
                omit
              )
            }
          }}
      loop: "{{ repo_base_urls }}"
      loop_control:
        loop_var: repo_url

    - name: Build aarch64 repo entries from x86_64 list
      ansible.builtin.set_fact:
        sub_rhel_aarch64_urls: "{{ sub_rhel_aarch64_urls | default([]) + [{'url': item.url | replace('x86_64', 'aarch64'),
          'name': item.name | replace('x86_64', 'aarch64'),
          'gpgkey': item.gpgkey,
          'policy': item.policy,
          'caching': item.caching,
          'sslcacert': item.sslcacert,
          'sslclientcert': item.sslclientcert,
          'sslclientkey': item.sslclientkey}] }}"
      loop: "{{ sub_rhel_x86_64_urls }}"
      loop_control:
        loop_var: item

    # 3️ Apply override configurations and merge additional repositories
    - name: Create name mapping for x86_64 dynamic repos
      ansible.builtin.set_fact:
        x86_64_dynamic_names: "{{ sub_rhel_x86_64_urls | map(attribute='name') | list }}"

    - name: Apply x86_64 overrides to matching repos (only URL overridden, certs always from defaults)
      ansible.builtin.set_fact:
        sub_rhel_x86_64_urls: >-
          {%- set result = [] -%}
          {%- for repo in sub_rhel_x86_64_urls -%}
            {%- set override = (sub_x86_64_override_config | selectattr('name', 'equalto', repo.name) | first | default({})) -%}
            {%- if override -%}
              {%- set updated_repo = repo | combine({
                'url': override.url | default(repo.url),
                'gpgkey': override.gpgkey | default(repo.gpgkey),
                'policy': override.policy | default(repo.policy),
                'caching': override.caching | default(repo.caching)
              }) -%}
            {%- else -%}
              {%- set updated_repo = repo -%}
            {%- endif -%}
            {%- set _ = result.append(updated_repo) -%}
          {%- endfor -%}
          {{ result }}

    - name: Identify non-matching x86_64 override repos
      ansible.builtin.set_fact:
        additional_x86_64_repos: >-
          {{
            sub_x86_64_override_config
            | selectattr('name', 'defined')
            | rejectattr('name', 'in', x86_64_dynamic_names)
            | list
          }}

    - name: Add non-matching x86_64 override repos as additional (certs always from defaults)
      ansible.builtin.set_fact:
        sub_rhel_x86_64_urls: >-
          {%- set result = sub_rhel_x86_64_urls -%}
          {%- for repo in additional_x86_64_repos -%}
            {%- set new_repo = {
              'url': repo.url,
              'gpgkey': repo.gpgkey | default(''),
              'name': repo.name,
              'policy': repo.policy | default(sub_policy_default),
              'caching': repo.caching | default(sub_caching_default),
              'sslcacert': sslcacert,
              'sslclientcert': sslclientcert,
              'sslclientkey': sslclientkey
            } -%}
            {%- set _ = result.append(new_repo) -%}
          {%- endfor -%}
          {{ result }}

    - name: Apply aarch64 overrides to matching repos (only URL overridden, certs always from defaults)
      ansible.builtin.set_fact:
        sub_rhel_aarch64_urls: >-
          {%- set result = [] -%}
          {%- for repo in sub_rhel_aarch64_urls -%}
            {%- set override = (sub_aarch64_override_config | selectattr('name', 'equalto', repo.name) | first | default({})) -%}
            {%- if override -%}
              {%- set updated_repo = repo | combine({
                'url': override.url | default(repo.url),
                'gpgkey': override.gpgkey | default(repo.gpgkey),
                'policy': override.policy | default(repo.policy),
                'caching': override.caching | default(repo.caching)
              }) -%}
            {%- else -%}
              {%- set updated_repo = repo -%}
            {%- endif -%}
            {%- set _ = result.append(updated_repo) -%}
          {%- endfor -%}
          {{ result }}

    - name: Create name mapping for aarch64 dynamic repos
      ansible.builtin.set_fact:
        aarch64_dynamic_names: "{{ sub_rhel_aarch64_urls | map(attribute='name') | list }}"
      when: "'aarch64' in archs"

    - name: Identify non-matching aarch64 override repos
      ansible.builtin.set_fact:
        additional_aarch64_repos: >-
          {{
            sub_aarch64_override_config
            | selectattr('name', 'defined')
            | rejectattr('name', 'in', aarch64_dynamic_names)
            | list
          }}
      when: "'aarch64' in archs"

    - name: Add non-matching aarch64 override repos as additional (certs always from defaults)
      ansible.builtin.set_fact:
        sub_rhel_aarch64_urls: >-
          {%- set result = sub_rhel_aarch64_urls -%}
          {%- for repo in additional_aarch64_repos -%}
            {%- set new_repo = {
              'url': repo.url,
              'gpgkey': repo.gpgkey | default(''),
              'name': repo.name,
              'policy': repo.policy | default(sub_policy_default),
              'caching': repo.caching | default(sub_caching_default),
              'sslcacert': sslcacert,
              'sslclientcert': sslclientcert,
              'sslclientkey': sslclientkey
            } -%}
            {%- set _ = result.append(new_repo) -%}
          {%- endfor -%}
          {{ result }}
      when: "'aarch64' in archs"

- name: Build final repo dict
  ansible.builtin.set_fact:
    sub_final_repo_urls:
      x86_64: "{{ sub_rhel_x86_64_urls | default([]) }}"
      # Always include aarch64 URLs - they are auto-generated from x86_64 subscription URLs
      aarch64: "{{ sub_rhel_aarch64_urls | default([]) }}"

# 3 Debug final repo URLs
- name: Debug final repo urls
  ansible.builtin.debug:
    msg: "{{ sub_final_repo_urls }}"

- name: Process and validate repo configs when subscription is disabled
  when: not subscription_status_flag
  block:
    # 1️ Set facts from local_config - read RHEL OS URLs from repositories section
    - name: Set facts for cluster from repositories section
      ansible.builtin.set_fact:
        rhel_url_x86_64: []
        rhel_url_aarch64: []

    - name: Build x86_64 RHEL repo list from config
      ansible.builtin.set_fact:
        rhel_url_x86_64: "{{ rhel_url_x86_64 + [{'name': item.key, 'url': item.value.url}] }}"
      loop: "{{ local_config.repositories[cluster_os_version].x86_64 | dict2items }}"
      when:
        - item.key in ['baseos', 'appstream', 'codeready-builder']
        - item.value.url is defined
        - item.value.url | length > 0

    - name: Build aarch64 RHEL repo list from config
      ansible.builtin.set_fact:
        rhel_url_aarch64: "{{ rhel_url_aarch64 + [{'name': item.key, 'url': item.value.url}] }}"
      loop: "{{ local_config.repositories[cluster_os_version].aarch64 | dict2items }}"
      when:
        - item.key in ['baseos', 'appstream', 'codeready-builder']
        - item.value.url is defined
        - item.value.url | length > 0

    # 2 Validate required repos
    - name: Ensure required repos are present , fail if not
      ansible.builtin.fail:
        msg: >-
          Subscription is disabled and required repos are missing for {{ arch_item }}.
          Expected: {{ required_repos | join(', ') }}.
          Found: {{ present_repos | join(', ') }}
      vars:
        present_repos: "{{ lookup('vars', 'rhel_url_' ~ arch_item) | map(attribute='name') | list }}"
      when: present_repos is not superset(required_repos)
      loop: "{{ archs }}"
      loop_control:
        loop_var: arch_item

    # 3 Build sub_final_repo_urls from local_config for non-subscription scenario
    - name: Build final repo dict for non-subscription scenario
      ansible.builtin.set_fact:
        sub_final_repo_urls:
          x86_64: "{{ rhel_url_x86_64 | default([]) }}"
          aarch64: "{{ rhel_url_aarch64 | default([]) }}"

    - name: Debug final repo urls (non-subscription)
      ansible.builtin.debug:
        msg: "Non-subscription repos: {{ sub_final_repo_urls }}"
