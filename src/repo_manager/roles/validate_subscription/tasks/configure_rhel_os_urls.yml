---

- name: Set catalog-selected repository context
  ansible.builtin.set_fact:
    subscription_status_flag: "{{ subscription_status | default(false) | bool }}"
    archs: "{{ selected_architectures }}"
    referenced_repos_by_arch: "{{ catalog_context.referenced_repositories }}"

- name: Load Repo Manager repository configuration
  ansible.builtin.include_vars:
    file: "{{ local_repo_config_path }}"
    name: local_config

- name: Validate catalog version and architectures exist in repository configuration
  ansible.builtin.assert:
    that:
      - cluster_os_version in (local_config.repositories | default({}))
      - >-
        arch_item in
        (local_config.repositories.get(cluster_os_version, {}) | default({}))
    fail_msg: >-
      Catalog-selected repository configuration is missing for RHEL
      {{ cluster_os_version }} / {{ arch_item }}.
  loop: "{{ archs }}"
  loop_control:
    loop_var: arch_item

- name: Initialize flattened repository configuration
  ansible.builtin.set_fact:
    configured_repos_by_arch: {}

- name: Flatten configured repository sections for selected architectures
  ansible.builtin.set_fact:
    configured_repos_by_arch: >-
      {{ configured_repos_by_arch | combine({arch_item: flattened_repos}) }}
  vars:
    arch_repos: >-
      {{ local_config.repositories.get(cluster_os_version, {}).get(arch_item, {}) }}
    top_level_repos: >-
      {{ arch_repos | dict2items |
         rejectattr('key', 'in', ['user_repos', 'additional_repos']) |
         items2dict }}
    flattened_repos: >-
      {{ top_level_repos |
         combine(arch_repos.get('user_repos', {}) | default({})) |
         combine(arch_repos.get('additional_repos', {}) | default({})) }}
  loop: "{{ archs }}"
  loop_control:
    loop_var: arch_item

- name: Calculate repositories that require explicit URLs
  ansible.builtin.set_fact:
    invalid_explicit_repos_by_arch: >-
      {%- set result = {} -%}
      {%- for architecture in archs -%}
        {%- set invalid = [] -%}
        {%- set referenced = referenced_repos_by_arch.get(architecture, []) -%}
        {%- set subscription_allowed = required_repos_by_arch.get(architecture, [])
            if subscription_status_flag else [] -%}
        {%- set configured = configured_repos_by_arch.get(architecture, {}) -%}
        {%- for repo_name in referenced | difference(subscription_allowed) -%}
          {%- set repo_config = configured.get(repo_name, {}) -%}
          {%- if repo_config is not mapping or
                 (repo_config.get('url', '') | default('', true) | trim | length) == 0 -%}
            {%- set _ = invalid.append(repo_name) -%}
          {%- endif -%}
        {%- endfor -%}
        {%- set _ = result.update({architecture: invalid}) -%}
      {%- endfor -%}
      {{ result }}

- name: Fail when a referenced repository has no explicit URL
  ansible.builtin.fail:
    msg: >-
      Repository URLs are required for RHEL {{ cluster_os_version }} /
      {{ arch_item }}: {{ invalid_explicit_repos_by_arch[arch_item] | join(', ') }}.
      Only catalog-referenced subscription repositories may omit URLs when a
      RHEL subscription is enabled.
  when: invalid_explicit_repos_by_arch[arch_item] | length > 0
  loop: "{{ archs }}"
  loop_control:
    loop_var: arch_item

- name: Initialize subscription repository results
  ansible.builtin.set_fact:
    sub_rhel_x86_64_urls: []
    sub_rhel_aarch64_urls: []

- name: Build catalog-required repositories from subscription URLs
  when:
    - subscription_status_flag
    - required_repos | length > 0
  block:
    - name: Find copied subscription certificate files
      ansible.builtin.find:
        paths: "{{ omnia_rhel_cert_dir }}"
        patterns: "*.pem"
        file_type: file
      register: copied_subscription_certificates

    - name: Select subscription client certificate and key
      ansible.builtin.set_fact:
        subscription_client_keys: >-
          {{ copied_subscription_certificates.files |
             selectattr('path', 'search', '-key\.pem$') |
             map(attribute='path') | list }}
        subscription_client_certs: >-
          {{ copied_subscription_certificates.files |
             rejectattr('path', 'search', '-key\.pem$') |
             rejectattr('path', 'equalto', omnia_rhel_cert_dir + '/redhat-uep.pem') |
             map(attribute='path') | list }}

    - name: Validate copied subscription certificates
      ansible.builtin.assert:
        that:
          - subscription_client_keys | length > 0
          - subscription_client_certs | length > 0
          - (omnia_rhel_cert_dir + '/redhat-uep.pem') is file
        fail_msg: >-
          RHEL subscription certificates required by Repo Manager are missing
          from {{ omnia_rhel_cert_dir }}.

    - name: Build x86_64 subscription repository list
      ansible.builtin.set_fact:
        sub_rhel_x86_64_urls: "{{ sub_rhel_x86_64_urls + [subscription_repo] }}"
      vars:
        repo_name: >-
          {{ 'appstream' if 'appstream' in repo_url else
             'baseos' if 'baseos' in repo_url else
             'codeready-builder' if 'codeready-builder' in repo_url else '' }}
        configured_repo: >-
          {{ configured_repos_by_arch.get('x86_64', {}).get(repo_name) |
             default({}, true) }}
        subscription_repo:
          name: "{{ repo_name }}"
          url: "{{ repo_url }}"
          gpgkey: "{{ configured_repo.get('gpgkey', '') | default('', true) }}"
          policy: >-
            {{ configured_repo.get(
                 'policy', local_config.repo_config | default('partial')) |
               default(local_config.repo_config | default('partial'), true) }}
          caching: >-
            {{ configured_repo.get(
                 'caching', local_config.caching_policy | default(true)) | bool }}
          priority: "{{ configured_repo.get('priority') | default(none) }}"
          sslcacert: "{{ omnia_rhel_cert_dir }}/redhat-uep.pem"
          sslclientcert: "{{ subscription_client_certs | first }}"
          sslclientkey: "{{ subscription_client_keys | first }}"
      loop: "{{ repo_baseurls | default([]) }}"
      loop_control:
        loop_var: repo_url
      when:
        - "'x86_64' in archs"
        - repo_name in required_repos_by_arch.x86_64
        - >-
          (configured_repo.get('url', '') | default('', true) | trim | length) == 0

    - name: Build aarch64 subscription repository list
      ansible.builtin.set_fact:
        sub_rhel_aarch64_urls: "{{ sub_rhel_aarch64_urls + [subscription_repo] }}"
      vars:
        repo_name: >-
          {{ 'appstream' if 'appstream' in repo_url else
             'baseos' if 'baseos' in repo_url else
             'codeready-builder' if 'codeready-builder' in repo_url else '' }}
        configured_repo: >-
          {{ configured_repos_by_arch.get('aarch64', {}).get(repo_name) |
             default({}, true) }}
        subscription_repo:
          name: "{{ repo_name }}"
          url: "{{ repo_url | replace('x86_64', 'aarch64') }}"
          gpgkey: "{{ configured_repo.get('gpgkey', '') | default('', true) }}"
          policy: >-
            {{ configured_repo.get(
                 'policy', local_config.repo_config | default('partial')) |
               default(local_config.repo_config | default('partial'), true) }}
          caching: >-
            {{ configured_repo.get(
                 'caching', local_config.caching_policy | default(true)) | bool }}
          priority: "{{ configured_repo.get('priority') | default(none) }}"
          sslcacert: "{{ omnia_rhel_cert_dir }}/redhat-uep.pem"
          sslclientcert: "{{ subscription_client_certs | first }}"
          sslclientkey: "{{ subscription_client_keys | first }}"
      loop: "{{ repo_baseurls | default([]) }}"
      loop_control:
        loop_var: repo_url
      when:
        - "'aarch64' in archs"
        - repo_name in required_repos_by_arch.aarch64
        - >-
          (configured_repo.get('url', '') | default('', true) | trim | length) == 0

    - name: Calculate unresolved subscription repositories
      ansible.builtin.set_fact:
        unresolved_subscription_repos_by_arch: >-
          {%- set result = {} -%}
          {%- for architecture in archs -%}
            {%- set discovered = (sub_rhel_x86_64_urls if architecture == 'x86_64'
                else sub_rhel_aarch64_urls) | map(attribute='name') | list -%}
            {%- set configured = configured_repos_by_arch.get(architecture, {}) -%}
            {%- set available = discovered | list -%}
            {%- for repo_name in required_repos_by_arch.get(architecture, []) -%}
              {%- set repo_config = configured.get(repo_name) | default({}, true) -%}
              {%- if (repo_config.get('url', '') |
                       default('', true) | trim | length) > 0 -%}
                {%- set _ = available.append(repo_name) -%}
              {%- endif -%}
            {%- endfor -%}
            {%- set _ = result.update({architecture:
                  required_repos_by_arch.get(architecture, []) | difference(available)}) -%}
          {%- endfor -%}
          {{ result }}

    - name: Fail when subscription cannot provide a referenced repository
      ansible.builtin.fail:
        msg: >-
          RHEL subscription and explicit configuration do not provide
          {{ unresolved_subscription_repos_by_arch[arch_item] | join(', ') }}
          for RHEL {{ cluster_os_version }} / {{ arch_item }}.
      when: unresolved_subscription_repos_by_arch[arch_item] | length > 0
      loop: "{{ archs }}"
      loop_control:
        loop_var: arch_item

    - name: Verify discovered subscription repository metadata
      ansible.builtin.uri:
        url: "{{ item.url | regex_replace('/+$', '') }}/repodata/repomd.xml"
        method: GET
        status_code: 200
        return_content: false
        validate_certs: true
        ca_path: "{{ item.sslcacert }}"
        client_cert: "{{ item.sslclientcert }}"
        client_key: "{{ item.sslclientkey }}"
        timeout: 30
      loop: "{{ sub_rhel_x86_64_urls + sub_rhel_aarch64_urls }}"

- name: Publish repositories supplied by the RHEL subscription
  ansible.builtin.set_fact:
    sub_final_repo_urls:
      x86_64: "{{ sub_rhel_x86_64_urls }}"
      aarch64: "{{ sub_rhel_aarch64_urls }}"

- name: Display selected repository configuration summary
  ansible.builtin.debug:
    msg:
      os_version: "{{ cluster_os_version }}"
      architectures: "{{ archs }}"
      referenced_repositories: "{{ referenced_repos_by_arch }}"
      subscription_repositories: "{{ sub_final_repo_urls }}"
