---

- name: Check entitlement certs
  ansible.builtin.shell: |
    set -o pipefail
    find "{{ entitlement_path }}" -maxdepth 1 -name "*.pem" -type f 2>/dev/null | wc -l
  register: entitlement_certs_count
  changed_when: false
  failed_when: false

- name: Extract repo baseurls if redhat.repo exists
  ansible.builtin.shell: |
    set -o pipefail
    awk -F= '/^baseurl/ {print $2}' /etc/yum.repos.d/redhat.repo | grep -E 'codeready-builder|baseos|appstream' || true
  args:
    warn: false
  register: repo_urls
  changed_when: false
  failed_when: false

- name: Check subscription-manager registration status
  ansible.builtin.command: subscription-manager status
  register: subscription_manager_status
  changed_when: false
  failed_when: false

- name: Determine subscription status
  ansible.builtin.set_fact:
    subscription_status: >-
      {{
        (entitlement_certs_count.stdout | default('0') | trim | int > 0)
        or ((repo_urls.stdout_lines | default([])) | length > 0)
        or ('Overall Status: Registered' in (subscription_manager_status.stdout | default('')))
        or ('Overall Status: Current' in (subscription_manager_status.stdout | default('')))
      }}

- name: Debug subscription status
  ansible.builtin.debug:
    msg: "Subscription enabled? {{ subscription_status }}"

- name: Extract subscription urls
  when: subscription_status | bool
  block:
    - name: List available subscription-manager releases
      ansible.builtin.command: subscription-manager release --list
      register: available_releases
      changed_when: false
      failed_when: false

    - name: Set subscription release from cluster OS version
      ansible.builtin.command:
        cmd: >
          subscription-manager release --set="{{ hostvars['localhost']['cluster_os_version'] }}"
      changed_when: true
      when: >
        hostvars['localhost']['cluster_os_version'] in
        (available_releases.stdout | default('') | regex_findall('[0-9]+\.[0-9]+') | list)

    - name: Warn if release version not available
      ansible.builtin.debug:
        msg: "WARNING: cluster_os_version {{ hostvars['localhost']['cluster_os_version'] }} not in subscription-manager release list. Skipping release set."
      when: >
        hostvars['localhost']['cluster_os_version'] not in
        (available_releases.stdout | default('') | regex_findall('[0-9]+\.[0-9]+') | list)

    - name: Get subscription-manager release
      ansible.builtin.command: subscription-manager release --show
      register: release_info
      changed_when: false
      failed_when: false

    - name: Show subscription-manager release
      ansible.builtin.debug:
        msg: "{{ release_info.stdout }}"

    - name: Ensure shared path exists
      ansible.builtin.file:
        path: "{{ rhel_repo_cert_dir }}"
        state: directory
        mode: "{{ dir_permissions_755 | default('0755') }}"

    - name: Remove stale files from rhel_repo_cert_dir before fresh copy
      ansible.builtin.file:
        path: "{{ rhel_repo_cert_dir }}"
        state: absent

    - name: Recreate rhel_repo_cert_dir after cleanup
      ansible.builtin.file:
        path: "{{ rhel_repo_cert_dir }}"
        state: directory
        mode: "{{ dir_permissions_755 | default('0755') }}"

    - name: Find entitlement certs on oim
      ansible.builtin.shell: |
        set -o pipefail
        find "{{ entitlement_path }}" -maxdepth 1 -name "*.pem" -type f 2>/dev/null
      register: entitlement_certs_paths
      changed_when: false
      failed_when: false
      when: subscription_status | bool

    - name: Copy entitlement certs to shared path
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ rhel_repo_cert_dir }}"
        mode: "{{ file_permissions_644 | default('0644') }}"
        remote_src: true
      loop: "{{ entitlement_certs_paths.stdout_lines | default([]) }}"
      when: subscription_status | bool

    - name: Copy Red Hat UEP cert
      ansible.builtin.copy:
        src: "{{ redhat_uep_cert }}"
        dest: "{{ rhel_repo_cert_dir }}/redhat-uep.pem"
        mode: "{{ file_permissions_644 | default('0644') }}"
        remote_src: true

    - name: Copy Red Hat repo
      ansible.builtin.copy:
        src: "{{ redhat_repo_file }}"
        dest: "{{ rhel_repo_cert_dir }}/redhat.repo"
        mode: "{{ file_permissions_644 | default('0644') }}"
        remote_src: true

    - name: Set rhel_repo_certs SELinux context
      ansible.builtin.command:
        argv:
          - chcon
          - -R
          - system_u:object_r:container_file_t:s0
          - "{{ rhel_repo_cert_dir }}"
      register: rhel_certs_selinux_result
      changed_when: rhel_certs_selinux_result.rc == 0
      failed_when: false
      when:
        - ansible_selinux is defined
        - ansible_selinux.status == 'enabled'

    - name: Warn when the RHEL certificate SELinux context could not be set
      ansible.builtin.debug:
        msg: >-
          WARNING: Failed to set the SELinux context on {{ rhel_repo_cert_dir }}.
          Pulp may not be able to access the RHEL subscription certificates.
          Error: {{ rhel_certs_selinux_result.stderr | default('unknown error', true) }}
      when:
        - rhel_certs_selinux_result is defined
        - not (rhel_certs_selinux_result.skipped | default(false) | bool)
        - rhel_certs_selinux_result.rc | default(0) != 0

    - name: Extract EUS baseurls (appstream, baseos, codeready-builder)
      vars:
        eus_pattern: "rhel-{{ rhel_version }}-for-x86_64-(appstream|baseos)-eus-rpms|codeready-builder-for-rhel-{{ rhel_version }}-x86_64-eus-rpms"
      ansible.builtin.shell: |
        set -o pipefail
        awk '
          /^\[/ {section=$0}
          /^baseurl/ && section ~ /({{ eus_pattern }})/ {
            gsub(/\$releasever/, "{{ hostvars['localhost']['cluster_os_version'] }}", $3)
            print $3
          }
        ' {{ redhat_repo_file }}
      register: eus_baseurls
      changed_when: false
      failed_when: false

    - name: Extract standard baseurls for repositories without an EUS URL
      vars:
        std_pattern: "rhel-{{ rhel_version }}-for-x86_64-(appstream|baseos)-rpms|codeready-builder-for-rhel-{{ rhel_version }}-x86_64-rpms"
      ansible.builtin.shell: |
        set -o pipefail
        awk '
          /^\[/ {section=$0}
          /^baseurl/ && section ~ /({{ std_pattern }})/ {
            gsub(/\$releasever/, "{{ hostvars['localhost']['cluster_os_version'] }}", $3)
            print $3
          }
        ' {{ redhat_repo_file }}
      register: standard_baseurls
      changed_when: false

    - name: Set repo baseurls with per-repository EUS preference
      ansible.builtin.set_fact:
        repo_baseurls: >-
          {%- set selected_urls = [] -%}
          {%- set eus_urls = eus_baseurls.stdout_lines | default([]) -%}
          {%- set standard_urls = standard_baseurls.stdout_lines | default([]) -%}
          {%- for repo_name in required_repos -%}
            {%- set eus_matches = eus_urls | select('search', repo_name) | list -%}
            {%- set standard_matches = standard_urls | select('search', repo_name) | list -%}
            {%- if eus_matches | length > 0 -%}
              {%- set _ = selected_urls.append(eus_matches[0]) -%}
            {%- elif standard_matches | length > 0 -%}
              {%- set _ = selected_urls.append(standard_matches[0]) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ selected_urls | map('regex_replace', '([^/])$', '\1/') | list }}

    - name: Show extracted baseurls
      ansible.builtin.debug:
        msg: "{{ repo_baseurls }}"
