---
# =============================================================================
# PULP VALIDATION ROLE VARIABLES
# =============================================================================
# NOTE: pulp_container_name is defined in vars/default.yml to avoid duplication.
# =============================================================================

# -----------------------------------------------------------------------------
# PULP ENDPOINT CONFIGURATION
# -----------------------------------------------------------------------------
# These are set dynamically after reading pulp status
# pulp_protocol: set from pulp status command
# pulp_server_ip: set from pulp status command
# pulp_server_port: set from pulp status command
pulp_status_url: "{{ pulp_protocol }}://{{ pulp_server_ip }}:{{ pulp_server_port }}/pulp/api/v3/status/"

# Endpoint verification settings
endpoint_retries: 3
endpoint_delay: 5
endpoint_timeout: 60

# -----------------------------------------------------------------------------
# STATUS MESSAGES
# -----------------------------------------------------------------------------
pulp_status_fail_msg: "Pulp endpoint is not up. Status code: {{ result.status }}"
pulp_container_success_msg: "The {{ pulp_container_name }} container is up and running."
pulp_container_fail_msg: >-
  The Pulp Container is not found on the OIM.
  Please run playbooks/deploy/deploy_pulp.yml first, and then rerun repo_manager.yml
