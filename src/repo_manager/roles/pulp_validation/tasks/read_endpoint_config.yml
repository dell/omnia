---
# =============================================================================
# READ REPO MANAGER ENDPOINT CONFIGURATION
# =============================================================================
# This task file reads the repo_manager_endpoint_config.yml and sets
# Pulp endpoint variables for use by other playbooks.
#
# Variables Set:
#   - pulp_server_ip: Pulp server IP address (from config or SYSTEM_ADMIN_NIC_IPV4 env var)
#   - pulp_server_port: Pulp server port
#   - pulp_protocol: Always https (internal compatibility fact)
#   - admin_nic_ip: Alias for pulp_server_ip (backward compatibility)
#   - oim_admin_ip: Alias for pulp_server_ip (OIM SSH connection)
# =============================================================================

- name: Include repo_manager_endpoint_config.yml
  block:
    - name: Check if endpoint config file exists
      ansible.builtin.stat:
        path: "{{ input_project_dir }}/repo_manager_endpoint_config.yml"
      register: endpoint_config_file

    - name: Fail if endpoint config file not found
      ansible.builtin.fail:
        msg: "{{ endpoint_config_file_not_found_msg }}"
      when: not endpoint_config_file.stat.exists

    - name: Include endpoint config file
      ansible.builtin.include_vars:
        file: "{{ input_project_dir }}/repo_manager_endpoint_config.yml"
        name: endpoint_config

  rescue:
    - name: Failed to include repo_manager_endpoint_config.yml
      ansible.builtin.fail:
        msg: "{{ endpoint_config_syntax_fail_msg }}"

- name: Resolve system administration IP fallback
  ansible.builtin.set_fact:
    admin_nic_ip: >-
      {{ admin_nic_ip | default(
         lookup('env', 'SYSTEM_ADMIN_NIC_IPV4') | default('', true), true) }}

- name: Validate endpoint configuration contract
  ansible.builtin.assert:
    that:
      - endpoint_config is mapping
      - (endpoint_config.keys() | difference(['pulp_server_ip', 'pulp_server_port']) | length) == 0
      - (endpoint_config.pulp_server_ip is defined and endpoint_config.pulp_server_ip | length > 0) or (admin_nic_ip is defined and admin_nic_ip | length > 0)
      - endpoint_config.pulp_server_port is defined
      - endpoint_config.pulp_server_port is integer
      - endpoint_config.pulp_server_port | int >= 1
      - endpoint_config.pulp_server_port | int <= 65535
    fail_msg: >-
      Invalid repo_manager_endpoint_config.yml. Only pulp_server_ip (optional)
      and pulp_server_port (required integer from 1 to 65535) are supported.
      pulp_server_ip must be provided either in the file or through
      SYSTEM_ADMIN_NIC_IPV4.

- name: Set Pulp endpoint variables from config or environment
  ansible.builtin.set_fact:
    pulp_server_ip: "{{ endpoint_config.pulp_server_ip | default(admin_nic_ip) }}"
    pulp_server_port: "{{ endpoint_config.pulp_server_port | int }}"
    pulp_protocol: "https"
    cacheable: true

- name: Set derived Pulp HTTPS endpoint URLs
  ansible.builtin.set_fact:
    pulp_base_url: "https://{{ pulp_server_ip }}:{{ pulp_server_port }}"
    pulp_status_url: >-
      https://{{ pulp_server_ip }}:{{ pulp_server_port }}/pulp/api/v3/status/
    cacheable: true

- name: Validate Pulp endpoint IP belongs to this host
  ansible.builtin.assert:
    that:
      - pulp_server_ip in ansible_all_ipv4_addresses
    fail_msg: >-
      Pulp endpoint IP {{ pulp_server_ip }} is not assigned to this host.
      Set pulp_server_ip in repo_manager_endpoint_config.yml or correct
      SYSTEM_ADMIN_NIC_IPV4. Available IPv4 addresses:
      {{ ansible_all_ipv4_addresses | join(', ') }}.
  when: ansible_all_ipv4_addresses is defined

- name: Set backward compatibility variables
  ansible.builtin.set_fact:
    admin_nic_ip: "{{ pulp_server_ip }}"
    oim_admin_ip: "{{ pulp_server_ip }}"
    cacheable: true

- name: Display endpoint configuration
  ansible.builtin.debug:
    msg:
      - "Pulp Server IP: {{ pulp_server_ip }}"
      - "Pulp Server Port: {{ pulp_server_port }}"
      - "Pulp Protocol: HTTPS (required)"
    verbosity: 1
