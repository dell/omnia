---
- name: Get dependencies from local repo
  block:
    - name: Gather facts on Pulp container
      containers.podman.podman_container_info:
        name: "{{ pulp_container_name }}"
      register: container_info

    - name: Success if pulp container is running
      ansible.builtin.debug:
        msg: "{{ pulp_container_success_msg }}"
      when:
        - container_info.containers | length > 0
        - container_info.containers[0].State.Status == 'running'

    - name: Fail if pulp container is not running
      ansible.builtin.fail:
        msg: "{{ pulp_container_fail_msg }}"
      when:
        - >-
          container_info.containers | length == 0 or
          container_info.containers[0].State.Status != 'running'

- name: Run pulp status command
  ansible.builtin.command:
    argv: "{{ [pulp_cli_executable] + pulp_cli_commands.common.status }}"
  changed_when: false

- name: Check if Pulp endpoint is up
  block:
    - name: Check if Pulp endpoint is up
      ansible.builtin.uri:
        url: "{{ pulp_status_url }}"
        method: GET
        validate_certs: true
        ca_path: "{{ pulp_server_crt }}"
        return_content: true
        status_code: [200]
      register: result
      retries: "{{ validation_endpoint_retries }}"
      delay: "{{ validation_endpoint_delay }}"
      timeout: "{{ validation_endpoint_timeout }}"
      until: result.status == 200
      failed_when: false

    - name: Fail when Pulp endpoint is not up
      ansible.builtin.fail:
        msg: "{{ pulp_status_fail_msg }}"
      when: result.status | default(0) != 200
