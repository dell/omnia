---
# =============================================================================
# VALIDATE ENVIRONMENT VARIABLES
# =============================================================================
# This role validates required environment variables for repo_manager operations.
#
# Validations:
#   - SYSTEM_ADMIN_NIC_IPV4: Must be set and in valid IPv4 format
#   - CATALOG_FILE_PATH: Must be set, exist, and be a .json file
# =============================================================================

- name: Check if SYSTEM_ADMIN_NIC_IPV4 environment variable is set
  ansible.builtin.set_fact:
    system_admin_nic_ipv4: "{{ lookup('env', 'SYSTEM_ADMIN_NIC_IPV4') }}"

- name: Set IPv4 regex pattern
  ansible.builtin.set_fact:
    ipv4_regex: >-
      ^(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.
      (25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.
      (25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.
      (25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$

- name: Validate SYSTEM_ADMIN_NIC_IPV4 is set
  ansible.builtin.assert:
    that:
      - system_admin_nic_ipv4 is defined
      - system_admin_nic_ipv4 | length > 0
    fail_msg: |
      Required environment variable SYSTEM_ADMIN_NIC_IPV4 is not set.
      Please set the SYSTEM_ADMIN_NIC_IPV4 environment variable before running the playbook.
      Example: export SYSTEM_ADMIN_NIC_IPV4=192.168.1.100

- name: Validate SYSTEM_ADMIN_NIC_IPV4 is in valid IPv4 format
  ansible.builtin.assert:
    that:
      - system_admin_nic_ipv4 is match(ipv4_regex)
    fail_msg: |
      SYSTEM_ADMIN_NIC_IPV4 is not in valid IPv4 format.
      Current value: {{ system_admin_nic_ipv4 }}
      Please provide a valid IPv4 address (e.g., 192.168.1.100)

- name: Check if CATALOG_FILE_PATH environment variable is set
  ansible.builtin.set_fact:
    catalog_file_path: "{{ lookup('env', 'CATALOG_FILE_PATH') }}"

- name: Validate CATALOG_FILE_PATH is set
  ansible.builtin.assert:
    that:
      - catalog_file_path is defined
      - catalog_file_path | length > 0
    fail_msg: |
      Required environment variable CATALOG_FILE_PATH is not set.
      Please set the CATALOG_FILE_PATH environment variable before running the playbook.
      Example: export CATALOG_FILE_PATH=/path/to/catalog.json

- name: Check if CATALOG_FILE_PATH exists
  ansible.builtin.stat:
    path: "{{ catalog_file_path }}"
  register: catalog_file_check

- name: Validate CATALOG_FILE_PATH exists
  ansible.builtin.assert:
    that:
      - catalog_file_check.stat.exists
    fail_msg: |
      CATALOG_FILE_PATH does not exist: {{ catalog_file_path }}
      Please ensure the catalog file exists at the specified path.

- name: Validate CATALOG_FILE_PATH is a regular file
  ansible.builtin.assert:
    that:
      - catalog_file_check.stat.isreg
    fail_msg: |
      CATALOG_FILE_PATH is not a regular file: {{ catalog_file_path }}
      Please ensure CATALOG_FILE_PATH points to a file, not a directory.

- name: Validate CATALOG_FILE_PATH has .json extension
  ansible.builtin.assert:
    that:
      - catalog_file_path | regex_search('\\.json$')
    fail_msg: |
      CATALOG_FILE_PATH must be a .json file: {{ catalog_file_path }}
      Please ensure the catalog file has a .json extension.

- name: Display environment variable validation success
  ansible.builtin.debug:
    msg:
      - "Environment variable validation successful"
      - "SYSTEM_ADMIN_NIC_IPV4: {{ system_admin_nic_ipv4 }}"
      - "CATALOG_FILE_PATH: {{ catalog_file_path }}"
