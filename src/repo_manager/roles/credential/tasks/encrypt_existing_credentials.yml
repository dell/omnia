---
# =============================================================================
# ENCRYPT EXISTING UNENCRYPTED CREDENTIAL FILES
# =============================================================================
# This task checks if an existing credential file is unencrypted and has
# valid (non-empty) mandatory credentials. If so, it encrypts the file.
#
# This handles the use case where users manually edit the credential file
# to add their credentials before running the playbook.
# =============================================================================

- name: Check if credential file is encrypted - {{ cred_config.credential_type }}
  ansible.builtin.shell: >-
    set -o pipefail && head -n1 "{{ cred_config.file_path }}" | grep -q '$ANSIBLE_VAULT;'
  register: encryption_check
  changed_when: false
  failed_when: false

- name: Process unencrypted credential file - {{ cred_config.credential_type }}
  when: encryption_check.rc != 0
  block:
    # Check if mandatory credentials have non-empty values
    - name: Check if pulp_password has a value
      ansible.builtin.set_fact:
        has_valid_pulp_credentials: >-
          {{ (pulp_password | default('') | length > 0) and
             (pulp_username | default('') | length > 0) }}

    - name: Display credential status - {{ cred_config.credential_type }}
      ansible.builtin.debug:
        msg: >-
          Credential file is unencrypted.
          Valid credentials present: {{ has_valid_pulp_credentials }}.
          {{ 'Will encrypt the file.' if has_valid_pulp_credentials else 'Will prompt for credentials.' }}

    - name: Encrypt unencrypted file with valid credentials - {{ cred_config.credential_type }}
      when: has_valid_pulp_credentials | bool
      block:
        - name: Check if vault key exists - {{ cred_config.credential_type }}
          ansible.builtin.stat:
            path: "{{ cred_config.vault_path }}"
          register: vault_key_check

        - name: Generate vault password if missing - {{ cred_config.credential_type }}
          ansible.builtin.shell: |
            set -o pipefail
            openssl rand -base64 32 > "{{ cred_config.vault_path }}"
            chmod 600 "{{ cred_config.vault_path }}"
          args:
            creates: "{{ cred_config.vault_path }}"
          when: not vault_key_check.stat.exists

        - name: Encrypt credential file - {{ cred_config.credential_type }}
          vault_handler:
            file_path: "{{ cred_config.file_path }}"
            vault_key: "{{ cred_config.vault_path }}"
            mode: encrypt
          register: encrypt_result

        - name: Display encryption success - {{ cred_config.credential_type }}
          ansible.builtin.debug:
            msg: |
              ============================================================
              CREDENTIAL FILE ENCRYPTED
              ============================================================
              Credential file: {{ cred_config.file_path }}
              Vault key file:  {{ cred_config.vault_path }}

              The credential file has been encrypted with the existing
              credentials. No prompting required.

              IMPORTANT: Back up the vault key file in a secure location.
              ============================================================
          when: encrypt_result is succeeded

- name: Display already encrypted status - {{ cred_config.credential_type }}
  ansible.builtin.debug:
    msg: "Credential file is already encrypted: {{ cred_config.file_path }}"
  when: encryption_check.rc == 0
