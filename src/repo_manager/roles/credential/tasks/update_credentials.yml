---
# =============================================================================
# UPDATE CREDENTIAL FILES
# =============================================================================
# Safely updates credential files while preserving encryption state.
#
# Flow:
#   1. Determine credential file and vault key paths
#   2. Check if file is encrypted
#   3. If encrypted:
#      - Verify vault key exists
#      - Decrypt file
#      - Update values
#      - Re-encrypt file
#   4. If unencrypted:
#      - Update values
#      - Leave file unencrypted (preserve state)
# =============================================================================

- name: Update credential file with new values
  when: username_status or password_status
  block:
    - name: Set credential file paths
      ansible.builtin.set_fact:
        current_cred_file: "{{ field.file | default(credential_files[0].file_path) }}"
        current_vault_file: "{{ field.vault_path | default(credential_files[0].vault_path) }}"

    - name: Check if credential file exists
      ansible.builtin.stat:
        path: "{{ current_cred_file }}"
      register: cred_file_check

    - name: Skip update if credential file does not exist
      ansible.builtin.debug:
        msg: "Credential file not found: {{ current_cred_file }}. Run create action first."
      when: not cred_file_check.stat.exists

    - name: Process existing credential file
      when: cred_file_check.stat.exists
      block:
        - name: Check if credential file is encrypted
          ansible.builtin.shell: >-
            set -o pipefail && head -n1 "{{ current_cred_file }}" | grep -q '$ANSIBLE_VAULT;'
          register: is_encrypted_file
          changed_when: false
          failed_when: false

        - name: Fail if encrypted file has no vault key
          ansible.builtin.fail:
            msg: |
              Credential file is encrypted but vault key is missing.
              Credential file: {{ current_cred_file }}
              Vault key file: {{ current_vault_file }}
              Restore the vault key or delete the credential file to recreate it.
          when:
            - is_encrypted_file.rc == 0
            - current_vault_file is not file

        - name: Decrypt credential file for updates
          vault_handler:
            file_path: "{{ current_cred_file }}"
            vault_key: "{{ current_vault_file }}"
            mode: decrypt
          when:
            - is_encrypted_file.rc == 0
            - current_vault_file is file
          changed_when: false

        - name: Update vars file with entered username
          ansible.builtin.lineinfile:
            path: "{{ current_cred_file }}"
            regexp: '^{{ field.username }}:'
            line: '{{ field.username }}: "{{ username_input.user_input }}"'
          when:
            - username_status

        - name: Set default username value if not prompted
          ansible.builtin.lineinfile:
            path: "{{ current_cred_file }}"
            regexp: '^{{ field.username }}:'
            line: '{{ field.username }}: "{{ field.username_default }}"'
          when:
            - field.username_default is defined
            - not username_status

        - name: Update vars file with entered password
          ansible.builtin.lineinfile:
            path: "{{ current_cred_file }}"
            regexp: '^{{ field.password }}:'
            line: '{{ field.password }}: "{{ password_input.user_input }}"'
          when:
            - password_status

        - name: Reload updated credential variables to prevent duplicate prompts
          ansible.builtin.include_vars: "{{ current_cred_file }}"

        # Always encrypt the file after updates (whether it was encrypted before or not)
        # This ensures credentials are always protected after user provides them
        - name: Ensure vault key exists for encryption
          ansible.builtin.shell: |
            set -o pipefail
            openssl rand -base64 32 > "{{ current_vault_file }}"
            chmod 600 "{{ current_vault_file }}"
          args:
            creates: "{{ current_vault_file }}"
          when: current_vault_file is not file

        - name: Encrypt credential file after updates
          vault_handler:
            file_path: "{{ current_cred_file }}"
            vault_key: "{{ current_vault_file }}"
            mode: encrypt
          when: current_vault_file is file
          changed_when: false

  rescue:
    - name: Re-encrypt credential file if it exists and is unencrypted
      vault_handler:
        file_path: "{{ current_cred_file }}"
        vault_key: "{{ current_vault_file }}"
        mode: encrypt
      when:
        - current_cred_file is defined
        - current_vault_file is defined
      changed_when: false
      failed_when: false

    - name: Fail with cleanup message
      ansible.builtin.fail:
        msg: "{{ credential_encrypt_fail_msg }}"
