---
# =============================================================================
# CREATE SINGLE CREDENTIAL FILE FROM TEMPLATE
# =============================================================================
# Creates credential file from template, generates a vault key, and encrypts.
# =============================================================================

- name: Display creating credential file - {{ cred_config.credential_type }}
  ansible.builtin.debug:
    msg: "Creating credential file: {{ cred_config.file_path }}"

- name: Create credential file from template - {{ cred_config.credential_type }}
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ cred_config.template }}"
    dest: "{{ cred_config.file_path }}"
    mode: "{{ cred_config.file_mode | default('0600') }}"

- name: Generate vault password - {{ cred_config.credential_type }}
  ansible.builtin.shell: |
    set -o pipefail
    openssl rand -base64 32 > "{{ cred_config.vault_path }}"
    chmod 600 "{{ cred_config.vault_path }}"
  args:
    creates: "{{ cred_config.vault_path }}"

- name: Encrypt credential file - {{ cred_config.credential_type }}
  ansible.builtin.command: >-
    ansible-vault encrypt "{{ cred_config.file_path }}"
    --vault-password-file "{{ cred_config.vault_path }}"
  changed_when: true

- name: Display credential file created - {{ cred_config.credential_type }}
  ansible.builtin.debug:
    msg: "{{ credential_creation_success }}: {{ cred_config.file_path }}"

- name: Display vault key preservation warning
  ansible.builtin.debug:
    msg: |
      ============================================================
      IMPORTANT: PRESERVE THE VAULT KEY FILE
      ============================================================
      Credential file: {{ cred_config.file_path }}
      Vault key file:  {{ cred_config.vault_path }}

      The credential file has been encrypted. Without the vault key
      file, the credentials cannot be decrypted or updated.

      Back up the vault key file in a secure location.
      ============================================================
