---
# =============================================================================
# CREDENTIAL MANAGEMENT - MAIN ENTRY POINT
# =============================================================================
# This is the unified entry point for all credential operations.
#
# Usage:
#   - ansible.builtin.include_role:
#       name: roles/credential
#     vars:
#       credential_action: validate|create|update|all
#
# Actions:
#   - validate: Check credential files exist
#   - create: Create credential files from templates (if missing)
#   - update: Prompt user for credentials and update files
#   - all: Run validate, create, and update in sequence (default)
# =============================================================================

- name: Load credential messages
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/messages.yml"

- name: Set default credential action
  ansible.builtin.set_fact:
    credential_action: "{{ credential_action | default('all') }}"

- name: Display credential action
  ansible.builtin.debug:
    msg: "Running credential action: {{ credential_action }}"

# -----------------------------------------------------------------------------
# VALIDATE ACTION
# -----------------------------------------------------------------------------
- name: Validate credential files
  ansible.builtin.include_tasks: validate.yml
  when: credential_action in ['validate', 'all']

# -----------------------------------------------------------------------------
# CREATE ACTION
# -----------------------------------------------------------------------------
- name: Create credential files (if missing)
  ansible.builtin.include_tasks: create.yml
  when: credential_action in ['create', 'all']

# -----------------------------------------------------------------------------
# UPDATE ACTION
# -----------------------------------------------------------------------------
- name: Update/prompt for credentials
  ansible.builtin.include_tasks: update.yml
  when: credential_action in ['update', 'all']
