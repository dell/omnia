---
# =============================================================================
# ENCRYPT/DECRYPT CREDENTIAL FILES
# =============================================================================
# Handles decryption, variable inclusion, and re-encryption of credential files.
# Supports both encrypted and unencrypted files.
# =============================================================================

- name: Validate required parameters
  ansible.builtin.fail:
    msg: "{{ parameter_validation_error }}"
  when:
    - credential_file_path is not defined or vault_password_file is not defined

- name: Check credential file existence
  ansible.builtin.stat:
    path: "{{ credential_file_path }}"
  register: cred_file_stat

- name: Skip processing for non-existent files
  ansible.builtin.debug:
    msg: "{{ file_not_found_msg }}"
  when: not cred_file_stat.stat.exists

- name: Process credential file
  when: cred_file_stat.stat.exists
  block:
    - name: Check if file is encrypted
      ansible.builtin.shell: >-
        set -o pipefail && head -n1 "{{ credential_file_path }}" | grep -q '$ANSIBLE_VAULT;'
      register: is_encrypted
      changed_when: false
      failed_when: false

    - name: Include unencrypted file directly
      ansible.builtin.include_vars: "{{ credential_file_path }}"
      when: is_encrypted.rc != 0

    - name: Process encrypted file
      when:
        - is_encrypted.rc == 0
        - force_recreate is not defined
      block:
        - name: Check vault key existence
          ansible.builtin.stat:
            path: "{{ vault_password_file }}"
          register: vault_key_stat

        - name: Fail if vault key missing for encrypted file
          ansible.builtin.fail:
            msg: "{{ vault_key_missing_error }}"
          when: not vault_key_stat.stat.exists

        - name: Decrypt credential file to temp location
          ansible.builtin.command: >-
            ansible-vault decrypt "{{ credential_file_path }}"
            --vault-password-file "{{ vault_password_file }}"
            --output "{{ credential_file_path }}.decrypted"
          register: decrypt_result
          changed_when: false
          failed_when: false

        - name: Handle decryption failure (corrupted vault or key)
          when: decrypt_result.rc != 0
          block:
            - name: Display decryption error
              ansible.builtin.debug:
                msg: "Credential file {{ credential_file_path }} decryption failed (corrupted vault or key). Will recreate from template."

            - name: Remove corrupted credential file
              ansible.builtin.file:
                path: "{{ credential_file_path }}"
                state: absent

            - name: Remove corrupted vault key
              ansible.builtin.file:
                path: "{{ vault_password_file }}"
                state: absent

            - name: Mark file as unencrypted for recreation
              ansible.builtin.set_fact:
                force_recreate: true

        - name: Include decrypted variables from temp file
          ansible.builtin.include_vars: "{{ credential_file_path }}.decrypted"
          when:
            - decrypt_result.rc == 0
            - force_recreate is not defined

        - name: Remove temp decrypted file
          ansible.builtin.file:
            path: "{{ credential_file_path }}.decrypted"
            state: absent
          when: decrypt_result.rc == 0

        - name: Re-encrypt credential file
          vault_handler:
            file_path: "{{ credential_file_path }}"
            vault_key: "{{ vault_password_file }}"
            mode: encrypt
          changed_when: false
          when:
            - decrypt_result is succeeded
            - force_recreate is not defined
