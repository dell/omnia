# =============================================================================
# CREATE CREDENTIAL FILES
# =============================================================================
# Creates credential files from templates if they don't exist.
# Also handles including existing encrypted credential files.
#
# Flow:
#   1. If file exists: load variables and check encryption status
#   2. If file doesn't exist: create from template
#   3. Encrypt unencrypted files that have valid (non-empty) credentials
# =============================================================================

- name: Include vars for existing encrypted credentials
  ansible.builtin.include_tasks: encrypt_decrypt.yml
  loop: "{{ credential_files }}"
  loop_control:
    loop_var: cred_config
  when:
    - cred_config.file_path is file
    - cred_config.condition | default(true) | bool
  vars:
    credential_file_path: "{{ cred_config.file_path }}"
    vault_password_file: "{{ cred_config.vault_path }}"

- name: Create credential files if missing
  ansible.builtin.include_tasks: create_credential_file.yml
  loop: "{{ credential_files }}"
  loop_control:
    loop_var: cred_config
  when:
    - cred_config.file_path is not file
    - cred_config.condition | default(true) | bool
