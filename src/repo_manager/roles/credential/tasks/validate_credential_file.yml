---
# =============================================================================
# VALIDATE SINGLE CREDENTIAL FILE
# =============================================================================

- name: Initialize credential file status for {{ cred_config.credential_type }}
  ansible.builtin.set_fact:
    "{{ cred_config.credential_type | lower | replace(' ', '_') }}_cred_file_status": false

- name: Check if credential file exists - {{ cred_config.credential_type }}
  ansible.builtin.stat:
    path: "{{ cred_config.file_path }}"
  register: cred_file_stat

- name: Set status based on file existence - {{ cred_config.credential_type }}
  ansible.builtin.set_fact:
    "{{ cred_config.credential_type | lower | replace(' ', '_') }}_cred_file_status": "{{ cred_file_stat.stat.exists }}"

- name: Display credential file status - {{ cred_config.credential_type }}
  ansible.builtin.debug:
    msg: "Credential file {{ cred_config.file_path }} {{ 'exists' if cred_file_stat.stat.exists else 'does not exist' }}"
