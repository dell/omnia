# =============================================================================
# VALIDATE CREDENTIAL FILE
# =============================================================================
# Validates that a single credential file exists and is accessible.
# If the file doesn't exist, this task is skipped (create action will create it).
# =============================================================================

- name: Check if credential file exists
  ansible.builtin.stat:
    path: "{{ cred_config.file_path }}"
  register: _cred_file_check

- name: Skip validation if credential file doesn't exist (will be created)
  ansible.builtin.debug:
    msg: "Credential file not found: {{ cred_config.file_path }}. Will be created by create action."
  when: not _cred_file_check.stat.exists

- name: Validate credential file is readable
  ansible.builtin.command:
    cmd: test -r {{ cred_config.file_path }}
  register: _cred_readable_check
  changed_when: false
  when: _cred_file_check.stat.exists

- name: Fail if credential file is not readable
  ansible.builtin.fail:
    msg: >-
      Credential file is not readable: {{ cred_config.file_path }}
      Please check file permissions.
  when:
    - _cred_file_check.stat.exists
    - _cred_readable_check.rc != 0
