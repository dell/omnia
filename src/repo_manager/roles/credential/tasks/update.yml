---
# =============================================================================
# UPDATE CREDENTIALS
# =============================================================================
# Prompts user for credentials and updates credential files.
# NOTE: This is a simplified version for backward compatibility.
# New implementations should use collect_repo_credentials role.
# =============================================================================

- name: Set module utils path
  ansible.builtin.set_fact:
    module_utils_path: "{{ role_path }}/../../plugins/module_utils/"

# Ensure software_names is set (may not be set if update is called directly)
- name: Load catalog configuration to derive service names if not set
  when: software_names is not defined
  block:
    - name: Load repo_manager_config.yml for service names
      ansible.builtin.include_vars:
        file: "{{ input_project_dir }}/repo_manager_config.yml"
        name: repo_manager_config_data

    - name: Extract service names from catalog Groups
      ansible.builtin.set_fact:
        software_names: "{{ repo_manager_config_data.get('catalog_config', {}).get('services', []) | default([]) }}"
  rescue:
    - name: Set empty service names if catalog config not found
      ansible.builtin.set_fact:
        software_names: []

# Simplified credential update - just encrypt existing files
- name: Validate mandatory credentials are not empty
  ansible.builtin.fail:
    msg: "Mandatory credential pulp_password cannot be empty or set to placeholder. Please provide a valid password."
  when:
    - pulp_password is defined
    - pulp_password | length == 0 or pulp_password == 'CHANGE_THIS_PASSWORD'

- name: Encrypt credential files with valid credentials
  ansible.builtin.include_tasks: encrypt_existing_credentials.yml
  loop: "{{ credential_files }}"
  loop_control:
    loop_var: cred_config
  when:
    - cred_config.condition | default(true) | bool
    - cred_config.file_path is file
