---
# =============================================================================
# SAVE SINGLE CREDENTIAL FILE
# =============================================================================
# Saves provided credentials to the credential file and encrypts it.
# =============================================================================

- name: Set credential file paths
  ansible.builtin.set_fact:
    cred_file_path: "{{ credential_files[0].file_path }}"
    vault_key_path: "{{ credential_files[0].vault_path }}"
    template_file: "{{ credential_files[0].template }}"

- name: Display saving credential file
  ansible.builtin.debug:
    msg: "Saving credentials to: {{ cred_file_path }}"

- name: Check if credential file exists
  ansible.builtin.stat:
    path: "{{ cred_file_path }}"
  register: cred_file_check

- name: Create credential file from template if missing
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ template_file }}"
    dest: "{{ cred_file_path }}"
    mode: "{{ credential_files[0].file_mode | default('0600') }}"
  when: not cred_file_check.stat.exists

- name: Generate vault password if missing
  ansible.builtin.shell: |
    set -o pipefail
    openssl rand -base64 32 > "{{ vault_key_path }}"
    chmod 600 "{{ vault_key_path }}"
  args:
    creates: "{{ vault_key_path }}"

- name: Check if credential file is encrypted
  ansible.builtin.shell: >-
    set -o pipefail && head -n1 "{{ cred_file_path }}" | grep -q '$ANSIBLE_VAULT;'
  register: is_encrypted_file
  changed_when: false
  failed_when: false

- name: Decrypt credential file if encrypted
  vault_handler:
    file_path: "{{ cred_file_path }}"
    vault_key: "{{ vault_key_path }}"
    mode: decrypt
  when:
    - is_encrypted_file.rc == 0
    - vault_key_path is file
  changed_when: false

- name: Update pulp_password in credential file
  ansible.builtin.lineinfile:
    path: "{{ cred_file_path }}"
    regexp: '^pulp_password:'
    line: 'pulp_password: "{{ pulp_password }}"'
  when: pulp_password is defined

- name: Update pulp_username in credential file
  ansible.builtin.lineinfile:
    path: "{{ cred_file_path }}"
    regexp: '^pulp_username:'
    line: 'pulp_username: "{{ pulp_username | default("admin") }}"'
  when: pulp_username is defined

- name: Update docker_username in credential file
  ansible.builtin.lineinfile:
    path: "{{ cred_file_path }}"
    regexp: '^docker_username:'
    line: 'docker_username: "{{ docker_username | default("") }}"'
  when: docker_username is defined

- name: Update docker_password in credential file
  ansible.builtin.lineinfile:
    path: "{{ cred_file_path }}"
    regexp: '^docker_password:'
    line: 'docker_password: "{{ docker_password | default("") }}"'
  when: docker_password is defined

- name: Encrypt credential file
  vault_handler:
    file_path: "{{ cred_file_path }}"
    vault_key: "{{ vault_key_path }}"
    mode: encrypt
  when: vault_key_path is file
  changed_when: false

- name: Display credential file saved
  ansible.builtin.debug:
    msg: "Credentials saved and encrypted: {{ cred_file_path }}"
