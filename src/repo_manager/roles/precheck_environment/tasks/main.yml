---
# =============================================================================
# PRECHECK ENVIRONMENT ROLE
# =============================================================================
# This role validates the system environment before repo_manager operations.
# It calls validate_system_environment module and checks upstream contracts.
#
# This role runs BEFORE credential collection and should not require credentials.
# =============================================================================

- name: Display precheck start
  ansible.builtin.debug:
    msg:
      - "========== REPO MANAGER PRECHECK =========="
      - "Validating system environment..."
      - "=========================================="

- name: Validate system environment
  validate_system_environment:
    required_vars:
      - SYSTEM_ADMIN_NIC_IPV4
      - CATALOG_FILE_PATH
    validate_hostname: false
    validate_domain: false
    validate_ip: true
    validate_paths: true
  register: env_validation

- name: Display environment validation result
  ansible.builtin.debug:
    msg: "System environment validation: {{ 'PASSED' if env_validation is succeeded else 'FAILED' }}"

- name: Check if repo_manager has upstream dependencies
  ansible.builtin.set_fact:
    repo_manager_has_upstream: false

- name: Verify upstream contracts (if dependencies exist)
  when: repo_manager_has_upstream | bool
  block:
    - name: Check upstream contract files exist
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ omnia_data_path }}/image_build_manager/output/{{ project_name }}/build_status.yml"
      register: upstream_checks
      failed_when: false

    - name: Validate upstream contracts are accessible
      ansible.builtin.assert:
        that:
          - item.stat.exists | default(false)
        fail_msg: "{{ precheck_environment_validate_upstream_contracts_are_accessible_msg }}"
        quiet: true
      loop: "{{ upstream_checks.results }}"
      when: repo_manager_has_upstream | bool

- name: Display precheck completion
  ansible.builtin.debug:
    msg:
      - "========== PRECHECK COMPLETE =========="
      - "Status: PASSED"
      - "====================================="
