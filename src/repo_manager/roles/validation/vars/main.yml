---
# =============================================================================
# VALIDATION ROLE VARIABLES
# =============================================================================
# NOTE: max_retries, rhel_repo_certs_dir are defined in vars/default.yml
# =============================================================================

# Usage: main.yml
project_input_path: "{{ input_project_dir }}"
local_repo_config_path: "{{ project_input_path }}/repo_manager_config.yml"
user_repo_cert_dir: "{{ omnia_base_dir }}/user_repo_certs"
dnf_conf_path: "/etc/dnf/dnf.conf"
dnf_max_parallel: 10
dnf_max_mode: "0644"

rhel_repo_cert_dir: "{{ rhel_repo_certs_dir }}"
omnia_rhel_cert_dir: "{{ rhel_repo_certs_dir }}"
rhel_version: "{{ cluster_os_version.split('.')[0] }}"
redhat_uep_cert: "/etc/rhsm/ca/redhat-uep.pem"
entitlement_path: "/etc/pki/entitlement"
redhat_repo_file: "/etc/yum.repos.d/redhat.repo"
# Usage: configured registry validation
time_out: 30
user_registry_msg: "Above configured registries are not reachable. Please make sure each registry is accessible from the Omnia Infrastructure Manager."   # noqa: yaml[line-length]
unreachable_registries_fail_msg: "Unreachable registries detected: {{ registry_check_result.unreachable_registries | join(', ') }}. {{ user_registry_msg }} Please check registry connectivity and configuration before proceeding."  # noqa: yaml[line-length]

meta_dest: "{{ repo_manager_offline_repo_dir }}/.data"
metadata_file_path: "{{ meta_dest }}/localrepo_metadata.yml"
metadata_identical_msg: "Metadata is identical. No changes detected."
metadata_warn_msg: |
  WARNING: Metadata has changed since last run.
  Execution may fail if there is no internet on OIM.
