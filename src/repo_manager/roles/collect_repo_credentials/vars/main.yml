---
# Credential paths used by the atomic vault-backed credential flow.
repo_manager_credential_file:
  file_path: "{{ input_project_dir }}/repo_manager_config_credentials.yml"
  vault_path: "{{ input_project_dir }}/.repo_manager_config_credentials_key"

# Set default username (no prompting)
pulp_username: 'admin'
registry_credentials: {}
