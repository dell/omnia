---
# =============================================================================
# PROMPT CREDENTIAL FIELD
# =============================================================================
# Prompts user for a single credential field with proper validation
# For mandatory: only prompts password (username has default)
# For optional: prompts username, then password only if username is not empty
# =============================================================================

- name: Check if credential value is already set
  ansible.builtin.set_fact:
    _current_credential_value: "{{ lookup('vars', cred_field.password) | default('') | string | trim }}"
  when: cred_field.password is defined

- name: Display credential field prompt
  ansible.builtin.debug:
    msg: "Prompting for {{ cred_field.password | default(cred_field.username) }}"

# For optional credentials with username: prompt username first
- name: Prompt for username if field exists and value is empty (optional)
  ansible.builtin.pause:
    prompt: "Enter {{ cred_field.username }} (press Enter to skip)"
    echo: true
  register: username_input
  when:
    - cred_field.username is defined
    - _current_credential_value | default('') | length == 0
    - _skip_username_prompt is not defined or not _skip_username_prompt

- name: Set username from input or default
  ansible.builtin.set_fact:
    "{{ cred_field.username }}": "{{ username_input.user_input | default(cred_field.username_default | default('')) | string | trim }}"
  when:
    - cred_field.username is defined
    - _current_credential_value | default('') | length == 0
    - _skip_username_prompt is not defined or not _skip_username_prompt

- name: Prompt for password with confirmation
  when:
    - cred_field.password is defined
    - _current_credential_value | default('') | length == 0
  block:
    - name: Prompt for password
      ansible.builtin.pause:
        prompt: "Enter {{ cred_field.password }}"
        echo: false
      register: password_input
      no_log: true

    - name: Prompt for password confirmation
      ansible.builtin.pause:
        prompt: "Confirm {{ cred_field.password }}"
        echo: false
      register: password_confirm_input
      no_log: true

    - name: Verify passwords match
      ansible.builtin.assert:
        that:
          - password_input.user_input | string | trim == password_confirm_input.user_input | string | trim
        fail_msg: "Passwords do not match. Please try again."
        quiet: true

    - name: Set password from input
      ansible.builtin.set_fact:
        "{{ cred_field.password }}": "{{ password_input.user_input | string | trim }}"

  rescue:
    - name: Increment attempt counter
      ansible.builtin.set_fact:
        _password_attempts: "{{ _password_attempts | default(0) | int + 1 }}"

    - name: Check if max attempts reached
      ansible.builtin.fail:
        msg: "Maximum password retry attempts (3) reached. Please start over."
      when: _password_attempts | int >= 3

    - name: Display retry message
      ansible.builtin.debug:
        msg: "Passwords do not match. Attempt {{ _password_attempts | int + 1 }} of 3."

    - name: Re-prompt for password with confirmation
      when:
        - cred_field.password is defined
        - _current_credential_value | default('') | length == 0
        - _skip_username_prompt is not defined or not _skip_username_prompt
      ansible.builtin.include_tasks: prompt_credential_field.yml
      vars:
        _current_credential_value: ''
        _skip_username_prompt: true
        _password_attempts: "{{ _password_attempts }}"

- name: Update credential file with entered credentials (only if file is plaintext)
  ansible.builtin.lineinfile:
    path: "{{ repo_manager_credential_file.file_path }}"
    regexp: '^{{ cred_field.password }}:'
    line: "{{ cred_field.password }}: \"{{ lookup('vars', cred_field.password) | default('') | string | trim }}\""
  when:
    - _current_credential_value | default('') | length == 0
    - cred_field.password is defined
    - lookup('vars', cred_field.password) is defined
    - lookup('vars', cred_field.password) | string | trim | length > 0
    - _skip_username_prompt is not defined or not _skip_username_prompt

- name: Update credential file with username (if set)
  ansible.builtin.lineinfile:
    path: "{{ repo_manager_credential_file.file_path }}"
    regexp: '^{{ cred_field.username }}:'
    line: "{{ cred_field.username }}: \"{{ lookup('vars', cred_field.username) | default('') | string | trim }}\""
  when:
    - cred_field.username is defined
    - lookup('vars', cred_field.username) is defined
    - _skip_username_prompt is not defined or not _skip_username_prompt
    - _current_credential_value | default('') | length == 0
    - lookup('vars', cred_field.username) | string | trim | length > 0
