---
# =============================================================================
# PROMPT CREDENTIAL FIELD
# =============================================================================
# Prompts user for a single credential field with proper validation
# Only prompts if the credential value is empty or not set
# =============================================================================

- name: Check if credential value is already set
  ansible.builtin.set_fact:
    _current_credential_value: "{{ lookup('vars', cred_field.username | default(cred_field.password), default='') }}"
  when: cred_field.username is defined or cred_field.password is defined

- name: Display credential field prompt
  ansible.builtin.debug:
    msg: "Prompting for {{ cred_field.password | default(cred_field.username) }}"

- name: Prompt for username if field exists and value is empty
  ansible.builtin.pause:
    prompt: "Enter {{ cred_field.username }} (press Enter to use default: {{ cred_field.username_default | default('') }})"
    echo: true
  register: username_input
  when:
    - cred_field.username is defined
    - _current_credential_value | default('') | length == 0

- name: Set username from input or default
  ansible.builtin.set_fact:
    "{{ cred_field.username }}": "{{ username_input.user_input | default(cred_field.username_default | default('admin')) }}"
  when:
    - cred_field.username is defined
    - _current_credential_value | default('') | length == 0

- name: Prompt for password if field exists and value is empty
  ansible.builtin.pause:
    prompt: "Enter {{ cred_field.password }}"
    echo: false
  register: password_input
  no_log: true
  when:
    - cred_field.password is defined
    - _current_credential_value | default('') | length == 0

- name: Set password from input
  ansible.builtin.set_fact:
    "{{ cred_field.password }}": "{{ password_input.user_input }}"
  when:
    - cred_field.password is defined
    - _current_credential_value | default('') | length == 0
    - password_input.user_input | length > 0

- name: Update credential file with entered credentials (only if file is plaintext)
  ansible.builtin.lineinfile:
    path: "{{ repo_manager_credential_file.file_path }}"
    regexp: '^{{ cred_field.username | default(cred_field.password) }}:'
    line: "{{ cred_field.username | default(cred_field.password) }}: \"{{ lookup('vars', cred_field.username | default(cred_field.password)) }}\""
  when:
    - _current_credential_value | default('') | length == 0
    - (cred_field.username is defined and username_input.user_input | default('') | length > 0) or
      (cred_field.password is defined and password_input.user_input | default('') | length > 0)
    - _is_already_encrypted is not defined or _is_already_encrypted.rc | default(1) != 0
