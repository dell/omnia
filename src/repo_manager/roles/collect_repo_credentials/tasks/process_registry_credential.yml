---

- name: Load stored credential record for configured registry
  ansible.builtin.set_fact:
    _current_registry_credential: >-
      {%- set stored = _registry_credentials_working.get(
        registry_config.vault_path, {}) | default({}, true) -%}
      {{- stored if stored is mapping else {} -}}
  no_log: true

- name: Validate stored registry credential origin binding
  ansible.builtin.set_fact:
    _registry_credential_binding_matches: >-
      {{
        _current_registry_credential.get('registry', '') ==
          registry_config.registry_name and
        _current_registry_credential.get('origin', {}) is mapping and
        _current_registry_credential.get('origin', {}).get('scheme', '') ==
          registry_config.origin.scheme and
        _current_registry_credential.get('origin', {}).get('host', '') ==
          registry_config.origin.host and
        _current_registry_credential.get('origin', {}).get('port', 0) ==
          registry_config.origin.port
      }}
  no_log: true

- name: Initialize configured registry username and password
  ansible.builtin.set_fact:
    _registry_username_resolved: >-
      {%- set value = _current_registry_credential.get('username', '')
         if _registry_credential_binding_matches else '' -%}
      {%- set value = value |
         default('', true) -%}
      {%- set normalized = value | string | trim -%}
      {%- set empty_values = ['', 'none', 'null'] -%}
      {{- '' if normalized | lower in empty_values else normalized -}}
    _registry_password_resolved: >-
      {%- set value = _current_registry_credential.get('password', '')
         if _registry_credential_binding_matches else '' -%}
      {%- set value = value |
         default('', true) -%}
      {%- set normalized = value | string | trim -%}
      {%- set empty_values = ['', 'none', 'null'] -%}
      {{- '' if normalized | lower in empty_values else value | string -}}
  no_log: true

- name: Prompt for configured registry username
  ansible.builtin.pause:
    prompt: "Enter username for {{ registry_config.registry_name }}"
    echo: true
  register: _registry_username_input
  when: _registry_username_resolved | string | trim | length == 0
  no_log: true

- name: Use entered configured registry username
  ansible.builtin.set_fact:
    _registry_username_resolved: >-
      {{ _registry_username_input.user_input | default('', true) | string | trim }}
  when: _registry_username_resolved | string | trim | length == 0
  no_log: true

- name: Prompt for configured registry password
  when: _registry_password_resolved | string | trim | length == 0
  block:
    - name: Enter configured registry password
      ansible.builtin.pause:
        prompt: "Enter password for {{ registry_config.registry_name }}"
        echo: false
      register: _registry_password_input
      no_log: true

    - name: Confirm configured registry password
      ansible.builtin.pause:
        prompt: "Confirm password for {{ registry_config.registry_name }}"
        echo: false
      register: _registry_password_confirmation
      no_log: true

    - name: Validate configured registry password confirmation
      ansible.builtin.assert:
        that:
          - _registry_password_input.user_input | string | trim | length > 0
          - _registry_password_input.user_input == _registry_password_confirmation.user_input
        fail_msg: "{{ collect_repo_credentials_validate_configured_registry_password_confirmation_msg }}"
        quiet: true
      no_log: true

    - name: Use entered configured registry password
      ansible.builtin.set_fact:
        _registry_password_resolved: "{{ _registry_password_input.user_input }}"
      no_log: true

- name: Validate configured registry credential pair
  ansible.builtin.assert:
    that:
      - _registry_username_resolved is string
      - _registry_password_resolved is string
      - _registry_username_resolved | trim | length > 0
      - _registry_password_resolved | trim | length > 0
    fail_msg: "{{ collect_repo_credentials_validate_configured_registry_credential_pair_msg }}"
    quiet: true
  no_log: true

- name: Verify registry credentials via HTTP /v2/ API
  block:
    - name: Build registry endpoint URL
      ansible.builtin.set_fact:
        _registry_check_url: >-
          {{ registry_config.origin.scheme }}://{{ registry_config.origin.host }}:{{ registry_config.origin.port }}/v2/

    - name: Test credentials against registry API
      ansible.builtin.uri:
        url: "{{ _registry_check_url | trim }}"
        method: GET
        user: "{{ _registry_username_resolved }}"
        password: "{{ _registry_password_resolved }}"
        force_basic_auth: true
        validate_certs: "{{ not (registry_config.tls.insecure | default(false) | bool) }}"
        ca_path: "{{ registry_config.tls.ca_path | default(omit) if (registry_config.tls.ca_path | default('') | length > 0) else omit }}"
        status_code: [200, 401]
        timeout: 15
      register: _registry_auth_check
      no_log: true

    - name: Fail if registry credentials are invalid
      ansible.builtin.fail:
        msg: >-
          Authentication failed for registry '{{ registry_config.registry_name }}'
          ({{ _registry_check_url | trim }}). The provided username/password
          were rejected (HTTP {{ _registry_auth_check.status }}). Please verify
          your credentials and try again.
      when: _registry_auth_check.status == 401
  rescue:
    - name: Warn on registry connectivity failure
      ansible.builtin.debug:
        msg: >-
          WARNING: Could not verify credentials for registry
          '{{ registry_config.registry_name }}' ({{ _registry_check_url | default('unknown') | trim }}).
          The registry may be unreachable. Credentials will be saved but may
          fail during download. Error: {{ ansible_failed_result.msg | default('unknown') }}
      when: >-
        _registry_auth_check is not defined or
        _registry_auth_check.status | default(0) not in [200, 401]

    - name: Re-raise authentication failure
      ansible.builtin.fail:
        msg: >-
          Authentication failed for registry '{{ registry_config.registry_name }}'.
          The provided username/password were rejected. Please verify your
          credentials and try again.
      when: >-
        _registry_auth_check is defined and
        _registry_auth_check.status | default(0) == 401

- name: Merge configured registry credential record
  ansible.builtin.set_fact:
    _registry_credentials_working: >-
      {{ _registry_credentials_working | combine({
           registry_config.vault_path: {
             'registry': registry_config.registry_name,
             'origin': registry_config.origin,
             'username': _registry_username_resolved,
             'password': _registry_password_resolved
           }
         }, recursive=True) }}
  no_log: true
