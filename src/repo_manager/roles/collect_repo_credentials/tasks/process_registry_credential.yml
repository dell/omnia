---
# =============================================================================
# PROCESS REGISTRY CREDENTIAL
# =============================================================================
# Processes individual registry credentials with flexible authentication requirements
# Supports: mandatory passwords, optional passwords, and no authentication
# =============================================================================

- name: Skip processing if auth_type is 'none'
  ansible.builtin.debug:
    msg: "Registry {{ registry_config.registry_name }} requires no authentication - skipping credential collection"
  when: registry_config.auth_type == 'none'

- name: Process registry with authentication
  when: registry_config.auth_type != 'none'
  block:
    # Username status (always required if auth_type is not 'none')
    - name: Check if registry username is set
      ansible.builtin.set_fact:
        "{{ registry_config.username_field }}_status": >-
          {{
            (lookup('vars', registry_config.username_field, default('')) is not defined) or
            (lookup('vars', registry_config.username_field, default('')) | length == 0)
          }}

    # Password status (conditional based on password_required)
    - name: Check if registry password is set
      ansible.builtin.set_fact:
        "{{ registry_config.password_field }}_status": >-
          {{
            registry_config.password_required | default(false) and
            ((lookup('vars', registry_config.password_field, default('')) is not defined) or
             (lookup('vars', registry_config.password_field, default('')) | length == 0))
          }}
      when: registry_config.password_field | default('') | length > 0

    # Prompt for username (required for authenticated registries)
    - name: Prompt for registry username
      ansible.builtin.pause:
        prompt: "Enter username for {{ registry_config.registry_name }}"
        echo: true
      register: "{{ registry_config.username_field }}_input"
      when: lookup('vars', registry_config.username_field + '_status', default(false)) | bool
      no_log: true

    - name: Set registry username from input
      ansible.builtin.set_fact:
        "{{ registry_config.username_field }}": "{{ lookup('vars', registry_config.username_field + '_input.user_input', default('')) }}"
      when: lookup('vars', registry_config.username_field + '_status', default(false)) | bool
      no_log: true

    - name: Update credential file with registry username
      ansible.builtin.lineinfile:
        path: "{{ repo_manager_credential_file.file_path }}"
        regexp: '^{{ registry_config.username_field }}:'
        line: "{{ registry_config.username_field }}: \"{{ lookup('vars', registry_config.username_field, default('')) }}\""
      when: lookup('vars', registry_config.username_field + '_status', default(false)) | bool
      no_log: true

    # Prompt for password (mandatory)
    - name: Prompt for registry password (mandatory)
      ansible.builtin.pause:
        prompt: "Enter password for {{ registry_config.registry_name }}"
        echo: false
      register: "{{ registry_config.password_field }}_input"
      no_log: true
      when:
        - registry_config.password_required | default(false) | bool
        - lookup('vars', registry_config.password_field + '_status', default(false)) | bool

    - name: Set registry password from input (mandatory)
      ansible.builtin.set_fact:
        "{{ registry_config.password_field }}": "{{ lookup('vars', registry_config.password_field + '_input.user_input', default('')) }}"
      when:
        - registry_config.password_required | default(false) | bool
        - lookup('vars', registry_config.password_field + '_status', default(false)) | bool
      no_log: true

    - name: Update credential file with registry password (mandatory)
      ansible.builtin.lineinfile:
        path: "{{ repo_manager_credential_file.file_path }}"
        regexp: '^{{ registry_config.password_field }}:'
        line: "{{ registry_config.password_field }}: \"{{ lookup('vars', registry_config.password_field, default('')) }}\""
      when:
        - registry_config.password_required | default(false) | bool
        - lookup('vars', registry_config.password_field + '_status', default(false)) | bool
      no_log: true

    # Prompt for password (optional - can skip)
    - name: Prompt for registry password (optional)
      ansible.builtin.pause:
        prompt: "Enter password for {{ registry_config.registry_name }} (press Enter to skip)"
        echo: false
      register: "{{ registry_config.password_field }}_input"
      no_log: true
      when:
        - not (registry_config.password_required | default(false) | bool)
        - registry_config.password_field | default('') | length > 0
        - lookup('vars', registry_config.password_field + '_status', default(false)) | bool

    - name: Set registry password from input (optional)
      ansible.builtin.set_fact:
        "{{ registry_config.password_field }}": "{{ lookup('vars', registry_config.password_field + '_input.user_input', default('')) }}"
      when:
        - not (registry_config.password_required | default(false) | bool)
        - registry_config.password_field | default('') | length > 0
        - lookup('vars', registry_config.password_field + '_status', default(false)) | bool

    - name: Update credential file with registry password (optional)
      ansible.builtin.lineinfile:
        path: "{{ repo_manager_credential_file.file_path }}"
        regexp: '^{{ registry_config.password_field }}:'
        line: "{{ registry_config.password_field }}: \"{{ lookup('vars', registry_config.password_field, default('')) }}\""
      when:
        - not (registry_config.password_required | default(false) | bool)
        - registry_config.password_field | default('') | length > 0
        - lookup('vars', registry_config.password_field + '_status', default(false)) | bool

    # TLS certificate prompts (conditional)
    - name: Prompt for TLS CA path
      ansible.builtin.pause:
        prompt: "Enter CA certificate path for {{ registry_config.registry_name }} (press Enter to skip)"
        echo: true
      register: "{{ registry_config.tls_ca_path }}_input"
      when: registry_config.tls_ca_path is defined

    - name: Set TLS CA path from input
      ansible.builtin.set_fact:
        "{{ registry_config.tls_ca_path }}": "{{ lookup('vars', registry_config.tls_ca_path + '_input.user_input', default('')) }}"
      when: registry_config.tls_ca_path is defined

    - name: Update credential file with TLS CA path
      ansible.builtin.lineinfile:
        path: "{{ repo_manager_credential_file.file_path }}"
        regexp: '^{{ registry_config.tls_ca_path }}:'
        line: "{{ registry_config.tls_ca_path }}: \"{{ lookup('vars', registry_config.tls_ca_path, default('')) }}\""
      when: registry_config.tls_ca_path is defined

    - name: Prompt for TLS cert path
      ansible.builtin.pause:
        prompt: "Enter client certificate path for {{ registry_config.registry_name }} (press Enter to skip)"
        echo: true
      register: "{{ registry_config.tls_cert_path }}_input"
      when: registry_config.tls_cert_path is defined

    - name: Set TLS cert path from input
      ansible.builtin.set_fact:
        "{{ registry_config.tls_cert_path }}": "{{ lookup('vars', registry_config.tls_cert_path + '_input.user_input', default('')) }}"
      when: registry_config.tls_cert_path is defined

    - name: Update credential file with TLS cert path
      ansible.builtin.lineinfile:
        path: "{{ repo_manager_credential_file.file_path }}"
        regexp: '^{{ registry_config.tls_cert_path }}:'
        line: "{{ registry_config.tls_cert_path }}: \"{{ lookup('vars', registry_config.tls_cert_path, default('')) }}\""
      when: registry_config.tls_cert_path is defined

    - name: Prompt for TLS key path
      ansible.builtin.pause:
        prompt: "Enter client key path for {{ registry_config.registry_name }} (press Enter to skip)"
        echo: true
      register: "{{ registry_config.tls_key_path }}_input"
      when: registry_config.tls_key_path is defined

    - name: Set TLS key path from input
      ansible.builtin.set_fact:
        "{{ registry_config.tls_key_path }}": "{{ lookup('vars', registry_config.tls_key_path + '_input.user_input', default('')) }}"
      when: registry_config.tls_key_path is defined

    - name: Update credential file with TLS key path
      ansible.builtin.lineinfile:
        path: "{{ repo_manager_credential_file.file_path }}"
        regexp: '^{{ registry_config.tls_key_path }}:'
        line: "{{ registry_config.tls_key_path }}: \"{{ lookup('vars', registry_config.tls_key_path, default('')) }}\""
      when: registry_config.tls_key_path is defined

    - name: Prompt for insecure skip verify
      ansible.builtin.pause:
        prompt: "Skip TLS verification for {{ registry_config.registry_name }}? (yes/no, default: no)"
        echo: true
      register: "{{ registry_config.insecure_skip_verify }}_input"
      when: registry_config.insecure_skip_verify is defined

    - name: Set insecure skip verify from input
      ansible.builtin.set_fact:
        "{{ registry_config.insecure_skip_verify }}": "{{ lookup('vars', registry_config.insecure_skip_verify + '_input.user_input', default('false')) }}"
      when: registry_config.insecure_skip_verify is defined

    - name: Update credential file with insecure skip verify
      ansible.builtin.lineinfile:
        path: "{{ repo_manager_credential_file.file_path }}"
        regexp: '^{{ registry_config.insecure_skip_verify }}:'
        line: "{{ registry_config.insecure_skip_verify }}: \"{{ lookup('vars', registry_config.insecure_skip_verify, default('false')) }}\""
      when: registry_config.insecure_skip_verify is defined

- name: Display registry credential collection complete
  ansible.builtin.debug:
    msg: "Credential collection complete for {{ registry_config.registry_name }}"
