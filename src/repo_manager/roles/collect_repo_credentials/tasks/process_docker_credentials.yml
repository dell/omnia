---
# Resolve Docker credentials as a pair. A stored password is preserved when the
# stored username is empty so that entering a username later can reuse it.

- name: Capture stored Docker credential state
  ansible.builtin.set_fact:
    _docker_username_initial: "{{ docker_username | default('') | string | trim }}"
    _docker_password_initial: "{{ docker_password | default('') | string }}"
  no_log: true

- name: Initialize resolved Docker credential state
  ansible.builtin.set_fact:
    _docker_username_resolved: "{{ _docker_username_initial }}"
    _docker_password_resolved: "{{ _docker_password_initial }}"
  no_log: true

- name: Prompt for Docker username when it is not stored
  ansible.builtin.pause:
    prompt: "Enter docker_username (press Enter to skip)"
    echo: true
  register: _docker_username_input
  when: _docker_username_initial | length == 0

- name: Use entered Docker username
  ansible.builtin.set_fact:
    _docker_username_resolved: "{{ _docker_username_input.user_input | default('') | string | trim }}"
  when: _docker_username_initial | length == 0

- name: Prompt for Docker password when username is set and password is not stored
  when:
    - _docker_username_resolved | length > 0
    - _docker_password_initial | length == 0
  block:
    - name: Prompt for Docker password
      ansible.builtin.pause:
        prompt: "Enter docker_password"
        echo: false
      register: _docker_password_input
      no_log: true

    - name: Confirm Docker password
      ansible.builtin.pause:
        prompt: "Confirm docker_password"
        echo: false
      register: _docker_password_confirmation
      no_log: true

    - name: Validate Docker password is not empty
      ansible.builtin.assert:
        that:
          - _docker_password_input.user_input | string | length > 0
        fail_msg: "docker_password cannot be empty when docker_username is set."
        quiet: true
      no_log: true

    - name: Validate Docker passwords match
      ansible.builtin.assert:
        that:
          - _docker_password_input.user_input == _docker_password_confirmation.user_input
        fail_msg: "Docker passwords do not match. Please run again."
        quiet: true
      no_log: true

    - name: Use entered Docker password
      ansible.builtin.set_fact:
        _docker_password_resolved: "{{ _docker_password_input.user_input | string }}"
      no_log: true

- name: Validate resolved Docker credential pair
  ansible.builtin.assert:
    that:
      - _docker_username_resolved | length == 0 or _docker_password_resolved | length > 0
    fail_msg: "docker_password cannot be empty when docker_username is set."
    quiet: true
  no_log: true

- name: Expose resolved Docker credentials
  ansible.builtin.set_fact:
    docker_username: "{{ _docker_username_resolved }}"
    docker_password: "{{ _docker_password_resolved }}"
    _docker_credentials_changed: >-
      {{ _docker_username_resolved != _docker_username_initial or
         _docker_password_resolved != _docker_password_initial }}
  no_log: true

- name: Check whether existing credential file is encrypted
  ansible.builtin.command:
    argv:
      - head
      - -n
      - "1"
      - "{{ repo_manager_credential_file.file_path }}"
  register: _docker_file_head
  changed_when: false
  when: repo_manager_credential_file.file_path is file

- name: Set Docker credential file encryption state
  ansible.builtin.set_fact:
    _docker_file_was_encrypted: >-
      {{ _docker_file_head.stdout | default('') is search('ANSIBLE_VAULT') }}

- name: Persist resolved Docker credentials
  when:
    - repo_manager_credential_file.file_path is file
    - _docker_credentials_changed | bool or
      (not _docker_file_was_encrypted | bool and not _docker_defer_encryption | default(false) | bool)
  block:
    - name: Decrypt credential file for Docker credential update
      ansible.builtin.command:
        argv:
          - ansible-vault
          - decrypt
          - "{{ repo_manager_credential_file.file_path }}"
          - --vault-password-file
          - "{{ repo_manager_credential_file.vault_path }}"
      changed_when: false
      no_log: true
      when: _docker_file_was_encrypted | bool

    - name: Store resolved Docker username
      ansible.builtin.lineinfile:
        path: "{{ repo_manager_credential_file.file_path }}"
        regexp: '^docker_username:'
        line: "docker_username: {{ _docker_username_resolved | to_json }}"
      no_log: true

    - name: Store resolved Docker password
      ansible.builtin.lineinfile:
        path: "{{ repo_manager_credential_file.file_path }}"
        regexp: '^docker_password:'
        line: "docker_password: {{ _docker_password_resolved | to_json }}"
      no_log: true

  always:
    - name: Check credential file state after Docker credential update
      ansible.builtin.command:
        argv:
          - head
          - -n
          - "1"
          - "{{ repo_manager_credential_file.file_path }}"
      register: _docker_file_head_after_update
      changed_when: false
      when: repo_manager_credential_file.file_path is file

    - name: Re-encrypt credential file after Docker credential update
      ansible.builtin.command:
        argv:
          - ansible-vault
          - encrypt
          - "{{ repo_manager_credential_file.file_path }}"
          - --vault-password-file
          - "{{ repo_manager_credential_file.vault_path }}"
      changed_when: true
      no_log: true
      when:
        - not _docker_defer_encryption | default(false) | bool
        - repo_manager_credential_file.vault_path is file
        - _docker_file_head_after_update.stdout | default('') is not search('ANSIBLE_VAULT')
