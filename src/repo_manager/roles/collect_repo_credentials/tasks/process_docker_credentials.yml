---
# Resolve Docker credentials as a pair. YAML nulls, whitespace-only values and
# the legacy string produced by the former null conversion are canonicalized to
# empty strings before prompting or persistence.

- name: Capture stored Docker credential state
  ansible.builtin.set_fact:
    _docker_username_initial: >-
      {%- set value = docker_username | default('', true) -%}
      {%- set normalized = value | string | trim -%}
      {%- set empty_values = ['', 'none', 'null'] -%}
      {{- '' if normalized | lower in empty_values else normalized -}}
    _docker_password_initial: >-
      {%- set value = docker_password | default('', true) -%}
      {%- set normalized = value | string | trim -%}
      {%- set empty_values = ['', 'none', 'null'] -%}
      {{- '' if normalized | lower in empty_values else value | string -}}
  no_log: true

- name: Initialize resolved Docker credential state
  ansible.builtin.set_fact:
    _docker_username_resolved: "{{ _docker_username_initial }}"
    _docker_password_resolved: "{{ _docker_password_initial }}"
  no_log: true

- name: Determine whether Docker username input is required
  ansible.builtin.set_fact:
    _docker_username_prompt_required: >-
      {{
        _docker_username_initial | length == 0 and
        not (_docker_credentials_initialized | default(false))
      }}
  no_log: true

- name: Prompt for Docker username when it is not stored
  ansible.builtin.pause:
    prompt: "Enter docker_username (press Enter to skip)"
    echo: true
  register: _docker_username_input
  when: _docker_username_prompt_required | bool

- name: Use entered Docker username
  ansible.builtin.set_fact:
    _docker_username_resolved: >-
      {{ _docker_username_input.user_input | default('', true) | string | trim }}
  when: _docker_username_prompt_required | bool

- name: Clear orphan Docker password for anonymous access
  ansible.builtin.set_fact:
    _docker_password_resolved: ""
  when: _docker_username_resolved | length == 0
  no_log: true

- name: Prompt for Docker password when username is set and password is not stored
  when:
    - _docker_username_resolved | length > 0
    - _docker_password_initial | length == 0
  block:
    - name: Prompt for Docker password
      ansible.builtin.pause:
        prompt: "Enter docker_password"
        echo: false
      register: _docker_password_input
      no_log: true

    - name: Confirm Docker password
      ansible.builtin.pause:
        prompt: "Confirm docker_password"
        echo: false
      register: _docker_password_confirmation
      no_log: true

    - name: Validate Docker password is not empty
      ansible.builtin.assert:
        that:
          - _docker_password_input.user_input | string | trim | length > 0
        fail_msg: "docker_password cannot be empty when docker_username is set."
        quiet: true
      no_log: true

    - name: Validate Docker passwords match
      ansible.builtin.assert:
        that:
          - _docker_password_input.user_input == _docker_password_confirmation.user_input
        fail_msg: "Docker passwords do not match. Please run again."
        quiet: true
      no_log: true

    - name: Use entered Docker password
      ansible.builtin.set_fact:
        _docker_password_resolved: "{{ _docker_password_input.user_input | string }}"
      no_log: true

- name: Validate resolved Docker credential pair
  ansible.builtin.assert:
    that:
      - _docker_username_resolved is string
      - _docker_password_resolved is string
      - >-
        (_docker_username_resolved | length == 0 and
         _docker_password_resolved | length == 0) or
        (_docker_username_resolved | length > 0 and
         _docker_password_resolved | string | trim | length > 0)
    fail_msg: >-
      docker_username and docker_password must both be empty or both be set.
    quiet: true
  no_log: true

- name: Expose resolved Docker credentials
  ansible.builtin.set_fact:
    docker_username: "{{ _docker_username_resolved }}"
    docker_password: "{{ _docker_password_resolved }}"
  no_log: true
