---
# =============================================================================
# VALIDATE INPUT ROLE VARIABLES
# =============================================================================

# CSV validation configuration for build_image playbook
csv_file_path: ""

# Tag processing
# Note: When running a specific playbook without tags, ansible_run_tags defaults to ["all"].
# If two or more tags are present, remove "all" so only relevant config files are validated.
input_validate_tags: >-
  {{ omnia_run_tags | default([]) | difference(['all'])
     if (omnia_run_tags | length) >= 2
     else omnia_run_tags | default([]) }}

# =============================================================================
# VALIDATION MESSAGES
# =============================================================================

validation_success_msg: >-
  Successfully validated repo_manager input config file(s).

validation_error_msg: >-
  Input validation failed. Please check the validation output above
  for detailed error information.
