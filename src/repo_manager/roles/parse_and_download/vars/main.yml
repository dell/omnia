---

base_path: "{{ repo_manager_log_dir }}"
clean_rpms: true
rpm_dir_path: >-
  {{ pulp_distribution_root_dir ~ '/' ~ item ~ '/' ~ cluster_os_type ~ '/' ~
     cluster_os_version ~ '/rpm' }}
repository_download_completion_message: |
  The playbook repo_manager.yml has completed successfully.
# Resync repos control
# - null/omit: Skip already synced repos (default)
# - "all": Force resync all repos
# - ["repo1", "repo2"]: Only sync specified repos
# resync_repos: null
local_repo_py_module_vars:
  default_vars:
    timeout: 7200  # Timeout in seconds for each thread

sw_download_msg: "The specified software packages have already been downloaded."
# Repository metadata state
meta_dest: "{{ repo_manager_offline_repo_dir }}/.data"
metadata_file_path: "{{ meta_dest }}/localrepo_metadata.yml"
folder_mode: "0755"

# =============================================================================
# FAILURE AND ASSERTION MESSAGES
# =============================================================================
parse_and_download_fail_the_playbook_execution_msg: "Task execution failed: {{ ansible_failed_result.msg | default('Unknown error') }}"

parse_and_download_validate_active_package_backend_msg: >-
  Package backend
  {{ catalog_context.platform_capabilities.package_backend | default('unknown') }}
  is not implemented by process_rpm_config.
