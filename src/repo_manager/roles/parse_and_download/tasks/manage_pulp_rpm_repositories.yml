---

- name: Validate active package backend
  ansible.builtin.assert:
    that:
      - >-
        catalog_context.platform_capabilities.package_backend == 'pulp_rpm'
    fail_msg: >-
      Package backend
      {{ catalog_context.platform_capabilities.package_backend | default('unknown') }}
      is not implemented by process_rpm_config.

- name: Prepare software packages tasklist
  prepare_tasklist:
    local_repo_config_path: "{{ repo_manager_config_file }}"
    log_dir: "{{ base_path }}/{{ cluster_os_type }}/{{ cluster_os_version }}"
    sub_urls: "{{ sub_final_repo_urls | default({}) }}"
    cluster_os_type: "{{ cluster_os_type }}"
    cluster_os_version: "{{ cluster_os_version }}"
    architectures: "{{ selected_architectures }}"
  environment:
    REPO_MANAGER_BASE_DIR: "{{ repo_manager_base_dir }}"
    REPO_MANAGER_INPUT_PROJECT_DIR: "{{ input_project_dir }}"
    OMNIA_BASE_DIR: "{{ omnia_base_dir }}"
    OMNIA_DATA_PATH: "{{ omnia_data_path }}"
    REPO_MANAGER_DATA_PATH: "{{ repo_manager_runtime_dir }}"
    CATALOG_FILE_PATH: "{{ lookup('env', 'CATALOG_FILE_PATH') }}"
  register: result

- name: Process URL mirrors from repo_manager_config
  process_rpm_config:
    local_config: "{{ result.local_config }}"
    log_dir: "{{ base_path }}/{{ cluster_os_type }}/{{ cluster_os_version }}"
    additional_repos_config: "{{ result.additional_repos_config | default(omit) }}"
    user_repos_config: "{{ result.user_repos_config | default(omit) }}"
    thread_pool_size: "{{ rpm_repo_config.thread_pool_size | int }}"
    sw_archs: "{{ selected_architectures }}"
    resync_repos: "{{ active_resync_repositories | default(resync_repos | default(None)) }}"
    cluster_os_type: "{{ cluster_os_type }}"
    cluster_os_version: "{{ cluster_os_version }}"
  environment:
    REPO_MANAGER_BASE_DIR: "{{ repo_manager_base_dir }}"
    REPO_MANAGER_INPUT_PROJECT_DIR: "{{ input_project_dir }}"
    OMNIA_BASE_DIR: "{{ omnia_base_dir }}"
    OMNIA_DATA_PATH: "{{ omnia_data_path }}"
    REPO_MANAGER_DATA_PATH: "{{ repo_manager_runtime_dir }}"
  register: rpm_result

- name: Display RPM processing result
  ansible.builtin.debug:
    msg: "{{ rpm_result.result }}"

- name: Reset Repo Manager DNF metadata cache
  ansible.builtin.file:
    path: >-
      {{ repo_store_path }}/.data/package_manager_cache/dnf/{{ cluster_os_type }}/{{ cluster_os_version }}
    state: absent
  # DNF commands recreate this private cache with fresh, architecture-specific
  # Pulp metadata. Do not clean the host's shared /var/cache/dnf.
