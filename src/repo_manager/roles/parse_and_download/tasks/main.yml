---

- name: Define project input path
  ansible.builtin.set_fact:
    project_input_path: "{{ input_project_dir }}"
    update_metadata: false
    show_softwares_status: false

- name: Include oim metadata vars
  ansible.builtin.include_vars:
    file: "{{ omnia_metadata_file }}"
    name: oim_shared_path_from_metadata
  when: repo_manager_metadata_support | default(false) | bool

- name: Migrate Pulp repo names from old to new naming convention
  ansible.builtin.include_tasks: migrate_pulp_repository_names.yml
  when: not (pulp_repo_name_migration_completed | default(false) | bool)

- name: Mark Pulp repository name migration complete for this run
  ansible.builtin.set_fact:
    pulp_repo_name_migration_completed: true
  when: not (pulp_repo_name_migration_completed | default(false) | bool)

- name: Process and configure local_repo_config
  ansible.builtin.include_tasks: manage_pulp_rpm_repositories.yml

- name: Encrypt user certificates if exist
  cert_vault_handler:
    mode: encrypt
    log_dir: "{{ base_path }}/{{ cluster_os_type }}/{{ cluster_os_version }}"
    key_path: "{{ project_input_path }}"
    cluster_os_version: "{{ cluster_os_version }}"
    architectures: "{{ selected_architectures }}"
  environment:
    REPO_MANAGER_BASE_DIR: "{{ repo_manager_base_dir }}"
    REPO_MANAGER_INPUT_PROJECT_DIR: "{{ input_project_dir }}"
    OMNIA_BASE_DIR: "{{ omnia_base_dir }}"
    OMNIA_DATA_PATH: "{{ omnia_data_path }}"
    REPO_MANAGER_DATA_PATH: "{{ repo_manager_runtime_dir }}"
  register: vault_result

- name: Execute tasks for each architecture
  ansible.builtin.include_tasks: process_architecture_components.yml
  loop: >-
    {{ result.software_dict | dict2items |
       selectattr('key', 'in', selected_architectures) | list }}
  loop_control:
    loop_var: arch_item
  vars:
    components: "{{ arch_item.value | dict2items }}"
  when: result.software_dict | length > 0

- name: Set architectures from catalog-based task result
  ansible.builtin.set_fact:
    all_archs: "{{ selected_architectures }}"

- name: Set fact for all_archs_var
  ansible.builtin.set_fact:
    all_archs_var: "{{ hostvars['localhost']['all_archs'] }}"

- name: Clear the rpm downloaded files for each arch
  ansible.builtin.file:
    path: "{{ rpm_dir_path }}"
    state: absent
  loop: "{{ all_archs_var }}"
  when: clean_rpms

- name: Create output directory
  ansible.builtin.file:
    path: "{{ output_dir }}"
    state: directory
    mode: "{{ folder_mode }}"

- name: Determine final repository status
  ansible.builtin.set_fact:
    final_status: >-
      {{
        'failed' if
        (
          overall_status_dict | default({}) | dict2items |
          map(attribute='value') |
          sum(start=[]) |
          map(attribute='overall_status') |
          select('in', ['FAILURE', 'TIMEOUT', 'PARTIAL']) |
          list |
          length > 0
        )
        else 'success'
      }}

- name: Load repo_manager endpoint configuration
  ansible.builtin.include_vars:
    file: "{{ repo_manager_endpoint_config }}"
    name: endpoint_config

- name: Create repo_status.yml file
  generate_local_repo_access:
    pulp_server_ip: "{{ pulp_server_ip | default(endpoint_config.pulp_server_ip) }}"
    pulp_server_port: "{{ pulp_server_port | default(endpoint_config.pulp_server_port) | int }}"
    cluster_os_type: "{{ cluster_os_type }}"
    cluster_os_version: "{{ cluster_os_version }}"
    architectures: "{{ selected_architectures }}"
    output_path: "{{ local_repo_access_dest_path }}"
    local_repo_config_path: "{{ repo_manager_config_file }}"
    overall_status: "{{ final_status }}"
    execution_contexts: "{{ catalog_execution_contexts | default([]) }}"
  environment:
    REPO_MANAGER_BASE_DIR: "{{ repo_manager_base_dir }}"
    REPO_MANAGER_INPUT_PROJECT_DIR: "{{ input_project_dir }}"
    OMNIA_BASE_DIR: "{{ omnia_base_dir }}"
    OMNIA_DATA_PATH: "{{ omnia_data_path }}"
    REPO_MANAGER_DATA_PATH: "{{ repo_manager_runtime_dir }}"

- name: Check if metadata file exists
  ansible.builtin.stat:
    path: "{{ metadata_file_path }}"
  register: metadata_file

- name: Set update metadata flag
  ansible.builtin.set_fact:
    update_metadata: "{{ true | bool }}"
  when:
    - metadata_file.stat.exists
    - final_status == 'success'

- name: Persist local repository information into metadata file localrepo_metadata.yml
  localrepo_metadata_manager:
    localrepo_config_path: "{{ repo_manager_config_file }}"
    output_file: "{{ metadata_file_path }}"
    update_metadata: "{{ update_metadata }}"
    sub_urls: "{{ sub_final_repo_urls | default({}) }}"
    cluster_os_version: "{{ cluster_os_version }}"
    architectures: "{{ selected_architectures }}"
  environment:
    REPO_MANAGER_BASE_DIR: "{{ repo_manager_base_dir }}"
    REPO_MANAGER_INPUT_PROJECT_DIR: "{{ input_project_dir }}"
    OMNIA_BASE_DIR: "{{ omnia_base_dir }}"
    OMNIA_DATA_PATH: "{{ omnia_data_path }}"
    REPO_MANAGER_DATA_PATH: "{{ repo_manager_runtime_dir }}"
  register: policy_result
  when:
    - final_status == 'success'

- name: Show updated keys
  ansible.builtin.debug:
    var: policy_result.diff
  when: update_metadata

- name: Run custom parallel task to print overall software status
  parallel_tasks:
    tasks: []
    software: []
    local_repo_config_path: "{{ repo_manager_config_file }}"
    slog_file: >-
      {{
        base_path ~ '/' ~ cluster_os_type ~ '/' ~ cluster_os_version
      }}
    overall_status_dict: "{{ overall_status_dict }}"
    show_softwares_status: "{{ true | bool }}"
  register: status_results
  when: overall_status_dict is defined and overall_status_dict | length > 0

- name: Print overall software status
  ansible.builtin.debug:
    msg: "{{ status_results.msg.split('\n') if status_results.msg is defined else sw_download_msg }}"

- name: Display total playbook execution time in minutes and seconds
  ansible.builtin.debug:
    msg: >
      Total playbook execution time: {{
        ((lookup('pipe', 'date +%s') | int - playbook_start_time | int) // 60)
      }} min and {{
        ((lookup('pipe', 'date +%s') | int - playbook_start_time | int) % 60)
      }} sec

- name: Local repository status
  ansible.builtin.debug:
    msg: >-
      {{ 'localrepository SUCCESS' if final_status == 'success' else
         'Local repo setup failed — some packages did not download, and dependent scripts/playbooks may also fail. '
         'Refer to the localrepo logs for more details. Rerun repo_manager.yml.' }}
  failed_when: final_status != 'success'
