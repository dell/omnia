---
- name: Load Repo Manager configuration through the literal-YAML boundary
  block:
    - name: Parse and validate Repo Manager configuration
      load_validated_yaml:
        path: "{{ repo_manager_config_file }}"
      register: _repo_manager_config_load
      no_log: true

    - name: Publish validated Repo Manager configuration
      ansible.builtin.set_fact:
        repo_manager_config_data: "{{ _repo_manager_config_load.data }}"
      no_log: true

  rescue:
    - name: Reject unsafe or invalid Repo Manager configuration
      ansible.builtin.fail:
        msg: >-
          {{ repo_manager_setup_invalid_repo_manager_config_msg }}
          Error code:
          {{ _repo_manager_config_load.error_code |
             default('validation_failed') }}.
          Location:
          {{ _repo_manager_config_load.error_location | default('$') }}.
