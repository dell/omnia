# =============================================================================
# REPO MANAGER SETUP ROLE - MAIN ENTRY POINT
# =============================================================================
# This role handles initial setup tasks for repo_manager:
# - Create log directories
# - Display usage information
# - Set guard fact
# =============================================================================

- name: Create directories
  ansible.builtin.include_tasks: create_directories.yml

- name: Display usage information
  ansible.builtin.include_tasks: display_usage.yml

- name: Set setup guard fact
  ansible.builtin.set_fact:
    repo_manager_setup_done: true
    cacheable: true
