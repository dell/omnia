---
- name: Require CATALOG_FILE_PATH for catalog-consuming operations
  ansible.builtin.assert:
    that:
      - catalog_file | default('') | length > 0
    fail_msg: >-
      {{ repo_manager_setup_fail_if_catalog_file_path_env_var_is_not_set_msg }}
    quiet: true

- name: Validate the configured catalog path
  ansible.builtin.assert:
    that:
      - catalog_file is match('^/')
      - catalog_file is match('^/.*\\.json$')
    fail_msg: "{{ repo_manager_setup_validate_catalog_file_path_msg }}"
    quiet: true

- name: Inspect the configured catalog file
  ansible.builtin.stat:
    path: "{{ catalog_file }}"
    follow: true
  register: repo_manager_setup_catalog_check

- name: Require a regular catalog file
  ansible.builtin.assert:
    that:
      - repo_manager_setup_catalog_check.stat.exists
      - repo_manager_setup_catalog_check.stat.isreg
    fail_msg: >-
      {{ repo_manager_setup_validate_catalog_file_is_a_regular_file_msg }}
    quiet: true
