---
# =============================================================================
# LOAD CONFIGURATION FROM ENVIRONMENT VARIABLES
# =============================================================================
# This task file loads configuration from environment variables following
# the image_build_manager pattern for consistency across Omnia domains.
#
# Environment Variables Required:
#   - SYSTEM_ADMIN_NIC_IPV4: Admin NIC IP address
#   - CATALOG_FILE_PATH: Path to catalog JSON file
#   - OMNIA_DATA_PATH: Base data directory (default: /opt/omnia, uses env var)
# =============================================================================

# --- Resolve domain root directory (works from any playbook location) ---
- name: Set domain root directory
  ansible.builtin.set_fact:
    _domain_root_dir: "{{ playbook_dir | regex_replace('/playbooks.*$', '') }}"
    cacheable: true

# --- Resolve configuration from environment variables ---
- name: Resolve configuration from environment
  ansible.builtin.set_fact:
    omnia_data_path: >-
      {{ (lookup('ansible.builtin.env', 'OMNIA_DATA_PATH')
          | default(lookup('ansible.builtin.env', 'OMNIA_BASE_DIR'), true)
          | default('/opt/omnia', true))
         | ansible.builtin.normpath }}
    repo_manager_runtime_dir: >-
      {{ (lookup('ansible.builtin.env', 'REPO_MANAGER_DATA_PATH')
          | default(omnia_data_path + '/repo_manager', true))
         | ansible.builtin.normpath }}
    admin_nic_ip: >-
      {{ lookup('ansible.builtin.env', 'SYSTEM_ADMIN_NIC_IPV4')
         | default('', true) }}
    catalog_file: >-
      {{ lookup('ansible.builtin.env', 'CATALOG_FILE_PATH')
         | default('', true) }}
    project_name: >-
      {{ lookup('ansible.builtin.env', 'OMNIA_PROJECT_NAME')
         | default('project_default', true) }}
    cacheable: true

# --- Validate required variables via module (single source of truth) ---
- name: Validate system environment
  validate_system_environment:
    required_vars:
      - SYSTEM_ADMIN_NIC_IPV4
      - CATALOG_FILE_PATH
    validate_hostname: false
    validate_domain: false
    validate_ip: true
    validate_paths: true
  register: _env_validation

# --- Validate configured environment ---
- name: Display environment configuration
  ansible.builtin.debug:
    msg:
      - "SYSTEM_ADMIN_NIC_IPV4: {{ admin_nic_ip }}"
      - "CATALOG_FILE_PATH: {{ catalog_file }}"
      - "OMNIA_DATA_PATH: {{ omnia_data_path }}"
      - "REPO_MANAGER_DATA_PATH: {{ repo_manager_runtime_dir }}"
      - "OMNIA_PROJECT_NAME: {{ project_name }}"
    verbosity: 1

- name: Validate resolved Repo Manager paths
  ansible.builtin.assert:
    that:
      - omnia_data_path is match('^/')
      - repo_manager_runtime_dir is match('^/')
      - (repo_manager_runtime_dir | regex_replace('/+$', '')) not in ['', '/opt', '/var', '/etc', '/usr', '/root']
      - project_name is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
      - pulp_content_paths is mapping
      - pulp_content_paths.content_route is string
      - pulp_content_paths.content_route == '/pulp/content'
      - pulp_content_paths.distribution_root is string
      - pulp_content_paths.distribution_root is match('^[^/]+(?:/[^/]+)*$')
      - "'.' not in pulp_content_paths.distribution_root.split('/')"
      - "'..' not in pulp_content_paths.distribution_root.split('/')"
    fail_msg: "{{ repo_manager_setup_validate_resolved_repo_manager_paths_msg }}"
    quiet: true
# --- Set all derived paths in a single set_fact ---
- name: Set project dirs and derived paths
  ansible.builtin.set_fact:
    input_project_dir: >-
      {{ (lookup('ansible.builtin.env', 'REPO_MANAGER_INPUT_PROJECT_DIR')
          | default(repo_manager_runtime_dir + '/input/' + project_name, true))
         | ansible.builtin.normpath }}
    output_project_dir: "{{ repo_manager_runtime_dir }}/output/{{ project_name }}"
    log_dir: "{{ repo_manager_runtime_dir }}/log"
    shared_path: "{{ repo_manager_runtime_dir }}"
    cacheable: true

- name: Validate resolved project input path
  ansible.builtin.assert:
    that:
      - input_project_dir is match('^/')
      - (input_project_dir | regex_replace('/+$', '')) not in ['', '/opt', '/var', '/etc', '/usr', '/root']
    fail_msg: "{{ repo_manager_setup_validate_resolved_project_input_path_msg }}"
    quiet: true
# --- Verify project input directory exists ---
- name: Verify project input directory exists
  ansible.builtin.stat:
    path: "{{ input_project_dir }}"
  register: _project_dir_check

# --- Create runtime directories ---
- name: Ensure base OMNIA_DATA_PATH directory exists
  ansible.builtin.file:
    path: "{{ omnia_data_path }}"
    state: directory
    mode: '0755'
  become: true

- name: Ensure domain-specific directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ shared_path }}"
      mode: "0755"
    - path: "{{ output_project_dir }}"
      mode: "0755"
    - path: "{{ log_dir }}"
      mode: "0700"
  loop_control:
    label: "{{ item.path }}"
  become: true

# --- Validate domain directories were created ---
- name: Validate domain directories were created
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ omnia_data_path }}"
    - "{{ shared_path }}"
    - "{{ output_project_dir }}"
    - "{{ log_dir }}"
  register: _dir_checks

- name: Fail if any required directory is missing
  ansible.builtin.fail:
    msg: "{{ repo_manager_setup_fail_if_any_required_directory_is_missing_msg }}"
  when: not item.stat.exists
  loop: "{{ _dir_checks.results }}"

# --- Set configuration loaded guard ---
- name: Set configuration loaded guard
  ansible.builtin.set_fact:
    repo_manager_config_loaded: true
    cacheable: true
