---

- name: Resolve catalog operating-system context
  resolve_catalog_context:
    catalog_path: "{{ catalog_file }}"
  environment:
    REPO_MANAGER_BASE_DIR: "{{ repo_manager_base_dir }}"
    REPO_MANAGER_CONFIG_PATH: "{{ repo_manager_base_dir }}/vars/default.yml"
  register: resolved_catalog_context_result

- name: Publish resolved catalog context
  ansible.builtin.set_fact:
    catalog_context: "{{ resolved_catalog_context_result.catalog_context }}"
    cluster_os_type: "{{ resolved_catalog_context_result.catalog_context.os_type }}"
    cluster_os_version: "{{ resolved_catalog_context_result.catalog_context.os_version }}"
    selected_architectures: >-
      {{ resolved_catalog_context_result.catalog_context.architectures }}
    cacheable: true
