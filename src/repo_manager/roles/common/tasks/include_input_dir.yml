---
# =============================================================================
# INCLUDE INPUT DIRECTORY
# =============================================================================
# Sets up the input project directory path and validates it exists.
# =============================================================================

- name: Set input project directory
  ansible.builtin.set_fact:
    input_project_dir: >-
      {{ lookup('env', 'REPO_MANAGER_INPUT_PROJECT_DIR')
      | default(omnia_base_dir + '/input/'
      + (project_name | default('project_default'))
      + '/repo_manager', true) }}
    project_dir_status: true

- name: Validate input project directory exists
  ansible.builtin.stat:
    path: "{{ input_project_dir }}"
  register: project_dir_check

- name: Fail if project directory does not exist
  ansible.builtin.fail:
    msg: "{{ project_dir_not_exist_fail_msg }}"
  when: not project_dir_check.stat.exists

- name: Display input project directory
  ansible.builtin.debug:
    msg: "Using input project directory: {{ input_project_dir }}"
