---
# =============================================================================
# CREATE CONTAINER GROUP FOR OIM HOST
# =============================================================================
# This role creates a dynamic inventory group for the OIM host using
# the IP address from repo_manager_endpoint_config.yml
# =============================================================================

- name: Load endpoint config to determine OIM admin IP
  ansible.builtin.include_vars:
    file: "{{ input_project_dir }}/repo_manager_endpoint_config.yml"
    name: endpoint_config
  when:
    - oim_group | default(false) | bool

- name: Set OIM admin IP from endpoint config
  ansible.builtin.set_fact:
    oim_admin_ip: "{{ endpoint_config.pulp_server_ip }}"
  when:
    - oim_group | default(false) | bool

- name: Set Pulp endpoint variables from config
  ansible.builtin.set_fact:
    admin_nic_ip: "{{ endpoint_config.pulp_server_ip }}"
    pulp_server_ip: "{{ endpoint_config.pulp_server_ip }}"
    pulp_server_port: "{{ endpoint_config.pulp_server_port }}"
    pulp_protocol: "{{ endpoint_config.pulp_protocol }}"
    pulp_https_enabled: "{{ endpoint_config.pulp_https_enabled | default(true) }}"
    ssl_certificates: "{{ endpoint_config.ssl_certificates | default({}) }}"
    cacheable: true
  when:
    - oim_group | default(false) | bool

- name: Create {{ oim_host_group }} group  # noqa: name[template]
  ansible.builtin.add_host:
    hostname: "{{ oim_host_group }}"
    ansible_host: "{{ oim_admin_ip | default('localhost') }}"
    ansible_port: "{{ oim_host_port }}"
    ansible_user: root
    ansible_ssh_private_key_file: "{{ omnia_base_dir }}/.ssh/oim_rsa"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
    groups: "{{ oim_host_group }}"
    # Pass Pulp endpoint variables to OIM host
    pulp_server_ip: "{{ pulp_server_ip }}"
    pulp_server_port: "{{ pulp_server_port }}"
    pulp_protocol: "{{ pulp_protocol }}"
    pulp_https_enabled: "{{ pulp_https_enabled }}"
  when:
    - oim_group | default(false) | bool
