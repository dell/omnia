---
# =============================================================================
# COMMON ROLE - MAIN ENTRY POINT
# =============================================================================
# This role handles common setup tasks for repo_manager playbooks.
# All tasks run on localhost (OIM).
# =============================================================================

- name: Include metadata vars
  ansible.builtin.include_vars:
    file: "{{ omnia_metadata_file }}"
    name: oim_shared_path_from_metadata
  failed_when: false
  tags: always

- name: Check oim_metadata for Jinja template injection patterns
  ansible.builtin.set_fact:
    _oim_metadata_has_jinja: >-
      {{ oim_shared_path_from_metadata | dict2items
         | selectattr('value', 'search', '\{\{|\{%|\{#')
         | list | length > 0 }}
  when:
    - oim_shared_path_from_metadata is defined
    - oim_shared_path_from_metadata is mapping
  tags: always

- name: Validate oim_metadata contains no Jinja template syntax
  ansible.builtin.assert:
    that:
      - not (_oim_metadata_has_jinja | default(false) | bool)
    fail_msg: "{{ oim_metadata_invalid_format_msg }}"
    quiet: true
  when:
    - oim_shared_path_from_metadata is defined
    - oim_shared_path_from_metadata is mapping
  tags: always

- name: Initialize SELinux policy
  ansible.builtin.set_fact:
    selinux_option: >-
      {{ ':z'
         if (ansible_selinux.status | default('disabled')) == 'enabled'
         else '' }}
  tags: always

- name: Set SELinux policy for external NFS
  ansible.builtin.set_fact:
    selinux_option: ""
  when:
    - omnia_share_option == 'NFS'
    - nfs_type == 'external'
  tags: always

- name: Export firewall ports for containers
  ansible.builtin.include_tasks: firewall_settings.yml

- name: Normalize Docker credentials before Podman login
  ansible.builtin.set_fact:
    _podman_docker_username: >-
      {%- set value = docker_username | default('', true) -%}
      {%- set normalized = value | string | trim -%}
      {%- set empty_values = ['', 'none', 'null'] -%}
      {{- '' if normalized | lower in empty_values else normalized -}}
    _podman_docker_password: >-
      {%- set value = docker_password | default('', true) -%}
      {%- set normalized = value | string | trim -%}
      {%- set empty_values = ['', 'none', 'null'] -%}
      {{- '' if normalized | lower in empty_values else value | string -}}
  no_log: true

- name: Validate Docker credentials before Podman login
  ansible.builtin.assert:
    that:
      - >-
        (_podman_docker_username | length == 0 and
         _podman_docker_password | length == 0) or
        (_podman_docker_username | length > 0 and
         _podman_docker_password | string | trim | length > 0)
    fail_msg: "{{ common_validate_docker_credentials_before_podman_login_msg }}"
    quiet: true
  no_log: true

- name: Run Podman login command
  ansible.builtin.include_tasks: podman_login.yml
  when:
    - _podman_docker_username | length > 0
    - _podman_docker_password | length > 0
  tags: always
