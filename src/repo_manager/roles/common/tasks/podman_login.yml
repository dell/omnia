---
- name: Podman login
  ansible.builtin.command:
    argv:
      - podman
      - login
      - docker.io
      - --username
      - "{{ _podman_docker_username }}"
      - --password-stdin
    stdin: "{{ _podman_docker_password }}"
    stdin_add_newline: true
  changed_when: true
  register: podman_login_output
  retries: "{{ retry_count }}"
  delay: "{{ delay_time }}"
  until: podman_login_output.rc == 0
  failed_when: false
  no_log: true

- name: Podman login check
  ansible.builtin.fail:
    msg: "{{ common_podman_login_check_msg }}"
  when: podman_login_output.rc != 0
