---
- name: Install firewalld
  ansible.builtin.dnf:
    name: firewalld
    state: present
  register: _firewalld_install
  retries: 3
  delay: 5
  until: _firewalld_install is succeeded

- name: Start and enable firewalld
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true

- name: Install managed Pulp firewall service
  ansible.builtin.template:
    src: omnia-pulp.xml.j2
    dest: "{{ pulp_firewalld_service_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: reload firewalld
  when: pulp_server_port is defined

- name: Load managed Pulp firewall service definition
  ansible.builtin.meta: flush_handlers
  when: pulp_server_port is defined

- name: Enable configured Pulp HTTPS port
  ansible.posix.firewalld:
    service: omnia-pulp
    permanent: true
    immediate: true
    state: enabled
  when: pulp_server_port is defined

- name: Enable NTP service in firewalld
  ansible.posix.firewalld:
    service: "{{ ntp_firewall_service }}"
    permanent: true
    immediate: true
    state: enabled
  when: ntp_firewall_service is defined

- name: Enable NFS-related services
  ansible.posix.firewalld:
    service: "{{ item }}"
    state: enabled
    permanent: true
    immediate: true
  loop: "{{ internal_nfs_services }}"
  when: internal_nfs_services is defined

- name: Display active firewall configuration
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --list-all
  register: _firewall_configuration
  changed_when: false

- name: Show active firewall configuration
  ansible.builtin.debug:
    var: _firewall_configuration.stdout_lines
    verbosity: 1
