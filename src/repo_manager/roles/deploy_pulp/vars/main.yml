---
# Pulp always uses HTTPS. The configured port is the host-facing port; the
# container's built-in nginx terminates TLS on port 443.
pulp_shared_path: "{{ pulp_config_dir }}"
pulp_ha_dir: "{{ pulp_config_dir }}/pulp_ha"
settings_py_path: "{{ pulp_config_dir }}/settings/settings.py"
pulp_config_filepath: "{{ pulp_ha_dir }}/cli.toml"
config_default_dir: "/etc/pulp"
config_default_loc: "{{ config_default_dir }}/cli.toml"

pulp_dir_permissions: "0755"
pulp_public_dir_permissions: "0755"
logs_dir_permission: "0755"
pulp_pgsql_dir_permissions: "0700"
pulp_settings_permissions: "0644"
pulp_secret_permissions: "0600"
pulp_cli_permissions: "0600"
pulp_certificate_permissions: "0644"
pulp_private_key_permissions: "0600"
pulp_csr_permissions: "0600"

device_name: "/dev/fuse:/dev/fuse:rwm"
pulp_container_https_port: 443
pulp_publish_port: "{{ pulp_server_port }}:{{ pulp_container_https_port }}"
pulp_base_url: "https://{{ pulp_server_ip }}:{{ pulp_server_port }}"
pulp_status_url: "{{ pulp_base_url }}/pulp/api/v3/status/"

pull_image_retries: 5
pull_image_delay: 10
endpoint_retries: 30
endpoint_delay: 10

arg_list:
  - "-e PULP_WORKERS=10"
  - "-e PULP_API_WORKERS=10"
  - "-e PULP_CONTENT_WORKERS=10"
  - "-e PULP_GUNICORN_TIMEOUT=30"
  - "-e PULP_API_WORKERS_MAX_REQUESTS=1000"
  - "-e PULP_API_WORKERS_MAX_REQUESTS_JITTER=50"

pulp_directories_https:
  - { path: "{{ pulp_shared_path }}", mode: "{{ pulp_dir_permissions }}" }
  - { path: "{{ pulp_logs_dir }}", mode: "{{ logs_dir_permission }}" }
  - { path: "{{ pulp_shared_path }}/settings", mode: "{{ pulp_dir_permissions }}" }
  - { path: "{{ pulp_certs_dir }}", mode: "{{ pulp_dir_permissions }}" }
  - { path: "{{ pulp_shared_path }}/settings/pulp_storage", mode: "{{ pulp_public_dir_permissions }}" }
  - { path: "{{ pulp_shared_path }}/settings/pgsql", mode: "{{ pulp_pgsql_dir_permissions }}" }
  - { path: "{{ pulp_shared_path }}/settings/containers", mode: "{{ pulp_public_dir_permissions }}" }
  - { path: "{{ pulp_ha_dir }}", mode: "{{ pulp_dir_permissions }}" }

pulp_legacy_deployment_paths:
  - "{{ pulp_shared_path }}/nginx"
  - "{{ pulp_shared_path }}/pulp_crt_track.txt"

volumes_https:
  - "{{ pulp_shared_path }}/settings:/etc/pulp{{ selinux_option }}"
  - "{{ pulp_shared_path }}/settings/pulp_storage:/var/lib/pulp{{ selinux_option }}"
  - "{{ pulp_shared_path }}/settings/pgsql:/var/lib/pgsql{{ selinux_option }}"
  - "{{ pulp_shared_path }}/settings/containers:/var/lib/containers{{ selinux_option }}"
  - "{{ pulp_logs_dir }}:/var/log/pulp{{ selinux_option }}"
  - "{{ pulp_ha_dir }}:/root/.config/pulp{{ selinux_option }}"

cert_validity_days: 3650
cert_renewal_threshold_seconds: 2592000
cert_subject_alt_names:
  - "IP:{{ pulp_server_ip }}"
  - "DNS:pulp"
  - "DNS:localhost"

pulp_deployed_msg: "The {{ pulp_container_name }} container has been successfully deployed."
pulp_deployed_fail_msg: |
  The {{ pulp_container_name }} container deployment failed. Common causes:
  - Missing or inaccessible Pulp container image
  - The configured host port is already in use
  - Pulp storage is unavailable or incorrectly labelled
  - Insufficient memory or disk space
