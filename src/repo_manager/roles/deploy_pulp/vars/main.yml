---
# Pulp always uses HTTPS. The configured port is the host-facing port; the
# container's built-in nginx terminates TLS on port 443.
pulp_shared_path: "{{ pulp_config_dir }}"
pulp_ha_dir: "{{ pulp_cli_config_dir }}"
settings_py_path: "{{ pulp_settings_dir }}/settings.py"
pulp_config_filepath: "{{ pulp_ha_dir }}/cli.toml"
config_default_dir: >-
  {{ pulp_deployment_defaults.container_mounts.settings_path }}
config_default_loc: "{{ config_default_dir }}/cli.toml"

pulp_dir_permissions: "0755"
pulp_public_dir_permissions: "0755"
logs_dir_permission: "0755"
pulp_pgsql_dir_permissions: "0700"
pulp_settings_permissions: "0644"
pulp_secret_permissions: "0600"
pulp_cli_permissions: "0600"
pulp_certificate_permissions: "0644"
pulp_private_key_permissions: "0600"
pulp_csr_permissions: "0600"

device_name: "/dev/fuse:/dev/fuse:rwm"
pulp_container_https_port: "{{ pulp_deployment_defaults.https.container_port }}"
pulp_publish_port: "{{ pulp_server_port }}:{{ pulp_container_https_port }}"
pulp_base_url: "https://{{ pulp_server_ip }}:{{ pulp_server_port }}"
pulp_status_url: "{{ pulp_base_url }}/pulp/api/v3/status/"

pull_image_retries: 5
pull_image_delay: 10
deploy_endpoint_retries: 30
deploy_endpoint_delay: 10

arg_list:
  - "-e PULP_WORKERS={{ pulp_deployment_defaults.workers.task }}"
  - "-e PULP_API_WORKERS={{ pulp_deployment_defaults.workers.api }}"
  - "-e PULP_CONTENT_WORKERS={{ pulp_deployment_defaults.workers.content }}"
  - >-
    {{ '-e PULP_GUNICORN_TIMEOUT=' ~
       pulp_deployment_defaults.timeouts.gunicorn_seconds }}
  - >-
    {{ '-e PULP_API_WORKERS_MAX_REQUESTS=' ~
       pulp_deployment_defaults.timeouts.api_max_requests }}
  - >-
    {{ '-e PULP_API_WORKERS_MAX_REQUESTS_JITTER=' ~
       pulp_deployment_defaults.timeouts.api_max_requests_jitter }}

# Resolved host paths validated before deployment. Repo Manager creates these
# directories but does not create filesystems or manage storage mounts.
pulp_host_storage_paths:
  - name: "settings"
    path: "{{ pulp_settings_dir }}"
  - name: "database"
    path: "{{ pulp_database_dir }}"
  - name: "content"
    path: "{{ pulp_content_dir }}"
  - name: "container_work"
    path: "{{ pulp_container_work_dir }}"
  - name: "service_logs"
    path: "{{ pulp_logs_dir }}"
  - name: "cli_config"
    path: "{{ pulp_cli_config_dir }}"

# Broad paths are never accepted as Pulp storage targets. A configured mount
# must use a dedicated child directory, for example /mnt/pulp-db/postgresql.
pulp_unsafe_storage_paths:
  - "/"
  - "/etc"
  - "/home"
  - "/media"
  - "/mnt"
  - "/opt"
  - "/root"
  - "/srv"
  - "/usr"
  - "/var"

pulp_directories_https:
  - path: "{{ pulp_shared_path }}"
    mode: "{{ pulp_dir_permissions }}"
    create: true
  - path: "{{ pulp_logs_dir }}"
    mode: "{{ logs_dir_permission }}"
    create: "{{ 'service_log_path' not in pulp_storage_paths.user_provided }}"
  - path: "{{ pulp_settings_dir }}"
    mode: "{{ pulp_dir_permissions }}"
    create: "{{ 'settings_path' not in pulp_storage_paths.user_provided }}"
  - path: "{{ pulp_certs_dir }}"
    mode: "{{ pulp_dir_permissions }}"
    create: true
  - path: "{{ pulp_content_dir }}"
    mode: "{{ pulp_public_dir_permissions }}"
    create: "{{ 'content_path' not in pulp_storage_paths.user_provided }}"
  - path: "{{ pulp_database_dir }}"
    mode: "{{ pulp_pgsql_dir_permissions }}"
    create: "{{ 'database_path' not in pulp_storage_paths.user_provided }}"
  - path: "{{ pulp_container_work_dir }}"
    mode: "{{ pulp_public_dir_permissions }}"
    create: >-
      {{ 'container_work_path' not in pulp_storage_paths.user_provided }}
  - path: "{{ pulp_ha_dir }}"
    mode: "{{ pulp_dir_permissions }}"
    create: "{{ 'cli_config_path' not in pulp_storage_paths.user_provided }}"

pulp_legacy_deployment_paths:
  - "{{ pulp_shared_path }}/nginx"
  - "{{ pulp_shared_path }}/pulp_crt_track.txt"

volumes_https:
  - >-
    {{ pulp_settings_dir ~ ':' ~
       pulp_deployment_defaults.container_mounts.settings_path ~
       selinux_option }}
  - >-
    {{ pulp_content_dir ~ ':' ~
       pulp_deployment_defaults.container_mounts.content_path ~
       selinux_option }}
  - >-
    {{ pulp_database_dir ~ ':' ~
       pulp_deployment_defaults.container_mounts.database_path ~
       selinux_option }}
  - >-
    {{ pulp_container_work_dir ~ ':' ~
       pulp_deployment_defaults.container_mounts.container_work_path ~
       selinux_option }}
  - >-
    {{ pulp_logs_dir ~ ':' ~
       pulp_deployment_defaults.container_mounts.service_log_path ~
       selinux_option }}
  - >-
    {{ pulp_ha_dir ~ ':' ~
       pulp_deployment_defaults.container_mounts.cli_config_path ~
       selinux_option }}

cert_validity_days: >-
  {{ pulp_deployment_defaults.https.certificate_validity_days }}
cert_renewal_threshold_seconds: >-
  {{ pulp_deployment_defaults.https.certificate_renewal_threshold_seconds }}
cert_subject_alt_names:
  - "IP:{{ pulp_server_ip }}"
  - "DNS:pulp"
  - "DNS:localhost"

pulp_deployed_msg: "The {{ pulp_container_name }} container has been successfully deployed."
