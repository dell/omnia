---
# =============================================================================
# PRE-FLIGHT CHECKS - Verify container and environment status before deployment
# =============================================================================
# This task file performs pre-deployment verification:
#   1. Check if Pulp container exists and its status
#   2. Verify Pulp image availability
#   3. Check required directories
# =============================================================================

# -----------------------------------------------------------------------------
# STORAGE PATH VALIDATION
# -----------------------------------------------------------------------------

- name: Validate Pulp storage configuration structure
  ansible.builtin.assert:
    that:
      - pulp_storage_paths is mapping
      - pulp_storage_paths.default is mapping
      - pulp_storage_paths.user_provided is mapping
      - >-
        (pulp_storage_paths.user_provided.keys()
         | difference(pulp_storage_paths.default.keys())
         | list | length) == 0
    fail_msg: "{{ deploy_pulp_validate_pulp_storage_configuration_structure_msg }}"
    quiet: true

- name: Validate resolved Pulp host storage paths
  ansible.builtin.assert:
    that:
      - item.path is string
      - item.path is match('^/')
      - item.path | length > 5
      - (item.path | ansible.builtin.normpath) == item.path
      - item.path not in pulp_unsafe_storage_paths
      - item.path != omnia_data_path
      - item.path != repo_manager_runtime_dir
      - item.path != repo_manager_base_dir
    fail_msg: "{{ deploy_pulp_validate_resolved_pulp_host_storage_paths_msg }}"
    quiet: true
  loop: "{{ pulp_host_storage_paths }}"
  loop_control:
    label: "{{ item.name }}={{ item.path }}"

- name: Check user-provided Pulp storage directories
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop: >-
    {{ pulp_storage_paths.user_provided
       | dict2items(key_name='name', value_name='path') }}
  loop_control:
    label: "{{ item.name }}={{ item.path }}"
  register: pulp_user_storage_checks
  failed_when: false

- name: Validate user-provided Pulp storage directories are ready
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false)
      - item.stat.isdir | default(false)
      - item.stat.writeable | default(false)
    fail_msg: "{{ deploy_pulp_validate_user_provided_pulp_storage_directories_are_ready_msg }}"
    quiet: true
  loop: "{{ pulp_user_storage_checks.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}={{ item.item.path }}"

- name: Validate Pulp host storage paths are unique
  ansible.builtin.assert:
    that:
      - >-
        (pulp_host_storage_paths | map(attribute='path') | list | unique | length)
        == (pulp_host_storage_paths | length)
    fail_msg: "{{ deploy_pulp_validate_pulp_host_storage_paths_are_unique_msg }}"
    quiet: true

- name: Display resolved Pulp storage responsibility
  ansible.builtin.debug:
    msg:
      - "Pulp host storage paths are valid absolute directories."
      - >-
        Default directories are created when needed; user-provided directories
        must already exist.
      - >-
        Repo Manager does not create filesystems or manage storage mounts.
      - "NFS and block storage must be mounted and writable before deployment."

# -----------------------------------------------------------------------------
# CONTAINER STATUS CHECK
# -----------------------------------------------------------------------------

- name: Check if Pulp container exists
  containers.podman.podman_container_info:
    name: "{{ pulp_container_name }}"
  register: pulp_container_info
  failed_when: false

- name: Set container status facts
  ansible.builtin.set_fact:
    pulp_container_exists: "{{ pulp_container_info.containers | length > 0 }}"
    pulp_container_running: >-
      {{ (pulp_container_info.containers | length > 0) and
         (pulp_container_info.containers[0].State.Status == 'running') }}
    pulp_container_status: >-
      {{ pulp_container_info.containers[0].State.Status
         if (pulp_container_info.containers | length > 0)
         else 'not_found' }}

- name: Display existing container status
  ansible.builtin.debug:
    msg:
      - "========== PRE-FLIGHT CHECKS =========="
      - "Container exists: {{ pulp_container_exists }}"
      - "Container running: {{ pulp_container_running }}"
      - "Container status: {{ pulp_container_status }}"
      - "======================================="

# -----------------------------------------------------------------------------
# IMAGE AVAILABILITY CHECK
# -----------------------------------------------------------------------------

- name: Check if Pulp image exists locally
  ansible.builtin.command:
    cmd: "podman image exists {{ pulp_image }}"
  register: image_exists_check
  changed_when: false
  failed_when: false

- name: Set image status fact
  ansible.builtin.set_fact:
    pulp_image_available: "{{ image_exists_check.rc == 0 }}"

- name: Display image status
  ansible.builtin.debug:
    msg: "Pulp image '{{ pulp_image }}' available locally: {{ pulp_image_available }}"

# -----------------------------------------------------------------------------
# DIRECTORY STATUS CHECK
# -----------------------------------------------------------------------------

- name: Check required directories exist
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop: "{{ pulp_host_storage_paths }}"
  loop_control:
    label: "{{ item.name }}={{ item.path }}"
  register: dir_checks
  failed_when: false

- name: Set directory status facts
  ansible.builtin.set_fact:
    pulp_directories_exist: >-
      {{ dir_checks.results | map(attribute='stat.exists') | list |
         select('equalto', true) | list | length == dir_checks.results | length }}

- name: Display directory status
  ansible.builtin.debug:
    msg: >-
      {{ item.item.name }} directory '{{ item.item.path }}':
      {{ 'exists' if item.stat.exists else 'will be created' }}
  loop: "{{ dir_checks.results }}"
  loop_control:
    label: "{{ item.item.name }}={{ item.item.path }}"

# -----------------------------------------------------------------------------
# SYSTEMD SERVICE CHECK
# -----------------------------------------------------------------------------

- name: Check if Pulp systemd service exists
  ansible.builtin.stat:
    path: "{{ pulp_quadlet_file }}"
  register: quadlet_file_check

- name: Set systemd service status
  ansible.builtin.set_fact:
    pulp_quadlet_exists: "{{ quadlet_file_check.stat.exists }}"

- name: Display systemd service status
  ansible.builtin.debug:
    msg: "Pulp quadlet file exists: {{ pulp_quadlet_exists }}"

# -----------------------------------------------------------------------------
# PRE-FLIGHT SUMMARY
# -----------------------------------------------------------------------------

- name: Display pre-flight summary
  ansible.builtin.debug:
    msg:
      - "========== PRE-FLIGHT SUMMARY =========="
      - "Container exists: {{ pulp_container_exists }}"
      - "Container running: {{ pulp_container_running }}"
      - "Image available: {{ pulp_image_available }}"
      - "Directories ready: {{ pulp_directories_exist }}"
      - "Quadlet configured: {{ pulp_quadlet_exists }}"
      - "========================================"
      - ""
      - "Deployment will {{ 'update existing' if pulp_container_exists else 'create new' }} container"
