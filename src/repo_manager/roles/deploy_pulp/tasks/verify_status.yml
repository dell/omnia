---
# =============================================================================
# VERIFY PULP DEPLOYMENT STATUS
# =============================================================================
# This task file verifies Pulp container deployment:
#   1. Check container is running
#   2. Check Pulp API endpoint (for HTTPS)
#   3. Display deployment summary
# =============================================================================

# -----------------------------------------------------------------------------
# CONTAINER STATUS VERIFICATION
# -----------------------------------------------------------------------------

- name: Check if Pulp container is running
  ansible.builtin.command:
    cmd: "podman ps --filter name={{ pulp_container_name }} --format '{{ '{{' }}.Status{{ '}}' }}'"
  register: pulp_status
  changed_when: false
  failed_when: false

- name: Get detailed container info
  containers.podman.podman_container_info:
    name: "{{ pulp_container_name }}"
  register: pulp_container_details
  failed_when: false

- name: Set container status facts
  ansible.builtin.set_fact:
    container_is_running: "{{ pulp_status.stdout != '' and 'Up' in pulp_status.stdout }}"
    container_uptime: "{{ pulp_status.stdout | default('Not running') }}"

# -----------------------------------------------------------------------------
# CONTAINER VERIFICATION
# -----------------------------------------------------------------------------

- name: Verify Pulp container is running
  ansible.builtin.fail:
    msg: "{{ deploy_pulp_verify_pulp_container_is_running_msg }}"
  when: not container_is_running

# -----------------------------------------------------------------------------
# API ENDPOINT VERIFICATION
# -----------------------------------------------------------------------------

- name: Run comprehensive Pulp health verification
  ansible.builtin.include_tasks: pulp_health_check.yml
  when: container_is_running

# -----------------------------------------------------------------------------
# DEPLOYMENT SUMMARY
# -----------------------------------------------------------------------------

- name: Display deployment verification summary
  ansible.builtin.debug:
    msg:
      - "========== DEPLOYMENT VERIFICATION =========="
      - "Container: {{ pulp_container_name }}"
      - "Status: {{ container_uptime }}"
      - "Running: {{ container_is_running }}"
      - "Health Check: Passed (comprehensive)"
      - "============================================="

- name: Pulp deployment verified successfully
  ansible.builtin.debug:
    msg: "{{ pulp_deployed_msg }}"
  when: container_is_running
