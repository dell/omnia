---
# =============================================================================
# SETUP PULP CLI - Ensure pulp CLI is available with managed TLS trust
# =============================================================================
# Use the Omnia virtual environment only when OMNIA_VENV_PATH is non-empty.
# Otherwise use the system Python runtime. The launcher supplies PULP_CA_BUNDLE
# so the CLI validates Repo Manager's private certificate in both modes.
# =============================================================================

- name: Display selected Pulp CLI runtime
  ansible.builtin.debug:
    msg: >-
      Pulp CLI runtime: {{ pulp_cli_runtime_mode }}
      (Python: {{ pulp_cli_runtime_python_executable }})

- name: Validate configured Omnia virtual environment path
  ansible.builtin.assert:
    that:
      - pulp_venv_path is match('^/')
    fail_msg: >-
      OMNIA_VENV_PATH must be an absolute path when it is configured.
      Received: {{ pulp_venv_path }}
  when: pulp_cli_runtime_mode == 'venv'

- name: Inspect configured Omnia virtual environment CLI directory
  ansible.builtin.stat:
    path: "{{ pulp_venv_cli_executable | dirname }}"
  register: _pulp_venv_cli_directory
  when: pulp_cli_runtime_mode == 'venv'

- name: Require the configured Omnia virtual environment CLI directory
  ansible.builtin.assert:
    that:
      - _pulp_venv_cli_directory.stat.exists | default(false)
      - _pulp_venv_cli_directory.stat.isdir | default(false)
    fail_msg: >-
      The Omnia virtual environment CLI directory is unavailable at
      {{ pulp_venv_cli_executable | dirname }}. Set OMNIA_VENV_PATH to the
      deployed Omnia virtual environment and run the prepare operation again.
  when: pulp_cli_runtime_mode == 'venv'

- name: Inspect selected Pulp CLI Python runtime
  ansible.builtin.stat:
    path: "{{ pulp_cli_runtime_python_executable }}"
    follow: true
  register: _pulp_cli_runtime_python

- name: Require an executable Pulp CLI Python runtime
  ansible.builtin.assert:
    that:
      - _pulp_cli_runtime_python.stat.exists | default(false)
      - _pulp_cli_runtime_python.stat.isreg | default(false)
      - _pulp_cli_runtime_python.stat.executable | default(false)
    fail_msg: >-
      Python is unavailable at {{ pulp_cli_runtime_python_executable }}.
      {% if pulp_cli_runtime_mode == 'venv' %}
      Correct OMNIA_VENV_PATH and run the dependency setup before prepare.
      {% else %}
      Install the Repo Manager system Python dependencies before prepare.
      {% endif %}

- name: Verify pulp-cli is installed in the selected Python runtime
  ansible.builtin.command:
    argv:
      - "{{ pulp_cli_runtime_python_executable }}"
      - -c
      - "from pulp_cli import main"
  register: _pulp_cli_runtime_import
  changed_when: false
  failed_when: false

- name: Require pulp-cli in the selected Python runtime
  ansible.builtin.assert:
    that:
      - _pulp_cli_runtime_import.rc == 0
    fail_msg: >-
      pulp-cli is not installed for {{ pulp_cli_runtime_python_executable }}.
      Install the Repo Manager requirements for the selected
      {{ pulp_cli_runtime_mode }} runtime and run prepare again.

- name: Ensure Pulp CLI backend directory exists
  ansible.builtin.file:
    path: "{{ pulp_cli_backend | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Pulp CLI backend for the selected runtime
  ansible.builtin.template:
    src: pulp_cli_backend.py.j2
    dest: "{{ pulp_cli_backend }}"
    owner: root
    group: root
    mode: "0755"

- name: Verify managed Pulp CLI backend exists
  ansible.builtin.stat:
    path: "{{ pulp_cli_backend }}"
  register: _pulp_cli_backend_state

- name: Require a valid managed Pulp CLI backend
  ansible.builtin.assert:
    that:
      - _pulp_cli_backend_state.stat.exists
      - _pulp_cli_backend_state.stat.isreg
      - _pulp_cli_backend_state.stat.executable
    fail_msg: >-
      The managed Pulp CLI backend is unavailable. Reinstall pulp-cli and run
      the prepare operation again.

- name: Install managed Pulp CLI launcher
  ansible.builtin.template:
    src: pulp_cli_launcher.sh.j2
    dest: "{{ pulp_cli_executable }}"
    owner: root
    group: root
    mode: "0755"
    force: true

- name: Link Omnia virtual environment Pulp CLI to managed launcher
  ansible.builtin.file:
    src: "{{ pulp_cli_executable }}"
    dest: "{{ pulp_venv_cli_executable }}"
    state: link
    force: true
  when:
    - pulp_cli_runtime_mode == 'venv'
    - pulp_venv_cli_executable != pulp_cli_executable

- name: Verify managed Pulp CLI launcher
  ansible.builtin.command:
    argv:
      - "{{ pulp_cli_executable }}"
      - --version
  register: pulp_cli_version
  changed_when: false

- name: Verify managed Pulp CLI from Omnia virtual environment
  ansible.builtin.command:
    argv:
      - "{{ pulp_venv_cli_executable }}"
      - --version
  register: _pulp_venv_cli_version
  changed_when: false
  when: pulp_cli_runtime_mode == 'venv'

- name: Display pulp CLI status
  ansible.builtin.debug:
    msg:
      - "Runtime mode: {{ pulp_cli_runtime_mode }}"
      - "System Pulp CLI: {{ pulp_cli_version.stdout }}"
      - >-
        Omnia venv Pulp CLI:
        {{ _pulp_venv_cli_version.stdout
           if pulp_cli_runtime_mode == 'venv' else 'not configured' }}
