---
# =============================================================================
# SETUP PULP CLI - Ensure pulp CLI is available with managed TLS trust
# =============================================================================
# Preserve the installed console entry point as a backend and install a small
# launcher at /usr/local/bin/pulp. The launcher supplies PULP_CA_BUNDLE so the
# pip-installed CLI can validate Repo Manager's private certificate without a
# manual shell export. Caller-provided PULP_CA_BUNDLE values still take priority.
# =============================================================================

- name: Check if pulp CLI exists at /usr/local/bin/pulp
  ansible.builtin.stat:
    path: "{{ pulp_cli_executable }}"
  register: pulp_system_cli_check

- name: Find pulp CLI path from current environment
  ansible.builtin.command: which pulp
  register: pulp_which_result
  changed_when: false
  failed_when: false
  when: not pulp_system_cli_check.stat.exists

- name: Create symlink for pulp CLI at /usr/local/bin/pulp
  ansible.builtin.file:
    src: "{{ pulp_which_result.stdout }}"
    dest: "{{ pulp_cli_executable }}"
    state: link
  when:
    - not pulp_system_cli_check.stat.exists
    - pulp_which_result.rc | default(1) == 0
    - pulp_which_result.stdout | default('') | length > 0

- name: Verify installed Pulp CLI before configuring its launcher
  ansible.builtin.command:
    argv:
      - "{{ pulp_cli_executable }}"
      - --version
  register: _pulp_cli_installed_version
  changed_when: false
  failed_when: false

- name: Fail if pulp CLI is not available
  ansible.builtin.fail:
    msg: |
      Pulp CLI not found at /usr/local/bin/pulp.
      Please ensure pulp-cli is installed and the virtual environment is activated:
        source <venv_path>/bin/activate
        pip install pulp-cli
      Then run the playbook again to create the symlink automatically.
  when: _pulp_cli_installed_version.rc != 0

- name: Check whether the Pulp CLI launcher is managed by Repo Manager
  ansible.builtin.command:
    argv:
      - grep
      - -Fqx
      - "# Managed by Omnia Repo Manager"
      - "{{ pulp_cli_executable }}"
  register: _pulp_cli_launcher_check
  changed_when: false
  failed_when: false

- name: Ensure Pulp CLI backend directory exists
  ansible.builtin.file:
    path: "{{ pulp_cli_backend | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Resolve the installed Pulp CLI entry point
  ansible.builtin.command:
    argv:
      - readlink
      - -f
      - "{{ pulp_cli_executable }}"
  register: _pulp_cli_source
  changed_when: false
  when: _pulp_cli_launcher_check.rc != 0

- name: Preserve installed Pulp CLI as managed backend
  ansible.builtin.copy:
    src: "{{ _pulp_cli_source.stdout }}"
    dest: "{{ pulp_cli_backend }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when: _pulp_cli_launcher_check.rc != 0

- name: Verify managed Pulp CLI backend exists
  ansible.builtin.stat:
    path: "{{ pulp_cli_backend }}"
  register: _pulp_cli_backend_state

- name: Require a valid managed Pulp CLI backend
  ansible.builtin.assert:
    that:
      - _pulp_cli_backend_state.stat.exists
      - _pulp_cli_backend_state.stat.isreg
      - _pulp_cli_backend_state.stat.executable
    fail_msg: >-
      The managed Pulp CLI backend is unavailable. Reinstall pulp-cli and run
      the prepare operation again.

- name: Install managed Pulp CLI launcher
  ansible.builtin.template:
    src: pulp_cli_launcher.sh.j2
    dest: "{{ pulp_cli_executable }}"
    owner: root
    group: root
    mode: "0755"
    force: true

- name: Verify managed Pulp CLI launcher
  ansible.builtin.command:
    argv:
      - "{{ pulp_cli_executable }}"
      - --version
  register: pulp_cli_version
  changed_when: false

- name: Display pulp CLI status
  ansible.builtin.debug:
    msg: "Pulp CLI: {{ pulp_cli_version.stdout }}"
