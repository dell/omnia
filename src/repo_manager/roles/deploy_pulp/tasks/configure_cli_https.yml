---
- name: Load repo_manager endpoint configuration
  ansible.builtin.include_vars:
    file: "{{ input_project_dir }}/repo_manager_endpoint_config.yml"
    name: endpoint_config

- name: Set Pulp server IP from endpoint config
  ansible.builtin.set_fact:
    pulp_server_ip: "{{ endpoint_config.pulp_server_ip }}"

- name: Validate Pulp password is provided
  ansible.builtin.fail:
    msg: "Pulp password is required. Set pulp_password in {{ input_project_dir }}/repo_manager_config_credentials.yml or pass -e pulp_password=..."
  when: pulp_password | default('') | length == 0

- name: Ensure config default directory exists
  ansible.builtin.file:
    path: "{{ config_default_dir }}"
    state: directory
    mode: '0755'

- name: Create or overwrite Pulp HTTPS config
  ansible.builtin.command:
    cmd: "{{ pulp_config_cmd_overwrite_https }}"
  changed_when: false

- name: Copy config file to default path
  ansible.builtin.copy:
    src: "{{ pulp_config_filepath }}"
    dest: "{{ config_default_loc }}"
    mode: "{{ logs_dir_permission }}"
    remote_src: true

- name: Run pulp status command
  ansible.builtin.command: /usr/local/bin/pulp status
  changed_when: false
  register: pulp_status_output
  failed_when: false

- name: Check if track file exists
  ansible.builtin.stat:
    path: "{{ track_file_path }}"
  register: file_check

- name: Tasks to generate pulp crt
  when: >
    (
      (pulp_status_output.rc != 0) and
      (not file_check.stat.exists)
    )
  block:
    - name: Set cert_san fact based on IP
      ansible.builtin.set_fact:
        cert_san: subjectAltName=IP:{{ pulp_server_ip }},DNS:pulp,DNS:localhost

    - name: Ensure certs directory exists
      ansible.builtin.file:
        path: "{{ certs_dir }}"
        state: directory
        mode: '0755'

    - name: Generating Pulp SSL Certificate
      ansible.builtin.command:
        cmd: "{{ generate_cert_cmd }}"
      changed_when: false

    - name: Ensure the pulp group exists
      ansible.builtin.group:
        name: pulp
        state: present

    - name: Change group ownership of SSL certificate and key
      ansible.builtin.file:
        path: "{{ item }}"
        group: pulp
        state: file
      loop: "{{ cert_items.values() }}"

    - name: Copy Pulp crt to container trust
      ansible.builtin.copy:
        src: "{{ pulp_cert_src }}"
        dest: "{{ ca_trust_path }}"
        mode: "{{ logs_dir_permission }}"

    - name: Add Pulp Certificate to TrustStore
      ansible.builtin.command:
        cmd: update-ca-trust extract
      changed_when: false

    - name: Create a track file
      ansible.builtin.file:
        path: "{{ track_file_path }}"
        state: touch
        mode: "{{ logs_dir_permission }}"

    - name: Record current timestamp in track file
      ansible.builtin.copy:
        dest: "{{ track_file_path }}"
        content: "Timestamp: {{ ansible_facts.date_time.iso8601 }}"
        mode: "{{ logs_dir_permission }}"
