---
- name: Validate Pulp administrator credentials
  ansible.builtin.assert:
    that:
      - pulp_username | default('') | length > 0
      - pulp_password | default('') | length > 0
    fail_msg: "{{ deploy_pulp_validate_pulp_administrator_credentials_msg }}"
    quiet: true
  no_log: true

- name: Wait for Pulp before configuring credentials
  ansible.builtin.uri:
    url: "{{ pulp_status_url }}"
    validate_certs: true
    ca_path: "{{ pulp_server_crt }}"
    status_code: 200
    timeout: 30
  register: _pulp_preconfigure_status
  retries: "{{ deploy_endpoint_retries }}"
  delay: "{{ deploy_endpoint_delay }}"
  until: _pulp_preconfigure_status.status | default(-1) == 200

- name: Test configured Pulp administrator credentials
  ansible.builtin.uri:
    url: "{{ pulp_base_url }}/pulp/api/v3/users/?limit=1"
    url_username: "{{ pulp_username }}"
    url_password: "{{ pulp_password }}"
    force_basic_auth: true
    validate_certs: true
    ca_path: "{{ pulp_server_crt }}"
    status_code: [200, 401, 403]
    timeout: 30
  register: _pulp_credential_check
  changed_when: false
  failed_when: false
  no_log: true

- name: Apply requested Pulp administrator credentials when needed
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - -i
      - "{{ pulp_container_name }}"
      - pulpcore-manager
      - shell
    stdin: |
      from django.contrib.auth import get_user_model
      user, _ = get_user_model().objects.get_or_create(
          username={{ pulp_username | to_json }},
          defaults={"is_superuser": True, "is_staff": True},
      )
      user.is_superuser = True
      user.is_staff = True
      user.set_password({{ pulp_password | to_json }})
      user.save()
  register: _pulp_password_update
  changed_when: true
  when: _pulp_credential_check.status | default(0) in [401, 403]
  no_log: true

- name: Verify Pulp administrator credentials
  ansible.builtin.uri:
    url: "{{ pulp_base_url }}/pulp/api/v3/users/?limit=1"
    url_username: "{{ pulp_username }}"
    url_password: "{{ pulp_password }}"
    force_basic_auth: true
    validate_certs: true
    ca_path: "{{ pulp_server_crt }}"
    status_code: 200
    timeout: 30
  register: _pulp_credential_verification
  retries: 6
  delay: 5
  until: _pulp_credential_verification.status | default(-1) == 200
  no_log: true

- name: Render secure Pulp CLI configuration
  ansible.builtin.template:
    src: cli.toml.j2
    dest: "{{ pulp_config_filepath }}"
    mode: "{{ pulp_cli_permissions }}"
  no_log: true

- name: Ensure system Pulp CLI configuration directory exists
  ansible.builtin.file:
    path: "{{ config_default_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install secure system Pulp CLI configuration
  ansible.builtin.copy:
    src: "{{ pulp_config_filepath }}"
    dest: "{{ config_default_loc }}"
    remote_src: true
    owner: root
    group: root
    mode: "{{ pulp_cli_permissions }}"
  no_log: true

- name: Ensure root Pulp CLI configuration directory exists
  ansible.builtin.file:
    path: "{{ pulp_root_cli_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Link root Pulp CLI configuration to the canonical file
  ansible.builtin.file:
    src: "{{ pulp_config_filepath }}"
    dest: "{{ pulp_root_cli_config_file }}"
    state: link
    force: true

- name: Verify Pulp CLI configuration
  ansible.builtin.command:
    argv: "{{ [pulp_cli_executable] + pulp_cli_commands.common.status }}"
  register: _pulp_cli_status
  changed_when: false
  failed_when: _pulp_cli_status.rc != 0

- name: Verify Pulp CLI configuration from Omnia virtual environment
  ansible.builtin.command:
    argv: "{{ [pulp_venv_cli_executable] + pulp_cli_commands.common.status }}"
  register: _pulp_venv_cli_status
  changed_when: false
  failed_when: _pulp_venv_cli_status.rc != 0
  when: pulp_cli_runtime_mode == 'venv'
