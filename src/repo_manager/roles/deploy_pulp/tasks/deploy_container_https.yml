---
- name: Create Pulp runtime directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop: "{{ pulp_directories_https }}"
  loop_control:
    label: "{{ item.path }}"
  when: item.create | default(true) | bool

- name: Detect Pulp host storage filesystem types
  ansible.builtin.command:
    argv:
      - findmnt
      - --noheadings
      - --output
      - FSTYPE
      - --target
      - "{{ item.path }}"
  loop: "{{ pulp_host_storage_paths }}"
  loop_control:
    label: "{{ item.name }}={{ item.path }}"
  register: _pulp_storage_fstypes
  changed_when: false

- name: Identify SELinux booleans required by Pulp network storage
  ansible.builtin.set_fact:
    _pulp_required_selinux_booleans: >-
      {{ (_pulp_storage_fstypes.results
          | map(attribute='stdout')
          | map('trim')
          | select('in', pulp_network_fs_selinux_booleans)
          | map('extract', pulp_network_fs_selinux_booleans)
          | unique
          | list)
         if (ansible_selinux.status | default('disabled')) == 'enabled'
         else [] }}

- name: Read SELinux booleans required by Pulp network storage
  ansible.builtin.command:
    argv:
      - getsebool
      - "{{ item }}"
  loop: "{{ _pulp_required_selinux_booleans }}"
  register: _pulp_selinux_boolean_states
  changed_when: false

- name: Require SELinux access for confined Pulp network storage
  ansible.builtin.assert:
    that:
      - (item.stdout.split() | last) == 'on'
    fail_msg: "{{ deploy_pulp_require_selinux_network_storage_boolean_msg }}"
    quiet: true
  loop: "{{ _pulp_selinux_boolean_states.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"

- name: Remove obsolete Pulp HTTP and custom nginx artifacts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ pulp_legacy_deployment_paths }}"

- name: Render Pulp nginx proxy timeout override
  ansible.builtin.template:
    src: nginx_proxy_timeouts.conf.j2
    dest: "{{ deploy_pulp_nginx_timeout_file }}"
    owner: root
    group: root
    mode: "0644"
  register: deploy_pulp_nginx_timeout_render

- name: Prepare persistent Pulp secret key
  ansible.builtin.include_tasks: prepare_secret.yml

- name: Prepare Pulp TLS certificate
  ansible.builtin.include_tasks: prepare_tls.yml

- name: Render Pulp settings
  ansible.builtin.template:
    src: settings_template.j2
    dest: "{{ settings_py_path }}"
    owner: root
    group: "{{ pulp_settings_group }}"
    mode: "{{ pulp_settings_permissions }}"
  register: _pulp_settings_render
  no_log: true

- name: Deploy Pulp HTTPS Quadlet
  ansible.builtin.template:
    src: https_quadlet.j2
    dest: "{{ pulp_quadlet_file }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  register: _pulp_quadlet_render
  notify: reload pulp systemd

- name: Apply pending trust and systemd changes
  ansible.builtin.meta: flush_handlers

- name: Start or restart Pulp service and enable it for reboot
  ansible.builtin.systemd_service:
    name: "{{ pulp_container_name }}.service"
    state: >-
      {{ 'restarted'
         if ((_pulp_settings_render.changed | default(false)) or
             (deploy_pulp_nginx_timeout_render.changed | default(false)) or
             (_pulp_quadlet_render.changed | default(false)) or
             (_pulp_certificate_generation.changed | default(false)))
         else 'started' }}
    enabled: true

- name: Wait for the Pulp HTTPS API
  ansible.builtin.uri:
    url: "{{ pulp_status_url }}"
    validate_certs: true
    ca_path: "{{ pulp_server_crt }}"
    timeout: 30
    status_code: 200
  register: _pulp_deployment_api
  retries: "{{ deploy_endpoint_retries }}"
  delay: "{{ deploy_endpoint_delay }}"
  until: _pulp_deployment_api.status | default(-1) == 200

- name: Inspect deployed Pulp container
  containers.podman.podman_container_info:
    name: "{{ pulp_container_name }}"
  register: _pulp_deployed_container

- name: Verify deployed Pulp container is running
  ansible.builtin.assert:
    that:
      - (_pulp_deployed_container.containers | default([]) | length) > 0
      - _pulp_deployed_container.containers[0].State.Status | default('') == 'running'
    fail_msg: "{{ deploy_pulp_verify_deployed_pulp_container_is_running_msg }}"
    success_msg: "{{ pulp_deployed_msg }}"
    quiet: true
