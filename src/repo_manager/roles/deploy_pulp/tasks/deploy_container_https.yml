---
- name: Create Pulp runtime directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop: "{{ pulp_directories_https }}"
  loop_control:
    label: "{{ item.path }}"
  when: item.create | default(true) | bool

- name: Remove obsolete Pulp HTTP and custom nginx artifacts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ pulp_legacy_deployment_paths }}"

- name: Prepare persistent Pulp secret key
  ansible.builtin.include_tasks: prepare_secret.yml

- name: Prepare Pulp TLS certificate
  ansible.builtin.include_tasks: prepare_tls.yml

- name: Render Pulp settings
  ansible.builtin.template:
    src: settings_template.j2
    dest: "{{ settings_py_path }}"
    mode: "{{ pulp_settings_permissions }}"
  register: _pulp_settings_render
  no_log: true

- name: Deploy Pulp HTTPS Quadlet
  ansible.builtin.template:
    src: https_quadlet.j2
    dest: "/etc/containers/systemd/{{ pulp_container_name }}.container"
    owner: root
    group: root
    mode: "0644"
    backup: true
  register: _pulp_quadlet_render
  notify: reload pulp systemd

- name: Apply pending trust and systemd changes
  ansible.builtin.meta: flush_handlers

- name: Start or restart Pulp service and enable it for reboot
  ansible.builtin.systemd_service:
    name: "{{ pulp_container_name }}.service"
    state: >-
      {{ 'restarted'
         if ((_pulp_settings_render.changed | default(false)) or
             (_pulp_quadlet_render.changed | default(false)) or
             (_pulp_certificate_generation.changed | default(false)))
         else 'started' }}
    enabled: true

- name: Wait for the Pulp HTTPS API
  ansible.builtin.uri:
    url: "{{ pulp_status_url }}"
    validate_certs: true
    ca_path: "{{ pulp_server_crt }}"
    timeout: 30
    status_code: 200
  register: _pulp_deployment_api
  retries: "{{ deploy_endpoint_retries }}"
  delay: "{{ deploy_endpoint_delay }}"
  until: _pulp_deployment_api.status | default(-1) == 200

- name: Inspect deployed Pulp container
  containers.podman.podman_container_info:
    name: "{{ pulp_container_name }}"
  register: _pulp_deployed_container

- name: Verify deployed Pulp container is running
  ansible.builtin.assert:
    that:
      - (_pulp_deployed_container.containers | default([]) | length) > 0
      - _pulp_deployed_container.containers[0].State.Status | default('') == 'running'
    fail_msg: "Pulp container {{ pulp_container_name }} is not running after deployment."
    success_msg: "{{ pulp_deployed_msg }}"
