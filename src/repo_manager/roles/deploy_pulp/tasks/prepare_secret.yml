---
- name: Check for persistent Pulp secret key
  ansible.builtin.stat:
    path: "{{ pulp_secret_key_file }}"
  register: _pulp_secret_file

- name: Check for an existing Pulp settings file
  ansible.builtin.stat:
    path: "{{ settings_py_path }}"
  register: _existing_pulp_settings
  when: not _pulp_secret_file.stat.exists

- name: Read existing Pulp settings for secret migration
  ansible.builtin.slurp:
    src: "{{ settings_py_path }}"
  register: _existing_pulp_settings_content
  when:
    - not _pulp_secret_file.stat.exists
    - _existing_pulp_settings.stat.exists | default(false)
  no_log: true

- name: Extract existing Pulp secret for migration
  ansible.builtin.set_fact:
    _existing_pulp_secret_matches: >-
      {{ (_existing_pulp_settings_content.content | b64decode) |
         regex_findall("SECRET_KEY\\s*=\\s*['\"]([^'\"]+)['\"]") }}
  when:
    - _existing_pulp_settings_content is defined
    - not (_existing_pulp_settings_content.skipped | default(false))
  no_log: true

- name: Preserve existing Pulp secret in persistent file
  ansible.builtin.copy:
    dest: "{{ pulp_secret_key_file }}"
    content: "{{ _existing_pulp_secret_matches | first }}"
    mode: "{{ pulp_secret_permissions }}"
  when:
    - not _pulp_secret_file.stat.exists
    - (_existing_pulp_secret_matches | default([]) | length) > 0
  no_log: true

- name: Recheck persistent Pulp secret key
  ansible.builtin.stat:
    path: "{{ pulp_secret_key_file }}"
  register: _pulp_secret_file_after_migration

- name: Generate persistent Pulp secret key
  ansible.builtin.command:
    argv:
      - openssl
      - rand
      - -base64
      - "48"
  register: _generated_pulp_secret
  changed_when: true
  when: not _pulp_secret_file_after_migration.stat.exists
  no_log: true

- name: Store generated Pulp secret key
  ansible.builtin.copy:
    dest: "{{ pulp_secret_key_file }}"
    content: "{{ _generated_pulp_secret.stdout }}"
    mode: "{{ pulp_secret_permissions }}"
  when:
    - _generated_pulp_secret is defined
    - not (_generated_pulp_secret.skipped | default(false))
  no_log: true

- name: Read persistent Pulp secret key
  ansible.builtin.slurp:
    src: "{{ pulp_secret_key_file }}"
  register: _pulp_secret_content
  no_log: true

- name: Enforce persistent Pulp secret permissions
  ansible.builtin.file:
    path: "{{ pulp_secret_key_file }}"
    state: file
    mode: "{{ pulp_secret_permissions }}"

- name: Set Pulp secret key fact
  ansible.builtin.set_fact:
    pulp_secret_key: "{{ _pulp_secret_content.content | b64decode | trim }}"
  no_log: true

- name: Validate persistent Pulp secret key
  ansible.builtin.assert:
    that:
      - pulp_secret_key | length >= 32
    fail_msg: >-
      The persistent Pulp secret key is empty or invalid. Restore
      {{ pulp_secret_key_file }} from backup before redeploying.
    quiet: true
  no_log: true
