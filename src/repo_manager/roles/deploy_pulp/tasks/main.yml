# =============================================================================
# DEPLOY PULP ROLE - MAIN ENTRY POINT
# =============================================================================
# This role handles the deployment of the Pulp container.
#
# Steps:
#   1. Set deployment facts (hostname, protocol, IP, credentials)
#   2. Pull Pulp container image
#   3. Deploy container (HTTP or HTTPS based on configuration)
#
# Required Variables (from roles/deploy_pulp/vars/main.yml and vars/default.yml):
#   - pulp_protocol_https: boolean (true for HTTPS, false for HTTP)
#   - pulp_image: Pulp container image to deploy
#   - pulp_username: Admin username for Pulp (from credentials)
#   - pulp_password: Admin password for Pulp (from credentials)
#
# Pre-requisites:
#   - OIM host group created
#   - Credentials fetched (pulp_username, pulp_password available)
#   - Network configuration loaded (admin_nic_ip available)
# =============================================================================

# -----------------------------------------------------------------------------
# STEP 1: SET DEPLOYMENT FACTS
# -----------------------------------------------------------------------------

- name: Set hostname_enabled fact
  ansible.builtin.set_fact:
    hostname_enabled: false

- name: Propagate pulp_protocol_https to localhost
  ansible.builtin.set_fact:
    pulp_protocol_https: "{{ pulp_protocol_https }}"
  delegate_to: localhost
  run_once: true

- name: Set Pulp server IP and credentials from admin NIC
  ansible.builtin.set_fact:
    pulp_server_ip: "{{ hostvars['localhost']['admin_nic_ip'] }}"
    pulp_username: "{{ hostvars['localhost']['pulp_username'] | default('admin') }}"
    pulp_password: "{{ hostvars['localhost']['pulp_password'] }}"
  when: not hostname_enabled

- name: Set Pulp server hostname and credentials (when hostname_enabled)
  ansible.builtin.set_fact:
    pulp_server_ip: ""
    pulp_username: "{{ hostvars['localhost']['pulp_username'] | default('admin') }}"
    pulp_password: "{{ hostvars['localhost']['pulp_password'] }}"
  when: hostname_enabled

- name: Display deployment configuration
  ansible.builtin.debug:
    msg:
      - "Pulp Server IP: {{ pulp_server_ip }}"
      - "Pulp Username: {{ pulp_username }}"
      - "Protocol: {{ 'HTTPS' if pulp_protocol_https else 'HTTP' }}"
      - "Image: {{ pulp_image }}"

# -----------------------------------------------------------------------------
# STEP 2: PULL PULP CONTAINER IMAGE
# -----------------------------------------------------------------------------

- name: Pull Pulp container image
  ansible.builtin.include_tasks: pull_image.yml

# -----------------------------------------------------------------------------
# STEP 3: DEPLOY PULP CONTAINER
# -----------------------------------------------------------------------------

- name: Deploy Pulp container over HTTP
  ansible.builtin.include_tasks: deploy_container_http.yml
  when: not pulp_protocol_https | bool

- name: Deploy Pulp container over HTTPS
  ansible.builtin.include_tasks: deploy_container_https.yml
  when: pulp_protocol_https | bool
