---
- name: Validate resolved Pulp deployment inputs
  ansible.builtin.assert:
    that:
      - pulp_server_ip | default('') | length > 0
      - pulp_server_port is defined
      - pulp_server_port | int >= 1
      - pulp_server_port | int <= 65535
    fail_msg: "{{ deploy_pulp_validate_resolved_pulp_deployment_inputs_msg }}"
    quiet: true

- name: Set Pulp credential defaults
  ansible.builtin.set_fact:
    pulp_username: "{{ pulp_username | default('admin', true) }}"
    pulp_password: "{{ pulp_password | default('') }}"
  no_log: true

- name: Display Pulp HTTPS deployment configuration
  ansible.builtin.debug:
    msg:
      - "Pulp Server: {{ pulp_base_url }}"
      - "Pulp authentication: configured"
      - "Image: {{ pulp_image }}"

- name: Set up Pulp CLI command
  ansible.builtin.include_tasks: setup_pulp_cli.yml

- name: Pull Pulp container image
  ansible.builtin.include_tasks: pull_image.yml

- name: Deploy Pulp HTTPS container
  ansible.builtin.include_tasks: deploy_container_https.yml
