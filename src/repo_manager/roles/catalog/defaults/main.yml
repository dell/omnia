---
# =============================================================================
# CATALOG ROLE DEFAULTS
# =============================================================================

# ── Paths ──
catalog_scripts_dir: "{{ playbook_dir | dirname }}/plugins/module_utils/catalog"
# Use CATALOG_FILE_PATH env var if set, otherwise use default location
catalog_file: "{{ lookup('env', 'CATALOG_FILE_PATH') | default('/opt/omnia/catalog/catalog_rhel.json', true) }}"
schema_file: "{{ playbook_dir | dirname }}/schemas/catalog_schema.json"
catalog_log_dir: "{{ lookup('env', 'OMNIA_DATA_PATH') | default('/opt/omnia', true) }}/repo_manager/log/catalog"

# ── Generate defaults ──
catalog_name: "default"
force: false

# ── Package defaults (used when [defaults] header absent in input file) ──
default_arch: "x86_64"
default_os: "rhel"
default_os_version: "10.0"

# ── Post-operation validation ──
validate_after: true

# ── Transform defaults ──
# (force is already defined above)

# ── Optimize defaults ──
common_threshold: 10
