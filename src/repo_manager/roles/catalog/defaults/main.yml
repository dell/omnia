---
# =============================================================================
# CATALOG ROLE DEFAULTS
# =============================================================================

# ── Paths ──
catalog_scripts_dir: "{{ playbook_dir | dirname }}/plugins/module_utils/catalog"
catalog_file: "{{ playbook_dir | dirname }}/catalogs/catalog.json"
schema_file: "{{ playbook_dir | dirname }}/schemas/catalog_schema.json"
catalog_log_dir: "{{ repo_manager_log_dir | default('/opt/omnia/repo_manager/log') }}/catalog"

# ── Generate defaults ──
catalog_name: "default"
force: false

# ── Package defaults (used when [defaults] header absent in input file) ──
default_arch: "x86_64"
default_os: "rhel"
default_os_version: "10.0"

# ── Post-operation validation ──
validate_after: true
