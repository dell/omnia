---
# =============================================================================
# CATALOG VALIDATE OPERATION
# =============================================================================

- name: "Ensure log directory exists"
  ansible.builtin.file:
    path: "{{ catalog_log_dir }}"
    state: directory
    mode: "0755"

- name: "Set catalog input file (use catalog_input if provided, otherwise catalog_file)"
  ansible.builtin.set_fact:
    _catalog_input: "{{ catalog_input | default(catalog_file, true) }}"

- name: "Validate catalog"
  ansible.builtin.command:
    cmd: >-
      python3 {{ catalog_scripts_dir }}/catalog_manager.py
      --log-dir {{ catalog_log_dir }}
      validate
      --catalog {{ _catalog_input }}
      --schema {{ schema_file }}
  register: val_result
  changed_when: false
  failed_when: false

- name: "Show validation result"
  ansible.builtin.debug:
    msg: "{{ val_result.stdout_lines }}"
  when: val_result is defined and val_result.stdout_lines is defined

- name: "Fail on validation errors"
  ansible.builtin.fail:
    msg: "{{ catalog_validation_failed_msg }}"
  when: val_result is defined and val_result.rc == 1
