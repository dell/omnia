# =============================================================================
# CATALOG ROLE - MAIN ENTRY POINT
# =============================================================================
# Routes to specific operation based on tags.
# Each operation is in a separate file for isolation.
# =============================================================================

- name: Include catalog generate tasks
  ansible.builtin.include_tasks: generate.yml
  when: "'catalog_generate' in ansible_run_tags"

- name: Include catalog add tasks
  ansible.builtin.include_tasks: add.yml
  when: "'catalog_add' in ansible_run_tags"

- name: Include catalog delete tasks
  ansible.builtin.include_tasks: delete.yml
  when: "'catalog_delete' in ansible_run_tags"

- name: Include catalog validate tasks
  ansible.builtin.include_tasks: validate.yml
  when: "'catalog_validate' in ansible_run_tags"

- name: Include catalog transform tasks
  ansible.builtin.include_tasks: transform.yml
  when: "'catalog_transform' in ansible_run_tags"

- name: Include catalog optimize tasks
  ansible.builtin.include_tasks: optimize.yml
  when: "'catalog_optimize' in ansible_run_tags"
