---
# =============================================================================
# CATALOG ADD OPERATION
# =============================================================================

- name: "Assert input_file is provided for add"
  ansible.builtin.assert:
    that: input_file is defined and input_file | length > 0
    fail_msg: "{{ catalog_input_file_required_msg }}"

- name: "Ensure log directory exists"
  ansible.builtin.file:
    path: "{{ catalog_log_dir }}"
    state: directory
    mode: "0755"

- name: "Set catalog input file (use catalog_input if provided, otherwise catalog_file)"
  ansible.builtin.set_fact:
    _catalog_input: "{{ catalog_input | default(catalog_file, true) }}"
    _output_file: "{{ output_file | default(catalog_file, true) }}"

- name: "Add packages to catalog"
  ansible.builtin.command:
    cmd: >-
      python3 {{ catalog_scripts_dir }}/catalog_manager.py
      --log-dir {{ catalog_log_dir }}
      add
      --input {{ input_file }}
      --catalog {{ _catalog_input }}
      --output {{ _output_file }}
      --default-arch {{ default_arch }}
      --default-os {{ default_os }}
      --default-os-version {{ default_os_version }}
      {{ '--schema ' + schema_file if validate_after | bool else '' }}
  register: add_result
  changed_when: add_result.rc == 0

- name: "Show add result"
  ansible.builtin.debug:
    msg: "{{ add_result.stdout_lines }}"
  when: add_result is defined and add_result.stdout_lines is defined
