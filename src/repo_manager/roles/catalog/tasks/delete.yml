---
# =============================================================================
# CATALOG DELETE OPERATION
# =============================================================================

- name: "Assert input_file is provided for delete"
  ansible.builtin.assert:
    that: input_file is defined and input_file | length > 0
    fail_msg: "{{ catalog_input_file_required_msg }}"

- name: "Ensure log directory exists"
  ansible.builtin.file:
    path: "{{ catalog_log_dir }}"
    state: directory
    mode: "0755"

- name: "Delete packages from catalog"
  ansible.builtin.command:
    cmd: >-
      python3 {{ catalog_scripts_dir }}/catalog_manager.py
      --log-dir {{ catalog_log_dir }}
      delete
      --input {{ input_file }}
      --catalog {{ catalog_file }}
      --output {{ output_file | default(catalog_file) }}
      {{ '--schema ' + schema_file if validate_after | bool else '' }}
  register: del_result
  changed_when: del_result.rc == 0

- name: "Show delete result"
  ansible.builtin.debug:
    msg: "{{ del_result.stdout_lines }}"
  when: del_result is defined and del_result.stdout_lines is defined
