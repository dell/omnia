# =============================================================================
# CATALOG ROLE MESSAGES
# =============================================================================

# ── Error messages ──
catalog_input_file_required_msg: >-
  Required: -e "input_file=path/to/packages.txt"

catalog_generate_exists_msg: >-
  Output file '{{ catalog_file }}' already exists.
  Use -e "force=true" to overwrite.

catalog_file_not_found_msg: >-
  Catalog file '{{ catalog_file }}' not found.
  Generate a catalog first with --tags catalog_generate.

catalog_parse_error_msg: >-
  Failed to parse input file. Check the format and try again.
  See docs/catalog_operations.md for format details.

catalog_validation_failed_msg: >-
  Catalog validation failed. See errors above.

# ── Success messages ──
catalog_generate_success_msg: >-
  Successfully generated catalog at {{ catalog_file }}.

catalog_add_success_msg: >-
  Successfully added packages to catalog.

catalog_delete_success_msg: >-
  Successfully deleted packages from catalog.

catalog_validate_success_msg: >-
  Catalog validation passed.
