---
# =============================================================================
# REPOSITORY ACCESS ROLE VARIABLES
# =============================================================================

# Usage: check_rhel_subscription.yml
rhel_repo_cert_dir: "{{ rhel_repo_certs_dir }}"
rhel_version: "{{ cluster_os_version.split('.')[0] }}"
redhat_uep_cert: "/etc/rhsm/ca/redhat-uep.pem"
entitlement_path: "/etc/pki/entitlement"
redhat_repo_file: "/etc/yum.repos.d/redhat.repo"

# Usage: configure_rhel_os_urls.yml
local_repo_config_path: "{{ repo_manager_config_file }}"
omnia_rhel_cert_dir: "{{ rhel_repo_cert_dir }}"
required_repos_by_arch:
  x86_64: >-
    {{ (catalog_context.referenced_repositories.get('x86_64', []) |
        intersect(platform_profiles.rhel.subscription_repositories))
       if 'x86_64' in selected_architectures else [] }}
  aarch64: >-
    {{ (catalog_context.referenced_repositories.get('aarch64', []) |
        intersect(platform_profiles.rhel.subscription_repositories))
       if 'aarch64' in selected_architectures else [] }}
required_repos: >-
  {{ (required_repos_by_arch.x86_64 + required_repos_by_arch.aarch64) | unique }}
