---
namespace: omnia
name: repo_manager
version: 3.0.0
readme: README.md
authors:
  - Dell Technologies <omnia-support@dell.com>
description: >-
  Dell Omnia Repo Manager — manages Pulp content server for offline HPC cluster
  provisioning. Downloads and manages RPM repositories, container images, Python
  packages, and other content types. Supports x86_64 and aarch64 architectures
  with tag-based execution for selective operations.
license:
  - Apache-2.0
tags:
  - hpc
  - infrastructure
  - pulp
  - repomanager
  - dell
  - omnia
dependencies:
  community.general: ">=5.0.0"
  containers.podman: ">=1.10.0"
  ansible.posix: ">=2.0.0"
repository: https://github.com/dell/omnia
documentation: https://github.com/dell/omnia/tree/main/docs
homepage: https://github.com/dell/omnia
issues: https://github.com/dell/omnia/issues
build_ignore:
  - "*.tar.gz"
  - "*.cfg"
  - .gitignore
  - Makefile
  - __pycache__
  - "**/__pycache__"
  - ansible_collections
  - ansible_collections/*
  - input
  - input/*
