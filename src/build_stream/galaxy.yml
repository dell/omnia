---
namespace: omnia
name: build_stream
version: 3.0.0
readme: README.md
authors:
  - Dell Technologies <omnia-support@dell.com>
description: >-
  Dell Omnia Build Stream — deploys a RESTful API service (FastAPI + Podman)
  that orchestrates software catalog parsing, local repository creation,
  image building, and CI/CD pipelines via GitLab CE. Includes PostgreSQL
  database, BuildStream Manager container, and playbook watcher service.
license:
  - Apache-2.0
tags:
  - infrastructure
  - hpc
  - buildstream
  - gitlab
  - dell
  - omnia
dependencies:
  community.general: ">=5.0.0"
  containers.podman: ">=1.10.0"
repository: https://github.com/dell/omnia
documentation: https://github.com/dell/omnia/tree/main/docs
homepage: https://github.com/dell/omnia
issues: https://github.com/dell/omnia/issues
build_ignore:
  - "*.tar.gz"
  - "*.cfg"
  - .gitignore
  - __pycache__
  - "**/__pycache__"
  - ansible_collections
  - ansible_collections/*
  - containers
  - containers/*
  - input
  - input/*
  - app
  - app/*
  - tests
  - tests/*
