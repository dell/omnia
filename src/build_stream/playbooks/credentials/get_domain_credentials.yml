# =============================================================================
# GET DOMAIN CREDENTIALS — Orchestrator-Level Credential Collection
# =============================================================================
# Collects credentials for downstream domains (repo_manager, image_build_manager)
# so that their playbooks can run non-interactively when invoked by the
# BuildStream CI/CD pipeline.
#
# This playbook reuses the credential roles from each domain — no new
# credential logic is introduced.
#
# DECOUPLING PRINCIPLE:
#   Credentials and domain config files are independent.  This playbook
#   does NOT load any domain config file (repo_manager_config.yml,
#   image_build_config.yml).  All credentials are prompted unconditionally.
#   Config files arrive later from GitLab at CI runtime; credentials are
#   collected here during the interactive BuildStream setup phase.
#
# Credential files are placed at each domain's runtime input directory:
#   /opt/omnia/repo_manager/input/<project>/repo_manager_config_credentials.yml
#   /opt/omnia/image_build_manager/input/<project>/image_build_credentials.yml
#
# These files are NOT pushed to GitLab — only config files are synced.
# Credentials remain local on the OIM host, vault-encrypted at rest.
#
# Usage (standalone):
#   cd src/build_stream/playbooks/credentials
#   ansible-playbook get_domain_credentials.yml
#
# Usage (from build_stream.yml — automatic):
#   This playbook is imported by build_stream.yml after the build_stream
#   credential_utility play.
#
# Prerequisites:
#   - OMNIA_DATA_PATH and OMNIA_PROJECT_NAME env vars (or defaults)
# =============================================================================

# -----------------------------------------------------------------------
# Play 1: Resolve common paths from environment
# -----------------------------------------------------------------------
- name: Resolve domain credential paths
  hosts: localhost
  connection: local
  gather_facts: false
  tags: always
  tasks:
    - name: Set domain data paths from environment
      ansible.builtin.set_fact:
        _domain_cred_omnia_data_path: "{{ lookup('env', 'OMNIA_DATA_PATH') | default('/opt/omnia', true) }}"
        _domain_cred_project_name: "{{ lookup('env', 'OMNIA_PROJECT_NAME') | default('project_default', true) }}"
        # Resolve the omnia src/ root from this playbook's location:
        #   src/build_stream/playbooks/credentials/ -> 3 dirnames up -> src/
        _omnia_src_root: "{{ playbook_dir | dirname | dirname | dirname }}"
        cacheable: true

    - name: Set per-domain input directories
      ansible.builtin.set_fact:
        _repo_manager_input_dir: "{{ _domain_cred_omnia_data_path }}/repo_manager/input/{{ _domain_cred_project_name }}"
        _image_build_input_dir: "{{ _domain_cred_omnia_data_path }}/image_build_manager/input/{{ _domain_cred_project_name }}"
        cacheable: true

    - name: Ensure repo_manager input directory exists
      ansible.builtin.file:
        path: "{{ _repo_manager_input_dir }}"
        state: directory
        mode: "0755"

    - name: Ensure image_build_manager input directory exists
      ansible.builtin.file:
        path: "{{ _image_build_input_dir }}"
        state: directory
        mode: "0755"

# -----------------------------------------------------------------------
# Play 2: Repo Manager credentials
# -----------------------------------------------------------------------
# Reuses repo_manager/roles/credential with input_project_dir pointed
# at the repo_manager runtime input directory.
#
# The role loads its own vars/messages.yml and templates automatically
# via {{ role_path }}.  We supply credential_vars.yml (credential_files,
# repo_manager_credentials) for the credential definitions.
#
# DECOUPLED: software_names is pre-set to [] so the role's validate.yml
# never attempts to load repo_manager_config.yml.  The only service key
# in credential_vars.yml is "local_repo", which always passes the filter
# (service.key == "local_repo") regardless of software_names.
# -----------------------------------------------------------------------
- name: Collect Repo Manager credentials
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    # Load credential file definitions and prompt config from repo_manager
    - ../../../repo_manager/vars/credential_vars.yml
  tags: always
  tasks:
    - name: Run repo_manager credential role (validate, create, prompt)
      ansible.builtin.include_role:
        name: "{{ _omnia_src_root }}/repo_manager/roles/credential"
      vars:
        credential_action: all
        # DECOUPLED: Override input_project_dir at include_role param level
        # (Ansible precedence 20) to point at repo_manager's runtime input,
        # overriding build_stream_setup's set_fact (precedence 19).
        input_project_dir: "{{ _repo_manager_input_dir }}"
        # DECOUPLED: Pre-set software_names at include_role param level
        # (Ansible precedence 20) so the role's validate.yml set_fact
        # (precedence 19) cannot override it with config-derived values.
        # "local_repo" credentials always pass the filter independently
        # via: service.key == "local_repo"
        software_names: []

# -----------------------------------------------------------------------
# Play 3: Image Build Manager credentials
# -----------------------------------------------------------------------
# Reuses image_build_manager/roles/collect_build_credentials.
# The role is self-contained — it defines its own credential file paths,
# templates, and prompt logic in vars/main.yml.
#
# DECOUPLED: image_build_cred_config is overridden via include_role vars
# (Ansible precedence: role params > role vars/main.yml).  All conditional
# entries use condition: true instead of config-dependent expressions.
# No domain config file is loaded.
#
# Effect on each credential:
#   s3_secret_key        — mandatory, always prompted, must be non-empty
#   s3_access_id         — always prompted, may be left empty
#                          (prompt_credential_field.yml skips username
#                          validation when cred_field.condition is defined)
#   aarch64_ssh_password — always prompted, must be non-empty
#                          (password validation is unconditional)
# -----------------------------------------------------------------------
- name: Collect Image Build Manager credentials
  hosts: localhost
  connection: local
  gather_facts: false
  tags: always
  tasks:
    - name: Run image_build_manager credential role (validate, create, prompt)
      ansible.builtin.include_role:
        name: "{{ _omnia_src_root }}/image_build_manager/roles/collect_build_credentials"
      vars:
        # DECOUPLED: Override input_project_dir at include_role param level
        # (Ansible precedence 20) to point at image_build_manager's runtime input,
        # overriding build_stream_setup's set_fact (precedence 19).
        input_project_dir: "{{ _image_build_input_dir }}"
        # DECOUPLED: Override the role's vars/main.yml credential config to remove
        # config-file-dependent conditions.  All credentials are prompted
        # unconditionally during BuildStream setup.
        image_build_cred_config:
          mandatory:
            - password: s3_secret_key
          conditional_mandatory:
            - username: s3_access_id
              condition: true
            - password: aarch64_ssh_password
              condition: true
