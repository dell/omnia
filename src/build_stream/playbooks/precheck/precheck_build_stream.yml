---
# precheck_build_stream.yml — Verify prerequisite domains are ready.
#
# Checks that repo_manager and image_build_manager have completed
# prepare-base: containers running, credentials present, outputs exist.
#
# Usage:
#   ansible-playbook build_stream.yml --tags precheck

- name: Precheck — verify prerequisite domains are ready
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - precheck_build_stream
