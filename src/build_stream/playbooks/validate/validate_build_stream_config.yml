---
# validate_build_stream_config.yml — Validate build_stream input files.
#
# Runs L1 JSON Schema validation and L2 cross-field validation for:
#   - build_stream_config.yml
#   - build_stream_credentials.yml (when present and not Vault-encrypted)
#
# Usage:
#   ansible-playbook build_stream.yml --tags validate

- name: Validate build_stream configuration
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Load build_stream_config.yml
      ansible.builtin.include_vars:
        file: "{{ input_project_dir }}/build_stream_config.yml"

    - name: Run BuildStream input validation
      ansible.builtin.include_role:
        name: validate_build_stream_input
        apply:
          tags:
            - always
      tags:
        - always
