---
- name: Calculate BuildStream effective PXE inventory
  hosts: localhost
  connection: local
  gather_facts: true
  pre_tasks:
    - name: Stop when BuildStream restart context is absent
      ansible.builtin.meta: end_play
      when: >-
        not (enable_build_stream | default(false) | bool)
        or (job_id | default('') | string | length != 36)
        or not ((job_id | default('') | string) is match('^[0-9a-fA-F-]+$'))
  tasks:
    - name: Initialize Orchestrator PXE environment
      ansible.builtin.include_role:
        name: pxe_boot_setup

    - name: Calculate effective inventory for BuildStream retry
      ansible.builtin.include_role:
        name: pxe_buildstream_manager
        tasks_from: generate_effective_csv.yml
      when: not (pxe_boot_skip | default(false) | bool)
