---
- name: Prepare BuildStream PXE retry inventory
  ansible.builtin.import_playbook: pre_pxe.yml
  when: &buildstream_restart_enabled >-
    (enable_build_stream | default(false) | bool)
    and job_id is defined
    and (job_id | string | length == 36)
    and ((job_id | string) is match('^[0-9a-fA-F-]+$'))

- name: Run Orchestrator PXE boot
  ansible.builtin.import_playbook: ../../../orchestrator/playbooks/pxeboot/pxeboot.yml
  when:
    - *buildstream_restart_enabled
    - not (bsm_skip_pxe | default(false) | bool)
  vars:
    defer_pxe_failure: true

- name: Persist BuildStream PXE restart results
  ansible.builtin.import_playbook: post_pxe.yml
  when: *buildstream_restart_enabled
