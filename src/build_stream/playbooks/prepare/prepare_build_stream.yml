---
# prepare_build_stream.yml — Deploy Postgres + GitLab + BuildStream Manager (BSM)
#
# This playbook brings up the infrastructure required by BuildStream:
#   - PostgreSQL database (for BSM state)
#   - GitLab CE (for CI/CD pipeline)
#   - BuildStream Manager container (omnia_build_stream)
#
# Pre-checks: None (first build_stream step)
# Output:     build_stream_status.yml written to output/

- name: Prepare BuildStream infrastructure
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    bs_cred_file: "{{ input_project_dir | default(playbook_dir ~ '/../../input') }}/build_stream_credentials.yml"
    bs_vault_file: "{{ input_project_dir | default(playbook_dir ~ '/../../input') }}/.build_stream_credentials_key"
    ib_cred_file: "{{ omnia_data_path }}/image_build_manager/input/{{ project_name }}/image_build_credentials.yml"
    ib_vault_file: "{{ omnia_data_path }}/image_build_manager/input/{{ project_name }}/.image_build_credentials_key"
  tasks:
    - name: Load build_stream configuration
      ansible.builtin.include_vars:
        file: "{{ input_project_dir | default(playbook_dir ~ '/../../input') }}/build_stream_config.yml"

    - name: Validate enable_build_stream is set
      ansible.builtin.assert:
        that:
          - enable_build_stream is defined
        fail_msg: "enable_build_stream must be defined in build_stream/build_stream_config.yml"

    - name: Skip BuildStream setup when disabled
      ansible.builtin.meta: end_play
      when: not (enable_build_stream | default(false) | bool)

    - name: Load build_stream credentials for Postgres
      block:
        - name: Check if build_stream credentials file exists
          ansible.builtin.stat:
            path: "{{ bs_cred_file }}"
          register: bs_cred_stat

        - name: Fail if build_stream credentials not found
          ansible.builtin.fail:
            msg: >-
              Build Stream credentials file not found at {{ bs_cred_file }}.
              Run the credential utility first: ansible-playbook build_stream.yml
          when: not bs_cred_stat.stat.exists

        - name: Check if credentials file is encrypted
          ansible.builtin.shell: >-
            set -o pipefail && head -n1 "{{ bs_cred_file }}" | grep -q '\$ANSIBLE_VAULT;'
          register: bs_cred_encrypted
          changed_when: false
          failed_when: false

        - name: Decrypt build_stream credentials
          ansible.builtin.command: >-
            ansible-vault decrypt "{{ bs_cred_file }}"
            --vault-password-file "{{ bs_vault_file }}"
          when: bs_cred_encrypted.rc == 0
          changed_when: false

        - name: Load build_stream credentials
          ansible.builtin.include_vars:
            file: "{{ bs_cred_file }}"
          no_log: true

        - name: Re-encrypt build_stream credentials
          ansible.builtin.command: >-
            ansible-vault encrypt "{{ bs_cred_file }}"
            --vault-password-file "{{ bs_vault_file }}"
          when: bs_cred_encrypted.rc == 0
          changed_when: false
      rescue:
        - name: Re-encrypt on failure
          ansible.builtin.command: >-
            ansible-vault encrypt "{{ bs_cred_file }}"
            --vault-password-file "{{ bs_vault_file }}"
          changed_when: false
          failed_when: false

        - name: Fail with credential loading error
          ansible.builtin.fail:
            msg: "Failed to load build_stream credentials. Check file and vault key at {{ bs_cred_file }}."

    - name: Set build_stream auth vars from auth_registration dict (backwards compat)
      ansible.builtin.set_fact:
        build_stream_auth_username: "{{ auth_registration.username | default('') }}"
        build_stream_auth_password: "{{ auth_registration.password | default('') }}"
        build_stream_auth_password_hash: "{{ auth_registration.password_hash | default('') }}"
      no_log: true
      when:
        - auth_registration is defined
        - build_stream_auth_username is not defined

    - name: Validate postgres credentials are set
      ansible.builtin.assert:
        that:
          - postgres_user | default('') | length > 0
          - postgres_password | default('') | length > 0
        fail_msg: >-
          postgres_user and postgres_password must be set in build_stream credentials.
          Re-run the credential utility to provide these values.

    - name: Load image-build credentials for authenticated MinIO access
      block:
        - name: Check image-build credential files
          ansible.builtin.stat:
            path: "{{ item }}"
          loop:
            - "{{ ib_cred_file }}"
            - "{{ ib_vault_file }}"
          register: ib_credential_files

        - name: Require image-build credentials and Vault key
          ansible.builtin.assert:
            that:
              - ib_credential_files.results | map(attribute='stat.exists') | min
            fail_msg: >-
              Image-build credentials are required for Build Stream MinIO access.
              Run the image_build_manager credential workflow first.

        - name: Check whether image-build credentials are encrypted
          ansible.builtin.shell: >-
            set -o pipefail && head -n1 "{{ ib_cred_file }}" | grep -q '\$ANSIBLE_VAULT;'
          args:
            executable: /bin/bash
          register: ib_cred_encrypted
          changed_when: false
          failed_when: false

        - name: Decrypt image-build credentials
          ansible.builtin.command: >-
            ansible-vault decrypt "{{ ib_cred_file }}"
            --vault-password-file "{{ ib_vault_file }}"
          when: ib_cred_encrypted.rc == 0
          changed_when: false
          no_log: true

        - name: Read image-build credentials
          ansible.builtin.include_vars:
            file: "{{ ib_cred_file }}"
            name: image_build_credentials
          no_log: true

        - name: Re-encrypt image-build credentials
          ansible.builtin.command: >-
            ansible-vault encrypt "{{ ib_cred_file }}"
            --vault-password-file "{{ ib_vault_file }}"
          when: ib_cred_encrypted.rc == 0
          changed_when: false
          no_log: true

        - name: Validate MinIO credentials for Build Stream
          ansible.builtin.assert:
            that:
              - image_build_credentials.s3_access_id | default('') | length > 0
              - image_build_credentials.s3_secret_key | default('') | length >= 8
            fail_msg: "Valid S3 credentials are required for Build Stream."
            quiet: true
      rescue:
        - name: Re-encrypt image-build credentials after load failure
          ansible.builtin.command: >-
            ansible-vault encrypt "{{ ib_cred_file }}"
            --vault-password-file "{{ ib_vault_file }}"
          when: ib_cred_encrypted.rc | default(1) == 0
          changed_when: false
          failed_when: false
          no_log: true

        - name: Fail when image-build credentials cannot be loaded
          ansible.builtin.fail:
            msg: "Failed to load image-build credentials required by Build Stream."

    - name: Set SELinux option
      ansible.builtin.set_fact:
        selinux_option: ":z"

    - name: Register OIM host for BuildStream deployment
      ansible.builtin.add_host:
        name: oim
        groups: oim
        ansible_host: 127.0.0.1
        ansible_connection: local
        postgres_user: "{{ postgres_user }}"
        postgres_password: "{{ postgres_password }}"
        build_stream_host_ip: "{{ build_stream_host_ip }}"
        build_stream_port: "{{ build_stream_port | default(8010) }}"
        oim_shared_path: "{{ oim_shared_path }}"
        selinux_option: "{{ selinux_option }}"
      no_log: true

# ── App code deployment ───────────────────────────────────────────
# App source code is deployed to NFS via domain-init.sh (called by
# omnia.sh --setup-venv). No temp container extraction needed.
# The container mounts {{ omnia_path }} at /opt/omnia at runtime.

- name: Deploy Postgres container for BuildStream
  hosts: oim
  gather_facts: false
  tasks:
    - name: Deploy Postgres
      ansible.builtin.include_role:
        name: postgres
        apply:
          tags:
            - prepare
            - build
            - upgrade
      tags:
        - prepare
        - build
      when: hostvars['localhost']['enable_build_stream'] | default(false) | bool

- name: Deploy BuildStream Manager (BSM) container and watcher service
  hosts: oim
  gather_facts: true
  tasks:
    - name: Deploy BSM
      ansible.builtin.include_role:
        name: deploy_bsm
        apply:
          tags:
            - prepare
            - build
            - upgrade
      tags:
        - prepare
        - build
      when: hostvars['localhost']['enable_build_stream'] | default(false) | bool

- name: Write BuildStream status
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Write build_stream_status.yml
      ansible.builtin.copy:
        content: |
          ---
          overall_status: "prepared"
          build_stream_host: "{{ build_stream_host_ip | default('') }}"
          build_stream_port: {{ build_stream_port | default(8010) }}
          gitlab_host: "{{ gitlab_host | default('') }}"
          gitlab_https_port: {{ gitlab_https_port | default(443) }}
          gitlab_url: "https://{{ gitlab_host | default('') }}:{{ gitlab_https_port | default(443) }}"
          bsm_api_url: "https://{{ build_stream_host_ip | default('') }}:{{ build_stream_port | default(8010) }}"
        dest: "{{ output_project_dir }}/build_stream_status.yml"
        mode: "0644"
      when: enable_build_stream | default(false) | bool
