---
# cleanup_build_stream.yml — BSM + Postgres + NFS cleanup for BuildStream
#
# Cleans up the BuildStream infrastructure (NOT GitLab):
#   1. Stops and removes omnia_build_stream container & quadlet service
#   2. Stops and removes playbook_watcher service
#   3. Removes automation framework (molecule/validate)
#   4. Stops and removes omnia_postgres container & quadlet service
#   5. Cleans up NFS directories (logs, queue, SSL, inventory, etc.)
#   6. Removes build_stream credential files
#
# GitLab cleanup is handled separately by cleanup_gitlab.yml.
# When invoked from build_stream.yml --tags cleanup, both are imported separately.
#
# Usage (standalone):
#   cd /omnia/build_stream && ansible-playbook playbooks/cleanup/cleanup_build_stream.yml
#
# To also delete postgres data (default: preserved):
#   ansible-playbook playbooks/cleanup/cleanup_build_stream.yml -e postgres_backup=false

# ── Step 1: Self-contained setup (input dirs + OIM group + metadata) ─
- name: Build Stream setup (input dirs + OIM group + metadata)
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: ../../roles/build_stream_setup
      vars:
        create_oim_group: true

# ── Step 3: Container, service, and NFS cleanup on OIM host ────────
- name: BuildStream domain cleanup (container, postgres, NFS)
  hosts: oim
  gather_facts: true
  roles:
    - cleanup_build_stream
