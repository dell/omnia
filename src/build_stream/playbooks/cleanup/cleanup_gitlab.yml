---
# cleanup_gitlab.yml — Remove all GitLab configurations
# Originated from: src/playbooks/gitlab/cleanup_gitlab.yml
# Usage: ansible-playbook playbooks/cleanup_gitlab.yml  (from src/build_stream/)

- name: Set_fact for fetch omnia config credentials
  hosts: localhost
  connection: local
  tasks:
    - name: Set dynamic run tags including 'gitlab'
      when: not config_file_status | default(false) | bool
      ansible.builtin.set_fact:
        omnia_run_tags: "{{ ['build_stream', 'gitlab'] }}"
        cacheable: true

- name: Build Stream setup (input dirs)
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: ../../roles/build_stream_setup
      when: not build_stream_setup_done | default(false) | bool

- name: Load build_stream domain credentials
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Load build_stream credential paths
      ansible.builtin.include_vars:
        file: "{{ hostvars['localhost']['input_project_dir'] }}/build_stream_config.yml"
      failed_when: false

    - name: Set credential file paths
      ansible.builtin.set_fact:
        bs_credential_file_path: "{{ hostvars['localhost']['input_project_dir'] }}/build_stream_credentials.yml"
        bs_credential_vault_path: "{{ hostvars['localhost']['input_project_dir'] }}/.build_stream_credentials_key"

    - name: Decrypt and include build_stream credentials
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../roles/credential_utility/tasks/decrypt_include_encrypt.yml"
      vars:
        credential_file_path: "{{ bs_credential_file_path }}"
        vault_password_file: "{{ bs_credential_vault_path }}"

- name: Prepare GitLab host credentials for cleanup
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Load BuildStream configuration inputs
      ansible.builtin.include_vars:
        file: "{{ hostvars['localhost']['input_project_dir'] }}/build_stream_config.yml"
      delegate_to: localhost
      run_once: true

    - name: Ensure gitlab_host is provided in build_stream_config.yml
      ansible.builtin.assert:
        that:
          - gitlab_host is defined
          - gitlab_host | string | length > 0
        fail_msg: "gitlab_host is not set. Provide gitlab_host in input/build_stream_config.yml"

    - name: Ensure GitLab SSH password is available
      ansible.builtin.assert:
        that:
          - hostvars['localhost']['gitlab_ssh_password'] | default('') | length > 0
        fail_msg: "GitLab SSH password not found. Run build_stream credential utility to populate gitlab_ssh_password."

    - name: Register GitLab SSH credentials for cleanup
      ansible.builtin.add_host:
        name: "{{ gitlab_host }}"
        groups: gitlab_server
        ansible_host: "{{ gitlab_host }}"
        ansible_user: "{{ gitlab_ansible_user | default('root') }}"
        ansible_password: "{{ hostvars['localhost']['gitlab_ssh_password'] }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
        gitlab_host: "{{ gitlab_host }}"
      no_log: true

- name: Comprehensive GitLab Cleanup
  hosts: gitlab_server
  become: true
  gather_facts: true
  pre_tasks:
    - name: Load BuildStream configuration inputs
      ansible.builtin.include_vars:
        file: "{{ hostvars['localhost']['input_project_dir'] }}/build_stream_config.yml"
  roles:
    - cleanup_gitlab

  post_tasks:
    - name: Gather installed packages for verification
      ansible.builtin.package_facts:
        manager: auto
      failed_when: false

    - name: Verify GitLab packages are removed
      ansible.builtin.set_fact:
        gitlab_packages_present: >-
          {{
            (
              ansible_facts.packages | default({})
            )
            | dict2items
            | selectattr('key', 'match', '^(gitlab(-|$)|gitlab-).*$')
            | list
            | length
            > 0
          }}

    - name: Verify GitLab directories are removed
      ansible.builtin.stat:
        path: "{{ item }}"
      register: gitlab_dirs_final_check
      loop:
        - "/etc/gitlab"
        - "/var/opt/gitlab"
        - "/var/log/gitlab"
      failed_when: false

    - name: Verify GitLab processes are stopped
      ansible.builtin.command: ps aux | grep gitlab | grep -v grep
      register: gitlab_processes_check
      failed_when: false
      changed_when: false

    - name: Set cleanup validation status
      ansible.builtin.set_fact:
        cleanup_validated: >-
          {{
            (not (gitlab_packages_present | default(false) | bool))
            and ((gitlab_dirs_final_check.results | selectattr('stat.exists') | list | length) == 0)
            and (gitlab_processes_check.stdout == '')
          }}
