---
# cleanup_build_stream_domain.yml — LOCAL BuildStream infrastructure cleanup.
#
# This holds the actual local cleanup plays for the BuildStream domain:
#   1. Stops and removes omnia_build_stream container & quadlet service
#   2. Stops and removes playbook-watcher service
#   3. Removes automation framework (molecule/validate)
#   4. Stops and removes omnia_postgres container & quadlet service
#   5. Cleans up NFS directories (logs, queue, SSL, inventory, etc.)
#   6. Removes build_stream credential files (unless cleanup_credentials=false)
#
# It performs NO GitLab cleanup and NO warning/pause. The orchestration
# (optional GitLab cleanup + the BuildStream-only warning/pause) lives in the
# wrapper cleanup_build_stream.yml. This separation (per OMN-DEF #1428) avoids
# recursive imports and lets the combined 'cleanup' flow reuse these plays
# without re-triggering the standalone warning.
#
# Not intended to be run directly by end users — use cleanup_build_stream.yml.

# ── Self-contained setup (input dirs + OIM group + metadata) ─────────
- name: Build Stream setup (input dirs + OIM group + metadata)
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: ../../roles/build_stream_setup
      vars:
        create_oim_group: true

# ── Container, service, and NFS cleanup on OIM host ──────────────────
- name: BuildStream domain cleanup (container, postgres, NFS)
  hosts: oim
  gather_facts: true
  roles:
    - cleanup_build_stream
