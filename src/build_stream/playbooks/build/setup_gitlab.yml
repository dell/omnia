---
# setup_gitlab.yml — Configure GitLab CI/CD for BuildStream
# Originated from: src/playbooks/gitlab/gitlab.yml
# Usage: ansible-playbook playbooks/setup_gitlab.yml  (from src/build_stream/)

- name: Set_fact for fetch omnia config credentials
  hosts: localhost
  connection: local
  tasks:
    - name: Set dynamic run tags including 'gitlab'
      when: omnia_run_tags is not defined
      ansible.builtin.set_fact:
        omnia_run_tags: "{{ ['build_stream', 'gitlab'] }}"
        cacheable: true

- name: Build Stream setup (input dirs + OIM group)
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: ../../roles/build_stream_setup
      vars:
        create_oim_group: true
      when: not build_stream_setup_done | default(false) | bool

- name: Prepare GitLab host credentials from provision secrets
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Prerequisite checks
      ansible.builtin.include_role:
        name: hosted_gitlab
        tasks_from: prereq_checks.yml

- name: Validate BuildStream prerequisites
  hosts: oim
  gather_facts: false
  tasks:
    - name: Prerequisite checks
      ansible.builtin.include_role:
        name: hosted_gitlab
        tasks_from: check_oim_prerequisites.yml

- name: Deploy GitLab CE on target host (hosted mode)
  hosts: gitlab_server
  become: true
  gather_facts: true
  tasks:
    - name: Bootstrap passwordless SSH
      ansible.builtin.include_role:
        name: gitlab_passwordless_ssh

    - name: Run hosted GitLab deployment
      ansible.builtin.include_role:
        name: hosted_gitlab
