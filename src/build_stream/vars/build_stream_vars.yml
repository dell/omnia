---
# build_stream_vars.yml — Shared variables for build_stream domain
# This file contains variables that are shared across multiple roles in the build_stream domain

# BuildStream Manager (BSM) Configuration
bsm_port: 8010
bsm_host: "0.0.0.0"
bsm_log_level: "INFO"

# GitLab Configuration
gitlab_version: "16.7.0"
gitlab_root_password: "{{ vault_gitlab_root_password | default('changeme') }}"

# PostgreSQL Configuration
postgres_port: 5432
postgres_db: "buildstream"
postgres_user: "buildstream"
postgres_password: "{{ vault_postgres_password | default('changeme') }}"

# Container Configuration
bsm_container_name: "omnia_build_stream"
bsm_container_image: "omnia_build_stream:latest"

# Playbook Watcher Configuration
playbook_watcher_enabled: true
playbook_watcher_interval: 5
