# ============================================================================
# SAMPLE: build_stream_status.yml -- build_stream output contract
# ============================================================================
#
# This is a REFERENCE TEMPLATE showing the output produced by
# build_stream after a successful setup.
#
# Runtime location (created by build_stream):
#   /opt/omnia/output/build_stream/build_stream_status.yml
#
# Producer: build_stream domain (prepare_build_stream role)
# Consumer: CI/CD pipelines, operators, playbook-watcher
#
# Fields:
#   overall_status  -- "prepared" | "running" | "failed"
#   gitlab_host     -- IP where GitLab CE is deployed
#   gitlab_https_port -- HTTPS port
#   gitlab_url      -- Full GitLab HTTPS URL
#   build_stream_host -- IP where BSM API runs (OIM server)
#   build_stream_port -- BSM API listen port
#   bsm_api_url     -- Full BSM API base URL
# ============================================================================

overall_status: "prepared"

# --- GitLab Endpoints ---
gitlab_host: "10.0.0.50"
gitlab_https_port: 443
gitlab_url: "https://10.0.0.50:443"

# --- BuildStream Manager (BSM) API ---
build_stream_host: "10.0.0.100"
build_stream_port: 8010
bsm_api_url: "https://10.0.0.100:8010"
