# BuildStream Configuration
#
# Paths support ${VAR} expansion from the process environment.
# OMNIA_DATA_PATH defaults to /opt/omnia if not set.

[paths]
build_stream_base_path = ${OMNIA_DATA_PATH}/build_stream_root

[artifact_store]
backend = file_store
working_dir = /tmp/build_stream

[file_store]
base_path = ${OMNIA_DATA_PATH}/build_stream_root/artifacts

# Pipeline log query API (GET /api/v1/jobs/{job_id}/logs).
# Every key is optional; the values below are the built-in defaults.
[log_query]
# Container path of the published job logs (<job_id>/<stage log file>).
log_root = ${OMNIA_DATA_PATH}/build_stream/log
# Lines returned when tail_lines is omitted.
default_tail_lines = 50
# Upper bound for tail_lines (hard limit 10000).
max_tail_lines = 10000
# Maximum log bytes returned per stage (full=true or tail); 10 MiB.
max_response_bytes = 10485760
# Log query requests allowed per OAuth client per minute.
rate_limit_per_minute = 60
# Log query requests served concurrently across all clients.
max_concurrent = 5

