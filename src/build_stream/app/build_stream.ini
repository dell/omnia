# BuildStream Configuration
#
# Paths support ${VAR} expansion from the process environment.
# OMNIA_DATA_PATH defaults to /opt/omnia if not set.

[paths]
build_stream_base_path = ${OMNIA_DATA_PATH}/build_stream_root

[artifact_store]
backend = file_store
working_dir = /tmp/build_stream

[file_store]
base_path = ${OMNIA_DATA_PATH}/build_stream_root/artifacts

