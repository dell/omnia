# ============================================================================
# Playbook Path Mapping — Build Stream Domain (Domain-Segregated)
# ============================================================================
#
# This file maps logical playbook names to their absolute paths on the OIM
# host filesystem.  It is the SINGLE SOURCE OF TRUTH for every playbook
# invocation from the Build Stream API and the playbook-watcher service.
#
# Domain segregation (Omnia 2.3):
#   - The omnia_core container is retired.
#   - Playbooks run directly on the OIM host via the shared venv.
#   - Each domain owns its playbooks under src/<domain>/playbooks/.
#   - The playbook watcher cds into the playbook directory and runs
#     ansible-playbook from the venv (OMNIA_VENV_PATH).
#
# Format:
#   <playbook_filename>: <relative_path_under_OMNIA_SRC_PATH>
#
# Path resolution:
#   Paths below are relative to OMNIA_SRC_PATH (the omnia/src/ directory).
#   The playbook registry and playbook watcher resolve them at load time
#   by prepending the value of the OMNIA_SRC_PATH environment variable.
#   If OMNIA_SRC_PATH is not set, it is auto-detected from the source tree.
# ============================================================================

playbook_paths:

  # --- Build Pipeline: Step 1 — Repo Manager ---
  repo_manager.yml: "repo_manager/playbooks/repo_manager.yml"

  # --- Build Pipeline: Step 2 — Image Build Manager ---
  image_build_manager.yml: "image_build_manager/playbooks/image_build_manager.yml"

  # --- Deploy Pipeline: Orchestrator (replaces standalone provision.yml) ---
  orchestrator.yml: "orchestrator/playbooks/orchestrator.yml"

  # --- Discovery / Provisioning playbooks (legacy — retained for backward compat) ---
  discovery.yml: "/omnia/discovery/playbooks/discovery.yml"
  provision.yml: "/omnia/provision/provision.yml"

  # --- Local Repository playbook ---
  local_repo.yml: "/omnia/local_repo/local_repo.yml"

  # --- Utility playbooks ---
  set_pxe_boot.yml: "/omnia/utils/set_pxe_boot.yml"
