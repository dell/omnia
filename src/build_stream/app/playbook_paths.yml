---
# ============================================================================
# Playbook Path Mapping — Build Stream Domain
# ============================================================================
#
# This file maps logical playbook names to their absolute paths inside the
# omnia_core container.  It is the SINGLE SOURCE OF TRUTH for every playbook
# invocation from the Build Stream API and the playbook-watcher service.
#
# When domain segregation is complete, update the paths here — no code changes
# needed in the API or watcher.
#
# Format:
#   <playbook_filename>: <absolute_path_inside_omnia_core_container>
#
# ============================================================================

playbook_paths:

  # --- Build Stream domain playbooks (inside omnia_core /omnia/) ---
  include_input_dir.yml: "/omnia/utils/include_input_dir.yml"

  # --- Build Image playbooks ---
  build_image_aarch64.yml: "/omnia/build_image_aarch64/build_image_aarch64.yml"
  build_image_x86_64.yml: "/omnia/build_image_x86_64/build_image_x86_64.yml"

  # --- Discovery / Provisioning playbooks ---
  discovery.yml: "/omnia/discovery/discovery.yml"
  provision.yml: "/omnia/provision/provision.yml"

  # --- Local Repository playbook ---
  local_repo.yml: "/omnia/local_repo/local_repo.yml"

  # --- Utility playbooks ---
  set_pxe_boot.yml: "/omnia/utils/set_pxe_boot.yml"
