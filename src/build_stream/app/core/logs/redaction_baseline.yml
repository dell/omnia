# Baseline redaction policy (ER-BSM-003 FR-3.3), shipped with BuildStream.
# These are the rules that were hard-coded before the policy became
# configurable. A missing or invalid file stops the watcher and the API.
# Operator additions belong in the redaction section of build_stream_config.yml.

schema_version: 1

secret_key_names: [password, passwd, pwd, secret, token, api_key, api-key, apikey, credential, private_key, private-key, privatekey]

secret_patterns:
  - id: gitlab-token
    description: GitLab token prefixes
    pattern: '\b(?:glpat|glprt|glrt|gldt|glptt|glcbt|glimt|glagent|gloas|glsoat|glffct|glft)-[A-Za-z0-9_-]{8,256}'
    replacement: '***REDACTED***'
  - id: jwt
    description: JSON Web Tokens
    pattern: '\beyJ[A-Za-z0-9_-]{5,4096}\.[A-Za-z0-9_-]{5,4096}\.[A-Za-z0-9_-]{5,4096}'
    replacement: '***REDACTED***'
  - id: bearer
    description: Bearer authorization values (keeps the matched prefix)
    pattern: '(?i)\b(bearer\s{1,5})[A-Za-z0-9._~+/=-]{1,4096}'
    replacement: '\1***REDACTED***'
  - id: url-credentials
    description: Passwords in URLs (keeps user name and scheme)
    pattern: '(?i)\b([a-z][a-z0-9+.-]{1,20}://[^\s:/@]{1,128}:)[^\s@/]{1,256}@'
    replacement: '\1***REDACTED***@'

identifier_patterns:
  - id: ipv4
    description: IPv4 addresses
    pattern: '\b(?:\d{1,3}\.){3}\d{1,3}\b'
    replacement: '<REDACTED_IP>'
  - id: ipv6
    description: IPv6 addresses
    pattern: '\b(?:[0-9a-fA-F]{1,4}:){2,7}[0-9a-fA-F]{1,4}\b'
    replacement: '<REDACTED_IP>'
  - id: email
    description: E-mail addresses
    pattern: '\b[A-Za-z0-9._%+-]{1,64}@[A-Za-z0-9.-]{1,253}\.[A-Za-z]{2,24}\b'
    replacement: '<REDACTED_EMAIL>'
