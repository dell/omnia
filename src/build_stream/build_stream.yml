---
# BuildStream Domain — Top-Level Entry Playbook
# Usage: cd src/build_stream && ansible-playbook build_stream.yml
#
# This playbook orchestrates the full BuildStream domain:
#   1. Upgrade check + input directory resolution (shared utilities)
#   2. Domain-specific credential validation, creation, and update
#   3. Postgres + GitLab + BSM deployment (prepare_build_stream)
#   4. GitLab CI/CD configuration (setup_gitlab)
#   5. Output: build_stream_status.yml
#
# Input contract:  see INPUT_CONTRACT.md
# Output contract: see OUTPUT_CONTRACT.md

- name: Build Stream domain setup (upgrade guard + input dirs + OIM metadata)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: always
  roles:
    - build_stream_setup

- name: Build Stream domain credential utility
  hosts: localhost
  connection: local
  roles:
    - credential_utility
  vars:
    build_stream_config_dir: "build_stream"
  tags: always

- name: Prepare BuildStream infrastructure (Postgres + GitLab + BSM)
  ansible.builtin.import_playbook: playbooks/prepare_build_stream.yml

- name: Configure GitLab CI/CD
  ansible.builtin.import_playbook: playbooks/setup_gitlab.yml
