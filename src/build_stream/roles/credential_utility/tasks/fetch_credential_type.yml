---

# Handles one service entry from bs_credentials (e.g. build_stream)

- name: Initialize per-service credential status
  ansible.builtin.set_fact:
    mandatory_credentials_status: false
    conditional_mandatory_credentials_status: false
    optional_credentials_status: false
    username_status: false
    password_status: false

- name: Fetch mandatory credentials for {{ service.key }}
  ansible.builtin.include_tasks: fetch_mandatory_credentials.yml
  loop: "{{ service.value | dict2items | selectattr('key', 'equalto', 'mandatory') | list }}"
  loop_control:
    loop_var: type
  when: service.value.mandatory is defined

- name: Fetch conditional mandatory credentials for {{ service.key }}
  ansible.builtin.include_tasks: fetch_conditional_mandatory_credentials.yml
  loop: "{{ service.value | dict2items | selectattr('key', 'equalto', 'conditional_mandatory') | list }}"
  loop_control:
    loop_var: type
  when: service.value.conditional_mandatory is defined
