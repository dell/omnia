---

# Build Stream domain credential status — single credential file

- name: Check credential file status
  ansible.builtin.set_fact:
    bs_cred_file_status: "{{ credential_files[0].file_path is file }}"

# Username: prompt if field exists, value is empty, credential type is active
- name: Initialize username status
  ansible.builtin.set_fact:
    username_status: >-
      {{
        field.username is defined and
        (lookup('vars', field.username, default='') is not defined or
         lookup('vars', field.username, default='') == "" or
         (lookup('vars', field.username, default='') | length == 0)) and
        (mandatory_credentials_status or
         conditional_mandatory_credentials_status or
         optional_credentials_status)
      }}

# Password: prompt if empty and credential type is active
# Special handling for build_stream_auth_password (check password_hash)
- name: Initialize password status
  ansible.builtin.set_fact:
    password_status: >-
      {{
        field.password is defined and
        (
          ((field.password == 'build_stream_auth_password') and
           (lookup('vars', 'build_stream_auth_password_hash', default='') is not defined or
            lookup('vars', 'build_stream_auth_password_hash', default='') == "" or
            (lookup('vars', 'build_stream_auth_password_hash', default='') | length == 0)))
          or
          ((field.password != 'build_stream_auth_password') and
           (lookup('vars', field.password, default='') is not defined or
            lookup('vars', field.password, default='') == "" or
            (lookup('vars', field.password, default='') | length == 0)) and
           (mandatory_credentials_status | default(false) | bool or
            conditional_mandatory_credentials_status | default(false) | bool))
        )
      }}

# Reset credential status after processing
- name: Reset credentials status
  ansible.builtin.set_fact:
    mandatory_credentials_status: false
    conditional_mandatory_credentials_status: false
    optional_credentials_status: false
    username_status: false
    password_status: false
  when: reset_status | default(false)
