---
# Prompt for a single build stream credential field.
# Called from main.yml in a loop over bs_cred_config.mandatory / conditional_mandatory.

# Determine if prompt is needed (skip if value already stored and non-empty)
- name: Reset prompt flags
  ansible.builtin.set_fact:
    _need_username: false
    _need_password: false

- name: Check if username prompt is needed
  ansible.builtin.set_fact:
    _need_username: true
  when:
    - cred_field.username is defined
    - build_stream_loaded_creds[cred_field.username] | default('') | string | length == 0

- name: Check if password prompt is needed
  ansible.builtin.set_fact:
    _need_password: true
  when:
    - cred_field.password is defined
    - build_stream_loaded_creds[cred_field.password] | default('') | string | length == 0

- name: Skip prompt for stored credentials
  ansible.builtin.debug:
    msg: "Credentials already stored for {{ cred_field.username | default(cred_field.password) }} — skipping prompt."
  when: not (_need_username | bool) and not (_need_password | bool)

# Prompt username if needed
- name: Prompt for username
  when:
    - cred_field.username is defined
    - _need_username | default(false) | bool
  block:
    - name: "Prompt for [{{ cred_field.username }}]" # noqa name[template]
      ansible.builtin.pause:
        prompt: "[Build Stream] Enter {{ cred_field.username }}"
      no_log: true
      register: _username_input

    - name: Validate username is not empty for mandatory credential
      ansible.builtin.fail:
        msg: "{{ bs_mandatory_warning_msg }} {{ cred_field.username }} cannot be empty."
      when:
        - cred_field.condition is not defined
        - _username_input.user_input | length == 0

# Prompt password if needed
- name: Prompt for password
  when:
    - cred_field.password is defined
    - _need_password | default(false) | bool
  block:
    - name: "Prompt for [{{ cred_field.password }}]" # noqa name[template]
      ansible.builtin.pause:
        prompt: >-
          [Build Stream] Enter {{ cred_field.password }}
          {% if cred_field.password == 'build_stream_auth_password' %}(minimum 8 characters){% endif %}
        echo: false
      no_log: true
      register: _password_input

    - name: Validate password is not empty for mandatory credential
      ansible.builtin.fail:
        msg: "{{ bs_password_fail_msg }}"
      when: _password_input.user_input | length == 0

    - name: Validate password length for build_stream_auth_password (GitLab masked variable requirement)
      ansible.builtin.fail:
        msg: "{{ bs_password_length_fail_msg }}"
      when:
        - cred_field.password == 'build_stream_auth_password'
        - _password_input.user_input | length < 8

    - name: "Confirm [{{ cred_field.password }}]" # noqa name[template]
      ansible.builtin.pause:
        prompt: "[Build Stream] Confirm {{ cred_field.password }}"
        echo: false
      no_log: true
      register: _password_confirm

    - name: Ensure passwords match
      ansible.builtin.fail:
        msg: "{{ bs_password_match_fail_msg }}"
      when: _password_input.user_input != _password_confirm.user_input

# Generate Argon2 hash for build_stream_auth_password
- name: Generate Argon2 hash for build stream auth password
  when:
    - cred_field.is_bs_auth | default(false) | bool
    - _need_password | default(false) | bool
    - _password_input is defined
    - _password_input.user_input | default('') | length > 0
  block:
    - name: Install argon2-cffi package
      ansible.builtin.pip:
        name: argon2-cffi
        state: present
      delegate_to: localhost

    - name: Generate Argon2 password hash
      ansible.builtin.shell: |
        python3 -c "from argon2 import PasswordHasher; ph = PasswordHasher(); print(ph.hash('{{ _password_input.user_input }}'))"
      register: _argon2_hash_result
      no_log: true
      delegate_to: localhost
      changed_when: false

# Update credential file
- name: Update credential file with new values
  when: (_need_username | default(false) | bool) or (_need_password | default(false) | bool)
  block:
    - name: Check if credential file is vault-encrypted before update
      ansible.builtin.shell: |
        set -o pipefail
        head -n1 "{{ bs_credential_file_path }}" | grep -q '^\$ANSIBLE_VAULT;'
      register: _update_is_vault
      changed_when: false
      failed_when: false

    - name: Decrypt for update
      ansible.builtin.command: >-
        ansible-vault decrypt "{{ bs_credential_file_path }}"
        --vault-password-file "{{ bs_credential_vault_path }}"
      changed_when: false
      failed_when: false
      register: _update_decrypt_result
      when: _update_is_vault.rc | default(1) == 0

    - name: Fail if decrypt failed before credential update
      ansible.builtin.fail:
        msg: "{{ bs_credential_encrypt_fail_msg }} Decrypt returned rc={{ _update_decrypt_result.rc | default('N/A') }}"
      when:
        - _update_is_vault.rc | default(1) == 0
        - _update_decrypt_result.rc | default(0) != 0

    - name: Update username in credential file
      ansible.builtin.lineinfile:
        path: "{{ bs_credential_file_path }}"
        regexp: "^{{ cred_field.username }}:"
        line: '{{ cred_field.username }}: "{{ _username_input.user_input }}"'
      no_log: true
      when:
        - cred_field.username is defined
        - _need_username | default(false) | bool
        - _username_input.user_input | default('') | length > 0
        - _update_decrypt_result.rc | default(0) == 0

    - name: Update password in credential file
      ansible.builtin.lineinfile:
        path: "{{ bs_credential_file_path }}"
        regexp: "^{{ cred_field.password }}:"
        line: '{{ cred_field.password }}: "{{ _password_input.user_input }}"'
      no_log: true
      when:
        - cred_field.password is defined
        - _need_password | default(false) | bool
        - _password_input.user_input | default('') | length > 0
        - _update_decrypt_result.rc | default(0) == 0
        - not (cred_field.is_bs_auth | default(false) | bool)

    - name: Update build_stream_auth_password in credential file
      ansible.builtin.lineinfile:
        path: "{{ bs_credential_file_path }}"
        regexp: "^build_stream_auth_password:"
        line: 'build_stream_auth_password: "{{ _password_input.user_input }}"'
      no_log: true
      when:
        - cred_field.is_bs_auth | default(false) | bool
        - _need_password | default(false) | bool
        - _password_input.user_input | default('') | length > 0
        - _update_decrypt_result.rc | default(0) == 0

    - name: Update build_stream_auth_password_hash in credential file
      ansible.builtin.lineinfile:
        path: "{{ bs_credential_file_path }}"
        regexp: "^build_stream_auth_password_hash:"
        line: 'build_stream_auth_password_hash: "{{ _argon2_hash_result.stdout }}"'
      no_log: true
      when:
        - cred_field.is_bs_auth | default(false) | bool
        - _need_password | default(false) | bool
        - _argon2_hash_result is defined
        - _argon2_hash_result is succeeded
        - _update_decrypt_result.rc | default(0) == 0

    - name: Reload credentials after update
      ansible.builtin.include_vars:
        file: "{{ bs_credential_file_path }}"
        name: build_stream_loaded_creds
      no_log: true

    - name: Re-encrypt after update
      ansible.builtin.command: >-
        ansible-vault encrypt "{{ bs_credential_file_path }}"
        --vault-password-file "{{ bs_credential_vault_path }}"
      changed_when: false

  rescue:
    - name: Encrypt credential file on failure
      ansible.builtin.shell: |
        set -o pipefail
        if [ -f "{{ bs_credential_file_path }}" ]; then
          if ! head -n1 "{{ bs_credential_file_path }}" | grep -q '\$ANSIBLE_VAULT;'; then
            ansible-vault encrypt "{{ bs_credential_file_path }}" \
              --vault-password-file "{{ bs_credential_vault_path }}"
          fi
        fi
      changed_when: false

    - name: Fail with cleanup message
      ansible.builtin.fail:
        msg: "{{ bs_credential_encrypt_fail_msg }}"
