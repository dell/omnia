---

# Build Stream domain credential prompting
# Iterates over bs_credentials dict and prompts for missing values

- name: Initialize credential status flags
  ansible.builtin.set_fact:
    mandatory_credentials_status: false
    conditional_mandatory_credentials_status: false
    optional_credentials_status: false
    username_status: false
    password_status: false

- name: Set build_stream module_utils path for credential validation modules
  ansible.builtin.set_fact:
    module_utils_path: "{{ role_path }}/../../../plugins/module_utils/"

- name: Fetch build_stream credentials
  ansible.builtin.include_tasks: fetch_credential_type.yml
  loop: "{{ bs_credentials | dict2items }}"
  loop_control:
    loop_var: service
