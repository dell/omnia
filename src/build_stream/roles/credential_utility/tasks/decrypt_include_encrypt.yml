---

# Decrypt, include variables, and re-encrypt credential files
# Used by cleanup playbooks to load credentials into global namespace.
# Also loads into build_stream_loaded_creds dict for prompt checks.

- name: Validate required parameters
  ansible.builtin.fail:
    msg: "Both credential_file_path and vault_password_file must be provided"
  when:
    - credential_file_path is not defined
    - vault_password_file is not defined

- name: Check credential file existence
  ansible.builtin.stat:
    path: "{{ credential_file_path }}"
  register: cred_file_stat

- name: Skip processing for non-existent files
  ansible.builtin.debug:
    msg: "Credential file {{ credential_file_path }} does not exist, skipping"
  when: not cred_file_stat.stat.exists

- name: Process credential file
  when: cred_file_stat.stat.exists
  block:
    - name: Check if file is encrypted
      ansible.builtin.shell: >-
        set -o pipefail && head -n1 "{{ credential_file_path }}" | grep -q '\$ANSIBLE_VAULT;'
      register: is_encrypted
      changed_when: false
      failed_when: false

    - name: Load unencrypted file
      when: is_encrypted.rc != 0
      block:
        - name: Include unencrypted file into global namespace
          ansible.builtin.include_vars:
            file: "{{ credential_file_path }}"
          no_log: true

        - name: Include unencrypted file into namespaced dict
          ansible.builtin.include_vars:
            file: "{{ credential_file_path }}"
            name: build_stream_loaded_creds
          no_log: true

    # Decrypt to a private temp file on tmpfs, load, always remove temp file.
    # The encrypted credential file is never decrypted in place.
    - name: Process encrypted file
      when: is_encrypted.rc == 0
      block:
        - name: Check vault key existence
          ansible.builtin.stat:
            path: "{{ vault_password_file }}"
          register: vault_key_stat

        - name: Fail if vault key missing for encrypted file
          ansible.builtin.fail:
            msg: "Encrypted file found but vault key {{ vault_password_file }} is missing"
          when: not vault_key_stat.stat.exists

        - name: Create private temp file for decrypted credentials
          ansible.builtin.tempfile:
            state: file
            path: "{{ credential_tmp_dir }}"
            prefix: ".cred_tmp_"
            suffix: ".yml"
          register: _cred_tmp

        - name: Verify temp file was created successfully
          ansible.builtin.assert:
            that:
              - _cred_tmp.path is defined
              - _cred_tmp.path | length > 0
            fail_msg: "Failed to create temp file for credential decryption"

        - name: Restrict temp file permissions
          ansible.builtin.file:
            path: "{{ _cred_tmp.path }}"
            mode: "0600"

        - name: Decrypt credential file to temp file
          ansible.builtin.command: >-
            ansible-vault decrypt "{{ credential_file_path }}"
            --output "{{ _cred_tmp.path }}"
            --vault-password-file "{{ vault_password_file }}"
          changed_when: false
          no_log: true

        - name: Include decrypted variables into global namespace
          ansible.builtin.include_vars:
            file: "{{ _cred_tmp.path }}"
          no_log: true

        - name: Include decrypted variables into namespaced dict
          ansible.builtin.include_vars:
            file: "{{ _cred_tmp.path }}"
            name: build_stream_loaded_creds
          no_log: true
      rescue:
        - name: Fail with decryption error
          ansible.builtin.fail:
            msg: "Failed to decrypt or load credential file: {{ credential_file_path }}"
      always:
        - name: Remove temp file with decrypted credentials
          ansible.builtin.file:
            path: "{{ _cred_tmp.path }}"
            state: absent
          when: _cred_tmp.path is defined
