# ============================================================================
# Build Stream Domain — Credential Utility
# ============================================================================
# Domain-specific credential handling for Build Stream.
# Validates, creates, and updates build_stream_credentials.yml only.
# ============================================================================

# --- Step 0: Initialize namespaced credential dict ---
- name: Initialize build_stream_loaded_creds
  ansible.builtin.set_fact:
    build_stream_loaded_creds: {}

# --- Step 1: Load build_stream_config.yml to check enable_build_stream ---
- name: Load build_stream_config.yml
  block:
    - name: Include build_stream_config.yml
      ansible.builtin.include_vars:
        file: "{{ input_project_dir }}/build_stream_config.yml"
  rescue:
    - name: Set enable_build_stream to false if config not found
      ansible.builtin.set_fact:
        enable_build_stream: false

# --- Step 2: Validate credential file exists ---
- name: Validate build_stream credential file
  ansible.builtin.include_tasks: validate_cred_file.yml
  vars:
    credential_type: "Build Stream"
    credential_file_path: "{{ bs_credential_file_path }}"
    status_var_name: "bs_cred_file_status"

# --- Step 3: Create credential file if it does not exist ---
- name: Create build_stream credential file if absent
  ansible.builtin.include_tasks: create_credential_file.yml
  vars:
    credential_type: "Build Stream"
    credential_template: "{{ credential_files[0].template }}"
    credential_file_path: "{{ credential_files[0].file_path }}"
    credential_file_mode: "{{ credential_files[0].file_mode }}"
    vault_password_file: "{{ credential_files[0].vault_path }}"
    credential_condition: "{{ credential_files[0].condition | default(false) }}"
  when: credential_files[0].file_path is not file

# --- Step 4: Load existing credentials ---
- name: Load existing build_stream credentials
  ansible.builtin.include_tasks: decrypt_include_encrypt.yml
  vars:
    credential_file_path: "{{ bs_credential_file_path }}"
    vault_password_file: "{{ bs_credential_vault_path }}"
  when: bs_credential_file_path is file

# --- Step 4.5: Debug loaded credentials (keys only) ---
- name: Show loaded credential keys
  ansible.builtin.debug:
    msg: "Loaded credentials: {{ build_stream_loaded_creds.keys() | list }}"
  when:
    - build_stream_loaded_creds is defined
    - build_stream_loaded_creds | length > 0

# --- Step 5: Prompt and update credentials ---
- name: Prompt and update build_stream credentials
  ansible.builtin.include_tasks: fetch_bs_credentials.yml
  when: enable_build_stream | default(false) | bool
