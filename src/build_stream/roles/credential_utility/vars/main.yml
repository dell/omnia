# ============================================================================
# Build Stream Domain — Credential Configuration
# ============================================================================
# Domain-specific copy of credential_utility vars.  Only the Build Stream
# credential file is defined here (no omnia/image_build entries).
# ============================================================================

# Single credential file for the build_stream domain
bs_credential_file_path: "{{ input_project_dir }}/build_stream_credentials.yml"
bs_credential_vault_path: "{{ input_project_dir }}/.build_stream_credentials_key"

credential_files:
  - credential_type: "Build Stream"
    template: "{{ role_path }}/templates/build_stream_credential.j2"
    file_path: "{{ bs_credential_file_path }}"
    file_mode: 600
    vault_path: "{{ bs_credential_vault_path }}"
    condition: "{{ enable_build_stream | default(false) | bool }}"

# Credential prompt definitions (flat structure matching image_build_manager pattern)
bs_cred_config:
  mandatory:
    - password: gitlab_root_password
    - password: gitlab_ssh_password
  conditional_mandatory:
    - username: build_stream_auth_username
      password: build_stream_auth_password
      condition: "{{ enable_build_stream | default(false) | bool }}"
      is_bs_auth: true
    - username: postgres_user
      password: postgres_password
      condition: "{{ enable_build_stream | default(false) | bool }}"

# Prompt messages
bs_mandatory_warning_msg: "WARNING: The following are mandatory build stream credentials and cannot be left empty."
bs_conditional_warning_msg: "WARNING: Conditional build stream credentials will be prompted based on your configuration."
bs_password_fail_msg: "Failed. Password is required for mandatory credential."
bs_password_match_fail_msg: "Failed. Passwords do not match. Please try again."
bs_credential_encrypt_fail_msg: "Failed to encrypt build stream credential file."
bs_password_hash_fail_msg: "Failed to generate Argon2 password hash for build stream registrar."

# Vault search key
ansible_vault_search_key: "$ANSIBLE_VAULT;"
