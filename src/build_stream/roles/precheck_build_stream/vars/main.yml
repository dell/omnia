---
# ============================================================================
# precheck_build_stream — Role Variables
# ============================================================================
# Minimal checks to verify that repo_manager and image_build_manager
# have completed prepare-base (containers running + credentials present).

omnia_data_path: "{{ hostvars['localhost']['omnia_data_path'] }}"
omnia_project_name: "{{ hostvars['localhost']['project_name'] }}"

# Containers that must be running (deployed by prepare-base)
required_containers:
  - name: pulp
    domain: repo_manager
  - name: minio-server
    domain: image_build_manager
  - name: registry
    domain: image_build_manager

# NFS export checks for the Omnia data path
data_path_unsafe_export_msg: >-
  export the Omnia data path with root_squash (the default) and restrict the
  allowed clients, then run 'exportfs -ra'.
data_path_nfs_mount_warning_msg: >-
  The Omnia data path {{ omnia_data_path }} is on an NFS mount. The BuildStream
  playbook queue under it drives root playbook execution on this OIM. Ensure the
  NFS server exports it with root_squash and only to trusted clients.

# Credential files that must exist (created by credentials phase)
required_credential_files:
  - path: "{{ omnia_data_path }}/repo_manager/input/{{ omnia_project_name }}/repo_manager_config_credentials.yml"
    domain: repo_manager
  - path: "{{ omnia_data_path }}/image_build_manager/input/{{ omnia_project_name }}/image_build_credentials.yml"
    domain: image_build_manager
