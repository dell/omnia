---

- name: Load GitLab configuration inputs
  ansible.builtin.include_vars:
    file: "{{ hostvars['localhost']['omnia_data_path'] }}/build_stream/input/{{ project_name }}/build_stream_config.yml"

- name: Check gitlab_host for Jinja template injection patterns
  ansible.builtin.set_fact:
    _gitlab_host_has_jinja: "{{ (gitlab_host | default('')) is search('\\{\\{|\\{%|\\{#') }}"

- name: Validate gitlab_host contains no Jinja template syntax
  ansible.builtin.assert:
    that:
      - gitlab_host is defined
      - gitlab_host is string
      - gitlab_host | length > 0
      - not _gitlab_host_has_jinja
      - gitlab_host is regex('^[a-zA-Z0-9][a-zA-Z0-9.-]*[a-zA-Z0-9]$|^[a-zA-Z0-9]$')
    fail_msg: "{{ gitlab_host_invalid_format_msg }}"
    quiet: true

- name: Load BuildStream credentials
  ansible.builtin.include_role:
    name: orchestrator_common
    tasks_from: decrypt_include_encrypt.yml
  vars:
    credential_file_path: "{{ hostvars['localhost']['omnia_data_path'] }}/build_stream/input/{{ project_name }}/build_stream_credentials.yml"
    vault_password_file: "{{ hostvars['localhost']['omnia_data_path'] }}/build_stream/input/{{ project_name }}/.build_stream_credentials_key"

- name: Validate GitLab SSH password
  ansible.builtin.assert:
    that:
      - hostvars['localhost']['gitlab_ssh_password'] | default('') | length > 0
    fail_msg: "GitLab SSH password not found. Run the BuildStream credential utility to populate gitlab_ssh_password."
  no_log: true

- name: Register GitLab SSH credentials
  ansible.builtin.add_host:
    name: "{{ gitlab_host }}"
    groups: gitlab_server
    ansible_connection: ssh
    ansible_host: "{{ gitlab_host }}"
    ansible_user: "{{ gitlab_ansible_user | default('root') }}"
    ansible_password: "{{ hostvars['localhost']['gitlab_ssh_password'] }}"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
  no_log: true
