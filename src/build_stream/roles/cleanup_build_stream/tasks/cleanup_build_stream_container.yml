---

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Populate service facts
  ansible.builtin.service_facts:

- name: Select only the omnia_build_stream service name
  ansible.builtin.set_fact:
    build_stream_services: "{{ ansible_facts['services'].keys() | select('match', '^omnia_build_stream') | list }}"

- name: Stop all matching omnia_build_stream services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
  failed_when: false
  loop: "{{ build_stream_services }}"
  when:
    - item in ansible_facts.services
    - ansible_facts.services[item].state == 'running'

- name: Get omnia_build_stream container files
  ansible.builtin.find:
    paths: "{{ quadlet_dir }}"
    patterns: 'omnia_build_stream*'
    file_type: file
  register: found_files

- name: Get the list of omnia build_stream paths
  ansible.builtin.set_fact:
    build_stream_quad_path_list: "{{ found_files.files | map(attribute='path') | list }}"

- name: Remove omnia_build_stream systemd unit files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ build_stream_quad_path_list }}"

- name: Stop playbook-watcher service if it exists
  ansible.builtin.systemd_service:
    name: "{{ watcher_service_name }}"
    state: stopped
  when:
    - watcher_service_name in ansible_facts.services
    - ansible_facts.services[watcher_service_name].state == 'running'

- name: Disable playbook-watcher service
  ansible.builtin.systemd_service:
    name: "{{ watcher_service_name }}"
    enabled: false
  when: watcher_service_name in ansible_facts.services

- name: Remove playbook-watcher service file
  ansible.builtin.file:
    path: "{{ playbook_watcher_service_file }}"
    state: absent

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Get info about omnia_build_stream container
  containers.podman.podman_container_info:
    name: "{{ build_stream_container_name }}"
  register: podinfo
  failed_when: false

- name: Stop build_stream container only if it exists
  containers.podman.podman_container:
    name: "{{ build_stream_container_name }}"
    state: stopped
  when: podinfo.containers | length > 0

- name: Remove omnia_build_stream containers
  containers.podman.podman_container:
    name: "{{ build_stream_container_name }}"
    state: absent
    force_delete: true
  when: podinfo.containers | length > 0

- name: Remove build_stream cleanup directories
  block:
    - name: Remove each build_stream cleanup directory
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
        force: true
      register: directory_deletion
      until: directory_deletion is not failed
      retries: "{{ max_retries }}"
      loop: "{{ build_stream_cleanup_directory }}"
  rescue:
    - name: Fail cleanup if directory removal fails due to locks
      ansible.builtin.fail:
        msg: |
          {{ build_stream_cleanup_failure_msg }}

- name: Check BuildStream runtime directory for generated Python caches
  ansible.builtin.stat:
    path: "{{ build_stream_runtime_directory }}"
  register: build_stream_runtime_directory_stat

- name: Find generated Python cache directories
  ansible.builtin.find:
    paths: "{{ build_stream_runtime_directory }}"
    patterns: "{{ build_stream_python_cache_directories }}"
    file_type: directory
    recurse: true
    hidden: true
    follow: false
  register: build_stream_python_cache_dirs
  when: build_stream_runtime_directory_stat.stat.isdir | default(false)

- name: Remove generated Python cache directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ build_stream_python_cache_dirs.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"

- name: Find generated Python bytecode files
  ansible.builtin.find:
    paths: "{{ build_stream_runtime_directory }}"
    patterns: "{{ build_stream_python_cache_files }}"
    file_type: file
    recurse: true
    hidden: true
    follow: false
  register: build_stream_python_cache_files_found
  when: build_stream_runtime_directory_stat.stat.isdir | default(false)

- name: Remove generated Python bytecode files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ build_stream_python_cache_files_found.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"

- name: Check if target file exists
  ansible.builtin.stat:
    path: "{{ omnia_target }}"
  register: p

- name: Remove all omnia_build_stream services from omnia.target
  ansible.builtin.replace:
    path: "{{ omnia_target }}"
    regexp: "{{ build_stream_container_name }}.service"
    replace: ''
  when: p.stat.exists

- name: Remove playbook-watcher service from omnia.target
  ansible.builtin.replace:
    path: "{{ omnia_target }}"
    regexp: "{{ watcher_service_name | regex_escape }}"
    replace: ''
  when: p.stat.exists

- name: Cleanup automation framework
  ansible.builtin.import_tasks: cleanup_automation.yml
  tags: automation
