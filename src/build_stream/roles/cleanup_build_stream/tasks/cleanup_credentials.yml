---
# Cleanup build_stream credential files.
# Extracted from: playbooks/utils/roles/oim_cleanup/omnia_credential_cleanup/tasks/cleanup_credentials.yml
# Only handles build_stream-specific credentials (domain segregation).

- name: Delete build_stream credentials file
  ansible.builtin.file:
    path: "{{ bs_credential_config }}"
    state: absent
  failed_when: false

- name: Delete build_stream credentials vault key
  ansible.builtin.file:
    path: "{{ bs_credential_config_key }}"
    state: absent
  failed_when: false

- name: Delete build_stream_oauth_credentials file
  ansible.builtin.file:
    path: "{{ bs_oauth_credential_config }}"
    state: absent
  failed_when: false

- name: Delete build_stream_oauth_credentials vault key
  ansible.builtin.file:
    path: "{{ bs_oauth_credential_config_key }}"
    state: absent
  failed_when: false
