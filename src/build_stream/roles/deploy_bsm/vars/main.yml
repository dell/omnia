---

# Build Stream Container Configuration
build_stream_container_name: "omnia_build_stream"
build_stream_container_omnia_path: "/opt/omnia"

# Build Stream Image (Docker Hub)
build_stream_dockerhub_registry: "docker.io/dellhpcomniaaisolution"
build_stream_image_name: "{{ build_stream_dockerhub_registry }}/omnia_build_stream"
build_stream_image_tag: "1.2"

# Ports & Logs — passed as host vars from prepare_build_stream.yml
build_stream_log_dir: "{{ omnia_path }}/build_stream/log"
build_stream_nfs_path_error_msg: "Directory {{ omnia_path }}/build_stream is missing; ensure oim_shared_path is mounted and populated correctly."
omnia_default_dir: "/omnia"

# Build Stream watcher service
watcher_service_name: "playbook-watcher.service"
watcher_service_src_path: "templates/playbook_watcher.service.j2"
watcher_systemd_path: "/etc/systemd/system"
build_stream_watcher_exec: "/usr/bin/python3 {{ omnia_path }}/build_stream/playbook-watcher/playbook_watcher_service.py"
omnia_src_path: "{{ lookup('env', 'OMNIA_SRC_PATH') | default(playbook_dir ~ '/../../../', true) }}"
venv_path: "{{ lookup('env', 'OMNIA_VENV_PATH') | default('/opt/omnia/venv', true) }}"
system_admin_nic_ipv4: "{{ lookup('env', 'SYSTEM_ADMIN_NIC_IPV4') | default('', true) }}"
project_name: "{{ hostvars['localhost']['project_name'] }}"
watcher_restart_sec: 10
watcher_startup_delay_seconds: 20
watcher_no_new_privileges: true
watcher_private_tmp: true
watcher_limit_nofile: 4096
watcher_memory_max: "512M"
watcher_cpu_quota: "50%"
build_stream_queue_base: "{{ omnia_path }}/playbook_queue"
build_stream_container_queue_base: >-
  {{ build_stream_container_omnia_path }}/playbook_queue
build_stream_queue_auth_dir: "/etc/omnia/build_stream"
build_stream_queue_auth_key: >-
  {{ build_stream_queue_auth_dir }}/playbook_queue.key
build_stream_container_queue_auth_key: "/run/secrets/omnia-playbook-queue.key"
build_stream_queue_replay_dir: >-
  /var/lib/omnia/build_stream/playbook_queue/consumed
build_stream_queue_api_state_dir: >-
  /var/lib/omnia/build_stream/playbook_queue/api
build_stream_container_queue_api_state_dir: >-
  /var/lib/omnia/build_stream/playbook_queue/api
build_stream_watcher_playbook_queue_base: "{{ build_stream_queue_base }}"
watcher_poll_interval_seconds: 2
watcher_max_concurrent_jobs: 1
watcher_default_timeout_minutes: 150
watcher_log_level: "INFO"

# Directory & File Modes
build_stream_file_mode: "0644"
build_stream_dir_mode: "0755"
build_stream_queue_dir_mode: "0755"
build_stream_private_dir_mode: "0700"
build_stream_secret_file_mode: "0600"
build_stream_jwt_script_mode: "0755"

# SSL certificate configuration for build_stream
build_stream_ssl_dir: "{{ omnia_path }}/build_stream_ssl/ssl"
build_stream_ssl_cert: "{{ build_stream_ssl_dir }}/bs_cert.pem"
build_stream_ssl_key: "{{ build_stream_ssl_dir }}/bs_key.pem"
build_stream_ssl_days: 365
build_stream_ssl_file_mode: "0600"

# JWT key configuration
build_stream_jwt_keys_script: "{{ omnia_path }}/build_stream/scripts/generate_jwt_keys.sh"
build_stream_jwt_keys_dir: "{{ omnia_path }}/build_stream_root/api/.auth/keys"

# Project configuration
build_stream_root_dir: "{{ omnia_path }}/build_stream_root"

# Quadlet
quadlet_dir: "/etc/containers/systemd"
build_stream_quadlet_path: "{{ quadlet_dir }}/{{ build_stream_container_name }}.container"
build_stream_quadlet_file_mode: "0644"

# PostgreSQL configuration — passed as host vars from prepare_build_stream.yml
postgres_db_name: "build_stream_db"

# MinIO S3 configuration from the Vault-backed image-build credential file
minio_s3_username: "{{ hostvars['localhost']['image_build_credentials']['s3_access_id'] }}"
minio_s3_password: "{{ hostvars['localhost']['image_build_credentials']['s3_secret_key'] }}"
minio_s3_host: >-
  {{ system_admin_nic_ipv4
     | default(build_stream_host_ip | default('localhost'), true) }}
build_stream_s3_environment_file: "/etc/omnia/build_stream/minio.env"
build_stream_s3_init_script_source: >-
  {{ role_path }}/../../containers/omnia_build_stream/init_s3cfg.sh
build_stream_s3_init_script: "/etc/omnia/build_stream/init_s3cfg.sh"
build_stream_container_s3_init_script: "/usr/local/bin/init_s3cfg.sh"
image_build_ca_cert: "/etc/omnia/image_build_manager/pki/ca.crt"
build_stream_container_image_build_ca: "/etc/ssl/omnia-image-build-ca.crt"

# Systemd service name generated by Quadlet
build_stream_service: "{{ build_stream_container_name }}.service"

# Health check
build_stream_health_endpoint: "https://{{ build_stream_host_ip }}:{{ build_stream_port }}/health"
container_ready_wait_seconds: 5
bs_container_wait_retries: 30
bs_container_wait_delay: 2
health_check_retries: 30
health_check_delay: 5
health_check_status_code: 200

# Firewall configuration
build_stream_firewall_port: "{{ build_stream_port }}/tcp"

# Certificate file permissions
build_stream_cert_file_mode: '0644'

# User messages
build_stream_image_pull_success_msg:
  - "Successfully pulled image from Docker Hub"
  - "Image: {{ build_stream_image_name }}:{{ build_stream_image_tag }}"

build_stream_container_failure_msg: |
  The deployment of the {{ build_stream_container_name }} container has failed. To resolve this issue,
  please run the utility/oim_cleanup.yml playbook to clean up any existing OIM resources.
  After the cleanup, you can re-run the original playbook to deploy the {{ build_stream_container_name }} container successfully.
