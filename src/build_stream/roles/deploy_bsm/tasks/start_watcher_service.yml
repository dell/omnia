---

- name: Restart and enable playbook watcher service
  ansible.builtin.systemd_service:
    name: "{{ watcher_service_name }}"
    enabled: true
    state: restarted

- name: Check watcher service status
  ansible.builtin.command:
    argv:
      - systemctl
      - status
      - "{{ watcher_service_name | regex_replace('\\.service$', '') }}"
      - --no-pager
  register: watcher_status
  changed_when: false

- name: Read recent watcher logs
  ansible.builtin.command:
    argv:
      - journalctl
      - -u
      - "{{ watcher_service_name | regex_replace('\\.service$', '') }}"
      - -n
      - "10"
      - --no-pager
  when: watcher_status.rc == 0
  register: watcher_logs
  changed_when: false
