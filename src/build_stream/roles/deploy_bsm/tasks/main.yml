---

- name: Set omnia_path from oim_shared_path
  ansible.builtin.set_fact:
    omnia_path: "{{ oim_shared_path }}"

- name: Ensure build_stream deployment directory exists
  ansible.builtin.file:
    path: "{{ omnia_path }}/build_stream"
    state: directory
    mode: "{{ build_stream_dir_mode }}"

- name: Stop Build Stream producer during queue authentication transition
  ansible.builtin.systemd_service:
    name: "{{ build_stream_service }}"
    state: stopped
  failed_when: false

- name: Stop playbook watcher during queue authentication transition
  ansible.builtin.systemd_service:
    name: "{{ watcher_service_name }}"
    state: stopped
  failed_when: false

- name: Ensure Build Stream private configuration directory exists
  ansible.builtin.file:
    path: "{{ build_stream_s3_environment_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write protected Build Stream MinIO environment
  ansible.builtin.copy:
    dest: "{{ build_stream_s3_environment_file }}"
    owner: root
    group: root
    mode: "0600"
    content: |
      MINIO_ACCESS_KEY={{ minio_s3_username | to_json }}
      MINIO_SECRET_KEY={{ minio_s3_password | to_json }}
      MINIO_HOST={{ (minio_s3_host ~ ':9000') | to_json }}
      MINIO_USE_HTTPS=True
      MINIO_CA_CERT_FILE={{ build_stream_container_image_build_ca | to_json }}
  no_log: true

- name: Install hardened Build Stream S3 initializer
  ansible.builtin.copy:
    src: "{{ build_stream_s3_init_script_source }}"
    dest: "{{ build_stream_s3_init_script }}"
    owner: root
    group: root
    mode: "0755"

- name: Provision playbook watcher service
  ansible.builtin.include_tasks: enable_watcher_service.yml

- name: Deploy omnia_build_stream container
  ansible.builtin.include_tasks: deploy_build_stream.yml
  tags:
    - build_stream

- name: Start playbook watcher after authenticated producer deployment
  ansible.builtin.include_tasks: start_watcher_service.yml
  tags:
    - build_stream
