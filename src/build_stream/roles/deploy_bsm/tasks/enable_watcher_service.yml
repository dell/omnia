---

- name: Check build_stream directory exists in oim_shared_path
  ansible.builtin.stat:
    path: "{{ oim_shared_path }}/build_stream"
  register: build_stream_stat

- name: Fail if build_stream directory missing
  ansible.builtin.fail:
    msg: "{{ build_stream_nfs_path_error_msg }}"
  when: not build_stream_stat.stat.exists

- name: Create playbook queue directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "{{ build_stream_queue_dir_mode }}"
  loop:
    - "{{ build_stream_queue_base }}"
    - "{{ build_stream_queue_base }}/requests"
    - "{{ build_stream_queue_base }}/results"
    - "{{ build_stream_queue_base }}/processing"
    - "{{ build_stream_queue_base }}/archive"
    - "{{ build_stream_queue_base }}/archive/requests"
    - "{{ build_stream_queue_base }}/archive/results"

- name: Check for an existing queue authentication key
  ansible.builtin.stat:
    path: "{{ build_stream_queue_auth_key }}"
  register: queue_auth_key_stat

- name: Check authenticated queue is drained before transition
  ansible.builtin.find:
    paths:
      - "{{ build_stream_queue_base }}/requests"
      - "{{ build_stream_queue_base }}/processing"
      - "{{ build_stream_queue_base }}/results"
    patterns: "*.json"
    file_type: file
    recurse: false
  register: queue_transition_files
  when: not queue_auth_key_stat.stat.exists

- name: Refuse mixed unsigned and authenticated queue deployment
  ansible.builtin.fail:
    msg: >-
      Build Stream queue contains pending request, processing, or result files.
      Complete or explicitly cancel existing jobs before enabling authenticated
      queue messages. Unsigned files cannot be migrated safely.
  when:
    - not queue_auth_key_stat.stat.exists
    - queue_transition_files.matched | default(0) | int > 0

- name: Create queue authentication directory
  ansible.builtin.file:
    path: "{{ build_stream_queue_auth_dir }}"
    state: directory
    owner: root
    group: root
    mode: "{{ build_stream_private_dir_mode }}"

- name: Generate playbook queue authentication key
  ansible.builtin.command:
    argv:
      - /usr/bin/openssl
      - rand
      - -out
      - "{{ build_stream_queue_auth_key }}"
      - "32"
    creates: "{{ build_stream_queue_auth_key }}"
  no_log: true

- name: Restrict playbook queue authentication key permissions
  ansible.builtin.file:
    path: "{{ build_stream_queue_auth_key }}"
    state: file
    owner: root
    group: root
    mode: "{{ build_stream_secret_file_mode }}"

- name: Create root-owned replay state directory
  ansible.builtin.file:
    path: "{{ build_stream_queue_replay_dir }}"
    state: directory
    owner: root
    group: root
    mode: "{{ build_stream_private_dir_mode }}"

- name: Create API queue state directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "{{ build_stream_private_dir_mode }}"
  loop:
    - "{{ build_stream_queue_api_state_dir }}"
    - "{{ build_stream_queue_api_state_dir }}/pending"
    - "{{ build_stream_queue_api_state_dir }}/consumed"

- name: Deploy playbook watcher systemd unit
  ansible.builtin.template:
    src: playbook_watcher.service.j2
    dest: "{{ watcher_systemd_path }}/{{ watcher_service_name }}"
    mode: "{{ build_stream_file_mode }}"
  notify:
    - Reload systemd

- name: Apply systemd reload for watcher
  ansible.builtin.meta: flush_handlers
