---

# PostgreSQL Container Configuration
postgres_container_name: "omnia_postgres"

# Docker Hub configuration
postgres_dockerhub_registry: "docker.io/library"
postgres_image: "{{ postgres_dockerhub_registry }}/postgres"
postgres_image_tag: "16"
postgres_port: 5432

# Database configuration
# postgres_user and postgres_password are passed as host vars from prepare_build_stream.yml
postgres_db_name: "build_stream_db"

# Storage configuration
postgres_data_dir: "{{ omnia_path }}/postgres/data"

# Directory permissions
postgres_dir_mode: "0750"

# Quadlet service file path
postgres_quadlet_path: "/etc/containers/systemd/{{ postgres_container_name }}.container"
# Quadlet file embeds the Postgres superuser password. Restrict to root-only to
# close CWE-732 / CWE-522 (world-readable credential exposure on the OIM).
postgres_quadlet_file_mode: "0600"

# Wait for PostgreSQL to be ready
postgres_ready_wait_seconds: 10
postgres_ready_retries: 12
postgres_ready_delay: 5

# Messages
postgres_image_pull_success_msg:
  - "Successfully pulled PostgreSQL image from Docker Hub"
  - "Image: {{ postgres_image }}:{{ postgres_image_tag }}"
postgres_container_success_msg: "The {{ postgres_container_name }} container has been successfully deployed."
postgres_container_failure_msg: |
  The deployment of the {{ postgres_container_name }} container has failed.

  This failure is typically caused by database initialization issues when existing data is present.

  To resolve this issue, choose one of the following options:

  Option 1: Preserve existing database data
    - Re-run build_stream.yml using the SAME postgres credentials used in the previous deployment
    - This will reuse the existing database at {{ postgres_data_dir }}

  Option 2: Delete existing database data and start fresh
    - WARNING: postgres_backup=false PERMANENTLY deletes the preserved PostgreSQL
      database at {{ postgres_data_dir }} (and associated data/logs). This cannot be undone.
    - Run the targeted Build Stream cleanup playbook from the Build Stream source directory.
      This keeps the separately deployed GitLab environment and the newly entered
      Build Stream credentials (--skip-tags credentials):
        cd <OMNIA_SOURCE>/src/build_stream
        ansible-playbook playbooks/cleanup/cleanup_build_stream.yml -e postgres_backup=false --skip-tags credentials
    - After cleanup completes, reinitialize the domain to recreate its runtime and log directories:
        cd <OMNIA_SOURCE>/src/main
        ./omnia.sh --init build_stream
    - Then re-run the prepare flow to deploy a fresh {{ postgres_container_name }} container:
        cd <OMNIA_SOURCE>/src/build_stream/playbooks
        ansible-playbook build_stream.yml --tags prepare
