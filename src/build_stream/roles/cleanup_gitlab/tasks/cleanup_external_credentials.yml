---
- name: Blank gitlab_api_token and gitlab_project_id in the Omnia credential file
  block:
    - name: Set credential file paths
      ansible.builtin.set_fact:
        _ecl_cred_file: "{{ hostvars['localhost']['input_project_dir'] }}/build_stream_credentials.yml"
        _ecl_vault_file: "{{ hostvars['localhost']['input_project_dir'] }}/.build_stream_credentials_key"

    - name: Check the credential file
      ansible.builtin.stat:
        path: "{{ _ecl_cred_file }}"
      register: _ecl_cred_stat

    - name: Check whether the credential file is vault-encrypted
      ansible.builtin.command:
        argv: [head, -n, "1", "{{ _ecl_cred_file }}"]
      register: _ecl_cred_header
      changed_when: false
      failed_when: false
      when: _ecl_cred_stat.stat.exists

    - name: Decrypt the credential file
      ansible.builtin.command:
        argv: [ansible-vault, decrypt, --vault-password-file, "{{ _ecl_vault_file }}", "{{ _ecl_cred_file }}"]
      register: _ecl_cred_decrypt
      changed_when: false
      failed_when: false
      when:
        - _ecl_cred_stat.stat.exists
        - "'ANSIBLE_VAULT' in (_ecl_cred_header.stdout | default(''))"

    - name: Blank the external GitLab entries
      ansible.builtin.lineinfile:
        path: "{{ _ecl_cred_file }}"
        regexp: "^{{ item }}:"
        line: '{{ item }}: ""'
        create: false
      failed_when: false
      loop: [gitlab_api_token, gitlab_project_id]
      when: _ecl_cred_stat.stat.exists
  always:
    - name: Encrypt the credential file again
      ansible.builtin.command:
        argv: [ansible-vault, encrypt, --vault-password-file, "{{ _ecl_vault_file }}", "{{ _ecl_cred_file }}"]
      changed_when: false
      failed_when: false
      when:
        - _ecl_cred_stat.stat.exists | default(false)
        - "'ANSIBLE_VAULT' in (_ecl_cred_header.stdout | default(''))"
        - (_ecl_cred_decrypt.rc | default(1)) == 0
