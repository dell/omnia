---
- name: Persist gitlab_project_id to build_stream_credentials.yml
  block:
    - name: Set credential file paths
      ansible.builtin.set_fact:
        _egl_cred_file: "{{ hostvars['localhost']['input_project_dir'] }}/build_stream_credentials.yml"
        _egl_vault_file: "{{ hostvars['localhost']['input_project_dir'] }}/.build_stream_credentials_key"

    - name: Check if the credentials file is encrypted
      ansible.builtin.shell: >-
        set -o pipefail && head -n1 "{{ _egl_cred_file }}" | grep -q '\$ANSIBLE_VAULT;'
      register: _egl_cred_encrypted
      changed_when: false
      failed_when: false

    - name: Decrypt the credentials file
      ansible.builtin.command: >-
        ansible-vault decrypt "{{ _egl_cred_file }}" --vault-password-file "{{ _egl_vault_file }}"
      when: _egl_cred_encrypted.rc == 0
      changed_when: false
      no_log: true

    - name: Remember that the credentials file is decrypted
      ansible.builtin.set_fact:
        _egl_cred_decrypted: "{{ _egl_cred_encrypted.rc == 0 }}"

    - name: Update gitlab_project_id
      ansible.builtin.lineinfile:
        path: "{{ _egl_cred_file }}"
        regexp: "^gitlab_project_id:"
        line: 'gitlab_project_id: "{{ _egl_project_id }}"'
        state: present

    - name: Store the omnia-ci token for the cadence watcher (the customer PAT is not used at runtime)
      ansible.builtin.lineinfile:
        path: "{{ _egl_cred_file }}"
        regexp: "^gitlab_ci_token:"
        line: 'gitlab_ci_token: "{{ _egl_ci_token }}"'
        state: present
      no_log: true
  always:
    - name: Re-encrypt the credentials file
      ansible.builtin.command: >-
        ansible-vault encrypt "{{ _egl_cred_file }}" --vault-password-file "{{ _egl_vault_file }}"
      when: _egl_cred_decrypted | default(false) | bool
      changed_when: false
      no_log: true
