---
- name: List pipeline triggers
  ansible.builtin.uri:
    url: "{{ _egl_url }}/api/v4/projects/{{ _egl_project_id }}/triggers"
    method: GET
    headers: "{{ _egl_headers }}"
    ca_path: "{{ _egl_ca | default(omit, true) }}"
    validate_certs: true
    status_code: [200]
  register: _egl_triggers
  no_log: true

- name: Find the Omnia trigger
  ansible.builtin.set_fact:
    _egl_existing_trigger: >-
      {{ _egl_triggers.json | selectattr('description', 'equalto', external_gitlab_trigger_description)
         | list | first | default({}) }}
  no_log: true

- name: Create the pipeline trigger when missing
  ansible.builtin.uri:
    url: "{{ _egl_url }}/api/v4/projects/{{ _egl_project_id }}/triggers"
    method: POST
    headers: "{{ _egl_headers }}"
    ca_path: "{{ _egl_ca | default(omit, true) }}"
    validate_certs: true
    body_format: json
    body:
      description: "{{ external_gitlab_trigger_description }}"
    status_code: [200, 201]
  register: _egl_new_trigger
  no_log: true
  when: _egl_existing_trigger | length == 0

- name: Set trigger facts
  ansible.builtin.set_fact:
    _egl_trigger: "{{ _egl_existing_trigger if _egl_existing_trigger | length > 0 else _egl_new_trigger.json }}"
    _egl_trigger_created: "{{ _egl_existing_trigger | length == 0 }}"
  no_log: true

- name: Store the trigger token locally (root:0600)
  ansible.builtin.copy:
    content: "{{ _egl_trigger.token }}"
    dest: "{{ hostvars['localhost']['output_project_dir'] }}/{{ external_gitlab_trigger_token_name }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Record the trigger (ID only)
  ansible.builtin.include_tasks: record.yml
  vars:
    _egl_res:
      type: trigger
      id: "{{ _egl_trigger.id }}"
      action: "{{ 'created' if _egl_trigger_created | bool else 'adopted' }}"
      state: applied
