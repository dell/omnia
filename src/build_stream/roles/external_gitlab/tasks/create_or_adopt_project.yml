---
- name: Look up the project by path
  ansible.builtin.uri:
    url: "{{ _egl_url }}/api/v4/projects/{{ _egl_project_path | urlencode | replace('/', '%2F') }}"
    method: GET
    headers: "{{ _egl_headers }}"
    ca_path: "{{ _egl_ca | default(omit, true) }}"
    validate_certs: true
    status_code: [200, 404]
  register: _egl_project_lookup
  retries: 3
  delay: 5
  until: _egl_project_lookup is succeeded
  no_log: true

- name: Fail closed when a same-named project is not owned by Omnia
  ansible.builtin.fail:
    msg: "{{ external_gitlab_collision_msg }}"
  when:
    - _egl_project_lookup.status == 200
    - external_gitlab_project_marker not in (_egl_project_lookup.json.description | default('', true))

- name: Create the project
  when: _egl_project_lookup.status == 404
  block:
    - name: Create the project via the GitLab API
      ansible.builtin.uri:
        url: "{{ _egl_url }}/api/v4/projects"
        method: POST
        headers: "{{ _egl_headers }}"
        ca_path: "{{ _egl_ca | default(omit, true) }}"
        validate_certs: true
        body_format: json
        body:
          name: "{{ gitlab_project_name }}"
          path: "{{ gitlab_project_name }}"
          namespace_id: "{{ _egl_namespace_id }}"
          description: "{{ external_gitlab_project_description }}"
          visibility: "{{ gitlab_project_visibility | default('private') }}"
          initialize_with_readme: true
          default_branch: "{{ _egl_branch }}"
        status_code: "{{ external_gitlab_status_codes.project_create }}"
      register: _egl_new_project
      no_log: true

    - name: Record the created project
      ansible.builtin.include_tasks: record.yml
      vars:
        _egl_res: {type: project, id: "{{ _egl_new_project.json.id }}", action: created, state: applied}

- name: Set project facts
  ansible.builtin.set_fact:
    _egl_project_created: "{{ _egl_project_lookup.status == 404 }}"
    _egl_project_id: "{{ ((_egl_new_project if _egl_project_lookup.status == 404 else _egl_project_lookup).json.id) | string }}"
    _egl_project_web_url: "{{ (_egl_new_project if _egl_project_lookup.status == 404 else _egl_project_lookup).json.web_url }}"

- name: Record the adopted project and reconcile its CI/CD timeout
  when: not _egl_project_created
  block:
    - name: Record the adopted project
      ansible.builtin.include_tasks: record.yml
      vars:
        _egl_res: {type: project, id: "{{ _egl_project_id }}", action: adopted, state: applied}

- name: Set the project CI/CD job timeout
  ansible.builtin.uri:
    url: "{{ _egl_url }}/api/v4/projects/{{ _egl_project_id }}"
    method: PUT
    headers: "{{ _egl_headers }}"
    ca_path: "{{ _egl_ca | default(omit, true) }}"
    validate_certs: true
    body_format: json
    body:
      build_timeout: "{{ gitlab_project_ci_timeout | default(9000) }}"
    status_code: [200]
  no_log: true

- name: Record the project ID in the journal header
  journal:
    path: "{{ _egl_journal_path }}"
    action: init
    run_id: "{{ _egl_run_id }}"
    header:
      omnia_project: "{{ hostvars['localhost']['project_name'] }}"
      gitlab_url: "{{ _egl_url }}"
      project_id: "{{ _egl_project_id }}"

- name: Check whether the default branch is protected
  ansible.builtin.uri:
    url: "{{ _egl_url }}/api/v4/projects/{{ _egl_project_id }}/protected_branches/{{ _egl_branch | urlencode }}"
    method: GET
    headers: "{{ _egl_headers }}"
    ca_path: "{{ _egl_ca | default(omit, true) }}"
    validate_certs: true
    status_code: [200, 404]
  register: _egl_branch_protection
  no_log: true

- name: Protect the default branch (Maintainer push/merge) so protected variables are delivered
  when: _egl_branch_protection.status == 404
  block:
    - name: Create the branch protection
      ansible.builtin.uri:
        url: "{{ _egl_url }}/api/v4/projects/{{ _egl_project_id }}/protected_branches"
        method: POST
        headers: "{{ _egl_headers }}"
        ca_path: "{{ _egl_ca | default(omit, true) }}"
        validate_certs: true
        body_format: json
        body:
          name: "{{ _egl_branch }}"
          push_access_level: 40
          merge_access_level: 40
        status_code: [201]
      no_log: true

    - name: Record the branch protection
      ansible.builtin.include_tasks: record.yml
      vars:
        _egl_res: {type: branch_protection, name: "{{ _egl_branch }}", action: created, state: applied}
