---
- name: Display the external GitLab configuration summary
  ansible.builtin.debug:
    msg:
      - "External GitLab configured: {{ _egl_url }}"
      - "Project: {{ _egl_project_path }} (ID {{ _egl_project_id }}, {{ 'created' if _egl_project_created | bool else 'adopted' }})"
      - "Project URL: {{ _egl_project_web_url }}"
      - "Runner: operator-provided (not managed by Omnia)"
      - "CA trust: {{ _egl_ca if _egl_ca | length > 0 else 'system default' }}"
      - "Setup journal: {{ _egl_journal_path }}"
