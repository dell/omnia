---
# Record one resource in the setup journal. Pass the entry as _egl_res.
- name: "Record {{ _egl_res.type }} in the setup journal"  # noqa name[template]
  journal:
    path: "{{ _egl_journal_path }}"
    action: record
    run_id: "{{ _egl_run_id }}"
    resource: "{{ _egl_res }}"
