---
# Custom CA is used only for Omnia's own HTTPS calls to the external GitLab.
# The operator configures CA trust on their runner. Without a custom CA the
# system trust store is used.
- name: Validate the custom CA bundle (existence, PEM format, root-owned, mode 0644 or stricter)
  validate_external_gitlab:
    url: "{{ _egl_url }}"
    token: "{{ gitlab_api_token }}"
    namespace: "{{ gitlab_project_namespace }}"
    ca_cert_path: "{{ _egl_ca }}"
    ca_only: true
  no_log: true
  when: _egl_ca | length > 0

- name: Report the CA trust source
  ansible.builtin.debug:
    msg: >-
      {{ 'Using custom CA bundle ' ~ _egl_ca ~ ' for Omnia API calls to the external GitLab. Configure the same CA on your runner.'
         if _egl_ca | length > 0 else 'No custom CA configured; using the system default CA trust store.' }}
