---
# Only after every step succeeded: revoke superseded tokens and persist local state.
- name: Revoke previous omnia-ci project access tokens
  ansible.builtin.uri:
    url: "{{ _egl_url }}/api/v4/projects/{{ _egl_project_id }}/access_tokens/{{ item }}"
    method: DELETE
    headers: "{{ _egl_headers }}"
    ca_path: "{{ _egl_ca | default(omit, true) }}"
    validate_certs: true
    status_code: [204, 404]
  loop: "{{ _egl_previous_token_ids | default([]) }}"
  no_log: true

- name: Persist the GitLab project ID in the BuildStream credentials file
  ansible.builtin.include_tasks: persist_project_id.yml
