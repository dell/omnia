---
# build_stream_setup — Self-contained setup for the build_stream domain.
# Replaces: upgrade_checkup.yml + include_input_dir.yml + create_container_group.yml
#
# What it does:
#   1. Guard: block if upgrade is in progress
#   2. Load omnia project config (input/output dirs)
#   3. Load OIM metadata
#   4. Create oim inventory group

# =====================================================================
# Step 0: Tag validation
# =====================================================================
- name: Include tag validation
  ansible.builtin.include_tasks: validate_tags.yml

# =====================================================================
# Step 1: Upgrade guard
# =====================================================================
- name: Check upgrade lock file
  ansible.builtin.stat:
    path: "{{ upgrade_lock_path }}"
  register: upgrade_lock

- name: Block playbook while upgrade is in progress
  ansible.builtin.fail:
    msg: "{{ upgrade_in_progress_msg }}"
  when:
    - upgrade_lock.stat.exists
    - not (upgrade_mode | default(false) | bool)

# =====================================================================
# Step 2: Set project directories as facts and verify
# =====================================================================
- name: Set input_project_dir and output_project_dir as facts
  ansible.builtin.set_fact:
    input_project_dir: "{{ input_project_dir }}"
    output_project_dir: "{{ output_project_dir }}"
    oim_shared_path: "{{ oim_shared_path }}"
    cacheable: true

- name: Verify the input project directory exists
  ansible.builtin.stat:
    path: "{{ input_project_dir }}"
  register: verify_project_dir

- name: Fail if input project directory does not exist
  ansible.builtin.fail:
    msg: "{{ project_dir_not_exist_fail_msg }}"
  when: not (verify_project_dir.stat.exists | default(false))

- name: Ensure output project directory exists
  ansible.builtin.file:
    path: "{{ output_project_dir }}"
    state: directory
    mode: "0755"

# =====================================================================
# Step 3: Create oim inventory group (local connection)
# =====================================================================
- name: Create {{ oim_host_group }} group # noqa: name[template]
  ansible.builtin.add_host:
    hostname: "{{ oim_host_group }}"
    ansible_host: 127.0.0.1
    ansible_port: "{{ oim_host_port }}"
    ansible_connection: local
    groups: "{{ oim_host_group }}"
  when: create_oim_group | default(false) | bool

# =====================================================================
# Step 4: Set guard fact so downstream plays can skip re-runs
# =====================================================================
- name: Mark build_stream_setup as done
  ansible.builtin.set_fact:
    build_stream_setup_done: true
    cacheable: true
