---
# build_stream_setup — Self-contained setup for the build_stream domain.
#
# What it does:
#   1. Load omnia project config (input/output dirs)
#   2. Load OIM metadata
#   3. Create oim inventory group

# =====================================================================
# Step 0: Tag validation
# =====================================================================
- name: Include tag validation
  ansible.builtin.include_tasks: validate_tags.yml

# =====================================================================
# Step 1: Resolve configuration from environment variables
# =====================================================================
- name: Resolve configuration from environment
  ansible.builtin.set_fact:
    omnia_data_path: "{{ lookup('env', 'OMNIA_DATA_PATH') | default('/opt/omnia', true) }}"
    project_name: "{{ lookup('env', 'OMNIA_PROJECT_NAME') | default('project_default', true) }}"
    cacheable: true

# =====================================================================
# Step 2: Set project directories as facts and verify
# =====================================================================
- name: Set input_project_dir and output_project_dir as facts
  ansible.builtin.set_fact:
    input_project_dir: "{{ omnia_data_path }}/build_stream/input/{{ project_name }}"
    output_project_dir: "{{ omnia_data_path }}/build_stream/output/{{ project_name }}"
    oim_shared_path: "{{ omnia_data_path }}"
    cacheable: true

# Resolve the GitLab mode (hosted/external) from the project config so the
# cleanup flows can dispatch to the right GitLab cleanup playbook. Kept as a
# cacheable localhost fact that import_playbook 'when' guards read via
# hostvars['localhost'].gitlab_mode. An unreadable or incomplete config leaves
# the mode empty so GitLab cleanup fails closed.
- name: Initialise GitLab mode configuration
  ansible.builtin.set_fact:
    _bss_config_peek: {}

- name: Peek gitlab_mode from build_stream_config.yml
  ansible.builtin.include_vars:
    file: "{{ input_project_dir }}/build_stream_config.yml"
    name: _bss_config_peek
  failed_when: false

- name: Set gitlab_mode fact for cleanup dispatch
  ansible.builtin.set_fact:
    gitlab_mode: "{{ _bss_config_peek.gitlab_mode | default('') }}"
    cacheable: true

- name: Require an explicit GitLab mode for GitLab cleanup dispatch
  ansible.builtin.assert:
    that:
      - gitlab_mode in ['hosted', 'external']
    fail_msg: >-
      GitLab cleanup requires gitlab_mode to be explicitly set to 'hosted' or
      'external' in build_stream_config.yml. No GitLab or combined cleanup was run.
  when: >-
    provided_tags | default([])
    | intersect(['cleanup', 'cleanup_hosted_gitlab', 'cleanup_external_gitlab'])
    | length > 0

- name: Verify the input project directory exists
  ansible.builtin.stat:
    path: "{{ input_project_dir }}"
  register: verify_project_dir
  when: not (build_stream_cleanup_context | default(false) | bool)

- name: Fail if input project directory does not exist
  ansible.builtin.fail:
    msg: "{{ project_dir_not_exist_fail_msg }}"
  when:
    - not (build_stream_cleanup_context | default(false) | bool)
    - not (verify_project_dir.stat.exists | default(false))

- name: Ensure output project directory exists
  ansible.builtin.file:
    path: "{{ output_project_dir }}"
    state: directory
    mode: "0755"
  when: not (build_stream_cleanup_context | default(false) | bool)

# =====================================================================
# Step 3: Create oim inventory group (local connection)
# =====================================================================
- name: Create {{ oim_host_group }} group # noqa: name[template]
  ansible.builtin.add_host:
    hostname: "{{ oim_host_group }}"
    ansible_host: 127.0.0.1
    ansible_port: "{{ oim_host_port }}"
    ansible_connection: local
    groups: "{{ oim_host_group }}"
  when: create_oim_group | default(false) | bool

# =====================================================================
# Step 4: Set guard fact so downstream plays can skip re-runs
# =====================================================================
- name: Mark build_stream_setup as done
  ansible.builtin.set_fact:
    build_stream_setup_done: true
    cacheable: true
