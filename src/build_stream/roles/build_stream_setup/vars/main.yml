---

# --- Standalone mode ---
# When standalone_mode is true the playbook runs directly on the host
# without requiring the omnia_core container.  Input is read from the
# local input/ directory and container-internal paths are bypassed.
# Override with: -e standalone_mode=true
standalone_mode: false

# --- Upgrade guard ---
upgrade_lock_path: /opt/omnia/.data/upgrade_in_progress.lock
upgrade_in_progress_msg: >-
  Upgrade is not completed fully.
  Please run upgrade.yml to complete upgrade before running any other playbook using the below command:
  "ansible-playbook /omnia/src/playbooks/upgrade/upgrade.yml"
  If you don't require input files to be migrated, reconfigure the default input files, remove the lock file using the following command
  "rm /opt/omnia/.data/upgrade_in_progress.lock" and then proceed.

# --- Input project directory ---
# omnia_data_path is set from OMNIA_DATA_PATH env or defaults to /opt/omnia
omnia_data_path: "{{ lookup('env', 'OMNIA_DATA_PATH') | default('/opt/omnia', true) }}"
omnia_input_dir: "{{ omnia_data_path }}/build_stream/input"
omnia_output_dir: "{{ omnia_data_path }}/build_stream/output"
omnia_input_config_file: "{{ omnia_input_dir }}/default.yml"
omnia_metadata_file_path: "{{ omnia_data_path }}/.data/oim_metadata.yml"
omnia_input_config_syntax_fail_msg: >-
  Unable to load the Omnia project configuration file at {{ omnia_input_config_file }}.
  Please ensure the file exists and has valid YAML syntax before re-running the playbook.
project_dir_not_exist_fail_msg: >-
  The project directory at {{ input_project_dir }} does not exist.
  Please ensure the directory exists before re-running the playbook.

# --- Standalone defaults (used only when standalone_mode is true) ---
standalone_input_project_dir: "{{ standalone_oim_shared_path }}/build_stream/input/project_default"
standalone_output_project_dir: "{{ standalone_oim_shared_path }}/build_stream/output/project_default"
standalone_oim_shared_path: "{{ omnia_data_path }}"

# --- OIM group ---
oim_host_port: "22"
oim_host_group: "oim"
