---

project_dir_not_exist_fail_msg: >-
  The project directory at {{ input_project_dir }} does not exist.
  Please ensure the directory exists before re-running the playbook.

# --- OIM group ---
oim_host_port: "22"
oim_host_group: "oim"

# --- Tag validation ---
supported_tags:
  - precheck
  - validate
  - credentials
  - prepare
  - execute
  - build
  - cleanup
  - cleanup_gitlab
  - cleanup_build_stream
skip_credential_tags:
  - precheck
  - cleanup
  - cleanup_gitlab
  - cleanup_build_stream
  - validate
# Tags that represent a cleanup flow (credential collection + input
# validation are skipped, and the cleanup context is active).
cleanup_tags:
  - cleanup
  - cleanup_gitlab
  - cleanup_build_stream
invalid_tag_combinations:
  - [prepare, cleanup]
  - [execute, cleanup]
  - [build, cleanup]
  - [precheck, prepare]
  - [precheck, execute]
  - [precheck, build]
  - [precheck, cleanup]
  - [credentials, prepare]
  - [credentials, execute]
  - [credentials, build]
  - [credentials, cleanup]
  - [credentials, precheck]
  # New cleanup component tags are mutually exclusive with deploy tags
  # and with each other / the combined cleanup tag.
  - [prepare, cleanup_gitlab]
  - [execute, cleanup_gitlab]
  - [build, cleanup_gitlab]
  - [precheck, cleanup_gitlab]
  - [credentials, cleanup_gitlab]
  - [prepare, cleanup_build_stream]
  - [execute, cleanup_build_stream]
  - [build, cleanup_build_stream]
  - [precheck, cleanup_build_stream]
  - [credentials, cleanup_build_stream]
  - [cleanup, cleanup_gitlab]
  - [cleanup, cleanup_build_stream]
  - [cleanup_gitlab, cleanup_build_stream]
# --- Tag validation messages ---
tag_validation_fail_msg: |
  Invalid tag usage detected.
  Supported tags: {{ supported_tags | join(', ') }}
  Invalid tags provided: {{ invalid_tags | join(', ') }}
  Please use only supported tags.
tag_combination_fail_msg: |
  Invalid tag combination detected: {{ ansible_run_tags | join(', ') }}
  The following tag combinations are not allowed:
  {% for combo in invalid_tag_combinations %}
  - {{ combo | join(' + ') }}
  {% endfor %}
  Please run with only ONE tag at a time (or no tags for default flow).
