---

build_stream_schema_dir: >-
  {{ role_path | dirname | dirname }}/plugins/module_utils/input_validation/schema
build_stream_validation_log_dir: >-
  {{ input_project_dir | dirname | dirname }}/log/{{ input_project_dir | basename }}

build_stream_validation_start_msg: >-
  Starting BuildStream input validation (L1 schema + L2 logic).
build_stream_validation_pass_msg: BuildStream configuration validation passed.
build_stream_validation_fail_msg: >-
  BuildStream configuration validation failed. Review the reported errors and
  correct the input files before re-running.
build_stream_config_missing_msg: >-
  build_stream_config.yml not found at {{ input_project_dir }}/build_stream_config.yml.
  Create this file before running BuildStream.
