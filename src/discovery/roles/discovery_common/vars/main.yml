---

# The OME inventory client uses the standard HTTPS endpoint and does not accept
# a configurable port. Keep the precheck aligned with that runtime contract.
discovery_ome_https_port: 443

discovery_ome_config_path: >-
  {{ (discovery_input_dir ~ '/discovery_config.yml')
     if discovery_input_dir is defined
     else 'discovery_config.yml' }}

discovery_ome_ip_required_msg: |-
  OME endpoint configuration is incomplete.
  Required value: ome_ip
  Configuration file: {{ discovery_ome_config_path }}
  Action: Set ome_ip to the reachable OME appliance IPv4 address.

discovery_ome_connectivity_failure_msg: |-
  OME endpoint connectivity check failed.
  Endpoint: {{ ome_ip | default('not configured') | trim }}:{{ discovery_ome_https_port }}
  Timeout: {{ discovery_ome_connectivity_timeout }} seconds
  Details: {{ discovery_ome_connectivity_result.msg | default('TCP connection was not established') }}
  Configuration file: {{ discovery_ome_config_path }}
  Action: Verify the OME appliance state, IP address, routing, and firewall access from the OIM host.

discovery_ome_connectivity_success_status: >-
  reachable ({{ ome_ip | trim }}:{{ discovery_ome_https_port }})

discovery_ome_connectivity_success_msg: >-
  OME endpoint connectivity check PASSED: {{ ome_ip | trim }}:{{ discovery_ome_https_port }}
