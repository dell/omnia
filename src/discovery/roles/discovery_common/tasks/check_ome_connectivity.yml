---

- name: Validate OME endpoint configuration
  ansible.builtin.assert:
    that:
      - >-
        ome_ip is defined and
        ome_ip is string and
        (ome_ip | trim | length > 0)
    fail_msg: "{{ discovery_ome_ip_required_msg }}"
    quiet: true

- name: Probe OME HTTPS port
  ansible.builtin.wait_for:
    host: "{{ ome_ip | trim }}"
    port: "{{ discovery_ome_https_port | int }}"
    state: started
    connect_timeout: "{{ discovery_ome_connect_timeout | int }}"
    timeout: "{{ discovery_ome_connectivity_timeout | int }}"
  register: discovery_ome_connectivity_result
  changed_when: false
  failed_when: false

- name: Confirm OME HTTPS endpoint connectivity
  ansible.builtin.assert:
    that:
      - discovery_ome_connectivity_result.state | default('') == 'started'
    fail_msg: "{{ discovery_ome_connectivity_failure_msg }}"
    quiet: true

- name: Record reachable OME endpoint
  ansible.builtin.set_fact:
    discovery_ome_connectivity_status: >-
      {{ discovery_ome_connectivity_success_status }}

- name: Display OME endpoint connectivity result
  ansible.builtin.debug:
    msg: "{{ discovery_ome_connectivity_success_msg }}"
