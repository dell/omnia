---

- name: Ensure discovery output directory exists
  ansible.builtin.file:
    path: "{{ discovery_output_dir }}"
    state: directory
    mode: '0755'

- name: Set timestamped discovery report output file path
  ansible.builtin.set_fact:
    discovery_report_output_file: "{{ discovery_output_dir }}/bmc_discovery_report_{{ pxe_mapping_timestamp }}.csv"

- name: Generate BMC discovery report
  omnia.discovery.generate_discovery_report:
    servers: "{{ discovered_servers }}"
    output_file: "{{ discovery_report_output_file }}"
  register: discovery_report_result

- name: Set xnames mapping summary
  ansible.builtin.set_fact:
    xnames_mapping_message: >-
      {{
        'BMC xnames mapping file generated: ' ~ xnames_mapping_file
        if (xnames_result | default({'xnames_count': 0})).xnames_count | default(0) | int > 0
        else 'BMC xnames mapping skipped: no location data present'
      }}

- name: Set conditional xnames copy instruction
  ansible.builtin.set_fact:
    _xnames_copy_instruction: >-
      {{
        'cp ' ~ xnames_mapping_file ~ ' ' ~ (xnames_mapping_file | dirname) ~ '/xnames_mapping_file.csv'
        if (xnames_result | default({'xnames_count': 0})).xnames_count | default(0) | int > 0
        else ''
      }}

- name: Display Magellan discovery completion message
  ansible.builtin.debug:
    msg: "{{ _discovery_report_msg | select | list }}"
  vars:
    _discovery_report_msg:
      - "============================================================"
      - "Magellan Discovery Complete"
      - "============================================================"
      - "BMC PXE mapping file generated: {{ pxe_mapping_output_file }}"
      - "{{ xnames_mapping_message }}"
      - "BMC discovery report generated: {{ discovery_report_output_file }}"
      - "  (Lists link status of BMC, Ethernet, and InfiniBand NICs for each server)"
      - "Total servers discovered: {{ discovered_servers | length }}"
      - ""
      - "Next Steps:"
      - "1. Review and edit the generated PXE mapping file:"
      - "     {{ pxe_mapping_output_file }}"
      - ""
      - "2. Review the discovery report for NIC link statuses:"
      - "     {{ discovery_report_output_file }}"
      - ""
      - "3. Update HOSTNAME, FUNCTIONAL_GROUP_NAME, GROUP_NAME as needed."
      - ""
      - "4. Copy the reviewed files to the non-timestamped names used by provision:"
      - "     cp {{ pxe_mapping_output_file }} {{ pxe_mapping_output_file | dirname }}/bmc_pxe_mapping_file.csv"
      - "     {{ _xnames_copy_instruction }}"
      - ""
      - "5. Update the following parameter in provision_config.yml:"
      - "     pxe_mapping_file_path: {{ pxe_mapping_output_file | dirname }}/bmc_pxe_mapping_file.csv"
      - ""
      - "6. Run:"
      - "     ansible-playbook orchestrator/orchestrator.yml"
      - "============================================================"
