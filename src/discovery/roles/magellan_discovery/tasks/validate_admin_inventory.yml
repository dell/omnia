---

- name: Check that admin inventory file exists
  ansible.builtin.stat:
    path: "{{ admin_inventory_path }}"
  register: admin_inventory_stat

- name: Fail when admin inventory file is not found
  ansible.builtin.fail:
    msg: "{{ admin_inventory_not_found_msg }}"
  when: not admin_inventory_stat.stat.exists

- name: Validate and expand admin inventory CSV
  omnia.discovery.validate_admin_inventory:
    input_csv: "{{ admin_inventory_path }}"
    output_csv: "{{ admin_complete_inventory_path }}"
    utils_path: "{{ role_path }}/../../utils"
  register: admin_complete_inventory_result

- name: Set complete inventory fact
  ansible.builtin.set_fact:
    admin_complete_inventory: "{{ admin_complete_inventory_result.complete }}"

- name: Display complete inventory count
  ansible.builtin.debug:
    msg: "Expanded {{ admin_complete_inventory | length }} complete inventory entries from {{ admin_inventory_path }}"
