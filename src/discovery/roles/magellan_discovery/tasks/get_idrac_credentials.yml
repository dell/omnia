---

- name: Check if iDRAC credential file exists
  ansible.builtin.stat:
    path: "{{ omnia_config_credentials_file }}"
  register: idrac_cred_file_stat

- name: Check if vault key file exists
  ansible.builtin.stat:
    path: "{{ omnia_config_credentials_vault_key }}"
  register: idrac_vault_key_stat

- name: Load iDRAC credentials
  when: idrac_cred_file_stat.stat.exists
  block:
    - name: Check if credential file is vault-encrypted
      ansible.builtin.command: "head -n 1 {{ omnia_config_credentials_file }}"
      changed_when: false
      register: idrac_cred_file_content
      no_log: true

    - name: Remember whether the credential file was encrypted
      ansible.builtin.set_fact:
        _idrac_cred_was_encrypted: >-
          {{ idrac_vault_key_stat.stat.exists
             and '$ANSIBLE_VAULT' in idrac_cred_file_content.stdout }}
      no_log: true

    - name: Decrypt credential file
      ansible.builtin.command: >-
        ansible-vault decrypt {{ omnia_config_credentials_file }}
        --vault-password-file {{ omnia_config_credentials_vault_key }}
      changed_when: false
      when:
        - _idrac_cred_was_encrypted | bool
      no_log: true

    - name: Include iDRAC credentials
      ansible.builtin.include_vars:
        file: "{{ omnia_config_credentials_file }}"
      no_log: true

  always:
    - name: Re-encrypt credential file
      ansible.builtin.command: >-
        ansible-vault encrypt {{ omnia_config_credentials_file }}
        --vault-password-file {{ omnia_config_credentials_vault_key }}
      changed_when: false
      when:
        - _idrac_cred_was_encrypted | default(false) | bool
      no_log: true

    - name: Clear encryption tracking fact
      ansible.builtin.set_fact:
        _idrac_cred_was_encrypted: false
      no_log: true

- name: Set default iDRAC credentials if not provided
  ansible.builtin.set_fact:
    bmc_username: "{{ bmc_username | default('root', true) }}"
    bmc_password: "{{ bmc_password | default('calvin', true) }}"
  no_log: true
