---

# Unified credential file populated by discovery_credentials / prepare_oim.
omnia_config_credentials_file: "{{ hostvars['localhost']['input_project_dir'] }}/omnia_config_credentials.yml"
omnia_config_credentials_vault_key: "{{ hostvars['localhost']['input_project_dir'] }}/.omnia_config_credentials_key"

# Messages
admin_inventory_not_found_msg: |
  Admin inventory file not found at {{ admin_inventory_path }}.
  Please create the file with columns: SERVICE_TAG, GROUP_NAME, FUNCTIONAL_GROUP_NAME, ROW, RACK, USLOT, RANGE
  USLOT may be left empty to be auto-assigned per (ROW, RACK).

no_servers_found_msg: |
  No servers could be discovered from the admin inventory.
  Please verify that the iDRAC IPs, credentials, and network connectivity are correct.
