---

# Path to the sparse admin inventory CSV consumed by the Magellan discovery
# mechanism. The default location is the discovery input directory for the
# active project.
admin_inventory_path: >-
  {{ hostvars['localhost']['discovery_input_dir']
     | default('/opt/omnia/discovery/input/project_default') }}/admin_inventory.csv

# Path to the generated complete inventory CSV (BMC_IP, USLOT, etc.) consumed by
# magellan_inventory.
admin_complete_inventory_path: >-
  {{ hostvars['localhost']['discovery_input_dir']
     | default('/opt/omnia/discovery/input/project_default') }}/admin_complete_inventory.csv

# Default functional group name for discovered nodes (used when not provided in admin_inventory.csv)
default_functional_group: "slurm_node_aarch64"

# Default group name (used when not provided in admin_inventory.csv)
default_group_name: "grp0"

# Hostname prefix for discovered nodes
hostname_prefix: "nid"

# Starting hostname number
hostname_start_number: 1

# Hostname padding (e.g., 5 digits = nid00001)
hostname_padding: 5

# Verify SSL certificates when calling iDRAC Redfish endpoints.
# Set to true when the iDRAC has a trusted certificate; override in your
# inventory or extra vars if required.
verify_ssl: false
