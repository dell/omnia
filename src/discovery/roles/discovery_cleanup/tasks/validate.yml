---

- name: Validate resolved Discovery cleanup paths and options
  ansible.builtin.assert:
    that:
      - discovery_cleanup_data_path is match('^/')
      - >-
        (discovery_cleanup_data_path | regex_replace('/+$', ''))
        not in ['', '/', '/opt', '/var', '/etc', '/usr', '/root']
      - discovery_cleanup_project_name is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
      - discovery_cleanup_input_dir == discovery_cleanup_expected_input_dir
      - discovery_cleanup_output_dir == discovery_cleanup_expected_output_dir
      - >-
        cleanup_credentials is not defined or
        (cleanup_credentials | string | trim | lower) in ['true', 'false']
    fail_msg: "{{ discovery_cleanup_invalid_configuration_msg }}"
    quiet: true
