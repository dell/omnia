---

- name: Inspect Discovery project log directory
  ansible.builtin.stat:
    path: "{{ discovery_cleanup_log_dir }}"
    follow: false
  register: discovery_cleanup_log_stat
  become: true

- name: Validate Discovery project log directory type
  ansible.builtin.assert:
    that:
      - >-
        not discovery_cleanup_log_stat.stat.exists or
        (discovery_cleanup_log_stat.stat.isdir | default(false) and
         not (discovery_cleanup_log_stat.stat.islnk | default(false)))
    fail_msg: "{{ discovery_cleanup_invalid_log_type_msg }}"
    quiet: true

- name: Remove Discovery project log directory
  ansible.builtin.file:
    path: "{{ discovery_cleanup_log_dir }}"
    state: absent
  when: discovery_cleanup_log_stat.stat.exists | default(false)
  become: true

- name: Remove Discovery Ansible log directory
  ansible.builtin.file:
    path: "{{ discovery_cleanup_ansible_log_dir }}"
    state: absent
  become: true
  delegate_to: localhost
  connection: local

- name: Recreate empty Discovery project log directory
  ansible.builtin.file:
    path: "{{ discovery_cleanup_log_dir }}"
    state: directory
    mode: "0755"
  become: true

- name: Verify Discovery project log directory
  ansible.builtin.stat:
    path: "{{ discovery_cleanup_log_dir }}"
    follow: false
  register: discovery_cleanup_final_log_stat
  when: not ansible_check_mode
  become: true

- name: Find entries in recreated Discovery project log directory
  ansible.builtin.find:
    paths:
      - "{{ discovery_cleanup_log_dir }}"
    file_type: any
    hidden: true
    recurse: false
    follow: false
  register: discovery_cleanup_remaining_log_entries
  when: not ansible_check_mode
  become: true

- name: Validate Discovery project log directory is empty
  ansible.builtin.assert:
    that:
      - discovery_cleanup_final_log_stat.stat.exists | default(false)
      - discovery_cleanup_final_log_stat.stat.isdir | default(false)
      - not (discovery_cleanup_final_log_stat.stat.islnk | default(false))
      - >-
        discovery_cleanup_remaining_log_entries.skipped_paths
        | default({}) | length == 0
      - discovery_cleanup_remaining_log_entries.matched | default(0) | int == 0
    fail_msg: "{{ discovery_cleanup_log_not_empty_msg }}"
    quiet: true
  when: not ansible_check_mode
