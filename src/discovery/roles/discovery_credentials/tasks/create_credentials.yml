---

# Create credential file from template if it does not exist

- name: Decrypt and include vars for existing credential file
  ansible.builtin.include_role:
    name: discovery_common
    tasks_from: decrypt_include_encrypt.yml
  vars:
    credential_file_path: "{{ credential_file.file_path }}"
    vault_password_file: "{{ credential_file.vault_path }}"
  when: omnia_cred_file_exists

- name: Create credential file if missing
  when: not omnia_cred_file_exists
  block:
    - name: Ensure credential directory exists
      ansible.builtin.file:
        path: "{{ credential_file.file_path | dirname }}"
        state: directory
        mode: '0755'

    - name: Create credential file from template
      ansible.builtin.template:
        src: "{{ role_path }}/templates/omnia_credential.j2"
        dest: "{{ credential_file.file_path }}"
        mode: "{{ credential_file.file_mode | default('0600') }}"

    - name: Generate vault password key file
      ansible.builtin.shell: >-
        set -o pipefail &&
        openssl rand -base64 32 | tr -d '\n' > "{{ credential_file.vault_path }}"
      when: not omnia_vault_key_exists
      changed_when: true

    - name: Set vault key permissions
      ansible.builtin.file:
        path: "{{ credential_file.vault_path }}"
        mode: '0400'
      when: not omnia_vault_key_exists

    - name: Encrypt new credential file
      ansible.builtin.command: >-
        ansible-vault encrypt "{{ credential_file.file_path }}"
        --vault-password-file "{{ credential_file.vault_path }}"
      changed_when: true

    - name: Include vars from new credential file
      ansible.builtin.include_role:
        name: discovery_common
        tasks_from: decrypt_include_encrypt.yml
      vars:
        credential_file_path: "{{ credential_file.file_path }}"
        vault_password_file: "{{ credential_file.vault_path }}"
