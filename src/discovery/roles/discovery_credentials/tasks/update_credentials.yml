---

# Prompt for missing OME credentials when BMC discovery is enabled

- name: Check if OME credentials need prompting
  ansible.builtin.set_fact:
    ome_username_needed: "{{ ome_username | default('') | length == 0 }}"
    ome_password_needed: "{{ ome_password | default('') | length == 0 }}"

- name: Prompt for OME credentials if missing
  when: ome_username_needed or ome_password_needed
  block:
    - name: Decrypt credential file for updates
      ansible.builtin.command: >-
        ansible-vault decrypt "{{ credential_file.file_path }}"
        --vault-password-file "{{ credential_file.vault_path }}"
      changed_when: false
      failed_when: false

    - name: Prompt for OME username
      ansible.builtin.pause:
        prompt: "[ome_username] OME username is a [MANDATORY] credential. Enter value"
      register: ome_username_input
      no_log: true
      when: ome_username_needed

    - name: Validate OME username not empty
      ansible.builtin.fail:
        msg: "Failed. OME username is mandatory and cannot be empty."
      when:
        - ome_username_needed
        - ome_username_input.user_input | length == 0

    - name: Validate OME username format
      validate_credentials:
        credential_field: "ome_username"
        credential_input: "{{ ome_username_input.user_input }}"
        module_utils_path: "{{ module_utils_path }}"
      when:
        - ome_username_needed
        - ome_username_input.user_input | length > 0

    - name: Prompt for OME password
      ansible.builtin.pause:
        prompt: "[ome_password] OME password is a [MANDATORY] credential. Enter value"
        echo: false
      register: ome_password_input
      no_log: true
      when: ome_password_needed

    - name: Validate OME password not empty
      ansible.builtin.fail:
        msg: "Failed. OME password is mandatory and cannot be empty."
      when:
        - ome_password_needed
        - ome_password_input.user_input | length == 0

    - name: Prompt to confirm OME password
      ansible.builtin.pause:
        prompt: "Confirm [ome_password]"
        echo: false
      register: ome_password_confirm
      no_log: true
      when:
        - ome_password_needed
        - ome_password_input.user_input | length > 0

    - name: Ensure passwords match
      ansible.builtin.fail:
        msg: "Failed. Passwords do not match. Please try again."
      when:
        - ome_password_needed
        - ome_password_input.user_input != ome_password_confirm.user_input

    - name: Update credential file with OME username
      ansible.builtin.lineinfile:
        path: "{{ credential_file.file_path }}"
        regexp: '^ome_username:'
        line: "ome_username: \"{{ ome_username_input.user_input }}\""
      no_log: true
      when: ome_username_needed

    - name: Update credential file with OME password
      ansible.builtin.lineinfile:
        path: "{{ credential_file.file_path }}"
        regexp: '^ome_password:'
        line: "ome_password: \"{{ ome_password_input.user_input }}\""
      no_log: true
      when: ome_password_needed

    - name: Reload updated credential variables
      ansible.builtin.include_vars: "{{ credential_file.file_path }}"
      no_log: true

    - name: Encrypt credential file after updates
      ansible.builtin.command: >-
        ansible-vault encrypt "{{ credential_file.file_path }}"
        --vault-password-file "{{ credential_file.vault_path }}"
      changed_when: false

  rescue:
    - name: Encrypt credential file if it exists and is unencrypted
      ansible.builtin.shell: >-
        set -o pipefail &&
        if [ -f "{{ credential_file.file_path }}" ]; then
          if ! head -n1 "{{ credential_file.file_path }}" | grep -q '\$ANSIBLE_VAULT;'; then
            ansible-vault encrypt "{{ credential_file.file_path }}" --vault-password-file "{{ credential_file.vault_path }}"
          fi
        fi
      changed_when: false

    - name: Fail with cleanup message
      ansible.builtin.fail:
        msg: "Failed to update discovery credentials. Please try again."
