---

# Discovery credential management
# Handles creation, prompting, and encryption of credential files
# Discovery only needs OME credentials from discovery_credentials.yml

# Step 1: Validate credential file existence
- name: Validate credential files
  ansible.builtin.include_tasks: validate_credentials.yml

# Step 2: Create credential files if missing
- name: Create missing credential files
  ansible.builtin.include_tasks: create_credentials.yml

# Step 3: Update credentials — prompt for missing OME creds
- name: Update credentials
  ansible.builtin.include_tasks: update_credentials.yml
  when: enable_bmc_discovery | default(false) | bool
