---

# Credential file configuration — discovery-scoped
# Uses a domain-specific file to avoid conflict with orchestrator credentials.
credential_file:
  credential_type: "Discovery"
  template: "{{ role_path }}/templates/omnia_credential.j2"
  file_path: "{{ input_project_dir }}/discovery_credentials.yml"
  file_mode: "0600"
  vault_path: "{{ input_project_dir }}/.discovery_credentials_key"

# Module utils path for credential validation
module_utils_path: "{{ role_path }}/../../plugins/module_utils"

# Credential definitions for discovery
# Discovery only needs OME credentials
discovery_credentials:
  discovery:
    mandatory:
      - { username: ome_username, password: ome_password }

# Error messages
credential_encrypt_fail_msg: "Failed to encrypt credential file."
mandatory_credentials_msg: "Failed. Please provide valid credential for mandatory input."
