---

- name: Run OME discovery pipeline
  block:
    - name: Verify OME HTTPS endpoint connectivity
      ansible.builtin.include_role:
        name: discovery_common
        tasks_from: check_ome_connectivity.yml

    - name: Include OME credential handling
      ansible.builtin.include_tasks: get_ome_credentials.yml

    - name: Collect server inventory from OME
      ansible.builtin.include_tasks: collect_inventory.yml

    - name: Generate PXE mapping file
      ansible.builtin.include_tasks: generate_pxe_mapping.yml

    - name: Generate BMC discovery report
      ansible.builtin.include_tasks: generate_discovery_report.yml

    - name: Write discovery status file (success)
      ansible.builtin.copy:
        content: |
          overall_status: "success"
          discovery_mechanism: "ome"
          bmc_pxe_mapping_file: "{{ pxe_mapping_output_file | default('') }}"
          servers_discovered: {{ discovered_servers | default([]) | length }}
          timestamp: "{{ ansible_date_time.iso8601 | default('unknown') }}"
        dest: >-
          {{ output_project_dir
             | default(discovery_output_dir) }}/discovery_status.yml
        mode: '0644'

  rescue:
    - name: Write discovery status file (failed)
      ansible.builtin.copy:
        content: |
          overall_status: "failed"
          discovery_mechanism: "ome"
          bmc_pxe_mapping_file: "{{ pxe_mapping_output_file | default('') }}"
          servers_discovered: {{ discovered_servers | default([]) | length }}
          failed_task: "{{ ansible_failed_task.name | default('unknown') }}"
          failure_reason: "{{ ansible_failed_result.msg | default('unknown error') }}"
          timestamp: "{{ ansible_date_time.iso8601 | default('unknown') }}"
        dest: >-
          {{ output_project_dir
             | default(discovery_output_dir) }}/discovery_status.yml
        mode: '0644'

    - name: Re-raise the original failure
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('OME discovery failed — see discovery_status.yml for details') }}"
