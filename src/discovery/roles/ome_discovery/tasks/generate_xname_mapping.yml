---

- name: Set timestamp for XNAME mapping file
  ansible.builtin.set_fact:
    xname_mapping_timestamp: "{{ pxe_mapping_timestamp }}"

- name: Set timestamped XNAME mapping output file path
  ansible.builtin.set_fact:
    xname_mapping_output_file: "{{ discovery_output_dir }}/xname_mapping_file_{{ xname_mapping_timestamp }}.csv"

- name: Set canonical XNAME mapping output path (latest)
  ansible.builtin.set_fact:
    xname_mapping_latest_file: "{{ discovery_output_dir }}/xname_mapping_file.csv"

- name: Generate XNAME mapping file from OME location data
  generate_xname_mapping:
    servers: "{{ discovered_servers }}"
    output_file: "{{ xname_mapping_output_file }}"
  register: xname_mapping_result

- name: Create symlink to latest XNAME mapping file
  ansible.builtin.file:
    src: "{{ xname_mapping_output_file }}"
    dest: "{{ xname_mapping_latest_file }}"
    state: link
    force: true
  when: xname_mapping_result.xname_file_generated | bool

- name: Report XNAME mapping generation (location-based)
  ansible.builtin.debug:
    msg: "{{ xname_mapping_location_success_msg }}"
  when: xname_mapping_result.xname_file_generated | bool

- name: Report XNAME mapping skipped (missing location data)
  ansible.builtin.debug:
    msg: "{{ xname_mapping_skipped_msg }}"
  when: not (xname_mapping_result.xname_file_generated | bool)
