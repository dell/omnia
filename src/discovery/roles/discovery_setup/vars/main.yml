---

# --- Upgrade guard ---
upgrade_lock_file: /opt/omnia/.data/upgrade_in_progress.lock
upgrade_in_progress_msg: >-
  Upgrade is not completed fully.
  Please run upgrade.yml to complete upgrade before running any other playbook using the below command:
  "ansible-playbook /omnia/src/playbooks/upgrade/upgrade.yml"
  If you don't require input files to be migrated, reconfigure the default input files, remove the lock file using the following command
  "rm /opt/omnia/.data/upgrade_in_progress.lock" and then proceed.

# --- Base paths ---
# Domain-scoped paths: /opt/omnia/discovery/input/<project>/
# (resolved from OMNIA_DATA_PATH env var in tasks/main.yml)

# --- Tag validation ---
supported_tags:
  - discovery
  - validate
  - cleanup

skip_credential_tags:
  - cleanup
  - validate

invalid_tag_combinations:
  - [discovery, cleanup]

# Discovery setup defaults
default_project_name: "project_default"
discovery_config_file: "discovery_config.yml"
network_spec_file: "network_spec.yml"

# Error messages
input_dir_missing_msg: >-
  Discovery input directory does not exist.
  Please create it and populate with discovery_config.yml and network_spec.yml.
config_load_fail_msg: >-
  Failed to load discovery configuration.
  Please verify discovery_config.yml syntax.
