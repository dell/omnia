---

# --- Upgrade guard ---
upgrade_lock_file: /opt/omnia/.data/upgrade_in_progress.lock
upgrade_in_progress_msg: >-
  Upgrade is not completed fully.
  Please run upgrade.yml to complete upgrade before running any other playbook using the below command:
  "ansible-playbook /omnia/src/playbooks/upgrade/upgrade.yml"
  If you don't require input files to be migrated, reconfigure the default input files, remove the lock file using the following command
  "rm /opt/omnia/.data/upgrade_in_progress.lock" and then proceed.

# --- Base paths ---
# Domain-scoped paths: /opt/omnia/discovery/input/<project>/
# (resolved from OMNIA_DATA_PATH env var in tasks/main.yml)

# --- Tag validation ---
supported_tags:
  - precheck
  - validate
  - credentials
  - prepare
  - execute
  - discovery
  - cleanup
  - upgrade
  - rollback

skip_credential_tags:
  - precheck
  - cleanup
  - validate

invalid_tag_combinations:
  - [execute, cleanup]
  - [discovery, cleanup]
  - [prepare, cleanup]
  - [prepare, upgrade]
  - [execute, upgrade]
  - [discovery, upgrade]
  - [cleanup, upgrade]
  - [prepare, rollback]
  - [execute, rollback]
  - [discovery, rollback]
  - [cleanup, rollback]
  - [upgrade, rollback]
  - [precheck, prepare]
  - [precheck, execute]
  - [precheck, discovery]
  - [precheck, cleanup]
  - [precheck, upgrade]
  - [precheck, rollback]
  - [credentials, prepare]
  - [credentials, execute]
  - [credentials, discovery]
  - [credentials, cleanup]
  - [credentials, upgrade]
  - [credentials, rollback]
  - [credentials, precheck]

# --- Tag validation messages ---
tag_validation_fail_msg: |
  Invalid tag usage detected.
  Supported tags: {{ supported_tags | join(', ') }}
  Invalid tags provided: {{ invalid_tags | join(', ') }}
  Please use only supported tags.
tag_combination_fail_msg: |
  Invalid tag combination detected: {{ ansible_run_tags | join(', ') }}
  The following tag combinations are not allowed:
  {% for combo in invalid_tag_combinations %}
  - {{ combo | join(' + ') }}
  {% endfor %}
  Please run with only ONE tag at a time (or no tags for default flow).

# Discovery setup defaults
default_project_name: "project_default"
discovery_config_file: "discovery_config.yml"
network_spec_file: "network_spec.yml"

# Error messages
input_dir_missing_msg: >-
  Discovery input directory does not exist.
  Please create it and populate with discovery_config.yml and network_spec.yml.
config_load_fail_msg: >-
  Failed to load discovery configuration.
  Please verify discovery_config.yml syntax.
