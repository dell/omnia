# ansible.cfg for running playbooks from the domain root.
#
# Usage:
#   cd src/discovery
#   ansible-playbook playbooks/discovery.yml --tags validate
#
# NOTE: Ansible resolves paths relative to ansible.cfg location, NOT the playbook.
# Since ansible.cfg is at discovery/, roles_path is ./roles (same dir).

[defaults]
log_path = /var/log/omnia/discovery/discovery.log
remote_tmp = ~/.ansible/tmp/
host_key_checking = false
forks = 5
timeout = 180
executable = /bin/bash
interpreter_python = /usr/bin/python3
deprecation_warnings = false
show_task_path_on_failure = false
stdout_callback = omnia.discovery.omnia_default
collections_path = .:~/.ansible/collections:/usr/share/ansible/collections

[persistent_connection]
command_timeout = 180
connect_timeout = 180

[ssh_connection]
retries = 3
ssh_args = -o ControlMaster=auto -o ControlPersist=60 -o ConnectTimeout=60
