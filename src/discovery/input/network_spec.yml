---

# Discovery-owned network specification.
# This is an independent copy for the discovery domain.
# The orchestrator domain maintains its own separate copy.
#
# Discovery consumes admin_network.subnet, ib_network.ipv4_subnet
# (or legacy ib_network.subnet), and ib_network.ipv6_subnet for
# IP address derivation in the PXE mapping file.

Networks:
  - admin_network:
      oim_nic_name: "eno1"
      subnet: "172.16.107.0"
      netmask_bits: "24"
      primary_oim_admin_ip: "172.16.107.254"
      primary_oim_bmc_ip: ""
      router: "172.16.107.254"
      dynamic_range: "172.16.107.201-172.16.107.250"
      dns: []
      ntp_servers: []
      additional_subnets: []

  - ib_network:
      ipv4_subnet: "192.168.0.0"
      ipv4_netmask_bits: "24"
      ipv6_subnet: "fd00:1b::"
      ipv6_netmask_bits: "64"
      ib_addr_mode: "dual-stack"
      dns: []
