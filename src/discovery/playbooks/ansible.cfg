# ansible.cfg for discovery playbooks.
#
# Usage:
#   cd src/discovery/playbooks
#   ansible-playbook discovery.yml -e "discovery_mechanism=ome"
#
# Role, module, and plugin paths are relative to THIS directory (playbooks/).
# Sub-playbooks (validate_discovery.yml, discovery_credentials.yml) share this config.

[defaults]
log_path = /var/log/omnia/discovery/discovery.log
roles_path = ../roles:~/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles
library = ../plugins/modules
module_utils = ../plugins/module_utils
callback_plugins = ../plugins/callback
remote_tmp = ~/.ansible/tmp/
host_key_checking = false
forks = 5
timeout = 180
executable = /bin/bash
interpreter_python = /usr/bin/python3
deprecation_warnings = false
show_task_path_on_failure = false
stdout_callback = omnia.discovery.omnia_default
collections_path = ..:~/.ansible/collections:/usr/share/ansible/collections

[persistent_connection]
command_timeout = 180
connect_timeout = 180

[ssh_connection]
retries = 3
ssh_args = -o ControlMaster=auto -o ControlPersist=60 -o ConnectTimeout=60
