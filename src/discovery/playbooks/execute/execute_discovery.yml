---
# execute_discovery.yml -- Execute OME discovery.
# Runs the BMC discovery pipeline using OME as the discovery mechanism.
#
# Standalone usage:
#   cd src/discovery/playbooks/execute
#   ansible-playbook execute_discovery.yml

# Standalone: run discovery_setup + credentials
- name: Standalone setup
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Run discovery_setup role (standalone only)
      ansible.builtin.include_role:
        name: discovery_setup
      when: not (discovery_setup_done | default(false) | bool)

    - name: Run discovery_credentials role (standalone only)
      ansible.builtin.include_role:
        name: discovery_credentials
      when: not (discovery_setup_done | default(false) | bool)

- name: Execute BMC Discovery via OME
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    discovery_mechanism: "ome"
  pre_tasks:
    - name: Fail when ome_ip is not configured
      ansible.builtin.fail:
        msg: >-
          ome_ip must be provided in discovery_config.yml when using OME discovery.
          Please set 'enable_bmc_discovery: true' and provide a valid 'ome_ip' in
          {{ discovery_input_dir }}/discovery_config.yml.
      when: ome_ip | default('') | length == 0

  tasks:
    - name: Include OME discovery role
      ansible.builtin.include_role:
        name: ome_discovery
