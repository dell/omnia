---
# discovery.yml -- Top-level entry point for the discovery domain.
# Discovers BMC endpoints via OME and generates PXE mapping files.
#
# Inputs:  /opt/omnia/discovery/input/<project>/
#   - discovery_config.yml
#   - network_spec.yml
#
# Outputs: /opt/omnia/discovery/output/<project>/
#   - bmc_pxe_mapping_file.csv
#   - bmc_discovery_report.csv
#
# Usage (run ONE tag at a time -- no comma-separated tags):
#   cd src/discovery/playbooks
#   ansible-playbook discovery.yml                                 # Default: validate + credentials + execute (OME)
#   ansible-playbook discovery.yml --tags precheck                 # Env precheck only (placeholder)
#   ansible-playbook discovery.yml --tags validate                 # Validate config only (no credentials)
#   ansible-playbook discovery.yml --tags credentials              # Collect/update OME credentials only
#   ansible-playbook discovery.yml --tags prepare                  # Prepare discovery environment (placeholder)
#   ansible-playbook discovery.yml --tags execute                  # Run OME discovery
#   ansible-playbook discovery.yml --tags cleanup                  # Cleanup discovery artifacts (placeholder)
#   ansible-playbook discovery.yml --tags upgrade                  # Upgrade flow (placeholder)
#   ansible-playbook discovery.yml --tags rollback                 # Rollback flow (placeholder)
#
# Tags (mutually exclusive -- pick ONE):
#   (none)       -- Default flow: always + validate + credentials + execute (OME)
#   precheck     -- Environment precheck (placeholder -- future release)
#   validate     -- Validate discovery_config.yml input (skips credentials)
#   credentials  -- Collect/update OME credentials only (no discovery)
#   prepare      -- Prepare discovery environment (placeholder -- future release)
#   execute      -- Run BMC discovery via OME (with credentials)
#   cleanup      -- Cleanup discovery artifacts (placeholder -- future release)
#   upgrade      -- Upgrade flow (placeholder -- future release)
#   rollback     -- Rollback flow (placeholder -- future release)
#
# Tag Validation:
#   - Invalid tags will fail with error message
#   - Invalid combinations (e.g., execute + cleanup) will fail
#   - precheck, cleanup, and validate tags skip credential prompting
#
# Internal steps (always):
#   Step 0: Setup -- load env vars (omnia.env), validate host, check prereqs
#   Step 1: Input validation (schema + logic)
#   Step 2: Credential collection (skipped for precheck/cleanup/validate tags)

# =========================================================================
# Step 0: Setup -- load config, validate host, check prereqs
# =========================================================================
- name: Setup discovery environment
  hosts: localhost
  connection: local
  gather_facts: false
  tags: always
  roles:
    - discovery_setup

# =========================================================================
# Step 1: Input validation (schema + logic) -- skipped for precheck
# =========================================================================
- name: Validate discovery input configuration
  ansible.builtin.import_playbook: validate/validate_discovery.yml
  when: "'precheck' not in (hostvars['localhost']['provided_tags'] | default([]))"
  tags:
    - always
    - validate

# =========================================================================
# Step 2: Credential collection (skipped for cleanup/validate/precheck)
# =========================================================================
- name: Create and update credential config files
  ansible.builtin.import_playbook: credentials/discovery_credentials.yml
  when: not (skip_discovery_credentials | default(false) | bool)
  tags: always

# =========================================================================
# FLOW: precheck -- Environment validation (opt-in only)
# =========================================================================
- name: Precheck discovery environment
  ansible.builtin.import_playbook: precheck/precheck_discovery.yml
  tags:
    - never
    - precheck

# =========================================================================
# FLOW: credentials -- Standalone credential collection
# =========================================================================
# No dedicated play needed -- the 'always'-tagged credential step (Step 2)
# fires automatically because 'credentials' is not in skip_credential_tags.
# Running --tags credentials only triggers: setup + validate + credential prompt.

# =========================================================================
# FLOW: prepare -- Prepare discovery environment (opt-in only)
# =========================================================================
- name: Prepare discovery environment
  ansible.builtin.import_playbook: prepare/prepare_discovery.yml
  tags:
    - never
    - prepare

# =========================================================================
# FLOW: execute -- Run BMC discovery via OME (default + opt-in)
# =========================================================================
- name: Execute BMC Discovery via OME
  ansible.builtin.import_playbook: execute/execute_discovery.yml
  tags:
    - execute
    - discovery

# =========================================================================
# FLOW: cleanup -- Remove discovery artifacts (opt-in only)
# =========================================================================
- name: Cleanup discovery
  ansible.builtin.import_playbook: cleanup/cleanup_discovery.yml
  tags:
    - never
    - cleanup

# =========================================================================
# FLOW: upgrade -- Upgrade flow placeholder (opt-in only)
# =========================================================================
- name: Upgrade discovery
  ansible.builtin.import_playbook: upgrade/upgrade_discovery.yml
  tags:
    - never
    - upgrade

# =========================================================================
# FLOW: rollback -- Rollback flow placeholder (opt-in only)
# =========================================================================
- name: Rollback discovery
  ansible.builtin.import_playbook: rollback/rollback_discovery.yml
  tags:
    - never
    - rollback
