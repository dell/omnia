# =============================================================================
# image_build_config.yml — Image Build Manager Configuration
# =============================================================================
#
# Per-domain input configuration for the image_build_manager domain.
# Edit this file, then run: ./domain-init.sh  (or omnia.sh --init)
#
# Sections:
#   1. Upstream Dependency    — repo_manager output path
#   2. S3 Storage Backend     — S3 provider and endpoint
#   3. Image Builder          — builder type, container image, build controls
#   4. Functional Groups      — which OS image variants to build
#   5. ARM Build Host         — aarch64 remote build host
#
# NOTE: catalog_file is sourced from CATALOG_FILE_PATH environment variable
# (set in omnia.env). It is NOT configured here.
#
# S3 bucket names are FIXED constants (do NOT change):
#   boot-images  — OS boot images (kernel, initramfs, rootfs)
#   efi-images   — EFI boot artifacts
# =============================================================================


# ---------------------------------------------------------------------------
# 1. Upstream Dependency
# ---------------------------------------------------------------------------
# Full path to repo_status.yml produced by repo_manager.
# Contains RPM repo URLs organized by version and architecture.
# TLS certificate path is derived from repo_manager.certificates.server_crt in repo_status.yml.
# Convention: <OMNIA_DATA_PATH>/repo_manager/output/<project_name>/repo_status.yml
# domain-init.sh replaces __OMNIA_DATA_PATH__ with the actual OMNIA_DATA_PATH at staging time.
repo_manager_output_path: "__OMNIA_DATA_PATH__/repo_manager/output/__PROJECT_NAME__/repo_status.yml"


# ---------------------------------------------------------------------------
# 2. S3 Storage Backend
# ---------------------------------------------------------------------------
# provider: "minio" (deployed locally by image_build_manager) or "powerscale" (external).
# endpoint_url: Required for powerscale; auto-detected for minio — leave empty.
s3_configurations:
  provider: "minio"
  endpoint_url: ""


# ---------------------------------------------------------------------------
# 3. Image Builder
# ---------------------------------------------------------------------------
# image_build_type: Which OpenCHAMI image builder to use.
#   "image-builder"     — Standard OpenCHAMI image-builder (default).
#                         Config format: options/repos/packages/cmds
#   "image-thrillhouse" — Next-gen OpenCHAMI builder with extended features.
#                         Config format: meta/layer (inline repos, script commands)
# Each type uses its own config templates and container image.
image_build_type: "image-builder"

# build_image: Controls for the build phase.
#   max_parallel     — Max concurrent image builds. 0 = unlimited.
#   build_timeout    — Per-build timeout in seconds.
#   force_rebuild    — Bypass package hash cache.
#   backup_s3_images — Copy S3 artifacts to *_prev before rebuild.
#   repo_ssl_verify  — SSL + GPG check on RPM repos. Set false for self-signed certs.
build_image:
  max_parallel: 0
  build_timeout: 7200
  force_rebuild: false
  backup_s3_images: false
  repo_ssl_verify: true


# ---------------------------------------------------------------------------
# 4. Functional Groups
# ---------------------------------------------------------------------------
# functional_groups_source: Where the list of groups to build comes from.
#   "config"  — Groups and packages come from package_groups.yml in this
#               project directory. All groups defined in package_groups.yml
#               matching the build architecture (_x86_64 / _aarch64 suffix)
#               are built automatically. No separate group list needed.
#   "catalog" — Auto-resolve from catalog JSON (CATALOG_FILE_PATH env var).
#               Groups are read from catalog.functionallayer[] and filtered
#               by build_arch. Packages resolved from catalog groups/packages.
#               OS type and version are extracted from the catalog baseos group.
functional_groups_source: "catalog"


# ---------------------------------------------------------------------------
# 5. ARM Build Host (aarch64)
# ---------------------------------------------------------------------------
# IP address of the ARM admin node for aarch64 image builds.
# Leave empty ("") to skip aarch64 builds entirely.
aarch64_inventory_host_ip: ""
aarch64_ssh_user: "root"
