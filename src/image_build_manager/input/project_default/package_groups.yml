      - sg3_utils
      - lsscsi
      # login_node role-specific
      - slurm-slurmd
      - slurm
      # openldap
      - openldap
      - openldap-clients
      - sssd
      - sssd-ldap
      - oddjob
      - oddjob-mkhomedir

  login_compiler_node_x86_64:
