---
# gather_oim_data.yml — Validate admin_aarch64 inventory and set OIM
# network facts for the aarch64 build flow. Runs on localhost.

# Inventory Validation
- name: Fail if no inventory provided
  ansible.builtin.fail:
    msg: "{{ no_inventory_error_msg }}"
  when: groups['all'] | length == 0

- name: Fail if inventory group 'admin_aarch64' is empty
  ansible.builtin.fail:
    msg: "{{ admin_aarch64_empty_error_msg }}"
  when: groups['admin_aarch64'] is not defined or groups['admin_aarch64'] | length == 0

- name: Fail if inventory group 'admin_aarch64' has more than one host
  ansible.builtin.fail:
    msg: "{{ admin_aarch64_count_error_msg }}"
  when: groups['admin_aarch64'] | length != 1

# Set OIM PXE IP and hostname from localhost facts
- name: Set OIM network facts
  ansible.builtin.set_fact:
    oim_pxe_ip: "{{ hostvars['localhost']['admin_nic_ip'] }}"
    oim_hostname: >-
      {{ hostvars['localhost']['host_name']
         if hostvars['localhost']['host_name'].endswith('.' + hostvars['localhost']['domain_name'])
         else hostvars['localhost']['host_name'] + '.' + hostvars['localhost']['domain_name'] }}
    cacheable: true

- name: Ensure aarch64 openchami directory exists on localhost
  ansible.builtin.file:
    path: "{{ ochami_aarch_64_dir }}"
    state: directory
    mode: "0755"

# Pre-download regctl for aarch64 on OIM so it can be SCP'd to the aarch64 node
- name: Ensure aarch64 staging directory exists on OIM
  ansible.builtin.file:
    path: "{{ regctl_oim_staging_dir }}"
    state: directory
    mode: "0755"

- name: Check if regctl aarch64 binary already staged on OIM
  ansible.builtin.stat:
    path: "{{ regctl_oim_staging_path }}"
  register: _regctl_oim_stat

- name: Download regctl aarch64 binary to OIM staging directory
  ansible.builtin.get_url:
    url: "{{ regctl_download_url }}"
    dest: "{{ regctl_oim_staging_path }}"
    mode: "0755"
    timeout: 120
  register: _regctl_oim_download
  retries: 3
  delay: 10
  until: _regctl_oim_download is succeeded
  when: not _regctl_oim_stat.stat.exists
  failed_when: false
