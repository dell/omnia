---
# setup_ssh.yml — Establish passwordless SSH from OIM (localhost) to aarch64 node.
# Called from a localhost play in build_image_aarch64.yml BEFORE the
# hosts: admin_aarch64 play, so that Ansible can connect to the remote node.
#
# Flow:
#   1. Generate SSH keypair if missing
#   2. Add aarch64 host to known_hosts
#   3. Check if passwordless SSH already works
#   4. If not, run ssh-copy-id with the credential password
#   5. Verify passwordless SSH works

# =========================================================================
# Phase 1: Ensure SSH keypair exists on OIM
# =========================================================================

- name: Ensure SSH directory exists
  ansible.builtin.file:
    path: "{{ aarch64_ssh_private_key_path | dirname }}"
    state: directory
    mode: "0700"

- name: Check if SSH private key exists
  ansible.builtin.stat:
    path: "{{ aarch64_ssh_private_key_path }}"
  register: _ssh_private_key_stat

- name: Check if SSH public key exists
  ansible.builtin.stat:
    path: "{{ aarch64_ssh_public_key_path }}"
  register: _ssh_public_key_stat

- name: Fail when SSH public key has no matching private key
  ansible.builtin.fail:
    msg: "{{ ssh_orphaned_public_key_fail_msg }}"
  when:
    - not _ssh_private_key_stat.stat.exists
    - _ssh_public_key_stat.stat.exists

- name: Generate SSH keypair
  when:
    - not _ssh_private_key_stat.stat.exists
    - not _ssh_public_key_stat.stat.exists
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -t
      - rsa
      - -b
      - "4096"
      - -f
      - "{{ aarch64_ssh_private_key_path }}"
      - -N
      - ""
    creates: "{{ aarch64_ssh_private_key_path }}"
  register: _ssh_keygen
  changed_when: _ssh_keygen.rc == 0

- name: Enforce SSH private key permissions
  ansible.builtin.file:
    path: "{{ aarch64_ssh_private_key_path }}"
    state: file
    mode: "0600"

- name: Derive public key from managed private key
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -y
      - -f
      - "{{ aarch64_ssh_private_key_path }}"
  register: _ssh_derived_public_key
  changed_when: false

- name: Reconcile matching SSH public key
  ansible.builtin.copy:
    content: "{{ _ssh_derived_public_key.stdout | trim }}\n"
    dest: "{{ aarch64_ssh_public_key_path }}"
    mode: "0644"

# =========================================================================
# Phase 2: Add aarch64 host to known_hosts
# =========================================================================

- name: Add aarch64 host to known_hosts
  ansible.builtin.known_hosts:
    name: "{{ aarch64_inventory_host_ip }}"
    key: "{{ lookup('pipe', 'ssh-keyscan -H ' + aarch64_inventory_host_ip) }}"

# =========================================================================
# Phase 3: Check if passwordless SSH already works
# =========================================================================

- name: Check if passwordless SSH is already enabled
  ansible.builtin.command:
    argv:
      - ssh
      - -i
      - "{{ aarch64_ssh_private_key_path }}"
      - -o
      - IdentitiesOnly=yes
      - -o
      - BatchMode=yes
      - -o
      - ConnectTimeout=10
      - -o
      - StrictHostKeyChecking=no
      - "{{ aarch64_ssh_user | default('root') }}@{{ aarch64_inventory_host_ip }}"
      - echo OK
  register: _ssh_check
  changed_when: false
  failed_when: false

- name: Set SSH passwordless status
  ansible.builtin.set_fact:
    aarch64_ssh_passwordless: "{{ (_ssh_check.rc | default(1) == 0) | bool }}"
    aarch64_ssh_initially_configured: "{{ (_ssh_check.rc | default(1) == 0) | bool }}"
    cacheable: true

# =========================================================================
# Phase 4: Setup passwordless SSH via ssh-copy-id (if needed)
# =========================================================================

- name: Setup passwordless SSH via ssh-copy-id
  when: not (aarch64_ssh_passwordless | bool)
  ansible.builtin.expect:
    command: >-
      ssh-copy-id -o StrictHostKeyChecking=no -o IdentitiesOnly=yes
      -i {{ aarch64_ssh_public_key_path }}
      {{ aarch64_ssh_user | default('root') }}@{{ aarch64_inventory_host_ip }}
    responses:
      "(?i)password:": "{{ aarch64_ssh_password | default('') }}"
  no_log: true
  register: _ssh_copy_id_result
  changed_when: _ssh_copy_id_result.rc | default(1) == 0
  failed_when: false

- name: Fail safely if SSH public key installation failed
  when:
    - not (aarch64_ssh_passwordless | bool)
    - _ssh_copy_id_result.rc | default(1) != 0
  ansible.builtin.fail:
    msg: "{{ ssh_key_install_fail_msg }}"

# =========================================================================
# Phase 5: Verify passwordless SSH works
# =========================================================================

- name: Verify passwordless SSH is working
  when: not (aarch64_ssh_passwordless | bool)
  ansible.builtin.command:
    argv:
      - ssh
      - -i
      - "{{ aarch64_ssh_private_key_path }}"
      - -o
      - IdentitiesOnly=yes
      - -o
      - BatchMode=yes
      - -o
      - ConnectTimeout=10
      - -o
      - StrictHostKeyChecking=no
      - "{{ aarch64_ssh_user | default('root') }}@{{ aarch64_inventory_host_ip }}"
      - echo OK
  register: _ssh_verify
  changed_when: false
  failed_when: false

- name: Update SSH passwordless status after key installation
  ansible.builtin.set_fact:
    aarch64_ssh_passwordless: >-
      {{ (aarch64_ssh_passwordless | bool)
         or (_ssh_verify.rc | default(1) == 0) }}
    cacheable: true

- name: Fail if SSH setup failed
  when: not (aarch64_ssh_passwordless | bool)
  ansible.builtin.fail:
    msg: "{{ ssh_setup_fail_msg }}"

- name: Display SSH status
  ansible.builtin.debug:
    msg: >-
      SSH to {{ aarch64_inventory_host_ip }}:
      {{ 'already configured (passwordless)' if (aarch64_ssh_initially_configured | bool)
         else 'configured via ssh-copy-id' }}
