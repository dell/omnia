---
# prepare_aarch64_node/tasks/main.yml — Prepare a remote aarch64 build host.
# No NFS dependency — uses local work directories on the aarch64 node.
# Image pull: tries repo manager (Pulp) first, falls back to DockerHub/upstream.
# regctl: copies from OIM localhost first, downloads from GitHub if copy fails.
#
# Prerequisites (completed before this role runs):
#   - validate_aarch64_host.yml: ping check, admin_aarch64 group creation
#   - setup_ssh.yml: SSH keygen, known_hosts, ssh-copy-id, verify

# =========================================================================
# Phase 1: Architecture validation
# =========================================================================

- name: Check machine architecture
  ansible.builtin.command: uname -m
  register: arch_result
  changed_when: false

- name: Fail if machine is not aarch64
  ansible.builtin.fail:
    msg: "{{ not_aarch64_error_msg }}"
  when: arch_result.stdout != "aarch64"

# =========================================================================
# Phase 2: OIM hostname resolution on aarch64 node
# =========================================================================

- name: Remove any existing entries for OIM hostname in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '.*\s+{{ hostvars["localhost"]["oim_hostname"] }}$'
    state: absent
  changed_when: true

- name: Add correct OIM PXE IP and hostname to /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ hostvars['localhost']['oim_pxe_ip'] }} {{ hostvars['localhost']['oim_hostname'] }}"
    state: present
    mode: "{{ file_permissions_644 }}"
    create: true

- name: Verify OIM PXE IP and hostname in /etc/hosts
  ansible.builtin.command:
    cmd: "grep {{ hostvars['localhost']['oim_pxe_ip'] }} /etc/hosts"
  register: etc_hosts_check
  changed_when: false
  failed_when: etc_hosts_check.stdout == ""

- name: Display verification result
  ansible.builtin.debug:
    msg: "Entry in /etc/hosts: {{ etc_hosts_check.stdout }}"

- name: Ping OIM hostname from target host
  ansible.builtin.raw: "ping -c 2 {{ hostvars['localhost']['oim_hostname'] }}"
  register: ping_result
  changed_when: false
  failed_when: false

- name: Warn if OIM is not reachable from aarch64 node
  ansible.builtin.debug:
    msg: >
      WARNING: Cannot ping OIM ({{ hostvars['localhost']['oim_hostname'] }}) from aarch64 node.
      Image pull from repo manager will likely fail. DockerHub fallback will be attempted.
  when: ping_result.rc | default(1) != 0

# =========================================================================
# Phase 3: Create local work directories (replaces NFS mount)
# =========================================================================

- name: Ensure aarch64 work directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "{{ dir_permissions_755 }}"
  become: true
  loop:
    - "{{ aarch64_work_dir }}"
    - "{{ ochami_aarch_64_dir }}"
    - "{{ aarch64_work_dir }}/workdir"
    - "{{ aarch64_work_dir }}/log"

# =========================================================================
# Phase 4: Repo manager configuration (optional — for Pulp-based pulls)
# =========================================================================

- name: Generate repo_manager.repo from rpm_repos.aarch64
  ansible.builtin.copy:
    dest: "{{ repo_file_path }}"
    mode: "{{ file_permissions_644 }}"
    content: |
      {% for repo_name, repo_url in (hostvars['localhost']['rpm_repos_aarch64'] | default({})).items() %}
      [{{ repo_name }}]
      name={{ repo_name }}
      baseurl={{ repo_url }}
      enabled=1
      gpgcheck=0
      sslverify=1
      {% endfor %}
  when: (hostvars['localhost']['rpm_repos_aarch64'] | default({})) | length > 0

- name: Copy repo manager certificate to target host
  ansible.builtin.copy:
    src: "{{ repo_cert_path }}"
    dest: "{{ anchors_path }}"
    mode: "{{ file_permissions_644 }}"
  become: true
  when: repo_cert_path | default('') | length > 0

- name: Update CA trust on target host
  ansible.builtin.command: update-ca-trust
  register: update_ca
  changed_when: false
  when: repo_cert_path | default('') | length > 0

# =========================================================================
# Phase 5: Pull builder container image (Pulp first, DockerHub fallback)
# =========================================================================

- name: Build repo manager image path for aarch64
  ansible.builtin.set_fact:
    builder_image_path: >-
      {{ hostvars['localhost']['oim_pxe_ip'] }}:{{ hostvars['localhost']['repo_port'] | default(2225) }}/{{ repo_builder_image }}

- name: Check if builder image already exists locally
  containers.podman.podman_image_info:
    name: "{{ local_tag }}"
  register: local_image_info

- name: Pull and tag aarch64 builder image
  when: local_image_info.images | length == 0
  block:
    - name: Pull aarch64 image from repo manager registry (Pulp)
      containers.podman.podman_image:
        name: "{{ builder_image_path }}"
        state: present
      register: podman_pull_result
      retries: "{{ pull_image_retries }}"
      delay: "{{ pull_image_delay }}"
      until: podman_pull_result is not failed
      changed_when: false

    - name: Tag pulled image for aarch64 build
      containers.podman.podman_tag:
        image: "{{ builder_image_path }}"
        target_names:
          - "{{ local_tag }}"
      changed_when: false

  rescue:
    - name: Attempt direct pull from upstream registry (internet fallback)
      block:
        - name: Display fallback notice
          ansible.builtin.debug:
            msg: "{{ pull_image_fallback_msg.format(repo_path=builder_image_path, upstream_image=repo_builder_image) }}"

        - name: Pull image directly from upstream registry
          containers.podman.podman_image:
            name: "{{ repo_builder_image }}"
            state: present
          register: direct_pull_result
          retries: "{{ pull_image_retries }}"
          delay: "{{ pull_image_delay }}"
          until: direct_pull_result is not failed
          changed_when: false

        - name: Tag directly pulled image for aarch64 build
          containers.podman.podman_tag:
            image: "{{ repo_builder_image }}"
            target_names:
              - "{{ local_tag }}"
          changed_when: false

        - name: Display direct pull success
          ansible.builtin.debug:
            msg: "{{ pull_image_success_msg.format(upstream_image=repo_builder_image) }}"
            verbosity: 1

      rescue:
        - name: Fail if both pull methods failed
          ansible.builtin.fail:
            msg: "{{ aarch64_image_fail_msg }}"

# =========================================================================
# Phase 6: Install regctl (SCP from localhost first, download fallback)
# =========================================================================

- name: Check if regctl already exists on aarch64 node
  ansible.builtin.stat:
    path: "{{ regctl_bin_path }}"
  register: _regctl_remote_stat

- name: Install regctl on aarch64 node
  when: not _regctl_remote_stat.stat.exists
  block:
    # --- Try 1: Copy from OIM localhost ---
    - name: Check if regctl exists on OIM localhost
      ansible.builtin.stat:
        path: /usr/local/bin/regctl
      register: _regctl_localhost_stat
      delegate_to: localhost

    - name: Copy regctl from OIM localhost to aarch64 node
      ansible.builtin.copy:
        src: /usr/local/bin/regctl
        dest: "{{ regctl_bin_path }}"
        mode: "{{ dir_permissions_755 }}"
      become: true
      when: _regctl_localhost_stat.stat.exists
      register: _regctl_copy_result
      failed_when: false

    # --- Try 2: Download from GitHub releases ---
    - name: Download regctl from GitHub (fallback)
      when: >-
        (not _regctl_localhost_stat.stat.exists) or
        (_regctl_copy_result is defined and _regctl_copy_result is failed)
      block:
        - name: Display regctl download notice
          ansible.builtin.debug:
            msg: "regctl not available from OIM localhost. Downloading {{ regctl_download_url }}"

        - name: Download regctl binary for aarch64
          ansible.builtin.get_url:
            url: "{{ regctl_download_url }}"
            dest: "{{ regctl_bin_path }}"
            mode: "{{ dir_permissions_755 }}"
            timeout: 60
          become: true
          register: _regctl_download_result

      rescue:
        - name: Fail if regctl cannot be obtained
          ansible.builtin.fail:
            msg: "{{ regctl_not_found_msg }}"

- name: Verify regctl binary is functional
  ansible.builtin.command: "{{ regctl_bin_path }} version"
  register: _regctl_version
  changed_when: false
  failed_when: _regctl_version.rc != 0

- name: Display regctl version
  ansible.builtin.debug:
    msg: "regctl version: {{ _regctl_version.stdout | trim }}"

# =========================================================================
# Phase 7: Configure registry access on aarch64 node
# =========================================================================

- name: Compute aarch64 registry host
  ansible.builtin.set_fact:
    _aarch64_registry_host: >-
      {{ hostvars['localhost']['admin_nic_ip']
         if hostvars['localhost']['standalone_mode'] | default(false) | bool
         else hostvars['localhost']['oim_hostname'] }}

- name: Configure regctl to use HTTP for local registry
  ansible.builtin.command: "{{ regctl_bin_path }} registry set --tls disabled {{ _aarch64_registry_host }}:5000"
  register: regctl_result
  changed_when: regctl_result.rc == 0
  become: true
