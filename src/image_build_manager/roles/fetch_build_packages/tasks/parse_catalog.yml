---
# ==========================================================================
# Catalog mode: resolve packages from catalog JSON via Python module
# ==========================================================================
# Uses plugins/modules/parse_catalog.py for performant, testable resolution.
# Resolution: functionallayer[] -> groups.{component}.components[] -> packages.{key}
# Filter: packagetype == 'rpm' AND sources[].architecture == build_arch
# Output: base_image_packages, compute_images_dict, cluster_os_versions

- name: Resolve RPM packages from catalog JSON
  parse_catalog:
    catalog_file: "{{ hostvars['localhost']['catalog_file'] }}"
    build_arch: "{{ build_arch }}"
    package_type: "rpm"
  register: _catalog_result

- name: Set catalog facts from module output
  ansible.builtin.set_fact:
    catalog_identifier: "{{ _catalog_result.catalog_identifier }}"
    base_image_packages: "{{ _catalog_result.base_image_packages }}"
    compute_images_dict: "{{ _catalog_result.compute_images_dict }}"
    cluster_os_versions: "{{ _catalog_result.cluster_os_versions }}"
    cacheable: true

- name: Override OS type and version from catalog base_os group
  ansible.builtin.set_fact:
    cluster_os_type: "{{ _catalog_result.cluster_os_type }}"
    cluster_os_version: "{{ _catalog_result.cluster_os_version }}"
    rhel_tag: "{{ _catalog_result.cluster_os_version }}"
    cacheable: true
  when: _catalog_result.cluster_os_version | default('') | length > 0

- name: Log skipped driver groups
  ansible.builtin.debug:
    msg: >-
      Skipping driver groups (installed post-boot, not in OS image):
      {{ _catalog_result.skipped_driver_groups | join(', ') }}
  when: (_catalog_result.skipped_driver_groups | default([]) | length) > 0

- name: Debug catalog resolution
  ansible.builtin.debug:
    msg: >-
      Catalog '{{ catalog_identifier }}':
      {{ _catalog_result.layer_count }} layers for {{ build_arch }},
      {{ base_image_packages | length }} base packages,
      {{ compute_images_dict | length }} compute groups,
      os_versions={{ cluster_os_versions | default([]) }},
      skipped_driver_groups={{ _catalog_result.skipped_driver_groups | default([]) | length }}
    verbosity: 1
