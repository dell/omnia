---
# ==========================================================================
# Catalog mode: resolve packages from catalog JSON via Python module
# ==========================================================================
# Uses plugins/modules/parse_catalog.py for performant, testable resolution.
# Resolution: functionallayer[] -> groups.{component}.components[] -> packages.{key}
# Filter: packagetype == 'rpm' AND sources[].architecture == build_arch
# Output: base_image_packages, compute_images_dict, service_k8s_version

- name: Resolve RPM packages from catalog JSON
  omnia.image_build.parse_catalog:
    catalog_file: "{{ hostvars['localhost']['catalog_file'] }}"
    build_arch: "{{ build_arch }}"
    package_type: "rpm"
  register: _catalog_result

- name: Set catalog facts from module output
  ansible.builtin.set_fact:
    catalog_identifier: "{{ _catalog_result.catalog_identifier }}"
    base_image_packages: "{{ _catalog_result.base_image_packages }}"
    compute_images_dict: "{{ _catalog_result.compute_images_dict }}"
    service_k8s_version: "{{ _catalog_result.service_k8s_version }}"
    cacheable: true

- name: Debug catalog resolution
  ansible.builtin.debug:
    msg: >-
      Catalog '{{ catalog_identifier }}':
      {{ _catalog_result.layer_count }} layers for {{ build_arch }},
      {{ base_image_packages | length }} base packages,
      {{ compute_images_dict | length }} compute groups,
      service_k8s_version={{ service_k8s_version }}
    verbosity: 1
