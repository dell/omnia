---

- name: Load package_groups.yml for functional group check
  ansible.builtin.include_vars:
    file: "{{ input_project_dir }}/package_groups.yml"
    name: _fg_check_mapping

- name: Check for functional groups - {{ build_arch }}
  ansible.builtin.set_fact:
    fg_present: >-
      {{ (_fg_check_mapping.functional_groups | default({})).keys()
         | select('search', '_' + build_arch + '$')
         | list
         | length > 0 }}
    cacheable: true

- name: Fail if functional groups are not present - {{ build_arch }}
  ansible.builtin.fail:
    msg: "{{ functional_group_absent_msg.splitlines() | join(' ') }}"
  when: not fg_present
