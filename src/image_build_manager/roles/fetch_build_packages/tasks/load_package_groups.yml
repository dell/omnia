---
# Load package_groups.yml as literal data (yaml.safe_load) and reject any
# Jinja delimiters before the content is exposed to Ansible templating.
# Caller sets package_groups_fact_name to the fact the data is published under.
- name: Load package_groups.yml through the literal-YAML boundary
  block:
    - name: Parse and validate package_groups.yml
      load_validated_yaml:
        path: "{{ input_project_dir }}/package_groups.yml"
      register: _package_groups_load

    - name: Publish validated package_groups data
      ansible.builtin.set_fact:
        "{{ package_groups_fact_name }}": "{{ _package_groups_load.data }}"

  rescue:
    - name: Reject unsafe or invalid package_groups.yml
      ansible.builtin.fail:
        msg: >-
          {{ package_groups_invalid_msg }}
          Error code: {{ _package_groups_load.error_code | default('validation_failed') }}.
          Location: {{ _package_groups_load.error_location | default('$') }}.
