---
# Resolve RPM repo URLs for image creation templates.
# Priority: repo_manager output (repo_status.yml) > direct repo manager CLI query.

# ---------------------------------------------------------------------------
# Multi-version repo resolution
# ---------------------------------------------------------------------------
# Collect repos for ALL OS versions present in the architecture.  Group them
# into a per-version lookup (rhel_arch_repos_by_version) so that base and
# compute image builds can select the correct repo set for each releasever.
# rhel_arch_repos is set to the primary version's repos for backward compat.
# ---------------------------------------------------------------------------

- name: Collect all repo_manager repos for {{ build_arch }}
  ansible.builtin.set_fact:
    _all_repo_manager_repos: >-
      {{ hostvars['localhost']['repo_manager_repos_' + build_arch] | default([]) }}

- name: Determine required OS versions from compute images
  ansible.builtin.set_fact:
    _required_os_versions: >-
      {% set versions = [] -%}
      {% for fg_name, fg_data in (compute_images_dict | default({})).items() -%}
        {% set ver = fg_data.os_version | default(rhel_tag) | string -%}
        {% if ver not in versions -%}
          {% set _ = versions.append(ver) -%}
        {% endif -%}
      {% endfor -%}
      {% if versions | length == 0 -%}
        {% set _ = versions.append(rhel_tag | string) -%}
      {% endif -%}
      {{ versions }}

- name: Build per-version repo lookup from repo_manager output
  ansible.builtin.set_fact:
    rhel_arch_repos_by_version: >-
      {% set result = {} -%}
      {% for repo in _all_repo_manager_repos -%}
        {% set ver = repo.os_version | default(rhel_tag) | string -%}
        {% if ver not in result -%}
          {% set _ = result.update({ver: []}) -%}
        {% endif -%}
        {% set _ = result[ver].append(repo) -%}
      {% endfor -%}
      {{ result }}
  when: _all_repo_manager_repos | length > 0

- name: Use repo_manager output for repos (preferred) - {{ build_arch }}
  when: _all_repo_manager_repos | length > 0
  block:
    - name: Set primary rhel_arch_repos from repo_manager output
      ansible.builtin.set_fact:
        rhel_arch_repos: >-
          {{ rhel_arch_repos_by_version[rhel_tag | string]
             | default(_all_repo_manager_repos) }}

    - name: Fail when repo_status has no repos for a required OS version
      ansible.builtin.fail:
        msg: >-
          repo_status.yml has no repositories for {{ build_arch }}
          RHEL {{ item }}.  Available versions in repo_status:
          {{ rhel_arch_repos_by_version | default({}) | list | join(', ') }}.
      when: (item | string) not in (rhel_arch_repos_by_version | default({}))
      loop: "{{ _required_os_versions }}"

    - name: Display repo source
      ansible.builtin.debug:
        msg: >-
          Using repos from repo_manager output for {{ build_arch }}:
          {% for ver in _required_os_versions -%}
            {{ ver }}={{ (rhel_arch_repos_by_version[ver | string] | default([])) | length }}
          {%- if not loop.last %}, {% endif -%}
          {% endfor %}

- name: Fallback — fetch Pulp endpoints directly for platform {{ build_arch }}
  when: _all_repo_manager_repos | length == 0
  block:
    - name: Fetch pulp endpoints for {{ build_arch }}
      ansible.builtin.command: >
        pulp rpm distribution list --field name,base_url
      register: pulp_endpoints
      changed_when: false

    - name: Build per-version repo lookup from Pulp
      ansible.builtin.set_fact:
        rhel_arch_repos_by_version: >-
          {% set result = {} -%}
          {% set all_dists = pulp_endpoints.stdout | from_json -%}
          {% for ver in _required_os_versions -%}
            {% set ver_prefix = ver | string | replace('.', '_') -%}
            {% set matched = all_dists
               | selectattr('name', 'match', '^' + build_arch + '_rhel_' + ver_prefix + '_')
               | list -%}
            {% set repos = [] -%}
            {% for d in matched -%}
              {% set _ = repos.append(d | combine({'gpg': '', 'os_version': ver | string})) -%}
            {% endfor -%}
            {% set _ = result.update({ver | string: repos}) -%}
          {% endfor -%}
          {{ result }}

    - name: Fail when Pulp has no matching fallback distributions
      ansible.builtin.fail:
        msg: >-
          Pulp has no RPM distributions for {{ build_arch }}
          RHEL {{ item }}.
      when: (rhel_arch_repos_by_version[item | string] | default([]) | length) == 0
      loop: "{{ _required_os_versions }}"

    - name: Set primary rhel_arch_repos from Pulp fallback
      ansible.builtin.set_fact:
        rhel_arch_repos: >-
          {{ rhel_arch_repos_by_version[rhel_tag | string]
             | default(rhel_arch_repos_by_version.values() | first | default([])) }}

- name: Initialize empty per-version lookup when no repos loaded
  ansible.builtin.set_fact:
    rhel_arch_repos_by_version: {}
  when: rhel_arch_repos_by_version is not defined

- name: Debug rhel_arch_repos
  ansible.builtin.debug:
    msg: >-
      rhel_arch_repos={{ rhel_arch_repos | length }},
      versions={{ rhel_arch_repos_by_version | default({}) | list }}
    verbosity: 2
