---
# ==========================================================================
# Dual-mode package resolution: config vs catalog
# ==========================================================================
# Config mode:  Loads package_groups.yml from input project directory.
# Catalog mode: Loads catalog JSON and resolves packages via parse_catalog.yml.
# Both modes produce the same output shape:
#   - base_image_packages (list of RPM names)
#   - compute_images_dict (dict of functional_group -> {functional_group, packages[, os_version]})
#   - rhel_tag (cluster OS version string)

- name: Set common facts for package resolution
  ansible.builtin.set_fact:
    _pkg_source: "{{ hostvars['localhost']['functional_groups_source'] | default('config') }}"
    rhel_tag: "{{ hostvars['localhost']['cluster_os_version'] | default('10.0') }}"
    cacheable: true

# ==========================================================================
# Config mode: load package_groups.yml from input project directory
# ==========================================================================
- name: Load packages from package_groups.yml (config mode)
  when: _pkg_source == 'config'
  block:
    - name: Load package_groups.yml
      ansible.builtin.include_vars:
        file: "{{ input_project_dir }}/package_groups.yml"
        name: _fg_pkg_mapping

    - name: Set base_image_packages from mapping
      ansible.builtin.set_fact:
        base_image_packages: "{{ _fg_pkg_mapping.base_packages | default([]) }}"
        cacheable: true

    - name: Set OS metadata from package_groups.yml
      ansible.builtin.set_fact:
        cluster_os_type: "{{ _fg_pkg_mapping.os | default(cluster_os_type | default('rhel')) }}"
        cluster_os_version: "{{ _fg_pkg_mapping.os_version | default(cluster_os_version | default('10.0')) }}"
        rhel_tag: "{{ _fg_pkg_mapping.os_version | default(rhel_tag | default('10.0')) }}"
        cacheable: true
      when: _fg_pkg_mapping.os is defined or _fg_pkg_mapping.os_version is defined

    - name: Build compute_images_dict from package_groups.yml keys
      ansible.builtin.set_fact:
        compute_images_dict: >-
          {% set result = {} -%}
          {% for fg_name, fg_data in (_fg_pkg_mapping.functional_groups | default({})).items() -%}
            {% if fg_name.endswith('_' + build_arch) -%}
              {% set pkgs = fg_data.packages | default([]) -%}
              {% if pkgs | length > 0 -%}
                {% set _ = result.update({
                  fg_name: {
                    'functional_group': fg_name,
                    'packages': pkgs,
                    'os_version': _fg_pkg_mapping.os_version | default(rhel_tag | default('10.0'))
                  }
                }) -%}
              {% endif -%}
            {% endif -%}
          {% endfor -%}
          {{ result }}
        _skipped_empty_groups: >-
          {% set skipped = [] -%}
          {% for fg_name, fg_data in (_fg_pkg_mapping.functional_groups | default({})).items() -%}
            {% if fg_name.endswith('_' + build_arch) and (fg_data.packages | default([]) | length) == 0 -%}
              {% set _ = skipped.append(fg_name) -%}
            {% endif -%}
          {% endfor -%}
          {{ skipped }}
        cacheable: true

    - name: Warn about skipped groups with empty packages
      ansible.builtin.debug:
        msg: >-
          WARNING: Skipping compute image build for groups with empty packages list:
          {{ _skipped_empty_groups | join(', ') }}.
          Add packages to these groups in package_groups.yml or remove them.
      when: (_skipped_empty_groups | default([]) | length) > 0


# ==========================================================================
# Catalog mode: resolve packages from catalog JSON
# ==========================================================================
- name: Load packages from catalog JSON (catalog mode)
  ansible.builtin.include_tasks: parse_catalog.yml
  when: _pkg_source == 'catalog'

# ==========================================================================
# Common: debug and fetch repos
# ==========================================================================
- name: Debug package resolution
  ansible.builtin.debug:
    msg: >-
      Resolved {{ compute_images_dict | length }} functional groups
      (source={{ _pkg_source }}),
      {{ base_image_packages | length }} base packages,
      rhel_tag={{ rhel_tag }}
    verbosity: 1

- name: Fetch repo manager endpoint repos
  ansible.builtin.include_tasks: fetch_repo_manager_repos.yml
