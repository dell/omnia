---
# ==========================================================================
# Dual-mode package resolution: config vs catalog
# ==========================================================================
# Config mode:  Loads package_groups.yml from input project directory.
# Catalog mode: Loads catalog JSON and resolves packages via parse_catalog.yml.
# Both modes produce the same output shape:
#   - base_image_packages (list of RPM names)
#   - compute_images_dict (dict of functional_group -> {functional_group, packages})
#   - service_k8s_version (string, empty if no k8s packages)
#   - rhel_tag (cluster OS version string)

- name: Set common facts for package resolution
  ansible.builtin.set_fact:
    _pkg_source: "{{ hostvars['localhost']['functional_groups_source'] | default('config') }}"
    rhel_tag: "{{ hostvars['localhost']['cluster_os_version'] | default('10.0') }}"
    cacheable: true

# ==========================================================================
# Config mode: load package_groups.yml from input project directory
# ==========================================================================
- name: Load packages from package_groups.yml (config mode)
  when: _pkg_source == 'config'
  block:
    - name: Load package_groups.yml
      ansible.builtin.include_vars:
        file: "{{ input_project_dir }}/package_groups.yml"
        name: _fg_pkg_mapping

    - name: Set base_image_packages from mapping
      ansible.builtin.set_fact:
        base_image_packages: "{{ _fg_pkg_mapping.base_packages | default([]) }}"
        cacheable: true

    - name: Build compute_images_dict from mapping + enabled functional_groups
      ansible.builtin.set_fact:
        compute_images_dict: >-
          {% set result = {} -%}
          {% for fg in functional_groups -%}
            {% set fg_name = fg.name if fg is mapping else fg -%}
            {% if fg_name.endswith('_' + build_arch) -%}
              {% set pkgs = _fg_pkg_mapping.functional_groups[fg_name].packages | default([]) -%}
              {% set _ = result.update({fg_name: {'functional_group': fg_name, 'packages': pkgs}}) -%}
            {% endif -%}
          {% endfor -%}
          {{ result }}
        cacheable: true

    - name: Set service_k8s_version (not available in config mode)
      ansible.builtin.set_fact:
        service_k8s_version: ""
        cacheable: true

# ==========================================================================
# Catalog mode: resolve packages from catalog JSON
# ==========================================================================
- name: Load packages from catalog JSON (catalog mode)
  ansible.builtin.include_tasks: parse_catalog.yml
  when: _pkg_source == 'catalog'

# ==========================================================================
# Common: debug and fetch repos
# ==========================================================================
- name: Debug package resolution
  ansible.builtin.debug:
    msg: >-
      Resolved {{ compute_images_dict | length }} functional groups
      (source={{ _pkg_source }}),
      {{ base_image_packages | length }} base packages,
      service_k8s_version={{ service_k8s_version | default('') }}
    verbosity: 1

- name: Fetch repo manager endpoint repos
  ansible.builtin.include_tasks: fetch_repo_manager_repos.yml
