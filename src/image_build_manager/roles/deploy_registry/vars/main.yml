---
# OIM metadata (loaded on localhost via include_input_dir with omnia_metadata_support)
shared_path: "{{ hostvars['localhost']['shared_path'] }}"

# Directory paths (image_build_manager domain-specific)
data_oci_dir: "{{ shared_path }}/oci/data"

# Registry container settings
registry_port: 5000
registry_storage_dir: "{{ shared_path }}/registry/data"
registry_image: "docker.io/library/registry"
registry_tag: "3.1.1"

# Internal TLS and authentication
image_build_pki_dir: "/etc/omnia/image_build_manager/pki"
image_build_ca_cert: "{{ image_build_pki_dir }}/ca.crt"
registry_tls_dir: "{{ image_build_pki_dir }}/registry"
registry_tls_cert: "{{ registry_tls_dir }}/tls.crt"
registry_tls_key: "{{ registry_tls_dir }}/tls.key"
registry_auth_dir: "/etc/omnia/image_build_manager/registry"
registry_password_file: "{{ registry_auth_dir }}/registry.password"
registry_htpasswd_file: "{{ registry_auth_dir }}/htpasswd"
registry_client_auth_file: "{{ registry_auth_dir }}/client-auth.json"
registry_username: "omnia-registry"
registry_fqdn: "{{ hostvars['localhost']['host_name'] }}.{{ hostvars['localhost']['domain_name'] }}"
registry_endpoints:
  - "{{ hostvars['localhost']['admin_nic_ip'] }}:{{ registry_port }}"
  - "{{ hostvars['localhost']['host_name'] }}:{{ registry_port }}"
  - "{{ registry_fqdn }}:{{ registry_port }}"

# Retry and delay settings
max_retries: 10
delay_count: 5
image_pull_retries: 3
image_pull_delay: 10
health_check_retries: 10
health_check_delay: 3
download_retries: 5
download_delay: 10

# regctl
regctl_url: "https://github.com/regclient/regclient/releases/latest/download/regctl-linux-amd64"
regctl_dest: "/usr/local/bin/regctl"
file_perm_rwx: "0755"
