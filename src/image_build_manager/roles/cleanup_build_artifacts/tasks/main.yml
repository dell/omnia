---
# cleanup_image_build_manager/tasks/main.yml — Cleanup MinIO, registry, and build artifacts.

- name: Display cleanup start
  ansible.builtin.debug:
    msg: "{{ cleanup_started_msg }}"

- name: Cleanup MinIO container and data
  ansible.builtin.import_tasks: cleanup_minio.yml
  tags: minio

- name: Cleanup registry container and data
  ansible.builtin.import_tasks: cleanup_registry.yml
  tags: registry

- name: Cleanup build output files
  ansible.builtin.import_tasks: cleanup_build_output.yml
  tags: output

- name: Cleanup s3cmd configuration
  ansible.builtin.import_tasks: cleanup_s3cmd.yml
  tags: s3cmd

- name: Remove MinIO security material
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ minio_security_directories + minio_security_files }}"
  tags: minio

- name: Remove registry security material
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ registry_security_directories }}"
  tags: registry

# The CA is shared by MinIO and the registry. The `always` tag lets the guard
# evaluate even during tagged runs; the guard removes it only when both
# services are being cleaned.
- name: Remove shared internal CA material during full cleanup
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ shared_security_directories + shared_security_files }}"
  notify: Refresh system trust after internal CA cleanup
  when: cleanup_shared_service_security | bool
  tags: always

- name: Apply system trust cleanup
  ansible.builtin.meta: flush_handlers
  when: cleanup_shared_service_security | bool
  tags: always

- name: Cleanup image_build_manager credentials
  ansible.builtin.import_tasks: cleanup_credentials.yml
  tags: cleanup_credentials

- name: Cleanup domain data directories
  ansible.builtin.import_tasks: cleanup_domain_data.yml
  tags: data

- name: Cleanup image_build_manager logs
  ansible.builtin.import_tasks: cleanup_logs.yml
  tags: logs
