---
# cleanup_image_build_manager/vars/main.yml — Variables for image_build_manager cleanup.

# OIM metadata (loaded on localhost via include_input_dir with omnia_metadata_support)
shared_path: "{{ hostvars['localhost']['shared_path'] }}"
omnia_nfs_share: "{{ shared_path }}"

# S3 configuration from image_build_config.yml (loaded on localhost)
s3_configurations: "{{ hostvars['localhost']['s3_configurations'] | default({}) }}"
s3_provider: "{{ s3_configurations.provider | default('minio') }}"

# ---------------------------------------------------------------------------
# MinIO cleanup
# ---------------------------------------------------------------------------
minio_service_name: "minio"
minio_quadlet_file: "/etc/containers/systemd/minio.container"
minio_s3_data_dir: "{{ shared_path }}/s3/data"
minio_s3_work_dir: "{{ shared_path }}/s3"
minio_cleanup_directories:
  - "{{ minio_s3_data_dir }}"
  - "{{ minio_s3_work_dir }}"
minio_firewall_ports:
  - 9000/tcp
  - 9001/tcp

# ---------------------------------------------------------------------------
# Registry cleanup
# ---------------------------------------------------------------------------
registry_service_name: "registry"
registry_quadlet_file: "/etc/containers/systemd/registry.container"
registry_image: "docker.io/library/registry"
registry_tag: "3.1.2"
registry_storage_dir: "{{ shared_path }}/registry/data"
registry_oci_data_dir: "{{ shared_path }}/oci/data"
registry_cleanup_directories:
  - "{{ registry_storage_dir }}"
  - "{{ registry_oci_data_dir }}"
registry_firewall_ports:
  - 5000/tcp

# ---------------------------------------------------------------------------
# OpenCHAMI image artifacts cleanup
# ---------------------------------------------------------------------------
image_build_work_dir: "{{ shared_path }}/workdir"

# ---------------------------------------------------------------------------
# Output files cleanup
# ---------------------------------------------------------------------------
output_project_dir: "{{ hostvars['localhost']['output_project_dir'] }}"
build_status_latest: "{{ output_project_dir }}/build_status.yml"
build_status_versioned_dir: "{{ output_project_dir }}"

# ---------------------------------------------------------------------------
# Credential cleanup
# ---------------------------------------------------------------------------
input_project_dir: "{{ hostvars['localhost']['input_project_dir'] }}"
image_build_credentials_file: "{{ input_project_dir }}/image_build_credentials.yml"
image_build_credentials_key: "{{ input_project_dir }}/.image_build_credentials_key"

# ---------------------------------------------------------------------------
# omnia.target service entries to remove
# ---------------------------------------------------------------------------
omnia_target_path: "/etc/systemd/system/omnia.target"
cleanup_services:
  - "minio.service"
  - "registry.service"

# ---------------------------------------------------------------------------
# Domain data directory cleanup
# ---------------------------------------------------------------------------
domain_data_cleanup_directories:
  - "{{ shared_path }}/s3"
  - "{{ shared_path }}/registry"
  - "{{ shared_path }}/oci"
  - "{{ shared_path }}/workdir"
  - "{{ shared_path }}/openchami"
  # aarch64 staging on the OIM (regctl-linux-arm64 etc.) created by prepare_aarch64_node
  - "{{ shared_path }}/aarch64"

# Keep the public runtime roots present but empty after a full domain cleanup.
domain_data_preserved_directories:
  - "{{ shared_path }}/log"
  - "{{ shared_path }}/output"

# ---------------------------------------------------------------------------
# Log cleanup
# ---------------------------------------------------------------------------
image_build_log_base: "/var/log/omnia/image_build_manager"

# Package hash cache (.base_image_pkg_hash_*, .compute_pkg_hash_*) written by
# build_os_images to image_build_log_dir (= <shared_path>/log/<project>).
image_build_hash_cache_dir: "{{ hostvars['localhost']['log_dir'] }}"

# ---------------------------------------------------------------------------
# s3cmd cleanup
# ---------------------------------------------------------------------------
s3cmd_config: "/root/.s3cfg"

# ---------------------------------------------------------------------------
# Image cleanup (cleanup_images tag)
# ---------------------------------------------------------------------------
# Pattern to match images for deletion. Matching is "contains", case-sensitive:
#   "*" (or empty) — delete ALL images (default when no pattern specified)
#   "slurm_node_"  — any image whose S3 path / registry repo contains the text
#   "*slurm_node_*" — same as above; '*' = any characters, '?' = one character
#   "<image_group_id>" — exact id supplied by the BuildStream cleanup pipeline
# Regex metacharacters (. + [ ( ...) in the pattern are always literal.
cleanup_image_pattern: "{{ (cleanup_image_pattern_override | default('*')) | string | trim }}"

# True when the pattern selects everything (empty, or only '*' characters).
cleanup_image_match_all: "{{ (cleanup_image_pattern | replace('*', '')) | length == 0 }}"

# Regex derived from the glob: literal parts escaped, '*' -> '.*', '?' -> '.'.
# Built without backslash literals so it is safe in both quoted and folded YAML.
cleanup_image_regex: >-
  {{ cleanup_image_pattern | split('*')
     | map('split', '?') | map('map', 'regex_escape') | map('join', '.')
     | join('.*') }}
cleanup_image_s3_regex: "{{ cleanup_image_regex }}"
cleanup_image_registry_regex: "{{ cleanup_image_regex }}"

# The BuildStream cleanup pipeline supplies an exact image-group identifier.
# Direct CLI glob cleanup leaves this empty unless explicitly provided.
dictionary_cleanup_image_group_id: >-
  {{ cleanup_image_group_id
     | default(cleanup_image_pattern
               if '*' not in cleanup_image_pattern and '?' not in cleanup_image_pattern
               else '', true) }}
image_group_dictionary_path: "{{ output_project_dir }}/image_group_dictionary.json"

# ---------------------------------------------------------------------------
# Retry settings
# ---------------------------------------------------------------------------
max_retries: 5

# ---------------------------------------------------------------------------
# Messages
# ---------------------------------------------------------------------------
cleanup_started_msg: "Starting image_build_manager cleanup..."
cleanup_completed_msg:
  - "[image_build_manager Cleanup Complete]"
  - ""
  - "The following components have been cleaned up:"
  - "  - MinIO S3 container and data (if provider was 'minio')"
  - "  - Local container registry and data"
  - "  - Build status output files"
  - "  - S3 bucket data and work directories"
  - "  - Firewall ports (9000, 9001, 5000)"
  - "  - omnia.target service entries (minio.service, registry.service)"
  - "  - s3cmd configuration"
  - "  - image_build_credentials.yml and vault key"
  - "  - Domain data directories (s3, registry, oci, workdir, openchami, aarch64)"
  - "  - Runtime log and output directories (contents removed; empty roots preserved)"
  - "  - Ansible log files (/var/log/omnia/image_build_manager/)"
minio_skip_msg: "S3 provider is '{{ s3_provider }}' — skipping MinIO cleanup (external S3)."

# Image cleanup messages
cleanup_images_summary_header: "=== Image Cleanup Summary ==="
cleanup_images_approval_msg: "Approval required. You will be prompted to confirm."
cleanup_images_skip_approval_msg: "skip_approval=true — proceeding without confirmation."
cleanup_images_no_match_msg: "WARNING: no S3 objects or registry images matched the given cleanup pattern."
cleanup_images_s3_list_failed_msg: >-
  WARNING: could not list s3://boot-images/ (bucket missing or S3 unreachable); S3 images were not evaluated.
cleanup_images_nothing_to_delete_msg: "No matching images found — no deletion required."
cleanup_images_approval_prompt: >-
  The above images will be PERMANENTLY DELETED. Type 'yes' to proceed or press Enter to abort
cleanup_images_abort_msg: "Image cleanup aborted by user."
cleanup_images_s3_done_msg: "S3 image cleanup complete (pattern: '{{ cleanup_image_pattern }}')."
cleanup_images_s3_skip_msg: "s3cmd not available — skipping S3 image cleanup."
cleanup_images_s3_not_initialized_msg: >-
  S3 image cleanup is not applicable because s3cmd configuration is absent.
cleanup_images_registry_done_msg: "Registry image cleanup complete (pattern: '{{ cleanup_image_pattern }}')."
cleanup_images_registry_skip_msg: "regctl not available — skipping registry image cleanup."
cleanup_images_registry_not_initialized_msg: >-
  Registry image cleanup is not applicable because managed registry state is absent.
dictionary_cleanup_warning_msg: >-
  Image cleanup completed, but the global image dictionary could not be updated.
