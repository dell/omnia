---

- name: Set compute image suffix when build stream inputs present
  ansible.builtin.set_fact:
    compute_image_suffix: "_{{ build_stream_job_id }}-{{ image_key | default('') }}"
  when:
    - enable_build_stream | default(false) | bool
    - (build_stream_job_id | default('') | length) > 0
    - (image_key | default('') | length) > 0

- name: Ensure workdir images directory exists
  ansible.builtin.file:
    path: "{{ openchami_work_dir }}/images"
    state: directory
    mode: "{{ dir_permissions_755 }}"
  delegate_to: "{{ aarch64_build_host }}"
  connection: ssh

- name: Ensure log directory exists
  ansible.builtin.file:
    path: "{{ image_build_log_dir }}"
    state: directory
    mode: "{{ dir_permissions_755 }}"

- name: Create aarch64 compute image log files
  ansible.builtin.file:
    path: "{{ image_build_log_dir }}/{{ item.key }}{{ compute_image_suffix }}_compute_image.log"
    state: touch
    mode: "{{ dir_permissions_644 }}"
  loop: "{{ compute_images_dict | dict2items }}"
  loop_control:
    loop_var: item
  delegate_to: "{{ aarch64_build_host }}"
  connection: ssh

- name: Render compute image build configs
  ansible.builtin.template:
    src: "{{ openchami_compute_image_config_template }}"
    dest: "{{ openchami_work_dir }}/images/rhel-{{ item.key }}{{ compute_image_suffix }}-{{ rhel_tag }}.yaml"
    mode: "{{ dir_permissions_644 }}"
  vars:
    _fg_k8s_sfx: "{{ (item.key is match('service_kube_')) | ternary(k8s_suffix, '') }}"
    rhel_base_compute_image_name: "rhel-{{ item.key }}{{ omnia_suffix }}{{ _fg_k8s_sfx }}{{ compute_image_suffix }}"
    group_name: "{{ item.key }}"
    compute_packages: "{{ item.value.packages }}"
    functional_group: "{{ item.value.functional_group }}"
  loop: "{{ compute_images_dict | dict2items }}"
  loop_control:
    loop_var: item
  delegate_to: "{{ aarch64_build_host }}"
  connection: ssh

# --- Build path selection ---
# When max_parallel > 0: use image_build_orchestrator module for controlled concurrency.
# When max_parallel == 0 (unlimited): use native Ansible async/poll (all builds fire at once).

- name: Build aarch64 compute images via orchestrator (concurrency-controlled)
  when: (max_parallel | int) > 0
  block:
    - name: Build orchestrator command list
      ansible.builtin.set_fact:
        _orchestrator_cmds: "{{ (_orchestrator_cmds | default([])) + [_current_cmd] }}"
      vars:
        _current_cmd:
          name: "{{ item.key }}"
          cmd: >-
            podman run --rm --device /dev/fuse --network host
            -e S3_ACCESS={{ s3_access }}
            -e S3_SECRET={{ s3_secret }}
            {{ aws_checksum_env }}
            {{ _privilege_opts | join(' ') }}
            {{ _cert_opts | join(' ') }}
            -v {{ openchami_work_dir }}/images/rhel-{{ item.key }}{{ compute_image_suffix }}-{{ rhel_tag }}.yaml:{{ _config_mount_path }}:z
            {{ ochami_image | join(' ') }}
            {{ ochami_base_command | join(' ') }}
          log_path: "{{ image_build_log_dir }}/{{ item.key }}{{ compute_image_suffix }}_compute_image.log"
      loop: "{{ compute_images_dict | dict2items }}"
      loop_control:
        loop_var: item

    - name: Run orchestrated parallel builds
      image_build_orchestrator:
        build_commands: "{{ _orchestrator_cmds }}"
        max_parallel: "{{ max_parallel | int }}"
        timeout: "{{ job_async | int }}"
      register: orchestrator_result
      delegate_to: "{{ aarch64_build_host }}"
      connection: ssh

    - name: Display orchestrator build summary
      ansible.builtin.debug:
        msg: "Build summary: {{ orchestrator_result.summary }}"

    - name: Configure regctl to use HTTP for local registry (orchestrator path)
      ansible.builtin.command: "/usr/local/bin/regctl registry set --tls disabled {{ registry_host }}:5000"
      changed_when: false
      failed_when: false

    - name: Verify aarch64 compute osimages in registry (orchestrator path)
      ansible.builtin.command:
        cmd: "/usr/local/bin/regctl repo ls --limit 500 {{ registry_host }}:5000"
      delegate_to: "{{ aarch64_build_host }}"
      connection: ssh
      changed_when: false
      register: verify_compute_osimages_orch

    - name: Display verified images (orchestrator path)
      ansible.builtin.debug:
        msg: "{{ verify_compute_osimages_orch.stdout_lines }}"

- name: Build aarch64 compute osimages in parallel (unlimited)
  when: (max_parallel | int) == 0
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      podman run --rm --device /dev/fuse --network host \
        -e S3_ACCESS={{ s3_access }} -e S3_SECRET={{ s3_secret }} \
        {{ aws_checksum_env }} \
        {{ _privilege_opts | join(' ') }} \
        {{ _cert_opts | join(' ') }} \
        -v '{{ openchami_work_dir }}/images/rhel-{{ item.key }}{{ compute_image_suffix }}-{{ rhel_tag }}.yaml:{{ _config_mount_path }}:z' \
        {{ ochami_image | join(' ') }} \
        {{ ochami_base_command | join(' ') }} \
        > '{{ image_build_log_dir }}/{{ item.key }}{{ compute_image_suffix }}_compute_image.log' 2>&1
  async: "{{ job_async }}"
  poll: 0
  loop: "{{ compute_images_dict | dict2items }}"
  loop_control:
    loop_var: item
  delegate_to: "{{ aarch64_build_host }}"
  connection: ssh
  register: compute_image_build_job
  changed_when: true

- name: Wait for all compute image builds to finish
  when: (max_parallel | int) == 0
  block:
    - name: Display image build jobs status
      ansible.builtin.debug:
        msg: "Waiting for image build: {{ item.item.key }} (Job ID: {{ item.ansible_job_id }})"
      loop: "{{ compute_image_build_job.results }}"
      loop_control:
        label: "{{ item.item.key }}"

    - name: Wait for all compute image builds to complete
      ansible.builtin.async_status:
        jid: "{{ item.ansible_job_id }}"
      delegate_to: "{{ aarch64_build_host }}"
      connection: ssh
      register: job_result
      until: job_result.finished
      no_log: true
      retries: "{{ job_retry }}"
      delay: "{{ job_delay }}"
      loop: "{{ compute_image_build_job.results }}"
      loop_control:
        label: "Building: {{ item.item.key }}"

    - name: Configure regctl to use HTTP for local registry
      ansible.builtin.command: "/usr/local/bin/regctl registry set --tls disabled {{ registry_host }}:5000"
      changed_when: false
      failed_when: false

    - name: Verify aarch64 compute osimages in registry
      ansible.builtin.command:
        cmd: "/usr/local/bin/regctl repo ls --limit 500 {{ registry_host }}:5000"
      delegate_to: "{{ aarch64_build_host }}"
      connection: ssh
      changed_when: false
      register: verify_compute_osimages

    - name: Verify aarch64 compute osimages output
      ansible.builtin.debug:
        msg: "{{ verify_compute_osimages.stdout_lines }}"

  rescue:
    - name: Identify failed image builds
      ansible.builtin.set_fact:
        failed_images: >
          {{ job_result.results
          | selectattr('failed', 'defined')
          | selectattr('failed', 'equalto', true)
          | map(attribute='item.item.key')
          | list }}
      when: job_result.results is defined

    - name: Build failure message list
      ansible.builtin.set_fact:
        failure_msg_list:
          - "aarch64 compute image build job did not complete successfully."
          - "Check logs at {{ image_build_log_dir }} on localhost for respective functional group for more details."
          - ""
          - "Failed images:"

    - name: Add failed image names to message
      ansible.builtin.set_fact:
        failure_msg_list: "{{ failure_msg_list + ['  - ' + item] }}"
      loop: "{{ failed_images | default(['Unknown - check all logs']) }}"

    - name: Add log paths section to message
      ansible.builtin.set_fact:
        failure_msg_list: "{{ failure_msg_list + ['', 'Check logs at ' + image_build_log_dir + ' on localhost for details:'] }}"

    - name: Add log file paths to message
      ansible.builtin.set_fact:
        failure_msg_list: "{{ failure_msg_list + ['  - ' + image_build_log_dir + '/' + item + log_suffix + '_compute_image.log'] }}"
      vars:
        log_suffix: "{{ compute_image_suffix }}"
      loop: "{{ failed_images | default([]) }}"

    - name: Display aarch64 compute image build failure details
      ansible.builtin.debug:
        msg: "{{ failure_msg_list }}"

    - name: Failed to build the aarch64 compute image
      ansible.builtin.fail:
        msg: "aarch64 compute image build failed. See details above."
