---

- name: Skip aarch64 compute image build (no groups defined)
  ansible.builtin.debug:
    msg: "No compute image groups resolved for aarch64 — skipping compute builds"
  when: (compute_images_dict | default({}) | length) == 0

- name: Build aarch64 compute images
  when: (compute_images_dict | default({}) | length) > 0
  block:
    - name: Set compute image suffix from image tag
      ansible.builtin.set_fact:
        compute_image_suffix: "{{ _image_tag_suffix | default('', true) }}"
      when: (_image_tag_suffix | default('', true) | length) > 0

    # --- Pre-build setup ---
    # 1. Ensure workdir + log directories exist (on aarch64 build host)
    # 2. Render per-group config YAMLs from Jinja2 templates
    #    (each gets its own releasever from os_version for multi-version builds)
    - name: Ensure workdir images directory exists
      ansible.builtin.file:
        path: "{{ openchami_work_dir }}/images"
        state: directory
        mode: "{{ dir_permissions_755 }}"
      delegate_to: "{{ aarch64_build_host }}"
      connection: ssh

    - name: Ensure log directory exists
      ansible.builtin.file:
        path: "{{ image_build_log_dir }}"
        state: directory
        mode: "{{ dir_permissions_755 }}"

    - name: Render compute image build configs
      ansible.builtin.template:
        src: "{{ openchami_compute_image_config_template }}"
        dest: "{{ openchami_work_dir }}/images/rhel-{{ item.key }}{{ compute_image_suffix }}-{{ _layer_rhel_tag }}.yaml"
        mode: "{{ dir_permissions_644 }}"
      vars:
        _layer_rhel_tag: "{{ item.value.os_version | default(rhel_tag, true) }}"
        rhel_base_compute_image_name: "rhel-{{ item.key }}{{ omnia_suffix }}{{ compute_image_suffix }}{{ _build_type_suffix }}"
        rhel_tag: "{{ _layer_rhel_tag }}"
        group_name: "{{ item.key }}"
        compute_packages: "{{ item.value.packages }}"
        functional_group: "{{ item.value.functional_group }}"
      loop: "{{ compute_images_dict | dict2items }}"
      loop_control:
        loop_var: item
      delegate_to: "{{ aarch64_build_host }}"
      connection: ssh

    # --- Compute image cache check ---
    # Per-group hash of packages and repository configuration to detect changes.
    # Skip groups whose combined hash matches the previous build (unless force_rebuild is set).
    - name: Load repository configuration for cache detection
      ansible.builtin.include_vars:
        file: "{{ repo_manager_output_path }}"
      failed_when: false
      register: _repo_status_vars
      delegate_to: "{{ aarch64_build_host }}"
      connection: ssh

    - name: Compute per-group package and repository hashes
      ansible.builtin.set_fact:
        _compute_pkg_hashes: >-
          {% set result = {} -%}
          {% for fg_name, fg_data in compute_images_dict.items() -%}
            {% set repo_config_string = _repo_status_vars.ansible_facts | default({}) | string -%}
            {% set hash_input = fg_data.packages | sort | join(',') ~ repo_config_string -%}
            {% set _ = result.update({fg_name: (hash_input | hash('sha256'))}) -%}
          {% endfor -%}
          {{ result }}
      delegate_to: "{{ aarch64_build_host }}"
      connection: ssh

    - name: Check previous compute image package hashes
      ansible.builtin.slurp:
        src: "{{ image_build_log_dir }}/.compute_pkg_hash_{{ item.key }}"
      register: _prev_compute_hashes
      failed_when: false
      loop: "{{ compute_images_dict | dict2items }}"
      loop_control:
        loop_var: item
        label: "{{ item.key }}"

    - name: Determine which compute groups need rebuild
      ansible.builtin.set_fact:
        _compute_rebuild_dict: >-
          {% set result = {} -%}
          {% set prev_map = {} -%}
          {% for r in _prev_compute_hashes.results -%}
            {% if r is not failed and r.content is defined -%}
              {% set _ = prev_map.update({r.item.key: (r.content | b64decode | trim)}) -%}
            {% endif -%}
          {% endfor -%}
          {% for fg_name, fg_data in compute_images_dict.items() -%}
            {% set cur_hash = _compute_pkg_hashes[fg_name] -%}
            {% set prev_hash = prev_map.get(fg_name, '') -%}
            {% if (force_rebuild | default(false) | bool) or prev_hash != cur_hash -%}
              {% set _ = result.update({fg_name: fg_data}) -%}
            {% endif -%}
          {% endfor -%}
          {{ result }}
        _compute_skipped_groups: >-
          {% set skipped = [] -%}
          {% set prev_map = {} -%}
          {% for r in _prev_compute_hashes.results -%}
            {% if r is not failed and r.content is defined -%}
              {% set _ = prev_map.update({r.item.key: (r.content | b64decode | trim)}) -%}
            {% endif -%}
          {% endfor -%}
          {% for fg_name in compute_images_dict.keys() -%}
            {% set cur_hash = _compute_pkg_hashes[fg_name] -%}
            {% set prev_hash = prev_map.get(fg_name, '') -%}
            {% if not (force_rebuild | default(false) | bool) and prev_hash == cur_hash -%}
              {% set _ = skipped.append(fg_name) -%}
            {% endif -%}
          {% endfor -%}
          {{ skipped }}

    - name: Report skipped compute groups (packages unchanged)
      ansible.builtin.debug:
        msg: >-
          Skipping aarch64 compute image builds for groups with unchanged packages:
          {{ _compute_skipped_groups | join(', ') }}.
          Set force_rebuild: true in image_build_config.yml to override.
      when: (_compute_skipped_groups | default([]) | length) > 0

    # --- Backup existing S3 compute images before rebuild ---
    # Backup rootfs (boot-images/{group}/{image_name}/)
    - name: Backup aarch64 compute rootfs images in S3
      vars:
        _img_name: "rhel-{{ item.key }}{{ omnia_suffix }}{{ compute_image_suffix | default('') }}{{ _build_type_suffix }}"
        _s3_bucket: "{{ s3_configurations.bucket | default('boot-images') }}"
        _s3_src: "s3://{{ _s3_bucket }}/{{ item.key }}/{{ _img_name }}/"
        _s3_dst: "s3://{{ _s3_bucket }}/{{ item.key }}/{{ _img_name }}_prev/"
      ansible.builtin.command:
        cmd: >-
          s3cmd cp --recursive
          {{ _s3_src }}
          {{ _s3_dst }}
      changed_when: true
      failed_when: false
      loop: "{{ _compute_rebuild_dict | default({}) | dict2items }}"
      loop_control:
        loop_var: item
        label: "{{ item.key }}"
      when: backup_s3_images | default(false) | bool

    # Backup kernel+initrd (efi-images/{group}/{image_name}/)
    - name: Backup aarch64 compute EFI images in S3
      vars:
        _img_name: "rhel-{{ item.key }}{{ omnia_suffix }}{{ compute_image_suffix | default('') }}{{ _build_type_suffix }}"
        _s3_bucket: "{{ s3_configurations.bucket | default('boot-images') }}"
        _s3_src: "s3://{{ _s3_bucket }}/efi-images/{{ item.key }}/{{ _img_name }}/"
        _s3_dst: "s3://{{ _s3_bucket }}/efi-images/{{ item.key }}/{{ _img_name }}_prev/"
      ansible.builtin.command:
        cmd: >-
          s3cmd cp --recursive
          {{ _s3_src }}
          {{ _s3_dst }}
      changed_when: true
      failed_when: false
      loop: "{{ _compute_rebuild_dict | default({}) | dict2items }}"
      loop_control:
        loop_var: item
        label: "{{ item.key }}"
      when: backup_s3_images | default(false) | bool

    # --- Build via Python orchestrator ---
    # NOTE: delegate_to sends the module to the aarch64 host for execution.

    - name: Initialize orchestrator command list
      ansible.builtin.set_fact:
        _orchestrator_cmds: []

    - name: Build orchestrator command list (only groups needing rebuild)
      ansible.builtin.set_fact:
        _orchestrator_cmds: "{{ _orchestrator_cmds + [_current_cmd] }}"
      vars:
        _current_cmd:
          name: "{{ item.key }}"
          cmd: >-
            podman run --rm --device /dev/fuse --network host
            -e S3_ACCESS={{ s3_access }}
            -e S3_SECRET={{ s3_secret }}
            {{ aws_checksum_env }}
            {{ _privilege_opts | join(' ') }}
            {{ _cert_opts | join(' ') }}
            -v {{ openchami_work_dir }}/images/rhel-{{ item.key }}{{ compute_image_suffix }}-{{
            item.value.os_version | default(rhel_tag, true) }}.yaml:{{ _config_mount_path }}:z
            {{ ochami_image | join(' ') }}
            {{ ochami_base_command | join(' ') }}
          log_path: "{{ image_build_log_dir }}/{{ item.key }}{{ compute_image_suffix }}_compute_image.log"
      loop: "{{ _compute_rebuild_dict | default({}) | dict2items }}"
      loop_control:
        loop_var: item

    - name: Skip aarch64 compute builds (all groups cached)
      ansible.builtin.debug:
        msg: "All aarch64 compute images are up-to-date — skipping builds."
      when: (_orchestrator_cmds | length) == 0

    - name: "Starting aarch64 compute image builds — groups {{ _compute_rebuild_dict | default({}) | length }}"
      ansible.builtin.debug:
        msg: >-
          Starting aarch64 compute image builds:
          groups={{ _compute_rebuild_dict | default({}) | list }},
          max_parallel={{ max_parallel }},
          timeout={{ build_timeout }}s,
          logs={{ image_build_log_dir }}/
      when: (_orchestrator_cmds | length) > 0

    - name: Run aarch64 compute image builds via orchestrator
      image_build_orchestrator:
        build_commands: "{{ _orchestrator_cmds }}"
        max_parallel: "{{ max_parallel | int }}"
        timeout: "{{ build_timeout | int }}"
      register: orchestrator_result
      delegate_to: "{{ aarch64_build_host }}"
      connection: ssh
      when: (_orchestrator_cmds | length) > 0

    - name: Display aarch64 compute build summary
      ansible.builtin.debug:
        msg: "Build summary: {{ orchestrator_result.summary }}"
      when: orchestrator_result is defined and orchestrator_result.summary is defined

    # --- Save compute image package hashes for cache ---
    - name: Save compute image package hashes
      ansible.builtin.copy:
        content: "{{ _compute_pkg_hashes[item.key] }}"
        dest: "{{ image_build_log_dir }}/.compute_pkg_hash_{{ item.key }}"
        mode: "{{ dir_permissions_644 }}"
      loop: "{{ _compute_rebuild_dict | default({}) | dict2items }}"
      loop_control:
        loop_var: item
        label: "{{ item.key }}"
      when: orchestrator_result is defined and (orchestrator_result.summary.failed | default(0) | int) == 0

    # --- Registry verification ---
    - name: List aarch64 compute osimages in registry
      ansible.builtin.command:
        cmd: "/usr/local/bin/regctl repo ls --limit 500 {{ registry_host }}:5000"
      delegate_to: "{{ aarch64_build_host }}"
      connection: ssh
      changed_when: false
      register: verify_compute_osimages

    - name: Display verified aarch64 compute images
      ansible.builtin.debug:
        msg: "{{ verify_compute_osimages.stdout_lines }}"

    # Registry verification uses prefix matching to handle catalog ID changes.
    # When a build is cached (packages unchanged), old images remain in the
    # registry with the previous catalog suffix. Exact-name matching would
    # fail because compute_image_suffix reflects the *current* catalog ID.
    # Prefix match: host_name/rhel-{group_key}_omnia_{version}  covers any suffix.
    - name: Verify each aarch64 compute image exists in registry
      ansible.builtin.fail:
        msg: >-
          Compute image not found in registry for group {{ item.key }}.
          Expected prefix: {{ host_name }}/rhel-{{ item.key }}{{ omnia_suffix }}.
          Registry repos: {{ verify_compute_osimages.stdout_lines | default([]) }}.
          Check logs: ls {{ image_build_log_dir }}/{{ item.key }}*_compute_image.log
      when: >-
        verify_compute_osimages.stdout_lines | default([])
        | select('match', '^' + host_name + '/rhel-' + item.key + omnia_suffix + '.*' + _build_type_suffix + '$')
        | list | length == 0
      loop: "{{ compute_images_dict | dict2items }}"
      loop_control:
        loop_var: item
        label: "{{ item.key }}"

    - name: Verify aarch64 compute images have tags in registry
      ansible.builtin.shell: |
        /usr/local/bin/regctl tag ls \
          {{ registry_host }}:5000/{{ host_name }}/rhel-{{ item.key }}{{ omnia_suffix }}{{ compute_image_suffix | default('') }}{{ _build_type_suffix }} \
          2>/dev/null
      delegate_to: "{{ aarch64_build_host }}"
      connection: ssh
      changed_when: false
      failed_when: false
      register: _compute_tag_check
      loop: "{{ _compute_rebuild_dict | default({}) | dict2items }}"
      loop_control:
        loop_var: item
        label: "{{ item.key }}"

    - name: Fail if aarch64 compute image has no tags
      ansible.builtin.fail:
        msg: >-
          Compute image {{ host_name }}/rhel-{{ item.item.key }}{{ omnia_suffix }}{{ compute_image_suffix | default('') }}{{ _build_type_suffix }}
          exists in registry but has no tags.
          Check logs: ls {{ image_build_log_dir }}/{{ item.item.key }}*_compute_image.log
      when: item.stdout_lines | default([]) | length == 0
      loop: "{{ _compute_tag_check.results | default([]) }}"
      loop_control:
        label: "{{ item.item.key }}"

    # --- S3 verification (runs on localhost where s3cmd is installed) ---
    - name: Verify aarch64 compute images exist in S3
      ansible.builtin.shell: |
        set -o pipefail
        s3cmd ls -r \
          s3://{{ s3_configurations.bucket | default('boot-images') }}/{{ item.key }}/ \
          2>/dev/null | grep -c 'rhel-{{ item.key }}' || echo 0
      args:
        executable: /bin/bash
      delegate_to: localhost
      connection: local
      changed_when: false
      failed_when: false
      register: _compute_s3_check
      loop: "{{ _compute_rebuild_dict | default({}) | dict2items }}"
      loop_control:
        loop_var: item
        label: "{{ item.key }}"

    - name: Fail if aarch64 compute image not in S3
      ansible.builtin.fail:
        msg: >-
          Compute image for group {{ item.item.key }} not found in
          s3://{{ s3_configurations.bucket | default('boot-images') }}/{{ item.item.key }}/.
          Check logs: ls {{ image_build_log_dir }}/{{ item.item.key }}*_compute_image.log
      when: (item.stdout | default('0') | trim | int) == 0
      loop: "{{ _compute_s3_check.results | default([]) }}"
      loop_control:
        label: "{{ item.item.key }}"
