---
# configure_registry.yml — Compute registry host and verify regctl is installed.
# TLS configuration is handled by the deploy_registry role.
#
# Inputs (must be set before including):
#   host_name     — OIM short hostname
#   domain_name   — cluster domain
#
# Outputs (set as facts):
#   registry_host — IP (standalone) or FQDN for the local OCI registry

- name: Compute registry host (use admin_nic_ip for standalone mode)
  vars:
    _node: "{{ host_name }}"
    _domain: "{{ domain_name }}"
    _fqdn: "{{ _node if _node.endswith('.' + _domain) else _node + '.' + _domain }}"
  ansible.builtin.set_fact:
    registry_host: "{{ hostvars['localhost']['admin_nic_ip'] if hostvars['localhost']['standalone_mode'] | default(false) else _fqdn }}"

- name: Verify regctl binary is installed
  ansible.builtin.stat:
    path: /usr/local/bin/regctl
  register: _regctl_stat

- name: Fail if regctl is not installed
  ansible.builtin.fail:
    msg: "{{ regctl_not_found_fail_msg }}"
  when: not _regctl_stat.stat.exists

- name: Ensure regctl TLS disabled for registry_host
  ansible.builtin.command:
    cmd: "/usr/local/bin/regctl registry set --tls disabled {{ registry_host }}:5000"
  changed_when: false
