---
# Writes build_status.yml to {{ output_project_dir }}/
# This output file is consumed by the provision domain for BSS template
# rendering (S3 paths for kernel, initrd, image per functional group).
#
# Expected build_completed_images structure (populated by main.yml):
#   { "x86_64": [
#       { "functional_group": "slurm_control_node_x86_64",
#         "kernel": "boot-images/efi-images/.../vmlinuz-6.12.0-55.94.1.el10_0.x86_64",
#         "initrd": "boot-images/efi-images/.../initramfs-6.12.0-55.94.1.el10_0.x86_64.img",
#         "image": "boot-images/.../rhel-.../rhel10.0-rhel-...-imgbld-10.0" }
#     ],
#     "aarch64": [ ... ]
#   }
# NOTE: All artifact filenames (kernel, initrd, rootfs image) are discovered
# via s3cmd ls after each build (see main.yml "Discover actual S3 artifact
# filenames").  This ensures build_status.yml references the exact S3 object
# keys, not assumed generic names.
# The status also records image_build_type so consumers validate the artifact
# layout that produced this manifest, even if the input is changed later.

- name: Set output paths
  ansible.builtin.set_fact:
    _output_base: "{{ output_project_dir }}"
    _output_domain: "{{ output_project_dir }}"
    _omnia_version: "{{ omnia_version }}"

- name: Ensure output directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ _output_base }}"
    - "{{ _output_domain }}"

- name: Write build_status.yml (latest — always overwritten)
  ansible.builtin.template:
    src: "{{ role_path }}/templates/build_status.yml.j2"
    dest: "{{ _output_base }}/build_status.yml"
    mode: "0644"
  vars:
    build_completed_images: "{{ hostvars['localhost']['build_completed_images'] | default({}) }}"
    status_image_build_type: >-
      {{ hostvars['localhost']['image_build_type']
         | default('image-thrillhouse') }}

- name: Build versioned output path
  ansible.builtin.set_fact:
    _versioned_build_status: "{{ _output_domain }}/build_status_{{ _omnia_version }}_{{ ansible_date_time.date | regex_replace('-', '') }}_{{ ansible_date_time.hour }}{{ ansible_date_time.minute }}.yml"  # noqa: yaml[line-length]

- name: Write versioned build_status copy
  ansible.builtin.template:
    src: "{{ role_path }}/templates/build_status.yml.j2"
    dest: "{{ _versioned_build_status }}"
    mode: "0644"
  vars:
    build_completed_images: "{{ hostvars['localhost']['build_completed_images'] | default({}) }}"
    status_image_build_type: >-
      {{ hostvars['localhost']['image_build_type']
         | default('image-thrillhouse') }}

- name: Display build status output locations
  ansible.builtin.debug:
    msg:
      - "Latest: {{ _output_base }}/build_status.yml"
      - "Versioned: {{ _versioned_build_status }}"
