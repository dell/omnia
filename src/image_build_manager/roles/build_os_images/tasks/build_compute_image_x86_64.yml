---

- name: Skip x86_64 compute image build (no groups defined)
  ansible.builtin.debug:
    msg: "No compute image groups resolved for x86_64 — skipping compute builds"
  when: (compute_images_dict | default({}) | length) == 0

- name: Build x86_64 compute images
  when: (compute_images_dict | default({}) | length) > 0
  block:
    - name: Set compute image suffix from image tag
      ansible.builtin.set_fact:
        compute_image_suffix: "{{ _image_tag_suffix | default('') }}"
      when: (_image_tag_suffix | default('') | length) > 0

    # --- Pre-build setup ---
    # 1. Ensure workdir + log directories exist
    # 2. Create per-group log files (touched so orchestrator can append)
    # 3. Render per-group config YAMLs from Jinja2 templates
    #    (each gets its own releasever from os_version for multi-version builds)
    - name: Ensure workdir images directory exists
      ansible.builtin.file:
        path: "{{ openchami_work_dir }}/images"
        state: directory
        mode: "{{ dir_permissions_755 }}"

    - name: Ensure log directory exists
      ansible.builtin.file:
        path: "{{ image_build_log_dir }}"
        state: directory
        mode: "{{ dir_permissions_755 }}"

    - name: Render compute image build configs
      ansible.builtin.template:
        src: "{{ openchami_compute_image_config_template }}"
        dest: "{{ openchami_work_dir }}/images/rhel-{{ item.key }}{{ compute_image_suffix }}-{{ _layer_rhel_tag }}.yaml"
        mode: "{{ dir_permissions_644 }}"
      vars:
        _layer_rhel_tag: "{{ item.value.os_version | default(rhel_tag, true) }}"
        rhel_base_compute_image_name: "rhel-{{ item.key }}{{ omnia_suffix }}{{ compute_image_suffix }}"
        rhel_tag: "{{ _layer_rhel_tag }}"
        group_name: "{{ item.key }}"
        compute_packages: "{{ item.value.packages }}"
        functional_group: "{{ item.value.functional_group }}"
      loop: "{{ compute_images_dict | dict2items }}"
      loop_control:
        loop_var: item

    # --- Build via Python orchestrator ---
    # image_build_orchestrator handles ALL concurrency modes:
    #   max_parallel=0 → unlimited (all builds fire at once)
    #   max_parallel>0 → controlled concurrency (e.g., 4 at a time)

    - name: Build orchestrator command list
      ansible.builtin.set_fact:
        _orchestrator_cmds: "{{ (_orchestrator_cmds | default([])) + [_current_cmd] }}"
      vars:
        _current_cmd:
          name: "{{ item.key }}"
          cmd: >-
            podman run --rm --device /dev/fuse --network host
            -e S3_ACCESS={{ s3_access }}
            -e S3_SECRET={{ s3_secret }}
            {{ aws_checksum_env }}
            {{ _privilege_opts | join(' ') }}
            {{ _cert_opts | join(' ') }}
            -v {{ openchami_work_dir }}/images/rhel-{{ item.key }}{{ compute_image_suffix }}-{{
            item.value.os_version | default(rhel_tag, true) }}.yaml:{{ _config_mount_path }}:z
            {{ ochami_image | join(' ') }}
            {{ ochami_base_command | join(' ') }}
          log_path: "{{ image_build_log_dir }}/{{ item.key }}{{ compute_image_suffix }}_compute_image.log"
      loop: "{{ compute_images_dict | dict2items }}"
      loop_control:
        loop_var: item

    - name: "Starting x86_64 compute image builds — groups {{ compute_images_dict | length }}"
      ansible.builtin.debug:
        msg: >-
          Starting x86_64 compute image builds:
          groups={{ compute_images_dict.keys() | list }},
          max_parallel={{ max_parallel }},
          timeout={{ job_async }}s,
          logs={{ image_build_log_dir }}/

    - name: Run x86_64 compute image builds via orchestrator
      image_build_orchestrator:
        build_commands: "{{ _orchestrator_cmds }}"
        max_parallel: "{{ max_parallel | int }}"
        timeout: "{{ job_async | int }}"
      register: orchestrator_result

    - name: Display x86_64 compute build summary
      ansible.builtin.debug:
        msg: "Build summary: {{ orchestrator_result.summary }}"

    # --- Registry verification ---
    - name: List x86_64 compute osimages in registry
      ansible.builtin.command:
        cmd: "/usr/local/bin/regctl repo ls --limit 500 {{ registry_host }}:5000"
      changed_when: false
      register: verify_compute_osimages

    - name: Display verified x86_64 compute images
      ansible.builtin.debug:
        msg: "{{ verify_compute_osimages.stdout_lines }}"

    - name: Verify each x86_64 compute image exists in registry
      ansible.builtin.fail:
        msg: >-
          Compute image not found in registry:
          {{ host_name }}/rhel-{{ item.key }}{{ omnia_suffix }}{{ compute_image_suffix | default('') }}.
          Check log: {{ image_build_log_dir }}/{{ item.key }}{{ compute_image_suffix | default('') }}_compute_image.log
      when: >-
        (host_name + '/rhel-' + item.key + omnia_suffix + (compute_image_suffix | default('')))
        not in verify_compute_osimages.stdout_lines
      loop: "{{ compute_images_dict | dict2items }}"
      loop_control:
        loop_var: item
        label: "{{ item.key }}"
