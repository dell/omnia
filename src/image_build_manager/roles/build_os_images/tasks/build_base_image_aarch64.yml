---

- name: Set base image suffix from image tag
  ansible.builtin.set_fact:
    base_image_suffix: "{{ _image_tag_suffix | default('') }}"
    rhel_base_image_name: "{{ rhel_arch_base_image_name }}{{ _image_tag_suffix | default('') }}"
  when: (_image_tag_suffix | default('') | length) > 0

# --- Pre-build setup ---
- name: Create ochami images directory
  ansible.builtin.file:
    path: "{{ openchami_work_dir }}/images"
    state: directory
    mode: "{{ dir_permissions_755 }}"
  delegate_to: "{{ aarch64_build_host }}"
  connection: ssh

- name: Ensure log directory exists
  ansible.builtin.file:
    path: "{{ image_build_log_dir }}"
    state: directory
    mode: "{{ dir_permissions_755 }}"
  delegate_to: "{{ aarch64_build_host }}"
  connection: ssh

- name: Render aarch64 base image build config
  ansible.builtin.template:
    src: "{{ openchami_base_image_config_template }}"
    dest: "{{ openchami_work_dir }}/images/{{ rhel_arch_base_image_name }}-{{ rhel_tag }}.yaml"
    mode: "{{ dir_permissions_644 }}"
  delegate_to: "{{ aarch64_build_host }}"
  connection: ssh

# --- Base image cache check ---
- name: Compute base image package hash
  ansible.builtin.set_fact:
    _base_pkg_hash: "{{ base_image_packages | sort | join(',') | hash('sha256') }}"

- name: Set base image hash file path
  ansible.builtin.set_fact:
    _base_hash_file: "{{ image_build_log_dir }}/.base_image_pkg_hash_{{ build_arch }}"

- name: Check previous base image package hash
  ansible.builtin.slurp:
    src: "{{ _base_hash_file }}"
  register: _prev_base_hash
  failed_when: false
  delegate_to: "{{ aarch64_build_host }}"
  connection: ssh

- name: Determine if base image rebuild is needed
  ansible.builtin.set_fact:
    _base_rebuild_needed: >-
      {{ _prev_base_hash is failed
         or (_prev_base_hash.content | default('') | b64decode | trim) != _base_pkg_hash }}

- name: Skip base image build (packages unchanged)
  ansible.builtin.debug:
    msg: >-
      Skipping aarch64 base image build — package list unchanged
      (hash={{ _base_pkg_hash[:12] }}...).
      Delete {{ _base_hash_file }} to force rebuild.
  when: not (_base_rebuild_needed | bool)

# --- Build via Python orchestrator ---
- name: Build aarch64 base image
  when: _base_rebuild_needed | bool
  block:
    - name: "[BUILD] aarch64 base image — {{ rhel_arch_base_image_name }}"
      ansible.builtin.debug:
        msg: >-
          Starting base image build:
          image={{ rhel_arch_base_image_name }},
          packages={{ base_image_packages | length }},
          log={{ image_build__base_image_log_path }},
          timeout={{ job_async }}s

    - name: Run aarch64 base image build via orchestrator
      image_build_orchestrator:
        build_commands:
          - name: "base_{{ rhel_arch_base_image_name }}"
            cmd: >-
              podman run --rm --device /dev/fuse --network host
              {{ ochami_mounts | join(' ') }}
              {{ ochami_image | join(' ') }}
              {{ ochami_base_command | join(' ') }}
            log_path: "{{ image_build__base_image_log_path }}"
        max_parallel: 1
        timeout: "{{ job_async | int }}"
      register: base_orchestrator_result
      delegate_to: "{{ aarch64_build_host }}"
      connection: ssh

    - name: Display aarch64 base image build summary
      ansible.builtin.debug:
        msg: "Base image build: {{ base_orchestrator_result.summary }}"

    - name: Save base image package hash
      ansible.builtin.copy:
        content: "{{ _base_pkg_hash }}"
        dest: "{{ _base_hash_file }}"
        mode: "{{ dir_permissions_644 }}"
      delegate_to: "{{ aarch64_build_host }}"
      connection: ssh

# --- Registry verification ---
- name: Verify the aarch64 base osimage in registry
  ansible.builtin.command:
    cmd: "/usr/local/bin/regctl repo ls --limit 500 {{ registry_host }}:5000"
  delegate_to: "{{ aarch64_build_host }}"
  connection: ssh
  changed_when: false
  register: verify_base_osimage

- name: Fail if aarch64 base osimage not created
  ansible.builtin.fail:
    msg: >-
      Failed to build base osimage {{ host_name }}/{{ rhel_arch_base_image_name }}.
      Check log: {{ image_build__base_image_log_path }}
  when: >-
    (host_name + '/' + rhel_arch_base_image_name) not in
    verify_base_osimage.stdout_lines

- name: Display verified aarch64 base osimage
  ansible.builtin.debug:
    msg: "{{ verify_base_osimage.stdout_lines }}"
