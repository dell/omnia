---

- name: Include prepare repo builder image task (x86_64 only)
  ansible.builtin.include_tasks: prepare_repo_builder_image.yml
  when: build_arch == 'x86_64'

- name: Include global variables from common folder
  ansible.builtin.include_vars: "{{ role_path }}/../../vars/openchami_image_cmd.yml"
  register: ochami_image_global_vars

- name: Build image common tasks for {{ build_arch }}
  ansible.builtin.include_tasks: "build_image_common_{{ build_arch }}.yml"

- name: Invoke build base image playbook for {{ build_arch }}
  ansible.builtin.include_tasks: "build_base_image_{{ build_arch }}.yml"
  tags: base_image

- name: Invoke build rhel compute image playbooks for {{ build_arch }}
  ansible.builtin.include_tasks: "build_compute_image_{{ build_arch }}.yml"
  tags: compute_image

- name: Set S3 bucket ACLs for PowerScale backend
  ansible.builtin.include_tasks: set_s3_acl.yml
  when:
    - s3_configurations is defined
    - s3_configurations.provider is defined
    - s3_configurations.provider | lower == 'powerscale'
  tags: s3_acl

- name: Record built images for build_status output
  ansible.builtin.set_fact:
    _new_images: []
    build_arch_completed: "{{ (hostvars[inventory_hostname]['build_arch_completed'] | default([])) + [build_arch] }}"

# ---------------------------------------------------------------------------
# Discover exact artifact object keys from S3.
#
# The two supported build engines publish different layouts:
#   image-builder:
#     kernel/initrd: efi-images/<group>/<image>/versioned-filename
#     rootfs:        <group>/<image>/rhel-versioned-filename
#   image-thrillhouse:
#     kernel/initrd/rootfs: <group>/<image>/<release>/fixed-filename
#
# Keep build_status.yml engine-neutral by recording the exact endpoint-relative
# S3 path (bucket + object key) instead of reconstructing paths from basenames.
# ---------------------------------------------------------------------------
# S3 artifact discovery uses a two-stage lookup:
#   1. Try the current image name (with current catalog suffix)
#   2. If empty, fall back to a same-engine prefix match for cached catalog IDs
# This handles catalog ID changes where builds were cached and S3 still has
# old names.
- name: Discover exact S3 artifact keys per functional group
  ansible.builtin.shell: |
    set -o pipefail
    _s3_bucket="{{ s3_configurations.bucket | default('boot-images') }}"
    _image_name="rhel-{{ item.key }}{{ omnia_suffix }}"
    _image_name="${_image_name}{{ compute_image_suffix | default('') }}"
    _image_name="${_image_name}{{ _build_type_suffix }}"
    _image_prefix="rhel-{{ item.key }}{{ omnia_suffix }}"
    _build_suffix="{{ _build_type_suffix }}"
    _group_root="s3://${_s3_bucket}/{{ item.key }}/"
    _image_root="${_group_root}${_image_name}/"
    _thrillhouse="{{ (_is_thrillhouse | bool) | ternary('true', 'false') }}"
    _release_tag="{{ item.value.os_version | default(rhel_tag, true) }}"

    # Resolve the current image directory. When a catalog ID changes without
    # a rebuild, locate the newest complete rootfs candidate for this release
    # and engine. This prevents mixing image-builder, Thrillhouse, and backup
    # artifact cohorts.
    _root_listing=$(s3cmd ls -r "${_image_root}" 2>/dev/null)
    if [ -z "${_root_listing}" ]; then
      _group_objects=$(s3cmd ls -r "${_group_root}" 2>/dev/null \
        | LC_ALL=C sort -r | awk '{print $NF}')
      _found_dir=""
      while IFS= read -r _candidate; do
        [ -n "${_candidate}" ] || continue
        _relative="${_candidate#"${_group_root}"}"
        [ "${_relative}" != "${_candidate}" ] || continue
        _candidate_image="${_relative%%/*}"
        _candidate_artifact="${_relative#*/}"

        case "${_candidate_image}" in
          "${_image_prefix}"*"${_build_suffix}") ;;
          *) continue ;;
        esac

        if [ "${_thrillhouse}" = "true" ]; then
          [ "${_candidate_artifact}" = \
            "${_release_tag}/rootfs.squashfs" ] || continue
        else
          case "${_candidate_artifact}" in
            rhel*) ;;
            *) continue ;;
          esac
        fi

        _found_dir="${_group_root}${_candidate_image}/"
        break
      done <<< "${_group_objects}"

      if [ -n "${_found_dir}" ]; then
        _image_name=$(basename "${_found_dir%/}")
        _image_root="${_group_root}${_image_name}/"
        _root_listing=$(s3cmd ls -r "${_image_root}" 2>/dev/null)
      fi
    fi

    kernel_uri=""
    initrd_uri=""
    rootfs_uri=""

    if [ "${_thrillhouse}" = "true" ]; then
      kernel_uri=$(printf '%s\n' "${_root_listing}" \
        | awk -v expected="${_image_root}${_release_tag}/vmlinuz" \
          '$NF == expected {print $NF; exit}')
      initrd_uri=$(printf '%s\n' "${_root_listing}" \
        | awk -v expected="${_image_root}${_release_tag}/initramfs.img" \
          '$NF == expected {print $NF; exit}')
      rootfs_uri=$(printf '%s\n' "${_root_listing}" \
        | awk -v expected="${_image_root}${_release_tag}/rootfs.squashfs" \
          '$NF == expected {print $NF; exit}')
    else
      _efi_root="s3://${_s3_bucket}/efi-images/{{ item.key }}/${_image_name}/"
      _efi_listing=$(s3cmd ls "${_efi_root}" 2>/dev/null)
      kernel_uri=$(printf '%s\n' "${_efi_listing}" \
        | awk '$NF ~ /\/vmlinuz[^/]*$/ {print $NF; exit}')
      initrd_uri=$(printf '%s\n' "${_efi_listing}" \
        | awk '$NF ~ /\/initramfs[^/]*$/ {print $NF; exit}')
      rootfs_uri=$(printf '%s\n' "${_root_listing}" \
        | awk '$NF ~ /\/rhel[^/]*$/ {print $NF; exit}')
    fi

    # Strip only the URI scheme. The resulting endpoint-relative paths retain
    # the bucket name (for example, boot-images/...) as required by consumers.
    kernel_key="${kernel_uri#s3://}"
    initrd_key="${initrd_uri#s3://}"
    rootfs_key="${rootfs_uri#s3://}"

    echo "{{ item.key }}|${kernel_key}|${initrd_key}|${rootfs_key}"
  args:
    executable: /bin/bash
  register: _s3_artifact_discovery
  changed_when: false
  failed_when: false
  loop: "{{ compute_images_dict | dict2items }}"
  loop_control:
    loop_var: item
    label: "{{ item.key }}"

# Parse S3 discovery output: group|kernel_key|initrd_key|rootfs_key.
- name: Build exact artifact path lookup from S3 discovery
  ansible.builtin.set_fact:
    _s3_artifacts: >-
      {%- set result = {} -%}
      {%- for r in _s3_artifact_discovery.results -%}
        {%- set parts = r.stdout.split('|') -%}
        {%- if parts | length >= 4 -%}
          {%- set _ = result.update({parts[0]: {
            'kernel': parts[1],
            'initrd': parts[2],
            'rootfs': parts[3]
          }}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ result }}

- name: Validate discovered S3 artifact paths
  ansible.builtin.assert:
    that:
      - (_s3_artifacts.get(item.key, {}).get('kernel', '') | length) > 0
      - (_s3_artifacts.get(item.key, {}).get('initrd', '') | length) > 0
      - (_s3_artifacts.get(item.key, {}).get('rootfs', '') | length) > 0
    fail_msg: >-
      Failed to resolve exact kernel, initrd, and rootfs S3 object keys for
      functional group {{ item.key }} using {{ _image_build_type }}.
    quiet: true
  loop: "{{ compute_images_dict | dict2items }}"
  loop_control:
    loop_var: item
    label: "{{ item.key }}"

- name: Build image list entries using exact S3 object keys
  vars:
    _current_image:
      functional_group: "{{ item.key }}"
      kernel: "{{ _s3_artifacts[item.key].kernel }}"
      initrd: "{{ _s3_artifacts[item.key].initrd }}"
      image: "{{ _s3_artifacts[item.key].rootfs }}"
  ansible.builtin.set_fact:
    _new_images: "{{ (_new_images | default([])) + [_current_image] }}"
  loop: "{{ compute_images_dict | dict2items }}"
  loop_control:
    loop_var: item

- name: Merge with existing build_completed_images
  ansible.builtin.set_fact:
    build_completed_images: "{{ (hostvars[inventory_hostname]['build_completed_images'] | default({}))
      | combine({build_arch: (hostvars[inventory_hostname]['build_completed_images'] | default({}))[build_arch] | default([]) + _new_images}) }}"
    cacheable: true
