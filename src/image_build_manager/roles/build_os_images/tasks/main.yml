---

- name: Include prepare repo builder image task (x86_64 only)
  ansible.builtin.include_tasks: prepare_repo_builder_image.yml
  when: build_arch == 'x86_64'

- name: Include global variables from common folder
  ansible.builtin.include_vars: "{{ role_path }}/../../vars/openchami_image_cmd.yml"
  register: ochami_image_global_vars

- name: Build image common tasks for {{ build_arch }}
  ansible.builtin.include_tasks: "build_image_common_{{ build_arch }}.yml"

- name: Invoke build base image playbook for {{ build_arch }}
  ansible.builtin.include_tasks: "build_base_image_{{ build_arch }}.yml"
  tags: base_image

- name: Invoke build rhel compute image playbooks for {{ build_arch }}
  ansible.builtin.include_tasks: "build_compute_image_{{ build_arch }}.yml"
  tags: compute_image

- name: Set S3 bucket ACLs for PowerScale backend
  ansible.builtin.include_tasks: set_s3_acl.yml
  when:
    - s3_configurations is defined
    - s3_configurations.provider is defined
    - s3_configurations.provider | lower == 'powerscale'
  tags: s3_acl

- name: Record built images for build_status output
  ansible.builtin.set_fact:
    _new_images: []
    build_arch_completed: "{{ (hostvars[inventory_hostname]['build_arch_completed'] | default([])) + [build_arch] }}"

# ---------------------------------------------------------------------------
# Discover actual artifact filenames from S3.
# The image builder uploads files with version-specific names:
#   kernel:  vmlinuz-6.12.0-55.94.1.el10_0.x86_64       (not "vmlinuz")
#   initrd:  initramfs-6.12.0-55.94.1.el10_0.x86_64.img (not "initramfs.img")
#   rootfs:  rhel10.0-rhel-<fg>_omnia_2.3-imgbld-10.0   (not the directory)
# The build_status manifest must reference the actual S3 object keys so
# downstream consumers (BSS, provision) can fetch them by exact path.
# ---------------------------------------------------------------------------
# S3 artifact discovery uses a two-stage lookup:
#   1. Try the current image name (with current catalog suffix)
#   2. If empty, fall back to prefix match (finds images from previous catalog IDs)
# This handles catalog ID changes where builds were cached and S3 still has old names.
- name: Discover actual S3 artifact filenames per functional group
  ansible.builtin.shell: |
    set -o pipefail
    _s3_bucket="{{ s3_configurations.bucket | default('boot-images') }}"
    _image_name="rhel-{{ item.key }}{{ omnia_suffix }}{{ compute_image_suffix | default('') }}{{ _build_type_suffix }}"
    _image_prefix="rhel-{{ item.key }}{{ omnia_suffix }}"

    # EFI artifacts (kernel + initrd) — try exact name first, then prefix
    _efi_prefix="s3://${_s3_bucket}/efi-images/{{ item.key }}/${_image_name}/"
    kernel=$(s3cmd ls "${_efi_prefix}" 2>/dev/null | awk '{print $NF}' | xargs -I{} basename {} | grep -E '^vmlinuz' | head -1)
    initrd=$(s3cmd ls "${_efi_prefix}" 2>/dev/null | awk '{print $NF}' | xargs -I{} basename {} | grep -E '^initramfs' | head -1)

    # Fallback: prefix match for EFI (handles catalog ID change)
    if [ -z "$kernel" ] || [ -z "$initrd" ]; then
      _efi_fallback="s3://${_s3_bucket}/efi-images/{{ item.key }}/"
      _found_dir=$(s3cmd ls "${_efi_fallback}" 2>/dev/null | awk '{print $NF}' | grep "${_image_prefix}" | head -1)
      if [ -n "$_found_dir" ]; then
        [ -z "$kernel" ] && kernel=$(s3cmd ls "${_found_dir}" 2>/dev/null | awk '{print $NF}' | xargs -I{} basename {} | grep -E '^vmlinuz' | head -1)
        [ -z "$initrd" ] && initrd=$(s3cmd ls "${_found_dir}" 2>/dev/null | awk '{print $NF}' | xargs -I{} basename {} | grep -E '^initramfs' | head -1)
        # Update _image_name to the actual directory name for rootfs lookup
        _image_name=$(basename "$_found_dir")
      fi
    fi

    # Rootfs image — try exact name first, then prefix
    _img_prefix="s3://${_s3_bucket}/{{ item.key }}/${_image_name}/"
    rootfs=$(s3cmd ls "${_img_prefix}" 2>/dev/null | awk '{print $NF}' | xargs -I{} basename {} | grep -vE '^$' | head -1)

    if [ -z "$rootfs" ]; then
      _img_fallback="s3://${_s3_bucket}/{{ item.key }}/"
      _found_dir=$(s3cmd ls "${_img_fallback}" 2>/dev/null | awk '{print $NF}' | grep "${_image_prefix}" | head -1)
      if [ -n "$_found_dir" ]; then
        rootfs=$(s3cmd ls "${_found_dir}" 2>/dev/null | awk '{print $NF}' | xargs -I{} basename {} | grep -vE '^$' | head -1)
        _image_name=$(basename "$_found_dir")
      fi
    fi

    echo "{{ item.key }}|${kernel:-}|${initrd:-}|${rootfs:-}|${_image_name}"
  args:
    executable: /bin/bash
  register: _s3_artifact_discovery
  changed_when: false
  failed_when: false
  loop: "{{ compute_images_dict | dict2items }}"
  loop_control:
    loop_var: item
    label: "{{ item.key }}"

# Parse S3 discovery output: group|kernel|initrd|rootfs|actual_image_name
# The 5th field is the resolved image name (may differ from current suffix
# when catalog ID changed and builds were cached).
- name: Build artifact filename lookup from S3 discovery
  ansible.builtin.set_fact:
    _s3_artifacts: >-
      {%- set result = {} -%}
      {%- for r in _s3_artifact_discovery.results -%}
        {%- set parts = r.stdout.split('|') -%}
        {%- if parts | length >= 4 -%}
          {%- set _ = result.update({parts[0]: {
            'kernel': parts[1],
            'initrd': parts[2],
            'rootfs': parts[3],
            'image_name': parts[4] | default(parts[0], true)
          }}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ result }}

- name: Build image list entries (using actual S3 filenames)
  vars:
    _resolved_name: >-
      {{ _s3_artifacts[item.key].image_name
      | default('rhel-' + item.key + omnia_suffix
      + (compute_image_suffix | default('')) + _build_type_suffix) }}
    _kernel_file: "{{ _s3_artifacts[item.key].kernel | default('') }}"
    _initrd_file: "{{ _s3_artifacts[item.key].initrd | default('') }}"
    _rootfs_file: "{{ _s3_artifacts[item.key].rootfs | default('') }}"
    _current_image:
      functional_group: "{{ item.key }}"
      kernel: "boot-images/efi-images/{{ item.key }}/{{ _resolved_name }}/{{ _kernel_file }}"
      initrd: "boot-images/efi-images/{{ item.key }}/{{ _resolved_name }}/{{ _initrd_file }}"
      image: "boot-images/{{ item.key }}/{{ _resolved_name }}{{ ('/' + _rootfs_file) if (_rootfs_file | length > 0) else '' }}"
  ansible.builtin.set_fact:
    _new_images: "{{ (_new_images | default([])) + [_current_image] }}"
  loop: "{{ compute_images_dict | dict2items }}"
  loop_control:
    loop_var: item

- name: Merge with existing build_completed_images
  ansible.builtin.set_fact:
    build_completed_images: "{{ (hostvars[inventory_hostname]['build_completed_images'] | default({}))
      | combine({build_arch: (hostvars[inventory_hostname]['build_completed_images'] | default({}))[build_arch] | default([]) + _new_images}) }}"
    cacheable: true
