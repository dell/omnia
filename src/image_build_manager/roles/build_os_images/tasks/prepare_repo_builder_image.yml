---

# Set OIM PXE IP from admin_nic_ip
- name: Set PXE IP fact
  ansible.builtin.set_fact:
    oim_pxe_ip: "{{ hostvars['localhost']['admin_nic_ip'] }}"
    cacheable: true

# Copy repo manager certificate and update CA trust (skipped when cert is not configured)
- name: Copy repo manager certificate to anchors
  ansible.builtin.copy:
    src: "{{ repo_cert_path }}"
    dest: "{{ anchors_path }}"
    mode: "{{ dir_permissions_644 }}"
    remote_src: true
  become: true
  when: repo_cert_path | default('') | length > 0

- name: Update CA trust
  ansible.builtin.command: update-ca-trust
  register: update_ca
  changed_when: false
  when: repo_cert_path | default('') | length > 0

- name: Build full Podman image path for x86_64
  ansible.builtin.set_fact:
    builder_image_path: "{{ oim_pxe_ip }}:{{ hostvars['localhost']['repo_port'] | default(2225) }}/{{ repo_builder_image }}"

- name: Check if builder image already exists locally
  containers.podman.podman_image_info:
    name: "{{ local_tag }}"
  register: local_image_info

- name: Pull and tag x86_64 image
  when: local_image_info.images | length == 0
  block:
    - name: Pull x86_64 image from repo manager registry
      containers.podman.podman_image:
        name: "{{ builder_image_path }}"
        state: present
      register: pull_result
      retries: "{{ pull_image_retries }}"
      delay: "{{ pull_image_delay }}"
      until: pull_result is not failed
      changed_when: false

    - name: Tag pulled image for x86_64 build
      containers.podman.podman_tag:
        image: "{{ builder_image_path }}"
        target_names:
          - "{{ local_tag }}"
      changed_when: false

  rescue:
    - name: Attempt direct pull from upstream registry (internet fallback)
      block:
        - name: Display fallback notice
          ansible.builtin.debug:
            msg: "{{ pull_image_fallback_msg.format(repo_path=builder_image_path, upstream_image=repo_builder_image) }}"

        - name: Pull image directly from upstream registry
          containers.podman.podman_image:
            name: "{{ repo_builder_image }}"
            state: present
          register: direct_pull_result
          retries: "{{ pull_image_retries }}"
          delay: "{{ pull_image_delay }}"
          until: direct_pull_result is not failed
          changed_when: false

        - name: Tag directly pulled image for x86_64 build
          containers.podman.podman_tag:
            image: "{{ repo_builder_image }}"
            target_names:
              - "{{ local_tag }}"
          changed_when: false

        - name: Display direct pull success
          ansible.builtin.debug:
            msg: "{{ pull_image_success_msg.format(upstream_image=repo_builder_image) }}"
            verbosity: 1

      rescue:
        - name: Fail if both pull methods failed
          ansible.builtin.fail:
            msg: "{{ pull_image_failure_msg.format(repo_path=builder_image_path, upstream_image=repo_builder_image) }}"
