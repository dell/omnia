---

# Set OIM PXE IP from admin_nic_ip
- name: Set PXE IP fact
  ansible.builtin.set_fact:
    oim_pxe_ip: "{{ hostvars['localhost']['admin_nic_ip'] }}"
    cacheable: true

# Copy repo manager certificate and update CA trust (skipped when cert is not configured)
- name: Copy repo manager certificate to anchors
  ansible.builtin.copy:
    src: "{{ repo_cert_path }}"
    dest: "{{ anchors_path }}"
    mode: "{{ dir_permissions_644 }}"
    remote_src: true
  become: true
  when: repo_cert_path | default('') | length > 0

- name: Update CA trust
  ansible.builtin.command: update-ca-trust
  register: update_ca
  changed_when: false
  when: repo_cert_path | default('') | length > 0

- name: Build full Podman image path for x86_64
  ansible.builtin.set_fact:
    builder_image_path: "{{ oim_pxe_ip }}:{{ hostvars['localhost']['repo_port'] | default(2225) }}/{{ repo_builder_image }}"

# ---------------------------------------------------------------------------
# Multi-name local image detection
# ---------------------------------------------------------------------------
# The builder image can exist locally under any of three names:
#   1. local_tag       — the build-time tag (e.g. x86_64-image-builder/ochami)
#   2. repo_builder_image  — upstream name (e.g. docker.io/.../image-build-el10:1.3)
#   3. builder_image_path  — repo_manager mirror path (e.g. 10.20.0.1:2225/docker.io/...)
# If the image is found under ANY name, we tag it as local_tag and skip pulling.
# ---------------------------------------------------------------------------
- name: Check if builder image already exists locally (local_tag)
  containers.podman.podman_image_info:
    name: "{{ local_tag }}"
  register: _local_tag_info

- name: Check if builder image exists under upstream name
  containers.podman.podman_image_info:
    name: "{{ repo_builder_image }}"
  register: _upstream_name_info
  when: _local_tag_info.images | length == 0

- name: Check if builder image exists under repo_manager mirror name
  containers.podman.podman_image_info:
    name: "{{ builder_image_path }}"
  register: _repo_manager_name_info
  when:
    - _local_tag_info.images | length == 0
    - (_upstream_name_info.images | default([])) | length == 0

- name: Set builder image availability fact
  ansible.builtin.set_fact:
    _builder_image_found: >-
      {{ (_local_tag_info.images | length > 0)
         or ((_upstream_name_info.images | default([])) | length > 0)
         or ((_repo_manager_name_info.images | default([])) | length > 0) }}
    _builder_image_source: >-
      {%- if _local_tag_info.images | length > 0 -%}local_tag
      {%- elif (_upstream_name_info.images | default([])) | length > 0 -%}upstream
      {%- elif (_repo_manager_name_info.images | default([])) | length > 0 -%}repo_manager
      {%- else -%}none{%- endif -%}

- name: Display skip notice — builder image already available
  ansible.builtin.debug:
    msg: >-
      Builder image already present locally (found as {{ _builder_image_source }}).
      Skipping pull from registry. Image: {{ local_tag }}
  when: _builder_image_found | bool

# Tag the existing image as local_tag if found under a different name
- name: Tag existing upstream image as local_tag
  containers.podman.podman_tag:
    image: "{{ repo_builder_image }}"
    target_names:
      - "{{ local_tag }}"
  changed_when: false
  when:
    - _builder_image_found | bool
    - _builder_image_source == 'upstream'

- name: Tag existing repo_manager image as local_tag
  containers.podman.podman_tag:
    image: "{{ builder_image_path }}"
    target_names:
      - "{{ local_tag }}"
  changed_when: false
  when:
    - _builder_image_found | bool
    - _builder_image_source == 'repo_manager'

# ---------------------------------------------------------------------------
# Pull only when the image is NOT available locally under any name
# ---------------------------------------------------------------------------
- name: Pull and tag x86_64 image
  when: not (_builder_image_found | bool)
  block:
    - name: Pull x86_64 image from repo manager registry
      containers.podman.podman_image:
        name: "{{ builder_image_path }}"
        state: present
      register: pull_result
      retries: "{{ pull_image_retries }}"
      delay: "{{ pull_image_delay }}"
      until: pull_result is not failed
      changed_when: false

    - name: Tag pulled image for x86_64 build
      containers.podman.podman_tag:
        image: "{{ builder_image_path }}"
        target_names:
          - "{{ local_tag }}"
      changed_when: false

  rescue:
    - name: Attempt direct pull from upstream registry (internet fallback)
      block:
        - name: Display fallback notice
          ansible.builtin.debug:
            msg: "{{ pull_image_fallback_msg.format(repo_path=builder_image_path, upstream_image=repo_builder_image) }}"

        - name: Pull image directly from upstream registry
          containers.podman.podman_image:
            name: "{{ repo_builder_image }}"
            state: present
          register: direct_pull_result
          retries: "{{ pull_image_retries }}"
          delay: "{{ pull_image_delay }}"
          until: direct_pull_result is not failed
          changed_when: false

        - name: Tag directly pulled image for x86_64 build
          containers.podman.podman_tag:
            image: "{{ repo_builder_image }}"
            target_names:
              - "{{ local_tag }}"
          changed_when: false

        - name: Display direct pull success
          ansible.builtin.debug:
            msg: "{{ pull_image_success_msg.format(upstream_image=repo_builder_image) }}"
            verbosity: 1

      rescue:
        - name: Fail if both pull methods failed
          ansible.builtin.fail:
            msg: "{{ pull_image_failure_msg.format(repo_path=builder_image_path, upstream_image=repo_builder_image) }}"
