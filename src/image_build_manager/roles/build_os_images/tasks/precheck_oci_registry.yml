---
# precheck_oci_registry.yml — external OCI registry (Harbor) precheck.
# Runs before any build work, only when external_oci_registry is set.
# Resolves the registry addressing used later by the push, confirms the Vault
# credentials are present, authenticates against the Registry V2 endpoint and
# confirms the Harbor project is accessible. Credential-bearing calls use
# no_log; failures are classified from the registered HTTP status so no
# message ever contains a credential.

- name: Check the external OCI registry endpoint and credentials
  ansible.builtin.include_tasks: check_oci_registry_endpoint.yml

- name: Check the external OCI registry project
  ansible.builtin.include_tasks: check_harbor_project.yml

- name: Report external OCI registry precheck result
  ansible.builtin.debug:
    msg: >-
      External OCI registry precheck passed: endpoint={{ _ext_oci_host_ref }}
      project={{ _ext_oci_namespace }} tls={{ _ext_oci_tls }}
