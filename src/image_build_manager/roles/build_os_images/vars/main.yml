---
# Architecture-agnostic variables — build_arch is set by the calling playbook
_build_type_suffix: "-imgth"
rhel_arch_base_image_name: "rhel-{{ build_arch }}-base{{ _build_type_suffix }}"

pull_image_retries: "5"
pull_image_delay: "10"
pull_image_fallback_msg: "Pull from repo manager ({repo_path}) failed. Attempting direct pull from {upstream_image}..."
pull_image_success_msg: "Successfully pulled {upstream_image} directly from upstream registry."
pull_image_failure_msg: |
  Failed to pull the Image Thrillhouse container from both sources:
    1. Repo manager registry: {repo_path}
    2. Direct upstream:       {upstream_image}
  Ensure either the repo manager has synced the image or the host has internet access.
omnia_version: "{{ hostvars['localhost']['omnia_version'] }}"
input_project_dir: "{{ hostvars['localhost']['input_project_dir'] }}"
dir_permissions_644: "0644"
dir_permissions_755: "0755"
shared_path: "{{ hostvars['localhost']['shared_path'] }}"
repo_cert_path: "{{ hostvars['localhost']['repo_cert_path'] | default('') }}"

# Build timing and controls — single source of truth from image_build_config.yml
build_timeout: "{{ hostvars['localhost']['build_image_build_timeout'] | default(hostvars['localhost']['build_image_job_async'] | default(7200)) }}"
max_parallel: "{{ hostvars['localhost']['build_image_max_parallel'] | default(0) }}"
force_rebuild: "{{ hostvars['localhost']['build_image_force_rebuild'] | default(false) | bool }}"
backup_s3_images: "{{ hostvars['localhost']['build_image_backup_s3_images'] | default(false) | bool }}"

_image_build_type: "image-thrillhouse"
_thrillhouse_container_image: "ghcr.io/openchami/image-thrillhouse:v0.0.26"
repo_builder_image: "{{ _thrillhouse_container_image }}"
local_tag: "{{ build_arch }}-image-thrillhouse/ochami"
openchami_work_dir: "{{ shared_path }}/workdir/image-thrillhouse"

# Cert destination inside the container — derived from repo_manager output filename.
_cert_basename: "{{ repo_cert_path | basename | default('pulp_webserver.crt', true) }}"
anchors_path: "/etc/pki/ca-trust/source/anchors/{{ _cert_basename }}"
_cert_host_path: >-
  {{ (build_arch == 'aarch64') | ternary(anchors_path, repo_cert_path) }}
_cert_mount: "-v {{ _cert_host_path }}:{{ anchors_path }}:z"
_config_mount_path: "/config.yaml"

_privilege_opts:
  - "--user 0 --privileged"
  - "--cap-add=SYS_ADMIN --cap-add=SETUID --cap-add=SETGID"
  - "--security-opt seccomp=unconfined --security-opt label=disable"
_cert_opts: "{{ ([_cert_mount] if (repo_cert_path | default('') | length > 0) else []) }}"
ochami_common_mounts: "{{ _privilege_opts + _cert_opts }}"
ochami_mounts: >-
  {{ ochami_common_mounts
     + ['-v ' + openchami_work_dir + '/images/' + rhel_arch_base_image_name + '-' + rhel_tag + '.yaml:' + _config_mount_path + ':z'] }}

ochami_image:
  - "localhost/{{ local_tag }}"
ochami_base_command:
  - "image-thrillhouse build --config /config.yaml --log-level info"
openchami_base_image_config_template: "{{ role_path }}/templates/images/thrillhouse-base-config.yaml.j2"
openchami_compute_image_config_template: "{{ role_path }}/templates/images/thrillhouse-compute-config.yaml.j2"

# Log paths use the fixed Image Thrillhouse suffix.
image_build_log_dir: "{{ hostvars['localhost']['log_dir'] | default(shared_path + '/log') }}"
image_build__base_image_log_path: "{{ image_build_log_dir }}/{{ build_arch }}_base_image{{ _build_type_suffix }}.log"
base_image_failure_msg: |
  Base {{ build_arch }} image build job failed or timed out.
  Check logs at path {{ image_build__base_image_log_path }} for details.
compute_image_failure_msg: |
  {{ build_arch }} compute image build job did not complete successfully.
  Check logs at {{ image_build_log_dir }} for respective functional group for more details.

regctl_not_found_fail_msg: >-
  regctl binary not found at /usr/local/bin/regctl.
  Run the deploy_registry role (prepare_image_build_manager.yml) first
  to install regctl and configure registry TLS.


# preflight_selinux_check.yml
selinux_module_name: "omnia-crun-bpf"
selinux_policy_dir: "/etc/selinux/targeted/custom"
podman_verify_fail_msg: >-
  Podman cannot start containers on this node.
  Ensure the node was rebooted after the kernel update and that the
  omnia-crun-bpf SELinux module loaded successfully
  (semodule -lfull | grep omnia-crun-bpf).
selinux_install_warn_msg: >-
  WARNING: Failed to install omnia-crun-bpf SELinux policy module.
  Build will continue but may fail if the eBPF device filter issue is present.
  Check SELinux policy tools and audit log on this node.

# S3 image backup messages
s3_backup_skip_msg: >-
  S3 image backup disabled (backup_s3_images: false).
  Set backup_s3_images: true in image_build_config.yml to enable rollback capability.
s3_backup_rootfs_msg: "Backing up compute rootfs images: s3://{{ _s3_bucket }}/{{ item.key }}/{{ _img_name }}/ → *_prev/"
s3_backup_efi_msg: "Backing up compute EFI images: s3://{{ _s3_bucket }}/efi-images/{{ item.key }}/{{ _img_name }}/ → *_prev/"
s3_backup_success_msg: "Backed up {{ _backup_count }} compute image groups (rootfs + EFI) to *_prev."
s3_backup_failure_msg: >-
  S3 backup failed for some groups. Check s3cmd configuration and S3 bucket accessibility.
  Builds will continue but rollback may not be possible.

# Artifact validation messages
s3_configurations_missing_fail_msg: >-
  s3_configurations is not defined. Ensure image_build_config.yml is loaded before this role.
podman_verify_error_fail_msg: >-
  {{ podman_verify_fail_msg }} Error: {{ _podman_verify.stderr | default('unknown') }}
base_registry_missing_fail_msg: >-
  Failed to build base osimage {{ host_name }}/{{ rhel_arch_base_image_name }}.
  Check log: {{ image_build_log_dir }}/{{ build_arch }}_base_image_*{{ _build_type_suffix }}.log
base_registry_tag_missing_fail_msg: >-
  Base image {{ host_name }}/{{ rhel_arch_base_image_name }} is missing
  tag '{{ item }}' in registry. Expected tags for versions:
  {{ _base_image_versions | join(', ') }}.
  Available tags: {{ _base_tag_check.stdout_lines | default([]) | join(', ') }}.
  Check logs: {{ image_build_log_dir }}/{{ build_arch }}_base_image_*{{ _build_type_suffix }}.log
compute_registry_missing_fail_msg: >-
  Compute image not found in registry for group {{ item.key }}.
  Expected prefix: {{ host_name }}/rhel-{{ item.key }}{{ omnia_suffix }}.
  Registry repos: {{ verify_compute_osimages.stdout_lines | default([]) }}.
  Check logs: ls {{ image_build_log_dir }}/{{ item.key }}*_compute_image.log
compute_registry_tags_missing_fail_msg: >-
  Compute image {{ host_name }}/rhel-{{ item.item.key }}{{ omnia_suffix }}{{ compute_image_suffix | default('') }}{{ _build_type_suffix }}
  exists in registry but has no tags.
  Check logs: ls {{ image_build_log_dir }}/{{ item.item.key }}*_compute_image.log
compute_s3_missing_fail_msg: >-
  Compute image for group {{ item.item.key }} not found in
  s3://{{ s3_configurations.bucket | default('boot-images') }}/{{ item.item.key }}/.
  Check logs: ls {{ image_build_log_dir }}/{{ item.item.key }}*_compute_image.log
s3_artifact_resolution_fail_msg: >-
  Failed to resolve exact kernel, initrd, and rootfs S3 object keys for
  functional group {{ item.key }} using {{ _image_build_type }}.
