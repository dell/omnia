---
# Architecture-agnostic variables — build_arch is set by the calling playbook
# ---------------------------------------------------------------------------
# Build-type suffix — applied to ALL output artifact names (base image, compute
# image, S3 prefixes) so the two build engines produce clearly distinct artifacts
# that can coexist in the same OCI registry and S3 bucket without overwriting
# each other.
#
#   image-builder    →  suffix "-ib"   e.g. rhel-x86_64-base-ib
#   image-thrillhouse →  suffix "-th"   e.g. rhel-x86_64-base-th
#
# Suffix is preferred over prefix so alphabetic registry/S3 listings keep all
# "rhel-*" images grouped together; the engine qualifier trails the semantic name.
# ---------------------------------------------------------------------------
_build_type_suffix: "{{ (_is_thrillhouse | bool) | ternary('-th', '-ib') }}"
rhel_arch_base_image_name: "rhel-{{ build_arch }}-base{{ _build_type_suffix }}"

pull_image_retries: "5"
pull_image_delay: "10"
pull_image_fallback_msg: "Pull from repo manager ({repo_path}) failed. Attempting direct pull from {upstream_image}..."
pull_image_success_msg: "Successfully pulled {upstream_image} directly from upstream registry."
pull_image_failure_msg: |
  Failed to pull builder image from both sources:
    1. Repo manager registry: {repo_path}
    2. Direct upstream:       {upstream_image}
  Ensure either the repo manager has synced the image or the host has internet access.
omnia_version: "{{ hostvars['localhost']['omnia_version'] }}"
input_project_dir: "{{ hostvars['localhost']['input_project_dir'] }}"
dir_permissions_644: "0644"
dir_permissions_755: "0755"
shared_path: "{{ hostvars['localhost']['shared_path'] }}"
repo_cert_path: "{{ hostvars['localhost']['repo_cert_path'] | default('') }}"

# Build timing and controls — single source of truth from image_build_config.yml
# build_timeout: per-build timeout in seconds for the Python orchestrator.
# Falls back to legacy job_async if build_timeout is not set (backward compat).
build_timeout: "{{ hostvars['localhost']['build_image_build_timeout'] | default(hostvars['localhost']['build_image_job_async'] | default(7200)) }}"
max_parallel: "{{ hostvars['localhost']['build_image_max_parallel'] | default(0) }}"
force_rebuild: "{{ hostvars['localhost']['build_image_force_rebuild'] | default(false) | bool }}"
backup_s3_images: "{{ hostvars['localhost']['build_image_backup_s3_images'] | default(false) | bool }}"

# ---------------------------------------------------------------------------
# Build type switching: image-builder vs image-thrillhouse
# ---------------------------------------------------------------------------
_image_build_type: "{{ hostvars['localhost']['image_build_type'] | default('image-builder') }}"
_is_thrillhouse: "{{ _image_build_type == 'image-thrillhouse' }}"

# Container images per build type
_builder_container_image: "dellhpcomniaaisolution/image-build-el10:1.2"
_thrillhouse_container_image: "ghcr.io/openchami/image-thrillhouse:v0.0.20"
repo_builder_image: "{{ (_is_thrillhouse | bool) | ternary(_thrillhouse_container_image, _builder_container_image) }}"

# Local tag per build type
_builder_local_tag: "{{ build_arch }}-image-builder/ochami"
_thrillhouse_local_tag: "{{ build_arch }}-image-thrillhouse/ochami"
local_tag: "{{ (_is_thrillhouse | bool) | ternary(_thrillhouse_local_tag, _builder_local_tag) }}"

anchors_path: "/etc/pki/ca-trust/source/anchors/pulp_webserver.crt"
# Separate workdir per build type to avoid config file collisions
_workdir_suffix: "{{ (_is_thrillhouse | bool) | ternary('image-thrillhouse', 'image-builder') }}"
openchami_work_dir: "{{ shared_path }}/workdir/{{ _workdir_suffix }}"

# Cert mount is conditional — only included when repo_cert_path is non-empty
_cert_mount: "-v {{ repo_cert_path }}:/etc/pki/ca-trust/source/anchors/pulp_webserver.crt:z"

# Config mount path differs: image-builder uses /home/builder/config.yaml, thrillhouse uses /config.yaml
_config_mount_path: "{{ (_is_thrillhouse | bool) | ternary('/config.yaml', '/home/builder/config.yaml') }}"

# --- Common privilege options per build type ---
_builder_privilege_opts:
  - "--user 0 --privileged"
_thrillhouse_privilege_opts:
  - "--user 0 --privileged"
  - "--cap-add=SYS_ADMIN --cap-add=SETUID --cap-add=SETGID"
  - "--security-opt seccomp=unconfined --security-opt label=disable"
_privilege_opts: "{{ (_is_thrillhouse | bool) | ternary(_thrillhouse_privilege_opts, _builder_privilege_opts) }}"

# Cert mount (only when repo_cert_path is set)
_cert_opts: "{{ ([_cert_mount] if (repo_cert_path | default('') | length > 0) else []) }}"

# Base image mounts (static — rhel_arch_base_image_name is known at role load time)
ochami_mounts: >-
  {{ _privilege_opts + _cert_opts
     + ['-v ' + openchami_work_dir + '/images/' + rhel_arch_base_image_name + '-' + rhel_tag + '.yaml:' + _config_mount_path + ':z'] }}

# Container image reference + entrypoint
# image-builder needs --entrypoint /bin/bash; thrillhouse runs directly
ochami_image: >-
  {{ (_is_thrillhouse | bool)
     | ternary(
         ['localhost/' + local_tag],
         ['--entrypoint /bin/bash', 'localhost/' + local_tag]
       ) }}

# Build command per type
# image-builder: bash -c 'update-ca-trust && image-build --config ... --log-level DEBUG'
# image-thrillhouse: image-thrillhouse build --config /config.yaml --log-level info
_ca_trust_cmd: "{{ (repo_cert_path | default('') | length > 0) | ternary('update-ca-trust extract && ', '') }}"
_builder_command:
  - "-c '{{ _ca_trust_cmd }}image-build --config /home/builder/config.yaml --log-level DEBUG'"
_thrillhouse_command:
  - "image-thrillhouse build --config /config.yaml --log-level info"
ochami_base_command: "{{ (_is_thrillhouse | bool) | ternary(_thrillhouse_command, _builder_command) }}"

# Config templates per build type
_builder_base_config_template: "{{ role_path }}/templates/images/rhel-base-config.yaml.j2"
_builder_compute_config_template: "{{ role_path }}/templates/images/rhel-compute-config.yaml.j2"
_thrillhouse_base_config_template: "{{ role_path }}/templates/images/thrillhouse-base-config.yaml.j2"
_thrillhouse_compute_config_template: "{{ role_path }}/templates/images/thrillhouse-compute-config.yaml.j2"
openchami_base_image_config_template: "{{ (_is_thrillhouse | bool) | ternary(_thrillhouse_base_config_template, _builder_base_config_template) }}"
openchami_compute_image_config_template: "{{ (_is_thrillhouse | bool) | ternary(_thrillhouse_compute_config_template, _builder_compute_config_template) }}"

# Log paths
image_build_log_dir: "{{ hostvars['localhost']['log_dir'] | default(shared_path + '/log') }}"
image_build__base_image_log_path: "{{ image_build_log_dir }}/{{ build_arch }}_base_image.log"
base_image_failure_msg: |
  Base {{ build_arch }} image build job failed or timed out.
  Check logs at path {{ image_build__base_image_log_path }} for details.
compute_image_failure_msg: |
  {{ build_arch }} compute image build job did not complete successfully.
  Check logs at {{ image_build_log_dir }} for respective functional group for more details.

regctl_not_found_fail_msg: >-
  regctl binary not found at /usr/local/bin/regctl.
  Run the deploy_registry role (prepare_image_build_manager.yml) first
  to install regctl and configure registry TLS.


# preflight_selinux_check.yml
selinux_module_name: "omnia-crun-bpf"
selinux_policy_dir: "/etc/selinux/targeted/custom"
podman_verify_fail_msg: >-
  Podman cannot start containers on this node.
  Ensure the node was rebooted after the kernel update and that the
  omnia-crun-bpf SELinux module loaded successfully
  (semodule -lfull | grep omnia-crun-bpf).
selinux_install_warn_msg: >-
  WARNING: Failed to install omnia-crun-bpf SELinux policy module.
  Build will continue but may fail if the eBPF device filter issue is present.
  Check SELinux policy tools and audit log on this node.

# S3 image backup messages
s3_backup_skip_msg: >-
  S3 image backup disabled (backup_s3_images: false).
  Set backup_s3_images: true in image_build_config.yml to enable rollback capability.
s3_backup_rootfs_msg: "Backing up compute rootfs images: s3://{{ _s3_bucket }}/{{ item.key }}/{{ _img_name }}/ → *_prev/"
s3_backup_efi_msg: "Backing up compute EFI images: s3://{{ _s3_bucket }}/efi-images/{{ item.key }}/{{ _img_name }}/ → *_prev/"
s3_backup_success_msg: "Backed up {{ _backup_count }} compute image groups (rootfs + EFI) to *_prev."
s3_backup_failure_msg: >-
  S3 backup failed for some groups. Check s3cmd configuration and S3 bucket accessibility.
  Builds will continue but rollback may not be possible.
