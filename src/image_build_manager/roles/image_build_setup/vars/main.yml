---
# ============================================================================
# image_build_setup — Role Variables
# ============================================================================
# All user-facing error messages are defined here (not inline in tasks).
# See docs/code-style/ for naming and message conventions.
# --- Common vars (inlined from common/vars/common_vars.yml) ---
clone_retry: "5"
clone_delay: "10"
fail_retry: "5"
fail_delay: "10"
dir_permissions_755: "0755"
file_permissions_755: "0755"
file_permissions_644: "0644"
file_permissions_600: "0600"
file_permissions_400: "0400"
# --- Tag validation ---
supported_tags:
  - precheck
  - validate
  - prepare
  - execute
  - build
  - cleanup
  - upgrade
  - rollback
skip_credential_tags:
  - precheck
  - cleanup
  - validate
invalid_tag_combinations:
  - [prepare, cleanup]
  - [build, cleanup]
  - [execute, cleanup]
  - [prepare, upgrade]
  - [build, upgrade]
  - [execute, upgrade]
  - [cleanup, upgrade]
  - [prepare, rollback]
  - [build, rollback]
  - [execute, rollback]
  - [cleanup, rollback]
  - [upgrade, rollback]
  - [precheck, prepare]
  - [precheck, build]
  - [precheck, execute]
  - [precheck, cleanup]
  - [precheck, upgrade]
  - [precheck, rollback]
# --- Tag validation messages ---
tag_validation_fail_msg: |
  Invalid tag usage detected.
  Supported tags: {{ supported_tags | join(', ') }}
  Invalid tags provided: {{ invalid_tags | join(', ') }}
  Please use only supported tags.
tag_combination_fail_msg: |
  Invalid tag combination detected: {{ ansible_run_tags | join(', ') }}
  The following tag combinations are not allowed:
  {% for combo in invalid_tag_combinations %}
  - {{ combo | join(' + ') }}
  {% endfor %}
  Please run with only ONE tag at a time (or no tags for default flow).
# --- Config validation messages ---
env_admin_nic_ip_missing_fail_msg: >-
  SYSTEM_ADMIN_NIC_IPV4 is not set. Export it before running:
    export SYSTEM_ADMIN_NIC_IPV4=<your_admin_nic_ip>
# --- Prerequisite validation messages ---
project_dir_not_exist_fail_msg: >-
  The project directory at {{ input_project_dir }} does not exist.
  Please ensure the directory exists before re-running the playbook.
repo_status_not_found_fail_msg: >-
  repo_status.yml not found at {{ repo_manager_output_path }}.
  Run repo_manager first, or copy the sample file:
    mkdir -p {{ repo_manager_output_path | dirname }}
    cp input/project_default/repo_manager_output/repo_status.yml {{ repo_manager_output_path }}
  Then verify: omnia-cli repo-manager
functional_group_packages_not_found_fail_msg: >-
  functional_group_packages.yml not found at {{ package_list_path | default('unknown') }}.
  This file defines the RPM packages for each functional group.
  Check repo_manager.package_list in {{ repo_manager_output_path }}
  or copy the sample file to {{ repo_manager_output_path | dirname }}/.
repo_cert_not_found_fail_msg: >-
  Repo manager certificate not found at {{ repo_manager.certificates.server_crt | default('unknown') }}.
  Ensure repo_manager has been run and the certificate exists on this host.
repo_status_missing_section_fail_msg: >-
  repo_status.yml is missing required 'repo_manager' section.
  Ensure repo_manager.port and repo_manager.package_list are present
  in {{ repo_manager_output_path }}. Certificates are optional.
image_build_config_not_found_fail_msg: >-
  image_build_config.yml not found at {{ input_project_dir }}/image_build_config.yml.
  This file is required. See docs/contracts/input-contract.md for the expected format.
