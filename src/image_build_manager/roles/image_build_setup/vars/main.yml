---
# ============================================================================
# image_build_setup — Role Variables
# ============================================================================
# All user-facing error messages are defined here (not inline in tasks).
# See docs/code-style/ for naming and message conventions.
# --- Common vars (inlined from common/vars/common_vars.yml) ---
clone_retry: "5"
clone_delay: "10"
fail_retry: "5"
fail_delay: "10"
dir_permissions_755: "0755"
file_permissions_755: "0755"
file_permissions_644: "0644"
file_permissions_600: "0600"
file_permissions_400: "0400"
# --- Tag validation ---
supported_tags:
  - precheck
  - validate
  - credentials
  - prepare
  - execute
  - build
  - cleanup
  - cleanup_images
  - upgrade
  - rollback
skip_credential_tags:
  - precheck
  - cleanup
  - cleanup_images
  - validate
# Tags that require repo_status.yml (build-related operations)
build_related_tags:
  - build
  - execute
  - x86_64
  - aarch64
invalid_tag_combinations:
  - [prepare, cleanup]
  - [build, cleanup]
  - [execute, cleanup]
  - [prepare, upgrade]
  - [build, upgrade]
  - [execute, upgrade]
  - [cleanup, upgrade]
  - [prepare, rollback]
  - [build, rollback]
  - [execute, rollback]
  - [cleanup, rollback]
  - [upgrade, rollback]
  - [prepare, cleanup_images]
  - [build, cleanup_images]
  - [execute, cleanup_images]
  - [cleanup, cleanup_images]
  - [upgrade, cleanup_images]
  - [rollback, cleanup_images]
  - [precheck, prepare]
  - [precheck, build]
  - [precheck, execute]
  - [precheck, cleanup]
  - [precheck, cleanup_images]
  - [precheck, upgrade]
  - [precheck, rollback]
  - [credentials, prepare]
  - [credentials, build]
  - [credentials, execute]
  - [credentials, cleanup]
  - [credentials, cleanup_images]
  - [credentials, upgrade]
  - [credentials, rollback]
  - [credentials, precheck]
# --- Tag validation messages ---
tag_validation_fail_msg: |
  Invalid tag usage detected.
  Supported tags: {{ supported_tags | join(', ') }}
  Invalid tags provided: {{ invalid_tags | join(', ') }}
  Please use only supported tags.
tag_combination_fail_msg: |
  Invalid tag combination detected: {{ ansible_run_tags | join(', ') }}
  The following tag combinations are not allowed:
  {% for combo in invalid_tag_combinations %}
  - {{ combo | join(' + ') }}
  {% endfor %}
  Please run with only ONE tag at a time (or no tags for default flow).
# --- Config validation messages ---
env_admin_nic_ip_missing_fail_msg: >-
  SYSTEM_ADMIN_NIC_IPV4 is not set. Export it before running:
    export SYSTEM_ADMIN_NIC_IPV4=<your_admin_nic_ip>
# --- Prerequisite validation messages ---
project_dir_not_exist_fail_msg: >-
  The project directory at {{ input_project_dir }} does not exist.
  Please ensure the directory exists before re-running the playbook.
repo_status_not_found_fail_msg: >-
  repo_status.yml not found at {{ repo_manager_output_path }}.
  Run repo_manager first, or copy the sample file:
    mkdir -p {{ repo_manager_output_path | dirname }}
    cp input/project_default/repo_manager_output/repo_status.yml {{ repo_manager_output_path }}
  Then verify: omnia-cli repo-manager
functional_group_packages_not_found_fail_msg: >-
  functional_group_packages.yml not found at {{ package_list_path | default('unknown') }}.
  This file defines the RPM packages for each functional group.
  Run repo_manager first, or switch to catalog mode by setting
  functional_groups_source to 'catalog' in image_build_config.yml.
package_groups_not_found_fail_msg: >-
  package_groups.yml not found at {{ input_project_dir }}/package_groups.yml.
  This file defines the RPM packages for each functional group in config mode.
  Create this file manually or switch to catalog mode by setting
  functional_groups_source to 'catalog' in image_build_config.yml.
catalog_env_not_set_fail_msg: >-
  CATALOG_FILE_PATH environment variable is not set.
  When functional_groups_source is 'catalog', set CATALOG_FILE_PATH
  in omnia.env (e.g., {{ omnia_data_path }}/catalog/catalog_rhel.json).
catalog_not_found_fail_msg: >-
  Catalog file not found at {{ catalog_file | default('unknown') }}.
  When functional_groups_source is 'catalog', the catalog JSON must exist.
  Run repo_manager to generate it, or set functional_groups_source to 'config'
  and use package_groups.yml instead.
repo_cert_not_found_fail_msg: >-
  Repo manager certificate not found at {{ _cert_path | default('unknown') }}.
  This path is derived from repo_manager.certificates.server_crt in repo_status.yml.
  Ensure the certificate exists, or remove the repo_manager.certificates section
  from repo_status.yml to skip certificate mounting.
repo_status_missing_section_fail_msg: >-
  repo_status.yml is missing required sections.
  Ensure 'repositories' dict and 'cluster_os_type' are present
  in {{ repo_manager_output_path }}.
image_build_config_not_found_fail_msg: >-
  image_build_config.yml not found at {{ input_project_dir }}/image_build_config.yml.
  This file is required. See docs/contracts/input-contract.md for the expected format.
repo_url_unreachable_fail_msg: >-
  One or more repo URLs from repo_status.yml are unreachable.
  Unreachable URLs: {{ _unreachable_repos | default([]) | join(', ') }}.
  Verify that repo_manager is running and the repo URLs are accessible from this host.
