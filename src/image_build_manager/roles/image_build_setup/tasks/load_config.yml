---
# Step 2: Load configuration from environment variables
# Step 3: Set project dirs and host vars
#
# Reads omnia.env environment variables instead of config.yml.
# Required env vars: OMNIA_DATA_PATH, OMNIA_ADMIN_NIC_IP, OMNIA_HOSTNAME, OMNIA_DOMAIN_NAME
# Optional env vars: OMNIA_PROJECT_NAME

# --- Resolve domain root directory (works from any playbook location) ---
- name: Set domain root directory
  ansible.builtin.set_fact:
    _domain_root_dir: "{{ playbook_dir | regex_replace('/playbooks.*$', '') }}"
    cacheable: true

# --- Source omnia.env if present ---
- name: Check for omnia.env
  ansible.builtin.stat:
    path: "{{ _domain_root_dir }}/../main/omnia.env"
  register: _omnia_env_file

- name: Source omnia.env defaults (if present and env vars not already set)
  ansible.builtin.shell: |
    set -a
    . "{{ _domain_root_dir }}/../main/omnia.env"
    set +a
    echo "OMNIA_DATA_PATH=${OMNIA_DATA_PATH}"
    echo "OMNIA_PROJECT_NAME=${OMNIA_PROJECT_NAME}"
    echo "OMNIA_ADMIN_NIC_IP=${OMNIA_ADMIN_NIC_IP}"
    echo "OMNIA_HOSTNAME=${OMNIA_HOSTNAME}"
    echo "OMNIA_DOMAIN_NAME=${OMNIA_DOMAIN_NAME}"
    echo "OMNIA_VENV_PATH=${OMNIA_VENV_PATH}"
  register: _env_output
  changed_when: false
  when: _omnia_env_file.stat.exists

- name: Parse sourced environment variables
  ansible.builtin.set_fact:
    _env_vars: "{{ _env_vars | default({}) | combine({item.split('=', 1)[0]: item.split('=', 1)[1]}) }}"
  loop: "{{ (_env_output.stdout_lines | default([])) }}"
  when: "'=' in item"
  no_log: true

# --- Resolve and validate configuration (single set_fact) ---
- name: Resolve configuration from environment
  ansible.builtin.set_fact:
    omnia_data_path: "{{ lookup('env', 'OMNIA_DATA_PATH') | default(_env_vars.OMNIA_DATA_PATH | default('/opt/omnia'), true) }}"
    project_name: "{{ lookup('env', 'OMNIA_PROJECT_NAME') | default(_env_vars.OMNIA_PROJECT_NAME | default('project_default'), true) }}"
    admin_nic_ip: "{{ lookup('env', 'OMNIA_ADMIN_NIC_IP') | default(_env_vars.OMNIA_ADMIN_NIC_IP | default('172.16.107.254'), true) }}"
    host_name: "{{ lookup('env', 'OMNIA_HOSTNAME') | default(_env_vars.OMNIA_HOSTNAME | default('oim'), true) }}"
    domain_name: "{{ lookup('env', 'OMNIA_DOMAIN_NAME') | default(_env_vars.OMNIA_DOMAIN_NAME | default('omnia.cluster'), true) }}"
    cacheable: true

# --- Validate required variables ---
- name: Fail if OMNIA_ADMIN_NIC_IP is not set
  ansible.builtin.fail:
    msg: >-
      OMNIA_ADMIN_NIC_IP is not set. Set it in omnia.env or export it:
        export OMNIA_ADMIN_NIC_IP=<your_admin_nic_ip>
  when: admin_nic_ip | length == 0

- name: Fail if OMNIA_HOSTNAME is not set
  ansible.builtin.fail:
    msg: >-
      OMNIA_HOSTNAME is not set. Set it in omnia.env or export it:
        export OMNIA_HOSTNAME=oim
  when: host_name | length == 0

- name: Fail if OMNIA_DOMAIN_NAME is not set
  ansible.builtin.fail:
    msg: >-
      OMNIA_DOMAIN_NAME is not set. Set it in omnia.env or export it:
        export OMNIA_DOMAIN_NAME=omnia.cluster
  when: domain_name | length == 0

- name: Validate configured environment
  ansible.builtin.debug:
    msg:
      - "OMNIA_HOSTNAME: {{ host_name }}"
      - "OMNIA_DOMAIN_NAME: {{ domain_name }}"
      - "OMNIA_ADMIN_NIC_IP: {{ admin_nic_ip }}"
      - "OMNIA_DATA_PATH: {{ omnia_data_path }}"
      - "OMNIA_PROJECT_NAME: {{ project_name }}"

# --- Set all derived paths in a single set_fact ---
- name: Set project dirs and derived paths
  vars:
    _ibm_path: "{{ lookup('env', 'IMAGE_BUILD_MANAGER_DATA_PATH') | default(omnia_data_path + '/image_build_manager', true) }}"
  ansible.builtin.set_fact:
    input_project_dir: "{{ _domain_root_dir }}/input/{{ project_name }}"
    output_project_dir: "{{ _ibm_path }}/output/{{ project_name }}"
    log_dir: "{{ _ibm_path }}/log/{{ project_name }}"
    shared_path: "{{ _ibm_path }}"
    oim_node_name: "{{ host_name }}"
    functional_groups_config_path: "{{ _ibm_path }}/output/{{ project_name }}/.data/functional_groups_config.yml"
    standalone_mode: true
    cacheable: true

- name: Verify project input directory exists
  ansible.builtin.stat:
    path: "{{ input_project_dir }}"
  register: _project_dir_check

- name: Fail if project input directory does not exist
  ansible.builtin.fail:
    msg: "{{ project_dir_not_exist_fail_msg }}"
  when: not _project_dir_check.stat.exists

# --- Create runtime directories ---
- name: Ensure base /opt/omnia directory exists
  ansible.builtin.file:
    path: "{{ omnia_data_path }}"
    state: directory
    mode: '0755'
  become: true

- name: Ensure domain-specific directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ shared_path }}"
    - "{{ output_project_dir }}"
    - "{{ log_dir }}"
    - "{{ shared_path }}/log/playbooks"
    - "{{ shared_path }}/s3"
    - "{{ shared_path }}/registry"
    - "{{ shared_path }}/oci"
    - "{{ shared_path }}/workdir"
  become: true

- name: Validate domain directories were created
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ omnia_data_path }}"
    - "{{ shared_path }}"
    - "{{ output_project_dir }}"
    - "{{ log_dir }}"
  register: _dir_checks

- name: Fail if any required directory is missing
  ansible.builtin.fail:
    msg: "Required directory does not exist: {{ item.item }}"
  when: not item.stat.exists
  loop: "{{ _dir_checks.results }}"
