---
# Step 4: Validate all prerequisite files (fail-fast)
#
# Loads image_build_config.yml to discover repo_manager_output_path,
# then checks that the repo_status.yml file exists.
# functional_group_packages.yml path is resolved from repo_manager.package_list
# inside repo_status.yml (validated in load_repo_status.yml).

- name: Load image_build_config.yml to get repo_manager_output_path
  ansible.builtin.include_vars:
    file: "{{ input_project_dir }}/image_build_config.yml"

- name: Set build config facts from config (single source of truth)
  ansible.builtin.set_fact:
    build_image_job_async: "{{ build_image.job_async | default(7200) }}"
    build_image_job_retry: "{{ build_image.job_retry | default(240) }}"
    build_image_job_delay: "{{ build_image.job_delay | default(30) }}"
    build_image_max_parallel: "{{ build_image.max_parallel | default(0) }}"
    functional_groups_source: "{{ functional_groups_source | default('config') }}"
    image_build_type: "{{ image_build_type | default('image-builder') }}"
    cacheable: true
  when: build_image is defined

- name: Stat prerequisite files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ input_project_dir }}/image_build_config.yml"
    - "{{ repo_manager_output_path }}"
  register: _prereq_checks

- name: Fail if image_build_config.yml not found
  ansible.builtin.fail:
    msg: "{{ image_build_config_not_found_fail_msg }}"
  when: not _prereq_checks.results[0].stat.exists

- name: Fail if repo_status.yml not found
  ansible.builtin.fail:
    msg: "{{ repo_status_not_found_fail_msg }}"
  when: not _prereq_checks.results[1].stat.exists
