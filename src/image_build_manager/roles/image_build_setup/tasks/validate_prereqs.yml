---
# Step 4: Validate prerequisite files (fail-fast)
#
# Always validates: image_build_config.yml exists.
# Build-related tags only (needs_repo_status=true): validates repo_status.yml
# and mode-specific package files (package_groups.yml or catalog file).
# Dual-mode: "config" checks package_groups.yml, "catalog" checks CATALOG_FILE_PATH env var.

- name: Load image_build_config.yml to get repo_manager_output_path
  ansible.builtin.include_vars:
    file: "{{ input_project_dir }}/image_build_config.yml"

- name: Set build config facts from config (single source of truth)
  ansible.builtin.set_fact:
    build_image_build_timeout: "{{ build_image.build_timeout | default(build_image.job_async | default(7200)) }}"
    build_image_max_parallel: "{{ build_image.max_parallel | default(0) }}"
    build_image_force_rebuild: "{{ build_image.force_rebuild | default(false) | bool }}"
    build_image_backup_s3_images: "{{ build_image.backup_s3_images | default(false) | bool }}"
    repo_ssl_verify: "{{ build_image.repo_ssl_verify | default(true) | bool }}"
    functional_groups_source: "{{ functional_groups_source | default('config') }}"
    image_build_type: "{{ image_build_type | default('image-builder') }}"
    catalog_file: "{{ lookup('ansible.builtin.env', 'CATALOG_FILE_PATH') | default('', true) }}"
    cacheable: true
  when: build_image is defined

- name: Stat image_build_config.yml
  ansible.builtin.stat:
    path: "{{ input_project_dir }}/image_build_config.yml"
  register: _config_check

- name: Fail if image_build_config.yml not found
  ansible.builtin.fail:
    msg: "{{ image_build_config_not_found_fail_msg }}"
  when: not _config_check.stat.exists

# --- repo_status.yml and package validation (build-related tags only) ---
- name: Validate build prerequisites (repo_status and packages)
  when: needs_repo_status | bool
  block:
    - name: Stat repo_status.yml
      ansible.builtin.stat:
        path: "{{ repo_manager_output_path }}"
      register: _repo_status_check

    - name: Fail if repo_status.yml not found
      ansible.builtin.fail:
        msg: "{{ repo_status_not_found_fail_msg }}"
      when: not _repo_status_check.stat.exists

    # --- Dual-mode package source validation ---
    - name: Validate package_groups.yml exists (config mode)
      when: functional_groups_source == 'config'
      block:
        - name: Stat package_groups.yml in project directory
          ansible.builtin.stat:
            path: "{{ input_project_dir }}/package_groups.yml"
          register: _pkg_groups_check

        - name: Fail if package_groups.yml not found
          ansible.builtin.fail:
            msg: "{{ package_groups_not_found_fail_msg }}"
          when: not _pkg_groups_check.stat.exists

    - name: Validate catalog file exists (catalog mode)
      when: functional_groups_source == 'catalog'
      block:
        - name: Fail if CATALOG_FILE_PATH env var is not set
          ansible.builtin.fail:
            msg: "{{ catalog_env_not_set_fail_msg }}"
          when: catalog_file | length == 0

        - name: Stat catalog file
          ansible.builtin.stat:
            path: "{{ catalog_file }}"
          register: _catalog_check

        - name: Fail if catalog file not found
          ansible.builtin.fail:
            msg: "{{ catalog_not_found_fail_msg }}"
          when: not _catalog_check.stat.exists
