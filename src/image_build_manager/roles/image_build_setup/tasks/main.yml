---
# image_build_setup — Self-contained setup for image_build_manager.
#
# Task files:
#   validate_tags.yml      — Step 1: Validate tags, tag combinations, set needs_repo_status
#   load_config.yml        — Step 2-3: Load config.yml, validate host, set dirs
#   validate_prereqs.yml   — Step 4: Validate prerequisite files (repo_status only for build tags)
#   load_repo_status.yml   — Step 5-6: Load repo_status.yml, build repo lists, validate repo URLs
#   main.yml (this file)   — Step 7: Set guard facts
#
# repo_status.yml is only required for build-related tags (build, execute, or default flow).
# The prepare tag deploys MinIO + Registry and does not need repo_status.yml.

- name: Include tag validation
  ansible.builtin.include_tasks: validate_tags.yml

- name: Include config loading and host validation
  ansible.builtin.include_tasks: load_config.yml

- name: Include prerequisite file validation
  ansible.builtin.include_tasks: validate_prereqs.yml
  when:
    - "'cleanup' not in (provided_tags | default([]))"
    - "'precheck' not in (provided_tags | default([]))"

- name: Include repo_status loading and repo list building
  ansible.builtin.include_tasks: load_repo_status.yml
  when:
    - "'cleanup' not in (provided_tags | default([]))"
    - "'precheck' not in (provided_tags | default([]))"
    - needs_repo_status | default(false) | bool

# =========================================================================
# Step 7: Set guard facts
# =========================================================================
- name: Display loaded configuration
  ansible.builtin.debug:
    msg:
      - "Project: {{ project_name }}"
      - "Host: {{ host_name }}.{{ domain_name }} ({{ admin_nic_ip }})"
      - "Shared path: {{ shared_path }}"
      - "Output dir: {{ output_project_dir }}"
      - "Log dir: {{ log_dir }}"
      - "Repo manager output: {{ repo_manager_output_path | default('(skipped for cleanup)') }}"
      - "Package source: {{ functional_groups_source | default('config') }}"
      - "Catalog file: {{ catalog_file | default('(not set)') }}"
      - "Repo cert: {{ repo_cert_path | default('(skipped for cleanup)') }}"
      - "Image build type: {{ image_build_type | default('image-builder') }}"
      - "Max parallel: {{ build_image_max_parallel | default(0) }}"
      - "x86_64 repos: {{ repo_manager_repos_x86_64 | default([]) | length }}"
      - "aarch64 repos: {{ repo_manager_repos_aarch64 | default([]) | length }}"
    verbosity: 1

- name: Set image_build_manager guard facts
  ansible.builtin.set_fact:
    image_build_main_flow: true
    skip_subscription_check: true
    image_build_setup_done: true
    cacheable: true
