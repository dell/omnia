---
# Step 5: Load repo_status.yml and validate via Python module
# Step 6: Set repo facts and build repo lists
#
# Uses plugins/modules/parse_repo_status.py for repo_status.yml parsing,
# port extraction, and repo list building. Validates repo manager certificate
# (derived from repo_status.yml) and sets S3 endpoint facts.

# --- Parse repo_status.yml via Python module ---
- name: Parse repo_status.yml via module
  parse_repo_status:
    repo_status_file: "{{ repo_manager_output_path }}"
  register: _repo_status_result

# --- Set OS and repo facts from module output ---
- name: Set OS and repo facts from parsed repo_status
  ansible.builtin.set_fact:
    cluster_os_type: "{{ _repo_status_result.cluster_os_type }}"
    cluster_os_version: "{{ _repo_status_result.cluster_os_version }}"
    repo_port: "{{ _repo_status_result.repo_port }}"
    repo_manager_repos_x86_64: "{{ _repo_status_result.repo_manager_repos_x86_64 }}"
    repo_manager_repos_aarch64: "{{ _repo_status_result.repo_manager_repos_aarch64 }}"
    cacheable: true

# --- Validate repo manager certificate (derived from repo_status.yml) ---
- name: Set cert path fact from repo_status
  ansible.builtin.set_fact:
    _cert_path: "{{ _repo_status_result.repo_cert_path | default('') }}"

- name: Validate repo manager certificate exists
  ansible.builtin.stat:
    path: "{{ _cert_path }}"
  register: _repo_cert_check
  when: _cert_path | length > 0

- name: Fail if repo manager certificate not found
  ansible.builtin.fail:
    msg: "{{ repo_cert_not_found_fail_msg }}"
  when:
    - _cert_path | length > 0
    - not (_repo_cert_check.stat.exists | default(false))

# --- Validate repo URLs are reachable ---
- name: Build list of repo base URLs to validate
  ansible.builtin.set_fact:
    _repo_urls_to_check: >-
      {{ (repo_manager_repos_x86_64 | default([]) | map(attribute='base_url') | list
          + repo_manager_repos_aarch64 | default([]) | map(attribute='base_url') | list)
         | unique }}

- name: Check repo URL reachability
  ansible.builtin.uri:
    url: "{{ item }}"
    method: GET
    status_code: [200, 301, 302, 403]
    timeout: 10
    validate_certs: false
  loop: "{{ _repo_urls_to_check }}"
  register: _repo_url_checks
  ignore_errors: true

- name: Identify unreachable repo URLs
  ansible.builtin.set_fact:
    _unreachable_repos: >-
      {{ _repo_url_checks.results
         | selectattr('failed', 'defined')
         | selectattr('failed')
         | map(attribute='item')
         | list }}

- name: Fail if any repo URLs are unreachable
  ansible.builtin.fail:
    msg: "{{ repo_url_unreachable_fail_msg }}"
  when: _unreachable_repos | length > 0

# --- Set S3 and cert facts ---
- name: Set S3 and cert facts
  ansible.builtin.set_fact:
    repo_cert_path: "{{ _cert_path }}"
    s3_endpoint: >-
      {{ s3_configurations.endpoint_url
         if s3_configurations.endpoint_url | default('') | length > 0
         else ('http://' + admin_nic_ip + ':9000'
               if s3_configurations.provider | default('minio') == 'minio'
               else '') }}
    cacheable: true
