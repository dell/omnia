---
# Load image_build_config.yml as literal data (yaml.safe_load), reject Jinja
# delimiters, then publish each top-level key as a fact (same variable names
# that include_vars produced).
#
# Caller options:
#   image_build_config_file_required: fail when the file is missing (default true)
#   image_build_config_ignore_errors: warn and continue on a missing, invalid or
#                                     unsafe file; replaces failed_when: false (default false)
- name: Parse and validate image_build_config.yml
  load_validated_yaml:
    path: "{{ input_project_dir }}/image_build_config.yml"
    required: >-
      {{ (image_build_config_file_required | default(true) | bool)
         and not (image_build_config_ignore_errors | default(false) | bool) }}
  register: _image_build_config_load
  failed_when: false

- name: Reject unsafe or invalid image_build_config.yml
  ansible.builtin.fail:
    msg: >-
      {{ image_build_config_invalid_msg }}
      Error code: {{ _image_build_config_load.error_code }}.
      Location: {{ _image_build_config_load.error_location | default('$') }}.
  when:
    - _image_build_config_load.error_code is defined
    - not (image_build_config_ignore_errors | default(false) | bool)

- name: Warn that image_build_config.yml was not loaded
  ansible.builtin.debug:
    msg: >-
      {{ image_build_config_invalid_msg }}
      Error code: {{ _image_build_config_load.error_code }}.
      Continuing without values from this file.
  when:
    - _image_build_config_load.error_code is defined
    - image_build_config_ignore_errors | default(false) | bool

# repo_manager_output_path: validate_prereqs.yml replaces an empty value with
# the default path. Do not overwrite that default with the empty value again.
- name: Publish validated image_build_config.yml keys
  ansible.builtin.set_fact:
    "{{ item.key }}": "{{ item.value }}"
  loop: "{{ _image_build_config_load.data | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - _image_build_config_load.error_code is not defined
    - not (item.key == 'repo_manager_output_path'
           and (item.value | default('', true) | length) == 0
           and repo_manager_output_path is defined)
