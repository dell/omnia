---
# validate_aarch64_host.yml — Dynamically create admin_aarch64 inventory group
# from aarch64_inventory_host_ip in image_build_config.yml.
# All validation (IP format, reserved IPs, cross-field logic) is handled by
# Python modules: L1 JSON schema + L2 validator in image_build_config_validator.py.

- name: Check if aarch64 IP is configured
  ansible.builtin.set_fact:
    aarch64_build_enabled: >-
      {{ (aarch64_inventory_host_ip | default('') | length > 0) | bool }}
    cacheable: true

- name: Skip aarch64 group creation if IP not configured
  ansible.builtin.debug:
    msg: "aarch64_inventory_host_ip is not set — aarch64 image build will be skipped."
  when: not (aarch64_build_enabled | bool)

# ---  Check SSH connectivity ---
- name: Check SSH connectivity to aarch64 build host
  when: aarch64_build_enabled | bool
  ansible.builtin.command: >-
    ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no
    {{ aarch64_ssh_user | default('root') }}@{{ aarch64_inventory_host_ip }} 'echo OK'
  register: aarch64_ssh_check
  changed_when: false
  failed_when: false

- name: Set SSH passwordless status
  when: aarch64_build_enabled | bool
  ansible.builtin.set_fact:
    aarch64_ssh_passwordless: "{{ (aarch64_ssh_check.rc | default(1) == 0) | bool }}"
    cacheable: true

- name: Warn if SSH passwordless access not yet configured
  when:
    - aarch64_build_enabled | bool
    - not (aarch64_ssh_passwordless | bool)
  ansible.builtin.debug:
    msg: >
      SSH passwordless access to {{ aarch64_inventory_host_ip }} is not yet configured.
      The prepare_aarch64_node role will attempt ssh-copy-id using aarch64_ssh_password.

# --- 6. Dynamically create admin_aarch64 inventory group ---
- name: Add aarch64 host to admin_aarch64 group dynamically
  when: aarch64_build_enabled | bool
  ansible.builtin.add_host:
    name: "{{ aarch64_inventory_host_ip }}"
    groups: admin_aarch64
    ansible_user: "{{ aarch64_ssh_user | default('root') }}"

- name: Confirm admin_aarch64 group created
  when: aarch64_build_enabled | bool
  ansible.builtin.debug:
    msg: "admin_aarch64 group created with host {{ aarch64_inventory_host_ip }}"
