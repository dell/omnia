---
# validate_aarch64_host.yml — Validate aarch64 build host and create dynamic
# inventory group. This file does VALIDATION ONLY — no SSH setup.
#
# Checks performed:
#   1. Is aarch64_inventory_host_ip configured?
#   2. Is the host reachable (ping)?
#   3. Create admin_aarch64 dynamic inventory group
#
# SSH setup (keygen, known_hosts, ssh-copy-id) is handled separately by
# prepare_aarch64_node/tasks/setup_ssh.yml, called from a localhost play
# in the playbook BEFORE the hosts: admin_aarch64 play.

# --- 1. Check if aarch64 IP is configured ---
- name: Check if aarch64 IP is configured
  ansible.builtin.set_fact:
    aarch64_build_enabled: >-
      {{ (aarch64_inventory_host_ip | default('') | length > 0) | bool }}
    cacheable: true

- name: Skip aarch64 validation if IP not configured
  ansible.builtin.debug:
    msg: "aarch64_inventory_host_ip is not set — aarch64 image build will be skipped."
  when: not (aarch64_build_enabled | bool)

# --- 2. Ping check — verify host is reachable ---
- name: Ping aarch64 build host
  when: aarch64_build_enabled | bool
  ansible.builtin.command: >-
    ping -c 2 -W 3 {{ aarch64_inventory_host_ip }}
  register: _aarch64_ping
  changed_when: false
  failed_when: false

- name: Fail if aarch64 build host is unreachable
  when:
    - aarch64_build_enabled | bool
    - _aarch64_ping.rc | default(1) != 0
  ansible.builtin.fail:
    msg: >
      Cannot reach aarch64 build host at {{ aarch64_inventory_host_ip }}.
      Verify the IP is correct and the host is powered on and network-reachable.
      Ping stderr: {{ _aarch64_ping.stderr | default('no output') }}

- name: Display aarch64 host reachability
  when: aarch64_build_enabled | bool
  ansible.builtin.debug:
    msg: "aarch64 host {{ aarch64_inventory_host_ip }} is reachable (ping OK)"

# --- 3. Dynamically create admin_aarch64 inventory group ---
- name: Add aarch64 host to admin_aarch64 group dynamically
  when: aarch64_build_enabled | bool
  ansible.builtin.add_host:
    name: "{{ aarch64_inventory_host_ip }}"
    groups: admin_aarch64
    ansible_user: "{{ aarch64_ssh_user | default('root') }}"

- name: Confirm admin_aarch64 group created
  when: aarch64_build_enabled | bool
  ansible.builtin.debug:
    msg: "admin_aarch64 group created with host {{ aarch64_inventory_host_ip }}"
