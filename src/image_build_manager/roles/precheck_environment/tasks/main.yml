---
# precheck_environment — Main task file
#
# NOTE: This role runs AFTER image_build_setup (tags: always), so the
# env var facts (admin_nic_ip, host_name, domain_name, omnia_data_path,
# project_name, omnia_version) are already loaded by load_config.yml.
#
# image_build_setup only validates env vars are SET (via the module with
# validate_hostname/ip/domain/paths=false). This role enables the FULL
# cross-validation: hostname -s, hostname -d, IP on NIC, data path.
#
# Responsibilities (unique to precheck, NOT in image_build_setup):
#   1. omnia.sh setup completed (system env file exists)
#   2. Full system cross-validation via validate_system_environment module
#      (hostname -s, hostname -d, hostname -I, data path)
#   3. repo_status.yml is accessible
#   4. Print precheck summary

# =========================================================================
# Step 1: Verify omnia.sh has been run (system env file exists)
# =========================================================================
- name: Check if omnia.env is installed system-wide
  ansible.builtin.stat:
    path: "{{ system_env_file }}"
  register: _omnia_env_check

- name: Warn if omnia.env is not installed system-wide
  ansible.builtin.debug:
    msg: "{{ precheck_omnia_env_not_installed_msg }}"
  when: not _omnia_env_check.stat.exists

# =========================================================================
# Step 2: Cross-validate system environment via module
# =========================================================================
# The module checks: hostname -s vs SYSTEM_HOSTNAME,
# hostname -d vs SYSTEM_DOMAIN_NAME, IP on NIC, data path exists.
# load_config.yml already checked env vars are SET but did NOT
# cross-validate against the system — that is this role's job.
- name: Cross-validate system environment
  validate_system_environment:
    required_vars: []
    validate_hostname: true
    validate_domain: true
    validate_ip: true
    validate_paths: true
  register: _sys_validation

# =========================================================================
# Step 3: Check repo_status.yml is accessible
# =========================================================================
- name: Set repo_status path for precheck
  ansible.builtin.set_fact:
    _precheck_repo_status_path: >-
      {{ omnia_data_path }}/repo_manager/output/{{ project_name }}/repo_status.yml

- name: Check repo_status.yml exists
  ansible.builtin.stat:
    path: "{{ _precheck_repo_status_path }}"
  register: _repo_status_check

- name: Warn if repo_status.yml is missing
  ansible.builtin.debug:
    msg: "{{ precheck_repo_status_missing_msg }}"
  when: not _repo_status_check.stat.exists

# =========================================================================
# Step 4: Print precheck summary
# =========================================================================
- name: Build per-check summary lines
  ansible.builtin.set_fact:
    _check_lines: >-
      {{ _sys_validation.checks | default([]) |
         map(attribute='message') | list }}

- name: Precheck summary
  ansible.builtin.debug:
    msg:
      - "============================================"
      - "  PRECHECK SUMMARY"
      - "============================================"
      - "  omnia.env installed:    {{ _omnia_env_check.stat.exists | ternary('YES', 'NO (warning)') }}"
      - "  SYSTEM_ADMIN_NIC_IPV4:  {{ admin_nic_ip }}"
      - "  SYSTEM_HOSTNAME:        {{ host_name }}"
      - "  SYSTEM_DOMAIN_NAME:     {{ domain_name }}"
      - "  OMNIA_DATA_PATH:        {{ omnia_data_path }}"
      - "  OMNIA_PROJECT_NAME:     {{ project_name }}"
      - "  OMNIA_VERSION:          {{ omnia_version }}"
      - "  FQDN:                   {{ host_name }}.{{ domain_name }}"
      - "  repo_status.yml:        {{ _repo_status_check.stat.exists | ternary('present', 'MISSING (warning)') }}"
      - "  ─── Module checks ───"
      - "{{ _check_lines | join('\n  ') }}"
      - "============================================"
      - "  Result: PASS"
      - "============================================"
