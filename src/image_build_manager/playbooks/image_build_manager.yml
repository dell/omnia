---
# image_build_manager.yml — Top-level entry point for the image_build_manager domain.
# Reads repo_status.yml from repo_manager output for repo URLs.
# Deploys MinIO + Registry, then builds OS images for x86_64 and aarch64.
#
# Usage (run ONE tag at a time — no comma-separated tags):
#   cd src/image_build_manager/playbooks
#   ansible-playbook image_build_manager.yml                        # Default: prepare + build
#   ansible-playbook image_build_manager.yml --tags precheck        # Env + connectivity precheck only
#   ansible-playbook image_build_manager.yml --tags validate        # Validate config only (no credentials)
#   ansible-playbook image_build_manager.yml --tags prepare         # Deploy MinIO + Registry only
#   ansible-playbook image_build_manager.yml --tags execute         # Build images (alias for build)
#   ansible-playbook image_build_manager.yml --tags build           # Build images only (skip prepare)
#   ansible-playbook image_build_manager.yml --tags cleanup         # Cleanup (no credentials)
#   ansible-playbook image_build_manager.yml --tags upgrade         # Upgrade flow (placeholder)
#   ansible-playbook image_build_manager.yml --tags rollback        # Rollback flow (placeholder)
#
# Tags (mutually exclusive — pick ONE):
#   (none)    — Default flow: always + prepare + build (with credentials)
#   precheck  — Environment precheck (env vars, connectivity) — no credentials
#   validate  — Validate configuration only (skips credentials)
#   prepare   — Deploy MinIO + Registry (with credentials)
#   execute   — Build OS images (alias for 'build') (with credentials)
#   build     — Build OS images (x86_64 + aarch64) + write build_status (with credentials)
#   cleanup   — Remove MinIO, registry, build artifacts (skips credentials)
#   upgrade   — Upgrade flow (placeholder — future release)
#   rollback  — Rollback flow (placeholder — future release)
#
# Tag Validation:
#   - Invalid tags will fail with error message
#   - Invalid combinations (e.g., prepare + cleanup) will fail
#   - precheck, cleanup, and validate tags skip credential prompting
#
# Internal steps (always):
#   Step 0: Setup — load env vars (omnia.env), validate host, check prereqs, load repo_status.yml
#   Step 1: Input validation (schema + logic)
#   Step 2: Credential collection (skipped for precheck/cleanup/validate tags)

# =========================================================================
# Step 0: Setup — load config, validate host, check prereqs, load repos
# =========================================================================
- name: Image build manager setup
  hosts: localhost
  connection: local
  gather_facts: false
  tags: always
  roles:
    - image_build_setup

# =========================================================================
# Step 1: Input validation (schema + logic)
# =========================================================================
- name: Validate image build configuration
  ansible.builtin.import_playbook: validate/validate_image_build_config.yml
  tags:
    - always
    - validate

# =========================================================================
# Step 2: Credential collection (skipped for cleanup/validate)
# =========================================================================
- name: Get build credentials
  ansible.builtin.import_playbook: credentials/get_build_credentials.yml
  when: not (skip_build_credentials | default(false) | bool)
  tags: always

# =========================================================================
# FLOW: prepare — Deploy MinIO + Registry (idempotent)
# =========================================================================
- name: Prepare build infrastructure (MinIO + Registry)
  ansible.builtin.import_playbook: prepare/prepare_image_build_manager.yml
  tags:
    - prepare

# =========================================================================
# FLOW: build/execute — Build OS images and write build_status.yml
# =========================================================================
# Step 6: Build x86_64 images
- name: Build x86_64 images
  ansible.builtin.import_playbook: build/build_image_x86_64.yml
  tags:
    - x86_64
    - build
    - execute

# Step 7: Build aarch64 images
# NOTE: The aarch64 playbook has its own internal checks for ARM host availability.
- name: Build aarch64 images
  ansible.builtin.import_playbook: build/build_image_aarch64.yml
  when: hostvars['localhost']['aarch64_inventory_host_ip'] | default('') | length > 0
  tags:
    - aarch64
    - build
    - execute

# Step 8: Write build_status.yml output
# Output: {{ output_project_dir }}/build_status.yml (NFS-shared)
# Includes per-functional-group image details with S3 paths for kernel, initrd, image.
- name: Write build_status.yml output
  hosts: localhost
  connection: local
  gather_facts: true
  tags:
    - x86_64
    - aarch64
    - build
    - execute
  tasks:
    - name: Write build status
      ansible.builtin.include_role:
        name: build_os_images
        tasks_from: write_build_status.yml

# =========================================================================
# FLOW: cleanup — Remove MinIO, registry, build artifacts (opt-in only)
# =========================================================================
- name: Cleanup image_build_manager
  ansible.builtin.import_playbook: cleanup/cleanup_image_build_manager.yml
  tags:
    - never
    - cleanup

# =========================================================================
# FLOW: upgrade — Upgrade flow placeholder (opt-in only)
# =========================================================================
- name: Upgrade image_build_manager
  ansible.builtin.import_playbook: upgrade/upgrade_image_build_manager.yml
  tags:
    - never
    - upgrade

# =========================================================================
# FLOW: rollback — Rollback flow placeholder (opt-in only)
# =========================================================================
- name: Rollback image_build_manager
  ansible.builtin.import_playbook: rollback/rollback_image_build_manager.yml
  tags:
    - never
    - rollback
