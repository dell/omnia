---

- name: Standalone setup and set build architecture for aarch64
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Run image_build_setup role (standalone only)
      ansible.builtin.include_role:
        name: image_build_setup
      when: not (image_build_setup_done | default(false) | bool)

    - name: Run collect_build_credentials role (standalone only)
      ansible.builtin.include_role:
        name: collect_build_credentials
      when: not (image_build_setup_done | default(false) | bool)

    - name: Run input validation (standalone only)
      ansible.builtin.include_role:
        name: validate_image_build_input
      when: not (image_build_setup_done | default(false) | bool)

    - name: Set build architecture
      ansible.builtin.set_fact:
        build_arch: "aarch64"
        cacheable: true

# NOTE: repo_status.yml and repo lists are already loaded by image_build_setup role.
# This playbook only needs to reload image_build_config.yml for job_id.

- name: Load image_build_manager configuration for aarch64
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Load image_build_config.yml
      ansible.builtin.include_vars:
        file: "{{ input_project_dir }}/image_build_config.yml"

    - name: Set job_id from extra vars
      ansible.builtin.set_fact:
        job_id: "{{ job_id | default('') }}"
        cacheable: true

- name: Validate image_build_manager inputs for aarch64
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Run image_build_manager input validation
      ansible.builtin.include_role:
        name: validate_build_runtime

- name: Load aarch64 host config and create dynamic group
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Validate aarch64 host IP and create admin_aarch64 group
      ansible.builtin.include_role:
        name: validate_build_runtime
        tasks_from: validate_aarch64_host.yml

    - name: Fail if aarch64 build host not configured
      ansible.builtin.fail:
        msg: >
          aarch64_inventory_host_ip is not set in image_build_config.yml.
          Cannot proceed with aarch64 image build.
          Set aarch64_inventory_host_ip in:
            {{ input_project_dir }}/image_build_config.yml
      when: not (aarch64_build_enabled | default(false) | bool)

- name: Gather OIM data
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Include gather_oim_data role
      ansible.builtin.include_role:
        name: prepare_aarch64_node
        tasks_from: gather_oim_data.yml
        vars_from: main

- name: Generate and verify aarch64 functional groups
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    # --- Config mode: verify functional groups exist in package_groups.yml ---
    - name: Verify aarch64 functional groups (config mode)
      ansible.builtin.include_role:
        name: fetch_build_packages
        tasks_from: check_functional_group.yml
      when: hostvars['localhost']['functional_groups_source'] | default('config') == 'config'

    - name: Skip functional group check (catalog mode — groups come from catalog)
      ansible.builtin.debug:
        msg: "Catalog mode: functional groups will be resolved from catalog JSON"
      when: hostvars['localhost']['functional_groups_source'] | default('config') == 'catalog'

- name: Setup SSH connectivity to aarch64 node
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Setup passwordless SSH to aarch64 build host
      ansible.builtin.include_role:
        name: prepare_aarch64_node
        tasks_from: setup_ssh.yml
        vars_from: main

- name: Prepare aarch64 nodes
  hosts: admin_aarch64
  gather_facts: false
  roles:
    - prepare_aarch64_node

- name: Pre-flight SELinux policy fix on aarch64 node
  hosts: admin_aarch64
  connection: ssh
  gather_facts: false
  tasks:
    - name: Install SELinux policy module for container runtime
      ansible.builtin.include_role:
        name: build_os_images
        tasks_from: preflight_selinux_check.yml
      vars:
        build_arch: "{{ hostvars['localhost']['build_arch'] }}"

- name: Fetch packages for aarch64
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - fetch_build_packages

- name: Openchami build image for aarch64
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: build_os_images
      vars:
        build_arch: "{{ hostvars['localhost']['build_arch'] }}"
        s3_configurations: "{{ hostvars['localhost']['s3_configurations'] }}"

- name: Build aarch64 image completion
  hosts: localhost
  connection: local
  tasks:
    - name: Build Image completion
      ansible.builtin.include_role:
        name: fetch_build_packages
        tasks_from: build_image_completion.yml
