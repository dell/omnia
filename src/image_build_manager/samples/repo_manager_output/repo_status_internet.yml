# ============================================================================
# SAMPLE: repo_status_internet.yml — Internet-based repo URLs for testing
# ============================================================================
#
# USE CASE: Test image_build_manager independently without repo_manager.
#
# This file uses PUBLIC internet RPM repositories (CentOS Stream 10 + EPEL)
# so the image builder can resolve and install packages directly from the
# internet.  No Pulp, no repo_manager, no admin_nic_ip needed.
#
# SETUP:
#   1. Copy this file to the runtime location:
#      mkdir -p /opt/omnia/repo_manager/output/project_default
#      cp repo_status_internet.yml \
#         /opt/omnia/repo_manager/output/project_default/repo_status.yml
#
#   2. Ensure the OIM host (or image builder container) has internet access.
#
#   3. Set functional_groups_source to 'catalog' in image_build_config.yml
#      and set CATALOG_FILE_PATH in omnia.env to your test catalog JSON.
#
#   4. Run:  ansible-playbook image_build_manager.yml
#
# NOTE: CentOS Stream 10 repos are suitable for RHEL 10.x build-path testing and
#       are freely accessible without a subscription.  For production RHEL
#       deployments, use the subscription-based CDN URLs instead.
#
# PRIORITY:
#   The 'priority' field under each repo is OPTIONAL.
#   - When present  → used as-is (e.g., priority: 100).
#   - When absent   → the image builder defaults to 99.
#   Omitting priority is equivalent to writing priority: 99.
#   Repos produced by repo_manager may or may not include this field.
# ============================================================================

overall_status: "success"
cluster_os_type: "rhel"
repo_config: "partial"

execution_contexts:
  - context_id: "rhel_10.0"
    os_type: "rhel"
    os_version: "10.0"
    architectures: ["x86_64", "aarch64"]
  - context_id: "rhel_10.2"
    os_type: "rhel"
    os_version: "10.2"
    architectures: ["x86_64", "aarch64"]

overall_status_by_version:
  "10.0": "success"
  "10.2": "success"

repo_manager:
  port: ""
  certificates:
    server_crt: ""
    certs_dir: ""

repositories:
  "10.0":
    x86_64:
      baseos:
        url: "https://mirror.stream.centos.org/10-stream/BaseOS/x86_64/os/"
        priority: 100
      appstream:
        url: "https://mirror.stream.centos.org/10-stream/AppStream/x86_64/os/"
        priority: 100
      codeready-builder:
        url: "https://mirror.stream.centos.org/10-stream/CRB/x86_64/os/"
        priority: 100
      epel:
        url: "https://dl.fedoraproject.org/pub/epel/10/Everything/x86_64/"
        priority: 100

    aarch64:
      baseos:
        url: "https://mirror.stream.centos.org/10-stream/BaseOS/aarch64/os/"
        priority: 100
      appstream:
        url: "https://mirror.stream.centos.org/10-stream/AppStream/aarch64/os/"
        priority: 100
      codeready-builder:
        url: "https://mirror.stream.centos.org/10-stream/CRB/aarch64/os/"
        priority: 100
      epel:
        url: "https://dl.fedoraproject.org/pub/epel/10/Everything/aarch64/"
        priority: 100
  "10.2":
    x86_64:
      baseos:
        url: "https://mirror.stream.centos.org/10-stream/BaseOS/x86_64/os/"
        priority: 100
      appstream:
        url: "https://mirror.stream.centos.org/10-stream/AppStream/x86_64/os/"
        priority: 100
      codeready-builder:
        url: "https://mirror.stream.centos.org/10-stream/CRB/x86_64/os/"
        priority: 100
      epel:
        url: "https://dl.fedoraproject.org/pub/epel/10/Everything/x86_64/"
        priority: 100
    aarch64:
      baseos:
        url: "https://mirror.stream.centos.org/10-stream/BaseOS/aarch64/os/"
        priority: 100
      appstream:
        url: "https://mirror.stream.centos.org/10-stream/AppStream/aarch64/os/"
        priority: 100
      codeready-builder:
        url: "https://mirror.stream.centos.org/10-stream/CRB/aarch64/os/"
        priority: 100
      epel:
        url: "https://dl.fedoraproject.org/pub/epel/10/Everything/aarch64/"
        priority: 100

registries: {}
file_repos:
  x86_64: {}
  aarch64: {}
