# ============================================================================
# functional_group_packages.yml — Functional Group → RPM Package Mapping
# ============================================================================
# This file is the single source of truth for which RPM packages belong to
# each functional group.
#
# Producer: repo_manager domain (local_repo.yml) or manual creation
# Consumer: image_build_manager (fetch_build_packages role)
#
# This is a REFERENCE TEMPLATE. In production, repo_manager generates this file.
#
# Runtime location (created by repo_manager or copied manually):
#   /opt/omnia/repo_manager/output/<project_name>/functional_group_packages.yml
#
# Manual setup: see repo_status.yml header for instructions.
#
# Structure:
#   base_packages     — RPMs installed in ALL images (the base OS layer)
#   functional_groups — dict keyed by functional group name
#     Each group has:
#       packages: list of RPM package names for that group's image layer
#
# To customize: add/remove RPM names under the appropriate group.
# Package names must match what's available in the Pulp RPM repos.
# ============================================================================

# --- Base OS packages (installed in every image) ---
base_packages:
  - systemd
  - systemd-udev
  - kernel
  - dracut
  - dracut-live
  - dracut-network
  - squashfs-tools
  - nfs-utils
  - nfs4-acl-tools
  - NetworkManager
  - nm-connection-editor
  - iproute
  - iputils
  - curl
  - bash
  - coreutils
  - grep
  - sed
  - gawk
  - findutils
  - util-linux
  - kbd
  - lsof
  - cryptsetup
  - lvm2
  - device-mapper
  - rsyslog
  - chrony
  - sudo
  - gzip
  - wget
  - cloud-init
  - glibc-langpack-en
  - gedit

# --- Functional group → RPM package mapping ---
# Each key is a functional group name (must match image_build_config.yml entries).
# Packages listed here are IN ADDITION to base_packages above.
functional_groups:

  # ---- x86_64 groups ----

  os_x86_64:
    packages: []

  slurm_node_x86_64:
    packages:
      # slurm_custom common
      - munge
      - firewalld
      - python3-firewall
      - pmix
      - apptainer
      - iscsi-initiator-utils
      - device-mapper-multipath
      - sg3_utils
      - lsscsi
      # slurm_node role-specific
      - slurm-slurmd
      - slurm-pam_slurm
      - kernel-devel
      - kernel-headers
      # openldap
      - openldap
      - openldap-clients
      - sssd
      - sssd-ldap
      - oddjob
      - oddjob-mkhomedir

