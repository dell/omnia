---
# Credential no_log Guard (CWE-532)
#
# Fails when a telemetry module argument named like a credential
# (password/username/user/token/secret) lacks no_log: True, or when a task
# that passes telemetry_credentials.* lacks task-level no_log. Such output
# would otherwise be persisted to /var/log/omnia/telemetry/*.log.
name: Credential no_log Guard

'on':
  pull_request:
    branches:
      - main
      - staging
      - 'release_*'
      - 'issue-*'
      - 'pub/**'
    paths:
      - 'src/telemetry/**'
      - '.github/scripts/check_credential_no_log.py'
      - '.github/workflows/credential-no-log.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-no-log:
    name: Credential no_log Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Check credential arguments and tasks declare no_log
        run: python .github/scripts/check_credential_no_log.py src/telemetry
