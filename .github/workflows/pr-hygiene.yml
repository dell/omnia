---
name: PR Hygiene Check
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  pr-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: PR Hygiene Checks
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -e
          git fetch --no-tags origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          BASE="origin/${BASE_REF}"
          MERGE_BASE=$(git merge-base "$BASE" HEAD)

          echo "============================================="
          echo "  PR #${PR_NUMBER} Hygiene Check"
          echo "============================================="
          echo "Base branch : ${BASE_REF}"
          echo "Merge base  : ${MERGE_BASE}"

          FAILED=false
          DUP_COUNT=0
          BEHIND_LIMIT=20
          COMMIT_LIMIT=15
          WARN_LIMIT=10

          # ─────────────────────────────────────────────
          # CHECK 1: Branch must not be too far behind
          # ─────────────────────────────────────────────
          echo ""
          echo "── CHECK 1: Branch Freshness ──"
          BEHIND=$(git rev-list --count "HEAD..${BASE}")
          echo "Behind ${BASE_REF} by: ${BEHIND} commits"

          if [ "$BEHIND" -gt "$BEHIND_LIMIT" ]; then
            echo "❌ FAILED: Branch is ${BEHIND} commits behind '${BASE_REF}' (limit: ${BEHIND_LIMIT})."
            echo "Create a replacement PR from a clean branch based on the latest '${BASE_REF}'."
            echo "See the replacement-PR instructions in the final summary below."
            FAILED=true
          else
            echo "✅ PASSED: Branch is reasonably up-to-date"
          fi

          # ─────────────────────────────────────────────
          # CHECK 2: Commit count limit (excluding merges)
          # ─────────────────────────────────────────────
          echo ""
          echo "── CHECK 2: Commit Count ──"
          TOTAL_COMMITS=$(git rev-list --no-merges --count "${MERGE_BASE}..HEAD")
          echo "Total commits in PR (excluding merges): ${TOTAL_COMMITS}"
          echo "Commit limit        : ${COMMIT_LIMIT}"

          if [ "$TOTAL_COMMITS" -gt "$COMMIT_LIMIT" ]; then
            echo "❌ FAILED: PR contains ${TOTAL_COMMITS} commits (limit: ${COMMIT_LIMIT})."
            echo "Create a replacement PR containing only the intended changes."
            echo "See the replacement-PR instructions in the final summary below."
            FAILED=true
          elif [ "$TOTAL_COMMITS" -gt "$WARN_LIMIT" ]; then
            echo "⚠️  WARNING: ${TOTAL_COMMITS} commits approaching limit of ${COMMIT_LIMIT}."
            echo "If more commits are needed, prepare a clean replacement branch before the limit is exceeded."
          else
            echo "✅ PASSED: Commit count is within limit"
          fi

          # ─────────────────────────────────────────────
          # CHECK 3: Duplicate Commits (using git cherry)
          # ─────────────────────────────────────────────
          echo ""
          echo "── CHECK 3: Duplicate Commits ──"
          DUPLICATES=$(git cherry -v "$BASE" HEAD | grep '^-' || true)

          if [ -n "$DUPLICATES" ]; then
            DUP_COUNT=$(echo "$DUPLICATES" | wc -l | tr -d ' ')
            echo "⚠️  WARNING: Found ${DUP_COUNT} commit(s) that appear already present in base branch:"
            echo "$DUPLICATES"
            echo ""
            echo "These commits may have been copied or already merged into '${BASE_REF}'."
            echo "If a clean history is required, create a replacement PR containing only the intended changes."
          else
            echo "✅ PASSED: No duplicate commits found"
          fi

          # ─────────────────────────────────────────────
          # FINAL RESULT
          # ─────────────────────────────────────────────
          echo ""
          echo "============================================="
          if [ "$FAILED" = true ]; then
            echo "❌ PR HYGIENE CHECK FAILED"
            echo ""
            echo "HOW TO CREATE A REPLACEMENT PR"
            echo "  1. Create a new branch from the latest '${BASE_REF}'."
            echo "  2. Apply only the intended file changes; do not carry over the old"
            echo "     branch's commit history."
            echo "  3. Open a new PR from the clean branch, verify its checks, and then"
            echo "     close this PR."
            echo ""
            echo "Do not rewrite the history of this existing PR branch."
            exit 1
          fi

          echo "✅ ALL PR HYGIENE CHECKS PASSED"
          echo ""
          echo "Summary:"
          echo "  Behind base   : ${BEHIND} commits"
          echo "  PR commits    : ${TOTAL_COMMITS}"
          echo "  Duplicates    : ${DUP_COUNT:-0}"
