---
name: Secret Leak Scan

'on':
  pull_request:
    branches:
      - main
      - staging
      - release_1.7.1
      - pub/build_stream
      - pub/q2_dev
      - pub/telemetry
      - pub/q2_upgrade
      - pub/q2_ansible

jobs:
  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest
    continue-on-error: true

    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          REPO="https://api.github.com/repos/gitleaks/gitleaks"
          VERSION=$(curl -s ${REPO}/releases/latest | \
            grep tag_name | cut -d '"' -f 4)
          BASE="https://github.com/gitleaks/gitleaks/releases"
          FILE="gitleaks_${VERSION#v}_linux_x64.tar.gz"
          wget ${BASE}/download/${VERSION}/${FILE}
          tar -xzf ${FILE}
          chmod +x gitleaks

      - name: Run Gitleaks scan
        run: |
          ./gitleaks detect --source . --log-opts="--all"
