---
# Secure Code Review (advisory)
#
# Scans the lines added by a PR against secure-coding rules derived from past
# security fixes and posts/updates a single PR comment with a pass/fail
# checklist. It never fails the job, so it cannot block a PR.
name: Secure Code Review

'on':
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - 'release_*'
      - 'issue-*'
      - 'pub/**'
      - 'feature/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: secure-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  secure-code-review:
    name: Secure Code Review
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run secure code review
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          python .github/scripts/secure_code_review.py "origin/${BASE_REF}" secure-code-review.md
          cat secure-code-review.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update PR comment
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('secure-code-review.md', 'utf8');
            const marker = '<!-- secure-code-review -->';
            const {owner, repo} = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments,
              {owner, repo, issue_number, per_page: 100});
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }
