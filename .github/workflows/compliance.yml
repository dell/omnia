---
name: Compliance Gate
on:
  pull_request:
    branches:
      - main
      - 'release_*'
      - 'issue-*'
      - 'pub/**'
      - 'feature/**'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: compliance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  compliance:
    name: Source, Test, SVT and Pipeline Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: "!startsWith(github.event.pull_request.title, 'sync')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install checker dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Run compliance gate (changed domains only on a PR, all on manual run)
        env:
          BASE_REF: ${{ github.base_ref }}
          SKIP_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'skip-compliance-check') }}
        run: |
          ARGS="--comment-file compliance-comment.md"
          if [ -n "$BASE_REF" ]; then
            git fetch origin "$BASE_REF"
            ARGS="$ARGS --base origin/$BASE_REF"
          fi
          if [ "$SKIP_LABEL" = "true" ]; then
            echo "Label 'skip-compliance-check' present: reporting only."
            ARGS="$ARGS --no-fail"
          fi
          python3 .github/scripts/compliance_gate.py $ARGS

      - name: Post or update PR comment
        if: always() && github.event_name == 'pull_request' && hashFiles('compliance-comment.md') != ''
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('compliance-comment.md', 'utf8');
            const marker = '<!-- compliance-gate -->';
            const {owner, repo} = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments,
              {owner, repo, issue_number, per_page: 100});
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }

      - name: Stage PR comment for the PR Comment workflow
        if: always() && github.event_name == 'pull_request' && hashFiles('compliance-comment.md') != ''
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p comment-artifact
          cp compliance-comment.md comment-artifact/comment.md
          echo "$PR_NUMBER" > comment-artifact/pr-number

      - name: Upload PR comment
        if: always() && github.event_name == 'pull_request' && hashFiles('comment-artifact/comment.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: compliance-gate-comment
          path: comment-artifact
          retention-days: 1
