---
# HPC Compliance Scanner
#
# Enforces Omnia-specific HPC production rules that ansible-lint
# does NOT cover (docs/code-style/ansible.md §13, python.md §8):
#
#   Ansible (HPC-specific only — ansible-lint handles FQCN, module-vs-shell):
#     - loop:/with_items: + delegate_to: fan-out anti-pattern (advisory)
#
#   Python (Checkmarx pre-scan):
#     - shell=True in subprocess calls
#     - os.system()
#     - exec() / eval()
#     - yaml.load() / yaml.full_load() / UnsafeLoader / FullLoader
#     - Hardcoded credentials including tokens (warning, excludes tests/)
#
name: HPC Compliance Scanner

'on':
  pull_request:
    branches:
      - main
      - staging
      - 'release_*'
      - 'issue-*'
      - 'pub/**'

permissions:
  contents: read

jobs:
  hpc-compliance:
    name: HPC Compliance Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed
        run: |
          git fetch origin "${{ github.base_ref }}"
          CHANGED=$(git diff --name-only --diff-filter=d \
            "origin/${{ github.base_ref }}" HEAD -- \
            '*.yml' '*.yaml' '*.py' || true)
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # ─── HPC Anti-Pattern Detection (Ansible) ───
      - name: Detect potential HPC fan-out anti-patterns
        if: steps.changed.outputs.files != ''
        run: |
          set -euo pipefail
          WARNINGS=0

          while IFS= read -r f; do
            [ -f "$f" ] || continue
            case "$f" in *.yml|*.yaml) ;; *) continue ;; esac
            case "$f" in .github/*) continue ;; esac

            # Detect: loop: + delegate_to: in same file (potential fan-out)
            # NOTE: grep cannot prove these belong to the same task.
            # This is advisory — manual review required.
            if grep -qE '^\s+loop:' "$f" 2>/dev/null && \
               grep -qE '^\s+delegate_to:' "$f" 2>/dev/null; then
              WARNINGS=$((WARNINGS + 1))
              LINE=$(grep -nE '^\s+delegate_to:' "$f" | head -1 | cut -d: -f1)
              echo "::warning file=${f},line=${LINE}::HPC: potential loop + delegate_to fan-out detected. Review ansible.md §13.1 — consider a threaded Python module for 1000-node scale"
            fi

            # Detect: with_items: + delegate_to:
            if grep -qE '^\s+with_items:' "$f" 2>/dev/null && \
               grep -qE '^\s+delegate_to:' "$f" 2>/dev/null; then
              WARNINGS=$((WARNINGS + 1))
              LINE=$(grep -nE '^\s+delegate_to:' "$f" | head -1 | cut -d: -f1)
              echo "::warning file=${f},line=${LINE}::HPC: potential with_items + delegate_to fan-out detected. Review ansible.md §13.1 — consider a threaded Python module for 1000-node scale"
            fi

          done <<< "${{ steps.changed.outputs.files }}"

          echo ""
          echo "==========================================="
          echo "     HPC ANTI-PATTERN SUMMARY (Ansible)"
          echo "==========================================="
          if [ "$WARNINGS" -gt 0 ]; then
            echo "Advisory warnings: $WARNINGS"
            echo ""
            echo "These warnings indicate potential HPC fan-out patterns."
            echo "Manual review required — grep cannot confirm task association."
            echo "Review: docs/code-style/ansible.md §13"
          else
            echo "No HPC anti-patterns detected."
          fi
          echo "==========================================="

      # ─── Checkmarx Pre-Scan (Python) ───
      - name: Checkmarx pre-scan on changed Python files
        if: steps.changed.outputs.files != ''
        run: |
          set -euo pipefail
          ERRORS=0
          WARNINGS=0

          while IFS= read -r f; do
            [ -f "$f" ] || continue
            case "$f" in *.py) ;; *) continue ;; esac
            # Exclude generated/vendored paths
            case "$f" in build/*|dist/*|.venv/*|venv/*) continue ;; esac

            # --- Blocking checks (these are always wrong) ---

            # Detect: shell=True in subprocess (OS Command Injection)
            if grep -nE 'shell\s*=\s*True' "$f" 2>/dev/null | head -1 > /dev/null 2>&1; then
              LINE=$(grep -nE 'shell\s*=\s*True' "$f" | head -1 | cut -d: -f1)
              if [ -n "$LINE" ]; then
                ERRORS=$((ERRORS + 1))
                echo "::error file=${f},line=${LINE}::Checkmarx: shell=True — use subprocess.run() with list args (python.md §8.3)"
              fi
            fi

            # Detect: os.system() (OS Command Injection)
            if grep -nE 'os\.system\(' "$f" 2>/dev/null | head -1 > /dev/null 2>&1; then
              LINE=$(grep -nE 'os\.system\(' "$f" | head -1 | cut -d: -f1)
              if [ -n "$LINE" ]; then
                ERRORS=$((ERRORS + 1))
                echo "::error file=${f},line=${LINE}::Checkmarx: os.system() — use subprocess.run() with list args (python.md §8.3)"
              fi
            fi

            # Detect: eval() (Code Injection)
            if grep -nE '\beval\(' "$f" 2>/dev/null | head -1 > /dev/null 2>&1; then
              LINE=$(grep -nE '\beval\(' "$f" | head -1 | cut -d: -f1)
              if [ -n "$LINE" ]; then
                ERRORS=$((ERRORS + 1))
                echo "::error file=${f},line=${LINE}::Checkmarx: eval() — use json.loads() or ast.literal_eval() (python.md §8.3)"
              fi
            fi

            # Detect: exec() (Code Injection)
            if grep -nE '\bexec\(' "$f" 2>/dev/null | head -1 > /dev/null 2>&1; then
              LINE=$(grep -nE '\bexec\(' "$f" | head -1 | cut -d: -f1)
              if [ -n "$LINE" ]; then
                ERRORS=$((ERRORS + 1))
                echo "::error file=${f},line=${LINE}::Checkmarx: exec() — avoid dynamic code execution (python.md §8.3)"
              fi
            fi

            # Detect: yaml.load() without safe_load (Insecure Deserialization)
            if grep -nE 'yaml\.load\(' "$f" 2>/dev/null | grep -v 'safe_load' > /dev/null 2>&1; then
              LINE=$(grep -nE 'yaml\.load\(' "$f" 2>/dev/null | grep -v 'safe_load' | head -1 | cut -d: -f1)
              if [ -n "$LINE" ]; then
                ERRORS=$((ERRORS + 1))
                echo "::error file=${f},line=${LINE}::Checkmarx: yaml.load() — use yaml.safe_load() (python.md §8.3)"
              fi
            fi

            # Detect: yaml.full_load() (unsafe loader)
            if grep -nE 'yaml\.full_load\(' "$f" 2>/dev/null | head -1 > /dev/null 2>&1; then
              LINE=$(grep -nE 'yaml\.full_load\(' "$f" | head -1 | cut -d: -f1)
              if [ -n "$LINE" ]; then
                ERRORS=$((ERRORS + 1))
                echo "::error file=${f},line=${LINE}::Checkmarx: yaml.full_load() — use yaml.safe_load() (python.md §8.3)"
              fi
            fi

            # Detect: UnsafeLoader or FullLoader (unsafe YAML loaders)
            if grep -nE 'yaml\.(UnsafeLoader|FullLoader)' "$f" 2>/dev/null | head -1 > /dev/null 2>&1; then
              LINE=$(grep -nE 'yaml\.(UnsafeLoader|FullLoader)' "$f" | head -1 | cut -d: -f1)
              if [ -n "$LINE" ]; then
                ERRORS=$((ERRORS + 1))
                echo "::error file=${f},line=${LINE}::Checkmarx: UnsafeLoader/FullLoader — use yaml.safe_load() or Loader=yaml.SafeLoader (python.md §8.3)"
              fi
            fi

            # --- Warning checks (may have false positives) ---

            # Detect: pickle.loads() (warning — may have valid internal uses)
            if grep -nE 'pickle\.(loads|load)\(' "$f" 2>/dev/null | head -1 > /dev/null 2>&1; then
              LINE=$(grep -nE 'pickle\.(loads|load)\(' "$f" | head -1 | cut -d: -f1)
              if [ -n "$LINE" ]; then
                WARNINGS=$((WARNINGS + 1))
                echo "::warning file=${f},line=${LINE}::Checkmarx: pickle — ensure input is trusted; prefer json.loads() for untrusted data"
              fi
            fi

            # Detect: hardcoded credentials (warning, exclude tests/examples/docs)
            case "$f" in
              test/*|tests/*|molecule/*|examples/*|docs/*|build/*|dist/*) continue ;;
            esac
            if grep -nEi '(password|passwd|secret|api_key|token|access_token|auth_token)\s*=\s*["\x27][^{"\x27][^"\x27]*["\x27]' "$f" 2>/dev/null \
               | grep -v '# noqa' \
               | grep -v 'DOCUMENTATION' \
               | grep -v 'EXAMPLES' \
               | grep -v 'description' \
               | grep -v 'help=' \
               | head -3 > /dev/null 2>&1; then
              WARNINGS=$((WARNINGS + 1))
              echo "::warning file=${f}::Possible hardcoded credential — review and use Ansible Vault if needed"
            fi

          done <<< "${{ steps.changed.outputs.files }}"

          echo ""
          echo "==========================================="
          echo "     CHECKMARX PRE-SCAN SUMMARY"
          echo "==========================================="
          echo "Errors: $ERRORS"
          echo "Warnings: $WARNINGS"
          echo "==========================================="

          if [ "$ERRORS" -gt 0 ]; then
            echo ""
            echo "Review: docs/code-style/python.md §8.3"
            exit 1
          fi
