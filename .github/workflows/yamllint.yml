---
name: YAML Lint

'on':
  pull_request:
    branches:
      - main
      - staging
      - release_1.7.1
      - pub/build_stream
      - pub/q2_dev
      - pub/telemetry
      - pub/q2_upgrade
      - pub/q2_ansible
      - q3_main

jobs:
  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed YAML files (excluding deleted and Ansible files)
        id: changed-files
        run: |
          git fetch origin ${{ github.base_ref }}
          CHANGED=$(git diff --name-only --diff-filter=d \
            origin/${{ github.base_ref }} HEAD -- \
            '*.yml' '*.yaml' || true)

          FILES=""
          for f in $CHANGED; do
            # Exclude Ansible files (playbooks, roles, tasks, handlers, vars, defaults, etc.)
            if [ -f "$f" ] && \
               [[ ! "$f" =~ src/playbooks/ ]] && \
               [[ ! "$f" =~ /roles/ ]] && \
               [[ ! "$f" =~ /tasks/ ]] && \
               [[ ! "$f" =~ /handlers/ ]] && \
               [[ ! "$f" =~ /vars/ ]] && \
               [[ ! "$f" =~ /defaults/ ]] && \
               [[ ! "$f" =~ /meta/ ]] && \
               [[ ! "$f" =~ /group_vars/ ]] && \
               [[ ! "$f" =~ /host_vars/ ]]; then
              FILES="$FILES $f"
            fi
          done

          FILES=$(echo "$FILES" | xargs)
          echo "Filtered files: $FILES"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Install yamllint
        if: steps.changed-files.outputs.files != ''
        run: pip install yamllint

      - name: Run yamllint on changed files
        if: steps.changed-files.outputs.files != ''
        run: |
          echo "Running yamllint on:"
          echo "${{ steps.changed-files.outputs.files }}"
          yamllint -c .yamllint \
            ${{ steps.changed-files.outputs.files }} || \
            yamllint ${{ steps.changed-files.outputs.files }}

      - name: No YAML files changed
        if: steps.changed-files.outputs.files == ''
        run: |
          echo "No YAML files changed in this PR."
          echo "Skipping yamllint."
