---
name: Pylint
'on':
  pull_request:
    branches:
      - main
      - staging
      - 'release_*'
      - 'issue-*'
      - 'pub/**'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    env:
      PYLINT_THRESHOLD: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible pylint kubernetes prettytable \
            requests passlib fastapi uvicorn sqlalchemy pytest \
            httpx argon2-cffi pyyaml dependency-injector

      - name: Get changed Python files (excluding deleted)
        if: github.event_name == 'pull_request'
        id: changed-files
        run: |
          git fetch origin ${{ github.base_ref }}
          CHANGED=$(git diff --name-only --diff-filter=d \
            origin/${{ github.base_ref }} HEAD -- '*.py' || true)
          FILES=""
          for f in $CHANGED; do
            if [ -f "$f" ]; then
              FILES="$FILES $f"
            fi
          done
          FILES=$(echo "$FILES" | tr '\n' ' ' | sed 's/^ *//;s/ *$//')
          echo "Filtered files: $FILES"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: No Python files changed
        if: github.event_name == 'pull_request' && steps.changed-files.outputs.files == ''
        run: |
          echo "No Python files changed in this PR."
          echo "Skipping pylint."

      - name: Run pylint on changed files (PR validation)
        if: github.event_name == 'pull_request' && steps.changed-files.outputs.files != ''
        run: |
          echo "Running pylint on changed files (per-file validation):"
          echo "${{ steps.changed-files.outputs.files }}"
          FILES=$(echo \
            "${{ steps.changed-files.outputs.files }}" | \
            tr ' ' '\n' | \
            grep -v 'telemetry/files/nersc-ldms-aggr/' | \
            grep -v '__init__\.py$' | \
            tr '\n' ' ' | sed 's/^ *//;s/ *$//')
          if [ -n "$FILES" ]; then
            FAILED=0
            FAILED_FILES=""
            for file in $FILES; do
              echo "Checking $file"
              OUTPUT=$(
                PYTHONPATH=.:./src/build_stream pylint "$file" 2>/dev/null || true
              )
              SCORE=$(
                echo "$OUTPUT" |
                grep -oE 'rated at [0-9.-]+/10' |
                awk '{print $3}' |
                cut -d/ -f1
              )
              SCORE=${SCORE:-0}
              echo "$file -> $SCORE"
              if awk -v score="$SCORE" -v threshold="$PYLINT_THRESHOLD" \
                'BEGIN { exit !(score < threshold) }'
              then
                echo "::error::$file scored $SCORE (< $PYLINT_THRESHOLD)"
                FAILED=1
                FAILED_FILES="$FAILED_FILES\n  - $file (score: $SCORE)"
              fi
            done

            echo ""
            echo "==========================================="
            echo "           PYLINT SUMMARY"
            echo "==========================================="
            if [ "$FAILED" -eq 1 ]; then
              echo "Files below threshold ($PYLINT_THRESHOLD):"
              echo -e "$FAILED_FILES"
              echo "==========================================="
              exit 1
            else
              echo "All files passed (>= $PYLINT_THRESHOLD). No issues found."
              echo "==========================================="
            fi
          else
            echo "No files to lint after filtering."
          fi

      - name: Run pylint full repository scan (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Running pylint on all Python files in repository"
          find . \
            -type f \
            -name "*.py" \
            -not -name "__init__.py" \
            -not -path "./.git/*" \
            -not -path "./.venv/*" \
            -not -path "./venv/*" > python-files.txt
          FILTERED=$(grep -v 'telemetry/files/nersc-ldms-aggr/' python-files.txt || true)

          > pylint-report.txt
          echo "Pylint Score Report - Full Repository Scan" >> pylint-report.txt
          echo "Generated: $(date)" >> pylint-report.txt
          echo "==========================================" >> pylint-report.txt
          echo "" >> pylint-report.txt

          PASS_COUNT=0
          FAIL_COUNT=0
          FAILED_FILES=""

          for file in $FILTERED; do
            OUTPUT=$(
              PYTHONPATH=.:./src/build_stream pylint "$file" 2>/dev/null || true
            )
            SCORE=$(
              echo "$OUTPUT" |
              grep -oE 'rated at [0-9.-]+/10' |
              awk '{print $3}' |
              cut -d/ -f1
            )
            SCORE=${SCORE:-0}
            if awk -v score="$SCORE" -v threshold="$PYLINT_THRESHOLD" \
              'BEGIN { exit !(score >= threshold) }'
            then
              STATUS="PASS"
              PASS_COUNT=$((PASS_COUNT + 1))
            else
              STATUS="FAIL"
              FAIL_COUNT=$((FAIL_COUNT + 1))
              FAILED_FILES="$FAILED_FILES\n  - $file (score: $SCORE)"
            fi
            echo "$file -> $SCORE [$STATUS]" | tee -a pylint-report.txt
          done

          echo "" >> pylint-report.txt
          echo "==========================================" >> pylint-report.txt
          echo "PASS: $PASS_COUNT" >> pylint-report.txt
          echo "FAIL: $FAIL_COUNT" >> pylint-report.txt
          echo "Threshold: $PYLINT_THRESHOLD" >> pylint-report.txt

          if [ "$FAIL_COUNT" -gt 0 ]; then
            echo "" >> pylint-report.txt
            echo "Files below threshold:" >> pylint-report.txt
            echo -e "$FAILED_FILES" >> pylint-report.txt
          fi

          echo "==========================================" >> pylint-report.txt

          echo ""
          echo "==========================================="
          echo "           PYLINT SUMMARY"
          echo "==========================================="
          echo "PASS: $PASS_COUNT"
          echo "FAIL: $FAIL_COUNT"
          echo "Threshold: $PYLINT_THRESHOLD"
          if [ "$FAIL_COUNT" -gt 0 ]; then
            echo ""
            echo "Files below threshold ($PYLINT_THRESHOLD):"
            echo -e "$FAILED_FILES"
            echo "==========================================="
            echo "::error::$FAIL_COUNT files scored below threshold $PYLINT_THRESHOLD"
            exit 1
          else
            echo "All files passed. No issues found."
            echo "==========================================="
          fi

      - name: Upload pylint report
        if: github.event_name == 'workflow_dispatch' && always()
        uses: actions/upload-artifact@v4
        with:
          name: pylint-report
          path: pylint-report.txt
