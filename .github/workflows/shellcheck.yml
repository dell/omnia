---
name: ShellCheck

'on':
  pull_request:
    branches:
      - main
      - staging
      - release_1.7.1
      - pub/build_stream
      - pub/q2_dev
      - pub/telemetry
      - pub/q2_upgrade
      - pub/q2_ansible
      - q3_main

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed shell files (excluding deleted)
        id: changed-files
        run: |
          git fetch origin ${{ github.base_ref }}
          CHANGED=$(git diff --name-only --diff-filter=d \
            origin/${{ github.base_ref }} HEAD -- \
            '*.sh' '*.bash' '*.sh.j2' || true)

          FILES=""
          for f in $CHANGED; do
            if [ -f "$f" ]; then
              FILES="$FILES $f"
            fi
          done

          FILES=$(echo "$FILES" | xargs)
          echo "Filtered files: $FILES"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Install ShellCheck
        if: steps.changed-files.outputs.files != ''
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck on changed files
        if: steps.changed-files.outputs.files != ''
        run: |
          echo "Running ShellCheck on: ${{ steps.changed-files.outputs.files }}"
          shellcheck ${{ steps.changed-files.outputs.files }}

      - name: No shell files changed
        if: steps.changed-files.outputs.files == ''
        run: |
          echo "No shell files changed in this PR."
          echo "Skipping ShellCheck."
