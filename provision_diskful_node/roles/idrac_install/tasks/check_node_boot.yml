---
- name: Check if node booted from CD (iDRAC Boot override)
  uri:
    url: "https://{{ hostvars[node].idrac_ip }}/redfish/v1/Systems/System.Embedded.1"
    method: GET
    user: "{{ hostvars[node].idrac_user }}"
    password: "{{ hostvars[node].idrac_password }}"
    force_basic_auth: yes
    validate_certs: no
  register: boot_status
  until: boot_status.json.Boot.BootSourceOverrideEnabled != "Once"
  retries: "{{ attempts }}"
  delay: "{{ check_delay }}"

- name: Display node installation status
  debug:
    msg: "Node {{ node }} has started OS installation from CD."

