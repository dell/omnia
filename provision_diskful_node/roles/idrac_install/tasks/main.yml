---
- name: Eject any previously mounted virtual media
  uri:
    url: "https://{{ idrac_ip }}/redfish/v1/Managers/iDRAC.Embedded.1/VirtualMedia/{{ virtual_media_type }}/Actions/VirtualMedia.EjectMedia"
    method: POST
    user: "{{ idrac_user }}"
    password: "{{ idrac_password }}"
    force_basic_auth: yes
    validate_certs: no
    headers:
      Content-Type: application/json
    body: {}
    body_format: json
    status_code: [200, 204]
  ignore_errors: yes

- name: Insert RHEL ISO into Virtual Media
  uri:
    url: "https://{{ idrac_ip }}/redfish/v1/Managers/iDRAC.Embedded.1/VirtualMedia/{{ virtual_media_type }}/Actions/VirtualMedia.InsertMedia"
    method: POST
    user: "{{ idrac_user }}"
    password: "{{ idrac_password }}"
    force_basic_auth: yes
    validate_certs: no
    body_format: json
    body:
      Image: "{{ iso_url }}"
      Inserted: true
      WriteProtected: true
    status_code: [200, 201, 204]
  register: insert_result
  retries: "{{ insert_retries }}"
  delay: "{{ insert_delay }}"

- name: Pause to let iDRAC mount the ISO
  pause:
    seconds: "{{ mount_pause_seconds }}"

- name: Set one-time boot to Virtual CD
  uri:
    url: "https://{{ idrac_ip }}/redfish/v1/Systems/System.Embedded.1"
    method: PATCH
    user: "{{ idrac_user }}"
    password: "{{ idrac_password }}"
    force_basic_auth: yes
    validate_certs: no
    body_format: json
    body:
      Boot:
        BootSourceOverrideTarget: "Cd"
        BootSourceOverrideEnabled: "Once"
    status_code: [200, 204]

- name: Reboot the server
  uri:
    url: "https://{{ idrac_ip }}/redfish/v1/Systems/System.Embedded.1/Actions/ComputerSystem.Reset"
    method: POST
    user: "{{ idrac_user }}"
    password: "{{ idrac_password }}"
    force_basic_auth: yes
    validate_certs: no
    body_format: json
    body:
      ResetType: "ForceRestart"
    status_code: [200, 202, 204]

