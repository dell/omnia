---
- name: Setup HTTP server to serve RHEL ISOs
  hosts: localhost
  become: yes
  vars:
    serve_dir: /osimage

  tasks:
    - name: Install Apache HTTP Server
      dnf:
        name: httpd
        state: present

    - name: Ensure ISO serve directory exists
      file:
        path: "{{ serve_dir }}"
        state: directory
        owner: apache
        group: apache
        mode: '0755'
        recurse: yes

    - name: Set SELinux context permanently for Apache on /osimage
      sefcontext:
        target: "{{ serve_dir }}(/.*)?"
        setype: httpd_sys_content_t
        state: present

    - name: Apply SELinux context
      command: restorecon -Rv "{{ serve_dir }}"

    - name: Configure Apache to serve /osimage
      copy:
        dest: /etc/httpd/conf.d/osimage.conf
        content: |
          <VirtualHost *:80>
              DocumentRoot "{{ serve_dir }}"
              <Directory "{{ serve_dir }}">
                  Options Indexes FollowSymLinks
                  AllowOverride None
                  Require all granted
              </Directory>
          </VirtualHost>

    - name: Enable and start Apache
      systemd:
        name: httpd
        enabled: yes
        state: started

    - name: Install firewalld
      dnf:
        name: firewalld
        state: present

    - name: Ensure firewalld is running and enabled
      systemd:
        name: firewalld
        state: started
        enabled: yes

    - name: Open HTTP port in firewall
      firewalld:
        service: http
        permanent: yes
        state: enabled
        immediate: yes

- name: Provision all nodes via iDRAC
  hosts: localhost
  gather_facts: no
  serial: 3
  tasks:
    - name: Run idrac_install role per node
      include_role:
        name: idrac_install
      loop: "{{ groups['all'] }}"
      loop_control:
        loop_var: target_host
      vars:
        idrac_ip: "{{ hostvars[target_host].idrac_ip }}"
        idrac_user: "{{ hostvars[target_host].idrac_user }}"
        idrac_password: "{{ hostvars[target_host].idrac_password }}"
        iso_url: "{{ hostvars[target_host].iso_url }}"
