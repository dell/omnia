# ---------------------------------------------------------------------------
# Omnia Single/Multi-Cluster Parent Pipeline
# ---------------------------------------------------------------------------
# Triggers an independent child pipeline for each cluster defined in the
# CLUSTERS CI/CD variable. Each cluster runs all stages independently — if
# one cluster fails, it does not affect the others.
#
# PIPELINE MODES
# ~~~~~~~~~~~~~~
# 1. CLUSTER DEPLOYMENT MODE (default)
#    - Triggered when UTILS_ENABLE != "true"
#    - Runs .gitlab-ci-cluster.yml for each cluster
#    - Deploys and tests Omnia domains
#
# 2. LOG COLLECTION MODE
#    - Triggered when UTILS_ENABLE == "true"
#    - Runs .gitlab-ci-utils.yml for each cluster
#    - Collects logs and validates utils functionality
#    - Cluster deployment pipeline is skipped
#
# CLUSTER CONFIGURATION
# ~~~~~~~~~~~~~~~~~~~~~
# By default, this pipeline supports a single cluster (cluster1).
# To add more clusters, use the setup_gitlab_project.py script:
#
#   python3 setup_gitlab_project.py --update \
#     --gitlab-url https://gitlab.example.com \
#     --token glpat-xxxx \
#     --project-name omnia-pipeline \
#     --clusters cluster1,cluster2,cluster3
#
# The script will automatically:
#   - Add cluster variables (CLUSTER2_PIPELINE_MODE, CLUSTER2_DOMAINS, etc.)
#   - Add trigger jobs (trigger_cluster_cluster2, trigger_cluster_cluster3)
#   - Add utils trigger jobs (trigger_cluster_cluster2_utils, etc.)
#   - Update the .gitlab-ci.yml file
#
# CLUSTER-LEVEL VARIABLES
# ~~~~~~~~~~~~~~~~~~~~~~~
# Each cluster has its own configuration variables:
#   CLUSTER1_PIPELINE_MODE  -> deploy, cleanup, or default
#   CLUSTER1_DOMAINS        -> default, repo_manager, image_build_manager, orchestrator, or regex patterns
#   CLUSTER1_ENABLE_SETUP   -> true or false
#   CLUSTER1_TEST_MODE      -> true or false
#   CLUSTER1_DRY_RUN        -> true or false
#   CLUSTER1_VERBOSE        -> true or false
#   CLUSTER1_OMNIA_REPO     -> Omnia repository URL
#   CLUSTER1_OMNIA_BRANCH   -> Omnia branch to clone
#   CLUSTER1_OMNIA_INSTALL_PATH -> Path where omnia is installed
#
# GLOBAL VARIABLES (for utils pipeline)
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
#   UTILS_ENABLE      -> "true" to enable utils pipeline, "false" for cluster pipeline
#   UTILS_MODE        -> "default_logs", "install_os", "collect", or "backup_oim_logs"
#   CLUSTERS          -> Comma-separated list of clusters to run (e.g., "cluster1,cluster2")
#
# Example: Deploy repo_manager on cluster1, cleanup orchestrator on cluster2:
#   CLUSTER1_PIPELINE_MODE=deploy   CLUSTER1_DOMAINS=repo_manager
#   CLUSTER2_PIPELINE_MODE=cleanup  CLUSTER2_DOMAINS=orchestrator
#
# Example: Collect logs from cluster1 and cluster2:
#   UTILS_ENABLE=true
#   UTILS_MODE=default_logs
#   CLUSTERS=cluster1,cluster2
#
# Pipeline modes:
#   PIPELINE_MODE=default  -> Full cycle (setup + cleanup + deploy + tests)
#   PIPELINE_MODE=deploy   -> Deploy only (domain playbooks)
#   PIPELINE_MODE=cleanup  -> Tear down all omnia domain state
#
# Utils modes:
#   UTILS_MODE=default_logs      -> Collect both cluster and OIM logs
#   UTILS_MODE=install_os        -> Run install_os only
#   UTILS_MODE=collect           -> Collect cluster logs only
#   UTILS_MODE=backup_oim_logs   -> Collect OIM logs only
#
# Domains selection:
#   DOMAINS=default             -> All domains
#   DOMAINS=repo_manager        -> Only repo_manager
#   DOMAINS=image_build_manager -> Only image_build_manager
#   DOMAINS=orchestrator        -> Only orchestrator
#   DOMAINS=telemetry           -> Only telemetry
#   DOMAINS=repo_manager|orchestrator -> Multiple domains (regex pattern)
#
# Skip specific stages:
#   SKIP_STAGES=""                    -> Nothing skipped (default)
#   SKIP_STAGES="telemetry"           -> Skip telemetry cleanup, deploy, and test
#   SKIP_STAGES="repo_manager,telemetry" -> Skip multiple domains
#   Valid values: repo_manager, image_build_manager, orchestrator, telemetry,
#                 setup_environment, setup_main, test (skips all test_* stages)
#
# Per-stage ansible tags (global, applied to all clusters):
#   REPO_MANAGER_TAGS, IMAGE_BUILD_MANAGER_TAGS, ORCHESTRATOR_TAGS, TELEMETRY_TAGS
#
# Repository layout in GitLab:
#   .gitlab-ci.yml                              -> This parent pipeline
#   .gitlab-ci-cluster.yml                      -> Child pipeline (per-cluster deployment)
#   .gitlab-ci-utils.yml                        -> Child pipeline (per-cluster log collection)
#   clusters/<name>/cluster.env                 -> Per-cluster connection details
#   clusters/<name>/inputs/omnia.env            -> Per-cluster Omnia environment config
#   clusters/<name>/inputs/utils/               -> Per-cluster utils input files
#   clusters/<name>/inputs/test/utils/          -> Per-cluster utils test files
#   clusters/<name>/catalogs/                   -> Per-cluster catalog files (optional)
#
# To add a new cluster:
#   Use setup_gitlab_project.py --update --clusters cluster1,cluster2,cluster3
#   The script will automatically update this file and create all necessary variables.
# ---------------------------------------------------------------------------

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "api"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
      when: always

stages:
  - trigger

# ---------------------------------------------------------------------------
# NOTE: All cluster-level variables (CLUSTER1_OMNIA_REPO, CLUSTER1_TARGET_IP,
# CLUSTERS, etc.) are configured in GitLab Project > Settings > CI/CD > Variables
# and are automatically available. Do NOT redefine them here.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Child pipeline trigger — one per cluster.
# Each cluster triggers its own pipeline completely independently.
# If one cluster fails, it does NOT affect the others.
#
# To add more clusters, use setup_gitlab_project.py --update with multiple clusters.
# The script will automatically generate additional trigger jobs.
# ---------------------------------------------------------------------------
trigger_cluster_cluster1:
  stage: trigger
  trigger:
    include:
      - local: .gitlab-ci-cluster.yml
    strategy: depend
  variables:
    CLUSTER: "cluster1"
    OMNIA_REPO: "$CLUSTER1_OMNIA_REPO"
    OMNIA_BRANCH: "$CLUSTER1_OMNIA_BRANCH"
    OMNIA_INSTALL_PATH: "$CLUSTER1_OMNIA_INSTALL_PATH"
    BAO_SERVER_URL: "$CLUSTER1_BAO_SERVER_URL"
    BAO_AUTH_ROLE: "$CLUSTER1_BAO_AUTH_ROLE"
    BAO_DATA_PATH: "$CLUSTER1_BAO_DATA_PATH"
    PIPELINE_MODE: "$CLUSTER1_PIPELINE_MODE"
    DOMAINS: "$CLUSTER1_DOMAINS"
    ENABLE_SETUP: "$CLUSTER1_ENABLE_SETUP"
    TEST_MODE: "$CLUSTER1_TEST_MODE"
    DRY_RUN: "$CLUSTER1_DRY_RUN"
    VERBOSE: "$CLUSTER1_VERBOSE"
    REPO_MANAGER_TAGS: "$CLUSTER1_REPO_MANAGER_TAGS"
    IMAGE_BUILD_MANAGER_TAGS: "$CLUSTER1_IMAGE_BUILD_MANAGER_TAGS"
    ORCHESTRATOR_TAGS: "$CLUSTER1_ORCHESTRATOR_TAGS"
    TELEMETRY_TAGS: "$CLUSTER1_TELEMETRY_TAGS"
    TEST_MAIN_CMD: "$CLUSTER1_TEST_MAIN_CMD"
    TEST_REPO_MANAGER_CMD: "$CLUSTER1_TEST_REPO_MANAGER_CMD"
    TEST_IMAGE_BUILD_MANAGER_CMD: "$CLUSTER1_TEST_IMAGE_BUILD_MANAGER_CMD"
    TEST_ORCHESTRATOR_CMD: "$CLUSTER1_TEST_ORCHESTRATOR_CMD"
    TEST_TELEMETRY_CMD: "$CLUSTER1_TEST_TELEMETRY_CMD"
    SKIP_STAGES: "$CLUSTER1_SKIP_STAGES"
  allow_failure: true
  rules:
    - if: '$UTILS_ENABLE == "true"'
      when: never
    - if: '$CLUSTERS =~ /cluster1/'
      when: on_success

# ---------------------------------------------------------------------------
# Utils Pipeline — Multi-Cluster Support
# ---------------------------------------------------------------------------
# Triggered when UTILS_ENABLE=true to run utils operations (log collection, install_os, etc.)
# Each cluster runs its own utils pipeline independently.
# If UTILS_ENABLE=true, the cluster pipeline is skipped.
# ---------------------------------------------------------------------------
trigger_cluster_cluster1_utils:
  stage: trigger
  trigger:
    include:
      - local: .gitlab-ci-utils.yml
    strategy: depend
  variables:
    CLUSTER: "cluster1"
    OMNIA_REPO: "$CLUSTER1_OMNIA_REPO"
    OMNIA_BRANCH: "$CLUSTER1_OMNIA_BRANCH"
    OMNIA_INSTALL_PATH: "$CLUSTER1_OMNIA_INSTALL_PATH"
    BAO_SERVER_URL: "$CLUSTER1_BAO_SERVER_URL"
    BAO_AUTH_ROLE: "$CLUSTER1_BAO_AUTH_ROLE"
    BAO_DATA_PATH: "$CLUSTER1_BAO_DATA_PATH"
    UTILS_MODE: "$UTILS_MODE"
    UTILS_ENABLE: "$UTILS_ENABLE"
    TEST_UTILS_CMD: "$CLUSTER1_TEST_UTILS_CMD"
    TEST_MODE: "$CLUSTER1_TEST_MODE"
    VERBOSE: "$CLUSTER1_VERBOSE"
    DRY_RUN: "$CLUSTER1_DRY_RUN"
  allow_failure: true
  rules:
    - if: '$UTILS_ENABLE == "true" && $CLUSTERS =~ /cluster1/'
      when: on_success
