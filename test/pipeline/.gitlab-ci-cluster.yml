# ---------------------------------------------------------------------------
# Omnia Single-Cluster Child Pipeline
# ---------------------------------------------------------------------------
# Triggered by the parent pipeline (.gitlab-ci.yml) with CLUSTER and
# PIPELINE_MODE variables. Supports three modes:
#
#   PIPELINE_MODE=default  ->  Full cycle (setup + cleanup + deploy + tests)
#   PIPELINE_MODE=deploy   ->  Deploy only (domain playbooks)
#   PIPELINE_MODE=cleanup  ->  Tear down all omnia domain state
#
# Domain selection (mandatory):
#   DOMAIN=default             ->  All domains
#   DOMAIN=repo_manager        ->  Only repo_manager
#   DOMAIN=image_build_manager ->  Only image_build_manager
#   DOMAIN=orchestrator        ->  Only orchestrator
#
# Stage control variables:
#   ENABLE_SETUP=true      ->  Force setup_environment in deploy/cleanup modes
#   TEST_MODE=true         ->  Enable test stages (test_omnia_installation + per-domain)
#   DRY_RUN=true           ->  Log commands without executing ansible playbooks
#   VERBOSE=true           ->  Run ansible playbooks with -vvv instead of -v
#
# Per-stage ansible tags (optional):
#   REPO_MANAGER_TAGS, IMAGE_BUILD_MANAGER_TAGS, ORCHESTRATOR_TAGS
#   CLEANUP_REPO_MANAGER_TAGS, CLEANUP_IMAGE_BUILD_TAGS, CLEANUP_ORCHESTRATOR_TAGS
#
# Repository layout:
#   clusters/<name>/cluster.env           -> connection details
#   clusters/<name>/Inputs/omnia.env      -> Omnia environment config
#   clusters/<name>/Inputs/<domain>/      -> Domain input files
#   clusters/<name>/catalogs/             -> Catalog files (optional)
#
# Default mode stages (full cycle):
#   1. initialization          -> Load cluster config, validate connectivity
#   2. setup_environment       -> Clone repo, copy omnia.env, setup venv
#   3. cleanup_repo_manager    -> repo_manager --tags cleanup
#   4. cleanup_image_build     -> image_build_manager --tags cleanup
#   5. cleanup_orchestrator    -> cleanup_orchestrator.yml standalone
#   6. cleanup_omnia           -> omnia.sh --cleanup --all
#   7. test_installation       -> Validate omnia setup via test framework
#   8. repo_manager            -> Copy inputs, encrypt creds, run playbook
#   9. test_repo_manager       -> Run repo_manager validation tests
#  10. image_build_manager     -> Copy inputs, encrypt creds, run playbook
#  11. test_image_build_manager -> Run image_build_manager validation tests
#  12. orchestrator            -> Copy inputs, encrypt creds, run playbook
#  13. test_orchestrator       -> Run orchestrator validation tests
#  14. summary                 -> Pipeline report + email
#
# VENV GATE: Every domain stage verifies that /opt/omnia/venv and
#            /opt/omnia/activate-omnia.sh exist on the target before
#            running. If either is missing the job fails immediately.
# ---------------------------------------------------------------------------

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
      when: always

variables:
  SSH_CONNECT_TIMEOUT: "30"
  OMNIA_REPO: "https://github.com/dell/omnia.git"
  OMNIA_BRANCH: "main"
  OMNIA_INSTALL_PATH: "/root/omnia"
  PIPELINE_VERSION: "3.0"
  # Credential files are stored as GitLab CI/CD File Type Variables.
  # Naming convention: <CLUSTER_PREFIX>_<CRED_NAME>
  #   e.g. CLUSTER1_REPO_MANAGER_CREDS, CLUSTER2_IMAGE_BUILD_CREDS
  # See README.md for full setup instructions.

stages:
  - initialization
  - setup_environment
  - cleanup_repo_manager
  - cleanup_image_build
  - cleanup_orchestrator
  - cleanup_omnia
  - test_installation
  - repo_manager
  - test_repo_manager
  - image_build_manager
  - test_image_build_manager
  - orchestrator
  - test_orchestrator
  - summary

# ===========================  VENV GATE  ====================================
# Every domain stage sources target.env, refreshes input files from the
# latest branch commit, re-copies omnia.env, and then GATES on the omnia
# venv.  If /opt/omnia/venv or /opt/omnia/activate-omnia.sh is missing the
# job fails immediately with a clear error.
# initialization and setup_environment override this with before_script: [].
# ---------------------------------------------------------------------------
default:
  before_script:
    - |
      if [ -f target.env ]; then
        source target.env
        export SSHPASS="$TARGET_PASS"
        SCP_CMD="sshpass -e scp -o StrictHostKeyChecking=no"
        SSH_CMD="sshpass -e ssh -o StrictHostKeyChecking=no"
        TARGET="$TARGET_USER@$TARGET_IP"

        # Fetch latest changes from the branch so retries see new commits
        echo "Refreshing input files from latest branch commit"
        git fetch origin "$CI_COMMIT_REF_NAME" 2>/dev/null && \
          git checkout "origin/$CI_COMMIT_REF_NAME" -- clusters/ 2>/dev/null || true

        # Re-copy cluster-specific omnia.env to the cloned omnia repo
        if [ -f "$CI_PROJECT_DIR/clusters/$CLUSTER/Inputs/omnia.env" ]; then
          echo "Syncing cluster-specific omnia.env to target server"
          $SCP_CMD $CI_PROJECT_DIR/clusters/$CLUSTER/Inputs/omnia.env \
            $TARGET:$OMNIA_INSTALL_PATH/src/main/omnia.env 2>/dev/null || true
        fi

        # GATE: venv and activate-omnia.sh MUST exist
        echo "Verifying omnia venv on target"
        $SSH_CMD $TARGET "
          if [ ! -d /opt/omnia/venv ]; then
            echo 'ERROR: /opt/omnia/venv directory not found on target'
            echo 'Run setup_environment stage first or verify omnia.sh -s completed'
            exit 1
          fi
          if [ ! -f /opt/omnia/activate-omnia.sh ]; then
            echo 'ERROR: /opt/omnia/activate-omnia.sh not found on target'
            echo 'Run setup_environment stage first or verify omnia.sh -s completed'
            exit 1
          fi
          source /opt/omnia/activate-omnia.sh
          echo 'Omnia venv verified and active'
        "
      fi

# ===========================  INITIALIZATION  ==============================
# Shared by all pipeline modes.
# Loads cluster config, validates SSH, writes target.env for later stages.
# ---------------------------------------------------------------------------
initialization:
  stage: initialization
  rules:
    - if: '$PIPELINE_MODE == "default" || $PIPELINE_MODE == "cleanup" || $PIPELINE_MODE == "deploy"'
      when: on_success
  allow_failure: false
  timeout: 3h
  before_script: []
  script:
    - echo "========================================================"
    - echo "  Omnia Pipeline v${PIPELINE_VERSION} — Initialization"
    - echo "  Cluster — ${CLUSTER}"
    - echo "  Mode    — ${PIPELINE_MODE}"
    - echo "  Domain  — ${DOMAIN}"
    - echo "  Setup   — ${ENABLE_SETUP}"
    - echo "  Test    — ${TEST_MODE}"
    - echo "  DryRun  — ${DRY_RUN}"
    - echo "  Verbose — ${VERBOSE}"
    - echo "========================================================"

    # Load cluster configuration
    - echo "Loading cluster configuration for $CLUSTER"
    - source clusters/$CLUSTER/cluster.env

    # Expand GitLab CI/CD variable references (e.g. $CLUSTER1_TARGET_PASS)
    - |
      TARGET_PASS=$(eval echo "$TARGET_PASS")
      TARGET_USER=$(eval echo "$TARGET_USER")
      TARGET_IP=$(eval echo "$TARGET_IP")

    - echo "Cluster Name  - $CLUSTER_NAME"
    - echo "Target IP     - $TARGET_IP"
    - echo "Target User   - $TARGET_USER"
    - echo "Omnia Repo    - $OMNIA_REPO"
    - echo "Omnia Branch  - $OMNIA_BRANCH"
    - echo "Install Path  - $OMNIA_INSTALL_PATH"

    # Validate input files
    - echo "Validating input files"
    - 'test -f "clusters/$CLUSTER/Inputs/omnia.env" || { echo "ERROR: clusters/$CLUSTER/Inputs/omnia.env not found"; exit 1; }'
    - 'test -f "clusters/$CLUSTER/cluster.env" || { echo "ERROR: clusters/$CLUSTER/cluster.env not found"; exit 1; }'

    # Test SSH connectivity to target cluster
    - echo "Testing SSH connectivity to $TARGET_IP"
    - export SSHPASS="$TARGET_PASS"
    - SSH_CMD="sshpass -e ssh -o StrictHostKeyChecking=no"
    - rm -f ~/.ssh/known_hosts
    - ssh-keygen -R $TARGET_IP || true
    - $SSH_CMD -o ConnectTimeout=$SSH_CONNECT_TIMEOUT $TARGET_USER@$TARGET_IP "echo SSH connection successful"

    # Write env file for later stages
    - echo "Writing target.env for downstream stages"
    - echo "TARGET_IP=$TARGET_IP" > target.env
    - echo "TARGET_USER=$TARGET_USER" >> target.env
    - echo "TARGET_PASS=$TARGET_PASS" >> target.env
    - echo "CLUSTER_NAME=$CLUSTER_NAME" >> target.env

    # Record pipeline trigger time
    - |
      python3 -c "from datetime import datetime; \
      open('pipeline_time.env', 'w').write(f'PIPELINE_TRIGGER_TIME={datetime.now().strftime(\"%Y-%m-%d_%H-%M-%S\")}\n')"

    - cat target.env
    - cat pipeline_time.env
    - echo "Initialization complete"
  artifacts:
    paths:
      - target.env
      - pipeline_time.env
    when: always

# ========================  SETUP ENVIRONMENT  ==============================
# Optional stage — runs automatically in "default" mode, or when
# ENABLE_SETUP=true in deploy/cleanup modes.
# Clones the omnia repo on the target, copies omnia.env, runs omnia.sh -s.
# Deploy/default mode also copies the cluster-specific catalog file.
# ---------------------------------------------------------------------------
setup_environment:
  stage: setup_environment
  timeout: 3h
  before_script: []
  rules:
    - if: '$PIPELINE_MODE == "default"'
      when: on_success
    - if: '$ENABLE_SETUP == "true"'
      when: on_success
  needs:
    - job: initialization
      artifacts: true
  script:
    - echo "========================================================"
    - echo "  Setting up Omnia environment on cluster $CLUSTER"
    - echo "  Mode — ${PIPELINE_MODE}"
    - echo "========================================================"
    - source target.env
    - export SSHPASS="$TARGET_PASS"
    - SSH_CMD="sshpass -e ssh -o StrictHostKeyChecking=no"
    - SCP_CMD="sshpass -e scp -o StrictHostKeyChecking=no"
    - TARGET="$TARGET_USER@$TARGET_IP"

    # Step 1: Verify SSH connectivity
    - echo "Step 1 - Testing SSH connectivity"
    - rm -f ~/.ssh/known_hosts
    - ssh-keygen -R $TARGET_IP || true
    - $SSH_CMD -o ConnectTimeout=$SSH_CONNECT_TIMEOUT $TARGET "echo SSH connection successful"

    # Step 2: Ensure git is installed on target
    - echo "Step 2 - Checking if git is installed on target server"
    - $SSH_CMD $TARGET "command -v git || (dnf install -y git || yum install -y git || apt-get install -y git)"

    # Step 3: Remove any existing omnia repo on target
    - echo "Step 3 - Removing any existing omnia repo at $OMNIA_INSTALL_PATH"
    - $SSH_CMD $TARGET "if [ -d $OMNIA_INSTALL_PATH ]; then rm -rf $OMNIA_INSTALL_PATH; fi"

    # Step 4: Clone the omnia repo on the target server
    - echo "Step 4 - Cloning omnia repo on target server"
    - echo "  Repo   - $OMNIA_REPO"
    - echo "  Branch - $OMNIA_BRANCH"
    - echo "  Path   - $OMNIA_INSTALL_PATH"
    - $SSH_CMD $TARGET "cd $(dirname $OMNIA_INSTALL_PATH) && git clone -b $OMNIA_BRANCH $OMNIA_REPO $(basename $OMNIA_INSTALL_PATH)"

    # Step 5: Copy cluster-specific omnia.env to the cloned repo
    - echo "Step 5 - Copying cluster-specific omnia.env to target omnia repo"
    - $SCP_CMD $CI_PROJECT_DIR/clusters/$CLUSTER/Inputs/omnia.env $TARGET:$OMNIA_INSTALL_PATH/src/main/omnia.env
    - echo "  Verifying omnia.env on target"
    - $SSH_CMD $TARGET "ls -la $OMNIA_INSTALL_PATH/src/main/omnia.env"

    # Step 6: Run omnia.sh --setup-venv to create venv and install deps
    - echo "Step 6 - Running omnia.sh -s (setup venv)"
    - $SSH_CMD $TARGET "cd $OMNIA_INSTALL_PATH/src/main && chmod +x omnia.sh && ./omnia.sh -s"

    # Step 7: Activate the omnia venv and verify
    - echo "Step 7 - Activating and verifying omnia venv"
    - |
      $SSH_CMD $TARGET "
        source /opt/omnia/activate-omnia.sh && \
        echo 'Omnia venv activated successfully' && \
        python3 --version && \
        pip list --format=columns | head -20 && \
        echo 'Ansible version:' && \
        ansible --version | head -1
      "

    # Step 8: Copy cluster-specific catalog (deploy/default mode only)
    - |
      echo "Step 8 - Checking if catalog copy is needed"
      echo "  PIPELINE_MODE = $PIPELINE_MODE"
      if [ "$PIPELINE_MODE" = "deploy" ] || [ "$PIPELINE_MODE" = "default" ]; then
        echo "Step 8 - Copying catalog file to OMNIA_DATA_PATH/catalog/"
        OMNIA_DATA_PATH=$($SSH_CMD $TARGET "
          source /opt/omnia/activate-omnia.sh && echo \$OMNIA_DATA_PATH
        " | tail -1)
        echo "  OMNIA_DATA_PATH = $OMNIA_DATA_PATH"
        if [ -z "$OMNIA_DATA_PATH" ]; then
          echo "ERROR: Could not determine OMNIA_DATA_PATH from target"
          exit 1
        fi
        # Create catalog directory on target
        $SSH_CMD $TARGET "mkdir -p $OMNIA_DATA_PATH/catalog"
        # Copy catalog file if it exists in the pipeline
        CATALOG_PATH="$CI_PROJECT_DIR/clusters/$CLUSTER/catalogs/catalog_rhel.json"
        echo "  Looking for catalog at: $CATALOG_PATH"
        if [ -f "$CATALOG_PATH" ]; then
          echo "  Found catalog file, copying..."
          $SCP_CMD "$CATALOG_PATH" $TARGET:$OMNIA_DATA_PATH/catalog/catalog_rhel.json || {
            echo "ERROR: Failed to copy catalog file"
            exit 1
          }
          echo "  Catalog copied to $OMNIA_DATA_PATH/catalog/catalog_rhel.json"
          $SSH_CMD $TARGET "ls -la $OMNIA_DATA_PATH/catalog/"
        else
          echo "  WARNING: No catalog file found at $CATALOG_PATH"
          echo "  Available files:"
          ls -la "$CI_PROJECT_DIR/clusters/$CLUSTER/catalogs/" || echo "  catalogs directory not found"
        fi
      else
        echo "Step 8 - Skipping catalog copy (cleanup mode)"
      fi

    - echo "========================================================"
    - echo "  Environment setup completed for cluster $CLUSTER"
    - echo "========================================================"

# =========================================================================
#                        C L E A N U P   P I P E L I N E
# =========================================================================
# Cleanup stages run when PIPELINE_MODE is "cleanup" or "default".
# Each domain cleanup is its own stage so failures are isolated and visible.
# Domain cleanups are non-fatal (allow_failure) — first run has nothing to
# clean.
# =========================================================================

# ========================  CLEANUP: REPO MANAGER  ==========================
# Uses --tags cleanup which triggers cleanup_pulp and cleanup_repos plays
# (gated behind the 'never' tag by default).
# -e flags auto-approve credential and log deletion (no prompts).
# ---------------------------------------------------------------------------
cleanup_repo_manager:
  stage: cleanup_repo_manager
  timeout: 3h
  allow_failure: true
  rules:
    - if: '($PIPELINE_MODE == "cleanup" || $PIPELINE_MODE == "default") && ($DOMAIN == "default" || $DOMAIN == "repo_manager")'
      when: on_success
  needs:
    - job: setup_environment
      artifacts: true
      optional: true
    - job: initialization
      artifacts: true
  script:
    - echo "========================================================"
    - echo "  Cleanup — repo_manager on cluster $CLUSTER"
    - echo "========================================================"
    - source target.env
    - export SSHPASS="$TARGET_PASS"
    - SSH_CMD="sshpass -e ssh -o StrictHostKeyChecking=no"
    - TARGET="$TARGET_USER@$TARGET_IP"
    - 'ANSIBLE_VERBOSITY=$( [ "$VERBOSE" = "true" ] && echo "-vvv" || echo "-v" )'

    - echo "Running repo_manager cleanup"
    - 'TAGS_FLAG=$( [ -n "$CLEANUP_REPO_MANAGER_TAGS" ] && echo "--tags $CLEANUP_REPO_MANAGER_TAGS" || echo "" )'
    - echo "  Tags: ${CLEANUP_REPO_MANAGER_TAGS:-<none>}"
    - |
      if [ "$DRY_RUN" = "true" ]; then
        echo "DRY_RUN: Would execute repo_manager.yml $TAGS_FLAG on $TARGET"
      else
        $SSH_CMD $TARGET "
          source /opt/omnia/activate-omnia.sh
          cd $OMNIA_INSTALL_PATH/src/repo_manager/playbooks/
          ansible-playbook repo_manager.yml $TAGS_FLAG \
            -e cleanup_credentials=true -e cleanup_logs=true $ANSIBLE_VERBOSITY
        " || echo 'repo_manager cleanup skipped (no previous state or not applicable)'
      fi

    - echo "========================================================"
    - echo "  repo_manager cleanup completed for cluster $CLUSTER"
    - echo "========================================================"

# ====================  CLEANUP: IMAGE BUILD MANAGER  =======================
# Uses --tags cleanup which triggers cleanup_image_build_manager.yml
# (gated behind the 'never' tag by default).
# ---------------------------------------------------------------------------
cleanup_image_build_manager:
  stage: cleanup_image_build
  timeout: 3h
  allow_failure: true
  rules:
    - if: '($PIPELINE_MODE == "cleanup" || $PIPELINE_MODE == "default") && ($DOMAIN == "default" || $DOMAIN == "image_build_manager")'
      when: on_success
  needs:
    - job: cleanup_repo_manager
      artifacts: true
      optional: true
    - job: initialization
      artifacts: true
  script:
    - echo "========================================================"
    - echo "  Cleanup — image_build_manager on cluster $CLUSTER"
    - echo "========================================================"
    - source target.env
    - export SSHPASS="$TARGET_PASS"
    - SSH_CMD="sshpass -e ssh -o StrictHostKeyChecking=no"
    - TARGET="$TARGET_USER@$TARGET_IP"
    - 'ANSIBLE_VERBOSITY=$( [ "$VERBOSE" = "true" ] && echo "-vvv" || echo "-v" )'

    - echo "Running image_build_manager cleanup"
    - 'TAGS_FLAG=$( [ -n "$CLEANUP_IMAGE_BUILD_TAGS" ] && echo "--tags $CLEANUP_IMAGE_BUILD_TAGS" || echo "" )'
    - echo "  Tags: ${CLEANUP_IMAGE_BUILD_TAGS:-<none>}"
    - |
      if [ "$DRY_RUN" = "true" ]; then
        echo "DRY_RUN: Would execute image_build_manager.yml $TAGS_FLAG on $TARGET"
      else
        $SSH_CMD $TARGET "
          source /opt/omnia/activate-omnia.sh
          cd $OMNIA_INSTALL_PATH/src/image_build_manager/playbooks
          ansible-playbook image_build_manager.yml $TAGS_FLAG $ANSIBLE_VERBOSITY
        " || echo 'image_build_manager cleanup skipped (no previous state or not applicable)'
      fi

    - echo "========================================================"
    - echo "  image_build_manager cleanup completed for cluster $CLUSTER"
    - echo "========================================================"

# ======================  CLEANUP: ORCHESTRATOR  ============================
# orchestrator.yml does not define a cleanup tag, so the standalone
# cleanup playbook at playbooks/cleanup/cleanup_orchestrator.yml is used.
# ---------------------------------------------------------------------------
cleanup_orchestrator:
  stage: cleanup_orchestrator
  timeout: 3h
  allow_failure: true
  rules:
    - if: '($PIPELINE_MODE == "cleanup" || $PIPELINE_MODE == "default") && ($DOMAIN == "default" || $DOMAIN == "orchestrator")'
      when: on_success
  needs:
    - job: cleanup_image_build_manager
      artifacts: true
      optional: true
    - job: initialization
      artifacts: true
  script:
    - echo "========================================================"
    - echo "  Cleanup — orchestrator on cluster $CLUSTER"
    - echo "========================================================"
    - source target.env
    - export SSHPASS="$TARGET_PASS"
    - SSH_CMD="sshpass -e ssh -o StrictHostKeyChecking=no"
    - TARGET="$TARGET_USER@$TARGET_IP"
    - 'ANSIBLE_VERBOSITY=$( [ "$VERBOSE" = "true" ] && echo "-vvv" || echo "-v" )'

    - echo "Running orchestrator cleanup"
    - 'TAGS_FLAG=$( [ -n "$CLEANUP_ORCHESTRATOR_TAGS" ] && echo "--tags $CLEANUP_ORCHESTRATOR_TAGS" || echo "" )'
    - echo "  Tags: ${CLEANUP_ORCHESTRATOR_TAGS:-<none>}"
    - |
      if [ "$DRY_RUN" = "true" ]; then
        echo "DRY_RUN: Would execute cleanup_orchestrator.yml $TAGS_FLAG on $TARGET"
      else
        $SSH_CMD $TARGET "
          source /opt/omnia/activate-omnia.sh
          cd $OMNIA_INSTALL_PATH/src/orchestrator/playbooks/cleanup
          ansible-playbook cleanup_orchestrator.yml $TAGS_FLAG $ANSIBLE_VERBOSITY
        " || echo 'orchestrator cleanup skipped (no previous state or not applicable)'
      fi

    - echo "========================================================"
    - echo "  orchestrator cleanup completed for cluster $CLUSTER"
    - echo "========================================================"

# ========================  CLEANUP: OMNIA.SH  ==============================
# Full omnia cleanup — destroys venv, /opt/omnia/, /etc/omnia/.
# The git repo at $OMNIA_INSTALL_PATH is NOT removed.
# After this stage the venv is gone; no rebuild is performed (cleanup is
# the final goal).
# ---------------------------------------------------------------------------
cleanup_omnia:
  stage: cleanup_omnia
  timeout: 3h
  rules:
    - if: '$PIPELINE_MODE == "cleanup" || $PIPELINE_MODE == "default"'
      when: on_success
  needs:
    - job: cleanup_orchestrator
      artifacts: true
      optional: true
    - job: initialization
      artifacts: true
  script:
    - echo "========================================================"
    - echo "  Cleanup — omnia.sh --cleanup --all on cluster $CLUSTER"
    - echo "========================================================"
    - source target.env
    - export SSHPASS="$TARGET_PASS"
    - SSH_CMD="sshpass -e ssh -o StrictHostKeyChecking=no"
    - TARGET="$TARGET_USER@$TARGET_IP"

    - echo "Running omnia.sh --cleanup --all"
    - |
      if [ "$DRY_RUN" = "true" ]; then
        echo "DRY_RUN: Would execute omnia.sh --cleanup --all on $TARGET"
      else
        $SSH_CMD $TARGET "
          source /opt/omnia/activate-omnia.sh 2>/dev/null || true
          cd $OMNIA_INSTALL_PATH/src/main
          echo 'yes' | ./omnia.sh --cleanup --all
        " || echo 'WARNING: omnia.sh --cleanup --all reported errors (continuing)'
      fi

    # Verify cleanup removed the venv
    - echo "Verifying cleanup removed omnia artifacts"
    - |
      if [ "$DRY_RUN" != "true" ]; then
        $SSH_CMD $TARGET "
          if [ -d /opt/omnia/venv ]; then
            echo 'WARNING: /opt/omnia/venv still exists after cleanup'
          else
            echo 'Confirmed: /opt/omnia/venv removed'
          fi
          if [ -f /opt/omnia/activate-omnia.sh ]; then
            echo 'WARNING: /opt/omnia/activate-omnia.sh still exists after cleanup'
          else
            echo 'Confirmed: /opt/omnia/activate-omnia.sh removed'
          fi
        "
      fi

    - echo "========================================================"
    - echo "  omnia.sh cleanup completed for cluster $CLUSTER"
    - echo "========================================================"

# =========================================================================
#                        D E P L O Y   P I P E L I N E
# =========================================================================
# Deploy stages run when PIPELINE_MODE is "deploy" or "default".
# The test_installation stage validates the omnia setup before running
# domain playbooks. Domain stages copy inputs, encrypt credentials,
# and run the Ansible playbooks.
# Per-domain test stages (test_repo_manager, test_image_build_manager,
# test_orchestrator) run after each deploy stage when TEST_MODE=true.
# =========================================================================

# ======================  TEST OMNIA INSTALLATION  ==========================
# Validates the omnia.sh installation using the test framework at
# $OMNIA_INSTALL_PATH/test/main/.
#
# Sequence:
#   1. Run setup_env.sh to install the test venv (separate from omnia venv)
#   2. Activate the test venv
#   3. Run run_validation.sh all verify (all scenarios, verify-only)
#
# The test framework runs in local mode (oim_server_ip is empty) since
# the tests execute directly on the target server where omnia is installed.
# ---------------------------------------------------------------------------
test_omnia_installation:
  stage: test_installation
  timeout: 3h
  rules:
    - if: '($PIPELINE_MODE == "deploy" || $PIPELINE_MODE == "default") && $TEST_MODE == "true"'
      when: on_success
  needs:
    - job: setup_environment
      artifacts: true
      optional: true
    - job: cleanup_omnia
      artifacts: true
      optional: true
    - job: initialization
      artifacts: true
  script:
    - echo "========================================================"
    - echo "  Testing omnia.sh installation on cluster $CLUSTER"
    - echo "========================================================"
    - source target.env
    - export SSHPASS="$TARGET_PASS"
    - SSH_CMD="sshpass -e ssh -o StrictHostKeyChecking=no"
    - SCP_CMD="sshpass -e scp -o StrictHostKeyChecking=no"
    - TARGET="$TARGET_USER@$TARGET_IP"

    # Step 1: Copy test configuration files from pipeline to target
    - echo "Step 1 - Copying test configuration files to target"
    - |
      if [ -f "$CI_PROJECT_DIR/clusters/$CLUSTER/Inputs/test/test_config.yml" ]; then
        $SCP_CMD $CI_PROJECT_DIR/clusters/$CLUSTER/Inputs/test/test_config.yml \
          $TARGET:$OMNIA_INSTALL_PATH/test/main/test_config.yml
        echo "  Copied test_config.yml to $OMNIA_INSTALL_PATH/test/main/"
      else
        echo "WARNING: test_config.yml not found in pipeline — using defaults"
      fi
      
      # Copy test credentials from CI/CD File Variable
      CLUSTER_PREFIX=$(echo "$CLUSTER" | tr '[:lower:]' '[:upper:]')
      CRED_VAR="${CLUSTER_PREFIX}_TEST_CREDS"
      CRED_PATH=$(eval echo "\$$CRED_VAR")
