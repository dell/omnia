          bash setup_env.sh
        else
          echo 'WARNING: setup_env.sh not found — skipping test venv setup'
        fi
      "

    # Step 3: Run orchestrator validation tests
    - echo "Step 3 - Running orchestrator validation tests"
    - |
      if [ "$DRY_RUN" = "true" ]; then
        echo "DRY_RUN: Would execute orchestrator run_validation.sh all verify on $TARGET"
      else
        $SSH_CMD $TARGET "
          cd $OMNIA_INSTALL_PATH/test/orchestrator
          if [ -f run_validation.sh ]; then
            source .venv/bin/activate 2>/dev/null || true
            ./run_validation.sh all verify
          else
            echo 'WARNING: run_validation.sh not found — skipping tests'
          fi
        "
      fi

    - echo "========================================================"
    - echo "  orchestrator tests completed for cluster $CLUSTER"
    - echo "========================================================"

# =========================================================================
#                           S U M M A R Y
# =========================================================================
# Both pipelines end with a summary + email notification stage.
# The cleanup summary depends on cleanup_omnia; the deploy summary
# depends on orchestrator/test_orchestrator.  Both run 'when: always'
# so the report is sent even if earlier stages failed.
# =========================================================================

# ==========================  CLEANUP SUMMARY  ==============================
cleanup_summary:
  stage: summary
  when: always
  allow_failure: true
  before_script: []
  rules:
    - if: '$PIPELINE_MODE == "cleanup" || $PIPELINE_MODE == "default"'
      when: always
  needs:
    - job: initialization
      artifacts: true
    - job: cleanup_omnia
      artifacts: true
      optional: true
  script:
    - echo "========================================================"
    - echo "  Cleanup Summary — cluster $CLUSTER"
    - echo "========================================================"
    - source target.env
    - source pipeline_time.env
    - mkdir -p pipeline_reports
    - |
      cat > pipeline_reports/pipeline_summary.txt << EOF
      ========================================
      Omnia Pipeline Execution Summary
      ========================================
      Mode:             CLEANUP
      Cluster Name:     $CLUSTER_NAME
      Cluster IP:       $TARGET_IP
      Pipeline ID:      $CI_PIPELINE_ID
      Pipeline URL:     $CI_PIPELINE_URL
      Project:          $CI_PROJECT_NAME
      Branch:           $CI_COMMIT_REF_NAME
      Commit SHA:       $CI_COMMIT_SHA
      Trigger Time:     $PIPELINE_TRIGGER_TIME
      DRY_RUN:          $DRY_RUN

      Stages Executed:
        - initialization
        - setup_environment
        - cleanup_repo_manager
        - cleanup_image_build_manager
        - cleanup_orchestrator
        - cleanup_omnia

      Status: COMPLETED
      ========================================
      EOF
    - echo "Sending email notification"
    - export REPORT_PATH="pipeline_reports/pipeline_summary.txt"
    - python3 send_email.py || echo "Email notification failed (non-fatal)"
    - echo "========================================================"
    - echo "  Cleanup summary completed for cluster $CLUSTER"
    - echo "========================================================"
  artifacts:
    paths:
      - pipeline_reports/
    when: always

# ==========================  DEPLOY SUMMARY  ===============================
deploy_summary:
  stage: summary
  when: always
  allow_failure: true
  before_script: []
  rules:
    - if: '$PIPELINE_MODE == "deploy" || $PIPELINE_MODE == "default"'
      when: always
  needs:
    - job: initialization
      artifacts: true
    - job: orchestrator
      artifacts: true
      optional: true
    - job: test_orchestrator
      artifacts: true
      optional: true
  script:
    - echo "========================================================"
    - echo "  Deploy Summary — cluster $CLUSTER"
    - echo "========================================================"
    - source target.env
    - source pipeline_time.env
    - mkdir -p pipeline_reports
    - |
      cat > pipeline_reports/pipeline_summary.txt << EOF
      ========================================
      Omnia Pipeline Execution Summary
      ========================================
      Mode:             DEPLOY
      Cluster Name:     $CLUSTER_NAME
      Cluster IP:       $TARGET_IP
      Pipeline ID:      $CI_PIPELINE_ID
      Pipeline URL:     $CI_PIPELINE_URL
      Project:          $CI_PROJECT_NAME
      Branch:           $CI_COMMIT_REF_NAME
      Commit SHA:       $CI_COMMIT_SHA
      Trigger Time:     $PIPELINE_TRIGGER_TIME
      TEST_MODE:        $TEST_MODE
      DRY_RUN:          $DRY_RUN

      Stages Executed:
        - initialization
        - setup_environment
        - test_installation
        - repo_manager
        - test_repo_manager (TEST_MODE=$TEST_MODE)
        - image_build_manager
        - test_image_build_manager (TEST_MODE=$TEST_MODE)
        - orchestrator
        - test_orchestrator (TEST_MODE=$TEST_MODE)

      Status: COMPLETED
      ========================================
      EOF
    - echo "Sending email notification"
    - export REPORT_PATH="pipeline_reports/pipeline_summary.txt"
    - python3 send_email.py || echo "Email notification failed (non-fatal)"
    - echo "========================================================"
    - echo "  Deploy summary completed for cluster $CLUSTER"
    - echo "========================================================"
  artifacts:
    paths:
      - pipeline_reports/
    when: always
