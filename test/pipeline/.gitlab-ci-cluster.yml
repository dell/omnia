# ============================  REPO MANAGER  ===============================
# Copies repo_manager input files from the pipeline to the target,
# encrypts repo_manager_config_credentials.yml, and runs the playbook.
# ---------------------------------------------------------------------------
repo_manager:
  stage: repo_manager
  timeout: 3h
  rules:
    - if: '($PIPELINE_MODE == "deploy" || $PIPELINE_MODE == "default") && ($DOMAIN == "default" || $DOMAIN == "repo_manager")'
      when: on_success
  needs:
    - job: setup_environment
      artifacts: true
      optional: true
    - job: initialization
      artifacts: true
  script:
    - echo "========================================================"
    - echo "  Running repo_manager on cluster $CLUSTER"
    - echo "========================================================"
    - source target.env
    - source pipeline_time.env
    - export SSHPASS="$TARGET_PASS"
    - SSH_CMD="sshpass -e ssh -o StrictHostKeyChecking=no"
    - SCP_CMD="sshpass -e scp -o StrictHostKeyChecking=no"
    - TARGET="$TARGET_USER@$TARGET_IP"
    - STAGE_RC=0
    - 'ANSIBLE_VERBOSITY=$( [ "$VERBOSE" = "true" ] && echo "-vvv" || echo "-v" )'

    # Step 1: Read OMNIA_DATA_PATH and OMNIA_PROJECT_NAME from target
    - echo "Step 1 - Resolving OMNIA_DATA_PATH and OMNIA_PROJECT_NAME"
    - |
      ENV_VARS=$($SSH_CMD $TARGET "
        source /opt/omnia/activate-omnia.sh
        echo \$OMNIA_DATA_PATH
        echo \$OMNIA_PROJECT_NAME
      ")
      OMNIA_DATA_PATH=$(echo "$ENV_VARS" | tail -2 | head -1)
      OMNIA_PROJECT_NAME=$(echo "$ENV_VARS" | tail -1)
      OMNIA_PROJECT_NAME="${OMNIA_PROJECT_NAME:-project_default}"
      INPUT_DIR="$OMNIA_DATA_PATH/repo_manager/input/$OMNIA_PROJECT_NAME"
      echo "  OMNIA_DATA_PATH    = $OMNIA_DATA_PATH"
      echo "  OMNIA_PROJECT_NAME = $OMNIA_PROJECT_NAME"
      echo "  INPUT_DIR          = $INPUT_DIR"

    # Step 2: Create input directory and copy repo_manager input files
    - echo "Step 2 - Copying repo_manager input files to target"
    - |
      $SSH_CMD $TARGET "mkdir -p $INPUT_DIR"
      if [ -d "$CI_PROJECT_DIR/clusters/$CLUSTER/Inputs/repo_manager" ]; then
        $SCP_CMD -r $CI_PROJECT_DIR/clusters/$CLUSTER/Inputs/repo_manager/. $TARGET:$INPUT_DIR/
        echo "  Copied repo_manager input files to $INPUT_DIR/"
        $SSH_CMD $TARGET "ls -la $INPUT_DIR/"
      else
        echo "ERROR: clusters/$CLUSTER/Inputs/repo_manager/ not found"
        exit 1
      fi

    # Step 3: Copy credential file from CI/CD File Variable
    - echo "Step 3 - Copying credential file from CI/CD variable"
    - |
      # Derive variable name: cluster1 -> CLUSTER1_REPO_MANAGER_CREDS
      CLUSTER_PREFIX=$(echo "$CLUSTER" | tr '[:lower:]' '[:upper:]')
      CRED_VAR="${CLUSTER_PREFIX}_REPO_MANAGER_CREDS"
      CRED_PATH=$(eval echo "\$$CRED_VAR")
      if [ -n "$CRED_PATH" ] && [ -f "$CRED_PATH" ]; then
        $SCP_CMD "$CRED_PATH" $TARGET:$INPUT_DIR/repo_manager_config_credentials.yml 2>/dev/null
        echo "  Credential file copied to target"
      else
        echo "ERROR: CI/CD File Variable $CRED_VAR not set or file not found"
        echo "  Go to Settings > CI/CD > Variables and add $CRED_VAR as File type"
        exit 1
      fi

    # Step 4: Encrypt repo_manager_config_credentials.yml with ansible-vault
    - echo "Step 4 - Encrypting repo_manager_config_credentials.yml"
    - |
      $SSH_CMD $TARGET "
        source /opt/omnia/activate-omnia.sh
        VAULT_KEY='$INPUT_DIR/.repo_manager_config_credentials_key'
        CRED_FILE='$INPUT_DIR/repo_manager_config_credentials.yml'
        if [ -f \"\$CRED_FILE\" ]; then
          # Check if already encrypted
          if head -n1 \"\$CRED_FILE\" | grep -q '\$ANSIBLE_VAULT;'; then
            echo 'Credential file is already encrypted'
          else
            # Generate vault key if it does not exist
            if [ ! -f \"\$VAULT_KEY\" ]; then
              openssl rand -base64 32 > \"\$VAULT_KEY\"
              chmod 600 \"\$VAULT_KEY\"
              echo 'Generated vault key'
            fi
            ansible-vault encrypt --vault-password-file=\"\$VAULT_KEY\" \"\$CRED_FILE\"
            echo 'Credential file encrypted successfully'
          fi
        else
          echo 'WARNING: repo_manager_config_credentials.yml not found — skipping encryption'
        fi
      "

    # Step 5: Run repo_manager.yml playbook
    - echo "Step 5 - Running repo_manager.yml playbook"
    - 'TAGS_FLAG=$( [ -n "$REPO_MANAGER_TAGS" ] && echo "--tags $REPO_MANAGER_TAGS" || echo "" )'
    - echo "  Tags: ${REPO_MANAGER_TAGS:-<none>}"
    - |
      if [ "$DRY_RUN" = "true" ]; then
        echo "DRY_RUN: Would execute repo_manager.yml $TAGS_FLAG $ANSIBLE_VERBOSITY on $TARGET"
      else
        $SSH_CMD $TARGET "
          source /opt/omnia/activate-omnia.sh
          cd $OMNIA_INSTALL_PATH/src/repo_manager
          ansible-playbook playbooks/repo_manager.yml $TAGS_FLAG $ANSIBLE_VERBOSITY
        " || STAGE_RC=$?
      fi

    - |
      if [ "$STAGE_RC" -ne 0 ]; then
        echo "ERROR: repo_manager playbook failed (exit code: $STAGE_RC)"
        exit 1
      fi
      echo "repo_manager completed successfully for cluster $CLUSTER"

