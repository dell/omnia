# ---------------------------------------------------------------------------
# Omnia Utils Child Pipeline  (GENERATED by pipeline_render.py, do not edit)
# ---------------------------------------------------------------------------
# Triggered by the parent pipeline (.gitlab-ci.yml) when UTILS_ENABLE is true.
#
#   initialization: clone Omnia on the OIM, take the helpers from it, checks, commit, omnia.env
#   setup_utils: omnia.sh -s, then the inputs of the utils domain
#   UTILS_MODE=install_os        -> install_os: ./omnia.sh --run utils --tags install_os
#   UTILS_MODE=default_logs      -> log_collection_cluster (--tags collect) and
#                                   log_collection_oim (--tags backup_oim_logs)
#   UTILS_MODE=collect           -> log_collection_cluster
#   UTILS_MODE=backup_oim_logs   -> log_collection_oim
#   test_utils: fvt_utils verify (TEST_MODE=true), then summary
#
# A failed stage stops the pipeline (the later stages are skipped); a failed test does not.
# summary fails the pipeline when any job failed and sends the report. The test run writes the
# pipeline's one report, <report_path>/<pipeline id>_omnia_fvt_pipeline_report.html.
# SKIP_STAGES: comma or space separated words, matched exactly: a stage name or test.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
      when: always

variables:
  SSH_CONNECT_TIMEOUT: '30'
  PIPELINE_VERSION: '4.0'
  PIPELINE_KIND: 'utils'
  SKIP_STAGES: ''
  TEST_UTILS_CMD: './run_validation.sh fvt_utils verify'

stages:
  - initialization
  - setup_utils
  - install_os
  - log_collection_cluster
  - log_collection_oim
  - test_utils
  - summary

default:
  retry:
    max: 1
    when:
      - runner_system_failure
      - api_failure
      - scheduler_failure
  before_script:
    - 'git fetch origin "$CI_COMMIT_REF_NAME" 2>/dev/null && git checkout "origin/$CI_COMMIT_REF_NAME" -- clusters/ 2>/dev/null || true'
  after_script:
    - 'mkdir -p "pipeline_job_status/$CI_PIPELINE_ID"'
    - 'printf ''{"name":"%s","status":"%s","url":"%s"}\n'' "$CI_JOB_NAME" "$CI_JOB_STATUS" "$CI_JOB_URL" >
      "pipeline_job_status/$CI_PIPELINE_ID/$CI_JOB_NAME.json"'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - pipeline_job_status/
      - pipeline_job_logs/
      - pipeline_reports/

initialization:
  stage: initialization
  timeout: 3h
  allow_failure: false
  rules:
    - if: '$SKIP_STAGES =~ /(^|[ ,])(initialization)([ ,]|$)/'
      when: never
    - if: '$UTILS_ENABLE == "true"'
      when: on_success
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - pipeline_job_status/
      - pipeline_job_logs/
      - pipeline_reports/
      - ci_tools/
      - actual_commit_sha.txt
  script:
    - |
      python3 - <<'PYEOF'
      import os, re, shlex, subprocess, sys, time
      def fail(message):
          print("ERROR: " + message, file=sys.stderr)
          try:
              os.makedirs("pipeline_job_status/errors", exist_ok=True)
              with open("pipeline_job_status/errors/initialization.txt", "w", encoding="utf-8") as handle:
                  handle.write(message[:600])
          except OSError:
              pass
          sys.exit(1)
      cluster = os.environ.get("CLUSTER", "")
      if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]{0,63}", cluster):
          fail("CLUSTER is empty or not a plain name")
      prefix = cluster.upper().replace("-", "_")
      ip, user, password = (os.environ.get(prefix + "_TARGET_" + n, "") for n in ("IP", "USER", "PASS"))
      if not (ip and user and password):
          fail(prefix + "_TARGET_IP, _TARGET_USER (pipeline_config.yml or CI/CD variables) and _TARGET_PASS "
               "(a protected CI/CD variable: run on a protected branch) must be set")
      repo, branch = os.environ.get("OMNIA_REPO", ""), os.environ.get("OMNIA_BRANCH", "")
      path = os.environ.get("OMNIA_INSTALL_PATH", "/root/omnia").rstrip("/")
      if not re.fullmatch(r"(https?://|git@)[A-Za-z0-9._:/@~+-]+", repo):
          fail("OMNIA_REPO is empty or has unsafe characters")
      if not re.fullmatch(r"[A-Za-z0-9._/-]{1,200}", branch):
          fail("OMNIA_BRANCH is empty or has unsafe characters")
      protected = ("/", "/bin", "/boot", "/dev", "/etc", "/home", "/lib", "/lib64", "/media", "/mnt",
                   "/opt", "/opt/omnia", "/proc", "/root", "/run", "/sbin", "/srv", "/sys", "/tmp",
                   "/usr", "/var")
      if not re.fullmatch(r"/[A-Za-z0-9._/-]+", path) or path in protected:
          fail("OMNIA_INSTALL_PATH '" + path + "' is not a safe folder of its own (e.g. /root/omnia)")
      known = os.environ.get("PIPELINE_SSH_KNOWN_HOSTS") or os.environ.get(prefix + "_SSH_KNOWN_HOSTS")
      if known:
          check = ["-o", "StrictHostKeyChecking=yes", "-o", "UserKnownHostsFile=" + known]
      elif os.environ.get("PIPELINE_SSH_SKIP_HOST_KEY", "").lower() == "true":
          print("WARNING: the OIM host key is not checked (PIPELINE_SSH_SKIP_HOST_KEY=true)")
          check = ["-o", "StrictHostKeyChecking=no", "-o", "UserKnownHostsFile=/dev/null"]
      else:
          fail("the OIM host key is required. HOW TO FIX: setup_gitlab_project.py --update "
               "--scan-host-keys stores " + prefix + "_SSH_KNOWN_HOSTS, or set "
               "PIPELINE_SSH_SKIP_HOST_KEY=true to accept the risk")
      ssh = ["sshpass", "-e", "ssh"] + check + ["-o", "LogLevel=ERROR", "-o", "ServerAliveInterval=30",
             "-o", "ConnectTimeout=" + os.environ.get("SSH_CONNECT_TIMEOUT", "30"), user + "@" + ip]
      env = dict(os.environ, SSHPASS=password)
      q = shlex.quote
      mode = os.environ.get(prefix + "_CHECKOUT_MODE") or os.environ.get("CHECKOUT_MODE") or "update"
      if mode not in ("update", "recreate", "keep"):
          fail("CHECKOUT_MODE must be update, recreate or keep, got " + repr(mode))
      trees = ("/bin", "/boot", "/dev", "/etc", "/lib", "/lib64", "/opt/omnia", "/proc", "/run", "/sbin",
               "/sys", "/usr", "/var")
      if mode == "recreate" and any(path == t or path.startswith(t + "/") for t in trees):
          fail("CHECKOUT_MODE recreate deletes the folder: " + path + " is a system folder, use a "
               "folder of its own")
      recreate = "\n".join([
          'd="$1"',
          'holders() { for p in /proc/[0-9]*; do pid=${p#/proc/}; [ "$pid" = "$$" ] && continue',
          '  cwd=$(readlink "$p/cwd" 2>/dev/null); case "$cwd" in "$d"|"$d"/*) echo "$pid";; esac; done; }',
          'pids=$(holders)',
          'if [ -n "$pids" ]; then echo "stopping what still runs in $d: $(echo $pids)"',
          '  kill -TERM $pids 2>/dev/null; sleep 3; kill -KILL $(holders) 2>/dev/null; sleep 1; fi',
          'for try in 1 2 3 4 5; do rm -rf -- "$d" 2>/dev/null; [ -e "$d" ] || exit 0; sleep 2; done',
          'echo "ERROR: $d could not be deleted. Still running there: $(echo $(holders))"',
          'find "$d" -maxdepth 3 2>/dev/null | head -20; exit 1',
      ])
      qp, qr, qb = q(path), q(repo), q(branch)
      clone = "mkdir -p " + q(os.path.dirname(path)) + " && git clone -b " + qb + " " + qr + " " + qp
      script = {
          "recreate": "bash -c " + q(recreate) + " _ " + qp + " && " + clone,
          "update": ("if [ -d " + qp + "/.git ]; then cd " + qp + " && git remote set-url origin " + qr
                     + " && git fetch origin " + qb + " && git checkout --force -B " + qb
                     + " FETCH_HEAD; else " + clone + "; fi"),
          "keep": "test -d " + qp + "/.git",
      }[mode]
      need = ("command -v git python3 >/dev/null || "
              "{ echo 'git or python3 is missing on the OIM'; exit 127; }\n")
      for attempt in range(1, 6):
          done = subprocess.run(ssh + ["bash", "-s"], input=(need + script + "\n").encode(), env=env,
                                capture_output=True, check=False)
          rc = done.returncode
          out = (done.stdout + done.stderr).decode(errors="replace").replace(password, "********")
          sys.stdout.write(out)
          if rc != 255:
              break
          print("SSH connection failed, retry " + str(attempt) + "/5 in 10s")
          time.sleep(10)
      if rc:
          hints = {5: " - the OIM rejected the password, check the CI/CD variable " + prefix + "_TARGET_PASS",
                   255: " - the OIM did not answer on SSH",
                   127: " - install git and python3 on the OIM (it needs an enabled package repository)"}
          hint = hints.get(rc, "")
          last = ([x for x in out.splitlines() if x.strip()] or [""])[-1][:200]
          fail("checkout (" + mode + ") of " + repo + " (" + branch + ") on the OIM failed (exit code "
               + str(rc) + ")" + hint + (": " + last if last else ""))
      os.makedirs("ci_tools", exist_ok=True)
      pack = subprocess.Popen(ssh + ["tar -C " + q(path) + "/test/pipeline --exclude=__pycache__ -cf - "
                                     "pipeline_ci.py library"], stdout=subprocess.PIPE, env=env)
      subprocess.run(["tar", "-xf", "-", "-C", "ci_tools"], stdin=pack.stdout, check=False)
      pack.stdout.close()
      pack.wait()
      if not os.path.isfile("ci_tools/pipeline_ci.py"):
          fail("the clone has no test/pipeline/pipeline_ci.py. HOW TO FIX: OMNIA_BRANCH of " + repo +
               " must be a branch that has the pipeline helpers")
      print("Checkout (" + mode + ") of " + repo + " (" + branch + ") in " + path + ": took the pipeline helpers from it")
      PYEOF
    - python3 ci_tools/pipeline_ci.py initialize

setup_utils:
  stage: setup_utils
  timeout: 3h
  rules:
    - if: '$SKIP_STAGES =~ /(^|[ ,])(setup_utils)([ ,]|$)/'
      when: never
    - if: '$UTILS_ENABLE == "true"'
      when: on_success
  script:
    - python3 ci_tools/pipeline_ci.py setup-utils

install_os:
  stage: install_os
  timeout: 3h
  variables:
    UTILS_TAGS: 'install_os'
  id_tokens:
    VAULT_ID_TOKEN:
      aud: $BAO_SERVER_URL
  rules:
    - if: '$SKIP_STAGES =~ /(^|[ ,])(install_os|deploy)([ ,]|$)/'
      when: never
    - if: '$UTILS_ENABLE == "true" && $UTILS_MODE == "install_os"'
      when: on_success
  script:
    - python3 ci_tools/pipeline_ci.py deploy utils

log_collection_cluster:
  stage: log_collection_cluster
  timeout: 3h
  variables:
    UTILS_TAGS: 'collect'
  id_tokens:
    VAULT_ID_TOKEN:
      aud: $BAO_SERVER_URL
  rules:
    - if: '$SKIP_STAGES =~ /(^|[ ,])(log_collection_cluster|deploy)([ ,]|$)/'
      when: never
    - if: '$UTILS_ENABLE == "true" && ($UTILS_MODE == "default_logs" || $UTILS_MODE == "collect")'
      when: on_success
  script:
    - python3 ci_tools/pipeline_ci.py deploy utils

log_collection_oim:
  stage: log_collection_oim
  timeout: 3h
  variables:
    UTILS_TAGS: 'backup_oim_logs'
  id_tokens:
    VAULT_ID_TOKEN:
      aud: $BAO_SERVER_URL
  rules:
    - if: '$SKIP_STAGES =~ /(^|[ ,])(log_collection_oim|deploy)([ ,]|$)/'
      when: never
    - if: '$UTILS_ENABLE == "true" && ($UTILS_MODE == "default_logs" || $UTILS_MODE == "backup_oim_logs")'
      when: on_success
  script:
    - python3 ci_tools/pipeline_ci.py deploy utils

test_utils:
  stage: test_utils
  timeout: 3h
  allow_failure: true
  id_tokens:
    VAULT_ID_TOKEN:
      aud: $BAO_SERVER_URL
  rules:
    - if: '$SKIP_STAGES =~ /(^|[ ,])(utils|test_utils|test)([ ,]|$)/'
      when: never
    - if: '$UTILS_ENABLE == "true" && $TEST_MODE == "true"'
      when: on_success
  script:
    - python3 ci_tools/pipeline_ci.py verify utils

summary:
  stage: summary
  timeout: 3h
  allow_failure: false
  variables:
    PIPELINE_JOB_ORDER: "initialization,setup_utils,install_os,log_collection_cluster,log_collection_oim,test_utils"
  needs:
    - job: initialization
      artifacts: true
      optional: true
    - job: setup_utils
      artifacts: true
      optional: true
    - job: install_os
      artifacts: true
      optional: true
    - job: log_collection_cluster
      artifacts: true
      optional: true
    - job: log_collection_oim
      artifacts: true
      optional: true
    - job: test_utils
      artifacts: true
      optional: true
  rules:
    - if: '$SKIP_STAGES =~ /(^|[ ,])(summary)([ ,]|$)/'
      when: never
    - if: '$PIPELINE_MODE == "default" || $PIPELINE_MODE == "cleanup" || $PIPELINE_MODE == "deploy"'
      when: always
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - pipeline_job_status/
      - pipeline_job_logs/
      - pipeline_reports/
      - pipeline_report/
  script:
    - |
      python3 - <<'PYEOF'
      import glob, json, os, re, shutil, smtplib, ssl, subprocess, sys, tempfile
      from email.message import EmailMessage
      if os.path.isfile("ci_tools/pipeline_ci.py"):
          sys.exit(0)
      print("ci_tools is missing: initialization failed before the clone, trying the runner")
      repo, branch = os.environ.get("OMNIA_REPO", ""), os.environ.get("OMNIA_BRANCH", "")
      if (re.fullmatch(r"(https?://|git@)[A-Za-z0-9._:/@~+-]+", repo)
              and re.fullmatch(r"[A-Za-z0-9._/-]{1,200}", branch) and shutil.which("git")):
          work = tempfile.mkdtemp()
          try:
              done = subprocess.run(["git", "clone", "--depth", "1", "-q", "-b", branch, repo, work + "/o"],
                                    capture_output=True, timeout=120,
                                    env=dict(os.environ, GIT_TERMINAL_PROMPT="0"), check=False)
          except subprocess.TimeoutExpired:
              done = None
          src = work + "/o/test/pipeline"
          if done is not None and done.returncode == 0 and os.path.isfile(src + "/pipeline_ci.py"):
              os.makedirs("ci_tools", exist_ok=True)
              shutil.copy(src + "/pipeline_ci.py", "ci_tools/")
              shutil.copytree(src + "/library", "ci_tools/library", dirs_exist_ok=True,
                              ignore=shutil.ignore_patterns("__pycache__"))
              print("helpers fetched on the runner from " + repo + " (" + branch + ")")
              sys.exit(0)
      rows = []
      for name in sorted(glob.glob("pipeline_job_status/**/*.json", recursive=True)):
          try:
              with open(name, encoding="utf-8") as handle:
                  item = json.load(handle)
              rows.append((str(item["name"]), str(item["status"]), str(item.get("url", ""))))
          except (OSError, ValueError, KeyError, TypeError):
              continue
      failed = [r for r in rows if r[1] == "failed"]
      reasons = {}
      for name in glob.glob("pipeline_job_status/errors/*.txt"):
          try:
              with open(name, encoding="utf-8") as handle:
                  reasons[os.path.basename(name)[:-4]] = handle.read().strip()
          except OSError:
              pass
      cluster, mode = os.environ.get("CLUSTER", ""), os.environ.get("PIPELINE_MODE", "")
      lines = ["Pipeline summary, cluster " + cluster + ", mode " + mode, ""]
      lines += ["  %-30s %s" % (n, st) for n, st, _ in rows]
      lines += ["", "Failed: " + (", ".join(n for n, _, _ in failed) or "none")]
      lines += ["  " + n + ": " + u for n, _, u in failed if u]
      lines += ["  reason " + n + ": " + r for n, r in reasons.items()]
      lines += ["", "Pipeline: " + os.environ.get("CI_PIPELINE_URL", ""), "",
                "The full report could not be produced: the pipeline helpers were not available "
                "(initialization failed before the Omnia clone). Open the failed job for the reason."]
      print("\n".join(lines))
      recipients = [r.strip() for r in os.environ.get("EMAIL_RECIPIENTS", "").split(",") if r.strip()]
      server, sender = os.environ.get("SMTP_SERVER", ""), os.environ.get("EMAIL_SENDER", "")
      if recipients and server and sender:
          message = EmailMessage()
          message["From"], message["To"] = sender, ", ".join(recipients)
          message["Subject"] = ("Omnia FVT Pipeline [" + cluster + "] " + mode + " - FAILED ("
                                + ", ".join(n for n, _, _ in failed) + ")")
          message.set_content("\n".join(lines))
          port = int(os.environ.get("SMTP_PORT", "25") or 25)
          try:
              with (smtplib.SMTP_SSL if port == 465 else smtplib.SMTP)(server, port, timeout=60) as smtp:
                  if port == 587:
                      smtp.starttls(context=ssl.create_default_context())
                  if os.environ.get("SMTP_USER") and os.environ.get("SMTP_PASSWORD"):
                      smtp.login(os.environ["SMTP_USER"], os.environ["SMTP_PASSWORD"])
                  smtp.send_message(message)
              print("email sent to " + ", ".join(recipients))
          except (OSError, smtplib.SMTPException) as exc:
              print("ERROR: the summary email was NOT sent: " + type(exc).__name__ + ": " + str(exc))
      else:
          print("email not configured (EMAIL_RECIPIENTS, EMAIL_SENDER, SMTP_SERVER): not sent")
      sys.exit(1)
      PYEOF
    - python3 ci_tools/pipeline_ci.py summary
