# ---------------------------------------------------------------------------
# Omnia Build Stream Child Pipeline  (GENERATED by pipeline_render.py, do not edit)
# ---------------------------------------------------------------------------
# Triggered by the parent pipeline (.gitlab-ci.yml) when BUILD_STREAM_ENABLE is true.
#
# Flow: the cluster pipeline's initialization, cleanup_<domain>, test_cleanup_<domain>,
#   cleanup_omnia, setup_main and test_main_installation, then
#   prepare_base: the credentials of repo_manager, image_build_manager and orchestrator, then
#                 ./omnia.sh --prepare-base
#   test_repo_manager, test_image_build_manager, test_orchestrator: fvt_<domain> prepare verify
#   build_stream: its credentials, then ./omnia.sh --run build_stream (the complete playbook)
#   test_build_stream: fvt_build_stream test, then summary
#
# Every cleanup and every cleanup test runs; if one failed nothing is installed and the pipeline
# goes to summary. A failed prepare_base or build_stream stops the pipeline; a failed test does
# not stop the next stage. summary fails the pipeline when any job failed and sends the report.
# Reports of all test runs are one file, <report_path>/<pipeline id>_omnia_fvt_pipeline_report.html.
#
# SKIP_STAGES: comma or space separated words, matched exactly: a domain (repo_manager, ...), a
# stage name (prepare_base, test_orchestrator, ...) or the groups cleanup, test_cleanup, deploy, test.
# Inputs: clusters/<name>/inputs/src/<domain>/ and clusters/<name>/inputs/src/main/omnia.env.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
      when: always

variables:
  SSH_CONNECT_TIMEOUT: '30'
  PIPELINE_VERSION: '4.0'
  PIPELINE_KIND: 'build_stream'
  SKIP_STAGES: ''
  TEST_MAIN_CMD: './run_validation.sh fvt_main verify'
  TEST_REPO_MANAGER_CMD: './run_validation.sh fvt_repo_manager prepare verify'
  TEST_IMAGE_BUILD_MANAGER_CMD: './run_validation.sh fvt_image_build_manager prepare verify'
  TEST_ORCHESTRATOR_CMD: './run_validation.sh fvt_orchestrator prepare verify'
  TEST_BUILD_STREAM_CMD: './run_validation.sh fvt_build_stream test'

stages:
  - initialization
  - cleanup_build_stream
  - test_cleanup_build_stream
  - cleanup_utils
  - test_cleanup_utils
  - cleanup_telemetry
  - test_cleanup_telemetry
  - cleanup_orchestrator
  - test_cleanup_orchestrator
  - cleanup_discovery
  - test_cleanup_discovery
  - cleanup_image_build_manager
  - test_cleanup_image_build_manager
  - cleanup_repo_manager
  - test_cleanup_repo_manager
  - cleanup_omnia
  - test_cleanup_omnia
  - setup_main
  - test_main_installation
  - prepare_base
  - test_repo_manager
  - test_image_build_manager
  - test_orchestrator
  - build_stream
  - test_build_stream
  - summary

default:
  retry:
    max: 1
    when:
      - runner_system_failure
      - api_failure
      - scheduler_failure
  before_script:
    - 'git fetch origin "$CI_COMMIT_REF_NAME" 2>/dev/null && git checkout "origin/$CI_COMMIT_REF_NAME" -- clusters/ 2>/dev/null || true'
  after_script:
    - 'mkdir -p "pipeline_job_status/$CI_PIPELINE_ID"'
    - 'printf ''{"name":"%s","status":"%s","url":"%s"}\n'' "$CI_JOB_NAME" "$CI_JOB_STATUS" "$CI_JOB_URL" >
      "pipeline_job_status/$CI_PIPELINE_ID/$CI_JOB_NAME.json"'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - pipeline_job_status/
      - pipeline_job_logs/
      - pipeline_reports/

initialization:
  stage: initialization
  timeout: 3h
  allow_failure: false
  rules:
    - if: '$SKIP_STAGES =~ /(^|[ ,])(initialization)([ ,]|$)/'
      when: never
    - if: '$PIPELINE_MODE == "default" || $PIPELINE_MODE == "cleanup" || $PIPELINE_MODE == "deploy"'
      when: on_success
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - pipeline_job_status/
      - pipeline_job_logs/
      - pipeline_reports/
      - ci_tools/
      - actual_commit_sha.txt
  script:
    - |
      python3 - <<'PYEOF'
      import os, re, shlex, subprocess, sys, time
      def fail(message):
          print("ERROR: " + message, file=sys.stderr)
          try:
              os.makedirs("pipeline_job_status/errors", exist_ok=True)
              with open("pipeline_job_status/errors/initialization.txt", "w", encoding="utf-8") as handle:
                  handle.write(message[:600])
          except OSError:
              pass
          sys.exit(1)
      cluster = os.environ.get("CLUSTER", "")
      if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]{0,63}", cluster):
          fail("CLUSTER is empty or not a plain name")
      prefix = cluster.upper().replace("-", "_")
      ip, user, password = (os.environ.get(prefix + "_TARGET_" + n, "") for n in ("IP", "USER", "PASS"))
      if not (ip and user and password):
          fail(prefix + "_TARGET_IP, _TARGET_USER (pipeline_config.yml or CI/CD variables) and _TARGET_PASS "
               "(a protected CI/CD variable: run on a protected branch) must be set")
      repo, branch = os.environ.get("OMNIA_REPO", ""), os.environ.get("OMNIA_BRANCH", "")
      path = os.environ.get("OMNIA_INSTALL_PATH", "/root/omnia").rstrip("/")
      if not re.fullmatch(r"(https?://|git@)[A-Za-z0-9._:/@~+-]+", repo):
          fail("OMNIA_REPO is empty or has unsafe characters")
      if not re.fullmatch(r"[A-Za-z0-9._/-]{1,200}", branch):
          fail("OMNIA_BRANCH is empty or has unsafe characters")
      protected = ("/", "/bin", "/boot", "/dev", "/etc", "/home", "/lib", "/lib64", "/media", "/mnt",
                   "/opt", "/opt/omnia", "/proc", "/root", "/run", "/sbin", "/srv", "/sys", "/tmp",
                   "/usr", "/var")
      if not re.fullmatch(r"/[A-Za-z0-9._/-]+", path) or path in protected:
          fail("OMNIA_INSTALL_PATH '" + path + "' is not a safe folder of its own (e.g. /root/omnia)")
      known = os.environ.get("PIPELINE_SSH_KNOWN_HOSTS") or os.environ.get(prefix + "_SSH_KNOWN_HOSTS")
      if known:
          check = ["-o", "StrictHostKeyChecking=yes", "-o", "UserKnownHostsFile=" + known]
      elif os.environ.get("PIPELINE_SSH_SKIP_HOST_KEY", "").lower() == "true":
          print("WARNING: the OIM host key is not checked (PIPELINE_SSH_SKIP_HOST_KEY=true)")
          check = ["-o", "StrictHostKeyChecking=no", "-o", "UserKnownHostsFile=/dev/null"]
      else:
          fail("the OIM host key is required. HOW TO FIX: setup_gitlab_project.py --update "
               "--scan-host-keys stores " + prefix + "_SSH_KNOWN_HOSTS, or set "
               "PIPELINE_SSH_SKIP_HOST_KEY=true to accept the risk")
      ssh = ["sshpass", "-e", "ssh"] + check + ["-o", "LogLevel=ERROR", "-o", "ServerAliveInterval=30",
             "-o", "ConnectTimeout=" + os.environ.get("SSH_CONNECT_TIMEOUT", "30"), user + "@" + ip]
      env = dict(os.environ, SSHPASS=password)
      q = shlex.quote
      mode = os.environ.get(prefix + "_CHECKOUT_MODE") or os.environ.get("CHECKOUT_MODE") or "update"
      if mode not in ("update", "recreate", "keep"):
          fail("CHECKOUT_MODE must be update, recreate or keep, got " + repr(mode))
      trees = ("/bin", "/boot", "/dev", "/etc", "/lib", "/lib64", "/opt/omnia", "/proc", "/run", "/sbin",
               "/sys", "/usr", "/var")
      if mode == "recreate" and any(path == t or path.startswith(t + "/") for t in trees):
          fail("CHECKOUT_MODE recreate deletes the folder: " + path + " is a system folder, use a "
               "folder of its own")
      recreate = "\n".join([
          'd="$1"',
          'holders() { for p in /proc/[0-9]*; do pid=${p#/proc/}; [ "$pid" = "$$" ] && continue',
          '  cwd=$(readlink "$p/cwd" 2>/dev/null); case "$cwd" in "$d"|"$d"/*) echo "$pid";; esac; done; }',
          'pids=$(holders)',
          'if [ -n "$pids" ]; then echo "stopping what still runs in $d: $(echo $pids)"',
          '  kill -TERM $pids 2>/dev/null; sleep 3; kill -KILL $(holders) 2>/dev/null; sleep 1; fi',
          'for try in 1 2 3 4 5; do rm -rf -- "$d" 2>/dev/null; [ -e "$d" ] || exit 0; sleep 2; done',
          'echo "ERROR: $d could not be deleted. Still running there: $(echo $(holders))"',
          'find "$d" -maxdepth 3 2>/dev/null | head -20; exit 1',
      ])
      qp, qr, qb = q(path), q(repo), q(branch)
      clone = "mkdir -p " + q(os.path.dirname(path)) + " && git clone -b " + qb + " " + qr + " " + qp
      script = {
          "recreate": "bash -c " + q(recreate) + " _ " + qp + " && " + clone,
          "update": ("if [ -d " + qp + "/.git ]; then cd " + qp + " && git remote set-url origin " + qr
                     + " && git fetch origin " + qb + " && git checkout --force -B " + qb
                     + " FETCH_HEAD; else " + clone + "; fi"),
          "keep": "test -d " + qp + "/.git",
      }[mode]
      need = ("command -v git python3 >/dev/null || "
              "{ echo 'git or python3 is missing on the OIM'; exit 127; }\n")
      for attempt in range(1, 6):
          done = subprocess.run(ssh + ["bash", "-s"], input=(need + script + "\n").encode(), env=env,
                                capture_output=True, check=False)
          rc = done.returncode
          out = (done.stdout + done.stderr).decode(errors="replace").replace(password, "********")
          sys.stdout.write(out)
          if rc != 255:
              break
          print("SSH connection failed, retry " + str(attempt) + "/5 in 10s")
          time.sleep(10)
      if rc:
          hints = {5: " - the OIM rejected the password, check the CI/CD variable " + prefix + "_TARGET_PASS",
                   255: " - the OIM did not answer on SSH",
                   127: " - install git and python3 on the OIM (it needs an enabled package repository)"}
          hint = hints.get(rc, "")
          last = ([x for x in out.splitlines() if x.strip()] or [""])[-1][:200]
          fail("checkout (" + mode + ") of " + repo + " (" + branch + ") on the OIM failed (exit code "
               + str(rc) + ")" + hint + (": " + last if last else ""))
      os.makedirs("ci_tools", exist_ok=True)
      pack = subprocess.Popen(ssh + ["tar -C " + q(path) + "/test/pipeline --exclude=__pycache__ -cf - "
                                     "pipeline_ci.py library"], stdout=subprocess.PIPE, env=env)
      subprocess.run(["tar", "-xf", "-", "-C", "ci_tools"], stdin=pack.stdout, check=False)
      pack.stdout.close()
      pack.wait()
      if not os.path.isfile("ci_tools/pipeline_ci.py"):
          fail("the clone has no test/pipeline/pipeline_ci.py. HOW TO FIX: OMNIA_BRANCH of " + repo +
               " must be a branch that has the pipeline helpers")
      print("Checkout (" + mode + ") of " + repo + " (" + branch + ") in " + path + ": took the pipeline helpers from it")
      PYEOF
    - python3 ci_tools/pipeline_ci.py initialize

