---
# Example profile for install_os dataset
# Usage: python generate_dataset.py --name my_dataset --profile example_install_os

# --- Log Collector Configuration
service_kube_control_plane_x86_64:
  - "10.0.0.10"

service_kube_node_x86_64:
  - "10.0.0.20"
  - "10.0.0.21"

slurm_control_node_x86_64: []
slurm_node_x86_64: []
slurm_node_aarch64: []
login_node_x86_64: []
login_compiler_node_aarch64: []

# --- Install OS Configuration ---
source_iso_path: "/path/to/RHEL-10.0-x86_64-dvd1.iso"
source_iso_checksum: ""
custom_iso_path: "nfs-server:/export/path/RHEL-omnia.iso"
kickstart_delivery_method: "embedded"
kickstart_file: ""
kickstart_template: "rhel10"
target_bmc_ip: "10.0.0.100"
target_hostname: "node1"
target_admin_ip: "10.0.0.50"
target_architecture: "x86_64"
network_device: ""
netmask: "255.255.255.0"
gateway: ""
dns_server: ""
install_disk: "sda"
timezone: "UTC"
rebuild_iso: true
force_reinstall: true
ssh_verify_enabled: true
ssh_verify_retries: 60
ssh_verify_delay: 30
