---
# =============================================================================
# Utils Domain — Default Variable Profile
# =============================================================================
# Base profile loaded for all dataset generation.
# Override these values in variant profiles.

# --- Log Collector Configuration ---
# Functional groups with node IPs
# Each group maps to a list of node IPs

service_kube_control_plane_x86_64:
  - "192.168.1.10"

service_kube_node_x86_64:
  - "192.168.1.20"
  - "192.168.1.21"

slurm_control_node_x86_64: []

slurm_node_x86_64: []

slurm_node_aarch64: []

login_node_x86_64: []

login_compiler_node_aarch64: []

# --- PXE Boot Configuration ---
enable_phone_home: true
phone_home_pause_minutes: 3
phone_home_retries: 120
phone_home_delay: 15
phone_home_log_pattern: "Phone home request from"
restart_host: true
force_restart: true
boot_source_override_enabled: "continuous"
boot_source_override_target: "pxe"

# --- BMC Inventory ---
# List of BMC hosts for PXE boot
bmc_hosts:
  - ip: "100.10.0.73"
    admin_ip: "192.168.1.50"
    hostname: "node01"
    service_tag: "ABC123"

# --- Credentials (placeholders) ---
bmc_username: ""
bmc_password: ""
