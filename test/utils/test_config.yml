# =============================================================================
# Utils Domain — Test Configuration
# =============================================================================
# This file contains non-sensitive test settings.
# Sensitive credentials go in test_creds.yml (auto-encrypted).

# --- Target Server ---
# Leave empty for local mode (tests run on the same machine)
oim_server_ip: ""
oim_ssh_user: "root"
oim_ssh_port: 22

# --- Project ---
# Dataset name (directory under datasets/)
# Leave empty to use src/utils/input/ directly
dataset: ""
project_name: "project_default"
clone_path: "/root/sujal/omnia"

# --- Sync ---
# Sync input files from dataset or src/ to target
sync_utils_input: false

# --- Report ---
report_path: "reports"
report_name: "utils_test_report"
