# =============================================================================
# Test Run Configuration — Repo Manager
# =============================================================================
#
# Configure which test suites to run, execution order, and marker filters.
#
# Usage:
#   1. Edit this file to enable/disable suites and set markers
#   2. Run: ./run_validation.sh --config
#
# -----------------------------------------------------------------------------
# Suite definitions
# -----------------------------------------------------------------------------
# Each suite has:
#   order:       <int>         - Execution order (ascending). Order values MUST
#                                be unique across enabled suites; duplicate
#                                order values are a configuration error.
#   run:         true/false    - Whether to execute this suite
#   command:     <string>      - Execution mode: deploy, verify, or test (default: test)
#                                deploy  = Run the playbook only
#                                verify  = Run verification tests only (skip playbook)
#                                test    = Deploy + Verify (full flow)
#   suite:       <folder>      - FVT folder name under fvt/ to run
#   marker:      <expression>  - Marker filter expression (empty = all tests)
#   dataset:     <name>        - (optional) Override dataset from test_config.yml
#                                Must be a valid folder under datasets/
#   sync_input:  true/false    - (optional) Override sync_repo_manager_input
#   sync_output: true/false    - (optional) Override sync_output
#
# Marker expression syntax:
#   Single:   "sanity"                  - tests with @pytest.mark.sanity
#   OR:       "sanity,functional"       - tests with EITHER marker
#   AND:      "sanity+functional"       - tests with BOTH markers
#
# Available markers:
#   Quality:       sanity, functional, regression
#
# Available suites (under fvt/):
#   repo_manager    - Full end-to-end: validate + deploy + download + status.
#                      Supported markers: sanity
#
#   validate        - Deploy with --tags validate, verify input validation.
#                      Supported markers: sanity
#
#   deploy          - Deploy with --tags deploy, verify Pulp server is running.
#                      Supported markers: sanity
#
#   repo_operations - Download packages and generate repo status.
#                      Mirrors src/repo_manager/playbooks/repo_operations/.
#                      Sub-suites: download (--tags download), status (--tags status)
#                      Supported markers: sanity
#
#   cleanup         - Deploy with --tags cleanup_pulp, verify Pulp server and
#                      data cleaned up.
#                      Supported markers: sanity
#
# Valid playbook tags (from src/repo_manager/playbooks/repo_manager.yml):
#   validate, deploy, download, status,
#   cleanup_pulp, cleanup_repos, upgrade, rollback
# =============================================================================

---

# =============================================================================
# Execution Options
# =============================================================================
# skip_on_failure: Stop the current suite on first test failure.
#                  When false (default), all tests run regardless of failures.
skip_on_failure: false

scenarios:

  # =========================================================================
  # repo_manager - Full end-to-end (validate + deploy + download + status)
  # =========================================================================
  # Deploys repo_manager.yml (no tags - default: validate + deploy + download + status).
  # Then verifies the complete state: Pulp server running, repos synced,
  # repo_status.yml generated.
  #
  # Supported suites (subfolders inside fvt/repo_manager/):
  #   pulp        - Pulp container and service checks
  #   repo_status - repo_status.yml verification
  #
  # Supported markers:
  #   sanity    - Baseline must-pass tests
  repo_manager:
    order: 1
    run: true
    command: "test"
    suite: ""
    marker: "sanity"
    # --- Per-scenario dataset override (uncomment to use) ---
    # dataset: "data_set_01"         # Override dataset for this scenario only
    # sync_input: true               # Sync input files before running
    # sync_output: false             # Sync repo_manager output before running

  # =========================================================================
  # validate - Deploy validate + verify input configuration
  # =========================================================================
  # Runs: ansible-playbook repo_manager.yml --tags validate
  # Then verifies: input validation output and status.
  #
  # Supported suites (subfolders inside fvt/validate/):
  #   status - Validation status checks
  #
  # Supported markers:
  #   sanity    - Baseline must-pass tests
  validate:
    order: 10
    run: false
    command: "test"
    suite: ""
    marker: "sanity"
    # dataset: "data_set_01"
    # sync_input: true
    # sync_output: false

  # =========================================================================
  # deploy - Deploy Pulp server + verify containers
  # =========================================================================
  # Runs: ansible-playbook repo_manager.yml --tags deploy
  # Then verifies: Pulp containers running, ports accessible.
  #
  # Supported suites (subfolders inside fvt/deploy/):
  #   pulp - Pulp container and endpoint verification
  #
  # Supported markers:
  #   sanity    - Baseline must-pass tests
  deploy:
    order: 20
    run: false
    command: "test"
    suite: ""
    marker: "sanity"
    # dataset: "data_set_01"
    # sync_input: true
    # sync_output: false

  # =========================================================================
  # repo_operations - Download packages + generate repo status
  # =========================================================================
  # Mirrors src/repo_manager/playbooks/repo_operations/.
  # Contains two sub-suites:
  #   download/ — ansible-playbook repo_manager.yml --tags download
  #               Verifies: packages downloaded, repos synced to Pulp.
  #   status/   — ansible-playbook repo_manager.yml --tags status
  #               Verifies: repo_status.yml generated with correct content.
  #
  # Supported suites (subfolders inside fvt/repo_operations/):
  #   download  - Download + verify packages/repos (sub-suites: repos, packages)
  #   status    - Status generation + verify repo_status.yml (sub-suite: status)
  #
  # Supported markers:
  #   sanity    - Baseline must-pass tests
  repo_operations:
    order: 30
    run: false
    command: "test"
    suite: ""
    marker: "sanity"
    # dataset: "data_set_01"
    # sync_input: false
    # sync_output: false

  # =========================================================================
  # cleanup - Cleanup Pulp server + verify removal
  # =========================================================================
  # Runs: ansible-playbook repo_manager.yml --tags cleanup_pulp
  # Then verifies: Pulp containers stopped/removed, data cleaned up.
  #
  # Supported suites (subfolders inside fvt/cleanup/):
  #   cleanup - Pulp container removal and data cleanup verification
  #
  # Supported markers:
  #   sanity    - Baseline must-pass tests
  cleanup:
    order: 50
    run: false
    command: "test"
    suite: ""
    marker: "sanity"
    # dataset: "data_set_01"
    # sync_input: false
    # sync_output: false
