---
# =============================================================================
# Test Run Configuration -- Repo Manager
# =============================================================================
#
# Configure which test categories to run, execution order, and marker filters.
#
# Usage:
#   1. Edit this file to enable/disable scenarios and set markers
#   2. Run: ./run_validation.sh --config
#
# -----------------------------------------------------------------------------
# Category Structure
# -----------------------------------------------------------------------------
# Top-level categories match the run_validation.sh first argument:
#
#   fvt_repo_manager  -- Functional Verification Tests (playbook tags)
#
# FVT scenarios (nested under fvt_repo_manager):
#   Each scenario maps to an FVT subdirectory.  Fields:
#     run:          true/false    - Whether to execute this scenario
#     command:      <string>      - deploy, verify, or test (default: test)
#                                   deploy = Run the playbook / trigger only
#                                   verify = Run verification tests only
#                                   test   = Deploy + Verify (full flow)
#     suite:        <folder>      - FVT subfolder filter (empty = all)
#     marker:       <expression>  - Marker filter expression (empty = all)
#
# -----------------------------------------------------------------------------
# Marker Expression Syntax
# -----------------------------------------------------------------------------
#   Single:   "sanity"                  -- tests with @pytest.mark.sanity
#   OR:       "sanity,functional"       -- tests with EITHER marker
#   AND:      "sanity+functional"       -- tests with BOTH markers
#
# Available markers:
#   Quality:       sanity, functional, positive, negative
#   Execution:     deploy
#   Architecture:  x86_64, aarch64
#
# -----------------------------------------------------------------------------
# Available FVT Suites (subfolders under fvt/<tag>/)
# -----------------------------------------------------------------------------
#   validate:      validate
#   deploy:        deploy
#   download:      download
#   status:        status
#   cleanup:       cleanup
#   policy:        policy
#   catalog:       catalog
#
# =============================================================================

# =============================================================================
# Execution Options
# =============================================================================
skip_on_failure: false

# =============================================================================
# FVT -- Functional Verification Tests
# =============================================================================
fvt_repo_manager:
  validate:
    run: false
    command: "test"
    suite: ""
    marker: "sanity"
  deploy:
    run: false
    command: "test"
    suite: ""
    marker: "sanity"
  download:
    run: false
    command: "test"
    suite: ""
    marker: "sanity"
  status:
    run: false
    command: "test"
    suite: ""
    marker: "sanity"
  cleanup:
    run: false
    command: "test"
    suite: ""
    marker: "sanity"
  policy:
    run: false
    command: "test"
    suite: ""
    marker: "sanity"
  catalog:
    run: false
    command: "test"
    suite: ""
    marker: "sanity"
