---
# =============================================================================
# Test Run Configuration -- Repo Manager
# =============================================================================
#
# Configure which test categories to run, execution order, and marker filters.
#
# Usage:
#   1. Edit this file to enable/disable scenarios and set markers
#   2. Run: ./run_validation.sh --config
#
# -----------------------------------------------------------------------------
# Category Structure
# -----------------------------------------------------------------------------
# Top-level categories match the run_validation.sh first argument:
#
#   fvt_repo_manager  -- Functional Verification Tests (playbook tags)
#   ut_repo_manager   -- Deterministic unit and source-contract tests
#
# FVT scenarios (nested under fvt_repo_manager):
#   Each scenario maps to an FVT subdirectory.  Fields:
#     run:          true/false    - Whether to execute this scenario
#     command:      <string>      - exec, verify, or test (default: test)
#                                   exec   = Run the playbook / trigger only
#                                   verify = Run verification tests only
#                                   test   = Exec + Verify (full flow)
#     suite:        <folder>      - FVT subfolder filter (empty = all)
#     marker:       <expression>  - Marker filter expression (empty = all)
#
# -----------------------------------------------------------------------------
# Marker Expression Syntax
# -----------------------------------------------------------------------------
#   Single:   "sanity"                  -- tests with @pytest.mark.sanity
#   OR:       "sanity,functional"       -- tests with EITHER marker
#   AND:      "sanity+functional"       -- tests with BOTH markers
#
# Available markers:
#   Quality:       sanity, functional, positive, negative
#   Execution:     deploy, destructive
#   Architecture:  x86_64, aarch64
#
# -----------------------------------------------------------------------------
# Available FVT Suites (subfolders under fvt/<tag>/)
# -----------------------------------------------------------------------------
#   catalog:       add, delete, generate, negative, validate
#   negative:      error_scenarios
#
#   precheck, prepare, execute, status, cleanup, cleanup_repos, policy,
#   and user_registry keep their tests directly under the tag directory;
#   leave suite empty for those scenarios.
#
# =============================================================================

# =============================================================================
# Execution Options
# =============================================================================
skip_on_failure: false

# =============================================================================
# FVT -- Functional Verification Tests
# =============================================================================
fvt_repo_manager:
  precheck:
    run: false
    command: "test"
    suite: ""
    marker: "sanity"
  prepare:
    run: false
    command: "test"
    suite: ""
    marker: "sanity"
  execute:
    run: false
    command: "test"
    suite: ""
    marker: "sanity"
  status:
    run: false
    command: "test"
    suite: ""
    marker: "sanity"
  cleanup:
    run: false
    command: "test"
    suite: ""
    marker: "destructive"
  cleanup_repos:
    run: false
    command: "test"
    suite: ""
    marker: "destructive"
  policy:
    run: false
    command: "verify"
    suite: ""
    marker: "sanity"
  catalog:
    run: false
    command: "test"
    suite: "validate"
    marker: "sanity"
  negative:
    run: false
    command: "verify"
    suite: ""
    marker: "negative"
  user_registry:
    run: false
    command: "verify"
    suite: ""
    marker: "sanity"

# =============================================================================
# UT -- Deterministic Unit and Source-Contract Tests
# =============================================================================
ut_repo_manager:
  run: false
  command: "test"
  marker: ""
