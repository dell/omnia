# =============================================================================
# defaults.yml — Default variable values for repo_manager dataset generation
# =============================================================================
# All profiles inherit these values. Override any key in a profile YAML file.
# Templates in templates/ reference these keys.
#
# Source of truth: src/repo_manager/input/repo_manager_config.yml
# =============================================================================

# =============================================================================
# REPOSITORY CONFIGURATION
# =============================================================================

# Global repository sync policy
# Options: "always" (full mirror) | "partial" (selective sync)
repo_config: "partial"

# Global caching policy
# Options: true (on_demand) | false (immediate)
caching_policy: true

# =============================================================================
# PULP SERVER ENDPOINT
# =============================================================================

# Pulp server port (default from src/repo_manager/input/repo_manager_endpoint_config.yml)
pulp_server_port: 2225

# Pulp server IP (optional - uses SYSTEM_ADMIN_NIC_IPV4 when empty)
pulp_server_ip: ""