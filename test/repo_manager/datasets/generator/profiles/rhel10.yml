# =============================================================================
# rhel10.yml — RHEL 10 specific configuration profile
# =============================================================================
# Profile for RHEL 10 specific testing scenarios
# =============================================================================

# Use partial sync for RHEL 10 testing (more efficient)
repo_config: "partial"

# Enable caching for on-demand downloads
caching_policy: true

# Use standard Pulp port
pulp_server_port: 2225
