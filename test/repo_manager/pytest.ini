[pytest]
# Pytest configuration for repo_manager FVT

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = fvt ut

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers (registered in conftest.py, listed here for documentation)
markers =
    order: Specify test execution order (lower first)
    x86_64: Test applies to x86_64 architecture
    aarch64: Test applies to aarch64 architecture
    sanity: Baseline verification (must-pass)
    functional: Functional verification
    regression: Regression tests
    deploy: Playbook deployment tests

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::pytest.PytestCollectionWarning