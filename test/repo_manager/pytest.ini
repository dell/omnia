[pytest]
# Disable Pulp pytest plugins that are not needed for repo_manager FVT
# and may cause import errors when pulpcore clients are not configured.
addopts = -p no:pulp_rpm -p no:pulp_file -p no:pulpcore -p no:pulp_python -p no:pulp_ansible -p no:pulp_certguard

# Default marker expression (empty = run all)
# Can be overridden via -m or the custom --marker option in conftest.py

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*
