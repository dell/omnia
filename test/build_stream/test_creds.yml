# =============================================================================
# Build Stream — Test Credentials
# =============================================================================
# This file is auto-encrypted with Ansible Vault on first test run.
# Use setup_env.sh to fill in values — never edit the encrypted form directly.
#
# MANAGED BY setup_env.sh:
#   SSH creds:    bash setup_env.sh --set-password       (remote mode only)
#   Domain creds: bash setup_env.sh --set-domain-creds   (GitLab/BSM/Postgres)
#
# FIELDS:
#   oim_password                — SSH password for the remote OIM server (oim_server_ip).
#                                 Leave empty for key-based auth or local execution.
#
#   gitlab_root_password        — GitLab root user password.
#                                 Set during GitLab installation. Required for
#                                 API operations and runner registration.
#
#   gitlab_ssh_password         — SSH password for the GitLab server host.
#                                 Required for passwordless SSH setup between
#                                 OIM and GitLab host.
#
#   build_stream_auth_username  — BSM API authentication username.
#   build_stream_auth_password  — BSM API authentication password.
#                                 Conditional: only needed when enable_build_stream: true.
#
#   postgres_user               — Postgres database username for BSM.
#   postgres_password           — Postgres database password for BSM.
#                                 Conditional: only needed when enable_build_stream: true.
# =============================================================================

---
oim_password: ""

# GitLab credentials (mandatory)
gitlab_root_password: ""
gitlab_ssh_password: ""

# BuildStream Manager API credentials (conditional — when enable_build_stream: true)
build_stream_auth_username: ""
build_stream_auth_password: ""

# Postgres database credentials (conditional — when enable_build_stream: true)
postgres_user: ""
postgres_password: ""
