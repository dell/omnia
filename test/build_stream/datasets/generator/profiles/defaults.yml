# =============================================================================
# defaults.yml — Default variable values for build_stream dataset generation
# =============================================================================
# All profiles inherit these values. Override any key in a profile YAML file.
# Templates in templates/ reference these keys.
#
# Source of truth: src/build_stream/input/build_stream_config.yml
# =============================================================================

# --- Metadata ---
project_name: "project_default"

# =============================================================================
# Section 1 — BuildStream Manager (BSM) API Settings
# =============================================================================

# Enable or disable the BuildStream CI/CD pipeline
enable_build_stream: true

# BuildStream API server host IP
build_stream_host_ip: ""

# BuildStream API server port
build_stream_port: 8010

# =============================================================================
# Section 2 — GitLab Settings
# =============================================================================

# Target host for GitLab deployment
gitlab_host: ""

# GitLab project name
gitlab_project_name: "omnia-catalog"

# Project visibility: private | internal | public
gitlab_project_visibility: "private"

# Default branch
gitlab_default_branch: "main"

# HTTPS port
gitlab_https_port: 443

# Minimum resource requirements
gitlab_min_storage_gb: 20
gitlab_min_memory_gb: 4
gitlab_min_cpu_cores: 2

# Puma web worker count
gitlab_puma_workers: 2

# Sidekiq background job concurrency
gitlab_sidekiq_concurrency: 10

# =============================================================================
# Credentials (placeholder values — never commit real passwords)
# =============================================================================
gitlab_root_password: ""
gitlab_ssh_password: ""
build_stream_auth_username: ""
build_stream_auth_password: ""
postgres_user: ""
postgres_password: ""
