# =============================================================================
# Test Run Configuration -- Build Stream
# =============================================================================
#
# Configure which test categories to run, execution order, and marker filters.
#
# Usage:
#   1. Edit this file to enable/disable scenarios and set markers
#   2. Run: ./run_validation.sh --config
#
# -----------------------------------------------------------------------------
# Category Structure
# -----------------------------------------------------------------------------
# Top-level categories match the run_validation.sh first argument:
#
#   fvt_build_stream  -- Functional Verification Tests (playbook tags)
#   nft_build_stream  -- Resilience and security tests
#
# FVT scenarios (nested under fvt_build_stream):
#   Each scenario maps to an FVT subdirectory.  Fields:
#     run:          true/false    - Whether to execute this scenario
#     command:      <string>      - exec, verify, or test (default: test)
#                                   exec   = Run the playbook / trigger only
#                                   verify = Run verification tests only
#                                   test   = Deploy + Verify (full flow)
#     suite:        <folder>      - FVT subfolder filter (empty = all suites)
#     marker:       <expression>  - Marker filter expression (empty = all)
#     dataset:      <name>        - Override test_config.yml dataset
#     sync_input:   true/false    - Override sync_build_stream_input
#
# -----------------------------------------------------------------------------
# Marker Expression Syntax
# -----------------------------------------------------------------------------
#   Empty:    ""                        -- every test in the scenario (default)
#   Single:   "sanity"                  -- tests with @pytest.mark.sanity
#   AND:      "sanity+pipeline"         -- tests with both markers
#   OR:       "build_pipeline,cadence"  -- tests with either marker
#
# Available markers (an empty marker runs every test of the scenario):
#   Quality:       sanity (baseline checks; not on the manual pipeline suites)
#   Entry test:    deploy (test_playbook.py: runs the tag playbook / omnia.sh)
#   Pipelines:     pipeline             every execute pipeline suite
#                  build_pipeline       build_automatic, build_manual
#                  deploy_pipeline      deploy_automatic, deploy_manual
#                  automatic_execution  build_automatic, deploy_automatic
#                  manual_execution     build_manual, deploy_manual
#                  cadence              cadence pipeline + enable/disable tests
#                  cleanup_pipeline     pipeline_cleanup
#                  automatic_cleanup    auto_cleanup
#   NFT:           nft, resilience, security, disruptive
#
# Deploy image: a run with a build suite deploys the image group that build
# created (a failed build skips every deploy test); a deploy-only run
# (marker "deploy_pipeline" or suite deploy_*) deploys
# pipeline.deploy_image_group_id from test_config.yml.
#
# -----------------------------------------------------------------------------
# Available FVT Suites (subfolders under fvt/<tag>/)
# -----------------------------------------------------------------------------
#   prepare_base:  readiness (explicit; runs ./omnia.sh --prepare-base)
#   precheck:      environment, containers, credentials (--tags precheck)
#   prepare:       build_stream (--tags prepare)
#   execute:       gitlab_server, gitlab_runner, gitlab_project
#                  (--tags execute), build_automatic, build_manual,
#                  deploy_automatic,
#                  deploy_manual, cadence, pipeline_cleanup, auto_cleanup
#   cleanup:       gitlab, build_stream (--tags cleanup; explicit, destructive)
#
# Default lifecycle (no tag): precheck -> prepare -> execute
#
# =============================================================================

---

# =============================================================================
# Execution Options
# =============================================================================
skip_on_failure: false

# =============================================================================
# FVT -- Functional Verification Tests
# =============================================================================
fvt_build_stream:
  prepare_base:
    run: false
    command: "test"
    suite: ""
    marker: ""
    dataset: ""
    sync_input: false
  precheck:
    run: false
    command: "test"
    suite: ""
    marker: ""
    dataset: ""
    sync_input: false
  prepare:
    run: false
    command: "test"
    suite: ""
    marker: ""
    dataset: ""
    sync_input: false
  execute:
    run: false
    command: "test"
    suite: ""
    marker: ""
    dataset: ""
    sync_input: false
  cleanup:
    run: false
    command: "test"
    suite: ""
    marker: ""
    dataset: ""
    sync_input: false

# =============================================================================
# NFT -- Non-Functional Tests
# =============================================================================
nft_build_stream:
  run: false
  command: "test"
  marker: ""
