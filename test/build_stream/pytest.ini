[pytest]
# Disable Pulp pytest plugins that are not needed for build_stream FVT
# and may cause import errors when pulpcore clients are not configured.
addopts = -p no:pulp_rpm -p no:pulp_file -p no:pulpcore -p no:pulp_python -p no:pulp_ansible -p no:pulp_certguard

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*
