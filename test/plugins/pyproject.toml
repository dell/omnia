[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnia-auto"
dynamic = ["version"]
description = "Reusable test automation utilities for Dell Omnia — formatting, host connectivity, playbook execution, file sync, and reporting."
readme = {file = "README.md", content-type = "text/markdown"}
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Balaji Kumaran", email = "balajikumaran.cs@dell.com"}
]
maintainers = [
    {name = "Balaji Kumaran", email = "balajikumaran.cs@dell.com"}
]
keywords = [
    "testing", "automation", "omnia", "dell",
    "pytest", "testinfra", "ansible", "infrastructure",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
requires-python = ">=3.9"
dependencies = [
    "ansible-core>=2.15.0",
    "pytest>=7.0.0",
    "pytest-testinfra>=9.0.0",
    "PyYAML>=6.0",
]

[project.scripts]
omnia-auto = "omnia_auto.functions.credential_func:main"

[project.optional-dependencies]
dev = [
    "build",
    "twine",
    "pytest-cov",
    "black",
    "pylint",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/dell/omnia"
Repository = "https://github.com/dell/omnia"
Issues = "https://github.com/dell/omnia/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["omnia_auto*"]

[tool.setuptools.package-data]
omnia_auto = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "omnia_auto.__version__"}
