[pytest]
addopts = --import-mode=importlib
markers =
    sanity: Sanity test cases
    negative: Negative test cases (e.g., reboot scenarios)
    regression: Regression test cases
    stress: Stress test cases
    deploy: Playbook deployment tests (test_deploy.py)
    build_stream: Tests dependent on build stream pipeline
    build_auto: Build pipeline auto-trigger tests
    build_manual: Build pipeline manual trigger tests
    deploy_auto: Deploy pipeline auto-trigger tests
    deploy_manual: Deploy pipeline manual trigger tests
    cleanup_manual: Cleanup pipeline tests (manual trigger only)
    ldap: LDAP user authentication and PAM test cases
    sanityib: Sanity test cases for InfiniBand functionality
    sanitygpu: Sanity test cases for GPU functionality
    minimal_os: Minimal OS provisioning test cases
    compatibility: Compatibility test cases
    vast_telemetry: VAST storage telemetry test cases
    ufm_telemetry: UFM telemetry test cases
    input_validation: Input file validation tests (mutate field, expect failure, revert)
