# =============================================================================
# Test Run Configuration
# =============================================================================
#
# Configure which scenarios to run, the command, and test suite per scenario.
#
# Usage:
#   1. Edit this file to enable/disable scenarios
#   2. Run: run_validation --config
#
# Each scenario has:
#   run:     true/false              - Whether to execute this scenario
#   command: deploy/verify/test      - What to run
#            (deploy=playbook, verify=tests, test=both)
#   suite:   sanity/negative/...     - Folder filter (empty = all folders)
#   marker:  <pytest marker expr>    - Marker filter (empty = no marker filter)
#
# Scenarios execute in the order listed below.
# =============================================================================

scenarios:

  # --- Server Setup (prerequisite checks, IP configuration, hostname) ---
  # Runs oim-prereq-check to validate and configure the OIM server.
  # When run: true, this executes BEFORE all other scenarios.
  # Results are shown as a separate setup panel in the report
  # (not counted as tests).
  oim_server_setup:
    run: false
    command: "verify"
    suite: ""
    marker: ""

  # --- Install & Setup ---
  omnia_sh_install:
    run: true
    command: "verify"
    suite: ""
    marker: ""

  prepare_oim:
    run: true
    command: "test"
    suite: ""
    marker: ""

  # --- GitLab ---
  gitlab_install:
    run: false
    command: "test"
    suite: ""
    marker: ""

  # --- Build & Repo ---
  local_repo:
    run: true
    command: "verify"
    suite: ""
    marker: ""

  build_image_x86_64:
    run: true
    command: "verify"
    suite: ""
    marker: ""

  build_image_aarch64:
    run: true
    command: "verify"
    suite: "sanity"
    marker: ""

  # --- Provision & Deploy ---
  discovery:
    run: false
    command: "test"
    suite: "sanity"
    marker: ""

  provision:
    run: false
    command: "verify"
    suite: "sanity"
    marker: ""

  # --- Services ---
  telemetry:
    run: false
    command: "verify"
    suite: "sanity"
    marker: ""

  apptainer:
    run: false
    command: "verify"
    suite: "sanity"
    marker: ""

  kubernetes:
    run: false
    command: "verify"
    suite: "sanity"
    marker: ""

  slurm:
    run: false
    command: "verify"
    suite: "sanity"
    marker: ""

  dcgm:
    run: false
    command: "verify"
    suite: "sanity"
    marker: ""

  hpc_benchmarks:
    run: false
    command: "verify"
    suite: "sanity"
    marker: ""

  vast_storage:
    run: false
    command: "verify"
    suite: "sanity"
    marker: ""

  # --- Build Stream (CI/CD pipeline tests) ---
  build_stream:
    run: false
    command: "test"
    suite: "sanity"
    marker: ""

  # --- Additional cloud-init ---
  additional_cloud_init:
    run: false
    command: "verify"
    suite: "sanity"
    marker: ""

  # --- Logs ---
  one_shot_log_extraction:
    run: false
    command: "test"
    suite: ""
    marker: ""

  # --- Upgrade & Rollback ---
  upgrade_omnia_sh:
    run: false
    command: "test"
    suite: "sanity"
    marker: ""

  rollback_omnia_sh:
    run: false
    command: "test"
    suite: "sanity"
    marker: ""

  # --- Cleanup ---
  gitlab_cleanup:
    run: false
    command: "test"
    suite: ""
    marker: ""

  oim_cleanup:
    run: false
    command: "test"
    suite: ""
    marker: ""

  omnia_sh_uninstall:
    run: false
    command: "test"
    suite: ""
    marker: ""
