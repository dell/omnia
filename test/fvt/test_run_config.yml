# =============================================================================
# Test Run Configuration
# =============================================================================
#
# Configure which scenarios to run, the command, suite, and run order.
#
# Usage:
#   1. Edit this file to enable/disable scenarios
#   2. Run: run_validation --config
#
# -----------------------------------------------------------------------------
# OIM Prerequisite Test (oim-prereq-test)
# -----------------------------------------------------------------------------
# The prerequisite tool validates AND configures the OIM server (SSH,
# hostname, network interfaces, NFS, podman, etc.) before any scenario
# runs. It is NOT a scenario - it is a gate controlled by the flag below.
#
#   oim_prereq_test: true   -> run oim-prereq-test FIRST; if it fails the
#                              batch stops before any scenario executes.
#   oim_prereq_test: false  -> skip the prerequisite tool entirely.
#
oim_prereq_test: false

# -----------------------------------------------------------------------------
# Scenario definitions
# -----------------------------------------------------------------------------
# Each scenario has:
#   order:   <int>                   - Execution order (ascending). Order
#                                      values MUST be unique across enabled
#                                      scenarios; duplicate order values are
#                                      a configuration error and the batch
#                                      run fails. Values need not be
#                                      contiguous (e.g. 1 3 7 is valid).
#   run:     true/false              - Whether to execute this scenario
#   command: deploy/verify/test      - What to run
#            (deploy=playbook, verify=tests, test=both)
#   suite:   sanity/negative/...     - Folder filter (empty = all folders)
#   marker:  <pytest marker expr>    - Marker filter (empty = no filter)
#
# Scenarios execute in ascending "order" value, not listing order.
# =============================================================================

scenarios:

  # --- Install & Setup ---
  omnia_sh_install:
    order: 1
    run: true
    command: "verify"
    suite: ""
    marker: ""

  prepare_oim:
    order: 2
    run: true
    command: "test"
    suite: ""
    marker: ""

  # --- GitLab ---
  gitlab_install:
    order: 3
    run: false
    command: "test"
    suite: ""
    marker: ""

  # --- Build & Repo ---
  local_repo:
    order: 4
    run: true
    command: "verify"
    suite: ""
    marker: ""

  build_image_x86_64:
    order: 5
    run: true
    command: "verify"
    suite: ""
    marker: ""

  build_image_aarch64:
    order: 6
    run: true
    command: "verify"
    suite: "sanity"
    marker: ""

  # --- Provision & Deploy ---
  discovery:
    order: 7
    run: false
    command: "test"
    suite: "sanity"
    marker: ""

  provision:
    order: 8
    run: false
    command: "verify"
    suite: "sanity"
    marker: ""

  # --- Services ---
  telemetry:
    order: 9
    run: false
    command: "verify"
    suite: "sanity"
    marker: ""

  apptainer:
    order: 10
    run: false
    command: "verify"
    suite: "sanity"
    marker: ""

  kubernetes:
    order: 11
    run: false
    command: "verify"
    suite: "sanity"
    marker: ""

  slurm:
    order: 12
    run: false
    command: "verify"
    suite: "sanity"
    marker: ""

  dcgm:
    order: 13
    run: false
    command: "verify"
    suite: "sanity"
    marker: ""

  hpc_benchmarks:
    order: 14
    run: false
    command: "verify"
    suite: "sanity"
    marker: ""

  vast_storage:
    order: 15
    run: false
    command: "verify"
    suite: "sanity"
    marker: ""

  # --- Build Stream (CI/CD pipeline tests) ---
  build_stream:
    order: 16
    run: false
    command: "test"
    suite: "sanity"
    marker: ""

  # --- Additional cloud-init ---
  additional_cloud_init:
    order: 17
    run: false
    command: "verify"
    suite: "sanity"
    marker: ""

  # --- Logs ---
  one_shot_log_extraction:
    order: 18
    run: false
    command: "test"
    suite: ""
    marker: ""

  # --- Upgrade & Rollback ---
  upgrade_omnia_sh:
    order: 19
    run: false
    command: "test"
    suite: "sanity"
    marker: ""

  rollback_omnia_sh:
    order: 20
    run: false
    command: "test"
    suite: "sanity"
    marker: ""

  # --- Cleanup ---
  gitlab_cleanup:
    order: 21
    run: false
    command: "test"
    suite: ""
    marker: ""

  oim_cleanup:
    order: 22
    run: false
    command: "test"
    suite: ""
    marker: ""

  omnia_sh_uninstall:
    order: 23
