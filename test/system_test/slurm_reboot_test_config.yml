# =============================================================================
# slurm_reboot_test_config.yml - settings of the SVT theme slurm_reboot
# =============================================================================
# Read by ./setup_env.sh (--theme slurm_reboot) and by
# ./run_validation.sh svt_slurm_reboot. The cluster values (IPs, names,
# versions) are in user_inputs.yml; credentials are never written here
# (./setup_env.sh --set-domain-creds).
#
# This theme performs an ordered Slurm cluster reboot (power-off all nodes,
# then power-on in controller -> login/compiler -> compute order), followed
# by verification of Slurm services, LDAP jobs, GPU jobs, MPI jobs, and
# IPoIB networking.  It reuses existing orchestrator FVT test suites; no
# new test logic is needed.
# =============================================================================

# =============================================================================
# REPORT  (one folder and one SVT report per run)
# =============================================================================
report:
  report_path: ""
  report_name: ""
  run_id: ""
