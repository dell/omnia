# =============================================================================
# test_config.yml - settings of the system verification test (SVT)
# =============================================================================
# Read by ./setup_env.sh and ./run_validation.sh. The cluster values (IPs,
# names, versions) are in user_inputs.yml next to this file; credentials are
# never written here (./setup_env.sh --set-domain-creds).
# =============================================================================

# theme: the integration flavour (default: build_stream).
#   It selects the dataset profile (dataset_generator/profiles/<theme>.yml),
#   the suites installed into the Omnia venv, the credential stores and the
#   SVT cases. ./run_validation.sh svt_<theme> must use the same theme.
#   Supported: build_stream
theme: build_stream

# omnia_force_env: true | false (default: true).
#   true:  the install step adds --force-env to omnia.sh -s when
#          src/main/omnia.env (filled from user_inputs.yml) differs from the
#          installed /etc/omnia/omnia.env, so the loaded values are used.
#   false: keep the installed /etc/omnia/omnia.env as it is.
omnia_force_env: true

# =============================================================================
# CLEANUP  (./setup_env.sh --cleanup, or --force; destructive, asks 'yes'
#           unless --yes)
# =============================================================================
# Removes the previous installation with each suite's own cleanup FVT, in this
# order: build_stream, orchestrator, image_build_manager, repo_manager, then
# main (omnia.sh --cleanup). ./setup_env.sh writes every flag below into that
# suite's test/<suite>/test_config.yml, so each cleanup FVT runs with the
# value set here.
#   enabled: true | false (default: true). false skips that suite's cleanup.
#   The other keys are the suite's own flags; see test/<suite>/test_config.yml
#   for their meaning.
cleanup:
  build_stream:
    enabled: true
    # false: delete the Postgres data directory and volumes; true: keep them.
    postgres_backup: false
    # true: delete the BuildStream credential files and keys.
    cleanup_credentials: true
  orchestrator:
    enabled: true
    cleanup_credentials: true
    # true: delete the Slurm shared data.
    cleanup_slurm: true
    # true: delete the Kubernetes shared data.
    cleanup_k8s: true
    # true: delete the benchmark tools workspace.
    cleanup_benchmark_tools: true
  image_build_manager:
    enabled: true
    cleanup_credentials: true
  repo_manager:
    enabled: true
    cleanup_credentials: true
  main:
    # omnia.sh --cleanup: removes the Omnia venv and /etc/omnia/omnia.env.
    enabled: true
