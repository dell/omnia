# ==============================================================================
# user_inputs.yml - the values of YOUR cluster, in one file
# ==============================================================================
# Fill this file, then (test/system_test):
#
#   ./setup_env.sh                      # configure, install, credentials
#   ./setup_env.sh --configure          # only write these values (the generator,
#                                       # theme of test_config.yml, see below)
#
# The generator writes every value into the Omnia input file of the same name,
# at the same place (same keys, same indentation). It can also run alone:
#
#   cd test/system_test/dataset_generator
#   ./generate_dataset.py               # update src/<domain>/input and
#                                       # src/main/omnia.env
#   ./generate_dataset.py /abc          # create /abc with the src inputs and
#                                       # update there
#   ./generate_dataset.py --dry-run     # only show what would change
#
# How values are used
#   MANDATORY  must be filled; the run stops and names every empty one.
#   optional   "" (or []) is written as empty, so clearing a value here clears
#              it in the input file too. Exceptions: a blank vast_storage
#              source turns VAST off, a blank catalog keeps the default one.
#   Keep the quotes around IPs, versions and paths.
#
# Layout: one block per module, in this order
#   main -> repo_manager -> image_build_manager -> orchestrator -> build_stream
# Inside a module, one block per input file, holding only the keys a user sets.
# ==============================================================================


# ------------------------------------------------------------------------------
# ------------------------------------------------------------------------------
# MAIN                                                    src/main/omnia.env
# ------------------------------------------------------------------------------
# ------------------------------------------------------------------------------
main:
  # +--------------------------------------------------------------------------+
  # | omnia.env - identity of the OIM host                                     |
  # |   SYSTEM_ADMIN_NIC_IPV4  MANDATORY  admin NIC IPv4 of the OIM (Pulp, S3, |
  # |                                     registry and provisioning use it)    |
  # |   SYSTEM_HOSTNAME        MANDATORY  short hostname of the OIM (no dots)  |
  # |   SYSTEM_DOMAIN_NAME     MANDATORY  domain name of the OIM               |
  # | OMNIA_DATA_PATH, OMNIA_PROJECT_NAME and OMNIA_VENV_PATH keep the values  |
  # | of src/main/omnia.env (/opt/omnia, project_default, /opt/omnia/venv).    |
  # +--------------------------------------------------------------------------+
  omnia_env:
    SYSTEM_ADMIN_NIC_IPV4: "172.16.107.254"
    SYSTEM_HOSTNAME: "oim"
    SYSTEM_DOMAIN_NAME: "omnia.cluster"

  # +--------------------------------------------------------------------------+
  # | catalog - the active catalog (omnia.env CATALOG_FILE_PATH)  optional     |
  # |   "" keeps the default catalog that omnia.sh -s installs. Otherwise the  |
  # |   number or the name shown by ./omnia.sh --list-catalogs; the install    |
  # |   step runs ./omnia.sh --select-catalog <catalog> after omnia.sh -s.     |
  # |    1 default                                                             |
  # |    2 hybrid/slurm_hybrid_10_2_10_0_aarch64.json                          |
  # |    3 hybrid/slurm_hybrid_10_2_10_0_aarch64_no_vast.json                  |
  # |    4 hybrid/slurm_hybrid_10_2_10_0_x86_64_aarch64.json                   |
  # |    5 hybrid/slurm_hybrid_10_2_10_0_x86_64_aarch64_no_vast.json           |
  # |    6 hybrid/slurm_hybrid_10_2_10_0_x86_64.json                           |
  # |    7 hybrid/slurm_hybrid_10_2_10_0_x86_64_no_vast.json                   |
  # |    8 hybrid/slurm_service_k8s_hybrid_10_2_10_0_combined.json             |
  # |    9 hybrid/slurm_service_k8s_hybrid_10_2_10_0_combined_no_vast.json     |
  # |   10 hybrid/slurm_service_k8s_hybrid_10_2_10_0_x86_64.json               |
  # |   11 hybrid/slurm_service_k8s_hybrid_10_2_10_0_x86_64_no_vast.json       |
  # |   12 rhel/10.0/service_k8s_x86_64.json                                   |
  # |   13 rhel/10.0/slurm_aarch64.json                                        |
  # |   14 rhel/10.0/slurm_aarch64_no_vast.json                                |
  # |   15 rhel/10.0/slurm_service_k8s_combined.json                           |
  # |   16 rhel/10.0/slurm_service_k8s_combined_no_vast.json                   |
  # |   17 rhel/10.0/slurm_service_k8s_x86_64.json                             |
  # |   18 rhel/10.0/slurm_service_k8s_x86_64_no_vast.json                     |
  # |   19 rhel/10.0/slurm_x86_64_aarch64.json                                 |
  # |   20 rhel/10.0/slurm_x86_64_aarch64_no_vast.json                         |
  # |   21 rhel/10.0/slurm_x86_64.json                                         |
  # |   22 rhel/10.0/slurm_x86_64_no_vast.json                                 |
  # |   23 rhel/10.2/service_k8s_x86_64.json                                   |
  # |   24 rhel/10.2/slurm_aarch64.json                                        |
  # |   25 rhel/10.2/slurm_aarch64_no_vast.json                                |
  # |   26 rhel/10.2/slurm_service_k8s_combined.json                           |
  # |   27 rhel/10.2/slurm_service_k8s_combined_no_vast.json                   |
  # |   28 rhel/10.2/slurm_service_k8s_x86_64.json                             |
  # |   29 rhel/10.2/slurm_service_k8s_x86_64_no_vast.json                     |
  # |   30 rhel/10.2/slurm_x86_64_aarch64.json                                 |
  # |   31 rhel/10.2/slurm_x86_64_aarch64_no_vast.json                         |
  # |   32 rhel/10.2/slurm_x86_64.json                                         |
  # |   33 rhel/10.2/slurm_x86_64_no_vast.json                                 |
  # |   The numbers follow omnia.sh --list-catalogs; a name stays valid when a |
  # |   catalog is added.                                                      |
  # +--------------------------------------------------------------------------+
  catalog: ""


