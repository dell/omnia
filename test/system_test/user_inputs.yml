# ------------------------------------------------------------------------------
# ------------------------------------------------------------------------------
# BUILD STREAM                    src/build_stream/input/build_stream_config.yml
# ------------------------------------------------------------------------------
# ------------------------------------------------------------------------------
build_stream:
  # +--------------------------------------------------------------------------+
  # | build_stream_config.yml                                                  |
  # |   build_stream_host_ip  MANDATORY  IP where the BuildStream API runs     |
  # |                                    (normally the OIM)                    |
  # |   gitlab_host           MANDATORY  IP of the GitLab host                 |
  # +--------------------------------------------------------------------------+
  build_stream_config:
    build_stream_host_ip: ""
    gitlab_host: ""

# ------------------------------------------------------------------------------
# ------------------------------------------------------------------------------
# TELEMETRY                          src/telemetry/input/telemetry_config.yml
# ------------------------------------------------------------------------------
# ------------------------------------------------------------------------------
# Used by the observability theme only (./setup_env.sh --theme observability):
# iDRAC and LDMS are deployed and checked, every other source is off. The keys
# are those of telemetry_config.yml; a key not given keeps the shipped value
# (the LDMS sampler plugins, ports, sink sizes ...). The BMC, MySQL and LDMS
# sampler passwords are credentials: ./setup_env.sh --theme observability
# --set-domain-creds, or the OpenBao secret <secret_path>/telemetry.
# LDMS also needs its packages on the Slurm nodes: the ldms user repo of
# repo_manager_config (above) and a catalog with LDMS when the cluster is built.
telemetry:
  # +--------------------------------------------------------------------------+
  # | telemetry_config.yml                                                     |
  # |   cluster_inventory   "" = the orchestrator inventory of the project     |
  # |   telemetry_sources   idrac and ldms metrics_enabled MANDATORY (true)    |
  # |   bmc_group_data_path "" = the orchestrator's bmc_group_data.csv         |
  # +--------------------------------------------------------------------------+
  telemetry_config:
    cluster_inventory: ""
    telemetry_sources:
      idrac:
        metrics_enabled: true
        collection_targets: ["victoria_metrics", "kafka"]
      ldms:
        metrics_enabled: true
        collection_targets: ["kafka"]
      powerscale:
        metrics_enabled: false
        logs_enabled: false
      ufm:
        metrics_enabled: false
        logs_enabled: false
      vast:
        metrics_enabled: false
        logs_enabled: false
      ome:
        metrics_enabled: false
        logs_enabled: false
    telemetry_bridges:
      # Vector-LDMS: Kafka ldms topic -> VictoriaMetrics (TEL_FVT_DEPLOY_V029)
      vector_ldms:
        metrics_enabled: true
      vector_ome:
        metrics_enabled: false
        logs_enabled: false
    idrac_telemetry_configurations:
      bmc_group_data_path: ""

# ------------------------------------------------------------------------------
# ------------------------------------------------------------------------------
# OPENBAO                          not an Omnia input: where the passwords are kept
# ------------------------------------------------------------------------------
# ------------------------------------------------------------------------------
# The ONE place OpenBao is set, for every module and theme. The generator does not
# write it into any input file. It is read by
#   ./setup_env.sh --domain-creds-from-openbao | --openbao   (on the OIM)
#   pipeline/setup_svt_project.py   -> CI/CD variables BAO_SERVER_URL, BAO_DATA_PATH,
#                                      BAO_TLS_SKIP_VERIFY (the GitLab pipeline)
# Secrets are read from <server_url>/v1/<secret_path>/<domain>. The token is never
# written here: export BAO_TOKEN=<token> (or type it at the prompt). See docs/OPENBAO.md.
openbao:
  # https://host:port of OpenBao ("" = OpenBao is not used)
  server_url: ""
  # KV v2: secret/data/<path>; KV v1: secret/<path>
  secret_path: "secret/data/omnia"
  # true: the certificate is not checked (as test/pipeline, which uses curl -k)
  # false: check it with ca_cert, or with the system CA store when ca_cert is ""
  tls_skip_verify: true
  # absolute path of the OpenBao CA certificate ("" = none)
  ca_cert: ""

# =============================================================================
# CLEANUP  (one cleanup for every theme: ./setup_env.sh --cleanup, or --force;
#           destructive, asks 'yes' unless --yes)
# =============================================================================
# Shared by every SVT theme (build_stream, catalog_build, cluster_lifecycle): the same
# cleanup runs before each theme, so it is set once here and not in a theme's
# <theme>_test_config.yml. Removes the previous installation with each suite's own
# cleanup FVT, in this
# order: build_stream, telemetry, orchestrator, discovery, image_build_manager,
# repo_manager, then main (omnia.sh --cleanup). Every flag below is written
# into that suite's test/<suite>/test_config.yml, so each cleanup FVT runs with
# the value set here.
#   enabled: true | false (default: true). false skips that suite's cleanup.
#   The other keys are the suite's own flags; see test/<suite>/test_config.yml
#   for their meaning.
cleanup:
  build_stream:
    enabled: true
    # false: delete the Postgres data directory and volumes; true: keep them.
    postgres_backup: false
    # true: delete the BuildStream credential files and keys.
    cleanup_credentials: true
  # Telemetry runs on the Kubernetes cluster the orchestrator deploys, so it is removed
  # first. A theme that does not deploy it runs the step only when telemetry holds
  # deployed state (a file under <data>/telemetry/output or /log); otherwise it is
  # skipped. omnia.sh --cleanup --all refuses while those folders hold files.
  telemetry:
    enabled: true
    # true: also delete the sink PVCs (Kafka and VictoriaMetrics data) and the log,
    # input and output directories; false: keep them. true for a complete reset.
    delete_sinks_volume: true
    # true: delete the telemetry credential files.
    cleanup_credentials: true
    # true: delete the telemetry log directory.
    cleanup_logs: true
  orchestrator:
    enabled: true
    cleanup_credentials: true
    # true: delete the Slurm shared data.
    cleanup_slurm: true
    # true: delete the Kubernetes shared data.
    cleanup_k8s: true
    # true: delete the benchmark tools workspace.
    cleanup_benchmark_tools: true
  # Discovery feeds the orchestrator, so it is removed after it. A theme that does not run
  # discovery runs the step only when discovery holds deployed state (a file under
  # <data>/discovery/output or /log); otherwise it is skipped. omnia.sh --cleanup --all
  # refuses while those folders hold files. Its other cleanup options (credentials, logs)
  # are playbook variables that the cleanup FVT sets itself, so "enabled" is the only key.
  discovery:
    enabled: true
  image_build_manager:
    enabled: true
    cleanup_credentials: true
  repo_manager:
    enabled: true
    cleanup_credentials: true
  main:
    enabled: true
    # cleanup_all: true | false (default: true).
    #   true:  a complete reset, so the next install starts from nothing (no
    #          "overwrite existing files?" question): every src/<domain>/
    #          domain-init.sh --cleanup (each domain's input and log
    #          artifacts), then omnia.sh --cleanup --all --skip-approval. It
    #          deletes the whole OMNIA_DATA_PATH (/opt/omnia), the credential
    #          stores included (whatever cleanup_credentials says above), and
    #          anything else kept there. omnia.sh refuses, and deletes nothing,
    #          while a domain still holds deployed state.
    #   false: omnia.sh --cleanup: removes the Omnia venv, /etc/omnia/omnia.env,
    #          omnia-cli and the dependency cache; OMNIA_DATA_PATH is kept, so
    #          the next install asks before overwriting the inputs (--yes
    #          answers it).
    cleanup_all: true
  # NFS shares of storage_config.yml (user_inputs.yml orchestrator.storage_config.mounts).
  # SVT only: not written into any suite. Slurm and Kubernetes data left on the shares
  # survives a reinstall, so the cleanup empties them (default true):
  #   1. before anything is deleted, each share is mounted read-only and unmounted
  #      again: a share that cannot be reached fails the cleanup with the reason;
  #   2. after the other steps, each share is mounted read-write on a private
  #      temporary folder on this OIM, EVERYTHING inside it is deleted (the export
  #      itself stays) and it is unmounted.
  # The shares are the mounts "nfs_slurm" (slurm_share) and "nfs_k8s" (k8s_share) whose
  # source is host:/export. A mount that is absent, or is not NFS, is skipped; system
  # directories (/, /etc, /home ...) and an export on this OIM that holds the checkout
  # or OMNIA_DATA_PATH are refused. Needs root and nfs-utils on the OIM, and the
  # exports must not squash root (no_root_squash). The confirmation lists the shares.
  nfs:
    # true: empty the Slurm share (storage_config.yml mount nfs_slurm).
    slurm_share: true
    # true: empty the Kubernetes share (storage_config.yml mount nfs_k8s).
    k8s_share: true
