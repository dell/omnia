---
# ==============================================================================
# Profile: catalog_build
# ==============================================================================
# The inputs the catalog_build theme needs: omnia.env, repo_manager and
# image_build_manager. The orchestrator and build_stream blocks of
# user_inputs.yml are not used. See build_stream.yml for the field meanings.
# ==============================================================================
name: catalog_build
description: >-
  Inputs of the catalog_build system test: omnia.env, repo_manager and
  image_build_manager.

targets:
  - section: main.omnia_env
    file: src/main/omnia.env
    format: env
    out: main/omnia.env
  - section: repo_manager.repo_manager_config
    file: src/repo_manager/input/repo_manager_config.yml
    format: yaml
    out: repo_manager/input/repo_manager_config.yml
  - section: image_build_manager.image_build_config
    file: src/image_build_manager/input/image_build_config.yml
    format: yaml
    out: image_build_manager/input/image_build_config.yml

input_dirs:
  - src/repo_manager/input
  - src/image_build_manager/input

mandatory:
  - main.omnia_env.SYSTEM_ADMIN_NIC_IPV4
  - main.omnia_env.SYSTEM_HOSTNAME
  - main.omnia_env.SYSTEM_DOMAIN_NAME
