# =============================================================================
# k8s_reboot_test_config.yml - settings of the SVT theme k8s_reboot
# =============================================================================
# Read by ./setup_env.sh (--theme k8s_reboot) and by
# ./run_validation.sh svt_k8s_reboot. The cluster values (IPs, names,
# versions) are in user_inputs.yml; credentials are never written here
# (./setup_env.sh --set-domain-creds).
#
# This theme performs an ordered Kubernetes cluster reboot (power-off worker
# nodes, then control-plane; power-on control-plane first, then workers),
# followed by verification of Kubernetes cluster health, storage (NFS and
# PowerScale), and telemetry.  It reuses existing orchestrator and telemetry
# FVT test suites; no new test logic is needed.
# =============================================================================

# =============================================================================
# REPORT  (one folder and one SVT report per run)
# =============================================================================
report:
  report_path: ""
  report_name: ""
  run_id: ""
