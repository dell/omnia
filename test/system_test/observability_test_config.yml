# =============================================================================
# observability_test_config.yml - settings of the SVT theme observability
# =============================================================================
# Read by ./setup_env.sh --theme observability and by
# ./run_validation.sh svt_observability. The cluster values (IPs, names) and the
# telemetry sources (iDRAC and LDMS on, the others off) are in user_inputs.yml
# (block telemetry); credentials are never written here
# (./setup_env.sh --theme observability --set-domain-creds).
# Cleanup flags are shared by every theme and live only in the cleanup block of
# user_inputs.yml. ./setup_env.sh --configure writes the observability block into
# the FVT suites' test/<suite>/test_config.yml. A change here needs
# ./setup_env.sh --configure (a new run).
#
# Default flow: a deployed cluster. ./run_validation.sh svt_observability all
# leaves out prepare_base, repo_sync, image_build and cluster_deploy
# (--skip-stages none runs them), and ./setup_env.sh does no cleanup unless
# --force. The pipeline does the same (skip_stages and clean_reinstall of the
# cluster block empty).
# =============================================================================

# =============================================================================
# OBSERVABILITY  (written into test/telemetry/test_config.yml)
# =============================================================================
observability:
  # sync_telemetry_input: false keeps the deployed telemetry inputs (the ones
  #   ./setup_env.sh installs from user_inputs.yml); the FVT does not push a dataset.
  sync_telemetry_input: false
  # configure_ome / configure_sfm: false. The theme checks iDRAC and LDMS only; no
  #   external appliance is configured by the FVT.
  configure_ome: false
  configure_sfm: false

# =============================================================================
# REPORT  (one folder and one SVT report per run)
# =============================================================================
report:
  # report_path: parent of the run folders ("" = test/system_test/reports).
  report_path: ""
  # report_name: file name without extension ("" = svt_observability_report).
  report_name: ""
  # run_id: "" = a new svt-<UTC time> at every ./setup_env.sh --configure.
  run_id: ""

# =============================================================================
# STAGES  (on or off. A stage that is off is left out of 'all' and of the pipeline,
#          and runs only when asked for by name: ./run_validation.sh svt_observability <stage>)
# =============================================================================
stages:
  # observability_cleanup removes the iDRAC and LDMS telemetry of an earlier deployment
  # before the new one is deployed. Off by default: the deploy stage replaces the
  # telemetry on its own. true: 'all' and the pipeline run it.
  observability_cleanup: false
