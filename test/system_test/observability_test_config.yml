# =============================================================================
# observability_test_config.yml - settings of the SVT theme observability
# =============================================================================
# Read by ./setup_env.sh --theme observability and by
# ./run_validation.sh svt_observability. The cluster values (IPs, names) and the
# telemetry sources (iDRAC, LDMS, PowerScale and OME on by default) are in user_inputs.yml
# (block telemetry); credentials are never written here
# (./setup_env.sh --theme observability --set-domain-creds).
#
# The source stages (observability_idrac, _ldms, _powerscale, _ome, _ufm, _sfm) need no
# setting here: each runs when its source is on and is skipped automatically, with the
# reason, while it is off. A source is on when telemetry_sources.<source> has metrics_enabled
# or logs_enabled true in the telemetry block of user_inputs.yml (the deployed
# telemetry_config.yml); SFM follows configure_sfm (below), it is not a telemetry source.
# PowerScale, OME (on by default in user_inputs.yml) and UFM (off) need an external
# appliance; to check one:
#   1. user_inputs.yml block telemetry: turn the source on (powerscale, ome + vector_ome,
#      ufm) and give its configuration (csm_observability_values_file_path, ufm_endpoint).
#      SFM only needs the VictoriaMetrics sink;
#   2. OME and SFM only: configure_ome / configure_sfm and the appliance addresses
#      below, then, after ./setup_env.sh --configure wrote them into
#      test/telemetry/test_config.yml, ./setup_env.sh --theme observability prompts for the
#      OME and SFM appliance credentials (test_creds.yml) when they are on, in a terminal
#      (an unattended run reports them and skips the prompt). The domain credentials csi_*,
#      ufm_* go in telemetry_credentials.yml with the others.
# Cleanup flags are shared by every theme and live only in the cleanup block of
# user_inputs.yml. ./setup_env.sh --configure writes the observability block into
# the FVT suites' test/<suite>/test_config.yml. A change here needs
# ./setup_env.sh --configure (a new run).
#
# Default flow: a deployed cluster. ./run_validation.sh svt_observability all
# leaves out prepare_base, repo_sync, image_build and cluster_deploy
# (--skip-stages none runs them), and ./setup_env.sh does no cleanup unless
# --force. The pipeline does the same (skip_stages and clean_reinstall of the
# cluster block empty). Then: observability_sfm_vm_only (below), observability_cleanup
# (always runs, hard: omnia.sh -r telemetry --tags cleanup -e cleanup_credentials=false),
# observability_precheck, observability_deploy and the source stages.
#
# Set by the SVT, not here: sync_telemetry_input is always false (the FVT does not push
# a dataset), force_external_kafka_playbook follows configure_ome and
# force_external_victoria_playbook follows configure_sfm. The report goes to
# test/system_test/reports/<run id>/svt_observability_report.
# =============================================================================

# =============================================================================
# OBSERVABILITY  (written into test/telemetry/test_config.yml)
# =============================================================================
observability:
  # configure_ome: true lets stage observability_ome configure the OME appliance (TLS
  #   certificates, Kafka forwarder) and check the OME data in Kafka, VictoriaMetrics and
  #   VictoriaLogs; it needs ome_ip and the OME credentials. false: only the Vector-OME
  #   bridge and the KafkaUser are checked.
  configure_ome: false
  # ome_ip: IP or host name of the OME REST API ("" = not set).
  ome_ip: ""
  # configure_sfm: true lets stage observability_sfm configure the SFM appliance (CA
  #   import, Remote Write to VictoriaMetrics, Prometheus pod /etc/hosts) and check the SFM
  #   metrics; it needs sfm_api_ip, sfm_ssh_ip and the SFM credentials. false: every SFM
  #   check, and stage observability_sfm_vm_only, is skipped.
  configure_sfm: false
  # sfm_api_ip / sfm_api_port: SFM REST API; sfm_ssh_ip / sfm_ssh_port: SFM SSH console
  #   (its host key must be in known_hosts of this OIM).
  sfm_api_ip: ""
  sfm_api_port: 443
  sfm_ssh_ip: ""
  sfm_ssh_port: 22

# =============================================================================
# STAGES  (on or off. A stage that is off is left out of 'all' and of the pipeline,
#          and runs only when asked for by name: ./run_validation.sh svt_observability <stage>)
# The source stages (idrac, ldms, powerscale, ome, ufm, sfm) are not listed: they follow
# their source (see the top of this file). observability_cleanup always runs.
# =============================================================================
stages:
  # observability_sfm_vm_only, the first observability stage, skipped while configure_sfm
  # is false: omnia.sh -r telemetry --tags cleanup -e cleanup_credentials=false, then
  # --tags deploy_sinks -e victoria_metrics (only the VictoriaMetrics sink), --tags
  # external_victoria (a new connection export), and the SFM checks. It REMOVES the
  # deployed telemetry and leaves only VictoriaMetrics; observability_cleanup and
  # observability_deploy, which run next, bring up the full telemetry again.
  # false: 'all' and the pipeline leave it out.
  observability_sfm_vm_only: true
