# =============================================================================
# observability_test_config.yml - settings of the SVT theme observability
# =============================================================================
# Read by ./setup_env.sh --theme observability and by
# ./run_validation.sh svt_observability. The cluster values (IPs, names) and the
# telemetry sources (iDRAC and LDMS on, the others off) are in user_inputs.yml
# (block telemetry); credentials are never written here
# (./setup_env.sh --theme observability --set-domain-creds).
#
# Source stages (observability_idrac, _ldms, _powerscale, _ome, _ufm, _sfm) are skipped
# automatically, with the reason, while their source is off: telemetry_sources.<source>
# with no metrics_enabled or logs_enabled true in the telemetry block of user_inputs.yml
# (the deployed telemetry_config.yml), and configure_sfm false (below) for SFM.
# PowerScale, OME, UFM and SFM (off in user_inputs.yml by default) need an external
# appliance; to check one:
#   1. stages: below, keep the stage on;
#   2. user_inputs.yml block telemetry: turn the source on (powerscale, ome + vector_ome,
#      ufm) and give its configuration (csm_observability_values_file_path, ufm_endpoint).
#      SFM is not a telemetry source: it only needs the VictoriaMetrics sink;
#   3. OME and SFM only: configure_ome / configure_sfm and the appliance addresses
#      below, then, after ./setup_env.sh --configure wrote them into
#      test/telemetry/test_config.yml, the appliance credentials (test_creds.yml):
#        cd ../telemetry && bash setup_env.sh --set-creds
#      (the domain credentials csi_*, ufm_* go in telemetry_credentials.yml with the
#      others: ./setup_env.sh --theme observability --update-domain-creds).
# Cleanup flags are shared by every theme and live only in the cleanup block of
# user_inputs.yml. ./setup_env.sh --configure writes the observability block into
# the FVT suites' test/<suite>/test_config.yml. A change here needs
# ./setup_env.sh --configure (a new run).
#
# Default flow: a deployed cluster. ./run_validation.sh svt_observability all
# leaves out prepare_base, repo_sync, image_build and cluster_deploy
# (--skip-stages none runs them), and ./setup_env.sh does no cleanup unless
# --force. The pipeline does the same (skip_stages and clean_reinstall of the
# cluster block empty).
# =============================================================================

# =============================================================================
# OBSERVABILITY  (written into test/telemetry/test_config.yml)
# =============================================================================
observability:
  # sync_telemetry_input: false keeps the deployed telemetry inputs (the ones
  #   ./setup_env.sh installs from user_inputs.yml); the FVT does not push a dataset.
  sync_telemetry_input: false
  # configure_ome: true lets stage observability_ome configure the OME appliance (TLS
  #   certificates, Kafka forwarder) and check the OME data in Kafka, VictoriaMetrics and
  #   VictoriaLogs; it needs ome_ip and the OME credentials. false: only the Vector-OME
  #   bridge and the KafkaUser are checked.
  configure_ome: false
  # ome_ip: IP or host name of the OME REST API ("" = not set).
  ome_ip: ""
  # force_external_kafka_playbook: true re-runs the external_kafka_connect playbook (new
  #   OME client certificates) even when they exist.
  force_external_kafka_playbook: false
  # configure_sfm: true lets stage observability_sfm configure the SFM appliance (CA
  #   import, Remote Write to VictoriaMetrics, Prometheus pod /etc/hosts) and check the SFM
  #   metrics; it needs sfm_api_ip, sfm_ssh_ip and the SFM credentials. false: every SFM
  #   check is skipped.
  configure_sfm: false
  # sfm_api_ip / sfm_api_port: SFM REST API; sfm_ssh_ip / sfm_ssh_port: SFM SSH console
  #   (its host key must be in known_hosts of this OIM).
  sfm_api_ip: ""
  sfm_api_port: 443
  sfm_ssh_ip: ""
  sfm_ssh_port: 22
  # force_external_victoria_playbook: true re-runs the external_victoria playbook and
  #   imports the SFM certificate again even when the target is healthy.
  force_external_victoria_playbook: false

# =============================================================================
# REPORT  (one folder and one SVT report per run)
# =============================================================================
report:
  # report_path: parent of the run folders ("" = test/system_test/reports).
  report_path: ""
  # report_name: file name without extension ("" = svt_observability_report).
  report_name: ""
  # run_id: "" = a new svt-<UTC time> at every ./setup_env.sh --configure.
  run_id: ""

# =============================================================================
# STAGES  (on or off. A stage that is off is left out of 'all' and of the pipeline,
#          and runs only when asked for by name: ./run_validation.sh svt_observability <stage>)
# =============================================================================
stages:
  # observability_cleanup removes the iDRAC and LDMS telemetry of an earlier deployment
  # before the new one is deployed. Off by default: the deploy stage replaces the
  # telemetry on its own. true: 'all' and the pipeline run it.
  observability_cleanup: false
  # The source stages after observability_ldms, on by default (also when a key is left
  # out). Each runs every FVT check of its source (deploy verify --suite sources --marker
  # <source>), and is skipped by itself while its source is off (see the top of this
  # file). false: 'all' and the pipeline leave the stage out even with the source on.
  observability_powerscale: true
  observability_ome: true
  observability_ufm: true
  observability_sfm: true
