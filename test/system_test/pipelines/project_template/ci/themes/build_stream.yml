# =============================================================================
# Theme: build_stream - stages, timeouts and SVT cases of the child pipeline
# =============================================================================
# render_pipeline.py turns this into one job chain per cluster. A timeout here
# is the default; clusters/<cluster>/cluster.yml "timeouts" overrides it.
# cases must match test/system_test/library/vars/theme_vars.py (the SVT runner
# rejects an unknown case).
# =============================================================================
description: "BuildStream: base domains, BuildStream and GitLab, build and deploy, cadence, automatic cleanup"
timeouts:
  initialization: 1h
  cleanup: 4h
  environment_setup: 4h
  system_verification: 12h
  summary: 30m
cases:
  - build_deploy
  - cadence
  - automatic_cleanup
# OpenBao secrets <openbao_path>/<module> piped to setup_env.sh --domain-creds-stdin
credential_modules:
  - repo_manager
  - image_build_manager
  - orchestrator
  - build_stream
