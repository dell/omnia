# =============================================================================
# Omnia System Verification (SVT) - parent pipeline
# =============================================================================
# Run pipeline (CI/CD > Pipelines > Run pipeline) shows three drop-downs:
#   THEME        build_stream (one file per theme under ci/themes/)
#   CLUSTERS     all | one folder name under clusters/ (comma separated allowed)
#   START_STAGE  re-run from a stage (initialization | cleanup |
#                environment_setup | system_verification)
# A push to the default branch that changes clusters/<name>/ runs that cluster
# with the default theme. A merge request only validates the cluster files.
#
# plan  validates every selected cluster and writes the child pipeline
#       (generated/pipeline.yml): per cluster initialization -> cleanup ->
#       environment_setup -> one job per SVT case -> summary
# run   starts that child pipeline and mirrors its result
# =============================================================================
variables:
  THEME:
    value: "build_stream"
    options: ["build_stream"]
    description: "Integration theme: build_stream (BuildStream flow)"
  CLUSTERS:
    value: "all"
    description: "all, or cluster folder name(s) under clusters/ (comma separated)"
  START_STAGE:
    value: "initialization"
    options: ["initialization", "cleanup", "environment_setup", "system_verification"]
    description: "First stage to run; later stages reuse the OIM state of the previous run"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - clusters/**/*

stages:
  - plan
  - run

plan:
  stage: plan
  script:
    - python3 -c 'import yaml' || { echo "HOW TO FIX - the runner needs PyYAML (dnf install python3-pyyaml)"; exit 1; }
    - python3 ci/scripts/render_pipeline.py --theme "$THEME" --clusters "$CLUSTERS" --start-stage "$START_STAGE" --out generated/pipeline.yml
  artifacts:
    paths:
      - generated/
    expire_in: 30 days

validate_only:
  stage: run
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - python3 ci/scripts/render_pipeline.py --theme "$THEME" --clusters all --check-only

run:
  stage: run
  rules:
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
  trigger:
    include:
      - artifact: generated/pipeline.yml
        job: plan
    strategy: depend
