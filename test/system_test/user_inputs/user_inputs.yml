build_stream:
  # +--------------------------------------------------------------------------+
  # | build_stream_config.yml                                                  |
  # |   build_stream_host_ip  MANDATORY  IP where the BuildStream API runs     |
  # |                                    (normally the OIM)                    |
  # |   gitlab_host           MANDATORY  IP of the GitLab host                 |
  # +--------------------------------------------------------------------------+
  build_stream_config:
    build_stream_host_ip: ""
    gitlab_host: ""
