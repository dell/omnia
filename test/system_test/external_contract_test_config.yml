---
# =============================================================================
# external_contract_test_config.yml - settings of the SVT theme external_contract
# =============================================================================
# Read by ./setup_env.sh (--theme external_contract) and by
# ./run_validation.sh svt_external_contract. The cluster values (IPs, names,
# versions) are in user_inputs.yml; credentials are never written here
# (./setup_env.sh --set-domain-creds).
# ./setup_env.sh --configure writes the cleanup flags into the FVT suites'
# test/<suite>/test_config.yml, so these values override the suites' own ones.
# A change here needs ./setup_env.sh --configure (a new run).
# =============================================================================

# =============================================================================
# CLEANUP  (./setup_env.sh --cleanup, or --force; destructive, asks 'yes'
#           unless --yes)
# =============================================================================
# Removes the previous installation with each suite's own cleanup FVT, in this
# order: build_stream, telemetry, orchestrator, discovery, image_build_manager,
# repo_manager, then main (omnia.sh --cleanup). Every flag below is written
# into that suite's test/<suite>/test_config.yml, so each cleanup FVT runs with
# the value set here.
#   enabled: true | false (default: true). false skips that suite's cleanup.
#   The other keys are the suite's own flags; see test/<suite>/test_config.yml
#   for their meaning.
cleanup:
  build_stream:
    enabled: true
    postgres_backup: false
    cleanup_credentials: true
  telemetry:
    enabled: true
    delete_sinks_volume: true
    cleanup_credentials: true
    cleanup_logs: true
  orchestrator:
    enabled: true
    cleanup_credentials: true
    cleanup_slurm: true
    cleanup_k8s: true
    cleanup_benchmark_tools: true
  discovery:
    enabled: true
  image_build_manager:
    enabled: true
    cleanup_credentials: true
  repo_manager:
    enabled: true
    cleanup_credentials: true
  main:
    enabled: true
    cleanup_all: true

# =============================================================================
# REPORT  (one folder and one SVT report per run)
# =============================================================================
report:
  # report_path: parent of the run folders (default: "" =
  #   test/system_test/reports). Keep it outside OMNIA_DATA_PATH.
  report_path: ""
  # report_name: (default: "" = svt_external_contract_report)
  report_name: ""
  # run_id: (default: "" = a new svt-<UTC time> at every ./setup_env.sh --configure)
  run_id: ""
