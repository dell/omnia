# =============================================================================
# external_contract_test_config.yml - settings of the SVT theme external_contract
# =============================================================================
# Read by ./setup_env.sh (--theme external_contract) and ./run_validation.sh
# svt_external_contract. Cluster values are in user_inputs.yml (cleanup is its shared
# block); credentials are never written here (./setup_env.sh --set-domain-creds).
# A change here needs ./setup_env.sh --configure (a new run).
# =============================================================================
report:
  # report_path: parent of the run folders ("" = test/system_test/reports). Keep it
  #   outside OMNIA_DATA_PATH.
  report_path: ""
  # report_name: "" = svt_external_contract_report
  report_name: ""
  # run_id: "" = a new svt-<UTC time> at every ./setup_env.sh --configure
  run_id: ""
