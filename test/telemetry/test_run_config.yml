# =============================================================================
# Test Run Configuration — Telemetry
# =============================================================================
#
# Configure which test categories to run, execution order, and marker filters.
#
# Usage:
#   1. Edit this file to enable/disable scenarios and set markers
#   2. Run: ./run_validation.sh --config
#
# -----------------------------------------------------------------------------
# Category Structure
# -----------------------------------------------------------------------------
# Top-level categories match the run_validation.sh first argument:
#
#   fvt_telemetry  — Functional Verification Tests (playbook tags)
#
# FVT scenarios (nested under fvt_telemetry):
#   Each scenario maps to an Ansible playbook tag.  Fields:
#     run:          true/false    - Whether to execute this scenario
#     command:      <string>      - exec, verify, or test (default: test)
#                                   exec   = Run the playbook only
#                                   verify = Run verification tests only
#                                   test   = Exec + Verify (full flow)
#     suite:        <folder>      - FVT subfolder filter (empty = all suites)
#     marker:       <expression>  - Marker filter expression (empty = all)
#     dataset:      <name>        - Override dataset from test_config.yml
#                                   Must be a valid folder under datasets/
#     sync_input:   true/false    - Override sync_telemetry_input
#
# -----------------------------------------------------------------------------
# Marker Expression Syntax
# -----------------------------------------------------------------------------
#   Single:   "sanity"                  — tests with @pytest.mark.sanity
#   OR:       "sink,source"             — tests with EITHER marker
#   AND:      "source+sanity"           — tests with BOTH markers
#   Standard: "functional"              — tests with @pytest.mark.functional
#
# Available markers:
#   Quality:       sanity, functional
#   Component:     sink, source
#   Appliance:     ome, ldms, sfm, ufm
#   Execution:     deploy
#
# -----------------------------------------------------------------------------
# Available FVT Suites (subfolders under fvt/<tag>/)
# -----------------------------------------------------------------------------
#   precheck:   cluster
#   validate:   input
#   deploy:     sinks, sources
#   cleanup:    cleanup
#
# =============================================================================

---

# =============================================================================
# Global Overrides
# =============================================================================
# dataset_override: Override the dataset from test_config.yml for ALL scenarios.
#   When set, this takes precedence over both test_config.yml dataset and
#   per-scenario dataset overrides below.
#   Must be a valid folder name under datasets/.
#   Leave commented out to use per-scenario or test_config.yml defaults.
# dataset_override: "my_custom_ds"

# sync_input_override: Override sync_telemetry_input for ALL scenarios.
# sync_input_override: true

# =============================================================================
# Execution Options
# =============================================================================
# skip_on_failure: Stop the current suite on first test failure.
#                  When false (default), all tests run regardless of failures.
skip_on_failure: false

# =============================================================================
# FVT — Functional Verification Tests
# =============================================================================
fvt_telemetry:
  precheck:
    run: false
    command: "test"
    suite: ""
    marker: "sanity"
    dataset: ""
    sync_input: false
  validate:
    run: false
    command: "test"
    suite: ""
    marker: "sanity"
    dataset: ""
    sync_input: false
  deploy:
    run: false
    command: "test"
    suite: ""
    marker: "sanity"
    dataset: ""
    sync_input: false
  cleanup:
    run: false
    command: "test"
    suite: ""
    marker: "sanity"
    dataset: ""
    sync_input: false
