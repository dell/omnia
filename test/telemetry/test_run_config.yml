# =============================================================================
# Test Run Configuration — Telemetry
# =============================================================================
#
# Configure which test suites to run, execution order, and marker filters.
#
# Usage:
#   1. Edit this file to enable/disable suites and set markers
#   2. Run: ./run_validation.sh --config
#
# -----------------------------------------------------------------------------
# Suite definitions
# -----------------------------------------------------------------------------
# Each suite has:
#   order:       <int>         - Execution order (ascending). Order values MUST
#                                be unique across enabled suites.
#   run:         true/false    - Whether to execute this suite
#   command:     <string>      - Execution mode: deploy, verify, or test (default: test)
#                                deploy  = Run the playbook only
#                                verify  = Run verification tests only (skip playbook)
#                                test    = Deploy + Verify (full flow)
#   suite:       <folder>      - FVT folder name under fvt/ to run
#   marker:      <expression>  - Marker filter expression (empty = all tests)
#
# Marker expression syntax:
#   Single:   "sanity"                  - tests with @pytest.mark.sanity
#   OR:       "sink,source"             - tests with EITHER marker
#   AND:      "source+sanity"           - tests with BOTH markers
#
# Available markers:
#   Quality:       sanity, functional, regression
#   Component:     sink, source
#   Phase:         deploy
#
# Available suites (under fvt/):
#   telemetry           - Full end-to-end: deploy (no tags) + verify
#                          (sinks, sources, cluster health).
#
#   precheck            - Precheck environment tests (env vars, K8s health)
#
#   deploy              - Deploy with --tags deploy, then verify all K8s
#                          resources (pods, services, topics, configs).
#                          Suites: sinks/ (kafka, vm, vl), sources/ (idrac, ldms, ome)
#
#   validate            - Deploy with --tags validate, then verify
#                          input validation output.
#
#   cleanup             - Deploy with --tags cleanup, then verify resources
#                          removed.
# =============================================================================

---

# =============================================================================
# Execution Options
# =============================================================================
# skip_on_failure: Stop the current suite on first test failure.
#                  When false (default), all tests run regardless of failures.
skip_on_failure: false

scenarios:

  # =========================================================================
  # telemetry - Full end-to-end (deploy + verify)
  # =========================================================================
  # Deploys telemetry.yml (no tags - default: full stack).
  # Then verifies the complete state: sinks (Kafka, VictoriaMetrics,
  # VictoriaLogs), sources (iDRAC, LDMS, OME), cluster health.
  #
  # Supported suites (subfolders inside fvt/telemetry/):
  #   sinks    - Kafka, VictoriaMetrics, VictoriaLogs verification
  #   sources  - iDRAC, LDMS, OME source verification
  #
  # Supported markers:
  #   sanity    - Baseline must-pass tests
  #   sink      - Sink component tests
  #   source    - Source component tests
  telemetry:
    order: 1
    run: true
    command: "verify"
    suite: ""
    marker: "sanity"

  # =========================================================================
  # precheck - Precheck environment
  # =========================================================================
  # Runs: ansible-playbook telemetry.yml --tags precheck
  # Then verifies: env vars, K8s cluster health, connectivity.
  #
  # Supported suites (subfolders inside fvt/precheck/):
  #   cluster - K8s cluster health checks
  #
  # Supported markers:
  #   sanity    - All precheck tests are sanity baseline
  precheck:
    order: 10
    run: false
    command: "test"
    suite: ""
    marker: "sanity"

  # =========================================================================
  # deploy - Deploy telemetry + verify resources
  # =========================================================================
  # Runs: ansible-playbook telemetry.yml --tags deploy
  # Then verifies: K8s pods, services, Kafka topics, VictoriaMetrics,
  # VictoriaLogs, iDRAC StatefulSet, LDMS aggregator, OME bridge.
  #
  # Supported suites (subfolders inside fvt/deploy/):
  #   sinks/kafka    - Kafka broker and topic verification
  #   sinks/vm       - VictoriaMetrics cluster verification
  #   sinks/vl       - VictoriaLogs cluster verification
  #   sources/idrac  - iDRAC telemetry StatefulSet verification
  #   sources/ldms   - LDMS aggregator and sampler verification
  #   sources/ome    - OME bridge verification
  #
  # Supported markers:
  #   sanity    - Baseline must-pass tests
  #   sink      - Sink component tests
  #   source    - Source component tests
  deploy:
    order: 20
    run: false
    command: "test"
    suite: ""
    marker: "sanity"

  # =========================================================================
  # validate - Validate inputs + verify status
  # =========================================================================
  # Runs: ansible-playbook telemetry.yml --tags validate
  # Then verifies: input validation output.
  validate:
    order: 30
    run: false
    command: "test"
    suite: ""
    marker: "sanity"

  # =========================================================================
  # cleanup - Cleanup telemetry + verify removal
  # =========================================================================
  # Runs: ansible-playbook telemetry.yml --tags cleanup
  # Then verifies: pods removed, topics removed, services removed.
  cleanup:
    order: 40
    run: false
    command: "test"
    suite: ""
    marker: "sanity"
