# Telemetry FVT — Test Configuration
# Non-sensitive settings for the test runner.

# =============================================================================
# TARGET SERVER
# =============================================================================

# IP address of the target OIM server (kube_vip host)
target_host: ""

# SSH username for target connection
target_user: "root"

# SSH port
target_port: 22

# =============================================================================
# PROJECT SETTINGS
# =============================================================================

# Omnia project name on the target
project_name: "project_default"

# Omnia data path on the target
omnia_data_path: "/opt/omnia"

# Path where omnia repo is cloned on the target
clone_path: "/root/omnia"

# Repo URL for cloning (if sync_project: true)
repo_url: ""

# Branch to clone
branch: "main"

# =============================================================================
# DATASET
# =============================================================================

# Dataset name (directory under datasets/)
# Empty = use src/telemetry/input/ directly (or target server files)
dataset: ""

# Sync telemetry input files to target before tests
sync_telemetry_input: false

# Sync omnia project to target before tests
sync_project: false

# =============================================================================
# REPORT
# =============================================================================

# Report output directory (relative to test module root)
report_path: "reports"

# Report file name (without extension)
report_name: "telemetry_test_report"
