# =============================================================================
# Test Run Configuration — Orchestrator
# =============================================================================
#
# Configure which test categories to run, execution order, and marker filters.
#
# Usage:
#   1. Edit this file to enable/disable scenarios and set markers
#   2. Run: ./run_validation.sh --config
#
# -----------------------------------------------------------------------------
# Category Structure
# -----------------------------------------------------------------------------
# Top-level categories match the run_validation.sh first argument:
#
#   fvt_orchestrator  — Functional Verification Tests (playbook tags)
#   fvt_k8s           — Standalone Kubernetes Verification Tests
#
# FVT scenarios (nested under fvt_orchestrator):
#   Each scenario maps to an Ansible playbook tag.  Fields:
#     run:          true/false    - Whether to execute this scenario
#     command:      <string>      - exec, verify, or test (default: test)
#                                   exec   = Run the playbook only
#                                   verify = Run verification tests only
#                                   test   = Exec + Verify (full flow)
#     suite:        <folder>      - FVT subfolder filter (empty = all suites)
#     marker:       <expression>  - Marker filter expression (empty = all)
#     dataset:      <name>        - Override dataset from test_config.yml
#                                   Must be a valid folder under datasets/
#     sync_input:   true/false    - Override sync_orchestrator_input
#
# -----------------------------------------------------------------------------
# Marker Expression Syntax
# -----------------------------------------------------------------------------
#   Single:   "sanity"                  — tests with @pytest.mark.sanity
#   OR:       "sanity,functional"       — tests with EITHER marker
#   AND:      "sanity+functional"       — tests with BOTH markers
#   Standard: "functional"              — tests with @pytest.mark.functional
#
# Available markers:
#   Quality:       sanity, functional, regression
#   Execution:     deploy
#
# -----------------------------------------------------------------------------
# Available FVT Suites (subfolders under fvt/<tag>/)
# -----------------------------------------------------------------------------
#   validate:   status, slurm, kubernetes
#   prepare:    openchami
#   provision:  slurm, kubernetes
#   cleanup:    status
#   kubernetes: (comprehensive K8s tests)
#
# =============================================================================

---

# =============================================================================
# Execution Options
# =============================================================================
# skip_on_failure: Stop the current suite on first test failure.
#                  When false (default), all tests run regardless of failures.
skip_on_failure: false

# =============================================================================
# FVT — Functional Verification Tests
# =============================================================================
fvt_orchestrator:
  validate:
    run: true
    command: "test"
    suite: ""
    marker: "sanity"
    dataset: ""
    sync_input: true

  prepare:
    run: true
    command: "test"
    suite: ""
    marker: ""
    dataset: ""
    sync_input: true

  provision:
    run: true
    command: "exec"
    suite: "kubernetes"
    marker: ""
    dataset: "k8s_only"
    sync_input: true

  cleanup:
    run: false
    command: "test"
    suite: ""
    marker: ""
    dataset: ""
    sync_input: false

# =============================================================================
# FVT — Kubernetes-Specific Verification Tests
# =============================================================================
# Standalone K8s entry point.  Run with:
#   ./run_validation.sh fvt_k8s <tag> <command> [options]
#
# Tags map to fvt/validate/kubernetes/ test files:
#   services   — CRI-O, chronyd, kubectl/kubeadm versions, runtime, status
#   etcd       — etcd health, member list, leader consistency
#   ha         — Virtual IP / HA configuration
#   network    — kube-vip, Calico, MetalLB pods
#   storage    — NFS, StorageClass, PVs, CSI, telemetry PVCs
#   firewall   — Firewall port verification on CP and workers
# =============================================================================
fvt_k8s:
  services:
    run: true
    command: "verify"
    suite: "kubernetes"
    marker: "kubernetes,sanity"
    dataset: "k8s_only"
    sync_input: true

  etcd:
    run: true
    command: "verify"
    suite: "kubernetes"
    marker: "kubernetes,sanity"
    dataset: "k8s_only"
    sync_input: false

  ha:
    run: false
    command: "verify"
    suite: "kubernetes"
    marker: "kubernetes,sanity"
    dataset: "k8s_only"
    sync_input: false

  network:
    run: true
    command: "verify"
    suite: "kubernetes"
    marker: "kubernetes,sanity"
    dataset: "k8s_only"
    sync_input: false

  storage:
    run: false
    command: "verify"
    suite: "kubernetes"
    marker: "kubernetes,sanity"
    dataset: "k8s_only"
    sync_input: false

  firewall:
    run: false
    command: "verify"
    suite: "kubernetes"
    marker: "kubernetes,sanity"
    dataset: "k8s_only"
    sync_input: false
