# Batch execution configuration for migrated Orchestrator lifecycle suites.
# Run with: ./run_validation.sh --config
---
skip_on_failure: false

fvt_orchestrator:
  precheck:
    run: false
    command: "test"
    suite: ""
    marker: "sanity"
    dataset: ""
    sync_input: false
    sync_output: false
    sync_image_output: false
  prepare:
    run: false
    command: "test"
    suite: ""
    marker: "sanity"
    dataset: ""
    sync_input: false
    sync_output: false
    sync_image_output: false
  provision:
    run: false
    command: "test"
    suite: ""
    marker: "sanity"
    dataset: ""
    sync_input: false
    sync_output: false
    sync_image_output: false

  pxeboot:
    run: false
    command: "test"
    suite: ""
    marker: "sanity"
    dataset: ""
    sync_input: false
    sync_output: false
    sync_image_output: false
  # Cleanup is destructive and is never included in an implicit all run.
  # Enable it only after reviewing the cleanup settings in test_config.yml.
  cleanup:
    run: false
    command: "test"
    suite: ""
    marker: "sanity"
    dataset: ""
    sync_input: false
    sync_output: false
    sync_image_output: false

# NFT is a separate destructive workflow. A complete run executes prepare and
# provision, verifies repeat execution and security contracts, and finishes
# with full cleanup. Do not enable it in the same unattended batch as FVT
# cleanup. An empty marker runs the complete NFT suite; use performance,
# idempotency, or security only for an explicitly scoped run.
nft_orchestrator:
  run: false
  command: "test"
  marker: ""
