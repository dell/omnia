---
# =============================================================================
# k8s_and_slurm.yml — Combined Kubernetes + Slurm profile for orchestrator dataset generation
# =============================================================================
# Extends defaults.yml with combined Kubernetes and Slurm configuration values
# =============================================================================

# =============================================================================
# Combined K8s + Slurm Configuration
# =============================================================================

# DCGM enabled for combined deployments (SLURM GPU monitoring)
dcgm_enabled: true

# =============================================================================
# File Filter Configuration
# =============================================================================
# Controls which files are included when using --from-src
# =============================================================================

# Files to include (relative to src/orchestrator/)
include_files:
  input:
    - additional_cloud_init.yml
    - high_availability_config.yml
    - network_spec.yml
    - omnia_config.yml
    - orchestrator_config.yml
    - pxe_mapping_file.csv
    - security_config.yml
    - set_pxe_boot_config.yml
    - storage_config.yml
  samples:
    - repo_manager_output
    - image_build_manager_output
