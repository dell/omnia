---
# =============================================================================
# defaults.yml — Default variable values for orchestrator dataset generation
# =============================================================================
# All profiles inherit these values. Override any key in a profile YAML file.
# Templates in templates/ reference these keys.
# =============================================================================

# =============================================================================
# Orchestrator Configuration
# =============================================================================

# PXE mapping file path
pxe_mapping_file_path: ""

# System language
language: "en_US.UTF-8"

# Default DHCP lease time
default_lease_time: "86400"

# DNS enabled flag
dns_enabled: false

# Kernel version override
kernel_version_override: ""

# Additional cloud-init config file
additional_cloud_init_config_file: ""

# Boot kernel parameters
boot_kernel_params: ""

# Catalog file path
catalog_file_path: ""

# Image build manager output path
image_build_manager_output_path: ""

# Repo manager output path
repo_manager_output_path: ""

# DCGM enabled flag
dcgm_enabled: true
