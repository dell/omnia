# ***********************************************************************
# Dataset overlay: aci_enabled
# This is a complete orchestrator_config.yml with additional_cloud_init
# enabled.  All other variables retain their shipped defaults.
#
# Usage:
#   In test_config.yml (or test_run_config.yml per-scenario):
#     dataset: "aci_enabled"
#     sync_orchestrator_input: true
# ***********************************************************************

#### Mandatory field (optional path override)
# This depicts the path where user has kept the PXE mapping file.
# Leave empty to use $ORCHESTRATOR_DATA_PATH/input/$OMNIA_PROJECT_NAME/pxe_mapping_file.csv.
pxe_mapping_file_path: ""

#### Mandatory
# Language that needs to be set during OS provisioning.
language: "en_US.UTF-8"

#### Mandatory
# Default lease time needs to be used by DHCP
# Unit: seconds
default_lease_time: "86400"

#### Optional
# Enable DNS-based hostname resolution for compute nodes.
dns_enabled: false

#### Optional — CHANGED FROM DEFAULT
# Path to additional cloud-init configuration file for stateless node provisioning.
# Points to the additional_cloud_init.yml synced alongside this file.
# The runtime path is resolved relative to the active project input directory.
additional_cloud_init_config_file: "additional_cloud_init.yml"

#### Optional
# Additional kernel command-line parameters appended to the boot-service
# boot configuration for all functional groups.
boot_kernel_params: ""

#### Optional
# Path to the catalog JSON file produced by repo_manager.
catalog_file_path: ""

#### Optional
# Enable PXE boot support via iDRAC (default: true)
enable_pxe_boot: true

# Leave empty to use the current OMNIA_DATA_PATH and OMNIA_PROJECT_NAME.
image_build_manager_output_path: ""

#### Optional
# Path to repo_status.yml produced by repo_manager.
repo_manager_output_path: ""

#### Optional
# Enable NVIDIA DCGM (Data Center GPU Manager) installation on GPU nodes.
dcgm_enabled: true
