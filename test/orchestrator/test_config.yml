# =============================================================================
# Orchestrator — Test Configuration
# =============================================================================
# Non-sensitive settings for Orchestrator functional and non-functional tests.
#
# Before running tests:
#   - Set oim_server_ip to the target server where orchestrator runs.
#   - Leave oim_server_ip empty to run tests locally on the same machine.
#   - Enable only the sync options needed for the selected test dataset.
#   - Sensitive test credentials (SSH and LDAP test-user secrets) belong in
#     encrypted test_creds.yml; configure them with setup_env.sh.
#   - Domain credentials (provision, Slurm, OpenLDAP, CSI) use a separate
#     encrypted store on the execution OIM; configure them with
#     ./setup_env.sh --set-domain-creds. They are never dataset content.
# =============================================================================

---

# =============================================================================
# TARGET SERVER CONNECTION
# =============================================================================
# IP address of the server where orchestrator playbook runs.
# Leave empty for local mode (running directly on the target server).
# Set to a remote IP to run all verification commands over SSH.
#
# When a remote IP is set, the framework will:
#   1. Sync the local project code to clone_path on the target (rsync)
#   2. Sync orchestrator input only when sync_orchestrator_input is true
#   3. Sync repo_manager output only when sync_repo_manager_output is true
#   4. Sync image_build_manager output only when its sync option is true
#   5. Run verification commands through SSH/Testinfra
# Domain credentials are never synced by the framework.
oim_server_ip: ""

# SSH username for remote server (only needed for remote mode).
oim_ssh_user: root

# SSH port for remote server (only needed for remote mode).
oim_ssh_port: 22

# =============================================================================
# PROJECT SYNC SETTINGS (remote execution)
# =============================================================================
# The local omnia monorepo is synced (rsync) to clone_path on the target.
# Playbook runs from <clone_path>/src/orchestrator/playbooks/
#
# clone_path:   Absolute path on the TARGET SERVER where the project code is
#               synced.
#               Only used in remote mode. In local mode, the playbook path is
#               resolved automatically from the source tree.
clone_path: "/omnia"

# =============================================================================
# DATASET CONFIGURATION
# =============================================================================
# Selects the local source used by each enabled sync operation. Merely setting
# a dataset does not copy files or alter the execution OIM.
#
# Default (empty):
#   Leaves target runtime files unchanged when all sync flags are false.
#   If input sync is enabled, src/orchestrator/input/ is its source.
#   Enabled upstream-output syncs use the matching directory below
#   src/orchestrator/samples/.
#
# Custom dataset:
#   Set to a folder name under test/orchestrator/datasets/<name>/.
#   The selected dataset supplies overrides for Orchestrator input and the
#   complete source for each upstream-output handoff. Enable the corresponding
#   sync option below to copy that content to the execution target.
#   Each dataset folder must contain:
#     input/ (9 input files: orchestrator_config.yml, network_spec.yml, etc.)
#     repo_manager_output/ (repo_status.yml)
#     image_build_manager_output/ (build_status.yml)
dataset: ""

# =============================================================================
# SYNC — ORCHESTRATOR INPUT
# =============================================================================
# When true, stages the checked-in src/orchestrator/input/ tree, overlays the
# selected dataset's input/ when dataset is non-empty, and syncs the result to
# the active runtime project on the execution OIM.
# Destination: <ORCHESTRATOR_DATA_PATH>/input/<OMNIA_PROJECT_NAME>/ when set;
# otherwise <OMNIA_DATA_PATH>/orchestrator/input/<OMNIA_PROJECT_NAME>/.
#
# Domain credentials are not part of this input sync. Configure the encrypted
# credential store directly on the execution OIM with --set-domain-creds.
sync_orchestrator_input: false

# =============================================================================
# SYNC — REPO MANAGER OUTPUT
# =============================================================================
# When true, syncs repo_manager_output/ from the selected local source. A
# non-empty dataset uses datasets/<dataset>/repo_manager_output/; an empty
# dataset uses src/orchestrator/samples/repo_manager_output/.
# Destination: <REPO_MANAGER_DATA_PATH>/output/<OMNIA_PROJECT_NAME>/ when set;
# otherwise <OMNIA_DATA_PATH>/repo_manager/output/<OMNIA_PROJECT_NAME>/.
#
# Enable this only when the target does not already have the required
# repo_status.yml from a real Repo Manager run.
sync_repo_manager_output: false

# =============================================================================
# SYNC — IMAGE BUILD MANAGER OUTPUT
# =============================================================================
# When true, syncs image_build_manager_output/ from the selected local source.
# A non-empty dataset uses datasets/<dataset>/image_build_manager_output/; an
# empty dataset uses src/orchestrator/samples/image_build_manager_output/.
# Destination: <IMAGE_BUILD_MANAGER_DATA_PATH>/output/<OMNIA_PROJECT_NAME>/
# when set; otherwise
# <OMNIA_DATA_PATH>/image_build_manager/output/<OMNIA_PROJECT_NAME>/.
#
# Enable this only when the target does not already have the required
# build_status.yml from a real Image Build Manager run.
sync_image_build_manager_output: false


# =============================================================================
# LDAP SLAPD.CONF CONFIGURATION (for external LDAP tests)
# =============================================================================
# These non-sensitive inputs describe the existing external LDAP directory
# that the omnia_auth container must proxy. The automation does not install,
# populate, or otherwise modify the external LDAP server.
#
# Set this flag to true to run external LDAP validation. When false, external
# LDAP proxy reconciliation and external-backend checks are skipped. The local
# omnia_auth service, configuration, TLS, and listener checks still run when
# OpenLDAP is enabled in the active Orchestrator catalog.
validate_external_ldap: false
#
# The settings below are evaluated only when validate_external_ldap is true.
# All four external LDAP fields are then required, even when configuration
# reconciliation is disabled, because validation needs an authoritative
# endpoint and naming context.
#
# Set this flag to true only when the OpenLDAP prepare verification is allowed
# to reconcile the local omnia_auth slapd.conf. The verification compares the
# desired and deployed content first. It restarts omnia_auth only when the
# content changes, and restores the previous file if readiness fails.
#
# When this flag is false:
#   - slapd.conf is not changed;
#   - omnia_auth is not restarted; and
#   - validation checks the existing deployed proxy configuration.
configure_external_ldap: false
#
# Passwords must not be added to this file. Store both the LDAP login-test
# password and the external bind password in encrypted test_creds.yml with:
#   ./setup_env.sh --set-creds
#
# Address of the existing external LDAP server. It must be reachable from the
# OIM where the verification runs.
external_ldap_server_ip: ""

# TCP port on which the external LDAP server accepts LDAP requests.
# Default: 1389
# Example: use 389 when the directory exposes standard, non-TLS LDAP.
external_ldap_server_port: 1389

# DNS-style directory domain used to derive the external LDAP base DN.
# Default: omnia.test
# A user-provided multi-label domain is also accepted.
# Examples:
#   omnia.test  -> dc=omnia,dc=test
#   example.com -> dc=example,dc=com
external_ldap_domain: "omnia.test"

# Non-sensitive service account name used by omnia_auth to bind to the
# external directory. Enter only the account name, not a complete DN.
# Default: admin
# A user-provided account name containing letters, numbers, dots, underscores,
# or hyphens is also accepted.
# Examples:
#   username admin + domain omnia.test
#     -> cn=admin,dc=omnia,dc=test
#   username ldapadmin + domain example.com
#     -> cn=ldapadmin,dc=example,dc=com
#
# Store the external LDAP bind password and the LDAP login-test username and
# password in encrypted test_creds.yml. Configure or update those credentials
# with:
#   ./setup_env.sh --set-creds
external_ldap_bind_username: ""

# =============================================================================
# FULL ORCHESTRATOR CLEANUP
# =============================================================================
# Cleanup FVT always invokes the supported full-cleanup entry point:
#
#   ansible-playbook playbooks/orchestrator.yml --tags cleanup
#
# The three settings below are the only extra variables supported by that
# command. The cleanup FVT always supplies all three variables so execution is
# deterministic and never waits at an interactive prompt. All settings default
# to true below. Change a setting to false only when that resource must be
# preserved.
#
# Remove Orchestrator-owned credential artifacts from the active project's
# input directory. Supported values:
#   true  - remove orchestrator_credentials.yml, its vault key, and lock files
#   false - preserve those credential artifacts
# Default: true
cleanup_credentials: true
#
# Decide whether Slurm shared data is deleted. Supported values:
#   true  - delete the configured Slurm shared directories, then unmount the
#           Slurm storage and remove its fstab entries
#   false - preserve shared data, but still unmount the Slurm storage and
#           remove its fstab entries
# Default: true
cleanup_slurm: true
#
# Decide whether Kubernetes shared data is deleted. Supported values:
#   true  - delete every entry under the configured Kubernetes shared mount,
#           then unmount the storage and remove its fstab entries
#   false - preserve shared data, but still unmount the Kubernetes storage and
#           remove its fstab entries
# Default: true
cleanup_k8s: true
#
# DRY_RUN and SKIP_APPROVAL are supported by the product as environment
# controls, not as Ansible extra variables. They are therefore deliberately
# not represented as test_config.yml keys. For a manual product dry run use:
#
#   DRY_RUN=true ansible-playbook playbooks/orchestrator.yml --tags cleanup
#
# Outside this FVT, SKIP_APPROVAL=true selects deletion when the product command
# omits Slurm or Kubernetes choices. The FVT does not need that environment
# control because it always passes explicit true or false values.

# =============================================================================
# NON-FUNCTIONAL PERFORMANCE CONTRACTS
# =============================================================================
# Maximum accepted wall-clock duration, in seconds, for each lifecycle on the
# supported reference OIM with the active project's current input and mapped
# node inventory. The NFT report records both the threshold and actual time.
#
# These limits are acceptance contracts, not Ansible command timeouts. The
# runner grants a bounded collection grace period so it can report a clear
# threshold failure instead of terminating at the exact acceptance boundary.
nft_performance_threshold_seconds:
  precheck: 60
  prepare: 300
  provision: 1800
  cleanup: 180

# =============================================================================
# REPORT CONFIGURATION
# =============================================================================
# Directory where test reports (JSON + HTML) are saved.
# Can be:
#   - A folder name (relative to the current working directory): reports
#   - An absolute path: /var/reports/orchestrator
# No spaces allowed in the path.
report_path: /opt/omnia/reports

# Base name for report files (without extension).
# Generates: orchestrator_test_report.json, orchestrator_test_report.html
# No spaces allowed. Only letters, numbers, underscores, hyphens.
report_name: orchestrator_test_report

# Custom run ID (optional).
# When set, reports use this ID instead of a timestamp (YYYYMMDD_HHMMSS).
# This groups multiple scenario runs under the same report entry.
# Leave empty to auto-generate from timestamp.
# No spaces allowed. Only letters, numbers, underscores, hyphens.
run_id: ""
