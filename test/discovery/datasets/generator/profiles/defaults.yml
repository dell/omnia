# Discovery Dataset Generator — Default Profile
# Base profile for discovery test datasets. Contains default values for
# discovery configuration parameters. Custom profiles can override these values.

# OME (OpenManage Essentials) server configuration
ome_ip: "192.168.1.100"
ome_username: "admin"
ome_password: ""  # Credentials should be set via test_creds.yml, not here

# Discovery mechanism: "ome" for OpenManage Essentials
discovery_mechanism: "ome"

# Network configuration
admin_nic: "eno1"
admin_network: "172.16.0.0"
primary_oim_admin_ip: "172.16.107.254"
admin_gateway: "172.16.107.254"
admin_dynamic_range: "172.16.107.201-172.16.107.250"
ib_network: "192.168.0.0"

# Discovery output configuration
output_dir: "/opt/omnia/discovery/output"

# PXE mapping configuration
pxe_mapping_filename: "bmc_pxe_mapping_file.csv"
discovery_report_filename: "bmc_discovery_report.csv"

# Functional group configuration
functional_groups:
  - name: "compute"
    service_tags: []
  - name: "storage"
    service_tags: []
  - name: "network"
    service_tags: []
