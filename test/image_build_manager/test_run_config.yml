# =============================================================================
# Test Run Configuration — Image Build Manager
# =============================================================================
#
# Configure which test categories to run, their execution order, and filters.
#
# Usage:
#   1. Edit this file to enable/disable scenarios and set markers
#   2. Run: ./run_validation.sh --config
#
# -----------------------------------------------------------------------------
# Category Structure
# -----------------------------------------------------------------------------
# Top-level categories match the run_validation.sh first argument:
#
#   fvt_image_build_manager  — Functional Verification Tests (playbook tags)
#   nft_image_build_manager  — Non-Functional Tests (performance, idempotency)
#   ut_image_build_manager   — Unit Tests (offline validation)
#
# FVT scenarios (nested under fvt_image_build_manager):
#   Each scenario maps to an Ansible playbook tag.  Fields:
#     order:        <integer>     - Batch order (lower values run first)
#     run:          true/false    - Whether to execute this scenario
#     command:      <string>      - exec, verify, or test (default: test)
#                                   exec   = Run the playbook only
#                                   verify = Run verification tests only
#                                   test   = Exec + Verify (full flow)
#     suite:        <folder>      - FVT subfolder filter (empty = all suites)
#     marker:       <expression>  - Marker filter expression (empty = all)
#     dataset:      <name>        - Override dataset from test_config.yml
#                                   Must be a valid folder under datasets/
#     sync_input:   true/false    - Override sync_image_build_input
#     sync_output:  true/false    - Override sync_output
#
# NFT / UT (top-level, no nested scenarios):
#   run:          true/false    - Whether to execute
#   command:      <string>      - use test (exec/verify are accepted aliases
#                                   and run the same complete NFT/UT suite)
#   marker:       <expression>  - Marker filter (empty = all tests)
#
# -----------------------------------------------------------------------------
# Marker Expression Syntax
# -----------------------------------------------------------------------------
#   Single:   "x86_64"                  — tests with @pytest.mark.x86_64
#   OR:       "x86_64,aarch64"          — tests with EITHER marker
#   AND:      "x86_64+sanity"           — tests with BOTH markers
#   Standard: "sanity"                  — tests with @pytest.mark.sanity
#
# Available markers:
#   Architecture:  x86_64, aarch64
#   Quality:       sanity, functional
#   Execution:     deploy, nft
#
# -----------------------------------------------------------------------------
# Available FVT Suites (subfolders under fvt/<tag>/)
# -----------------------------------------------------------------------------
#   precheck:       connectivity
#   validate:       status
#   prepare:        container, s3
#   build:          s3, registry, naming, aarch64, image_verification
#   cleanup:        cleanup
#   cleanup_images: cleanup_images
#
# =============================================================================

---

# =============================================================================
# Global Overrides
# =============================================================================
# dataset_override: Override the dataset for ALL FVT scenarios.
#   When set, this takes precedence over both test_config.yml dataset and
#   per-scenario dataset overrides below.
#   Must be a valid folder name under datasets/.
#   Leave commented out to use per-scenario or test_config.yml defaults.
# dataset_override: "my_custom_ds"

# sync_input_override: Override sync_image_build_input for ALL FVT scenarios.
#   When set, applies to every scenario regardless of per-scenario settings.
# sync_input_override: true

# sync_output_override: Override sync_output for ALL FVT scenarios.
# sync_output_override: false

# =============================================================================
# Execution Behavior
# =============================================================================
# skip_on_failure: When true, do not schedule later enabled batch entries after
#                  the first failed entry. It does not stop tests inside the
#                  currently running pytest suite. False runs every entry.
skip_on_failure: false

# =============================================================================
# FVT — Functional Verification Tests
# =============================================================================
fvt_image_build_manager:
  precheck:
    order: 1
    run: false
    command: "test"
    suite: ""
    marker: "sanity"
    dataset: ""
    sync_input: false
    sync_output: false
  validate:
    order: 2
    run: false
    command: "test"
    suite: ""
    marker: "sanity"
    dataset: ""
    sync_input: false
    sync_output: false
  prepare:
    order: 3
    run: false
    command: "test"
    suite: ""
    marker: "sanity"
    dataset: ""
    sync_input: false
    sync_output: false
  build:
    order: 4
    run: false
    command: "test"
    suite: ""
    marker: "sanity"
    dataset: ""
    sync_input: false
    sync_output: false
  cleanup_images:
    order: 5
    run: false
    command: "test"
    suite: ""
    marker: "sanity"
    dataset: ""
    sync_input: false
    sync_output: false
  cleanup:
    order: 6
    run: false
    command: "test"
    suite: ""
    marker: "sanity"
    dataset: ""
    sync_input: false
    sync_output: false

# =============================================================================
# NFT — Non-Functional Tests
# =============================================================================
nft_image_build_manager:
  run: false
  command: "test"
  marker: ""

# =============================================================================
# UT — Unit Tests
# =============================================================================
ut_image_build_manager:
  run: false
  command: "test"
  marker: ""
