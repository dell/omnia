---
# =============================================================================
# defaults.yml — Default variable values for dataset generation
# =============================================================================
# All profiles inherit these values. Override any key in a profile YAML file
# (e.g., internet.yml). Templates in templates/ reference these keys.
#
# Source of truth: src/image_build_manager/input/ and
#                  src/image_build_manager/samples/repo_manager_output/
# =============================================================================

# --- Metadata ---
project_name: "project_default"
registry2_host: ""
cluster_os_type: "rhel"
cluster_os_version: "10.0"

# =============================================================================
# image_build_config.yml
# =============================================================================
repo_manager_output_path: "/opt/omnia/repo_manager/output/project_default/repo_status.yml"

s3_provider: "minio"
s3_endpoint_url: ""

image_build_type: "image-builder"

# Build controls (matches src/image_build_manager/input/image_build_config.yml)
build_image_max_parallel: 0
build_image_build_timeout: 7200
build_image_force_rebuild: false
build_image_backup_s3_images: false

functional_groups_source: "catalog"

aarch64_inventory_host_ip: ""
aarch64_ssh_user: "root"

# =============================================================================
# image_build_credentials.yml
# =============================================================================
s3_access_id: ""
s3_secret_key: ""
aarch64_ssh_password: ""

# =============================================================================
# package_groups.yml
# =============================================================================
# OS metadata (always included — matches src/ package_groups.yml)
os: "rhel"
os_version: "10.0"

base_packages:
  - systemd
  - systemd-udev
  - kernel
  - dracut
  - dracut-live
  - dracut-network
  - squashfs-tools
  - nfs-utils
  - nfs4-acl-tools
  - NetworkManager
  - nm-connection-editor
  - iproute
  - iputils
  - curl
  - bash
  - coreutils
  - grep
  - sed
  - gawk
  - findutils
  - util-linux
  - kbd
  - lsof
  - cryptsetup
  - lvm2
  - device-mapper
  - rsyslog
  - chrony
  - sudo
  - gzip
  - wget
  - cloud-init
  - glibc-langpack-en
  - gedit

# Shared package lists (DRY — referenced by multiple functional groups)
slurm_common_packages:
  - munge
  - firewalld
  - python3-firewall
  - pmix
  - apptainer
  - iscsi-initiator-utils
  - device-mapper-multipath
  - sg3_utils
  - lsscsi

openldap_packages:
  - openldap
  - openldap-clients
  - sssd
  - sssd-ldap
  - oddjob
  - oddjob-mkhomedir

# Per-role extra packages (on top of slurm_common + openldap)
group_extra_packages:
  slurm_node:
    - slurm-slurmd
    - slurm-pam_slurm
    - kernel-devel
    - kernel-headers
  slurm_control_node:
    - slurm-slurmctld
    - slurm-slurmdbd
    - python3-PyMySQL
    - mariadb-server
  login_node:
    - slurm-slurmd
    - slurm
  login_compiler_node:
    - slurm
    - slurm-slurmd

# =============================================================================
# repo_status.yml
# =============================================================================
# Default repo type is "offline" (Pulp-based). Override to "internet" in a
# profile to use public CentOS Stream / EPEL URLs instead.
repo_type: "offline"

# Pulp settings
pulp_port: 2225
pulp_certs_dir: "/opt/omnia/pulp_config/pulp/settings/certs"
pulp_server_crt: "/opt/omnia/pulp_config/pulp/settings/certs/pulp_webserver.crt"
pulp_server_key: "/opt/omnia/pulp_config/pulp/settings/certs/pulp_webserver.key"

# All x86_64 repos in order (matches src/ repo_status.yml)
offline_x86_all_repos:
  - baseos
  - appstream
  - codeready-builder
  - slurm_custom
  - ldms
  - epel
  - kubernetes-v1-35
  - cri-o-v1-35
  - doca
  - docker-ce
  - cuda
  - nvidia-hpc-sdk
  - repo_manager_additional
  - additional_repos

# x86_64 repos that have a URL (others render as empty dict)
offline_x86_url_repos:
  - baseos
  - appstream
  - codeready-builder
  - slurm_custom
  - epel
  - kubernetes-v1-35
  - cri-o-v1-35
  - doca
  - docker-ce
  - cuda
  - nvidia-hpc-sdk
  - repo_manager_additional

# aarch64 repos with URLs
offline_aarch64_url_repos:
  - repo_manager_additional

# Repos where the URL path slug differs from the YAML key
repo_url_slug_overrides:
  repo_manager_additional: "repo_manager-additional"

# All aarch64 repos in order (matches src/ repo_status.yml)
offline_aarch64_all_repos:
  - baseos
  - appstream
  - codeready-builder
  - slurm_custom
  - ldms
  - repo_manager_additional
  - epel
  - kubernetes-v1-35
  - cri-o-v1-35
  - doca
  - docker-ce
  - cuda
  - nvidia-hpc-sdk
  - additional_repos

# file_repos — git
offline_git_repos:
  - name: "karavi_observability"
    path: "karavi-observability"
  - name: "helm_charts"
    path: "helm-charts"

# file_repos — tarball
offline_tarball_repos:
  - name: "sionlib"
    path: "sionlib"
  - name: "msr_safe"
    path: "msr-safe"
  - name: "papi"
    path: "papi"
  - name: "geopm"
    path: "geopm"
  - name: "likwid"
    path: "likwid"
  - name: "osu_micro_benchmarks"
    path: "osu-micro-benchmarks"
  - name: "imb"
    path: "imb"
  - name: "nfs_subdir_external_provisioner_4_0_18"
    path: "nfs-subdir-external-provisioner-4.0.18"
  - name: "helm_v3_20_1_amd64"
    path: "helm-v3.20.1-amd64"
  - name: "victoria_metrics_operator_0_59_3"
    path: "victoria-metrics-operator-0.59.3"
  - name: "strimzi_kafka_operator_helm_3_chart_1_0_1"
    path: "strimzi-kafka-operator-helm-3-chart-1.0.1"
  - name: "cert_manager_v1_10_0"
    path: "cert-manager-v1.10.0"

# file_repos — manifest
offline_manifest_repos:
  - name: "metallb_native_v0_15_3"
    path: "metallb-native-v0.15.3"
  - name: "calico_v3_31_4"
    path: "calico-v3.31.4"

# file_repos — pip_module
offline_pip_repos:
  - name: "kubernetes_33_1_0"
    path: "kubernetes==33.1.0"
  - name: "prettytable_3_14_0"
    path: "prettytable==3.14.0"
  - name: "PyMySQL_1_1_2"
    path: "PyMySQL==1.1.2"
  - name: "omsdk_1_2_518"
    path: "omsdk==1.2.518"
  - name: "cryptography_45_0_7"
    path: "cryptography==45.0.7"
  - name: "prometheus_client_0_20_0"
    path: "prometheus_client==0.20.0"
  - name: "cffi_1_17_1"
    path: "cffi==1.17.1"

# Internet repo URLs (used by internet profile)
internet_repos:
  x86_64:
    baseos: "https://mirror.stream.centos.org/10-stream/BaseOS/x86_64/os/"
    appstream: "https://mirror.stream.centos.org/10-stream/AppStream/x86_64/os/"
    codeready-builder: "https://mirror.stream.centos.org/10-stream/CRB/x86_64/os/"
    epel: "https://dl.fedoraproject.org/pub/epel/10/Everything/x86_64/"
  aarch64:
    baseos: "https://mirror.stream.centos.org/10-stream/BaseOS/aarch64/os/"
    appstream: "https://mirror.stream.centos.org/10-stream/AppStream/aarch64/os/"
    codeready-builder: "https://mirror.stream.centos.org/10-stream/CRB/aarch64/os/"
    epel: "https://dl.fedoraproject.org/pub/epel/10/Everything/aarch64/"

# Whether to generate functional_group_packages.yml in repo_manager_output/
generate_functional_group_packages: true
