---
# image_build_manager configuration
# Copy to config.yml and edit for your environment.
#
# This file provides host and project settings for image_build_manager.
# RPM repos and OS version come from repo_status.yml (separate file).
#
# Paths:
#   input  → src/input/<project_name>/
#   output → src/output/<project_name>/
#   shared → /opt/omnia/image_build_manager  (persistent data: MinIO, registry, workdir, logs)
#   repo_manager output → /opt/omnia/repo_manager/output/<project_name>/

project_name: "project_default"

host:
  hostname: "oim"                  # Short hostname only (NOT FQDN). domain_name is appended automatically.
  shared_path: "/opt/omnia/image_build_manager"  # Persistent storage for MinIO + Registry data
  domain_name: "omnia.cluster"     # Domain suffix. Registry = hostname.domain_name:5000
  admin_nic_ip: ""                 # Admin NIC IP — Pulp and S3 endpoint
