# =============================================================================
# image_build_config.yml — Image Build Manager Configuration
# =============================================================================
#
# Per-domain input configuration for the image_build_manager domain.
# Edit this file, then run: ./copy-input.sh  (or omnia.sh -s)
#
# Sections:
#   1. Upstream Dependency    — repo_manager output path
#   2. S3 Storage Backend     — S3 provider and endpoint
#   3. Image Builder          — builder type, container image, build controls
#   4. Functional Groups      — which OS image variants to build
#   5. ARM Build Host         — aarch64 remote build host
#
# Valid functional group names:
#   x86_64:  os_x86_64, slurm_node_x86_64, slurm_control_node_x86_64,
#            service_kube_control_plane_first_x86_64,
#            service_kube_control_plane_x86_64, service_kube_node_x86_64,
#            login_node_x86_64, login_compiler_node_x86_64
#   aarch64: os_aarch64, slurm_node_aarch64, login_node_aarch64,
#            login_compiler_node_aarch64
#
# S3 bucket names are FIXED constants (do NOT change):
#   boot-images  — OS boot images (kernel, initramfs, rootfs)
#   efi-images   — EFI boot artifacts
# =============================================================================


# ---------------------------------------------------------------------------
# 1. Upstream Dependency
# ---------------------------------------------------------------------------
# Full path to repo_status.yml produced by repo_manager.
# Contains RPM repo URLs, OS metadata, certificate paths, and package list path.
# Convention: /opt/omnia/repo_manager/output/<project_name>/repo_status.yml
repo_manager_output_path: "/opt/omnia/repo_manager/output/project_default/repo_status.yml"


# ---------------------------------------------------------------------------
# 2. S3 Storage Backend
# ---------------------------------------------------------------------------
# provider: "minio" (deployed locally by image_build_manager) or "powerscale" (external).
# endpoint_url: Required for powerscale; auto-detected for minio — leave empty.
s3_configurations:
  provider: "minio"
  endpoint_url: ""


# ---------------------------------------------------------------------------
# 3. Image Builder
# ---------------------------------------------------------------------------
# image_build_type: Which OpenCHAMI image builder to use.
#   "image-builder"     — Standard OpenCHAMI image-builder (default).
#                         Container: dellhpcomniaaisolution/image-build-el10:1.2
#                         Config format: options/repos/packages/cmds
#   "image-thrillhouse" — Next-gen OpenCHAMI builder with extended features.
#                         Container: ghcr.io/openchami/image-thrillhouse:latest
#                         Config format: meta/layer (inline repos, script commands)
# Each type uses its own config templates and container image.
image_build_type: "image-builder"

# build_image: Concurrency and timing controls for the build phase.
#   max_parallel — Max concurrent image builds. 0 = unlimited (all at once).
#   job_async    — Max async wait per build in seconds.
#   job_retry    — Max poll retries for async status check.
#   job_delay    — Delay in seconds between async poll retries.
build_image:
  max_parallel: 2
  job_async: 7200
  job_retry: 240
  job_delay: 30


# ---------------------------------------------------------------------------
# 4. Functional Groups
# ---------------------------------------------------------------------------
# functional_groups_source: Where the list of groups to build comes from.
#   "config"      — Use the functional_groups list below (manual selection).
#   "repo_status" — Auto-detect from repo_manager output. All groups with
#                   packages in functional_group_packages.yml are built.
#                   aarch64 groups are skipped if no ARM host is configured.
functional_groups_source: "config"

# functional_groups: Image variants to build (used when source is "config").
# Each name MUST end with _x86_64 or _aarch64.
# RPM packages per group are defined in functional_group_packages.yml
# (path from repo_status.yml → repo_manager.package_list).
functional_groups:
  # - name: "os_x86_64"
  - name: "slurm_node_x86_64"
  - name: "slurm_control_node_x86_64"
  # - name: "service_kube_control_plane_first_x86_64"
  # - name: "service_kube_control_plane_x86_64"
  # - name: "service_kube_node_x86_64"
  # - name: "login_node_x86_64"
  # - name: "login_compiler_node_x86_64"
  # - name: "os_aarch64"
  # - name: "slurm_node_aarch64"
  # - name: "login_node_aarch64"
  # - name: "login_compiler_node_aarch64"


# ---------------------------------------------------------------------------
# 5. ARM Build Host (aarch64)
# ---------------------------------------------------------------------------
# IP address of the ARM admin node for aarch64 image builds.
# Leave empty ("") to skip aarch64 builds entirely.
aarch64_inventory_host_ip: ""
aarch64_ssh_user: "root"
