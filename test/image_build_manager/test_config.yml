# =============================================================================
# Image Build Manager — Test Configuration
# =============================================================================
# Non-sensitive settings for FVT (Functional Verification Testing).
#
# Usage:
#   - Set oim_server_ip to the target server where image_build_manager runs.
#   - Leave oim_server_ip empty to run tests locally on the same machine.
#   - Configure sync options to push input files and local_repo output
#     to the target server before running tests.
#   - Sensitive credentials (SSH password) go in test_creds.yml
#     (auto-encrypted with Ansible Vault on first run).
# =============================================================================

---

# =============================================================================
# TARGET SERVER CONNECTION
# =============================================================================
# IP address of the server where image_build_manager playbook runs.
# Leave empty for local mode (running directly on the target server).
# Set to a remote IP to run all verification commands over SSH.
#
# When a remote IP is set, the framework will:
#   1. Sync the local project code to clone_path on the target (rsync)
#   2. Sync image_build input files to the env-var-based input path
#   3. Optionally sync repo_manager output to the target
#   4. Run all verification tests via SSH/Testinfra
oim_server_ip: ""

# SSH username for remote server (only needed for remote mode).
oim_ssh_user: root

# SSH port for remote server (only needed for remote mode).
oim_ssh_port: 22

# =============================================================================
# PROJECT SYNC SETTINGS (remote execution)
# =============================================================================
# The local omnia monorepo is synced (rsync) to clone_path on the target.
# Playbook runs from <clone_path>/src/image_build_manager/playbooks/
#
# clone_path:   Absolute path on the target where the project code is synced.
clone_path: "/root/omnia"

# =============================================================================
# DATASET CONFIGURATION
# =============================================================================
# The active dataset under test/image_build_manager/datasets/<dataset>/.
# Each dataset folder contains:
#   input/                            — Synced to <OMNIA_DATA_PATH>/image_build_manager/input/<project>/
#     image_build_config.yml          — Image build domain input file
#     image_build_credentials.yml     — Vault-encrypted credentials
#     package_groups.yml              — Functional group → RPM package mapping
#   repo_manager_output/              — Synced to repo_manager_output_dir (when sync_output: true)
#     repo_status.yml                 — RPM repo URLs, cert paths
#
# Available datasets:
#   data_set_01 — Offline/partial repo config (Pulp-based repos)
#   data_set_02 — Internet-connected repo config (direct RHEL CDN URLs)
#
# The dataset name selects the local folder under test/image_build_manager/datasets/.
dataset: "data_set_01"

# Project name on the target server.
# Must match OMNIA_PROJECT_NAME env var on the target (default: project_default).
# Input syncs to: <OMNIA_DATA_PATH>/image_build_manager/input/<project_name>/
# Output read from: <OMNIA_DATA_PATH>/image_build_manager/output/<project_name>/
project_name: "project_default"

# =============================================================================
# SYNC — REPO MANAGER OUTPUT
# =============================================================================
# When true, pushes repo_manager_output/ from the dataset to the target.
# Target path: repo_manager_output_dir from image_build_config.yml
# Default:     /opt/omnia/repo_manager/output/<project_name>/
#
# Only needed if the target does not already have repo_manager output.
sync_output: false

# =============================================================================
# SYNC — IMAGE BUILD INPUT
# =============================================================================
# When true, pushes the local dataset input/ files to the target server.
# Syncs: datasets/<dataset>/input/ -> <OMNIA_DATA_PATH>/image_build_manager/input/<project_name>/
#
# This ensures the target server has the correct image_build_config.yml
# and credentials before running the playbook.
sync_image_build_input: true

# =============================================================================
# REPORT CONFIGURATION
# =============================================================================
# Directory where test reports (JSON + HTML) are saved.
# Can be:
#   - A folder name (relative to test/): reports
#   - An absolute path: /var/reports/image_build
# No spaces allowed in the path.
report_path: /opt/omnia/reports

# Base name for report files (without extension).
# Generates: image_build_test_report.json, image_build_test_report.html
# No spaces allowed. Only letters, numbers, underscores, hyphens.
report_name: image_test_report

# Custom report ID (optional).
# When set, reports use this ID instead of a timestamp (YYYYMMDDHHmmSS).
# This groups multiple scenario runs under the same report entry.
# Leave empty to auto-generate from timestamp.
# No spaces allowed. Only letters, numbers, underscores, hyphens.
report_id: ""
