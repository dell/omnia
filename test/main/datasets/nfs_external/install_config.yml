# =============================================================================
# Dataset: NFS External
# =============================================================================
# Prefilled configuration for omnia.sh --install with an external NFS server.
#
# Use case:
#   External NFS server (outside OIM) created by the user. The NFS share
#   is mounted on the OIM server at the specified omnia_shared_path.
#   Recommended for production deployments with flat provisioning.
#
# To use this dataset:
#   Set "dataset: nfs_external" in test_config.yml
# =============================================================================

# --- Admin NIC IP ---
# Leave empty to use value from test_config.yml
admin_nic_ip: ""

# --- Storage Configuration ---
# Share option: NFS or Local
share_option: "NFS"

# NFS type: external or internal
nfs_type: "external"

# External NFS server IP address (set to your NFS server IP)
nfs_server_ip: ""

# External NFS server share path (exported path on the NFS server)
nfs_server_share_path: ""

# Local mount point on OIM where NFS share is mounted
omnia_shared_path: ""
