# =============================================================================
# Dataset: NFS Internal
# =============================================================================
# Prefilled configuration for omnia.sh --install with an internal NFS server.
#
# Use case:
#   NFS server created by the user on the OIM server itself. The NFS
#   export path is used directly as the omnia shared path — no mount
#   is performed.
#   Note: Internal NFS does not support HA OIM or hierarchical clusters.
#
# To use this dataset:
#   Set "dataset: nfs_internal" in test_config.yml
# =============================================================================

# --- Admin NIC IP ---
# Leave empty to use value from test_config.yml
admin_nic_ip: ""

# --- Storage Configuration ---
# Share option: NFS or Local
share_option: "NFS"

# NFS type: external or internal
nfs_type: "internal"

# OIM server IP (same as the local machine for internal NFS)
nfs_server_ip: ""

# NFS server share path (exported path on the OIM itself)
nfs_server_share_path: ""

# Omnia shared path (same as nfs_server_share_path for internal NFS)
omnia_shared_path: ""
