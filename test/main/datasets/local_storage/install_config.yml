# =============================================================================
# Dataset: Local Storage
# =============================================================================
# Prefilled configuration for omnia.sh --install with local disk storage.
#
# Use case:
#   Disk storage in the OIM server. The omnia shared path is a local
#   directory that must be created by the user before running omnia.sh.
#   Used only for flat provisioning setups.
#
# To use this dataset:
#   Set "dataset: local_storage" in test_config.yml
# =============================================================================

# --- Admin NIC IP ---
# Leave empty to use value from test_config.yml
admin_nic_ip: ""

# --- Storage Configuration ---
# Share option: NFS or Local
share_option: "Local"

# NFS type: not applicable for local storage
nfs_type: ""

# NFS server IP: not applicable for local storage
nfs_server_ip: ""

# NFS server share path: not applicable for local storage
nfs_server_share_path: ""

# Local directory on OIM for Omnia shared path
omnia_shared_path: ""
