# =============================================================================
# Test Run Configuration — Main Module
# =============================================================================
#
# Configure which scenarios to run, the command, suite, marker, and run order.
#
# Usage:
#   1. Edit this file to enable/disable scenarios
#   2. Run: run_validation --config
#
# -----------------------------------------------------------------------------
# Scenario definitions
# -----------------------------------------------------------------------------
# Each scenario has:
#   order:   <int>                   - Execution order (ascending). Order
#                                      values MUST be unique across enabled
#                                      scenarios; duplicate order values are
#                                      a configuration error and the batch
#                                      run fails. Values need not be
#                                      contiguous (e.g. 1 3 7 is valid).
#   run:     true/false              - Whether to execute this scenario
#   command: deploy/verify/test      - What to run
#            (deploy=test_deploy.py, verify=all except deploy, test=both)
#   suite:   container/security/...  - Folder filter (empty = all folders)
#   marker:  <pytest marker expr>    - Marker filter (empty = no filter)
#
# Scenarios execute in ascending "order" value, not listing order.
# =============================================================================

scenarios:

  # --- Install & Setup ---
  omnia_sh_install:
    order: 1
    run: true
    command: "test"
    suite: ""
    marker: ""

  # --- Reinstall (overwrite) ---
  omnia_sh_reinstall:
    order: 2
    run: true
    command: "test"
    suite: ""
    marker: ""

  # --- Uninstall & Cleanup ---
  omnia_sh_uninstall:
    order: 3
    run: true
    command: "test"
    suite: ""
    marker: ""
