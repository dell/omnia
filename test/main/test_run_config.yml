# =============================================================================
# Test Run Configuration — Omnia Main
# =============================================================================
# Entries execute in YAML order through omnia_auto.ValidationRunner.
# Use ./run_validation.sh --config after selecting the required entries.
#
# command: exec | verify | test
# marker:  sanity | functional | regression, or a supported expression
# suite:   optional subdirectory under the scenario folder
# =============================================================================

---

fvt_main:
  setup:
    run: false
    command: "test"
    suite: ""
    marker: "sanity"
  init:
    run: false
    command: "test"
    suite: ""
    marker: "sanity"
  precheck:
    run: false
    command: "exec"
    suite: ""
    marker: "sanity"
  validate:
    run: false
    command: "exec"
    suite: ""
    marker: "sanity"
  cli:
    run: false
    command: "verify"
    suite: ""
    marker: "sanity"
  omnia_cli:
    run: false
    command: "verify"
    suite: ""
    marker: "sanity"
  cleanup:
    run: false
    command: "exec"
    suite: ""
    marker: "cleanup"

nft_main:
  run: false
  command: "test"
  marker: ""
