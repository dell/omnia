[pytest]
# Main module pytest configuration
# Overrides top-level pytest.ini when running from this directory
testpaths = fvt
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ---------------------------------------------------------------------------
# Validation Markers (IEEE 829 / SDD aligned)
#
# These are TEST QUALITY markers — they indicate the validation category
# of the test, NOT the action being performed.  Actions like deploy,
# verify, reinstall are handled as CLI commands by run_validation.sh.
#
# Naming convention:
#   @pytest.mark.<marker>   on every test function
#   --marker <marker>       CLI filter via run_validation
# ---------------------------------------------------------------------------
markers =
    sanity: Baseline verification after deployment (must-pass gate)
    smoke: Minimal critical-path subset (< 2 min, CI gate)
    regression: Full regression coverage (all functional areas)
    functional: Feature-level functional verification
    negative: Invalid input, error handling, boundary conditions
    security: Authentication, authorization, credential tests
    performance: Timing, throughput, resource usage benchmarks
    stress: Sustained load, concurrency, resource exhaustion
    integration: Cross-component interaction verification
    acceptance: End-to-end user acceptance criteria
